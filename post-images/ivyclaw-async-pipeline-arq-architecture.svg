<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="ivyclaw-async-arq-title ivyclaw-async-arq-desc">
  <title id="ivyclaw-async-arq-title">IvyClaw 异步任务解耦与多渠道统一接入架构</title>
  <desc id="ivyclaw-async-arq-desc">展示多渠道流量经InboundMessage契约归一化，通过Redis任务队列与ARQ Worker集群异步解耦驱动Dispatcher的完整流转</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 4; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow5-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="420" class="bg" />

  <!-- 4 Columns Flow: Channels -> Message Contract -> ARQ Queue -> Dispatcher &amp; Callback -->
  <!-- Col 1: Channels (x=40, y=50, w=190, h=320) -->
  <g transform="translate(40, 50)">
    <rect width="190" height="320" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 40 L 0 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="25" class="text-title">1. 多信道接入</text>

    <g transform="translate(12, 52)">
      <rect width="166" height="54" class="pill" />
      <text x="8" y="20" class="text-subtitle">CLI 调试终端</text>
      <text x="8" y="38" class="text-muted">开发环境直接触发</text>
    </g>

    <g transform="translate(12, 116)">
      <rect width="166" height="54" class="pill" />
      <text x="8" y="20" class="text-subtitle">FastAPI /jobs 接口</text>
      <text x="8" y="38" class="text-muted">通用 HTTP Web API</text>
    </g>

    <g transform="translate(12, 180)">
      <rect width="166" height="66" class="pill" />
      <text x="8" y="20" class="text-subtitle">飞书 WS 长连接</text>
      <text x="8" y="38" class="text-muted">双工客户端长连接</text>
      <text x="8" y="52" class="text-muted">免公网 IP 与穿透维护</text>
    </g>

    <g transform="translate(12, 256)">
      <rect width="166" height="50" class="pill" />
      <text x="8" y="20" class="text-subtitle">通用 Webhook</text>
      <text x="8" y="36" class="text-muted">GitLab / GitHub 事件</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="230" y1="210" x2="258" y2="210" class="line" marker-end="url(#arrow5)" />

  <!-- Col 2: Inbound Message Contract (x=260, y=50, w=200, h=320) -->
  <g transform="translate(260, 50)">
    <rect width="200" height="320" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 40 L 0 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="25" class="text-title">2. InboundMessage 契约</text>

    <g transform="translate(12, 52)">
      <rect width="176" height="130" class="pill" />
      <text x="10" y="20" class="text-subtitle">归一化数据模型</text>
      <text x="10" y="40" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">channel: "feishu"</text>
      <text x="10" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">user_id: "usr_94a2"</text>
      <text x="10" y="76" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">conversation_id: "..."</text>
      <text x="10" y="94" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">text: "修复重构bug"</text>
      <text x="10" y="114" class="text-muted">slots=True 极致内存占用</text>
    </g>

    <g transform="translate(12, 194)">
      <rect width="176" height="112" class="pill" />
      <text x="10" y="20" class="text-subtitle">通道解耦收益</text>
      <text x="10" y="38" class="text-muted">• 调度器面向抽象编程</text>
      <text x="10" y="56" class="text-muted">• 新增 Slack/钉钉仅需编写几十行适配器</text>
      <text x="10" y="80" class="text-muted">• 业务与物理协议隔离</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="460" y1="210" x2="488" y2="210" class="line" marker-end="url(#arrow5)" />

  <!-- Col 3: ARQ Async Queue (x=490, y=50, w=210, h=320) - Focal -->
  <g transform="translate(490, 50)">
    <rect width="210" height="320" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 202 0 Q 210 0 210 8 L 210 40 L 0 40 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="12" y="25" class="text-focal-title">3. ARQ 异步中枢</text>

    <g transform="translate(12, 52)">
      <rect width="186" height="74" class="focal-pill" />
      <text x="10" y="20" class="text-subtitle" fill="#bf4520">Redis 任务队列</text>
      <text x="10" y="38" class="text-body">• enqueued_at 记录入队戳</text>
      <text x="10" y="54" class="text-body">• 任务饱和度削峰填谷</text>
    </g>

    <g transform="translate(12, 136)">
      <rect width="186" height="84" class="focal-pill" />
      <text x="10" y="20" class="text-subtitle" fill="#bf4520">ARQ Worker 并发池</text>
      <text x="10" y="38" class="text-body">• 多进程异步消费处理</text>
      <text x="10" y="54" class="text-body">• 隔离长耗时测试运行</text>
      <text x="10" y="70" class="text-body">• 支持分布式水平横向扩容</text>
    </g>

    <g transform="translate(12, 230)">
      <rect width="186" height="76" class="pill" />
      <text x="10" y="20" class="text-subtitle">消灭 504 网关超时</text>
      <text x="10" y="38" class="text-muted">复杂任务运行数分钟不受 HTTP 连接中断影响</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="700" y1="210" x2="728" y2="210" class="focal-line" marker-end="url(#arrow5-focal)" />

  <!-- Col 4: Execution &amp; Callback (x=730, y=50, w=190, h=320) -->
  <g transform="translate(730, 50)">
    <rect width="190" height="320" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 40 L 0 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="25" class="text-title">4. 运行时与回调</text>

    <g transform="translate(12, 52)">
      <rect width="166" height="66" class="pill" />
      <text x="8" y="20" class="text-subtitle">Dispatcher 研发闭环</text>
      <text x="8" y="38" class="text-muted">驱动 5 阶多代理流转</text>
      <text x="8" y="52" class="text-muted">PostgreSQL 会话快照</text>
    </g>

    <g transform="translate(12, 128)">
      <rect width="166" height="84" class="pill" />
      <text x="8" y="20" class="text-subtitle">Human-in-the-Loop</text>
      <text x="8" y="38" class="text-muted">高危工具抛出 Interrupt</text>
      <text x="8" y="54" class="text-muted">审批人点击批准</text>
      <text x="8" y="70" class="text-muted">Command(resume) 恢复</text>
    </g>

    <g transform="translate(12, 222)">
      <rect width="166" height="84" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="8" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#166534">主动结果回调</text>
      <text x="8" y="36" class="text-body">• 飞书 WS 推送群卡片</text>
      <text x="8" y="52" class="text-body">• Web API 轮询返回</text>
      <text x="8" y="68" class="text-body">• 完整研发报告交付</text>
    </g>
  </g>
</svg>