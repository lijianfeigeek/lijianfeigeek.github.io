<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="googlebot-search-pipeline-title googlebot-search-pipeline-desc" id="googlebot-search-pipeline-root">
        <title id="googlebot-search-pipeline-title">搜索引擎全链路管线：抓取、渲染与索引分发机制</title>
        <desc id="googlebot-search-pipeline-desc">Googlebot 从发现提取、Web 渲染服务 (WRS) 语义解析到编入倒排索引并分发排序的全生命周期</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #googlebot-search-pipeline-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #googlebot-search-pipeline-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #googlebot-search-pipeline-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="googlebot-search-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="googlebot-search-pipeline-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="googlebot-search-pipeline-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <g transform="translate(40, 40)">
          <rect x="0" y="0" width="260" height="260" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STAGE 01 · 发现与提取</text>
          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">Googlebot 爬虫抓取</text>
            <text x="0" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 遍历 Sitemap.xml 与外链源</text>
            <text x="0" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 依据 Robots.txt 检查抓取配额</text>
            <text x="0" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 提取原始 HTML 与静态静态资源</text>
            <text x="0" y="104" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 优先抓取移动端 DOM 树</text>
            <text x="0" y="132" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">输出：待渲染原始网页队列</text>
          </g>
        </g>

        <g transform="translate(350, 40)">
          <rect x="0" y="0" width="260" height="260" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="260" height="32" rx="8" fill="#bf4520" fill-opacity="0.08"/>
          <text x="14" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STAGE 02 · 解析与渲染 (FOCAL)</text>
          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#bf4520" font-family="'Geist', sans-serif" font-size="14" font-weight="600">WRS 渲染引擎与评估</text>
            <text x="0" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Web Rendering Service (WRS)</text>
            <text x="0" y="66" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">· 执行 JS 脚本，还原真实首屏</text>
            <text x="0" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">· 提取 Schema JSON-LD 结构化数据</text>
            <text x="0" y="106" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">· 评估内容独创性与搜索意图履约</text>
            <text x="0" y="132" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">核心考核：页面体验与增益价值</text>
          </g>
        </g>

        <g transform="translate(660, 40)">
          <rect x="0" y="0" width="260" height="260" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STAGE 03 · 索引与分发</text>
          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">倒排索引与 SERP 排序</text>
            <text x="0" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 编入 Google 核心全球索引库</text>
            <text x="0" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 结合用户地理位置匹配意图</text>
            <text x="0" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 动态计算 RankBrain 与外链权重</text>
            <text x="0" y="104" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 毫秒级返回 SERP 搜索结果页</text>
            <text x="0" y="132" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">终局：赢得自然搜索流量</text>
          </g>
        </g>

        <path d="M 300 170 L 342 170" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#googlebot-search-pipeline-arrow-accent)"/>
        <path d="M 610 170 L 652 170" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#googlebot-search-pipeline-arrow-link)"/>
      </svg>
