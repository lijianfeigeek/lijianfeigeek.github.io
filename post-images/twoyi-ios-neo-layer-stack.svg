<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="twoyi-layer-title twoyi-layer-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="twoyi-layer-title">Twoyi for iOS 四层无 JIT 运行时堆栈架构</title>
  <desc id="twoyi-layer-desc">展示 Twoyi iOS 版如何在不越狱、不启用 JIT 的前提下，通过 EROFS、用户态虚拟内核、2852 单元静态 AOT 与 Darwin 宿主层运行完整的 Android 13。</desc>
  <defs>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 9 L 5 1 L 9 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 5 9 L 9 1 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">Twoyi for iOS (v1.1.0_932) 四层无 JIT 虚拟化堆栈</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">ANDROID-13.0.0_R84 (4KB GUEST) ON DARWIN / APPLE SILICON (16KB HOST)</text>
    <text x="860" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: LAYER STACK</text>
  </g>

  <!-- Left margin vertical direction indicators -->
  <g transform="translate(40, 104)">
    <line x1="16" y1="20" x2="16" y2="210" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-up)"/>
    <text x="28" y="116" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600">ABSTRACTION</text>
    <line x1="16" y1="260" x2="16" y2="452" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arrow-down)"/>
    <text x="28" y="360" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">SYSCALL ABI</text>
  </g>

  <!-- L4: Guest Android 13 User Space -->
  <g transform="translate(148, 104)">
    <rect x="0" y="0" width="772" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L4</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">Android 13 Guest 用户空间与只读镜像</text>
    <text x="76" y="54" font-size="12" fill="#334155">TwoyiLauncher · 64 位第三方 APK · ART 虚拟机 · system.erofs (1.04 GiB 零解压挂载)</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">2,593 manifest entries · mkfs.erofs -b 4096 --dsunit=4 · boot_overlay=true</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" font-weight="600" text-anchor="end">~3s COLD BOOT</text>
  </g>

  <!-- L3: Virtual Kernel & HAL Boundary -->
  <g transform="translate(148, 212)">
    <rect x="0" y="0" width="772" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L3</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">虚拟内核接口与硬件抽象层边界 (Zero Hardware Emulation)</text>
    <text x="76" y="54" font-size="12" fill="#334155">用户态 dev/vbinder IPC · /dev/__properties__ 共享内存树 · 48-bit 虚拟 VMA 映射</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">hw/camera · hw/audio · hw/sensors · gnss@2.1 · vibrator · dev/twoyi-display</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">LINUX AARCH64 ABI</text>
  </g>

  <!-- L2: Neo Dual-Tier Execution Engine (CORAL FOCAL LAYER) -->
  <g transform="translate(148, 320)">
    <rect x="0" y="0" width="772" height="156" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c" text-anchor="middle">L2</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">Neo 双轨无 JIT 执行引擎 (核心突破层)</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" font-weight="700" text-anchor="end">FOCAL · ZERO JIT</text>

    <!-- Sub-card Left: Static AOT -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="444" height="92" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#be123c">轨道 A · 构建期静态 AOT 直编 (系统白名单)</text>
      <text x="16" y="46" font-size="11" fill="#334155">预翻译 AOSP ART / services.odex / 系统 ELF 至 Mach-O __TEXT</text>
      <text x="16" y="66" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">2,852 C++/ASM 单元 · -O3 · [[clang::musttail]] 尾调用链</text>
      <text x="16" y="82" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">__TEXT 体积: 403.17 MB · -frounding-math -ffp-contract=off</text>
    </g>

    <!-- Sub-card Right: Blocks/Step Interpreter -->
    <g transform="translate(476, 48)">
      <rect x="0" y="0" width="280" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#0f172a">轨道 B · 预解码块解释器</text>
      <text x="16" y="46" font-size="11" fill="#334155">承接未进白名单的第三方 APK .so</text>
      <text x="16" y="66" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">blocks / step · 256 L1 / 4096 slots</text>
      <text x="16" y="82" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">256 MiB 共享解码表 · QSBR DataTLB</text>
    </g>
  </g>

  <!-- L1: Darwin / XNU Host Substrate -->
  <g transform="translate(148, 492)">
    <rect x="0" y="0" width="772" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L1</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">Darwin / XNU 宿主沙盒基座 (Apple Signed)</text>
    <text x="76" y="54" font-size="12" fill="#334155">POSIX / kqueue / pthread 优先级继承适配 · Metal / AVFoundation / CoreLocation / CoreMotion</text>
    <text x="76" y="72" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">4KB Guest Page → 16KB Apple Silicon Host Page 映射 · MinimumOSVersion 15.0</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600" text-anchor="end">APP SANDBOX</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 604)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <rect x="76" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="24" font-size="11" fill="#334155">核心突破层 (2,852 单元静态 AOT)</text>
    <rect x="316" y="13" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="338" y="24" font-size="11" fill="#334155">Android 13 客户态层</text>
    <rect x="500" y="13" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="522" y="24" font-size="11" fill="#334155">iOS 宿主沙盒基座</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">EVIDENCE: runtime-build.json &amp; baseline.lock.json</text>
  </g>
</svg>