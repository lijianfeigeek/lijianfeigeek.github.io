<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futu-tiger-court-tro-to-pi-reversal-sequence-title futu-tiger-court-tro-to-pi-reversal-sequence-desc">
  <title id="futu-tiger-court-tro-to-pi-reversal-sequence-title">纽约南区联邦法院：从紧急临时限制令（TRO）到初步禁令被拒时序</title>
  <desc id="futu-tiger-court-tro-to-pi-reversal-sequence-desc">时序展示做市商申请单方紧急冻结、被告聘请顶尖律师抗辩，以及法院因胜诉可能性与不可逆损害要件缺失依法解除禁令的过程</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #047857; }
    </style>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">纽约南区联邦法院：从紧急临时限制令 (TRO) 到初步禁令被拒司法时序</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">程序正义回归：TRO 仅为应急保全，正式初步禁令（PI）必须经受严苛证据审查</text>

  <!-- Lifelines -->
  <g transform="translate(130, 80)">
    <rect width="160" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="20" class="actor-title" text-anchor="middle">原告做市商 (SIG/Citadel)</text>
    <line x1="80" y1="32" x2="80" y2="255" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(400, 80)">
    <rect width="160" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="20" class="actor-title" text-anchor="middle">纽约南区联邦法院 (SDNY)</text>
    <line x1="80" y1="32" x2="80" y2="255" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(670, 80)">
    <rect width="160" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="20" class="actor-title" text-anchor="middle">被告离岸交易者账户</text>
    <line x1="80" y1="32" x2="80" y2="255" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Event 1: TRO -->
  <g transform="translate(0, 130)">
    <line x1="210" y1="0" x2="475" y2="0" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="475,-4 485,0 475,4" fill="#0284c7"/>
    <rect x="230" y="-12" width="230" height="22" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="345" y="3" class="text-sub" fill="#0369a1" text-anchor="middle">提交异常交易数据，单方紧急申请 TRO</text>
  </g>

  <!-- Event 2: TRO Granted -->
  <g transform="translate(0, 160)">
    <line x1="480" y1="0" x2="745" y2="0" stroke="#f87171" stroke-width="1.5"/>
    <polygon points="745,-4 755,0 745,4" fill="#f87171"/>
    <rect x="495" y="-12" width="240" height="22" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="615" y="3" class="text-sub" fill="#b91c1c" text-anchor="middle">【签发 TRO】紧急封冻近 1 亿美元资产</text>
  </g>

  <!-- Event 3: PI Hearing &amp; Defense -->
  <g transform="translate(0, 200)">
    <line x1="750" y1="0" x2="485" y2="0" stroke="#047857" stroke-width="1.5"/>
    <polygon points="485,-4 475,0 485,4" fill="#047857"/>
    <rect x="500" y="-12" width="230" height="22" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="615" y="3" class="badge-ok" text-anchor="middle">聘请顶尖律师应诉，呈报真实资产底稿</text>
  </g>

  <!-- Event 4: Inquiry -->
  <g transform="translate(0, 235)">
    <line x1="480" y1="0" x2="215" y2="0" stroke="#bf4520" stroke-width="1.5"/>
    <polygon points="215,-4 205,0 215,4" fill="#bf4520"/>
    <rect x="235" y="-12" width="230" height="22" rx="4" fill="#ffedd5" stroke="#fdba74" stroke-width="1"/>
    <text x="350" y="3" class="badge-coral" text-anchor="middle">法庭质询：不可逆损害与泄密源在哪里？</text>
  </g>

  <!-- Event 5: PI Denied (Focal Green Box) -->
  <g transform="translate(0, 280)">
    <rect x="140" y="0" width="680" height="48" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect x="140" y="0" width="680" height="22" rx="8" fill="#d1fae5"/>
    <text x="480" y="15" class="badge-ok" text-anchor="middle">【9 月正式裁定】驳回初步禁令申请（PI Denied）并依法全面解冻资产！</text>
    <text x="480" y="36" class="text-sub" text-anchor="middle">原告做市商在“实体胜诉可能性”与“不可弥补之损害”两大支柱上全面塌陷，大范围财产保全彻底失效</text>
  </g>
</svg>