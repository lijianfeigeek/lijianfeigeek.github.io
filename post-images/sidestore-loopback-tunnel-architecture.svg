<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrowGray_ss" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowBlue_ss" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowCoral_ss" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrowGreen_ss" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="680" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="632" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0369a1" font-size="11" font-weight="700" letter-spacing="1">STANDALONE SIDELOADING ARCHITECTURE</text>
    <text x="0" y="52" fill="#0f172a" font-size="22" font-weight="700">SideStore 核心架构：WireGuard 本地环回与沙盒穿透物理学</text>
    <text x="0" y="74" fill="#475569" font-size="13">解密 iOS 用户态沙盒内如何借助 minimuxer 模拟 usbmuxd、结合配对凭证与本地 VPN 实现免电脑脱机自签续期</text>
  </g>

  <!-- Container Box 1: SideStore Sandbox Realm (Left) -->
  <g transform="translate(56, 150)">
    <rect width="320" height="470" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="16" y="14" width="288" height="28" rx="6" fill="#f1f5f9" />
    <text x="28" y="32" fill="#0f172a" font-size="12" font-weight="700">1. 用户态沙盒容器 (SideStore App)</text>

    <!-- Sub Card 1.1 -->
    <g transform="translate(16, 56)">
      <rect width="288" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="24" fill="#0284c7" font-size="12" font-weight="700">SideStore 核心调度与签名</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 管理应用生命周期与 7 天到期倒计时</text>
      <text x="16" y="66" fill="#334155" font-size="11">· ALTCrypto 模块执行端侧本地 SHA-256 签名</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 动态重组 Provisioning Profile 与权限元数据</text>
    </g>

    <!-- Sub Card 1.2 -->
    <g transform="translate(16, 180)">
      <rect width="288" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="24" fill="#0284c7" font-size="12" font-weight="700">minimuxer 沙盒守护器 (Rust)</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 纯用户态内嵌编译，无 root 依赖</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 完整模拟 macOS/Windows 原生 usbmuxd 协议</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 负责本端与系统 lockdown 握手与端口复用</text>
      <text x="16" y="106" fill="#334155" font-size="11">· 解除 AltServer 对外接 PC 同 Wi-Fi 的硬性捆绑</text>
    </g>

    <!-- Sub Card 1.3 -->
    <g transform="translate(16, 314)">
      <rect width="288" height="136" rx="8" fill="#f8fafc" stroke="#fecdd3" stroke-width="1" />
      <text x="16" y="24" fill="#e11d48" font-size="12" font-weight="700">配对金库与证书凭证</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 装载 .mobiledevicepairing 配对记录文件</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 包含 DeviceCertificate / HostCertificate</text>
      <text x="16" y="86" fill="#334155" font-size="11">· RootPrivateKey 本地持久化私钥保管</text>
      <text x="16" y="106" fill="#334155" font-size="11">· 仅初次安装需电脑配对一次，后续永久离线</text>
      <text x="16" y="124" fill="#64748b" font-size="10">注：配对文件损坏将直接导致 Broken Pipe 错误</text>
    </g>
  </g>

  <!-- Container Box 2: Loopback Tunnel Layer (Middle) -->
  <g transform="translate(396, 150)">
    <rect width="308" height="470" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="16" y="14" width="276" height="28" rx="6" fill="#f1f5f9" />
    <text x="28" y="32" fill="#0f172a" font-size="12" font-weight="700">2. 本地环回虚拟隧道 (Loopback)</text>

    <!-- Sub Card 2.1 -->
    <g transform="translate(16, 56)">
      <rect width="276" height="126" rx="8" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1" />
      <text x="16" y="24" fill="#059669" font-size="12" font-weight="700">WireGuard / LocalDevVPN</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 创建沙盒虚拟网卡接口 (utunX)</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 分配虚拟网段 IP (10.7.0.1 / 10.7.0.2)</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 规避 iOS 对沙盒直连 127.0.0.1 阻断规则</text>
      <text x="16" y="106" fill="#334155" font-size="11">· 截获 SideStore 向外部发起的续签请求</text>
    </g>

    <!-- Sub Card 2.2 -->
    <g transform="translate(16, 196)">
      <rect width="276" height="126" rx="8" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1" />
      <text x="16" y="24" fill="#059669" font-size="12" font-weight="700">em_proxy 本地流量掉头交换</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 劫持 10.7.0.1:62078 流量并解包</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 欺骗内核网络栈，实现伪装外网通信</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 原路将数据包掉头路由至本机 lockdownd</text>
      <text x="16" y="106" fill="#334155" font-size="11">· 建立零外网暴露的高速双向流管道</text>
    </g>

    <!-- Sub Card 2.3 -->
    <g transform="translate(16, 336)">
      <rect width="276" height="114" rx="8" fill="#f8fafc" stroke="#bae6fd" stroke-width="1" />
      <text x="16" y="24" fill="#0284c7" font-size="12" font-weight="700">快捷指令与后台自动化</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 系统级 Shortcuts 周期触发续签动作</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 自动连通 VPN 并在后台无感刷新</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 刷新成功后自动断开 VPN 释放能耗</text>
      <text x="16" y="104" fill="#64748b" font-size="10">彻底消灭 7 天忘签导致证书失效的尴尬</text>
    </g>
  </g>

  <!-- Container Box 3: iOS Daemon &amp; Cloud Auth (Right) -->
  <g transform="translate(724, 150)">
    <rect width="320" height="470" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="16" y="14" width="288" height="28" rx="6" fill="#f1f5f9" />
    <text x="28" y="32" fill="#0f172a" font-size="12" font-weight="700">3. iOS 系统特权服务与鉴权中继</text>

    <!-- Sub Card 3.1 -->
    <g transform="translate(16, 56)">
      <rect width="288" height="116" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="24" fill="#0284c7" font-size="12" font-weight="700">lockdownd 核心配对守护</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 监听本地私有服务端口 (Port 62078)</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 校验来自 minimuxer 的配对 SSL 凭据</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 颁发特权服务会话会话句柄</text>
      <text x="16" y="106" fill="#334155" font-size="11">· 将受控权移交给 mobile_installation</text>
    </g>

    <!-- Sub Card 3.2 -->
    <g transform="translate(16, 186)">
      <rect width="288" height="116" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="24" fill="#0284c7" font-size="12" font-weight="700">mobile_installation / misagent</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 接受重签名后的全新描述文件</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 校验证书链是否属于有效开发者账号</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 重刷系统签名缓存，更新过期倒计时</text>
      <text x="16" y="104" fill="#e11d48" font-size="10">硬约束：每个账号最多仅支持激活 3 个独立槽位</text>
    </g>

    <!-- Sub Card 3.3 -->
    <g transform="translate(16, 316)">
      <rect width="288" height="134" rx="8" fill="#f8fafc" stroke="#fde68a" stroke-width="1" />
      <text x="16" y="24" fill="#d97706" font-size="12" font-weight="700">Anisette 远程鉴权服务器</text>
      <text x="16" y="46" fill="#334155" font-size="11">· 解决纯 iOS 端无法提取底层 adi.pb 难题</text>
      <text x="16" y="66" fill="#334155" font-size="11">· 模拟真实 Mac 设备的 GrandSlam 认证头</text>
      <text x="16" y="86" fill="#334155" font-size="11">· 向 Apple Developer API 申请 7 天证书</text>
      <text x="16" y="106" fill="#334155" font-size="11">· 支持自建 Docker 实例，彻底避免账号风控</text>
      <text x="16" y="124" fill="#64748b" font-size="10">公共服务器过载会导致登录报 2FA 异常或验证死锁</text>
    </g>
  </g>

  <!-- Flow Connectors -->
  <!-- Wire 1: SideStore to Loopback Tunnel -->
  <path d="M 376 220 L 412 220" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue_ss)" />
  <!-- Wire 2: Loopback to Lockdownd -->
  <path d="M 704 220 L 740 220" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen_ss)" />
  <!-- Wire 3: Minimuxer to em_proxy -->
  <path d="M 376 340 L 412 340" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue_ss)" />
  <!-- Wire 4: em_proxy to mobile_installation -->
  <path d="M 704 340 L 740 340" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen_ss)" />
  <!-- Wire 5: SideStore to Anisette (Bottom flow) -->
  <path d="M 376 490 L 740 490" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrowGray_ss)" />
</svg>