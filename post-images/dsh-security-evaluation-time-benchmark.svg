<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-security-evaluation-time-benchmark-title dsh-security-evaluation-time-benchmark-desc" id="dsh-security-evaluation-time-benchmark-root">
      <title id="dsh-security-evaluation-time-benchmark-title">安全评测流水线各阶段耗时对比：传统人工 vs DSH 软工作流</title>
      <desc id="dsh-security-evaluation-time-benchmark-desc">传统人工评测在各阶段耗时 30~55 分钟，而 DSH 软工作流将其压缩至 2~8 分钟的基准实测数据</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dsh-security-evaluation-time-benchmark-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #dsh-security-evaluation-time-benchmark-root text { font-family: "Geist", -apple-system, sans-serif; }
      #dsh-security-evaluation-time-benchmark-root .mono { font-family: "Geist Mono", monospace; }
      #dsh-security-evaluation-time-benchmark-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="dsh-security-evaluation-time-benchmark-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="dsh-security-evaluation-time-benchmark-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="dsh-security-evaluation-time-benchmark-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Legend -->
        <g transform="translate(680, 20)">
          <rect x="0" y="0" width="14" height="14" rx="2" fill="#2d3142" fill-opacity="0.3"/>
          <text x="22" y="12" font-size="12" fill="#2d3142">传统人工模式 (分钟)</text>
          <rect x="150" y="0" width="14" height="14" rx="2" fill="#bf4520"/>
          <text x="172" y="12" font-size="12" font-weight="600" fill="#bf4520">DSH 软工作流 (分钟)</text>
        </g>

        <!-- Y Axis Guidelines (0 to 60 mins) -->
        <g transform="translate(80, 50)">
          <line x1="0" y1="200" x2="840" y2="200" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="-15" y="204" font-size="11" fill="#2d3142" text-anchor="end" fill-opacity="0.6">0m</text>

          <line x1="0" y1="150" x2="840" y2="150" stroke="#2d3142" stroke-dasharray="3 3" stroke-opacity="0.08"/>
          <text x="-15" y="154" font-size="11" fill="#2d3142" text-anchor="end" fill-opacity="0.6">15m</text>

          <line x1="0" y1="100" x2="840" y2="100" stroke="#2d3142" stroke-dasharray="3 3" stroke-opacity="0.08"/>
          <text x="-15" y="104" font-size="11" fill="#2d3142" text-anchor="end" fill-opacity="0.6">30m</text>

          <line x1="0" y1="50" x2="840" y2="50" stroke="#2d3142" stroke-dasharray="3 3" stroke-opacity="0.08"/>
          <text x="-15" y="54" font-size="11" fill="#2d3142" text-anchor="end" fill-opacity="0.6">45m</text>

          <line x1="0" y1="0" x2="840" y2="0" stroke="#2d3142" stroke-dasharray="3 3" stroke-opacity="0.08"/>
          <text x="-15" y="4" font-size="11" fill="#2d3142" text-anchor="end" fill-opacity="0.6">60m</text>

          <!-- Group 1: 环境准备 (Manual: 45m, DSH: 3m) -->
          <g transform="translate(40, 0)">
            <rect x="0" y="50" width="36" height="150" rx="3" fill="#2d3142" fill-opacity="0.2"/>
            <text x="18" y="42" font-size="11" fill="#2d3142" text-anchor="middle">45</text>
            <rect x="42" y="190" width="36" height="10" rx="3" fill="#bf4520"/>
            <text x="60" y="184" font-size="11" font-weight="700" fill="#bf4520" text-anchor="middle">3</text>
            <text x="39" y="222" font-size="12" font-weight="500" fill="#2d3142" text-anchor="middle">环境准备</text>
          </g>

          <!-- Group 2: 探针注入 (Manual: 55m, DSH: 6m) -->
          <g transform="translate(180, 0)">
            <rect x="0" y="16.6" width="36" height="183.4" rx="3" fill="#2d3142" fill-opacity="0.2"/>
            <text x="18" y="10" font-size="11" fill="#2d3142" text-anchor="middle">55</text>
            <rect x="42" y="180" width="36" height="20" rx="3" fill="#bf4520"/>
            <text x="60" y="174" font-size="11" font-weight="700" fill="#bf4520" text-anchor="middle">6</text>
            <text x="39" y="222" font-size="12" font-weight="500" fill="#2d3142" text-anchor="middle">探针注入</text>
          </g>

          <!-- Group 3: 模式提取 (Manual: 40m, DSH: 4m) -->
          <g transform="translate(320, 0)">
            <rect x="0" y="66.6" width="36" height="133.4" rx="3" fill="#2d3142" fill-opacity="0.2"/>
            <text x="18" y="58" font-size="11" fill="#2d3142" text-anchor="middle">40</text>
            <rect x="42" y="186.6" width="36" height="13.4" rx="3" fill="#bf4520"/>
            <text x="60" y="180" font-size="11" font-weight="700" fill="#bf4520" text-anchor="middle">4</text>
            <text x="39" y="222" font-size="12" font-weight="500" fill="#2d3142" text-anchor="middle">模式提取</text>
          </g>

          <!-- Group 4: 动态变异 (Manual: 50m, DSH: 8m) -->
          <g transform="translate(460, 0)">
            <rect x="0" y="33.3" width="36" height="166.7" rx="3" fill="#2d3142" fill-opacity="0.2"/>
            <text x="18" y="25" font-size="11" fill="#2d3142" text-anchor="middle">50</text>
            <rect x="42" y="173.3" width="36" height="26.7" rx="3" fill="#bf4520"/>
            <text x="60" y="167" font-size="11" font-weight="700" fill="#bf4520" text-anchor="middle">8</text>
            <text x="39" y="222" font-size="12" font-weight="500" fill="#2d3142" text-anchor="middle">动态变异</text>
          </g>

          <!-- Group 5: 接口验证 (Manual: 35m, DSH: 5m) -->
          <g transform="translate(600, 0)">
            <rect x="0" y="83.3" width="36" height="116.7" rx="3" fill="#2d3142" fill-opacity="0.2"/>
            <text x="18" y="75" font-size="11" fill="#2d3142" text-anchor="middle">35</text>
            <rect x="42" y="183.3" width="36" height="16.7" rx="3" fill="#bf4520"/>
            <text x="60" y="177" font-size="11" font-weight="700" fill="#bf4520" text-anchor="middle">5</text>
            <text x="39" y="222" font-size="12" font-weight="500" fill="#2d3142" text-anchor="middle">接口验证</text>
          </g>

          <!-- Group 6: 研报归档 (Manual: 30m, DSH: 2m) -->
          <g transform="translate(740, 0)">
            <rect x="0" y="100" width="36" height="100" rx="3" fill="#2d3142" fill-opacity="0.2"/>
            <text x="18" y="92" font-size="11" fill="#2d3142" text-anchor="middle">30</text>
            <rect x="42" y="193.3" width="36" height="6.7" rx="3" fill="#bf4520"/>
            <text x="60" y="187" font-size="11" font-weight="700" fill="#bf4520" text-anchor="middle">2</text>
            <text x="39" y="222" font-size="12" font-weight="500" fill="#2d3142" text-anchor="middle">研报归档</text>
          </g>
        </g>
      </g>
    </svg>
