<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="macbrow-legacy-vs-fastpath-pipeline-title macbrow-legacy-vs-fastpath-pipeline-desc" id="macbrow-legacy-vs-fastpath-pipeline-root">
      <title id="macbrow-legacy-vs-fastpath-pipeline-title">传统 Computer-Use 管线 vs macbrow 快思考管线耗时对比</title>
      <desc id="macbrow-legacy-vs-fastpath-pipeline-desc">多模态整页视觉截图推理的 8~20 秒高延迟与 macbrow 投机路由 300 毫秒极速执行对比</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #macbrow-legacy-vs-fastpath-pipeline-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #macbrow-legacy-vs-fastpath-pipeline-root text { font-family: "Geist", -apple-system, sans-serif; }
      #macbrow-legacy-vs-fastpath-pipeline-root .mono { font-family: "Geist Mono", monospace; }
      #macbrow-legacy-vs-fastpath-pipeline-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="macbrow-legacy-vs-fastpath-pipeline-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="macbrow-legacy-vs-fastpath-pipeline-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="macbrow-legacy-vs-fastpath-pipeline-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Top: Legacy Pipeline -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="900" height="120" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="900" height="26" rx="8" fill="#f8f9fa"/>
          <text x="14" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">LEGACY COMPUTER-USE PIPELINE (传统模式：端到端耗时 8 ~ 20 秒)</text>

          <g transform="translate(15, 42)">
            <!-- Box 1 -->
            <rect x="0" y="0" width="130" height="58" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">用户语音输入</text>
            <text x="10" y="44" font-size="10" fill="#2d3142" fill-opacity="0.6">STT 转写 (0.5s)</text>
          </g>

          <path d="M 155 71 L 185 71" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-legacy-vs-fastpath-pipeline-arrow-default)" opacity="0.6"/>

          <g transform="translate(195, 42)">
            <!-- Box 2 -->
            <rect x="0" y="0" width="140" height="58" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">视网膜整屏抓取</text>
            <text x="10" y="44" font-size="10" fill="#2d3142" fill-opacity="0.6">截屏与编码 (0.8s)</text>
          </g>

          <path d="M 345 71 L 375 71" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-legacy-vs-fastpath-pipeline-arrow-default)" opacity="0.6"/>

          <g transform="translate(385, 42)">
            <!-- Box 3 -->
            <rect x="0" y="0" width="170" height="58" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">VLM 多模态大模型</text>
            <text x="10" y="44" font-size="10" fill="#2d3142" fill-opacity="0.6">思维链推演 (5 ~ 15s)</text>
          </g>

          <path d="M 565 71 L 595 71" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-legacy-vs-fastpath-pipeline-arrow-default)" opacity="0.6"/>

          <g transform="translate(605, 42)">
            <!-- Box 4 -->
            <rect x="0" y="0" width="130" height="58" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">坐标生成</text>
            <text x="10" y="44" font-size="10" fill="#2d3142" fill-opacity="0.6">自回归生成 (1s)</text>
          </g>

          <path d="M 745 71 L 775 71" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-legacy-vs-fastpath-pipeline-arrow-default)" opacity="0.6"/>

          <g transform="translate(785, 42)">
            <!-- Box 5 -->
            <rect x="0" y="0" width="95" height="58" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">模拟点击</text>
            <text x="10" y="44" font-size="10" fill="#2d3142" fill-opacity="0.6">物理位移 (0.5s)</text>
          </g>
        </g>

        <!-- Bottom: macbrow FastPath (Focal) -->
        <g transform="translate(30, 180)">
          <rect x="0" y="0" width="900" height="130" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="900" height="26" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="18" font-size="11" font-weight="700" fill="#bf4520" class="mono">MACBROW FASTPATH (创新架构：端到端毫秒级响应 ~300ms - FOCAL)</text>

          <g transform="translate(20, 44)">
            <rect x="0" y="0" width="230" height="64" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#bf4520">Gradium 流式语音识别</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.7">实时 WebSocket 传输 + 停顿断句 (&lt;100ms)</text>
          </g>

          <path d="M 260 76 L 310 76" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-legacy-vs-fastpath-pipeline-arrow-accent)"/>

          <g transform="translate(320, 44)">
            <rect x="0" y="0" width="240" height="64" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#bf4520">JevRouter 毫秒意图决策</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.7">System 1 快思考投机分发 (~50ms)</text>
          </g>

          <path d="M 570 76 L 620 76" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-legacy-vs-fastpath-pipeline-arrow-accent)"/>

          <g transform="translate(630, 44)">
            <rect x="0" y="0" width="250" height="64" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#bf4520">原生 AppleScript / CDP 控件</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.7">直调 macOS 词典与 DOM 树 (~150ms)</text>
          </g>
        </g>
      </g>
    </svg>
