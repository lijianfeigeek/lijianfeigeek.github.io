<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="out-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="600" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Section -->
  <g transform="translate(36, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">基于 CLAUDE.md 的 AI Agent 辅助制图与质检自愈飞轮</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b">系统只读感知 → 声明式资产装配 → 几何编译守卫 → 局部切图多模态质检的渐进收敛闭环</text>
  </g>

  <!-- Central Hub (Center at x=450, y=320) -->
  <g transform="translate(330, 260)">
    <rect x="0" y="0" width="240" height="120" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#f0f9ff"/>
    <text x="120" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">飞轮核心状态枢纽 (STATE HUB)</text>
    <text x="120" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">inventory.yaml + build.py</text>
    <text x="120" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">声明式拓扑资产 · 亚像素绝对坐标系</text>
    <text x="120" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">单篇迭代基准 · 物理单一真值</text>
  </g>

  <!-- Step 1: Top (Node at y=95) -->
  <g transform="translate(300, 95)">
    <rect x="0" y="0" width="300" height="105" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="300" height="24" rx="10" fill="#f8fafc"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7">STEP 1 · 实机只读探测与事实提取</text>
    <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">基础设施只读遥测扫描 (Telemetry)</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• 只读执行 ip -br a / pct list / zpool list -v</text>
    <text x="12" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• 提取交换机协商线速、物理盘位与端口分配</text>
  </g>

  <!-- Step 2: Right (Node at x=640, y=260) -->
  <g transform="translate(630, 260)">
    <rect x="0" y="0" width="235" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="235" height="24" rx="10" fill="#f8fafc"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7">STEP 2 · 声明式模型装配</text>
    <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">资产配置结构化纳管</text>
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• 写入 inventory.yaml</text>
    <text x="12" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• 映射 VLAN、防火墙规则</text>
    <text x="12" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• 编排 DMZ 与 Traefik FQDN</text>
  </g>

  <!-- Step 3: Bottom (Node at y=440) -->
  <g transform="translate(300, 440)">
    <rect x="0" y="0" width="300" height="105" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="300" height="24" rx="10" fill="#f8fafc"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7">STEP 3 · 几何编译与断言守卫</text>
    <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">坐标适配与溢出熔断 (Compiler)</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• 依设备量自适应调校 PX0 / DY / ZH 锚点</text>
    <text x="12" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• Python 严苛 assert 拦截卡片重叠与溢出</text>
  </g>

  <!-- Step 4: Left (Node at x=35, y=260) -->
  <g transform="translate(35, 260)">
    <rect x="0" y="0" width="245" height="120" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="1.6"/>
    <rect x="0" y="0" width="245" height="24" rx="10" fill="#fff1f2"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#e11d48">STEP 4 · 局部切图多模态质检</text>
    <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">高密区亚像素审图 (Crop QA)</text>
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• ImageMagick 裁剪高密接线与卡片区</text>
    <text x="12" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• Agent 视觉识别线缆碰撞与留白割裂</text>
    <text x="12" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e11d48">• 顺时针回流持续迭代 (~60 轮)</text>
  </g>

  <!-- Clockwise Loop Connecting Lines -->
  <!-- Top -> Right: from (600, 147) to (747, 260) -->
  <path d="M 600 147 C 680 147, 747 180, 747 252" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#loop-arrow)"/>
  
  <!-- Right -> Bottom: from (747, 380) to (600, 492) -->
  <path d="M 747 380 C 747 450, 680 492, 608 492" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- Bottom -> Left: from (300, 492) to (157, 380) -->
  <path d="M 300 492 C 220 492, 157 450, 157 388" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- Left -> Top: from (157, 260) to (300, 147) -->
  <path d="M 157 260 C 157 180, 220 147, 292 147" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- Exit Arrow: Convergence to Publication Output -->
  <g transform="translate(680, 470)">
    <rect x="0" y="0" width="185" height="75" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">🎉 终态收敛与极速发布</text>
    <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Reddit 标杆海报 (SVG/PNG)</text>
    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">脱敏分享 · 纳管至 Git 版本库</text>
  </g>
  <path d="M 747 430 L 747 462" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#out-arrow)"/>
</svg>