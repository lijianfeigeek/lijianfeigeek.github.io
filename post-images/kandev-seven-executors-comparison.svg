<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-seven-executors-comparison-title kandev-seven-executors-comparison-desc" id="kandev-seven-executors-comparison-root">
      <title id="kandev-seven-executors-comparison-title">Kandev 支持的 7 大执行器后端架构与安全隔离权衡</title>
      <desc id="kandev-seven-executors-comparison-desc">Worktree 极致性能、Docker 容器隔离、SSH 安全拨号、K8s 集群调度与云虚机沙箱的多场景权衡</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-seven-executors-comparison-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-seven-executors-comparison-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-seven-executors-comparison-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-seven-executors-comparison-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-seven-executors-comparison-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-seven-executors-comparison-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-seven-executors-comparison-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Executor 1: Worktree (Focal) -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="280" height="110" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="280" height="24" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="16" font-size="10" font-weight="700" fill="#bf4520" class="mono">01. WORKTREE (DEFAULT - FOCAL)</text>
          <text x="12" y="44" font-size="13" font-weight="600" fill="#bf4520">Git 物理工作目录 (默认)</text>
          <text x="12" y="64" font-size="11" fill="#2d3142" fill-opacity="0.8">• 性能极致，无容器化与网络开销</text>
          <text x="12" y="82" font-size="11" fill="#2d3142" fill-opacity="0.8">• 适用：完全受信任的高并发日常开发</text>
          <text x="12" y="100" font-size="11" font-weight="600" fill="#bf4520">隔离级别: 文件系统物理隔离</text>
        </g>

        <!-- Executor 2: Local Docker -->
        <g transform="translate(340, 30)">
          <rect x="0" y="0" width="280" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">02. LOCAL DOCKER</text>
          <text x="12" y="44" font-size="13" font-weight="600" fill="#2d3142">本地独立容器沙盒</text>
          <text x="12" y="64" font-size="11" fill="#2d3142" fill-opacity="0.7">• 单任务独立挂载 /workspace 容器</text>
          <text x="12" y="82" font-size="11" fill="#2d3142" fill-opacity="0.7">• 隔离宿主操作系统环境与网络栈</text>
          <text x="12" y="100" font-size="11" font-weight="600" fill="#2e5aa8">隔离级别: 容器命名空间与 cgroups</text>
        </g>

        <!-- Executor 3: Remote Docker via SSH -->
        <g transform="translate(650, 30)">
          <rect x="0" y="0" width="280" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">03. REMOTE DOCKER VIA SSH</text>
          <text x="12" y="44" font-size="13" font-weight="600" fill="#2d3142">远端容器安全隧道</text>
          <text x="12" y="64" font-size="11" fill="#2d3142" fill-opacity="0.7">• 经由 SSH 加密管道拨号远程 Docker</text>
          <text x="12" y="82" font-size="11" fill="#2d3142" fill-opacity="0.7">• 彻底关闭高危 2375 裸 TCP 监听端口</text>
          <text x="12" y="100" font-size="11" font-weight="600" fill="#2e5aa8">隔离级别: 远端物理机 + 容器双重隔离</text>
        </g>

        <!-- Executor 4: SSH Remote -->
        <g transform="translate(30, 160)">
          <rect x="0" y="0" width="280" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">04. SSH REMOTE</text>
          <text x="12" y="44" font-size="13" font-weight="600" fill="#2d3142">远端专属服务器部署</text>
          <text x="12" y="64" font-size="11" fill="#2d3142" fill-opacity="0.7">• 部署于专用独立服务器或跳板机</text>
          <text x="12" y="82" font-size="11" fill="#2d3142" fill-opacity="0.7">• SFTP 文件同步与动态端口转发协同</text>
          <text x="12" y="100" font-size="11" font-weight="600" fill="#2d3142">适用场景: 团队共享算力服务器</text>
        </g>

        <!-- Executor 5: Kubernetes Pod -->
        <g transform="translate(340, 160)">
          <rect x="0" y="0" width="280" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">05. KUBERNETES POD</text>
          <text x="12" y="44" font-size="13" font-weight="600" fill="#2d3142">企业级 K8s 动态调度</text>
          <text x="12" y="64" font-size="11" fill="#2d3142" fill-opacity="0.7">• 瞬时拉起临时 Pod 执行特定构建任务</text>
          <text x="12" y="82" font-size="11" fill="#2d3142" fill-opacity="0.7">• 弹性资源伸缩与多租户权限硬隔离</text>
          <text x="12" y="100" font-size="11" font-weight="600" fill="#2d3142">适用场景: 企业规模化 Agent 研发云</text>
        </g>

        <!-- Executor 6: Sprites.dev -->
        <g transform="translate(650, 160)">
          <rect x="0" y="0" width="280" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">06. SPRITES.DEV CLOUD</text>
          <text x="12" y="44" font-size="13" font-weight="600" fill="#2d3142">完全托管云端微虚机</text>
          <text x="12" y="64" font-size="11" fill="#2d3142" fill-opacity="0.7">• 秒级冷启动 MicroVM 隔离沙箱</text>
          <text x="12" y="82" font-size="11" fill="#2d3142" fill-opacity="0.7">• 无需本地维护 Docker 守护进程</text>
          <text x="12" y="100" font-size="11" font-weight="600" fill="#2d3142">适用场景: 纯轻量化客户端远端执行</text>
        </g>

        <!-- Executor 7: Local In-Place -->
        <g transform="translate(180, 290)">
          <rect x="0" y="0" width="600" height="95" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="600" height="24" rx="6" fill="#f8f9fa"/>
          <text x="12" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">07. LOCAL IN-PLACE (原位受控调试)</text>
          <text x="12" y="44" font-size="13" font-weight="600" fill="#2d3142">直接在原始检出目录执行 (仅限临时排错)</text>
          <text x="12" y="64" font-size="11" fill="#2d3142" fill-opacity="0.7">• 绕过所有 Worktree 目录创建，直接原地读写</text>
          <text x="12" y="82" font-size="11" fill="#2d3142" fill-opacity="0.7">• 仅用于极少数涉及特殊相对路径软链接或本地设备驱动调试的高危场景</text>
        </g>
      </g>
    </svg>
