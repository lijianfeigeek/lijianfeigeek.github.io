<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="cc-quad-title cc-quad-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Segoe UI',Roboto,sans-serif;">
  <title id="cc-quad-title">Claude Code 多形态协同选型 2×2 决策矩阵</title>
  <desc id="cc-quad-desc">按上下文隔离度与状态协同持续度两个维度，划分内置只读探针、持久化自定义 Subagent、主会话与 Skills/btw 以及 /subtask 对话分叉四大选型象限。</desc>
  <defs>
    <pattern id="cc-dots-3" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="rgba(15,23,42,0.08)"/>
    </pattern>
    <marker id="qd-arr-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#0f172a"/>
    </marker>
    <marker id="qd-arr-end" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="620" fill="#ffffff"/>
  <rect width="980" height="620" fill="url(#cc-dots-3)" opacity="0.65"/>

  <!-- Header -->
  <g transform="translate(32, 16)">
    <rect x="0" y="0" width="916" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="18" y="25" font-size="16" font-weight="700" fill="#0f172a">Claude Code 任务编排 2×2 决策矩阵：上下文隔离 × 持久化协同</text>
    <text x="18" y="43" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">MAIN THREAD · SKILLS · /BTW · EXPLORE/PLAN · CUSTOM SUBAGENTS · /SUBTASK FORK</text>
    <text x="898" y="32" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0284c7" text-anchor="end">TYPE: QUADRANT</text>
  </g>

  <!-- Double-ended Axis Cross (cx=490, cy=304) -->
  <line x1="490" y1="106" x2="490" y2="502" stroke="#0f172a" stroke-width="1.3" marker-start="url(#qd-arr-start)" marker-end="url(#qd-arr-end)"/>
  <line x1="128" y1="304" x2="852" y2="304" stroke="#0f172a" stroke-width="1.3" marker-start="url(#qd-arr-start)" marker-end="url(#qd-arr-end)"/>

  <!-- Jobs-minimal single-word axis labels beyond tips -->
  <text x="490" y="92" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="400" letter-spacing="0.18em" fill="#0f172a" text-anchor="middle">ISOLATED</text>
  <text x="490" y="522" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="400" letter-spacing="0.18em" fill="#0f172a" text-anchor="middle">SHARED</text>
  <text x="116" y="304" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="400" letter-spacing="0.18em" fill="#0f172a" text-anchor="end" dominant-baseline="middle">EPHEMERAL</text>
  <text x="864" y="304" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="400" letter-spacing="0.18em" fill="#0f172a" text-anchor="start" dominant-baseline="middle">COORDINATED</text>

  <!-- Cell 01: Top-Left (ISOLATED / EPHEMERAL) -->
  <g transform="translate(150, 120)">
    <rect x="0" y="0" width="308" height="160" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="308" height="160" rx="6" fill="rgba(15,23,42,0.025)" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="22" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" letter-spacing="0.16em" fill="#64748b">01 · ISOLATED / EPHEMERAL</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#0f172a">内置只读探针（Explore / Plan）</text>
    <text x="16" y="72" font-size="12" fill="#334155">一次性海量代码检索、日志排查与规划取证</text>
    <text x="16" y="94" font-size="12" fill="#334155">跳过 CLAUDE.md 与 Git 状态，零污染主窗</text>
    <text x="16" y="122" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">Read / Grep / Glob · 禁用 Write &amp; Edit</text>
    <text x="16" y="142" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">提示：同名自定义 Explore 可覆写为 Haiku</text>
  </g>

  <!-- Cell 02: Top-Right (ISOLATED / COORDINATED) [FOCAL CORAL] -->
  <g transform="translate(522, 120)">
    <rect x="0" y="0" width="308" height="160" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="308" height="160" rx="6" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="16" y="22" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" letter-spacing="0.16em" fill="#bf4520">02 · ISOLATED / COORDINATED</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#9a3412">持久化自定义 Subagent 编队</text>
    <text x="16" y="72" font-size="12" fill="#0f172a">独立权限、内联 MCP、Hook 门禁与持久记忆</text>
    <text x="16" y="94" font-size="12" fill="#0f172a">支持 git worktree 沙盒与 SendMessage 接力</text>
    <text x="16" y="122" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#9a3412">memory: project · isolation: worktree</text>
    <text x="16" y="142" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#bf4520">核心场景：代码审查、DB只读查询、深度测试</text>
  </g>

  <!-- Cell 03: Bottom-Left (SHARED / EPHEMERAL) -->
  <g transform="translate(150, 328)">
    <rect x="0" y="0" width="308" height="160" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="308" height="160" rx="6" fill="rgba(15,23,42,0.025)" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="22" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" letter-spacing="0.16em" fill="#64748b">03 · SHARED / EPHEMERAL</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#0f172a">主会话直连、Skills 与 /btw</text>
    <text x="16" y="72" font-size="12" fill="#334155">高频来回迭代、局部精准修改与零冷启动延迟</text>
    <text x="16" y="94" font-size="12" fill="#334155">Skills 复用主窗口；/btw 旁路问答不入历史</text>
    <text x="16" y="122" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">0 派生延迟 · 共享多阶段连续上下文</text>
    <text x="16" y="142" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">注意：大日志或长链路会快速膨胀主窗口</text>
  </g>

  <!-- Cell 04: Bottom-Right (SHARED / COORDINATED) -->
  <g transform="translate(522, 328)">
    <rect x="0" y="0" width="308" height="160" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="308" height="160" rx="6" fill="rgba(2,132,199,0.04)" stroke="#0284c7" stroke-width="1.1"/>
    <text x="16" y="22" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" letter-spacing="0.16em" fill="#0369a1">04 · SHARED / COORDINATED</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#0f172a">对话分叉分支（/subtask Fork）</text>
    <text x="16" y="72" font-size="12" fill="#334155">继承全量历史与工具池，同时共享父级缓存</text>
    <text x="16" y="94" font-size="12" fill="#334155">底部面板实时观测与打断（↑/↓/Enter/x）</text>
    <text x="16" y="122" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1">Prompt Cache 复用 · 仅回传最终结论</text>
    <text x="16" y="142" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">边界：单向终结分叉（禁止分叉内再分叉）</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(32, 544)">
    <line x1="0" y1="0" x2="916" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <rect x="74" y="13" width="14" height="14" rx="3" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="96" y="24" font-size="11" fill="#334155">核心工程范式：独立沙盒 + 持久化记忆 + 跨轮唤醒</text>

    <rect x="424" y="13" width="14" height="14" rx="3" fill="rgba(2,132,199,0.08)" stroke="#0284c7" stroke-width="1.1"/>
    <text x="446" y="24" font-size="11" fill="#334155">同起点并行分叉（共享缓存）</text>

    <rect x="640" y="13" width="14" height="14" rx="3" fill="rgba(15,23,42,0.03)" stroke="#cbd5e1" stroke-width="1"/>
    <text x="662" y="24" font-size="11" fill="#334155">轻量直连 / 瞬态探针</text>

    <text x="0" y="50" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">NOTE: 若需多独立长程会话双向通信与协同团队，请升级至 Agent Teams 或 Cross-Session Messaging。</text>
  </g>
</svg>
