<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futu-tiger-judge-inquiry-and-court-verdict-title futu-tiger-judge-inquiry-and-court-verdict-desc">
  <title id="futu-tiger-judge-inquiry-and-court-verdict-title">主审法官三大审判逻辑死穴与事实判定</title>
  <desc id="futu-tiger-judge-inquiry-and-court-verdict-desc">解构海外居住不等于卷款潜逃、李正飞高考答案悖论建仓结构，以及撑伞理论下缺失泄密源头的司法判定</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-err { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #b91c1c; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #047857; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">纽约南区联邦法院主审法官的“灵魂三问”与司法裁决判定</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">做市商在事实认定与证据链条上的三大致命死穴，直接动摇了内幕交易的有罪推定</text>

  <!-- Question 1: Offshore Transfer -->
  <g transform="translate(40, 80)">
    <rect width="270" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">死穴一：离岸资产转移拟制</text>
    <g transform="translate(16, 46)">
      <rect width="52" height="18" rx="4" fill="#fee2e2"/>
      <text x="26" y="13" class="badge-err" text-anchor="middle">原告主张</text>
      <text x="0" y="34" class="text-sub">“被告登记在中国或境外，必将把资金汇回海外，使未来判决成一纸空文”</text>
      <line x1="0" y1="64" x2="238" y2="64" stroke="#f1f5f9" stroke-width="1"/>
      <rect width="52" height="18" rx="4" fill="#d1fae5"/>
      <text x="26" y="77" class="badge-ok" text-anchor="middle">法庭判定</text>
      <text x="0" y="98" class="badge-ok">❌ 居住海外 ≠ 正在转移挥霍资产</text>
      <text x="0" y="116" class="text-sub">• 护照与国籍不是有罪推定书</text>
      <text x="0" y="132" class="text-sub">• 被告不但未失联，反而主动申报资产并聘请律师出庭应诉</text>
    </g>
  </g>

  <!-- Question 2: Zhengfei Li Paradox (Focal Coral) -->
  <g transform="translate(345, 80)">
    <rect width="270" height="230" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#ffedd5"/>
    <text x="135" y="22" class="badge-coral" text-anchor="middle">死穴二：李正飞“高考答案悖论”</text>
    <g transform="translate(16, 46)">
      <rect width="52" height="18" rx="4" fill="#fee2e2"/>
      <text x="26" y="13" class="badge-err" text-anchor="middle">原告主张</text>
      <text x="0" y="34" class="text-sub">“该账户精准建仓并斩获暴利，证明其必然提前获知了监管利空公布时间”</text>
      <line x1="0" y1="64" x2="238" y2="64" stroke="#f1f5f9" stroke-width="1"/>
      <rect width="52" height="18" rx="4" fill="#ffedd5"/>
      <text x="26" y="77" class="badge-coral" text-anchor="middle">法庭判定</text>
      <text x="0" y="98" class="badge-coral">❌ 仓位结构动摇“事前全知”论断</text>
      <text x="0" y="116" class="text-sub">• 一半本金砸在公布前已归零的合约上</text>
      <text x="0" y="132" class="text-sub">• 拿到高考标准答案的人，不可能一半按答案抄，另一半闭眼瞎蒙</text>
    </g>
  </g>

  <!-- Question 3: Tippee Chain -->
  <g transform="translate(650, 80)">
    <rect width="270" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">死穴三：撑伞理论与因果缺失</text>
    <g transform="translate(16, 46)">
      <rect width="52" height="18" rx="4" fill="#fee2e2"/>
      <text x="26" y="13" class="badge-err" text-anchor="middle">原告主张</text>
      <text x="0" y="34" class="text-sub">“几十个账户在同一时间窗口集中下注，统计学概率极低，定为协同泄密”</text>
      <line x1="0" y1="64" x2="238" y2="64" stroke="#f1f5f9" stroke-width="1"/>
      <rect width="52" height="18" rx="4" fill="#d1fae5"/>
      <text x="26" y="77" class="badge-ok" text-anchor="middle">法庭判定</text>
      <text x="0" y="98" class="badge-ok">❌ 撑伞者虽众，不等于听了天气预报</text>
      <text x="0" y="116" class="text-sub">• 无法指出中国监管部门泄密源头</text>
      <text x="0" y="132" class="text-sub">• 社交网络与行业传闻下的跟风投机，不能在法庭上被拟制为内幕共谋</text>
    </g>
  </g>
</svg>