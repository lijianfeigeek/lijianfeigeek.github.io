<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="ned-vt-title ned-vt-desc">
  <title id="ned-vt-title">267 项教育优惠背后的全球学生身份认证体系实证分布</title>
  <desc id="ned-vt-desc">基于 nav.edumails.cn 全站 267 条公开接口数据的实证统计，对比邮箱直验、文件证明、SheerID、Proxi.id 与未归类特殊渠道的数量与信任成本层级。</desc>
  <defs>
    <pattern id="ned-vt-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="960" height="500" fill="#f8fafc"/>
  <rect width="960" height="500" fill="url(#ned-vt-dots)"/>

  <!-- Header -->
  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Empirical Student Verification Landscape (n = 267)</text>
  <text x="32" y="52" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#64748b">SOURCE: /wp-json/wp/v2/sites · MULTI-LABEL TAXONOMY + DESCRIPTION KEYWORDS</text>

  <!-- Left Panel: Horizontal Bar Chart of Primary Verification Taxonomy -->
  <rect x="28" y="72" width="560" height="352" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="98" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#0f172a">一级认证分类分布（支持多标签叠加）</text>
  <text x="48" y="114" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">PRIMARY TAXONOMY: favorites/certify (term-926)</text>

  <!-- Vertical Gridlines (0, 40, 80, 120, 160 -> x = 212 + val * 2.0) -->
  <line x1="212" y1="132" x2="212" y2="376" stroke="#64748b" stroke-width="1"/>
  <line x1="292" y1="132" x2="292" y2="376" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="372" y1="132" x2="372" y2="376" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="452" y1="132" x2="452" y2="376" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="532" y1="132" x2="532" y2="376" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- X-axis tick labels -->
  <g transform="translate(212, 392)">
    <text x="0" y="0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">0</text>
    <text x="80" y="0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">40</text>
    <text x="160" y="0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">80</text>
    <text x="240" y="0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">120</text>
    <text x="320" y="0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">160</text>
  </g>
  <text x="372" y="410" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#94a3b8">COUNT OF CATALOGED PROGRAMS (OUT OF 267)</text>

  <!-- Bar 1: 邮箱认证 (156, 58.4%) - FOCAL CORAL -->
  <g transform="translate(48, 144)">
    <text x="152" y="16" text-anchor="end" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#bf4520">邮箱直接验证</text>
    <text x="152" y="30" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#9a3412">.edu / .edu.cn / .ac</text>
    <rect x="164" y="4" width="312" height="28" rx="4" fill="#fef2ee" stroke="#bf4520" stroke-width="1.4"/>
    <text x="484" y="22" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#bf4520">156 (58.4%)</text>
  </g>

  <!-- Bar 2: 未归类特殊通道 (53, 19.9%) -->
  <g transform="translate(48, 192)">
    <text x="152" y="16" text-anchor="end" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#1e293b">未标子项/混合通道</text>
    <text x="152" y="30" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">学信网 / 院校签约 / GitHub</text>
    <rect x="164" y="4" width="106" height="28" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="278" y="22" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#334155">53 (19.9%)</text>
  </g>

  <!-- Bar 3: 文件认证 (46, 17.2%) -->
  <g transform="translate(48, 240)">
    <text x="152" y="16" text-anchor="end" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#1e293b">人工/材料文件认证</text>
    <text x="152" y="30" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">学生证 / 成绩单 / 在读证明</text>
    <rect x="164" y="4" width="92" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="264" y="22" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#0369a1">46 (17.2%)</text>
  </g>

  <!-- Bar 4: SheerID认证 (19, 7.1%) -->
  <g transform="translate(48, 288)">
    <text x="152" y="16" text-anchor="end" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#1e293b">SheerID 第三方网关</text>
    <text x="152" y="30" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">学籍库直连 + OCR 兜底</text>
    <rect x="164" y="4" width="38" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
    <text x="210" y="22" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#334155">19 (7.1%)</text>
  </g>

  <!-- Bar 5: Proxi.id认证 (1, 0.4%) -->
  <g transform="translate(48, 336)">
    <text x="152" y="16" text-anchor="end" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#1e293b">Proxi.id 数据库认证</text>
    <text x="152" y="30" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">全球高教身份联邦查询</text>
    <rect x="164" y="4" width="4" height="28" rx="2" fill="#059669" stroke="#059669" stroke-width="1"/>
    <text x="176" y="22" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#047857">1 (分类) / 2 (提及)</text>
  </g>

  <!-- Right Panel: Trust Escalation & Secondary Channels -->
  <rect x="604" y="72" width="328" height="352" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="624" y="98" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#0f172a">二次信任传递与风控升级阶梯</text>
  <text x="624" y="114" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">SECONDARY OAUTH &amp; ANTI-ABUSE ESCALATION</text>

  <!-- Card 1 -->
  <g transform="translate(624, 132)">
    <rect x="0" y="0" width="288" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="20" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569">TIER 1 · 低风控直通层</text>
    <text x="12" y="37" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#0f172a">MX / 后缀匹配（152 条纯邮箱项）</text>
    <text x="12" y="51" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10" fill="#64748b">如 Shodan、iLovePDF；极易受校友转发邮箱冲击</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(624, 200)">
    <rect x="0" y="0" width="288" height="60" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="20" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0284c7">TIER 2 · 二次身份背书联盟</text>
    <text x="12" y="37" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#0f172a">GitHub Pack (12) · UNiDAYS (6) · Beans (4)</text>
    <text x="12" y="51" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10" fill="#334155">如 1Password、Proton、Figma 复用上游高权重认证</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(624, 268)">
    <rect x="0" y="0" width="288" height="60" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="12" y="20" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#bf4520">TIER 3 · 强材料/第三方网关</text>
    <text x="12" y="37" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#bf4520">SheerID (19) + 文件审核 (46) + 学信网 (8)</text>
    <text x="12" y="51" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10" fill="#7c2d12">强制核验含日期的课表/成绩单或扫脸学籍库比对</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(624, 336)">
    <rect x="0" y="0" width="288" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="12" y="20" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#059669">TIER 4 · 机构/校园网闭环签约</text>
    <text x="12" y="37" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#065f46">K-12 签约 / 校内 SSO（Apple · OpenASI）</text>
    <text x="12" y="51" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10" fill="#047857">脱离公开邮箱通道，仅限机构统一管理后台发放</text>
  </g>

  <!-- Footer Note -->
  <line x1="32" y1="444" x2="928" y2="444" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 464)">
    <text x="0" y="4" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.1em" fill="#475569">OBSERVATION</text>
    <text x="96" y="4" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#334155">纯邮箱直验（58.4%）仍是主流入口，但 GitHub Student Pack、AI 算力与高客单 SaaS 正加速向 SheerID + 活体学籍核验迁移。</text>
  </g>
</svg>
