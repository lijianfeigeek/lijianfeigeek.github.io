<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-fingerprint-tradeoff-title ios-fingerprint-tradeoff-desc" id="ios-fingerprint-tradeoff-root">
        <title id="ios-fingerprint-tradeoff-title">设备指纹的两难博弈：唯一性与稳定性的场景映射</title>
        <desc id="ios-fingerprint-tradeoff-desc">展示风控设备指纹在唯一性与稳定性两维度的权重取舍及其与金融反欺诈和营销防刷业务场景的映射关系</desc>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-fingerprint-tradeoff-root { --color-paper:   #f8f9fa;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ios-fingerprint-tradeoff-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-fingerprint-tradeoff-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <marker id="ios-fingerprint-tradeoff-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ios-fingerprint-tradeoff-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
      </marker>
      <marker id="ios-fingerprint-tradeoff-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <pattern id="ios-fingerprint-tradeoff-dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <rect width="100%" height="100%" fill="url(#ios-fingerprint-tradeoff-dots)" opacity="0.6"/>

        <!-- Left Container: 指纹核心维度 -->
        <rect x="40" y="40" width="410" height="340" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="60" y="72" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14" letter-spacing="0.04em">指纹架构权衡维度 (CORE DIMENSIONS)</text>

        <!-- Node U: 高唯一性 (Accent) -->
        <g id="node-u">
          <rect x="60" y="100" width="370" height="100" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.05"/>
          <rect x="76" y="116" width="68" height="20" rx="2" fill="#bf4520"/>
          <text x="110" y="130" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">ACCENT</text>
          <text x="156" y="131" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="15">高唯一性 (Uniqueness)</text>
          <text x="76" y="162" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="13">追求零标签碰撞 · 细粒度微观因数采集</text>
          <text x="76" y="182" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">Metrics: 99.999% 区分度 · 极低误伤率</text>
        </g>

        <!-- Node S: 高稳定性 -->
        <g id="node-s">
          <rect x="60" y="240" width="370" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <rect x="76" y="256" width="68" height="20" rx="2" fill="#2d3142" fill-opacity="0.10"/>
          <text x="110" y="270" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">STABLE</text>
          <text x="156" y="271" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="15">高稳定性 (Stability)</text>
          <text x="76" y="302" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="13">追求抹机持久不变 · 锚定硬件非易失根</text>
          <text x="76" y="322" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">Metrics: 跨重启/跨抹机一致 · 极低逃逸率</text>
        </g>

        <!-- Right Container: 业务场景映射 -->
        <rect x="510" y="40" width="410" height="340" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="530" y="72" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14" letter-spacing="0.04em">核心业务风控诉求 (BUSINESS SCENARIOS)</text>

        <!-- Node F1: 金融场景 -->
        <g id="node-f1">
          <rect x="530" y="100" width="370" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <rect x="546" y="116" width="76" height="20" rx="2" fill="#2d3142" fill-opacity="0.10"/>
          <text x="584" y="130" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">SCENARIO</text>
          <text x="632" y="131" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="15">金融反欺诈 / 交易定责</text>
          <text x="546" y="162" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="13">严格防错杀正常客户 · 宁可漏放不可误伤</text>
          <text x="546" y="182" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">Policy: 容忍单台漏检，严禁账号误封</text>
        </g>

        <!-- Node F2: 营销场景 -->
        <g id="node-f2">
          <rect x="530" y="240" width="370" height="100" rx="6" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1.2" fill-opacity="0.05"/>
          <rect x="546" y="256" width="76" height="20" rx="2" fill="#2e5aa8"/>
          <text x="584" y="270" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">SCENARIO</text>
          <text x="632" y="271" fill="#2e5aa8" font-family="'Geist', sans-serif" font-weight="600" font-size="15">营销活动防刷 / 补贴拉新</text>
          <text x="546" y="302" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="13">严格防黑产抹机洗白 · 宁可从严不可被薅</text>
          <text x="546" y="322" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">Policy: 锁定硬件资产，阻断反复薅羊毛</text>
        </g>

        <!-- Connectors -->
        <path d="M 430 150 L 530 150" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-fingerprint-tradeoff-arrow-accent)"/>
        <rect x="444" y="138" width="72" height="22" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-opacity="0.3"/>
        <text x="480" y="153" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">强匹配 · 零误伤</text>

        <path d="M 430 290 L 530 290" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-fingerprint-tradeoff-arrow-link)"/>
        <rect x="444" y="278" width="72" height="22" rx="3" fill="#ffffff" stroke="#2e5aa8" stroke-width="1" stroke-opacity="0.3"/>
        <text x="480" y="293" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">强匹配 · 零逃逸</text>
      </svg>
