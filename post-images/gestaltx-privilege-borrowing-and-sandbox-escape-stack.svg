<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .layer-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #475569; }
      .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #0369a1; font-weight: 600; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="580" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="918" height="578" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <!-- Title Section -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="title">GestaltX 全栈运行拓扑：从 worse_query 特权借调到 Mach-O 内存探针</text>
    <text x="0" y="20" class="subtitle">解构 iOS 27 无越狱环境下穿透沙盒、Inode 广域枚举、动态描述符寻址与系统级配置原位落盘的纵深架构</text>
  </g>

  <!-- Layer 1: User & Interface Gateway -->
  <g transform="translate(32, 74)">
    <rect width="856" height="96" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" rx="8"/>
    <rect x="0" y="0" width="856" height="28" fill="#f1f5f9" rx="8"/>
    <rect x="0" y="20" width="856" height="8" fill="#f1f5f9"/>
    <text x="14" y="18" class="layer-tag" fill="#0369a1">LAYER 1 · 用户交互与扩展网关</text>
    <text x="210" y="18" class="layer-title">宿主控制中枢与 App Group 安全通信管道</text>

    <!-- Card 1-1 -->
    <g transform="translate(14, 38)">
      <rect width="268" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">SwiftUI 响应式状态管理</text>
      <text x="12" y="34" class="card-desc">双向差异检测、更改暂存对比与原厂配置快照</text>
    </g>

    <!-- Card 1-2 -->
    <g transform="translate(294, 38)">
      <rect width="268" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">ShareExtension 系统分享扩展</text>
      <text x="12" y="34" class="card-desc">接收外部 Plist/音频/壁纸，通过收件箱异步移交</text>
    </g>

    <!-- Card 1-3 -->
    <g transform="translate(574, 38)">
      <rect width="268" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">Keychain 硬件身份验证凭据</text>
      <text x="12" y="34" class="card-desc">强校验 ECID / Serial / ChipID，杜绝异机导入事故</text>
    </g>
  </g>

  <!-- Layer 2: Privilege Borrowing & Traversal -->
  <g transform="translate(32, 184)">
    <rect width="856" height="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" rx="8"/>
    <rect x="0" y="0" width="856" height="28" fill="#eff6ff" rx="8"/>
    <rect x="0" y="20" width="856" height="8" fill="#eff6ff"/>
    <text x="14" y="18" class="layer-tag" fill="#0284c7">LAYER 2 · 特权借调与沙盒穿透引擎</text>
    <text x="236" y="18" class="layer-title">worse_query 漏洞链与 Darwin 文件系统遍历</text>

    <!-- Card 2-1 -->
    <g transform="translate(14, 38)">
      <rect width="268" height="62" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">worse_query 符号链接欺骗</text>
      <text x="12" y="34" class="card-desc">诱导 containermanagerd 颁发 Class 7 特权令牌</text>
      <text x="12" y="50" class="code-pill">copy_sandbox_token() 借调执行权</text>
    </g>

    <!-- Card 2-2 -->
    <g transform="translate(294, 38)">
      <rect width="268" height="62" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">fsgetpath 卷级 Inode 盲扫</text>
      <text x="12" y="34" class="card-desc">突破沙盒视口直接枚举 /var/mobile 真实目录</text>
      <text x="12" y="50" class="code-pill">fsgetpath(buf, sz, &amp;fsid, inode)</text>
    </g>

    <!-- Card 2-3 -->
    <g transform="translate(574, 38)">
      <rect width="268" height="62" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">xattr 容器身份反查解析</text>
      <text x="12" y="34" class="card-desc">读取 containermanager.identity 提取所有者 ID</text>
      <text x="12" y="50" class="code-pill">com.apple.containermanager.identity</text>
    </g>
  </g>

  <!-- Layer 3: System & Container Governance -->
  <g transform="translate(32, 308)">
    <rect width="856" height="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" rx="8"/>
    <rect x="0" y="0" width="856" height="28" fill="#fdf4ff" rx="8"/>
    <rect x="0" y="20" width="856" height="8" fill="#fdf4ff"/>
    <text x="14" y="18" class="layer-tag" fill="#c026d3">LAYER 3 · 跨特权域系统容器治理网格</text>
    <text x="246" y="18" class="layer-title">SystemGroup、SplashBoard 与 idevice 环回通道</text>

    <!-- Card 3-1 -->
    <g transform="translate(14, 38)">
      <rect width="268" height="62" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">MobileGestalt 共享系统根容器</text>
      <text x="12" y="34" class="card-desc">直连 systemgroup.com.apple.mobilegestaltcache</text>
      <text x="12" y="50" class="code-pill">com.apple.MobileGestalt.plist 读写</text>
    </g>

    <!-- Card 3-2 -->
    <g transform="translate(294, 38)">
      <rect width="268" height="62" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">SplashBoard 启动图原子替换</text>
      <text x="12" y="34" class="card-desc">openat 多层级文件描述符锁定，防止软链竞争</text>
      <text x="12" y="50" class="code-pill">O_NOFOLLOW | O_DIRECTORY 防穿透</text>
    </g>

    <!-- Card 3-3 -->
    <g transform="translate(574, 38)">
      <rect width="268" height="62" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">idevice-ffi 端侧环回审计</text>
      <text x="12" y="34" class="card-desc">127.0.0.1 隧道流式捕获 syslog，定位通知铃声</text>
      <text x="12" y="50" class="code-pill">NotificationSoundLogParser 正则流水线</text>
    </g>
  </g>

  <!-- Layer 4: Runtime Inspection & Hardware Anchor -->
  <g transform="translate(32, 432)">
    <rect width="856" height="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" rx="8"/>
    <rect x="0" y="0" width="856" height="28" fill="#fef2f2" rx="8"/>
    <rect x="0" y="20" width="856" height="8" fill="#fef2f2"/>
    <text x="14" y="18" class="layer-tag" fill="#e11d48">LAYER 4 · 运行时 Mach-O 内存探针与硬件锚点</text>
    <text x="286" y="18" class="layer-title">PAC 掩码剥离、动态槽位寻址与 SEP 信任边界</text>

    <!-- Card 4-1 -->
    <g transform="translate(14, 38)">
      <rect width="268" height="62" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">dyld 内存镜像与 PAC 剥离探针</text>
      <text x="12" y="34" class="card-desc">解析 libMobileGestalt.dylib，屏蔽 arm64e PAC 签名</text>
      <text x="12" y="50" class="code-pill">pointer &amp; 0x0000_FFFF_FFFF_FFFF</text>
    </g>

    <!-- Card 4-2 -->
    <g transform="translate(294, 38)">
      <rect width="268" height="62" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">64 字节动态描述符扫描器</text>
      <text x="12" y="34" class="card-desc">匹配 22 字节 Base64 键名，提取 +0x3A 有符号槽位</text>
      <text x="12" y="50" class="code-pill">动态计算 slotCount * 8 + index 有效位</text>
    </g>

    <!-- Card 4-3 -->
    <g transform="translate(574, 38)">
      <rect width="268" height="62" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="6"/>
      <text x="12" y="18" class="card-title">Secure Enclave (SEP) 物理校准隔离</text>
      <text x="12" y="34" class="card-desc">杜绝伪装 ProductType 破坏 Face ID 传感器校准</text>
      <text x="12" y="50" class="code-pill">原位保护四大核心硬件标识</text>
    </g>
  </g>
</svg>