<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="miao-layers-title miao-layers-desc" id="miao-layers-root" data-diagram="layer-stack">
  <title id="miao-layers-title">米遥 MI-AO 零全局键盘钩子与十二键设备级中性隔离分层栈</title>
  <desc id="miao-layers-desc">自底向上展示小米蓝牙遥控器 2 Pro 物理 HID 服务、hidutil 十二键 No Event 中性隔离与所有权自愈屏障、IOHIDManager 成对收敛器、硬件档案与动作预设双契约解耦层以及 60Hz 动作执行器的五层纵深架构。</desc>
  <defs>
    <pattern id="ml-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="ml-arrow-up" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="600" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="600" fill="url(#ml-dots)"/>

  <!-- Header -->
  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Zero-EventTap HID Stack: 12-Key Neutralization, Dual Contract &amp; 60Hz Executor</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">VENDOR 0x2717 / PRODUCT 0x32B8 · NO QUARTZ KEYBOARD HOOK · MENU KEY NATIVE RIGHT-CLICK · HOT-RELOAD PRESETS</text>

  <!-- Left Margin Direction Indicator -->
  <g transform="translate(28, 84)">
    <line x1="40" y1="452" x2="40" y2="12" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ml-arrow-up)"/>
    <rect x="4" y="180" width="72" height="92" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="204" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">ISOLATION</text>
    <text x="40" y="220" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">&amp; POLICY ↑</text>
    <text x="40" y="242" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#334155">零键盘窃听</text>
    <text x="40" y="258" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="7.5" fill="#64748b">NO EVENT TAP</text>
  </g>

  <!-- L5: 60Hz Executor & Menu Bar Feedback -->
  <g transform="translate(116, 84)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="112" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="72" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L5 · EXECUTOR</text>
    <text x="144" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">60Hz 动作执行器、350ms 单双击仲裁与 17pt 菜单栏瞬态回执层</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">min(1000, 260 + 620t) 指针加速曲线；HOME 350ms 仲裁 PageDown/PageUp；音量键经 AXMenuBar 切换 Codex 上下会话</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">ButtonActionExecutor (1/60s tick) · 异常中断逆序释放修饰键 · 17pt Lucide Sun 单色模板 1.2s 真实动作切换</text>
  </g>

  <!-- L4: Dual Contract (HardwareProfile x ButtonPresetCatalog) -->
  <g transform="translate(116, 176)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="112" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="72" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L4 · PRESETS</text>
    <text x="144" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">物理硬件档案与动作映射套装双契约解耦与运行时热重载层</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">ButtonProfileStore 校验六必需键完整无冲突；ButtonPresetCatalog 管理只读默认 pointer 与用户方案，TV 键支持显式切换</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">button-presets.json (0700/0600, ≤1MB) · 硬拦截 ⌘Q / ⌘⌥Esc / ⌘⌃Q 高危热键 · DistributedNotification 热重载</text>
  </g>

  <!-- L3: Device-Scoped IOHIDManager & Event Reducer -->
  <g transform="translate(116, 268)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="112" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="72" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L3 · REDUCER</text>
    <text x="144" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">设备专属 IOHIDManager 原始流捕获与成对事件收敛状态机</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">按 VendorID/ProductID 精确锁定单一遥控器实例；数组型 Usage 归一化，把按压、长按连发与释放收敛为严格成对事件</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">HIDButtonController · HIDButtonEventReducer (新键按下前强制补发旧键 buttonUp 防卡键) · 顺带唤醒智能休眠</text>
  </g>

  <!-- L2: 12-Key hidutil No-Event Neutralization Gate (FOCAL CORAL LAYER) -->
  <g transform="translate(116, 360)">
    <rect x="0" y="0" width="852" height="88" rx="6" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <rect x="16" y="14" width="112" height="18" rx="3" fill="none" stroke="#bf4520" stroke-width="1"/>
    <text x="72" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#bf4520">L2 · NO-EVENT</text>
    <text x="144" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">十二键 0x700000000 设备级中性化隔离与所有权回滚屏障</text>
    <text x="16" y="52" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0f172a">仅将该 HID Service 的 12 个接管键映射为 No Event，彻底屏蔽系统原生方向/音量副作用；菜单键豁免保留 macOS 原生右键</text>
    <text x="16" y="72" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">remote-mapping.sh · Mac 实体键盘 100% 物理旁路 · owner=mi-ao 所有权锁 (v1~v4 平滑迁移) · 写入回读验证与退出还原</text>
  </g>

  <!-- L1: Physical BLE HID Service -->
  <g transform="translate(116, 456)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="112" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="72" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L1 · BLE HID</text>
    <text x="144" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">小米蓝牙遥控器 2 Pro（固件 2671）物理按键 HID Usage 基线层</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">UsagePage 0x07 真机校准档案：方向四键 0x52/0x51/0x50/0x4F、确认 0x28、返回 0xF1、HOME 0x4A、TV 0x35、电源 0x66</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">xiaomi-remote-2-pro-2671.plist · 语音键 0x3E + 音量 0x80/0x81 · 支持 confirmed_calibration 本地人工覆盖</text>
  </g>

  <!-- Legend Strip -->
  <line x1="28" y1="556" x2="968" y2="556" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="578" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#475569">LEGEND</text>
  <rect x="108" y="568" width="16" height="12" rx="2" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
  <text x="132" y="578" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">核心安全边界层（免全局 CGEventTap，仅中性化目标 HID 服务并校验所有权）</text>
  <rect x="568" y="568" width="16" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="592" y="578" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">纯用户态 HID 解码、双契约预设管理与 60Hz 交互执行层</text>
</svg>
