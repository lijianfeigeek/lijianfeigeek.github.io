<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-iphone-duo-convergence-nanotexture-title apple-ternus-iphone-duo-convergence-nanotexture-desc">
  <title id="apple-ternus-iphone-duo-convergence-nanotexture-title">iPhone Duo 折叠屏工业最优解汇聚与纳米纹理降维打击</title>
  <desc id="apple-ternus-iphone-duo-convergence-nanotexture-desc">采百家之长汇聚行业八年成熟方案（Apple Can Do Too），辅以传承自 Pro Display XDR 7年积累的无掩膜激光纳米纹理（Only Apple Can Do）物理消解折痕反光</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="conv-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left Zone: Industry 8-Year Exploration (Apple Can Do Too) -->
  <g transform="translate(40, 24)">
    <rect width="360" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" class="label-badge" fill="#64748b">行业八年摸索最优解 · Apple Can Do Too</text>
    <text x="16" y="48" class="label-title">各路豪杰物理极限探路</text>
    <line x1="16" y1="60" x2="344" y2="60" stroke="#f1f5f9" stroke-width="1"/>

    <!-- 4 Sub-cards -->
    <g transform="translate(16, 72)">
      <rect width="328" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">荣耀 Magic 系列</text>
      <text x="12" y="40" class="text-body">AI 互补公差筛选：突-突-凹对冲凹-凹-凸消除组装缝隙</text>
    </g>

    <g transform="translate(16, 134)">
      <rect width="328" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">OPPO Find N 系列</text>
      <text x="12" y="40" class="text-body">激光干涉扫描 + 3D 光敏聚合物打印精准补偿微凹</text>
    </g>

    <g transform="translate(16, 196)">
      <rect width="328" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">三星 Galaxy Z Fold 系列</text>
      <text x="12" y="40" class="text-body">底层高强钛合金支撑底板，提供结构刚度</text>
    </g>

    <g transform="translate(16, 258)">
      <rect width="328" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">小米 MIX Fold 系列</text>
      <text x="12" y="40" class="text-body">超薄碳纤维复合力学衬层，强力吸收反复弯折应力</text>
    </g>
  </g>

  <!-- Convergence to iPhone Duo Core Hardware -->
  <path d="M 400 190 L 438 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#conv-arrow)"/>

  <!-- Mid Box: Duo Core -->
  <g transform="translate(440, 105)">
    <rect width="180" height="170" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="90" y="32" text-anchor="middle" class="label-title">iPhone Duo</text>
    <text x="90" y="52" text-anchor="middle" class="label-badge" fill="#0284c7">百家之长汇聚一体</text>
    <line x1="16" y1="66" x2="164" y2="66" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="90" text-anchor="middle" class="text-body">5.2mm 极限薄机身</text>
    <text x="90" y="112" text-anchor="middle" class="text-body">摄像头岛原器件重构</text>
    <text x="90" y="134" text-anchor="middle" class="text-body">双电芯定制电量平衡</text>
    <text x="90" y="154" text-anchor="middle" class="tag-coral">结构与工艺彻底扎实</text>
  </g>

  <!-- Connect to Secret Weapon -->
  <path d="M 620 190 L 658 190" stroke="#bf4520" stroke-width="1.5" marker-end="url(#conv-arrow)"/>

  <!-- Right Zone: Nano-texture (Only Apple Can Do - Focal) -->
  <g transform="translate(660, 24)">
    <rect width="260" height="330" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#bf4520"/>
    <text x="16" y="26" class="label-badge" fill="#bf4520">独家降维核武 · Only Apple Can Do</text>
    <text x="16" y="48" class="label-title" fill="#9a3412">纳米纹理 Nano-texture</text>
    <line x1="16" y1="60" x2="244" y2="60" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(16, 75)">
      <text x="0" y="0" class="text-feat" fill="#9a3412">✦ 传承自 Pro Display XDR</text>
      <text x="0" y="20" class="text-body">历经 7 年超高精密微纳加工沉淀</text>
      <text x="0" y="52" class="text-feat" fill="#9a3412">✦ 无掩膜激光微秒刻蚀</text>
      <text x="0" y="72" class="text-body">在聚合物薄膜直接雕琢微纳随机漫反射</text>
      <text x="0" y="104" class="text-feat" fill="#9a3412">✦ “又糊又清晰”物理奇迹</text>
      <text x="0" y="124" class="text-body">消解折痕处高光镜面集中亮线</text>
      <text x="0" y="144" class="text-body">保留 OLED 纯黑与视网膜超清对比度</text>
      <text x="0" y="174" class="tag-coral">折痕被自然融化在环境背景光中</text>
    </g>
  </g>
</svg>