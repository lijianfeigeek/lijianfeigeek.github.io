<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-background-drain-stats-title ios-noir-background-drain-stats-desc" id="ios-noir-background-drain-stats-root">
        <title id="ios-noir-background-drain-stats-title">静默暗涌：锁屏静置 1 小时后台进程资源消耗实测</title>
        <desc id="ios-noir-background-drain-stats-desc">iPhone 锁屏静置 1 小时内，各主流应用后台进程消耗 CPU 时间与磁盘读取量对比</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-background-drain-stats-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-background-drain-stats-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-background-drain-stats-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-background-drain-stats-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-background-drain-stats-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-background-drain-stats-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Grid of 4 monitored apps -->
        <!-- App 1: WhatsApp (Focal) -->
        <g transform="translate(40, 40)">
          <rect x="0" y="0" width="205" height="280" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="205" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">WHATSAPP · PID 330</text>

          <g transform="translate(14, 52)">
            <text x="0" y="18" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">锁屏静默驻留 1 小时</text>
            
            <text x="0" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">CPU 累计消耗：</text>
            <text x="0" y="68" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="16" font-weight="600">105.7 秒</text>

            <text x="0" y="100" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">磁盘读取吞吐：</text>
            <text x="0" y="120" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="15" font-weight="600">411.5 MB</text>

            <text x="0" y="152" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">磁盘写入量：</text>
            <text x="0" y="172" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="15" font-weight="600">83.6 MB</text>

            <text x="0" y="206" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">VoIP 特批通道持续保活唤醒</text>
          </g>
        </g>

        <!-- App 2: Instagram -->
        <g transform="translate(265, 40)">
          <rect x="0" y="0" width="205" height="280" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">INSTAGRAM · PID 539</text>

          <g transform="translate(14, 52)">
            <text x="0" y="18" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">后台隐蔽唤醒</text>
            
            <text x="0" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">CPU 累计消耗：</text>
            <text x="0" y="68" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="16" font-weight="600">35.6 秒</text>

            <text x="0" y="100" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">磁盘读取吞吐：</text>
            <text x="0" y="120" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="15" font-weight="600">195.0 MB</text>

            <text x="0" y="152" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">主要后台行为：</text>
            <text x="0" y="172" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">预加载推荐信息流视频与图片</text>

            <text x="0" y="206" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">暗中同步用户画像与点赞标签</text>
          </g>
        </g>

        <!-- App 3: 美团通知替身 -->
        <g transform="translate(490, 40)">
          <rect x="0" y="0" width="205" height="280" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">美团替身 · PID 56726</text>

          <g transform="translate(14, 52)">
            <text x="0" y="18" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">主程序被杀后拉起</text>
            
            <text x="0" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">进程状态：</text>
            <text x="0" y="68" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="13" font-weight="600">系统强行拉起 Extension</text>

            <text x="0" y="100" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">磁盘读取吞吐：</text>
            <text x="0" y="120" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="15" font-weight="600">16.57 MB</text>

            <text x="0" y="152" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">后台通信行为：</text>
            <text x="0" y="172" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">建立外联 Socket 回传传感器</text>

            <text x="0" y="206" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">完成定位缓存刷写</text>
          </g>
        </g>

        <!-- App 4: 小红书通知替身 -->
        <g transform="translate(715, 40)">
          <rect x="0" y="0" width="205" height="280" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">小红书替身 · PID 55925</text>

          <g transform="translate(14, 52)">
            <text x="0" y="18" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">主程序被杀后拉起</text>
            
            <text x="0" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">进程状态：</text>
            <text x="0" y="68" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="13" font-weight="600">系统强行拉起 Extension</text>

            <text x="0" y="100" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">磁盘读取吞吐：</text>
            <text x="0" y="120" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="15" font-weight="600">22.65 MB</text>

            <text x="0" y="152" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">后台通信行为：</text>
            <text x="0" y="172" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">读取共享沙盒，暗中上报指纹</text>

            <text x="0" y="206" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">静默完成个性化推荐分发</text>
          </g>
        </g>
      </svg>
