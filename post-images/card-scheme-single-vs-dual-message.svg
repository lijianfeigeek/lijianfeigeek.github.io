<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-single-vs-dual-message-title card-scheme-single-vs-dual-message-desc" id="card-scheme-single-vs-dual-message-root">
        <title id="card-scheme-single-vs-dual-message-title">联机交易双轨制：单信息（SMS）vs 双信息（DMS）架构对比</title>
        <desc id="card-scheme-single-vs-dual-message-desc">借记卡实时扣账单信息流与信用卡预占转批量扣款双信息流的底层协议差异</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-single-vs-dual-message-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-single-vs-dual-message-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-single-vs-dual-message-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-single-vs-dual-message-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-single-vs-dual-message-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-single-vs-dual-message-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Left: Single-Message System (SMS) -->
        <g transform="translate(40, 24)">
          <rect x="0" y="0" width="420" height="330" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="420" height="36" rx="8" fill="#f8f9fa"/>
          <text x="16" y="24" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">单信息系统 (SMS · Single-Message)</text>

          <g transform="translate(20, 56)">
            <rect x="0" y="0" width="380" height="60" rx="4" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1" fill-opacity="0.05"/>
            <text x="14" y="24" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">一次握手完成：授权即扣款</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">典型场景：ATM 取现、借记卡 PIN 交易、商超即时结账</text>
          </g>

          <g transform="translate(20, 130)">
            <rect x="0" y="0" width="380" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">报文机制：0200 / 0210 联机交易</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 授权报文直接携带最终清算请款标记</text>
            <text x="14" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 联机通过瞬间发卡行借记持卡人活期账户</text>
            <text x="14" y="82" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 无需后续二次批量上送 1240 清分文件</text>
          </g>

          <g transform="translate(20, 234)">
            <rect x="0" y="0" width="380" height="70" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">优劣势：强实时性 vs 缺乏弹性</text>
            <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">优点：系统链路极简，资金即时确认，无预占滞纳；</text>
            <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">缺点：不支持小费追加、离线分期与动态调价。</text>
          </g>
        </g>

        <!-- Right: Dual-Message System (DMS) Focal -->
        <g transform="translate(500, 24)">
          <rect x="0" y="0" width="420" height="330" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="36" rx="8" fill="#bf4520" fill-opacity="0.06"/>
          <text x="16" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">双信息系统 (DMS · Dual-Message · FOCAL)</text>

          <g transform="translate(20, 56)">
            <rect x="0" y="0" width="380" height="60" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.05"/>
            <text x="14" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">两次分离：联机授权预占 + 离线批量清分</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">典型场景：酒店预授权、租车押金、餐饮小费追加、跨境海淘</text>
          </g>

          <g transform="translate(20, 130)">
            <rect x="0" y="0" width="380" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">报文机制：1100 联机 + 1240 批量</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 第一阶段：1100 仅校验卡片信誉并冻结信用额度</text>
            <text x="14" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 第二阶段：商户按实际消费金额上送 1240 请款入账</text>
            <text x="14" y="82" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 最终结算金额允许在授权金额约定浮动区间内调整</text>
          </g>

          <g transform="translate(20, 234)">
            <rect x="0" y="0" width="380" height="70" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">优劣势：极高业务弹性 vs 对账复杂度高</text>
            <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">优点：支持预授权完成、超时自动释放与灵活调单；</text>
            <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">缺点：存在单边账、超额扣款争议与跨期对账差错。</text>
          </g>
        </g>
      </svg>
