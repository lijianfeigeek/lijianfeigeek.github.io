<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="vmipad-layers-title vmipad-layers-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="vmipad-layers-title">Virtual Mac on iPad 四层跨代虚拟化堆栈架构</title>
  <desc id="vmipad-layers-desc">展示 VirtualMacOniPad 如何将 macOS 13.2.1 (22D68) 的 Hypervisor、Virtualization 与 ParavirtualizedGraphics 栈逆向重织，并通过 AGX BC1-7 纹理逆向移植、Mach 端口匿名 XPC 握手与 Guest OpenGL 垫片运行在 iPadOS 14 至 16.3.1 硬件上。</desc>
  <defs>
    <marker id="vml-arrow-up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 9 L 5 1 L 9 9 z" fill="#64748b"/>
    </marker>
    <marker id="vml-arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 5 9 L 9 1 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">Virtual Mac on iPad 四层跨系统虚拟化堆栈</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">MACOS 12–27 GUEST ON M1/M2 IPADOS 14.0–16.3.1 (APPLE HV + PVG + GLDRENDERERMETAL)</text>
    <text x="860" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: LAYER STACK</text>
  </g>

  <!-- Left margin vertical direction indicators -->
  <g transform="translate(40, 104)">
    <line x1="16" y1="20" x2="16" y2="212" stroke="#64748b" stroke-width="1.2" marker-start="url(#vml-arrow-up)"/>
    <text x="28" y="120" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600">GUEST ABI</text>
    <line x1="16" y1="264" x2="16" y2="464" stroke="#0284c7" stroke-width="1.2" marker-end="url(#vml-arrow-down)"/>
    <text x="28" y="368" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">METAL / HV</text>
  </g>

  <!-- L4: macOS Guest & OpenGL/Input Enhancement -->
  <g transform="translate(148, 104)">
    <rect x="0" y="0" width="772" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L4</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">macOS 12–27 客体层与 Guest 侧 OpenGL / OpenCL 加速垫片</text>
    <text x="76" y="54" font-size="12" fill="#334155">原生运行 Xcode、Final Cut Pro、Logic Pro；OpenGLPVGCompat.m 劫持 IOGLBundleName 激活 AppleMetalOpenGLRenderer</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">supportsFamily:1007 (Apple7) · Rosetta 16KiB 顶点内联快照 · _VZTouch 直触 UUID 绑定 · 120Hz vsock 手柄</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" font-weight="600" text-anchor="end">GUEST WORKLOAD</text>
  </g>

  <!-- L3: Host Compatibility Shims & AGX Backport (FOCAL LAYER) -->
  <g transform="translate(148, 216)">
    <rect x="0" y="0" width="772" height="156" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c" text-anchor="middle">L3</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">宿主运行时兼容垫片与硬件特性逆向移植层（跨系统破壁核心）</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" font-weight="700" text-anchor="end">FOCAL · RUNTIME SHIMS</text>

    <!-- Sub-card Left: Metal & AGX BC1-7 Backport -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="364" height="92" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#be123c">图形桥接与 iPadOS 16.4 BC 纹理逆向移植</text>
      <text x="16" y="46" font-size="11" fill="#334155">metalshim 补齐 MTLCopyAllDevices 与 Managed→Shared</text>
      <text x="16" y="65" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">Hook AGXMetal* FormatChooser 注入 14 条 0x60B 表项</text>
      <text x="16" y="81" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">三版本 pvg_display.metallib (Metal 3.0 / 2.4 / 2.3)</text>
    </g>

    <!-- Sub-card Right: XPC Rendezvous, VMM Surgery & USB Bridge -->
    <g transform="translate(396, 48)">
      <rect x="0" y="0" width="360" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#0f172a">无 Launchd XPC 握手与用户态 DFU USB</text>
      <text x="16" y="46" font-size="11" fill="#334155">vzxpchook 经 task_for_pid 注入匿名端口 (E+0x18)</text>
      <text x="16" y="65" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">installation_usb_shim 伪造 0x766d* IOKit 句柄</text>
      <text x="16" y="81" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">NSViewShim 桥接 UIView + 静默 CGS 触控板震动</text>
    </g>
  </g>

  <!-- L2: Extracted & Re-woven macOS 22D68 Stack -->
  <g transform="translate(148, 388)">
    <rect x="0" y="0" width="772" height="96" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0369a1" text-anchor="middle">L2</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">macOS 13.2.1 (22D68) 逆向提取与重织框架层</text>
    <text x="76" y="54" font-size="12" fill="#334155">uncache.py + ipsw-a2sb 将共享缓存碎片重建为合法 arm64e Mach-O，并通过 stamp_ios.py 改写平台位</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">Hypervisor · Virtualization · ParavirtualizedGraphics · MetalSerializer · vmnet · VirtualMachine.xpc · Big Sur HV14</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">EXTRACTED FRAMEWORKS</text>
  </g>

  <!-- L1: iPadOS 14-16.3.1 Kernel & Apple Silicon Hardware -->
  <g transform="translate(148, 500)">
    <rect x="0" y="0" width="772" height="88" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L1</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">iPadOS 14.0–16.3.1 XNU 内核与 M1 / M2 硬件底座</text>
    <text x="76" y="54" font-size="12" fill="#334155">越狱释放 EL2 Hypervisor 硬件虚拟化与 AGX GPU 直通（iPadOS 16.4 起内核移除了 Hypervisor 支持）</text>
    <text x="76" y="72" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">memorystatus_control 放宽 2x 物理内存高水位防 PVG 重复记账误杀 · 宿主 UI 优先级 190 高于 VMM 180</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600" text-anchor="end">XNU EL2 + AGX</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 616)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" font-weight="700">LEGEND</text>
    <rect x="76" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="24" font-size="11" fill="#334155">核心运行时兼容垫片与 AGX BC 逆向移植</text>
    <rect x="336" y="13" width="14" height="14" rx="3" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <text x="358" y="24" font-size="11" fill="#334155">arm64e 重织框架层</text>
    <rect x="496" y="13" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="518" y="24" font-size="11" fill="#334155">XNU EL2 与 M1/M2 基座</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">SOURCE: VirtualMac/vz &amp; scripts</text>
  </g>
</svg>
