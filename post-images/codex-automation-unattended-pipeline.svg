<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="240" viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-automation-unattended-pipeline-title codex-automation-unattended-pipeline-desc" id="codex-automation-unattended-pipeline-root">
      <title id="codex-automation-unattended-pipeline-title">Codex 自动化无人值守运维闭环管线</title>
      <desc id="codex-automation-unattended-pipeline-desc">由定时 Automation 唤醒、独立 Worktree 执行、/goal 跨会话状态锚定与 Triage 收件箱过滤组成的无人值守流</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-automation-unattended-pipeline-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-automation-unattended-pipeline-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-automation-unattended-pipeline-root .mono { font-family: "Geist Mono", monospace; }
      #codex-automation-unattended-pipeline-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-automation-unattended-pipeline-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-automation-unattended-pipeline-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-automation-unattended-pipeline-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Stage 1: Automation -->
        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="190" height="150" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="190" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">STAGE 1: TRIGGER</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">Automation 定时触发</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 基于 Cron 定时计划唤醒</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 支持依赖变更或事件钩子</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 自动注入执行上下文与 Prompt</text>
          <text x="12" y="132" font-size="11" font-weight="500" fill="#2e5aa8">无缝夜间/周期性自动拉起</text>
        </g>

        <!-- Stage 2: Worktree -->
        <g transform="translate(265, 40)">
          <rect x="0" y="0" width="190" height="150" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="190" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">STAGE 2: ISOLATION</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">Worktree 物理沙盒</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 独立检出专用临时分支</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 完全不干扰本地工作树与编辑器</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 独立运行长耗时构建与测试</text>
          <text x="12" y="132" font-size="11" font-weight="500" fill="#2e5aa8">零踩踏物理隔离运行</text>
        </g>

        <!-- Stage 3: /goal (Focal) -->
        <g transform="translate(500, 40)">
          <rect x="0" y="0" width="190" height="150" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="190" height="26" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#bf4520" class="mono">STAGE 3: PERSISTENCE</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#bf4520">/goal 目标跨轮状态机</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 跨会话 /clear 保持终局目标</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.8">• 动态维护已达标/待执行清单</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.8">• 自动压缩历史释放上下文</text>
          <text x="12" y="132" font-size="11" font-weight="600" fill="#bf4520">强目标驱动直到完全验收</text>
        </g>

        <!-- Stage 4: Triage -->
        <g transform="translate(735, 40)">
          <rect x="0" y="0" width="195" height="150" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="195" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">STAGE 4: TRIAGE</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">Triage 过滤收件箱</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 自动归档无异常执行记录</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 仅向人类呈递需决策的关键结果</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 附带高质量 Pull Request 草稿</text>
          <text x="12" y="132" font-size="11" font-weight="500" fill="#2d3142">人类精力聚焦最终审批</text>
        </g>

        <!-- Pipeline Connectors -->
        <path d="M 220 115 L 265 115" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-automation-unattended-pipeline-arrow-default)" opacity="0.6"/>
        <path d="M 455 115 L 500 115" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#codex-automation-unattended-pipeline-arrow-accent)"/>
        <path d="M 690 115 L 735 115" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-automation-unattended-pipeline-arrow-default)" opacity="0.6"/>
      </g>
    </svg>
