<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futu-tiger-litigation-current-status-and-future-tracks-title futu-tiger-litigation-current-status-and-future-tracks-desc">
  <title id="futu-tiger-litigation-current-status-and-future-tracks-title">富途老虎期权案：中场哨响与后半程民事诉讼三大推演走向</title>
  <desc id="futu-tiger-litigation-current-status-and-future-tracks-desc">梳理资产解冻作为中场哨响的战略影响，以及证据开示翻盘、简易判决驳回与庭外秘密和解三大推演走向</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #047857; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">富途老虎期权案战局纵深：中场哨响与后半程三大推演走向</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">裁判拒绝给红牌绝不等于比赛提前结束：解冻不等于无罪，做市商失去最大威慑底牌后陷入举证泥潭</text>

  <!-- Left: Current Status -->
  <g transform="translate(40, 80)">
    <rect width="280" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="280" height="34" rx="8" fill="#f1f5f9"/>
    <text x="140" y="22" class="card-title" text-anchor="middle">当前节点：中场哨响而非终局裁决</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title" fill="#047857">✅ 初步禁令被驳回 (PI Denied)</text>
      <text x="0" y="32" class="text-sub">• 券商扣押风控解除，资金重获流动性</text>
      <text x="0" y="50" class="text-sub">• 被告具备充沛资金抗辩与聘请律师底气</text>
      <line x1="0" y1="70" x2="248" y2="70" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="90" class="badge-coral">⚠️ 做市商丧失核心战略威慑筹码</text>
      <text x="0" y="108" class="text-sub">• 原告无法继续施加长期资产冻结窒息感</text>
      <text x="0" y="126" class="text-sub">• 必须在证据开示阶段正面攻坚跨境取证</text>
      <line x1="0" y1="144" x2="248" y2="144" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="162" class="card-title">法理核心：法院未判定被告无罪</text>
      <text x="0" y="178" class="text-sub">仅判定目前单薄证据不满足诉前扣押门槛</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 320 197 L 350 197 L 350 120 L 370 120" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 320 197 L 370 197" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 320 197 L 350 197 L 350 275 L 370 275" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Right: 3 Tracks -->
  <!-- Track A -->
  <g transform="translate(370, 80)">
    <rect width="550" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <text x="0" y="14" class="card-title">走向 A：证据开示阶段 (Discovery) 挖出实质沟通记录</text>
      <text x="0" y="34" class="text-sub">若调取到关键当事人微信聊天记录或境内利益往来对价，原告可逆风翻盘正式定罪并追讨损失</text>
    </g>
  </g>

  <!-- Track B -->
  <g transform="translate(370, 162)">
    <rect width="550" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <text x="0" y="14" class="card-title" fill="#b91c1c">走向 B：跨境取证受阻，法院在动议阶段 (Summary Judgment) 直接驳回</text>
      <text x="0" y="34" class="text-sub">面对境内数据调取壁垒，做市商无法完成举证责任闭环，法官在正式开庭前直接裁决驳回诉讼</text>
    </g>
  </g>

  <!-- Track C (Focal Coral) -->
  <g transform="translate(370, 245)">
    <rect width="550" height="70" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <g transform="translate(16, 18)">
      <text x="0" y="14" class="badge-coral">走向 C：双方走向庭外保密和解 (Settlement，概率最高路径)</text>
      <text x="0" y="34" class="text-sub">做市商获得部分象征性回血补偿以挽回颜面，被告让渡极小比例浮盈以规避跨年诉讼内耗</text>
    </g>
  </g>
</svg>