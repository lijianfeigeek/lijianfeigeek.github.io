  <text x="610" y="367" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#bf4520">FIX</text>

  <!-- C4: N5(top x=684, y=348) -> N2(right/bottom): push fix commits to PR (left of N5 to N2 bottom x=548) -->
  <path d="M 684 348 L 684 276 Q 684 268 676 268 L 592 268" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#cs-arrow-accent)"/>
  <rect x="610" y="246" width="72" height="16" rx="2" fill="#f8fafc"/>
  <text x="646" y="257" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#bf4520">PUSH ≤3 ROUNDS</text>

  <!-- C5: N5(top x=756, y=348) -> N4(bottom x=756, y=180): Escalation / Steering (dashed) -->
  <line x1="756" y1="348" x2="756" y2="180" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#cs-arrow-muted)"/>
  <rect x="764" y="210" width="68" height="16" rx="2" fill="#f8fafc"/>
  <text x="798" y="221" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">ESCALATE</text>

  <!-- C6: N4(bottom x=716, y=180) -> N5(top x=716, y=348): @claude steer -->
  <line x1="716" y1="180" x2="716" y2="348" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#cs-arrow-muted)"/>
  <rect x="638" y="210" width="70" height="16" rx="2" fill="#f8fafc"/>
  <text x="673" y="221" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">@CLAUDE STEER</text>

  <!-- C7: N5(right y=384, x=816) -> N7(left x=844, y=384) -->
  <line x1="816" y1="384" x2="844" y2="384" stroke="#475569" stroke-width="1.4" marker-end="url(#cs-arrow-muted)"/>

  <!-- C8: N7(bottom x=920, y=420) -> N6(right x=816, y=498) -->
  <path d="M 920 420 L 920 490 Q 920 498 912 498 L 816 498" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#cs-arrow-muted)"/>
  <rect x="836" y="476" width="76" height="16" rx="2" fill="#f8fafc"/>
  <text x="874" y="487" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">HIGH RISK GATE</text>

  <!-- C9: N7(top x=888, y=348) -> N8(bottom x=888, y=300) -->
  <line x1="888" y1="348" x2="888" y2="300" stroke="#0284c7" stroke-width="1.4" marker-end="url(#cs-arrow-link)"/>
  <rect x="812" y="314" width="68" height="16" rx="2" fill="#f8fafc"/>
  <text x="846" y="325" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#0284c7">CHECK PASS</text>

  <!-- C10: N6(right edge top half y=476? No, N6 top x=768 to N8 bottom x=952) -->
  <path d="M 768 464 L 768 448 Q 768 440 776 440 L 944 440 Q 952 440 952 432 L 952 300" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#cs-arrow-muted)"/>
  <rect x="958" y="314" width="48" height="16" rx="2" fill="#f8fafc"/>
  <text x="982" y="325" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">HUMAN</text>

  <!-- Node 1: Local CLI -->
  <g transform="translate(180, 108)">
    <rect x="0" y="0" width="188" height="72" rx="6" fill="#f8fafc"/>
    <rect x="0" y="0" width="188" height="72" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="8" y="8" width="64" height="14" rx="2" fill="none" stroke="#475569" stroke-width="0.8"/>
    <text x="40" y="18" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="7.5" fill="#475569">LOCAL CLI</text>
    <text x="12" y="40" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">本地预检与 /ship 发起</text>
    <text x="12" y="58" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">/code-review · 拒碰 .env/.claude</text>
  </g>

