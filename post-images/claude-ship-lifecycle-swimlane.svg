    <rect x="8" y="8" width="68" height="14" rx="2" fill="none" stroke="#475569" stroke-width="0.8"/>
    <text x="42" y="18" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="7.5" fill="#475569">STEERING</text>
    <text x="12" y="40" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">人工纠偏或熔断接管</text>
    <text x="12" y="58" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">@claude 指令 · @claude stop</text>
