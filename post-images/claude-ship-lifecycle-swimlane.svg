<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="claude-ship-swimlane-title claude-ship-swimlane-desc" id="claude-ship-swimlane-root" data-diagram="swimlane">
  <title id="claude-ship-swimlane-title">Claude Ship 跨特权域 PR 自动化闭环泳道图</title>
  <desc id="claude-ship-swimlane-desc">展示开发者本地终端、GitHub PR、Anthropic 云端三代理（Code Review、PR Steward、Claude Approvals）与人类评审席位之间的跨域协同与熔断接管流转。</desc>
  <defs>
    <pattern id="cs-swim-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.22"/>
    </pattern>
    <marker id="cs-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="cs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="cs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Paper Background -->
  <rect width="1040" height="620" fill="#f8fafc"/>
  <rect width="1040" height="620" fill="url(#cs-swim-dots)"/>

  <!-- Header -->
  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Post-PR Autonomous Lifecycle: /ship, Review, Steward &amp; Approvals</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">CROSS-BOUNDARY SWIMLANE · LOCAL CLI TO ANTHROPIC CLOUD SANDBOX &amp; GITHUB BRANCH PROTECTION</text>

  <!-- Swimlane Backgrounds & Dividers -->
  <rect x="32" y="84" width="976" height="120" fill="#ffffff" opacity="0.65"/>
  <rect x="32" y="204" width="976" height="120" fill="#f1f5f9" opacity="0.55"/>
  <rect x="32" y="324" width="976" height="120" fill="#ffffff" opacity="0.65"/>
  <rect x="32" y="444" width="976" height="104" fill="#f1f5f9" opacity="0.55"/>

  <rect x="32" y="84" width="976" height="464" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="156" y1="84" x2="156" y2="548" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="32" y1="204" x2="1008" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="32" y1="324" x2="1008" y2="324" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="32" y1="444" x2="1008" y2="444" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Lane Labels (Left Column x=32..156) -->
  <g transform="translate(44, 128)">
    <text x="0" y="0" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LANE 01</text>
    <text x="0" y="18" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">开发者本地</text>
    <text x="0" y="34" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">Claude Code CLI</text>
  </g>
  <g transform="translate(44, 248)">
    <text x="0" y="0" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#0284c7">LANE 02</text>
    <text x="0" y="18" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">GitHub 平台</text>
    <text x="0" y="34" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">PR · Checks · Rules</text>
  </g>
  <g transform="translate(44, 368)">
    <text x="0" y="0" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#bf4520">LANE 03</text>
    <text x="0" y="18" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Anthropic 云端</text>
    <text x="0" y="34" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">Claude Ship Agents</text>
  </g>
  <g transform="translate(44, 480)">
    <text x="0" y="0" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#059669">LANE 04</text>
    <text x="0" y="18" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">人类评审闸门</text>
    <text x="0" y="34" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">Owners &amp; Seats</text>
  </g>

  <!--
    Node Grid (aligned to 4px):
    Col A (x=180..368, w=188):
      N1 (Lane 0): x=180, y=108, w=188, h=72  (center 274, 144)
    Col B (x=404..592, w=188):
      N2 (Lane 1): x=404, y=228, w=188, h=72  (center 498, 264)
      N3 (Lane 2): x=404, y=348, w=188, h=72  (center 498, 384)
    Col C (x=628..816, w=188):
      N4 (Lane 0): x=628, y=108, w=188, h=72  (center 722, 144) -> Human @claude steering / 3-round escalation
      N5 (Lane 2): x=628, y=348, w=188, h=72  (center 722, 384) -> PR Steward (FOCAL)
      N6 (Lane 3): x=628, y=464, w=188, h=68  (center 722, 498) -> Human Seats (!pr/authors)
    Col D (x=844..996, w=152):
      N7 (Lane 2): x=844, y=348, w=152, h=72  (center 920, 384) -> Claude Approvals (FOCAL)
      N8 (Lane 1): x=844, y=228, w=152, h=72  (center 920, 264) -> Merge Queue & Main
  -->

  <!-- Connectors (drawn BEFORE boxes) -->
  <!-- C1: N1(right y=144, x=368) -> elbow down to N2(top x=468, y=228) -->
  <path d="M 368 144 L 460 144 Q 468 144 468 152 L 468 228" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#cs-arrow-link)"/>
  <rect x="378" y="120" width="76" height="16" rx="2" fill="#f8fafc"/>
  <text x="416" y="131" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#0284c7">/SHIP OPEN PR</text>

  <!-- C2: N2(bottom x=498, y=300) -> N3(top x=498, y=348) -->
  <line x1="498" y1="300" x2="498" y2="348" stroke="#0284c7" stroke-width="1.4" marker-end="url(#cs-arrow-link)"/>
  <rect x="506" y="314" width="64" height="16" rx="2" fill="#f8fafc"/>
  <text x="538" y="325" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#0284c7">WEBHOOK</text>

