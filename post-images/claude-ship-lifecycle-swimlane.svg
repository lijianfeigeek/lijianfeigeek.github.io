    <text x="12" y="40" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Code Review 多视角审查</text>
    <text x="12" y="58" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">Quick/Std/Deep · 对抗投票去噪</text>
  </g>

