  <rect x="112" y="574" width="16" height="12" rx="2" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.2"/>
  <text x="136" y="584" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">新晋 Beta 核心代理（Steward / Approvals）</text>

