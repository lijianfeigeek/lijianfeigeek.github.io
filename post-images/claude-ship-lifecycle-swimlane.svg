    <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">人类最终签字席位</text>
    <text x="12" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">高敏路径强制 !pr/authors</text>
