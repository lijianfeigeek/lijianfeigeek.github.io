<svg width="960" height="350" viewBox="0 0 960 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polylane-traditional-vs-fastpath-architecture-title polylane-traditional-vs-fastpath-architecture-desc">
  <title id="polylane-traditional-vs-fastpath-architecture-title">传统全量生成式 LLM vs 快慢分工双轨架构对比</title>
  <desc id="polylane-traditional-vs-fastpath-architecture-desc">对比传统自回归全量生成的高延迟与采用 TypeSafe Jev 离散微决策的双轨架构</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="350" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Traditional Architecture (System 2 Overkill) -->
  <g transform="translate(24, 20)">
    <rect width="440" height="310" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="36" rx="8" fill="#f3f4f6"/>
    <path d="M0 28 h440 v8 h-440 z" fill="#f3f4f6"/>
    <text x="16" y="23" class="label-title">传统全量生成式 LLM 架构（全盘重载）</text>
    <text x="350" y="23" class="text-code" fill="#9ca3af">单步 2~5s</text>

    <!-- Node 1 -->
    <g transform="translate(16, 50)">
      <rect width="408" height="52" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="22" class="label-title">海量事件流输入 + JSON Schema 强约束</text>
      <text x="12" y="40" class="text-code">Prompt 注入防御规则 / 冗余上下文模板拼接</text>
    </g>

    <!-- Arrow Down -->
    <path d="M 220 102 L 220 118" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="217,118 223,118 220,124" fill="#9ca3af"/>

    <!-- Node 2: High Latency Center -->
    <g transform="translate(16, 126)">
      <rect width="408" height="60" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="12" y="24" class="label-title" fill="#e11d48">千亿参数自回归解码 (TTFT 1.5s ~ 5.5s)</text>
      <text x="12" y="44" class="text-body" fill="#9f1239">串行预测 Token，承受沉重“JSON 格式税”与 KV Cache 压力</text>
    </g>

    <!-- Arrow Down -->
    <path d="M 220 186 L 220 202" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="217,202 223,202 220,208" fill="#9ca3af"/>

    <!-- Node 3 -->
    <g transform="translate(16, 210)">
      <rect width="408" height="52" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="22" class="label-title">纯文本输出与容错解析清洗</text>
      <text x="12" y="40" class="text-code">自回归提取字符串 '{"decision": "yes"}' / 正则过滤</text>
    </g>

    <!-- Cost tag -->
    <g transform="translate(16, 274)">
      <rect width="408" height="24" rx="4" fill="#f3f4f6"/>
      <text x="12" y="16" class="text-code" fill="#6b7280">痛点：延迟不可控引发警报风暴雪崩，无真实先验置信度</text>
    </g>
  </g>

  <!-- Right: Modern Dual-Rail Architecture (Jev System 1) -->
  <g transform="translate(496, 20)">
    <rect width="440" height="310" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="36" rx="8" fill="#fff7ed"/>
    <path d="M0 28 h440 v8 h-440 z" fill="#fff7ed"/>
    <text x="16" y="23" class="label-title" fill="#9a3412">快慢分工的双轨架构（Jev + System 2）</text>
    <text x="360" y="23" class="tag-coral">70~500ms</text>

    <!-- Node 1 -->
    <g transform="translate(16, 50)">
      <rect width="408" height="52" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="22" class="label-title">结构化 State 与强类型 Questions 输入</text>
      <text x="12" y="40" class="text-code">零 Prompt 模板 / 纯状态字段映射</text>
    </g>

    <!-- Arrow Down -->
    <path d="M 220 102 L 220 118" fill="none" stroke="#bf4520" stroke-width="1.5"/>
    <polygon points="217,118 223,118 220,124" fill="#bf4520"/>

    <!-- Node 2: Jev Fastpath (Coral Accent) -->
    <g transform="translate(16, 126)">
      <rect width="408" height="60" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
      <text x="12" y="24" class="label-title" fill="#9a3412">TypeSafe Jev 离散决策引擎 (~300ms)</text>
      <text x="12" y="44" class="text-body" fill="#7c2d12">非自回归概率裁决 / 零输出 Token / 严格数学置信度</text>
    </g>

    <!-- Dual Branch Paths -->
    <path d="M 130 186 L 130 208" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="127,208 133,208 130,214" fill="#10b981"/>
    
    <path d="M 310 186 L 310 208" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <polygon points="307,208 313,208 310,214" fill="#6366f1"/>

    <!-- Left Sub: Fastpath Return -->
    <g transform="translate(16, 216)">
      <rect width="194" height="46" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" fill="#065f46" font-size="12">常规分类 / 过滤静默</text>
      <text x="10" y="36" class="text-code" fill="#047857">就地裁决 / 零额外成本</text>
    </g>

    <!-- Right Sub: Escalate to System 2 -->
    <g transform="translate(230, 216)">
      <rect width="194" height="46" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="10" y="20" class="label-title" fill="#3730a3" font-size="12">唤醒 System 2 LLM</text>
      <text x="10" y="36" class="text-code" fill="#4338ca">仅限高熵复杂长程推理</text>
    </g>

    <!-- Advantage Tag -->
    <g transform="translate(16, 274)">
      <rect width="408" height="24" rx="4" fill="#fff7ed"/>
      <text x="12" y="16" class="text-code" fill="#9a3412">收益：P90 提速 9.4 倍（↓89.3%），千次调用成本下降 39.1%</text>
    </g>
  </g>
</svg>