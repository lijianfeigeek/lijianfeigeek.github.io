<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="tx-mcp-title tx-mcp-desc">
  <title id="tx-mcp-title">Tracexy 本地安全沙盒与 MCP / AI 智能体协同流水线</title>
  <desc id="tx-mcp-desc">展示 Tracexy 在完全不上传任何数据到云端的前提下，如何通过只读 stdio MCP 服务与环回 Ollama 大模型协同实现网络会话与证据链的智能分析。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #991b1b; }
    .card-coral-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #b91c1c; }
    .card-blue-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #1e40af; }
    .card-blue-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #2563eb; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Tracexy 本地安全沙盒与 MCP / AI 智能体协同流水线</text>
    <text class="subtitle" x="0" y="20">零云端上传、零网络监听端口，通过令牌授权只读 stdio 与环回大模型构筑安全智能分析闭环</text>
  </g>

  <!-- Flow Stages Container -->
  <g transform="translate(48, 86)">
    
    <!-- Stage 1: Local SQLite Storage &amp; Grant Token -->
    <g transform="translate(0, 0)">
      <rect width="270" height="380" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="stage-title" fill="#f8fafc" x="16" y="28">1. 本地沙盒数据源与鉴权</text>

      <!-- Box 1-1: SQLite History DB -->
      <g transform="translate(16, 44)">
        <rect width="238" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="20">SQLite 本地历史库 (History DB)</text>
        <text class="mono" fill="#475569" x="12" y="36">captures / sessions / findings (v4)</text>
        <text class="card-body" x="12" y="52">仅持久化终端汇总、会话五元组与诊断，</text>
        <text class="card-body" x="12" y="68">绝不存储原始载荷（Payload）；</text>
        <text class="card-body" x="12" y="84">配置有边界触发的自动清理（Auto-clear）。</text>
      </g>

      <!-- Box 1-2: Security Grant File -->
      <g transform="translate(16, 156)">
        <rect width="238" height="96" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="card-blue-title" x="12" y="20">单向授权令牌 (Grant Token)</text>
        <text class="mono" fill="#2563eb" x="12" y="36">Application Support / Identity Gated</text>
        <text class="card-blue-body" x="12" y="52">显式声明项目作用域、单页最大条数、</text>
        <text class="card-blue-body" x="12" y="68">脱敏策略与签发时间戳；</text>
        <text class="card-blue-body" x="12" y="84">拒绝任何环境变量或命令行路径篡改。</text>
      </g>

      <!-- Box 1-3: Local Protection -->
      <g transform="translate(16, 268)">
        <rect width="238" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="20">数据不出机红线 (Local-First)</text>
        <text class="mono" fill="#475569" x="12" y="36">All data stays on this Mac</text>
        <text class="card-body" x="12" y="52">没有上传代码，没有分析遥测；</text>
        <text class="card-body" x="12" y="68">本地 GeoIP/ASN 基于离线库；</text>
        <text class="card-body" x="12" y="84">导出 .tracexysession 自动剥离原始帧。</text>
      </g>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M 270 276 L 298 276" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Stage 2: tracexy-mcp Server -->
    <g transform="translate(298, 0)">
      <rect width="270" height="380" rx="8" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
      <text class="stage-title" fill="#fff1f2" x="16" y="28">2. 内置只读 MCP 服务 (stdio)</text>

      <!-- Box 2-1: Standard IO Transport -->
      <g transform="translate(16, 44)">
        <rect width="238" height="96" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="card-coral-title" x="12" y="20">进程间 stdio 通道 (Zero Port)</text>
        <text class="mono" fill="#b91c1c" x="12" y="36">tracexy-mcp binary (AGPL/Native)</text>
        <text class="card-coral-body" x="12" y="52">零开放端口，不暴露任何网络监听；</text>
        <text class="card-coral-body" x="12" y="68">由宿主 Agent 直接子进程拉起；</text>
        <text class="card-coral-body" x="12" y="84">每次调用强校验授权文件有效性。</text>
      </g>

      <!-- Box 2-2: Strongly Typed Tools -->
      <g transform="translate(16, 156)">
        <rect width="238" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="20">强类型安全只读工具集</text>
        <text class="mono" fill="#475569" x="12" y="36">Tools: list_captures, list_sessions...</text>
        <text class="card-body" x="12" y="52">list_captures: 游标分页抓包快照；</text>
        <text class="card-body" x="12" y="68">list_sessions: 序号升序会话摘要；</text>
        <text class="card-body" x="12" y="84">list_findings: 关联帧引用的网络异常诊断。</text>
      </g>

      <!-- Box 2-3: Strict Boundary Guard -->
      <g transform="translate(16, 268)">
        <rect width="238" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="20">严格操作边界防护</text>
        <text class="mono" fill="#475569" x="12" y="36">No Shell / No SQL / No Writes</text>
        <text class="card-body" x="12" y="52">禁止任意 SQL 执行，禁止向库中写数据；</text>
        <text class="card-body" x="12" y="68">禁止直接读取原始帧二进制；</text>
        <text class="card-body" x="12" y="84">越界、过期或无效请求立即熔断关停。</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M 568 276 L 596 276" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Stage 3: Local AI Assistant &amp; Consumers -->
    <g transform="translate(596, 0)">
      <rect width="268" height="380" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="stage-title" fill="#f8fafc" x="16" y="28">3. 端侧智能体与本地环回 LLM</text>

      <!-- Box 3-1: External Coding Agents -->
      <g transform="translate(16, 44)">
        <rect width="236" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="20">AI 编程智能体消费端</text>
        <text class="mono" fill="#475569" x="12" y="36">Claude Code / Cursor / Windsurf</text>
        <text class="card-body" x="12" y="52">在终端排查网络 Bug 时，智能体可通过</text>
        <text class="card-body" x="12" y="68">MCP 自动查阅刚抓到的异常会话与证据，</text>
        <text class="card-body" x="12" y="84">实现自动定位代码与网络交互缺陷。</text>
      </g>

      <!-- Box 3-2: Loopback Assistant -->
      <g transform="translate(16, 156)">
        <rect width="236" height="96" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="card-blue-title" x="12" y="20">纯本地环回助手适配器</text>
        <text class="mono" fill="#2563eb" x="12" y="36">http://127.0.0.1:11434 (Ollama)</text>
        <text class="card-blue-body" x="12" y="52">仅接受 127.0.0.1 或 localhost 地址；</text>
        <text class="card-blue-body" x="12" y="68">拒绝非环回请求与跨机重定向；</text>
        <text class="card-blue-body" x="12" y="84">零密钥依赖，适配 Llama 3 / Qwen 等。</text>
      </g>

      <!-- Box 3-3: AssistantEvidenceBrief -->
      <g transform="translate(16, 268)">
        <rect width="236" height="96" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="card-coral-title" x="12" y="20">脱敏证据简报 (EvidenceBrief)</text>
        <text class="mono" fill="#b91c1c" x="12" y="36">Frame Citations: frame-12, frame-18</text>
        <text class="card-coral-body" x="12" y="52">模型仅接收格式化的会话元数据与帧序号；</text>
        <text class="card-coral-body" x="12" y="68">绝不向 LLM 发送报文体 Payload 或凭据；</text>
        <text class="card-coral-body" x="12" y="84">由宿主 App 在本地将诊断回溯至原生帧。</text>
      </g>
    </g>

  </g>

</svg>
