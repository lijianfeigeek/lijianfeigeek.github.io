<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="jev-core-engine-title jev-core-engine-desc">
  <title id="jev-core-engine-title">Jev 核心推理引擎：离散决策路由器架构</title>
  <desc id="jev-core-engine-desc">摒弃对话写作的非自回归架构，输入业务目标与候选动作，RLCD校准概率网络70~90ms直出强类型动作与校准置信度</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 6; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow2-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="400" class="bg" />

  <!-- Column 1: Input State (x=40, y=50, w=270, h=300) -->
  <g transform="translate(40, 50)">
    <rect width="270" height="300" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 44 L 0 44 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">输入状态 (Input State)</text>
    <text x="195" y="28" class="text-muted">契约定界</text>

    <!-- Sub components -->
    <g transform="translate(16, 56)">
      <rect width="238" height="52" class="pill" />
      <text x="12" y="20" class="text-subtitle">1. 当前业务目标</text>
      <text x="12" y="38" class="text-muted">Task: 预订去旧金山的最便宜机票</text>
    </g>

    <g transform="translate(16, 116)">
      <rect width="238" height="52" class="pill" />
      <text x="12" y="20" class="text-subtitle">2. 环境观测数据</text>
      <text x="12" y="38" class="text-muted">Context: 纯文本DOM / a11y 树 / OCR 标签</text>
    </g>

    <g transform="translate(16, 176)">
      <rect width="238" height="106" class="pill" />
      <text x="12" y="20" class="text-subtitle">3. 离散候选操作空间</text>
      <text x="12" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">• Option A: 点击「单程」单选框</text>
      <text x="12" y="58" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">• Option B: 输入出发地代码 SFO</text>
      <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">• Option C: 点击「搜索航班」按钮</text>
      <text x="12" y="94" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">• Option D: 滚动页面查找更多结果</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="310" y1="200" x2="348" y2="200" class="line" marker-end="url(#arrow2)" />

  <!-- Column 2: Jev Core (Center Focal Card: x=350, y=50, w=290, h=300) -->
  <g transform="translate(350, 50)">
    <rect width="290" height="300" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 282 0 Q 290 0 290 8 L 290 44 L 0 44 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="16" y="28" class="text-focal-title">Jev 核心推理引擎</text>
    <text x="190" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#bf4520">非自回归架构</text>

    <!-- Sub components -->
    <g transform="translate(16, 56)">
      <rect width="258" height="68" class="focal-pill" />
      <text x="12" y="22" class="text-subtitle" fill="#bf4520">RLCD 校准概率网络</text>
      <text x="12" y="40" class="text-body">• 单次前向传播 (Feed-Forward)</text>
      <text x="12" y="56" class="text-body">• 不奖励阿谀奉承，严格校准命中率</text>
    </g>

    <g transform="translate(16, 134)">
      <rect width="258" height="74" class="focal-pill" />
      <text x="12" y="22" class="text-subtitle" fill="#bf4520">硬件级吞吐与低时延</text>
      <text x="12" y="40" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">决策耗时：70ms ~ 90ms</text>
      <text x="12" y="58" class="text-body">• 零长思维链 (Zero CoT) 浪费</text>
    </g>

    <g transform="translate(16, 218)">
      <rect width="258" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="22" class="text-subtitle">能力克制与硬边界</text>
      <text x="12" y="40" class="text-muted">• 绝不自由闲聊、不写长篇大论</text>
      <text x="12" y="54" class="text-muted">• 专职担任高频离散决策路由器</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="640" y1="200" x2="678" y2="200" class="focal-line" marker-end="url(#arrow2-focal)" />

  <!-- Column 3: Output (x=680, y=50, w=240, h=300) -->
  <g transform="translate(680, 50)">
    <rect width="240" height="300" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 44 L 0 44 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">强类型决断输出</text>
    <text x="165" y="28" class="text-muted">确定性执行</text>

    <!-- Sub components -->
    <g transform="translate(16, 56)">
      <rect width="208" height="96" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#166534">选择动作：Option B</text>
      <text x="12" y="44" font-family="ui-monospace, monospace" font-size="11" fill="#15803d">输入出发地 SFO</text>
      <text x="12" y="64" font-family="sans-serif" font-size="11" font-weight="700" fill="#166534">校准置信度：0.96</text>
      <text x="12" y="82" font-family="sans-serif" font-size="10" fill="#15803d">置信度对齐统计命中率</text>
    </g>

    <g transform="translate(16, 162)">
      <rect width="208" height="118" class="pill" />
      <text x="12" y="22" class="text-subtitle">工程熔断机制</text>
      <text x="12" y="42" class="text-body">• 置信度 &gt; 0.85: 直接放行</text>
      <text x="12" y="62" class="text-body">• 置信度 &lt; 0.85: 熔断上报</text>
      <text x="12" y="82" class="text-body">• 切换慢思考 LLM 接管</text>
      <text x="12" y="102" class="text-body">• 工业级生产系统安全底线</text>
    </g>
  </g>
</svg>