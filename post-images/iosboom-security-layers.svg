<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="iosboom-layers-title iosboom-layers-desc">
  <title id="iosboom-layers-title">iosBoom 托管侧载平台五层安全治理与信任边界层栈图</title>
  <desc id="iosboom-layers-desc">自顶向下拆解边缘反滥用、仓库治理净化、本地 P12 明文凭据风险、云端签名执行信任边界与 Apple 证书吊销生态约束。</desc>
  <defs>
    <marker id="ly-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="#f8fafc"/>

  <!-- Header -->
  <text x="96" y="36" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700">iosBoom 侧载安全控制面与残留信任边界（五层堆栈）</text>
  <text x="96" y="56" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">LAYER STACK · DEFENSIVE CONTROLS vs TRUST BOUNDARY &amp; APPLE REVOCATION REALITY</text>

  <!-- Left Direction Indicator -->
  <line x1="54" y1="100" x2="54" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ly-arrow)"/>
  <text x="48" y="88" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">TRUST</text>
  <text x="48" y="454" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">RISK ↓</text>

  <!-- Layer 1 -->
  <g transform="translate(96, 80)">
    <rect x="0" y="0" width="824" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="22" width="44" height="22" rx="4" fill="#f1f5f9"/>
    <text x="38" y="37" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">L1</text>
    <text x="78" y="30" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="700">边缘人机校验与控制面只读隔离</text>
    <text x="78" y="49" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5">Cloudflare Turnstile + supapi.trystore.net 网关 + Supabase anon key RLS 只读门禁</text>
    <text x="808" y="38" fill="#059669" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="end">PUBLIC READ-ONLY</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(96, 156)">
    <rect x="0" y="0" width="824" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="22" width="44" height="22" rx="4" fill="#e2e8f0"/>
    <text x="38" y="37" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">L2</text>
    <text x="78" y="30" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="700">联邦源治理与载荷格式清洗</text>
    <text x="78" y="49" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5">repoVisibility 屏蔽高危源 (sidelix)、plus_repo_hidden_apps 精准下架、剔除非 .ipa 跳转页</text>
    <text x="808" y="38" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="end">HYGIENE FILTER</text>
  </g>

  <!-- Layer 3 (Focal 1 — Risk Zone) -->
  <g transform="translate(96, 232)">
    <rect x="0" y="0" width="824" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="16" y="24" width="44" height="22" rx="4" fill="#bf4520"/>
    <text x="38" y="39" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">L3</text>
    <text x="78" y="31" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="700">前端本地证书库明文存储边界（XSS 敏感区）</text>
    <text x="78" y="51" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5">p12Base64 与密码明文存 localStorage，不入库服务端；但同源脚本/XSS 可直接读取私钥</text>
    <text x="808" y="40" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="end">NO WEBCRYPTO ENC</text>
  </g>

  <!-- Layer 4 (Focal 2 — Ephemeral Execution Trust Boundary) -->
  <g transform="translate(96, 312)">
    <rect x="0" y="0" width="824" height="72" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="5,4"/>
    <rect x="16" y="24" width="44" height="22" rx="4" fill="#bf4520"/>
    <text x="38" y="39" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">L4</text>
    <text x="78" y="31" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="700">云端 zsign 执行瞬态信任边界</text>
    <text x="78" y="51" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5">签名期须将 .p12 + 口令 + .ipa 传至 api.tryui.dev 或 ipa.ipasign.cc 内存完成 Mach-O 重签</text>
    <text x="808" y="40" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="end">EPHEMERAL TRUST</text>
  </g>

  <!-- Layer 5 -->
  <g transform="translate(96, 392)">
    <rect x="0" y="0" width="824" height="68" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.1"/>
    <rect x="16" y="22" width="44" height="22" rx="4" fill="#e2e8f0"/>
    <text x="38" y="37" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">L5</text>
    <text x="78" y="30" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="700">Apple 生态终端吊销与版权免责层</text>
    <text x="78" y="49" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5">共享免费证书 (plus_has_active_free_cert) vs UDID 个人/企业开发证书生命周期博弈 + DMCA 隔离</text>
    <text x="808" y="38" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="end">APPLE OCSP / DMCA</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="96" y="476" width="824" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="112" y="486" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="132" y="496" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">核心残留风险/信任边界 (L3 本地明文存储 + L4 签名器瞬态解密)</text>
  <rect x="556" y="486" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="576" y="496" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">基础设施与生态约束层</text>
</svg>
