<svg width="960" height="540" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="tx-cmp-title tx-cmp-desc">
  <title id="tx-cmp-title">数据包风暴 vs 会话智能：网络排障认知范式对比</title>
  <desc id="tx-cmp-desc">对比传统以数据包为中心的抓包工具与 Tracexy 以会话为中心的分析范式在进程归属、双向聚合、噪声过滤与证据溯源上的核心差异。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #991b1b; }
    .card-coral-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #b91c1c; }
    .card-blue-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #1e40af; }
    .card-blue-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #2563eb; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="960" height="540" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="500" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">数据包噪声 vs 会话智能：网络抓包与排障认知范式对比</text>
    <text class="subtitle" x="0" y="20">传统工具以扁平帧流水为起点，Tracexy 以 macOS 本地进程、双向会话与因果活动为核心工作区</text>
  </g>

  <!-- Left Column: Traditional Packet-First (Wireshark / tcpdump) -->
  <g transform="translate(48, 80)">
    <rect width="420" height="420" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="col-header" fill="#64748b" x="20" y="28">传统模式：以数据包为中心 (Packet-First)</text>

    <!-- Card L-1: Raw Frame Flood -->
    <g transform="translate(20, 44)">
      <rect width="380" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text class="card-title" x="14" y="20">1. 扁平离散的数据包洪流 (Packet Noise)</text>
      <text class="mono" fill="#64748b" x="14" y="36">Frame #1, #2, ... #1048576 (Flat Stream)</text>
      <text class="card-body" x="14" y="52">单次捕获产生数万个独立包，充满零碎 ACK、窗口更新；</text>
      <text class="card-body" x="14" y="66">工程师必须在脑海中自行拼接双向上下文与时间线。</text>
    </g>

    <!-- Card L-2: Process Blindness -->
    <g transform="translate(20, 132)">
      <rect width="380" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text class="card-title" x="14" y="20">2. 本地系统进程黑盒 (Process Blindness)</text>
      <text class="mono" fill="#64748b" x="14" y="36">Source: 192.168.1.50:54321 → Process: Unknown</text>
      <text class="card-body" x="14" y="52">无法直接感知哪个本地 App 正在发起异常连接；</text>
      <text class="card-body" x="14" y="66">需配合 lsof / netstat 等终端命令跨工具反复盲猜。</text>
    </g>

    <!-- Card L-3: Deep Manual Filtering -->
    <g transform="translate(20, 220)">
      <rect width="380" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text class="card-title" x="14" y="20">3. 复杂手工过滤器体操 (Filter Gymnastics)</text>
      <text class="mono" fill="#64748b" x="14" y="36">tcp.port == 443 &amp;&amp; ip.addr == 104.16.x.x &amp;&amp; !icmp</text>
      <text class="card-body" x="14" y="52">极高的语法记忆门槛，每次排障都要编写多层布尔表达式；</text>
      <text class="card-body" x="14" y="66">遗漏关键重传或控制包极易导致分析偏差。</text>
    </g>

    <!-- Card L-4: Memory Bloat -->
    <g transform="translate(20, 308)">
      <rect width="380" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text class="card-title" x="14" y="20">4. 持续抓包内存吞噬 (Unbounded Memory)</text>
      <text class="mono" fill="#64748b" x="14" y="36">C/C++ Dissectors &amp; In-Memory Packet Buffers</text>
      <text class="card-body" x="14" y="52">实时抓包过程全量流式解析，长时间运行极易内存溢出；</text>
      <text class="card-body" x="14" y="66">复杂协议解析器历史安全漏洞（CVE）频发。</text>
    </g>
  </g>

  <!-- Right Column: Tracexy Session-First Model -->
  <g transform="translate(492, 80)">
    <rect width="420" height="420" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
    <text class="col-header" fill="#1e40af" x="20" y="28">Tracexy 模式：以会话为中心 (Session-First)</text>

    <!-- Card R-1: Canonical 5-Tuple Sessions -->
    <g transform="translate(20, 44)">
      <rect width="380" height="76" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text class="card-blue-title" x="14" y="20">1. 五元组双向对话折叠 (Canonical Sessions)</text>
      <text class="mono" fill="#2563eb" x="14" y="36">FiveTuple (Host A ↔ Host B) = Single Conversation</text>
      <text class="card-blue-body" x="14" y="52">双向帧自动折叠为一条清晰会话，直接展示传输字节量、</text>
      <text class="card-blue-body" x="14" y="66">往返延迟、生命周期与连接状态，大幅降低认知负荷。</text>
    </g>

    <!-- Card R-2: Process Attribution -->
    <g transform="translate(20, 132)">
      <rect width="380" height="76" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text class="card-blue-title" x="14" y="20">2. macOS 原生进程级精准溯源 (Process Context)</text>
      <text class="mono" fill="#2563eb" x="14" y="36">pktap: Safari (PID 1240) / curl (PID 8932) / git</text>
      <text class="card-blue-body" x="14" y="52">macOS 专有 pktap 接口与系统套接字联动，</text>
      <text class="card-blue-body" x="14" y="66">每个网络连接直接标注发起进程、图标与进程 ID。</text>
    </g>

    <!-- Card R-3: Evidence Findings (Coral Highlight) -->
    <g transform="translate(20, 220)">
      <rect width="380" height="76" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text class="card-coral-title" x="14" y="20">3. 证据链驱动的智能发现 (Evidence Findings)</text>
      <text class="mono" fill="#b91c1c" x="14" y="36">Findings: TLS Version / Reset / DNS NXDOMAIN</text>
      <text class="card-coral-body" x="14" y="52">自动提取异常网络事件，每项诊断直接附带精确帧序号引用</text>
      <text class="card-coral-body" x="14" y="66">（Citations: Frame #14, #18），点击直达底层十六进制证据。</text>
    </g>

    <!-- Card R-4: Memory Safety &amp; Follow Stream -->
    <g transform="translate(20, 308)">
      <rect width="380" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text class="card-title" x="14" y="20">4. 纯 Swift 内存安全与按需流重组 (On-Demand Stream)</text>
      <text class="mono" fill="#475569" x="14" y="36">Bounds-Checked PacketBuffer &amp; Scoped FollowStream</text>
      <text class="card-body" x="14" y="52">单遍无状态解码防越界；仅在用户显式选中会话并停止捕获后</text>
      <text class="card-body" x="14" y="66">才执行按需重组，杜绝实时抓包过程的无边界内存泄漏。</text>
    </g>
  </g>

</svg>
