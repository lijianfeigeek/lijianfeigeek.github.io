<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="580" viewBox="0 0 1040 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obscura-swimlane-title obscura-swimlane-desc" id="obscura-swimlane-root" data-diagram="swimlane">
  <title id="obscura-swimlane-title">Obscura 多 Worker 连接隔离与共享看门狗抢占泳道图</title>
  <desc id="obscura-swimlane-desc">展示 obscura serve 如何在 Worker 进程池、每连接独立 OS 线程（512 MiB 栈 + 独立 V8 Isolate）以及共享 cdp-watchdog 线程之间调度执行并安全抢占超时 JS。</desc>
  <defs>
    <pattern id="obscura-swim-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="swim-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="swim-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="swim-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Paper Light Background -->
  <rect width="1040" height="580" fill="#f8fafc"/>
  <rect width="1040" height="580" fill="url(#obscura-swim-dots)" opacity="0.55"/>

  <!-- Header -->
  <text x="28" y="34" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">SWIMLANE · MULTI-WORKER POOL · THREAD-PER-CONNECTION · LOCK-FREE WATCHDOG</text>
  <text x="28" y="62" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">每连接独立 Isolate 与单线程共享看门狗的并发抢占机制</text>

  <!-- Swimlane Outer Container -->
  <rect x="28" y="88" width="984" height="424" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane 1 Background (y=88..216, height=128) -->
  <rect x="28" y="88" width="984" height="128" rx="8" fill="#ffffff"/>
  <line x1="28" y1="216" x2="1012" y2="216" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="28" y="88" width="164" height="128" fill="#f1f5f9"/>
  <line x1="192" y1="88" x2="192" y2="512" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="136" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">LANE 01 · SUPERVISOR</text>
  <text x="44" y="156" fill="#475569" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">Worker 池负载均衡</text>
  <text x="44" y="176" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">obscura-cli/pool.rs</text>

  <!-- Lane 2 Background (y=216..372, height=156) -->
  <rect x="28" y="216" width="984" height="156" fill="#f8fafc"/>
  <line x1="28" y1="372" x2="1012" y2="372" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="28" y="216" width="164" height="156" fill="#f1f5f9"/>
  <text x="44" y="276" fill="#0284c7" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">LANE 02 · CDP CONN</text>
  <text x="44" y="296" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">连接专属 OS 线程</text>
  <text x="44" y="316" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">512 MiB 栈 + LocalSet</text>

  <!-- Lane 3 Background (y=372..512, height=140) -->
  <rect x="28" y="372" width="984" height="140" rx="8" fill="#ffffff"/>
  <rect x="28" y="372" width="164" height="140" fill="#f1f5f9"/>
  <text x="44" y="424" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">LANE 03 · WATCHDOG</text>
  <text x="44" y="444" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">共享看门狗线程</text>
  <text x="44" y="464" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">cdp_watchdog.rs</text>

  <!-- Connectors (drawn BEFORE boxes, orthogonal with r=8 corners) -->
  <!-- S1 -> S2 -->
  <path d="M 412 152 L 484 152" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#swim-arrow)"/>
  <!-- S2 -> S3 (handoff to Lane 2) -->
  <path d="M 592 188 L 592 248 Q 592 256 584 256 L 368 256 Q 360 256 360 264 L 360 268" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#swim-arrow-link)"/>
  <!-- C1 -> C2 -->
  <path d="M 444 304 L 496 304" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#swim-arrow)"/>
  <!-- C2 -> W1 (arm watchdog) -->
  <path d="M 604 340 L 604 376 Q 604 384 596 384 L 400 384 Q 392 384 392 392 L 392 404" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#swim-arrow)"/>
  <!-- W1 -> W2 -->
  <path d="M 484 440 L 548 440" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#swim-arrow)"/>
  <!-- W2 -> C3 (CORAL FOCAL: terminate_execution preemption handoff) -->
  <path d="M 744 440 L 844 440 Q 852 440 852 432 L 852 340" fill="none" stroke="#bf4520" stroke-width="1.8" marker-end="url(#swim-arrow-accent)"/>
  <!-- C2 -> C3 (normal disarm path) -->
  <path d="M 708 304 L 748 304" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#swim-arrow)"/>

  <!-- Arrow Masks & Labels (all with 6-10px gap from stroke) -->
  <rect x="444" y="232" width="112" height="16" rx="2" fill="#f8fafc"/>
  <text x="500" y="243" fill="#0284c7" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WS HANDOFF (CAP 128)</text>

  <rect x="448" y="362" width="112" height="16" rx="2" fill="#f8fafc"/>
  <text x="504" y="373" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ARM SLOT · O(1)</text>

  <rect x="862" y="384" width="136" height="16" rx="2" fill="#ffffff"/>
  <text x="930" y="395" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TERMINATE_EXECUTION</text>

  <!-- LANE 1 NODES -->
  <g transform="translate(216 116)">
    <rect x="0" y="0" width="196" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="98" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">Slot 轮询与 503 限流</text>
    <text x="98" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pick() 跳过 unready 节点</text>
    <text x="98" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">每 Worker 上限 128 连接</text>
  </g>

  <g transform="translate(484 116)">
    <rect x="0" y="0" width="216" height="72" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="108" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">热替换平滑排空 (Drain)</text>
    <text x="108" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Slot::replace() 先切新进程</text>
    <text x="108" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">旧 Worker 跑完存量会话后退出</text>
  </g>

  <g transform="translate(736 116)">
    <rect x="0" y="0" width="248" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="124" y="26" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">RecyclePolicy 触发阈值</text>
    <text x="124" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">max_connections / max_rss_mb</text>
    <text x="124" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">max_age · 默认 120s 排空上限</text>
  </g>

  <!-- LANE 2 NODES -->
  <g transform="translate(216 268)">
    <rect x="0" y="0" width="228" height="72" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="114" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">独占 V8 Isolate 与锁</text>
    <text x="114" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">连接级 CdpContext::v8_lock</text>
    <text x="114" y="60" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">非进程全局锁 · 多连接并行</text>
  </g>

  <g transform="translate(496 268)">
    <rect x="0" y="0" width="212" height="72" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="106" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">ExecutionScope 状态机</text>
    <text x="106" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IDLE → ENTERED (AtomicU8)</text>
    <text x="106" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">同步执行 V8 期间持锁求值</text>
  </g>

  <g transform="translate(748 268)">
    <rect x="0" y="0" width="236" height="72" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.4"/>
    <text x="118" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">安全清理与锁释放</text>
    <text x="118" y="46" fill="#334155" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">leave() 自旋等待中断交付完毕</text>
    <text x="118" y="60" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">清除 V8 终止标记 · Isolate 可复用</text>
  </g>

  <!-- LANE 3 NODES -->
  <g transform="translate(216 404)">
    <rect x="0" y="0" width="268" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="134" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">单线程槽位登记 (Condvar)</text>
    <text x="134" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HashMap&lt;u64, Slot&gt; + 单调 generation</text>
    <text x="134" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">省去每命令创建线程的 ~240µs 开销</text>
  </g>

  <g transform="translate(548 404)">
    <rect x="0" y="0" width="196" height="72" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.4"/>
    <text x="98" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">超时唤醒与原子抢占</text>
    <text x="98" y="46" fill="#334155" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CAS ENTERED → INTERRUPTING</text>
    <text x="98" y="60" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">默认 60s 强制掐断死循环 JS</text>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(28 532)">
    <rect x="0" y="0" width="984" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="20" y1="16" x2="52" y2="16" stroke="#0284c7" stroke-width="1.8"/>
    <text x="62" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">跨线程派发边界</text>
    <line x1="196" y1="16" x2="228" y2="16" stroke="#bf4520" stroke-width="1.8"/>
    <text x="238" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">超时抢占焦点路径（避免 Tokio 无法中断同步 V8）</text>
    <line x1="564" y1="16" x2="596" y2="16" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="606" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">正常完成释放 (disarm)</text>
  </g>
</svg>
