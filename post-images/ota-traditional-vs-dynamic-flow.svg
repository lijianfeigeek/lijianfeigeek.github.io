<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-traditional-vs-dynamic-flow-title ota-traditional-vs-dynamic-flow-desc">
  <title id="ota-traditional-vs-dynamic-flow-title">传统多语言发版模式 vs 自研 OTA 动态化模式对比</title>
  <desc id="ota-traditional-vs-dynamic-flow-desc">对比传统依赖发版列车与 App Store 审核的漫长周期与自研 OTA 分钟级生效的敏捷架构</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="320" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Top: Traditional Static Release (Slow) -->
  <g transform="translate(24, 20)">
    <rect width="912" height="126" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="912" height="30" rx="8" fill="#f3f4f6"/>
    <path d="M0 22 h912 v8 h-912 z" fill="#f3f4f6"/>
    <text x="16" y="20" class="label-title">传统静态发版模式（耗时数天至数周，受制于发版列车）</text>

    <!-- 6 steps -->
    <g transform="translate(16, 42)">
      <g transform="translate(0, 0)">
        <rect width="128" height="64" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="24" class="label-title" font-size="12">1. 发现错误</text>
        <text x="8" y="44" class="text-code">关键翻译歧义</text>
      </g>
      <path d="M 128 32 L 146 32" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <polygon points="146,29 152,32 146,35" fill="#9ca3af"/>

      <g transform="translate(152, 0)">
        <rect width="128" height="64" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="24" class="label-title" font-size="12">2. 平台修复</text>
        <text x="8" y="44" class="text-code">SaaS 提交词条</text>
      </g>
      <path d="M 280 32 L 298 32" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <polygon points="298,29 304,32 298,35" fill="#9ca3af"/>

      <g transform="translate(304, 0)">
        <rect width="128" height="64" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="24" class="label-title" font-size="12">3. 提 PR 合并</text>
        <text x="8" y="44" class="text-code">拉取更新代码库</text>
      </g>
      <path d="M 432 32 L 450 32" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <polygon points="450,29 456,32 450,35" fill="#9ca3af"/>

      <g transform="translate(456, 0)">
        <rect width="128" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="8" y="24" class="label-title" font-size="12" fill="#be123c">4. 等发版列车</text>
        <text x="8" y="44" class="text-code" fill="#9f1239">回归测试与阻断</text>
      </g>
      <path d="M 584 32 L 602 32" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <polygon points="602,29 608,32 602,35" fill="#9ca3af"/>

      <g transform="translate(608, 0)">
        <rect width="128" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="8" y="24" class="label-title" font-size="12" fill="#be123c">5. App Store 审核</text>
        <text x="8" y="44" class="text-code" fill="#9f1239">人工审查 24~48h</text>
      </g>
      <path d="M 736 32 L 754 32" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
      <polygon points="754,29 760,32 754,35" fill="#9ca3af"/>

      <g transform="translate(760, 0)">
        <rect width="120" height="64" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="24" class="label-title" font-size="12">6. 被动覆盖</text>
        <text x="8" y="44" class="text-code">全量升级极缓慢</text>
      </g>
    </g>
  </g>

  <!-- Bottom: In-House OTA Dynamic Mode (Coral Accent) -->
  <g transform="translate(24, 166)">
    <rect width="912" height="134" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="912" height="30" rx="8" fill="#fff7ed"/>
    <path d="M0 22 h912 v8 h-912 z" fill="#fff7ed"/>
    <text x="16" y="20" class="label-title" fill="#9a3412">自研 OTA 动态化模式（分钟级生效，零发版风险）</text>

    <!-- 4 Steps -->
    <g transform="translate(16, 44)">
      <g transform="translate(0, 0)">
        <rect width="200" height="68" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="12" y="24" class="label-title" font-size="12">1. CI 流水线独立打包</text>
        <text x="12" y="44" class="text-code">• Git 仓库作为唯一真理源</text>
        <text x="12" y="58" class="text-code">• 自动编译打包各模块 ZIP</text>
      </g>

      <path d="M 200 34 L 224 34" fill="none" stroke="#bf4520" stroke-width="1.5"/>
      <polygon points="224,31 230,34 224,37" fill="#bf4520"/>

      <g transform="translate(230, 0)">
        <rect width="200" height="68" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="12" y="24" class="label-title" font-size="12">2. 推送静态 CDN / S3</text>
        <text x="12" y="44" class="text-code">• 生成版本化 manifest.json</text>
        <text x="12" y="58" class="text-code">• 全球边缘节点秒级缓存</text>
      </g>

      <path d="M 430 34 L 454 34" fill="none" stroke="#bf4520" stroke-width="1.5"/>
      <polygon points="454,31 460,34 454,37" fill="#bf4520"/>

      <g transform="translate(460, 0)">
        <rect width="200" height="68" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="12" y="24" class="label-title" font-size="12">3. App 前台无感预热</text>
        <text x="12" y="44" class="text-code">• 异步后台拉取差异 ZIP</text>
        <text x="12" y="58" class="text-code">• 零网络阻塞，不闪退</text>
      </g>

      <path d="M 660 34 L 684 34" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <polygon points="684,31 690,34 684,37" fill="#10b981"/>

      <g transform="translate(690, 0)">
        <rect width="190" height="68" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
        <text x="12" y="24" class="label-title" font-size="12" fill="#065f46">4. 下次冷启秒级切换</text>
        <text x="12" y="44" class="text-code" fill="#047857">• 原生 Bundle 字典无锁直出</text>
        <text x="12" y="58" class="text-code" fill="#047857">• 完美继承复数与方言回退</text>
      </g>
    </g>
  </g>
</svg>