<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brandpose-retail-zone-attention-bar-chart-title brandpose-retail-zone-attention-bar-chart-desc">
  <title id="brandpose-retail-zone-attention-bar-chart-title">便利店各陈列区域顾客累计有效注视时长统计图</title>
  <desc id="brandpose-retail-zone-attention-bar-chart-desc">基于 60 秒监控视频清洗后统计，糖果巧克力（16.1s）与太阳镜饰品（15.8s）占据 63.4% 核心视线，其余区域依次递减</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label-cat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .label-val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .label-pct { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Chart Header -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" class="label-title">便利店各陈列区域顾客累计有效注视时长 (秒)</text>
    <text x="0" y="38" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #64748b;">
      全片 60 秒清洗后 797 个有效注视样本 · 2大黄金区域占据超 63% 注意力
    </text>
  </g>

  <!-- Horizontal Bars Chart Area (Y=80 to Y=390)
       Scale: Max seconds = 18s -> Bar Max width = 500px (1s = 27.7px)
  -->
  <g transform="translate(40, 80)">
    <!-- Vertical Gridlines -->
    <line x1="160" y1="0" x2="160" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="298" y1="0" x2="298" y2="300" class="grid-line"/>
    <text x="298" y="315" text-anchor="middle" class="label-pct">5 秒</text>
    <line x1="437" y1="0" x2="437" y2="300" class="grid-line"/>
    <text x="437" y="315" text-anchor="middle" class="label-pct">10 秒</text>
    <line x1="576" y1="0" x2="576" y2="300" class="grid-line"/>
    <text x="576" y="315" text-anchor="middle" class="label-pct">15 秒</text>
    <line x1="660" y1="0" x2="660" y2="300" class="grid-line"/>
    <text x="660" y="315" text-anchor="middle" class="label-pct">18 秒</text>

    <!-- Row 1: 糖果与巧克力 (16.1s - 446px) - Focal Coral -->
    <g transform="translate(0, 10)">
      <text x="150" y="18" text-anchor="end" class="label-cat" fill="#bf4520">糖果与巧克力</text>
      <rect x="160" y="2" width="446" height="22" rx="4" fill="#bf4520"/>
      <text x="616" y="18" class="label-val" fill="#bf4520">16.1s</text>
      <text x="665" y="18" class="label-pct">(32.0% · 8人驻留 · 中央双面矮中岛)</text>
    </g>

    <!-- Row 2: 太阳镜与配饰 (15.8s - 438px) - Focal Coral -->
    <g transform="translate(0, 42)">
      <text x="150" y="18" text-anchor="end" class="label-cat" fill="#bf4520">太阳镜与饰品</text>
      <rect x="160" y="2" width="438" height="22" rx="4" fill="#ea580c"/>
      <text x="608" y="18" class="label-val" fill="#ea580c">15.8s</text>
      <text x="657" y="18" class="label-pct">(31.4% · 10人驻留 · 入门左侧首个视觉焦点)</text>
    </g>

    <!-- Row 3: 背墙小吃 (7.2s - 200px) -->
    <g transform="translate(0, 74)">
      <text x="150" y="18" text-anchor="end" class="label-cat">背墙膨化小吃</text>
      <rect x="160" y="2" width="200" height="22" rx="4" fill="#0284c7"/>
      <text x="370" y="18" class="label-val">7.2s</text>
      <text x="415" y="18" class="label-pct">(14.3% · 7人 · 结账排队主干道)</text>
    </g>

    <!-- Row 4: 现磨咖啡果汁 (2.8s - 78px) -->
    <g transform="translate(0, 106)">
      <text x="150" y="18" text-anchor="end" class="label-cat">现磨咖啡果汁</text>
      <rect x="160" y="2" width="78" height="22" rx="4" fill="#64748b"/>
      <text x="248" y="18" class="label-val">2.8s</text>
      <text x="290" y="18" class="label-pct">(5.6% · 6人 · 点单柜台)</text>
    </g>

    <!-- Row 5: 端头货架 (2.5s - 69px) -->
    <g transform="translate(0, 138)">
      <text x="150" y="18" text-anchor="end" class="label-cat">促销端头货架</text>
      <rect x="160" y="2" width="69" height="22" rx="4" fill="#64748b"/>
      <text x="239" y="18" class="label-val">2.5s</text>
      <text x="280" y="18" class="label-pct">(5.0% · 2人 · 高浓度促销堆头)</text>
    </g>

    <!-- Row 6: 杂货粮油 (1.4s - 39px) -->
    <g transform="translate(0, 170)">
      <text x="150" y="18" text-anchor="end" class="label-cat">杂货粮油日常</text>
      <rect x="160" y="2" width="39" height="22" rx="4" fill="#94a3b8"/>
      <text x="209" y="18" class="label-val">1.4s</text>
      <text x="250" y="18" class="label-pct">(2.8% · 4人 · 目的性深区)</text>
    </g>

    <!-- Row 7: 饮料冷柜 (0.9s - 25px) -->
    <g transform="translate(0, 202)">
      <text x="150" y="18" text-anchor="end" class="label-cat">饮料长排冷柜</text>
      <rect x="160" y="2" width="25" height="22" rx="4" fill="#cbd5e1"/>
      <text x="195" y="18" class="label-val">0.9s</text>
      <text x="235" y="18" class="label-pct">(1.8% · 3人)</text>
    </g>

    <!-- Row 8: 精品红酒 (0.5s - 14px) -->
    <g transform="translate(0, 234)">
      <text x="150" y="18" text-anchor="end" class="label-cat">精品红酒专柜</text>
      <rect x="160" y="2" width="14" height="22" rx="4" fill="#cbd5e1"/>
      <text x="184" y="18" class="label-val">0.5s</text>
      <text x="225" y="18" class="label-pct">(1.0% · 2人)</text>
    </g>

    <!-- Row 9: 精酿啤酒 (0.3s - 8px) -->
    <g transform="translate(0, 266)">
      <text x="150" y="18" text-anchor="end" class="label-cat">精酿啤酒专区</text>
      <rect x="160" y="2" width="8" height="22" rx="4" fill="#e2e8f0"/>
      <text x="178" y="18" class="label-val">0.3s</text>
      <text x="218" y="18" class="label-pct">(0.6% · 1人)</text>
    </g>
  </g>
</svg>