<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrowGray_seq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowBlue_seq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowCoral_seq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrowGreen_seq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="700" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="652" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="230" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0369a1" font-size="11" font-weight="700" letter-spacing="1">AUTOMATION SEQUENCE TIMELINE</text>
    <text x="0" y="52" fill="#0f172a" font-size="22" font-weight="700">脱机自动续签全闭环：Shortcuts 触发到 XPC 与本地环回签发时序</text>
    <text x="0" y="74" fill="#475569" font-size="13">还原从系统快捷指令定时唤醒、LiveProcess 隔离拉起、WireGuard 环回掉头到 lockdownd 证书刷新的完整时序</text>
  </g>

  <!-- Lifeline Headers (Actors) -->
  <!-- Actor 1: Shortcuts / Widget -->
  <g transform="translate(60, 150)">
    <rect width="160" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="80" y="22" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Shortcuts 快捷指令</text>
    <text x="80" y="38" fill="#64748b" font-size="10" text-anchor="middle">系统级定时自动化触发器</text>
    <line x1="80" y1="46" x2="80" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 2: LiveContainer (AppIntents) -->
  <g transform="translate(260, 150)">
    <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="1.2" />
    <text x="85" y="22" fill="#0284c7" font-size="12" font-weight="700" text-anchor="middle">LiveContainer 宿主</text>
    <text x="85" y="38" fill="#64748b" font-size="10" text-anchor="middle">AppIntents 调度入口</text>
    <line x1="85" y1="46" x2="85" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 3: LiveProcess.appex -->
  <g transform="translate(470, 150)">
    <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#fda4af" stroke-width="1.2" />
    <text x="85" y="22" fill="#e11d48" font-size="12" font-weight="700" text-anchor="middle">LiveProcess.appex</text>
    <text x="85" y="38" fill="#64748b" font-size="10" text-anchor="middle">SideStore 后台守护进程</text>
    <line x1="85" y1="46" x2="85" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 4: Loopback VPN (WireGuard) -->
  <g transform="translate(680, 150)">
    <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2" />
    <text x="85" y="22" fill="#059669" font-size="12" font-weight="700" text-anchor="middle">LocalDevVPN / 环回</text>
    <text x="85" y="38" fill="#64748b" font-size="10" text-anchor="middle">10.7.0.1 流量掉头交换</text>
    <line x1="85" y1="46" x2="85" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 5: iOS Daemons -->
  <g transform="translate(890, 150)">
    <rect width="160" height="46" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2" />
    <text x="80" y="22" fill="#d97706" font-size="12" font-weight="700" text-anchor="middle">lockdownd / installd</text>
    <text x="80" y="38" fill="#64748b" font-size="10" text-anchor="middle">iOS 原生特权安装服务</text>
    <line x1="80" y1="46" x2="80" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Sequence Message 1: Shortcuts -> LiveContainer -->
  <g transform="translate(140, 220)">
    <line x1="0" y1="0" x2="205" y2="0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowBlue_seq)" />
    <rect x="15" y="-18" width="180" height="18" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
    <text x="20" y="-5" fill="#0284c7" font-size="10" font-weight="600">1. 触发 RefreshAllIntent 意图</text>
  </g>

  <!-- Sequence Message 2: LiveContainer Internal Reflection -->
  <g transform="translate(345, 255)">
    <path d="M 0 0 L 30 0 L 30 18 L 6 18" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray_seq)" />
    <rect x="35" y="2" width="165" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="40" y="15" fill="#475569" font-size="10">2. _getTypeByMangledNameInContext</text>
  </g>

  <!-- Sequence Message 3: LiveContainer -> LiveProcess (Launch Extension) -->
  <g transform="translate(345, 300)">
    <line x1="0" y1="0" x2="210" y2="0" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arrowCoral_seq)" />
    <rect x="15" y="-18" width="180" height="18" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="1" />
    <text x="20" y="-5" fill="#e11d48" font-size="10" font-weight="600">3. 启动 LiveProcess (带 XPC 句柄)</text>
  </g>

  <!-- Sequence Message 4: LiveProcess -> Loopback VPN -->
  <g transform="translate(555, 345)">
    <line x1="0" y1="0" x2="210" y2="0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen_seq)" />
    <rect x="15" y="-18" width="180" height="18" rx="4" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" />
    <text x="20" y="-5" fill="#059669" font-size="10" font-weight="600">4. 激活隧道向 10.7.0.1 发起连接</text>
  </g>

  <!-- Sequence Message 5: Loopback VPN -> iOS lockdownd -->
  <g transform="translate(765, 390)">
    <line x1="0" y1="0" x2="205" y2="0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowGray_seq)" />
    <rect x="15" y="-18" width="180" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
    <text x="20" y="-5" fill="#d97706" font-size="10" font-weight="600">5. 掉头注入 lockdownd (Port 62078)</text>
  </g>

  <!-- Sequence Message 6: iOS lockdownd -> misagent update -->
  <g transform="translate(970, 425)">
    <path d="M 0 0 L 25 0 L 25 18 L 6 18" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowGray_seq)" />
    <rect x="30" y="2" width="85" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
    <text x="34" y="15" fill="#b45309" font-size="10">6. 重刷 7 天证书</text>
  </g>

  <!-- Sequence Message 7: iOS Daemons -> LiveProcess (Ack) -->
  <g transform="translate(555, 470)">
    <line x1="415" y1="0" x2="5" y2="0" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen_seq)" />
    <rect x="90" y="-18" width="220" height="18" rx="4" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" />
    <text x="96" y="-5" fill="#059669" font-size="10">7. Profile 安装完成，重置过期倒计时</text>
  </g>

  <!-- Sequence Message 8: LiveProcess -> LiveContainer (XPC Finish) -->
  <g transform="translate(345, 520)">
    <line x1="210" y1="0" x2="5" y2="0" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowBlue_seq)" />
    <rect x="15" y="-18" width="180" height="18" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
    <text x="20" y="-5" fill="#0284c7" font-size="10">8. XPC 回传进度 100% 并关闭隧道</text>
  </g>

  <!-- Sequence Message 9: LiveContainer -> Shortcuts (Result) -->
  <g transform="translate(140, 565)">
    <line x1="205" y1="0" x2="5" y2="0" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowBlue_seq)" />
    <rect x="15" y="-18" width="180" height="18" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1" />
    <text x="20" y="-5" fill="#0284c7" font-size="10">9. 返回弹窗：All apps refreshed</text>
  </g>

  <!-- Sequence Summary Callout (Bottom Footer) -->
  <g transform="translate(60, 610)">
    <rect width="990" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="28" fill="#475569" font-size="11">✨ 核心运行机制：整套刷新全流程在后台由 LiveProcess.appex 静默流转，无需人工插线连电脑，无需前台打开任何 App，真正实现纯原生全自动脱机自愈闭环。</text>
  </g>
</svg>