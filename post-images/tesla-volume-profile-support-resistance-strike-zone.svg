<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="tsla-vol-title tsla-vol-desc">
  <title id="tsla-vol-title">特斯拉筹码分布图 (Volume Profile) 与分批低吸击球区</title>
  <desc id="tsla-vol-desc">展示380~405美元密集套牢带、现价356美元博弈卡位点、300~340美元成交量真空断层以及与324美元基准估值严丝合缝的建仓击球区。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .val-large { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">特斯拉筹码分布图 (Volume Profile) 与分批低吸击球区</text>
    <text class="subtitle" x="0" y="20">技术面筹码沉淀结构与基本面公允价值（324 美元）在 300~340 美元流动性真空断层的精准交汇</text>
  </g>

  <!-- Left: Price &amp; Volume Profile Layers (Vertical Stack) -->
  <g transform="translate(48, 86)">
    <rect width="520" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="16" y="24">二级市场筹码堆积结构分析 (成交量深度)</text>

    <!-- Zone 1: Resistance POC -->
    <g transform="translate(16, 38)">
      <rect width="488" height="84" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#be123c" x="0" y="0">380 ~ 405 美元：筹码重度堆积密集区 (POC 核心线 395 美元)</text>
        <text class="card-body" x="0" y="18">• 过去半年堆积近 4 亿股沉重换手筹码，近端核心强阻力带</text>
        <text class="card-body" x="0" y="34">• 向上突破需要财报释放颠覆性催化剂，否则反弹极易遭遇解套抛压</text>
        <text class="mono" fill="#be123c" x="0" y="52">STATUS: 重度套牢阻力带，严禁追高</text>
      </g>
    </g>

    <!-- Zone 2: Current Pivot -->
    <g transform="translate(16, 134)">
      <rect width="488" height="74" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">345 ~ 356 美元：密集区下边缘震荡 (现价卡位点)</text>
        <text class="card-body" x="0" y="18">• 当前股价处于博弈临界点，多空拉锯剧烈，支撑力量较弱</text>
        <text class="card-body" x="0" y="34">• 一旦失守 345 美元，下方将进入长达 40 美元的真空悬崖</text>
      </g>
    </g>

    <!-- Zone 3: Liquidity Void (Strike Zone) -->
    <g transform="translate(16, 220)">
      <rect width="488" height="104" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">300 ~ 340 美元：成交量真空断层 (流动性极薄的悬崖区)</text>
        <text class="card-body" x="0" y="18">• 历史快速跳空上涨形成的筹码真空带，无沉重换手成本支撑</text>
        <text class="card-body" x="0" y="34">• 一旦市场恐慌回踩，极易发生流动性抽干式的深蹲下影线</text>
        <text class="card-title" fill="#14532d" x="0" y="54">★ 324 美元基本面公允价精准坐落于此！</text>
        <text class="mono" fill="#15803d" x="0" y="72">STRIKE ZONE: 理性投资者的黄金击球区</text>
      </g>
    </g>
  </g>

  <!-- Right: Execution Strategy -->
  <g transform="translate(590, 86)">
    <rect width="322" height="348" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text class="box-title" fill="#7e22ce" x="16" y="24">中长线资本分批低吸防御战术</text>

    <!-- Strategy 1 -->
    <g transform="translate(16, 40)">
      <rect width="290" height="130" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#6b21a8" x="0" y="0">第一梯队：底仓试探埋伏</text>
        <text class="val-large" fill="#7e22ce" x="0" y="26">345 美元挂单 (20% 仓位)</text>
        <text class="card-body" x="0" y="46">• 挂在密集成交区下边缘稍下方</text>
        <text class="card-body" x="0" y="62">• 防范大盘假摔洗盘后快速拉起</text>
        <text class="mono" fill="#7e22ce" x="0" y="82">ROLE: 建立底仓观察位</text>
      </g>
    </g>

    <!-- Strategy 2 -->
    <g transform="translate(16, 186)">
      <rect width="290" height="138" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">第二梯队：重仓狙击击球</text>
        <text class="val-large" fill="#15803d" x="0" y="26">320 ~ 325 美元 (80% 仓位)</text>
        <text class="card-body" fill="#166534" x="0" y="46">• 与基本面公允价 324 美元严丝合缝</text>
        <text class="card-body" fill="#166534" x="0" y="62">• 处于流动性真空带深处，安全边际极高</text>
        <text class="mono" fill="#15803d" x="0" y="82">ROLE: 捕获最具性价比的核心筹码</text>
      </g>
    </g>
  </g>
</svg>