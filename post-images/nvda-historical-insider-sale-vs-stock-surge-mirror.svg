        <text class="desc" x="0" y="18">• H100 / A100 需求世纪大爆发</text>
        <text class="desc" x="0" y="34">• CSP 巨头持续上调 CapEx 资本开支</text>
        <text class="green-tag" x="0" y="60">股价随后自 40 美元平台拉升突破 120 美元</text>
      </g>
    </g>
  </g>

  <!-- Event 2: 2024 年 6-8 月 -->
  <g transform="translate(337, 60)">
    <rect width="286" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="286" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="286" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="286" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">2024 年 6-8 月：拆股放量期</text>
    <text x="272" y="25" text-anchor="end" class="tag">CASE 2</text>

