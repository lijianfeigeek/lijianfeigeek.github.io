        <text class="desc" x="0" y="18">• 1 拆 10 拆股后流动性大爆发</text>
        <text class="desc" x="0" y="34">• 老黄连续数月按日减持固定股数</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="258" height="74" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">当时舆论：AI 泡沫刺破论</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 华尔街热议“CEO 大手笔出逃”</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 多方论战芯片产能是否过剩</text>
      </g>
    </g>

    <g transform="translate(14, 208)">
      <rect width="258" height="96" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">后验事实：Blackwell 全面售罄</text>
        <text class="desc" x="0" y="18">• GB200 机柜产线排期排至未来 12 个月</text>
        <text class="desc" x="0" y="34">• 盘整洗盘结束后股价迅速创出历史新高</text>
        <text class="green-tag" x="0" y="60">大户套现丝毫不损基本面强韧性</text>
      </g>
    </g>
  </g>

  <!-- Event 3: 2026 年 9 月 (Core Accent) -->
  <g transform="translate(643, 60)">
    <rect width="285" height="330" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="285" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="285" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="285" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="14" y="25" class="coral-title">2026 年 9 月：高位平台期</text>
    <text x="271" y="25" text-anchor="end" class="coral-tag">CASE 3 (NOW)</text>

    <g transform="translate(14, 52)">
      <rect width="257" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">事件触发：Stevens 变现 6.46 亿</text>
        <text class="desc" x="0" y="18">• 在 222 ~ 231 美元区间精准兑现</text>
        <text class="desc" x="0" y="34">• 累计减持其自身持仓的 9.04%</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="257" height="74" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">当下舆论：见顶复读机</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 社区再度充斥“巨鲸清盘”标题党</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 忽视依然有 64.6 亿美元巨额底仓</text>
      </g>
    </g>

    <g transform="translate(14, 208)">
      <rect width="257" height="96" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">核心定力：看清本质拒当韭菜</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 内部人交易不是预测股价短波的罗盘</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 紧盯 Hyperscalers 资本开支与交期</text>
        <text class="coral-tag" x="0" y="60">只要产业驱动在，噪音降噪即阿尔法</text>
      </g>
    </g>
