<svg width="960" height="270" viewBox="0 0 960 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghidra-headless-automation-pipeline-title ghidra-headless-automation-pipeline-desc">
  <title id="ghidra-headless-automation-pipeline-title">analyzeHeadless 自动化批处理与 Agent 流水线</title>
  <desc id="ghidra-headless-automation-pipeline-desc">展示海量样本或 CI/CD 接入 analyzeHeadless 引擎执行自动解构并输出结构化漏洞报告的全流程</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="270" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Inputs -->
  <g transform="translate(24, 30)">
    <rect width="210" height="210" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="28" class="label-title">1. 自动化触发源</text>
    <line x1="14" y1="42" x2="196" y2="42" stroke="#f3f4f6" stroke-width="1"/>

    <g transform="translate(12, 54)">
      <rect width="186" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12">海量固件/恶意样本池</text>
      <text x="10" y="38" class="text-code">• 多源 APT 样本爬取</text>
      <text x="10" y="52" class="text-code">• IoT 固件批量解包镜像</text>
    </g>

    <g transform="translate(12, 126)">
      <rect width="186" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#1e40af">CI/CD &amp; AI Agent</text>
      <text x="10" y="38" class="text-code" fill="#1d4ed8">• 自动化提权漏洞检测</text>
      <text x="10" y="52" class="text-code" fill="#1d4ed8">• 安全路由触发子代理</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 234 135 L 274 135" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="274,132 280,135 274,138" fill="#9ca3af"/>

  <!-- Center: analyzeHeadless CLI Engine (Coral Accent) -->
  <g transform="translate(280, 30)">
    <rect width="360" height="210" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="32" rx="8" fill="#ffedd5"/>
    <path d="M0 24 h360 v8 h-360 z" fill="#ffedd5"/>
    <text x="14" y="21" class="label-title" fill="#9a3412">2. analyzeHeadless CLI 无头流水线</text>

    <g transform="translate(12, 44)">
      <rect width="336" height="34" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="22" class="text-code" fill="#7c2d12">• 瞬时初始化临时工程 (Transient Project，零磁盘残留)</text>
    </g>

    <g transform="translate(12, 84)">
      <rect width="336" height="34" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="22" class="text-code" fill="#7c2d12">• 自动识别架构并调用对应 SLEIGH .sla 解码</text>
    </g>

    <g transform="translate(12, 124)">
      <rect width="336" height="34" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="22" class="text-code" fill="#7c2d12">• 调度核心分析器 (函数重塑 / 栈分析 / 交叉引用)</text>
    </g>

    <g transform="translate(12, 164)">
      <rect width="336" height="34" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="22" class="text-code" font-weight="600" fill="#9a3412">• 执行自定义 Java/Python 脚本 (Post-analysis Script)</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 640 135 L 680 135" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="680,132 686,135 680,138" fill="#10b981"/>

  <!-- Right: Structured Reports &amp; Artifacts -->
  <g transform="translate(686, 30)">
    <rect width="250" height="210" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#ecfdf5"/>
    <path d="M0 24 h250 v8 h-250 z" fill="#ecfdf5"/>
    <text x="14" y="21" class="label-title" fill="#065f46">3. 结构化审计成果产出</text>

    <g transform="translate(12, 46)">
      <rect width="226" height="44" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" class="label-title" font-size="11" fill="#166534">JSON 结构化遥测指标</text>
      <text x="10" y="34" class="text-code" fill="#15803d">函数列表 / 危险外部导入符号</text>
    </g>

    <g transform="translate(12, 98)">
      <rect width="226" height="44" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" class="label-title" font-size="11" fill="#166534">CVE 模式匹配与特征告警</text>
      <text x="10" y="34" class="text-code" fill="#15803d">strcpy 缓冲区溢出 / 格式化串</text>
    </g>

    <g transform="translate(12, 150)">
      <rect width="226" height="44" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" class="label-title" font-size="11" fill="#166534">反编译 C 源码离线归档</text>
      <text x="10" y="34" class="text-code" fill="#15803d">供下游 LLM 审计或安全研报</text>
    </g>
  </g>
</svg>