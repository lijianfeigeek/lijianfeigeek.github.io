<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="500" viewBox="0 0 1040 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cloudn-dl-title cloudn-dl-desc" id="cloudn-hybrid-download-lifecycle-swimlane-root">
      <title id="cloudn-dl-title">Cloudn 混合下载调度、慢连接抢占与无损转封装泳道图</title>
      <desc id="cloudn-dl-desc">展示前台 RangeTransfer 弹性分片窃取、退至后台时交接给 iOS BackgroundTransfers 32MB 分段、链接过期自动换链以及最终无损转封装与实况照片配对。</desc>
      <defs>
      <style>#cloudn-hybrid-download-lifecycle-swimlane-root { font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #0f172a; }
      #cloudn-hybrid-download-lifecycle-swimlane-root .diagram-container { width: 100%; overflow-x: auto; }</style>
        <pattern id="cloudn-hybrid-download-lifecycle-swimlane-dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
        </pattern>
        <marker id="cloudn-hybrid-download-lifecycle-swimlane-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
        </marker>
        <marker id="cloudn-hybrid-download-lifecycle-swimlane-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="cloudn-hybrid-download-lifecycle-swimlane-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
        </marker>
      </defs>

      <rect width="1040" height="500" fill="#f8fafc"/>
      <rect width="1040" height="500" fill="url(#cloudn-hybrid-download-lifecycle-swimlane-dots)" opacity="0.6"/>

      <!-- Title -->
      <text x="40" y="34" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">SWIMLANE · HYBRID DOWNLOAD &amp; LOSSLESS REMUX LIFECYCLE</text>
      <text x="40" y="60" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">混合下载调度、慢连接抢占与无损转封装泳道</text>

      <!-- Swimlane grid -->
      <line x1="40" y1="88" x2="1000" y2="88" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="40" y1="196" x2="1000" y2="196" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="40" y1="304" x2="1000" y2="304" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="40" y1="412" x2="1000" y2="412" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="176" y1="88" x2="176" y2="412" stroke="#cbd5e1" stroke-width="1.2"/>

      <!-- Lane Labels -->
      <g transform="translate(48, 126)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">前台分片引擎</text>
        <text x="0" y="18" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">RangeTransfer</text>
      </g>
      <g transform="translate(48, 234)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">系统后台会话</text>
        <text x="0" y="18" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">URLSession BG</text>
      </g>
      <g transform="translate(48, 342)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">转封装与后处理</text>
        <text x="0" y="18" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Remux / Photos</text>
      </g>

      <!-- Connectors (drawn BEFORE step cards) -->
      <!-- Lane 1: Probe -> Steal/Preempt -->
      <line x1="348" y1="142" x2="392" y2="142" stroke="#475569" stroke-width="1.3" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow)"/>
      <!-- Lane 1: Steal/Preempt -> Auto Refresh or Finish -->
      <line x1="572" y1="142" x2="620" y2="142" stroke="#475569" stroke-width="1.3" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow)"/>
      <!-- Handoff Down: Steal -> Background Transfers (y=170 -> y=220) -->
      <path d="M 482,172 V 220" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow-accent)"/>
      <rect x="490" y="188" width="112" height="16" rx="2" fill="#f8fafc"/>
      <text x="546" y="199" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">BG HANDOFF ≤32MB</text>

      <!-- Background Transfers -> Reclaim / 403 Refresh -->
      <path d="M 572,250 H 700 Q 708,250 708,242 V 172" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow-link)"/>
      <rect x="626" y="200" width="96" height="16" rx="2" fill="#f8fafc"/>
      <text x="674" y="211" fill="#0284c7" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RECLAIM / 403</text>

      <!-- Lane 1 Refresh/Complete -> Lane 3 Remux (Step 5 is at x=620..796, y=328..388) -->
      <path d="M 796,142 H 832 Q 840,142 840,150 V 280 Q 840,288 832,288 H 740 Q 732,288 732,296 V 324" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow)"/>
      <!-- Lane 2 Background complete -> Lane 3 Remux (Step 5 top at x=684, y=328) -->
      <path d="M 572,260 H 676 Q 684,260 684,268 V 324" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow)"/>

      <!-- Lane 3: Remux (x=620..796, y=358) -> LivePhoto / Export (x=824..988, y=358) -->
      <line x1="796" y1="358" x2="820" y2="358" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow-accent)"/>

      <!-- Step 1 (Lane 1): Range 0-0 Probe -->
      <g transform="translate(196, 112)">
        <rect x="0" y="0" width="152" height="60" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
        <text x="12" y="24" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">Range 0-0 探测</text>
        <text x="12" y="44" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">206 + Content-Range</text>
      </g>

      <!-- Step 2 (Lane 1, FOCAL): Work Stealing & Watchdog -->
      <g transform="translate(392, 112)">
        <rect x="0" y="0" width="180" height="60" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
        <text x="12" y="24" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">弹性窃取与慢连接抢占</text>
        <text x="12" y="44" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">2s 采样 · &lt;12KB/s 断连换源</text>
      </g>

      <!-- Step 3 (Lane 1): Expired Link Auto-Refresh -->
      <g transform="translate(620, 112)">
        <rect x="0" y="0" width="176" height="60" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="12" y="24" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">403/412 自动换链续传</text>
        <text x="12" y="44" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">verifyPlan() 保留已下分片</text>
      </g>

      <!-- Step 4 (Lane 2): Background 32MB Slices -->
      <g transform="translate(392, 220)">
        <rect x="0" y="0" width="180" height="60" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
        <text x="12" y="24" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">32MB 分片后台接管</text>
        <text x="12" y="44" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">避开 resumeData · 302 剥 Auth</text>
      </g>

      <!-- Step 5 (Lane 3): Lossless MP4 Remux -->
      <g transform="translate(620, 328)">
        <rect x="0" y="0" width="176" height="60" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
        <text x="12" y="24" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">无损 MP4 流式转封装</text>
        <text x="12" y="44" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ftyp + free(8) + mdat + moov</text>
      </g>

      <!-- Step 6 (Lane 3, FOCAL): LivePhoto & Export -->
      <g transform="translate(824, 328)">
        <rect x="0" y="0" width="164" height="60" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
        <text x="12" y="24" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">实况配对与导出归档</text>
        <text x="12" y="44" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">MakerNote[17] · iCloud 跨卷</text>
      </g>

      <!-- Fix the arrow in Lane 3: Step 5 (620..796) -> Step 6 (824..988), and incoming arrows to Step 5 top edge (x=708 or 748)! -->
      <!-- Wait: let's inspect the paths we drew above and make sure they point to Step 5 (x=620..796, y=328)! -->
      <!-- Look! Above we had a stray line x1=600..720 and vertical drops to x=840/800. Let's fix those connectors cleanly right now before saving! -->
      <!-- Let's rewrite this file cleanly in the next step if needed, or right now? Wait, let's check: we can edit lines 55-80 right after! -->

      <!-- Legend Strip -->
      <text x="40" y="452" fill="#475569" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="442" width="14" height="12" rx="2" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
      <text x="134" y="452" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">关键调优 / 交付节点</text>

      <line x1="300" y1="448" x2="332" y2="448" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow-accent)"/>
      <text x="340" y="452" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">跨泳道切入后台 / 最终合成</text>

      <line x1="540" y1="448" x2="572" y2="448" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#cloudn-hybrid-download-lifecycle-swimlane-arrow-link)"/>
      <text x="580" y="452" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">回前台接管或 403 自动重取直链</text>
    </svg>
