<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-labelledby="seq-title seq-desc" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif;">
  <title id="seq-title">iPadn 全链路时序图：Unicorn x86 StoreProof 认证、多组件 SINF 编织与端侧原生安装</title>
  <desc id="seq-desc">展示 Swift 主应用、WKWebView Unicorn x86 沙盒、Apple 商店服务器及 iOS LocalDevVPN 守护进程之间的消息时序，包含 iOS 27+ 本机 Mac17,7 无线配对可选分支。</desc>
  <defs>
    <pattern id="dotGridSeq" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="seqArrowMuted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="seqArrowLink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="seqArrowAccent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="seqArrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="660" fill="#ffffff"/>
  <rect x="16" y="16" width="1068" height="628" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="16" width="1068" height="628" rx="8" fill="url(#dotGridSeq)"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="108" height="20" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="54" y="14" text-anchor="middle" fill="#0284c7" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace" letter-spacing="1">SEQUENCE FLOW</text>
    <text x="0" y="44" fill="#0f172a" font-size="20" font-weight="700">端到端密码学握手与免电脑原生部署时序图</text>
    <text x="0" y="64" fill="#475569" font-size="12">覆盖 Unicorn x86 FairPlay SAP + StoreProof OTP、SinfPaths 多扩展注入与 iOS 27+ 端侧配对全生命周期</text>
  </g>

  <!-- Lifelines (Behind everything) -->
  <!-- Centers: X1=156, X2=420, X3=684, X4=948 -->
  <g>
    <line x1="156" y1="168" x2="156" y2="596" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="420" y1="168" x2="420" y2="596" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="684" y1="168" x2="684" y2="596" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="948" y1="168" x2="948" y2="596" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Combined Fragment: OPT On-Device Pairing (spans X1=156 and X4=948) -->
  <g transform="translate(120, 408)">
    <rect x="0" y="0" width="864" height="108" rx="4" fill="#0f172a" fill-opacity="0.025" stroke="#94a3b8" stroke-width="1"/>
    <rect x="0" y="0" width="44" height="18" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="22" y="13" text-anchor="middle" fill="#475569" font-size="9" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">OPT</text>
    <text x="56" y="13" fill="#475569" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">[iOS 27+ 无电脑端侧无线配对生成 RPPairing]</text>
  </g>

  <!-- Activation Bars -->
  <g>
    <rect x="152" y="180" width="8" height="404" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <rect x="416" y="196" width="8" height="112" fill="#f1f5f9" stroke="#0284c7" stroke-width="1"/>
    <rect x="680" y="232" width="8" height="128" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <rect x="944" y="440" width="8" height="140" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  </g>

  <!-- Actor Boxes -->
  <g transform="translate(56, 120)">
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">iPadn Swift 主进程</text>
    <text x="100" y="37" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">AppleService · PackageService</text>
  </g>
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">WKWebView 密码学沙盒</text>
    <text x="100" y="37" text-anchor="middle" fill="#0369a1" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">sap.wasm + Unicorn x86_64</text>
  </g>
  <g transform="translate(584, 120)">
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Apple Store / CDN</text>
    <text x="100" y="37" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">DownloadDispatch · mzstatic</text>
  </g>
  <g transform="translate(848, 120)">
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">iOS 系统守护进程</text>
    <text x="100" y="37" text-anchor="middle" fill="#047857" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">10.7.0.1 · AFC · installd</text>
  </g>

  <!-- Sequence Messages (Top to Bottom) -->
  <!-- M1: X1 -> X2 -->
  <line x1="160" y1="204" x2="412" y2="204" stroke="#0284c7" stroke-width="1.4" marker-end="url(#seqArrowLink)"/>
  <rect x="200" y="186" width="176" height="14" rx="2" fill="#f8fafc"/>
  <text x="288" y="196" text-anchor="middle" fill="#0369a1" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">1. sapSign + sapStoreProvision</text>

  <!-- M2: X2 -> X3 -->
  <line x1="424" y1="240" x2="676" y2="240" stroke="#475569" stroke-width="1.4" marker-end="url(#seqArrowMuted)"/>
  <rect x="448" y="222" width="208" height="14" rx="2" fill="#f8fafc"/>
  <text x="552" y="232" text-anchor="middle" fill="#334155" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">2. Loopback /proxy (setupCert + AMD-SP)</text>

  <!-- M3: X3 -> X2 (Return dashed) -->
  <line x1="676" y1="272" x2="424" y2="272" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seqArrowMuted)"/>
  <rect x="462" y="254" width="180" height="14" rx="2" fill="#f8fafc"/>
  <text x="552" y="264" text-anchor="middle" fill="#475569" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">3. libCoreADI.so 计算 AMD / KBSync</text>

  <!-- M4: X2 -> X1 (Return dashed) -->
  <line x1="412" y1="300" x2="160" y2="300" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seqArrowLink)"/>
  <rect x="192" y="282" width="192" height="14" rx="2" fill="#f8fafc"/>
  <text x="288" y="292" text-anchor="middle" fill="#0369a1" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">4. ActionSignature + X-Apple-AMD</text>

  <!-- M5: X1 -> X3 -->
  <line x1="160" y1="332" x2="676" y2="332" stroke="#475569" stroke-width="1.4" marker-end="url(#seqArrowMuted)"/>
  <rect x="296" y="314" width="260" height="14" rx="2" fill="#f8fafc"/>
  <text x="426" y="324" text-anchor="middle" fill="#0f172a" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">5. DownloadDispatch(externalVersionId, kbsync)</text>

  <!-- M6: X3 -> X1 (Return dashed) -->
  <line x1="676" y1="364" x2="160" y2="364" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seqArrowMuted)"/>
  <rect x="296" y="346" width="260" height="14" rx="2" fill="#f8fafc"/>
  <text x="426" y="356" text-anchor="middle" fill="#334155" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">6. song["URL"] + song["sinfs"] + downloadInfo</text>

  <!-- Self call on X1: SINF weaving -->
  <path d="M 160 380 L 204 380 L 204 396 L 164 396" fill="none" stroke="#0f172a" stroke-width="1.2" marker-end="url(#seqArrowMuted)"/>
  <rect x="212" y="380" width="320" height="16" rx="2" fill="#f8fafc"/>
  <text x="216" y="392" fill="#0f172a" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">7. 按 Manifest.plist SinfPaths 顺序写入全组件 .sinf</text>

  <!-- OPT M8: X1 -> X4 -->
  <line x1="160" y1="452" x2="940" y2="452" stroke="#475569" stroke-width="1.4" marker-end="url(#seqArrowMuted)"/>
  <rect x="468" y="434" width="320" height="14" rx="2" fill="#f8fafc"/>
  <text x="628" y="444" text-anchor="middle" fill="#334155" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">8. mDNS 广播 _remotepairing-pairable-host (Mac17,7)</text>

  <!-- OPT M9: X4 -> X1 (Return dashed) -->
  <line x1="940" y1="488" x2="160" y2="488" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seqArrowGreen)"/>
  <rect x="444" y="470" width="368" height="14" rx="2" fill="#f8fafc"/>
  <text x="628" y="480" text-anchor="middle" fill="#065f46" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">9. 灵动岛弹出 6 位 PIN + 静音保活 → 持久化 RPPairing 密钥对</text>

  <!-- M10: X1 -> X4 (Upload) -->
  <line x1="160" y1="540" x2="940" y2="540" stroke="#059669" stroke-width="1.4" marker-end="url(#seqArrowGreen)"/>
  <rect x="432" y="522" width="392" height="14" rx="2" fill="#f8fafc"/>
  <text x="628" y="532" text-anchor="middle" fill="#065f46" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">10. TLS-PSK (10.7.0.1) → AFC 1MB 分块上传 PublicStaging</text>

  <!-- M11: X1 -> X4 (Focal Accent Headline Call) -->
  <line x1="160" y1="576" x2="940" y2="576" stroke="#e11d48" stroke-width="1.8" marker-end="url(#seqArrowAccent)"/>
  <rect x="412" y="556" width="432" height="16" rx="3" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8"/>
  <text x="628" y="568" text-anchor="middle" fill="#e11d48" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">11. installation_proxy::upgrade_with_callback (原地无损降级/安装)</text>

  <!-- Bottom Legend -->
  <g transform="translate(40, 616)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#475569" stroke-width="1.4" marker-end="url(#seqArrowMuted)"/>
    <text x="36" y="12" fill="#475569" font-size="11">同步请求</text>
    <line x1="112" y1="8" x2="140" y2="8" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seqArrowMuted)"/>
    <text x="148" y="12" fill="#475569" font-size="11">响应/凭据回传</text>
    <line x1="256" y1="8" x2="284" y2="8" stroke="#e11d48" stroke-width="1.8" marker-end="url(#seqArrowAccent)"/>
    <text x="292" y="12" fill="#e11d48" font-size="11" font-weight="600">核心原生部署交付指令</text>
    <text x="1020" y="12" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">SAPSigner.swift · OnDevicePairing.swift · lib.rs</text>
  </g>
</svg>
