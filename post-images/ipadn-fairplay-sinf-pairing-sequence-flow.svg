<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="seqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
  </defs>

  <rect width="1100" height="680" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="632" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="115" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#334155" font-size="11" font-weight="700" letter-spacing="1">PIPELINE FLOW</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">FairPlay SINF 编织与端侧免电脑原生安装交互全流程</text>
    <text x="0" y="74" fill="#475569" font-size="13">拆解从 mDNS 伪装配对、FairPlay 会话签名、SINF 多组件覆盖到 AFC 本地刷机的完整工程闭环</text>
  </g>

  <!-- Step 1 Card -->
  <g transform="translate(60, 144)">
    <rect width="980" height="106" rx="10" fill="#f8fafc" stroke="#253248" stroke-width="1" />
    <g transform="translate(20, 16)">
      <circle cx="16" cy="16" r="16" fill="#3b82f6" />
      <text x="11" y="22" fill="#f8fafc" font-size="16" font-weight="700">1</text>
      <text x="46" y="15" fill="#0284c7" font-size="11" font-weight="700">阶段一 · 端侧无电脑无线配对 (On-Device Local Developer Pairing)</text>
      <text x="46" y="32" fill="#f8fafc" font-size="14" font-weight="600">iPadn 伪装 Mac 广播 mDNS ➜ 捕获系统开发者配对 ➜ 导出 RPPairing 凭据</text>
    </g>
    <!-- Detailed tags inside Step 1 -->
    <g transform="translate(66, 64)">
      <g transform="translate(0, 0)">
        <rect width="280" height="28" rx="6" fill="#f8fafc" />
        <text x="10" y="18" fill="#334155" font-size="11">广播 _remotepairing-pairable-host._tcp (Mac17,7)</text>
      </g>
      <g transform="translate(295, 0)">
        <rect width="280" height="28" rx="6" fill="#f8fafc" />
        <text x="10" y="18" fill="#334155" font-size="11">灵动岛/锁屏 LiveActivity 显示 6 位配对 PIN</text>
      </g>
      <g transform="translate(590, 0)">
        <rect width="300" height="28" rx="6" fill="#f8fafc" />
        <text x="10" y="18" fill="#0284c7" font-size="11">生成 32 字节私钥与公钥的 RPPairing 证书文件</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 1 -->
  <g transform="translate(550, 250)">
    <path d="M 0 0 L 0 16" stroke="#334155" stroke-width="2" />
    <polygon points="-4,16 4,16 0,22" fill="#818cf8" />
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(60, 272)">
    <rect width="980" height="106" rx="10" fill="#faf5ff" stroke="#3730a3" stroke-width="1" />
    <g transform="translate(20, 16)">
      <circle cx="16" cy="16" r="16" fill="#6366f1" />
      <text x="11" y="22" fill="#f8fafc" font-size="16" font-weight="700">2</text>
      <text x="46" y="15" fill="#a5b4fc" font-size="11" font-weight="700">阶段二 · FairPlay 会话签名与商店 License 获取 (FairPlay SAP &amp; buyProduct)</text>
      <text x="46" y="32" fill="#f8fafc" font-size="14" font-weight="600">WebKit 隔离沙盒计算 SAP 签名 ➜ 派生 KBSync 凭据 ➜ 换取官方 DRM SINF</text>
    </g>
    <g transform="translate(66, 64)">
      <g transform="translate(0, 0)">
        <rect width="280" height="28" rx="6" fill="#faf5ff" />
        <text x="10" y="18" fill="#c7d2fe" font-size="11">SAPSigner 运行 sapInitialize &amp; sapSign</text>
      </g>
      <g transform="translate(295, 0)">
        <rect width="280" height="28" rx="6" fill="#faf5ff" />
        <text x="10" y="18" fill="#c7d2fe" font-size="11">基于 GUID+DSID 派生 KBSync 验证凭据</text>
      </g>
      <g transform="translate(590, 0)">
        <rect width="300" height="28" rx="6" fill="#faf5ff" />
        <text x="10" y="18" fill="#a5b4fc" font-size="11">向 buyProduct 请求并提取 song["sinfs"] 数组</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 2 -->
  <g transform="translate(550, 378)">
    <path d="M 0 0 L 0 16" stroke="#334155" stroke-width="2" />
    <polygon points="-4,16 4,16 0,22" fill="#34d399" />
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(60, 400)">
    <rect width="980" height="106" rx="10" fill="#f0fdf4" stroke="#065f46" stroke-width="1" />
    <g transform="translate(20, 16)">
      <circle cx="16" cy="16" r="16" fill="#10b981" />
      <text x="11" y="22" fill="#f8fafc" font-size="16" font-weight="700">3</text>
      <text x="46" y="15" fill="#059669" font-size="11" font-weight="700">阶段三 · 多组件 SINF 拓扑覆盖与正版元数据组装 (SINF Weaver &amp; Metadata)</text>
      <text x="46" y="32" fill="#f8fafc" font-size="14" font-weight="600">解构 Manifest.plist ➜ 覆盖 WatchKit/Extensions 授权 ➜ 注入 iTunesMetadata</text>
    </g>
    <g transform="translate(66, 64)">
      <g transform="translate(0, 0)">
        <rect width="280" height="28" rx="6" fill="#f0fdf4" />
        <text x="10" y="18" fill="#a7f3d0" font-size="11">解析 SC_Info/Manifest.plist 的 SinfPaths</text>
      </g>
      <g transform="translate(295, 0)">
        <rect width="280" height="28" rx="6" fill="#f0fdf4" />
        <text x="10" y="18" fill="#a7f3d0" font-size="11">杜绝单 SINF 漏传导致的桌面“白图标”</text>
      </g>
      <g transform="translate(590, 0)">
        <rect width="300" height="28" rx="6" fill="#f0fdf4" />
        <text x="10" y="18" fill="#059669" font-size="11">写入包含 itemId、DSPersonID 的官方根元数据</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 3 -->
  <g transform="translate(550, 506)">
    <path d="M 0 0 L 0 16" stroke="#334155" stroke-width="2" />
    <polygon points="-4,16 4,16 0,22" fill="#f43f5e" />
  </g>

  <!-- Step 4 Card (Focal Peak) -->
  <g transform="translate(60, 528)">
    <rect width="980" height="106" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" />
    <g transform="translate(20, 16)">
      <circle cx="16" cy="16" r="16" fill="#f43f5e" />
      <text x="11" y="22" fill="#f8fafc" font-size="16" font-weight="700">4</text>
      <text x="46" y="15" fill="#fda4af" font-size="11" font-weight="700">阶段四 · 突破沙盒环回与 Lockdownd 原生静默安装 (Native Lockdownd Deployment)</text>
      <text x="46" y="32" fill="#f8fafc" font-size="14" font-weight="700">LocalDevVPN 贯通 10.7.0.1 ➜ AFC 块上传暂存 ➜ installation_proxy 原地覆盖</text>
    </g>
    <g transform="translate(66, 64)">
      <g transform="translate(0, 0)">
        <rect width="280" height="28" rx="6" fill="#fff1f2" />
        <text x="10" y="18" fill="#fecdd3" font-size="11">本地 TUN 绕过 iOS 进程 localhost 封锁</text>
      </g>
      <g transform="translate(295, 0)">
        <rect width="280" height="28" rx="6" fill="#fff1f2" />
        <text x="10" y="18" fill="#fecdd3" font-size="11">AFC 上传至 PublicStaging/ipadn-native.ipa</text>
      </g>
      <g transform="translate(590, 0)">
        <rect width="300" height="28" rx="6" fill="#fff1f2" />
        <text x="10" y="18" fill="#e11d48" font-size="11">installd 识别为苹果正版，无损保留沙盒数据</text>
      </g>
    </g>
  </g>
</svg>
