<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-cpf-contribution-timeline-title singapore-pr-cpf-contribution-timeline-desc">
  <title id="singapore-pr-cpf-contribution-timeline-title">新加坡 PR 前三年 CPF 雇主与个人缴费率渐进演变</title>
  <desc id="singapore-pr-cpf-contribution-timeline-desc">展示新PR第1年至第3年法定缴费率递增路径，证实第3年起与公民17%+20%完全相同</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-blue { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0284c7; }
      .text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #047857; }
    </style>
  </defs>

  <rect width="960" height="260" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡 PR 渐进式 CPF 缴费率演进时间线 (55岁及以下标准)</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">破除“入籍公积金进账增多”谣言：满 2 年进入第 3 年起，PR 与公民缴费比例 100% 相同</text>

  <!-- Step 1: Year 1 -->
  <g transform="translate(40, 80)">
    <rect width="200" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="30" rx="8" fill="#f1f5f9"/>
    <text x="100" y="20" class="card-title" text-anchor="middle">取得 PR 第 1 年 (过渡期)</text>
    <g transform="translate(16, 42)">
      <text x="0" y="14" class="text-sub">雇主缴纳：<tspan class="text-blue">4%</tspan></text>
      <text x="0" y="34" class="text-sub">雇员缴纳：<tspan class="text-blue">5%</tspan></text>
      <line x1="0" y1="46" x2="168" y2="46" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="66" class="card-title">总缴费率：<tspan fill="#0284c7">9%</tspan></text>
      <text x="0" y="84" class="text-sub">渐进缓解雇佣成本冲击</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 155 L 275 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Step 2: Year 2 -->
  <g transform="translate(280, 80)">
    <rect width="200" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="30" rx="8" fill="#f1f5f9"/>
    <text x="100" y="20" class="card-title" text-anchor="middle">取得 PR 第 2 年 (递增期)</text>
    <g transform="translate(16, 42)">
      <text x="0" y="14" class="text-sub">雇主缴纳：<tspan class="text-blue">9%</tspan></text>
      <text x="0" y="34" class="text-sub">雇员缴纳：<tspan class="text-blue">15%</tspan></text>
      <line x1="0" y1="46" x2="168" y2="46" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="66" class="card-title">总缴费率：<tspan fill="#0284c7">24%</tspan></text>
      <text x="0" y="84" class="text-sub">阶梯式提高个人储蓄储备</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 485 155 L 515 155" stroke="#10b981" stroke-width="2" fill="none"/>

  <!-- Step 3: Year 3+ (Fully Equal) -->
  <g transform="translate(520, 80)">
    <rect width="400" height="150" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="400" height="30" rx="8" fill="#d1fae5"/>
    <text x="200" y="20" class="text-green" text-anchor="middle">取得 PR 第 3 年及以上 ＝ 新加坡公民标准</text>
    <g transform="translate(20, 42)">
      <text x="0" y="14" class="card-title">雇主缴纳：<tspan class="text-green">17%</tspan> ｜ 雇员缴纳：<tspan class="text-green">20%</tspan></text>
      <text x="0" y="34" class="text-sub">公积金总缴费率：<tspan class="text-green">37% 全额顶格</tspan></text>
      <line x1="0" y1="46" x2="360" y2="46" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="66" class="text-sub">• 普通账户 (OA 2.5%) + 特别账户 (SA 4.0%) + 保健储蓄 (MA 4.0%)</text>
      <text x="0" y="84" class="text-green">• 事实结论：老 PR 转入籍，公积金进账分文不增，无任何额外现金增量！</text>
    </g>
  </g>
</svg>