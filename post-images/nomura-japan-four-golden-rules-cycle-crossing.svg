<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="nomura-japan-four-golden-rules-cycle-crossing-title nomura-japan-four-golden-rules-cycle-crossing-desc">
  <title id="nomura-japan-four-golden-rules-cycle-crossing-title">日本穿越经济周期四大商业实操铁律</title>
  <desc id="nomura-japan-four-golden-rules-cycle-crossing-desc">总结买时间、卖治愈、研发机能防线与系统供应链四大跨周期商业准则</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="440" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">底层商业公理：野村证券复盘日本三十年穿越下行周期的四大实操铁律</text>
    <text x="896" y="16" text-anchor="end" class="tag">FOUR CORE PILLARS</text>
  </g>

  <!-- 4 Strategic Cards -->
  <!-- Rule 1: 买时间 -->
  <g transform="translate(32, 60)">
    <rect width="210" height="250" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="210" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="25" class="title">原则一：买时间</text>
    <text x="198" y="25" text-anchor="end" class="tag">TIME CAPITAL</text>

    <g transform="translate(12, 54)">
      <text class="title" style="font-size:12px;" x="0" y="0">消灭琐碎家务与流程</text>
      <text class="desc" x="0" y="20">• 双职工与独居浪潮下时间最稀缺</text>
      <text class="desc" x="0" y="38">• 预制菜不是退化，是家庭解放</text>
      <text class="desc" x="0" y="56">• 复合面汁让无经验者 3 分钟出餐</text>
      <text class="desc" x="0" y="74">• 台式免安装洗碗机与扫地机器人</text>
      <text class="tag" x="0" y="106">优先占据家庭账本扣款权</text>
    </g>
  </g>

  <!-- Rule 2: 卖治愈 -->
  <g transform="translate(258, 60)">
    <rect width="210" height="250" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="210" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="25" class="title">原则二：卖治愈</text>
    <text x="198" y="25" text-anchor="end" class="tag">DOPAMINE</text>

    <g transform="translate(12, 54)">
      <text class="title" style="font-size:12px;" x="0" y="0">平价微醺与无压陪伴</text>
      <text class="desc" x="0" y="20">• 审慎务实者依然渴望日常犒劳</text>
      <text class="desc" x="0" y="38">• 7°~9° 强碳酸 RTD 带来快速微醺</text>
      <text class="desc" x="0" y="56">• 宠物拟人化成为深层情感代偿</text>
      <text class="desc" x="0" y="74">• 户外露营营建精神疗愈空间</text>
      <text class="tag" x="0" y="106">低门槛多巴胺付费高意愿</text>
    </g>
  </g>

  <!-- Rule 3: 研发级机能防线 (Core Accent) -->
  <g transform="translate(484, 60)">
    <rect width="218" height="250" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="218" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="218" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="218" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="12" y="25" class="coral-title">原则三：研发机能防线</text>
    <text x="206" y="25" text-anchor="end" class="coral-tag">MOAT</text>

    <g transform="translate(12, 54)">
      <text class="coral-title" style="font-size:12px;" x="0" y="0">硬核专利突破比价泥潭</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="20">• 拒绝同质化风味与价格踩踏</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="38">• 明治深耕微生物靶向临床菌种</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="56">• 龟甲万单向阀锁鲜瓶打破酱油上限</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="74">• 优衣库 HeatTech 重构服装属性</text>
      <text class="coral-tag" x="0" y="106">掌握向上转移成本的定价权</text>
    </g>
  </g>

  <!-- Rule 4: 系统级供应链重构 -->
  <g transform="translate(718, 60)">
    <rect width="210" height="250" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="210" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="25" class="title">原则四：供应链重构</text>
    <text x="198" y="25" text-anchor="end" class="tag">SUPPLY CHAIN</text>

    <g transform="translate(12, 54)">
      <text class="title" style="font-size:12px;" x="0" y="0">工业工程消灭隐性损耗</text>
      <text class="desc" x="0" y="20">• SPA 制造零售一体直连全球代工</text>
      <text class="desc" x="0" y="38">• 萨莉亚以秒度量动作杜绝浪费</text>
      <text class="desc" x="0" y="56">• 藏寿司自动化捏饭机与 IC 芯片</text>
      <text class="desc" x="0" y="74">• 宿泊特化剔除豪华大堂与宴会厅</text>
      <text class="tag" x="0" y="106">以极限周转压低管理摩擦</text>
    </g>
  </g>

  <!-- Connectors from 4 rules down to Outcome -->
  <path d="M 137 310 L 137 340 L 480 340" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  <path d="M 363 310 L 363 340 L 480 340" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  <path d="M 593 310 L 593 340 L 480 340" stroke="#bf4520" stroke-width="1.5" fill="none" />
  <path d="M 823 310 L 823 340 L 480 340" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  <path d="M 480 340 L 480 360" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Bottom Final Outcome Node -->
  <g transform="translate(240, 360)">
    <rect width="480" height="60" fill="#f0fdf4" rx="8" stroke="#15803d" stroke-width="1.5" />
    <g transform="translate(20, 15)">
      <text class="green-title" style="font-size:13px;" x="0" y="0">最终公理：彻底摆脱低质价格战，赢得跨周期生存权与超额利润</text>
      <text class="desc" style="fill:#166534;" x="0" y="20">在消费总量见顶时代，唯有技术创新提附加值与组织提效者能够长青</text>
    </g>
  </g>
</svg>