<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="ivyclaw-full-arch-title ivyclaw-full-arch-desc">
  <title id="ivyclaw-full-arch-title">IvyClaw 生产级多智能体软件工程全景架构</title>
  <desc id="ivyclaw-full-arch-desc">展示从客户端多渠道接入、API网关治理、异步调度中枢、沙箱基础设施、状态持久化到可观测性平台的完整闭环拓扑</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .layer-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-layer { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 4; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow2-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="490" class="bg" />

  <!-- Layer 1: Multi-Channels (y=30, h=60) -->
  <g transform="translate(40, 30)">
    <rect width="880" height="60" rx="6" class="layer-card" />
    <text x="16" y="24" class="text-title">1. 多渠道接入层 (Client &amp; Channels)</text>
    <g transform="translate(260, 14)">
      <rect width="130" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">CLI 调试终端</text>
    </g>
    <g transform="translate(410, 14)">
      <rect width="140" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">FastAPI Web 接口</text>
    </g>
    <g transform="translate(570, 14)">
      <rect width="160" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">飞书 WS 长连接 (免公网)</text>
    </g>
    <g transform="translate(750, 14)">
      <rect width="110" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">通用 Webhook</text>
    </g>
  </g>

  <!-- Connector L1 -> L2 -->
  <line x1="480" y1="90" x2="480" y2="108" class="line" marker-end="url(#arrow2)" />

  <!-- Layer 2: API Gateway &amp; Governance (y=110, h=60) -->
  <g transform="translate(40, 110)">
    <rect width="880" height="60" rx="6" class="layer-card" />
    <text x="16" y="24" class="text-title">2. 网关治理层 (API Gateway)</text>
    <g transform="translate(260, 14)">
      <rect width="140" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">API Key 认证 / 租户</text>
    </g>
    <g transform="translate(420, 14)">
      <rect width="150" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">SlowAPI + Redis 限流</text>
    </g>
    <g transform="translate(590, 14)">
      <rect width="140" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">Redis SETNX 幂等防重</text>
    </g>
    <g transform="translate(750, 14)">
      <rect width="110" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">审计日志中间件</text>
    </g>
  </g>

  <!-- Connector L2 -> L3 -->
  <line x1="480" y1="170" x2="480" y2="188" class="focal-line" marker-end="url(#arrow2-focal)" />

  <!-- Layer 3: Dispatcher Core Multi-Agent (y=190, h=100) - Focal -->
  <g transform="translate(40, 190)">
    <rect width="880" height="100" rx="8" class="focal-card" />
    <text x="16" y="26" class="text-focal-title">3. 调度与多智能体中枢 (Dispatcher &amp; LangGraph Multi-Agent)</text>
    <text x="690" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#bf4520">独立 Thread 隔离交接</text>

    <!-- 6 Sub-agents -->
    <g transform="translate(16, 42)">
      <rect width="128" height="46" class="focal-pill" />
      <text x="8" y="18" class="text-subtitle" fill="#bf4520">0. Classifier</text>
      <text x="8" y="34" class="text-muted">零工具轻量分诊</text>
    </g>
    <g transform="translate(156, 42)">
      <rect width="132" height="46" class="focal-pill" />
      <text x="8" y="18" class="text-subtitle" fill="#bf4520">1. Planner</text>
      <text x="8" y="34" class="text-muted">拆解计划与验收约束</text>
    </g>
    <g transform="translate(300, 42)">
      <rect width="132" height="46" class="focal-pill" />
      <text x="8" y="18" class="text-subtitle" fill="#bf4520">2. Researcher</text>
      <text x="8" y="34" class="text-muted">代码定位与API调研</text>
    </g>
    <g transform="translate(444, 42)">
      <rect width="132" height="46" class="focal-pill" />
      <text x="8" y="18" class="text-subtitle" fill="#bf4520">3. Coder</text>
      <text x="8" y="34" class="text-muted">最小侵入修改落盘</text>
    </g>
    <g transform="translate(588, 42)">
      <rect width="132" height="46" class="focal-pill" />
      <text x="8" y="18" class="text-subtitle" fill="#bf4520">4. Tester</text>
      <text x="8" y="34" class="text-muted">沙箱真实 pytest 运行</text>
    </g>
    <g transform="translate(732, 42)">
      <rect width="132" height="46" class="focal-pill" />
      <text x="8" y="18" class="text-subtitle" fill="#bf4520">5. Reviewer</text>
      <text x="8" y="34" class="text-muted">结构化审查/安全合规</text>
    </g>
  </g>

  <!-- Connectors from Dispatcher to Sandbox &amp; Storage -->
  <line x1="260" y1="290" x2="260" y2="308" class="line" marker-end="url(#arrow2)" />
  <line x1="700" y1="290" x2="700" y2="308" class="line" marker-end="url(#arrow2)" />

  <!-- Layer 4: Left = Docker Sandboxes, Right = Storage &amp; Async (y=310, h=90) -->
  <!-- Left Box: Sandboxes (x=40, w=430) -->
  <g transform="translate(40, 310)">
    <rect width="430" height="90" rx="6" class="layer-card" />
    <text x="16" y="24" class="text-title">4. 沙箱基础设施 (Docker SandboxPool)</text>
    <g transform="translate(16, 36)">
      <rect width="185" height="42" class="pill" />
      <text x="8" y="18" class="text-subtitle">DevSandbox (可读写)</text>
      <text x="8" y="32" class="text-muted">tmpfs 512M / 断网 / 非root</text>
    </g>
    <g transform="translate(215, 36)">
      <rect width="195" height="42" class="focal-pill" />
      <text x="8" y="18" class="text-subtitle" fill="#bf4520">RO_Sandbox (物理只读)</text>
      <text x="8" y="32" class="text-muted">chmod a-w 物理硬隔离审查</text>
    </g>
  </g>

  <!-- Right Box: Storage &amp; Queue (x=490, w=430) -->
  <g transform="translate(490, 310)">
    <rect width="430" height="90" rx="6" class="layer-card" />
    <text x="16" y="24" class="text-title">5. 状态持久化与异步运行时</text>
    <g transform="translate(16, 36)">
      <rect width="190" height="42" class="pill" />
      <text x="8" y="18" class="text-subtitle">PostgreSQL Checkpointer</text>
      <text x="8" y="32" class="text-muted">会话快照与中断审批恢复</text>
    </g>
    <g transform="translate(220, 36)">
      <rect width="190" height="42" class="pill" />
      <text x="8" y="18" class="text-subtitle">Redis + ARQ Worker 集群</text>
      <text x="8" y="32" class="text-muted">长任务异步解耦与重试兜底</text>
    </g>
  </g>

  <!-- Layer 5: Observability Stack (y=415, h=55) -->
  <g transform="translate(40, 415)">
    <rect width="880" height="55" rx="6" class="layer-card" />
    <text x="16" y="24" class="text-title">6. 可观测与度量平台 (Observability Stack)</text>
    <g transform="translate(280, 12)">
      <rect width="260" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">Prometheus (RED + Token 实时核算)</text>
    </g>
    <g transform="translate(560, 12)">
      <rect width="170" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">Grafana 生产监控看板</text>
    </g>
    <g transform="translate(750, 12)">
      <rect width="110" height="32" class="pill" />
      <text x="12" y="20" class="text-subtitle">LangSmith 追踪</text>
    </g>
  </g>
</svg>