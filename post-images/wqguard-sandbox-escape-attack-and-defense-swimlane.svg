<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="sw-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="sw-arrow-coral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="sw-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="sw-arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="32" font-size="17" font-weight="700" fill="#0f172a">两阶段沙盒逃逸利用链 (worse_query) 物理机理与 WQGuard 深度防御泳道</text>
    <text x="660" y="32" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#0284c7" font-weight="600">CROSS-PRIVILEGE SWIMLANE</text>
  </g>

  <!-- Swimlane Columns Background -->
  <!-- Col 1: Untrusted Sideloaded App -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="210" height="660" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="210" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="25" font-size="12" font-weight="700" fill="#0f172a">侧载可疑应用 (用户态沙盒)</text>
    <text x="18" y="36" font-size="9" fill="#64748b">Untrusted Sideloaded App</text>
  </g>

  <!-- Col 2: Darwin Kernel & Seatbelt MACF -->
  <g transform="translate(260, 90)">
    <rect x="0" y="0" width="220" height="660" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="220" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="25" font-size="12" font-weight="700" fill="#0f172a">Darwin 内核与 Seatbelt 策略</text>
    <text x="18" y="36" font-size="9" fill="#64748b">Kernel Sandbox MACF &amp; APFS</text>
  </g>

  <!-- Col 3: containermanagerd (Privileged Deputy) -->
  <g transform="translate(490, 90)">
    <rect x="0" y="0" width="230" height="660" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="25" font-size="12" font-weight="700" fill="#0f172a">containermanagerd 守护进程</text>
    <text x="18" y="36" font-size="9" fill="#64748b">Privileged Authorized Deputy</text>
  </g>

  <!-- Col 4: Victim Target Container -->
  <g transform="translate(730, 90)">
    <rect x="0" y="0" width="190" height="660" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="190" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="25" font-size="12" font-weight="700" fill="#0f172a">受害者数据容器 (目标)</text>
    <text x="18" y="36" font-size="9" fill="#64748b">Victim App Data Container</text>
  </g>

  <!-- Step 1: Stage 1 Inode Brute-Force Leak -->
  <g transform="translate(55, 145)">
    <rect x="0" y="0" width="180" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="700" fill="#e11d48">阶段 1 · bad_query 侦察</text>
    <text x="10" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">fsgetpath(fsid, ino)</text>
    <text x="10" y="48" font-size="9" fill="#64748b">遍历千万级 APFS Inode 反查路径</text>
    <text x="10" y="58" font-size="8.5" fill="#9f1239">绕过 readdir() 跨容器拒绝</text>
  </g>

  <!-- Flow 1 -> 2: Query APFS -->
  <path d="M 235 177 L 275 177" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#sw-arrow-coral)"/>

  <!-- Step 1 Kernel Response -->
  <g transform="translate(275, 150)">
    <rect x="0" y="0" width="190" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="10" y="18" font-size="10.5" font-weight="600" fill="#0f172a">APFS Inode 映射泄露</text>
    <text x="10" y="34" font-size="9" fill="#64748b">内核反推返回真实容器路径:</text>
    <text x="10" y="46" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#e11d48">/Data/Application/&lt;UUID&gt;</text>
  </g>

  <!-- WQGuard Barrier 1 -->
  <g transform="translate(55, 222)">
    <rect x="0" y="0" width="410" height="42" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="18" font-size="11" font-weight="700" fill="#059669">🛡️ WQGuard 防御门禁 1 · SYM_FSGETPATH 免 AppGroup 前置拦截</text>
    <text x="12" y="32" font-size="9.5" fill="#065f46">静态分析遍历 LC_SYMTAB，无需 App Group 声明即刻捕捉底层侦察原语，直接判定高危</text>
  </g>

  <!-- Step 2: Symlink Creation in Own AppGroup -->
  <g transform="translate(55, 280)">
    <rect x="0" y="0" width="180" height="74" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="700" fill="#e11d48">阶段 2 · 软链替身掉包</text>
    <text x="10" y="34" font-size="9" fill="#0f172a">删除合法 Library/Caches 目录</text>
    <text x="10" y="48" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">symlink(targetVictim,</text>
    <text x="10" y="58" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">        cachesPath)</text>
    <text x="10" y="68" font-size="8" fill="#9f1239">构造跨容器指向逃逸软链</text>
  </g>

  <!-- Step 3: Trigger containermanagerd Query -->
  <g transform="translate(55, 370)">
    <rect x="0" y="0" width="180" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="600" fill="#0f172a">发起合法容器 XPC 查询</text>
    <text x="10" y="34" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">query_set_class(7)</text>
    <text x="10" y="46" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">query_set_part(3)</text>
    <text x="10" y="58" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">query_get_single_result()</text>
  </g>

  <!-- Flow 3 -> 4: Send XPC to Daemon -->
  <path d="M 235 403 L 505 403" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#sw-arrow-blue)"/>
  <text x="280" y="396" font-size="9.5" fill="#0284c7" font-weight="600">XPC: com.apple.containermanagerd</text>

  <!-- Step 4 in containermanagerd -->
  <g transform="translate(505, 370)">
    <rect x="0" y="0" width="200" height="88" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="700" fill="#ea580c">混淆替身受骗 (Confused Deputy)</text>
    <text x="10" y="34" font-size="9" fill="#0f172a">1. 验签 AppGroup 归属: ✅ 合法通过</text>
    <text x="10" y="48" font-size="9" fill="#0f172a">2. realpath 解析 Part 3 (Library/Caches)</text>
    <text x="10" y="62" font-size="9" font-weight="700" fill="#e11d48">⚠️ 缺陷: 漏校验真实路径边界是否越界!</text>
    <text x="10" y="76" font-size="8.5" fill="#c2410c">直接跟随软链穿入受害者应用目录</text>
  </g>

  <!-- Step 5: Issue Extension Token -->
  <g transform="translate(505, 475)">
    <rect x="0" y="0" width="200" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="600" fill="#0f172a">调用内核特权接口签发令牌</text>
    <text x="10" y="34" font-size="8" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">sandbox_extension_issue_file(</text>
    <text x="10" y="44" font-size="8" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">  "com.apple.app-sandbox.read-write",</text>
    <text x="10" y="54" font-size="8" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">  resolvedVictimPath, 0)</text>
  </g>

  <path d="M 605 458 L 605 475" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#sw-arrow-coral)"/>

  <!-- Flow 5 -> Kernel Token Generation -->
  <path d="M 505 508 L 470 508" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#sw-arrow-blue)"/>

  <!-- Step 6: Kernel Seatbelt Token Generated -->
  <g transform="translate(275, 485)">
    <rect x="0" y="0" width="190" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="18" font-size="10.5" font-weight="600" fill="#0f172a">内核签发沙盒扩展令牌</text>
    <text x="10" y="32" font-size="9" fill="#64748b">包含受害者真实路径授权</text>
    <text x="10" y="44" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#059669">Mac Extension Token</text>
  </g>

  <!-- Return Token to Sideloaded App -->
  <path d="M 275 515 L 235 515" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#sw-arrow-blue)"/>

  <!-- Step 7: Consume Token & Infiltrate Victim -->
  <g transform="translate(55, 555)">
    <rect x="0" y="0" width="180" height="74" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="700" fill="#e11d48">消费令牌与窃取数据</text>
    <text x="10" y="34" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">sandbox_extension_consume()</text>
    <text x="10" y="48" font-size="9" fill="#0f172a">获得内核物理读写凭证</text>
    <text x="10" y="62" font-size="8.5" fill="#9f1239">直接跨沙盒读取钱包助记词与聊天记录</text>
  </g>

  <!-- Penetrate Victim Container -->
  <path d="M 235 592 L 745 592" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#sw-arrow-coral)"/>

  <g transform="translate(745, 560)">
    <rect x="0" y="0" width="160" height="64" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="10" y="20" font-size="11" font-weight="700" fill="#ef4444">💥 受害者数据失窃</text>
    <text x="10" y="36" font-size="9" fill="#7f1d1d">Keychain / 相册 / 数据库</text>
    <text x="10" y="48" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#991b1b">Documents/wallet.dat</text>
  </g>

  <!-- WQGuard Master Defense Matrix (Bottom Banner) -->
  <g transform="translate(55, 650)">
    <rect x="0" y="0" width="850" height="85" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#059669">🛡️ WQGuard 全链路主动拦截与物理只读取证体系</text>
    
    <g transform="translate(16, 32)">
      <text x="0" y="14" font-size="10" font-weight="600" fill="#065f46">1. 静态签名门禁：</text>
      <text x="95" y="14" font-size="10" fill="#047857">双槽 CSBlob (Slot 5 ∪ Slot 7) 解算，无 AppGroup 物理不可能发起 worse_query，0 风险安全放行</text>

      <text x="0" y="28" font-size="10" font-weight="600" fill="#065f46">2. 行为元组侦测：</text>
      <text x="95" y="28" font-size="10" fill="#047857">命中 cryptid==0 ∧ dlopen ∧ symlink 立即判定 CM-07 高危，无视 XOR 字符串加密与符号剥离</text>

      <text x="0" y="42" font-size="10" font-weight="600" fill="#065f46">3. 只读非递归取证：</text>
      <text x="95" y="42" font-size="10" fill="#047857">以 lstat + readlink 原位取证越界软链，配合 ScopedSandboxToken 及时释放句柄，零崩溃零写操作</text>
    </g>
  </g>
</svg>