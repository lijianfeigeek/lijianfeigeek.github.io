      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .axis-label { font-family: ui-monospace, monospace; font-size: 11px; fill: #64748b; }
      .bar-val { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #0284c7; }
