<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a16z-som2-token-price-vs-volume-jevons-title a16z-som2-token-price-vs-volume-jevons-desc">
  <title id="a16z-som2-token-price-vs-volume-jevons-title">模型 Token 推理单价断崖下跌与全网调用总量指数倍增对比 (2024-2026)</title>
  <desc id="a16z-som2-token-price-vs-volume-jevons-desc">展示近三年每百万Token成本从15美元降至0.3美元，而调用量指数由100飙升至3100的杰文斯悖论实证柱状与趋势图</desc>
  <defs>
    <style>
