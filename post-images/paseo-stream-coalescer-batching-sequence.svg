<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="paseo-stream-coalescer-batching-sequence-title paseo-stream-coalescer-batching-sequence-desc">
  <title id="paseo-stream-coalescer-batching-sequence-title">Paseo 高频 Token 流滑动窗口聚合时序</title>
  <desc id="paseo-stream-coalescer-batching-sequence-desc">展示大模型吐字 Chunk 进入 AgentStreamCoalescer 并在 16ms 窗口内合并为单帧下发的过程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">PASEO 流式治理：AGENTSTREAMCOALESCER 滑动窗口合并时序交互</text>
    <text x="896" y="16" text-anchor="end" class="tag">SLIDING WINDOW THROTTLING (16MS)</text>
  </g>

  <!-- Actors Header -->
  <!-- Actor 1: LLM Subprocess -->
  <g transform="translate(80, 56)">
    <rect width="200" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="25" text-anchor="middle" class="seq-actor">模型 / Agent 子进程</text>
  </g>
  <line x1="180" y1="96" x2="180" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Actor 2: AgentStreamCoalescer (Core Focus) -->
  <g transform="translate(380, 56)">
    <rect width="200" height="40" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" class="coral-title" style="font-size:13px;">AgentStreamCoalescer</text>
  </g>
  <line x1="480" y1="96" x2="480" y2="380" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Actor 3: Frontend Timeline -->
  <g transform="translate(680, 56)">
    <rect width="200" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="25" text-anchor="middle" class="seq-actor">桌面 / 移动端 Timeline</text>
  </g>
  <line x1="780" y1="96" x2="780" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Messages &amp; Notes -->
  <!-- Step 1: Token 1 -->
  <line x1="180" y1="120" x2="480" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="210" y="114" class="seq-msg">Token Chunk 1 (t = 0ms)</text>

  <!-- Step 2: Token 2 -->
  <line x1="180" y1="150" x2="480" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="210" y="144" class="seq-msg">Token Chunk 2 (t = 3ms)</text>

  <!-- Step 3: Token 3 -->
  <line x1="180" y1="180" x2="480" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="210" y="174" class="seq-msg">Token Chunk 3 (t = 7ms)</text>

  <!-- Coalescer Buffer Box -->
  <g transform="translate(370, 196)">
    <rect width="220" height="44" fill="#ffffff" rx="6" stroke="#bf4520" stroke-width="1" />
    <text x="110" y="18" text-anchor="middle" class="coral-tag">命中 16ms 聚合窗口</text>
    <text x="110" y="34" text-anchor="middle" class="seq-note">避免逐字触发全链路 React 重绘与掉帧</text>
  </g>

  <!-- Step 4: Batch dispatch 1 -->
  <line x1="480" y1="256" x2="780" y2="256" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)" />
  <text x="510" y="250" class="coral-tag" style="font-size:11px;">批量派发合并增量帧 1~3 (t = 16ms)</text>

  <!-- Step 5: Token 4 -->
  <line x1="180" y1="290" x2="480" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="210" y="284" class="seq-msg">Token Chunk 4 (t = 20ms)</text>

  <!-- Step 6: Token 5 -->
  <line x1="180" y1="320" x2="480" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="210" y="314" class="seq-msg">Token Chunk 5 (t = 25ms)</text>

  <!-- Step 7: Batch dispatch 2 -->
  <line x1="480" y1="350" x2="780" y2="350" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)" />
  <text x="510" y="344" class="coral-tag" style="font-size:11px;">批量派发合并增量帧 4~5 (t = 32ms)</text>
</svg>