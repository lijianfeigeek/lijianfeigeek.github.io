<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="nomura-japan-saizeriya-extreme-efficiency-loop-title nomura-japan-saizeriya-extreme-efficiency-loop-desc">
  <title id="nomura-japan-saizeriya-extreme-efficiency-loop-title">萨莉亚工业工程学极致效率闭环模型</title>
  <desc id="nomura-japan-saizeriya-extreme-efficiency-loop-desc">拆解萨莉亚全产业链垂直掌控、后厨零菜刀、IE测秒动作研究、国民平价与超高翻台率的利润飞轮</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">工业工程学降维打击：萨莉亚（SAIZERIYA）平价神话背后的五维效率闭环</text>
    <text x="896" y="16" text-anchor="end" class="coral-tag">TOYOTA LEAN IN RESTAURANTS</text>
  </g>

  <!-- 5 Nodes Horizontal Loop Progression -->
  <!-- Node 1: Supply Chain -->
  <g transform="translate(32, 60)">
    <rect width="170" height="230" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="170" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="170" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="170" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="23" class="title">1. 全产业链掌控</text>
    <text x="158" y="23" text-anchor="end" class="tag">SUPPLY</text>

    <g transform="translate(12, 50)">
      <text class="title" style="font-size:12px;" x="0" y="0">源头消灭中间商</text>
      <text class="desc" x="0" y="20">• 日本本土直营农场育种</text>
      <text class="desc" x="0" y="38">• 澳洲数十万平米牛肉基地</text>
      <text class="desc" x="0" y="56">• 意大利直投独资酒庄直采</text>
      <text class="tag" x="0" y="86">原料成本极度可控</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 202 175 L 216 175" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Node 2: Kitchen Zero-Knife -->
  <g transform="translate(216, 60)">
    <rect width="170" height="230" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="170" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="170" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="170" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="23" class="title">2. 后厨彻底革命</text>
    <text x="158" y="23" text-anchor="end" class="tag">ZERO-KNIFE</text>

    <g transform="translate(12, 50)">
      <text class="title" style="font-size:12px;" x="0" y="0">全店无一把菜刀</text>
      <text class="desc" x="0" y="20">• 中央厨房完成洗净预切</text>
      <text class="desc" x="0" y="38">• 专用电烤箱微波定时出餐</text>
      <text class="desc" x="0" y="56">• 兼职服务生培训2天即上岗</text>
      <text class="tag" x="0" y="86">后厨面积与人力骤减</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 386 175 L 400 175" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Node 3: IE Motion Study (Core Accent) -->
  <g transform="translate(400, 60)">
    <rect width="176" height="230" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="176" height="36" fill="#fff5f5" rx="8" />
    <rect y="28" width="176" height="8" fill="#fff5f5" />
    <line x1="0" y1="36" x2="176" y2="36" stroke="#fed7d7" stroke-width="1" />
    <text x="12" y="23" class="coral-title">3. 工业工程 IE 测秒</text>
    <text x="164" y="23" text-anchor="end" class="coral-tag">LEAN IE</text>

    <g transform="translate(12, 50)">
      <text class="coral-title" style="font-size:12px;" x="0" y="0">丰田精益搬进餐厅</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="20">• 抹布单向擦拭省去往复耗时</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="38">• 特制托盘单手托多份菜品</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="56">• 精确测算服务员走动步数</text>
      <text class="coral-tag" x="0" y="86">翻台与清洁效率极限化</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 576 175 L 590 175" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Node 4: 100-Yen Pricing -->
  <g transform="translate(590, 60)">
    <rect width="170" height="230" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="170" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="170" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="170" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="23" class="title">4. 百元国民平价</text>
    <text x="158" y="23" text-anchor="end" class="tag">PRICING</text>

    <g transform="translate(12, 50)">
      <text class="title" style="font-size:12px;" x="0" y="0">200-500 日元核心带</text>
      <text class="desc" x="0" y="20">• 肉酱意面仅 300 日元</text>
      <text class="desc" x="0" y="38">• 意大利红酒仅 100 日元/杯</text>
      <text class="desc" x="0" y="56">• 成为家庭与学生的平价良心</text>
      <text class="tag" x="0" y="86">形成无敌客流虹吸</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 760 175 L 774 175" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Node 5: Healthy Margin -->
  <g transform="translate(774, 60)">
    <rect width="154" height="230" fill="#f0fdf4" rx="8" stroke="#15803d" stroke-width="1.5" />
    <rect width="154" height="36" fill="#dcfce7" rx="8" />
    <rect y="28" width="154" height="8" fill="#dcfce7" />
    <line x1="0" y1="36" x2="154" y2="36" stroke="#bbf7d0" stroke-width="1" />
    <text x="10" y="23" class="green-title" style="font-size:13px;">5. 健康营业利润</text>

    <g transform="translate(10, 50)">
      <text class="green-title" style="font-size:12px;" x="0" y="0">高坪效破除通缩</text>
      <text class="desc" style="fill:#166534;" x="0" y="20">• 极高客流带来高周转</text>
      <text class="desc" style="fill:#166534;" x="0" y="38">• 利润来自消灭隐性浪费</text>
      <text class="desc" style="fill:#166534;" x="0" y="56">• 绝非赔本赚吆喝</text>
      <text class="green-tag" x="0" y="86">利润再反哺供应链</text>
    </g>
  </g>

  <!-- Closed-loop Feedback Arrow -->
  <path d="M 851 290 L 851 340 L 117 340 L 117 290" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 3" fill="none" marker-end="url(#arrow)" />
  <rect x="380" y="330" width="200" height="22" fill="#ffffff" rx="4" stroke="#15803d" stroke-width="1" />
  <text x="480" y="345" text-anchor="middle" class="green-tag">正向增强闭环：规模扩张强化直采议价权</text>
</svg>