<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="wb-obsidian-title wb-obsidian-desc">
  <title id="wb-obsidian-title">ObsidianNote 增量消息指纹排重与双链知识库合并引擎</title>
  <desc id="wb-obsidian-desc">展示如何通过 YAML Front-matter 元数据、正则消息指纹比对实现对历史微信群聊笔记的增量更新与附件双链追加。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">ObsidianNote 增量消息指纹排重与合并引擎</text>
    <text class="subtitle" x="0" y="20">告别全量覆盖与同名碎片化笔记，基于结构化 YAML 与消息指纹的增量追加</text>
  </g>

  <!-- Left: New Archive Stream -->
  <g transform="translate(48, 86)">
    <rect width="250" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="16" y="24">1. 新转入微信归档 (New Archive)</text>

    <g transform="translate(16, 44)">
      <rect width="218" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">解析 聊天记录.txt</text>
        <text class="card-body" x="0" y="16">• 正则提取消息结构体</text>
        <text class="mono" fill="#2563eb" x="0" y="32">sender: 发送人昵称</text>
        <text class="mono" fill="#2563eb" x="0" y="46">timestamp: 2026-10-06 21:15</text>
        <text class="mono" fill="#2563eb" x="0" y="60">body: 文字正文 / 附件标号</text>
      </g>
    </g>

    <g transform="translate(16, 142)">
      <rect width="218" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">生成候选消息指纹</text>
        <text class="mono" fill="#475569" x="0" y="16">Key = sender + timestamp</text>
        <text class="card-body" x="0" y="32">• 精确锚定消息时间空间坐标</text>
        <text class="card-body" x="0" y="48">• 提取附带的图片/视频/文档</text>
      </g>
    </g>

    <g transform="translate(16, 240)">
      <rect width="218" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">候选消息序列</text>
        <text class="card-body" x="0" y="18">共 N 条待合并消息与附件切片</text>
        <text class="mono" fill="#1e40af" x="0" y="36">Ready for Differential Merge</text>
      </g>
    </g>
  </g>

  <!-- Middle: Existing Note in Vault -->
  <g transform="translate(322, 86)">
    <rect width="250" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="16" y="24">2. 原有群聊笔记 (Existing Note)</text>

    <g transform="translate(16, 44)">
      <rect width="218" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">YAML Front-matter 元数据</text>
        <text class="mono" fill="#475569" x="0" y="16">source: WeChat</text>
        <text class="mono" fill="#475569" x="0" y="30">group_name: "核心架构组"</text>
        <text class="mono" fill="#475569" x="0" y="44">messages_count: 320</text>
        <text class="mono" fill="#475569" x="0" y="58">last_export: 2026-10-05</text>
      </g>
    </g>

    <g transform="translate(16, 142)">
      <rect width="218" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">构建已有指纹库 (Set)</text>
        <text class="card-body" x="0" y="16">• 正则扫描历史正文</text>
        <text class="mono" fill="#2563eb" x="0" y="32">**发送人** · 日期时间</text>
        <text class="card-body" x="0" y="48">• 提取历史全量 messageKey</text>
      </g>
    </g>

    <g transform="translate(16, 240)">
      <rect width="218" height="80" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#b45309" x="0" y="0">已有指纹基线</text>
        <text class="card-body" x="0" y="18">快速比对检索表 (O(1) 查找)</text>
        <text class="mono" fill="#b45309" x="0" y="36">Baseline Fingerprint Cache</text>
      </g>
    </g>
  </g>

  <!-- Right: Merge &amp; Append Engine -->
  <g transform="translate(596, 86)">
    <rect width="316" height="348" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text class="box-title" fill="#5b21b6" x="16" y="24">3. 增量合并排重引擎 (ObsidianNote.merge)</text>

    <!-- Substep 1 -->
    <g transform="translate(16, 44)">
      <rect width="284" height="74" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#6d28d9" x="0" y="0">差集比对与去重过滤</text>
        <text class="mono" fill="#4c1d95" x="0" y="16">filter { !existingKeys.contains($0.key) }</text>
        <text class="card-body" x="0" y="32">• 自动消除两次转发之间的重叠区间消息</text>
        <text class="card-body" x="0" y="48">• 仅保留全新生成的增量消息</text>
      </g>
    </g>

    <!-- Substep 2 -->
    <g transform="translate(16, 132)">
      <rect width="284" height="74" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#6d28d9" x="0" y="0">原子更新 Front-matter</text>
        <text class="card-body" x="0" y="16">• 累加更新 messages_count 总计数值</text>
        <text class="card-body" x="0" y="32">• 更新 last_export 导出时间戳为当前</text>
        <text class="mono" fill="#15803d" x="0" y="48">KEEP: 保留用户手工添加的 tags 与双链</text>
      </g>
    </g>

    <!-- Substep 3 -->
    <g transform="translate(16, 220)">
      <rect width="284" height="108" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
      <g transform="translate(12, 18)">
        <text class="card-title" fill="#5b21b6" x="0" y="0">格式化追加消息与双链资产</text>
        <text class="card-body" fill="#4c1d95" x="0" y="18">• 格式化为 Markdown 引用块与发言人标题</text>
        <text class="mono" fill="#5b21b6" x="0" y="36">![[附件/image_20261006_01.png]]</text>
        <text class="card-body" fill="#4c1d95" x="0" y="54">• 附件自动复制入 Vault 的 Attachments/ 目录</text>
        <text class="mono" fill="#15803d" x="0" y="74">SUCCESS: 完美融合为连续平滑的群聊知识图谱</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 298 260 L 322 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="322,260 316,256 316,264" fill="#94a3b8"/>

  <path d="M 572 260 L 596 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="596,260 590,256 590,264" fill="#94a3b8"/>
</svg>