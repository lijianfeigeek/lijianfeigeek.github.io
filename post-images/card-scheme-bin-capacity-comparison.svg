<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-bin-capacity-comparison-title card-scheme-bin-capacity-comparison-desc" id="card-scheme-bin-capacity-comparison-root">
        <title id="card-scheme-bin-capacity-comparison-title">国际标准代际演进：6 位 BIN 与 8 位 BIN 资源容量博弈</title>
        <desc id="card-scheme-bin-capacity-comparison-desc">全球银行卡号段耗尽危机促使 ISO 将卡号首段 BIN 码从 6 位强制扩充至 8 位，总段号扩容 100 倍</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-bin-capacity-comparison-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-bin-capacity-comparison-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-bin-capacity-comparison-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-bin-capacity-comparison-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-bin-capacity-comparison-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-bin-capacity-comparison-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Left Box: Legacy 6-digit BIN -->
        <g transform="translate(40, 24)">
          <rect x="0" y="0" width="420" height="310" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="420" height="34" rx="8" fill="#f8f9fa"/>
          <text x="16" y="22" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">LEGACY · 传统 6 位 BIN 结构矛盾</text>

          <g transform="translate(20, 50)">
            <rect x="0" y="0" width="380" height="60" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">6 位 BIN 码段 · 全球号段总池仅 100 万个</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">BIN 码段总容量有限，欧美及亚太机构瓜分严重</text>
          </g>

          <g transform="translate(20, 122)">
            <rect x="0" y="0" width="380" height="80" rx="4" fill="#bf4520" stroke="#bf4520" fill-opacity="0.04" stroke-opacity="0.2"/>
            <text x="14" y="22" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">单 BIN 绑定 9 位账户号 = 10 亿张卡！</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">分配机制僵化：银行申请 1 个 BIN，必须分配 10 亿卡号空间</text>
            <text x="14" y="64" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11">地区中小银行发卡 5 万张，却永久锁死 9.999 亿个卡号！</text>
          </g>

          <g transform="translate(20, 214)">
            <rect x="0" y="0" width="380" height="74" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">严重痛点：资源枯竭与巨头垄断</text>
            <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">虚拟卡、一次性卡与数字银行爆发，传统 6 位 BIN 彻底见底</text>
          </g>
        </g>

        <!-- Right Box: Modern 8-digit BIN (Focal Accent) -->
        <g transform="translate(500, 24)">
          <rect x="0" y="0" width="420" height="310" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="34" rx="8" fill="#bf4520" fill-opacity="0.06"/>
          <text x="16" y="22" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">MODERN · 2022 年生效 8 位 BIN 新标准 (FOCAL)</text>

          <g transform="translate(20, 50)">
            <rect x="0" y="0" width="380" height="60" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.05"/>
            <text x="14" y="22" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">8 位 BIN 码段 · 全球号段总容量暴增 100 倍！</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">号段池扩容至 1 亿个，彻底解除全球号段配额危机</text>
          </g>

          <g transform="translate(20, 122)">
            <rect x="0" y="0" width="380" height="80" rx="4" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1" fill-opacity="0.04"/>
            <text x="14" y="22" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="12" font-weight="600">单 BIN 绑定 7 位账户号 = 1,000 万张卡</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">颗粒度大幅细化：中小机构按需索取，避免资源空转浪费</text>
            <text x="14" y="64" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11">支持机构按借记/贷记/外币卡精细化拆分子段分配</text>
          </g>

          <g transform="translate(20, 214)">
            <rect x="0" y="0" width="380" height="74" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">系统兼容挑战：风控与路由规则升级</text>
            <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">商户端与网关端需重构 BIN 表查询哈希，兼容 6/8 位混合路由</text>
          </g>
        </g>
      </svg>
