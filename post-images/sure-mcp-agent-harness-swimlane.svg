<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="sure-mcp-title sure-mcp-desc" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="sure-mcp-title">Sure 溯源优先 MCP 财富代理架构与 Pipelock 零信任安全泳道</title>
  <desc id="sure-mcp-desc">四泳道展示外部 AI Agent（如 Claude、OpenClaw）如何通过 Pipelock 3.8.0 零信任安全代理接入 Sure /mcp 端点：先在本地 Harness 解析文档并计算 SHA-256，再经由 DLP/注入拦截和引文分级门禁写入对账单档案与资产估值。</desc>
  <defs>
    <marker id="sm-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="sm-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="sm-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="sm-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="660" fill="#f8fafc"/>

  <!-- Header -->
  <g transform="translate(32, 20)">
    <rect x="0" y="0" width="896" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="25" font-size="16" font-weight="700" fill="#0f172a">跨边界 AI 协作：Pipelock 零信任代理 × 49 个 MCP 工具与溯源门禁泳道</text>
    <text x="20" y="44" font-size="11" fill="#475569">Parse-First 原则：本地 Harness 持有原始字节与税务版本，Sure 仅作为 SHA-256 对账单金库与引用估值真源</text>
    <rect x="752" y="16" width="128" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="816" y="32" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#475569" text-anchor="middle">MCP SWIMLANE</text>
  </g>

  <!-- 4 Swimlane Bands -->
  <!-- Lane 1: y=92, h=116 -->
  <g transform="translate(32, 92)">
    <rect x="0" y="0" width="896" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="164" height="116" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="48" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">外部 Agent Harness</text>
    <text x="82" y="68" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">Claude / OpenClaw</text>
    <text x="82" y="84" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="middle">本地文档金库</text>
  </g>

  <!-- Lane 2: y=220, h=116 -->
  <g transform="translate(32, 220)">
    <rect x="0" y="0" width="896" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="164" height="116" rx="8" fill="#fff7f5" stroke="#bf4520" stroke-width="1"/>
    <text x="82" y="48" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Pipelock 3.8.0</text>
    <text x="82" y="68" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#bf4520" text-anchor="middle">零信任 MCP 反代</text>
    <text x="82" y="84" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412" text-anchor="middle">:8889 / :8888</text>
  </g>

  <!-- Lane 3: y=348, h=116 -->
  <g transform="translate(32, 348)">
    <rect x="0" y="0" width="896" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="164" height="116" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1"/>
    <text x="82" y="48" font-size="12" font-weight="700" fill="#0c4a6e" text-anchor="middle">Sure McpController</text>
    <text x="82" y="68" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0284c7" text-anchor="middle">POST /mcp JSON-RPC</text>
    <text x="82" y="84" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0369a1" text-anchor="middle">49 Tools 注册中心</text>
  </g>

  <!-- Lane 4: y=476, h=116 -->
  <g transform="translate(32, 476)">
    <rect x="0" y="0" width="896" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="164" height="116" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="82" y="48" font-size="12" font-weight="700" fill="#064e3b" text-anchor="middle">System of Record</text>
    <text x="82" y="68" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#059669" text-anchor="middle">PostgreSQL + Vault</text>
    <text x="82" y="84" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#047857" text-anchor="middle">账本与对账单金库</text>
  </g>

  <!-- Connectors (drawn BEFORE boxes) -->
  <!-- Lane 1 horizontal -->
  <path d="M 412 150 L 444 150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#sm-arrow-muted)"/>
  <!-- Lane 1 down to Lane 2 -->
  <path d="M 556 184 L 556 244" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sm-arrow-accent)"/>
  <rect x="492" y="202" width="128" height="18" rx="3" fill="#f8fafc"/>
  <text x="556" y="215" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#bf4520" text-anchor="middle">OAuth PKCE / Bearer</text>

  <!-- Lane 2 horizontal -->
  <path d="M 668 278 L 700 278" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#sm-arrow-accent)"/>
  <!-- Lane 2 down to Lane 3 -->
  <path d="M 804 312 L 804 332 Q 804 340 796 340 L 324 340 Q 316 340 316 348 L 316 372" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#sm-arrow-link)"/>
  <rect x="476" y="331" width="160" height="18" rx="3" fill="#f8fafc"/>
  <text x="556" y="344" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0284c7" text-anchor="middle">202 Accepted 通知 &amp; 安全透传</text>

  <!-- Lane 3 horizontal -->
  <path d="M 412 406 L 444 406" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#sm-arrow-link)"/>
  <!-- Lane 3 down to Lane 4 -->
  <path d="M 556 440 L 556 500" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#sm-arrow-green)"/>
  <rect x="488" y="458" width="136" height="18" rx="3" fill="#f8fafc"/>
  <text x="556" y="471" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#059669" text-anchor="middle">校验通过后落盘事务</text>

  <!-- Lane 4 horizontal -->
  <path d="M 668 534 L 700 534" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#sm-arrow-green)"/>
  <!-- Lane 4 return to Lane 1 (right edge bypass) -->
  <path d="M 804 500 L 804 468 L 892 468 Q 900 468 900 460 L 900 158 Q 900 150 892 150 L 884 150" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#sm-arrow-muted)"/>
  <rect x="780" y="141" width="108" height="18" rx="3" fill="#ffffff"/>
  <text x="834" y="154" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">仅回传元数据与缺口</text>

  <!-- Lane 1 Nodes -->
  <g transform="translate(216, 116)">
    <rect x="0" y="0" width="196" height="68" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">1. 本地解析原件 &amp; 算哈希</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">PDF/CSV 留存本地提取总计</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b">计算内容 SHA-256 锚点</text>
  </g>

  <g transform="translate(444, 116)">
    <rect x="0" y="0" width="224" height="68" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">2. 发起 MCP 工具调用</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">upload_account_statement</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">record_valuation / apply_rule</text>
  </g>

  <g transform="translate(700, 116)">
    <rect x="0" y="0" width="184" height="68" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">6. 账本快照与黄金测试</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">data/YYYY-MM/*.csv</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b">零原文件字节跨界传输</text>
  </g>

  <!-- Lane 2 Nodes (Focal 1: Pipelock Security Gate) -->
  <g transform="translate(444, 244)">
    <rect x="0" y="0" width="224" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#7c2d12">3a. 注入拦截 &amp; 工具漂移检测</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">mcp_input_scanning: block</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">detect_drift + dlp 敏感词</text>
  </g>

  <g transform="translate(700, 244)">
    <rect x="0" y="0" width="204" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">3b. 链式风控与黑匣子回执</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">tool_chain_detection (win=20)</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">flight_recorder 哈希链签名</text>
  </g>

  <!-- Lane 3 Nodes -->
  <g transform="translate(216, 372)">
    <rect x="0" y="0" width="196" height="68" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0c4a6e">4a. 瞬态会话与权限隔离</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0369a1">请求级瞬态 Session 销毁</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0369a1">Visitor/Preview 功能门禁校验</text>
  </g>

  <!-- Focal 2: Citation & Preview Token Gate -->
  <g transform="translate(444, 372)">
    <rect x="0" y="0" width="224" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#7c2d12">4b. 写操作双锁刚性门禁</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">apply_rule 验 30m preview_token</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">record_valuation 验 grade: A|B|C</text>
  </g>

  <!-- Lane 4 Nodes -->
  <g transform="translate(444, 500)">
    <rect x="0" y="0" width="224" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#064e3b">5a. Statement Vault 幂等存证</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#047857">SHA-256 重复上传直接复用</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#047857">不入向量库、不向 MCP 回传字节</text>
  </g>

  <g transform="translate(700, 500)">
    <rect x="0" y="0" width="204" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">5b. 缺口雷达与对账校验</text>
    <text x="12" y="41" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">get_statement_coverage</text>
    <text x="12" y="57" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b">covered / missing / mismatched</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(32, 608)">
    <rect x="0" y="0" width="896" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="11" width="14" height="14" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="38" y="22" font-size="11" fill="#334155">强制安全/契约门禁 (Pipelock &amp; Citation Gate)</text>
    <rect x="336" y="11" width="14" height="14" rx="2" fill="#eff6ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="358" y="22" font-size="11" fill="#334155">Sure MCP 控制器层</text>
    <rect x="504" y="11" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="526" y="22" font-size="11" fill="#334155">PostgreSQL / Vault 存证层</text>
    <line x1="708" y1="18" x2="740" y2="18" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="748" y="22" font-size="11" fill="#334155">只读元数据回流路径</text>
  </g>
</svg>
