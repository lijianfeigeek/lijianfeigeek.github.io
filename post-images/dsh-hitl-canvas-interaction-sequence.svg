<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-hitl-canvas-interaction-sequence-title dsh-hitl-canvas-interaction-sequence-desc" id="dsh-hitl-canvas-interaction-sequence-root">
      <title id="dsh-hitl-canvas-interaction-sequence-title">人在回路（HITL）双向实时协同交互时序</title>
      <desc id="dsh-hitl-canvas-interaction-sequence-desc">开发者在前端画布实时插手、节点状态动态纠偏与主 Agent 自适应调整的 HITL 机制</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dsh-hitl-canvas-interaction-sequence-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #dsh-hitl-canvas-interaction-sequence-root text { font-family: "Geist", -apple-system, sans-serif; }
      #dsh-hitl-canvas-interaction-sequence-root .mono { font-family: "Geist Mono", monospace; }
      #dsh-hitl-canvas-interaction-sequence-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="dsh-hitl-canvas-interaction-sequence-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="dsh-hitl-canvas-interaction-sequence-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="dsh-hitl-canvas-interaction-sequence-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Lifelines -->
        <g transform="translate(100, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">开发者 (人类用户)</text>
          <line x1="70" y1="36" x2="70" y2="330" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(330, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">React Flow 画布</text>
          <line x1="70" y1="36" x2="70" y2="330" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(560, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Cordis 微内核网关</text>
          <line x1="70" y1="36" x2="70" y2="330" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(770, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="70" y="22" font-size="12" font-weight="600" fill="#bf4520" text-anchor="middle">主 Agent 思考循环</text>
          <line x1="70" y1="36" x2="70" y2="330" stroke="#bf4520" stroke-dasharray="4 4" opacity="0.4"/>
        </g>

        <!-- Steps -->
        <!-- Step 1: User observes -->
        <path d="M 170 95 L 400 95" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-hitl-canvas-interaction-sequence-arrow-default)"/>
        <g transform="translate(200, 78)">
          <text x="0" y="12" font-size="11" fill="#2d3142">1. 观察 RunBoard 看板异常输出</text>
        </g>

        <!-- Step 2: User modifies canvas -->
        <path d="M 170 140 L 400 140" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-hitl-canvas-interaction-sequence-arrow-accent)"/>
        <g transform="translate(200, 123)">
          <text x="0" y="12" font-size="11" font-weight="600" fill="#bf4520">2. 画布拖拽调整节点连接 / 增补参数</text>
        </g>

        <!-- Step 3: Canvas -> Cordis -->
        <path d="M 400 185 L 630 185" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-hitl-canvas-interaction-sequence-arrow-default)"/>
        <g transform="translate(435, 168)">
          <text x="0" y="12" font-size="11" fill="#2d3142">3. 派发工作流拓扑更新事件</text>
        </g>

        <!-- Step 4: Cordis -> LLM (Hot-patch) -->
        <path d="M 630 230 L 840 230" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-hitl-canvas-interaction-sequence-arrow-accent)"/>
        <g transform="translate(650, 213)">
          <text x="0" y="12" font-size="11" font-weight="600" fill="#bf4520">4. 动态热补丁：重算 Plan 并注入会话</text>
        </g>

        <!-- Step 5: LLM adapt -->
        <path d="M 840 275 L 400 275" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#dsh-hitl-canvas-interaction-sequence-arrow-link)"/>
        <g transform="translate(510, 258)">
          <text x="0" y="12" font-size="11" font-weight="600" fill="#2e5aa8">5. 主 Agent 采纳新路径并即时纠偏</text>
        </g>

        <!-- Step 6: Confirmation -->
        <path d="M 400 315 L 170 315" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-hitl-canvas-interaction-sequence-arrow-default)"/>
        <g transform="translate(200, 298)">
          <text x="0" y="12" font-size="11" fill="#2d3142">6. 画布节点高亮恢复绿色，继续推进</text>
        </g>
      </g>
    </svg>
