<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="mesh-avatar-agent-collab-title mesh-avatar-agent-collab-desc">
  <title id="mesh-avatar-agent-collab-title">AI Coding Agent 自动化绑定师协同范式</title>
  <desc id="mesh-avatar-agent-collab-desc">展示 Agent CLI 沙箱执行域与人类创作者决策域的双循环协同，包含视觉标定、网格标尺、图层编译与Playwright无头质检闭环</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 6; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow6-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Domain 1: Agent Execution Sandbox (Left: x=40, y=40, w=480, h=380) -->
  <g transform="translate(40, 40)">
    <rect width="480" height="380" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 472 0 Q 480 0 480 8 L 480 44 L 0 44 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="16" y="28" class="text-focal-title">Agent 执行域 (CLI / Sandbox 自动化流水线)</text>
    <text x="380" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#bf4520">Claude Code</text>

    <!-- 5 Steps in Agent Domain -->
    <g transform="translate(16, 56)">
      <rect width="448" height="52" class="pill" />
      <text x="12" y="20" class="text-subtitle">1. vision-check.py: 视觉坐标感知校准</text>
      <text x="12" y="38" class="text-muted">生成随机编号校验图，验证模型像素坐标精度，防止低能力模型盲猜</text>
    </g>

    <g transform="translate(16, 116)">
      <rect width="448" height="52" class="pill" />
      <text x="12" y="20" class="text-subtitle">2. grid.py: 局部坐标标尺普查</text>
      <text x="12" y="38" class="text-muted">生成局部带 10px/50px 标尺网格，高精度测定五官开孔与发丝骨架</text>
    </g>

    <g transform="translate(16, 176)">
      <rect width="448" height="52" class="pill" />
      <text x="12" y="20" class="text-subtitle">3. 编写 rig.draft.json 几何规范</text>
      <text x="12" y="38" class="text-muted">填报眼球采样轮廓、眨眼参数、发丝悬垂物理与身体透视椭圆</text>
    </g>

    <g transform="translate(16, 236)">
      <rect width="448" height="52" class="pill" />
      <text x="12" y="20" class="text-subtitle">4. build-layers.py: 自动化膜方程修补</text>
      <text x="12" y="38" class="text-muted">执行泊松方程底色修补与上睫毛边缘半透明色彩去混杂重构</text>
    </g>

    <g transform="translate(16, 296)">
      <rect width="448" height="66" class="focal-pill" />
      <text x="12" y="22" class="text-subtitle" fill="#bf4520">5. render-poses.mjs: Playwright 无头质检闭环</text>
      <text x="12" y="40" class="text-body">• 无头 Chromium 渲染全套极限姿态 (转头、眨眼、大笑、发丝)</text>
      <text x="12" y="56" class="text-body">• 生成多视角接触印样 (Contact Sheet)，Agent 自审直至达标</text>
    </g>
  </g>

  <!-- Connectors between Domains -->
  <!-- Upper: Agent Output -> Human Editor -->
  <path d="M 520 330 L 550 330 Q 560 330 560 310 L 560 170 Q 560 150 570 150 L 598 150" class="focal-line" marker-end="url(#arrow6-focal)" />
  <text x="535" y="240" font-family="sans-serif" font-size="10" font-weight="600" fill="#bf4520" transform="rotate(-90 535 240)">交付合格印样</text>

  <!-- Domain 2: Human Decision Domain (Right: x=600, y=40, w=320, h=380) -->
  <g transform="translate(600, 40)">
    <rect width="320" height="380" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 44 L 0 44 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">人类创作者决策域</text>
    <text x="210" y="28" class="text-muted">Visual Editor</text>

    <!-- Sub components -->
    <g transform="translate(16, 56)">
      <rect width="288" height="74" class="pill" />
      <text x="12" y="22" class="text-subtitle">1. 浏览器所见即所得 (WYSIWYG)</text>
      <text x="12" y="42" class="text-body">• 打开 Vite + React 19 本地项目</text>
      <text x="12" y="60" class="text-body">• 交互式预览实时骨骼形变与面捕效果</text>
    </g>

    <g transform="translate(16, 140)">
      <rect width="288" height="74" class="pill" />
      <text x="12" y="22" class="text-subtitle">2. 局部偏差微调</text>
      <text x="12" y="42" class="text-body">• 直观鼠标拖拽微调多边形顶点</text>
      <text x="12" y="60" class="text-body">• 调优极端角度下的微小瑕疵</text>
    </g>

    <g transform="translate(16, 224)">
      <rect width="288" height="74" class="pill" />
      <text x="12" y="22" class="text-subtitle">3. 差分手绘变体反哺</text>
      <text x="12" y="42" class="text-body">• 一键导出闭眼与元音口型 Prompt</text>
      <text x="12" y="60" class="text-body">• 交由图像模型生成精准对齐 Sprite</text>
    </g>

    <g transform="translate(16, 308)">
      <rect width="288" height="54" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#166534">终局：零显存满帧推流开播</text>
      <text x="12" y="38" font-family="sans-serif" font-size="11" fill="#15803d">数字人敏捷创作与低成本工业化落地</text>
    </g>
  </g>
</svg>