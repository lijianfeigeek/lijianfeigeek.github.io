<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="swim-title swim-desc" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif;">
  <title id="swim-title">Regitela 系统配置原位手术跨泳道安全协作流</title>
  <desc id="swim-desc">展示 Regitela 在修改 MobileGestalt 缓存与监管模式 plist 时，如何在 UI 安全门禁、备份与键位不变量引擎、沙盒句柄池与内核文件系统层之间完成无损原位写入。</desc>
  <defs>
    <pattern id="dotGridSwim" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="arrowS" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowSA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="arrowSL" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="arrowSG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1120" height="620" fill="#ffffff"/>
  <rect x="16" y="16" width="1088" height="588" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="16" width="1088" height="588" rx="8" fill="url(#dotGridSwim)"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="96" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="14" text-anchor="middle" fill="#334155" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace" letter-spacing="1">SWIMLANE</text>
    <text x="0" y="44" fill="#0f172a" font-size="20" font-weight="700">MobileGestalt 与受监管配置“原位手术”跨泳道安全协同链</text>
    <text x="0" y="64" fill="#475569" font-size="12">从硬件能力自检、冷备快照、键位不变量保护到 POSIX O_WRONLY | O_TRUNC 原位落盘的全程防呆设计</text>
  </g>

  <!-- Horizontal Swimlanes (4 lanes, x=40..1080, width=1040, each height=104) -->
  <!-- Lane 1: y=124..228 -->
  <g transform="translate(40, 124)">
    <rect x="0" y="0" width="1040" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="144" height="104" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="46" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">UI 与安全门禁</text>
    <text x="72" y="64" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">LANE 1 · GUARDRAIL</text>
  </g>

  <!-- Lane 2: y=240..344 -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="1040" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="144" height="104" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="46" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">备份与不变量引擎</text>
    <text x="72" y="64" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">LANE 2 · INVARIANT</text>
  </g>

  <!-- Lane 3: y=356..460 -->
  <g transform="translate(40, 356)">
    <rect x="0" y="0" width="1040" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="144" height="104" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="46" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">特权扩展作用域</text>
    <text x="72" y="64" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">LANE 3 · EXTENSION</text>
  </g>

  <!-- Lane 4: y=472..576 -->
  <g transform="translate(40, 472)">
    <rect x="0" y="0" width="1040" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="144" height="104" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="46" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">VFS 与系统缓存层</text>
    <text x="72" y="64" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">LANE 4 · KERNEL VFS</text>
  </g>

  <!-- Orthogonal Connectors (drawn before step boxes) -->
  <g fill="none" stroke-width="1.4">
    <!-- L1 Step 1 (300, 204) -> L2 Step 1 (300, 260) -->
    <line x1="300" y1="204" x2="300" y2="258" stroke="#0284c7" marker-end="url(#arrowSL)"/>
    <!-- L2 Step 1 (404, 292) -> L3 Step 1 (480, 376) orthogonal elbow -->
    <path d="M 404 292 H 436 Q 444 292 444 300 V 400 Q 444 408 452 408 H 478" stroke="#64748b" marker-end="url(#arrowS)"/>
    <!-- L3 Step 1 (584, 440) -> L4 Step 1 (584, 492) -->
    <line x1="584" y1="440" x2="584" y2="490" stroke="#e11d48" marker-end="url(#arrowSA)"/>
    <!-- L4 Step 1 (688, 524) -> L2 Step 2 (688, 324) upward read data? Actually Step 1 L4 -> L2 Step 2 at x=680..760 -->
    <path d="M 688 524 H 712 Q 720 524 720 516 V 300 Q 720 292 728 292 H 758" stroke="#0284c7" marker-end="url(#arrowSL)"/>
    <!-- L2 Step 2 (864, 324) -> L4 Step 2 (864, 492) bypassing Lane 3: use dashed transit or route cleanly -->
    <line x1="864" y1="324" x2="864" y2="490" stroke="#e11d48" stroke-dasharray="4,3" marker-end="url(#arrowSA)"/>
    <!-- L4 Step 2 (968, 524) -> L1 Step 2 (968, 204) return to verify -->
    <path d="M 968 524 H 1004 Q 1012 524 1012 516 V 184 Q 1012 176 1004 176 H 970" stroke="#059669" stroke-dasharray="5,4" marker-end="url(#arrowSG)"/>
  </g>

  <!-- Connector Labels -->
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8" font-weight="600" text-anchor="middle">
    <g transform="translate(310, 222)">
      <rect x="0" y="0" width="60" height="14" rx="2" fill="#ffffff"/>
      <text x="30" y="10" fill="#0284c7">MODIFY</text>
    </g>
    <g transform="translate(592, 456)">
      <rect x="0" y="0" width="60" height="14" rx="2" fill="#ffffff"/>
      <text x="30" y="10" fill="#e11d48">READ FD</text>
    </g>
    <g transform="translate(874, 400)">
      <rect x="0" y="0" width="76" height="14" rx="2" fill="#ffffff"/>
      <text x="38" y="10" fill="#e11d48">O_TRUNC WRITE</text>
    </g>
    <g transform="translate(932, 344)">
      <rect x="0" y="0" width="72" height="14" rx="2" fill="#ffffff"/>
      <text x="36" y="10" fill="#059669">REBOOT CHECK</text>
    </g>
  </g>

  <!-- Process Steps -->
  <!-- Lane 1 Step 1 -->
  <g transform="translate(200, 144)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="100" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">前置能力检测与权限锁</text>
    <text x="100" y="42" text-anchor="middle" fill="#475569" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">MGGetBoolAnswer + addedDefaultsKey</text>
  </g>

  <!-- Lane 1 Step 2 -->
  <g transform="translate(760, 144)">
    <rect x="0" y="0" width="208" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="104" y="24" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">重启生效时序校验 &amp; 状态刷新</text>
    <text x="104" y="42" text-anchor="middle" fill="#047857" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">KERN_BOOTTIME vs plist mtime</text>
  </g>

  <!-- Lane 2 Step 1 -->
  <g transform="translate(200, 260)">
    <rect x="0" y="0" width="204" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="102" y="25" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">冷备原始完整 Plist 与键值表</text>
    <text x="102" y="43" text-anchor="middle" fill="#0369a1" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">Documents/MobileGestalt-original</text>
  </g>

  <!-- Lane 2 Step 2 -->
  <g transform="translate(760, 260)">
    <rect x="0" y="0" width="208" height="64" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="104" y="25" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">CacheExtra 键位不变量修改</text>
    <text x="104" y="43" text-anchor="middle" fill="#475569" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">仅修改设备已有 RegionInfo Key</text>
  </g>

  <!-- Lane 3 Step 1 (FOCAL) -->
  <g transform="translate(480, 376)">
    <rect x="0" y="0" width="208" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="104" y="25" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">withAccess() 获取并托管句柄</text>
    <text x="104" y="43" text-anchor="middle" fill="#9f1239" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">defer releaseSandboxExtension()</text>
  </g>

  <!-- Lane 4 Step 1 -->
  <g transform="translate(480, 492)">
    <rect x="0" y="0" width="208" height="64" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="104" y="25" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">反序列化原 Plist 与编码格式</text>
    <text x="104" y="43" text-anchor="middle" fill="#475569" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">保留 Binary / XML 原始格式</text>
  </g>

  <!-- Lane 4 Step 2 (FOCAL 2) -->
  <g transform="translate(760, 492)">
    <rect x="0" y="0" width="208" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="104" y="25" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">POSIX 原位截断覆写落盘</text>
    <text x="104" y="43" text-anchor="middle" fill="#9f1239" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">open(O_WRONLY | O_TRUNC) + write</text>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 586)">
    <text x="0" y="10" fill="#64748b" font-size="10">关键工程约束：iOS 27 若向 MobileGestalt 写入设备原本不存在的 RegionInfo 键会导致下次重启重建缓存；原子写 (atomic) 会因缺乏父目录写权限失败。</text>
  </g>
</svg>