<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" width="1140" height="700" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentBlue2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentEmerald2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentCoral2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowEmerald2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowCoral2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1140" height="700" fill="#ffffff" />
  <rect x="20" y="20" width="1100" height="660" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(56, 50)">
    <rect x="0" y="0" width="190" height="24" rx="6" fill="#f8fafc" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">IO PROTOCOL SEQUENCE</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">零 0 字节窗口原位覆盖写入协议时序图</text>
    <text x="0" y="74" fill="#475569" font-size="13">解密 Erosion-CN 如何彻底杜绝系统缓存清空导致白苹果软砖，并保留 Inode 与 POSIX 属主权限</text>
  </g>

  <!-- Actor Headers (6 Columns) -->
  <g transform="translate(56, 140)">
    <!-- Actor 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="42" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1" />
      <text x="75" y="26" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">UI / 用户触发</text>
      <line x1="75" y1="42" x2="75" y2="480" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1.5" />
    </g>

    <!-- Actor 2 -->
    <g transform="translate(176, 0)">
      <rect width="150" height="42" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
      <text x="75" y="26" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="700">Diff 校验门禁</text>
      <line x1="75" y1="42" x2="75" y2="480" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1.5" />
    </g>

    <!-- Actor 3 -->
    <g transform="translate(352, 0)">
      <rect width="150" height="42" rx="8" fill="#f8fafc" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="75" y="26" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="700">原位写入引擎</text>
      <line x1="75" y1="42" x2="75" y2="480" stroke="#0284c7" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Actor 4 -->
    <g transform="translate(528, 0)">
      <rect width="150" height="42" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1" />
      <text x="75" y="26" text-anchor="middle" fill="#d97706" font-size="12" font-weight="700">APFS / Inode 节点</text>
      <line x1="75" y1="42" x2="75" y2="480" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1.5" />
    </g>

    <!-- Actor 5 -->
    <g transform="translate(704, 0)">
      <rect width="150" height="42" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1" />
      <text x="75" y="26" text-anchor="middle" fill="#059669" font-size="12" font-weight="700">NVMe NAND 物理闪存</text>
      <line x1="75" y1="42" x2="75" y2="480" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1.5" />
    </g>

    <!-- Actor 6 -->
    <g transform="translate(880, 0)">
      <rect width="150" height="42" rx="8" fill="#f8fafc" stroke="#e11d48" stroke-width="1" />
      <text x="75" y="26" text-anchor="middle" fill="#e11d48" font-size="12" font-weight="700">读回验证 / 回滚</text>
      <line x1="75" y1="42" x2="75" y2="480" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1.5" />
    </g>
  </g>

  <!-- Sequence Step 1: User Click &amp; Diff -->
  <g transform="translate(56, 210)">
    <line x1="75" y1="20" x2="245" y2="20" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow2)" />
    <rect x="90" y="4" width="135" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="157" y="17" text-anchor="middle" fill="#93c5fd" font-size="10">1. 点击「应用」请求修改</text>

    <g transform="translate(251, 8)">
      <rect width="180" height="46" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1" />
      <text x="10" y="18" fill="#f8fafc" font-size="11" font-weight="700">2. 计算差异与弹窗预览</text>
      <text x="10" y="34" fill="#475569" font-size="10">展示 修改前 → 修改后 详细键值</text>
    </g>
  </g>

  <!-- Sequence Step 2: In-Memory Snapshot &amp; Open FD -->
  <g transform="translate(56, 290)">
    <line x1="251" y1="20" x2="421" y2="20" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow2)" />
    <rect x="270" y="4" width="135" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="337" y="17" text-anchor="middle" fill="#93c5fd" font-size="10">3. 确认写入，调用引擎</text>

    <g transform="translate(427, 2)">
      <rect width="180" height="52" rx="6" fill="#f8fafc" stroke="#0ea5e9" stroke-width="1" />
      <text x="10" y="16" fill="#0284c7" font-size="11" font-weight="700">4. 内存抓取 og 快照</text>
      <text x="10" y="32" fill="#334155" font-size="10">Data(contentsOf: url)</text>
      <text x="10" y="46" fill="#475569" font-size="9">open(O_RDWR | O_CLOEXEC)</text>
    </g>
  </g>

  <!-- Sequence Step 3: pwrite Overwrite at Offset 0 (NEVER Truncate to 0!) -->
  <g transform="translate(56, 370)">
    <line x1="427" y1="20" x2="597" y2="20" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow2)" />
    <rect x="445" y="4" width="145" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="517" y="17" text-anchor="middle" fill="#0284c7" font-size="10" font-weight="700">5. pwrite 从偏移 0 原位写</text>

    <g transform="translate(603, 0)">
      <rect width="195" height="60" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
      <text x="10" y="18" fill="#d97706" font-size="11" font-weight="700">【杜绝 0 字节悬空窗口】</text>
      <text x="10" y="34" fill="#334155" font-size="10">保留原 Inode、Extent 与 POSIX 属主</text>
      <text x="10" y="48" fill="#475569" font-size="9">若新载荷更小，仅在写完后裁剪尾部</text>
    </g>
  </g>

  <!-- Sequence Step 4: Physical Flush F_FULLFSYNC -->
  <g transform="translate(56, 455)">
    <line x1="427" y1="20" x2="773" y2="20" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald2)" />
    <rect x="520" y="4" width="170" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="605" y="17" text-anchor="middle" fill="#059669" font-size="10" font-weight="700">6. fcntl(fd, F_FULLFSYNC)</text>

    <g transform="translate(779, 8)">
      <rect width="170" height="46" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
      <text x="10" y="18" fill="#059669" font-size="11" font-weight="700">7. 物理落盘完成</text>
      <text x="10" y="34" fill="#475569" font-size="10">冲刷控制器写缓存至 NAND</text>
    </g>
  </g>

  <!-- Sequence Step 5: Readback &amp; Verification / Rollback -->
  <g transform="translate(56, 535)">
    <line x1="427" y1="20" x2="949" y2="20" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow2)" />
    <rect x="610" y="4" width="160" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="690" y="17" text-anchor="middle" fill="#93c5fd" font-size="10">8. lseek(0) + readAll 全量读回</text>

    <g transform="translate(955, 0)">
      <rect width="125" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
      <text x="10" y="18" fill="#f8fafc" font-size="11" font-weight="700">9. 逐字节核验</text>
      <text x="10" y="34" fill="#059669" font-size="10">✓ 相符: 写入成功</text>
      <text x="10" y="50" fill="#e11d48" font-size="10">✗ 差异: 原位刷回 og</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(56, 626)">
    <rect width="1008" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="22" fill="#475569" font-size="11">安全保障机制：</text>
    <text x="105" y="22" fill="#0284c7" font-size="11">● 零 0 字节清空</text>
    <text x="210" y="22" fill="#d97706" font-size="11">● 锁死 Inode / 属主不变</text>
    <text x="385" y="22" fill="#059669" font-size="11">● F_FULLFSYNC 硬件防断电丢损</text>
    <text x="610" y="22" fill="#e11d48" font-size="11">● 磁盘读回不符 100% 自动回滚</text>
    <text x="830" y="22" fill="#334155" font-size="11">● 断电/异常绝不留空文件</text>
  </g>
</svg>
