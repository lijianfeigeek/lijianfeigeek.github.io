<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="se-meta-title se-meta-desc">
  <title id="se-meta-title">能力迁移的不对称性：显性领域知识 vs 隐性工程直觉</title>
  <desc id="se-meta-desc">对比展示易被AI结构化向量化的显性行业知识，与源于数万行代码线上事故打磨出来的隐性工程直觉的迁移难度差异。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">能力迁移的不对称性：显性知识 vs. 隐性工程直觉</text>
    <text class="subtitle" x="0" y="20">行业业务知识极易被 AI 结构化注入，而对系统失败模式的病态敏感性是无法速成的元能力</text>
  </g>

  <!-- Left Column: Explicit Domain Knowledge -->
  <g transform="translate(48, 86)">
    <rect width="412" height="348" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#1d4ed8" x="0" y="0">领域知识 (行业专家资产)</text>
      <text class="mono" fill="#2563eb" x="0" y="16">绝大多数属于『显性知识 (Explicit Knowledge)』</text>

      <g transform="translate(0, 32)">
        <rect width="380" height="120" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <g transform="translate(12, 16)">
          <text class="card-title" x="0" y="0">知识形态与表现特征</text>
          <text class="card-body" x="0" y="18">• 会计借贷准则、税务清算逻辑</text>
          <text class="card-body" x="0" y="34">• 医疗临床诊疗指南、药品禁忌目录</text>
          <text class="card-body" x="0" y="50">• 金融外汇合规条例、证券风控规则</text>
          <text class="card-body" x="0" y="66">• 工业制造 SOP 标准作业操作手册</text>
        </g>
      </g>

      <g transform="translate(0, 164)">
        <rect width="380" height="114" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#14532d" x="0" y="0">AI 时代的迁移难度：极度容易 (Easy Transfer)</text>
          <text class="card-body" fill="#166534" x="0" y="18">• 白纸黑字规则，极易文档化、结构化并向量化</text>
          <text class="card-body" fill="#166534" x="0" y="34">• 可作为 Context / RAG 毫秒级精准注入大模型窗口</text>
          <text class="card-body" fill="#166534" x="0" y="50">• 具备强逻辑的工程师借助 AI，数周即可掌握核心脉络</text>
          <text class="mono" fill="#15803d" x="0" y="74">RESULT: 传统行业显性知识壁垒正被 AI 迅速抹平</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Column: Tacit Engineering Intuition -->
  <g transform="translate(500, 86)">
    <rect width="412" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#c2410c" x="0" y="0">工程元能力 (软件工程师核心资产)</text>
      <text class="mono" fill="#ea580c" x="0" y="16">大量源于生产事故毒打的『隐性知识 (Tacit Knowledge)』</text>

      <g transform="translate(0, 32)">
        <rect width="380" height="120" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
        <g transform="translate(12, 16)">
          <text class="card-title" x="0" y="0">能力形态与表现特征</text>
          <text class="card-body" x="0" y="18">• 将模糊现实需求抽象为确定性有限状态机 (FSM)</text>
          <text class="card-body" x="0" y="34">• 对系统失败模式 (Failure Modes) 的病态级警惕</text>
          <text class="card-body" x="0" y="50">• 复杂系统解耦、架构分层与性能调优直觉</text>
          <text class="card-body" x="0" y="66">• 毫秒级高并发竞态与死锁防御的直觉嗅觉</text>
        </g>
      </g>

      <g transform="translate(0, 164)">
        <rect width="380" height="114" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#991b1b" x="0" y="0">AI 时代的迁移难度：极难短期习得 (Hard Transfer)</text>
          <text class="card-body" fill="#7f1d1d" x="0" y="18">• 无法仅通过文档阅读获得，必须经历万行实战洗礼</text>
          <text class="card-body" fill="#7f1d1d" x="0" y="34">• 外行“稍微了解一下 AI”绝不可能凭空拥有系统思维</text>
          <text class="card-body" fill="#7f1d1d" x="0" y="50">• 面对未知线上灾难与级联崩溃时的架构定力</text>
          <text class="mono" fill="#b91c1c" x="0" y="74">RESULT: 工程师的工程直觉是真正的长周期护城河</text>
        </g>
      </g>
    </g>
  </g>
</svg>