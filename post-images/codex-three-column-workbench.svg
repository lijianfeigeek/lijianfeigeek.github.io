<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-three-column-workbench-title codex-three-column-workbench-desc" id="codex-three-column-workbench-root">
      <title id="codex-three-column-workbench-title">Codex App 经典三栏工作台空间架构与信息流向</title>
      <desc id="codex-three-column-workbench-desc">左侧工作区与任务上下文管理、中间执行控制台与审批流、右侧行级 Diff 审查与版本防线</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-three-column-workbench-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-three-column-workbench-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-three-column-workbench-root .mono { font-family: "Geist Mono", monospace; }
      #codex-three-column-workbench-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-three-column-workbench-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-three-column-workbench-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-three-column-workbench-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Column 1: Left - Workspace Tree -->
        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="280" height="280" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="36" rx="8" fill="#f8f9fa"/>
          <text x="16" y="23" font-size="13" font-weight="600" fill="#2d3142">左栏：工作区与任务树</text>
          
          <g transform="translate(16, 52)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#2d3142">Project (长期上下文根)</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.65">绑定主仓库目录与环境基线</text>
          </g>

          <g transform="translate(16, 126)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#2d3142">Thread / Chat (独立会话)</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.65">单一职责会话，避免上下文污染</text>
          </g>

          <g transform="translate(16, 200)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#2d3142">任务独立窗口弹出</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.65">长耗时/并行工作流独立视窗</text>
          </g>
        </g>

        <!-- Column 2: Center - Execution Console (Focal) -->
        <g transform="translate(340, 40)">
          <rect x="0" y="0" width="280" height="280" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="280" height="36" rx="8" fill="#bf4520" fill-opacity="0.08"/>
          <text x="16" y="23" font-size="13" font-weight="600" fill="#bf4520">中栏：执行控制台与输入流 (核心中枢)</text>

          <g transform="translate(16, 52)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#bf4520">模型与工作模式切换</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.7">Fast / Thinking / Plan 模式动态调配</text>
          </g>

          <g transform="translate(16, 126)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#bf4520">沙盒权限级别调节</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.7">Read-only / Workspace-write / Full</text>
          </g>

          <g transform="translate(16, 200)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#bf4520">人机交互与审批决策</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.7">高危操作拦截确认与实时指令交互</text>
          </g>
        </g>

        <!-- Column 3: Right - Diff Review -->
        <g transform="translate(650, 40)">
          <rect x="0" y="0" width="280" height="280" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="36" rx="8" fill="#f8f9fa"/>
          <text x="16" y="23" font-size="13" font-weight="600" fill="#2d3142">右栏：Diff 审查与版本防线</text>

          <g transform="translate(16, 52)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#2d3142">行级 Inline 批注与纠偏</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.65">对单行修改进行精准反馈迭代</text>
          </g>

          <g transform="translate(16, 126)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#2d3142">块级暂存与单向撤销</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.65">粒度掌控：选择性接受或 Revert 变更</text>
          </g>

          <g transform="translate(16, 200)">
            <rect x="0" y="0" width="248" height="64" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="24" font-size="12" font-weight="600" fill="#2d3142">原生 Git Commit / PR 提交</text>
            <text x="12" y="46" font-size="11" fill="#2d3142" fill-opacity="0.65">一键生成合规提交说明并推流</text>
          </g>
        </g>

        <!-- Horizontal Connectors -->
        <path d="M 310 180 L 340 180" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#codex-three-column-workbench-arrow-accent)"/>
        <path d="M 620 180 L 650 180" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-three-column-workbench-arrow-default)" opacity="0.6"/>
      </g>
    </svg>
