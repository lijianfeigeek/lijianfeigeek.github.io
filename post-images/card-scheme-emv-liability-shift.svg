<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-emv-liability-shift-title card-scheme-emv-liability-shift-desc" id="card-scheme-emv-liability-shift-root">
        <title id="card-scheme-emv-liability-shift-title">EMV 芯片安全与欺诈责任转移（Liability Shift）裁决矩阵</title>
        <desc id="card-scheme-emv-liability-shift-desc">根据卡片介质（磁条 vs EMV 芯片）与商户机具终端技术版本的四象限责任归属裁定模型</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-emv-liability-shift-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-emv-liability-shift-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-emv-liability-shift-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-emv-liability-shift-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-emv-liability-shift-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-emv-liability-shift-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Top Central Root -->
        <g transform="translate(300, 20)">
          <rect x="0" y="0" width="360" height="48" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1.2" stroke-opacity="0.2"/>
          <text x="180" y="20" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">TRIGGER EVENT</text>
          <text x="180" y="38" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600" text-anchor="middle">线下 POS 刷卡发生伪卡欺诈盗刷</text>
        </g>

        <!-- Bus Connector Line -->
        <path d="M 480 68 L 480 96" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
        <path d="M 125 96 L 835 96" fill="none" stroke="#4f5d75" stroke-width="1.5"/>

        <path d="M 125 96 L 125 125" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-emv-liability-shift-arrow)"/>
        <path d="M 365 96 L 365 125" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-emv-liability-shift-arrow)"/>
        <path d="M 605 96 L 605 125" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-emv-liability-shift-arrow)"/>
        <path d="M 835 96 L 835 125" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-emv-liability-shift-arrow)"/>

        <!-- Case 1: Magstripe Card + Magstripe POS -->
        <g transform="translate(20, 125)">
          <rect x="0" y="0" width="210" height="225" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="210" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">CASE 01 · 传统双磁条</text>
          
          <g transform="translate(12, 38)">
            <text x="0" y="16" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">发卡行：旧式磁条卡</text>
            <text x="0" y="34" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">商户端：旧式磁条 POS</text>
          </g>

          <g transform="translate(12, 88)">
            <rect x="0" y="0" width="186" height="120" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">责任方：发卡机构</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">裁决逻辑：</text>
            <text x="10" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">银行未升级高安全 EMV</text>
            <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">芯片，属于发行端技术</text>
            <text x="10" y="104" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">滞后，由发卡行全额兜底</text>
          </g>
        </g>

        <!-- Case 2: EMV Card + Magstripe POS (FOCAL CORAL ACCENT) -->
        <g transform="translate(250, 125)">
          <rect x="0" y="0" width="220" height="225" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="220" height="28" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="19" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">CASE 02 · 责任转移 (FOCAL)</text>
          
          <g transform="translate(12, 38)">
            <text x="0" y="16" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" font-weight="600">发卡行：已发行 EMV 芯片卡</text>
            <text x="0" y="34" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" font-weight="600">商户端：仍使用旧式磁条机具</text>
          </g>

          <g transform="translate(12, 88)">
            <rect x="0" y="0" width="196" height="120" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
            <text x="10" y="22" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">⚠️ 商户/收单行承担 100% 资损</text>
            <text x="10" y="44" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">核心裁决原则：</text>
            <text x="10" y="64" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">商户为节省机具成本拒绝升级</text>
            <text x="10" y="84" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">导致芯片安全特性无法启用，</text>
            <text x="10" y="104" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">责任直接转移至收单侧买单</text>
          </g>
        </g>

        <!-- Case 3: Magstripe Card + EMV POS -->
        <g transform="translate(490, 125)">
          <rect x="0" y="0" width="210" height="225" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="210" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">CASE 03 · 商户已升级</text>
          
          <g transform="translate(12, 38)">
            <text x="0" y="16" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">发卡行：旧式磁条卡</text>
            <text x="0" y="34" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">商户端：已升级 EMV 芯片机</text>
          </g>

          <g transform="translate(12, 88)">
            <rect x="0" y="0" width="186" height="120" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">责任方：发卡机构</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">裁决逻辑：</text>
            <text x="10" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">商户已完成机具合规改造，</text>
            <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">属于银行发卡介质陈旧，</text>
            <text x="10" y="104" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">维持发卡行标准赔偿责任</text>
          </g>
        </g>

        <!-- Case 4: EMV Card + EMV POS -->
        <g transform="translate(720, 125)">
          <rect x="0" y="0" width="220" height="225" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="220" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">CASE 04 · 全量芯片就绪</text>
          
          <g transform="translate(12, 38)">
            <text x="0" y="16" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">发卡行：EMV 芯片卡</text>
            <text x="0" y="34" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">商户端：EMV 芯片 POS</text>
          </g>

          <g transform="translate(12, 88)">
            <rect x="0" y="0" width="196" height="120" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">责任方：发卡行规则兜底</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">裁决逻辑：</text>
            <text x="10" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">双端均已升级硬件防伪，</text>
            <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">若仍发生欺诈属不可抗力，</text>
            <text x="10" y="104" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">由发卡行按照保费池赔付</text>
          </g>
        </g>
      </svg>
