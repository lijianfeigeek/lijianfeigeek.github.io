<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-superapp-feudalism-vs-os-agent-title ai-bubble-superapp-feudalism-vs-os-agent-desc">
  <title id="ai-bubble-superapp-feudalism-vs-os-agent-title">技术封建主义黄昏：超级 APP 围墙花园坍塌与端侧行为智能体</title>
  <desc id="ai-bubble-superapp-feudalism-vs-os-agent-desc">对比传统移动互联网被超级APP圈禁流量、层层抽取高昂中介费的封建架构，与智能时代站在用户同侧的端侧OS大总管通过A2A直连物理服务</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Feudalism Era -->
  <g transform="translate(40, 24)">
    <rect width="410" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">传统移动互联 · 技术封建主义</text>
    <text x="20" y="56" class="label-title">超级 APP 围墙圈禁与流量中介</text>
    <line x1="20" y1="70" x2="390" y2="70" stroke="#f1f5f9" stroke-width="1"/>

    <!-- User -->
    <g transform="translate(30, 85)">
      <rect width="350" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="175" y="28" text-anchor="middle" class="label-title">👤 用户 (User)</text>
    </g>

    <path d="M 205 133 L 205 163" stroke="#64748b" stroke-width="1.5" marker-end="url(#sa-arrow)"/>
    <text x="215" y="152" class="text-body" fill="#ef4444">被围墙圈禁收税</text>

    <!-- Super App Garden -->
    <g transform="translate(30, 165)">
      <rect width="350" height="65" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="175" y="26" text-anchor="middle" class="label-title" fill="#b91c1c">🏰 超级 APP 围墙花园 (美团 / 阿里 / 微信)</text>
      <text x="175" y="48" text-anchor="middle" class="text-body">垄断流量入口，搜刮陈旧广告与高昂平台抽佣</text>
    </g>

    <path d="M 205 230 L 205 260" stroke="#64748b" stroke-width="1.5" marker-end="url(#sa-arrow)"/>
    <text x="215" y="249" class="text-body" fill="#64748b">抽取抽佣通道</text>

    <!-- Merchant -->
    <g transform="translate(30, 262)">
      <rect width="350" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="175" y="28" text-anchor="middle" class="text-body">餐饮 / 票务 / 零售商家 (被动剥削)</text>
    </g>
  </g>

  <!-- Right: Agent Era (Focal) -->
  <g transform="translate(510, 24)">
    <rect width="410" height="330" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">智能时代 · 用户同侧数字分身</text>
    <text x="20" y="56" class="label-title" fill="#9a3412">端侧 OS 大总管与 A2A 跨域穿透</text>
    <line x1="20" y1="70" x2="390" y2="70" stroke="#fed7aa" stroke-width="1"/>

    <!-- User &amp; Master Agent Co-location -->
    <g transform="translate(30, 85)">
      <rect width="350" height="65" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="16" y="26" class="label-title">👤 用户 + 🧠 端侧 OS 大总管 Agent</text>
      <text x="16" y="48" class="text-body" fill="#9a3412">本地私有行为感知，100% 站在用户同侧的利益代表</text>
    </g>

    <!-- Connectors to Sub-agents -->
    <path d="M 120 150 L 120 185" stroke="#bf4520" stroke-width="1.5" marker-end="url(#sa-arrow)"/>
    <path d="M 280 150 L 280 185" stroke="#bf4520" stroke-width="1.5" marker-end="url(#sa-arrow)"/>

    <!-- Sub Agents -->
    <g transform="translate(30, 187)">
      <rect width="160" height="48" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="80" y="24" text-anchor="middle" class="label-title" fill="#9a3412">专业 Agent A</text>
      <text x="80" y="38" text-anchor="middle" class="text-body" style="font-size: 10px;">餐饮美食直订</text>
    </g>

    <g transform="translate(220, 187)">
      <rect width="160" height="48" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="80" y="24" text-anchor="middle" class="label-title" fill="#9a3412">专业 Agent B</text>
      <text x="80" y="38" text-anchor="middle" class="text-body" style="font-size: 10px;">差旅交通比价</text>
    </g>

    <path d="M 110 235 L 110 260" stroke="#059669" stroke-width="1.5" marker-end="url(#sa-arrow)"/>
    <path d="M 300 235 L 300 260" stroke="#059669" stroke-width="1.5" marker-end="url(#sa-arrow)"/>

    <!-- Physical Service -->
    <g transform="translate(30, 262)">
      <rect width="350" height="48" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
      <text x="175" y="28" text-anchor="middle" class="label-title" fill="#15803d">⚡ 物理世界服务终端 (直接交付，零中介抽水)</text>
    </g>
  </g>
</svg>