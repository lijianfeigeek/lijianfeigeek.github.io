<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polylane-cloud-topology-importance-tiering-title polylane-cloud-topology-importance-tiering-desc">
  <title id="polylane-cloud-topology-importance-tiering-title">企业多云拓扑节点重要度分级评测流水线</title>
  <desc id="polylane-cloud-topology-importance-tiering-desc">数万节点图谱经过 Jev 评级引擎高速分类为 Critical、Standard、Low 和 Minimal 四级</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="320" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Cloud Scale Graph -->
  <g transform="translate(24, 24)">
    <rect width="240" height="272" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="32" class="label-title">企业多云环境 (Multi-Cloud)</text>
    <line x1="16" y1="46" x2="224" y2="46" stroke="#f3f4f6" stroke-width="1"/>
    
    <g transform="translate(16, 60)">
      <rect width="208" height="80" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="24" class="label-title" font-size="13">数万节点拓扑图谱</text>
      <text x="12" y="46" class="text-code">• Kubernetes 集群与 Pod</text>
      <text x="12" y="66" class="text-code">• 消息队列、分片数据库</text>
    </g>

    <g transform="translate(16, 154)">
      <rect width="208" height="90" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="12" y="24" class="label-title" fill="#e11d48" font-size="13">旧方案痛点 (GPT-OSS 20B)</text>
      <text x="12" y="46" class="text-code" fill="#9f1239">• P90 延迟 5,445 ms</text>
      <text x="12" y="66" class="text-code" fill="#9f1239">• 并发积压引发调度瘫痪</text>
      <text x="12" y="84" class="text-code" fill="#9f1239">• 每千次调用 $0.817</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 264 160 L 304 160" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="304,157 310,160 304,163" fill="#bf4520"/>

  <!-- Center: Jev Priority Engine -->
  <g transform="translate(310, 24)">
    <rect width="260" height="272" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="16" y="32" class="label-title" fill="#9a3412">TypeSafe Jev 评级引擎</text>
    <line x1="16" y1="46" x2="244" y2="46" stroke="#fed7aa" stroke-width="1"/>
    
    <text x="16" y="70" class="text-body" fill="#7c2d12">切片批量注入 State，并发打分：</text>
    <text x="16" y="94" class="text-code" fill="#9a3412">• 70ms ~ 500ms 快速吞吐</text>
    <text x="16" y="118" class="text-code" fill="#9a3412">• 支持高并发大批量并行流</text>

    <!-- Benchmark Badge -->
    <g transform="translate(16, 140)">
      <rect width="228" height="110" rx="6" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="24" class="label-title" fill="#9a3412" font-size="13">迁移后实测突破：</text>
      <text x="12" y="50" class="text-code" fill="#9a3412">⚡ P90 延迟: 511 ms (↓90.6%)</text>
      <text x="12" y="74" class="text-code" fill="#9a3412">🚀 加速幅度: 10.6 倍</text>
      <text x="12" y="98" class="text-code" fill="#9a3412">💰 千次成本: $0.542 (↓33.7%)</text>
    </g>
  </g>

  <!-- Connectors to 4 Tiers -->
  <path d="M 570 80 L 610 50" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="608,47 614,50 609,54" fill="#ef4444"/>

  <path d="M 570 120 L 610 115" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="608,112 614,115 608,118" fill="#f59e0b"/>

  <path d="M 570 170 L 610 180" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="608,177 614,180 608,183" fill="#3b82f6"/>

  <path d="M 570 230 L 610 245" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="608,242 614,245 609,249" fill="#6b7280"/>

  <!-- Right: 4 Importance Tiers -->
  <g transform="translate(614, 24)">
    <!-- Tier 1 -->
    <g transform="translate(0, 0)">
      <rect width="322" height="58" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <text x="14" y="24" class="label-title" fill="#b91c1c" font-size="13">Tier 1: Critical (核心主干链路)</text>
      <text x="14" y="44" class="text-code" fill="#991b1b">生产流量枢纽 / 高辐射中心 / 毫秒级阻断响应</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(0, 68)">
      <rect width="322" height="58" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="24" class="label-title" fill="#b45309" font-size="13">Tier 2: Standard (常规业务服务)</text>
      <text x="14" y="44" class="text-code" fill="#92400e">常态活跃且直接影响运营，纳入标准告警排查</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(0, 136)">
      <rect width="322" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="14" y="24" class="label-title" fill="#1d4ed8" font-size="13">Tier 3: Low (低频边缘节点)</text>
      <text x="14" y="44" class="text-code" fill="#1e40af">边缘服务与低吞吐单元，允许降级或异步重试</text>
    </g>

    <!-- Tier 4 -->
    <g transform="translate(0, 204)">
      <rect width="322" height="58" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="14" y="24" class="label-title" fill="#4b5563" font-size="13">Tier 4: Minimal (闲置与沙箱)</text>
      <text x="14" y="44" class="text-code" fill="#6b7280">预览沙箱与闲置测试实例，挂了亦无伤大雅</text>
    </g>
  </g>
</svg>