<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-three-tier-architecture-title kandev-three-tier-architecture-desc" id="kandev-three-tier-architecture-root">
      <title id="kandev-three-tier-architecture-title">Kandev 整体架构拓扑：交互层、Go 控制平面与执行层</title>
      <desc id="kandev-three-tier-architecture-desc">Web/Tauri 交互前端、Go 单体二进制控制平面与跨进程/容器执行器后端的架构解耦</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-three-tier-architecture-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-three-tier-architecture-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-three-tier-architecture-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-three-tier-architecture-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-three-tier-architecture-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-three-tier-architecture-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-three-tier-architecture-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Tier 1: Client Surface -->
        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="260" height="340" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">CLIENT SURFACE (用户交互表面)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="232" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">现代 Web 浏览器 (SPA)</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• React / Monaco 代码编辑器</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• 拖拽式看板与流式 Diff 比对</text>
          </g>

          <g transform="translate(14, 140)">
            <rect x="0" y="0" width="232" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">Tauri 桌面外壳 (Rust 宿主)</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• 原生系统通知与全局热键唤醒</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• 本地进程就近托管与极速渲染</text>
          </g>

          <g transform="translate(14, 232)">
            <rect x="0" y="0" width="232" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">移动设备随身监视</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• Tailscale / CF Tunnel 安全穿透</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• 手机端一键审批与任务挂起</text>
          </g>
        </g>

        <!-- Tier 2: Go Control Plane (Focal) -->
        <g transform="translate(340, 40)">
          <rect x="0" y="0" width="300" height="340" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="300" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#bf4520" class="mono">GO CONTROL PLANE (单体控制内核)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">HTTP / REST API &amp; WebSocket 总线</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">实时事件广播、任务状态推流与日志订阅</text>
          </g>

          <g transform="translate(14, 116)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">Worktree 物理目录编排器</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">分支自动创建、锁定防踩踏与生命周期销毁</text>
          </g>

          <g transform="translate(14, 184)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">ACP 协议适配引擎 (JSON-RPC 2.0)</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">结构化拦截 Agent 工具调用与人工审批门禁</text>
          </g>

          <g transform="translate(14, 252)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">内嵌 SQLite 存储引擎</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">持久化任务看板 DAG、Handoff Notes 与依赖</text>
          </g>
        </g>

        <!-- Tier 3: Executors &amp; Subprocesses -->
        <g transform="translate(690, 40)">
          <rect x="0" y="0" width="240" height="340" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="240" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">EXECUTORS (执行器后端)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="212" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">agentctl 伴生侧车</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• 统一双协议适配转换</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• 伪终端流与结构化 RPC 桥接</text>
          </g>

          <g transform="translate(14, 140)">
            <rect x="0" y="0" width="212" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">智能体进程矩阵</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• Claude Code / Codex CLI</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• Antigravity / 自研 Agent</text>
          </g>

          <g transform="translate(14, 232)">
            <rect x="0" y="0" width="212" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">物理隔离沙盒</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• Git Worktree 物理目录</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• Docker / K8s / Sprites 容器</text>
          </g>
        </g>

        <!-- Connectors -->
        <path d="M 290 210 L 340 210" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#kandev-three-tier-architecture-arrow-accent)"/>
        <path d="M 640 210 L 690 210" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-three-tier-architecture-arrow-default)" opacity="0.6"/>
      </g>
    </svg>
