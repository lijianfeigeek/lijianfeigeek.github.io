<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ks-arch-title ks-arch-desc" id="diagram1-root">
      <title id="ks-arch-title">Kitesurf 多孤岛安全沙盒与 Worker Loader 架构拓扑</title>
      <desc id="ks-arch-desc">展示 Kitesurf 引擎 Worker 如何通过 Cloudflare Dynamic Workers 隔离页面脚本执行孤岛与无外网权限的矢量光栅化渲染孤岛，并由 SandboxOutbound 统一执行同源、CORS 与私有网络防线。</desc>
      <defs>
      <style>#diagram1-root { font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #0f172a; }
      #diagram1-root .diagram-container { width: 100%; overflow-x: auto; }</style>
        <pattern id="diagram1-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
        </pattern>
        <marker id="diagram1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
        </marker>
        <marker id="diagram1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="diagram1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
        </marker>
      </defs>

      <!-- Paper Light Background -->
      <rect width="1000" height="620" fill="#f8fafc"/>
      <rect width="1000" height="620" fill="url(#diagram1-dots)" opacity="0.6"/>

      <!-- Header -->
      <text x="32" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">ARCHITECTURE · CLOUDFLARE DYNAMIC WORKERS · ZERO-TRUST ISOLATES</text>
      <text x="32" y="64" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">Kitesurf 多孤岛沙盒拓扑与网络出口隔离架构</text>

      <!-- ZONES (drawn before arrows and nodes) -->
      <!-- Zone 1: Engine Worker Boundary -->
      <rect x="256" y="88" width="712" height="220" rx="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" fill-opacity="0.02"/>
      <rect x="272" y="92" width="248" height="16" rx="2" fill="#f8fafc"/>
      <text x="276" y="104" fill="#5a6580" font-size="10" font-weight="500" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">主控引擎 Worker（KitesurfEngine）</text>

      <!-- Zone 2: Dynamic Isolate A - PageScript -->
      <rect x="256" y="336" width="388" height="236" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.03"/>
      <rect x="272" y="340" width="292" height="16" rx="2" fill="#f8fafc"/>
      <text x="276" y="352" fill="#bf4520" font-size="10" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">动态孤岛 A：PageScript（每次导航新建）</text>

      <!-- Zone 3: Dynamic Isolate B - PageRenderer -->
      <rect x="668" y="336" width="300" height="236" rx="8" fill="#0284c7" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.03"/>
      <rect x="684" y="340" width="256" height="16" rx="2" fill="#f8fafc"/>
      <text x="688" y="352" fill="#0284c7" font-size="10" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">动态孤岛 B：PageRenderer（零外网）</text>

      <!-- ARROWS (drawn before boxes) -->
      <!-- 1. Agent/Client -> CDP Gateway -->
      <line x1="208" y1="156" x2="280" y2="156" stroke="#0284c7" stroke-width="1.4" marker-end="url(#diagram1-arrow-link)"/>
      <rect x="216" y="132" width="56" height="16" rx="2" fill="#f8fafc"/>
      <text x="244" y="144" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CDP WS</text>

      <!-- 2. CDP Gateway -> PageScript (env.LOADER.load + JSRPC) -->
      <line x1="392" y1="196" x2="392" y2="380" stroke="#bf4520" stroke-width="1.4" marker-end="url(#diagram1-arrow-accent)"/>
      <rect x="336" y="276" width="112" height="16" rx="2" fill="#f8fafc"/>
      <text x="392" y="288" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LOADER.load + RPC</text>

      <!-- 3. PageScript -> SandboxOutbound (globalOutbound) -->
      <line x1="552" y1="380" x2="552" y2="204" stroke="#475569" stroke-width="1.2" marker-end="url(#diagram1-arrow)"/>
      <rect x="496" y="276" width="112" height="16" rx="2" fill="#f8fafc"/>
      <text x="552" y="288" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">globalOutbound</text>

      <!-- 4. SandboxOutbound -> Target Web -->
      <path d="M 656,156 H 720" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#diagram1-arrow-link)"/>
      <rect x="664" y="132" width="48" height="16" rx="2" fill="#f8fafc"/>
      <text x="688" y="144" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTTPS</text>

      <!-- 5. PageScript -> PageRenderer (RenderPort KSC0) -->
      <line x1="620" y1="420" x2="692" y2="420" stroke="#0284c7" stroke-width="1.4" marker-end="url(#diagram1-arrow-link)"/>
      <rect x="624" y="396" width="64" height="16" rx="2" fill="#f8fafc"/>
      <text x="656" y="408" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">KSC0 RPC</text>

      <!-- 6. PageRenderer -> ResourceStore (fetchStoredFont/Image) -->
      <path d="M 820,380 V 280 Q 820,272 812,272 H 656" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#diagram1-arrow)"/>
      <rect x="744" y="248" width="112" height="16" rx="2" fill="#f8fafc"/>
      <text x="800" y="260" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">回调拉取字体/图像</text>

      <!-- 7. PageScript -> Tail/SpanSink -->
      <path d="M 324,488 V 536 Q 324,544 316,544 H 208" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#diagram1-arrow)"/>
      <rect x="220" y="520" width="96" height="16" rx="2" fill="#f8fafc"/>
      <text x="268" y="532" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tailToken 鉴权</text>

      <!-- NODES (each inside isolated translate group) -->
      <!-- Node: External Clients (Left) -->
      <g transform="translate(32, 116)">
        <rect x="0" y="0" width="176" height="84" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="176" height="84" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
        <rect x="10" y="8" width="48" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="34" y="18" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CLIENT</text>
        <text x="88" y="42" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">智能体 / Puppeteer</text>
        <text x="88" y="60" fill="#475569" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/devtools/browser · CLI</text>
      </g>

      <!-- Node: PageScriptTail + SpanSink (Bottom Left) -->
      <g transform="translate(32, 492)">
        <rect x="0" y="0" width="176" height="80" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="176" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <rect x="10" y="8" width="52" height="14" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="36" y="18" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AUDIT</text>
        <text x="88" y="40" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">PageScriptTail</text>
        <text x="88" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">[ks-err] · [ks-kill] · OTel</text>
      </g>

      <!-- Node: CDP Gateway & Session State -->
      <g transform="translate(280, 120)">
        <rect x="0" y="0" width="204" height="76" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="204" height="76" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="10" y="8" width="44" height="14" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="32" y="18" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CDP</text>
        <text x="102" y="38" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">无状态会话分发器</text>
        <text x="102" y="56" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">handleWebSocket · WebMCP</text>
      </g>

      <!-- Node: SandboxOutbound (Focal Security Gate) -->
      <g transform="translate(504, 120)">
        <rect x="0" y="0" width="152" height="84" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="152" height="84" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="10" y="8" width="56" height="14" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.8"/>
        <text x="38" y="18" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">EGRESS</text>
        <text x="76" y="40" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">SandboxOutbound</text>
        <text x="76" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CORS · PNA · WBA 签名</text>
      </g>

      <!-- Node: ResourceStore & CookieJar -->
      <g transform="translate(504, 224)">
        <rect x="0" y="0" width="152" height="68" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="152" height="68" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
        <text x="76" y="28" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">ResourceStore</text>
        <text x="76" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CookieJar · FontShaping</text>
      </g>

      <!-- Node: Target Web & Upstream -->
      <g transform="translate(720, 120)">
        <rect x="0" y="0" width="224" height="84" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="224" height="84" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
        <rect x="10" y="8" width="60" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="40" y="18" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">EXTERNAL</text>
        <text x="112" y="40" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">目标网页与上游服务</text>
        <text x="112" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Ed25519 Web Bot Auth</text>
      </g>

      <!-- Node: PageScript Core Wasm (Focal Compute) -->
      <g transform="translate(280, 380)">
        <rect x="0" y="0" width="340" height="108" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="340" height="108" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="12" y="10" width="84" height="14" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.8"/>
        <text x="54" y="20" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CORE WASM</text>
        <text x="170" y="44" fill="#0f172a" font-size="14" font-weight="600" text-anchor="middle">core_bg.wasm + dom-shim.js</text>
        <text x="170" y="64" fill="#334155" font-size="10.5" text-anchor="middle">Blitz DOM · Stylo CSS · Taffy 布局 · Parley 排版</text>
        <text x="170" y="84" fill="#bf4520" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Boa JS (无 native eval) + SwapAlloc</text>
      </g>

      <!-- Node: Facet SQLite Store -->
      <g transform="translate(360, 504)">
        <rect x="0" y="0" width="260" height="52" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="260" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
        <text x="130" y="22" fill="#0f172a" font-size="11.5" font-weight="600" text-anchor="middle">Facet SQLite 代码交换区</text>
        <text x="130" y="39" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ks_boa_swap_&lt;gen&gt; · 冷源码换出</text>
      </g>

      <!-- Node: PageRenderer Core -->
      <g transform="translate(692, 380)">
        <rect x="0" y="0" width="252" height="108" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="252" height="108" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <rect x="12" y="10" width="96" height="14" rx="2" fill="#f1f5f9" stroke="#0284c7" stroke-width="0.8"/>
        <text x="60" y="20" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RASTER WASM</text>
        <text x="126" y="44" fill="#0f172a" font-size="14" font-weight="600" text-anchor="middle">SceneRasterizer</text>
        <text x="126" y="64" fill="#334155" font-size="10.5" text-anchor="middle">vello_cpu 矢量合成 · Krilla PDF</text>
        <text x="126" y="84" fill="#475569" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">globalOutbound: DeniedOutbound</text>
      </g>

      <!-- Node: Frame Output -->
      <g transform="translate(692, 504)">
        <rect x="0" y="0" width="252" height="52" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="252" height="52" rx="6" fill="#f1f5f9" stroke="#059669" stroke-width="1"/>
        <text x="126" y="22" fill="#059669" font-size="11.5" font-weight="600" text-anchor="middle">按需像素输出（保留基帧增量）</text>
        <text x="126" y="39" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PNG · JPEG (SIMD128) · PDF · KSC0</text>
      </g>

      <!-- Bottom Legend Strip -->
      <line x1="32" y1="588" x2="968" y2="588" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="32" y="596" width="12" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
      <text x="52" y="606" fill="#475569" font-size="10">不可信页面脚本沙盒 / 核心安全门禁</text>

      <rect x="280" y="596" width="12" height="12" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="300" y="606" fill="#475569" font-size="10">无外网权限的隔离光栅化渲染器</text>

      <line x1="540" y1="602" x2="572" y2="602" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="580" y="606" fill="#475569" font-size="10">受控回调拉取 / 异步尾日志审计通道</text>
    </svg>
