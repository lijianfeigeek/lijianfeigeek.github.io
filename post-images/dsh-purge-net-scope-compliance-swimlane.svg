<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="swim-title swim-desc" style="background:#f8fafc; font-family:'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;">
  <title id="swim-title">net-scope.js 与 drill-grant.js 双重合规门禁泳道图</title>
  <desc id="swim-desc">展示用户输入如何经过本轮句提取、良性网络话题豁免、私网与允许名单校验、以及 agent/pre-step 静态熔断的跨层控制流。</desc>
  <defs>
    <marker id="sw-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="sw-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#bf4520"/>
    </marker>
    <marker id="sw-link" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title -->
  <g transform="translate(24, 20)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0f172a">Swimlane · net-scope.js 合规边界拦截与「自己的服务器」白名单流转</text>
    <text x="0" y="40" font-size="11" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">4-LANE COMPLIANCE PIPELINE · 100KB REDOS CAP · RFC1918 + CN/HK/MO + BANK_HOSTS + PRE-STEP DENIAL</text>
  </g>

  <!-- Horizontal Swimlane Backgrounds -->
  <g transform="translate(24, 76)">
    <!-- Lane 1 -->
    <rect x="0" y="0" width="952" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="136" height="96" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="42" font-size="11" font-weight="700" fill="#334155">1 · 消息入口提取</text>
    <text x="16" y="60" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">USER / PRE-STEP</text>

    <!-- Lane 2 -->
    <rect x="0" y="104" width="952" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="104" width="136" height="96" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="146" font-size="11" font-weight="700" fill="#334155">2 · 意图与目标抽取</text>
    <text x="16" y="164" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">REGEX + CAP 100KB</text>

    <!-- Lane 3 -->
    <rect x="0" y="208" width="952" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="208" width="136" height="104" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="254" font-size="11" font-weight="700" fill="#334155">3 · 靶标域属仲裁</text>
    <text x="16" y="272" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">SCOPE ARBITRATION</text>

    <!-- Lane 4 -->
    <rect x="0" y="320" width="952" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="320" width="136" height="96" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="362" font-size="11" font-weight="700" fill="#334155">4 · 熔断或演练放行</text>
    <text x="16" y="380" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">PARK / ALLOW</text>
  </g>

  <!-- Orthogonal Connectors (drawn BEFORE node boxes) -->
  <g transform="translate(24, 76)">
    <!-- L1 N1 -> L1 N2 -->
    <path d="M 340 48 L 396 48" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#sw-muted)"/>
    <!-- L1 N2 -> L2 N1 (cross-lane down) -->
    <path d="M 496 80 L 496 100 Q 496 108 488 108 L 252 108 Q 244 108 244 116 L 244 120" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#sw-muted)"/>
    <!-- L2 N1 -> L2 N2 (benign bypass) -->
    <path d="M 340 152 L 404 152" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#sw-link)"/>
    <!-- L2 N1 -> L2 N3 (attack intent) -->
    <path d="M 244 184 L 244 196 L 696 196 L 696 184" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#sw-accent)"/>
    <!-- L2 N3 -> L3 N1 -->
    <path d="M 716 184 L 716 202 Q 716 210 708 210 L 252 210 Q 244 210 244 218 L 244 224" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#sw-accent)"/>
    <!-- L3 N1 -> L3 N2 (own/allowlist) -->
    <path d="M 348 260 L 404 260" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#sw-link)"/>
    <!-- L3 N1 -> L3 N3 (CN/HK/MO or Bank hit) -->
    <path d="M 244 292 L 244 304 L 716 304 L 716 292" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sw-accent)"/>
    <!-- L3 N2 -> L4 N1 (Allow to Model/Drill) -->
    <path d="M 504 292 L 504 336" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#sw-link)"/>
    <!-- L3 N3 -> L4 N2 (Park Denial) -->
    <path d="M 716 292 L 716 336" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sw-accent)"/>

    <!-- Edge Labels with opaque masks -->
    <rect x="348" y="138" width="48" height="14" rx="2" fill="#ffffff"/>
    <text x="352" y="148" font-size="8.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#0284c7">BENIGN</text>

    <rect x="448" y="188" width="64" height="14" rx="2" fill="#ffffff"/>
    <text x="452" y="198" font-size="8.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#bf4520">ATTACK HIT</text>

    <rect x="352" y="244" width="44" height="14" rx="2" fill="#ffffff"/>
    <text x="356" y="254" font-size="8.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#0284c7">OWN/OK</text>

    <rect x="452" y="296" width="80" height="14" rx="2" fill="#ffffff"/>
    <text x="456" y="306" font-size="8.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#bf4520">CN/HK/MO/BANK</text>
  </g>

  <!-- Nodes inside Lanes -->
  <g transform="translate(24, 76)">
    <!-- Lane 1 Nodes -->
    <g transform="translate(152, 16)">
      <rect x="0" y="0" width="188" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="600" fill="#0f172a">拦截 agent/pre-step (step=1)</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">currentTaskText(messages)</text>
      <text x="12" y="54" font-size="9" fill="#64748b">仅取最后一条 model 回复后新用户句</text>
    </g>
    <g transform="translate(396, 16)">
      <rect x="0" y="0" width="200" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="600" fill="#0f172a">剥离工具回包 &amp; 历史污染</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">looksLikeToolResult() 过滤</text>
      <text x="12" y="54" font-size="9" fill="#64748b">防止上轮工具结果触发误拦截</text>
    </g>

    <!-- Lane 2 Nodes -->
    <g transform="translate(152, 120)">
      <rect x="0" y="0" width="188" height="64" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="600" fill="#0f172a">100KB 上限正则判定</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">ATTACK_SCAN_CAP = 102400</text>
      <text x="12" y="54" font-size="9" fill="#64748b">防长日志触发零宽断言 ReDoS 卡死</text>
    </g>
    <g transform="translate(404, 120)">
      <rect x="0" y="0" width="188" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="600" fill="#0369a1">良性网络话题豁免 (#73)</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#0284c7">isBenignNetworkTopic()</text>
      <text x="12" y="54" font-size="9" fill="#0369a1">常规代理/DNS/IP 查询直接放行</text>
    </g>
    <g transform="translate(612, 120)">
      <rect x="0" y="0" width="212" height="64" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="700" fill="#9a3412">多协议主机与地址提取</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#bf4520">URL / IPv4 / IPv6 / 国际化域名</text>
      <text x="12" y="54" font-size="9" fill="#9a3412">keepBareDomain() 剔除 .js/.mo 文件名</text>
    </g>

    <!-- Lane 3 Nodes -->
    <g transform="translate(152, 224)">
      <rect x="0" y="0" width="196" height="68" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="600" fill="#0f172a">私网 &amp; 登记名单白名单核验</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">isOwnNetwork ∪ allow.exact</text>
      <text x="12" y="56" font-size="9" fill="#64748b">net-scope-allow.txt 剥离密钥/网段/*</text>
    </g>
    <g transform="translate(404, 224)">
      <rect x="0" y="0" width="200" height="68" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="600" fill="#0369a1">本地 / 授权域通过</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#0284c7">RFC1918 · ::1 · 精确单机名</text>
      <text x="12" y="56" font-size="9" fill="#0369a1">口头「我的服务器」无效，须面板保存</text>
    </g>
    <g transform="translate(620, 224)">
      <rect x="0" y="0" width="204" height="68" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="700" fill="#9f1239">区域后缀 &amp; 金融机构硬命中</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#be123c">SUFFIXES (.cn/.hk/.mo) + BANK_HOSTS</text>
      <text x="12" y="56" font-size="9" fill="#9f1239">含 IDN 中文域名及央行/交易所主域</text>
    </g>

    <!-- Lane 4 Nodes -->
    <g transform="translate(404, 336)">
      <rect x="0" y="0" width="200" height="64" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
      <text x="12" y="22" font-size="11.5" font-weight="700" fill="#166534">放行至模型 / 演练台</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#15803d">drill-grant.json 三重确认后开启</text>
      <text x="12" y="54" font-size="9" fill="#166534">Web 与桌面安装各自独立存授权文件</text>
    </g>
    <g transform="translate(620, 336)">
      <rect x="0" y="0" width="248" height="64" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.4"/>
      <text x="12" y="22" font-size="11.5" font-weight="700" fill="#bf4520">本地静态熔断 · 不发包不进模型</text>
      <text x="12" y="40" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#9a3412">parkDenial: step/start → chunk → end</text>
      <text x="12" y="54" font-size="9.5" font-weight="600" fill="#bf4520">直接输出：「不行，这是严令禁止的」</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(24, 500)">
    <text x="0" y="12" font-size="10.5" fill="#64748b">注：denialStream() 强制包装为紧凑单条 { type: "chunk", time, chunk } 记录，规避宿主持久化读取 text-chunks 批记录时触发 undefined.length 崩溃 (#84)。</text>
  </g>
</svg>
