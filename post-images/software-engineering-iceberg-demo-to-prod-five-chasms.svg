<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="se-chasm-title se-chasm-desc">
  <title id="se-chasm-title">从“原型跑通”到“生产可用”的五道工程天堑</title>
  <desc id="se-chasm-desc">展示个人Demo与工业级生产系统之间相隔的确定性、高并发、静默故障、安全渗透与成本延迟五道不可逾越的鸿沟。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .chasm-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #be123c; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Vibe Coding 幻觉：从原型到生产的五道工程天堑</text>
    <text class="subtitle" x="0" y="20">做个跑通的 Demo 给自己用，与发布一个百万用户的工业级产品，中间隔着五道深不可测的马里亚纳海沟</text>
  </g>

  <!-- Left: Local Demo -->
  <g transform="translate(48, 86)">
    <rect width="180" height="348" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="box-title" fill="#0369a1" x="0" y="0">本地原型 Demo</text>
      <text class="mono" fill="#0288d1" x="0" y="16">Vibe Coding 原型</text>

      <g transform="translate(0, 36)">
        <rect width="152" height="260" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-body" x="0" y="0">• 单用户纯本地环境</text>
          <text class="card-body" x="0" y="20">• 纯正常快乐路径</text>
          <text class="card-body" x="0" y="40">• 5秒延迟无所谓</text>
          <text class="card-body" x="0" y="60">• 环境变量明文裸存</text>
          <text class="card-body" x="0" y="80">• 报错看终端直接重试</text>
          <text class="card-body" x="0" y="100">• 几万 Token 成本忽略</text>
          <text class="mono" fill="#0288d1" x="0" y="140">STATUS: 演示惊艳</text>
          <text class="mono" fill="#0369a1" x="0" y="160">无法直接商用</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Center: 5 Chasms (Bridge Grid) -->
  <g transform="translate(244, 86)">
    <rect width="472" height="348" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="box-title" fill="#be123c" x="0" y="0">五道马里亚纳工程海沟 (Chasms)</text>

      <!-- Chasm 1 -->
      <g transform="translate(0, 26)">
        <rect width="440" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="chasm-title" x="0" y="0">1. 概率黑盒 vs 严格确定性</text>
          <text class="card-body" x="0" y="15">大模型每次输出随机漂移 -> 生产必须 100% 可复现与编译时强类型保证</text>
        </g>
      </g>

      <!-- Chasm 2 -->
      <g transform="translate(0, 84)">
        <rect width="440" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="chasm-title" x="0" y="0">2. 高并发竞态与状态漂移</text>
          <text class="card-body" x="0" y="15">单线程不报错 -> 百万并发下惊群效应、数据库死锁与分布式数据割裂</text>
        </g>
      </g>

      <!-- Chasm 3 -->
      <g transform="translate(0, 142)">
        <rect width="440" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="chasm-title" x="0" y="0">3. 静默故障与渐进式架构腐蚀</text>
          <text class="card-body" x="0" y="15">单机崩溃显眼 -> 线上静默丢包与微服务循环依赖，必须依赖 OpenTelemetry 追踪</text>
        </g>
      </g>

      <!-- Chasm 4 -->
      <g transform="translate(0, 200)">
        <rect width="440" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="chasm-title" x="0" y="0">4. 安全沙箱与合规渗透防御</text>
          <text class="card-body" x="0" y="15">本地安全假象 -> 面对全球黑客扫描、Prompt 注入越狱、密钥轮换与数据隔离</text>
        </g>
      </g>

      <!-- Chasm 5 -->
      <g transform="translate(0, 258)">
        <rect width="440" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="chasm-title" x="0" y="0">5. 延迟预算与 Token 成本悬崖</text>
          <text class="card-body" x="0" y="15">随意耗 Token -> 生产 P99 必须小于 200ms，每笔调用成本必须算到厘</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Production System -->
  <g transform="translate(732, 86)">
    <rect width="180" height="348" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="box-title" fill="#15803d" x="0" y="0">工业级生产系统</text>
      <text class="mono" fill="#16a34a" x="0" y="16">Production-Ready</text>

      <g transform="translate(0, 36)">
        <rect width="152" height="260" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-body" x="0" y="0">• 百万用户高并发</text>
          <text class="card-body" x="0" y="20">• 99.99% 容灾高可用</text>
          <text class="card-body" x="0" y="40">• 严格 SLA / SLO 监控</text>
          <text class="card-body" x="0" y="60">• 最小特权沙箱隔离</text>
          <text class="card-body" x="0" y="80">• 成本效益精确剪枝</text>
          <text class="card-body" x="0" y="100">• 完备可追溯与可审计</text>
          <text class="mono" fill="#15803d" x="0" y="140">STATUS: 坚不可摧</text>
          <text class="mono" fill="#166534" x="0" y="160">具备商业护城河</text>
        </g>
      </g>
    </g>
  </g>
</svg>