<svg width="960" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="se-native-title se-native-desc">
  <title id="se-native-title">重新定义 AI Native：伪 AI Native（旧流程挂插件） vs 真正的 AI Native（Agent 为执行主体）</title>
  <desc id="se-native-desc">对比展示人在回路中心打字的伪AI Native，以及Agent自主编写代码跑Eval、人类工程师坐裁判席定义规格与验收的真AI Native范式。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="500" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">重新定义 AI Native：是“人带 AI 工具”还是“Agent 主体 + 人类把关”？</text>
    <text class="subtitle" x="0" y="20">看研发流程是围绕人类打字设计的，还是围绕自主 Agent 集群设计的根本分歧</text>
  </g>

  <!-- Top: Pseudo AI Native (Legacy patched) -->
  <g transform="translate(48, 86)">
    <rect width="864" height="130" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <text class="box-title" fill="#be123c" x="0" y="0">伪 AI Native：人在回路中心（传统旧流程打补丁，本质仍是低效人肉搬砖）</text>

      <g transform="translate(0, 18)">
        <!-- Step 1 -->
        <g transform="translate(0, 0)">
          <rect width="180" height="58" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
          <g transform="translate(10, 14)">
            <text class="card-title" fill="#be123c" x="0" y="0">人类工程师 (瓶颈点)</text>
            <text class="card-body" x="0" y="15">逐行打字敲代码、审语法</text>
          </g>
        </g>

        <!-- Arrow 1 -> 2 -->
        <path d="M 180 29 L 210 29" stroke="#fda4af" stroke-width="1.5"/>
        <polygon points="210,29 204,26 204,32" fill="#fda4af"/>

        <!-- Step 2 -->
        <g transform="translate(210, 0)">
          <rect width="180" height="58" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
          <g transform="translate(10, 14)">
            <text class="card-title" x="0" y="0">偶尔让 Copilot 补全</text>
            <text class="card-body" x="0" y="15">仅充当高级语法提示器</text>
          </g>
        </g>

        <!-- Arrow 2 -> 3 -->
        <path d="M 390 29 L 420 29" stroke="#fda4af" stroke-width="1.5"/>
        <polygon points="420,29 414,26 414,32" fill="#fda4af"/>

        <!-- Step 3 -->
        <g transform="translate(420, 0)">
          <rect width="180" height="58" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
          <g transform="translate(10, 14)">
            <text class="card-title" x="0" y="0">人肉本地调试与测试</text>
            <text class="card-body" x="0" y="15">肉眼抓 Bug，排障繁琐</text>
          </g>
        </g>

        <!-- Arrow 3 -> 4 -->
        <path d="M 600 29 L 630 29" stroke="#fda4af" stroke-width="1.5"/>
        <polygon points="630,29 624,26 624,32" fill="#fda4af"/>

        <!-- Step 4 -->
        <g transform="translate(630, 0)">
          <rect width="202" height="58" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
          <g transform="translate(10, 14)">
            <text class="card-title" x="0" y="0">人肉触发上线发布</text>
            <text class="mono" fill="#be123c" x="0" y="15">人类打字速度是全链路吞吐上限</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom: True AI Native (Agent Swarm + Human Referee) -->
  <g transform="translate(48, 230)">
    <rect width="864" height="230" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <text class="box-title" fill="#15803d" x="0" y="0">真正的 AI Native：Agent 自主执行集群 + 人类裁判席定义规格与验收</text>

      <!-- Left: Human Referee -->
      <g transform="translate(0, 20)">
        <rect width="250" height="170" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#1d4ed8" x="0" y="0">人类工程师 (裁判席 / 架构师)</text>
          <text class="card-body" x="0" y="18">• 编写确定性 PRD 与 JSON Schema</text>
          <text class="card-body" x="0" y="34">• 搭建自动化 Eval 基准测试套件</text>
          <text class="card-body" x="0" y="50">• 注入安全策略与熔断降级规则</text>
          <text class="card-body" x="0" y="66">• 最终验收背书，掌控生产发布权</text>
          <text class="mono" fill="#1d4ed8" x="0" y="96">ROLE: 定义规格、评估质量、兜底权责</text>
        </g>
      </g>

      <!-- Middle: Agent Execution Swarm -->
      <g transform="translate(268, 20)">
        <rect width="360" height="170" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
        <g transform="translate(14, 16)">
          <text class="card-title" fill="#15803d" x="0" y="0">AI Agent 执行集群 (7x24 全天候执行主体)</text>
          <g transform="translate(0, 20)">
            <rect width="332" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
            <text class="card-body" x="8" y="21">• Coding Agent: 自主在沙盒 Worktree 写代码与重构</text>
          </g>
          <g transform="translate(0, 60)">
            <rect width="332" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
            <text class="card-body" x="8" y="21">• Review Agent: 自动化静态类型校验与代码洁癖审查</text>
          </g>
          <g transform="translate(0, 100)">
            <rect width="332" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
            <text class="card-body" x="8" y="21">• Test Agent: 混沌边界故障注入与突变测试</text>
          </g>
        </g>
      </g>

      <!-- Right: Automated CI/CD -->
      <g transform="translate(646, 20)">
        <rect width="186" height="170" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#14532d" x="0" y="0">自动化验证与发布</text>
          <text class="card-body" fill="#166534" x="0" y="18">• Eval 自动化评分判定</text>
          <text class="card-body" fill="#166534" x="0" y="34">• 零人肉干扰自动化闭环</text>
          <text class="card-body" fill="#166534" x="0" y="50">• 失败自动反馈 Agent 修复</text>
          <text class="card-body" fill="#166534" x="0" y="66">• 达标秒级推送到生产</text>
          <text class="mono" fill="#15803d" x="0" y="96">OUTPUT: 吞吐提升 100x</text>
        </g>
      </g>
    </g>
  </g>
</svg>