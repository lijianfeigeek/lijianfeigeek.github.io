<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="twoyi-gpu-title twoyi-gpu-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="twoyi-gpu-title">Twoyi for iOS 跨特权域零拷贝图形渲染泳道管线</title>
  <desc id="twoyi-gpu-desc">展示 Android 13 客户机通过 ANGLE、Vulkan、HWC 与 twoyi_protocol v1.6 共享内存桥接至 iOS 宿主端 gfxstream-apple、MoltenVK 与 display.metal 实现 ProMotion 120Hz 硬件合成的完整数据流。</desc>
  <defs>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">零 CPU 回读图形管线：ANGLE → gfxstream-apple → MoltenVK → Metal</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">GPU-DISPLAY-LAYERS-V1 · 24 APPLE PATCHES · PROMOTION HIGH REFRESH RATE</text>
    <text x="860" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: SWIMLANE</text>
  </g>

  <!-- Swimlane Backgrounds & Dividers -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="880" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569">LANE 01 · ANDROID 13 GUEST</text>

    <rect x="0" y="152" width="880" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="176" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c">LANE 02 · SHARED MEMORY BRIDGE</text>

    <rect x="0" y="292" width="880" height="156" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="316" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0284c7">LANE 03 · iOS HOST METAL</text>
  </g>

  <!-- Connectors (drawn BEFORE boxes) -->
  <!-- Box1(x=136..304, y=144..216) -> Box2(x=356..564, y=144..216) -->
  <line x1="304" y1="180" x2="352" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
  <rect x="311" y="156" width="38" height="14" rx="2" fill="#f8fafc"/>
  <text x="330" y="166" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">GLES</text>

  <!-- Box2(x=356..564, y=144..216) -> Box3(x=616..880, y=144..216) -->
  <line x1="564" y1="180" x2="612" y2="180" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="571" y="156" width="38" height="14" rx="2" fill="#f8fafc"/>
  <text x="590" y="166" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" text-anchor="middle">TWGB</text>

  <!-- Box3(x=748, y=216) -> Box4(x=356..880, y=288..356) straight vertical -->
  <line x1="748" y1="216" x2="748" y2="284" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arr-coral)"/>
  <rect x="756" y="242" width="112" height="16" rx="2" fill="#ffffff"/>
  <text x="762" y="253" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c">COMMIT + SYNC_FD</text>

  <!-- Box2(x=460, y=216) -> Box4(x=460, y=288) straight vertical (Vulkan stream) -->
  <line x1="460" y1="216" x2="460" y2="284" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-blue)"/>
  <rect x="468" y="242" width="108" height="16" rx="2" fill="#ffffff"/>
  <text x="474" y="253" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7">VK WIRE STREAM</text>

  <!-- Box4(x=460, y=356) -> Box5(x=136..356, y=440..516) orthogonal r=8 elbow -->
  <path d="M 460 356 L 460 392 Q 460 400 452 400 L 254 400 Q 246 400 246 408 L 246 436" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arr-coral)"/>
  <rect x="272" y="378" width="152" height="16" rx="2" fill="#f8fafc"/>
  <text x="348" y="389" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" text-anchor="middle">ZERO-COPY LEASE</text>

  <!-- Box5(x=136..356, y=440..516) -> Box6(x=408..608, y=440..516) -->
  <line x1="356" y1="478" x2="404" y2="478" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="364" y="454" width="36" height="14" rx="2" fill="#f8fafc"/>
  <text x="382" y="464" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" text-anchor="middle">SPIR-V</text>

  <!-- Box6(x=408..608, y=440..516) -> Box7(x=660..880, y=440..516) -->
  <line x1="608" y1="478" x2="656" y2="478" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="615" y="454" width="38" height="14" rx="2" fill="#f8fafc"/>
  <text x="634" y="464" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" text-anchor="middle">MTL</text>

  <!-- Nodes (drawn AFTER arrows) -->
  <!-- Box 1: Android App -->
  <g transform="translate(136, 144)">
    <rect x="0" y="0" width="168" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="84" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Android 应用层</text>
    <text x="84" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">OpenGL ES / Surface</text>
    <text x="84" y="62" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">HWUI / Vulkan Client</text>
  </g>

  <!-- Box 2: ANGLE + Vulkan HAL -->
  <g transform="translate(356, 144)">
    <rect x="0" y="0" width="208" height="72" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="104" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">ANGLE + Vulkan 驱动</text>
    <text x="104" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" text-anchor="middle">libGLESv2_angle.so (8.05MB)</text>
    <text x="104" y="62" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">vulkan.twoyi.so (1.21MB)</text>
  </g>

  <!-- Box 3: HWC + Gralloc -->
  <g transform="translate(616, 144)">
    <rect x="0" y="0" width="264" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="132" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">HWC 合成器与 Gralloc</text>
    <text x="132" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">hwcomposer.twoyi.so</text>
    <text x="132" y="62" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">gralloc.twoyi.so · TWGB</text>
  </g>

  <!-- Box 4: twoyi_protocol v1.6 (CORAL FOCAL) -->
  <g transform="translate(356, 288)">
    <rect x="0" y="0" width="524" height="68" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="262" y="26" font-size="14" font-weight="700" fill="#be123c" text-anchor="middle">twoyi_protocol.h v1.6 直接共享内存桥接</text>
    <text x="262" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#334155" text-anchor="middle">dev/twoyi-display · TwoyiBufferRegistry · SYNC_FD Fence + Consumer Lease</text>
  </g>

  <!-- Box 5: gfxstream-apple -->
  <g transform="translate(136, 440)">
    <rect x="0" y="0" width="220" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">gfxstream-apple</text>
    <text x="110" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">vulkan-cereal + 24 Patches</text>
    <text x="110" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">DisplayVk / CompositorVk</text>
  </g>

  <!-- Box 6: MoltenVK -->
  <g transform="translate(408, 440)">
    <rect x="0" y="0" width="200" height="76" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">MoltenVK + SPIRV-Cross</text>
    <text x="100" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" text-anchor="middle">Commit db660224</text>
    <text x="100" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">Queue Family 0 → Metal</text>
  </g>

  <!-- Box 7: display.metal -->
  <g transform="translate(660, 440)">
    <rect x="0" y="0" width="220" height="76" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="110" y="28" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">display.metal 直出合成</text>
    <text x="110" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" text-anchor="middle">neo_layer_fragment</text>
    <text x="110" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#334155" text-anchor="middle">IOSurface / ProMotion 120Hz</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 568)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <rect x="76" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="24" font-size="11" fill="#334155">跨端共享内存桥接 (v1.6)</text>
    <rect x="280" y="13" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="302" y="24" font-size="11" fill="#334155">Metal 硬件合成终端</text>
    <line x1="464" y1="20" x2="496" y2="20" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="504" y="24" font-size="11" fill="#334155">Vulkan 序列化指令流</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">EVIDENCE: gpu-build.json &amp; display.metal</text>
  </g>
</svg>