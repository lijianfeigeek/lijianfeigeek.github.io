<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="cfl-title cfl-desc" id="cicada-layers-root" data-diagram="layer-stack">
  <title id="cfl-title">知了 Cicada 五端零第三方依赖异构原生五层架构栈</title>
  <desc id="cfl-desc">展示 Cicada 如何以 12.8 万行源码和零第三方依赖，在 macOS、Windows、Linux、Android 与 iOS 五大平台上构建字节级兼容的音频内录、手搓声纹推理、AI 优先级网关与防录屏纪要体系。</desc>
  <defs>
    <pattern id="cfl-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="cfl-arr-up" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="640" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="640" fill="url(#cfl-dots)"/>
  <rect x="16" y="16" width="968" height="608" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">FIVE-HOST ZERO-DEPENDENCY STACK · 128,784 LOC · ONE BYTE-EXACT RECORD CONTRACT</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">拒绝 Electron 与推理框架膨胀：五端零第三方依赖原生分层映射全景</text>
  </g>

  <!-- Left Margin Direction Indicator -->
  <line x1="64" y1="532" x2="64" y2="132" stroke="#64748b" stroke-width="1.2" marker-end="url(#cfl-arr-up)"/>
  <g transform="translate(64, 116)">
    <text x="0" y="0" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em" text-anchor="middle">CONTRACT</text>
  </g>
  <g transform="translate(64, 552)">
    <text x="0" y="0" fill="#64748b" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em" text-anchor="middle">SILICON</text>
  </g>

  <!-- Column Headers (x=108..956, width=848) -->
  <g transform="translate(108, 96)">
    <text x="12" y="12" fill="#64748b" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LAYER</text>
    <text x="128" y="12" fill="#0f172a" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">MACOS / IOS ANCHOR</text>
    <text x="364" y="12" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">WINDOWS (.NET 10 / WIN32)</text>
    <text x="608" y="12" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LINUX &amp; ANDROID (C / JNI)</text>
  </g>

  <!-- Outer Stack Silhouette (x=108, y=116, width=848, height=440, 5 layers * 88px) -->
  <rect x="108" y="116" width="848" height="440" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <!-- L5: Stealth Surface & Byte-Exact Storage (y=116..204) -->
  <g transform="translate(108, 116)">
    <rect x="0" y="0" width="848" height="88" rx="6" fill="#ffffff"/>
    <line x1="0" y1="88" x2="848" y2="88" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="34" fill="#64748b" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">L5 · SURFACE</text>
    <text x="12" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">Stealth &amp; Vault</text>
    <text x="128" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">NSPanel 防录屏 + iOS 画中画流</text>
    <text x="128" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">sharingType=.none · PiP 960x300</text>
    <text x="128" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">Obsidian YAML 自动同步与富文本鱼骨图</text>
    <text x="364" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">无焦点悬浮窗 + 捕获剔除</text>
    <text x="364" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">WS_EX_NOACTIVATE · EXCLUDECAPTURE</text>
    <text x="364" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">字节级读写同一份 session.json 归档</text>
    <text x="608" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">Android 安全浮窗 / XWayland 显式提示</text>
    <text x="608" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">FLAG_SECURE · Linux 诚实标注可见</text>
    <text x="608" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">0600 独立密钥文件与 Keystore 隔离</text>
  </g>

  <!-- L4: AI Priority Gate & Homophone Correction (y=204..292) -->
  <g transform="translate(108, 204)">
    <rect x="0" y="0" width="848" height="88" fill="#f8fafc"/>
    <line x1="0" y1="88" x2="848" y2="88" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="34" fill="#64748b" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">L4 · AI GATE</text>
    <text x="12" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">2 RPS Priority</text>
    <text x="128" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">LingClient 三级队列与防劫持</text>
    <text x="128" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">speak(0) &gt; trans(1) &gt; notes(2)</text>
    <text x="128" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">强制关 thinking 省 2.6s · 原文置入 system</text>
    <text x="364" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">同音词声韵母校验与词表自学习</text>
    <text x="364" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">soundsAlike &gt;= 0.75 免打扰秒改</text>
    <text x="364" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">拦截“平台→platform”伪纠错防污染词表</text>
    <text x="608" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">多供应商自适应与离线拼音表</text>
    <text x="608" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">Ling / OpenRouter / vLLM / Ollama</text>
    <text x="608" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">内置 pinyin.tsv 跨端一致同音检索</text>
  </g>

  <!-- L3: FOCAL LAYER - 13MB WeSpeaker ResNet34-LM Voiceprint Engine (y=292..380) -->
  <g transform="translate(108, 292)">
    <rect x="0" y="0" width="848" height="88" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="34" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">L3 · VOICEPRINT</text>
    <text x="12" y="54" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">ResNet34-LM</text>
    <text x="128" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">vDSP Kaldi Fbank + Core ML</text>
    <text x="128" y="56" fill="#bf4520" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">首启编译 mlmodelc · GPU 256维嵌入</text>
    <text x="128" y="74" fill="#bf4520" font-size="9.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">在线余弦聚类 (0.5) + 跨场次记住同事声纹</text>
    <text x="364" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">系统内置 Windows ML 零运行时</text>
    <text x="364" y="56" fill="#bf4520" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">内嵌 voiceprint.onnx · 5s 推理 150ms</text>
    <text x="364" y="74" fill="#bf4520" font-size="9.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">免随包分发数十 MB ONNX Runtime DLL</text>
    <text x="608" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">426 行纯 C 手搓推理器 (voiceprint.c)</text>
    <text x="608" y="56" fill="#bf4520" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">CVP1 fp16 · axpy8 AVX2 · 5s 仅 238ms</text>
    <text x="608" y="74" fill="#bf4520" font-size="9.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">零 BLAS 依赖，Linux ctypes 与 Android NDK 共用</text>
  </g>

  <!-- L2: Full-Duplex Audio Tap & Virtual Mic Loopback (y=380..468) -->
  <g transform="translate(108, 380)">
    <rect x="0" y="0" width="848" height="88" fill="#f8fafc"/>
    <line x1="0" y1="88" x2="848" y2="88" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="34" fill="#64748b" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">L2 · AUDIO BUS</text>
    <text x="12" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">Tap &amp; VirtualMic</text>
    <text x="128" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">Core Audio Process Tap + BlackHole</text>
    <text x="128" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">剔除自身 PID · 跳过耳机麦前导通道</text>
    <text x="128" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">TCC 预检防静音假跑 · SHA-256 验签装驱动</text>
    <text x="364" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">WASAPI Loopback + VB-Cable</text>
    <text x="364" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">MediaFoundation AAC · EchoMic 防回声</text>
    <text x="364" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">支持外放去重与耳机双工并行混录</text>
    <text x="608" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">PulseAudio / PipeWire 免驱动虚拟麦</text>
    <text x="608" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">module-null-sink + remap-source</text>
    <text x="608" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">崩溃重启根据 real-mic 状态文件归还真麦</text>
  </g>

  <!-- L1: Zero-Dependency Native Build & UI Runtime (y=468..556) -->
  <g transform="translate(108, 468)">
    <rect x="0" y="0" width="848" height="88" rx="6" fill="#ffffff"/>
    <text x="12" y="34" fill="#64748b" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">L1 · RUNTIME</text>
    <text x="12" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">0 External Libs</text>
    <text x="128" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">纯 SwiftPM + swiftc 直编共享源码</text>
    <text x="128" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">无 .xcodeproj · iOS 直编 34 个 Mac 文件</text>
    <text x="128" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">仅装 Command Line Tools 即可构建 Mac 版</text>
    <text x="364" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">纯 C# 代码构建 WPF 界面</text>
    <text x="364" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">零 XAML · 零 NuGet · 手写 Ed25519</text>
    <text x="364" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">Cicada.Core 纯净层可在 Mac 上直接跑单测</text>
    <text x="608" y="34" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">纯 Python 标准库 + 纯原生 Android View</text>
    <text x="608" y="56" fill="#64748b" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace">零 pip 包 · 零 AndroidX / 零 Compose</text>
    <text x="608" y="74" fill="#475569" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">360 项 Linux 核心单测在 Mac 上 43 秒跑通</text>
  </g>

  <!-- Vertical Column Dividers inside Stack -->
  <line x1="224" y1="116" x2="224" y2="556" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="460" y1="116" x2="460" y2="556" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="704" y1="116" x2="704" y2="556" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="576" x2="960" y2="576" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(108, 592)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="20" y="12" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">核心算力突围层（13MB WeSpeaker 声纹模型跨 Core ML / WinML / 426行纯C 零依赖推理对齐）</text>
  </g>
  <g transform="translate(684, 592)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="20" y="12" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">Apache-2.0 协议 · 统一 VERSION 发布</text>
  </g>
