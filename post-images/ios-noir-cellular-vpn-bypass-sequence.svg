<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="480" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-cellular-vpn-bypass-sequence-title ios-noir-cellular-vpn-bypass-sequence-desc" id="ios-noir-cellular-vpn-bypass-sequence-root">
        <title id="ios-noir-cellular-vpn-bypass-sequence-title">旁路穿透：基站一键取号绕过 VPN 虚拟网卡时序</title>
        <desc id="ios-noir-cellular-vpn-bypass-sequence-desc">App 触发 multipath 特权，绑定 pdp_ip0 物理网卡强行穿透 utun 虚拟网卡直达运营商取号网关</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-cellular-vpn-bypass-sequence-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-cellular-vpn-bypass-sequence-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-cellular-vpn-bypass-sequence-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-cellular-vpn-bypass-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-cellular-vpn-bypass-sequence-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-cellular-vpn-bypass-sequence-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- 4 Lifelines -->
        <g transform="translate(60, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="80" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">手机 App (商业 SDK)</text>
        </g>
        <line x1="140" y1="52" x2="140" y2="440" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(290, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="80" y="21" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">VPN 虚拟网卡 (utun)</text>
        </g>
        <line x1="370" y1="52" x2="370" y2="440" stroke="#4f5d75" stroke-opacity="0.3" stroke-dasharray="3 3"/>

        <g transform="translate(520, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.06"/>
          <text x="80" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">4G/5G 物理网卡 (pdp_ip0)</text>
        </g>
        <line x1="600" y1="52" x2="600" y2="440" stroke="#bf4520" stroke-opacity="0.3" stroke-dasharray="3 3"/>

        <g transform="translate(740, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="80" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">运营商基站网关 (id6.me)</text>
        </g>
        <line x1="820" y1="52" x2="820" y2="440" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- User Premise Box -->
        <g transform="translate(100, 70)">
          <rect x="0" y="0" width="760" height="42" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.12)"/>
          <text x="380" y="26" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">用户前提环境：手机连接家里 Wi-Fi，且处于全局海外 VPN 加密代理保护状态</text>
        </g>

        <!-- Message 1: App binds to pdp_ip0 directly -->
        <path d="M 140 145 L 595 145" fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#ios-noir-cellular-vpn-bypass-sequence-arrow-accent)"/>
        <text x="365" y="138" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">1. 触发 multipath 特权，显式指定 Socket 绑定 pdp_ip0 蜂窝物理通道！</text>

        <!-- Bypass Callout on utun -->
        <g transform="translate(300, 165)">
          <rect x="0" y="0" width="140" height="40" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
          <text x="70" y="18" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">【彻底被绕过】</text>
          <text x="70" y="32" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="9" text-anchor="middle">utun 网卡未见任何流量</text>
        </g>

        <!-- Message 2: Cellular to Carrier Gateway -->
        <path d="M 600 230 L 815 230" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-noir-cellular-vpn-bypass-sequence-arrow-link)"/>
        <text x="710" y="223" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">2. 直连三大运营商基站免密网关</text>

        <!-- Carrier Verification Box -->
        <g transform="translate(730, 255)">
          <rect x="0" y="0" width="180" height="54" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.05"/>
          <text x="90" y="18" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">基站核心网鉴权</text>
          <text x="90" y="34" fill="#2d3142" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">提取 SIM 卡物理 IMSI 号码</text>
          <text x="90" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="9" text-anchor="middle">映射物理基站真实出网 IP</text>
        </g>

        <!-- Message 3: Carrier returns phone number to App -->
        <path d="M 820 340 L 145 340" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#ios-noir-cellular-vpn-bypass-sequence-arrow-accent)"/>
        <text x="480" y="333" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">3. 网关直接将明文手机号与国内归属地返回给 App SDK</text>

        <!-- Result Box -->
        <g transform="translate(240, 390)">
          <rect x="0" y="0" width="480" height="34" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
          <text x="240" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">伪装彻底破防 · 无论开启多少层代理，真实手机号与物理基站位置秒级识破</text>
        </g>
      </svg>
