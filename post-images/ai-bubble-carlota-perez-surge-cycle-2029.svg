<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-carlota-perez-surge-cycle-2029-title ai-bubble-carlota-perez-surge-cycle-2029-desc">
  <title id="ai-bubble-carlota-perez-surge-cycle-2029-title">卡萝塔·佩蕾丝技术浪潮演进周期与 2029 泡沫拐点假说</title>
  <desc id="ai-bubble-carlota-perez-surge-cycle-2029-desc">导入期单点突破，疯狂期资本加杠杆过度乐观，2029年危机拐点预期落差出清，随后迈入真正生产力繁荣的黄金展开期</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="280" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Phase 1: Installation -->
  <g transform="translate(40, 45)">
    <rect width="200" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-badge" fill="#0284c7">阶段 1 · 2022 ~ 2025</text>
    <text x="16" y="52" class="label-title">导入期 (Installation)</text>
    <text x="16" y="70" class="text-body">单点技术标杆突破</text>
    <line x1="16" y1="82" x2="184" y2="82" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="104" class="text-body">ChatGPT 惊艳问世</text>
    <text x="16" y="124" class="text-body">大模型范式确立</text>
    <text x="16" y="144" class="text-body">算力基础设施全面铺开</text>
    <text x="16" y="164" class="text-body" fill="#64748b">“奇点降临，全民震撼”</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 245 140 L 265 140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#cycle-arrow)"/>

  <!-- Phase 2: Frenzy -->
  <g transform="translate(270, 45)">
    <rect width="200" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-badge" fill="#ea580c">阶段 2 · 2026 ~ 2028</text>
    <text x="16" y="52" class="label-title">疯狂期 (Frenzy)</text>
    <text x="16" y="70" class="text-body">全面过度乐观与加杠杆</text>
    <line x1="16" y1="82" x2="184" y2="82" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="104" class="text-body">Robotaxi / 代码生成兑现</text>
    <text x="16" y="124" class="text-body">资本盲目推断复制到全行业</text>
    <text x="16" y="144" class="text-body">资产代币化放大金融杠杆</text>
    <text x="16" y="164" class="text-body" fill="#ea580c">“估值脱离现实物理约束”</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 475 140 L 495 140" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cycle-arrow)"/>

  <!-- Phase 3: Turning Point (Focal) -->
  <g transform="translate(500, 45)">
    <rect width="200" height="190" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="16" y="28" class="tag-coral">阶段 3 · 2029 拐点</text>
    <text x="16" y="52" class="label-title" fill="#9a3412">危机与转折点 (Crash)</text>
    <text x="16" y="70" class="tag-coral">预期断崖与泡沫急速破灭</text>
    <line x1="16" y1="82" x2="184" y2="82" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="104" class="text-body">实体行业渗透阻力远超预期</text>
    <text x="16" y="124" class="text-body">流动性收紧与政经周期共振</text>
    <text x="16" y="144" class="text-body" style="font-weight: 600;" fill="#bf4520">挤出脱离现实的金融虚高</text>
    <text x="16" y="164" class="text-body" fill="#9a3412">核心生产力资产被黄金砸底</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 705 140 L 725 140" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cycle-arrow)"/>

  <!-- Phase 4: Golden Age -->
  <g transform="translate(730, 45)">
    <rect width="190" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-badge" fill="#15803d">阶段 4 · 2030+ 繁荣</text>
    <text x="16" y="52" class="label-title">黄金展开期 (Synergy)</text>
    <text x="16" y="70" class="text-body">大而不倒与真实生产力</text>
    <line x1="16" y1="82" x2="174" y2="82" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="104" class="text-body">央行救市成熟注资</text>
    <text x="16" y="124" class="text-body">半年至一年迅速触底反弹</text>
    <text x="16" y="144" class="text-body">AI 全面融入产业毛细血管</text>
    <text x="16" y="164" class="text-body" fill="#15803d">“属于实干者的真实黄金年代”</text>
  </g>
</svg>