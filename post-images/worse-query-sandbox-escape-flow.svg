<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="coralBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="blueBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="640" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="592" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="140" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">PROCESS / EXPLOIT FLOW</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">worse_query 沙盒逃逸机理：App Group 符号链接欺骗与特权借调</text>
    <text x="0" y="74" fill="#475569" font-size="13">解密如何利用 containermanagerd 路径校验盲区与符号链接解析时序差，合法骗取内核沙盒扩展句柄</text>
  </g>

  <!-- Step 1: Preparation &amp; Symlink Redirection -->
  <g transform="translate(60, 160)">
    <rect width="220" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="58" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">PHASE 1</text>
      <text x="68" y="16" fill="#f8fafc" font-size="14" font-weight="700">布局符号链接</text>
      <text x="0" y="38" fill="#475569" font-size="11">攻击者掌控的合法容器</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="188" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#0284c7" font-size="11" font-weight="600">1.1 解析 App Group 路径</text>
      <text x="12" y="38" fill="#334155" font-size="10">containerURLForSecurity-</text>
      <text x="12" y="52" fill="#334155" font-size="10">ApplicationGroupIdentifier</text>
      <text x="12" y="70" fill="#334155" font-size="10">获取组沙盒根目录绝对路径</text>
      <text x="12" y="86" fill="#475569" font-size="10">应用对该目录具有完整写入权限</text>
    </g>

    <g transform="translate(16, 186)">
      <rect width="188" height="116" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="700">1.2 注入任意目标软链接</text>
      <text x="12" y="38" fill="#334155" font-size="10">删除已有 Library/Caches</text>
      <text x="12" y="56" fill="#334155" font-size="10">符号链接替换：</text>
      <text x="12" y="74" fill="#e11d48" font-size="9" font-family="monospace">Caches -> /var/mobile/...</text>
      <text x="12" y="92" fill="#334155" font-size="10">指向外部受限容器或系统目录</text>
      <text x="12" y="106" fill="#e11d48" font-size="10">关键动作：完成越界跳板埋设</text>
    </g>

    <g transform="translate(16, 316)">
      <rect width="188" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#334155" font-size="11" font-weight="600">状态：就绪待触发</text>
      <text x="12" y="38" fill="#475569" font-size="10">组目录中存在恶意符号链接</text>
      <text x="12" y="56" fill="#475569" font-size="10">准备向守护进程发起 XPC 询问</text>
    </g>
  </g>

  <!-- Step 2: XPC Query Construction -->
  <g transform="translate(315, 160)">
    <rect width="220" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="58" height="22" rx="4" fill="#0369a1" />
      <text x="10" y="15" fill="#bae6fd" font-size="10" font-weight="700">PHASE 2</text>
      <text x="68" y="16" fill="#f8fafc" font-size="14" font-weight="700">伪装请求参数</text>
      <text x="0" y="38" fill="#475569" font-size="11">libsystem_containermanager</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="188" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#0284c7" font-size="11" font-weight="600">2.1 构建标准容器查询</text>
      <text x="12" y="38" fill="#334155" font-size="10">container_query_create()</text>
      <text x="12" y="56" fill="#334155" font-size="10">设置 class = 7 (App Group)</text>
      <text x="12" y="74" fill="#334155" font-size="10">绑定 group 标识符</text>
      <text x="12" y="92" fill="#0284c7" font-size="10">声明 part = 3 (Caches)</text>
      <text x="12" y="106" fill="#475569" font-size="9">表面行为符合官方正常规范</text>
    </g>

    <g transform="translate(16, 206)">
      <rect width="188" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#0284c7" font-size="11" font-weight="600">2.2 操纵扩展查询标志位</text>
      <text x="12" y="38" fill="#334155" font-size="10">query_set_flags:</text>
      <text x="12" y="56" fill="#d97706" font-size="10" font-family="monospace">0x0000008000000000ULL</text>
      <text x="12" y="74" fill="#334155" font-size="10">请求全功能沙盒扩展令牌</text>
      <text x="12" y="88" fill="#475569" font-size="9">兼容特定版本 alt_flags 机制</text>
    </g>

    <g transform="translate(16, 316)">
      <rect width="188" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#334155" font-size="11" font-weight="600">2.3 发起跨进程调用</text>
      <text x="12" y="38" fill="#334155" font-size="10">query_get_single_result()</text>
      <text x="12" y="56" fill="#475569" font-size="10">同步阻塞等待系统守护进程</text>
    </g>
  </g>

  <!-- Step 3: Containermanagerd Blind Resolution -->
  <g transform="translate(570, 160)">
    <rect width="220" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="58" height="22" rx="4" fill="#fff1f2" />
      <text x="10" y="15" fill="#fecaca" font-size="10" font-weight="700">PHASE 3</text>
      <text x="68" y="16" fill="#f8fafc" font-size="14" font-weight="700">特权盲从解析</text>
      <text x="0" y="38" fill="#475569" font-size="11">containermanagerd 守护进程</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="188" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="600">3.1 身份与权限校验通过</text>
      <text x="12" y="38" fill="#334155" font-size="10">守护进程检查调用方权限：</text>
      <text x="12" y="56" fill="#334155" font-size="10">确认应用拥有该 AppGroup 签名</text>
      <text x="12" y="74" fill="#059669" font-size="10">校验通过：允许发放 Caches 令牌</text>
      <text x="12" y="88" fill="#475569" font-size="9">致命盲点：未校验最终物理路径</text>
    </g>

    <g transform="translate(16, 186)">
      <rect width="188" height="116" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="700">3.2 特权跟随恶意符号链接</text>
      <text x="12" y="38" fill="#334155" font-size="10">守护进程解析 part=3 目录：</text>
      <text x="12" y="56" fill="#e11d48" font-size="10">自动 dereference 符号链接！</text>
      <text x="12" y="74" fill="#334155" font-size="10">将真实路径判定为外部目标：</text>
      <text x="12" y="92" fill="#e11d48" font-size="9" font-family="monospace">/var/mobile/Containers/...</text>
      <text x="12" y="106" fill="#334155" font-size="9">以 root/特权身份调用内核接口</text>
    </g>

    <g transform="translate(16, 316)">
      <rect width="188" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#0284c7" font-size="11" font-weight="600">3.3 签发沙盒扩展令牌</text>
      <text x="12" y="38" fill="#334155" font-size="10">内核生成合法的 Token 字符串</text>
      <text x="12" y="56" fill="#475569" font-size="10">经由 IPC 将凭证返还给应用</text>
    </g>
  </g>

  <!-- Step 4: Token Consumption &amp; Cleanup -->
  <g transform="translate(825, 160)">
    <rect width="215" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="58" height="22" rx="4" fill="#f0fdf4" />
      <text x="10" y="15" fill="#a7f3d0" font-size="10" font-weight="700">PHASE 4</text>
      <text x="68" y="16" fill="#f8fafc" font-size="14" font-weight="700">消费句柄与清场</text>
      <text x="0" y="38" fill="#475569" font-size="11">进程空间权限永久扩增</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="183" height="106" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1" />
      <text x="12" y="20" fill="#059669" font-size="11" font-weight="700">4.1 内核扩展生效</text>
      <text x="12" y="38" fill="#334155" font-size="10">copy_sandbox_token()</text>
      <text x="12" y="56" fill="#a7f3d0" font-size="10">sandbox_extension_consume()</text>
      <text x="12" y="74" fill="#334155" font-size="10">返回系统 handle (句柄 &gt; 0)</text>
      <text x="12" y="92" fill="#059669" font-size="10">进程立即可读写该目标路径！</text>
    </g>

    <g transform="translate(16, 196)">
      <rect width="183" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#0284c7" font-size="11" font-weight="600">4.2 现场抹除与复原</text>
      <text x="12" y="38" fill="#334155" font-size="10">sbx_clean_group_caches()</text>
      <text x="12" y="56" fill="#334155" font-size="10">移除恶意的符号链接</text>
      <text x="12" y="74" fill="#334155" font-size="10">重新创建干净 Caches 目录</text>
      <text x="12" y="88" fill="#475569" font-size="9">不留任何磁盘异常证据</text>
    </g>

    <g transform="translate(16, 306)">
      <rect width="183" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#a7f3d0" font-size="11" font-weight="600">4.3 句柄缓存入池</text>
      <text x="12" y="38" fill="#334155" font-size="10">存储进 g_handles 数组</text>
      <text x="12" y="56" fill="#475569" font-size="10">作为后续虚拟文件系统挂载基石</text>
      <text x="12" y="72" fill="#0284c7" font-size="10">整个 App 生命周期持续有效</text>
    </g>
  </g>

  <!-- Connective Arrows between Phases -->
  <g stroke="#0284c7" stroke-width="2" fill="none" opacity="0.75">
    <path d="M 280 340 L 315 340" />
    <polygon points="315,340 307,336 307,344" fill="#38bdf8" stroke="none" />
    
    <path d="M 535 340 L 570 340" />
    <polygon points="570,340 562,336 562,344" fill="#38bdf8" stroke="none" />
    
    <path d="M 790 340 L 825 340" />
    <polygon points="825,340 817,336 817,344" fill="#38bdf8" stroke="none" />
  </g>

  <!-- Footer Annotation -->
  <g transform="translate(60, 582)">
    <text x="0" y="16" fill="#475569" font-size="11">核心特征：无需越狱、无需内核漏洞篡改内联代码，完全基于 Apple 官方动态库 libsystem_containermanager 与 containermanagerd 的逻辑借权实现。</text>
  </g>
</svg>
