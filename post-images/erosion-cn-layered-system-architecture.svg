<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f1624" />
    </linearGradient>
    <linearGradient id="coralGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1120" height="780" fill="#ffffff" />
  <rect x="20" y="20" width="1080" height="740" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(56, 50)">
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#f8fafc" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">SYSTEM LAYER STACK</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">Erosion-CN 六层技术架构全景体系</text>
    <text x="0" y="74" fill="#475569" font-size="13">从 Mach-O 动态签名捕获、worse_query 特权借调到 dyld 内存解析与零 0 字节原位落盘引擎</text>
  </g>

  <!-- Layer 6: Application &amp; Tweaks Layer -->
  <g transform="translate(56, 140)">
    <rect width="1008" height="84" rx="10" fill="url(#cardGrad1)" stroke="#cbd5e1" stroke-width="1" />
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="url(#purpleGrad1)" />
      <text x="8" y="14" fill="#f8fafc" font-size="10" font-weight="700">LAYER 6</text>
      <text x="92" y="15" fill="#f8fafc" font-size="13" font-weight="700">应用交互与系统定制层 (UI &amp; Tweak Modules)</text>
      <text x="0" y="38" fill="#334155" font-size="11">国行底层解锁 (green-tea/wapi) · 进阶 AI 与 Apple 智能 · 影像/健康特性 · 锁屏铭牌/壁纸 · 跨容器应用数据/录音无损提取 · Surge/Stash 规则</text>
      <text x="0" y="56" fill="#475569" font-size="11">核心视图：GestaltView · MGInspectorView · AppGroupHubView · VoiceMemosAIView · SQLiteSnapshotHelper</text>
    </g>
  </g>

  <!-- Layer 5: Safe Storage &amp; Vault Layer -->
  <g transform="translate(56, 236)">
    <rect width="1008" height="96" rx="10" fill="url(#cardGrad1)" stroke="#0ea5e9" stroke-width="1.5" />
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="url(#blueGrad1)" />
      <text x="8" y="14" fill="#f8fafc" font-size="10" font-weight="700">LAYER 5</text>
      <text x="92" y="15" fill="#0284c7" font-size="13" font-weight="700">安全持久化存储与双重金库层 (Zero 0-Byte IO &amp; Dual-Vault Engine)</text>
      <text x="0" y="38" fill="#f8fafc" font-size="11">【核心硬核创新】零 0 字节窗口原位覆盖写入协议 (pwrite 从偏移 0 原位写 + ftruncate 尾裁剪 + F_FULLFSYNC 物理刷盘 + 读回校验与自动回滚)</text>
      <text x="0" y="56" fill="#334155" font-size="11">【双重原厂金库】沙盒隔离 OriginalGestalt.plist + 系统级 .erosion_factory_vault.plist (isExcludedFromBackup 避云污染)，跨自签卸载重装不丢备份</text>
      <text x="0" y="72" fill="#475569" font-size="11">核心模块：WriteHelpers.swift (writeFileAtomically) · GestaltHelpers.swift (mgSyncSystemVaultBackup / mgComputeSHA256Hex)</text>
    </g>
  </g>

  <!-- Layer 4: libMobileGestalt Dynamic Runtime Parsing Layer -->
  <g transform="translate(56, 344)">
    <rect width="1008" height="96" rx="10" fill="url(#cardGrad1)" stroke="#059669" stroke-width="1.5" />
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="url(#emeraldGrad1)" />
      <text x="8" y="14" fill="#f8fafc" font-size="10" font-weight="700">LAYER 4</text>
      <text x="92" y="15" fill="#059669" font-size="13" font-weight="700">内存运行时动态偏移解析层 (Zero Hardcoded Dyld Inspection)</text>
      <text x="0" y="38" fill="#f8fafc" font-size="11">彻底弃用静态硬编码：只读解析当前加载的 /usr/lib/libMobileGestalt.dylib 内存镜像段 (__TEXT.__cstring / __DATA_CONST.__const)</text>
      <text x="0" y="56" fill="#334155" font-size="11">多重门控自适应识别：实时计算当前机型与系统版本的 CacheUUID、槽位总数、布尔槽位偏移 (green-tea, wapi, AOD, Camera, AI 等 40+ 硬件特性)</text>
      <text x="0" y="72" fill="#475569" font-size="11">核心模块：MGImageReader.m (MGCopyLoadedMobileGestaltImage) · MGCacheLayout.swift (MGCacheDataLayout / MGCacheDataCoordinator)</text>
    </g>
  </g>

  <!-- Layer 3: Lossless Plist &amp; APFS Resolution Layer -->
  <g transform="translate(56, 452)">
    <rect width="1008" height="96" rx="10" fill="url(#cardGrad1)" stroke="#d97706" stroke-width="1" />
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="url(#amberGrad1)" />
      <text x="8" y="14" fill="#f8fafc" font-size="10" font-weight="700">LAYER 3</text>
      <text x="92" y="15" fill="#d97706" font-size="13" font-weight="700">无损属性列表处理与跨容器寻址层 (Lossless Plist &amp; CSStore Resolution)</text>
      <text x="0" y="38" fill="#f8fafc" font-size="11">【无损直通】CFGetTypeID 精确识别 CFBoolean，CFNumberIsFloatType 保留浮点数 (1.0, 2.0 相机变焦)，未改项 100% 原始直通彻底修复相机黑屏</text>
      <text x="0" y="56" fill="#334155" font-size="11">【秒级寻址】直接解析 LaunchServices CSStore2 (bdsl) 映射表 + containermanagerd 本地遍历，无须暴力扫盘秒级定标应用与插件容器</text>
      <text x="0" y="72" fill="#475569" font-size="11">核心模块：PlistManager.swift (CFBooleanGetTypeID / Lossless Pass-through) · CSStoreResolver.m · CSStoreEngine.swift</text>
    </g>
  </g>

  <!-- Layer 2: Privilege Borrowing &amp; worse_query Exploit Layer -->
  <g transform="translate(56, 560)">
    <rect width="1008" height="96" rx="10" fill="url(#cardGrad1)" stroke="#e11d48" stroke-width="1.5" />
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="url(#coralGrad1)" />
      <text x="8" y="14" fill="#f8fafc" font-size="10" font-weight="700">LAYER 2</text>
      <text x="92" y="15" fill="#e11d48" font-size="13" font-weight="700">沙盒逃逸与特权借调层 (worse_query 0-Day Containermanagerd Exploit)</text>
      <text x="0" y="38" fill="#f8fafc" font-size="11">利用合法 App Group 容器内的 Library/Caches 路径，将其替换为指向受保护系统容器的符号链接 (Symlink Redirection)</text>
      <text x="0" y="56" fill="#334155" font-size="11">向 libsystem_containermanager 发送 class=7, part=3 特权查询，诱导系统守护进程 containermanagerd 向应用下发内核级沙盒扩展令牌</text>
      <text x="0" y="72" fill="#475569" font-size="11">核心模块：worse_query.m (container_copy_sandbox_token / sandbox_extension_consume) · WorseQuerySwift.swift</text>
    </g>
  </g>

  <!-- Layer 1: App Entitlements &amp; Signature Boundary -->
  <g transform="translate(56, 668)">
    <rect width="1008" height="64" rx="10" fill="url(#cardGrad1)" stroke="#cbd5e1" stroke-width="1" />
    <g transform="translate(20, 14)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#334155" />
      <text x="8" y="14" fill="#334155" font-size="10" font-weight="700">LAYER 1</text>
      <text x="92" y="15" fill="#334155" font-size="13" font-weight="700">应用签名与自适应权限捕获边界 (SecTask &amp; Mach-O Parsing Boundary)</text>
      <text x="0" y="36" fill="#475569" font-size="11">SecTaskCopyValueForEntitlement 动态读取已签名 App Group + Mach-O CSBlob 静态嵌入段解析回退，自适应兼容各类侧载签名工具</text>
    </g>
  </g>
</svg>
