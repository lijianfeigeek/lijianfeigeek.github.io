<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="680" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="632" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="156" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">LCSign 端侧离线全流程签名与 LoadControl 运行时拓扑</text>
    <text x="0" y="74" fill="#475569" font-size="13">涵盖多源包体解析、Deb 依赖重写、Mach-O 原位补丁、原生 C++ 签名、回环 OTA 安装与注入自愈全链路</text>
  </g>

  <!-- Column 1: 多源导入与项目工作区 -->
  <g transform="translate(60, 160)">
    <rect width="230" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="62" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">LAYER 1</text>
      <text x="72" y="16" fill="#f8fafc" font-size="14" font-weight="700">多源输入与隔离</text>
      <text x="0" y="38" fill="#475569" font-size="11">沙盒内独立工作区容器</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="198" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">包体与资产导入</text>
      <text x="12" y="42" fill="#334155" font-size="10">• IPA / TIPA 安装包解包</text>
      <text x="12" y="58" fill="#334155" font-size="10">• .deb 越狱插件包解包</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 独立 dylib / Frameworks</text>
      <text x="12" y="90" fill="#475569" font-size="9">SWCompression 递归解压流</text>
    </g>

    <g transform="translate(16, 186)">
      <rect width="198" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">项目元数据热修改</text>
      <text x="12" y="42" fill="#334155" font-size="10">• Bundle ID 自定义覆盖</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 标题与版本号就地修补</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 多尺寸 AppIcon 自动裁切</text>
      <text x="12" y="94" fill="#059669" font-size="10">Assets.car 深色图标修复</text>
    </g>

    <g transform="translate(16, 310)">
      <rect width="198" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">开发套件与文件管理</text>
      <text x="12" y="42" fill="#334155" font-size="10">• Runestone + TreeSitter 编辑</text>
      <text x="12" y="58" fill="#334155" font-size="10">• Hex 二进制双栏检视器</text>
      <text x="12" y="74" fill="#334155" font-size="10">• Info.plist 结构化编辑器</text>
      <text x="12" y="90" fill="#334155" font-size="10">• 局域网 WebDAV 传输站点</text>
      <text x="12" y="108" fill="#475569" font-size="9">GCDWebServer 端口 8088 监听</text>
    </g>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 290 280 L 320 280" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Column 2: 注入解析与 Mach-O 重构 -->
  <g transform="translate(320, 160)">
    <rect width="230" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="62" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">LAYER 2</text>
      <text x="72" y="16" fill="#f8fafc" font-size="14" font-weight="700">依赖解析与修补</text>
      <text x="0" y="38" fill="#475569" font-size="11">Mach-O 载入命令与路径</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="198" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">Deb 插件规则解析</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 解析 Cydia 过滤规则 Plist</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 识别主二进制与扩展插件</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 自动补全 SubstrateStub 桩</text>
      <text x="12" y="94" fill="#059669" font-size="10">免越狱环境 API 兼容层</text>
    </g>

    <g transform="translate(16, 200)">
      <rect width="198" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">Mach-O 依赖自动重写</text>
      <text x="12" y="42" fill="#334155" font-size="10">• CydiaRewriteRules 路径改写</text>
      <text x="12" y="58" fill="#334155" font-size="10">• /Library/... 转换为 @rpath</text>
      <text x="12" y="74" fill="#334155" font-size="10">• arm64e ABI 修复与兼容</text>
      <text x="12" y="94" fill="#334155" font-size="10">• LC_RPATH 补全与去重</text>
    </g>

    <g transform="translate(16, 324)">
      <rect width="198" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">双注入模式调度</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 传统 LC_LOAD_DYLIB 注入</text>
      <text x="12" y="58" fill="#334155" font-size="10">• LoadControl 可控动态注入</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 辅助组件/扩展独立路由</text>
      <text x="12" y="94" fill="#475569" font-size="9">按 Target 细粒度精准挂载</text>
    </g>
  </g>

  <!-- Connect 2 -> 3 -->
  <path d="M 550 280 L 580 280" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Column 3: 端侧原生签名引擎 -->
  <g transform="translate(580, 160)">
    <rect width="230" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="62" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">LAYER 3</text>
      <text x="72" y="16" fill="#f8fafc" font-size="14" font-weight="700">端侧原生签名</text>
      <text x="0" y="38" fill="#475569" font-size="11">C++ 内嵌 zsign + OpenSSL</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="198" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">证书与描述文件管理</text>
      <text x="12" y="42" fill="#334155" font-size="10">• PKCS#12 证书离线解析</text>
      <text x="12" y="58" fill="#334155" font-size="10">• MobileProvision 自动匹配</text>
      <text x="12" y="74" fill="#334155" font-size="10">• OCSP / CRL 证书吊销校验</text>
      <text x="12" y="94" fill="#059669" font-size="10">ChaCha20 存取码安全备份</text>
    </g>

    <g transform="translate(16, 200)">
      <rect width="198" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">签名与权限注入流水线</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 剥离历史旧签名与废弃扩展</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 深度递归签署 Mach-O/dylib</text>
      <text x="12" y="74" fill="#334155" font-size="10">• CodeDirectory 散列与 SuperBlob</text>
      <text x="12" y="94" fill="#334155" font-size="10">• 权限 Entitlements 合规注入</text>
    </g>

    <g transform="translate(16, 324)">
      <rect width="198" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">后台保活与实时活动</text>
      <text x="12" y="42" fill="#334155" font-size="10">• silence.wav 音频后台保活</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 规避 30s 进程冻结闪退</text>
      <text x="12" y="74" fill="#334155" font-size="10">• ActivityKit 灵动岛进度广播</text>
      <text x="12" y="94" fill="#475569" font-size="9">锁屏与桌面小组件同步展示</text>
    </g>
  </g>

  <!-- Connect 3 -> 4 -->
  <path d="M 810 280 L 840 280" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrowCoral)" />

  <!-- Column 4: 闭环回环服务与系统交付 (Core Innovation / Focal) -->
  <g transform="translate(840, 160)">
    <rect width="230" height="460" rx="12" fill="#f8fafc" stroke="#e11d48" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="62" height="22" rx="4" fill="#be123c" />
      <text x="10" y="15" fill="#fecdd3" font-size="10" font-weight="700">LAYER 4</text>
      <text x="72" y="16" fill="#e11d48" font-size="14" font-weight="700">回环安装与管控</text>
      <text x="0" y="38" fill="#334155" font-size="11">免电脑 OTA + 运行时掌控</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="198" height="110" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" />
      <text x="12" y="22" fill="#e11d48" font-size="11" font-weight="700">127.0.0.1 回环 OTA 引擎</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 绑定公网 DNS i.lcsignx.com</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 载入 SSL.com 商业 TLS 证书</text>
      <text x="12" y="74" fill="#334155" font-size="10">• itms-services 协议零弹窗安装</text>
      <text x="12" y="94" fill="#e11d48" font-size="10">完美绕过系统自签名 CA 限制</text>
    </g>

    <g transform="translate(16, 200)">
      <rect width="198" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">LoadControl 运行时拦截</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 构造函数拦截 App 启动</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 捕获 NSException 与底层信号</text>
      <text x="12" y="74" fill="#334155" font-size="10">• dlopen 按序按需动态挂载</text>
      <text x="12" y="94" fill="#334155" font-size="10">• 无需重签即可开关插件</text>
    </g>

    <g transform="translate(16, 324)">
      <rect width="198" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">崩溃自愈与保命模式</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 栈回溯自动定位首恶 dylib</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 闪退后就地禁用故障插件</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 2分钟内 ≥3 次连崩触发保护</text>
      <text x="12" y="94" fill="#059669" font-size="10">彻底杜绝应用无限闪退死锁</text>
    </g>
  </g>
</svg>
