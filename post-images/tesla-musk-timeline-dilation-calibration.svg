<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="tsla-time-title tsla-time-desc">
  <title id="tsla-time-title">埃隆时间轴膨胀规律量化与财务模型校准法则</title>
  <desc id="tsla-time-desc">展示纽约时报对马斯克602项公开承诺的履约复盘、硬件2.3倍延期与算法7倍延期规律，以及2030基准模型的校准方法论。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .val-large { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">埃隆时间轴膨胀规律量化与模型校准法则</text>
    <text class="subtitle" x="0" y="20">拒绝盲信创始人远期愿景：NYT 复盘 602 项公开目标按时达成率仅 19%，以确定性延期规律修正估值时间轴</text>
  </g>

  <!-- Left: Source Promise -->
  <g transform="translate(48, 86)">
    <rect width="230" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">1. 马斯克公开口头承诺</text>

    <g transform="translate(14, 40)">
      <rect width="202" height="130" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">《纽约时报》深度量化复盘</text>
        <text class="card-body" x="0" y="18">• 梳理历年 602 项公开业务目标</text>
        <text class="val-large" fill="#e11d48" x="0" y="44">19%</text>
        <text class="card-body" x="46" y="42">按时履约率 (81% 延宕)</text>
        <text class="card-body" x="0" y="64">• 承诺具有强煽动性与牛市催化属性</text>
        <text class="mono" fill="#be123c" x="0" y="82">RISK: 绝不可直接作为现金流贴现</text>
      </g>
    </g>

    <g transform="translate(14, 186)">
      <rect width="202" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">分类过滤矩阵</text>
        <text class="card-body" x="0" y="18">• 区分“重资产制造业”</text>
        <text class="card-body" x="0" y="32">  与“前沿世界模型算法”</text>
        <text class="card-body" x="0" y="48">• 赋予不同倍数的确定性膨胀因子</text>
        <text class="mono" fill="#1e40af" x="0" y="70">RULE: 量化折现而非主观揣测</text>
      </g>
    </g>
  </g>

  <!-- Middle: Dilation Factor Branches -->
  <g transform="translate(302, 86)">
    <rect width="320" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text class="box-title" fill="#9a3412" x="16" y="24">2. 两类工程业务的延期倍率规律</text>

    <!-- Branch A: Hardware -->
    <g transform="translate(16, 40)">
      <rect width="288" height="130" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">A. 重资产物理硬件工程</text>
        <text class="card-body" x="0" y="16">典型案例：Model 3 产线地狱、Semi、Cybertruck</text>
        <text class="val-large" fill="#ea580c" x="0" y="42">2.0 ~ 2.4 倍</text>
        <text class="card-body" x="120" y="40">(中位数 2.3 倍)</text>
        <text class="card-body" x="0" y="60">• 虽大幅延期，但最终受物理规律驱动必定兑现</text>
        <text class="mono" fill="#c2410c" x="0" y="78">ACTION: 承诺 2 年交付，按 4.6 年核算</text>
      </g>
    </g>

    <!-- Branch B: Autonomy AI -->
    <g transform="translate(16, 186)">
      <rect width="288" height="130" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">B. 前沿算法与无监督自动驾驶</text>
        <text class="card-body" x="0" y="16">典型案例：全自动 FSD、百万无监督 Robotaxi</text>
        <text class="val-large" fill="#e11d48" x="0" y="42">&gt; 7.0 倍</text>
        <text class="card-body" x="85" y="40">(从 2017 年延宕至今)</text>
        <text class="card-body" x="0" y="60">• 长尾边缘场景（Edge Cases）阻力呈指数级</text>
        <text class="mono" fill="#be123c" x="0" y="78">ACTION: 绝不可采用马斯克乐观节奏</text>
      </g>
    </g>
  </g>

  <!-- Right: Base Case Calibration Rule -->
  <g transform="translate(646, 86)">
    <rect width="266" height="348" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text class="box-title" fill="#15803d" x="16" y="24">3. 2030 基准财务模型校准法则</text>

    <g transform="translate(16, 40)">
      <rect width="234" height="130" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">时间轴后置硬原则</text>
        <text class="card-body" x="0" y="16">• 口头承诺 2026~2027 年规模化落地事项</text>
        <text class="card-body" x="0" y="32">  (如 Cybercab 量产、Semi 万辆)</text>
        <text class="card-body" x="0" y="48">• 统一乘以 2.3 倍系数后置至 2030 年验收</text>
        <text class="mono" fill="#166534" x="0" y="70">RULE: 为估值模型构筑坚实安全垫</text>
      </g>
    </g>

    <g transform="translate(16, 186)">
      <rect width="234" height="130" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">Optimus 人形机器人清零</text>
        <text class="card-body" fill="#166534" x="0" y="16">• 尚无对外批量商业化出货数据</text>
        <text class="card-body" fill="#166534" x="0" y="32">• 基准情境给予 0 美元估值</text>
        <text class="card-body" fill="#166534" x="0" y="48">• 仅作为额外赠送的免费看涨期权</text>
        <text class="mono" fill="#15803d" x="0" y="70">RESULT: 杜绝概念炒作虚增市值</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 278 151 L 302 151" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="302,151 296,147 296,155" fill="#94a3b8"/>

  <path d="M 278 251 L 302 251" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="302,251 296,247 296,255" fill="#94a3b8"/>

  <path d="M 622 105 L 646 105" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="646,105 640,101 640,109" fill="#94a3b8"/>

  <path d="M 622 251 L 646 251" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="646,251 640,247 640,255" fill="#94a3b8"/>
</svg>