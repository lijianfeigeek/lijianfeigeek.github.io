<svg width="960" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="tx-arch-title tx-arch-desc">
  <title id="tx-arch-title">Tracexy 系统分层架构与本地安全信任边界</title>
  <desc id="tx-arch-desc">展示 Tracexy 从 CaptureFormat、特权捕获助手、无状态协议解码、五元组会话聚合到工作区项目隔离与本地 MCP/AI 智能体的全景架构。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .layer-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #991b1b; }
    .card-coral-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #b91c1c; }
    .card-blue-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #1e40af; }
    .card-blue-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #2563eb; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="960" height="600" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="560" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Tracexy 系统分层架构与本地安全信任边界</text>
    <text class="subtitle" x="0" y="20">从 macOS 内核 pktap/libpcap 特权抓包、零拷贝 PacketBuffer 解码，到会话归一化与本地 MCP/AI 智能体驱动</text>
  </g>

  <!-- Layer 4: Presentation &amp; Workspace (Top) -->
  <g transform="translate(48, 84)">
    <rect width="864" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第四层：原生交互、项目沙盒与自动化边界 (Workspace &amp; Project Isolation)</text>
    
    <g transform="translate(16, 32)">
      <!-- Card 4-1: Project Runtime State -->
      <g transform="translate(0, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">Project 沙盒隔离运行时</text>
        <text class="mono" fill="#475569" x="12" y="32">ProjectRuntimeState / SessionStore</text>
        <text class="card-body" x="12" y="44">独立 SQLite 历史库、过滤集与偏好设置</text>
      </g>
      <!-- Card 4-2: MCP &amp; Loopback Assistant (Coral Highlight) -->
      <g transform="translate(284, 0)">
        <rect width="276" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="card-coral-title" x="12" y="18">本地自动化与 AI 助手适配</text>
        <text class="mono" fill="#b91c1c" x="12" y="32">tracexy-mcp (stdio) / Loopback Assistant</text>
        <text class="card-coral-body" x="12" y="44">零网络监听、授权令牌防护、纯环回 Ollama</text>
      </g>
      <!-- Card 4-3: Native UI &amp; Coordinator -->
      <g transform="translate(576, 0)">
        <rect width="272" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">SwiftUI / AppKit 原生视图</text>
        <text class="mono" fill="#475569" x="12" y="32">MainContentCoordinator / FollowStream</text>
        <text class="card-body" x="12" y="44">按需 TCP 流重组、证据导引、十六进制检查</text>
      </g>
    </g>
  </g>

  <!-- Layer 3: Session &amp; Activity Correlation -->
  <g transform="translate(48, 196)">
    <rect width="864" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第三层：会话聚合与活动推理 (Session &amp; Activity Intelligence)</text>
    
    <g transform="translate(16, 32)">
      <!-- Card 3-1: FiveTuple Canonical Grouping -->
      <g transform="translate(0, 0)">
        <rect width="268" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="card-blue-title" x="12" y="18">FiveTuple 五元组双向归一化</text>
        <text class="mono" fill="#2563eb" x="12" y="32">Canonical Ordering (Endpoint A ↔ B)</text>
        <text class="card-blue-body" x="12" y="44">双向流量折叠合并，生成稳定会话 UUID</text>
      </g>
      <!-- Card 3-2: SessionBuilder -->
      <g transform="translate(284, 0)">
        <rect width="276" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">SessionBuilder 批量计算</text>
        <text class="mono" fill="#475569" x="12" y="32">SessionSummary / Lifecycle / Metrics</text>
        <text class="card-body" x="12" y="44">吞吐统计、握手往返延迟、生命周期推导</text>
      </g>
      <!-- Card 3-3: Activity &amp; Findings (Coral Highlight) -->
      <g transform="translate(576, 0)">
        <rect width="272" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="card-coral-title" x="12" y="18">ActivityBuilder 与证据链发现</text>
        <text class="mono" fill="#b91c1c" x="12" y="32">SessionFrameProvenance / Findings</text>
        <text class="card-coral-body" x="12" y="44">弱/强/因果三级置信度，强锚定帧序号证据</text>
      </g>
    </g>
  </g>

  <!-- Layer 2: Protocol Stateless Decoding -->
  <g transform="translate(48, 308)">
    <rect width="864" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第二层：无状态边界检查协议解码 (Bounds-Checked Protocol Decoding)</text>
    
    <g transform="translate(16, 32)">
      <!-- Card 2-1: Zero-Copy PacketBuffer -->
      <g transform="translate(0, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">PacketBuffer 零拷贝安全视图</text>
        <text class="mono" fill="#475569" x="12" y="32">Bounds-Checked Read / Swift Throw</text>
        <text class="card-body" x="12" y="44">畸形与越界包受控报错，杜绝内存崩溃</text>
      </g>
      <!-- Card 2-2: Stateless L2-L4 Decoder -->
      <g transform="translate(284, 0)">
        <rect width="276" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">PacketDecoder 单遍极速解析</text>
        <text class="mono" fill="#475569" x="12" y="32">Ethernet / IPv4 / IPv6 / TCP / UDP / SCTP</text>
        <text class="card-body" x="12" y="44">有界分片重组、GRE/VXLAN 隧道解包</text>
      </g>
      <!-- Card 2-3: Application Metadata -->
      <g transform="translate(576, 0)">
        <rect width="272" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">轻量应用层元数据提取</text>
        <text class="mono" fill="#475569" x="12" y="32">DNS / TLS SNI &amp; Cipher / HTTP1 / QUIC</text>
        <text class="card-body" x="12" y="44">仅提取首包与命名元数据，保持解析无状态</text>
      </g>
    </g>
  </g>

  <!-- Layer 1: Capture, Hardware &amp; System (Bottom) -->
  <g transform="translate(48, 420)">
    <rect width="864" height="136" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第一层：底层捕获、特权助手与 macOS 上下文感知 (Capture &amp; macOS Context)</text>
    
    <g transform="translate(16, 32)">
      <!-- Card 1-1: macOS pktap &amp; Process Attribution -->
      <g transform="translate(0, 0)">
        <rect width="268" height="90" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="card-blue-title" x="12" y="18">macOS pktap 进程深度溯源</text>
        <text class="mono" fill="#2563eb" x="12" y="32">Kernel pktap Metadata &amp; Socket Table</text>
        <text class="card-blue-body" x="12" y="48">硬件接口前置拦截，捕获真实 PID、</text>
        <text class="card-blue-body" x="12" y="64">进程名（如 Safari/curl）与有效 UID</text>
        <text class="card-blue-body" x="12" y="80">未识别进程严守未知状态，杜绝误报</text>
      </g>
      <!-- Card 1-2: Privileged Capture Helper -->
      <g transform="translate(284, 0)">
        <rect width="276" height="90" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">TracexyCaptureHelper 特权守护</text>
        <text class="mono" fill="#475569" x="12" y="32">SMJobBless / Launchd / Typed XPC API</text>
        <text class="card-body" x="12" y="48">仅暴露强类型捕获接口，严禁 Shell 越权</text>
        <text class="card-body" x="12" y="64">原生调用 libpcap，支持混杂模式与 BPF</text>
        <text class="card-body" x="12" y="80">网卡覆盖：Wi-Fi、以太网、雷雳、VPN、lo0</text>
      </g>
      <!-- Card 1-3: CaptureFormat IO -->
      <g transform="translate(576, 0)">
        <rect width="272" height="90" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="18">CaptureFormat 独立无依赖库</text>
        <text class="mono" fill="#475569" x="12" y="32">PCAP / PCAPNG Reader &amp; Writer</text>
        <text class="card-body" x="12" y="48">零 UI 依赖纯 Swift 实现，格式原生校验</text>
        <text class="card-body" x="12" y="64">同时编译入 Quick Look 与 Spotlight 扩展</text>
        <text class="card-body" x="12" y="80">Finder 空格键即秒级预览包体结构</text>
      </g>
    </g>
  </g>

</svg>
