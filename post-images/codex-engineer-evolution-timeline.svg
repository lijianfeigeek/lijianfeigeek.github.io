<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-engineer-evolution-timeline-title codex-engineer-evolution-timeline-desc" id="codex-engineer-evolution-timeline-root">
      <title id="codex-engineer-evolution-timeline-title">Codex 工程师进阶与工程能力演进四阶路线图</title>
      <desc id="codex-engineer-evolution-timeline-desc">从物理边界建立、执行控制强化、并发拓扑驾驭到长效系统化搭建的进阶四步法</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-engineer-evolution-timeline-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-engineer-evolution-timeline-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-engineer-evolution-timeline-root .mono { font-family: "Geist Mono", monospace; }
      #codex-engineer-evolution-timeline-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-engineer-evolution-timeline-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-engineer-evolution-timeline-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-engineer-evolution-timeline-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Horizontal Evolution Track -->
        <line x1="60" y1="50" x2="900" y2="50" stroke="#2d3142" stroke-width="2" stroke-opacity="0.15"/>

        <!-- Phase 1 -->
        <g transform="translate(40, 35)">
          <circle cx="20" cy="15" r="10" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
          <text x="20" y="19" font-size="11" font-weight="700" fill="#2d3142" text-anchor="middle">1</text>
          
          <g transform="translate(0, 35)">
            <rect x="0" y="0" width="200" height="200" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
            <rect x="0" y="0" width="200" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
            <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">PHASE 01: BOUNDARIES</text>
            <text x="12" y="50" font-size="14" font-weight="600" fill="#2d3142">建立物理边界</text>
            <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 选准工作区目录根节点</text>
            <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 控制读写沙盒权限等级</text>
            <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 养成看 Diff 逐行审查习惯</text>
            <text x="12" y="134" font-size="11" fill="#2d3142" fill-opacity="0.7">• 杜绝无脑 Accept All</text>
            <text x="12" y="170" font-size="11" font-weight="600" fill="#2d3142">目标：防代码被踩踏污染</text>
          </g>
        </g>

        <!-- Phase 2 -->
        <g transform="translate(265, 35)">
          <circle cx="20" cy="15" r="10" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
          <text x="20" y="19" font-size="11" font-weight="700" fill="#2d3142" text-anchor="middle">2</text>

          <g transform="translate(0, 35)">
            <rect x="0" y="0" width="200" height="200" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
            <rect x="0" y="0" width="200" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
            <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">PHASE 02: CONTROL</text>
            <text x="12" y="50" font-size="14" font-weight="600" fill="#2d3142">强化执行控制</text>
            <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 复杂任务先审 4 问 Plan</text>
            <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 强制要求提供单测验收命令</text>
            <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 善用 /review 交叉双重检查</text>
            <text x="12" y="134" font-size="11" fill="#2d3142" fill-opacity="0.7">• 针对性提供行级反馈批注</text>
            <text x="12" y="170" font-size="11" font-weight="600" fill="#2d3142">目标：提升首发交付确定性</text>
          </g>
        </g>

        <!-- Phase 3 -->
        <g transform="translate(490, 35)">
          <circle cx="20" cy="15" r="10" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
          <text x="20" y="19" font-size="11" font-weight="700" fill="#2d3142" text-anchor="middle">3</text>

          <g transform="translate(0, 35)">
            <rect x="0" y="0" width="200" height="200" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
            <rect x="0" y="0" width="200" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
            <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">PHASE 03: TOPOLOGY</text>
            <text x="12" y="50" font-size="14" font-weight="600" fill="#2d3142">驾驭并行拓扑</text>
            <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 熟练运用 Git Worktree 隔离</text>
            <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 多 Agent 分支并发协同开发</text>
            <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 建立会话 Handoff 回滚机制</text>
            <text x="12" y="134" font-size="11" fill="#2d3142" fill-opacity="0.7">• 保护主分支绝对纯净</text>
            <text x="12" y="170" font-size="11" font-weight="600" fill="#2d3142">目标：多任务并发效能翻倍</text>
          </g>
        </g>

        <!-- Phase 4 (Focal) -->
        <g transform="translate(715, 35)">
          <circle cx="20" cy="15" r="10" fill="#bf4520" stroke="#bf4520" stroke-width="2"/>
          <text x="20" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

          <g transform="translate(0, 35)">
            <rect x="0" y="0" width="205" height="200" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
            <rect x="0" y="0" width="205" height="26" rx="6" fill="#bf4520" fill-opacity="0.1"/>
            <text x="12" y="18" font-size="11" font-weight="600" fill="#bf4520" class="mono">PHASE 04: ECOSYSTEM (FOCAL)</text>
            <text x="12" y="50" font-size="14" font-weight="600" fill="#bf4520">搭建长效系统</text>
            <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 沉淀团队领域专属 Skill 手册</text>
            <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.8">• 接入业务系统专属 MCP 管道</text>
            <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.8">• 编排 Automation 无人巡检</text>
            <text x="12" y="134" font-size="11" fill="#2d3142" fill-opacity="0.8">• 形成自进化知识库与 SOP</text>
            <text x="12" y="170" font-size="11" font-weight="700" fill="#bf4520">目标：打造数字研发工程铁军</text>
          </g>
        </g>
      </g>
    </svg>
