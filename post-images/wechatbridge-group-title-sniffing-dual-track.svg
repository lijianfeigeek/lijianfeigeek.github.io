<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="wb-title-sniff wb-title-desc">
  <title id="wb-title-sniff">WeChatTitleReader 零侵入微信群名嗅探：AX 直读与 Vision 纯内存 OCR 双轨制</title>
  <desc id="wb-title-desc">详细展示优先直读 Accessibility 私有标识（0 权限 0 开销）与在异常场景下回退至 Apple Vision 端侧 OCR 纯内存销毁的双轨决策流。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">WeChatTitleReader 零侵入微信群名嗅探双轨制</text>
    <text class="subtitle" x="0" y="20">优先直读 Accessibility 私有标识（0 权限 0 开销），兜底回退至端侧 Vision 纯内存 OCR</text>
  </g>

  <!-- Left: Track 1 (AX Direct Read) -->
  <g transform="translate(48, 86)">
    <rect width="412" height="348" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text class="box-title" fill="#15803d" x="16" y="24">优先轨道：微信 AX 辅助功能标识直读 (无录屏权限 / 0ms 时延)</text>

    <!-- Substep 1 -->
    <g transform="translate(16, 44)">
      <rect width="380" height="74" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">遍历微信最前台窗口 AX 树</text>
        <text class="mono" fill="#15803d" x="0" y="16">kAXIdentifierAttribute 属性精准匹配</text>
        <text class="card-body" x="0" y="32">• current_chat_name_label (当前群聊/私聊名称)</text>
        <text class="card-body" x="0" y="48">• current_chat_count_label (群聊成员总人数)</text>
      </g>
    </g>

    <!-- Substep 2: Success -->
    <g transform="translate(16, 134)">
      <rect width="380" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(12, 18)">
        <text class="card-title" fill="#14532d" x="0" y="0">直接返回 GroupTitleParser.Title</text>
        <text class="card-body" fill="#166534" x="0" y="20">• 零性能开销，直接获取纯文本字符串与成员数字</text>
        <text class="card-body" fill="#166534" x="0" y="38">• 100% 避免申请敏感的“屏幕录制 (Screen Recording)”权限</text>
        <text class="mono" fill="#15803d" x="0" y="58">RESULT: 覆盖 95%+ 绝大多数标准微信桌面端</text>
      </g>
    </g>

    <!-- Decision Branch -->
    <g transform="translate(16, 240)">
      <rect width="380" height="80" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#334155" x="0" y="0">未命中分支 (旧版微信 / 特殊第三方主题)</text>
        <text class="card-body" x="0" y="18">若 AX 标识未暴露，则无缝切换至第二轨道兜底</text>
        <text class="mono" fill="#ea580c" x="0" y="36">FALLBACK -> 自动进入 Vision 纯内存 OCR 判定</text>
      </g>
    </g>
  </g>

  <!-- Right: Track 2 (Vision In-Memory OCR) -->
  <g transform="translate(500, 86)">
    <rect width="412" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text class="box-title" fill="#c2410c" x="16" y="24">兜底轨道：Apple Vision 框架纯内存 OCR (隐私绝对安全)</text>

    <!-- Substep 1 -->
    <g transform="translate(16, 44)">
      <rect width="380" height="74" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">屏幕录制权限判定与窄条裁剪</text>
        <text class="card-body" x="0" y="16">• 未授权权限：优雅降级回退至 TXT 发送人名单命名</text>
        <text class="mono" fill="#c2410c" x="0" y="32">CGWindowListCreateImage: 仅截取顶部 140pt 窄条</text>
        <text class="card-body" x="0" y="48">• 绝不抓取聊天正文、图片与多媒体敏感区域</text>
      </g>
    </g>

    <!-- Substep 2 -->
    <g transform="translate(16, 134)">
      <rect width="380" height="74" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">Apple Vision 端侧 NPU 文字识别</text>
        <text class="mono" fill="#ea580c" x="0" y="16">VNRecognizeTextRequest(recognitionLevel: .accurate)</text>
        <text class="card-body" x="0" y="32">• 端侧硬件神经引擎极速计算，无需云端 API 交互</text>
        <text class="card-body" x="0" y="48">• 支持高精度中英文混合与特殊群符号识别</text>
      </g>
    </g>

    <!-- Substep 3: Privacy Shield -->
    <g transform="translate(16, 224)">
      <rect width="380" height="96" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <g transform="translate(12, 18)">
        <text class="card-title" fill="#9a3412" x="0" y="0">瞬时内存销毁，绝不落盘 (Privacy Zero-Disk)</text>
        <text class="card-body" fill="#9a3412" x="0" y="18">• CGImage 仅以局部指针瞬时存在于内存作用域中</text>
        <text class="card-body" fill="#9a3412" x="0" y="36">• OCR 解析出群名后立即强制释放内存缓冲，严禁落盘</text>
        <text class="mono" fill="#c2410c" x="0" y="56">PRIVACY: 彻底切断任何截屏外泄与持久化隐患</text>
      </g>
    </g>
  </g>

  <!-- Connecting Arrow from Track 1 Fallback to Track 2 -->
  <path d="M 460 260 L 500 260" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="500,260 494,256 494,264" fill="#ea580c"/>
</svg>