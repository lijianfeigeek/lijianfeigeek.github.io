<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a16z-som2-vc-unicorn-power-law-polarization-title a16z-som2-vc-unicorn-power-law-polarization-desc">
  <title id="a16z-som2-vc-unicorn-power-law-polarization-title">一级创投资本的幂律极化：头部 10% 顶级独角兽 vs 尾部 90%</title>
  <desc id="a16z-som2-vc-unicorn-power-law-polarization-desc">展示资本向少数超级巨头极度集聚、长期留在私人市场与尾部通用软件面临流动性折价的两极分化态势</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #047857; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">一级创投资本的极端幂律极化：头部超级独角兽 vs 尾部流动性折价</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">非上市独角兽生态经历冰火两重天：“长期不上市 (Private-for-Longer)”使得散户更难捕获早期超额红利</text>

  <!-- Root -->
  <g transform="translate(360, 75)">
    <rect width="240" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="24" class="card-title" text-anchor="middle">全球一级市场创投资本</text>
  </g>

  <!-- Connectors -->
  <path d="M 420 113 L 420 135 L 250 135 L 250 155" stroke="#047857" stroke-width="2" fill="none"/>
  <path d="M 540 113 L 540 135 L 710 135 L 710 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Left: Top 10% (Focal Green) -->
  <g transform="translate(40, 155)">
    <rect width="420" height="165" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="420" height="32" rx="8" fill="#d1fae5"/>
    <text x="210" y="21" class="badge-ok" text-anchor="middle">头部 10% 顶级独角兽 (SpaceX / OpenAI / Stripe / Cursor)</text>
    <g transform="translate(20, 44)">
      <text x="0" y="14" class="card-title" fill="#047857">资本极度集聚：单笔融资百亿美元</text>
      <text x="0" y="30" class="text-sub">• 长期留在私人市场 (Private-for-Longer)，次级交易享 20%~50% 溢价</text>
      <text x="0" y="52" class="card-title">组织生物学颠覆：极少人数与极高人效</text>
      <text x="0" y="68" class="text-sub">• 数十人团队跨越 1 亿美元 ARR，人均创收突破商业史纪录</text>
      <text x="0" y="90" class="badge-ok">核心挑战：高昂算力开销 (Compute Burn) 侵蚀初期毛利率</text>
    </g>
  </g>

  <!-- Right: Bottom 90% (Focal Coral) -->
  <g transform="translate(500, 155)">
    <rect width="420" height="165" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="420" height="32" rx="8" fill="#ffedd5"/>
    <text x="210" y="21" class="badge-coral" text-anchor="middle">其余 90% 腰部与尾部创业公司</text>
    <g transform="translate(20, 44)">
      <text x="0" y="14" class="badge-coral">募资环境严寒：LP 出资极度谨慎</text>
      <text x="0" y="30" class="text-sub">• 缺乏独立自研模型或垂直护城河者遭遇资本断粮</text>
      <text x="0" y="52" class="card-title">流动性折价加剧 (Liquidity Discount)</text>
      <text x="0" y="68" class="text-sub">• 早期高估值通用软件在二级市场面临 50%~70% 折价甩卖</text>
      <text x="0" y="90" class="badge-coral">生存法则：放弃虚高估值幻觉，迅速转向自由现金流正向造血</text>
    </g>
  </g>
</svg>