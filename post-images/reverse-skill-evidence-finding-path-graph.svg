<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reverse-skill-evidence-finding-path-graph-title reverse-skill-evidence-finding-path-graph-desc">
  <title id="reverse-skill-evidence-finding-path-graph-title">Evidence → Finding → Path 证据图谱闭环</title>
  <desc id="reverse-skill-evidence-finding-path-graph-desc">展示不可变证据层、安全结论层与攻击利用链路层的严密绑定与 SHA-256 固化关系</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Evidence Layer (E-xxx) -->
  <g transform="translate(24, 20)">
    <rect width="280" height="300" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#ecfdf5"/>
    <path d="M0 26 h280 v8 h-280 z" fill="#ecfdf5"/>
    <text x="14" y="22" class="label-title" fill="#065f46">不可变底层证据 (Evidence)</text>

    <!-- E-001 -->
    <g transform="translate(12, 46)">
      <rect width="256" height="72" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#166534">E-001: smali 反编译代码片段</text>
      <text x="10" y="38" class="text-code" fill="#15803d">• source_type: decompiled_file</text>
      <text x="10" y="54" class="text-code" fill="#15803d">• content_hash: SHA-256 固化</text>
    </g>

    <!-- E-002 -->
    <g transform="translate(12, 128)">
      <rect width="256" height="76" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#166534">E-002: Frida Hook 动态密钥</text>
      <text x="10" y="38" class="text-code" fill="#15803d">• repro: frida -U -f ... -s hook.js</text>
      <text x="10" y="54" class="text-code" fill="#15803d">• 内存 Hex Dump 抓取快照</text>
    </g>

    <!-- E-003 -->
    <g transform="translate(12, 214)">
      <rect width="256" height="72" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#166534">E-003: HTTP 200 重放响应包</text>
      <text x="10" y="38" class="text-code" fill="#15803d">• source_type: network_pcap</text>
      <text x="10" y="54" class="text-code" fill="#15803d">• 离线原始网络载荷快照</text>
    </g>
  </g>

  <!-- Connectors from Evidence to Findings -->
  <path d="M 304 82 L 350 100" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="348,96 354,100 349,104" fill="#10b981"/>

  <path d="M 304 166 L 350 120" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="348,116 354,120 349,124" fill="#10b981"/>

  <path d="M 304 250 L 350 240" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="348,236 354,240 348,243" fill="#3b82f6"/>

  <!-- Center: Finding Layer (F-xxx) (Coral Accent) -->
  <g transform="translate(354, 20)">
    <rect width="280" height="300" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#fff7ed"/>
    <path d="M0 26 h280 v8 h-280 z" fill="#fff7ed"/>
    <text x="14" y="22" class="label-title" fill="#9a3412">安全结论层 (Findings: 必须绑证据)</text>

    <!-- F-001 -->
    <g transform="translate(12, 50)">
      <rect width="256" height="110" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#9a3412">F-001: 客户端硬编码 AES 密钥</text>
      <text x="10" y="38" class="text-code" fill="#7c2d12">• severity: high | status: validated</text>
      <text x="10" y="56" class="text-code" fill="#7c2d12">• confidence: high (禁 low)</text>
      <text x="10" y="74" class="text-code" font-weight="600" fill="#bf4520">• 绑定证据: [E-001, E-002]</text>
      <text x="10" y="92" class="text-code" fill="#9a3412">• review_case 强制校验非空</text>
    </g>

    <!-- F-002 -->
    <g transform="translate(12, 175)">
      <rect width="256" height="110" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#1e40af">F-002: API 接口未校验签名越权</text>
      <text x="10" y="38" class="text-code" fill="#1d4ed8">• severity: critical | validated</text>
      <text x="10" y="56" class="text-code" fill="#1d4ed8">• confidence: high</text>
      <text x="10" y="74" class="text-code" font-weight="600" fill="#2563eb">• 绑定证据: [E-003]</text>
      <text x="10" y="92" class="text-code" fill="#1e40af">• 支持重放验证脚本验证</text>
    </g>
  </g>

  <!-- Connectors from Findings to Path -->
  <path d="M 634 105 L 680 140" fill="none" stroke="#9a3412" stroke-width="1.5"/>
  <polygon points="678,136 684,140 679,144" fill="#9a3412"/>

  <path d="M 634 230 L 680 190" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="678,186 684,190 679,194" fill="#2563eb"/>

  <!-- Right: Path Layer (P-xxx) -->
  <g transform="translate(684, 20)">
    <rect width="252" height="300" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
    <rect x="0" y="0" width="252" height="34" rx="8" fill="#eef2ff"/>
    <path d="M0 26 h252 v8 h-252 z" fill="#eef2ff"/>
    <text x="14" y="22" class="label-title" fill="#3730a3">利用链路层 (Attack Path)</text>

    <!-- P-001 Card -->
    <g transform="translate(12, 46)">
      <rect width="228" height="240" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="22" class="label-title" font-size="12" fill="#5b21b6">P-001: 完整越权篡改利用链</text>
      <line x1="10" y1="34" x2="218" y2="34" stroke="#e9d5ff" stroke-width="1"/>
      
      <text x="10" y="56" class="text-code" font-weight="600" fill="#6d28d9">Step 1: 静态逆向定位</text>
      <text x="10" y="74" class="text-code" fill="#5b21b6">反编译提取原生函数 (E-001)</text>

      <text x="10" y="106" class="text-code" font-weight="600" fill="#6d28d9">Step 2: 动态内存脱敏</text>
      <text x="10" y="124" class="text-code" fill="#5b21b6">Hook 获取加签盐值 (E-002)</text>

      <text x="10" y="156" class="text-code" font-weight="600" fill="#6d28d9">Step 3: 越权请求重放</text>
      <text x="10" y="174" class="text-code" fill="#5b21b6">构造合法签名下发 (E-003)</text>

      <g transform="translate(10, 192)">
        <rect width="208" height="36" rx="4" fill="#ede9fe"/>
        <text x="8" y="22" class="text-code" font-weight="600" fill="#4c1d95">100% 可防御与可复现</text>
      </g>
    </g>
  </g>
</svg>