<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-task-lifecycle-state-machine-title kandev-task-lifecycle-state-machine-desc" id="kandev-task-lifecycle-state-machine-root">
      <title id="kandev-task-lifecycle-state-machine-title">Kandev 任务看板全生命周期状态机与质量门禁</title>
      <desc id="kandev-task-lifecycle-state-machine-desc">从需求提出、方案探查、编码实施、独立 Diff 审查、黑盒 QA 到 Pull Request 的严格流转门禁</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-task-lifecycle-state-machine-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-task-lifecycle-state-machine-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-task-lifecycle-state-machine-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-task-lifecycle-state-machine-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-task-lifecycle-state-machine-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-task-lifecycle-state-machine-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-task-lifecycle-state-machine-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- State 1: Todo -->
        <g transform="translate(20, 50)">
          <rect x="0" y="0" width="115" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="115" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">COL 01: TODO</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">特性需求</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 提出开发需求</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 指定验收指标</text>
        </g>

        <!-- State 2: Spec -->
        <g transform="translate(155, 50)">
          <rect x="0" y="0" width="115" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="115" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">COL 02: SPEC</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">方案探查</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 深度探查方案</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 产出 4 问计划</text>
        </g>

        <!-- State 3: Work -->
        <g transform="translate(290, 50)">
          <rect x="0" y="0" width="115" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="115" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">COL 03: WORK</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">TDD 编码</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 红绿闭环编码</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 原子代码写入</text>
        </g>

        <!-- State 4: Review (Focal) -->
        <g transform="translate(425, 50)">
          <rect x="0" y="0" width="125" height="110" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="125" height="24" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="8" y="16" font-size="10" font-weight="700" fill="#bf4520" class="mono">COL 04: REVIEW</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#bf4520">Diff 审计 (核心)</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.8">• 独立 Agent 审计</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.8">• 人类行级批注</text>
        </g>

        <!-- State 5: QA -->
        <g transform="translate(570, 50)">
          <rect x="0" y="0" width="115" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="115" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">COL 05: QA</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">黑盒验证</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 端到端破界验证</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 边界条件压力</text>
        </g>

        <!-- State 6: PR -->
        <g transform="translate(705, 50)">
          <rect x="0" y="0" width="115" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="115" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">COL 06: PR</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">创建 Pull Request</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 挂载标准化模板</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 提交 Draft PR</text>
        </g>

        <!-- State 7: CI Fixup -->
        <g transform="translate(840, 50)">
          <rect x="0" y="0" width="100" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="100" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">COL 07: MERGE</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">CI 合入</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 远端 CI 跑通</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• Squash 合入</text>
        </g>

        <!-- Flow Connectors -->
        <path d="M 135 105 L 155 105" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-default)" opacity="0.6"/>
        <path d="M 270 105 L 290 105" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-default)" opacity="0.6"/>
        <path d="M 405 105 L 425 105" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-accent)"/>
        <path d="M 550 105 L 570 105" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-accent)"/>
        <path d="M 685 105 L 705 105" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-default)" opacity="0.6"/>
        <path d="M 820 105 L 840 105" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-link)"/>

        <!-- Rejection / Gating Loops -->
        <path d="M 485 160 L 485 200 Q 485 210 475 210 L 350 210 Q 340 210 340 200 L 340 160" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-accent)"/>
        <g transform="translate(370, 198)">
          <rect x="0" y="0" width="85" height="20" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
          <text x="8" y="14" font-size="10" font-weight="600" fill="#bf4520">审计驳回返修</text>
        </g>

        <path d="M 625 160 L 625 240 Q 625 250 615 250 L 330 250 Q 320 250 320 240 L 320 160" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#kandev-task-lifecycle-state-machine-arrow-default)" opacity="0.6"/>
        <g transform="translate(435, 238)">
          <rect x="0" y="0" width="85" height="20" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.3"/>
          <text x="8" y="14" font-size="10" font-weight="600" fill="#2d3142">QA 失败退回</text>
        </g>
      </g>
    </svg>
