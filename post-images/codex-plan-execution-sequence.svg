<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-plan-execution-sequence-title codex-plan-execution-sequence-desc" id="codex-plan-execution-sequence-root">
      <title id="codex-plan-execution-sequence-title">工程师与 Codex 复杂任务“四问计划”交互时序</title>
      <desc id="codex-plan-execution-sequence-desc">通过 /plan 模式进行代码拓扑探查、输出四问计划、人工决策审批与原子执行验证的时序流</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-plan-execution-sequence-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-plan-execution-sequence-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-plan-execution-sequence-root .mono { font-family: "Geist Mono", monospace; }
      #codex-plan-execution-sequence-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-plan-execution-sequence-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-plan-execution-sequence-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-plan-execution-sequence-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Lifeline 1: Dev -->
        <g transform="translate(140, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">工程师 (Developer)</text>
          <line x1="70" y1="36" x2="70" y2="360" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <!-- Lifeline 2: Agent (Focal) -->
        <g transform="translate(410, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="70" y="22" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle">Codex 智能体</text>
          <line x1="70" y1="36" x2="70" y2="360" stroke="#bf4520" stroke-dasharray="4 4" opacity="0.4"/>
        </g>

        <!-- Lifeline 3: FS / Git -->
        <g transform="translate(680, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">文件系统 / Git 沙盒</text>
          <line x1="70" y1="36" x2="70" y2="360" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <!-- Step 1: Dev -> Agent: /plan request -->
        <path d="M 210 95 L 480 95" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-plan-execution-sequence-arrow-default)"/>
        <g transform="translate(230, 78)">
          <rect x="0" y="0" width="230" height="20" rx="3" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="8" y="14" font-size="11" fill="#2d3142">1. 提出跨模块需求 (显式开启 /plan)</text>
        </g>

        <!-- Step 2: Agent -> Agent: Topo inspect -->
        <path d="M 480 120 L 520 120 L 520 145 L 480 145" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#codex-plan-execution-sequence-arrow-accent)"/>
        <g transform="translate(530, 125)">
          <text x="0" y="12" font-size="11" font-weight="500" fill="#bf4520">2. 检索代码调用拓扑与关联配置</text>
        </g>

        <!-- Step 3: Agent -> Dev: 4 Questions Plan -->
        <path d="M 480 175 L 210 175" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#codex-plan-execution-sequence-arrow-accent)"/>
        <g transform="translate(230, 155)">
          <rect x="0" y="0" width="230" height="24" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.05"/>
          <text x="8" y="16" font-size="11" font-weight="600" fill="#bf4520">3. 输出四问计划 (根因/文件/改动/验收)</text>
        </g>

        <!-- Step 4: Dev -> Agent: Review &amp; Approve -->
        <path d="M 210 220 L 480 220" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-plan-execution-sequence-arrow-default)"/>
        <g transform="translate(230, 203)">
          <rect x="0" y="0" width="230" height="20" rx="3" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="8" y="14" font-size="11" fill="#2d3142">4. 计划审查：批注纠偏或直接批准</text>
        </g>

        <!-- Step 5: Agent -> FS: Atomic write -->
        <path d="M 480 260 L 750 260" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-plan-execution-sequence-arrow-default)"/>
        <g transform="translate(500, 243)">
          <rect x="0" y="0" width="230" height="20" rx="3" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="8" y="14" font-size="11" fill="#2d3142">5. 原子级写入代码并调用构建命令</text>
        </g>

        <!-- Step 6: FS -> Agent: Verify result -->
        <path d="M 750 300 L 480 300" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#codex-plan-execution-sequence-arrow-link)"/>
        <g transform="translate(500, 283)">
          <rect x="0" y="0" width="230" height="20" rx="3" fill="#ffffff" stroke="#2e5aa8" stroke-opacity="0.2"/>
          <text x="8" y="14" font-size="11" font-weight="600" fill="#2e5aa8">6. 编译通过，自动化单测全绿</text>
        </g>

        <!-- Step 7: Agent -> Dev: Summary -->
        <path d="M 480 345 L 210 345" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-plan-execution-sequence-arrow-default)"/>
        <g transform="translate(230, 328)">
          <rect x="0" y="0" width="230" height="20" rx="3" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="8" y="14" font-size="11" font-weight="600" fill="#2d3142">7. 交付完整执行摘要与 Diff 审查清单</text>
        </g>
      </g>
    </svg>
