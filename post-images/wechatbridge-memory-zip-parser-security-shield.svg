<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="wb-zip-title wb-zip-desc">
  <title id="wb-zip-title">WeChatNativeArchive 纯内存防御型 ZIP 解析引擎与安全护栏</title>
  <desc id="wb-zip-desc">展示基于 Swift 与 zlib 实现的纯内存 ZIP 二进制解析、多层安全护栏与 POSIX 级别防竞争原子写入机制。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">WeChatNativeArchive 纯内存防御型 ZIP 解析引擎</text>
    <text class="subtitle" x="0" y="20">拒绝系统 /usr/bin/unzip 命令行注入，端侧手写二进制逆向扫描与三层安全防御护栏</text>
  </g>

  <!-- Step 1: Memory Stream Scanning -->
  <g transform="translate(48, 86)">
    <rect width="260" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="16" y="24">1. 纯内存二进制扫描</text>

    <g transform="translate(16, 44)">
      <rect width="228" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">定位 EOCD 核心结束符</text>
        <text class="mono" fill="#2563eb" x="0" y="16">Magic: 0x06054b50</text>
        <text class="card-body" x="0" y="32">从文件末向后回溯 22~65,557 字节</text>
        <text class="card-body" x="0" y="48">严密防范假冒 Central Directory</text>
      </g>
    </g>

    <g transform="translate(16, 138)">
      <rect width="228" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">解析 Central Directory</text>
        <text class="mono" fill="#2563eb" x="0" y="16">Magic: 0x02014b50</text>
        <text class="card-body" x="0" y="32">遍历文件头条目、压缩方式与偏移</text>
        <text class="card-body" x="0" y="48">仅支持 Store (0) 与 Deflate (8)</text>
      </g>
    </g>

    <g transform="translate(16, 232)">
      <rect width="228" height="88" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">zlib 原生流式解压</text>
        <text class="mono" fill="#1e40af" x="0" y="16">inflateInit2 / raw DEFLATE</text>
        <text class="card-body" x="0" y="32">windowBits = -MAX_WBITS</text>
        <text class="card-body" x="0" y="48">零外部子进程，零 CPU 瞬时颠簸</text>
      </g>
    </g>
  </g>

  <!-- Step 2: Three Security Shields -->
  <g transform="translate(332, 86)">
    <rect width="320" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text class="box-title" fill="#9a3412" x="16" y="24">2. 安全加固护栏矩阵 (Security Shield)</text>

    <!-- Shield 1 -->
    <g transform="translate(16, 44)">
      <rect width="288" height="80" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">Zip-Slip 路径逃逸绝对拒止</text>
        <text class="card-body" x="0" y="16">检查每一个 entry.name：严禁包含 '..'、'/' 开头</text>
        <text class="card-body" x="0" y="32">禁止 '' 反斜杠、':' 冒号以及所有控制字符</text>
        <text class="mono" fill="#ea580c" x="0" y="48">RULE: 杜绝任意覆盖宿主用户敏感文件</text>
      </g>
    </g>

    <!-- Shield 2 -->
    <g transform="translate(16, 138)">
      <rect width="288" height="80" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">APFS Unicode 规范化防欺骗</text>
        <text class="mono" fill="#475569" x="0" y="16">precomposedStringWithCanonicalMapping</text>
        <text class="card-body" x="0" y="32">维护全路径大小写不敏感哈希表，防同名覆盖</text>
        <text class="mono" fill="#ea580c" x="0" y="48">RULE: 阻断恶意构造变音符号欺骗文件系统</text>
      </g>
    </g>

    <!-- Shield 3 -->
    <g transform="translate(16, 232)">
      <rect width="288" height="88" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">解压配额硬限 (防 Zip Bomb)</text>
        <text class="card-body" x="0" y="16">• 单纯文本条目上限：&lt;= 16MB</text>
        <text class="card-body" x="0" y="32">• 单个富媒体附件上限：&lt;= 256MB</text>
        <text class="card-body" x="0" y="48">• 整个归档总解压体积上限：&lt;= 1GB</text>
        <text class="mono" fill="#ea580c" x="0" y="64">RULE: 彻底防御内存耗尽与磁盘塞满攻击</text>
      </g>
    </g>
  </g>

  <!-- Step 3: POSIX Secure Storage -->
  <g transform="translate(676, 86)">
    <rect width="236" height="348" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text class="box-title" fill="#166534" x="16" y="24">3. POSIX 底层防竞争写入</text>

    <g transform="translate(16, 44)">
      <rect width="204" height="136" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">Darwin.open 系统调用标志</text>
        <text class="mono" fill="#166534" x="0" y="18">O_WRONLY | O_CREAT</text>
        <text class="mono" fill="#166534" x="0" y="32">O_EXCL | O_NOFOLLOW</text>
        <text class="mono" fill="#166534" x="0" y="46">O_CLOEXEC</text>
        <text class="card-body" x="0" y="66">• O_EXCL: 若存在直接报错</text>
        <text class="card-body" x="0" y="82">• O_NOFOLLOW: 拒绝软链接</text>
        <text class="card-body" x="0" y="98">• 防御 TOCTOU 时间差攻击</text>
      </g>
    </g>

    <g transform="translate(16, 194)">
      <rect width="204" height="126" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
      <g transform="translate(12, 18)">
        <text class="card-title" fill="#15803d" x="0" y="0">权限位限制：0o600</text>
        <text class="mono" fill="#15803d" x="0" y="20">S_IRUSR | S_IWUSR</text>
        <text class="card-body" x="0" y="40">• 仅当前用户拥有读写权限</text>
        <text class="card-body" x="0" y="58">• 杜绝同机其他非特权用户嗅探</text>
        <text class="card-body" x="0" y="76">• 完全符合 macOS 企业安全基线</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 308 260 L 332 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="332,260 326,256 326,264" fill="#94a3b8"/>

  <path d="M 652 260 L 676 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="676,260 670,256 670,264" fill="#94a3b8"/>
</svg>