<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ks-seq-title ks-seq-desc" id="diagram3-root">
      <title id="ks-seq-title">Kitesurf WebMCP 工具调用与 KSC0 矢量场景流式回放时序</title>
      <desc id="ks-seq-desc">展示智能体或终端客户端如何通过引擎 Worker 调用页面 WebMCP 声明式与编程式工具，以及 PageRenderer 如何通过 RenderPort 拉取 KSC0 矢量流并在反作弊确认流控下按需合成图像。</desc>
      <defs>
      <style>#diagram3-root { font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #0f172a; }
      #diagram3-root .diagram-container { width: 100%; overflow-x: auto; }</style>
        <pattern id="diagram3-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
        </pattern>
        <marker id="diagram3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
        </marker>
        <marker id="diagram3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="diagram3-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
        </marker>
        <marker id="diagram3-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#475569" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="1000" height="580" fill="#f8fafc"/>
      <rect width="1000" height="580" fill="url(#diagram3-dots)" opacity="0.6"/>

      <!-- Header -->
      <text x="32" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">SEQUENCE · WEBMCP AGENT PROTOCOL · KSC0 VECTOR STREAMING</text>
      <text x="32" y="64" fill="#0f172a" font-size="22" font-weight="600">WebMCP 结构化工具发现与 KSC0 (v16) 矢量按需渲染时序</text>

      <!-- Lifelines (drawn before frames and boxes): centers at 128, 356, 588, 820 -->
      <line x1="128" y1="140" x2="128" y2="528" stroke="#0f172a" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="356" y1="140" x2="356" y2="528" stroke="#0f172a" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="588" y1="140" x2="588" y2="528" stroke="#0f172a" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="820" y1="140" x2="820" y2="528" stroke="#0f172a" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

      <!-- ALT Combined Fragment Frame -->
      <rect x="64" y="156" width="880" height="356" rx="4" fill="#0f172a" stroke="#0f172a" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
      <rect x="64" y="156" width="44" height="18" rx="2" fill="#f8fafc" stroke="#0f172a" stroke-width="1" stroke-opacity="0.22"/>
      <text x="86" y="168" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">ALT</text>

      <!-- Region 1 Guard -->
      <text x="120" y="172" fill="#bf4520" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">[路径一：零像素 WebMCP 智能体交互]</text>

      <!-- Divider between ALT regions -->
      <line x1="72" y1="308" x2="936" y2="308" stroke="#0f172a" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
      <text x="120" y="328" fill="#0284c7" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">[路径二：按需像素截图 / KSC0 终端矢量流]</text>

      <!-- Activation Bars -->
      <rect x="352" y="188" width="8" height="116" fill="#0f172a" stroke="#475569" stroke-width="0.8" fill-opacity="0.06"/>
      <rect x="584" y="200" width="8" height="88" fill="#bf4520" stroke="#bf4520" stroke-width="0.8" fill-opacity="0.10"/>
      <rect x="352" y="348" width="8" height="148" fill="#0f172a" stroke="#475569" stroke-width="0.8" fill-opacity="0.06"/>
      <rect x="816" y="364" width="8" height="112" fill="#0284c7" stroke="#0284c7" stroke-width="0.8" fill-opacity="0.10"/>
      <rect x="584" y="388" width="8" height="36" fill="#0f172a" stroke="#475569" stroke-width="0.8" fill-opacity="0.06"/>

      <!-- Messages: Region 1 (WebMCP) -->
      <!-- 1. PageScript -> Engine (async toolsAdded) -->
      <line x1="584" y1="204" x2="360" y2="204" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#diagram3-arrow-open)"/>
      <rect x="380" y="180" width="184" height="16" rx="2" fill="#f8fafc"/>
      <text x="472" y="192" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">toolsAdded (registerTool / form)</text>

      <!-- 2. Engine -> Agent (WebMCP.toolsAdded) -->
      <line x1="352" y1="224" x2="128" y2="224" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#diagram3-arrow-open)"/>
      <rect x="164" y="200" width="152" height="16" rx="2" fill="#f8fafc"/>
      <text x="240" y="212" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WebMCP.toolsAdded</text>

      <!-- 3. Agent -> Engine (WebMCP.invokeTool) -->
      <line x1="128" y1="248" x2="352" y2="248" stroke="#0284c7" stroke-width="1.3" marker-end="url(#diagram3-arrow-link)"/>
      <rect x="168" y="228" width="144" height="14" rx="2" fill="#f8fafc"/>
      <text x="240" y="238" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WebMCP.invokeTool</text>

      <!-- 4. Engine -> PageScript (executeTool + AbortSignal) -->
      <line x1="360" y1="260" x2="584" y2="260" stroke="#0284c7" stroke-width="1.3" marker-end="url(#diagram3-arrow-link)"/>
      <rect x="388" y="236" width="168" height="16" rx="2" fill="#f8fafc"/>
      <text x="472" y="248" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">exec(args, AbortSignal)</text>

      <!-- 5. PageScript -> Engine (JSON Result) -->
      <line x1="584" y1="284" x2="360" y2="284" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#diagram3-arrow)"/>
      <rect x="396" y="264" width="152" height="14" rx="2" fill="#f8fafc"/>
      <text x="472" y="274" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JSON result / cancel</text>

      <!-- 6. Engine -> Agent (Headline Accent) -->
      <line x1="352" y1="296" x2="128" y2="296" stroke="#bf4520" stroke-width="1.5" marker-end="url(#diagram3-arrow-accent)"/>
      <rect x="152" y="272" width="176" height="16" rx="2" fill="#f8fafc"/>
      <text x="240" y="284" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WebMCP.toolInvoked (JSON)</text>

      <!-- Messages: Region 2 (KSC0 + RBI) -->
      <!-- 7. Agent -> Engine (captureScreenshot / startSceneStream) -->
      <line x1="128" y1="356" x2="352" y2="356" stroke="#0284c7" stroke-width="1.3" marker-end="url(#diagram3-arrow-link)"/>
      <rect x="156" y="332" width="168" height="16" rx="2" fill="#f8fafc"/>
      <text x="240" y="344" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">screenshot / startSceneStream</text>

      <!-- 8. Engine -> PageRenderer (renderFrame(RenderPort)) -->
      <line x1="360" y1="372" x2="816" y2="372" stroke="#0284c7" stroke-width="1.3" marker-end="url(#diagram3-arrow-link)"/>
      <rect x="504" y="348" width="168" height="16" rx="2" fill="#f8fafc"/>
      <text x="588" y="360" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">renderFrame(RenderPort)</text>

      <!-- 9. PageRenderer -> PageScript (pull KSC0 v16 stream) -->
      <line x1="816" y1="396" x2="592" y2="396" stroke="#475569" stroke-width="1.2" marker-end="url(#diagram3-arrow)"/>
      <rect x="616" y="374" width="176" height="16" rx="2" fill="#f8fafc"/>
      <text x="704" y="386" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">拉取 KSC0 (Q3 + TAG_PART)</text>

      <!-- 10. PageScript -> PageRenderer (return KSC0 + missing hashes) -->
      <line x1="592" y1="420" x2="816" y2="420" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#diagram3-arrow)"/>
      <rect x="620" y="400" width="168" height="14" rx="2" fill="#f8fafc"/>
      <text x="704" y="410" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">KSC0 字节流 + 缺失字体/图</text>

      <!-- 11. PageRenderer -> Engine (callback fetchStoredFont/Image) -->
      <line x1="816" y1="444" x2="360" y2="444" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#diagram3-arrow)"/>
      <rect x="500" y="424" width="176" height="14" rx="2" fill="#f8fafc"/>
      <text x="588" y="434" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MSG_RESOURCES (最多 2 轮)</text>

      <!-- 12. PageRenderer -> Engine (PNG / PDF / KSC0) -->
      <line x1="816" y1="472" x2="360" y2="472" stroke="#059669" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#diagram3-arrow)"/>
      <rect x="488" y="450" width="200" height="16" rx="2" fill="#f8fafc"/>
      <text x="588" y="462" fill="#059669" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">vello_cpu PNG / Krilla PDF</text>

      <!-- 13. Engine -> Agent (CDP response / sceneFrame + claimSceneAck) -->
      <line x1="352" y1="492" x2="128" y2="492" stroke="#059669" stroke-width="1.4" marker-end="url(#diagram3-arrow)"/>
      <rect x="148" y="468" width="184" height="16" rx="2" fill="#f8fafc"/>
      <text x="240" y="480" fill="#059669" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sceneFrame + claimSceneAck</text>

      <!-- Actor Boxes (top, drawn after lifelines) -->
      <g transform="translate(48, 88)">
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
        <text x="80" y="22" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Agent / CLI</text>
        <text x="80" y="39" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Puppeteer · wasmtime</text>
      </g>

      <g transform="translate(276, 88)">
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="80" y="22" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Engine Worker</text>
        <text x="80" y="39" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CDP · ResourceStore</text>
      </g>

      <g transform="translate(508, 88)">
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="80" y="22" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">PageScript</text>
        <text x="80" y="39" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">core_bg.wasm · DOM</text>
      </g>

      <g transform="translate(740, 88)">
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#f8fafc"/>
        <rect x="0" y="0" width="160" height="52" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
        <text x="80" y="22" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">PageRenderer</text>
        <text x="80" y="39" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">vello_cpu · Krilla</text>
      </g>

      <!-- Bottom Legend -->
      <line x1="32" y1="536" x2="968" y2="536" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="32" y1="556" x2="64" y2="556" stroke="#bf4520" stroke-width="1.5"/>
      <text x="72" y="560" fill="#475569" font-size="10">主链路高价值语义响应（WebMCP 直连返回）</text>
      <line x1="360" y1="556" x2="392" y2="556" stroke="#0284c7" stroke-width="1.3"/>
      <text x="400" y="560" fill="#475569" font-size="10">CDP / JSRPC 同步调用</text>
      <line x1="592" y1="556" x2="624" y2="556" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="632" y="560" fill="#475569" font-size="10">异步事件通知 / 按需资源回传</text>
    </svg>
