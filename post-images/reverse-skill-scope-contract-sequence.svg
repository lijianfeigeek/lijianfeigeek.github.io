<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reverse-skill-scope-contract-sequence-title reverse-skill-scope-contract-sequence-desc">
  <title id="reverse-skill-scope-contract-sequence-title">Scope 契约硬门禁安全拦截与放行时序图</title>
  <desc id="reverse-skill-scope-contract-sequence-desc">展示未经授权时 case-guard 强制阻断与获得书面凭据后放行 ACT 的交互时序</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 4 Actor Columns: X = 120, 360, 600, 840 -->
  <!-- Lifelines -->
  <line x1="120" y1="56" x2="120" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="360" y1="56" x2="360" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="600" y1="56" x2="600" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="840" y1="56" x2="840" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Actor Badges -->
  <g transform="translate(45, 16)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor">安全研究员 (Operator)</text>
  </g>

  <g transform="translate(285, 16)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor">AI Coding Agent</text>
  </g>

  <g transform="translate(525, 16)">
    <rect width="150" height="40" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor" fill="#9a3412">case-guard 守卫门禁</text>
  </g>

  <g transform="translate(765, 16)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor">目标资产 (Target)</text>
  </g>

  <!-- Step 1: User command -->
  <path d="M 120 80 L 360 80" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="354,77 360,80 354,83" fill="#4b5563"/>
  <text x="240" y="74" text-anchor="middle" class="text-code">1. 下发渗透指令 ("测试目标接口越权缺陷")</text>

  <!-- Step 2: Agent initializes case -->
  <path d="M 360 106 L 410 106 L 410 126 L 360 126" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="366,123 360,126 366,129" fill="#6b7280"/>
  <text x="420" y="120" class="text-code">2. case-init 初始化: scope.md (auth=pending)</text>

  <!-- Step 3: Red Zone - Guard Blocks unauthorized action -->
  <g transform="translate(270, 140)">
    <rect width="420" height="74" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <path d="M 90 24 L 330 24" fill="none" stroke="#e11d48" stroke-width="1.5"/>
    <polygon points="324,21 330,24 324,27" fill="#e11d48"/>
    <text x="210" y="18" text-anchor="middle" class="text-code" fill="#9f1239">3. 试图执行主动网络发包 / 探测</text>

    <path d="M 330 50 L 90 50" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="96,47 90,50 96,53" fill="#e11d48"/>
    <text x="210" y="44" text-anchor="middle" class="text-code" font-weight="600" fill="#be123c">[Exit 2 拦截] auth.status!=granted 严禁发包！</text>
  </g>

  <!-- Step 4: Operator grants scope -->
  <path d="M 120 240 L 360 240" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="354,237 360,240 354,243" fill="#10b981"/>
  <text x="240" y="234" text-anchor="middle" class="text-code" fill="#047857">4. 录入书面授权凭据，更新 scope: auth.status=granted</text>

  <!-- Step 5: Green Zone - Guard Passes -->
  <g transform="translate(270, 260)">
    <rect width="600" height="78" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <path d="M 90 24 L 330 24" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="324,21 330,24 324,27" fill="#10b981"/>
    <text x="210" y="18" text-anchor="middle" class="text-code" fill="#047857">5. 再次向 Guard 提交安全审查</text>

    <path d="M 330 46 L 90 46" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="96,43 90,46 96,49" fill="#10b981"/>
    <text x="210" y="40" text-anchor="middle" class="text-code" font-weight="600" fill="#065f46">[Pass] 校验通过！准许进入 ACT 阶段</text>

    <!-- Step 6: Probe Target -->
    <path d="M 90 66 L 570 66" fill="none" stroke="#059669" stroke-width="1.5"/>
    <polygon points="564,63 570,66 564,69" fill="#059669"/>
    <text x="330" y="60" text-anchor="middle" class="text-code" fill="#065f46">6. 在受限白名单资产内执行受控探测</text>
  </g>
</svg>