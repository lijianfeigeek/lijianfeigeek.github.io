<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="wb-comp-title wb-comp-desc">
  <title id="wb-comp-title">微信数据提取范式对比：传统侵入式方案 vs WeChatBridge 原生官方扩展方案</title>
  <desc id="wb-comp-desc">对比展示传统内存 Hook / 数据库破解高危路径与 WeChatBridge 基于 macOS 官方 Share Extension 的零侵入合规数据摆渡路径。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .card-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">微信数据提取范式对比：侵入破解 vs. 原生扩展</text>
    <text class="subtitle" x="0" y="20">从高危封号的内存 Hook 逆向，跃迁至基于 macOS 官方 Share Extension 的零侵入合规摆渡</text>
  </g>

  <!-- Left Column: Traditional Invasive Approach -->
  <g transform="translate(48, 88)">
    <rect width="412" height="348" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#be123c" x="0" y="14">传统侵入式方案 (高危 / 易失效 / 极高风险)</text>
    </g>

    <!-- Step 1 -->
    <g transform="translate(16, 44)">
      <rect width="380" height="64" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
      <g transform="translate(16, 18)">
        <text class="card-title" x="0" y="0">动态库注入 (Frida / insert_dylib)</text>
        <text class="card-body" x="0" y="18">拦截微信进程加载流程，注入 hook 模块探测内存特征码</text>
        <text class="card-tag" fill="#be123c" x="0" y="34">RISK: 触发 macOS SIP 保护与反注入自校验</text>
      </g>
    </g>

    <!-- Connector -->
    <path d="M 206 108 L 206 122" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Step 2 -->
    <g transform="translate(16, 124)">
      <rect width="380" height="64" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
      <g transform="translate(16, 18)">
        <text class="card-title" x="0" y="0">内存截获 SQLCipher 密钥与偏移</text>
        <text class="card-body" x="0" y="18">拦截 sqlite3_key 导出明文秘钥，硬解沙盒内部 WCDB 数据库</text>
        <text class="card-tag" fill="#be123c" x="0" y="34">FAIL: 微信小版本升级立即导致内存偏移失效</text>
      </g>
    </g>

    <!-- Connector -->
    <path d="M 206 188 L 206 202" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Step 3: Consequence -->
    <g transform="translate(16, 204)">
      <rect width="380" height="124" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
      <g transform="translate(16, 20)">
        <text class="card-title" fill="#9f1239" x="0" y="0">终局后果：封号风控与数据损坏</text>
        <text class="card-body" fill="#881337" x="0" y="20">• 腾讯安全团队风控探针检测到非常驻 dylib，直接下发封号判定</text>
        <text class="card-body" fill="#881337" x="0" y="38">• WCDB 数据库并发锁竞争，极易导致 Message.db 索引彻底损坏</text>
        <text class="card-body" fill="#881337" x="0" y="56">• 聊天记录富文本、语音切片与短视频附件格式割裂，丢失率极高</text>
        <text class="card-tag" fill="#9f1239" x="0" y="80">STATUS: 工业级生产环境绝对不可用</text>
      </g>
    </g>
  </g>

  <!-- Right Column: WeChatBridge Native Approach -->
  <g transform="translate(500, 88)">
    <rect width="412" height="348" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#15803d" x="0" y="14">WeChatBridge 原生方案 (零侵入 / 极速稳健 / 官方合规)</text>
    </g>

    <!-- Step 1 -->
    <g transform="translate(16, 44)">
      <rect width="380" height="64" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(16, 18)">
        <text class="card-title" x="0" y="0">微信 4.1.13+ 官方合并转发入口</text>
        <text class="card-body" x="0" y="18">用户在微信内多选消息，点击“合并转发”并选择系统级外部应用</text>
        <text class="card-tag" fill="#15803d" x="0" y="34">OFFICIAL: 微信官方原生脱敏归档，杜绝内存注入</text>
      </g>
    </g>

    <!-- Connector -->
    <path d="M 206 108 L 206 122" stroke="#86efac" stroke-width="1.5"/>

    <!-- Step 2 -->
    <g transform="translate(16, 124)">
      <rect width="380" height="64" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(16, 18)">
        <text class="card-title" x="0" y="0">Share Extension 系统沙盒透明桥接</text>
        <text class="card-body" x="0" y="18">通过 ShareKit 接收官方 ZIP 包，无网络权限沙盒，秒级写入 App Group</text>
        <text class="card-tag" fill="#15803d" x="0" y="34">SECURITY: 纯内存流式解压，严密防范 Zip-Slip 逃逸</text>
      </g>
    </g>

    <!-- Connector -->
    <path d="M 206 188 L 206 202" stroke="#86efac" stroke-width="1.5"/>

    <!-- Step 3: Consequence -->
    <g transform="translate(16, 204)">
      <rect width="380" height="124" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(16, 20)">
        <text class="card-title" fill="#14532d" x="0" y="0">核心收益：零感秒级摆渡与知识沉淀</text>
        <text class="card-body" fill="#166534" x="0" y="20">• 零封号风险：恪守不读取数据库、不注入进程、不代发网络消息</text>
        <text class="card-body" fill="#166534" x="0" y="38">• AX 几何算法自动聚焦最底端输入框，模拟 ⌘V 丝滑投递 AI Agent</text>
        <text class="card-body" fill="#166534" x="0" y="56">• Obsidian 双链增量指纹排重，群聊记录与高清附件结构化沉淀</text>
        <text class="card-tag" fill="#15803d" x="0" y="80">STATUS: 长期稳定运行，不受微信版本迭代影响</text>
      </g>
    </g>
  </g>
</svg>