<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-functions-title card-scheme-functions-desc" id="card-scheme-functions-root">
        <title id="card-scheme-functions-title">卡组织（Card Scheme）核心定位与五大基础职能</title>
        <desc id="card-scheme-functions-desc">卡组织作为全球支付网络的规则制定者、交换网络运营者与多边清算中枢的核心职能拆解</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-functions-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-functions-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-functions-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-functions-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-functions-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-functions-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Top Central Scheme Box (Coral Accent Focal) -->
        <g transform="translate(240, 24)">
          <rect x="0" y="0" width="480" height="68" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="240" y="28" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.06em">CENTRAL GOVERNANCE HUB</text>
          <text x="240" y="48" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="middle">卡组织（Card Scheme）核心定位与职能</text>
        </g>

        <!-- Bus Connector Line -->
        <path d="M 480 92 L 480 120" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
        <path d="M 104 120 L 856 120" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
        
        <!-- Drops to 5 pillars -->
        <path d="M 104 120 L 104 150" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-functions-arrow)"/>
        <path d="M 292 120 L 292 150" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-functions-arrow)"/>
        <path d="M 480 120 L 480 150" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-functions-arrow)"/>
        <path d="M 668 120 L 668 150" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-functions-arrow)"/>
        <path d="M 856 120 L 856 150" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-functions-arrow)"/>

        <!-- Pillar 1 -->
        <g transform="translate(20, 150)">
          <rect x="0" y="0" width="168" height="190" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="168" height="28" rx="4" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">01 准入与牌照</text>
          <text x="12" y="54" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">成员机构准入授权</text>
          <text x="12" y="78" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">发放 Principal 牌照</text>
          <text x="12" y="98" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">授权银行发卡与收单</text>
          <text x="12" y="118" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">资本充足率与合规穿透</text>
          <text x="12" y="148" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">BIN 号段授权分配</text>
        </g>

        <!-- Pillar 2 -->
        <g transform="translate(208, 150)">
          <rect x="0" y="0" width="168" height="190" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="168" height="28" rx="4" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">02 标准与规范</text>
          <text x="12" y="54" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">全球统一技术标准</text>
          <text x="12" y="78" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">EMV 芯片接触规范</text>
          <text x="12" y="98" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">ISO 8583 金融报文</text>
          <text x="12" y="118" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">PCI-DSS 支付安全认证</text>
          <text x="12" y="148" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">3D-Secure 交易防欺诈</text>
        </g>

        <!-- Pillar 3 -->
        <g transform="translate(396, 150)">
          <rect x="0" y="0" width="168" height="190" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="168" height="28" rx="4" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">03 交换网络运营</text>
          <text x="12" y="54" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">超低延迟专线交换</text>
          <text x="12" y="78" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">VisaNet 全球光纤专网</text>
          <text x="12" y="98" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">BankNet 分布式路由</text>
          <text x="12" y="118" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">毫秒级双向寻径转发</text>
          <text x="12" y="148" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">TPS 65,000+ 峰值吞吐</text>
        </g>

        <!-- Pillar 4 -->
        <g transform="translate(584, 150)">
          <rect x="0" y="0" width="168" height="190" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="168" height="28" rx="4" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">04 清分与轧差</text>
          <text x="12" y="54" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">多边资金对账清算</text>
          <text x="12" y="78" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">每日批量交易对账</text>
          <text x="12" y="98" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">多币种汇率统一折算</text>
          <text x="12" y="118" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">多边净额轧差 (Netting)</text>
          <text x="12" y="148" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">央行头寸终局清偿</text>
        </g>

        <!-- Pillar 5 -->
        <g transform="translate(772, 150)">
          <rect x="0" y="0" width="168" height="190" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="168" height="28" rx="4" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">05 争议与仲裁</text>
          <text x="12" y="54" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">争议调单终局判定</text>
          <text x="12" y="78" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">退单 (Chargeback) 规程</text>
          <text x="12" y="98" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">欺诈责任转移法则</text>
          <text x="12" y="118" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">二道请款证据链审核</text>
          <text x="12" y="148" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">仲裁委员会终局裁决</text>
        </g>
      </svg>
