<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="mesh-avatar-eye-spline-title mesh-avatar-eye-spline-desc">
  <title id="mesh-avatar-eye-spline-title">眼部 24 采样点轮廓样条拟合与平滑动力学架构</title>
  <desc id="mesh-avatar-eye-spline-desc">从眼眶多边形等距采样、二次凸起拟合、5-Tap高斯滤波卷积到四层运动学分层传递的微表情动力学流程</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .code-pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #475569; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="960" height="420" class="bg" />

  <!-- Flow: 5 Cards Horizontally -->
  <!-- Card 1 (x=30, y=70, w=160, h=280) -->
  <g transform="translate(30, 70)">
    <rect width="160" height="280" rx="8" class="card" />
    <text x="14" y="30" class="text-title">1. 开孔多边形</text>
    <text x="14" y="52" class="text-muted">opening 标定</text>

    <g transform="translate(14, 75)">
      <rect width="132" height="60" class="code-pill" />
      <text x="8" y="20" class="code-text">x0, x1: 左右眼角</text>
      <text x="8" y="38" class="code-text">top, bot: 轮廓</text>
      <text x="8" y="52" class="code-text">隔离眼白与眼球</text>
    </g>

    <text x="14" y="160" class="text-body">• 确定眼睑运动基准</text>
    <text x="14" y="180" class="text-body">• 提取瞳孔露出边界</text>
    <text x="14" y="200" class="text-body">• 约束形变几何极值</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="190" y1="210" x2="218" y2="210" class="line" marker-end="url(#arrow3)" />

  <!-- Card 2 (x=220, y=70, w=160, h=280) -->
  <g transform="translate(220, 70)">
    <rect width="160" height="280" rx="8" class="card" />
    <text x="14" y="30" class="text-title">2. 24列纵向采样</text>
    <text x="14" y="52" class="text-muted">EYE_N = 24</text>

    <g transform="translate(14, 75)">
      <rect width="132" height="60" class="code-pill" />
      <text x="8" y="20" class="code-text">u in [0, 1]</text>
      <text x="8" y="38" class="code-text">y_top = top(u)</text>
      <text x="8" y="52" class="code-text">y_bot = bot(u)</text>
    </g>

    <text x="14" y="160" class="text-body">• 归一化水平坐标</text>
    <text x="14" y="180" class="text-body">• 离散采样眼球弧线</text>
    <text x="14" y="200" class="text-body">• 捕捉不同眼型轮廓</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="380" y1="210" x2="408" y2="210" class="line" marker-end="url(#arrow3)" />

  <!-- Card 3 (x=410, y=70, w=160, h=280) -->
  <g transform="translate(410, 70)">
    <rect width="160" height="280" rx="8" class="card" />
    <text x="14" y="30" class="text-title">3. 抛物线拟合</text>
    <text x="14" y="52" class="text-muted">hump &amp; smile 弧线</text>

    <g transform="translate(14, 75)">
      <rect width="132" height="60" class="code-pill" />
      <text x="8" y="20" class="code-text">hump = 4*u*(1-u)</text>
      <text x="8" y="38" class="code-text">arc = 月牙弯曲</text>
      <text x="8" y="52" class="code-text">eyeLidsRaw 闭合</text>
    </g>

    <text x="14" y="160" class="text-body">• 模拟眼皮中央下垂</text>
    <text x="14" y="180" class="text-body">• 微笑上扬弯月眼</text>
    <text x="14" y="200" class="text-body">• 区分眨眼与眯眼</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="570" y1="210" x2="598" y2="210" class="line" marker-end="url(#arrow3)" />

  <!-- Card 4 (x=600, y=70, w=160, h=280) -->
  <g transform="translate(600, 70)">
    <rect width="160" height="280" rx="8" class="card" />
    <text x="14" y="30" class="text-title">4. 5-Tap 平滑核</text>
    <text x="14" y="52" class="text-muted">LID_TAPS 卷积滤波</text>

    <g transform="translate(14, 75)">
      <rect width="132" height="60" class="code-pill" />
      <text x="8" y="20" class="code-text">w = [1, 2, 3, 2, 1]</text>
      <text x="8" y="38" class="code-text">du += a * w / 9</text>
      <text x="8" y="52" class="code-text">db += c * w / 9</text>
    </g>

    <text x="14" y="160" class="text-body">• 消除眼角尖锐畸变</text>
    <text x="14" y="180" class="text-body">• 保证样条曲率连续</text>
    <text x="14" y="200" class="text-body">• 彻底杜绝折线毛刺</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <line x1="760" y1="210" x2="788" y2="210" class="line" marker-end="url(#arrow3)" />

  <!-- Card 5 (x=790, y=70, w=140, h=280) - Focal -->
  <g transform="translate(790, 70)">
    <rect width="140" height="280" rx="8" class="focal-card" />
    <text x="14" y="30" class="text-focal-title">5. 四层运动学</text>
    <text x="14" y="52" class="text-muted">多层独立响应</text>

    <g transform="translate(10, 75)">
      <rect width="120" height="42" rx="4" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
      <text x="8" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#bf4520">lash (上睫毛)</text>
      <text x="8" y="32" class="text-muted">压合与透视微缩</text>
    </g>

    <g transform="translate(10, 125)">
      <rect width="120" height="42" rx="4" class="code-pill" />
      <text x="8" y="18" font-family="sans-serif" font-size="10" font-weight="600" fill="#0f172a">low (下睫毛)</text>
      <text x="8" y="32" class="text-muted">微笑上浮并渐隐</text>
    </g>

    <g transform="translate(10, 175)">
      <rect width="120" height="42" rx="4" class="code-pill" />
      <text x="8" y="18" font-family="sans-serif" font-size="10" font-weight="600" fill="#0f172a">crease (双眼皮)</text>
      <text x="8" y="32" class="text-muted">22% 阻尼柔和延展</text>
    </g>

    <g transform="translate(10, 225)">
      <rect width="120" height="42" rx="4" class="code-pill" />
      <text x="8" y="18" font-family="sans-serif" font-size="10" font-weight="600" fill="#0f172a">ball (眼球底板)</text>
      <text x="8" y="32" class="text-muted">底层自然视差遮挡</text>
    </g>
  </g>
</svg>