<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0284c7; }
      .step-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .step-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
      .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
      .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .note-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0369a1; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #0c4a6e; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="918" height="478" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <!-- Title Area -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="title">doublera1n 冷启动链跨域时序与执行管道全景</text>
    <text x="0" y="20" class="subtitle">从 RP2350 硬件级 SecureROM 物理击穿到用户态 jbinit 根无环境装载的 5 阶穿透时序</text>
  </g>

  <!-- Stage Flow Connectors (Background Line) -->
  <path d="M 112 110 L 808 110" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- Stage 1 -->
  <g transform="translate(32, 74)">
    <rect width="158" height="286" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <rect x="0" y="0" width="158" height="32" fill="#f0f9ff" rx="8"/>
    <rect x="0" y="24" width="158" height="8" fill="#f0f9ff"/>
    <text x="12" y="20" class="step-num">STAGE 01</text>
    <text x="74" y="20" class="step-sub">硬件穿透</text>
    
    <g transform="translate(12, 42)">
      <text x="0" y="0" class="step-header">usbliter8 注入</text>
      <text x="0" y="16" class="item-desc">RP2350 芯片硬件级利用</text>
    </g>

    <g transform="translate(10, 84)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">USB 控制传输竞争</text>
      <text x="8" y="34" class="item-desc">击穿 A13 SecureROM 固件</text>
    </g>

    <g transform="translate(10, 146)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">pwned DFU 模式</text>
      <text x="8" y="34" class="item-desc">接管 SoC 第一阶段引导权</text>
    </g>

    <g transform="translate(10, 208)">
      <rect width="138" height="64" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">UART 票据提取</text>
      <text x="8" y="34" class="item-desc">读取板载原生 APTicket</text>
      <text x="8" y="48" class="item-desc">用于后续镜像合法签名</text>
    </g>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(206, 74)">
    <rect width="158" height="286" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <rect x="0" y="0" width="158" height="32" fill="#f0f9ff" rx="8"/>
    <rect x="0" y="24" width="158" height="8" fill="#f0f9ff"/>
    <text x="12" y="20" class="step-num">STAGE 02</text>
    <text x="74" y="20" class="step-sub">固件热补丁</text>
    
    <g transform="translate(12, 42)">
      <text x="0" y="0" class="step-header">iBoot 签名绕过</text>
      <text x="0" y="16" class="item-desc">patch_iboot 内存重写</text>
    </g>

    <g transform="translate(10, 84)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">Image4 验签回调</text>
      <text x="8" y="34" class="item-desc">强制返回 0 (Success)</text>
    </g>

    <g transform="translate(10, 146)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">boot-args 改写</text>
      <text x="8" y="34" class="item-desc">注入 jb=md0 与自定义参数</text>
    </g>

    <g transform="translate(10, 208)">
      <rect width="138" height="64" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">memboot 命令劫持</text>
      <text x="8" y="34" class="item-desc">直连 fsboot 处理器</text>
      <text x="8" y="48" class="item-desc">允许从 NAND 载入并引导</text>
    </g>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(380, 74)">
    <rect width="158" height="286" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="158" height="32" fill="#e0f2fe" rx="8"/>
    <rect x="0" y="24" width="158" height="8" fill="#e0f2fe"/>
    <text x="12" y="20" class="step-num">STAGE 03</text>
    <text x="74" y="20" class="step-sub">设备树劫持</text>
    
    <g transform="translate(12, 42)">
      <text x="0" y="0" class="step-header">DeviceTree 映射</text>
      <text x="0" y="16" class="item-desc">dt_patch 内存注入</text>
    </g>

    <g transform="translate(10, 84)">
      <rect width="138" height="52" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title" fill="#0369a1">data-vol fs_role=0</text>
      <text x="8" y="34" class="item-desc">指定 DataB 为用户数据卷</text>
    </g>

    <g transform="translate(10, 146)">
      <rect width="138" height="52" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title" fill="#0369a1">共享分区只读锁死</text>
      <text x="8" y="34" class="item-desc">xart / update / hardware ro</text>
    </g>

    <g transform="translate(10, 208)">
      <rect width="138" height="64" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title" fill="#0369a1">蜂窝基带保持读写</text>
      <text x="8" y="34" class="item-desc">baseband-vol 维持 rw</text>
      <text x="8" y="48" class="item-desc">保障通信基带正常在线</text>
    </g>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(554, 74)">
    <rect width="158" height="286" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <rect x="0" y="0" width="158" height="32" fill="#f0f9ff" rx="8"/>
    <rect x="0" y="24" width="158" height="8" fill="#f0f9ff"/>
    <text x="12" y="20" class="step-num">STAGE 04</text>
    <text x="74" y="20" class="step-sub">内核语义规避</text>
    
    <g transform="translate(12, 42)">
      <text x="0" y="0" class="step-header">XNU SEP-less</text>
      <text x="0" y="16" class="item-desc">kpatchfind 动态打桩</text>
    </g>

    <g transform="translate(10, 84)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">屏蔽 SEP 崩溃桩</text>
      <text x="8" y="34" class="item-desc">REQUIRE(!booted) -&gt; NOP</text>
    </g>

    <g transform="translate(10, 146)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">伪装密钥库状态</text>
      <text x="8" y="34" class="item-desc">sep-booted 桩返 0 (False)</text>
    </g>

    <g transform="translate(10, 208)">
      <rect width="138" height="64" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">深度睡眠状态修复</text>
      <text x="8" y="34" class="item-desc">改写 setPowerState 判定</text>
      <text x="8" y="48" class="item-desc">彻底杜绝锁屏黑屏 Panic</text>
    </g>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(728, 74)">
    <rect width="158" height="286" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <rect x="0" y="0" width="158" height="32" fill="#f0f9ff" rx="8"/>
    <rect x="0" y="24" width="158" height="8" fill="#f0f9ff"/>
    <text x="12" y="20" class="step-num">STAGE 05</text>
    <text x="74" y="20" class="step-sub">用户态生态</text>
    
    <g transform="translate(12, 42)">
      <text x="0" y="0" class="step-header">Rootless 运行时</text>
      <text x="0" y="16" class="item-desc">jbinit + Procursus</text>
    </g>

    <g transform="translate(10, 84)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">PID 1 启动中继</text>
      <text x="8" y="34" class="item-desc">bindfs 映射 /jbin -&gt; /cores</text>
    </g>

    <g transform="translate(10, 146)">
      <rect width="138" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">ElleKit 动态注入</text>
      <text x="8" y="34" class="item-desc">注入 systemhook &amp; obhook</text>
    </g>

    <g transform="translate(10, 208)">
      <rect width="138" height="64" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="5"/>
      <text x="8" y="18" class="item-title">Sileo 2.5.1 激活</text>
      <text x="8" y="34" class="item-desc">Swift 架构判断 arm64x</text>
      <text x="8" y="48" class="item-desc">无缝加载 Procursus 源生态</text>
    </g>
  </g>

  <!-- Bottom Annotation Bar -->
  <g transform="translate(32, 380)">
    <rect width="854" height="74" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="8"/>
    <g transform="translate(18, 22)">
      <text x="0" y="0" class="note-title" fill="#15803d">核心启动链特征：零持久化与单向引导</text>
      <text x="0" y="20" class="note-text" fill="#166534">该启动链全部基于 RAM 与 pwned DFU 临时载入，所有内核与设备树补丁均在内存中生效。设备只要拔线硬重启，即以官方未经修改的 iBoot 引导原有密封根系统卷，零持久化污染，绝不影响日常官方固件安全。</text>
    </g>
  </g>
</svg>
