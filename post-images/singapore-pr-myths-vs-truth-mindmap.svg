<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-myths-vs-truth-mindmap-title singapore-pr-myths-vs-truth-mindmap-desc">
  <title id="singapore-pr-myths-vs-truth-mindmap-title">新加坡身份三大认知误区与真相解构图谱</title>
  <desc id="singapore-pr-myths-vs-truth-mindmap-desc">对比公积金缴费率拉齐、家庭人均收入审查门槛与二代男性兵役法律责任三大核心误区与制度真相</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .badge-err { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #b91c1c; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #047857; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡身份三大典型认知盲区与制度真相解构</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">身份差异的核心逻辑在于：它首先表现为“准入权利与行政确定性”，其次才表现为账面便宜多少</text>

  <!-- Card 1: CPF -->
  <g transform="translate(40, 80)">
    <rect width="270" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">误区一：入籍雇主多缴 CPF</text>
    
    <g transform="translate(16, 48)">
      <rect width="52" height="18" rx="4" fill="#fee2e2"/>
      <text x="26" y="13" class="badge-err" text-anchor="middle">传言误区</text>
      <text x="0" y="36" class="text-sub">“换公民后公积金雇主缴纳暴涨，相当于涨薪”</text>
    </g>

    <line x1="16" y1="110" x2="254" y2="110" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(16, 122)">
      <rect width="52" height="18" rx="4" fill="#d1fae5"/>
      <text x="26" y="13" class="badge-ok" text-anchor="middle">法定真相</text>
      <text x="0" y="36" class="text-bold">• PR 满 2 年进入第 3 年起全额拉齐</text>
      <text x="0" y="56" class="text-sub">• 雇主 17% + 雇员 20% 与公民完全一致</text>
      <text x="0" y="76" class="text-sub">• 老 PR 入籍工资单公积金分文不增</text>
    </g>
  </g>

  <!-- Card 2: Means-Testing -->
  <g transform="translate(345, 80)">
    <rect width="270" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">误区二：最高补贴人人都能领</text>
    
    <g transform="translate(16, 48)">
      <rect width="52" height="18" rx="4" fill="#fee2e2"/>
      <text x="26" y="13" class="badge-err" text-anchor="middle">传言误区</text>
      <text x="0" y="36" class="text-sub">“入籍买房立省 8 万，住院政府报销 80%”</text>
    </g>

    <line x1="16" y1="110" x2="254" y2="110" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(16, 122)">
      <rect width="52" height="18" rx="4" fill="#d1fae5"/>
      <text x="26" y="13" class="badge-ok" text-anchor="middle">法定真相</text>
      <text x="0" y="36" class="text-bold">• 强绑定家庭人均收入 Means-Testing</text>
      <text x="0" y="56" class="text-sub">• 高收入家庭即便入籍补贴比例亦大幅滑落</text>
      <text x="0" y="76" class="text-sub">• 核心是准入资格断层而非普惠补贴</text>
    </g>
  </g>

  <!-- Card 3: NS (Focal Coral) -->
  <g transform="translate(650, 80)">
    <rect width="270" height="230" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#ffedd5"/>
    <text x="135" y="22" class="badge-coral" text-anchor="middle">误区三：维持 PR 儿子免当兵</text>
    
    <g transform="translate(16, 48)">
      <rect width="52" height="18" rx="4" fill="#fee2e2"/>
      <text x="26" y="13" class="badge-err" text-anchor="middle">致命误区</text>
      <text x="0" y="36" class="text-sub">“不转公民，二代男性 PR 就能免除服役”</text>
    </g>

    <line x1="16" y1="110" x2="254" y2="110" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(16, 122)">
      <rect width="52" height="18" rx="4" fill="#ffedd5"/>
      <text x="26" y="13" class="badge-coral" text-anchor="middle">铁律红线</text>
      <text x="0" y="36" class="text-bold">• 父母担保/学生准证二代 PR 必须服役</text>
      <text x="0" y="56" class="text-sub">• 满 18 岁服役 2 年 NS + 10 年战备营训</text>
      <text x="0" y="76" class="badge-coral">• 逃避服役面临监禁并永久列入黑名单</text>
    </g>
  </g>
</svg>