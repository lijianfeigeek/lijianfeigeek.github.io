<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="mv-quad-title mv-quad-desc" id="mv-quad-root" data-diagram="quadrant">
  <title id="mv-quad-title">Vibe Coding 桌面语音控制架构四象限权衡矩阵</title>
  <desc id="mv-quad-desc">对比四类桌面 AI 编程语音输入方案在宿主通用性与音频路由及麦克风隐私无损度两个正交维度上的工程取舍，突出 MiVibe Remote 的按需虚拟麦与同步快捷键编排定位。</desc>
  <defs>
    <pattern id="mvq-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="mvq-arr-end" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
    </marker>
    <marker id="mvq-arr-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="620" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="620" fill="url(#mvq-dots)"/>
  <rect x="16" y="16" width="968" height="588" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.16em">ARCHITECTURAL POSITIONING · 2X2 SCENARIO MATRIX</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">不跑本地 Whisper 也能零隐私打扰：四类桌面 AI 语音输入架构二维权衡</text>
  </g>

  <!-- Double-ended Orthogonal Axes passing cleanly between cells (center = 500, 316) -->
  <line x1="120" y1="316" x2="880" y2="316" stroke="#0f172a" stroke-width="1.2" marker-start="url(#mvq-arr-start)" marker-end="url(#mvq-arr-end)"/>
  <line x1="500" y1="112" x2="500" y2="520" stroke="#0f172a" stroke-width="1.2" marker-start="url(#mvq-arr-start)" marker-end="url(#mvq-arr-end)"/>

  <!-- Jobs-minimal Axis Tip Labels (flanking arrow tips, zero glyphs/parentheticals) -->
  <g transform="translate(500, 98)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">NON-INTRUSIVE</text>
  </g>
  <g transform="translate(500, 540)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">INTRUSIVE</text>
  </g>
  <g transform="translate(108, 320)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="end">SINGLE-APP</text>
  </g>
  <g transform="translate(892, 320)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">OMNI-HOST</text>
  </g>

  <!-- Q1: Top-Left (01 · SINGLE-APP / NON-INTRUSIVE) -->
  <g transform="translate(156, 132)">
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">01 · SINGLE-APP / NON-INTRUSIVE</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">端侧离线模型 + AX 树注入</text>
    <text x="16" y="74" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">代表路线：mi-ao（内置 148MB whisper.cpp）</text>
    <text x="16" y="96" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">无需虚拟声卡，物理隔离蓝牙耳机与内置麦；</text>
    <text x="16" y="118" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">但强耦合 macOS 辅助功能树，仅限单一</text>
    <text x="16" y="140" fill="#64748b" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">Codex 宿主，不支持 Windows 与通用听写</text>
  </g>

  <!-- Q2: Top-Right FOCAL (02 · OMNI-HOST / NON-INTRUSIVE) -->
  <g transform="translate(528, 132)">
    <rect x="-4" y="-4" width="324" height="168" rx="8" fill="#bf4520" opacity="0.04"/>
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="16" y="24" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">02 · OMNI-HOST / NON-INTRUSIVE</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">MiVibe 按需虚拟麦 + 快捷键编排</text>
    <text x="16" y="74" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">IOProc 直写 MiRemoteV 2ch 避开蓝牙聚合降质；</text>
    <text x="16" y="96" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">空闲销毁采集流，消灭常驻橙色麦克风隐私点；</text>
    <text x="16" y="118" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">零本地模型包体积，一套交互横跨 macOS 与</text>
    <text x="16" y="140" fill="#bf4520" font-size="10.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">Windows · Codex / WorkBuddy / 微信 / 千问</text>
  </g>

  <!-- Q3: Bottom-Left (03 · SINGLE-APP / INTRUSIVE) -->
  <g transform="translate(156, 340)">
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">03 · SINGLE-APP / INTRUSIVE</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">电脑远场内置麦 + 窗口内听写</text>
    <text x="16" y="74" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">依赖笔记本麦克风远场拾音，极易混入风扇与</text>
    <text x="16" y="96" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">键盘敲击底噪；戴蓝牙耳机时强制切入 HFP</text>
    <text x="16" y="118" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">窄带通话模式，且使用者必须贴近电脑屏幕</text>
    <text x="16" y="140" fill="#64748b" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">Bluetooth SCO Fallback · Far-field Noise</text>
  </g>

  <!-- Q4: Bottom-Right (04 · OMNI-HOST / INTRUSIVE) -->
  <g transform="translate(528, 340)">
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">04 · OMNI-HOST / INTRUSIVE</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">常驻 AVAudioEngine + 原版 BlackHole</text>
    <text x="16" y="74" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">AVAudioEngine 在虚拟输入+蓝牙输出组合下</text>
    <text x="16" y="96" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">触发系统聚合设备重建；后台常驻流令菜单栏</text>
    <text x="16" y="118" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">橙点常亮；Virtual 传输态遭豆包等客户端拦截</text>
    <text x="16" y="140" fill="#64748b" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">Aggregate Rebuild · TransportTypeVirtual</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="560" x2="960" y2="560" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(40, 576)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="20" y="12" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">核心架构选型（MiVibe Remote 目标象限）</text>
  </g>
  <g transform="translate(320, 576)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="12" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">其他参照架构路径</text>
  </g>
  <g transform="translate(500, 576)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">X-AXIS: HOST COVERAGE · Y-AXIS: AUDIO &amp; PRIVACY INTEGRITY</text>
  </g>
</svg>
