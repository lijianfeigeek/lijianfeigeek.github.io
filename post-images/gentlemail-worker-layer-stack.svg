<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="496" viewBox="0 0 920 496" role="img" aria-labelledby="gm-ls-title gm-ls-desc" id="gentlemail-worker-layer-stack-root">
  <title id="gm-ls-title">GentleMail 单 Worker 五层无服务器边缘架构栈</title>
  <desc id="gm-ls-desc">展示 GentleMail 如何在单个 Cloudflare Worker 内整合三路触发入口、RedwoodSDK 与 MCP 协议层、三维统一权限矩阵核、D1/R2 字节分流存储层及零密钥原生绑定层。</desc>
  <defs>
    <style>
      #gentlemail-worker-layer-stack-root {
        --color-paper: #f8fafc;
        --color-ink: #1e293b;
        --color-muted: #475569;
        --color-accent: #bf4520;
        --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif SC', Georgia, serif;
        --font-mono: 'Geist Mono', 'SFMono-Regular', ui-monospace, monospace;
        font-family: var(--font-sans);
        color: var(--color-ink);
      }
    </style>
    <pattern id="gm-ls-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.26"/>
    </pattern>
    <marker id="gm-ls-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="920" height="496" fill="#f8fafc"/>
  <rect width="920" height="496" fill="url(#gm-ls-dots)"/>

  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">Single-Worker Five-Layer Edge Architecture</text>
  <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">FETCH (RWSDK + API + MCP) · EMAIL (POSTAL-MIME) · SCHEDULED (CRON) · ZERO CF API TOKEN</text>

  <line x1="68" y1="408" x2="68" y2="82" stroke="#475569" stroke-width="1.4" marker-end="url(#gm-ls-arrow)"/>
  <text x="60" y="236" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569">ABSTRACTION</text>
  <text x="60" y="250" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">ENTRY TO BIND</text>

  <g transform="translate(128, 72)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L5 · ENTRY</text>
    <text x="128" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">单 Worker 三路事件入口分发层</text>
    <text x="128" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">fetch() Web &amp; API · email() Catch-All · scheduled(* * * * *) Cron</text>
    <rect x="600" y="20" width="144" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="672" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">src/worker.tsx</text>
  </g>

  <g transform="translate(128, 148)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L4 · SURFACE</text>
    <text x="128" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">RedwoodSDK RSC、REST API 与 MCP 协议栈</text>
    <text x="128" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">React 19 serverAction · /api/v1/* · /mcp JSON-RPC · /oauth/* OAuth 2.1</text>
    <rect x="600" y="20" width="144" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="672" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">src/app/*.ts</text>
  </g>

  <g transform="translate(128, 224)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="16" y="18" width="96" height="28" rx="4" fill="#bf4520"/>
    <text x="64" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#ffffff">L3 · POLICY</text>
    <text x="128" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">三维统一权限矩阵与成员交集核</text>
    <text x="128" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">(all | domain | mailbox) x (read | organize | send) ∩ mailbox_members</text>
    <rect x="600" y="20" width="144" height="24" rx="4" fill="#fff7ed" stroke="#bf4520" stroke-width="0.8"/>
    <text x="672" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#bf4520">src/lib/apikeys.ts</text>
  </g>

  <g transform="translate(128, 300)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L2 · STORAGE</text>
    <text x="128" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">零 ORM 裸 SQL 与 D1 / R2 字节阈值分流</text>
    <text x="128" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">900KB UTF-8 分流 · 90-ID chunks() 防 100 绑定上限 · .eml / 附件存 R2</text>
    <rect x="600" y="20" width="144" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="672" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">src/lib/db.ts</text>
  </g>

  <g transform="translate(128, 376)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L1 · BINDING</text>
    <text x="128" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Cloudflare 零 API 密钥原生资源绑定</text>
    <text x="128" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">DB (D1) · MAIL_BUCKET (R2) · EMAIL (send_email) · REGISTER_LIMIT (RateLimit)</text>
    <rect x="600" y="20" width="144" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="672" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">wrangler.jsonc</text>
  </g>

  <line x1="32" y1="452" x2="888" y2="452" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 468)">
    <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="76" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="98" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">焦点架构核：API Key 与 OAuth 助手共用同一套 SQL 权限求交引擎</text>
    <rect x="520" y="-8" width="14" height="14" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="542" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">无状态运行时、存储与 Cloudflare 原生绑定</text>
  </g>
</svg>
