<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="kernarium-layers-title kernarium-layers-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="kernarium-layers-title">Kernarium 与 Andarium 四层跨核虚拟化堆栈架构</title>
  <desc id="kernarium-layers-desc">展示 Kernarium 如何将主线 Linux 6.18 LTS 内核以 User-Mode Linux 形态编译为 arm64 Mach-O 只读段，并结合 iSH 风格 Gadget 线程解释器、静态 AOT 与 Mesa KosmicKrisp 实现原生级 Android 17 与 Linux 虚拟化。</desc>
  <defs>
    <marker id="kl-arrow-up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 9 L 5 1 L 9 9 z" fill="#64748b"/>
    </marker>
    <marker id="kl-arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 5 9 L 9 1 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">Kernarium / Andarium 四层跨核虚拟化堆栈架构</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">MAINLINE LINUX 6.18 LTS (ARCH=UM SUBARCH=ARM64) ON DARWIN / APPLE SILICON (IOS 27.0+)</text>
    <text x="860" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: LAYER STACK</text>
  </g>

  <!-- Left margin vertical direction indicators -->
  <g transform="translate(40, 104)">
    <line x1="16" y1="20" x2="16" y2="212" stroke="#64748b" stroke-width="1.2" marker-start="url(#kl-arrow-up)"/>
    <text x="28" y="120" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600">ABSTRACTION</text>
    <line x1="16" y1="264" x2="16" y2="464" stroke="#0284c7" stroke-width="1.2" marker-end="url(#kl-arrow-down)"/>
    <text x="28" y="368" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">VHOST / ABI</text>
  </g>

  <!-- L4: Guest OS Ecosystem -->
  <g transform="translate(148, 104)">
    <rect x="0" y="0" width="772" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L4</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">双生态 Guest 系统层：Android 17 (LineageOS 24) 与通用 Linux</text>
    <text x="76" y="54" font-size="12" fill="#334155">Andarium 跑完整 Android 17（支持 Termux / Winlator / APK 侧载与 ADB）· Kernarium 跑 KDE / Debian / Docker</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">arm64 + AArch32 (armeabi-v7a / armhf) · x86_64 兼容切片 (macOS) · .kern 沙盒包与 EROFS 镜像</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" font-weight="600" text-anchor="end">FULL OS GUEST</text>
  </g>

  <!-- L3: Dual CPU & AOT Execution Engine (CORAL FOCAL LAYER) -->
  <g transform="translate(148, 212)">
    <rect x="0" y="0" width="772" height="156" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c" text-anchor="middle">L3</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">双轨用户态 CPU 模拟与静态 AOT 加速层（无 JIT 过审关键）</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" font-weight="700" text-anchor="end">FOCAL · DATA-ONLY GADGETS</text>

    <!-- Sub-card Left: Gadget Threaded Interpreter + AOT -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="452" height="92" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#be123c">轨道 A · iSH 风格 Gadget 线程解释器 + 静态 AOT</text>
      <text x="16" y="46" font-size="11" fill="#334155">手写 arm64 汇编 Gadget 银行（14,512 行），翻译块仅为非可执行数据指针流</text>
      <text x="16" y="66" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">UmlArm64Aot.framework · 预重写 ART boot*.oat 与系统库</text>
      <text x="16" y="82" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">CC_SHA256 整页校验 + EROFS immutable 位共享裁决 · App Store 合规</text>
    </g>

    <!-- Sub-card Right: Native JIT Engine -->
    <g transform="translate(484, 48)">
      <rect x="0" y="0" width="272" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#0f172a">轨道 B · 原生 JIT 动态翻译</text>
      <text x="16" y="46" font-size="11" fill="#334155">macOS 与开发配置启用真机 JIT</text>
      <text x="16" y="66" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">iOS: brk #0xf00d (StikDebug)</text>
      <text x="16" y="82" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">macOS x86_64: FEXCore + executable_memory</text>
    </g>
  </g>

  <!-- L2: Native User-Mode Linux 6.18 Kernel -->
  <g transform="translate(148, 384)">
    <rect x="0" y="0" width="772" height="96" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0369a1" text-anchor="middle">L2</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">原生编译的 User-Mode Linux 6.18 LTS 真实内核</text>
    <text x="76" y="54" font-size="12" fill="#334155">内核 ELF 原生编译为 arm64 静态代码并置入 __TEXT,__uml_elf，免模拟直接执行，支持完整 Namespaces / SELinux</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">128 TiB 稀疏软件 MMU · 4KB Guest ↔ 16KB Host 页对齐 · UBD / EROFS / FUSE / Loop · darwin_uml_abi.h</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">NATIVE ARM64 KERNEL</text>
  </g>

  <!-- L1: Apple Hardware & Graphics Substrate -->
  <g transform="translate(148, 496)">
    <rect x="0" y="0" width="772" height="92" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L1</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">Darwin / XNU 宿主硬件桥接与 Mesa 图形渲染栈</text>
    <text x="76" y="54" font-size="12" fill="#334155">Virtio-GPU (Virgl + Venus) → vhost-user → virglrenderer → Mesa Zink / KosmicKrisp → Metal 4 (无 MoltenVK)</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">Vulkan 1.4 &amp; OpenGL 4.6 / GLES 3.2 · V4L2 → VideoToolbox 硬编解码 · libslirp 用户态网络 · 1 GiB 共享孔径</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600" text-anchor="end">METAL 4 + DARWIN</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 616)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <rect x="76" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="24" font-size="11" fill="#334155">核心突破层 (Gadget + AOT)</text>
    <rect x="276" y="13" width="14" height="14" rx="3" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <text x="298" y="24" font-size="11" fill="#334155">原生 UML 6.18 内核层</text>
    <rect x="460" y="13" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="482" y="24" font-size="11" fill="#334155">Darwin / Metal 4 宿主基座</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">SOURCE: docs/architecture.md &amp; graphics.md</text>
  </g>
</svg>
