<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="jev-webmcp-delta-title jev-webmcp-delta-desc">
  <title id="jev-webmcp-delta-title">纯 DOM 盲选困境 vs Jev + WebMCP 质变跃迁对比</title>
  <desc id="jev-webmcp-delta-desc">对比混乱公网DOM盲选导致的51%失败率与WebMCP标准接口下100%满分通过、成本暴降112倍的工程质变</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 6; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow4-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Column 1: Dilemma of Pure DOM (x=40, y=40, w=420, h=380) -->
  <g transform="translate(40, 40)">
    <rect width="420" height="380" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 44 L 0 44 Z" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="16" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">纯 DOM 控件点击的困境 (WindTunnel: 25/49)</text>

    <!-- Steps -->
    <g transform="translate(16, 56)">
      <rect width="388" height="56" class="pill" />
      <text x="12" y="20" class="text-subtitle">1. 混乱真实网页环境</text>
      <text x="12" y="38" class="text-muted">横幅广告、Cookie 弹窗遮罩、动态渲染与嵌套 div 干扰</text>
    </g>

    <g transform="translate(16, 122)">
      <rect width="388" height="56" class="pill" />
      <text x="12" y="20" class="text-subtitle">2. 提取出 120+ 密集可交互元素</text>
      <text x="12" y="38" class="text-muted">大量无关链接充斥备选池，稀释了关键业务按钮</text>
    </g>

    <g transform="translate(16, 188)">
      <rect width="388" height="56" class="pill" />
      <text x="12" y="20" class="text-subtitle">3. Jev 在视觉垃圾堆中盲选</text>
      <text x="12" y="38" class="text-muted">即便 90ms 决断战神，也极难辨别“同名假按钮”</text>
    </g>

    <g transform="translate(16, 254)">
      <rect width="388" height="56" class="pill" />
      <text x="12" y="20" class="text-subtitle">4. 误入分页死循环与广告跳出</text>
      <text x="12" y="38" class="text-muted">语法正确的按钮 != 业务逻辑正确的下一步！</text>
    </g>

    <g transform="translate(16, 320)">
      <rect width="388" height="46" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
      <text x="12" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">任务完成率仅 51.0% · 频繁卡死</text>
      <text x="12" y="34" font-family="sans-serif" font-size="10" fill="#b91c1c">纯在像素/DOM堆里扒网页是一条歧途</text>
    </g>
  </g>

  <!-- Column 2: WebMCP Solution (x=500, y=40, w=420, h=380) - Focal -->
  <g transform="translate(500, 40)">
    <rect width="420" height="380" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 44 L 0 44 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="16" y="28" class="text-focal-title">Jev + WebMCP 绝杀范式 (WindTunnel: 49/49)</text>

    <!-- Steps -->
    <g transform="translate(16, 56)">
      <rect width="388" height="56" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">1. WebMCP 官方标准工具接口暴露</text>
      <text x="12" y="38" class="text-muted">网站主动提供 OpenAPI 式语义工具：search, add_to_cart</text>
    </g>

    <g transform="translate(16, 122)">
      <rect width="388" height="56" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">2. 干净明确的 3~5 个高阶候选动作</text>
      <text x="12" y="38" class="text-muted">彻底抹平广告弹窗与样式噪点，直击业务操作核心</text>
    </g>

    <g transform="translate(16, 188)">
      <rect width="388" height="56" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">3. Jev 秒选下一步工具 (80ms)</text>
      <text x="12" y="38" class="text-muted">毫秒级解决“下一步该调用哪一个接口”的核心难题</text>
    </g>

    <g transform="translate(16, 254)">
      <rect width="388" height="56" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">4. Mercury 2.5 极速填充参数 (30ms)</text>
      <text x="12" y="38" class="text-muted">1000+ tok/s 廉价小模型精准装填参数，网站原生 API 执行</text>
    </g>

    <g transform="translate(16, 320)">
      <rect width="388" height="46" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text x="12" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#166534">满分通过率 100% · 成本暴降 112x</text>
      <text x="12" y="34" font-family="sans-serif" font-size="10" fill="#15803d">单步延迟压至 ~120ms，相比 GPT-6 Astra 降维暴击</text>
    </g>
  </g>
</svg>