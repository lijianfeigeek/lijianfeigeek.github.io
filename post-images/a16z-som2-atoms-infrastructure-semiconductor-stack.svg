<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a16z-som2-atoms-infrastructure-semiconductor-stack-title a16z-som2-atoms-infrastructure-semiconductor-stack-desc">
  <title id="a16z-som2-atoms-infrastructure-semiconductor-stack-title">原子世界全面回归：物理基建、半导体制造与自主系统三大支柱</title>
  <desc id="a16z-som2-atoms-infrastructure-semiconductor-stack-desc">展现从90万亿美元能源基建到先进制程封装以及具身实体系统自下而上的全景物理堆栈</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">“Atoms Are So Back”：原子世界全面王者归来的三大物理支柱堆栈</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">资本正在以二战后罕见的速度和规模，从虚拟比特大举涌向先进制程芯片、电网与自主工业物理世界</text>

  <!-- Pillar 1: Energy &amp; Grid -->
  <g transform="translate(40, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">支柱一：能源承载与电网基建</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title" fill="#0284c7">90 万亿美元物理高墙 (至2040)</text>
      <text x="0" y="32" class="text-sub">• 全球电网现代化与变压器交付拉长至3年</text>
      <text x="0" y="50" class="text-sub">• 数据中心负荷爆发，高压输电走廊成硬通货</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="88" class="card-title">清洁基荷电力排他锁定</text>
      <text x="0" y="106" class="text-sub">• 重启传统核电站 (微软三里岛园区)</text>
      <text x="0" y="124" class="text-sub">• 小型模块化反应堆 (SMR) 资本下场重注</text>
      <text x="0" y="142" class="text-sub">物理约束：算力扩张严格受制于热力学</text>
    </g>
  </g>

  <!-- Pillar 2: Semiconductor (Focal Coral) -->
  <g transform="translate(345, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#ffedd5"/>
    <text x="135" y="22" class="badge-coral" text-anchor="middle">支柱二：半导体制造与先进封装</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="badge-coral">高带宽存储 (HBM) 统治级表现</text>
      <text x="0" y="32" class="text-sub">• 大模型瓶颈受限于“内存墙 (Memory Wall)”</text>
      <text x="0" y="50" class="text-sub">• HBM3e / HBM4 蚕食通用 DRAM 晶圆产能</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#fed7aa" stroke-width="1"/>
      <text x="0" y="88" class="card-title">微观物理极限制造壁垒</text>
      <text x="0" y="106" class="text-sub">• TSMC 2nm / 3nm 全环绕栅极代工</text>
      <text x="0" y="124" class="text-sub">• CoWoS 先进三维堆叠封装良率高墙</text>
      <text x="0" y="142" class="badge-coral">硬件回报率十年来首次彻底反超软件</text>
    </g>
  </g>

  <!-- Pillar 3: Autonomous Physical Systems -->
  <g transform="translate(650, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">支柱三：自主物理实体系统</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title" fill="#047857">具身智能与执行器控制</text>
      <text x="0" y="32" class="text-sub">• 算法与高精度减速机、电机物理结合</text>
      <text x="0" y="50" class="text-sub">• 走向工业车间与真实场景执行重体力任务</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="88" class="card-title">出行与国防工业智能化</text>
      <text x="0" y="106" class="text-sub">• Robotaxi 城市级常态运营落地</text>
      <text x="0" y="124" class="text-sub">• 模块化低成本无人集群自主协同</text>
      <text x="0" y="142" class="text-sub">终局愿景：软件认知彻底物理物化</text>
    </g>
  </g>
</svg>