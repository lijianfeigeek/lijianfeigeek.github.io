<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="modern-network-debugging-aetherport-webserial-architecture-title modern-network-debugging-aetherport-webserial-architecture-desc">
  <title id="modern-network-debugging-aetherport-webserial-architecture-title">AetherPort 浏览器端在线串口与波形分析架构</title>
  <desc id="modern-network-debugging-aetherport-webserial-architecture-desc">展示基于 Web Serial 与 Web Bluetooth API 在浏览器内实现高速分包与 Canvas 60FPS 硬件加速波形绘制的架构</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">WEB API 硬件赋能：AETHERPORT（云之彼端）基于 WEB SERIAL 的在线波形工作站</text>
    <text x="896" y="16" text-anchor="end" class="tag">CHROMIUM HARDWARE PIPELINE</text>
  </g>

  <!-- Left: Physical Hardware -->
  <g transform="translate(32, 60)">
    <rect width="280" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="280" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="280" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">物理硬件与传感器节点 (Hardware)</text>
    <text x="266" y="25" text-anchor="end" class="tag">EMBEDDED</text>

    <g transform="translate(14, 52)">
      <rect width="252" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">STM32 / ESP32 / RISC-V 单片机</text>
        <text class="desc" x="0" y="18">• USB-UART 接口原生连接电脑</text>
        <text class="desc" x="0" y="34">• 支持最高 921600+ 高波特率传输</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="252" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">工业传感器 (IMU / 温湿度 / 激光)</text>
        <text class="desc" x="0" y="18">• 高频连续喷吐三轴加速度原始报文</text>
        <text class="desc" x="0" y="34">• 格式如: data: 23.5, 45.2, 88.1
</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="252" height="106" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">低功耗蓝牙 (BLE 广播/服务)</text>
        <text class="desc" x="0" y="18">• 满足可穿戴设备无线免插线调试</text>
        <text class="desc" x="0" y="34">• 广播 GATT Characteristic 特征值</text>
        <text class="tag" x="0" y="60">免装驱动，插上即可被浏览器识别</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Hardware -> Browser -->
  <path d="M 312 215 L 342 215" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Middle: Browser Core (Core Accent) -->
  <g transform="translate(342, 60)">
