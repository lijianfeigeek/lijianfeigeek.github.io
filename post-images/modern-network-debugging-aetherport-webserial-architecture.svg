        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 浏览器弹窗原生授权 USB 句柄</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 彻底消灭 Win/Mac/Linux 跨平台驱动鸿沟</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="258" height="74" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">Web Worker 独立解包线程</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 毫秒级分包超时计算与拼帧</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• CRC 校验与 YMODEM 固件分块协议状态机</text>
      </g>
    </g>

    <g transform="translate(14, 208)">
      <rect width="258" height="96" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">Canvas / WebGL 硬件加速</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• GPU 驱动 60 FPS 动态刷新波形</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 彻底告别传统串口助手高分辨率下卡死发虚</text>
        <text class="coral-tag" x="0" y="52">零卡顿丝滑缩放与数据点打标</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Browser -> Features -->
  <path d="M 628 215 L 658 215" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Right: Features -->
  <g transform="translate(658, 60)">
    <rect width="270" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="270" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="270" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="270" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">AetherPort 网页工作站功能</text>
    <text x="256" y="25" text-anchor="end" class="tag">WORKBENCH</text>

    <g transform="translate(14, 52)">
      <rect width="242" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">多通道动态示波器</text>
        <text class="desc" x="0" y="18">• 实时监测 PID 参数与姿态角曲线</text>
        <text class="desc" x="0" y="34">• 无需另写 Python 脚本与 Matplotlib</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="242" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">网页端 YMODEM 固件烧录</text>
        <text class="desc" x="0" y="18">• 拖拽 .bin 即可刷写 Bootloader</text>
        <text class="desc" x="0" y="34">• 彻底摆脱 ST-Link 物理烧录器依赖</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="242" height="106" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1.5" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">Hex / 文本智能防碎片拼包</text>
        <text class="desc" style="fill:#166534;" x="0" y="18">• 毫秒级时间窗精准杜绝换行断行</text>
        <text class="desc" style="fill:#166534;" x="0" y="34">• 自定义指令宏与自动化测试脚本</text>
        <text class="green-tag" x="0" y="60">嵌入式硬件调试的生产力飞跃</text>
      </g>
    </g>
