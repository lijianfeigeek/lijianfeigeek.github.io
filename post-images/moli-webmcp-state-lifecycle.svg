<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="560" viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="moli-swim-title moli-swim-desc" id="moli-swim-root" data-diagram="swimlane">
  <title id="moli-swim-title">Moli WebMCP 表单工具化与 RFC 9421 请求签名跨泳道全链路</title>
  <desc id="moli-swim-desc">展示 AI 智能体、moli-webmcp、原生 moli-dom 与 moli-fetch/WebBotAuth 四个角色如何协作完成网页表单 Schema 自动编译、全量强类型校验、原生 DOM 原子填充与 RFC 9421 签名提交。</desc>
  <defs>
    <pattern id="moli-swim-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="swim-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="swim-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="swim-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Paper Light Background -->
  <rect width="1040" height="560" fill="#f8fafc"/>
  <rect width="1040" height="560" fill="url(#moli-swim-dots)" opacity="0.55"/>

  <!-- Header -->
  <text x="24" y="34" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">SWIMLANE · WEBMCP DETERMINISTIC FORM EXECUTION &amp; BOT AUTH</text>
  <text x="24" y="62" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">告别视觉瞎点：WebMCP 表单编译与 RFC 9421 签名提交泳道</text>

  <!-- Swimlane Backgrounds & Horizontal Hairlines -->
  <rect x="24" y="96" width="992" height="96" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="192" width="992" height="96" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="288" width="992" height="96" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="384" width="992" height="96" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Lane Header Column Divider -->
  <line x1="168" y1="96" x2="168" y2="480" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane Labels (Left Margin) -->
  <g transform="translate(24 96)">
    <text x="16" y="42" fill="#0284c7" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">01 · AI AGENT</text>
    <text x="16" y="62" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">大模型决策与调用方</text>
  </g>
  <g transform="translate(24 192)">
    <text x="16" y="42" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">02 · moli-webmcp</text>
    <text x="16" y="62" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">工具契约与校验编译器</text>
  </g>
  <g transform="translate(24 288)">
    <text x="16" y="42" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">03 · moli-dom</text>
    <text x="16" y="62" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">纯 Rust 活体 DOM 树</text>
  </g>
  <g transform="translate(24 384)">
    <text x="16" y="42" fill="#059669" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">04 · moli-fetch</text>
    <text x="16" y="62" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">curl-rust + Bot Auth</text>
  </g>

  <!-- Orthogonal Connectors (drawn before step boxes) -->
  <!-- Step 1 (Agent) -> Step 2 (WebMCP) -->
  <path d="M 272 168 L 272 216" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#swim-arrow-link)"/>
  <!-- Step 2 (WebMCP) -> Step 3 (DOM) -->
  <path d="M 272 264 L 272 312" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#swim-arrow)"/>
  <!-- Step 3 (DOM) -> Step 4 (WebMCP Schema Return) -->
  <path d="M 352 336 L 448 336 Q 456 336 456 328 L 456 264" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#swim-arrow)"/>
  <!-- Step 4 (WebMCP) -> Step 5 (Agent Receives Schema) -->
  <path d="M 456 216 L 456 144 Q 456 136 464 136 L 520 136" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#swim-arrow-link)"/>
  <!-- Step 5 (Agent) -> Step 6 (WebMCP prepare_fill - Focal Coral!) -->
  <path d="M 608 168 L 608 216" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#swim-arrow-accent)"/>
  <!-- Step 6 (WebMCP prepare_fill) -> Step 7 (DOM Atomic Fill - Focal Coral!) -->
  <path d="M 608 264 L 608 312" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#swim-arrow-accent)"/>
  <!-- Step 7 (DOM) -> Step 8 (Fetch + WebBotAuth) -->
  <path d="M 696 336 L 784 336 Q 792 336 792 344 L 792 408" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#swim-arrow)"/>
  <!-- Step 8 (Fetch) -> Step 9 (Agent Result) -->
  <path d="M 880 432 L 920 432 Q 928 432 928 424 L 928 168" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#swim-arrow-link)"/>

  <!-- Arrow Label Masks (placed cleanly in open spaces with 6-10px margin) -->
  <rect x="380" y="314" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="410" y="324" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CONTROLS</text>

  <rect x="460" y="114" width="48" height="14" rx="2" fill="#ffffff"/>
  <text x="484" y="124" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SCHEMA</text>

  <rect x="616" y="185" width="76" height="14" rx="2" fill="#f8fafc"/>
  <text x="654" y="195" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FILL PLAN</text>

  <rect x="616" y="281" width="84" height="14" rx="2" fill="#ffffff"/>
  <text x="658" y="291" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ATOMIC FILL</text>

  <rect x="708" y="314" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="738" y="324" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SUBMIT</text>

  <!-- LANE 1 NODES (y=116, H=52) -->
  <g transform="translate(192 116)">
    <rect x="0" y="0" width="160" height="52" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="160" height="52" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="80" y="22" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">1. 请求页面可用工具</text>
    <text x="80" y="40" fill="#0369a1" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WebMCP.listTools()</text>
  </g>

  <g transform="translate(520 116)">
    <rect x="0" y="0" width="176" height="52" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="176" height="52" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="88" y="22" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">5. 生成强类型调用参数</text>
    <text x="88" y="40" fill="#0369a1" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">invokeTool({ user, plan })</text>
  </g>

  <g transform="translate(848 116)">
    <rect x="0" y="0" width="152" height="52" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="152" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="76" y="22" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">9. 接收导航回执</text>
    <text x="76" y="40" fill="#047857" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">navigation_result()</text>
  </g>

  <!-- LANE 2 NODES (y=216, H=48) -->
  <g transform="translate(192 216)">
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="80" y="20" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">2. 发现声明式表单</text>
    <text x="80" y="38" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">is_valid_tool_name(&lt;=128)</text>
  </g>

  <g transform="translate(376 216)">
    <rect x="0" y="0" width="128" height="48" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="128" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="64" y="20" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">4. 编译 Schema</text>
    <text x="64" y="38" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">input_schema()</text>
  </g>

  <!-- Focal Coral Node: prepare_fill -->
  <g transform="translate(520 212)">
    <rect x="0" y="0" width="176" height="52" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="176" height="52" rx="6" fill="#fff1f2" stroke="#bf4520" stroke-width="1.3"/>
    <text x="88" y="21" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">6. 全量校验填充计划</text>
    <text x="88" y="39" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">prepare_fill(): 错一即拒</text>
  </g>

  <!-- LANE 3 NODES (y=312, H=48) -->
  <g transform="translate(192 312)">
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <text x="80" y="20" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">3. 推导标签与 HTML5 约束</text>
    <text x="80" y="38" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">required · pattern · min/max</text>
  </g>

  <g transform="translate(520 312)">
    <rect x="0" y="0" width="176" height="48" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="176" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="88" y="20" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">7. 原生原子写入与派发</text>
    <text x="88" y="38" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Fill::Value + input/change</text>
  </g>

  <!-- LANE 4 NODE (y=408, H=48) -->
  <g transform="translate(704 408)">
    <rect x="0" y="0" width="176" height="48" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="176" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="88" y="20" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">8. RFC 9421 签名提交</text>
    <text x="88" y="38" fill="#047857" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sig1 Ed25519 · curl-rust</text>
  </g>

  <!-- Legend Strip -->
  <line x1="24" y1="504" x2="1016" y2="504" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="24" y="528" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="96" y1="524" x2="124" y2="524" stroke="#0284c7" stroke-width="1.4" marker-end="url(#swim-arrow-link)"/>
  <text x="134" y="528" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">外部协议与工具调用流</text>

  <line x1="300" y1="524" x2="328" y2="524" stroke="#bf4520" stroke-width="1.5" marker-end="url(#swim-arrow-accent)"/>
  <text x="338" y="528" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">零脏写原子校验焦距通道 (Focal)</text>

  <line x1="564" y1="524" x2="592" y2="524" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#swim-arrow)"/>
  <text x="602" y="528" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">只读回传 / 异步结果返回</text>
</svg>
