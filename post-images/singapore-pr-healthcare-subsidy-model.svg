<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-healthcare-subsidy-model-title singapore-pr-healthcare-subsidy-model-desc">
  <title id="singapore-pr-healthcare-subsidy-model-title">新加坡医疗多层次保障体系与公民/PR权益分层</title>
  <desc id="singapore-pr-healthcare-subsidy-model-desc">对比公立住院津贴上限、社区诊所CHAS卡覆盖与终身健保MediShield Life的分层待遇</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #047857; }
      .text-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #b91c1c; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡多层次医疗保障体系与身份分层透视</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">最高补贴绑定家庭经济状况审查（Means-Testing），底线是 PR 无法触达 50% 以上深水区</text>

  <!-- Left Column: Citizen -->
  <g transform="translate(40, 80)">
    <rect width="420" height="235" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="420" height="34" rx="8" fill="#d1fae5"/>
    <text x="210" y="22" class="text-green" text-anchor="middle">新加坡公民权益 (SC)</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="14" class="text-bold">1. 公立医院急性住院补贴 (Acute Subsidies)</text>
      <text x="0" y="34" class="text-green">最高补贴达 80%（B2/C 级病房）</text>
      <text x="0" y="50" class="text-sub">即便按家庭月均收入下调，仍享有 50%~80% 梯级安全网保护</text>
    </g>

    <line x1="20" y1="114" x2="400" y2="114" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 124)">
      <text x="0" y="14" class="text-bold">2. 社保援助计划 (CHAS 蓝/橙/绿卡)</text>
      <text x="0" y="34" class="text-green">公民独享！全岛上千家私人 GP 诊所看病直接抵扣</text>
      <text x="0" y="50" class="text-sub">涵盖日常感冒发烧与高血压、糖尿病等慢性病药物巨额直减</text>
    </g>

    <line x1="20" y1="184" x2="400" y2="184" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 194)">
      <text x="0" y="14" class="text-bold">3. 终身健保 (MediShield Life) &amp; MediSave</text>
      <text x="0" y="30" class="text-sub">强制全民覆盖，可使用公积金保健储蓄全额缴纳基础保费</text>
    </g>
  </g>

  <!-- Right Column: PR -->
  <g transform="translate(500, 80)">
    <rect width="420" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="420" height="34" rx="8" fill="#f1f5f9"/>
    <text x="210" y="22" class="card-title" text-anchor="middle">新加坡永久居民权益 (PR)</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="14" class="text-bold">1. 公立医院急性住院补贴 (Acute Subsidies)</text>
      <text x="0" y="34" class="text-red">最高补贴上限仅 50%（法定硬顶限）</text>
      <text x="0" y="50" class="text-sub">经收入审查后实际常在 25%~40%，大病极端账单自负比例显著偏高</text>
    </g>

    <line x1="20" y1="114" x2="400" y2="114" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 124)">
      <text x="0" y="14" class="text-bold">2. 社保援助计划 (CHAS 门诊直减)</text>
      <text x="0" y="34" class="text-red">完全无法申请！属于公民独占特权</text>
      <text x="0" y="50" class="text-sub">私人诊所与综合诊所门诊挂号、检查与药费均须承担更高自费额</text>
    </g>

    <line x1="20" y1="184" x2="400" y2="184" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 194)">
      <text x="0" y="14" class="text-bold">3. 终身健保 (MediShield Life) &amp; MediSave</text>
      <text x="0" y="30" class="text-sub">同样纳入大病保网，但无公民专属额外保费回扣（Pioneer/Merdeka）</text>
    </g>
  </g>
</svg>