<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-scheme-sniffing-flow-title ios-noir-scheme-sniffing-flow-desc" id="ios-noir-scheme-sniffing-flow-root">
        <title id="ios-noir-scheme-sniffing-flow-title">隐私刺探：LSApplicationQueriesSchemes 协议嗅探模型</title>
        <desc id="ios-noir-scheme-sniffing-flow-desc">应用在 Info.plist 中硬编码数百个竞争对手与金融应用暗号，后台遍历 canOpenURL 实现全景应用画像</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-scheme-sniffing-flow-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-scheme-sniffing-flow-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-scheme-sniffing-flow-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-scheme-sniffing-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-scheme-sniffing-flow-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-scheme-sniffing-flow-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Left: Probing App -->
        <g transform="translate(40, 60)">
          <rect x="0" y="0" width="240" height="220" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="240" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">PROBING APP</text>
          
          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">商业/社交应用客户端</text>
            <text x="0" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 某交友 / 某商旅超级 App</text>
            <text x="0" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 声明数十页 Scheme 白名单</text>
            <text x="0" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 借正常跳转接口暗中刺探</text>
            <text x="0" y="112" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">调用 canOpenURL: 接口</text>
          </g>
        </g>

        <!-- Middle: 280+ Sniffing List (Focal Accent) -->
        <g transform="translate(350, 40)">
          <rect x="0" y="0" width="260" height="260" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.05"/>
          <rect x="0" y="0" width="260" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">HARDCODED 280+ SCHEMES (FOCAL)</text>

          <g transform="translate(14, 48)">
            <text x="0" y="18" fill="#bf4520" font-family="'Geist', sans-serif" font-size="13" font-weight="600">硬编码嗅探暗号库拆解：</text>
            
            <text x="0" y="42" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" font-weight="600">1. 金融与私人银行 (50+)</text>
            <text x="0" y="58" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">cmb:// · icbc:// · ccb://</text>

            <text x="0" y="82" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" font-weight="600">2. 顶级超跑车联 (20+)</text>
            <text x="0" y="98" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">porsche:// · ferrari:// · tesla://</text>

            <text x="0" y="122" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" font-weight="600">3. 加密货币交易所 (30+)</text>
            <text x="0" y="138" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">binance:// · okx:// · imtoken://</text>

            <text x="0" y="162" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" font-weight="600">4. 竞品与婚恋交友 (40+)</text>
            <text x="0" y="178" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">tantanapp:// · zhihu://</text>
          </g>
        </g>

        <!-- Right: Privacy Profile -->
        <g transform="translate(680, 60)">
          <rect x="0" y="0" width="240" height="220" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="240" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">PROFILED OUTCOME</text>

          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#bf4520" font-family="'Geist', sans-serif" font-size="14" font-weight="600">资产阶级与财富画像</text>
            <text x="0" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 识别是否拥有豪车钥匙 App</text>
            <text x="0" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 识别是否具备加密资产偏好</text>
            <text x="0" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 匹配高净值理财推送标签</text>
            <text x="0" y="104" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 在交友推荐中给予权重加权</text>
            <text x="0" y="132" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">无感完成精准社会阶层定位</text>
          </g>
        </g>

        <!-- Connectors -->
        <path d="M 280 170 L 350 170" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-noir-scheme-sniffing-flow-arrow-accent)"/>
        <path d="M 610 170 L 680 170" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-noir-scheme-sniffing-flow-arrow-accent)"/>
      </svg>
