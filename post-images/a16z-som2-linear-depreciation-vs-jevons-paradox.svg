<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a16z-som2-linear-depreciation-vs-jevons-paradox-title a16z-som2-linear-depreciation-vs-jevons-paradox-desc">
  <title id="a16z-som2-linear-depreciation-vs-jevons-paradox-title">算力经济学双重推演：华尔街线性折旧陷阱 vs 产业分层利用与杰文斯悖论</title>
  <desc id="a16z-som2-linear-depreciation-vs-jevons-paradox-desc">对比空头预期的3-4年算力折旧归零导致资产减值，与产业真实分层算力调度、长任务推理爆发及老卡租金逆势坚挺</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-err { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #b91c1c; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #047857; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">算力经济学双重推演：华尔街线性折旧陷阱 vs 产业分层利用与杰文斯悖论</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">实证数据击碎“GPU 快速报废论”：分层计算与长任务调用爆发，使 A100 等老卡租金平稳坚挺</text>

  <!-- Left: Wall Street Trap -->
  <g transform="translate(40, 80)">
    <rect width="420" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="420" height="34" rx="8" fill="#f1f5f9"/>
    <text x="210" y="22" class="card-title" text-anchor="middle">华尔街空头悲观假设 (Linear Depreciation Trap)</text>
    <g transform="translate(20, 48)">
      <text x="0" y="14" class="badge-err">假设 1：采购旗舰 GPU 产生数千亿巨额 Capex</text>
      <text x="0" y="30" class="text-sub">自由现金流被严重侵蚀，资本开支吞噬盈利能力</text>
      <line x1="0" y1="46" x2="380" y2="46" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="66" class="badge-err">假设 2：3~4 年摩尔定律迭代使老卡迅速淘汰过时</text>
      <text x="0" y="82" class="text-sub">新架构性能翻倍，导致上一代显卡失去经济租赁价值</text>
      <line x1="0" y1="98" x2="380" y2="98" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="118" class="badge-err">假设 3：残值光速归零，引发上千亿美元资产减值风暴</text>
      <text x="0" y="134" class="text-sub">空头以此断言云厂商 ROI 无法闭环，终将遭遇资产负债表雪崩</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 470 197 L 500 197" stroke="#047857" stroke-width="2" fill="none"/>

  <!-- Right: Industry Reality (Focal Green) -->
  <g transform="translate(500, 80)">
    <rect width="420" height="235" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="420" height="34" rx="8" fill="#d1fae5"/>
    <text x="210" y="22" class="badge-ok" text-anchor="middle">产业微观现实 (Tiered Compute &amp; Jevons Paradox)</text>
    <g transform="translate(20, 48)">
      <text x="0" y="14" class="badge-ok">现实 1：分层算力利用架构 (Tiered Compute)</text>
      <text x="0" y="30" class="text-sub">前沿模型预训练向上聚集；微调/量化推理/RAG 向下兼容老卡</text>
      <line x1="0" y1="46" x2="380" y2="46" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="66" class="badge-ok">现实 2：杰文斯悖论全面接管算力消费</text>
      <text x="0" y="82" class="text-sub">推理 Token 单价暴跌 90%+，反向刺激多轮思考与 Agent 调用指数级爆发</text>
      <line x1="0" y1="98" x2="380" y2="98" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="118" class="badge-ok">现实 3：老卡现货租金平稳甚至走高，折旧年限顺延至 5~6 年</text>
      <text x="0" y="134" class="text-sub">算力资产全生命周期产生充沛正现金流，折旧神话彻底破灭</text>
    </g>
  </g>
</svg>