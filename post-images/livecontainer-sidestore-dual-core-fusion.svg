<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrowBlue_lc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowCoral_lc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrowGreen_lc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="720" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="672" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="260" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0369a1" font-size="11" font-weight="700" letter-spacing="1">UNIFIED DUAL-CORE RUNTIME ARCHITECTURE</text>
    <text x="0" y="52" fill="#0f172a" font-size="22" font-weight="700">LiveContainer+SideStore 双核合一：破除槽位死局的工程解构</text>
    <text x="0" y="74" fill="#475569" font-size="13">解密如何通过 dylibify 动态库化、Swift 符号反射、XPC 管道与 Bundle Swizzling，将双工具无损熔铸为单槽位应用</text>
  </g>

  <!-- Section 1: Slot Allocation Paradigm Delta (Top Panel) -->
  <g transform="translate(56, 148)">
    <rect width="988" height="152" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="16" y="14" width="280" height="26" rx="6" fill="#f1f5f9" />
    <text x="26" y="31" fill="#0f172a" font-size="12" font-weight="700">iOS 免费开发者账号：槽位消耗与可用空间对比</text>

    <!-- Sub Card: Traditional Split Sideloading (Left) -->
    <g transform="translate(16, 50)">
      <rect width="466" height="88" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" />
      <text x="14" y="24" fill="#e11d48" font-size="12" font-weight="700">传统割裂方案：SideStore + LiveContainer 独立安装</text>
      <text x="14" y="44" fill="#334155" font-size="11">· 槽位 1 占用：SideStore 原生 App（负责脱机环回续签）</text>
      <text x="14" y="62" fill="#334155" font-size="11">· 槽位 2 占用：LiveContainer 宿主 App（负责应用容器多开）</text>
      <text x="14" y="80" fill="#be123c" font-size="11" font-weight="600">· 🚨 致命缺陷：3 个免费名额已用其 2，真机仅剩 1 个独立 App 槽位！</text>
    </g>

    <!-- Sub Card: Unified Dual-Core Fusion (Right) -->
    <g transform="translate(506, 50)">
      <rect width="466" height="88" rx="8" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.2" />
      <text x="14" y="24" fill="#059669" font-size="12" font-weight="700">官方双核合体版：LiveContainer+SideStore.ipa (LC+SS)</text>
      <text x="14" y="44" fill="#334155" font-size="11">· 槽位 1 独占：LiveContainer 统一宿主（内嵌 SideStore 动态引擎）</text>
      <text x="14" y="62" fill="#0284c7" font-size="11">· ✨ 槽位 2 &amp; 3 完全空闲：供系统 VPN、独立桌面插件或高特权 App 使用</text>
      <text x="14" y="80" fill="#047857" font-size="11" font-weight="600">· 🏆 终极破局：0 电脑脱机自动续签 + 沙盒内容器无限多开完美兼得！</text>
    </g>
  </g>

  <!-- Section 2: Internal Engineering Pillars (Bottom Grid) -->
  <g transform="translate(56, 320)">
    <rect width="988" height="348" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="16" y="14" width="340" height="26" rx="6" fill="#f1f5f9" />
    <text x="26" y="31" fill="#0f172a" font-size="12" font-weight="700">LiveContainer+SideStore 底层深度熔铸流水线</text>

    <!-- Pillar 1: dylibify Mach-O Transformation -->
    <g transform="translate(16, 52)">
      <rect width="308" height="136" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
      <text x="14" y="24" fill="#0284c7" font-size="12" font-weight="700">1. 二进制变形：dylibify 动态库化</text>
      <text x="14" y="46" fill="#334155" font-size="11">· 提取 SideStore.app 二进制执行体</text>
      <text x="14" y="66" fill="#334155" font-size="11">· 修改 Mach-O 文件头：MH_EXECUTE → MH_DYLIB</text>
      <text x="14" y="86" fill="#334155" font-size="11">· 注入为 SideStoreApp.framework 供宿主动态链接</text>
      <text x="14" y="106" fill="#334155" font-size="11">· 采用 ldid -S 重新签署轻量 Ad-hoc 签名</text>
      <text x="14" y="124" fill="#64748b" font-size="10">彻底消灭单机双进程独立签名的槽位冗余</text>
    </g>

    <!-- Pillar 2: Swift Mangled Type Reflection -->
    <g transform="translate(340, 52)">
      <rect width="308" height="136" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
      <text x="14" y="24" fill="#0284c7" font-size="12" font-weight="700">2. Swift 动态符号穿透调用</text>
      <text x="14" y="46" fill="#334155" font-size="11">· 规避 Swift 严格跨模块符号隔离限制</text>
      <text x="14" y="66" fill="#334155" font-size="11">· 运行时调用 _getTypeByMangledNameInContext</text>
      <text x="14" y="86" fill="#334155" font-size="11">· 动态定位 9SideStore20RefreshAllAppsIntentV</text>
      <text x="14" y="106" fill="#334155" font-size="11">· 无缝派发 ProgressReportingIntent 异步刷新事件</text>
      <text x="14" y="124" fill="#64748b" font-size="10">实现无静态编译依赖的高灵活性跨核调度</text>
    </g>

    <!-- Pillar 3: XPC Daemon &amp; AppExtension -->
    <g transform="translate(664, 52)">
      <rect width="308" height="136" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
      <text x="14" y="24" fill="#0284c7" font-size="12" font-weight="700">3. LiveProcess 跨进程守护管道</text>
      <text x="14" y="46" fill="#334155" font-size="11">· 封装独立 LiveProcess.appex 插件进程</text>
      <text x="14" y="66" fill="#334155" font-size="11">· 建立匿名 NSXPCListener 与 XPCServer 通信</text>
      <text x="14" y="86" fill="#334155" font-size="11">· 后台自动化续签无需拉起 LiveContainer 主前台</text>
      <text x="14" y="106" fill="#334155" font-size="11">· 双向同步刷新进度与错误状态码</text>
      <text x="14" y="124" fill="#64748b" font-size="10">保障快捷指令后台刷新 0 界面打扰与稳定性</text>
    </g>

    <!-- Pillar 4: Runtime Swizzling &amp; App Groups -->
    <g transform="translate(16, 200)">
      <rect width="470" height="134" rx="8" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1.2" />
      <text x="14" y="24" fill="#059669" font-size="12" font-weight="700">4. 运行时身份偷换与 App Group 统一</text>
      <text x="14" y="46" fill="#334155" font-size="11">· Swizzle NSBundle.appbundleIdentifier → com.kdt.livecontainer</text>
      <text x="14" y="66" fill="#334155" font-size="11">· Swizzle NSBundle.altstoreAppGroup → LCSharedUtils.appGroupID</text>
      <text x="14" y="86" fill="#334155" font-size="11">· 挂钩 UNUserNotificationCenter 本地通知代理分发</text>
      <text x="14" y="106" fill="#334155" font-size="11">· 统一 Info.plist 的 ALTAppGroups 与 URL Schemes 协议池</text>
      <text x="14" y="124" fill="#64748b" font-size="10">消除嵌入后沙盒数据路径漂移与权限撕裂问题</text>
    </g>

    <!-- Pillar 5: Escape Hatch &amp; UI Seamless Switching -->
    <g transform="translate(502, 200)">
      <rect width="470" height="134" rx="8" fill="#f8fafc" stroke="#fecdd3" stroke-width="1.2" />
      <text x="14" y="24" fill="#e11d48" font-size="12" font-weight="700">5. 逃逸舱交互设计与双核无缝切换</text>
      <text x="14" y="46" fill="#334155" font-size="11">· SideStore 导航栏动态注入 SF Symbol escape 实体按钮</text>
      <text x="14" y="66" fill="#334155" font-size="11">· 点击触发 launchToGuestAppWithClassicMode 返回容器主桌面</text>
      <text x="14" y="86" fill="#334155" font-size="11">· PassthroughWindow 浮层动态展示 LC+SS+iOS 联合构建版本</text>
      <text x="14" y="106" fill="#334155" font-size="11">· LiveContainer 主界面提供原生一键启动与证书同步入口</text>
      <text x="14" y="124" fill="#64748b" font-size="10">既是强悍的自签续签服务站，又是丝滑的容器启动中心</text>
    </g>
  </g>
</svg>