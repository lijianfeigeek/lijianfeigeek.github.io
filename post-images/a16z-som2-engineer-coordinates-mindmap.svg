<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a16z-som2-engineer-coordinates-mindmap-title a16z-som2-engineer-coordinates-mindmap-desc">
  <title id="a16z-som2-engineer-coordinates-mindmap-title">2026 技术从业者坐标系：物理阻力、重构护城河与驾驭杰文斯悖论</title>
  <desc id="a16z-som2-engineer-coordinates-mindmap-desc">为技术工程师指明理解物理世界热力学阻力、沉淀业务流与专有数据护城河，以及拥抱长任务多智能体的核心坐标</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">2026 工程师与创业者坐标系：在算法狂欢与物理现实之间建立硬核壁垒</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">拒绝冷冰冰的金融泡沫论，一线技术人必须将认知锚定在物理摩擦力、业务流沉淀与自主 Agent 网络上</text>

  <!-- Axis 1: Physical Friction -->
  <g transform="translate(40, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">坐标一：尊重物理世界的工程摩擦力</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title" fill="#0284c7">算力的天花板由热力学定律把守</text>
      <text x="0" y="32" class="text-sub">• 理解光模块通信带宽、机架风冷与液冷</text>
      <text x="0" y="50" class="text-sub">• 掌握分布式集群异构调度与能效比 (PUE)</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="88" class="card-title">软硬件全栈协同成为稀缺资产</text>
      <text x="0" y="106" class="text-sub">• 关注芯片先进制程、内存墙与先进封装</text>
      <text x="0" y="124" class="text-sub">• 深入机器人高精度电机与边缘物理控制</text>
      <text x="0" y="142" class="card-title">代码最终必须在物理世界安全着陆</text>
    </g>
  </g>

  <!-- Axis 2: Moat (Focal Coral) -->
  <g transform="translate(345, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#ffedd5"/>
    <text x="135" y="22" class="badge-coral" text-anchor="middle">坐标二：重构系统级真实护城河</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="badge-coral">拒绝脆弱的浅层 API 包装壳</text>
      <text x="0" y="32" class="text-sub">• 简单套壳 UI 会被底层模型升级瞬间抹平</text>
      <text x="0" y="50" class="text-sub">• 必须沉淀不可逆的复杂业务流程状态</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#fed7aa" stroke-width="1"/>
      <text x="0" y="88" class="card-title">占领不可复制的私有数据资产</text>
      <text x="0" y="106" class="text-sub">• 构建专有清洗流水线与闭环反馈日志</text>
      <text x="0" y="124" class="text-sub">• 扎根在零容错率的企业安全与合规深水区</text>
      <text x="0" y="142" class="badge-coral">护城河隐藏在业务复杂度与切换成本中</text>
    </g>
  </g>

  <!-- Axis 3: Jevons &amp; Multi-Agent -->
  <g transform="translate(650, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">坐标三：站在杰文斯悖论右侧</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title" fill="#047857">每一次降价都是新物种催化剂</text>
      <text x="0" y="32" class="text-sub">• 将更便宜的 Token 转化为深度反思与规划</text>
      <text x="0" y="50" class="text-sub">• 探索混合精度量化与开源/闭源模型动态路由</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="88" class="card-title">押注多智能体深度网络 (Multi-Agent)</text>
      <text x="0" y="106" class="text-sub">• 从单轮问答走向长达数小时的连续任务编排</text>
      <text x="0" y="124" class="text-sub">• 让人工智能真正融入真实世界的工程生产力</text>
      <text x="0" y="142" class="card-title">智力越便宜，复杂自动化网络越繁荣</text>
    </g>
  </g>
</svg>