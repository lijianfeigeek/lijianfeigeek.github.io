<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="ils-sw-title ils-sw-desc" id="ios-location-spoofer-auth-swimlane-root">
        <title id="ils-sw-title">四域协同鉴权、坐标纠偏与动态定位同步泳道图</title>
        <desc id="ils-sw-desc">展示 Safari PWA 前端、Cloudflare Pages 边缘网关、Shadowrocket MITM 引擎与 iOS locationd 之间从 Token 校验、GCJ-02/WGS-84 坐标转换、KV 持久化到实时拉取改写的跨泳道交互过程。</desc>
        <defs>
      <style>#ios-location-spoofer-auth-swimlane-root { --color-paper: #f8fafc;
      --color-ink: #1e293b;
      --color-muted: #475569;
      --color-accent: #bf4520;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', Georgia, serif;
      --font-mono: 'Geist Mono', 'SFMono-Regular', ui-monospace, monospace; }
      #ios-location-spoofer-auth-swimlane-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-location-spoofer-auth-swimlane-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ios-location-spoofer-auth-swimlane-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="ios-location-spoofer-auth-swimlane-dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.24"/>
          </pattern>
          <marker id="ios-location-spoofer-auth-swimlane-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="ios-location-spoofer-auth-swimlane-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
          </marker>
          <marker id="ios-location-spoofer-auth-swimlane-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="ios-location-spoofer-auth-swimlane-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
          </marker>
        </defs>

        <rect width="960" height="540" fill="#f8fafc"/>
        <rect width="960" height="540" fill="url(#ios-location-spoofer-auth-swimlane-dots)"/>

        <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">Cross-Domain Auth, Coordinate Transform &amp; MITM Sync</text>
        <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">HTMLREWRITER TOKEN GUARD · GCJ-02 &lt;-&gt; WGS-84 · CLOUDFLARE KV · CONFIGURL HOT-POLLING</text>

        <!-- Phase Headers -->
        <g transform="translate(152, 72)">
          <rect x="0" y="0" width="168" height="24" rx="4" fill="#e2e8f0"/>
          <text x="84" y="16" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#334155">01 · BOOT &amp; AUTH</text>
        </g>
        <g transform="translate(340, 72)">
          <rect x="0" y="0" width="168" height="24" rx="4" fill="#e2e8f0"/>
          <text x="84" y="16" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#334155">02 · PICK &amp; LOCK</text>
        </g>
        <g transform="translate(528, 72)">
          <rect x="0" y="0" width="184" height="24" rx="4" fill="#bf4520"/>
          <text x="92" y="16" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#ffffff">03 · MITM PULL &amp; PATCH</text>
        </g>
        <g transform="translate(732, 72)">
          <rect x="0" y="0" width="196" height="24" rx="4" fill="#e2e8f0"/>
          <text x="98" y="16" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#334155">04 · SYSTEM REFRESH</text>
        </g>

        <!-- Swimlane Backgrounds -->
        <rect x="28" y="108" width="904" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="28" y="204" width="904" height="88" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="28" y="300" width="904" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="28" y="396" width="904" height="88" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
        <line x1="144" y1="108" x2="144" y2="484" stroke="#cbd5e1" stroke-width="1"/>

        <!-- Lane Labels -->
        <g transform="translate(36, 136)">
          <text x="0" y="12" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0284c7">LANE 01</text>
          <text x="0" y="28" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Safari PWA</text>
        </g>
        <g transform="translate(36, 232)">
          <text x="0" y="12" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569">LANE 02</text>
          <text x="0" y="28" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">CF Edge + KV</text>
        </g>
        <g transform="translate(36, 328)">
          <text x="0" y="12" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#bf4520">LANE 03</text>
          <text x="0" y="28" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Shadowrocket</text>
        </g>
        <g transform="translate(36, 424)">
          <text x="0" y="12" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#059669">LANE 04</text>
          <text x="0" y="28" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">iOS locationd</text>
        </g>

        <!-- Connectors (drawn before nodes) -->
        <!-- CF Edge HTMLRewriter -> Safari PWA Login -->
        <line x1="236" y1="216" x2="236" y2="184" stroke="#0284c7" stroke-width="1.4" marker-end="url(#ios-location-spoofer-auth-swimlane-arrow-link)"/>
        <!-- Safari PWA Login -> Pick & GCJ Transform -->
        <line x1="320" y1="152" x2="340" y2="152" stroke="#475569" stroke-width="1.4" marker-end="url(#ios-location-spoofer-auth-swimlane-arrow)"/>
        <!-- Pick & Lock -> CF Edge POST /set -->
        <line x1="424" y1="184" x2="424" y2="216" stroke="#0284c7" stroke-width="1.4" marker-end="url(#ios-location-spoofer-auth-swimlane-arrow-link)"/>
        <!-- CF Edge KV -> Shadowrocket configUrl pull (Coral focal handoff!) -->
        <path d="M 508 248 L 612 248 Q 620 248 620 256 L 620 312" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#ios-location-spoofer-auth-swimlane-arrow-accent)"/>
        <rect x="524" y="226" width="84" height="16" rx="2" fill="#f1f5f9"/>
        <text x="566" y="238" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">GET /loc.json</text>

        <!-- iOS locationd Toggle -> Shadowrocket Intercept -->
        <path d="M 732 440 L 672 440 Q 664 440 664 432 L 664 376" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ios-location-spoofer-auth-swimlane-arrow)"/>
        <rect x="676" y="420" width="48" height="16" rx="2" fill="#f1f5f9"/>
        <text x="700" y="432" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">WLOC</text>

        <!-- Shadowrocket Patched -> iOS locationd Apply -->
        <path d="M 712 344 L 822 344 Q 830 344 830 352 L 830 408" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ios-location-spoofer-auth-swimlane-arrow-ok)"/>
        <rect x="740" y="322" width="76" height="16" rx="2" fill="#ffffff"/>
        <text x="778" y="334" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#059669">PATCHED 200</text>

        <!-- Nodes -->
        <!-- L2 Col 1: HTMLRewriter -->
        <g transform="translate(152, 216)">
          <rect x="0" y="0" width="168" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
          <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">EDGE · FUNCTIONS</text>
          <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">HTMLRewriter 脱敏注入</text>
          <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">仅注入 hasToken 布尔值</text>
        </g>

        <!-- L1 Col 1: Login Session -->
        <g transform="translate(152, 120)">
          <rect x="0" y="0" width="168" height="64" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
          <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#0284c7">CLIENT · AUTH</text>
          <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">30 天本地免密会话</text>
          <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">GET /verify?token=...</text>
        </g>

        <!-- L1 Col 2: Pick & GCJ Transform -->
        <g transform="translate(340, 120)">
          <rect x="0" y="0" width="168" height="64" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
          <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#0284c7">CLIENT · MAP</text>
          <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">选点纠偏与海拔拉取</text>
          <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">GCJ-02 -&gt; WGS-84 · 800ms</text>
        </g>

        <!-- L2 Col 2: KV Persist -->
        <g transform="translate(340, 216)">
          <rect x="0" y="0" width="168" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
          <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">KV · STORAGE</text>
          <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">POST /set 写入 KV</text>
          <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">SPOOFER_DATA.put('loc')</text>
        </g>

        <!-- L3 Col 3: Shadowrocket Hook (Focal) -->
        <g transform="translate(528, 312)">
          <rect x="0" y="0" width="184" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
          <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#bf4520">MITM · FOCAL</text>
          <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">动态拉取配置并改写</text>
          <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">timeout=5s · 覆写 lat/lng/hAcc</text>
        </g>

        <!-- L4 Col 4: System Toggle & Apply -->
        <g transform="translate(732, 408)">
          <rect x="0" y="0" width="196" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
          <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#059669">TARGET · SYSTEM</text>
          <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#065f46">关闭定位 10s 重开生效</text>
          <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#059669">刷新缓存并注入 CoreLocation</text>
        </g>

        <!-- Legend -->
        <line x1="28" y1="496" x2="932" y2="496" stroke="#e2e8f0" stroke-width="1"/>
        <g transform="translate(32, 514)">
          <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
          <rect x="76" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
          <text x="98" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">跨域热点交接：拦截瞬间同步拉取 Cloudflare KV 坐标</text>
          <rect x="468" y="-8" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
          <text x="490" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#059669">系统缓存失效与模拟定位落地</text>
        </g>
      </svg>
