<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="440" viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-fingerprint-2bit-state-machine-title ios-fingerprint-2bit-state-machine-desc" id="ios-fingerprint-2bit-state-machine-root">
        <title id="ios-fingerprint-2bit-state-machine-title">DeviceCheck 2-bit 状态机风控流转模型</title>
        <desc id="ios-fingerprint-2bit-state-machine-desc">Apple DeviceCheck 四态 (00/01/10/11) 状态迁移与跨抹机持久封禁闭环模型</desc>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-fingerprint-2bit-state-machine-root { --color-paper:   #f8f9fa;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ios-fingerprint-2bit-state-machine-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-fingerprint-2bit-state-machine-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <marker id="ios-fingerprint-2bit-state-machine-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ios-fingerprint-2bit-state-machine-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
      </marker>
      <marker id="ios-fingerprint-2bit-state-machine-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <pattern id="ios-fingerprint-2bit-state-machine-dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <rect width="100%" height="100%" fill="url(#ios-fingerprint-2bit-state-machine-dots)" opacity="0.6"/>

        <!-- Initial Entry -->
        <g id="init-entry" transform="translate(40, 160)">
          <rect x="0" y="0" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <rect x="16" y="16" width="56" height="20" rx="2" fill="#2d3142" fill-opacity="0.10"/>
          <text x="44" y="30" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">INIT</text>
          <text x="82" y="31" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14">状态 00: 干净新机</text>
          <text x="16" y="62" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">从未参与业务的设备</text>
          <text x="16" y="82" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">享有新人首单权益</text>
        </g>

        <!-- State 01: Normal (Claimed) -->
        <g id="state-01" transform="translate(380, 50)">
          <rect x="0" y="0" width="220" height="90" rx="6" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1.2" fill-opacity="0.05"/>
          <rect x="16" y="16" width="60" height="20" rx="2" fill="#2e5aa8"/>
          <text x="46" y="30" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">ACTIVE</text>
          <text x="86" y="31" fill="#2e5aa8" font-family="'Geist', sans-serif" font-weight="600" font-size="14">状态 01: 正常活跃</text>
          <text x="16" y="58" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">权益已领取 · 正常履约留存</text>
          <text x="16" y="76" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">防抹机后重复套利</text>
        </g>

        <!-- State 10: Suspicious -->
        <g id="state-10" transform="translate(380, 280)">
          <rect x="0" y="0" width="220" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <rect x="16" y="16" width="60" height="20" rx="2" fill="#2d3142" fill-opacity="0.10"/>
          <text x="46" y="30" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">WATCH</text>
          <text x="86" y="31" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14">状态 10: 疑似风险</text>
          <text x="16" y="58" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">命中轻微特征 · 限制权益</text>
          <text x="16" y="76" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">要求人脸/短信二次核身</text>
        </g>

        <!-- State 11: Banned (Accent Focal) -->
        <g id="state-11" transform="translate(710, 160)">
          <rect x="0" y="0" width="210" height="100" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <rect x="16" y="16" width="56" height="20" rx="2" fill="#bf4520"/>
          <text x="44" y="30" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">BANNED</text>
          <text x="82" y="31" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="14">状态 11: 高危黑产</text>
          <text x="16" y="62" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12">越狱/群控/多开作恶实锤</text>
          <text x="16" y="82" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11">全域阻断 · 无法洗白</text>
        </g>

        <!-- Transitions: 00 -> 01 -->
        <path d="M 240 180 Q 300 180 300 110 Q 300 95 375 95" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-fingerprint-2bit-state-machine-arrow-link)"/>
        <rect x="250" y="85" width="100" height="20" rx="3" fill="#ffffff"/>
        <text x="300" y="99" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">完成新人首单</text>

        <!-- Transitions: 00 -> 10 -->
        <path d="M 240 240 Q 300 240 300 310 Q 300 325 375 325" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-2bit-state-machine-arrow)"/>
        <rect x="250" y="315" width="100" height="20" rx="3" fill="#ffffff"/>
        <text x="300" y="329" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">触发中危风控规则</text>

        <!-- Transitions: 00 -> 11 (Direct ban) -->
        <path d="M 240 210 L 705 210" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-fingerprint-2bit-state-machine-arrow-accent)"/>
        <rect x="420" y="200" width="130" height="20" rx="3" fill="#ffffff"/>
        <text x="485" y="214" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">重度黑产特征直接封杀</text>

        <!-- Transitions: 10 -> 01 (Verification Passed) -->
        <path d="M 450 280 L 450 145" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ios-fingerprint-2bit-state-machine-arrow)"/>
        <rect x="410" y="195" width="80" height="20" rx="3" fill="#ffffff"/>
        <text x="450" y="209" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">二次核身通过</text>

        <!-- Transitions: 10 -> 11 -->
        <path d="M 600 325 Q 650 325 650 250 Q 650 230 705 230" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-fingerprint-2bit-state-machine-arrow-accent)"/>

        <!-- Transitions: 01 -> 11 -->
        <path d="M 600 95 Q 650 95 650 170 Q 650 190 705 190" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-fingerprint-2bit-state-machine-arrow-accent)"/>
        <rect x="620" y="130" width="70" height="20" rx="3" fill="#ffffff"/>
        <text x="655" y="144" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">恶意退款作恶</text>

        <!-- Bottom Persistence Guarantee -->
        <g transform="translate(240, 390)">
          <rect x="0" y="0" width="480" height="34" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-opacity="0.3"/>
          <text x="240" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">云端 2-BIT 状态持久保留 · 抹机重置 / 卸载重装无法洗白逃逸</text>
        </g>
      </svg>
