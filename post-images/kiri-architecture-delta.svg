<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="kiri-delta-title kiri-delta-desc" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="kiri-delta-title">Docker Desktop/OrbStack 与 Kiri 容器运行时拓扑演进对比</title>
  <desc id="kiri-delta-desc">对比传统容器引擎与 Kiri 的分层架构差异：Kiri 移除了 dockerd、containerd、per-container shim 与 runc，以 9MB 宿主机守护进程配合 vsock 与 650KB 静态 Rust PID 1 实现 2.55 毫秒启动。</desc>
  <defs>
    <marker id="kd-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="kd-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="kd-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="620" fill="#f8fafc"/>

  <!-- Header -->
  <g transform="translate(36, 20)">
    <rect x="0" y="0" width="888" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" font-size="16" font-weight="700" fill="#0f172a">架构拓扑演进：传统 Docker/OrbStack 栈 vs. Kiri 极简原生运行时</text>
    <text x="20" y="42" font-size="11" fill="#475569">砍掉四层中间件，将容器生命周期压缩至单次 clone3 系统调用与 31 µs vsock 往返</text>
    <rect x="748" y="14" width="124" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="810" y="30" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#475569" text-anchor="middle">ARCHITECTURE DELTA</text>
  </g>

  <!-- Panel 1: BEFORE -->
  <g transform="translate(36, 88)">
    <rect x="0" y="0" width="292" height="444" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="292" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="23" font-size="12" font-weight="700" fill="#334155">Before · 传统容器引擎栈</text>
    <text x="276" y="23" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="end">213~380 ms</text>

    <!-- Connectors (drawn before nodes) -->
    <path d="M 146 100 L 146 124" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#kd-arrow-muted)"/>
    <path d="M 146 180 L 146 204" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#kd-arrow-muted)"/>
    <path d="M 146 260 L 146 284" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#kd-arrow-muted)"/>
    <path d="M 146 340 L 146 364" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#kd-arrow-muted)"/>

    <!-- Node 1 -->
    <g transform="translate(24, 52)">
      <rect x="0" y="0" width="244" height="48" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <text x="122" y="20" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">docker CLI / Compose / Buildx</text>
      <text x="122" y="37" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="middle">Docker Engine REST API</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(24, 128)">
      <rect x="0" y="0" width="244" height="52" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
      <text x="17" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#475569" text-anchor="middle">Δ</text>
      <text x="130" y="22" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">dockerd + containerd</text>
      <text x="130" y="39" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">常驻内存 216 MB · 双守护进程</text>
    </g>

    <!-- Node 3: Removed -->
    <g transform="translate(24, 208)">
      <rect x="0" y="0" width="244" height="52" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
      <text x="17" y="18" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#e11d48" text-anchor="middle">-</text>
      <text x="130" y="22" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">containerd-shim × N</text>
      <text x="130" y="39" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#be123c" text-anchor="middle">每容器 7.9 MB (143容器=1133MB)</text>
    </g>

    <!-- Node 4: Removed -->
    <g transform="translate(24, 288)">
      <rect x="0" y="0" width="244" height="52" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
      <text x="17" y="18" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#e11d48" text-anchor="middle">-</text>
      <text x="130" y="22" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">runc (一次性 fork/exec)</text>
      <text x="130" y="39" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#be123c" text-anchor="middle">Go 运行时启动 + cgroup/ns 多次调用</text>
    </g>

    <!-- Node 5 -->
    <g transform="translate(24, 368)">
      <rect x="0" y="0" width="244" height="56" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
      <text x="17" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#475569" text-anchor="middle">Δ</text>
      <text x="130" y="23" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Stock Defconfig Kernel</text>
      <text x="130" y="40" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">32 MB 内核镜像 · 810 ms VM冷启</text>
    </g>
  </g>

  <!-- Panel 2: CHANGES LEDGER -->
  <g transform="translate(348, 88)">
    <rect x="0" y="0" width="264" height="444" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="264" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="132" y="23" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Changes Ledger · 核心变更清册</text>

    <!-- Entry 1 -->
    <g transform="translate(12, 52)">
      <rect x="0" y="0" width="240" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#2e5aa8">CHANGED · daemon</text>
      <text x="10" y="36" font-size="11" fill="#0f172a">双守护进程合并为单 Rust 进程</text>
      <text x="10" y="52" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">216 MB → 9.0 MB (Mac) + 0.69 MB</text>
    </g>

    <!-- Entry 2 -->
    <g transform="translate(12, 128)">
      <rect x="0" y="0" width="240" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#e11d48">REMOVED · containerd-shim</text>
      <text x="10" y="36" font-size="11" fill="#0f172a">零 per-container shim 代理进程</text>
      <text x="10" y="52" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9f1239">PID 1 直接 signalfd + poll() 监管</text>
    </g>

    <!-- Entry 3 -->
    <g transform="translate(12, 204)">
      <rect x="0" y="0" width="240" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#e11d48">REMOVED · runc</text>
      <text x="10" y="36" font-size="11" fill="#0f172a">消除外部 OCI CLI 进程拉起开销</text>
      <text x="10" y="52" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9f1239">单次 clone3(CLONE_INTO_CGROUP)</text>
    </g>

    <!-- Entry 4 -->
    <g transform="translate(12, 280)">
      <rect x="0" y="0" width="240" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#059669">ADDED · kiri-proto (vsock)</text>
      <text x="10" y="36" font-size="11" fill="#0f172a">no_std 零分配二进制帧总线</text>
      <text x="10" y="52" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#047857">31 µs p50 · 4 MiB stdin 流控</text>
    </g>

    <!-- Entry 5 -->
    <g transform="translate(12, 356)">
      <rect x="0" y="0" width="240" height="72" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520">CHANGED · guest/kernel</text>
      <text x="10" y="36" font-size="11" fill="#0f172a">allnoconfig + 5 项外科内核补丁</text>
      <text x="10" y="52" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">10.2 MB 镜像 · 112 ms VM 冷启动</text>
      <text x="10" y="65" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">闲置 60s 自动关机，0.15s 唤醒</text>
    </g>
  </g>

  <!-- Panel 3: AFTER -->
  <g transform="translate(632, 88)">
    <rect x="0" y="0" width="292" height="444" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="292" height="36" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="23" font-size="12" font-weight="700" fill="#9a3412">After · Kiri 原生极速架构</text>
    <text x="276" y="23" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520" text-anchor="end">2.55 ms</text>

    <!-- Connectors (drawn before nodes) -->
    <path d="M 146 100 L 146 124" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#kd-arrow-link)"/>
    <path d="M 146 180 L 146 204" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#kd-arrow-accent)"/>
    <path d="M 146 260 L 146 284" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#kd-arrow-accent)"/>
    <path d="M 146 340 L 146 364" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#kd-arrow-accent)"/>

    <!-- Node 1 -->
    <g transform="translate(24, 52)">
      <rect x="0" y="0" width="244" height="48" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <text x="122" y="20" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">docker CLI / Compose / kiri UI</text>
      <text x="122" y="37" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="middle">~/.kiri/run/docker.sock</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(24, 128)">
      <rect x="0" y="0" width="244" height="52" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1.2"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#dbeafe" stroke="#2e5aa8" stroke-width="0.8"/>
      <text x="17" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#2e5aa8" text-anchor="middle">Δ</text>
      <text x="130" y="22" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">kiri daemon (宿主机常驻)</text>
      <text x="130" y="39" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1e40af" text-anchor="middle">9.0 MB 内存 · 镜像拉取/API/VMM</text>
    </g>

    <!-- Node 3: Added -->
    <g transform="translate(24, 208)">
      <rect x="0" y="0" width="244" height="52" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#dcfce7" stroke="#059669" stroke-width="0.8"/>
      <text x="17" y="19" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#059669" text-anchor="middle">+</text>
      <text x="130" y="22" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">vsock 零分配帧协议</text>
      <text x="130" y="39" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#047857" text-anchor="middle">kiri-proto · 31 µs RTT · 无锁流</text>
    </g>

    <!-- Node 4: Focal -->
    <g transform="translate(24, 288)">
      <rect x="0" y="0" width="244" height="52" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#ffedd5" stroke="#bf4520" stroke-width="0.8"/>
      <text x="17" y="19" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">★</text>
      <text x="130" y="22" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">kiri-init (Guest PID 1)</text>
      <text x="130" y="39" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412" text-anchor="middle">650 KB 二进制 · 单线程 poll() + clone3</text>
    </g>

    <!-- Node 5 -->
    <g transform="translate(24, 368)">
      <rect x="0" y="0" width="244" height="56" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="8" width="14" height="14" rx="2" fill="#f1f5f9" stroke="#334155" stroke-width="0.8"/>
      <text x="17" y="18" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#334155" text-anchor="middle">Δ</text>
      <text x="130" y="23" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">定制 10.2 MB Linux 内核</text>
      <text x="130" y="40" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">8 ms 进 PID 1 · 手写 netlink/seccomp</text>
    </g>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(36, 548)">
    <rect x="0" y="0" width="888" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="18" width="16" height="16" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="40" y="30" font-size="11" fill="#334155">REMOVED 已剔除冗余层</text>

    <rect x="200" y="18" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <text x="224" y="30" font-size="11" fill="#334155">ADDED 新增零分配总线</text>

    <rect x="388" y="18" width="16" height="16" rx="3" fill="#fff7ed" stroke="#bf4520" stroke-width="1.4"/>
    <text x="412" y="30" font-size="11" fill="#334155">FOCAL 核心单线程引擎</text>

    <text x="872" y="30" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="end">实测来源: bench/results.json (alpine true p50: Kiri 2.55ms vs Docker 213ms vs OrbStack 380ms)</text>
  </g>
</svg>
