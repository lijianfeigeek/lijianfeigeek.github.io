<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Outer Container -->
  <rect x="4" y="4" width="912" height="532" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(32, 24)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">MCode Review 确定性审查与周度自愈闭环</text>
    <text x="0" y="38" font-size="12" fill="#64748b">从净变更增量指纹、双阶段反驳证伪，到脚本化裁决器与作者理解力答辩</text>
  </g>

  <!-- Central Hub (FOCAL) -->
  <g transform="translate(350, 205)">
    <rect x="0" y="0" width="220" height="110" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="24" rx="10" fill="#fff1f2"/>
    <text x="110" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c" letter-spacing="0.04em">中央裁决引擎 (ci/core/verdict.mjs)</text>
    <text x="110" y="45" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">确定性硬规则状态机</text>
    <text x="110" y="65" text-anchor="middle" font-size="10.5" fill="#475569">Pass (0) · Request Changes (10)</text>
    <text x="110" y="82" text-anchor="middle" font-size="10.5" fill="#475569">Needs Human (11) · 连拒 3 次熔断</text>
    <text x="110" y="98" text-anchor="middle" font-size="9.5" font-weight="600" fill="#e11d48">绝不由模型情绪决定合并命运</text>
  </g>

  <!-- Background connecting dashed ring -->
  <path d="M 180 130 C 180 80, 740 80, 740 130 C 820 230, 820 330, 740 400 C 700 470, 220 470, 180 400 C 100 330, 100 230, 180 130 Z" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- NODE 1: 增量指纹划分 (Top Left) -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="10" width="24" height="20" rx="4" fill="#f1f5f9"/>
    <text x="22" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">01</text>
    <text x="42" y="25" font-size="13" font-weight="700" fill="#0f172a">净变更增量指纹提取</text>
    <text x="12" y="46" font-size="11" fill="#475569">文件净修改 SHA-256 局部指纹</text>
    <text x="12" y="62" font-size="10" fill="#64748b">Rebase 零开销，仅评审实质变化文件</text>
  </g>

  <!-- NODE 2: 五维透镜并行探查 (Top Center) -->
  <g transform="translate(345, 65)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="10" width="24" height="20" rx="4" fill="#eff6ff"/>
    <text x="22" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">02</text>
    <text x="42" y="25" font-size="13" font-weight="700" fill="#0f172a">五维透镜并行探查</text>
    <text x="12" y="46" font-size="11" fill="#475569">Behavior · Data · Security 深度隔离</text>
    <text x="12" y="62" font-size="10" fill="#64748b">Cross-feature 波及面与逻辑重复比对</text>
  </g>

  <!-- NODE 3: 双阶段独立证伪 (Top Right) -->
  <g transform="translate(640, 75)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="10" y="10" width="24" height="20" rx="4" fill="#e0f2fe"/>
    <text x="22" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">03</text>
    <text x="42" y="25" font-size="13" font-weight="700" fill="#0284c7">独立证伪反驳验证</text>
    <text x="12" y="46" font-size="11" fill="#0f172a">第二阶段专用 Pass 尝试驳倒假说</text>
    <text x="12" y="62" font-size="10" fill="#64748b">只有无法被驳倒的问题才视为有效 Finding</text>
  </g>

  <!-- NODE 4: 严苛证据链分级 (Bottom Right) -->
  <g transform="translate(640, 370)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="10" width="24" height="20" rx="4" fill="#fef3c7"/>
    <text x="22" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">04</text>
    <text x="42" y="25" font-size="13" font-weight="700" fill="#0f172a">硬性证据分级裁定</text>
    <text x="12" y="46" font-size="11" fill="#475569">P0~P3 分级，等级 4+ 或确认才阻断</text>
    <text x="12" y="62" font-size="10" fill="#64748b">无确凿文件与行号的空洞指责直接过滤</text>
  </g>

  <!-- NODE 5: 作者答辩测试 (Bottom Center) -->
  <g transform="translate(345, 385)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="10" width="24" height="20" rx="4" fill="#f3e8ff"/>
    <text x="22" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">05</text>
    <text x="42" y="25" font-size="13" font-weight="700" fill="#0f172a">作者理解力答辩 (Quiz)</text>
    <text x="12" y="46" font-size="11" fill="#475569">针对系统边界与失效模式随机提问</text>
    <text x="12" y="62" font-size="10" fill="#64748b">公开答卷防偷懒，确保工程师懂 AI 代码</text>
  </g>

  <!-- NODE 6: 规则周度自愈闭环 (Bottom Left) -->
  <g transform="translate(50, 370)">
    <rect x="0" y="0" width="230" height="76" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect x="10" y="10" width="24" height="20" rx="4" fill="#d1fae5"/>
    <text x="22" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">06</text>
    <text x="42" y="25" font-size="13" font-weight="700" fill="#059669">周度调优与规则自愈</text>
    <text x="12" y="46" font-size="11" fill="#0f172a">pr-review-tuning 分析忽略率与逃逸缺陷</text>
    <text x="12" y="62" font-size="10" fill="#64748b">回测已知历史 Bug，提案更新审核规则</text>
  </g>

  <!-- Flow Direction Arrows -->
  <!-- 01 -> 02 -->
  <path d="M 280 105 L 340 105" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 02 -> 03 -->
  <path d="M 575 105 L 635 105" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <!-- 03 -> Central Hub -->
  <path d="M 680 151 L 550 215" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Central Hub -> 04 -->
  <path d="M 550 305 L 660 370" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- 04 -> 05 -->
  <path d="M 640 415 L 580 415" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <!-- 05 -> 06 -->
  <path d="M 345 415 L 285 415" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <!-- 06 -> 01 -->
  <path d="M 120 370 L 120 155" fill="none" stroke="#059669" stroke-width="1.5"/>

  <!-- Legend & Micro note -->
  <g transform="translate(32, 498)">
    <circle cx="6" cy="6" r="4" fill="#e11d48"/>
    <text x="16" y="10" font-size="10.5" fill="#475569">核心控制流：仲裁状态由纯脚本判定</text>
    <circle cx="210" cy="6" r="4" fill="#0284c7"/>
    <text x="220" y="10" font-size="10.5" fill="#475569">审查流水线：发现与反驳独立两阶段</text>
    <circle cx="430" cy="6" r="4" fill="#059669"/>
    <text x="440" y="10" font-size="10.5" fill="#475569">自愈飞轮：真实线上反馈反哺审查规则</text>
  </g>
</svg>