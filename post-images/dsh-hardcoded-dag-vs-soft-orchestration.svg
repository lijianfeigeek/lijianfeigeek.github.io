<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-hardcoded-dag-vs-soft-orchestration-title dsh-hardcoded-dag-vs-soft-orchestration-desc" id="dsh-hardcoded-dag-vs-soft-orchestration-root">
      <title id="dsh-hardcoded-dag-vs-soft-orchestration-title">传统硬编码 DAG 模式 vs DSH 软工作流（Soft Orchestration）架构对比</title>
      <desc id="dsh-hardcoded-dag-vs-soft-orchestration-desc">外部刚性状态机调度与把画布编译为计划提示词交由 LLM 自主编排的两种开发范式权衡</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dsh-hardcoded-dag-vs-soft-orchestration-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #dsh-hardcoded-dag-vs-soft-orchestration-root text { font-family: "Geist", -apple-system, sans-serif; }
      #dsh-hardcoded-dag-vs-soft-orchestration-root .mono { font-family: "Geist Mono", monospace; }
      #dsh-hardcoded-dag-vs-soft-orchestration-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="dsh-hardcoded-dag-vs-soft-orchestration-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="dsh-hardcoded-dag-vs-soft-orchestration-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="dsh-hardcoded-dag-vs-soft-orchestration-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Left: Traditional Hardcoded DAG -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="425" height="270" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="425" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">TRADITIONAL RIGID DAG (传统硬编码调度)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="397" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="20" font-size="12" font-weight="600" fill="#2d3142">外部调度引擎 (Worker / 消息队列 / 状态机)</text>
            <text x="12" y="38" font-size="11" fill="#2d3142" fill-opacity="0.65">刚性控制每个节点的执行拓扑与超时重试</text>
          </g>

          <g transform="translate(14, 108)">
            <rect x="0" y="0" width="125" height="60" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">节点 1: Prompt</text>
            <text x="10" y="42" font-size="10" fill="#2d3142" fill-opacity="0.65">固定变量插值</text>
          </g>

          <g transform="translate(150, 108)">
            <rect x="0" y="0" width="125" height="60" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">节点 2: 代码执行</text>
            <text x="10" y="42" font-size="10" fill="#2d3142" fill-opacity="0.65">固定沙盒运行</text>
          </g>

          <g transform="translate(286, 108)">
            <rect x="0" y="0" width="125" height="60" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142">节点 3: 分支判定</text>
            <text x="10" y="42" font-size="10" fill="#2d3142" fill-opacity="0.65">硬编码 If/Else</text>
          </g>

          <g transform="translate(14, 185)">
            <rect x="0" y="0" width="397" height="68" rx="4" fill="#f8f9fa"/>
            <text x="12" y="22" font-size="11" font-weight="600" fill="#2d3142" class="mono" fill-opacity="0.6">CORE LIMITATIONS (核心痛点)</text>
            <text x="12" y="42" font-size="11" fill="#2d3142" fill-opacity="0.75">• 节点间无法根据非结构化上下文灵活跳步或回退</text>
            <text x="12" y="58" font-size="11" fill="#2d3142" fill-opacity="0.75">• 任何异常输入都会导致刚性中断，工程容错率极低</text>
          </g>
        </g>

        <!-- Right: DSH Soft Orchestration (Focal) -->
        <g transform="translate(495, 30)">
          <rect x="0" y="0" width="435" height="270" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="435" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" font-size="12" font-weight="700" fill="#bf4520" class="mono">DSH SOFT ORCHESTRATION (软工作流范式 - FOCAL)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="407" height="48" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="20" font-size="12" font-weight="600" fill="#bf4520">画布编译为“结构化计划提示词 (Plan Prompt)”</text>
            <text x="12" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">零外部重量级调度器，将流程图直接编译为自然语言约束</text>
          </g>

          <g transform="translate(14, 108)">
            <rect x="0" y="0" width="407" height="60" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="22" font-size="12" font-weight="600" fill="#bf4520">LLM 主智能体自主决策闭环</text>
            <text x="12" y="44" font-size="11" fill="#2d3142" fill-opacity="0.75">在全局目标引导下，结合运行时即时反馈，动态裁决调度策略与工具调用</text>
          </g>

          <g transform="translate(14, 185)">
            <rect x="0" y="0" width="407" height="68" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="22" font-size="11" font-weight="600" fill="#bf4520" class="mono">CORE ADVANTAGES (核心优势)</text>
            <text x="12" y="42" font-size="11" fill="#2d3142" fill-opacity="0.8">• 人类在直观前端画出业务意图，Agent 动态履约推进</text>
            <text x="12" y="58" font-size="11" fill="#2d3142" fill-opacity="0.8">• 兼具可视化直观性与通用大模型强大的模糊容错纠偏力</text>
          </g>
        </g>
      </g>
    </svg>
