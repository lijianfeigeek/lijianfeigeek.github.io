<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .ledger-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .ledger-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .ledger-old { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #e11d48; }
      .ledger-arrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 700; }
      .ledger-new { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #059669; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="490" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="918" height="488" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <!-- Main Title Area -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="title">APFS 存储拓扑演进对比：全量克隆双系统 vs. doublera1n 次级数据卷架构</text>
    <text x="0" y="20" class="subtitle">解构传统 CFW 方案与 doublera1n 在存储开销、容灾重启以及签名系统卷（SSV）完整性上的根本权衡</text>
  </g>

  <!-- Left Column: Before (Legacy Full Dual-Boot) -->
  <g transform="translate(32, 74)">
    <rect width="414" height="274" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="414" height="36" fill="#fff1f2" rx="8"/>
    <rect x="0" y="28" width="414" height="8" fill="#fff1f2"/>
    <text x="16" y="23" class="header" fill="#be123c">BEFORE · 传统全量双系统方案 (CFW / DualBoot)</text>
    <rect x="316" y="8" width="84" height="20" fill="#ffe4e6" rx="4"/>
    <text x="325" y="22" class="tag" fill="#be123c">高损耗 · 易变砖</text>

    <!-- Card 1 -->
    <g transform="translate(14, 48)">
      <rect width="386" height="64" fill="#fff5f5" stroke="#fecaca" stroke-width="1" rx="6"/>
      <text x="14" y="24" class="card-title">全量克隆根分区（RootFS Duplication）</text>
      <text x="14" y="44" class="card-desc">被迫复制完整系统卷镜像，硬生生消耗 15~22 GB 闪存，低配机型瞬间见底</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(14, 122)">
      <rect width="386" height="64" fill="#fff5f5" stroke="#fecaca" stroke-width="1" rx="6"/>
      <text x="14" y="24" class="card-title">破坏官方签名快照（SSV Broken）</text>
      <text x="14" y="44" class="card-desc">必须篡改系统二进制与 APFS 封印，无法抵御苹果内核完整性校验的严格阻断</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(14, 196)">
      <rect width="386" height="64" fill="#fff5f5" stroke="#fecaca" stroke-width="1" rx="6"/>
      <text x="14" y="24" class="card-title">重启陷入恢复死循环（Recovery Loop）</text>
      <text x="14" y="44" class="card-desc">一旦在户外电量耗尽或异常死机，无引导环境直接变砖，日常完全无法使用</text>
    </g>
  </g>

  <!-- Right Column: After (doublera1n 2nd Data) -->
  <g transform="translate(474, 74)">
    <rect width="414" height="274" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="414" height="36" fill="#f0fdf4" rx="8"/>
    <rect x="0" y="28" width="414" height="8" fill="#f0fdf4"/>
    <text x="16" y="23" class="header" fill="#15803d">AFTER · doublera1n 共享封印根卷方案</text>
    <rect x="312" y="8" width="88" height="20" fill="#dcfce7" rx="4"/>
    <text x="321" y="22" class="tag" fill="#15803d">零冗余 · 纯净双模</text>

    <!-- Card 1 -->
    <g transform="translate(14, 48)">
      <rect width="386" height="64" fill="#f6fef9" stroke="#bbf7d0" stroke-width="1" rx="6"/>
      <text x="14" y="24" class="card-title">原汁原味共享密封系统卷（Sealed System）</text>
      <text x="14" y="44" class="card-desc">系统只读卷保持苹果官方封印哈希，零存储空间冗余，无需克隆十几吉字节系统</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(14, 122)">
      <rect width="386" height="64" fill="#f6fef9" stroke="#bbf7d0" stroke-width="1" rx="6"/>
      <text x="14" y="24" class="card-title">分立第二数据区（APFS DataB as /var）</text>
      <text x="14" y="44" class="card-desc">仅在现有容器中新增未加密卷 DataB，设备树重定向挂载为 /private/var 承载越狱</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(14, 196)">
      <rect width="386" height="64" fill="#f6fef9" stroke="#bbf7d0" stroke-width="1" rx="6"/>
      <text x="14" y="24" class="card-title">双模瞬时安全回退（Safe Stock Fallback）</text>
      <text x="14" y="44" class="card-desc">拔线或常规重启直接平滑进官方未越狱系统，原厂应用与通讯无损，绝无变砖风险</text>
    </g>
  </g>

  <!-- Bottom Changes Ledger Card -->
  <g transform="translate(32, 362)">
    <rect width="856" height="108" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <rect x="0" y="0" width="856" height="28" fill="#f1f5f9" rx="8"/>
    <rect x="0" y="20" width="856" height="8" fill="#f1f5f9"/>
    <text x="16" y="19" class="ledger-title">CHANGES LEDGER · 核心架构与工程指标收益变动对照</text>

    <!-- Row 1 -->
    <g transform="translate(18, 44)">
      <text x="0" y="0" class="ledger-label">存储空间硬性开销</text>
      <text x="170" y="0" class="ledger-old">全量克隆 15 ~ 22 GB 镜像文件</text>
      <text x="440" y="0" class="ledger-arrow">→</text>
      <text x="466" y="0" class="ledger-new">仅 ~35 MB Bootstrap 基础包 + 越狱插件动态增量</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(18, 68)">
      <text x="0" y="0" class="ledger-label">系统完整性封印</text>
      <text x="170" y="0" class="ledger-old">强行破解 SSV 快照，破坏根证书链</text>
      <text x="440" y="0" class="ledger-arrow">→</text>
      <text x="466" y="0" class="ledger-new">100% 保留原生 Sealed System 只读封印，原汁原味</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(18, 92)">
      <text x="0" y="0" class="ledger-label">异常重启容灾状态</text>
      <text x="170" y="0" class="ledger-old">死循环陷入 Recovery 恢复模式，变砖挂死</text>
      <text x="440" y="0" class="ledger-arrow">→</text>
      <text x="466" y="0" class="ledger-new">无感回退至原生未越狱官方 iOS 27，业务通信完全正常</text>
    </g>
  </g>
</svg>
