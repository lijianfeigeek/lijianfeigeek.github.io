<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="stela-gpu-flow-title stela-gpu-flow-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="stela-gpu-flow-title">StelaGPU 零陷入 Call Gate 与 Metal AIR→NIR→NVK 渲染管线</title>
  <desc id="stela-gpu-flow-desc">展示 macOS 用户态 Metal 调用如何通过每任务隔离的 16 KiB GPU Gate 零内核陷入提交至宿主，经 LLVM AIR 转 Mesa NIR 与持久化反射缓存后，交由 NVK 与 NVIDIA GSP 固件执行并输出画面。</desc>
  <defs>
    <marker id="gdf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="gdf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="gdf-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="912" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="700" fill="#0f172a">Metal 3 / Apple7 图形栈跨界管线：16 KiB Call Gate → AIR-to-NIR → NVK / GSP</text>
    <text x="16" y="42" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">GUEST/STELA-GPU/ + CRATES/STELA-SOC/SRC/GPU_GATE.RS + CRATES/STELA-DRIVER-GPU/SRC/METAL/</text>
    <text x="896" y="31" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: DATA FLOW</text>
  </g>

  <!-- Step Headers -->
  <g transform="translate(156, 84)">
    <rect x="0" y="0" width="144" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="13" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">STEP 01</text>
    <text x="72" y="26" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Metal API 封装</text>
  </g>
  <g transform="translate(312, 84)">
    <rect x="0" y="0" width="144" height="32" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.2"/>
    <text x="72" y="13" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" font-weight="700" text-anchor="middle">STEP 02 · FOCAL</text>
    <text x="72" y="26" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">16 KiB Call Gate</text>
  </g>
  <g transform="translate(468, 84)">
    <rect x="0" y="0" width="144" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="13" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">STEP 03</text>
    <text x="72" y="26" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">AIR → NIR 降级</text>
  </g>
  <g transform="translate(624, 84)">
    <rect x="0" y="0" width="144" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="13" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">STEP 04</text>
    <text x="72" y="26" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">NVK / NAK 编译</text>
  </g>
  <g transform="translate(780, 84)">
    <rect x="0" y="0" width="144" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="72" y="13" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">STEP 05</text>
    <text x="72" y="26" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">GSP 执行与显示</text>
  </g>

  <!-- Swimlane Backgrounds -->
  <g transform="translate(24, 128)">
    <!-- Lane 0: Guest User -->
    <rect x="0" y="0" width="912" height="84" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="16" y="34" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0f172a">GUEST USER</text>
    <text x="16" y="50" font-size="11" fill="#475569">macOS 应用态</text>

    <!-- Lane 1: Guest Kext -->
    <rect x="0" y="84" width="912" height="84" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="16" y="118" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0f172a">GUEST KEXT</text>
    <text x="16" y="134" font-size="11" fill="#475569">XNU 内核驱动</text>

    <!-- Lane 2: Stela Host -->
    <rect x="0" y="168" width="912" height="84" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="16" y="202" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0284c7">STELA HOST</text>
    <text x="16" y="218" font-size="11" fill="#475569">宿主机编译器</text>

    <!-- Lane 3: NVIDIA HW -->
    <rect x="0" y="252" width="912" height="84" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="16" y="286" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#059669">NVIDIA HW</text>
    <text x="16" y="302" font-size="11" fill="#475569">显卡与扫描输出</text>

    <line x1="120" y1="0" x2="120" y2="336" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Orthogonal Connectors (drawn BEFORE node boxes) -->
  <!-- 1: User Bundle -> Kext Gate Open (down) -->
  <path d="M 228 202 L 228 222" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#gdf-arrow)"/>
  <!-- 2: Kext Open -> Gate Page (right) -->
  <path d="M 296 254 L 316 254" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#gdf-arrow)"/>
  <!-- 3: User Bundle -> Call Gate Record Write (elbow right then down) -->
  <path d="M 296 170 L 376 170 A 8 8 0 0 1 384 178 L 384 222" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#gdf-arrow-accent)"/>
  <rect x="310" y="144" width="60" height="16" rx="2" fill="#f8fafc"/>
  <text x="340" y="156" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#be123c" text-anchor="middle">CALL WRITE</text>

  <!-- 4: Call Gate -> AIR Compiler (elbow down then right) -->
  <path d="M 384 286 L 384 330 A 8 8 0 0 0 392 338 L 472 338" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#gdf-arrow-accent)"/>
  <rect x="392" y="346" width="68" height="16" rx="2" fill="#f8fafc"/>
  <text x="426" y="358" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#be123c" text-anchor="middle">MTLB / AIR</text>

  <!-- 5: AIR Compiler -> NVK / NAK (right) -->
  <path d="M 608 338 L 628 338" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#gdf-arrow-link)"/>

  <!-- 6: NVK / NAK -> GSP & Display (elbow down then right) -->
  <path d="M 696 370 L 696 414 A 8 8 0 0 0 704 422 L 784 422" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#gdf-arrow-link)"/>
  <rect x="708" y="430" width="68" height="16" rx="2" fill="#ffffff"/>
  <text x="742" y="442" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0369a1" text-anchor="middle">SASS PUSH</text>

  <!-- 7: Completion IRQ back to Kext (async dashed return along top of Lane 2->1) -->
  <path d="M 784 398 L 444 398 A 8 8 0 0 1 436 390 L 436 286" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#gdf-arrow)"/>
  <rect x="572" y="374" width="112" height="16" rx="2" fill="#f8fafc"/>
  <text x="628" y="386" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#059669" text-anchor="middle">AIC IRQ COMPLETION</text>

  <!-- Node Boxes (drawn AFTER arrows) -->
  <!-- Node (Lane 0, Step 0): StelaGPU.bundle -->
  <g transform="translate(160, 138)">
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">StelaGPU.bundle</text>
    <text x="68" y="41" font-size="10" fill="#475569" text-anchor="middle">MTLDevice / Encoder</text>
    <text x="68" y="56" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">ObjC Metal Frontend</text>
  </g>

  <!-- Node (Lane 1, Step 0): StelaGPU.kext -->
  <g transform="translate(160, 222)">
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">StelaGPU.kext</text>
    <text x="68" y="41" font-size="10" fill="#475569" text-anchor="middle">安装插件并分配 Gate</text>
    <text x="68" y="56" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">IOAccelerator · SHA256</text>
  </g>

  <!-- Node (Lane 1, Step 1): Per-Task 16KiB GPU Gate (FOCAL) -->
  <g transform="translate(316, 222)">
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="68" y="24" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">16 KiB Call Gate</text>
    <text x="68" y="41" font-size="10" fill="#334155" text-anchor="middle">单次写 CALL 零陷入</text>
    <text x="68" y="56" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#9f1239" text-anchor="middle">Gate::take 脱锁执行</text>
  </g>

  <!-- Node (Lane 2, Step 2): AIR Compiler & NIR Cache -->
  <g transform="translate(472, 306)">
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="68" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">AIR → Mesa NIR</text>
    <text x="68" y="41" font-size="10" fill="#334155" text-anchor="middle">LLVM 降级与持久化缓存</text>
    <text x="68" y="56" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">Skip ~1200 Warm Reflect</text>
  </g>

  <!-- Node (Lane 2, Step 3): NVK / NAK / nv-push -->
  <g transform="translate(628, 306)">
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="68" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">stela-mesa (NVK)</text>
    <text x="68" y="41" font-size="10" fill="#334155" text-anchor="middle">NAK 生成图灵+ SASS</text>
    <text x="68" y="56" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">Vulkan Lowering + Push</text>
  </g>

  <!-- Node (Lane 3, Step 4): NVIDIA GSP & Scanout -->
  <g transform="translate(784, 390)">
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="68" y="24" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">NVIDIA GSP &amp; DRM</text>
    <text x="68" y="41" font-size="10" fill="#334155" text-anchor="middle">硬件队列提交与画面扫描</text>
    <text x="68" y="56" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#047857" text-anchor="middle">GTX 16 / RTX 20–50</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(24, 488)">
    <line x1="0" y1="0" x2="912" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" font-weight="700">LEGEND</text>
    <line x1="72" y1="20" x2="104" y2="20" stroke="#e11d48" stroke-width="1.8" marker-end="url(#gdf-arrow-accent)"/>
    <text x="112" y="24" font-size="11" fill="#334155">零陷入 GPU Gate 热路径</text>
    <line x1="276" y1="20" x2="308" y2="20" stroke="#0284c7" stroke-width="1.5" marker-end="url(#gdf-arrow-link)"/>
    <text x="316" y="24" font-size="11" fill="#334155">NIR / NVK 编译提交</text>
    <line x1="452" y1="20" x2="484" y2="20" stroke="#059669" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="492" y="24" font-size="11" fill="#334155">AIC 异步完成唤醒</text>
    <text x="912" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">ZERO KERNEL CROSSING PER METAL CALL</text>
  </g>
</svg>
