<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="nvda-insider-sale-three-tier-filter-framework-title nvda-insider-sale-three-tier-filter-framework-desc">
  <title id="nvda-insider-sale-three-tier-filter-framework-title">投资者实战内部人减持三层过滤决策树</title>
  <desc id="nvda-insider-sale-three-tier-filter-framework-desc">从相对持仓比例、高管群体共振度与业务基本面三维度构建降噪决策模型</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="440" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">投资者实战降噪框架：如何精准分辨 SEC FORM 4“真利空”与“常规降噪”？</text>
    <text x="896" y="16" text-anchor="end" class="tag">THREE-TIER FILTERING MATRIX</text>
  </g>

  <!-- Root Node -->
  <g transform="translate(320, 56)">
    <rect width="320" height="42" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="160" y="26" text-anchor="middle" class="title">获取 SEC Form 4 内部人减持通告</text>
  </g>

  <!-- Line Root -> Q1 -->
  <path d="M 480 98 L 480 120" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Tier 1 Question -->
  <g transform="translate(240, 120)">
    <rect width="480" height="52" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="240" y="22" text-anchor="middle" class="title">维度 1：相对持仓比例（Relative Stake Ratio）</text>
    <text x="240" y="38" text-anchor="middle" class="desc">本次减持股数是否超过内部人个人总持仓的 30%？</text>
  </g>

  <!-- Branches Tier 1 -->
  <!-- Yes -> Alert 1 -->
  <path d="M 240 146 L 160 146 L 160 196" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />
  <rect x="170" y="136" width="54" height="20" fill="#fff5f5" rx="3" stroke="#fed7d7" stroke-width="1" />
  <text x="197" y="150" text-anchor="middle" class="coral-tag">是 (&gt;30%)</text>

  <g transform="translate(50, 196)">
    <rect width="220" height="66" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
    <g transform="translate(12, 16)">
      <text class="coral-title" style="font-size:12px;" x="0" y="0">⚠️ 高危预警：清仓式离场</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="18">• 核心成员信心崩塌或离职前兆</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="34">• 触发重点风控排查</text>
    </g>
  </g>

  <!-- No -> Tier 2 -->
  <path d="M 480 172 L 480 206" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <rect x="490" y="178" width="56" height="20" fill="#ffffff" rx="3" stroke="#cbd5e1" stroke-width="1" />
  <text x="518" y="192" text-anchor="middle" class="tag">否 (&lt;15%)</text>

  <!-- Tier 2 Question -->
  <g transform="translate(240, 206)">
    <rect width="480" height="52" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="240" y="22" text-anchor="middle" class="title">维度 2：核心层群体共振度（Executive Clustering）</text>
    <text x="240" y="38" text-anchor="middle" class="desc">CEO、CFO、CTO 等多名核心关键决策人是否密集同时清盘？</text>
  </g>

  <!-- Branches Tier 2 -->
  <!-- Yes -> Alert 2 -->
  <path d="M 720 232 L 800 232 L 800 282" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />
  <rect x="736" y="222" width="50" height="20" fill="#fff5f5" rx="3" stroke="#fed7d7" stroke-width="1" />
  <text x="761" y="236" text-anchor="middle" class="coral-tag">是 (共振)</text>

  <g transform="translate(690, 282)">
    <rect width="220" height="66" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
    <g transform="translate(12, 16)">
      <text class="coral-title" style="font-size:12px;" x="0" y="0">⚠️ 高危预警：管理层集体撤退</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="18">• 行业景气度面临拐点转折</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="34">• 潜在存在重大未披露合规风险</text>
    </g>
  </g>

  <!-- No -> Tier 3 -->
  <path d="M 480 258 L 480 292" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <rect x="490" y="264" width="56" height="20" fill="#ffffff" rx="3" stroke="#cbd5e1" stroke-width="1" />
  <text x="518" y="278" text-anchor="middle" class="tag">否 (单体)</text>

  <!-- Tier 3 Question -->
  <g transform="translate(240, 292)">
    <rect width="480" height="52" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="240" y="22" text-anchor="middle" class="title">维度 3：业务基本面与产业硬指标（Fundamental Reality）</text>
    <text x="240" y="38" text-anchor="middle" class="desc">CSP 资本开支削减？芯片交期雪崩？毛利率与在手订单断崖坍塌？</text>
  </g>

  <!-- Branches Tier 3 -->
  <!-- Yes -> Action Exit -->
  <path d="M 240 318 L 160 318 L 160 364" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />
  <rect x="170" y="308" width="54" height="20" fill="#fff5f5" rx="3" stroke="#fed7d7" stroke-width="1" />
  <text x="197" y="322" text-anchor="middle" class="coral-tag">是 (恶化)</text>

  <g transform="translate(50, 364)">
    <rect width="220" height="60" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
    <g transform="translate(12, 14)">
      <text class="coral-title" style="font-size:12px;" x="0" y="0">🚨 坚决离场：基本面质变</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="18">基本面坍塌，必须执行防守止损</text>
    </g>
  </g>

  <!-- No -> Action Hold (Core Green Result) -->
  <path d="M 480 344 L 480 364" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <rect x="490" y="344" width="56" height="20" fill="#f0fdf4" rx="3" stroke="#bbf7d0" stroke-width="1" />
  <text x="518" y="358" text-anchor="middle" class="green-tag">否 (强劲)</text>

  <g transform="translate(350, 364)">
    <rect width="260" height="60" fill="#f0fdf4" rx="6" stroke="#15803d" stroke-width="1.5" />
    <g transform="translate(12, 14)">
      <text class="green-title" style="font-size:12px;" x="0" y="0">✅ 判定为常规噪音：坚定持有</text>
      <text class="desc" style="fill:#14532d;" x="0" y="18">订单排产饱满，忽略噪音干扰，享受复利</text>
    </g>
  </g>
</svg>