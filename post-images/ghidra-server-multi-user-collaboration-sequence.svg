<svg width="960" height="350" viewBox="0 0 960 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghidra-server-multi-user-collaboration-sequence-title ghidra-server-multi-user-collaboration-sequence-desc">
  <title id="ghidra-server-multi-user-collaboration-sequence-title">Ghidra Server 企业级团队协同版本控制时序</title>
  <desc id="ghidra-server-multi-user-collaboration-sequence-desc">展示 Alice 与 Bob 协同分析同一固件程序，提交网络协议与加密模块成果并通过服务器自动三方合并的时序</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
    </style>
  </defs>

  <rect width="960" height="350" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 3 Actor Columns: X = 160, 480, 800 -->
  <line x1="160" y1="56" x2="160" y2="320" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="480" y1="56" x2="480" y2="320" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="800" y1="56" x2="800" y2="320" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Actor Badges -->
  <g transform="translate(70, 16)">
    <rect width="180" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="90" y="24" text-anchor="middle" class="seq-actor">研究员 A (Alice: 协议分析)</text>
  </g>

  <g transform="translate(390, 16)">
    <rect width="180" height="40" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" class="seq-actor" fill="#9a3412">Ghidra Server 协同中心</text>
  </g>

  <g transform="translate(710, 16)">
    <rect width="180" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="90" y="24" text-anchor="middle" class="seq-actor">研究员 B (Bob: 驱动分析)</text>
  </g>

  <!-- Checkouts -->
  <path d="M 160 84 L 480 84" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="474,81 480,84 474,87" fill="#4b5563"/>
  <text x="320" y="78" text-anchor="middle" class="text-code">1. Check out 目标固件 main_firmware.bin</text>

  <path d="M 800 108 L 480 108" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="486,105 480,108 486,111" fill="#4b5563"/>
  <text x="640" y="102" text-anchor="middle" class="text-code">2. Check out 同一固件程序 main_firmware.bin</text>

  <!-- Alice Action Block -->
  <g transform="translate(80, 130)">
    <rect width="360" height="66" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="14" y="22" class="label-title" font-size="12" fill="#065f46">Alice 分析网络协议栈模块：</text>
    <text x="14" y="40" class="text-code" fill="#047857">• 重命名 sub_00401020 -&gt; parse_http_header</text>
    <text x="14" y="56" class="text-code" fill="#047857">• 注入并绑定自定义结构体 http_req_t</text>
  </g>

  <!-- Alice Commit -->
  <path d="M 160 216 L 480 216" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="474,213 480,216 474,219" fill="#10b981"/>
  <text x="320" y="210" text-anchor="middle" class="text-code" fill="#047857">3. Commit 提交网络协议分析成果到仓库</text>

  <!-- Bob Action Block -->
  <g transform="translate(520, 230)">
    <rect width="360" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="14" y="20" class="label-title" font-size="12" fill="#1e40af">Bob 逆向加密驱动模块：</text>
    <text x="14" y="38" class="text-code" fill="#1d4ed8">• 逆向 sub_00408800 -&gt; AES_decrypt 并标注密钥入参</text>
  </g>

  <!-- Bob Update &amp; Auto-Merge -->
  <path d="M 800 298 L 480 298" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="486,295 480,298 486,301" fill="#bf4520"/>
  <text x="640" y="292" text-anchor="middle" class="text-code" fill="#9a3412">4. Update 触发自动三方合并 (Auto-Merge)</text>

  <path d="M 480 318 L 800 318" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="794,315 800,318 794,321" fill="#10b981"/>
  <text x="640" y="314" text-anchor="middle" class="text-code" font-weight="600" fill="#065f46">5. 符号名与结构体完全合入，0 冲突继续分析！</text>
</svg>