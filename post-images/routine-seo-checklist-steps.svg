<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="routine-seo-checklist-steps-title routine-seo-checklist-steps-desc" id="routine-seo-checklist-steps-root">
        <title id="routine-seo-checklist-steps-title">日常工程巡检：技术 SEO 六步闭环排查流水线</title>
        <desc id="routine-seo-checklist-steps-desc">排查孤立页面、LCP/INP 性能体检、静态缓存控制、死链清理、Sitemap 状态与 Google 覆盖率</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #routine-seo-checklist-steps-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #routine-seo-checklist-steps-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #routine-seo-checklist-steps-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="routine-seo-checklist-steps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="routine-seo-checklist-steps-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="routine-seo-checklist-steps-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Step 1 to 6 in a flowing horizontal-wrapped track -->
        <g transform="translate(40, 40)">
          <rect x="0" y="0" width="260" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">STEP 01 · 孤立页面排查</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Orphan Pages 清理</text>
          <text x="10" y="66" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">确保所有核心工具页均有站内</text>
          <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">清晰层级入口与上下文内链</text>
        </g>

        <g transform="translate(350, 40)">
          <rect x="0" y="0" width="260" height="110" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.04"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#bf4520" fill-opacity="0.08"/>
          <text x="10" y="18" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">STEP 02 · 加载性能监测 (FOCAL)</text>
          <text x="10" y="46" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Core Web Vitals 体检</text>
          <text x="10" y="66" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">监控 LCP &lt; 2.5s 与 INP 延迟</text>
          <text x="10" y="84" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">坚决排除首屏重型第三方阻塞脚本</text>
        </g>

        <g transform="translate(660, 40)">
          <rect x="0" y="0" width="260" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">STEP 03 · 静态资源缓存</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Cache-Control 策略</text>
          <text x="10" y="66" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">静态 JS/CSS 开启带哈希强缓存</text>
          <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">HTML 配置 no-cache 保证秒级感知</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(40, 180)">
          <rect x="0" y="0" width="260" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">STEP 04 · 站内死链清理</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">404 与废弃脚本清零</text>
          <text x="10" y="66" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">修正内链错漏，清理失效资源</text>
          <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">保证全站零孤儿死链与零跳出</text>
        </g>

        <g transform="translate(350, 180)">
          <rect x="0" y="0" width="260" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">STEP 05 · Sitemap 状态</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">主动推送与热度保鲜</text>
          <text x="10" y="66" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">检查 IndexNow 即时直推响应</text>
          <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">确认 GSC 成功抓取全量 URL 清单</text>
        </g>

        <g transform="translate(660, 180)">
          <rect x="0" y="0" width="260" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">STEP 06 · GSC 覆盖率报表</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Page Indexing 索引健康度</text>
          <text x="10" y="66" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">排查已抓取未编入索引异常</text>
          <text x="10" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">发现问题立即定向复查重提</text>
        </g>
      </svg>
