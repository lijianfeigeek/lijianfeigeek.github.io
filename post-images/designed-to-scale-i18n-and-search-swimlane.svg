<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dts-swim-title dts-swim-desc" id="dts-swim-root">
  <title id="dts-swim-title">Designed to Scale 21 语种按需加载、双字元检索与语音预埋泳道图</title>
  <desc id="dts-swim-desc">展示首屏零闪烁语言与暗黑主题检测、820 个 Vite 语言切片懒加载、客户端多字段加权与 Damerau-Levenshtein 纠错检索，以及受特性开关控制的朗读模块。</desc>
  <defs>
    <style>
      #dts-swim-root { font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #0f172a; }
    </style>
    <pattern id="dts-dots-2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="dts-sw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="dts-sw-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="dts-sw-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Paper Light Background -->
  <rect width="1000" height="560" fill="#f8fafc"/>
  <rect width="1000" height="560" fill="url(#dts-dots-2)" opacity="0.6"/>

  <!-- Header -->
  <text x="32" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">SWIMLANE · 21-LOCALE I18N CHUNKING · CLIENT-SIDE SEARCH ENGINE</text>
  <text x="32" y="64" fill="#0f172a" font-size="22" font-weight="600">多语言零闪烁启动、820 切片懒加载与混合分词检索引擎</text>

  <!-- Swimlane Backgrounds & Left Labels -->
  <!-- Lane 1: Pre-Paint Boot -->
  <rect x="24" y="88" width="952" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="88" width="136" height="96" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="92" y="128" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">首屏前置引导</text>
  <text x="92" y="148" fill="#64748b" font-size="9.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">HTML &lt;head&gt; Sync</text>

  <!-- Lane 2: Vite Lazy i18n -->
  <rect x="24" y="196" width="952" height="100" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="196" width="136" height="100" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="92" y="238" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">语言包懒加载</text>
  <text x="92" y="258" fill="#64748b" font-size="9.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">820 ES Modules</text>

  <!-- Lane 3: Search Engine (Focal) -->
  <rect x="24" y="308" width="952" height="116" rx="6" fill="#fffaf8" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="308" width="136" height="116" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.2"/>
  <text x="92" y="356" fill="#bf4520" font-size="12" font-weight="700" text-anchor="middle">全站 Cmd+K 检索</text>
  <text x="92" y="376" fill="#bf4520" font-size="9.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Inverted + Fuzzy</text>

  <!-- Lane 4: Desktop & Speech Subsystems -->
  <rect x="24" y="436" width="952" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="436" width="136" height="88" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="92" y="472" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">自适应与扩展</text>
  <text x="92" y="492" fill="#64748b" font-size="9.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Viewport · Speech</text>

  <!-- ARROWS (drawn before node boxes) -->
  <!-- Lane 1: Boot flow -->
  <line x1="364" y1="136" x2="404" y2="136" stroke="#475569" stroke-width="1.3" marker-end="url(#dts-sw-arrow)"/>
  <line x1="628" y1="136" x2="668" y2="136" stroke="#475569" stroke-width="1.3" marker-end="url(#dts-sw-arrow)"/>

  <!-- Handoff Lane 1 -> Lane 2 -->
  <path d="M 790,168 V 184 Q 790,192 782,192 H 284 Q 276,192 276,200 V 214" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#dts-sw-link)"/>
  <rect x="466" y="183" width="152" height="16" rx="2" fill="#f8fafc"/>
  <text x="542" y="194" fill="#0284c7" font-size="9" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">data-start-lang + RTL</text>

  <!-- Lane 2 flow -->
  <line x1="376" y1="246" x2="424" y2="246" stroke="#0284c7" stroke-width="1.3" marker-end="url(#dts-sw-link)"/>
  <line x1="656" y1="246" x2="704" y2="246" stroke="#475569" stroke-width="1.3" marker-end="url(#dts-sw-arrow)"/>

  <!-- Handoff Lane 2 -> Lane 3 -->
  <path d="M 830,278 V 296 Q 830,304 822,304 H 284 Q 276,304 276,312 V 330" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#dts-sw-coral)"/>
  <rect x="478" y="295" width="136" height="16" rx="2" fill="#f8fafc"/>
  <text x="546" y="306" fill="#bf4520" font-size="9" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">dp() 注入译文后重建索引</text>

  <!-- Lane 3 flow -->
  <line x1="396" y1="366" x2="436" y2="366" stroke="#475569" stroke-width="1.3" marker-end="url(#dts-sw-arrow)"/>
  <line x1="668" y1="366" x2="708" y2="366" stroke="#bf4520" stroke-width="1.4" marker-end="url(#dts-sw-coral)"/>

  <!-- NODES: Lane 1 -->
  <g transform="translate(184, 104)">
    <rect x="0" y="0" width="180" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">读取主题与语种优先级</text>
    <text x="14" y="44" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">?lang= &gt; sdt:lang &gt; nav</text>
  </g>
  <g transform="translate(404, 104)">
    <rect x="0" y="0" width="224" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">首绘前锁定布局与防闪屏</text>
    <text x="14" y="44" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">data-theme / data-lang-pending</text>
  </g>
  <g transform="translate(668, 104)">
    <rect x="0" y="0" width="276" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">RTL 自动识别与方向隔离</text>
    <text x="14" y="44" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">ar / he → dir="rtl" + U+200F</text>
  </g>

  <!-- NODES: Lane 2 -->
  <g transform="translate(184, 214)">
    <rect x="0" y="0" width="192" height="64" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">按需加载当前语种切片</text>
    <text x="14" y="44" fill="#0284c7" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">ui.json + lesson.json (2 chunks)</text>
  </g>
  <g transform="translate(424, 214)">
    <rect x="0" y="0" width="232" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">英文基准内联与递归翻译器</text>
    <text x="14" y="44" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">dp() 遍历 steps / scene / tags</text>
  </g>
  <g transform="translate(704, 214)">
    <rect x="0" y="0" width="240" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">本地进度与状态持久化</text>
    <text x="14" y="44" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">sdt:done · sdt:last · sdt:recent</text>
  </g>

  <!-- NODES: Lane 3 (Search Engine) -->
  <g transform="translate(184, 330)">
    <rect x="0" y="0" width="212" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="25" fill="#0f172a" font-size="13" font-weight="600">混合分词与术语抽取</text>
    <text x="14" y="44" fill="#475569" font-size="10">CJK 连续二元组（Bigrams）</text>
    <text x="14" y="60" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">NFKD 折叠 · 21 语种停用词</text>
  </g>
  <g transform="translate(436, 330)">
    <rect x="0" y="0" width="232" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="25" fill="#0f172a" font-size="13" font-weight="600">全要素加权倒排索引</text>
    <text x="14" y="44" fill="#475569" font-size="10">覆盖课程、步骤、图表节点与术语</text>
    <text x="14" y="60" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">term(10) · title(8) · body(3)</text>
  </g>
  <g transform="translate(708, 330)">
    <rect x="0" y="0" width="236" height="72" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
    <text x="14" y="25" fill="#bf4520" font-size="13" font-weight="700">同义词扩展与拼写容错</text>
    <text x="14" y="44" fill="#334155" font-size="10">db/lb/2pc/wal/lsm 行业同义词映射</text>
    <text x="14" y="60" fill="#bf4520" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">Damerau-Levenshtein (dist ≤ 2)</text>
  </g>

  <!-- NODES: Lane 4 -->
  <g transform="translate(184, 450)">
    <rect x="0" y="0" width="244" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="23" fill="#0f172a" font-size="12.5" font-weight="600">等比桌面工作台缩放</text>
    <text x="14" y="43" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">1672×920 基准 zoom · 三端断点</text>
  </g>
  <g transform="translate(452, 450)">
    <rect x="0" y="0" width="244" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="23" fill="#0f172a" font-size="12.5" font-weight="600">全功能 Web Speech 朗读引擎</text>
    <text x="14" y="43" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Intl.Segmenter · 卡拉OK逐段高亮</text>
  </g>
  <g transform="translate(720, 450)">
    <rect x="0" y="0" width="224" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="14" y="23" fill="#475569" font-size="12.5" font-weight="600">待上线能力开关预留</text>
    <text x="14" y="43" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">readAloud:false · Practice/Lab</text>
  </g>

  <!-- Footer -->
  <text x="976" y="544" fill="#64748b" font-size="10" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace">Zero-dependency client architecture · Verified from production bundle</text>
</svg>
