<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-education-cost-ladder-title singapore-pr-education-cost-ladder-desc">
  <title id="singapore-pr-education-cost-ladder-title">新加坡 12 年公立基础教育学费剪刀差阶段累加</title>
  <desc id="singapore-pr-education-cost-ladder-desc">展示小学6年、中学4年、高中2年间新加坡公民与PR学生的官方学费差距与单娃累积40万人民币差额</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #047857; }
      .text-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #b91c1c; }
      .num-big { font-family: ui-monospace, monospace; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .num-coral { font-family: ui-monospace, monospace; font-size: 24px; font-weight: 800; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="300" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡 12 年公立基础教育学费刚性剪刀差 (2026 教育部资费标准)</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">按月刚性收取的现金流开销，单娃 12 年教育部基础学杂费净差额超 7.4 万新元</text>

  <!-- Step 1: Primary (6 Years) -->
  <g transform="translate(40, 80)">
    <rect width="190" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="190" height="32" rx="8" fill="#f1f5f9"/>
    <text x="95" y="21" class="card-title" text-anchor="middle">小学阶段 (6 年 / 72 个月)</text>
    <g transform="translate(14, 45)">
      <text x="0" y="14" class="text-sub">公民学费：<tspan class="text-green">$0 / 月</tspan></text>
      <text x="0" y="34" class="text-sub">PR 学费：<tspan class="text-red">$330 / 月</tspan></text>
      <text x="0" y="54" class="text-sub">每月差额：$330 新元</text>
      <line x1="0" y1="66" x2="162" y2="66" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="86" class="text-sub">6 年累积差额：</text>
      <text x="0" y="116" class="num-big">$23,760</text>
      <text x="0" y="132" class="text-sub">折合人民币约 13 万元</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 235 175 L 265 175" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Step 2: Secondary (4 Years) -->
  <g transform="translate(270, 80)">
    <rect width="190" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="190" height="32" rx="8" fill="#f1f5f9"/>
    <text x="95" y="21" class="card-title" text-anchor="middle">中学阶段 (4 年 / 48 个月)</text>
    <g transform="translate(14, 45)">
      <text x="0" y="14" class="text-sub">公民学费：<tspan class="text-green">$5 / 月</tspan></text>
      <text x="0" y="34" class="text-sub">PR 学费：<tspan class="text-red">$680 / 月</tspan></text>
      <text x="0" y="54" class="text-sub">每月差额：$675 新元</text>
      <line x1="0" y1="66" x2="162" y2="66" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="86" class="text-sub">4 年累积差额：</text>
      <text x="0" y="116" class="num-big">$32,400</text>
      <text x="0" y="132" class="text-sub">折合人民币约 17.5 万元</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 465 175 L 495 175" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Step 3: Pre-U (2 Years) -->
  <g transform="translate(500, 80)">
    <rect width="190" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="190" height="32" rx="8" fill="#f1f5f9"/>
    <text x="95" y="21" class="card-title" text-anchor="middle">初院/高中 (2 年 / 24 个月)</text>
    <g transform="translate(14, 45)">
      <text x="0" y="14" class="text-sub">公民学费：<tspan class="text-green">$6 / 月</tspan></text>
      <text x="0" y="34" class="text-sub">PR 学费：<tspan class="text-red">$760 / 月</tspan></text>
      <text x="0" y="54" class="text-sub">每月差额：$754 新元</text>
      <line x1="0" y1="66" x2="162" y2="66" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="86" class="text-sub">2 年累积差额：</text>
      <text x="0" y="116" class="num-big">$18,096</text>
      <text x="0" y="132" class="text-sub">折合人民币约 9.8 万元</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M 695 175 L 725 175" stroke="#bf4520" stroke-width="2" fill="none"/>

  <!-- Step 4: Total Summary (Focal Coral) -->
  <g transform="translate(730, 80)">
    <rect width="190" height="190" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="190" height="32" rx="8" fill="#ffedd5"/>
    <text x="95" y="21" class="card-title" fill="#bf4520" text-anchor="middle">单娃 12 年总差额</text>
    <g transform="translate(14, 45)">
      <text x="81" y="16" class="text-sub" text-anchor="middle">12 年公立基础学费总差额</text>
      <text x="81" y="48" class="num-coral" text-anchor="middle">$74,256</text>
      <text x="81" y="70" class="text-sub" text-anchor="middle">约合 40 万人民币现金</text>
      <line x1="0" y1="84" x2="162" y2="84" stroke="#fed7aa" stroke-width="1"/>
      <text x="81" y="105" class="text-sub" text-anchor="middle">若家庭育有双娃：</text>
      <text x="81" y="125" class="card-title" fill="#b91c1c" text-anchor="middle">刚性差额超 80 万元</text>
    </g>
  </g>
</svg>