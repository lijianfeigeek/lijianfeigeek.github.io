<svg width="960" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="tsla-scen-title tsla-scen-desc">
  <title id="tsla-scen-title">特斯拉三大情境敏感性矩阵与概率加权期望公允值</title>
  <desc id="tsla-scen-desc">横向对比悲观熊市（61美元）、基准基线（528美元）与狂热牛市（1723美元）三种假设，并计算出当前期望公允值436美元。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .val-large { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="500" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">情境敏感性矩阵：从 61 美元地狱到 1,723 美元天堂</text>
    <text class="subtitle" x="0" y="20">将埃隆时间轴与三大业务变量置于极端压力测试中，以 25%/50%/25% 概率分布得出加权公允值</text>
  </g>

  <!-- 3 Columns -->
  <!-- Col 1: Bear Case -->
  <g transform="translate(48, 86)">
    <rect width="272" height="280" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#be123c" x="0" y="0">悲观熊市 (Bear Case: 25%)</text>
      
      <g transform="translate(0, 16)">
        <text class="card-body" fill="#9f1239" x="0" y="14">• Robotaxi 遭遇重大监管阻滞</text>
        <text class="card-body" fill="#9f1239" x="0" y="30">  时间轴膨胀超 5 倍，车队仅 35 万辆</text>
        <text class="card-body" fill="#9f1239" x="0" y="48">• FSD 订阅渗透率骤降至 20%</text>
        <text class="card-body" fill="#9f1239" x="0" y="66">• 估值乘数全面跌回传统车企 (12x PE)</text>
        <text class="card-body" fill="#9f1239" x="0" y="84">• 储能面临激烈价格战，净利率仅 8%</text>
      </g>

      <g transform="translate(0, 140)">
        <rect width="240" height="84" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#be123c" x="0" y="0">2030 年目标股价</text>
          <text class="val-large" fill="#e11d48" x="0" y="28">61 美元 / 股</text>
          <text class="mono" fill="#be123c" x="0" y="48">现值折回: 37 美元 (毁灭性下跌)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Col 2: Base Case (Center) -->
  <g transform="translate(344, 86)">
    <rect width="272" height="280" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#1d4ed8" x="0" y="0">基准基线 (Base Case: 50%)</text>
      
      <g transform="translate(0, 16)">
        <text class="card-body" fill="#1e40af" x="0" y="14">• 埃隆时间轴按 2.3 倍理性打折</text>
        <text class="card-body" fill="#1e40af" x="0" y="30">• Robotaxi 达到 150 万辆运营车队</text>
        <text class="card-body" fill="#1e40af" x="0" y="48">• FSD 订阅渗透率达到 40%</text>
        <text class="card-body" fill="#1e40af" x="0" y="66">• Megapack 稳健出货 130 GWh</text>
        <text class="card-body" fill="#1e40af" x="0" y="84">• Optimus 机器人估值直接归 0</text>
      </g>

      <g transform="translate(0, 140)">
        <rect width="240" height="84" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#1d4ed8" x="0" y="0">2030 年目标股价</text>
          <text class="val-large" fill="#2563eb" x="0" y="28">528 美元 / 股</text>
          <text class="mono" fill="#1d4ed8" x="0" y="48">现值折回: 324 美元 (模型基线)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Col 3: Bull Case -->
  <g transform="translate(640, 86)">
    <rect width="272" height="280" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#15803d" x="0" y="0">狂热牛市 (Bull Case: 25%)</text>
      
      <g transform="translate(0, 16)">
        <text class="card-body" fill="#166534" x="0" y="14">• 端到端世界模型飞轮极速收敛</text>
        <text class="card-body" fill="#166534" x="0" y="30">• Robotaxi 突破 250 万辆全美垄断</text>
        <text class="card-body" fill="#166534" x="0" y="48">• FSD 订阅渗透率达 55%</text>
        <text class="card-body" fill="#166534" x="0" y="66">• Optimus 出货 50 万台 (创千亿估值)</text>
        <text class="card-body" fill="#166534" x="0" y="84">• 享受科技巨头 45x PE 溢价倍数</text>
      </g>

      <g transform="translate(0, 140)">
        <rect width="240" height="84" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#15803d" x="0" y="0">2030 年目标股价</text>
          <text class="val-large" fill="#16a34a" x="0" y="28">1,723 美元 / 股</text>
          <text class="mono" fill="#15803d" x="0" y="48">现值折回: 1,057 美元 (十倍股天堂)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom: Probability-Weighted Expected Value -->
  <g transform="translate(48, 380)">
    <rect width="864" height="84" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
    <g transform="translate(20, 16)">
      <text class="card-title" fill="#7e22ce" x="0" y="0">概率加权期望公允值综合测算公式：(61 × 25%) + (528 × 50%) + (1,723 × 25%)</text>
      <text class="val-large" fill="#9333ea" x="0" y="30">2030 期望值: 710 美元</text>
      <text class="val-large" fill="#16a34a" x="320" y="30">当前期望现值: 436 美元 / 股</text>
      <text class="card-body" fill="#6b21a8" x="0" y="52">核心启示：现价 356 美元若以基准 324 美元看无安全边际，但以概率期望看仍为长期资本保留 22% 潜在溢价空间</text>
    </g>
  </g>
</svg>