<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="400" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-workflow-lite-architecture-topology-title dsh-workflow-lite-architecture-topology-desc" id="dsh-workflow-lite-architecture-topology-root">
      <title id="dsh-workflow-lite-architecture-topology-title">DSH Workflow Lite 前后端分层微架构拓扑</title>
      <desc id="dsh-workflow-lite-architecture-topology-desc">React Flow 可视化画布前端、Cordis 微内核插件总线与本地/远端执行器的架构拓扑</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dsh-workflow-lite-architecture-topology-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #dsh-workflow-lite-architecture-topology-root text { font-family: "Geist", -apple-system, sans-serif; }
      #dsh-workflow-lite-architecture-topology-root .mono { font-family: "Geist Mono", monospace; }
      #dsh-workflow-lite-architecture-topology-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="dsh-workflow-lite-architecture-topology-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="dsh-workflow-lite-architecture-topology-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="dsh-workflow-lite-architecture-topology-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Layer 1: Frontend Canvas Layer -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="280" height="330" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">FRONTEND CANVAS (前端画布层)</text>

          <g transform="translate(14, 46)">
            <rect x="0" y="0" width="252" height="50" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#2d3142">React Flow + ELK 交互画布</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.65">分层拓扑自动排版与拖拽连线</text>
          </g>

          <g transform="translate(14, 104)">
            <rect x="0" y="0" width="252" height="50" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#2d3142">RunBoard 实时展示看板</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.65">Markdown / HTML / 状态折线图</text>
          </g>

          <g transform="translate(14, 162)">
            <rect x="0" y="0" width="252" height="50" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#2d3142">VersionsModal 版本比对</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.65">工作流 DAG 拓扑级差异对比</text>
          </g>

          <g transform="translate(14, 220)">
            <rect x="0" y="0" width="252" height="50" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#2d3142">Pack 管理器 (.wflite.zip)</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.65">跨环境离线导入导出与 Skill 打包</text>
          </g>
        </g>

        <!-- Layer 2: Cordis Gateway (Focal) -->
        <g transform="translate(340, 30)">
          <rect x="0" y="0" width="300" height="330" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="300" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" font-size="12" font-weight="700" fill="#bf4520" class="mono">CORDIS MICROKERNEL (微内核网关)</text>

          <g transform="translate(14, 46)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">compile.ts 软工作流编译器</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">将 JSON 图元拓扑降阶为结构化 Plan</text>
          </g>

          <g transform="translate(14, 114)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">Plugin 生命周期总线</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">统一管理服务注册、配置热载与钩子</text>
          </g>

          <g transform="translate(14, 182)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">skillPack.ts 标准化导出器</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">无缝编译生成 Antigravity/Codex Skill 格式</text>
          </g>

          <g transform="translate(14, 250)">
            <rect x="0" y="0" width="272" height="58" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#bf4520">跨协议 WebSocket / IPC 通信</text>
            <text x="10" y="38" font-size="11" fill="#2d3142" fill-opacity="0.7">实现画布节点状态毫秒级双向同步</text>
          </g>
        </g>

        <!-- Layer 3: Runtime Execution Engine -->
        <g transform="translate(670, 30)">
          <rect x="0" y="0" width="260" height="330" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">RUNTIME ENGINE (运行与宿主环境)</text>

          <g transform="translate(14, 46)">
            <rect x="0" y="0" width="232" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">主 Agent (Orchestrator)</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• 挂载软工作流 Plan 提示词</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• 掌握全局目标与上下文路由</text>
          </g>

          <g transform="translate(14, 140)">
            <rect x="0" y="0" width="232" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">Subagent 细分执行矩阵</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• 探针注入 / 变异算法生成</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• 专用代码执行与动态分析</text>
          </g>

          <g transform="translate(14, 232)">
            <rect x="0" y="0" width="232" height="75" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="22" font-size="12" font-weight="600" fill="#2d3142">本地磁盘工作区</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.65">• .dsh/ 流程快照与依赖管理</text>
            <text x="10" y="60" font-size="11" fill="#2d3142" fill-opacity="0.65">• 研报与测试数据持久化</text>
          </g>
        </g>

        <!-- Horizontal Connectors -->
        <path d="M 310 195 L 340 195" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-workflow-lite-architecture-topology-arrow-accent)"/>
        <path d="M 640 195 L 670 195" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-workflow-lite-architecture-topology-arrow-default)" opacity="0.6"/>
      </g>
    </svg>
