<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-housing-access-decision-tree-title singapore-pr-housing-access-decision-tree-desc">
  <title id="singapore-pr-housing-access-decision-tree-title">新加坡置业准入通道与金融杠杆对比决策树</title>
  <desc id="singapore-pr-housing-access-decision-tree-desc">拆解家庭至少含1名公民、全PR家庭及单身PR在BTO打新资格、转售组屋门槛、ABSD印花税与贷款政策断层</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #047857; }
      .text-coral { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡房产置业准入资格与金融杠杆全景决策树</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">房产政策核心差距首先是准入资格（Eligibility）的断层，然后才是补贴金额与贷款渠道</text>

  <!-- Root Node -->
  <g transform="translate(360, 75)">
    <rect width="240" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="24" class="card-title" text-anchor="middle">家庭成员身份组合判定</text>
  </g>

  <!-- Connectors -->
  <path d="M 400 113 L 400 135 L 180 135 L 180 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 480 113 L 480 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 560 113 L 560 135 L 780 135 L 780 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Channel 1: Citizen (Left) -->
  <g transform="translate(40, 155)">
    <rect width="280" height="205" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="280" height="32" rx="8" fill="#d1fae5"/>
    <text x="140" y="21" class="text-green" text-anchor="middle">公民通道 (家庭含至少 1 名 SC)</text>
    <g transform="translate(16, 44)">
      <text x="0" y="14" class="text-green">✅ 完整准入：可申购全新 BTO 组屋</text>
      <text x="0" y="30" class="text-sub">售价与市场脱钩，享 30%~40% 原始折价红利</text>
      <text x="0" y="52" class="text-green">✅ 购房补贴：最高享 $80,000+ EHG</text>
      <text x="0" y="68" class="text-sub">公积金高额补贴，显著降低首付与月供门槛</text>
      <text x="0" y="90" class="text-green">✅ 特惠贷款：享 HDB 2.6% 稳定房贷</text>
      <text x="0" y="106" class="text-sub">利率长期锁定，信贷审核对居民极其宽容</text>
      <text x="0" y="128" class="text-green">✅ 首套税负：首套私宅免征 ABSD (0%)</text>
      <text x="0" y="144" class="text-sub">资产配置与换房过渡灵活性极高</text>
    </g>
  </g>

  <!-- Channel 2: All PR (Middle) -->
  <g transform="translate(340, 155)">
    <rect width="280" height="205" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="280" height="32" rx="8" fill="#f1f5f9"/>
    <text x="140" y="21" class="card-title" text-anchor="middle">全 PR 家庭通道 (夫妻皆 PR)</text>
    <g transform="translate(16, 44)">
      <text x="0" y="14" class="card-title" fill="#b91c1c">❌ 严禁打新：完全无权申购 BTO 组屋</text>
      <text x="0" y="30" class="text-sub">仅能购买市场二手转售组屋 (Resale Flat)</text>
      <text x="0" y="52" class="text-bold">⚠️ 等待真空：持 PR 身份必须均满 3 年</text>
      <text x="0" y="68" class="text-sub">未满 3 年前急需住房只能租房或买私人公寓</text>
      <text x="0" y="90" class="card-title" fill="#b91c1c">❌ 零补贴：无 EHG 补贴，仅能走银行商贷</text>
      <text x="0" y="106" class="text-sub">必须经受商业浮动利率与严格 TDSR 审查</text>
      <text x="0" y="128" class="text-coral">⚠️ 私宅税负：购买首套需缴 5% ABSD</text>
      <text x="0" y="144" class="text-sub">150 万公寓首套需纯现金拿出 7.5 万新币</text>
    </g>
  </g>

  <!-- Channel 3: Single PR (Right, Focal Coral) -->
  <g transform="translate(640, 155)">
    <rect width="280" height="205" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="280" height="32" rx="8" fill="#ffedd5"/>
    <text x="140" y="21" class="text-coral" text-anchor="middle">单身 PR 通道 (未婚 / 单身)</text>
    <g transform="translate(16, 44)">
      <text x="0" y="14" class="text-coral">❌ 组屋绝缘：完全不可购买任何组屋</text>
      <text x="0" y="30" class="text-sub">公民单身满 35 岁可买，单身 PR 终身无资格</text>
      <text x="0" y="56" class="text-bold">⚠️ 唯一选择：只能购买私人公寓 (Condo)</text>
      <text x="0" y="74" class="text-sub">• 必须承担高昂商业溢价与物业管理费</text>
      <text x="0" y="94" class="text-sub">• 购买首套必须全额现金拿出 5% ABSD</text>
      <line x1="0" y1="108" x2="248" y2="108" stroke="#fed7aa" stroke-width="1"/>
      <text x="0" y="128" class="text-coral">财务重压：置业现金门槛高昂</text>
      <text x="0" y="144" class="text-sub">无家庭兜底杠杆，早期住房成本极其沉重</text>
    </g>
  </g>
</svg>