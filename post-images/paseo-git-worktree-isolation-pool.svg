<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="paseo-git-worktree-isolation-pool-title paseo-git-worktree-isolation-pool-desc">
  <title id="paseo-git-worktree-isolation-pool-title">Paseo Git Worktree 动态隔离沙盒池机制</title>
  <desc id="paseo-git-worktree-isolation-pool-desc">展示多 Agent 在独立派生的 Git Worktree 中并行开发、互不踩踏与安全合流全流程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="440" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">PASEO 并发防踩踏底座：动态 GIT WORKTREE 物理沙盒隔离机制</text>
    <text x="896" y="16" text-anchor="end" class="tag">ZERO REPO POLLUTION</text>
  </g>

  <!-- Main Repo Node (Left) -->
  <g transform="translate(32, 160)">
    <rect width="210" height="110" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="32" fill="#f8fafc" rx="8" />
    <rect y="24" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="32" x2="210" y2="32" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="21" class="title" style="font-size:12px;">本地主代码库 (/workspace)</text>
    <text x="12" y="55" class="tag">HEAD: main (稳定基线)</text>
    <text x="12" y="75" class="desc">• 主工作树只读保护</text>
    <text x="12" y="93" class="desc">• 保持干净无脏文件</text>
  </g>

  <!-- Connectors: Main Repo -> Worktrees -->
  <path d="M 242 195 L 300 195 L 300 120 L 330 120" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 242 235 L 300 235 L 300 310 L 330 310" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <rect x="250" y="98" width="70" height="18" fill="#ffffff" rx="3" stroke="#cbd5e1" stroke-width="1" />
  <text x="285" y="111" text-anchor="middle" class="tag" style="font-size:9px;">git worktree</text>
  <rect x="250" y="318" width="70" height="18" fill="#ffffff" rx="3" stroke="#cbd5e1" stroke-width="1" />
  <text x="285" y="331" text-anchor="middle" class="tag" style="font-size:9px;">git worktree</text>

  <!-- Center Pool Container -->
  <g transform="translate(330, 60)">
    <rect width="360" height="340" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="360" height="36" fill="#fff5f5" rx="8" />
    <rect y="28" width="360" height="8" fill="#fff5f5" />
    <line x1="0" y1="36" x2="360" y2="36" stroke="#fed7d7" stroke-width="1" />
    <text x="16" y="23" class="coral-title">PASEO WORKTREE 动态隔离池 (.paseo/worktrees/)</text>

    <!-- Worktree A -->
    <g transform="translate(16, 50)">
      <rect width="328" height="116" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">Worktree A: agent-feat-auth</text>
      <text x="12" y="44" class="tag">Branch: paseo/feat-auth (独立隔离目录)</text>
      <text x="12" y="66" class="desc">• 独立 node_modules 软链接与环境变量</text>
      <text x="12" y="86" class="desc">• Agent A (Claude) 独占，专注重构中间件</text>
      <text x="12" y="104" class="coral-tag">状态: 独立产出 Commit A (Clean &amp; Tested)</text>
    </g>

    <!-- Worktree B -->
    <g transform="translate(16, 186)">
      <rect width="328" height="116" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">Worktree B: agent-fix-leak</text>
      <text x="12" y="44" class="tag">Branch: paseo/fix-leak (独立隔离目录)</text>
      <text x="12" y="66" class="desc">• 独立运行 Jest 单元测试与热重载</text>
      <text x="12" y="86" class="desc">• Agent B (Codex) 独占，无任何 index.lock 锁竞争</text>
      <text x="12" y="104" class="coral-tag">状态: 独立产出 Commit B (Profiling Passing)</text>
    </g>
  </g>

  <!-- Connectors: Pool -> Results -->
  <path d="M 690 170 L 750 170" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 690 300 L 750 300" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Result Nodes (Right) -->
  <g transform="translate(750, 130)">
    <rect width="180" height="80" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="22" class="title" style="font-size:12px;">通过评审合流</text>
    <text x="12" y="44" class="desc">PR 审批通过后无缝 Fast-forward 或 Squash</text>
    <text x="12" y="66" class="tag">安全合并至 main</text>
  </g>

  <g transform="translate(750, 260)">
    <rect width="180" height="80" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="22" class="title" style="font-size:12px;">自动回收销毁</text>
    <text x="12" y="44" class="desc">任务取消或失败，一键静默清理工作树</text>
    <text x="12" y="66" class="coral-tag">主工作树 0 脏污残留</text>
  </g>
</svg>