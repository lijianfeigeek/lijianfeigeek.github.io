<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reverse-skill-agent-chaos-vs-governance-title reverse-skill-agent-chaos-vs-governance-desc">
  <title id="reverse-skill-agent-chaos-vs-governance-title">通用 Agent 安全失控痛点 vs reverse-skill 核心治理体系对比</title>
  <desc id="reverse-skill-agent-chaos-vs-governance-desc">对比通用大模型在安全渗透中的五大失控断层与 reverse-skill 的规范治理解决方案</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-red { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #e11d48; }
      .tag-green { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #059669; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left Column: Agent Chaos (5 Pain Points) -->
  <g transform="translate(24, 20)">
    <rect width="420" height="340" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <rect x="0" y="0" width="420" height="36" rx="8" fill="#fff1f2"/>
    <path d="M0 28 h420 v8 h-420 z" fill="#fff1f2"/>
    <text x="16" y="23" class="label-title" fill="#be123c">通用 Agent 安全作业五大失控断层</text>
    <text x="340" y="23" class="tag-red">CHAOS</text>

    <!-- Point 1 -->
    <g transform="translate(16, 48)">
      <rect width="388" height="48" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#9d174d">1. 工具认知迷茫</text>
      <text x="12" y="36" class="text-code" fill="#831843">面对 APK/ELF/JS 不知选 JADX、Radare2 还是 Frida</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(16, 104)">
      <rect width="388" height="48" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#be123c">2. 授权范围越界 (High Risk)</text>
      <text x="12" y="36" class="text-code" fill="#9f1239">在无授权情况下对目标执行主动扫描利用，触碰法律红线</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(16, 160)">
      <rect width="388" height="48" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#be123c">3. 命令幻觉与虚假漏洞</text>
      <text x="12" y="36" class="text-code" fill="#9f1239">空口断定存在注入，缺乏复现流量、不可变证据与命令</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(16, 216)">
      <rect width="388" height="48" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#c2410c">4. 跨平台依赖碎片化</text>
      <text x="12" y="36" class="text-code" fill="#9a3412">Windows / Mac / Linux 环境缺失依赖即崩溃中断，无法自愈</text>
    </g>

    <!-- Point 5 -->
    <g transform="translate(16, 272)">
      <rect width="388" height="48" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#a16207">5. 实战经验无法沉淀</text>
      <text x="12" y="36" class="text-code" fill="#854d0e">解决一次 OLLVM 混淆后随会话遗忘，下次遇到从头踩坑</text>
    </g>
  </g>

  <!-- Middle Transition Arrows -->
  <g transform="translate(444, 20)">
    <path d="M 10 72 L 62 72" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="62,68 70,72 62,76" fill="#10b981"/>

    <path d="M 10 128 L 62 128" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="62,124 70,128 62,132" fill="#10b981"/>

    <path d="M 10 184 L 62 184" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="62,180 70,184 62,188" fill="#10b981"/>

    <path d="M 10 240 L 62 240" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="62,236 70,240 62,244" fill="#10b981"/>

    <path d="M 10 296 L 62 296" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="62,292 70,296 62,300" fill="#10b981"/>
  </g>

  <!-- Right Column: reverse-skill Solutions -->
  <g transform="translate(516, 20)">
    <rect width="420" height="340" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="36" rx="8" fill="#ecfdf5"/>
    <path d="M0 28 h420 v8 h-420 z" fill="#ecfdf5"/>
    <text x="16" y="23" class="label-title" fill="#065f46">reverse-skill 核心治理体系</text>
    <text x="320" y="23" class="tag-green">GOVERNED</text>

    <!-- Sol 1 -->
    <g transform="translate(16, 48)">
      <rect width="388" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#166534">1. 单一事实源路由矩阵</text>
      <text x="12" y="36" class="text-code" fill="#15803d">routing.json + 44 条严密排他规则，三轴精准决胜</text>
    </g>

    <!-- Sol 2 -->
    <g transform="translate(16, 104)">
      <rect width="388" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#166534">2. Scope 契约硬门禁 (Zero Trust)</text>
      <text x="12" y="36" class="text-code" fill="#15803d">auth.status != granted 严禁向目标发出任何网络数据包</text>
    </g>

    <!-- Sol 3 -->
    <g transform="translate(16, 160)">
      <rect width="388" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#166534">3. Evidence → Finding → Path 证据图</text>
      <text x="12" y="36" class="text-code" fill="#15803d">SHA-256 固化抗篡改校验，无证据孤岛，100% 可复现</text>
    </g>

    <!-- Sol 4 -->
    <g transform="translate(16, 216)">
      <rect width="388" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#166534">4. 声明式按需自举机制</text>
      <text x="12" y="36" class="text-code" fill="#15803d">原生脚本自动拉取依赖，动态生成真实 tool-index 绝对路径</text>
    </g>

    <!-- Sol 5 -->
    <g transform="translate(16, 272)">
      <rect width="388" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#166534">5. field-journal 脱敏持续回写</text>
      <text x="12" y="36" class="text-code" fill="#15803d">踩坑复盘沉淀为团队先例库，实现跨会话认知自进化</text>
    </g>
  </g>
</svg>