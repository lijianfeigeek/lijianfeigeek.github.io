<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="ua-dil-title ua-dil-desc">
  <title id="ua-dil-title">代码可视化工具的两难困局与混合架构破局</title>
  <desc id="ua-dil-desc">对比展示静态依赖工具的发丝团陷阱、纯LLM工具的幻觉断裂缺陷，以及Understand-Anything基于Tree-sitter与多智能体分层的混合架构解决方案。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">代码可视化工具的两难困局与混合架构破局</text>
    <text class="subtitle" x="0" y="20">传统静态 AST 连线乱麻 vs. 纯大模型幻觉断裂 vs. 物理事实与多智能体分层混合图谱</text>
  </g>

  <!-- Left: Dilemma 1 (Static AST) -->
  <g transform="translate(48, 86)">
    <rect width="270" height="348" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text class="box-title" fill="#be123c" x="16" y="24">困局一：传统静态依赖工具</text>
    <text class="mono" fill="#e11d48" x="16" y="40">Doxygen / Dependency Cruiser</text>

    <g transform="translate(16, 56)">
      <rect width="238" height="120" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#be123c" x="0" y="0">【发丝团陷阱 (Hairball)】</text>
        <text class="card-body" x="0" y="18">• 把全量 AST 节点生硬全部连线</text>
        <text class="card-body" x="0" y="34">• 形成密不透风、毫无重点的视觉乱麻</text>
        <text class="card-body" x="0" y="50">• 节点只知底层 import，缺乏业务语义</text>
        <text class="card-body" x="0" y="66">• 无法识别“核心领域”与“工具边角”</text>
        <text class="mono" fill="#9f1239" x="0" y="86">PAIN: 认知负荷过载，无法辅助决策</text>
      </g>
    </g>

    <g transform="translate(16, 192)">
      <rect width="238" height="120" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#9f1239" x="0" y="0">根本症结：缺乏架构抽象</text>
        <text class="card-body" fill="#881337" x="0" y="18">• 无法按领域驱动设计 (DDD) 分层</text>
        <text class="card-body" fill="#881337" x="0" y="34">• 缺少设计模式与业务主流程识别</text>
        <text class="card-body" fill="#881337" x="0" y="50">• 无法提供新人学习路径 (Tour)</text>
        <text class="mono" fill="#9f1239" x="0" y="74">LIMIT: 只能看语法，不能懂业务</text>
      </g>
    </g>
  </g>

  <!-- Center: Dilemma 2 (Pure LLM) -->
  <g transform="translate(334, 86)">
    <rect width="270" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text class="box-title" fill="#c2410c" x="16" y="24">困局二：纯大模型黑盒生成</text>
    <text class="mono" fill="#ea580c" x="16" y="40">Pure LLM Markdown Diagrams</text>

    <g transform="translate(16, 56)">
      <rect width="238" height="120" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">【幻觉与断裂陷阱】</text>
        <text class="card-body" x="0" y="18">• 上下文窗口截断，重要文件被遗漏</text>
        <text class="card-body" x="0" y="34">• 虚构不存在的类、方法与调用边</text>
        <text class="card-body" x="0" y="50">• 每次生成随机漂移，无法版本锁定</text>
        <text class="card-body" x="0" y="66">• 缺少精确代码行号与物理回溯</text>
        <text class="mono" fill="#9a3412" x="0" y="86">PAIN: 结构失真，无法作为工程基线</text>
      </g>
    </g>

    <g transform="translate(16, 192)">
      <rect width="238" height="120" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#9a3412" x="0" y="0">增量雪崩：符号遗漏灾难</text>
        <text class="card-body" fill="#7c2d12" x="0" y="18">• 局部更新文件时，随机漏掉 2 个函数</text>
        <text class="card-body" fill="#7c2d12" x="0" y="34">• 误判为已删除，连锁引发依赖雪崩</text>
        <text class="card-body" fill="#7c2d12" x="0" y="50">• 每次增量更新都面临图谱破坏风险</text>
        <text class="mono" fill="#9a3412" x="0" y="74">LIMIT: 无法在工业级 CI 中持续运维</text>
      </g>
    </g>
  </g>

  <!-- Right: Solution (Understand-Anything Hybrid) -->
  <g transform="translate(620, 86)">
    <rect width="292" height="348" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text class="box-title" fill="#15803d" x="16" y="24">Understand-Anything 混合架构</text>
    <text class="mono" fill="#16a34a" x="16" y="40">Hybrid AST + Multi-Agent Intelligence</text>

    <g transform="translate(16, 56)">
      <rect width="260" height="120" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">物理事实：Tree-sitter WASM</text>
        <text class="card-body" x="0" y="18">• 严格提取 AST 符号签名、导入与层级</text>
        <text class="card-body" x="0" y="34">• 保证代码行号、物理声明 100% 真实</text>
        <text class="card-body" x="0" y="50">• 生成全局确定性的 importMap 骨架</text>
        <text class="card-body" x="0" y="66">• 杜绝大模型凭空捏造不存在的依赖</text>
        <text class="mono" fill="#15803d" x="0" y="86">BASE: 物理代码真理来源 (Ground Truth)</text>
      </g>
    </g>

    <g transform="translate(16, 192)">
      <rect width="260" height="120" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">语义提纯：多智能体协作网络</text>
        <text class="card-body" fill="#166534" x="0" y="18">• file-analyzer 提取意图与业务概念</text>
        <text class="card-body" fill="#166534" x="0" y="34">• architecture-analyzer 推导逻辑层级</text>
        <text class="card-body" fill="#166534" x="0" y="50">• tour-builder 自动生成新人导览学习流</text>
        <text class="card-body" fill="#166534" x="0" y="66">• Symbol-Loss 门禁杜绝增量遗漏</text>
        <text class="mono" fill="#15803d" x="0" y="86">RESULT: 27类节点+38类边完备模型</text>
      </g>
    </g>
  </g>
</svg>