<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="iosboom-swimlane-title iosboom-swimlane-desc">
  <title id="iosboom-swimlane-title">iosBoom 双引擎云端重签与 Safari UDID 闭环泳道图</title>
  <desc id="iosboom-swimlane-desc">展示浏览器端、控制面与 R2 存储、tryui/ipasign 双签名后端、以及 iOS 设备系统设置与 SpringBoard 之间的四泳道时序流转。</desc>
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
    </marker>
    <marker id="sw-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="sw-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
    </marker>
    <marker id="sw-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="580" fill="#f8fafc"/>

  <!-- Header -->
  <text x="32" y="36" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700">免 Mac 云端签名双管线与 Safari UDID 采集闭环（四泳道）</text>
  <text x="32" y="56" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">SWIMLANE · MOBILECONFIG UDID LOOP + TRYUI R2/SSE ENGINE vs IPASIGN MULTIPART FALLBACK</text>

  <!-- 4 Swimlane Rows -->
  <!-- Lane 1: y=76..180 -->
  <rect x="32" y="76" width="896" height="104" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="76" width="128" height="104" rx="6" fill="#f1f5f9"/>
  <line x1="160" y1="76" x2="160" y2="180" stroke="#cbd5e1" stroke-width="1"/>
  <text x="96" y="122" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Browser / Safari</text>
  <text x="96" y="140" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">前端与本地证书库</text>

  <!-- Lane 2: y=192..296 -->
  <rect x="32" y="192" width="896" height="104" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="192" width="128" height="104" rx="6" fill="#f1f5f9"/>
  <line x1="160" y1="192" x2="160" y2="296" stroke="#cbd5e1" stroke-width="1"/>
  <text x="96" y="238" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Supabase + R2</text>
  <text x="96" y="256" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">预签名与状态分发</text>

  <!-- Lane 3: y=308..412 -->
  <rect x="32" y="308" width="896" height="104" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="308" width="128" height="104" rx="6" fill="#f1f5f9"/>
  <line x1="160" y1="308" x2="160" y2="412" stroke="#cbd5e1" stroke-width="1"/>
  <text x="96" y="354" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Signing Workers</text>
  <text x="96" y="372" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">tryui / ipasign</text>

  <!-- Lane 4: y=424..512 -->
  <rect x="32" y="424" width="896" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="424" width="128" height="88" rx="6" fill="#f1f5f9"/>
  <line x1="160" y1="424" x2="160" y2="512" stroke="#cbd5e1" stroke-width="1"/>
  <text x="96" y="462" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">iOS Device</text>
  <text x="96" y="480" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">系统设置与 SpringBoard</text>

  <!-- Connectors (drawn before step boxes) -->
  <!-- Step 1 (UDID Safari) -> Step 4b (iOS Settings) -->
  <path d="M 244,160 V 426 Q 244,434 252,434 H 268" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#sw-arrow)"/>
  <!-- iOS Settings -> Browser UDID callback -->
  <path d="M 356,434 V 166" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#sw-ok)"/>

  <!-- Local P12 Vault -> R2 Presign -->
  <path d="M 432,160 V 204" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#sw-link)"/>
  <!-- R2 Presign -> R2 PUT & Task Init -->
  <path d="M 520,244 H 568" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#sw-link)"/>
  <!-- R2 publicUrl -> tryui Worker -->
  <path d="M 656,280 V 320" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#sw-accent)"/>
  <!-- ipasign fallback directly from Local Vault -->
  <path d="M 508,128 H 768 Q 776,128 776,136 V 316" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sw-arrow)"/>
  <!-- tryui -> SSE / Poll feedback to Browser -->
  <path d="M 744,360 H 760" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sw-accent)"/>
  <!-- Worker -> iOS OTA Install -->
  <path d="M 832,396 V 434" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#sw-ok)"/>

  <!-- Label Masks -->
  <rect x="200" y="294" width="88" height="16" rx="2" fill="#f8fafc"/>
  <text x="244" y="306" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" text-anchor="middle">.mobileconfig</text>

  <rect x="308" y="294" width="96" height="16" rx="2" fill="#f8fafc"/>
  <text x="356" y="306" fill="#059669" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" text-anchor="middle">?udid=&amp;model=</text>

  <rect x="598" y="118" width="136" height="16" rx="2" fill="#f8fafc"/>
  <text x="666" y="130" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" text-anchor="middle">OR IPASIGN POST /sign</text>

  <!-- Step Boxes (each isolated in <g transform>) -->
  <!-- Lane 1 Boxes -->
  <g transform="translate(176, 94)">
    <rect x="0" y="0" width="136" height="66" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.1"/>
    <text x="10" y="20" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">1. Safari UA 守卫</text>
    <text x="10" y="38" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">拦截非 Safari 内核</text>
    <text x="10" y="54" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">udid.tryui.dev</text>
  </g>

  <g transform="translate(340, 94)">
    <rect x="0" y="0" width="168" height="66" rx="6" fill="#f8fafc" stroke="#2d3142" stroke-width="1.1"/>
    <text x="10" y="20" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">2. 本地 P12 证书保险箱</text>
    <text x="10" y="38" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">Base64 存 localStorage</text>
    <text x="10" y="54" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">tryplus.custom_certs.v1</text>
  </g>

  <!-- Lane 2 Boxes -->
  <g transform="translate(360, 208)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="20" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">3. 申请 R2 预签名</text>
    <text x="10" y="38" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">Edge Fn 签发 PUT URL</text>
    <text x="10" y="56" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">trydevui-r2-upload</text>
  </g>

  <g transform="translate(568, 208)">
    <rect x="0" y="0" width="176" height="72" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="20" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">4. 直传大体积 IPA 至 R2</text>
    <text x="10" y="38" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">进度占 0-50% · 1h 超时</text>
    <text x="10" y="56" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">PUT octet-stream → publicUrl</text>
  </g>

  <!-- Lane 3 Boxes -->
  <g transform="translate(568, 322)">
    <rect x="0" y="0" width="176" height="74" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <text x="10" y="20" fill="#bf4520" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">5. tryui 异步重签任务</text>
    <text x="10" y="38" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">Dylib 注入/去 Watch/改 Bid</text>
    <text x="10" y="56" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">POST /tasks/{id} · zsign</text>
  </g>

  <g transform="translate(760, 322)">
    <rect x="0" y="0" width="148" height="74" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="10" y="20" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">6. SSE 实时进度与清理</text>
    <text x="10" y="38" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">9 阶段单调递增(50-100%)</text>
    <text x="10" y="56" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">EventSource + R2 delete</text>
  </g>

  <!-- Lane 4 Boxes -->
  <g transform="translate(268, 434)">
    <rect x="0" y="0" width="176" height="66" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
    <text x="10" y="20" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">设备描述文件读取 UDID</text>
    <text x="10" y="38" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">设置 → VPN与设备管理</text>
    <text x="10" y="54" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">提取 UDID + PRODUCT 型号</text>
  </g>

  <g transform="translate(740, 434)">
    <rect x="0" y="0" width="168" height="66" rx="6" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.4"/>
    <text x="10" y="20" fill="#059669" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">7. SpringBoard OTA 安装</text>
    <text x="10" y="38" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10.5">唤醒原生应用安装弹窗</text>
    <text x="10" y="54" fill="#059669" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">itms-services://?url=plist</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="32" y="528" width="896" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="48" y1="546" x2="78" y2="546" stroke="#bf4520" stroke-width="1.6"/>
  <text x="86" y="550" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">tryui 主干管线 (R2 + SSE)</text>

  <line x1="256" y1="546" x2="286" y2="546" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="294" y="550" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">ipasign 备选直传 / UDID 描述文件流程</text>

  <line x1="556" y1="546" x2="586" y2="546" stroke="#059669" stroke-width="1.6"/>
  <text x="594" y="550" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">回传验证 / OTA 系统级安装通道</text>
</svg>
