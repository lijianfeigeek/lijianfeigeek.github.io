<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .layer-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .card-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1e293b; }
      .card-detail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="520" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="918" height="518" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <!-- Title Area -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="title">doublera1n 跨层级防御穿透与内核补丁架构栈</text>
    <text x="0" y="20" class="subtitle">从 A13 硅片 BootROM 物理特权层向下贯穿至 XNU 内核与 APFS 虚拟文件系统的多维控制面解构</text>
  </g>

  <!-- Layer 5: Userland (Top) -->
  <g transform="translate(32, 70)">
    <rect width="856" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="168" height="74" fill="#f8fafc" rx="6"/>
    <rect x="160" y="0" width="8" height="74" fill="#f8fafc"/>
    <g transform="translate(14, 28)">
      <text x="0" y="0" class="layer-tag" fill="#0284c7">LAYER 5</text>
      <text x="0" y="20" class="layer-title">用户态根无越狱层</text>
    </g>

    <g transform="translate(182, 10)">
      <rect width="156" height="54" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">jbinit (PID 1 代理)</text>
      <text x="10" y="40" class="card-detail">bindfs 映射 /jbin -&gt; /cores</text>
    </g>

    <g transform="translate(348, 10)">
      <rect width="156" height="54" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">ElleKit 动态注入</text>
      <text x="10" y="40" class="card-detail">注入 systemhook &amp; obhook</text>
    </g>

    <g transform="translate(514, 10)">
      <rect width="156" height="54" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">Procursus 运行时</text>
      <text x="10" y="40" class="card-detail">纯净 /var/jb 基础软件包栈</text>
    </g>

    <g transform="translate(680, 10)">
      <rect width="162" height="54" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">Sileo 2.5.1 魔改版</text>
      <text x="10" y="40" class="card-detail">Swift 架构绕过 arm64x</text>
    </g>
  </g>

  <!-- Layer 4: XNU Kernel -->
  <g transform="translate(32, 154)">
    <rect width="856" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="168" height="74" fill="#f8fafc" rx="6"/>
    <rect x="160" y="0" width="8" height="74" fill="#f8fafc"/>
    <g transform="translate(14, 28)">
      <text x="0" y="0" class="layer-tag" fill="#059669">LAYER 4</text>
      <text x="0" y="20" class="layer-title">XNU 内核与安全子系统</text>
    </g>

    <g transform="translate(182, 10)">
      <rect width="156" height="54" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">SEP Panic 桩屏蔽</text>
      <text x="10" y="40" class="card-detail">REQUIRE(!booted) -&gt; NOP</text>
    </g>

    <g transform="translate(348, 10)">
      <rect width="156" height="54" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">AppleSEPKeyStore 桩</text>
      <text x="10" y="40" class="card-detail">sep-booted 返 0 (False)</text>
    </g>

    <g transform="translate(514, 10)">
      <rect width="156" height="54" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">setPowerState 修复</text>
      <text x="10" y="40" class="card-detail">消除锁屏睡眠内核崩溃</text>
    </g>

    <g transform="translate(680, 10)">
      <rect width="162" height="54" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">__mac_mount 放行</text>
      <text x="10" y="40" class="card-detail">解除 MNT_UNION 挂载限制</text>
    </g>
  </g>

  <!-- Layer 3: DeviceTree & VFS -->
  <g transform="translate(32, 238)">
    <rect width="856" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="168" height="74" fill="#f8fafc" rx="6"/>
    <rect x="160" y="0" width="8" height="74" fill="#f8fafc"/>
    <g transform="translate(14, 28)">
      <text x="0" y="0" class="layer-tag" fill="#d97706">LAYER 3</text>
      <text x="0" y="20" class="layer-title">设备树与 APFS 重定向</text>
    </g>

    <g transform="translate(182, 10)">
      <rect width="156" height="54" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">data-vol fs_role=0</text>
      <text x="10" y="40" class="card-detail">挑选 DataB 绑定 /var</text>
    </g>

    <g transform="translate(348, 10)">
      <rect width="156" height="54" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">共享分区 ro 保护</text>
      <text x="10" y="40" class="card-detail">xart / update / hardware ro</text>
    </g>

    <g transform="translate(514, 10)">
      <rect width="156" height="54" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">蜂窝基带 rw 保持</text>
      <text x="10" y="40" class="card-detail">baseband-vol 维持读写通信</text>
    </g>

    <g transform="translate(680, 10)">
      <rect width="162" height="54" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">content-protect 擦除</text>
      <text x="10" y="40" class="card-detail">禁用硬件默认数据加密</text>
    </g>
  </g>

  <!-- Layer 2: iBoot & Memory Patching -->
  <g transform="translate(32, 322)">
    <rect width="856" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="168" height="74" fill="#f8fafc" rx="6"/>
    <rect x="160" y="0" width="8" height="74" fill="#f8fafc"/>
    <g transform="translate(14, 28)">
      <text x="0" y="0" class="layer-tag" fill="#7c3aed">LAYER 2</text>
      <text x="0" y="20" class="layer-title">iBoot 固件热补丁层</text>
    </g>

    <g transform="translate(182, 10)">
      <rect width="156" height="54" fill="#fbfbfe" stroke="#ddd6fe" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">Image4 验签回调绕过</text>
      <text x="10" y="40" class="card-detail">回调直接返回 0 (Success)</text>
    </g>

    <g transform="translate(348, 10)">
      <rect width="156" height="54" fill="#fbfbfe" stroke="#ddd6fe" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">boot-args snprintf 劫持</text>
      <text x="10" y="40" class="card-detail">重写自定义内核引导参数</text>
    </g>

    <g transform="translate(514, 10)">
      <rect width="156" height="54" fill="#fbfbfe" stroke="#ddd6fe" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">memboot -&gt; fsboot</text>
      <text x="10" y="40" class="card-detail">利用 NAND 真实票据引导</text>
    </g>

    <g transform="translate(680, 10)">
      <rect width="162" height="54" fill="#fbfbfe" stroke="#ddd6fe" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">in-RAM KPF 引擎</text>
      <text x="10" y="40" class="card-detail">内核与设备树内存补丁注入</text>
    </g>
  </g>

  <!-- Layer 1: Hardware & SecureROM -->
  <g transform="translate(32, 406)">
    <rect width="856" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="168" height="74" fill="#f8fafc" rx="6"/>
    <rect x="160" y="0" width="8" height="74" fill="#f8fafc"/>
    <g transform="translate(14, 28)">
      <text x="0" y="0" class="layer-tag" fill="#be123c">LAYER 1</text>
      <text x="0" y="20" class="layer-title">A13 硬件与 SecureROM</text>
    </g>

    <g transform="translate(182, 10)">
      <rect width="156" height="54" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">usbliter8 硬件利用</text>
      <text x="10" y="40" class="card-detail">SecureROM 固件不可修补缺陷</text>
    </g>

    <g transform="translate(348, 10)">
      <rect width="156" height="54" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">USB 控制端点竞争</text>
      <text x="10" y="40" class="card-detail">建立 pwned DFU 特权上下文</text>
    </g>

    <g transform="translate(514, 10)">
      <rect width="156" height="54" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">RP2350 专用硬件板</text>
      <text x="10" y="40" class="card-detail">纳秒级精准时序高频注入</text>
    </g>

    <g transform="translate(680, 10)">
      <rect width="162" height="54" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="5"/>
      <text x="10" y="22" class="card-name">UART 串口直读</text>
      <text x="10" y="40" class="card-detail">转储机载原生 APTicket 凭证据</text>
    </g>
  </g>
</svg>
