<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="1140" height="760" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="rowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0e1522" />
    </linearGradient>
    <linearGradient id="redBadge3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="greenBadge3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1140" height="760" fill="#ffffff" />
  <rect x="20" y="20" width="1100" height="720" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(56, 50)">
    <rect x="0" y="0" width="200" height="24" rx="6" fill="#f8fafc" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE DELTA MATRIX</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">原版 Erosion 致命缺陷 vs. Erosion-CN 安全加固矩阵</text>
    <text x="0" y="74" fill="#475569" font-size="13">对比真机排坑过程中的五大灾难性崩溃点，以及 Erosion-CN 生产级防御方案的底层工程实现</text>
  </g>

  <!-- Table Column Headers -->
  <g transform="translate(56, 136)">
    <rect width="210" height="36" rx="6" fill="#f8fafc" />
    <text x="16" y="23" fill="#334155" font-size="12" font-weight="700">故障维度 / 风险场景</text>

    <rect x="222" y="0" width="384" height="36" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1" />
    <text x="238" y="23" fill="#e11d48" font-size="12" font-weight="700">上游官方原版 Erosion（致命缺陷）</text>

    <rect x="618" y="0" width="410" height="36" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1" />
    <text x="634" y="23" fill="#059669" font-size="12" font-weight="700">Erosion-CN 汉化安全加固版（根治方案）</text>
  </g>

  <!-- Row 1: Reboot Bouncing Back -->
  <g transform="translate(56, 184)">
    <rect width="1028" height="98" rx="8" fill="url(#rowGrad3)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Dimension -->
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="700">1. 重启反弹回原厂</text>
      <text x="0" y="34" fill="#0284c7" font-size="11">持久化失效</text>
      <text x="0" y="52" fill="#475569" font-size="10">Inode / POSIX 属主 / 键合法性</text>
    </g>
    <!-- Flaw -->
    <g transform="translate(222, 12)">
      <rect width="384" height="74" rx="6" fill="#fff1f2" stroke="#3b1d28" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="600">● 走临时文件替换，摧毁 _mobilegestalt 属主</text>
      <text x="12" y="36" fill="#334155" font-size="10">replaceItemAt 破坏原文件 Inode 与权限，重启即被系统丢弃；</text>
      <text x="12" y="50" fill="#334155" font-size="10">在 iOS 27 错误注入非缓存键 RegionInfo，触发开机全包重置</text>
      <text x="12" y="66" fill="#ef4444" font-size="10" font-weight="700">后果：手机一重启所有修改彻底打回原形！</text>
    </g>
    <!-- Fix -->
    <g transform="translate(618, 12)">
      <rect width="410" height="74" rx="6" fill="#f0fdf4" stroke="#134e40" stroke-width="1" />
      <text x="12" y="20" fill="#059669" font-size="11" font-weight="600">✔ 强制锁定原位覆盖写入 + 剔除非缓存保留键</text>
      <text x="12" y="36" fill="#334155" font-size="10">pwrite 保持 Inode 与属主权限 100% 原始不变；</text>
      <text x="12" y="50" fill="#334155" font-size="10">规范写入对应机型 RegulatoryModelNumber 与 RegionSysconfig</text>
      <text x="12" y="66" fill="#059669" font-size="10" font-weight="700">成效：真正持久生效，日常随意冷重启永不失效！</text>
    </g>
  </g>

  <!-- Row 2: Camera Black Screen -->
  <g transform="translate(56, 292)">
    <rect width="1028" height="98" rx="8" fill="url(#rowGrad3)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Dimension -->
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="700">2. 相机取景黑屏</text>
      <text x="0" y="34" fill="#0284c7" font-size="11">数据类型破坏</text>
      <text x="0" y="52" fill="#475569" font-size="10">CFBoolean 与 Double 浮点丢失</text>
    </g>
    <!-- Flaw -->
    <g transform="translate(222, 12)">
      <rect width="384" height="74" rx="6" fill="#fff1f2" stroke="#3b1d28" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="600">● PlistManager 暴力将布尔与浮点转为整数</text>
      <text x="12" y="36" fill="#334155" font-size="10">重新序列化时把 1.0、2.0 变焦倍率与布尔值强转 integer，</text>
      <text x="12" y="50" fill="#334155" font-size="10">AVFoundation 相机管线底层校验浮点类型失败抛出异常</text>
      <text x="12" y="66" fill="#ef4444" font-size="10" font-weight="700">后果：修改后打开原生相机预览完全漆黑！</text>
    </g>
    <!-- Fix -->
    <g transform="translate(618, 12)">
      <rect width="410" height="74" rx="6" fill="#f0fdf4" stroke="#134e40" stroke-width="1" />
      <text x="12" y="20" fill="#059669" font-size="11" font-weight="600">✔ CFGetTypeID 精准分流 + 未改项 100% 原样无损直通</text>
      <text x="12" y="36" fill="#334155" font-size="10">CFNumberIsFloatType 精确保留 Double 浮点与 CFBoolean 标签；</text>
      <text x="12" y="50" fill="#334155" font-size="10">未编辑项直接回传 rawVal 无损直通，杜绝二次破坏</text>
      <text x="12" y="66" fill="#059669" font-size="10" font-weight="700">成效：相机变焦、色彩滤镜与 ISP 初始化 100% 完美正常！</text>
    </g>
  </g>

  <!-- Row 3: 0-Byte Window Soft Brick -->
  <g transform="translate(56, 400)">
    <rect width="1028" height="98" rx="8" fill="url(#rowGrad3)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Dimension -->
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="700">3. 0 字节白苹果软砖</text>
      <text x="0" y="34" fill="#0284c7" font-size="11">落盘崩溃容错</text>
      <text x="0" y="52" fill="#475569" font-size="10">ftruncate(0) 悬空窗口</text>
    </g>
    <!-- Flaw -->
    <g transform="translate(222, 12)">
      <rect width="384" height="74" rx="6" fill="#fff1f2" stroke="#3b1d28" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="600">● 写入前先执行 ftruncate(fd, 0) 清空目标文件</text>
      <text x="12" y="36" fill="#334155" font-size="10">若在写入期间应用被杀、闪退、断电或内核崩溃，</text>
      <text x="12" y="50" fill="#334155" font-size="10">MobileGestalt 永久停留为 0 字节空文件无法恢复</text>
      <text x="12" y="66" fill="#ef4444" font-size="10" font-weight="700">后果：设备开机直接进入白苹果无限循环！</text>
    </g>
    <!-- Fix -->
    <g transform="translate(618, 12)">
      <rect width="410" height="74" rx="6" fill="#f0fdf4" stroke="#134e40" stroke-width="1" />
      <text x="12" y="20" fill="#059669" font-size="11" font-weight="600">✔ 零 0 字节窗口原位覆写 + F_FULLFSYNC + 自动回滚</text>
      <text x="12" y="36" fill="#334155" font-size="10">pwrite 从 offset 0 原位覆盖写入，写完才按需裁剪尾部；</text>
      <text x="12" y="50" fill="#334155" font-size="10">强制物理落盘并全量读回校验，任何失败立即原位刷回 og</text>
      <text x="12" y="66" fill="#059669" font-size="10" font-weight="700">成效：断电、异常中断绝不留空文件，安全零风险！</text>
    </g>
  </g>

  <!-- Row 4: Dynamic Dyld Parsing -->
  <g transform="translate(56, 508)">
    <rect width="1028" height="98" rx="8" fill="url(#rowGrad3)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Dimension -->
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="700">4. 槽位偏移错位越界</text>
      <text x="0" y="34" fill="#0284c7" font-size="11">底层布局适应性</text>
      <text x="0" y="52" fill="#475569" font-size="10">跨机型与跨小版本漂移</text>
    </g>
    <!-- Flaw -->
    <g transform="translate(222, 12)">
      <rect width="384" height="74" rx="6" fill="#fff1f2" stroke="#3b1d28" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="600">● 依赖静态硬编码槽位偏移或脆弱规则</text>
      <text x="12" y="36" fill="#334155" font-size="10">不同机型与小版本（如 27.1 vs 27.2 vs 27.3 beta 1）二进制结构不同，</text>
      <text x="12" y="50" fill="#334155" font-size="10">静态偏移极易篡改到邻近硬件特性或破坏校验位</text>
      <text x="12" y="66" fill="#ef4444" font-size="10" font-weight="700">后果：改错槽位引发基带死锁或未知功能崩溃！</text>
    </g>
    <!-- Fix -->
    <g transform="translate(618, 12)">
      <rect width="410" height="74" rx="6" fill="#f0fdf4" stroke="#134e40" stroke-width="1" />
      <text x="12" y="20" fill="#059669" font-size="11" font-weight="600">✔ 运行时动态解析 libMobileGestalt.dylib + 五重严苛门禁</text>
      <text x="12" y="36" fill="#334155" font-size="10">只读解析内存镜像 __cstring 与 __const，实时计算槽位与 UUID；</text>
      <text x="12" y="50" fill="#334155" font-size="10">校验长度 == slotCount × 9、validity == 1，未通过严禁写入</text>
      <text x="12" y="66" fill="#059669" font-size="10" font-weight="700">成效：零硬编码，100% 自动精确契合当前机型与当前系统！</text>
    </g>
  </g>

  <!-- Row 5: SiriHub &amp; AI Conflicts -->
  <g transform="translate(56, 616)">
    <rect width="1028" height="98" rx="8" fill="url(#rowGrad3)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Dimension -->
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#f8fafc" font-size="13" font-weight="700">5. 意图死循环与 AI 冲突</text>
      <text x="0" y="34" fill="#0284c7" font-size="11">功能互斥保护</text>
      <text x="0" y="52" fill="#475569" font-size="10">SiriHub 与照片高质量消除</text>
    </g>
    <!-- Flaw -->
    <g transform="translate(222, 12)">
      <rect width="384" height="74" rx="6" fill="#fff1f2" stroke="#3b1d28" stroke-width="1" />
      <text x="12" y="20" fill="#e11d48" font-size="11" font-weight="600">● 盲目暴露不兼容特性（SiriHub、非原生 AI 槽位）</text>
      <text x="12" y="36" fill="#334155" font-size="10">开启 DeviceSupportsSiriHub 导致 Siri 意图解析无限死循环卡死；</text>
      <text x="12" y="50" fill="#334155" font-size="10">强开非原生 Audio Intelligence 破坏照片 Clean Up 管线</text>
      <text x="12" y="66" fill="#ef4444" font-size="10" font-weight="700">后果：Siri 瘫痪、相册照片“高质量消除”直接报错！</text>
    </g>
    <!-- Fix -->
    <g transform="translate(618, 12)">
      <rect width="410" height="74" rx="6" fill="#f0fdf4" stroke="#134e40" stroke-width="1" />
      <text x="12" y="20" fill="#059669" font-size="11" font-weight="600">✔ 冲突项防呆锁定 + 一键自愈 + 18 Pro 原生基线保护</text>
      <text x="12" y="36" fill="#334155" font-size="10">锁定 SiriHub 开关并支持一键清除非法残留；</text>
      <text x="12" y="50" fill="#334155" font-size="10">精确保留 18 Pro 的 Personal Translator 原生基线杜绝误杀</text>
      <text x="12" y="66" fill="#059669" font-size="10" font-weight="700">成效：端侧 AI、相册消除与 Siri 全部稳定流畅共存！</text>
    </g>
  </g>
</svg>
