<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-forensics-pipeline-title ios-noir-forensics-pipeline-desc" id="ios-noir-forensics-pipeline-root">
        <title id="ios-noir-forensics-pipeline-title">iOS-NOIR 免越狱底层通信拓扑与原生守护进程集群</title>
        <desc id="ios-noir-forensics-pipeline-desc">主机端控制平面、usbmuxd 物理链路与 iOS 原生守护进程群（lockdownd、HouseArrest、OsTrace）的通信拓扑</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-forensics-pipeline-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-forensics-pipeline-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-forensics-pipeline-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-forensics-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-forensics-pipeline-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-forensics-pipeline-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Column 1: 主机端 Host (Left) -->
        <g transform="translate(40, 40)">
          <rect x="0" y="0" width="220" height="300" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="220" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">HOST RUNTIME (macOS)</text>

          <g transform="translate(14, 52)">
            <rect x="0" y="0" width="192" height="60" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">iOS-NOIR 控制平面</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">ios_noir.py · 审计报告引擎</text>
          </g>

          <g transform="translate(14, 128)">
            <rect x="0" y="0" width="192" height="60" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="12" font-weight="600">pymobiledevice3 协议栈</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">逆向封装 Apple 私有 RPC</text>
          </g>

          <g transform="translate(14, 204)">
            <rect x="0" y="0" width="192" height="70" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">usbmuxd 本地守护进程</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">/var/run/usbmuxd Socket</text>
            <text x="10" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="10">多路复用 USB TCP 数据包</text>
          </g>
        </g>

        <!-- Column 2: 物理传输信道 (Middle) -->
        <g transform="translate(300, 110)">
          <rect x="0" y="0" width="160" height="160" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
          <rect x="0" y="0" width="160" height="30" rx="8" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="14" y="20" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">PHYSICAL WIRE</text>
          <text x="14" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">USB-C / Lightning</text>
          <text x="14" y="82" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">物理连接信道</text>
          <text x="14" y="104" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">TLS 双向证书验签</text>
          <text x="14" y="126" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">信任此电脑 Pairing Record</text>
        </g>

        <!-- Column 3: iOS 原生免越狱守护服务集群 (Right Focal) -->
        <g transform="translate(500, 30)">
          <rect x="0" y="0" width="420" height="320" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="34" rx="8" fill="#bf4520" fill-opacity="0.06"/>
          <text x="16" y="22" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">NATIVE SERVICES · iOS 内核免越狱守护服务群 (FOCAL)</text>

          <!-- lockdownd Gateway -->
          <g transform="translate(20, 48)">
            <rect x="0" y="0" width="380" height="42" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.05"/>
            <text x="12" y="26" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">lockdownd 认证网关 (TCP 62078) · 根信任控制中枢</text>
          </g>

          <!-- 4 Daemons Grid -->
          <g transform="translate(20, 102)">
            <rect x="0" y="0" width="180" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">InstallationProxy</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">获取全机 App 列表、</text>
            <text x="10" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">Info.plist 与声明的</text>
            <text x="10" y="80" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">全部底层 Entitlements</text>
          </g>

          <g transform="translate(220, 102)">
            <rect x="0" y="0" width="180" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">HouseArrestService</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">免密直接挂载沙盒</text>
            <text x="10" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">/Documents 文件卷</text>
            <text x="10" y="80" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">拖取明文 SQLite 密码库</text>
          </g>

          <g transform="translate(20, 204)">
            <rect x="0" y="0" width="180" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">OsTraceService</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">挂载 Unified Logging</text>
            <text x="10" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">实时监控系统内核</text>
            <text x="10" y="80" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">进程拉活与静默唤醒日志</text>
          </g>

          <g transform="translate(220, 204)">
            <rect x="0" y="0" width="180" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="10" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">CrashReportsManager</text>
            <text x="10" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">免密读取崩溃日志</text>
            <text x="10" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">提取全量 .ips 黑匣子</text>
            <text x="10" y="80" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">解析内存泄露与堆栈追踪</text>
          </g>
        </g>

        <!-- Pipeline Connectors -->
        <path d="M 260 190 L 300 190" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-noir-forensics-pipeline-arrow-link)"/>
        <path d="M 460 190 L 500 190" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-noir-forensics-pipeline-arrow-link)"/>
      </svg>
