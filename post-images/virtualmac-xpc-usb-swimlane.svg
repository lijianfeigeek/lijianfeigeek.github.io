<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="vmipad-swim-title vmipad-swim-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="vmipad-swim-title">无 Launchd 跨域进程握手与用户态 DFU USB 安装桥接泳道</title>
  <desc id="vmipad-swim-desc">展示 VirtualMacOniPad 如何在缺失 macOS launchd XPCService 域与 AppleUSBUserHCI 内核驱动的 iPadOS 上，通过挂起 posix_spawn 注入匿名 Mach 端口完成 XPC 握手，并以伪造 IOKit 句柄桥接安装恢复。</desc>
  <defs>
    <marker id="vmsw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="vmsw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="vmsw-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="880" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" font-size="17" font-weight="700" fill="#0f172a">无 Launchd 匿名 XPC 握手与用户态 DFU USB 桥接泳道</text>
    <text x="20" y="42" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">VZXPCHOOK.M + VMMHOOK.M + INSTALLATION_USB_SHIM.M (USERSPACE AVP RESTORE BRIDGE)</text>
    <text x="860" y="32" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: SWIMLANE</text>
  </g>

  <!-- 4 Swimlanes Container (x=40..920, y=92..500) -->
  <g transform="translate(40, 92)">
    <!-- Lane 0: UIKit Host -->
    <rect x="0" y="0" width="880" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Lane 1: Spawn & Mach Injection -->
    <rect x="0" y="100" width="880" height="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Lane 2: VMM Service -->
    <rect x="0" y="200" width="880" height="108" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Lane 3: Installer & USB Shim -->
    <rect x="0" y="308" width="880" height="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Role Column Divider -->
    <line x1="132" y1="0" x2="132" y2="408" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Lane Labels -->
    <g transform="translate(0, 0)">
      <text x="66" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0f172a" text-anchor="middle">UIKIT HOST</text>
      <text x="66" y="60" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">vzxpchook.m</text>
    </g>
    <g transform="translate(0, 100)">
      <text x="66" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c" text-anchor="middle">MACH INJECT</text>
      <text x="66" y="60" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" text-anchor="middle">task_for_pid</text>
    </g>
    <g transform="translate(0, 200)">
      <text x="66" y="48" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0369a1" text-anchor="middle">VMM SERVICE</text>
      <text x="66" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">vmmhook.m</text>
    </g>
    <g transform="translate(0, 308)">
      <text x="66" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0f172a" text-anchor="middle">DFU INSTALLER</text>
      <text x="66" y="60" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">usb_shim.m</text>
    </g>
  </g>

  <!-- Orthogonal Connectors (drawn BEFORE step nodes; global canvas coords) -->
  <g>
    <!-- Step 1 (192..348, y=110..174) bottom (270, 174) -> down to y=242 -> right to Step 2 left (372, 242) -->
    <path d="M 270 174 L 270 234 Q 270 242 278 242 L 372 242" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#vmsw-arrow-accent)"/>

    <!-- Step 2 (372..536, y=210..274) bottom (454, 274) -> down to y=346 -> right to Step 3 left (560, 346) -->
    <path d="M 454 274 L 454 338 Q 454 346 462 346 L 560 346" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#vmsw-arrow-accent)"/>

    <!-- Step 1 right (348, 142) -> right to x=642 -> down to Step 3 top (642, 314) [Host <-> VMM peer P] -->
    <path d="M 348 142 L 634 142 Q 642 142 642 150 L 642 314" fill="none" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#vmsw-arrow-link)"/>

    <!-- Step 3 right (724, 346) -> straight right to Step 5 left (748, 346) -->
    <line x1="724" y1="346" x2="748" y2="346" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#vmsw-arrow)"/>

    <!-- Step 4 (372..548, y=418..482) right (548, 450) -> right to x=826 -> up to Step 5 bottom (826, 378) -->
    <path d="M 548 450 L 818 450 Q 826 450 826 442 L 826 378" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#vmsw-arrow-link)"/>

    <!-- Step 1 bottom-left (226, 174) -> straight down to y=450 -> right to Step 4 left (372, 450) -->
    <path d="M 226 174 L 226 442 Q 226 450 234 450 L 372 450" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#vmsw-arrow)"/>

    <!-- Labels on open segments with opaque masks and 6-10px margin -->
    <rect x="444" y="120" width="96" height="14" rx="2" fill="#ffffff"/>
    <text x="492" y="130" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">XPC PEER RENDEZVOUS</text>

    <rect x="646" y="428" width="124" height="14" rx="2" fill="#f8fafc"/>
    <text x="708" y="438" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">VZ_USB_BRIDGE_SOCKET</text>

    <rect x="244" y="428" width="94" height="14" rx="2" fill="#f8fafc"/>
    <text x="291" y="438" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">SPAWN INSTALLER</text>
  </g>

  <!-- Step Nodes (isolated <g transform="translate(X, Y)">) -->
  <!-- Step 1: Lane 0 -->
  <g transform="translate(192, 110)">
    <rect x="0" y="0" width="156" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="78" y="22" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">1. 创建匿名 XPC 监听</text>
    <text x="78" y="39" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">E = xpc_endpoint_create(L)</text>
    <text x="78" y="54" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">读取 Send-Right @ E+0x18</text>
  </g>

  <!-- Step 2: Lane 1 (FOCAL) -->
  <g transform="translate(372, 210)">
    <rect x="0" y="0" width="164" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="82" y="22" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">2. 挂起派生并注入权柄</text>
    <text x="82" y="39" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" text-anchor="middle">posix_spawn (SUSPENDED)</text>
    <text x="82" y="54" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#9f1239" text-anchor="middle">mach_port_insert_right → 唤醒</text>
  </g>

  <!-- Step 3: Lane 2 -->
  <g transform="translate(560, 314)">
    <rect x="0" y="0" width="164" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="82" y="22" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">3. 劫持 xpc_main 回连</text>
    <text x="82" y="39" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">读取 VMM_EP_PORT 恢复端点</text>
    <text x="82" y="54" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">memorystatus_control 2x RAM</text>
  </g>

  <!-- Step 5: Lane 2 -->
  <g transform="translate(748, 314)">
    <rect x="0" y="0" width="156" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="78" y="22" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">5. AVP 恢复控制器</text>
    <text x="78" y="39" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">接收 Control/Bulk 帧</text>
    <text x="78" y="54" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">直接写入虚拟 DFU 端点</text>
  </g>

  <!-- Step 4: Lane 3 -->
  <g transform="translate(372, 418)">
    <rect x="0" y="0" width="176" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="88" y="22" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">4. 用户态 DFU USB 仿真</text>
    <text x="88" y="39" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">伪造 0x766d2000 IOKit 句柄</text>
    <text x="88" y="54" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">MobileDevice + /tmp/vzusbmuxd</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 520)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" font-weight="700">LEGEND</text>
    <rect x="76" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="24" font-size="11" fill="#334155">Mach 跨进程端口注入关键路径</text>
    <rect x="296" y="13" width="14" height="14" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="318" y="24" font-size="11" fill="#334155">VMM 进程与 Socket 桥接</text>
    <line x1="486" y1="20" x2="518" y2="20" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="526" y="24" font-size="11" fill="#334155">匿名 XPC 异步通信</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">SOURCE: vzxpchook.m &amp; installation_usb_shim.m</text>
  </g>
</svg>
