<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="mesh-avatar-sequence-title mesh-avatar-sequence-desc">
  <title id="mesh-avatar-sequence-title">Mesh Avatar Studio 四阶段协同流水线时序交互</title>
  <desc id="mesh-avatar-sequence-desc">展示创作者、Coding Agent、Python 几何工具链、Vite+React 本地编辑器与 OBS 面捕推流引擎的时序协作流</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .actor-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-actor { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .actor-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .focal-actor-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .focal-msg-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
      .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
      .focal-msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #bf4520; }
      .note-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .badge { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .focal-badge { fill: rgba(191, 69, 32, 0.1); stroke: #bf4520; stroke-width: 1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .focal-badge-text { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="480" class="bg" />

  <!-- Actors -->
  <!-- Actor 1: Creator (x=100) -->
  <g transform="translate(30, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">创作者 (Human)</text>
  </g>
  <line x1="100" y1="64" x2="100" y2="440" class="lifeline" />

  <!-- Actor 2: Agent (x=280) -->
  <g transform="translate(210, 24)">
    <rect width="140" height="40" rx="6" class="focal-actor" />
    <text x="70" y="25" class="focal-actor-text">Coding Agent</text>
  </g>
  <line x1="280" y1="64" x2="280" y2="440" class="lifeline" />

  <!-- Actor 3: Tools (x=470) -->
  <g transform="translate(400, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">Python 几何与切层</text>
  </g>
  <line x1="470" y1="64" x2="470" y2="440" class="lifeline" />

  <!-- Actor 4: Editor (x=660) -->
  <g transform="translate(590, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">React 19 本地编辑器</text>
  </g>
  <line x1="660" y1="64" x2="660" y2="440" class="lifeline" />

  <!-- Actor 5: Live &amp; OBS (x=850) -->
  <g transform="translate(780, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">面捕与 OBS 推流</text>
  </g>
  <line x1="850" y1="64" x2="850" y2="440" class="lifeline" />

  <!-- Messages -->
  <!-- Step 1: User -> Agent -->
  <g transform="translate(0, 90)">
    <circle cx="115" cy="0" r="10" class="badge" />
    <text x="115" y="4" class="badge-text">1</text>
    <line x1="100" y1="0" x2="272" y2="0" class="msg-line" marker-end="url(#arrow)" />
    <text x="135" y="-6" class="msg-text">提供单张透明底立绘 source.png</text>
  </g>

  <!-- Step 2: Agent -> Tools (vision-check) -->
  <g transform="translate(0, 135)">
    <circle cx="295" cy="0" r="10" class="focal-badge" />
    <text x="295" y="4" class="focal-badge-text">2</text>
    <line x1="280" y1="0" x2="462" y2="0" class="focal-msg-line" marker-end="url(#arrow-focal)" />
    <text x="315" y="-6" class="focal-msg-text">运行 vision-check.py 校准 Agent 视觉坐标</text>
  </g>

  <!-- Step 3: Agent -> Tools (grid.py &amp; rig.draft.json) -->
  <g transform="translate(0, 180)">
    <circle cx="295" cy="0" r="10" class="focal-badge" />
    <text x="295" y="4" class="focal-badge-text">3</text>
    <line x1="280" y1="0" x2="462" y2="0" class="focal-msg-line" marker-end="url(#arrow-focal)" />
    <text x="315" y="-6" class="focal-msg-text">执行 grid.py 局部测算，生成 rig.draft.json</text>
  </g>

  <!-- Step 4: Tools build layers -->
  <g transform="translate(0, 225)">
    <circle cx="485" cy="0" r="10" class="badge" />
    <text x="485" y="4" class="badge-text">4</text>
    <line x1="470" y1="0" x2="652" y2="0" class="msg-line" marker-end="url(#arrow)" />
    <text x="505" y="-6" class="msg-text">调用 build-layers.py 执行膜方程修补，输出 built/</text>
  </g>

  <!-- Step 5: User opens Editor -->
  <g transform="translate(0, 270)">
    <circle cx="115" cy="0" r="10" class="badge" />
    <text x="115" y="4" class="badge-text">5</text>
    <line x1="100" y1="0" x2="652" y2="0" class="msg-line" marker-end="url(#arrow)" />
    <text x="260" y="-6" class="msg-text">创作者启动 npm run dev，所见即所得拖拽微调</text>
  </g>

  <!-- Step 6: Playwright Automated Pose Inspection -->
  <g transform="translate(0, 315)">
    <circle cx="295" cy="0" r="10" class="focal-badge" />
    <text x="295" y="4" class="focal-badge-text">6</text>
    <line x1="280" y1="0" x2="652" y2="0" class="focal-msg-line" marker-end="url(#arrow-focal)" />
    <text x="320" y="-6" class="focal-msg-text">Agent 触发 render-poses.mjs 无头多角度大图质检闭环</text>
  </g>

  <!-- Step 7: Editor -> Live &amp; OBS -->
  <g transform="translate(0, 360)">
    <circle cx="675" cy="0" r="10" class="badge" />
    <text x="675" y="4" class="badge-text">7</text>
    <line x1="660" y1="0" x2="842" y2="0" class="msg-line" marker-end="url(#arrow)" />
    <text x="695" y="-6" class="msg-text">发布至 /stream.html，OBS 浏览器源原生透明捕获</text>
  </g>

  <!-- Step 8: Live MediaPipe tracking -->
  <g transform="translate(0, 405)">
    <circle cx="865" cy="0" r="10" class="badge" />
    <text x="865" y="4" class="badge-text">8</text>
    <path d="M 850 0 L 880 0 Q 890 0 890 10 L 890 18 Q 890 28 880 28 L 858 28" class="msg-line" marker-end="url(#arrow)" />
    <text x="715" y="20" class="msg-text">Web Worker 60FPS 面捕，指数阻尼滤波稳定驱动</text>
  </g>
</svg>