<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" role="img" aria-labelledby="flow-title flow-desc" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif;">
  <title id="flow-title">Regitela 四路由特权接缝与沙盒逃逸决策流</title>
  <desc id="flow-desc">展示 Regitela v1.0.3 中 issueSandboxExtension(for:) 如何依次经过无沙盒越狱直通、darksword 内核读写后端、geod class-12 partDomain 遍历以及 worse_query class-7 App Group 符号链接四条特权通道。</desc>
  <defs>
    <pattern id="dotGridFlow" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1120" height="680" fill="#ffffff"/>
  <rect x="16" y="16" width="1088" height="648" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="16" width="1088" height="648" rx="8" fill="url(#dotGridFlow)"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="104" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="52" y="14" text-anchor="middle" fill="#334155" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace" letter-spacing="1">FLOWCHART</text>
    <text x="0" y="44" fill="#0f172a" font-size="20" font-weight="700">Regitela 四级特权路由与沙盒逃逸决策流 (Escape.swift)</text>
    <text x="0" y="64" fill="#475569" font-size="12">单一越狱、内核提权与双用户态漏洞的统一接缝：按系统版本与目标容器精准分流句柄</text>
  </g>

  <!-- Connectors (drawn before nodes) -->
  <g fill="none" stroke-width="1.4">
    <!-- Start -> Diamond 1 -->
    <line x1="220" y1="176" x2="220" y2="196" stroke="#64748b" marker-end="url(#arrow)"/>
    <!-- Diamond 1 -> Unsandboxed -->
    <line x1="324" y1="236" x2="438" y2="236" stroke="#059669" marker-end="url(#arrow-ok)"/>
    <!-- Diamond 1 -> Diamond 2 -->
    <line x1="220" y1="276" x2="220" y2="312" stroke="#64748b" marker-end="url(#arrow)"/>
    <!-- Diamond 2 -> KernelAccess (FOCAL) -->
    <line x1="324" y1="352" x2="438" y2="352" stroke="#e11d48" marker-end="url(#arrow-accent)"/>
    <!-- KernelAccess -> Locked Reject -->
    <line x1="672" y1="352" x2="758" y2="352" stroke="#e11d48" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <!-- Diamond 2 -> Diamond 3 -->
    <line x1="220" y1="392" x2="220" y2="428" stroke="#64748b" marker-end="url(#arrow)"/>
    <!-- Diamond 3 -> geod_query -->
    <line x1="324" y1="468" x2="438" y2="468" stroke="#0284c7" marker-end="url(#arrow-link)"/>
    <!-- geod_query -> geod_objects -->
    <line x1="672" y1="468" x2="758" y2="468" stroke="#0284c7" marker-end="url(#arrow-link)"/>
    <!-- Diamond 3 -> worse_query -->
    <line x1="220" y1="508" x2="220" y2="554" stroke="#64748b" marker-end="url(#arrow)"/>
    <!-- worse_query -> alt_flags -->
    <line x1="340" y1="588" x2="438" y2="588" stroke="#64748b" marker-end="url(#arrow)"/>
  </g>

  <!-- Masked Arrow Labels (6px+ clearance from strokes) -->
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">
    <g transform="translate(364, 212)">
      <rect x="0" y="0" width="36" height="16" rx="2" fill="#f8fafc"/>
      <text x="18" y="11" fill="#059669">YES</text>
    </g>
    <g transform="translate(228, 284)">
      <rect x="0" y="0" width="28" height="16" rx="2" fill="#f8fafc"/>
      <text x="14" y="11" fill="#64748b">NO</text>
    </g>
    <g transform="translate(358, 328)">
      <rect x="0" y="0" width="48" height="16" rx="2" fill="#f8fafc"/>
      <text x="24" y="11" fill="#e11d48">CLAIM</text>
    </g>
    <g transform="translate(688, 328)">
      <rect x="0" y="0" width="56" height="16" rx="2" fill="#f8fafc"/>
      <text x="28" y="11" fill="#e11d48">LOCKED</text>
    </g>
    <g transform="translate(228, 400)">
      <rect x="0" y="0" width="60" height="16" rx="2" fill="#f8fafc"/>
      <text x="30" y="11" fill="#64748b">NO / SKIP</text>
    </g>
    <g transform="translate(364, 444)">
      <rect x="0" y="0" width="36" height="16" rx="2" fill="#f8fafc"/>
      <text x="18" y="11" fill="#0284c7">YES</text>
    </g>
    <g transform="translate(684, 444)">
      <rect x="0" y="0" width="64" height="16" rx="2" fill="#f8fafc"/>
      <text x="32" y="11" fill="#0284c7">ACTIVATE</text>
    </g>
    <g transform="translate(228, 524)">
      <rect x="0" y="0" width="28" height="16" rx="2" fill="#f8fafc"/>
      <text x="14" y="11" fill="#64748b">NO</text>
    </g>
    <g transform="translate(356, 564)">
      <rect x="0" y="0" width="64" height="16" rx="2" fill="#f8fafc"/>
      <text x="32" y="11" fill="#475569">SYMLINK</text>
    </g>
  </g>

  <!-- Nodes -->
  <!-- Start Oval -->
  <g transform="translate(100, 132)">
    <rect x="0" y="0" width="240" height="44" rx="22" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="120" y="20" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">issueSandboxExtension(for: path)</text>
    <text x="120" y="34" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">Escape.swift · 统一特权入口</text>
  </g>

  <!-- Diamond 1: isUnsandboxed -->
  <g transform="translate(116, 196)">
    <polygon points="104,0 208,40 104,80 0,40" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="104" y="36" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">isUnsandboxed?</text>
    <text x="104" y="52" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">无沙盒 Rootless .deb 探测</text>
  </g>

  <!-- Tier 0 Box: Unsandboxed -->
  <g transform="translate(440, 208)">
    <rect x="0" y="0" width="232" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="116" y="23" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">直通返回 unsandboxedHandle</text>
    <text x="116" y="40" text-anchor="middle" fill="#047857" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">Int64.max · 免漏洞直读 /private/var</text>
  </g>

  <!-- Diamond 2: KernelAccess -->
  <g transform="translate(116, 312)">
    <polygon points="104,0 208,40 104,80 0,40" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="104" y="36" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">KernelAccess 接管?</text>
    <text x="104" y="52" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">17.0 &lt;= iOS &lt; 26.1 &amp; 敏感配置路径</text>
  </g>

  <!-- Tier 1 Box (FOCAL): darksword kernel -->
  <g transform="translate(440, 320)">
    <rect x="0" y="0" width="232" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <rect x="10" y="8" width="60" height="14" rx="2" fill="#e11d48"/>
    <text x="40" y="18" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">TIER 1</text>
    <text x="116" y="34" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">darksword 内核读写后端</text>
    <text x="116" y="50" text-anchor="middle" fill="#9f1239" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">屏蔽 A18/M4 · 句柄 0x5000000000</text>
  </g>

  <!-- Reject Box -->
  <g transform="translate(760, 324)">
    <rect x="0" y="0" width="284" height="56" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="142" y="23" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="700">未解锁拒绝静默触发 (返回 -6)</text>
    <text x="142" y="40" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">必须经 UnlockView 显式触发 kexploit_opa334()</text>
  </g>

  <!-- Diamond 3: geod -->
  <g transform="translate(116, 428)">
    <polygon points="104,0 208,40 104,80 0,40" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="104" y="36" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">iOS 26 + SystemGroup?</text>
    <text x="104" y="52" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">Class-7 无法直达 iOS 26 系统组</text>
  </g>

  <!-- Tier 2 Box: geod_query -->
  <g transform="translate(440, 436)">
    <rect x="0" y="0" width="232" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="10" y="8" width="60" height="14" rx="2" fill="#0284c7"/>
    <text x="40" y="18" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">TIER 2</text>
    <text x="116" y="34" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">geod_query() 路径遍历</text>
    <text x="116" y="50" text-anchor="middle" fill="#0369a1" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">class 12 · partDomain 6×"../" 逃逸</text>
  </g>

  <!-- geod pool box -->
  <g transform="translate(760, 440)">
    <rect x="0" y="0" width="284" height="56" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="142" y="23" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">geod_objects[32] 活体对象池</text>
    <text x="142" y="40" text-anchor="middle" fill="#475569" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">无独立 Token · 释放即回收 · 0x4000000000+slot</text>
  </g>

  <!-- Tier 3 Box: worse_query -->
  <g transform="translate(100, 556)">
    <rect x="0" y="0" width="240" height="64" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="10" y="8" width="60" height="14" rx="2" fill="#334155"/>
    <text x="40" y="18" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">TIER 3</text>
    <text x="120" y="34" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">worse_query() AppGroup 符号链接</text>
    <text x="120" y="50" text-anchor="middle" fill="#475569" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">SecTask 自省权限 · class 7 / part 3</text>
  </g>

  <!-- alt_flags Box -->
  <g transform="translate(440, 560)">
    <rect x="0" y="0" width="604" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="302" y="23" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">alt_flags 标志位分流与 sandbox_extension_consume() 令牌消费</text>
    <text x="302" y="40" text-anchor="middle" fill="#475569" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">iOS 26 Shared/AppGroup: 0x0000000800000000ULL  |  通用路径: 0x0000008000000000ULL  |  随后 clean_symlink()</text>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 642)">
    <text x="0" y="12" fill="#64748b" font-size="10">注：handle 空间严格隔离——负数表示失败，&gt;0 普通扩展句柄，0x4000000000+ 为 geod 对象槽，0x5000000000 为内核后端，Int64.max 为无沙盒越狱。</text>
  </g>
</svg>