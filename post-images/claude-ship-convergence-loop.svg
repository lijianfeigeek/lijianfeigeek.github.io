  <title id="claude-ship-loop-title">Claude Ship 评审收敛与策略校准自进化飞轮</title>
  <desc id="claude-ship-loop-desc">展现从 PR 触发、多代理对抗过滤、Steward 三轮收敛熔断、Observe 灰度人机矩阵校准、规则沉淀到事故 Eval 回归的顺时针自进化闭环与共享仓库规则中枢。</desc>
