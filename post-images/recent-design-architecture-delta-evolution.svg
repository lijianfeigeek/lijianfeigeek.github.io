<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="rd-delta-title rd-delta-desc">
  <title id="rd-delta-title">从 Godly 到 Recent Design：灵感策展平台的范式演进与架构重构</title>
  <desc id="rd-delta-desc">对比分析从传统静态截图画廊到基于 TanStack Router 与 Meta StyleX 的多模态全域数字资产与 AI Agent 技能分发中枢的跃迁演进。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-title-before { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .col-title-after { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #15803d; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .badge-before { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #b91c1c; }
    .badge-after { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #15803d; }
    .ledger-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .ledger-key { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    .ledger-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="16" width="912" height="488" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(48, 42)">
    <text class="title" x="0" y="0">从 Godly 到 Recent Design：灵感策展平台的范式演进与架构重构</text>
    <text class="subtitle" x="0" y="20">从单一视口的静态截屏陈列室，跃迁为多模态动态流媒体、技术栈逆向透视与 AI Agent 技能分发中枢</text>
  </g>

  <!-- Left Column: Legacy Godly Architecture (Before) -->
  <g transform="translate(48, 84)">
    <rect width="420" height="288" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text class="col-title-before" x="16" y="24">🔴 传统模式：Godly (2021~2024 静态画廊范式)</text>

    <!-- Card 1 -->
    <g transform="translate(16, 38)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">资产形态：单一视口静态截图</text>
        <text class="card-body" x="0" y="16">仅收录桌面端长幅截图，无法记录平滑微动效与真实交互手感</text>
        <text class="badge-before" x="310" y="0">LIMIT: 视口固化</text>
      </g>
    </g>

    <!-- Card 2 -->
    <g transform="translate(16, 98)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">性能交互：重载瀑布流与大图阻塞</text>
        <text class="card-body" x="0" y="16">依赖大量无分级的高清静态图片加载，网络开销高且首屏渲染滞后</text>
        <text class="badge-before" x="310" y="0">BOTTLENECK: 延迟</text>
      </g>
    </g>

    <!-- Card 3 -->
    <g transform="translate(16, 158)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">数据价值：浅层主观风格标签</text>
        <text class="card-body" x="0" y="16">仅有粗颗粒度 UI 分类，缺乏对工程底层框架、动画库与依赖的透视</text>
        <text class="badge-before" x="310" y="0">SHALLOW: 黑盒</text>
      </g>
    </g>

    <!-- Card 4 -->
    <g transform="translate(16, 218)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">生态变现：同质化竞争与边缘展示广告</text>
        <text class="card-body" x="0" y="16">壁垒极低，易被泛化爬虫站取代；商业模式高度依赖传统 Banner 广告</text>
        <text class="badge-before" x="310" y="0">LOW-MOAT: 易替代</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Recent Design Architecture (After) -->
  <g transform="translate(492, 84)">
    <rect width="420" height="288" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text class="col-title-after" x="16" y="24">🟢 进化范式：Recent Design (2026+ 多模态与智能体枢纽)</text>

    <!-- Card 1 -->
    <g transform="translate(16, 38)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">资产形态：全域多模态流媒体与微动效</text>
        <text class="card-body" x="0" y="16">WebP 海报瞬间秒开 + 悬浮无损播放 60fps 动态视频，跨越 Web/App/OG</text>
        <text class="badge-after" x="300" y="0">MULTI-MODAL: 动态</text>
      </g>
    </g>

    <!-- Card 2 -->
    <g transform="translate(16, 98)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">前端底座：TanStack Router + Meta StyleX</text>
        <text class="card-body" x="0" y="16">编译期原子 CSS 零运行时开销，流式 SSR 现场保持与无刷新模态深链</text>
        <text class="badge-after" x="300" y="0">STACK: 零运行时</text>
      </g>
    </g>

    <!-- Card 3 -->
    <g transform="translate(16, 158)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">数据价值：自动化全栈技术指纹逆向工程</text>
        <text class="card-body" x="0" y="16">精准识别 React Router / Tailwind / Lenis / Three.js，将视觉变为工程资产</text>
        <text class="badge-after" x="300" y="0">ENGINEERING: 深度</text>
      </g>
    </g>

    <!-- Card 4 -->
    <g transform="translate(16, 218)">
      <rect width="388" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text class="card-title" x="0" y="0">生态战略：AI Agent Skills 技能分发中枢</text>
        <text class="card-body" x="0" y="16">为 Claude Code 等智能体提供官方 UI 评审、减负与原型规范，商业闭环</text>
        <text class="badge-after" x="300" y="0">AGENTIC: 技能枢纽</text>
      </g>
    </g>
  </g>

  <!-- Bottom Changes Ledger -->
  <g transform="translate(48, 388)">
    <rect width="864" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="ledger-title" x="16" y="22">📋 核心架构变更清册 (Architecture Changes Ledger)</text>

    <!-- Grid Row 1 -->
    <g transform="translate(16, 38)">
      <text class="ledger-key" x="0" y="0">表现形式维度：</text>
      <text class="ledger-val" x="90" y="0">静态长截图/截图爬虫 → 响应式 WebP 海报预载 + 悬浮 60fps 动态视频流与全屏沉浸灯箱</text>
    </g>
    <g transform="translate(16, 56)">
      <text class="ledger-key" x="0" y="0">样式系统维度：</text>
      <text class="ledger-val" x="90" y="0">传统单体 CSS / 臃肿类名 → Meta StyleX 编译期原子化样式，零运行时损耗与极致高频复用</text>
    </g>
    <g transform="translate(16, 74)">
      <text class="ledger-key" x="0" y="0">生态定位维度：</text>
      <text class="ledger-val" x="90" y="0">设计师单向灵感“看脸”画廊 → 人机协同时代的 AI Agent 技能分发站与设计工程学真理来源</text>
    </g>
  </g>
</svg>
