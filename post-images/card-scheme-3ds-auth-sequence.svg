<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-3ds-auth-sequence-title card-scheme-3ds-auth-sequence-desc" id="card-scheme-3ds-auth-sequence-root">
        <title id="card-scheme-3ds-auth-sequence-title">线上支付欺诈防御中枢：3-D Secure 身份验签全流程时序</title>
        <desc id="card-scheme-3ds-auth-sequence-desc">持卡人端、商户 MPI、卡组织 Directory Server 与发卡行 ACS 构成的身份核验与数字凭证签名时序</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-3ds-auth-sequence-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-3ds-auth-sequence-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-3ds-auth-sequence-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-3ds-auth-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-3ds-auth-sequence-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-3ds-auth-sequence-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- 4 Lifelines -->
        <g transform="translate(60, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="80" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">持卡人 (Browser/App)</text>
        </g>
        <line x1="140" y1="52" x2="140" y2="480" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(290, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="80" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">商户系统 (MPI / SDK)</text>
        </g>
        <line x1="370" y1="52" x2="370" y2="480" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(520, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.06"/>
          <text x="80" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">卡组织 DS (Directory Server)</text>
        </g>
        <line x1="600" y1="52" x2="600" y2="480" stroke="#bf4520" stroke-opacity="0.3" stroke-dasharray="3 3"/>

        <g transform="translate(740, 20)">
          <rect x="0" y="0" width="160" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="80" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">发卡行 ACS (Access Control)</text>
        </g>
        <line x1="820" y1="52" x2="820" y2="480" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- Message 1 -->
        <path d="M 140 85 L 365 85" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#card-scheme-3ds-auth-sequence-arrow)"/>
        <text x="255" y="78" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">1. 提交订单并输入 16 位卡号</text>

        <!-- Message 2 -->
        <path d="M 370 115 L 595 115" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-3ds-auth-sequence-arrow-link)"/>
        <text x="485" y="108" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">2. 检查卡片是否注册 3DS (VEReq)</text>

        <!-- Message 3 -->
        <path d="M 600 145 L 815 145" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-3ds-auth-sequence-arrow-link)"/>
        <text x="710" y="138" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">3. 探询卡号 3DS 注册状态</text>

        <!-- Message 4 &amp; 5 (VERes) -->
        <path d="M 820 175 L 375 175" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#card-scheme-3ds-auth-sequence-arrow)"/>
        <text x="600" y="168" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">4~5. 返回注册应答 (VERes - Enrolled)</text>

        <!-- Challenge Box -->
        <g transform="translate(100, 205)">
          <rect x="0" y="0" width="760" height="200" rx="6" fill="#bf4520" stroke="rgba(191,69,32,0.2)" fill-opacity="0.03"/>
          <text x="16" y="22" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">CHALLENGE FLOW · 持卡人强身份验证挑战 (SCA 认证)</text>
        </g>

        <!-- Message 6: PAReq -->
        <path d="M 370 255 L 815 255" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-3ds-auth-sequence-arrow-link)"/>
        <text x="590" y="248" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">6. 发起持卡人身份认证请求 (PAReq)</text>

        <!-- Message 7: Challenge Screen -->
        <path d="M 820 285 L 145 285" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#card-scheme-3ds-auth-sequence-arrow-accent)"/>
        <text x="480" y="278" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">7. 弹出原生挑战界面（下发短信 OTP 动态码 / 银行 App 面容 ID 核身）</text>

        <!-- Message 8: User Confirm -->
        <path d="M 140 320 L 815 320" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#card-scheme-3ds-auth-sequence-arrow)"/>
        <text x="480" y="313" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">8. 持卡人输入一次性验证码 / 完成生物识别授权</text>

        <!-- Message 9: PARes with CAVV -->
        <path d="M 820 355 L 375 355" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#card-scheme-3ds-auth-sequence-arrow-accent)"/>
        <text x="590" y="348" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">9. 返回认证结果 (PARes) · 携带防抵赖数字签名 CAVV / AAV</text>

        <!-- Message 10: Inject into 1100 -->
        <g transform="translate(240, 430)">
          <rect x="0" y="0" width="480" height="34" rx="4" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
          <text x="240" y="21" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">10. 商户将 CAVV 注入后续 1100 联机授权报文，欺诈责任彻底转移给发卡行</text>
        </g>
      </svg>
