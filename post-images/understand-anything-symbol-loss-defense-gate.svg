<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ua-sym-title ua-sym-desc">
  <title id="ua-sym-title">Symbol-Loss 符号防漏数学级守卫门禁与单次精确重试闭环</title>
  <desc id="ua-sym-desc">展示如何在增量更新中通过源码 Tree-sitter AST 真实性证明，拦截大模型随机遗漏导致的依赖关系雪崩断裂。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Symbol-Loss 符号防漏数学级守卫门禁</text>
    <text class="subtitle" x="0" y="20">区分“真实代码物理删除”与“大模型注意力随机遗漏”，宁可终止发布，绝不污染基线图谱</text>
  </g>

  <!-- Left: Candidate &amp; Scope Verification -->
  <g transform="translate(48, 86)">
    <rect width="260" height="390" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">1. 候选集与物理真理证明</text>

    <g transform="translate(14, 40)">
      <rect width="232" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">file-analyzer 返回候选节点</text>
        <text class="card-body" x="0" y="16">• LLM 解析 utils.ts 产出结果</text>
        <text class="card-body" x="0" y="32">• 候选集仅包含 18 个函数</text>
        <text class="mono" fill="#e11d48" x="0" y="50">WARNING: 候选集属于未验证假说</text>
      </g>
    </g>

    <g transform="translate(14, 138)">
      <rect width="232" height="100" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">Tree-sitter 构建作用域证据</text>
        <text class="mono" fill="#1e40af" x="0" y="16">symbol-scopes.ts: 物理全量声明</text>
        <text class="card-body" x="0" y="32">• 覆盖 JS/TS/Python/Go/Rust/C++</text>
        <text class="card-body" x="0" y="48">• 提取源码物理存在的全部符号</text>
        <text class="mono" fill="#15803d" x="0" y="68">TRUTH: 源码 AST 是唯一绝对真理</text>
      </g>
    </g>

    <g transform="translate(14, 252)">
      <rect width="232" height="114" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">比对历史基线 (CoverageCheck)</text>
        <text class="card-body" x="0" y="18">• 检查历史基线知识图谱中的旧符号</text>
        <text class="card-body" x="0" y="34">• 发现旧符号 parseToken() 在本次</text>
        <text class="card-body" x="0" y="50">  LLM 返回的候选集中缺失！</text>
        <text class="mono" fill="#ea580c" x="0" y="70">TRIGGER: 触发删除合法性质询</text>
      </g>
    </g>
  </g>

  <!-- Middle: ProveDelete Decision Matrix -->
  <g transform="translate(330, 86)">
    <rect width="280" height="390" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text class="box-title" fill="#c2410c" x="14" y="24">2. AST 证明：物理删除 vs 幻觉遗漏</text>

    <!-- Branch A: Real Delete -->
    <g transform="translate(14, 40)">
      <rect width="252" height="140" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">分支 A：确属物理代码删除</text>
        <text class="card-body" x="0" y="18">• AST 作用域证据表中同样找不到该声明</text>
        <text class="card-body" x="0" y="34">• 证明开发者确实在本次提交中删除了代码</text>
        <text class="mono" fill="#15803d" x="0" y="54">ACTION: 判定为合法物理删除</text>
        <text class="card-body" x="0" y="72">• 允许从图谱中级联清理对应的关系边</text>
        <text class="mono" fill="#166534" x="0" y="92">STATUS: 图谱合流，状态正常</text>
      </g>
    </g>

    <!-- Branch B: Hallucination Omission -->
    <g transform="translate(14, 196)">
      <rect width="252" height="170" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#991b1b" x="0" y="0">分支 B：大模型发生幻觉遗漏！</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="18">• AST 证据表证明该函数在源码中仍然存在！</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="34">• 确凿证明 LLM 在抽取时发生无意遗漏</text>
        <text class="mono" fill="#b91c1c" x="0" y="54">ACTION: 触发拦截警报 (Block Gate)</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="72">• 标记 unresolvedFiles，绝对阻断保存！</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="88">• 坚决保留磁盘上完整的旧图谱，防被污染</text>
        <text class="mono" fill="#991b1b" x="0" y="112">FAILSAFE: 掐断雪崩式级联断裂</text>
      </g>
    </g>
  </g>

  <!-- Right: Single-Attempt Targeted Retry -->
  <g transform="translate(632, 86)">
    <rect width="280" height="390" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="box-title" fill="#1e40af" x="14" y="24">3. 单次精确补偿修复闭环</text>

    <g transform="translate(14, 40)">
      <rect width="252" height="140" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">定向构造重试批次 (prepare-retry)</text>
        <text class="mono" fill="#2563eb" x="0" y="16">prepare-symbol-retry.mjs</text>
        <text class="card-body" x="0" y="34">• 自动计算确切缺失的符号列表清单</text>
        <text class="card-body" x="0" y="50">• 构造最小化 Prompt 要求 Agent 专门补全</text>
        <text class="card-body" x="0" y="66">• 严格限制仅补充遗漏节点，不重复消耗</text>
        <text class="mono" fill="#1d4ed8" x="0" y="90">COST: 仅消耗几十 Token 精确补漏</text>
      </g>
    </g>

    <g transform="translate(14, 196)">
      <rect width="252" height="170" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">重试校验与终局裁决</text>
        <text class="card-body" fill="#166534" x="0" y="18">• 重试结果重新走入 CoverageCheck 闭环</text>
        <text class="card-body" fill="#166534" x="0" y="34">• 若补全成功 -> 允许合流并固化图谱</text>
        <text class="card-body" fill="#166534" x="0" y="50">• 若仍然失败 -> 宁可拒绝发布，终止退出！</text>
        <text class="card-body" fill="#166534" x="0" y="66">• 输出详尽诊断报告，保护知识资产纯净</text>
        <text class="mono" fill="#15803d" x="0" y="90">RULE: 宁缺毋滥，工业级零妥协</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 308 260 L 330 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="330,260 324,256 324,264" fill="#94a3b8"/>

  <path d="M 610 280 L 632 280" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="632,280 626,276 626,284" fill="#dc2626"/>
</svg>