<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="580" viewBox="0 0 1040 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cloudn-parser-title cloudn-parser-desc" id="cloudn-multi-route-parser-and-mse-pipeline-root">
      <title id="cloudn-parser-title">Cloudn 四路异构解析路由与网页 MSE 录制管线</title>
      <desc id="cloudn-parser-desc">展示输入文案进入 Cloudn 后如何分发至网盘直链转存、抖音竞速解析、YouTube JavaScriptCore 求解与内置浏览器 MSE 录制四条端侧通道。</desc>
      <defs>
      <style>#cloudn-multi-route-parser-and-mse-pipeline-root { font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #0f172a; }
      #cloudn-multi-route-parser-and-mse-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }</style>
        <pattern id="cloudn-multi-route-parser-and-mse-pipeline-dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
        </pattern>
        <marker id="cloudn-multi-route-parser-and-mse-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
        </marker>
        <marker id="cloudn-multi-route-parser-and-mse-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="cloudn-multi-route-parser-and-mse-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
        </marker>
      </defs>

      <rect width="1040" height="580" fill="#f8fafc"/>
      <rect width="1040" height="580" fill="url(#cloudn-multi-route-parser-and-mse-pipeline-dots)" opacity="0.6"/>

      <!-- Title -->
      <text x="40" y="34" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">ARCHITECTURE · ON-DEVICE RESOLUTION &amp; MSE PIPELINE</text>
      <text x="40" y="60" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">四路异构本地解析与网页 MSE 录制管线</text>

      <!-- Zones (drawn behind arrows & boxes) -->
      <rect x="280" y="84" width="496" height="412" rx="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/>
      <rect x="296" y="76" width="200" height="16" rx="2" fill="#f8fafc"/>
      <text x="396" y="87" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ON-DEVICE SANDBOX EXECUTION</text>

      <!-- Orthogonal Connectors (drawn BEFORE boxes) -->
      <!-- Input -> Dispatcher -->
      <line x1="208" y1="288" x2="296" y2="288" stroke="#475569" stroke-width="1.3" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow)"/>

      <!-- Dispatcher fan-out to 4 routes (right edge x=456, fanned ports y=248, 272, 304, 328) -->
      <!-- Route 1: Drive Share (y=144) -->
      <path d="M 456,248 H 484 Q 492,248 492,240 V 152 Q 492,144 500,144 H 524" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow)"/>
      <!-- Route 2: Douyin Race (y=244, FOCAL CORAL) -->
      <path d="M 456,272 H 492 Q 500,272 500,264 V 252 Q 500,244 508,244 H 524" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow-accent)"/>
      <!-- Route 3: YouTube JSC (y=344) -->
      <path d="M 456,304 H 500 Q 508,304 508,312 V 336 Q 508,344 516,344 H 524" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow-link)"/>
      <!-- Route 4: Browser MSE Sniffer (y=444) -->
      <path d="M 456,328 H 484 Q 492,328 492,336 V 436 Q 492,444 500,444 H 524" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow-accent)"/>

      <!-- 4 routes -> Output Sink (x=820, y=288) -->
      <path d="M 744,144 H 788 Q 796,144 796,152 V 252 Q 796,260 804,260 H 820" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow)"/>
      <path d="M 744,244 H 776 Q 784,244 784,252 V 272 Q 784,280 792,280 H 820" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow-accent)"/>
      <path d="M 744,344 H 776 Q 784,344 784,336 V 304 Q 784,296 792,296 H 820" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow-link)"/>
      <path d="M 744,444 H 788 Q 796,444 796,436 V 324 Q 796,316 804,316 H 820" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow-accent)"/>

      <!-- Dashed feedback: ParseCache 10m TTL -->
      <path d="M 376,340 V 480 H 124 Q 116,480 116,472 V 340" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow)"/>
      <rect x="200" y="472" width="124" height="16" rx="2" fill="#f8fafc"/>
      <text x="262" y="483" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10m ParseCache HIT</text>

      <!-- Node 1: Unified Input -->
      <g transform="translate(40, 240)">
        <rect x="0" y="0" width="168" height="96" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
        <rect x="12" y="10" width="60" height="16" rx="2" fill="#f1f5f9"/>
        <text x="42" y="21" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">INGRESS</text>
        <text x="12" y="46" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">统一入口探测</text>
        <text x="12" y="66" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">剪贴板 · 分享扩展 · 拖放</text>
        <text x="12" y="84" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">cloudn://resolve?text=</text>
      </g>

      <!-- Node 2: Dispatcher + Prewarm -->
      <g transform="translate(296, 240)">
        <rect x="0" y="0" width="160" height="96" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
        <rect x="12" y="10" width="76" height="16" rx="2" fill="#f1f5f9"/>
        <text x="50" y="21" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DISPATCHER</text>
        <text x="12" y="46" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">链接分流与预热</text>
        <text x="12" y="66" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">提取码分离 · WebView 预热</text>
        <text x="12" y="84" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">prewarm() 30s TTL</text>
      </g>

      <!-- Route 1: Cloud Drives -->
      <g transform="translate(524, 108)">
        <rect x="0" y="0" width="220" height="72" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1"/>
        <text x="14" y="22" fill="#475569" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ROUTE A · 14+ CLOUD DRIVES</text>
        <text x="14" y="42" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">临时转存取直链后即删</text>
        <text x="14" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Baidu / Xunlei / 115 / Aliyun</text>
      </g>

      <!-- Route 2: Douyin Concurrent Race (FOCAL 1) -->
      <g transform="translate(524, 208)">
        <rect x="0" y="0" width="220" height="72" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
        <text x="14" y="22" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ROUTE B · DOUYIN RACE</text>
        <text x="14" y="42" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">隐藏浏览器 vs SSR 并发竞速</text>
        <text x="14" y="60" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">withThrowingTaskGroup → cancelAll()</text>
      </g>

      <!-- Route 3: YouTube JSC EJS Solver -->
      <g transform="translate(524, 308)">
        <rect x="0" y="0" width="220" height="72" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
        <text x="14" y="22" fill="#0284c7" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ROUTE C · JAVASCRIPTCORE</text>
        <text x="14" y="42" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">内置 EJS 求解 sig 与 n 参数</text>
        <text x="14" y="60" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">meriyah AST + astring + JSContext</text>
      </g>

      <!-- Route 4: PageMediaScanner + MSERecorder (FOCAL 2) -->
      <g transform="translate(524, 408)">
        <rect x="0" y="0" width="220" height="72" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
        <text x="14" y="22" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ROUTE D · SNIFFER &amp; MSE HOOK</text>
        <text x="14" y="42" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">源码预扫 + SourceBuffer 录制</text>
        <text x="14" y="60" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">fMP4/WebM init detect → 2GB cap</text>
      </g>

      <!-- Output Sink -->
      <g transform="translate(820, 224)">
        <rect x="0" y="0" width="180" height="128" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
        <rect x="12" y="12" width="76" height="16" rx="2" fill="#f1f5f9"/>
        <text x="50" y="23" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OUTPUT SINK</text>
        <text x="12" y="48" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">标准化交付队列</text>
        <text x="12" y="70" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">直链 + Mirrors 多账号轮换</text>
        <text x="12" y="90" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">HLS / DASH 分轨 / BT 种子</text>
        <text x="12" y="112" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">→ DownloadEngine</text>
      </g>

      <!-- Legend Strip -->
      <line x1="40" y1="516" x2="1000" y2="516" stroke="#cbd5e1" stroke-width="1"/>
      <text x="40" y="542" fill="#475569" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="532" width="14" height="12" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
      <text x="142" y="542" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">常规 HTTP / API 解析路径</text>

      <rect x="336" y="532" width="14" height="12" rx="2" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
      <text x="358" y="542" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">核心破壁路径（竞速与 MSE 录制）</text>

      <rect x="596" y="532" width="14" height="12" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="618" y="542" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">JavaScriptCore 端侧求值</text>

      <line x1="816" y1="538" x2="848" y2="538" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#cloudn-multi-route-parser-and-mse-pipeline-arrow)"/>
      <text x="856" y="542" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">短时缓存复用</text>
    </svg>
