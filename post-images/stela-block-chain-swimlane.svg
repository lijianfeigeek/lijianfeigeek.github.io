<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="stela-chain-title stela-chain-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="stela-chain-title">Stela 无解释器 ARM64e 执行流、原子块链接与 M1 Pro 实机对拍机制</title>
  <desc id="stela-chain-desc">展示 stela-compiler 将 AArch64 基本块直接编译为 x86-64 原生代码，通过 chain.rs 原子热补丁与 ASID 加盐 ITLB 实现跨块直跳，结合 QARMA5 PAC 共享表缓存与 Apple M1 Pro 实机差分测试保证精确语义。</desc>
  <defs>
    <marker id="scs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="scs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="scs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="912" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="24" font-size="16" font-weight="700" fill="#0f172a">无解释器执行流：NativeBlock 原子块链接、QARMA5 缓存与 M1 Pro 差分预言机</text>
    <text x="16" y="42" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">CRATES/STELA-COMPILER/SRC/X86_64/CHAIN.RS + STELA-ENGINE/SRC/PAUTH.RS + XTASK/SRC/CPU_REFERENCE.RS</text>
    <text x="896" y="31" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: SWIMLANE</text>
  </g>

  <!-- Swimlane Backgrounds (3 horizontal lanes) -->
  <g transform="translate(24, 84)">
    <!-- Lane 1: AOT/JIT Compiler -->
    <rect x="0" y="0" width="912" height="128" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0f172a">STELA-COMPILER</text>
    <text x="16" y="66" font-size="12" font-weight="600" fill="#334155">静态 / 即时编译</text>
    <text x="16" y="84" font-size="10" fill="#64748b">无解释器兜底</text>

    <!-- Lane 2: System Dispatch & Chain -->
    <rect x="0" y="128" width="912" height="148" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="182" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c">STELA-ENGINE</text>
    <text x="16" y="200" font-size="12" font-weight="600" fill="#be123c">块链接与分发</text>
    <text x="16" y="218" font-size="10" fill="#64748b">8B 原子热补丁</text>

    <!-- Lane 3: M1 Pro Differential Oracle -->
    <rect x="0" y="276" width="912" height="116" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="320" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0284c7">HARDWARE ORACLE</text>
    <text x="16" y="338" font-size="12" font-weight="600" fill="#334155">实机差分校验</text>
    <text x="16" y="356" font-size="10" fill="#64748b">M1 Pro 基线对拍</text>

    <line x1="140" y1="0" x2="140" y2="392" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Orthogonal Connectors (drawn BEFORE boxes) -->
  <!-- Lane 1: Decode -> Emit -->
  <path d="M 352 148 L 412 148" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#scs-arrow)"/>
  <!-- Lane 1: Emit -> Cache Pack -->
  <path d="M 604 148 L 664 148" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#scs-arrow)"/>

  <!-- Handoff: Emit -> Chain Execution (down to Lane 2) -->
  <path d="M 508 188 L 508 212 A 8 8 0 0 1 500 220 L 268 220 A 8 8 0 0 0 260 228 L 260 242" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#scs-arrow-accent)"/>
  <rect x="336" y="200" width="96" height="16" rx="2" fill="#ffffff"/>
  <text x="384" y="212" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#be123c" text-anchor="middle">NATIVE BLOCK RX</text>

  <!-- Lane 2: Block Chain -> Paired Call/ITLB -->
  <path d="M 364 286 L 412 286" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#scs-arrow-accent)"/>
  <!-- Lane 2: Paired Call/ITLB -> QARMA5 PAC Memo -->
  <path d="M 604 286 L 664 286" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#scs-arrow-link)"/>

  <!-- Lane 3: Runner -> TSV -> Diff -->
  <path d="M 352 418 L 412 418" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#scs-arrow-link)"/>
  <path d="M 604 418 L 664 418" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#scs-arrow-link)"/>

  <!-- Vertical verification arrow from Compiler Emit / Engine down to Diff Check -->
  <path d="M 760 188 L 760 224 A 8 8 0 0 1 768 232 L 892 232 A 8 8 0 0 1 900 240 L 900 410 A 8 8 0 0 1 892 418 L 856 418" fill="none" stroke="#059669" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#scs-arrow)"/>

  <!-- Lane 1 Nodes -->
  <g transform="translate(184, 108)">
    <rect x="0" y="0" width="168" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="168" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="84" y="26" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">AArch64 指令提升</text>
    <text x="84" y="45" font-size="10" fill="#475569" text-anchor="middle">3,000+ 编码 + AMX + WKdm</text>
    <text x="84" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">Lifter::lift() 无解释器</text>
  </g>

  <g transform="translate(416, 108)">
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="94" y="26" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">x86-64 原生发射器</text>
    <text x="94" y="45" font-size="10" fill="#475569" text-anchor="middle">SCTLR 检查 · 对齐 8B 补丁槽</text>
    <text x="94" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">AVX2/AVX-512 · relocations</text>
  </g>

  <g transform="translate(668, 108)">
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="94" y="26" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">持久化翻译包缓存</text>
    <text x="94" y="45" font-size="10" fill="#475569" text-anchor="middle">按编译器 SHA-256 签名绑定</text>
    <text x="94" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">translation_store.rs</text>
  </g>

  <!-- Lane 2 Nodes -->
  <g transform="translate(184, 246)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="90" y="26" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">原子块直连 (Chain)</text>
    <text x="90" y="45" font-size="10" fill="#334155" text-anchor="middle">单次 8B 写入 jmp rel32</text>
    <text x="90" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#9f1239" text-anchor="middle">ACCOUNT 预算 + 中断纪元检查</text>
  </g>

  <g transform="translate(416, 246)">
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="94" y="26" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">加盐 ITLB 与配对返回</text>
    <text x="94" y="45" font-size="10" fill="#334155" text-anchor="middle">paired_call 利用宿主 ret 预测</text>
    <text x="94" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">2-way Set ITLB · BTYPE 校验</text>
  </g>

  <g transform="translate(668, 246)">
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="94" y="26" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">QARMA5 PAC 状态表</text>
    <text x="94" y="45" font-size="10" fill="#334155" text-anchor="middle">SSSE3 PSHUFB 恒定时间计算</text>
    <text x="94" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">跨 PE 共享 IA/IB/DA/DB/GA</text>
  </g>

  <!-- Lane 3 Nodes -->
  <g transform="translate(184, 378)">
    <rect x="0" y="0" width="168" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="168" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="84" y="26" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">真机 SSH 语料执行</text>
    <text x="84" y="45" font-size="10" fill="#475569" text-anchor="middle">M1 Pro 原生运行 runner.c</text>
    <text x="84" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">EL0 寄存器与状态采样</text>
  </g>

  <g transform="translate(416, 378)">
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="94" y="26" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">权威真值回归表</text>
    <text x="94" y="45" font-size="10" fill="#475569" text-anchor="middle">持久化记录硬件指令语义</text>
    <text x="94" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">apple-m1-pro.tsv</text>
  </g>

  <g transform="translate(668, 378)">
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="188" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="94" y="26" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">CI 无真机差分断言</text>
    <text x="94" y="45" font-size="10" fill="#334155" text-anchor="middle">逐用例对齐除已知 PAC 差异</text>
    <text x="94" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#047857" text-anchor="middle">cargo xtask cpu-reference</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(24, 508)">
    <line x1="0" y1="0" x2="912" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" font-weight="700">LEGEND</text>
    <rect x="72" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="94" y="24" font-size="11" fill="#334155">块链接热路径（零回退开销）</text>
    <rect x="284" y="13" width="14" height="14" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="306" y="24" font-size="11" fill="#334155">ITLB / QARMA5 运行时加速</text>
    <rect x="488" y="13" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="510" y="24" font-size="11" fill="#334155">M1 Pro 实机语义对拍</text>
    <text x="912" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">NO INTERPRETER FALLBACK</text>
  </g>
</svg>
