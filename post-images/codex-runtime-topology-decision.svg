<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-runtime-topology-decision-title codex-runtime-topology-decision-desc" id="codex-runtime-topology-decision-root">
      <title id="codex-runtime-topology-decision-title">新建任务运行拓扑决策树：Worktree、Cloud 与 Local 模式选型</title>
      <desc id="codex-runtime-topology-decision-desc">基于并发修改冲突风险、资源开销与异步执行周期的任务运行拓扑最佳选型指南</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-runtime-topology-decision-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-runtime-topology-decision-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-runtime-topology-decision-root .mono { font-family: "Geist Mono", monospace; }
      #codex-runtime-topology-decision-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-runtime-topology-decision-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-runtime-topology-decision-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-runtime-topology-decision-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Root Question -->
        <g transform="translate(40, 160)">
          <rect x="0" y="0" width="220" height="60" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1.2" stroke-opacity="0.2"/>
          <text x="16" y="26" font-size="11" font-weight="600" fill="#2d3142" class="mono" fill-opacity="0.6">TASK INITIALIZATION</text>
          <text x="16" y="46" font-size="14" font-weight="600" fill="#2d3142">如何选择运行拓扑？</text>
        </g>

        <!-- Decision 1 -->
        <g transform="translate(320, 60)">
          <rect x="0" y="0" width="260" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" stroke-opacity="0.18"/>
          <text x="16" y="24" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">CONDITION 01</text>
          <text x="16" y="48" font-size="13" font-weight="600" fill="#2d3142">是否需要多人或多 Agent</text>
          <text x="16" y="68" font-size="13" font-weight="600" fill="#2d3142">同时修改同一个代码仓库？</text>
        </g>

        <!-- Decision 2 -->
        <g transform="translate(320, 230)">
          <rect x="0" y="0" width="260" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" stroke-opacity="0.18"/>
          <text x="16" y="24" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">CONDITION 02</text>
          <text x="16" y="48" font-size="13" font-weight="600" fill="#2d3142">是否为耗时长、重构面广</text>
          <text x="16" y="68" font-size="13" font-weight="600" fill="#2d3142">或无需值守的异步任务？</text>
        </g>

        <!-- Result 1: Worktree (Focal) -->
        <g transform="translate(660, 45)">
          <rect x="0" y="0" width="260" height="110" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#bf4520" class="mono">TOPOLOGY A (RECOMMENDED)</text>
          <text x="12" y="48" font-size="14" font-weight="600" fill="#bf4520">Worktree 物理隔离模式</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.75">• Git 独立物理工作目录</text>
          <text x="12" y="88" font-size="11" fill="#2d3142" fill-opacity="0.75">• 多分支并发无锁写入，互不踩踏</text>
          <text x="12" y="104" font-size="11" fill="#2d3142" fill-opacity="0.75">• 保护宿主本地当前工作树干净</text>
        </g>

        <!-- Result 2: Cloud -->
        <g transform="translate(660, 185)">
          <rect x="0" y="0" width="260" height="90" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">TOPOLOGY B: ASYNC CLOUD</text>
          <text x="12" y="48" font-size="14" font-weight="600" fill="#2d3142">Cloud 远端沙盒模式</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">• 远端独立虚机容器异步执行</text>
          <text x="12" y="86" font-size="11" fill="#2d3142" fill-opacity="0.7">• 释放本地 CPU 与内存，夜间无人值守</text>
        </g>

        <!-- Result 3: Local -->
        <g transform="translate(660, 295)">
          <rect x="0" y="0" width="260" height="75" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="12" y="24" font-size="11" font-weight="600" fill="#2d3142" class="mono">TOPOLOGY C: LOCAL FAST-PATH</text>
          <text x="12" y="46" font-size="14" font-weight="600" fill="#2d3142">Local 直连本地模式</text>
          <text x="12" y="66" font-size="11" fill="#2d3142" fill-opacity="0.7">• 零开销直连当前目录，适合轻快单线微调</text>
        </g>

        <!-- Orthogonal Connections -->
        <!-- Start -> Decision 1 -->
        <path d="M 260 190 L 290 190 Q 300 190 300 180 L 300 115 Q 300 105 310 105 L 320 105" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-runtime-topology-decision-arrow-default)" opacity="0.6"/>
        <!-- Decision 1 -> Worktree (Yes) -->
        <path d="M 580 105 L 660 105" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#codex-runtime-topology-decision-arrow-accent)"/>
        <g transform="translate(605, 92)">
          <rect x="0" y="0" width="30" height="18" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
          <text x="8" y="13" font-size="10" font-weight="700" fill="#bf4520">是</text>
        </g>

        <!-- Decision 1 -> Decision 2 (No) -->
        <path d="M 450 150 L 450 230" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-runtime-topology-decision-arrow-default)" opacity="0.6"/>
        <g transform="translate(458, 185)">
          <rect x="0" y="0" width="24" height="18" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.3"/>
          <text x="6" y="13" font-size="10" font-weight="600" fill="#2d3142">否</text>
        </g>

        <!-- Decision 2 -> Cloud (Yes) -->
        <path d="M 580 260 L 610 260 Q 620 260 620 250 L 620 240 Q 620 230 630 230 L 660 230" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-runtime-topology-decision-arrow-default)" opacity="0.6"/>
        <g transform="translate(595, 240)">
          <rect x="0" y="0" width="24" height="18" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.3"/>
          <text x="6" y="13" font-size="10" font-weight="600" fill="#2d3142">是</text>
        </g>

        <!-- Decision 2 -> Local (No) -->
        <path d="M 580 290 L 610 290 Q 620 290 620 310 Q 620 330 630 330 L 660 330" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-runtime-topology-decision-arrow-default)" opacity="0.6"/>
        <g transform="translate(595, 305)">
          <rect x="0" y="0" width="24" height="18" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.3"/>
          <text x="6" y="13" font-size="10" font-weight="600" fill="#2d3142">否</text>
        </g>
      </g>
    </svg>
