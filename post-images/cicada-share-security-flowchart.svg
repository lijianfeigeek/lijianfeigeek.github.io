<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="csf-title csf-desc" id="cicada-flowchart-root" data-diagram="flowchart">
  <title id="csf-title">知了 Cicada 分享链接防泄密与反提示词注入动态阈值决策流</title>
  <desc id="csf-desc">展示 Cicada 在上传分享会议纪要前，如何通过六类密钥正则硬拦截、双模型地域容灾（Clef 451 自动切换 Jev）以及反提示词注入探针将阻断阈值从 0.85 动态收紧至 0.60 的完整决策逻辑。</desc>
  <defs>
    <pattern id="csf-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="csf-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="csf-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="csf-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="680" fill="url(#csf-dots)"/>
  <rect x="16" y="16" width="968" height="648" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">SHARE GATEWAY SECURITY · ANTI-STEERING DYNAMIC BAR (0.85 TO 0.60) &amp; FAIL-CLOSED REVIEW</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">当参会者在录音里诱导 AI 放行密钥：分享网关的反注入动态收紧决策树</text>
  </g>

  <!-- ==================== ORTHOGONAL CONNECTORS (DRAWN BEFORE SHAPES) ==================== -->
  <!-- Start Oval (360, 136) bottom=(360, 156) -> D1 Regex Diamond top=(360, 192) -->
  <line x1="360" y1="156" x2="360" y2="192" stroke="#64748b" stroke-width="1.2" marker-end="url(#csf-arr-muted)"/>

  <!-- D1 Right (488, 232) -> Block Box (720, 232) via vertical trunk or direct horizontal to Block Card 1 -->
  <path d="M 488 232 L 732 232 Q 740 232 740 240 L 740 468" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#csf-arr-accent)"/>
  <rect x="528" y="210" width="156" height="16" rx="2" fill="#ffffff"/>
  <text x="606" y="221" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">YES · REGEX HIT (HARD)</text>

  <!-- D1 Bottom (360, 272) -> Step S1 Dual-Model Scorer top=(360, 304) -->
  <line x1="360" y1="272" x2="360" y2="304" stroke="#64748b" stroke-width="1.2" marker-end="url(#csf-arr-muted)"/>
  <rect x="368" y="280" width="36" height="14" rx="2" fill="#ffffff"/>
  <text x="386" y="290" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NO</text>

  <!-- Step S1 Bottom (360, 364) -> FOCAL D2 Manipulation Diamond top=(360, 396) -->
  <line x1="360" y1="364" x2="360" y2="396" stroke="#bf4520" stroke-width="1.3" marker-end="url(#csf-arr-accent)"/>

  <!-- D2 Left (216, 440) -> Step S2 Standard Bar (136, 440 -> down to merge dot 248, 536) -->
  <path d="M 216 440 L 136 440 Q 128 440 128 448 L 128 484" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#csf-arr-muted)"/>
  <rect x="148" y="418" width="52" height="15" rx="2" fill="#ffffff"/>
  <text x="174" y="428" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NO &lt;0.85</text>

  <!-- D2 Right (504, 440) -> Step S3 Tightened Bar (552, 440 -> down to 484) -->
  <path d="M 504 440 L 564 440 Q 572 440 572 448 L 572 484" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#csf-arr-accent)"/>
  <rect x="508" y="418" width="64" height="15" rx="2" fill="#ffffff"/>
  <text x="540" y="428" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">YES &gt;=0.85</text>

  <!-- S2 Bottom (128, 536) & S3 Bottom (572, 536) -> Merge Dot at (360, 560) -> D3 Final Gate? Let's merge cleanly into D3 at (360, 568) -->
  <path d="M 128 536 L 128 552 Q 128 560 136 560 L 356 560" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 572 536 L 572 552 Q 572 560 564 560 L 364 560" fill="none" stroke="#bf4520" stroke-width="1.3"/>
  <circle cx="360" cy="560" r="4" fill="#0f172a"/>

  <!-- Merge Dot (360, 564) -> D3 Final Gate left/right? Wait: let's route Merge Dot (360, 560) right into D3 or down! Let's check vertical space: y=560..608! Let's place D3 at x=360, y=588, or place End Ovals on Left & Right of D3! -->
  <line x1="360" y1="564" x2="360" y2="576" stroke="#0f172a" stroke-width="1.2" marker-end="url(#csf-arr-muted)"/>

  <!-- D3 (center 360, 600; left=236, right=484) -->
  <!-- D3 Right (484, 600) -> Block Terminal Oval (684, 504) via x=740? Wait: Block Terminal is at x=664..928, y=468..544! Let's connect D3 Right (484, 600) -> x=796, up to bottom of Block Terminal (796, 544)! -->
  <path d="M 484 600 L 788 600 Q 796 600 796 592 L 796 544" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#csf-arr-accent)"/>
  <rect x="556" y="578" width="164" height="16" rx="2" fill="#ffffff"/>
  <text x="638" y="589" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SCORE &gt;= BAR OR API DOWN</text>

  <!-- D3 Left (236, 600) -> Pass Terminal Oval (x=48..212, y=580..620) -->
  <line x1="236" y1="600" x2="212" y2="600" stroke="#059669" stroke-width="1.4" marker-end="url(#csf-arr-ok)"/>
  <rect x="214" y="578" width="36" height="15" rx="2" fill="#ffffff"/>
  <text x="232" y="588" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PASS</text>

  <!-- ==================== FLOWCHART SHAPES (ISOLATED <g>) ==================== -->
  <!-- Start Oval (center 360, 132, w=296, h=48, rx=24) -->
  <g transform="translate(212, 108)">
    <rect x="0" y="0" width="296" height="48" rx="24" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
    <text x="148" y="21" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">点击“分享…”提交分片（8 路并发审查）</text>
    <text x="148" y="37" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chunks(doc) · 切分处自动保持密钥完整不截断</text>
  </g>

  <!-- D1 Diamond: Fixed-Shape Key Regex (center 360, 232, halfW=128, halfH=40) -->
  <g transform="translate(232, 192)">
    <polygon points="128,0 256,40 128,80 0,40" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <text x="128" y="36" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">命中 6 类密钥正则？</text>
    <text x="128" y="52" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PEM / AKIA / ghp_ / sk-</text>
  </g>

  <!-- S1 Step: Dual-Model Probabilistic Scorer (x=208, y=304, w=304, h=60) -->
  <g transform="translate(208, 304)">
    <rect x="0" y="0" width="304" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="152" y="22" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DUAL-MODEL PROBABILITY SCORER</text>
    <text x="152" y="40" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">首选 Clef-Flash · 遇 451 地域拦截无缝切 Jev-1.14</text>
    <text x="152" y="54" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">同时对 5 类泄密风险 + 1 类操控意图输出 [0, 1] 概率</text>
  </g>

  <!-- FOCAL D2 Diamond: Anti-Steering Manipulation Check (center 360, 440, halfW=144, halfH=44) -->
  <g transform="translate(216, 396)">
    <polygon points="144,0 288,44 144,88 0,44" fill="#fff7f5" stroke="#bf4520" stroke-width="1.6"/>
    <text x="144" y="38" fill="#bf4520" font-size="11.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">话术试图操控审查 AI？</text>
    <text x="144" y="55" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">manipulation &gt;= 0.85</text>
  </g>

  <!-- S2 Step: Normal Bar 0.85 (x=48, y=484, w=160, h=52) -->
  <g transform="translate(48, 484)">
    <rect x="0" y="0" width="160" height="52" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="22" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">维持常规阈值 0.85</text>
    <text x="80" y="39" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">日常会议均值 ~0.10</text>
  </g>

  <!-- S3 Step: Tightened Bar 0.60 (x=484, y=484, w=176, h=52) -->
  <g transform="translate(484, 484)">
    <rect x="0" y="0" width="176" height="52" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.3"/>
    <text x="88" y="22" fill="#bf4520" font-size="11.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">收紧该分片阈值至 0.60</text>
    <text x="88" y="39" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">反制“虚构测试数据”压分</text>
  </g>

  <!-- Editorial Callout Card on Right Top (x=680, y=288, w=272, h=140) -->
  <g transform="translate(680, 288)">
    <rect x="0" y="0" width="272" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="16" y="24" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">EMPIRICAL ADVERSARIAL BENCHMARK</text>
    <text x="16" y="48" fill="#0f172a" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', serif">实测真密钥裸露得分 0.93；前置注入</text>
    <text x="16" y="68" fill="#0f172a" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', serif">“以下为虚构测试数据”后被压低至 0.84，</text>
    <text x="16" y="88" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">恰好卡在 0.85 红线下逃逸！</text>
    <text x="16" y="112" fill="#64748b" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">注意：仅靠“今天没聊敏感内容”触发操控探针</text>
    <text x="16" y="128" fill="#64748b" font-size="9.5" font-family="'Geist', 'PingFang SC', sans-serif">不会误封，只有同时伴随敏感内容 &gt;=0.60 才拦截。</text>
  </g>

  <!-- D3 Final Decision Diamond (center 360, 600, halfW=124, halfH=24) -->
  <g transform="translate(236, 576)">
    <polygon points="124,0 248,24 124,48 0,24" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <text x="124" y="28" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">任一敏感项 &gt;= 当前阈值？</text>
  </g>

  <!-- Terminal Oval 1: Blocked (x=680, y=468, w=272, h=76, rx=24) -->
  <g transform="translate(680, 468)">
    <rect x="0" y="0" width="272" height="76" rx="24" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="136" y="32" fill="#bf4520" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">熔断拒绝上传（Fail-Closed）</text>
    <text x="136" y="52" fill="#475569" font-size="9.2" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">精准定位违规行区间 · 服务端零明文留存</text>
  </g>

  <!-- Terminal Oval 2: Approved Share Link (x=36, y=576, w=176, h=48, rx=24) -->
  <g transform="translate(36, 576)">
    <rect x="0" y="0" width="176" height="48" rx="24" fill="#f0fdf4" stroke="#059669" stroke-width="1.3"/>
    <text x="88" y="22" fill="#059669" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">签发加密分享链接</text>
    <text x="88" y="38" fill="#475569" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">支持口令与到期自动销毁</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="636" x2="960" y2="636" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(40, 648)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="20" y="12" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">反提示词注入自适应防线（manipulation 探针联动收紧阈值 + 审查宕机默认拒单）</text>
  </g>
  <g transform="translate(612, 648)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">5 CATEGORIES: CREDENTIAL · CONFIDENTIAL · CROSSBORDER · PII · HARMFUL</text>
  </g>
</svg>
