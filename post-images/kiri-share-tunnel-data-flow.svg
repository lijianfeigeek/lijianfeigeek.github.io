<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="kiri-share-title kiri-share-desc" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="kiri-share-title">kiri share 免费内网穿透协议与多通道数据流架构</title>
  <desc id="kiri-share-desc">展示 kiri share 如何替代 Ngrok：通过 ALPN kiri-share/1 复用 TLS 443 端口、执行 HMAC-SHA-256 构建密钥验证、多连接分片传输与每流窗口流控。</desc>
  <defs>
    <marker id="ksh-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="ksh-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
    <marker id="ksh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>

  <!-- Header -->
  <g transform="translate(36, 20)">
    <rect x="0" y="0" width="888" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" font-size="16" font-weight="700" fill="#0f172a">内置 Ngrok 替代方案：kiri share 多通道并发隧道与协议流控数据流</text>
    <text x="20" y="42" font-size="11" fill="#475569">单端口 ALPN 复用 · HMAC-SHA-256 构建证明 · 256 KiB 滑动窗口与多 TCP 通道条带化分发</text>
    <rect x="772" y="14" width="100" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="822" y="30" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#475569" text-anchor="middle">DATA FLOW</text>
  </g>

  <!-- Stage Header Bar -->
  <g transform="translate(180, 88)">
    <rect x="0" y="0" width="176" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="88" y="20" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">01 · ALPN 握手与身份</text>

    <rect x="188" y="0" width="176" height="32" rx="4" fill="#fff7ed" stroke="#bf4520" stroke-width="1.2"/>
    <text x="276" y="20" font-size="11" font-weight="700" fill="#bf4520" text-anchor="middle">02 · 挑战与构建证明</text>

    <rect x="376" y="0" width="176" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="464" y="20" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">03 · 多通道窗口流控</text>

    <rect x="564" y="0" width="180" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="654" y="20" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">04 · 公网访客反代</text>
  </g>

  <!-- Swimlane Backgrounds -->
  <!-- Lane 1: LOCAL SERVICE -->
  <g transform="translate(36, 132)">
    <rect x="0" y="0" width="888" height="108" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="132" height="108" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="66" y="48" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#334155" text-anchor="middle">LOCAL TARGET</text>
    <text x="66" y="66" font-size="10.5" fill="#64748b" text-anchor="middle">本地端口 / 容器</text>
  </g>

  <!-- Lane 2: KIRI SHARE CLIENT -->
  <g transform="translate(36, 252)">
    <rect x="0" y="0" width="888" height="116" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="132" height="116" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="66" y="52" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#9a3412" text-anchor="middle">KIRI CLIENT</text>
    <text x="66" y="70" font-size="10.5" fill="#bf4520" text-anchor="middle">kiri 3000 隧道客户端</text>
  </g>

  <!-- Lane 3: EDGE & VISITORS -->
  <g transform="translate(36, 380)">
    <rect x="0" y="0" width="888" height="108" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="132" height="108" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="66" y="48" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#1e40af" text-anchor="middle">KIRI EDGE</text>
    <text x="66" y="66" font-size="10.5" fill="#2e5aa8" text-anchor="middle">edge.runkiri.com</text>
  </g>

  <!-- Connectors (drawn BEFORE nodes) -->
  <!-- Step 1 Client -> Step 1 Edge (TLS Hello) -->
  <path d="M 268 344 L 268 398" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ksh-arrow-link)"/>
  <rect x="276" y="362" width="100" height="16" rx="2" fill="#f8fafc"/>
  <text x="326" y="373" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#2e5aa8" text-anchor="middle">TLS ALPN: kiri-share/1</text>

  <!-- Step 1 Edge -> Step 2 Client (Challenge) -->
  <path d="M 352 434 L 456 434 Q 464 434 464 426 L 464 352" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ksh-arrow-accent)"/>
  <rect x="372" y="410" width="84" height="16" rx="2" fill="#ffffff"/>
  <text x="414" y="421" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#bf4520" text-anchor="middle">Challenge(nonce)</text>

  <!-- Step 2 Client -> Step 3 Client (Welcome + Lanes) -->
  <path d="M 544 310 L 568 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ksh-arrow-muted)"/>

  <!-- Step 3 Client <-> Step 3 Edge (Multi-lane Data/Chunk/Window) -->
  <path d="M 644 348 L 644 398" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ksh-arrow-link)"/>
  <rect x="652" y="362" width="108" height="16" rx="2" fill="#f8fafc"/>
  <text x="706" y="373" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#2e5aa8" text-anchor="middle">Join + Chunk + Window</text>

  <!-- Step 1 Local <-> Step 3 Client (Bridge) -->
  <path d="M 352 186 L 636 186 Q 644 186 644 194 L 644 268" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ksh-arrow-muted)"/>
  <rect x="440" y="164" width="128" height="16" rx="2" fill="#ffffff"/>
  <text x="504" y="175" font-size="8.5" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">OPEN STREAM → 双向线程桥接</text>

  <!-- Step 3 Edge -> Step 4 Edge (Visitor HTTP) -->
  <path d="M 728 434 L 748 434" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ksh-arrow-muted)"/>

  <!-- Nodes -->
  <!-- Lane 1 Node: Local target -->
  <g transform="translate(184, 150)">
    <rect x="0" y="0" width="168" height="72" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
    <text x="84" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">本地服务 / 容器目标</text>
    <text x="84" y="42" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">127.0.0.1:3000 | container</text>
    <text x="84" y="58" font-size="9.5" fill="#64748b" text-anchor="middle">kiri share resolve() 解析目标</text>
  </g>

  <!-- Lane 1 Node: Traffic & Shutdown -->
  <g transform="translate(748, 150)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="24" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">实时流量可观测文件</text>
    <text x="80" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">~/.kiri/shares/&lt;pid&gt;.json</text>
    <text x="80" y="58" font-size="9.5" fill="#64748b" text-anchor="middle">每2秒原子落盘供 GUI 展示</text>
  </g>

  <!-- Lane 2 Node 1: Hello -->
  <g transform="translate(184, 272)">
    <rect x="0" y="0" width="168" height="72" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
    <text x="84" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">发送 Hello 能力协商</text>
    <text x="84" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#2e5aa8" text-anchor="middle">ATTEST | LANES | WINDOW</text>
    <text x="84" y="58" font-size="9.5" fill="#64748b" text-anchor="middle">携带机器哈希与 GitHub Token</text>
  </g>

  <!-- Lane 2 Node 2: Attest (FOCAL) -->
  <g transform="translate(380, 272)">
    <rect x="0" y="0" width="164" height="72" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="82" y="24" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Attest 构建防伪证明</text>
    <text x="82" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#bf4520" text-anchor="middle">HMAC-SHA256(key, nonce)</text>
    <text x="82" y="58" font-size="9.5" fill="#9a3412" text-anchor="middle">绑定 token 摘要与 device_id</text>
  </g>

  <!-- Lane 2 Node 3: Multiplex & Lanes -->
  <g transform="translate(568, 272)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <text x="80" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">多通道流控复用引擎</text>
    <text x="80" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">32KB MAX_CHUNK · 256KB Win</text>
    <text x="80" y="58" font-size="9.5" fill="#64748b" text-anchor="middle">避免慢连接队头阻塞</text>
  </g>

  <!-- Lane 3 Node 1: Edge Gate -->
  <g transform="translate(184, 398)">
    <rect x="0" y="0" width="168" height="72" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1.2"/>
    <text x="84" y="24" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Edge 单端口 443 分流</text>
    <text x="84" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#2e5aa8" text-anchor="middle">edge.runkiri.com:443</text>
    <text x="84" y="58" font-size="9.5" fill="#64748b" text-anchor="middle">ALPN 区分隧道客户端与访客</text>
  </g>

  <!-- Lane 3 Node 3: Reorder & Stream -->
  <g transform="translate(568, 398)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <text x="80" y="24" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Chunk 乱序重组与反压</text>
    <text x="80" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="middle">seq 编号重组 · Welcome 速率</text>
    <text x="80" y="58" font-size="9.5" fill="#64748b" text-anchor="middle">30s 心跳 Ping · 断线自动重连</text>
  </g>

  <!-- Lane 3 Node 4: Public URL -->
  <g transform="translate(748, 398)">
    <rect x="0" y="0" width="160" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="80" y="24" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">公网 HTTPS 访客入口</text>
    <text x="80" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#059669" text-anchor="middle">https://&lt;name&gt;.runkiri.cloud</text>
    <text x="80" y="58" font-size="9.5" fill="#047857" text-anchor="middle">支持自定义域名与访客流映射</text>
  </g>

  <!-- Footer Note -->
  <g transform="translate(36, 500)">
    <text x="0" y="18" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#64748b">协议源码: crates/kiri-share-proto/src/lib.rs &amp; attest.rs (#![forbid(unsafe_code)], no_std) | 客户端: crates/kiri/src/share.rs</text>
  </g>
</svg>
