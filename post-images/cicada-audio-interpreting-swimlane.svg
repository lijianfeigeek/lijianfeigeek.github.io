<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="cas-title cas-desc" id="cicada-swimlane-root" data-diagram="swimlane">
  <title id="cas-title">知了 Cicada 全双工音频采集、滞后重听对齐与免按键同传四域泳道图</title>
  <desc id="cas-desc">展示从排除本进程的 Core Audio Tap 与回声消除麦克风采集，经 15 至 30 秒滞后重听编辑距离词边界无损替换、CJK 二元组去重，到动态底噪免按键同传并回注虚拟麦克风的完整链路。</desc>
  <defs>
    <pattern id="cas-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="cas-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="cas-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="cas-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="cas-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="640" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="640" fill="url(#cas-dots)"/>
  <rect x="16" y="16" width="968" height="608" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">FULL-DUPLEX AUDIO PIPELINE · DELAYED RE-LISTEN ALIGNMENT &amp; HANDS-FREE INTERPRETING</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">听得准且绝不把回声翻译回去：双轨识别校准与免按键同传四泳道协同流</text>
  </g>

  <!-- Swimlane Frame & 4 Horizontal Lanes (y=96..552, lane height=114) -->
  <rect x="36" y="96" width="928" height="456" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="96" width="168" height="456" fill="#f8fafc"/>
  <rect x="204" y="210" width="760" height="114" fill="#f8fafc" opacity="0.55"/>
  <rect x="204" y="438" width="760" height="114" fill="#f8fafc" opacity="0.55"/>
  <line x1="204" y1="96" x2="204" y2="552" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="36" y1="210" x2="964" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="324" x2="964" y2="324" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="438" x2="964" y2="438" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Lane Headers -->
  <g transform="translate(52, 124)">
    <text x="0" y="12" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 01 · AUDIO IO</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">系统内录与硬件麦</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">CATap · VoiceMic</text>
  </g>
  <g transform="translate(52, 238)">
    <text x="0" y="12" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 02 · HEARING</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">双轨识别与去重器</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">SpeechAnalyzer · DP</text>
  </g>
  <g transform="translate(52, 352)">
    <text x="0" y="12" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 03 · SPEAK</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">同传触发与防串音</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">Right ⌥ · HandsFree</text>
  </g>
  <g transform="translate(52, 466)">
    <text x="0" y="12" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 04 · AI &amp; MIC</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">一步同传与虚拟麦</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">Ming-3.0 · BlackHole</text>
  </g>

  <!-- ==================== ORTHOGONAL CONNECTORS (DRAWN BEFORE NODES) ==================== -->
  <!-- C1: N1 SystemAudioTap (bottom 304, 188) -> N2 Live Recognizer (top 304, 232) -->
  <line x1="304" y1="188" x2="304" y2="232" stroke="#64748b" stroke-width="1.2" marker-end="url(#cas-arr-muted)"/>
  <rect x="312" y="200" width="76" height="15" rx="2" fill="#ffffff"/>
  <text x="350" y="210" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">16KHZ MONO</text>

  <!-- C2: N2 Live Recognizer (right 388, 266) -> N3 RecordRefiner (left 436, 266) -->
  <line x1="388" y1="266" x2="436" y2="266" stroke="#bf4520" stroke-width="1.4" marker-end="url(#cas-arr-accent)"/>

  <!-- C3: N4 Room/VoiceMic (bottom 524, 188) -> N3 RecordRefiner & EchoMatch (top 524, 232) -->
  <line x1="524" y1="188" x2="524" y2="232" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cas-arr-ok)"/>
  <rect x="532" y="200" width="92" height="15" rx="2" fill="#ffffff"/>
  <text x="578" y="210" fill="#059669" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DEDUPE &gt;=60%</text>

  <!-- C4: N3 RecordRefiner (right 636, 266) -> N5 Bilingual Record & Notes (left 700, 266) -->
  <line x1="636" y1="266" x2="700" y2="266" stroke="#bf4520" stroke-width="1.4" marker-end="url(#cas-arr-accent)"/>
  <rect x="640" y="242" width="56" height="15" rx="2" fill="#ffffff"/>
  <text x="668" y="252" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">-33% ERR</text>

  <!-- C5: N4 VoiceMic (left-bottom 468, 188) -> route left to x=412 down to N6 HandsFreeDetector (left 436, 382) -->
  <path d="M 468 188 L 468 198 Q 468 206 460 206 L 420 206 Q 412 206 412 214 L 412 374 Q 412 382 420 382 L 436 382" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#cas-arr-accent)"/>
  <rect x="284" y="348" width="120" height="16" rx="2" fill="#ffffff"/>
  <text x="344" y="359" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AEC + DUCKING STREAM</text>

  <!-- C6: N6 HandsFreeDetector (bottom 536, 416) -> N7 Ming S2ST + TTS (top 536, 460) -->
  <line x1="536" y1="416" x2="536" y2="460" stroke="#0284c7" stroke-width="1.4" marker-end="url(#cas-arr-link)"/>
  <rect x="544" y="428" width="96" height="15" rx="2" fill="#ffffff"/>
  <text x="592" y="438" fill="#0284c7" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">16KHZ WAV CLIP</text>

  <!-- C7: N7 Ming S2ST + TTS (right 648, 494) -> N8 VirtualMic Loopback (left 700, 494) -->
  <line x1="648" y1="494" x2="700" y2="494" stroke="#059669" stroke-width="1.4" marker-end="url(#cas-arr-ok)"/>

  <!-- C8: N8 VirtualMic Loopback (top 824, 460) -> N9 Meeting App Peer (bottom 824, 188) -->
  <line x1="824" y1="460" x2="824" y2="188" stroke="#059669" stroke-width="1.4" marker-end="url(#cas-arr-ok)"/>
  <rect x="832" y="368" width="116" height="16" rx="2" fill="#ffffff"/>
  <text x="890" y="379" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRANSLATED VOICE</text>

  <!-- ==================== NODES (8 NODES WITHIN BUDGET, ISOLATED <g>) ==================== -->
  <!-- N1: SystemAudioTap -->
  <g transform="translate(220, 120)">
    <rect x="0" y="0" width="168" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">01 · PROCESS TAP</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">排除本进程系统内录</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">蓝牙 16kHz 变采样率自愈</text>
  </g>

  <!-- N4: VoiceMic (Room & Interpreting Mic) -->
  <g transform="translate(436, 120)">
    <rect x="0" y="0" width="200" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">02 · VOICEMIC AEC</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">独立选麦与回声消除单元</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">advancedDucking 自动压低会场声</text>
  </g>

  <!-- N9: Meeting App Peer -->
  <g transform="translate(700, 120)">
    <rect x="0" y="0" width="244" height="68" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">08 · CALL PEER (ZERO BOT)</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">会议软件对端直接听到译文人声</text>
    <text x="12" y="56" fill="#0369a1" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">Zoom / 飞书 / 腾讯会议 / Teams 无感</text>
  </g>

  <!-- N2: Live Recognizer -->
  <g transform="translate(220, 232)">
    <rect x="0" y="0" width="168" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">03 · LIVE STREAM</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">秒级语种检测与首屏字幕</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">半句走 Google · 整句走 Ling</text>
  </g>

  <!-- N3: FOCAL 1 - RecordRefiner + EchoMatch -->
  <g transform="translate(436, 232)">
    <rect x="0" y="0" width="200" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">04 · RECORD REFINER</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">15–30s 滞后重听与词边界对齐</text>
    <text x="12" y="56" fill="#bf4520" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">编辑距离回溯 · 保住原行 ID 与声纹</text>
  </g>

  <!-- N5: Bilingual Record & Live Notes -->
  <g transform="translate(700, 232)">
    <rect x="0" y="0" width="244" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">05 · STRUCTURED NOTES</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">每 45s 增量纪要、待办与鱼骨图</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">点结论直跳原话回放 · 声纹自动填人名</text>
  </g>

  <!-- N6: FOCAL 2 - HandsFreeDetector & Echo Guard -->
  <g transform="translate(436, 348)">
    <rect x="0" y="0" width="212" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">06 · HANDS-FREE DETECTOR</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">动态底噪追踪与三层防回声误发</text>
    <text x="12" y="56" fill="#bf4520" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">4x 底噪起音 · 1s 截断 · &lt;0.8s 幻觉丢弃</text>
  </g>

  <!-- N7: Ming One-Step Audio + Cloned TTS -->
  <g transform="translate(436, 460)">
    <rect x="0" y="0" width="212" height="68" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">07 · MING AUDIO + TTS</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">一步语音听译 + 8s 克隆音色合成</text>
    <text x="12" y="56" fill="#0369a1" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">Ming-3.0-audio-flash · 0.5B TTS</text>
  </g>

  <!-- N8: VirtualMic Gate -->
  <g transform="translate(700, 460)">
    <rect x="0" y="0" width="244" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">09 · VIRTUAL MIC GATE</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">安全门禁注入虚拟麦克风总线</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">硬红线：未成功翻译的原文绝不送入会场</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="36" y1="572" x2="964" y2="572" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(36, 590)">
    <rect x="0" y="1" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="18" y="11" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">核心算法创新点（RecordRefiner 词边界无损重听对齐 + HandsFree 动态底噪防回声门禁）</text>
  </g>
  <g transform="translate(564, 590)">
    <line x1="0" y1="7" x2="24" y2="7" stroke="#059669" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="32" y="11" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">混合会议外放二次去重与译文语音回注通道</text>
  </g>
</svg>
