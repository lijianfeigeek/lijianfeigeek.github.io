<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-task-mcp-tools-suite-title kandev-task-mcp-tools-suite-desc" id="kandev-task-mcp-tools-suite-root">
      <title id="kandev-task-mcp-tools-suite-title">Kandev 任务级 MCP 核心工具矩阵架构</title>
      <desc id="kandev-task-mcp-tools-suite-desc">上下文发现、子任务派生、依赖拓扑管理、跨任务通信与门禁信号的 6 大专用 MCP 协议工具</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-task-mcp-tools-suite-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-task-mcp-tools-suite-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-task-mcp-tools-suite-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-task-mcp-tools-suite-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-task-mcp-tools-suite-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-task-mcp-tools-suite-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-task-mcp-tools-suite-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Row 1: Tool 1 -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="280" height="135" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="26" rx="6" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">TOOL 01: CONTEXT</text>
          <text x="12" y="48" font-size="13" font-weight="600" fill="#2d3142">discover_context</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">• 自动获取当前工作区路径与仓储拓扑</text>
          <text x="12" y="88" font-size="11" fill="#2d3142" fill-opacity="0.7">• 提取关联流水线步骤与当前分支名</text>
          <text x="12" y="106" font-size="11" fill="#2d3142" fill-opacity="0.7">• 避免向 LLM 机械注入冗长预置提示词</text>
        </g>

        <!-- Row 1: Tool 2 -->
        <g transform="translate(340, 30)">
          <rect x="0" y="0" width="280" height="135" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="26" rx="6" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">TOOL 02: SUBTASK</text>
          <text x="12" y="48" font-size="13" font-weight="600" fill="#2d3142">create_subtask</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">• 运行时动态派生子任务并加入看板</text>
          <text x="12" y="88" font-size="11" fill="#2d3142" fill-opacity="0.7">• 自动继承父级工作区与环境配置</text>
          <text x="12" y="106" font-size="11" fill="#2d3142" fill-opacity="0.7">• 支持将大粒度重构拆分为可验证子集</text>
        </g>

        <!-- Row 1: Tool 3 (Focal) -->
        <g transform="translate(650, 30)">
          <rect x="0" y="0" width="280" height="135" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="280" height="26" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#bf4520" class="mono">TOOL 03: DEPENDENCY (FOCAL)</text>
          <text x="12" y="48" font-size="13" font-weight="600" fill="#bf4520">manage_dependencies</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.8">• 声明 blocked_by 任务依赖 DAG</text>
          <text x="12" y="88" font-size="11" fill="#2d3142" fill-opacity="0.8">• 后端核心内置成环检测 (Cycle Detection)</text>
          <text x="12" y="106" font-size="11" fill="#2d3142" fill-opacity="0.8">• 杜绝多智能体并发产生死锁循环</text>
        </g>

        <!-- Row 2: Tool 4 -->
        <g transform="translate(30, 185)">
          <rect x="0" y="0" width="280" height="135" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="26" rx="6" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">TOOL 04: MESSAGING</text>
          <text x="12" y="48" font-size="13" font-weight="600" fill="#2d3142">cross_task_message</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">• 跨任务 Session 广播结构化数据与指令</text>
          <text x="12" y="88" font-size="11" fill="#2d3142" fill-opacity="0.7">• 向上游/下游传递前置上下文</text>
          <text x="12" y="106" font-size="11" fill="#2d3142" fill-opacity="0.7">• 避免人工反复充当黏合剂中转信息</text>
        </g>

        <!-- Row 2: Tool 5 -->
        <g transform="translate(340, 185)">
          <rect x="0" y="0" width="280" height="135" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="26" rx="6" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">TOOL 05: PLAN STORE</text>
          <text x="12" y="48" font-size="13" font-weight="600" fill="#2d3142">save_task_plan</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">• 持久化包含架构图与四问排查的计划</text>
          <text x="12" y="88" font-size="11" fill="#2d3142" fill-opacity="0.7">• 自动同步至 Web 看板独立 Plan 视图</text>
          <text x="12" y="106" font-size="11" fill="#2d3142" fill-opacity="0.7">• 为后续 Code Review 提供基线参照</text>
        </g>

        <!-- Row 2: Tool 6 -->
        <g transform="translate(650, 185)">
          <rect x="0" y="0" width="280" height="135" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="26" rx="6" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">TOOL 06: GATING SIGNAL</text>
          <text x="12" y="48" font-size="13" font-weight="600" fill="#2d3142">signal_completion</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">• 显式触发任务向下一看板列流转</text>
          <text x="12" y="88" font-size="11" fill="#2d3142" fill-opacity="0.7">• 附带执行摘要与 Handoff Notes 说明</text>
          <text x="12" y="106" font-size="11" fill="#2d3142" fill-opacity="0.7">• 确保每个阶段的输出都经由门禁检验</text>
        </g>
      </g>
    </svg>
