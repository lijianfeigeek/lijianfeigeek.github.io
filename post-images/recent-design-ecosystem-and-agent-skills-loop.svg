<svg width="960" height="540" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="rd-loop-title rd-loop-desc">
  <title id="rd-loop-title">Recent Design 商业自洽与 Agent 生态增强飞轮</title>
  <desc id="rd-loop-desc">展示从全球多模态策展、全栈工程逆向透视、AI Agent Skills 分发，到高溢价原生变现与顶级极客社群黏性的闭环正向循环。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .hub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
    .hub-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .hub-metric { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #2563eb; }
    .step-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; fill: #2563eb; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .node-bullet { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    .loop-arrow { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#fafafa"/>
  <rect x="24" y="16" width="912" height="508" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(48, 42)">
    <text class="title" x="0" y="0">Recent Design 商业自洽与 Agent 生态增强飞轮</text>
    <text class="subtitle" x="0" y="20">从视觉审美策展、工程逆向透视，到 AI Agent 技能分发与原生高溢价变现的自愈闭环</text>
  </g>

  <!-- Circular Dashed Track Behind -->
  <circle cx="480" cy="285" r="185" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Center Hub -->
  <g transform="translate(365, 225)">
    <rect width="230" height="120" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
    <g transform="translate(16, 26)">
      <text class="hub-title" x="0" y="0">Recent Design 枢纽引擎</text>
      <text class="hub-sub" x="0" y="20">高品味设计与工程数字资产中枢</text>
      <text class="hub-metric" x="0" y="42">3.15 万+ 核心极客与开发者</text>
      <text class="hub-sub" x="0" y="60">Web • Video • App • Agent Skills</text>
    </g>
  </g>

  <!-- Node 1: Top (12 o'clock) -->
  <g transform="translate(355, 78)">
    <rect width="250" height="84" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="step-tag" x="0" y="0">STEP 01: 策展源头</text>
      <text class="node-title" x="0" y="16">全球先锋设计多模态策展</text>
      <text class="node-desc" x="0" y="32">打破单张截图局限，捕获视频微动效</text>
      <text class="node-bullet" x="0" y="47">• 聚合 X、Instagram、独立产品与官网</text>
    </g>
  </g>

  <!-- Node 2: Right-Top (2:30 o'clock) -->
  <g transform="translate(680, 160)">
    <rect width="230" height="84" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="step-tag" fill="#15803d" x="0" y="0">STEP 02: 技术沉淀</text>
      <text class="node-title" x="0" y="16">全栈技术指纹深度逆向</text>
      <text class="node-desc" x="0" y="32">透视底层实现机制与框架依赖</text>
      <text class="node-bullet" x="0" y="47">• 嗅探 React / Tailwind / Lenis / Three.js</text>
    </g>
  </g>

  <!-- Node 3: Right-Bottom (5 o'clock) -->
  <g transform="translate(680, 340)">
    <rect width="230" height="96" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="step-tag" fill="#7e22ce" x="0" y="0">STEP 03: 智能体落地 (核心突破)</text>
      <text class="node-title" x="0" y="16">AI Agent Skills 技能分发</text>
      <text class="node-desc" x="0" y="32">将高标准审美封装为 Agent 技能标准</text>
      <text class="node-bullet" x="0" y="47">• Claude Code / Cursor 一键安装</text>
      <text class="node-bullet" x="0" y="60">• canvas-design / quieter / critique 规范</text>
    </g>
  </g>

  <!-- Node 4: Left-Bottom (7:30 o'clock) -->
  <g transform="translate(50, 340)">
    <rect width="230" height="96" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="step-tag" fill="#c2410c" x="0" y="0">STEP 04: 商业变现</text>
      <text class="node-title" x="0" y="16">高客单原生商业化闭环</text>
      <text class="node-desc" x="0" y="32">拒绝廉价广告，打造原生生态变现</text>
      <text class="node-bullet" x="0" y="47">• Mobbin MCP / Framer (RECENT25) 合作</text>
      <text class="node-bullet" x="0" y="60">• 高薪 Design Engineer 垂直招聘撮合</text>
    </g>
  </g>

  <!-- Node 5: Left-Top (10 o'clock) -->
  <g transform="translate(50, 160)">
    <rect width="230" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="step-tag" fill="#334155" x="0" y="0">STEP 05: 社群飞轮</text>
      <text class="node-title" x="0" y="16">顶尖极客与创作者强黏性</text>
      <text class="node-desc" x="0" y="32">高信噪比体验吸引全球顶级开发者</text>
      <text class="node-bullet" x="0" y="47">• 创作者自愿主动投稿，飞轮持续加速</text>
    </g>
  </g>

  <!-- Flow Direction Arrows -->
  <path d="M 605 120 C 650 130, 670 145, 680 165" class="loop-arrow" marker-end="url(#arrowhead)"/>
  <path d="M 795 244 C 795 270, 795 305, 795 338" class="loop-arrow"/>
  <path d="M 680 390 C 580 445, 380 445, 280 390" class="loop-arrow"/>
  <path d="M 165 340 C 165 305, 165 270, 165 244" class="loop-arrow"/>
  <path d="M 280 175 C 300 145, 325 130, 355 120" class="loop-arrow"/>

  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="4" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
