<svg width="960" height="270" viewBox="0 0 960 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reverse-skill-on-demand-bootstrap-flow-title reverse-skill-on-demand-bootstrap-flow-desc">
  <title id="reverse-skill-on-demand-bootstrap-flow-title">声明式按需自举与跨平台工具适配流程</title>
  <desc id="reverse-skill-on-demand-bootstrap-flow-desc">工具不存在时校验清单，自动执行安装并刷新 tool-index 绝对路径</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="270" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1: Agent enters skill -->
  <g transform="translate(24, 40)">
    <rect width="180" height="190" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="28" class="label-title">1. Skill 依赖检索</text>
    <line x1="14" y1="42" x2="166" y2="42" stroke="#f3f4f6" stroke-width="1"/>
    <text x="14" y="66" class="text-code">• Agent 进入目标 Skill</text>
    <text x="14" y="86" class="text-code">• 读取 tool-index.md</text>
    <text x="14" y="106" class="text-code">• 检查二进制就绪状态</text>
    
    <g transform="translate(14, 126)">
      <rect width="152" height="48" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="8" y="20" class="text-code" font-weight="600">检查: jadx / frida</text>
      <text x="8" y="36" class="text-code" fill="#6b7280">本地是否存在可用？</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 204 100 L 250 80" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="248,76 254,80 249,84" fill="#10b981"/>

  <path d="M 204 160 L 250 180" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="248,176 254,180 249,184" fill="#bf4520"/>

  <!-- Direct Exec Branch (Exists = Yes) -->
  <g transform="translate(254, 40)">
    <rect width="682" height="66" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="16" y="26" class="label-title" fill="#065f46">存在并就绪：直接调用真实绝对路径执行</text>
    <text x="16" y="48" class="text-code" fill="#047857">严格仅信任 tool-index.md 中的物理路径，告别 which 盲猜与 PATH 污染注入</text>
  </g>

  <!-- Missing Branch (Exists = No) -->
  <g transform="translate(254, 126)">
    <rect width="210" height="104" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="12" y="24" class="label-title" fill="#9a3412">缺失：清单合规核验</text>
    <text x="12" y="44" class="text-code" fill="#7c2d12">查询 bootstrap-manifest</text>
    <text x="12" y="64" class="text-code" fill="#9a3412">• 严禁 curl | bash 盲下</text>
    <text x="12" y="84" class="text-code" fill="#9a3412">• 固定版本与哈希固化</text>
  </g>

  <!-- Split to AutoInstall / ManualNotice -->
  <path d="M 464 150 L 510 145" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="508,141 514,145 508,148" fill="#10b981"/>

  <path d="M 464 195 L 510 205" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="508,202 514,205 508,208" fill="#6b7280"/>

  <g transform="translate(514, 126)">
    <rect width="220" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="10" y="20" class="label-title" font-size="12" fill="#166534">开源工具: 原生脚本自举</text>
    <text x="10" y="36" class="text-code" fill="#15803d">自动拉取二进制 / pip 安装</text>
  </g>

  <g transform="translate(514, 182)">
    <rect width="220" height="48" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="10" y="20" class="label-title" font-size="12" fill="#4b5563">商业许可证件: 合规引导</text>
    <text x="10" y="36" class="text-code" fill="#6b7280">输出官方授权引导，拒绝规避</text>
  </g>

  <!-- Connect to Refresh -->
  <path d="M 734 150 L 760 150" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="760,147 766,150 760,153" fill="#10b981"/>

  <g transform="translate(766, 126)">
    <rect width="170" height="104" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="12" y="24" class="label-title" fill="#065f46">刷新 tool-index</text>
    <text x="12" y="44" class="text-code" fill="#047857">refresh-tool-index</text>
    <text x="12" y="64" class="text-code" fill="#059669">更新本地路径映射</text>
    <text x="12" y="86" class="text-code" font-weight="600" fill="#065f46">重新进入执行流程</text>
  </g>
</svg>