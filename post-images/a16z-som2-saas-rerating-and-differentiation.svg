<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a16z-som2-saas-rerating-and-differentiation-title a16z-som2-saas-rerating-and-differentiation-desc">
  <title id="a16z-som2-saas-rerating-and-differentiation-title">企业软件自证之战：SaaS 估值分化与商业模式重构体系</title>
  <desc id="a16z-som2-saas-rerating-and-differentiation-desc">拆解网络安全、垂直行业SaaS与通用横向工具在面对大模型冲击下的分化表现与基于结果的新计费范式</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #047857; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">SaaS 的“自证阶段”：打破 SaaSpocalypse 虚假叙事的估值分化体系</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">不是软件末日，而是从烧钱买量走向从容造血：75% 企业实现稳健盈利，收费模式转向基于产出与算力消耗</text>

  <!-- Segment 1: Cyber Security -->
  <g transform="translate(40, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#d1fae5"/>
    <text x="135" y="22" class="badge-ok" text-anchor="middle">1. 网络安全 (Cybersecurity)</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title">典型代表：CrowdStrike / Palo Alto</text>
      <text x="0" y="32" class="text-sub">• 企业的绝对防御刚需，零容错率门槛</text>
      <text x="0" y="50" class="text-sub">• AI 攻防对抗升级反向推动安全预算井喷</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="88" class="badge-ok">估值表现：享最高市场溢价</text>
      <text x="0" y="106" class="text-sub">• 客户净留存率 (NRR) 长期保持 120%+</text>
      <text x="0" y="124" class="text-sub">• 几乎不受底层大模型版本迭代侵蚀</text>
      <text x="0" y="142" class="badge-ok">护城河：高昂系统级切换成本</text>
    </g>
  </g>

  <!-- Segment 2: Vertical SaaS -->
  <g transform="translate(345, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">2. 垂直行业 SaaS (Vertical)</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title">典型代表：Veeva / Procore / Toast</text>
      <text x="0" y="32" class="text-sub">• 深度嵌合特定行业排他性业务流程</text>
      <text x="0" y="50" class="text-sub">• 沉淀高价值私有动态行业数据</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="88" class="card-title" fill="#0284c7">估值表现：表现坚挺，客户流失极低</text>
      <text x="0" y="106" class="text-sub">• 通用大模型缺乏特定行业知识上下文</text>
      <text x="0" y="124" class="text-sub">• 企业反而加速将 AI 嵌入自有流程中</text>
      <text x="0" y="142" class="card-title">护城河：业务数据状态不可替代</text>
    </g>
  </g>

  <!-- Segment 3: Horizontal SaaS (Focal Coral) -->
  <g transform="translate(650, 80)">
    <rect width="270" height="235" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#ffedd5"/>
    <text x="135" y="22" class="badge-coral" text-anchor="middle">3. 通用横向工具 (Horizontal)</text>
    <g transform="translate(16, 48)">
      <text x="0" y="14" class="card-title">典型代表：泛办公 / 简单协同 / 浅包装</text>
      <text x="0" y="32" class="text-sub">• 极易被底层大模型原生多模态泛化替代</text>
      <text x="0" y="50" class="text-sub">• 传统人头席位制 (Per-seat) 遭遇增长天花板</text>
      <line x1="0" y1="68" x2="238" y2="68" stroke="#fed7aa" stroke-width="1"/>
      <text x="0" y="88" class="badge-coral">估值表现：估值大幅压缩，自证造血</text>
      <text x="0" y="106" class="text-sub">• EV/NTM 估值从 25x 压缩至 5~8x</text>
      <text x="0" y="124" class="text-sub">• 全面转向基于产出 (Outcome-based) 计费</text>
      <text x="0" y="142" class="badge-coral">考验：被迫加速构建自主 Agent 网络</text>
    </g>
  </g>
</svg>