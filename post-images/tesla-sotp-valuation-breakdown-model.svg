<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="tsla-sotp-title tsla-sotp-desc">
  <title id="tsla-sotp-title">2030 年特斯拉 SOTP 分部估值构成与现值映射模型</title>
  <desc id="tsla-sotp-desc">展示特斯拉五大业务板块在2030年的每股价值构成（总计528美元/股），以及按照12%折现率倒推至2026年当下324美元的公允价值模型。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .val-large { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">2030 年特斯拉 SOTP 分部估值模型 (每股 528 美元)</text>
    <text class="subtitle" x="0" y="20">五大业务分拆定价：Robotaxi 贡献近八成市值，按 12% 年化折现率倒推当前内在公允价值为 324 美元/股</text>
  </g>

  <!-- Left: SOTP Stack (7 items) -->
  <g transform="translate(48, 86)">
    <rect width="520" height="390" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="16" y="24">2030 年各板块每股价值拆解 (基准情境 Base Case)</text>

    <!-- Item 1: Robotaxi (Focal Point) -->
    <g transform="translate(16, 38)">
      <rect width="488" height="66" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
      <g transform="translate(14, 18)">
        <text class="card-title" fill="#be123c" x="0" y="0">1. Robotaxi 无人出行网络 (决胜盘)</text>
        <text class="card-body" x="0" y="16">150 万辆运营车队 · 年收 996 亿美元 · 净利 375 亿 · 40x P/E</text>
        <text class="val-large" fill="#e11d48" x="350" y="14">412 美元</text>
        <text class="mono" fill="#be123c" x="350" y="32">占比: 76.9%</text>
      </g>
    </g>

    <!-- Item 2: FSD -->
    <g transform="translate(16, 110)">
      <rect width="488" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">2. 乘用车 FSD 订阅生态 (纯 SaaS)</text>
        <text class="card-body" x="0" y="15">640 万订阅户 · 99 美元/月 · 70% 净利率 · 30x P/E</text>
        <text class="val-large" fill="#1e293b" x="350" y="8">40 美元</text>
        <text class="mono" fill="#64748b" x="350" y="22">占比: 7.6%</text>
      </g>
    </g>

    <!-- Item 3: Auto Sales -->
    <g transform="translate(16, 162)">
      <rect width="488" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">3. 传统汽车制造销售 (硬件钣金)</text>
        <text class="card-body" x="0" y="15">290 万辆交付 · ASP 3.8 万美元 · 7.5% 净利率 · 16x P/E</text>
        <text class="val-large" fill="#1e293b" x="350" y="8">36 美元</text>
        <text class="mono" fill="#64748b" x="350" y="22">占比: 6.8%</text>
      </g>
    </g>

    <!-- Item 4: Megapack Energy -->
    <g transform="translate(16, 214)">
      <rect width="488" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">4. Megapack 能源存储与光伏</text>
        <text class="card-body" x="0" y="15">130 GWh 部署 · 190 美元/kWh · 15% 净利率 · 20x P/E</text>
        <text class="val-large" fill="#1e293b" x="350" y="8">17 美元</text>
        <text class="mono" fill="#64748b" x="350" y="22">占比: 3.2%</text>
      </g>
    </g>

    <!-- Item 5: Semi Truck -->
    <g transform="translate(16, 266)">
      <rect width="488" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">5. Semi 重卡软硬件综合体</text>
        <text class="card-body" x="0" y="15">3.5 万辆交付 + 1.8 万辆车队级 FSD (10 万美元/年费)</text>
        <text class="val-large" fill="#1e293b" x="350" y="8">14 美元</text>
        <text class="mono" fill="#64748b" x="350" y="22">占比: 2.6%</text>
      </g>
    </g>

    <!-- Item 6 &amp; 7: Cash &amp; Optimus -->
    <g transform="translate(16, 318)">
      <rect width="488" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">6. 企业净现金留存: 9 美元 (1.7%)</text>
        <text class="card-title" fill="#64748b" x="240" y="0">7. Optimus 机器人: 0 美元 (看涨期权)</text>
        <text class="card-body" x="0" y="18">资产负债表 350 亿美元净现金</text>
        <text class="card-body" x="240" y="18">商业闭环未成前基准模型不予计提估值</text>
      </g>
    </g>
  </g>

  <!-- Right: Value Synthesis &amp; Discounting -->
  <g transform="translate(590, 86)">
    <rect width="322" height="390" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text class="box-title" fill="#1e40af" x="18" y="24">终局定价映射当下内在价值</text>

    <!-- Total 2030 Card -->
    <g transform="translate(18, 44)">
      <rect width="286" height="110" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <g transform="translate(16, 20)">
        <text class="card-title" fill="#1e40af" x="0" y="0">2030 年基准总每股价值</text>
        <text class="val-large" fill="#1d4ed8" x="0" y="32">528 美元 / 股</text>
        <text class="card-body" x="0" y="52">对应总市值约 19,200 亿美元 (1.92 万亿)</text>
        <text class="mono" fill="#2563eb" x="0" y="70">EV/EBITDA ≈ 24.5x</text>
      </g>
    </g>

    <!-- Discounting Bridge -->
    <path d="M 161 154 L 161 184" stroke="#bf4520" stroke-width="2"/>
    <polygon points="161,184 157,178 165,178" fill="#bf4520"/>
    <g transform="translate(18, 190)">
      <rect width="286" height="50" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">折现机制：成长科技股 12% WACC</text>
        <text class="mono" fill="#ea580c" x="0" y="16">折现周期: 4.25 年 (从 2030 倒推至 2026)</text>
      </g>
    </g>

    <path d="M 161 240 L 161 270" stroke="#bf4520" stroke-width="2"/>
    <polygon points="161,270 157,264 165,264" fill="#bf4520"/>

    <!-- Present Value Card (Current Fair Value) -->
    <g transform="translate(18, 276)">
      <rect width="286" height="98" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(16, 20)">
        <text class="card-title" fill="#14532d" x="0" y="0">当前合理内在公允价值 (2026)</text>
        <text class="val-large" fill="#15803d" x="0" y="30">324 美元 / 股</text>
        <text class="card-body" fill="#166534" x="0" y="48">对比现价 356 美元：市场已透支 2030 基准</text>
        <text class="mono" fill="#14532d" x="0" y="64">VERDICT: 当前无安全边际，建议限价低吸</text>
      </g>
    </g>
  </g>
</svg>