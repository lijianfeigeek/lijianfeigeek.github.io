<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futu-tiger-options-market-maker-gamma-squeeze-title futu-tiger-options-market-maker-gamma-squeeze-desc">
  <title id="futu-tiger-options-market-maker-gamma-squeeze-title">做市商常态期权模型 vs 极端黑天鹅负伽马（Negative Gamma）反噬</title>
  <desc id="futu-tiger-options-market-maker-gamma-squeeze-desc">对比常规市场下卖出流动性赚取Theta衰减，与监管利空跳空低开下Gamma暴增无法对冲的巨额做市穿仓亏损</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="300" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">做市商的底层盈利模型与黑天鹅负伽马（Negative Gamma）反噬机制</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">为什么顶级量化做市商急了？深度虚值期权由彩票瞬间蜕变实值，跳空低开下动态对冲彻底失效</text>

  <!-- Left: Normal Market -->
  <g transform="translate(40, 80)">
    <rect width="420" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="420" height="32" rx="8" fill="#f1f5f9"/>
    <text x="210" y="21" class="card-title" text-anchor="middle">常态期权做市模型：卖出流动性与收割时间价值</text>
    <g transform="translate(20, 46)">
      <text x="0" y="14" class="text-bold">1. 散户/投机客买入深度虚值 Put</text>
      <text x="0" y="30" class="text-sub">合约到期日不足 30 天，Delta 趋近于 0，权利金极其低廉</text>
      <text x="0" y="56" class="text-bold">2. 做市商卖出 Put 并赚取买卖价差 (Bid-Ask Spread)</text>
      <text x="0" y="72" class="text-sub">常年平稳赚取 Theta 时间价值衰减，借助动态微量卖空正股剥离 Delta</text>
      <text x="0" y="98" class="text-bold">3. 绝大多数“彩票”合约最终归零到期</text>
      <text x="0" y="114" class="text-sub">做市巨头稳坐赌场庄家位置，被视为全市场最聪明的量化资金</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 470 175 L 500 175" stroke="#bf4520" stroke-width="2" fill="none"/>

  <!-- Right: Black Swan (Focal Coral) -->
  <g transform="translate(500, 80)">
    <rect width="420" height="190" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="420" height="32" rx="8" fill="#ffedd5"/>
    <text x="210" y="21" class="badge-coral" text-anchor="middle">监管黑天鹅突袭：负伽马爆炸与单向穿仓巨亏</text>
    <g transform="translate(20, 46)">
      <text x="0" y="14" class="badge-coral">1. 盘前监管利空突发，正股断崖暴跌近 30%</text>
      <text x="0" y="30" class="text-sub">行权价被瞬间垂直击穿，极度虚值合约跃变为深度实值</text>
      <text x="0" y="56" class="text-bold">2. Gamma 极速飙升，Delta 在跳空低开中突变至 -1.0</text>
      <text x="0" y="72" class="text-sub">盘前流动性完全枯竭，做市商根本无法挂单抛售底层股票完成对冲</text>
      <text x="0" y="98" class="badge-coral">3. 廉价彩票单日升值数百倍，做市商裸露巨额空头亏损</text>
      <text x="0" y="114" class="text-sub">数千万至上亿美元现金净流出，迫使做市巨头直奔联邦法院申请冻结令</text>
    </g>
  </g>
</svg>