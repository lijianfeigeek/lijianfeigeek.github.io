<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="nomura-japan-meiji-functional-dairy-flywheel-title nomura-japan-meiji-functional-dairy-flywheel-desc">
  <title id="nomura-japan-meiji-functional-dairy-flywheel-title">明治乳业靶向益生菌功能化升级飞轮</title>
  <desc id="nomura-japan-meiji-functional-dairy-flywheel-desc">展示明治乳业从基础风味酸奶向靶向医疗级机能益生菌矩阵演进，实现单价提升与利润率大逆转的全过程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">食品工业教科书：明治（MEIJI）功能性酸奶阶梯式突围与溢价护城河</text>
    <text x="896" y="16" text-anchor="end" class="tag">TARGETED PROBIOTICS FLYWHEEL</text>
  </g>

  <!-- 4 Step-ladder Horizontal Cards -->
  <!-- Step 1: LB81 -->
  <g transform="translate(32, 60)">
    <rect width="210" height="230" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="210" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="23" class="title">1. LB81 经典原点</text>
    <text x="198" y="23" text-anchor="end" class="tag">1990s</text>

    <g transform="translate(12, 50)">
      <text class="title" style="font-size:12px;" x="0" y="0">基础肠道调节风味</text>
      <text class="desc" x="0" y="20">• 传统风味酸奶竞争白热化</text>
      <text class="desc" x="0" y="38">• 陷入拼比浓稠度与价格战</text>
      <text class="desc" x="0" y="56">• 原奶成本上涨侵蚀毛利</text>
      <text class="tag" x="0" y="86">营业利润率仅约 4%</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 242 175 L 262 175" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Step 2: LG21 -->
  <g transform="translate(262, 60)">
    <rect width="210" height="230" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="210" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="23" class="title">2. 益比奥 LG21</text>
    <text x="198" y="23" text-anchor="end" class="tag">2000</text>

    <g transform="translate(12, 50)">
      <text class="title" style="font-size:12px;" x="0" y="0">锁定护胃新机能</text>
      <text class="desc" x="0" y="20">• 临床证实有效抑制幽门螺杆菌</text>
      <text class="desc" x="0" y="38">• 形成胃黏膜修复心智</text>
      <text class="desc" x="0" y="56">• 开创靶向医疗机能新品类</text>
      <text class="tag" x="0" y="86">产品单价上浮 30%</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 472 175 L 492 175" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Step 3: R-1 -->
  <g transform="translate(492, 60)">
    <rect width="210" height="230" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="210" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="210" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="210" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="12" y="23" class="title">3. 1073R-1 乳酸菌</text>
    <text x="198" y="23" text-anchor="end" class="tag">2009</text>

    <g transform="translate(12, 50)">
      <text class="title" style="font-size:12px;" x="0" y="0">全民免疫防线硬通货</text>
      <text class="desc" x="0" y="20">• 靶向活化人体 NK 杀手细胞</text>
      <text class="desc" x="0" y="38">• 抵御冬季流感与老幼感染</text>
      <text class="desc" x="0" y="56">• 成为学生与银发族每日必需品</text>
      <text class="tag" x="0" y="86">国民级爆款复购</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 702 175 L 722 175" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Step 4: PA-3 (Core Accent) -->
  <g transform="translate(722, 60)">
    <rect width="206" height="230" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="206" height="36" fill="#fff5f5" rx="8" />
    <rect y="28" width="206" height="8" fill="#fff5f5" />
    <line x1="0" y1="36" x2="206" y2="36" stroke="#fed7d7" stroke-width="1" />
    <text x="12" y="23" class="coral-title">4. PA-3 降尿酸</text>
    <text x="194" y="23" text-anchor="end" class="coral-tag">2015</text>

    <g transform="translate(12, 50)">
      <text class="coral-title" style="font-size:12px;" x="0" y="0">瞄准高尿酸痛风痛点</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="20">• 靶向分解肠道摄入的嘌呤</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="38">• 直击中年男性代谢综合征</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="56">• 彻底跳出乳制品传统认知框</text>
      <text class="coral-tag" x="0" y="86">处方级信赖心智壁垒</text>
    </g>
  </g>

  <!-- Bottom Result Banner -->
  <g transform="translate(32, 310)">
    <rect width="896" height="80" fill="#f0fdf4" rx="8" stroke="#15803d" stroke-width="1.5" />
    <g transform="translate(20, 20)">
      <text class="green-title" style="font-size:14px;" x="0" y="0">商业闭环质变：从原奶成本受害者蜕变为高定价权霸主</text>
      <text class="desc" style="fill:#14532d;" x="0" y="22">• 摆脱风味内卷，凭借临床靶向机能使产品单价成功提高 30% ~ 50%</text>
      <text class="green-tag" style="font-size:11px;" x="0" y="42">发酵乳核心业务营业利润率由 1990 年代的 4% 逆势跃升突破峰值 14%+，跑赢通缩三十年</text>
    </g>
  </g>
</svg>