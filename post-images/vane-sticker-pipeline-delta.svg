<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="532" viewBox="0 0 920 532" role="img" aria-labelledby="vspd-title vspd-desc" id="vane-sticker-pipeline-delta-root" data-diagram="architecture-delta">
  <title id="vspd-title">动态表情包导出管线架构演进对比（export_pack.py vs export_frames.py）</title>
  <desc id="vspd-desc">对比 vane-portrait-gif-stickers 中旧版图集数学摇摆导出管线（export_pack.py）与新版连续动作关键帧导出管线（export_frames.py）的组件变更、连接重连与架构清册。</desc>
  <defs>
    <style>
      #vane-sticker-pipeline-delta-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="vspd-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.26"/>
    </pattern>
    <marker id="vspd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="vspd-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="vspd-arrow-removed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="920" height="532" fill="#f8fafc"/>
  <rect width="920" height="532" fill="url(#vspd-dots)"/>

  <!-- Header -->
  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">Sticker Animation Pipeline Delta: Fake Motion vs Real Keyframes</text>
  <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">SCRIPTS/EXPORT_PACK.PY (410 LOC) → SCRIPTS/EXPORT_FRAMES.PY (78 LOC) · VANE-PORTRAIT-GIF-STICKERS</text>

  <!-- BEFORE PANEL -->
  <g data-snapshot="before" data-grid="288 380 4" transform="translate(24, 72)">
    <rect x="0" y="0" width="288" height="392" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#64748b">BEFORE · LEGACY (EXPORT_PACK.PY)</text>
    <line x1="16" y1="34" x2="272" y2="34" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Connectors drawn first -->
    <path data-kind="relationship" data-object-id="rel-atlas-cut" data-status="changed" data-signature="single-pose-crop" data-from="input-sheet" data-to="bbox-crop"
          d="M 144 104 L 144 136" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#vspd-arrow)"/>
    <path data-kind="relationship" data-object-id="rel-math-synth" data-status="removed" data-signature="24tick-sin-cos-shear" data-from="bbox-crop" data-to="math-motion"
          d="M 144 196 L 144 228" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#vspd-arrow-removed)"/>
    <path data-kind="relationship" data-object-id="rel-pack-out" data-status="changed" data-signature="gif-255-plus-mp4" data-from="math-motion" data-to="gif-pack"
          d="M 144 292 L 144 320" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#vspd-arrow)"/>

    <!-- Component 1: input-sheet -->
    <g data-kind="component" data-object-id="input-sheet" data-status="changed" data-signature="static-16cell-atlas" transform="translate(20, 48)">
      <rect data-role="bounds" x="0" y="0" width="248" height="56" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <rect x="200" y="8" width="40" height="16" rx="2" fill="#e2e8f0"/>
      <text x="220" y="19" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#1e293b">Δ MOD</text>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">单张 16 格静态姿态图集</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">atlas.png · 每格仅 1 个静态动作</text>
    </g>

    <!-- Component 2: bbox-crop -->
    <g data-kind="component" data-object-id="bbox-crop" data-status="changed" data-signature="bfs-dust-clean-bbox-crop" transform="translate(20, 136)">
      <rect data-role="bounds" x="0" y="0" width="248" height="60" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <rect x="200" y="8" width="40" height="16" rx="2" fill="#e2e8f0"/>
      <text x="220" y="19" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#1e293b">Δ MOD</text>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">BFS 连通域去噪 + BBox 裁剪</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">alpha.getbbox() 紧裁 · 丢弃基准锚位</text>
    </g>

    <!-- Component 3: math-motion (REMOVED) -->
    <g data-kind="component" data-object-id="math-motion" data-status="removed" data-signature="16-math-motions-15-icons" transform="translate(20, 228)">
      <rect data-role="bounds" x="0" y="0" width="248" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
      <rect x="196" y="8" width="44" height="16" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="218" y="19" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#64748b">− DEL</text>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#64748b">数学函数伪造全身摇摆与贴花</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">16 种 sin/cos + 6px 切片 shear</text>
      <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">+ 15 种像素 ICONS · 人物关节静止</text>
    </g>

    <!-- Component 4: gif-pack -->
    <g data-kind="component" data-object-id="gif-pack" data-status="unchanged" data-signature="shared-palette-gif-zip" transform="translate(20, 320)">
      <rect data-role="bounds" x="0" y="0" width="248" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">320×320 透明 GIF + 预览 + ZIP</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">24 帧 × 80ms · 透明索引 255 封装</text>
    </g>
  </g>

  <!-- CENTER CHANGES LEDGER -->
  <g transform="translate(328, 72)">
    <rect x="0" y="0" width="264" height="392" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#475569">CHANGES LEDGER</text>
    <line x1="16" y1="34" x2="248" y2="34" stroke="#e2e8f0" stroke-width="1"/>

    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="232" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text data-change="CHANGED" data-target="input-sheet" x="12" y="18" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#1e293b">CHANGED input-sheet</text>
      <text x="12" y="34" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">单格静态姿 → 按动作拆分的连续</text>
      <text x="12" y="49" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">关键帧序列图集（frame-manifest）</text>
    </g>

    <g transform="translate(16, 120)">
      <rect x="0" y="0" width="232" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text data-change="CHANGED" data-target="bbox-crop" x="12" y="18" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#1e293b">CHANGED bbox-crop</text>
      <text x="12" y="34" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">取消 content bbox 裁切，强制固定</text>
      <text x="12" y="49" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">网格基准坐标防止角色左右跳动</text>
    </g>

    <g transform="translate(16, 192)">
      <rect x="0" y="0" width="232" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text data-change="REMOVED" data-target="math-motion" x="12" y="18" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#64748b">REMOVED math-motion</text>
      <text x="12" y="34" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">废弃纯代码平移/缩放/切变假动作，</text>
      <text x="12" y="49" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">明令禁止用旧脚本伪造人物运动</text>
    </g>

    <g transform="translate(16, 260)">
      <rect x="0" y="0" width="232" height="60" rx="4" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
      <text data-change="ADDED" data-target="keyframe-seq" x="12" y="18" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#bf4520">ADDED keyframe-seq</text>
      <text x="12" y="34" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#1e293b">新增真实关键帧序列 + 非均匀停留</text>
      <text x="12" y="49" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#bf4520">durations_ms + --pixel-art 最近邻</text>
    </g>

    <g transform="translate(16, 332)">
      <rect x="0" y="0" width="232" height="44" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text data-change="REWIRED" data-target="rel-seq-out" x="12" y="17" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#2e5aa8">REWIRED pipeline-edge</text>
      <text x="12" y="33" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">帧序直连 255 色共享调色板 GIF 封装</text>
    </g>
  </g>

  <!-- AFTER PANEL -->
  <g data-snapshot="after" data-grid="288 380 4" transform="translate(608, 72)">
    <rect x="0" y="0" width="288" height="392" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="16" y="24" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#bf4520">AFTER · CURRENT (EXPORT_FRAMES.PY)</text>
    <line x1="16" y1="34" x2="272" y2="34" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Connectors drawn first -->
    <path data-kind="relationship" data-object-id="rel-atlas-cut" data-status="changed" data-signature="multi-frame-sprite-sheet" data-from="input-sheet" data-to="bbox-crop"
          d="M 144 104 L 144 136" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#vspd-arrow)"/>
    <path data-kind="relationship" data-object-id="rel-seq-anchor" data-status="added" data-signature="grid-cell-alignment" data-from="bbox-crop" data-to="keyframe-seq"
          d="M 144 196 L 144 228" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#vspd-arrow-accent)"/>
    <path data-kind="relationship" data-object-id="rel-seq-out" data-status="rewired" data-signature="keyframe-to-palette" data-from="keyframe-seq" data-to="gif-pack"
          d="M 144 292 L 144 320" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#vspd-arrow-accent)"/>

    <!-- Component 1: input-sheet -->
    <g data-kind="component" data-object-id="input-sheet" data-status="changed" data-signature="per-action-frame-sheet" transform="translate(20, 48)">
      <rect data-role="bounds" x="0" y="0" width="248" height="56" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <rect x="200" y="8" width="40" height="16" rx="2" fill="#e2e8f0"/>
      <text x="220" y="19" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#1e293b">Δ MOD</text>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">独立动作连续帧图集 / 视频帧</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">真实关节/表情/道具随时间发生演变</text>
    </g>

    <!-- Component 2: bbox-crop -->
    <g data-kind="component" data-object-id="bbox-crop" data-status="changed" data-signature="fixed-grid-anchor-no-bbox" transform="translate(20, 136)">
      <rect data-role="bounds" x="0" y="0" width="248" height="60" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <rect x="200" y="8" width="40" height="16" rx="2" fill="#e2e8f0"/>
      <text x="220" y="19" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#1e293b">Δ MOD</text>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">等格均分裁切 + 躯干锚定对齐</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">round(col*W/cols) 禁止按 bbox 乱缩放</text>
    </g>

    <!-- Component 3: keyframe-seq (ADDED FOCAL) -->
    <g data-kind="component" data-object-id="keyframe-seq" data-status="added" data-signature="manifest-order-durations-pixelart" transform="translate(20, 228)">
      <rect data-role="bounds" x="0" y="0" width="248" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
      <rect x="196" y="8" width="44" height="16" rx="2" fill="#bf4520"/>
      <text x="218" y="19" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#ffffff">+ NEW</text>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">往返循环帧序与非均匀节奏控制</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">frames: [[0,0]..[3,0],[2,0],[1,0]]</text>
      <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">durations_ms + --pixel-art NEAREST</text>
    </g>

    <!-- Component 4: gif-pack -->
    <g data-kind="component" data-object-id="gif-pack" data-status="unchanged" data-signature="shared-palette-gif-zip" transform="translate(20, 320)">
      <rect data-role="bounds" x="0" y="0" width="248" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">320×320 透明 GIF + 网页 + ZIP</text>
      <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">255 色全局量化 · n_frames &gt;= 2 硬校验</text>
    </g>
  </g>

  <!-- Legend -->
  <line x1="24" y1="484" x2="896" y2="484" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(24, 504)">
    <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="72" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="94" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">+ 新增核心机制（真实帧序编排与像素网格保护）</text>
    <rect x="380" y="-8" width="14" height="14" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="402" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#64748b">− 已废弃路径（数学平移伪造运动）</text>
    <rect x="632" y="-8" width="14" height="14" rx="2" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
    <text x="654" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">Δ 语义变更节点 / 保留封装协议</text>
  </g>
</svg>
