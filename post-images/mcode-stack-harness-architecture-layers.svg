<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Outer Container -->
  <rect x="4" y="4" width="912" height="572" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(32, 24)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">MiniMax MCode Stack 驾驭工程（Harness Engineering）分层全景</text>
    <text x="0" y="38" font-size="12" fill="#64748b">从工程师工作流到确定性审查仲裁、上下文税收治理与底层支架运行时解耦</text>
  </g>

  <!-- LAYER 4: 业务交付与专家工作流层 -->
  <g transform="translate(24, 75)">
    <!-- Layer Background -->
    <rect x="0" y="0" width="872" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="0" y="0" width="140" height="24" rx="4" fill="#f1f5f9"/>
    <text x="10" y="16" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.03em">L4 · 专家工作流交付层</text>

    <!-- Card 1: Ronny Stack -->
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="195" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Ronny 架构控制栈</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">subagent-split 拆分核验</text>
      <text x="12" y="48" font-size="10" fill="#64748b">evidence-first 证据验收</text>
    </g>

    <!-- Card 2: Jiachen Stack -->
    <g transform="translate(227, 32)">
      <rect x="0" y="0" width="195" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Jiachen CI 评审栈</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">lifting-loops 跳出循环</text>
      <text x="12" y="48" font-size="10" fill="#64748b">pr-description 自动拟写</text>
    </g>

    <!-- Card 3: Youfang Stack -->
    <g transform="translate(438, 32)">
      <rect x="0" y="0" width="195" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Youfang 动效演练栈</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">magic-move-deck 神奇移动</text>
      <text x="12" y="48" font-size="10" fill="#64748b">4 种出版风格离线 HTML</text>
    </g>

    <!-- Card 4: req-tpm Stack -->
    <g transform="translate(649, 32)">
      <rect x="0" y="0" width="207" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">req-tpm 需求管控栈</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">飞书文档 + Meegle 双同步</text>
      <text x="12" y="48" font-size="10" fill="#64748b">停滞置顶，有证据方关闭</text>
    </g>
  </g>

  <!-- LAYER 3: 确定性代码审查与仲裁层 -->
  <g transform="translate(24, 190)">
    <!-- Layer Background -->
    <rect x="0" y="0" width="872" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="0" y="0" width="170" height="24" rx="4" fill="#eff6ff"/>
    <text x="10" y="16" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="0.03em">L3 · 确定性审查与仲裁层 (MCode Review)</text>

    <!-- Card 1: 5-Lens Triage -->
    <g transform="translate(16, 34)">
      <rect x="0" y="0" width="195" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">五维透镜并行探查</text>
      <text x="12" y="36" font-size="10" fill="#475569">行为契约 · 安全权限 · 交叉波及</text>
      <text x="12" y="50" font-size="10" fill="#64748b">数据流转 · 逻辑重复检测</text>
    </g>

    <!-- Card 2: Two-Pass Refutation -->
    <g transform="translate(227, 34)">
      <rect x="0" y="0" width="195" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0284c7">双阶段独立证伪机制</text>
      <text x="12" y="36" font-size="10" fill="#475569">阶段1：独立上下文初筛发现</text>
      <text x="12" y="50" font-size="10" fill="#0284c7">阶段2：Refutation 强制驳倒验真</text>
    </g>

    <!-- Card 3: Deterministic Verdict (FOCAL) -->
    <g transform="translate(438, 34)">
      <rect x="0" y="0" width="195" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#e11d48">脚本化裁决器 (verdict.mjs)</text>
      <text x="12" y="36" font-size="10" fill="#9f1239">非模型打分！严守 P0~P3 证据链</text>
      <text x="12" y="50" font-size="10" fill="#be123c">连续 3 轮阻断自动升级人工</text>
    </g>

    <!-- Card 4: Author Quiz -->
    <g transform="translate(649, 34)">
      <rect x="0" y="0" width="207" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">作者理解力答辩 (Quiz)</text>
      <text x="12" y="36" font-size="10" fill="#475569">针对边缘路径与失效机制出题</text>
      <text x="12" y="50" font-size="10" fill="#64748b">杜绝工程师盲目 Approve AI 代码</text>
    </g>
  </g>

  <!-- LAYER 2: 上下文预算与会话生命周期治理 -->
  <g transform="translate(24, 315)">
    <!-- Layer Background -->
    <rect x="0" y="0" width="872" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="0" y="0" width="200" height="24" rx="4" fill="#f0fdf4"/>
    <text x="10" y="16" font-size="11" font-weight="700" fill="#15803d" letter-spacing="0.03em">L2 · 上下文预算与生命周期治理 (MCode Notes)</text>

    <!-- Card 1: Prefix Cache -->
    <g transform="translate(16, 34)">
      <rect x="0" y="0" width="195" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#059669">前缀缓存守护 (Prefix Cache)</text>
      <text x="12" y="36" font-size="10" fill="#475569">静态 # Environment 置顶锁定</text>
      <text x="12" y="50" font-size="10" fill="#64748b">时间戳下沉为不可变历史日志</text>
    </g>

    <!-- Card 2: Tool Budget & PTC -->
    <g transform="translate(227, 34)">
      <rect x="0" y="0" width="195" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">工具预算与 PTC 模式</text>
      <text x="12" y="36" font-size="10" fill="#475569">先做减法 ➔ Tool Search 延迟发现</text>
      <text x="12" y="50" font-size="10" fill="#0284c7">PTC 编写短脚本调用，杜绝轮询</text>
    </g>

    <!-- Card 3: Session Handoff -->
    <g transform="translate(438, 34)">
      <rect x="0" y="0" width="195" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">工作台哲学与 Handoff Doc</text>
      <text x="12" y="36" font-size="10" fill="#475569">Context 是工作台而非仓库</text>
      <text x="12" y="50" font-size="10" fill="#64748b">关键决策提早入文件，漂移即换新</text>
    </g>

    <!-- Card 4: Long Command -->
    <g transform="translate(649, 34)">
      <rect x="0" y="0" width="207" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">长命令非阻塞解耦</text>
      <text x="12" y="36" font-size="10" fill="#475569">快命令前台，长命令后台</text>
      <text x="12" y="50" font-size="10" fill="#64748b">事件通知防轮询，避免 Cache TTL 归零</text>
    </g>
  </g>

  <!-- LAYER 1: 执行底座与支架运行时 -->
  <g transform="translate(24, 440)">
    <!-- Layer Background -->
    <rect x="0" y="0" width="872" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#f8fafc"/>
    <text x="10" y="16" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.03em">L1 · 支架工程底层运行时 (Runtime)</text>

    <!-- Card 1: Process Tree -->
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="195" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">进程生命周期管控</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">PID 状态保持、超时截断</text>
      <text x="12" y="48" font-size="10" fill="#64748b">异常退出孤儿进程自动清理</text>
    </g>

    <!-- Card 2: Net Diff Fingerprint -->
    <g transform="translate(227, 32)">
      <rect x="0" y="0" width="195" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Net Diff 差异指纹</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">按文件净变更 SHA-256 缓存</text>
      <text x="12" y="48" font-size="10" fill="#64748b">Git Rebase 零开销无需重复评审</text>
    </g>

    <!-- Card 3: Standard Plugin Spec -->
    <g transform="translate(438, 32)">
      <rect x="0" y="0" width="195" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">跨 Agent 插件通用规约</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">兼容 MiniMax Code / Claude / Codex</text>
      <text x="12" y="48" font-size="10" fill="#64748b">统一 SKILL.md 与插件市场元数据</text>
    </g>

    <!-- Card 4: Taste to Checks -->
    <g transform="translate(649, 32)">
      <rect x="0" y="0" width="207" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Taste-to-Checks 工具链</text>
      <text x="12" y="36" font-size="10.5" fill="#475569">说两次的错误直接固化为 Linter</text>
      <text x="12" y="48" font-size="10" fill="#64748b">Hook / CI 强断言替代自然语言约束</text>
    </g>
  </g>
</svg>