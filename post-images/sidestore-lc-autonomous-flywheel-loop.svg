<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="coralLoopArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="hubSpokeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="720" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="672" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0369a1" font-size="11" font-weight="700" letter-spacing="1">AUTONOMOUS RESIGNING LOOP</text>
    <text x="0" y="52" fill="#0f172a" font-size="22" font-weight="700">脱机自愈飞轮：SideStore+LiveContainer 周期续期闭环</text>
    <text x="0" y="74" fill="#475569" font-size="13">六大状态顺时针递进流转，中央配对金库持续支撑双向握手，彻底终结 7 天证书暴毙噩梦</text>
  </g>

  <!-- Central Hub: Shared Pairing &amp; Lockdown Credentials -->
  <g transform="translate(420, 365)">
    <rect width="260" height="100" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect x="14" y="12" width="130" height="18" rx="4" fill="#e0f2fe" />
    <text x="20" y="25" fill="#0369a1" font-size="9" font-weight="700" letter-spacing="0.5">SHARED VAULT HUB</text>
    <text x="14" y="52" fill="#0f172a" font-size="14" font-weight="700">受信任配对凭据与特权通道</text>
    <text x="14" y="72" fill="#334155" font-size="10">· .mobiledevicepairing 双向 TLS 验签</text>
    <text x="14" y="88" fill="#64748b" font-size="10">· 映射本地 lockdownd:62078 会话令牌</text>
  </g>

  <!-- Dashed Spokes connecting Stations to Hub -->
  <line x1="550" y1="217" x2="550" y2="365" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#hubSpokeArrow)" />
  <line x1="654" y1="300" x2="620" y2="375" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#hubSpokeArrow)" />
  <line x1="654" y1="530" x2="620" y2="455" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#hubSpokeArrow)" />
  <line x1="550" y1="613" x2="550" y2="465" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#hubSpokeArrow)" />
  <line x1="445" y1="530" x2="480" y2="455" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#hubSpokeArrow)" />
  <line x1="445" y1="300" x2="480" y2="375" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#hubSpokeArrow)" />

  <!-- Station 0: Top (01. Shortcuts 定时自动化) -->
  <g transform="translate(455, 153)">
    <rect width="190" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="14" y="24" fill="#0284c7" font-size="11" font-weight="700">01 · 定时自动化触发</text>
    <text x="14" y="42" fill="#334155" font-size="10">快捷指令周期静默唤醒</text>
    <text x="14" y="56" fill="#64748b" font-size="9">无需手动插线，每 3 天触发</text>
  </g>

  <!-- Arc 0 -> 1 -->
  <path d="M 645 185 Q 730 200 740 268" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#loopArrow)" />

  <!-- Station 1: Top-Right (02. Swift 运行时穿透) -->
  <g transform="translate(654, 268)">
    <rect width="190" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="14" y="24" fill="#0284c7" font-size="11" font-weight="700">02 · Swift 动态符号穿透</text>
    <text x="14" y="42" fill="#334155" font-size="10">反射解析混淆类型结构体</text>
    <text x="14" y="56" fill="#64748b" font-size="9">_getTypeByMangledName</text>
  </g>

  <!-- Arc 1 -> 2 -->
  <path d="M 750 332 Q 770 415 750 498" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#loopArrow)" />

  <!-- Station 2: Bottom-Right (03. 扩展沙盒守护) -->
  <g transform="translate(654, 498)">
    <rect width="190" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="14" y="24" fill="#0284c7" font-size="11" font-weight="700">03 · 隔离守护进程拉起</text>
    <text x="14" y="42" fill="#334155" font-size="10">LiveProcess.appex 装载</text>
    <text x="14" y="56" fill="#64748b" font-size="9">匿名 XPC 双向信道建立</text>
  </g>

  <!-- Arc 2 -> 3 -->
  <path d="M 654 550 Q 590 605 550 613" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#loopArrow)" />

  <!-- Station 3: Bottom (04. 本地环回掉头交换) -->
  <g transform="translate(455, 613)">
    <rect width="190" height="64" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
    <text x="14" y="24" fill="#059669" font-size="11" font-weight="700">04 · 环回隧道流量掉头</text>
    <text x="14" y="42" fill="#334155" font-size="10">10.7.0.1 → em_proxy 交换</text>
    <text x="14" y="56" fill="#64748b" font-size="9">minimuxer 模拟 usbmuxd</text>
  </g>

  <!-- Arc 3 -> 4 -->
  <path d="M 455 640 Q 370 635 350 562" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#loopArrow)" />

  <!-- Station 4: Bottom-Left (05. 证书刷新重置倒计时 - FOCAL) -->
  <g transform="translate(255, 498)">
    <rect width="190" height="64" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6" />
    <text x="14" y="24" fill="#e11d48" font-size="11" font-weight="700">05 · 描述文件重签落盘</text>
    <text x="14" y="42" fill="#334155" font-size="10">misagent 验证证书链</text>
    <text x="14" y="56" fill="#047857" font-size="9" font-weight="600">✨ 7 天到期倒计时重刷满格</text>
  </g>

  <!-- Arc 4 -> 5 -->
  <path d="M 350 498 Q 330 415 350 332" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#coralLoopArrow)" />

  <!-- Station 5: Top-Left (06. 优雅注销与休眠) -->
  <g transform="translate(255, 268)">
    <rect width="190" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="14" y="24" fill="#0284c7" font-size="11" font-weight="700">06 · 优雅释放环境休眠</text>
    <text x="14" y="42" fill="#334155" font-size="10">XPC 回传进度 100%</text>
    <text x="14" y="56" fill="#64748b" font-size="9">断开 VPN 释放内存等待下次</text>
  </g>

  <!-- Arc 5 -> 0 -->
  <path d="M 350 268 Q 390 190 455 185" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#loopArrow)" />
</svg>