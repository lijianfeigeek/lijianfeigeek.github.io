<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowCyan3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowCoral3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrowGreen3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="640" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="592" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="186" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">RUNTIME SUPERVISION ENGINE</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">LoadControl 运行时拦截、按序加载与崩溃自愈状态机</text>
    <text x="0" y="74" fill="#475569" font-size="13">将宿主 App 传统的被动静态链接转变为动态可观测沙盒：启动构造劫持、异常栈归因与双重自愈熔断</text>
  </g>

  <!-- Phase 1: Launch &amp; Handshake -->
  <g transform="translate(60, 160)">
    <rect width="220" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">STAGE 1</text>
      <text x="70" y="16" fill="#f8fafc" font-size="14" font-weight="700">启动劫持与哨兵</text>
      <text x="0" y="38" fill="#475569" font-size="11">主二进制加载入口</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="188" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">1.1 构造函数率先执行</text>
      <text x="12" y="42" fill="#334155" font-size="10">• __attribute__((constructor))</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 拦截 main() 执行前周期</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 初始化 startup.log 记录器</text>
      <text x="12" y="90" fill="#475569" font-size="9">建立模块装载基地址表</text>
    </g>

    <g transform="translate(16, 186)">
      <rect width="188" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">1.2 异常与信号防线构建</text>
      <text x="12" y="42" fill="#334155" font-size="10">• NSSetUncaughtExceptionHandler</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 注册 SIGSEGV / SIGBUS</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 注册 SIGABRT / SIGILL 捕获</text>
      <text x="12" y="94" fill="#059669" font-size="10">崩溃发生时拦截进程退出</text>
    </g>

    <g transform="translate(16, 310)">
      <rect width="188" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">1.3 连崩窗口状态检视</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 读取持久化崩溃计数器</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 检测上次闪退时间差</text>
      <text x="12" y="78" fill="#d97706" font-size="10">若 2 min 内 ≥3 次则进保护</text>
    </g>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 280 370 L 320 370" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)" />

  <!-- Phase 2: Ordered Dynamic Loading -->
  <g transform="translate(320, 160)">
    <rect width="230" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">STAGE 2</text>
      <text x="70" y="16" fill="#f8fafc" font-size="14" font-weight="700">按序动态加载</text>
      <text x="0" y="38" fill="#475569" font-size="11">解耦硬编码静态链接</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="198" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">2.1 依赖关系拓扑排序</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 扫描 Frameworks 目录</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 读取用户设定的优先级序号</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 确保基础底座优先于业务插件</text>
      <text x="12" y="90" fill="#475569" font-size="9">例：Substrate 先于 FLEX</text>
    </g>

    <g transform="translate(16, 186)">
      <rect width="198" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">2.2 dlopen 逐项装载</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 检查该 dylib 启用状态开关</text>
      <text x="12" y="58" fill="#334155" font-size="10">• dlopen(path, RTLD_NOW)</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 记录句柄与内存加载地址</text>
      <text x="12" y="94" fill="#059669" font-size="10">关闭项静默跳过，免去重签</text>
    </g>

    <g transform="translate(16, 310)">
      <rect width="198" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">2.3 控制权归还主程序</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 动态库就绪，进入正常生命周期</text>
      <text x="12" y="58" fill="#334155" font-size="10">• UI 悬浮控制窗待命</text>
      <text x="12" y="78" fill="#334155" font-size="10">开始监听宿主 App 运行</text>
    </g>
  </g>

  <!-- Branch: Normal vs Crash -->
  <path d="M 550 370 L 590 370" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrowCoral3)" />

  <!-- Phase 3: Crash Trapping &amp; Symbolization -->
  <g transform="translate(590, 160)">
    <rect width="220" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">STAGE 3</text>
      <text x="70" y="16" fill="#f8fafc" font-size="14" font-weight="700">崩溃捕获与溯源</text>
      <text x="0" y="38" fill="#475569" font-size="11">异常调用栈精准定位</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="188" height="110" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" />
      <text x="12" y="22" fill="#e11d48" font-size="11" font-weight="700">3.1 崩溃发生瞬时捕获</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 拦截 EXC_BAD_ACCESS 等陷阱</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 提取 backtrace 调用栈地址序列</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 冻结工作线程，防止二次重入</text>
      <text x="12" y="94" fill="#e11d48" font-size="10">触发应急自愈管线</text>
    </g>

    <g transform="translate(16, 200)">
      <rect width="188" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">3.2 镜像符号化匹配</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 比对 _dyld_image 虚拟地址空间</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 计算 PC 偏移定位出错模块</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 锁定崩溃调用栈顶层模块</text>
      <text x="12" y="94" fill="#e11d48" font-size="10">标记“首恶插件 (Culprit)”</text>
    </g>

    <g transform="translate(16, 324)">
      <rect width="188" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" fill="#0284c7" font-size="11" font-weight="600">3.3 崩溃日志持久化</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 写入 crash.log 与寄存器快照</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 记录故障 dylib 名称与时间戳</text>
      <text x="12" y="78" fill="#475569" font-size="9">供后续开发者与 AI 辅助分析</text>
    </g>
  </g>

  <!-- Connect 3 -> 4 -->
  <path d="M 810 370 L 850 370" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrowCoral3)" />

  <!-- Phase 4: Self-Healing &amp; Safe Mode -->
  <g transform="translate(850, 160)">
    <rect width="220" height="420" rx="12" fill="#f8fafc" stroke="#e11d48" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#be123c" />
      <text x="10" y="15" fill="#fecdd3" font-size="10" font-weight="700">STAGE 4</text>
      <text x="70" y="16" fill="#e11d48" font-size="14" font-weight="700">双重自愈熔断</text>
      <text x="0" y="38" fill="#334155" font-size="11">防死锁终极恢复</text>
    </g>

    <g transform="translate(16, 76)">
      <rect width="188" height="126" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" />
      <text x="12" y="22" fill="#e11d48" font-size="11" font-weight="700">自愈支线 A：精准隔离</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 命中单次偶发/特定崩溃</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 仅将首恶 dylib 写入禁用表</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 保留其余正常插件正常运行</text>
      <text x="12" y="90" fill="#334155" font-size="10">• 下次启动自动跳过该插件</text>
      <text x="12" y="110" fill="#059669" font-size="10">App 恢复正常，不影响整体</text>
    </g>

    <g transform="translate(16, 216)">
      <rect width="188" height="126" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" />
      <text x="12" y="22" fill="#e11d48" font-size="11" font-weight="700">自愈支线 B：保命保护模式</text>
      <text x="12" y="42" fill="#334155" font-size="10">• 2 分钟内连续闪退 ≥ 3 次</text>
      <text x="12" y="58" fill="#334155" font-size="10">• 触发全局熔断机制</text>
      <text x="12" y="74" fill="#334155" font-size="10">• 强制禁用全部第三方 dylib</text>
      <text x="12" y="90" fill="#334155" font-size="10">• App 纯净裸奔启动</text>
      <text x="12" y="110" fill="#d97706" font-size="10">让用户能进 App 重置与排障</text>
    </g>

    <g transform="translate(16, 356)">
      <rect width="188" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" fill="#059669" font-size="10" font-weight="700">最终成效：</text>
      <text x="12" y="36" fill="#334155" font-size="9">彻底打破“插件崩溃导致死锁重装”噩梦</text>
    </g>
  </g>
</svg>
