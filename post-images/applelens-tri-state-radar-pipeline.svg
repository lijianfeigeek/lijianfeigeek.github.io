<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="radar-pipeline-title radar-pipeline-desc" width="960" height="620" viewBox="0 0 960 620" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="radar-pipeline-title">AppleLens Tri-State Radar Telemetry and Attribution Pipeline</title>
  <desc id="radar-pipeline-desc">Data flow diagram showing how libproc sockets, POSIX DNS Fake-IP mapping, macOS ndjson logs, and USB MobileDevice syslog relay converge into the TriStateRadarCoordinator five-state machine.</desc>
  <defs>
    <pattern id="dot-grid-radar" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" opacity="0.08"/>
    </pattern>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-link" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-focal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas + Subtle Dot Grid -->
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="960" height="620" fill="url(#dot-grid-radar)"/>

  <!-- Header Strip -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="896" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="32" font-size="17" font-weight="700" fill="#0f172a">AppleLens 零拦截三态雷达：跨源采集、Fake-IP 归因与五态收敛管线</text>
    <text x="676" y="31" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">DATA FLOW · STATE MACHINE</text>
  </g>

  <!-- Orthogonal Connectors Drawn BEFORE Boxes -->
  <!-- Telemetry Sources (Col 1) -> Attribution Gate (Col 2) -->
  <path d="M 276 144 L 308 144 Q 316 144 316 152 L 316 184 Q 316 192 324 192 L 348 192" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-link)"/>
  <path d="M 276 252 L 308 252 Q 316 252 316 244 L 316 220 Q 316 212 324 212 L 348 212" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 276 364 L 316 364 L 348 364" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <path d="M 276 472 L 308 472 Q 316 472 316 464 L 316 404 Q 316 396 324 396 L 348 396" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-link)"/>

  <!-- Attribution Gate (Col 2) -> Coordinator Hub (Col 3) -->
  <path d="M 612 204 L 644 204 Q 652 204 652 212 L 652 280 Q 652 288 660 288 L 680 288" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-focal)"/>
  <path d="M 612 384 L 644 384 Q 652 384 652 376 L 652 320 Q 652 312 660 312 L 680 312" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-link)"/>

  <!-- Arrow Masks & Labels -->
  <g transform="translate(300, 128)">
    <rect x="0" y="0" width="44" height="16" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="22" y="11" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#0284c7" font-weight="600">FD/IP</text>
  </g>
  <g transform="translate(616, 232)">
    <rect x="0" y="0" width="68" height="16" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="0.6"/>
    <text x="34" y="11" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#e11d48" font-weight="600">ATTRIB</text>
  </g>

  <!-- COLUMN 1: TELEMETRY SOURCES (x=32, w=244) -->
  <g transform="translate(32, 92)">
    <text x="4" y="12" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">01 · 无内核驱动纯只读采集源</text>

    <!-- Node 1: ProcessSocketScanner -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="244" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="92" height="16" rx="2" fill="#e0f2fe"/>
      <text x="18" y="21" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0369a1">DARWIN LIBPROC</text>
      <text x="12" y="42" font-size="13" font-weight="600" fill="#0f172a">进程套接字惰性扫描器</text>
      <text x="12" y="60" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">TCP :443 / Proxy + UDP :443</text>
      <text x="12" y="75" font-size="9.5" fill="#64748b">沿路径折叠 Helper 至最外层 .app 束</text>
    </g>

    <!-- Node 2: DNSFakeIPMapper -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="244" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="96" height="16" rx="2" fill="#f1f5f9"/>
      <text x="18" y="21" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">POSIX GETADDRINFO</text>
      <text x="12" y="42" font-size="13" font-weight="600" fill="#0f172a">16 家模型域名 IP 映射表</text>
      <text x="12" y="60" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">OperationQueue(max=8) · 90s TTL</text>
      <text x="12" y="75" font-size="9.5" fill="#64748b">覆盖 198.18.0.0/15 Fake-IP 与直连 IP</text>
    </g>

    <!-- Node 3: Mac UnifiedLogStreamService -->
    <g transform="translate(0, 228)">
      <rect x="0" y="0" width="244" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="96" height="16" rx="2" fill="#f1f5f9"/>
      <text x="18" y="21" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">MACOS LOG STREAM</text>
      <text x="12" y="42" font-size="13" font-weight="600" fill="#0f172a">本机统一日志 NDJSON 流</text>
      <text x="12" y="60" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">/usr/bin/log stream --style ndjson</text>
      <text x="12" y="75" font-size="9.5" fill="#64748b">64KB 增量滑窗过滤 ANE / PCC 进程</text>
    </g>

    <!-- Node 4: USBiPhoneLogBridge -->
    <g transform="translate(0, 328)">
      <rect x="0" y="0" width="244" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="116" height="16" rx="2" fill="#e0f2fe"/>
      <text x="18" y="21" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0369a1">MOBILEDEVICE.FRAMEWORK</text>
      <text x="12" y="42" font-size="13" font-weight="600" fill="#0f172a">USB 真机 syslog 隧道</text>
      <text x="12" y="60" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">dlopen 动态加载 · 零 libimobiledevice</text>
      <text x="12" y="76" font-size="9.5" fill="#64748b">installation_proxy 动态发现已装 AI</text>
    </g>
  </g>

  <!-- COLUMN 2: ATTRIBUTION & DENOISE GATES (x=348, w=264) -->
  <g transform="translate(348, 92)">
    <text x="4" y="12" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">02 · 防误报门控与上下文降噪引擎</text>

    <!-- Gate A: 4-Tier Attribution Engine (FOCAL #1) -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="264" height="204" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="14" y="12" width="112" height="16" rx="2" fill="#ffe4e6"/>
      <text x="20" y="23" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#be123c">FOCAL · FOUR-TIER GATE</text>
      <text x="14" y="46" font-size="14" font-weight="700" fill="#0f172a">四级置信度归因门控</text>
      <text x="14" y="64" font-size="10.5" fill="#475569">防 Cloudflare Anycast / Google 误杀</text>

      <!-- Inner tier rows -->
      <g transform="translate(14, 78)">
        <rect x="0" y="0" width="236" height="24" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
        <text x="8" y="16" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">1. Dedicated IP (160.79.104.*)</text>
      </g>
      <g transform="translate(14, 108)">
        <rect x="0" y="0" width="236" height="24" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
        <text x="8" y="16" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">2. Exact Fake-IP (198.18.0.0/15)</text>
      </g>
      <g transform="translate(14, 138)">
        <rect x="0" y="0" width="236" height="24" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
        <text x="8" y="16" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">3. CF/Gemini ➔ 仅放行已知 AI 客户端</text>
      </g>
      <g transform="translate(14, 168)">
        <rect x="0" y="0" width="236" height="24" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
        <text x="8" y="16" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">4. 剔除 Surge/Mihomo/Clash 代理自身</text>
      </g>
    </g>

    <!-- Gate B: XPC & Syslog Signal Filter -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="264" height="156" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="14" y="12" width="116" height="16" rx="2" fill="#f1f5f9"/>
      <text x="20" y="23" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">NOISE SUPPRESSION</text>
      <text x="14" y="45" font-size="13.5" font-weight="600" fill="#0f172a">双端日志信号识别与降噪</text>

      <g transform="translate(14, 58)">
        <rect x="0" y="0" width="236" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="8" y="17" font-size="10" fill="#334155">识别 Clean Up / CameraOverlayAngel</text>
      </g>
      <g transform="translate(14, 90)">
        <rect x="0" y="0" width="236" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="8" y="17" font-size="10" fill="#334155">过滤 XPC_INTERRUPTED / ANE0 杂波</text>
      </g>
      <g transform="translate(14, 122)">
        <rect x="0" y="0" width="236" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
        <text x="8" y="16" font-size="10" fill="#334155">跟踪 FrontBoard / runningboardd 生命周期</text>
      </g>
    </g>
  </g>

  <!-- COLUMN 3: TRISTATE RADAR COORDINATOR (x=680, w=248) -->
  <g transform="translate(680, 92)">
    <text x="4" y="12" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">03 · 视图隔离与五态收敛状态机</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="248" height="396" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
      <text x="16" y="26" font-size="13.5" font-weight="700" fill="#0f172a">TriStateRadarCoordinator</text>
      <text x="16" y="42" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#64748b">@MainActor · Mac/iOS 状态严格隔离</text>

      <!-- State 1: Idle -->
      <g transform="translate(14, 56)">
        <rect x="0" y="0" width="220" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="16" cy="22" r="5" fill="#94a3b8"/>
        <text x="28" y="19" font-size="12" font-weight="600" fill="#0f172a">Idle · 静默待命</text>
        <text x="28" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#64748b">闲置 60s 自动退避至 5.0s 轮询</text>
      </g>

      <!-- State 2: On-Device -->
      <g transform="translate(14, 110)">
        <rect x="0" y="0" width="220" height="44" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
        <circle cx="16" cy="22" r="5" fill="#059669"/>
        <text x="28" y="19" font-size="12" font-weight="600" fill="#065f46">On-Device ANE · 端侧推理</text>
        <text x="28" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#047857">TGOnDevice / modelmanagerd · 35s</text>
      </g>

      <!-- State 3: Apple PCC -->
      <g transform="translate(14, 164)">
        <rect x="0" y="0" width="220" height="44" rx="5" fill="#eff6ff" stroke="#0284c7" stroke-width="1"/>
        <circle cx="16" cy="22" r="5" fill="#0284c7"/>
        <text x="28" y="19" font-size="12" font-weight="600" fill="#075985">Apple PCC · 私有云推理</text>
        <text x="28" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#0369a1">privatecloudcomputed / OHTTP</text>
      </g>

      <!-- State 4: External LLM -->
      <g transform="translate(14, 218)">
        <rect x="0" y="0" width="220" height="44" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
        <circle cx="16" cy="22" r="5" fill="#d97706"/>
        <text x="28" y="19" font-size="12" font-weight="600" fill="#92400e">External LLM · 外部大模型</text>
        <text x="28" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#b45309">陌生进程 First-Seen 通知 + 信任持久化</text>
      </g>

      <!-- State 5: Hybrid -->
      <g transform="translate(14, 272)">
        <rect x="0" y="0" width="220" height="44" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
        <circle cx="16" cy="22" r="5" fill="#7c3aed"/>
        <text x="28" y="19" font-size="12" font-weight="600" fill="#5b21b6">Hybrid · 多端并发协同</text>
        <text x="28" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#6d28d9">activeModeCount &gt;= 2 实时聚合</text>
      </g>

      <!-- Output surface badge -->
      <g transform="translate(14, 330)">
        <rect x="0" y="0" width="220" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="20" font-size="11" font-weight="600" fill="#0f172a">三端视图输出</text>
        <text x="12" y="38" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">MenuBarExtra · Workbench · CLI JSON</text>
      </g>
    </g>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(32, 540)">
    <rect x="0" y="0" width="896" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(20, 18)">
      <line x1="0" y1="8" x2="26" y2="8" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-link)"/>
      <text x="36" y="12" font-size="11" fill="#334155">高实时性网络/USB 数据通道</text>
    </g>
    <g transform="translate(248, 18)">
      <line x1="0" y1="8" x2="26" y2="8" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-focal)"/>
      <text x="36" y="12" font-size="11" fill="#334155">核心防误报归因路径 (Focal)</text>
    </g>
    <g transform="translate(490, 18)">
      <rect x="0" y="1" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
      <text x="22" y="12" font-size="11" fill="#334155">四级置信度过滤门禁</text>
    </g>
    <g transform="translate(684, 18)">
      <circle cx="7" cy="8" r="5" fill="#059669"/>
      <text x="20" y="12" font-size="11" fill="#334155">无内核驱动 · 100% 只读零拦截</text>
    </g>
  </g>
</svg>
