<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; fill: #64748b; }
      .zone-title { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .node-title { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-size: 11px; fill: #475569; }
      .mono-tag { font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
      .flow-path { fill: none; }
    </style>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="flow-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="flow-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Canvas Container -->
  <rect x="10" y="10" width="900" height="460" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text class="title" x="0" y="18">零信任会话分享与读取时动态脱敏拓扑 (Zero-Trust Sharing &amp; Read-Time Redaction)</text>
    <text class="subtitle" x="0" y="36">原始抓包底表物理只读、分发时动态脱敏注入与沙盒执行熔断保护机制</text>
  </g>

  <!-- Zone 1: Raw Disk Storage (x=30, y=75, w=250, h=370) -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="250" height="370" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text class="zone-title" x="16" y="24">1. 本地物理存储 (不可变原稿)</text>
    <text class="mono-tag" x="16" y="42" fill="#64748b">Raw Disk Storage (Pristine)</text>

    <!-- Node 1.1 -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="218" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text class="node-title" x="12" y="20">SQLite WAL 流量日志</text>
      <text class="node-desc" x="12" y="38">存储完整原始 Headers 与元数据</text>
      <text class="node-desc" x="12" y="52">保留所有未经脱敏的原始字节</text>
      <text class="mono-tag" x="12" y="66" fill="#0284c7">sessions/{id}.db</text>
    </g>

    <!-- Node 1.2 -->
    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="218" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text class="node-title" x="12" y="20">流式磁盘 Body 文件</text>
      <text class="node-desc" x="12" y="38">超大 Body 独立文件分片落盘</text>
      <text class="node-desc" x="12" y="52">macOS flush 强制对齐防 0 字节</text>
      <text class="mono-tag" x="12" y="66" fill="#0284c7">sessions/{id}/bodies/*</text>
    </g>

    <!-- Node 1.3 -->
    <g transform="translate(16, 228)">
      <rect x="0" y="0" width="218" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text class="node-title" x="12" y="20">PCWS 二进制 WS 帧流</text>
      <text class="node-desc" x="12" y="38">RFC 6455 双向帧持久化</text>
      <text class="node-desc" x="12" y="52">记录因果树 (root/producer)</text>
      <text class="mono-tag" x="12" y="66" fill="#0891b2">PCWS\x01\0\0\0</text>
    </g>

    <!-- Alert in Zone 1 -->
    <g transform="translate(16, 314)">
      <rect x="0" y="0" width="218" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text class="mono-tag" x="10" y="18" fill="#475569">PROD IMMUTABLE</text>
      <text class="node-desc" x="10" y="32">脱敏逻辑绝对不污染物理存储</text>
    </g>
  </g>

  <!-- Arrow Zone 1 -> Zone 2 -->
  <path class="flow-path" d="M 280 230 L 320 230" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#flow-arrow-blue)" />

  <!-- Zone 2: Zero-Trust Security Gate & Redaction Engine (x=330, y=75, w=270, h=370) -->
  <g transform="translate(330, 75)">
    <rect x="0" y="0" width="270" height="370" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text class="zone-title" x="16" y="24">2. 动态读取脱敏引擎 (Air-Gap)</text>
    <text class="mono-tag" x="16" y="42" fill="#0284c7">Dynamic Read-Time Redaction</text>

    <!-- Node 2.1: Token Gate -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="238" height="74" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text class="node-title" x="12" y="20">常量时间 Token 验签门禁</text>
      <text class="node-desc" x="12" y="38">256-bit pcrab_share_ 唯一令牌</text>
      <text class="node-desc" x="12" y="52">subtle::ConstantTimeEq 防时序侧信道</text>
      <text class="mono-tag" x="12" y="66" fill="#0284c7">恒定时间比较</text>
    </g>

    <!-- Node 2.2: Focal Node (Coral Accent) -->
    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="238" height="88" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
      <text class="node-title" x="12" y="20" fill="#e11d48">沙盒动态脱敏执行器</text>
      <text class="node-desc" x="12" y="38" fill="#9f1239">按需执行 mask.lua 脚本</text>
      <text class="node-desc" x="12" y="52" fill="#9f1239">过滤 JWT / Cookie / 手机号 / 密钥</text>
      <text class="mono-tag" x="12" y="72" fill="#e11d48">Stage-Only 内存副本篡改</text>
    </g>

    <!-- Node 2.3: Fail Closed Safety -->
    <g transform="translate(16, 242)">
      <rect x="0" y="0" width="238" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
      <text class="node-title" x="12" y="20" fill="#b91c1c">Fail-Closed 故障熔断保护</text>
      <text class="node-desc" x="12" y="38" fill="#7f1d1d">Lua 脚本报错或超时时</text>
      <text class="mono-tag" x="12" y="54" fill="#dc2626">直接报 redaction_failed，绝不泄漏原稿</text>
    </g>

    <!-- Node 2.4 -->
    <g transform="translate(16, 318)">
      <rect x="0" y="0" width="238" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text class="mono-tag" x="12" y="22" fill="#059669">NO-STORE &amp; NO-REFERRER HTTP 标头</text>
    </g>
  </g>

  <!-- Arrow Zone 2 -> Zone 3 -->
  <path class="flow-path" d="M 600 230 L 640 230" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#flow-arrow-green)" />

  <!-- Zone 3: Scoped Consumption (x=650, y=75, w=240, h=370) -->
  <g transform="translate(650, 75)">
    <rect x="0" y="0" width="240" height="370" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text class="zone-title" x="16" y="24">3. 受控消费端 (安全只读)</text>
    <text class="mono-tag" x="16" y="42" fill="#059669">Scoped Read-Only Consumers</text>

    <!-- Node 3.1 -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="208" height="74" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text class="node-title" x="10" y="20" fill="#15803d">只读网页免登查看</text>
      <text class="node-desc" x="10" y="38">/session?token= 外部直接浏览</text>
      <text class="node-desc" x="10" y="52">单条高亮、实时跟新、脱敏导出</text>
      <text class="mono-tag" x="10" y="66" fill="#16a34a">无需安装客户端</text>
    </g>

    <!-- Node 3.2 -->
    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="208" height="74" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text class="node-title" x="10" y="20" fill="#15803d">只读 Agent 诊断接入</text>
      <text class="node-desc" x="10" y="38">/share-api/* 纯读接口</text>
      <text class="node-desc" x="10" y="52">无需管理 API Key 或主机权限</text>
      <text class="mono-tag" x="10" y="66" fill="#16a34a">零凭证跨网排障</text>
    </g>

    <!-- Node 3.3 -->
    <g transform="translate(16, 228)">
      <rect x="0" y="0" width="208" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text class="node-title" x="10" y="20">Session 配置包 Bundle</text>
      <text class="node-desc" x="10" y="38">ZIP 打包拦截链与业务自定义列</text>
      <text class="node-desc" x="10" y="52">不夹带抓包历史</text>
      <text class="mono-tag" x="10" y="68" fill="#475569">无感跨团队复用</text>
    </g>
  </g>
</svg>
