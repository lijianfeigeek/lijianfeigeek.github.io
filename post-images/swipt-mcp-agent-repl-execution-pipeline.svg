<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="sw-repl-title sw-repl-desc">
  <title id="sw-repl-title">移动 Agent 交互范式对比：传统多轮视觉轮询 vs. Swipt 单往返 JS REPL 闭环</title>
  <desc id="sw-repl-desc">对比传统基于截图与视觉大模型的脆弱高延迟交互，与 Swipt 依托端侧 JSC 引擎实现的毫秒级低 Token 闭环执行。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .step-box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .step-box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .metric-badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
  </style>

  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">移动端 Agent 控制范式对比：视觉多轮轮询 vs. Swipt 端侧 REPL 闭环</text>
    <text class="subtitle" x="0" y="20">从“高延迟、高 Token 消耗、脆弱易雪崩”走向“30ms 毫秒级端侧执行、单次往返与强类型语义”</text>
  </g>

  <!-- Left: Traditional Vision Polling (Fragile) -->
  <g transform="translate(48, 84)">
    <rect width="416" height="352" rx="8" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
    
    <!-- Title -->
    <g transform="translate(16, 20)">
      <text class="col-title" fill="#991b1b" x="0" y="0">传统模式：截图流 + 视觉大模型多轮往返</text>
      <text class="mono" fill="#b91c1c" x="0" y="16">Appium / OCR / Remote Vision Agent</text>
    </g>

    <!-- Step 1 -->
    <g transform="translate(16, 56)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">1. 全屏截图网络回传 (4MB PNG)</text>
        <text class="step-box-desc" x="0" y="16">每次动作都需重新截图编码，严重占用网络带宽</text>
      </g>
    </g>

    <!-- Step 2 -->
    <g transform="translate(16, 116)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">2. 视觉大模型坐标推断</text>
        <text class="step-box-desc" x="0" y="16">单步消耗数千 Vision Tokens，分辨率变形易点偏</text>
      </g>
    </g>

    <!-- Step 3 -->
    <g transform="translate(16, 176)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">3. 下发单步 Click(X, Y) 盲猜状态</text>
        <text class="step-box-desc" x="0" y="16">无法判断页面加载是否完成，遭遇动画极易超时</text>
      </g>
    </g>

    <!-- Step 4 -->
    <g transform="translate(16, 236)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">4. 循环往复 10~20 轮直到完成</text>
        <text class="step-box-desc" x="0" y="16">任一轮网络抖动或误判，整个长链任务直接中断</text>
      </g>
    </g>

    <!-- Bottom Metric -->
    <g transform="translate(16, 304)">
      <rect width="384" height="34" rx="4" fill="#fee2e2"/>
      <text class="metric-badge" fill="#991b1b" x="12" y="21">指标：每步 5~15s | 任务消耗 30k+ Tokens | 成功率脆弱</text>
    </g>
  </g>

  <!-- Right: Swipt MCP + JS REPL (Robust) -->
  <g transform="translate(496, 84)">
    <rect width="416" height="352" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    
    <!-- Title -->
    <g transform="translate(16, 20)">
      <text class="col-title" fill="#166534" x="0" y="0">Swipt 范式：MCP 动态注入 + 端侧 JSC 闭环</text>
      <text class="mono" fill="#15803d" x="0" y="16">Swipt MCP / @swipt/api / JSC Thread</text>
    </g>

    <!-- Step 1 -->
    <g transform="translate(16, 56)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">1. 一次性下发结构化 JS/TS 脚本</text>
        <text class="step-box-desc" x="0" y="16">携带完整的业务判断、重试逻辑与条件循环</text>
      </g>
    </g>

    <!-- Step 2 -->
    <g transform="translate(16, 116)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">2. 端侧毫秒级 DOM 查询 (Accessibility)</text>
        <text class="step-box-desc" x="0" y="16">直接通过 AX 树匹配角色、文本、Frame，精确无误</text>
      </g>
    </g>

    <!-- Step 3 -->
    <g transform="translate(16, 176)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">3. 硬件级虚拟 HID 极速触发</text>
        <text class="step-box-desc" x="0" y="16">多点触控与按键直接注入内核，本地等待 UI 动效</text>
      </g>
    </g>

    <!-- Step 4 -->
    <g transform="translate(16, 236)">
      <rect width="384" height="52" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="step-box-title" x="0" y="0">4. 单次往返直接返回最终执行结果</text>
        <text class="step-box-desc" x="0" y="16">无需多轮传输，一次 MCP Tool Call 解决完整工作流</text>
      </g>
    </g>

    <!-- Bottom Metric -->
    <g transform="translate(16, 304)">
      <rect width="384" height="34" rx="4" fill="#dcfce7"/>
      <text class="metric-badge" fill="#166534" x="12" y="21">指标：端侧 30ms 响应 | 任务消耗 ~500 Tokens | 确定性 100%</text>
    </g>
  </g>
</svg>