<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="sbq-title sbq-desc" id="sbq-quadrant-root" data-diagram="quadrant">
  <title id="sbq-title">静态技术博客全文搜索四象限工程权衡矩阵</title>
  <desc id="sbq-desc">对比四类静态站点搜索方案在首屏零阻塞响应速度与架构自主可控性两个正交维度上的取舍，定位双层分级索引与 Web Worker 方案。</desc>
  <defs>
    <pattern id="sbq-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="sbq-arr-end" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
    </marker>
    <marker id="sbq-arr-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="620" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="620" fill="url(#sbq-dots)"/>
  <rect x="16" y="16" width="968" height="588" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.16em">STATIC SEARCH TRADE-OFF · 2X2 ARCHITECTURAL MATRIX</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">当静态博客突破 580 篇长文与 9MB 源码：四类搜索技术路线二维权衡</text>
  </g>

  <!-- Orthogonal Axes (center = 500, 316) -->
  <line x1="120" y1="316" x2="880" y2="316" stroke="#0f172a" stroke-width="1.2" marker-start="url(#sbq-arr-start)" marker-end="url(#sbq-arr-end)"/>
  <line x1="500" y1="112" x2="500" y2="520" stroke="#0f172a" stroke-width="1.2" marker-start="url(#sbq-arr-start)" marker-end="url(#sbq-arr-end)"/>

  <!-- Axis Tip Labels -->
  <g transform="translate(500, 98)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">INSTANT &amp; NON-BLOCKING</text>
  </g>
  <g transform="translate(500, 540)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">HEAVY / BUILD-COUPLED</text>
  </g>
  <g transform="translate(108, 320)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="end">EXTERNAL</text>
  </g>
  <g transform="translate(892, 320)">
    <text x="0" y="0" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">SELF-CONTAINED</text>
  </g>

  <!-- Q1: Top-Left (01 · EXTERNAL SAAS / INSTANT) -->
  <g transform="translate(156, 132)">
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">01 · EXTERNAL SAAS / INSTANT</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">Algolia DocSearch 云端托管</text>
    <text x="16" y="74" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">服务端专业倒排索引，前端包体极轻；</text>
    <text x="16" y="96" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">但强依赖外部云服务配额与跨境网络连通性，</text>
    <text x="16" y="118" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">且定时爬虫对刚发布的文章存在索引滞后窗</text>
    <text x="16" y="140" fill="#64748b" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">Quota Limit · Cross-Border RTT · Crawl Lag</text>
  </g>

  <!-- Q2: Top-Right FOCAL (02 · SELF-CONTAINED / INSTANT) -->
  <g transform="translate(528, 132)">
    <rect x="-4" y="-4" width="324" height="168" rx="8" fill="#bf4520" opacity="0.04"/>
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="16" y="24" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">02 · SELF-CONTAINED / INSTANT</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">原生双层分级索引 + Web Worker</text>
    <text x="16" y="74" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">L1 热索引仅 217KB Gzip，标题与章节 &lt;1ms 秒出；</text>
    <text x="16" y="96" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">L2 九分片交由独立 Worker 3 路并发流式扫描，</text>
    <text x="16" y="118" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">零第三方二进制依赖，二次全文热检索仅 4.1ms</text>
    <text x="16" y="140" fill="#bf4520" font-size="10.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">0.4s Build · Zero Server · 120fps Non-Blocking</text>
  </g>

  <!-- Q3: Bottom-Left (03 · TOOLCHAIN COUPLED / WASM) -->
  <g transform="translate(156, 340)">
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">03 · TOOLCHAIN COUPLED / WASM</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">Pagefind (Rust + Wasm) 词元分片</text>
    <text x="16" y="74" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">按词前缀切分 .pf_fragment，静态全文能力强；</text>
    <text x="16" y="96" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">但需在本机额外部署原生 CLI，且必须等待</text>
    <text x="16" y="118" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">Gridea 完整渲染 1,471 个 HTML 后再二次扫盘</text>
    <text x="16" y="140" fill="#64748b" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">Post-HTML Scan · Wasm Runtime Overhead</text>
  </g>

  <!-- Q4: Bottom-Right (04 · SELF-CONTAINED / BLOCKING) -->
  <g transform="translate(528, 340)">
    <rect x="0" y="0" width="316" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">04 · SELF-CONTAINED / BLOCKING</text>
    <text x="16" y="50" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">传统单文件全量 search.json</text>
    <text x="16" y="74" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">Hexo / Gridea 早期插件惯用套路，实现虽简单；</text>
    <text x="16" y="96" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">但 582 篇长文单包膨胀至 6.8MB（Gzip 3.1MB），</text>
    <text x="16" y="118" fill="#475569" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">移动端首搜拉取漫长，主线程解析直接卡顿掉帧</text>
    <text x="16" y="140" fill="#64748b" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">6.8MB Payload · Main-Thread UI Freeze</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="560" x2="960" y2="560" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(40, 576)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="20" y="12" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">本站落地架构（直读 posts.json 零依赖双层引擎）</text>
  </g>
  <g transform="translate(348, 576)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="12" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">其他主流静态博客搜索方案</text>
  </g>
  <g transform="translate(536, 576)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">X: ZERO-DEPENDENCY AUTONOMY · Y: FIRST-QUERY LATENCY</text>
  </g>
</svg>
