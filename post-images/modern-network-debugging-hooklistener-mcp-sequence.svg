<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="modern-network-debugging-hooklistener-mcp-sequence-title modern-network-debugging-hooklistener-mcp-sequence-desc">
  <title id="modern-network-debugging-hooklistener-mcp-sequence-title">Hooklistener MCP 原生协议直连 AI Coding Agent 时序交互</title>
  <desc id="modern-network-debugging-hooklistener-mcp-sequence-desc">展示 Webhook 回调进入 Hooklistener 网关并通过 MCP 事件流推送给 Agent 闭环排查并重放的完整时序</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">HOOKLISTENER 架构突破：以 MCP 标准协议直连 AI CODING AGENT 的闭环时序</text>
    <text x="896" y="16" text-anchor="end" class="coral-tag">67 ATOMIC MCP TOOLS</text>
  </g>

  <!-- Actors Header -->
  <!-- Actor 1: Dev / Stripe -->
  <g transform="translate(40, 56)">
    <rect width="180" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="90" y="25" text-anchor="middle" class="seq-actor">外部平台 (如 Stripe)</text>
  </g>
  <line x1="130" y1="96" x2="130" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Actor 2: Hooklistener Gateway -->
  <g transform="translate(260, 56)">
    <rect width="190" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="95" y="25" text-anchor="middle" class="seq-actor">Hooklistener 云端网关</text>
  </g>
  <line x1="355" y1="96" x2="355" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Actor 3: AI Coding Agent (Core Focus) -->
  <g transform="translate(490, 56)">
    <rect width="200" height="40" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" class="coral-title" style="font-size:13px;">AI Coding Agent (Claude Code)</text>
  </g>
  <line x1="590" y1="96" x2="590" y2="380" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Actor 4: Local Dev Server -->
  <g transform="translate(730, 56)">
    <rect width="190" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="95" y="25" text-anchor="middle" class="seq-actor">本地服务 (localhost:3000)</text>
  </g>
  <line x1="825" y1="96" x2="825" y2="380" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Step 1: External Webhook -->
  <line x1="130" y1="120" x2="355" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="150" y="114" class="seq-msg">1. 发送 Webhook 回调 (含签名 Header)</text>

  <!-- Step 2: MCP Event Stream Push -->
  <line x1="355" y1="150" x2="590" y2="150" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)" />
  <text x="375" y="144" class="coral-tag" style="font-size:11px;">2. MCP SSE 事件流实时推送新报文到达</text>

  <!-- Step 3: Agent calls get_request -->
  <rect x="470" y="170" width="240" height="26" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
  <text x="590" y="187" text-anchor="middle" class="seq-note">Agent 调用 get_request 读取载荷与时间戳</text>

  <!-- Step 4: Local Test Execution -->
  <line x1="590" y1="214" x2="825" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="615" y="208" class="seq-msg">3. 本地执行签名校验与单元测试</text>

  <!-- Step 5: Test Failed &amp; Hotfix -->
  <rect x="460" y="234" width="260" height="34" fill="#fff5f5" rx="4" stroke="#fed7d7" stroke-width="1" />
  <text x="590" y="248" text-anchor="middle" class="coral-tag">校验失败: 密钥哈希计算偏差</text>
  <text x="590" y="262" text-anchor="middle" class="seq-note">Agent 自动定位代码缺陷并就地热重载重构</text>

  <!-- Step 6: Agent triggers replay -->
  <line x1="590" y1="294" x2="355" y2="294" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)" />
  <text x="375" y="288" class="coral-tag" style="font-size:11px;">4. 调用 replay_request 发起精准重放</text>

  <!-- Step 7: Gateway replay to local -->
  <line x1="355" y1="324" x2="825" y2="324" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="460" y="318" class="seq-msg" style="fill:#15803d;">5. 严格保持原始签名重放请求到本地服务</text>

  <!-- Step 8: Return 200 OK -->
  <line x1="825" y1="354" x2="590" y2="354" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="650" y="348" class="seq-msg" style="fill:#15803d;">6. 返回 HTTP 200 OK，闭环验收通过</text>
</svg>