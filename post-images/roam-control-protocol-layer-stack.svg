<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="rc-layers-title rc-layers-desc" xmlns="http://www.w3.org/2000/svg" id="roam-control-protocol-layer-stack-root">
  <title id="rc-layers-title">Roam Control 七层混合协议栈与二进制边界剖析</title>
  <desc id="rc-layers-desc">展示从顶层 SwiftUI Liquid Glass 运动控制器经 12 个 C-FFI 符号穿透至 Rust jktcp 用户态协议栈、RemotePairing TLS-PSK 加密隧道与 LocalDevVPN 网卡绑定的七层架构。</desc>
  <defs>
      <style>#roam-control-protocol-layer-stack-root { color: #0f172a; font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; }
      #roam-control-protocol-layer-stack-root .diagram-wrap { overflow-x: auto; max-width: 1000px; margin: 0 auto; }</style>
    <marker id="roam-control-protocol-layer-stack-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="roam-control-protocol-layer-stack-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="roam-control-protocol-layer-stack-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Clean Paper Light Background -->
  <rect x="0" y="0" width="960" height="620" fill="#f8fafc"/>
  <rect x="16" y="16" width="928" height="588" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">MACH-O ARM64 BINARY DISSECTION · 12.35 MB SINGLE EXECUTABLE</text>
    <text x="0" y="36" fill="#0f172a" font-size="18" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">Roam Control 七层混合协议栈：SwiftUI 宿主层与静态链接 Rust 引擎纵深</text>
  </g>

  <!-- Left margin vertical direction arrows -->
  <line x1="48" y1="104" x2="48" y2="516" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#roam-control-protocol-layer-stack-arrow)"/>
  <rect x="28" y="284" width="40" height="44" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="302" fill="#475569" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">下发</text>
  <text x="48" y="318" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5 Hz</text>

  <!-- Outer Layer Stack Silhouette -->
  <rect x="84" y="92" width="832" height="448" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- L7: SwiftUI & Motion Engine -->
  <g transform="translate(84, 92)">
    <rect x="0" y="0" width="832" height="64" rx="6" fill="#ffffff"/>
    <line x1="0" y1="64" x2="832" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="40" y="36" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L7 · UI</text>
    <text x="84" y="28" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">SwiftUI Liquid Glass 视图与双频运动学引擎</text>
    <text x="84" y="48" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">120Hz 地图插值渲染 + 5Hz 提交节流 · DrivingMotionProfile 加减速过弯模型 · GCJ-02 单向逆纠偏</text>
    <text x="812" y="36" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">138 Swift Types</text>
  </g>

  <!-- L6: C-FFI Boundary -->
  <g transform="translate(84, 156)">
    <rect x="0" y="0" width="832" height="64" fill="#f8fafc"/>
    <line x1="0" y1="64" x2="832" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="20" width="48" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="40" y="36" fill="#0284c7" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L6 · FFI</text>
    <text x="84" y="28" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">零动态库 C-FFI 窄桥接层（roam_pairing_ffi）</text>
    <text x="84" y="48" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">仅暴露 12 个 C 函数符号 · 静态合入主二进制规避私有 Framework 签名审计</text>
    <text x="812" y="36" fill="#0284c7" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">_rc_location_session_*</text>
  </g>

  <!-- L5: DVT Instruments LocationSimulation -->
  <g transform="translate(84, 220)">
    <rect x="0" y="0" width="832" height="64" fill="#ffffff"/>
    <line x1="0" y1="64" x2="832" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="40" y="36" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L5 · DVT</text>
    <text x="84" y="28" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">DVT Instruments 定位注入服务客户端</text>
    <text x="84" y="48" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">通过 ns-keyed-archive 0.1.5 编码二进制归档帧 · 驱动系统级 locationd 硬件坐标接管</text>
    <text x="812" y="36" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">dtservicehub</text>
  </g>

  <!-- L4: RemoteXPC over HTTP/2 -->
  <g transform="translate(84, 284)">
    <rect x="0" y="0" width="832" height="64" fill="#f8fafc"/>
    <line x1="0" y1="64" x2="832" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="40" y="36" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L4 · XPC</text>
    <text x="84" y="28" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">RemoteServiceDiscovery 与 HTTP/2 RemoteXPC 帧层</text>
    <text x="84" y="48" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">执行 RsdHandshake 服务发现 · 封装 SettingsFrame / DataFrame 与 XPCObject 字典树</text>
    <text x="812" y="36" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">idevice::xpc::http2</text>
  </g>

  <!-- L3: FOCAL LAYER - jktcp Userspace TCP/IP Stack -->
  <g transform="translate(84, 348)">
    <rect x="0" y="0" width="832" height="64" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <rect x="16" y="20" width="48" height="24" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
    <text x="40" y="36" fill="#be123c" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L3 · TCP</text>
    <text x="84" y="28" fill="#9f1239" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">纯用户态虚拟 TCP/IP 协议栈（破除沙盒无 utun 权限困局）</text>
    <text x="84" y="48" fill="#be123c" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">在进程内存中用 AdapterHandle 重组 CoreDevice 内部 IPv6 报文，免 Root 免额外 NetworkExtension</text>
    <text x="812" y="36" fill="#be123c" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">jktcp 0.1.7 + tokio</text>
  </g>

  <!-- L2: CoreDevice RemotePairing & TLS-PSK -->
  <g transform="translate(84, 412)">
    <rect x="0" y="0" width="832" height="64" fill="#f8fafc"/>
    <line x1="0" y1="64" x2="832" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="40" y="36" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L2 · SEC</text>
    <text x="84" y="28" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">CoreDevice RemotePairing 配对与 TLS-PSK 加密隧道</text>
    <text x="84" y="48" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">OPACK + TLV8 + SRP-6a 六位码握手 · Curve25519 / Ed25519 签名 · 设备级 Keychain 锁死</text>
    <text x="812" y="36" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">tls_psk_handshake</text>
  </g>

  <!-- L1: RC_IFBOUND & LocalDevVPN -->
  <g transform="translate(84, 476)">
    <rect x="0" y="0" width="832" height="64" rx="6" fill="#ffffff"/>
    <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="40" y="36" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L1 · NIC</text>
    <text x="84" y="28" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">RC_IFBOUND 强网卡索引绑定与 LocalDevVPN 虚拟回环</text>
    <text x="84" y="48" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">锁定唯一持有 10.7.1.1 的 utun 索引并回读校验套接字 · 与全流量 Personal VPN 并存零抢路由</text>
    <text x="812" y="36" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">10.7.1.1 -&gt; 10.7.0.1</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="560" x2="920" y2="560" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(40, 572)">
    <text x="0" y="14" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LEGEND</text>
    <rect x="76" y="3" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">沙盒破局焦点层（jktcp 用户态协议栈）</text>
    <rect x="336" y="3" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="358" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">Swift / Rust 跨语言 ABI 边界</text>
    <rect x="556" y="3" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="578" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">标准协议封装与传输层（iOS 27+）</text>
  </g>
</svg>
