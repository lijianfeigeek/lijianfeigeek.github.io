<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockxy-ai-traffic-inspector-flow-title rockxy-ai-traffic-inspector-flow-desc">
  <title id="rockxy-ai-traffic-inspector-flow-title">Rockxy AI 流量检查器流式解析与语义提纯工作流</title>
  <desc id="rockxy-ai-traffic-inspector-flow-desc">捕获 LLM 接口，经协议识别网关分流处理 SSE 与 NDJSON，实时增量流渲染并提取 Token 消耗、Tool Calls 与速率限制</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="ai-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1: Ingestion -->
  <g transform="translate(40, 140)">
    <rect width="160" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="30" text-anchor="middle" class="label-title">捕获 AI 请求</text>
    <text x="80" y="50" text-anchor="middle" class="text-body">OpenAI / Claude</text>
    <text x="80" y="68" text-anchor="middle" class="text-body">DeepSeek / Ollama</text>
  </g>

  <!-- Flow 1 to Gateway -->
  <path d="M 200 185 L 238 185" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>

  <!-- Step 2: Protocol Gateway -->
  <g transform="translate(240, 130)">
    <rect width="130" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="44" text-anchor="middle" class="label-title">协议识别</text>
    <text x="65" y="64" text-anchor="middle" class="label-title">网关</text>
    <text x="65" y="86" text-anchor="middle" class="tag-coral">Content-Type</text>
  </g>

  <!-- Split paths -->
  <!-- Top: SSE -->
  <path d="M 370 160 L 418 105" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>
  <!-- Bottom: NDJSON -->
  <path d="M 370 210 L 418 265" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>

  <!-- Step 3A: SSE Assembler -->
  <g transform="translate(420, 60)">
    <rect width="170" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-title">SSE 分块动态拼装器</text>
    <text x="16" y="48" class="text-code">text/event-stream</text>
    <text x="16" y="66" class="text-body">增量组装 data: {"..."}</text>
  </g>

  <!-- Step 3B: NDJSON Parser -->
  <g transform="translate(420, 230)">
    <rect width="170" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-title">NDJSON 结构解析器</text>
    <text x="16" y="48" class="text-code">application/x-ndjson</text>
    <text x="16" y="66" class="text-body">逐行拆解 JSON 记录</text>
  </g>

  <!-- Convergence to Step 4 -->
  <path d="M 590 100 L 638 160" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>
  <path d="M 590 270 L 638 210" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>

  <!-- Step 4: Stream Rendering &amp; Extraction (Focal) -->
  <g transform="translate(640, 140)">
    <rect width="130" height="90" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="65" y="32" text-anchor="middle" class="label-title" fill="#9a3412">实时增量流</text>
    <text x="65" y="52" text-anchor="middle" class="label-title" fill="#9a3412">渲染与提纯</text>
    <text x="65" y="72" text-anchor="middle" class="tag-coral">单行动态收敛</text>
  </g>

  <!-- Out to 4 Semantic Cards -->
  <path d="M 770 185 L 808 60" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>
  <path d="M 770 185 L 808 140" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>
  <path d="M 770 185 L 808 230" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>
  <path d="M 770 185 L 808 310" stroke="#64748b" stroke-width="1.5" marker-end="url(#ai-arrow)"/>

  <!-- 4 Semantic Output Cards -->
  <!-- Card 1: Token Usage -->
  <g transform="translate(810, 30)">
    <rect width="120" height="60" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="60" y="24" text-anchor="middle" class="label-title" fill="#0369a1">Token 消耗统计</text>
    <text x="60" y="44" text-anchor="middle" class="text-body" fill="#0284c7">Prompt/Compl.</text>
  </g>

  <!-- Card 2: Tool Calls -->
  <g transform="translate(810, 110)">
    <rect width="120" height="60" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
    <text x="60" y="24" text-anchor="middle" class="label-title" fill="#15803d">Tool Calls 解析</text>
    <text x="60" y="44" text-anchor="middle" class="text-body" fill="#16a34a">参数校验与抓取</text>
  </g>

  <!-- Card 3: Retrieval Hints -->
  <g transform="translate(810, 190)">
    <rect width="120" height="60" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
    <text x="60" y="24" text-anchor="middle" class="label-title" fill="#a16207">知识召回标注</text>
    <text x="60" y="44" text-anchor="middle" class="text-body" fill="#854d0e">RAG 引用源定位</text>
  </g>

  <!-- Card 4: Rate Limit -->
  <g transform="translate(810, 270)">
    <rect width="120" height="60" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
    <text x="60" y="24" text-anchor="middle" class="label-title" fill="#b91c1c">限流与错误监控</text>
    <text x="60" y="44" text-anchor="middle" class="text-body" fill="#dc2626">429 / TPM 告警</text>
  </g>
</svg>