<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="env-gap-title env-gap-desc" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;">
  <title id="env-gap-title">MAMUBench 四大环境：单代理协调者与多用户点对点团队表现落差</title>
  <desc id="env-gap-desc">哑铃图对比了在 API Key、Merge Queue、Clinic 与 Personal Assistant 四个共享资源环境中，单代理协调者（实心珊瑚点）与每用户一个代理的点对点团队（空心灰蓝点）达成最优群体结果百分比的显著落差。</desc>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="540" fill="#f8fafc"/>
  <rect x="1" y="1" width="998" height="538" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">Worse Together：四大环境群体最优达成率对比（协调者 vs 点对点团队）</text>
    <text x="0" y="22" font-size="12" fill="#64748b">空心点为各用户独立代理组成的 Peer-to-Peer 团队，实心珊瑚点为单一协调者控制组（数据来源：Anthropic MAMUBench）</text>
  </g>

  <!-- Vertical Gridlines & X-Axis (x: 240 to 940 => 700px = 100%) -->
  <g transform="translate(240, 80)">
    <line x1="0" y1="0" x2="0" y2="352" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="175" y1="0" x2="175" y2="352" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="350" y1="0" x2="350" y2="352" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="525" y1="0" x2="525" y2="352" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="700" y1="0" x2="700" y2="352" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Tick Labels -->
    <text x="0" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-family="ui-monospace, monospace">0%</text>
    <text x="175" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-family="ui-monospace, monospace">25%</text>
    <text x="350" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-family="ui-monospace, monospace">50%</text>
    <text x="525" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-family="ui-monospace, monospace">75%</text>
    <text x="700" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-family="ui-monospace, monospace">100%</text>
    <text x="350" y="394" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">群体最优结果达成率 (% OF OPTIMAL / JOINT SUCCESS)</text>
  </g>

  <!-- Row 1: API Key · Opus 5 (30 vs 64) -->
  <g transform="translate(0, 100)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">API Key · Opus 5</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="450" y1="0" x2="688" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="450" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="688" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="436" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">30%</text>
    <text x="702" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">64% (-34pp)</text>
  </g>

  <!-- Row 2: API Key · Sonnet 5 (12 vs 32) -->
  <g transform="translate(0, 144)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">API Key · Sonnet 5</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="324" y1="0" x2="464" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="324" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="464" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="310" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">12%</text>
    <text x="478" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">32% (-20pp)</text>
  </g>

  <!-- Row 3: Merge Queue · Opus 5 (81 vs 92) -->
  <g transform="translate(0, 188)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Merge Queue · Opus 5</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="807" y1="0" x2="884" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="807" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="884" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="793" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">81%</text>
    <text x="898" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">92%</text>
  </g>

  <!-- Row 4: Merge Queue · Sonnet 5 (78 vs 93) -->
  <g transform="translate(0, 232)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Merge Queue · Sonnet 5</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="786" y1="0" x2="891" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="786" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="891" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="772" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">78%</text>
    <text x="905" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">93%</text>
  </g>

  <!-- Row 5: Clinic (Scattered) · Opus 5 (70.2 vs 84.6) -->
  <g transform="translate(0, 276)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Clinic (分散) · Opus 5</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="731" y1="0" x2="832" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="731" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="832" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="717" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">70.2%</text>
    <text x="846" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">84.6%</text>
  </g>

  <!-- Row 6: Clinic (Scattered) · GPT-5.6-sol (56.9 vs 92.6) -->
  <g transform="translate(0, 320)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Clinic (分散) · GPT-5.6-sol</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="638" y1="0" x2="888" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="638" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="888" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="624" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">56.9%</text>
    <text x="902" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">92.6%</text>
  </g>

  <!-- Row 7: Personal Assistant · Opus 5 (44 vs 88) -->
  <g transform="translate(0, 364)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Personal Asst · Opus 5</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="548" y1="0" x2="856" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="548" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="856" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="534" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">44%</text>
    <text x="870" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">88% (-44pp)</text>
  </g>

  <!-- Row 8: Personal Assistant · Sonnet 5 (37 vs 75) -->
  <g transform="translate(0, 408)">
    <text x="224" y="4" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Personal Asst · Sonnet 5</text>
    <line x1="240" y1="0" x2="940" y2="0" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="499" y1="0" x2="765" y2="0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="499" cy="0" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <circle cx="765" cy="0" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="485" y="4" font-size="11" font-weight="600" fill="#475569" text-anchor="end" font-family="ui-monospace, monospace">37%</text>
    <text x="779" y="4" font-size="11" font-weight="700" fill="#bf4520" text-anchor="start" font-family="ui-monospace, monospace">75% (-38pp)</text>
  </g>

  <!-- Legend Bottom Strip -->
  <g transform="translate(36, 492)">
    <line x1="0" y1="0" x2="928" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="12" cy="24" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <text x="26" y="28" font-size="12" font-weight="600" fill="#334155">Peer-to-Peer 多用户团队（每用户一个独立代理）</text>
    <circle cx="372" cy="24" r="6" fill="#bf4520" stroke="#0f172a" stroke-width="1"/>
    <text x="386" y="28" font-size="12" font-weight="600" fill="#0f172a">Coordinator 单一协调者（全局上下文控制组）</text>
    <text x="928" y="28" font-size="11" fill="#64748b" text-anchor="end">无通信静默团队在 API Key 仅 7%/2%</text>
  </g>
</svg>
