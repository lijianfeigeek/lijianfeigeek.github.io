<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ua-pipe-title ua-pipe-desc">
  <title id="ua-pipe-title">Understand-Anything 七阶段自动化管线与多智能体拓扑</title>
  <desc id="ua-pipe-desc">展示从环境预检、AST分批扫描、多Agent并发抽取、架构审查、逻辑分层、新手导览到Symbol-Loss验证固化的完整执行时序。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #bf4520; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Understand-Anything 七阶段自动化多智能体管线</text>
    <text class="subtitle" x="0" y="20">从 CLI 指令发起，历经物理 AST 预检、并发特征抽取、架构推导、导览生成至符号守卫固化</text>
  </g>

  <!-- Flow Grid: 7 Phases across 2 rows -->
  <!-- Phase 0: Precheck &amp; Worktree Escape -->
  <g transform="translate(48, 86)">
    <rect width="270" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 18)">
      <text class="step-num" x="0" y="0">PHASE 0 &amp; 0.5</text>
      <text class="card-title" x="0" y="16">环境预检与智能忽略</text>
      <text class="card-body" x="0" y="34">• Git Worktree 自动逃逸重定向</text>
      <text class="card-body" x="0" y="48">  (检测 rev-parse 重定向至主仓库)</text>
      <text class="card-body" x="0" y="64">• 继承 .gitignore 生成 .understandignore</text>
      <text class="card-body" x="0" y="78">• 过滤产物与测试多媒体，压缩分析面</text>
      <text class="mono" fill="#2563eb" x="0" y="98">OUTPUT: 清洗后的全工程文件清单</text>
    </g>
  </g>

  <!-- Phase 1: AST Pre-resolution &amp; Batches -->
  <g transform="translate(344, 86)">
    <rect width="270" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 18)">
      <text class="step-num" x="0" y="0">PHASE 1 &amp; 1.5</text>
      <text class="card-title" x="0" y="16">AST 扫描与语义拓扑分批</text>
      <text class="card-body" x="0" y="34">• Tree-sitter WASM 提取全局 importMap</text>
      <text class="card-body" x="0" y="48">• 别名路径与相对引用静态预解析</text>
      <text class="card-body" x="0" y="64">• compute-batches.mjs 依赖聚类分批</text>
      <text class="card-body" x="0" y="78">• 附带跨批次 neighborMap 边界上下文</text>
      <text class="mono" fill="#2563eb" x="0" y="98">OUTPUT: 20~30 文件/批的拓扑任务包</text>
    </g>
  </g>

  <!-- Phase 2: Parallel file-analyzer -->
  <g transform="translate(640, 86)">
    <rect width="272" height="170" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="step-num" fill="#1d4ed8" x="0" y="0">PHASE 2 (核心并行)</text>
      <text class="card-title" fill="#1e40af" x="0" y="16">file-analyzer 并发 Agent 池</text>
      <text class="card-body" x="0" y="34">• 最大 5 个 Worker Agent 并发执行</text>
      <text class="card-body" x="0" y="48">• 抽取 GraphNode (函数/类/概念)</text>
      <text class="card-body" x="0" y="62">• 抽取 GraphEdge (calls/reads/writes)</text>
      <text class="card-body" x="0" y="76">• 标注复杂度等级与语言特性笔记</text>
      <text class="mono" fill="#1d4ed8" x="0" y="96">OUTPUT: 各批次中间态 JSON 片段</text>
    </g>
  </g>

  <!-- Connectors Row 1 -->
  <path d="M 318 171 L 344 171" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="344,171 338,167 338,175" fill="#94a3b8"/>

  <path d="M 614 171 L 640 171" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="640,171 634,167 634,175" fill="#94a3b8"/>

  <!-- Row 2: Phase 3, Phase 4, Phase 5, Phase 6~7 -->
  <!-- Phase 3 &amp; 4: Review &amp; Architecture Analyzer -->
  <g transform="translate(48, 280)">
    <rect width="270" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 18)">
      <text class="step-num" x="0" y="0">PHASE 3 &amp; 4</text>
      <text class="card-title" x="0" y="16">图装配审查与架构分层推导</text>
      <text class="card-body" x="0" y="34">• assemble-reviewer 验证边连通性</text>
      <text class="card-body" x="0" y="48">• 清理悬空引用 (Dangling Edges) 与冲突</text>
      <text class="card-body" x="0" y="64">• architecture-analyzer 结合目录树、语言</text>
      <text class="card-body" x="0" y="78">  与框架知识库，推导架构逻辑层级</text>
      <text class="card-body" x="0" y="92">  (API/Presentation, Domain, Engine, Infra)</text>
      <text class="mono" fill="#2563eb" x="0" y="112">OUTPUT: 统一逻辑分层与拓扑视图</text>
    </g>
  </g>

  <!-- Phase 5: Tour Builder -->
  <g transform="translate(344, 280)">
    <rect width="270" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 18)">
      <text class="step-num" x="0" y="0">PHASE 5</text>
      <text class="card-title" x="0" y="16">tour-builder 新人引导路径</text>
      <text class="card-body" x="0" y="34">• 自动识别项目启动入口 (main/App)</text>
      <text class="card-body" x="0" y="48">• 依据依赖拓扑构建 5~8 步渐进导览</text>
      <text class="card-body" x="0" y="64">• 解释“为什么关键”与“如何串联”</text>
      <text class="card-body" x="0" y="78">• 赋予知识图谱教学与入职培训属性</text>
      <text class="card-body" x="0" y="92">• 帮助新团队成员 30 分钟掌握宏观全局</text>
      <text class="mono" fill="#2563eb" x="0" y="112">OUTPUT: Guided Tour 结构化步骤</text>
    </g>
  </g>

  <!-- Phase 6 &amp; 7: Symbol-Loss Gate &amp; Solidification -->
  <g transform="translate(640, 280)">
    <rect width="272" height="190" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(14, 18)">
      <text class="step-num" fill="#15803d" x="0" y="0">PHASE 6 &amp; 7 (严密门禁)</text>
      <text class="card-title" fill="#14532d" x="0" y="16">符号防漏守卫与图谱固化</text>
      <text class="card-body" fill="#166534" x="0" y="34">• 触发 Symbol-Loss 严苛数学级门禁校验</text>
      <text class="card-body" fill="#166534" x="0" y="48">• 提取 AST 结构指纹写入 fingerprints.json</text>
      <text class="card-body" fill="#166534" x="0" y="64">• 固化输出 .ua/knowledge-graph.json</text>
      <text class="card-body" fill="#166534" x="0" y="78">• 自动启动本地 Vite 高性能只读看板</text>
      <text class="card-body" fill="#166534" x="0" y="92">• 零云端依赖，离线流畅交互与缩放</text>
      <text class="mono" fill="#15803d" x="0" y="112">STATUS: 图谱交付就绪，基线锁定</text>
    </g>
  </g>

  <!-- Inter-row Connector -->
  <path d="M 776 256 L 776 268 L 183 268 L 183 280" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <polygon points="183,280 179,274 187,274" fill="#94a3b8"/>

  <!-- Connectors Row 2 -->
  <path d="M 318 375 L 344 375" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="344,375 338,371 338,379" fill="#94a3b8"/>

  <path d="M 614 375 L 640 375" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="640,375 634,371 634,379" fill="#94a3b8"/>
</svg>