<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ua-onto-title ua-onto-desc">
  <title id="ua-onto-title">Understand-Anything 工业级知识图谱本体模型：27 类节点与 9 维关系边体系</title>
  <desc id="ua-onto-desc">展示涵盖代码层、工程基础设施、业务领域、知识研报与设计系统的 27 类图节点与 38 类图关系的完备本体架构。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Understand-Anything 知识图谱本体模型 (Ontology Schema)</text>
    <text class="subtitle" x="0" y="20">跳出“仅文件与类”的狭隘视角，构建覆盖工业级研发全生命周期的 27 类节点与 9 维边关系网络</text>
  </g>

  <!-- 5 Domain Columns -->
  <!-- Column 1: Code Layer (5 Types) -->
  <g transform="translate(48, 86)">
    <rect width="168" height="280" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="col-header" fill="#1d4ed8" x="0" y="0">1. 代码层 (5 类)</text>
      
      <g transform="translate(0, 16)">
        <text class="mono" fill="#1e40af" x="0" y="14">• file</text>
        <text class="item-desc" x="10" y="26">源码文件 (AST根)</text>
        
        <text class="mono" fill="#1e40af" x="0" y="44">• function</text>
        <text class="item-desc" x="10" y="56">函数 / 方法 / 闭包</text>

        <text class="mono" fill="#1e40af" x="0" y="74">• class</text>
        <text class="item-desc" x="10" y="86">类 / 结构体 / 接口</text>

        <text class="mono" fill="#1e40af" x="0" y="104">• module</text>
        <text class="item-desc" x="10" y="116">逻辑模块 / 包空间</text>

        <text class="mono" fill="#1e40af" x="0" y="134">• concept</text>
        <text class="item-desc" x="10" y="146">核心设计抽象概念</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Infra &amp; Pipeline (8 Types) -->
  <g transform="translate(228, 86)">
    <rect width="176" height="280" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="col-header" fill="#334155" x="0" y="0">2. 工程基础设施 (8 类)</text>
      
      <g transform="translate(0, 16)">
        <text class="mono" fill="#0f172a" x="0" y="14">• config</text>
        <text class="item-desc" x="10" y="25">环境与配置项</text>

        <text class="mono" fill="#0f172a" x="0" y="40">• document</text>
        <text class="item-desc" x="10" y="51">架构设计与开发文档</text>

        <text class="mono" fill="#0f172a" x="0" y="66">• service</text>
        <text class="item-desc" x="10" y="77">外部微服务 / SDK</text>

        <text class="mono" fill="#0f172a" x="0" y="92">• table / db</text>
        <text class="item-desc" x="10" y="103">数据库表与实体映射</text>

        <text class="mono" fill="#0f172a" x="0" y="118">• endpoint</text>
        <text class="item-desc" x="10" y="129">HTTP / RPC API 端点</text>

        <text class="mono" fill="#0f172a" x="0" y="144">• pipeline</text>
        <text class="item-desc" x="10" y="155">CI/CD 构建发布流程</text>

        <text class="mono" fill="#0f172a" x="0" y="170">• schema</text>
        <text class="item-desc" x="10" y="181">Proto / JSON 传输协议</text>

        <text class="mono" fill="#0f172a" x="0" y="196">• resource</text>
        <text class="item-desc" x="10" y="207">云资源 / 队列 / 存储桶</text>
      </g>
    </g>
  </g>

  <!-- Column 3: Business Domain (3 Types) -->
  <g transform="translate(416, 86)">
    <rect width="160" height="280" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="col-header" fill="#b45309" x="0" y="0">3. 业务领域 (3 类)</text>
      
      <g transform="translate(0, 16)">
        <text class="mono" fill="#92400e" x="0" y="14">• domain</text>
        <text class="item-desc" x="10" y="28">业务领域上下文 (DDD)</text>

        <text class="mono" fill="#92400e" x="0" y="48">• flow</text>
        <text class="item-desc" x="10" y="62">端到端业务主流程</text>

        <text class="mono" fill="#92400e" x="0" y="82">• step</text>
        <text class="item-desc" x="10" y="96">流程具体执行步骤</text>
      </g>
    </g>
  </g>

  <!-- Column 4: Knowledge Wiki (5 Types) -->
  <g transform="translate(588, 86)">
    <rect width="164" height="280" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="col-header" fill="#6d28d9" x="0" y="0">4. 知识库与研报 (5 类)</text>
      
      <g transform="translate(0, 16)">
        <text class="mono" fill="#5b21b6" x="0" y="14">• article</text>
        <text class="item-desc" x="10" y="26">Wiki / 研报深度长文</text>

        <text class="mono" fill="#5b21b6" x="0" y="44">• entity</text>
        <text class="item-desc" x="10" y="56">核心业务与行业实体</text>

        <text class="mono" fill="#5b21b6" x="0" y="74">• topic</text>
        <text class="item-desc" x="10" y="86">聚合研究主题板块</text>

        <text class="mono" fill="#5b21b6" x="0" y="104">• claim</text>
        <text class="item-desc" x="10" y="116">核心论点与假设</text>

        <text class="mono" fill="#5b21b6" x="0" y="134">• source</text>
        <text class="item-desc" x="10" y="146">外部权威引证来源</text>
      </g>
    </g>
  </g>

  <!-- Column 5: Design System (6 Types) -->
  <g transform="translate(764, 86)">
    <rect width="148" height="280" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="col-header" fill="#15803d" x="0" y="0">5. 设计系统 (6 类)</text>
      
      <g transform="translate(0, 16)">
        <text class="mono" fill="#166534" x="0" y="14">• page / screen</text>
        <text class="item-desc" x="10" y="26">前端视图与屏幕页面</text>

        <text class="mono" fill="#166534" x="0" y="44">• component</text>
        <text class="item-desc" x="10" y="56">UI 控件与通用组件</text>

        <text class="mono" fill="#166534" x="0" y="74">• token</text>
        <text class="item-desc" x="10" y="86">色彩、间距等设计变量</text>

        <text class="mono" fill="#166534" x="0" y="104">• variant</text>
        <text class="item-desc" x="10" y="116">组件交互状态多态</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: 9 Dimensions of Edges (Relationships) -->
  <g transform="translate(48, 380)">
    <rect width="864" height="100" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <g transform="translate(16, 14)">
      <text class="col-header" fill="#7e22ce" x="0" y="0">图谱 9 维边关系系统 (38 类 Edge Types 贯穿全域拓扑)</text>
      <text class="card-body" x="0" y="20">• 结构级 (Structural): imports, exports, contains, inherits, implements —— 表达编译期静态代码骨架</text>
      <text class="card-body" x="0" y="38">• 行为与数据流 (Behavioral &amp; Data): calls, publishes, subscribes, reads_from, writes_to, transforms —— 运行时真实调用流</text>
      <text class="card-body" x="0" y="56">• 依赖与部署 (Dependencies &amp; Infra): depends_on, tested_by, configures, deploys, serves, provisions, triggers —— 运维与工程矩阵</text>
      <text class="card-body" x="0" y="74">• 业务与知识引证 (Domain &amp; Knowledge): contains_flow, flow_step, cross_domain, cites, contradicts, builds_on —— 业务模型与论点链</text>
    </g>
  </g>
</svg>