<svg width="960" height="330" viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polylane-jev-decision-primitives-title polylane-jev-decision-primitives-desc">
  <title id="polylane-jev-decision-primitives-title">TypeSafe Jev 三大核心决策原语架构</title>
  <desc id="polylane-jev-decision-primitives-desc">展示 State 和 Questions 输入经过 Jev 核心输出 Noul、Choice 和 Score 三大强类型裁决原语</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-accent { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="330" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Inputs Container -->
  <g transform="translate(24, 24)">
    <rect width="250" height="280" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="30" class="label-title">结构化决策输入 (Inputs)</text>

    <!-- State Box -->
    <g transform="translate(16, 48)">
      <rect width="218" height="96" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="24" class="label-title" font-size="13">State (事实上下文)</text>
      <text x="12" y="44" class="text-code">• 消息内容 / Slack 讨论</text>
      <text x="12" y="64" class="text-code">• Git PR 差异与提交日志</text>
      <text x="12" y="84" class="text-code">• 遥测告警与云依赖拓扑</text>
    </g>

    <!-- Questions Box -->
    <g transform="translate(16, 160)">
      <rect width="218" height="104" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="24" class="label-title" font-size="13">Questions (强类型模式)</text>
      <text x="12" y="44" class="text-code">• 预定义裁决问题清单</text>
      <text x="12" y="64" class="text-code">• 单项细粒度 Criteria 规则</text>
      <text x="12" y="84" class="text-code">• 零自然语言提示词包裹</text>
    </g>
  </g>

  <!-- Middle Connector &amp; Jev Core -->
  <g transform="translate(306, 24)">
    <!-- Arrows from inputs -->
    <path d="M -16 96 L 24 140" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M -16 212 L 24 140" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- Jev Core Card -->
    <g transform="translate(24, 60)">
      <rect width="240" height="160" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="16" y="32" class="label-title" fill="#9a3412" font-size="15">TypeSafe Jev 裁决核心</text>
      <text x="16" y="56" class="text-body" fill="#7c2d12">面向微决策的 System 1 专用引擎</text>

      <line x1="16" y1="72" x2="224" y2="72" stroke="#fed7aa" stroke-width="1"/>

      <text x="16" y="94" class="text-code" fill="#9a3412">• 彻底消灭自回归文本生成</text>
      <text x="16" y="114" class="text-code" fill="#9a3412">• 70ms ~ 500ms 快速推理</text>
      <text x="16" y="134" class="text-code" fill="#9a3412">• 零输出 Token 计费</text>
      <text x="16" y="150" class="text-code" fill="#9a3412">• 真实可信的先验概率分布</text>
    </g>
  </g>

  <!-- Right: 3 Primitives -->
  <g transform="translate(600, 24)">
    <!-- Branch Connector lines -->
    <path d="M -14 140 L 16 55" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="12,52 18,58 20,53" fill="#9ca3af"/>

    <path d="M -14 140 L 16 140" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="12,137 18,140 12,143" fill="#9ca3af"/>

    <path d="M -14 140 L 16 225" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="12,228 18,222 20,227" fill="#9ca3af"/>

    <!-- Primitive 1: Noul -->
    <g transform="translate(24, 16)">
      <rect width="310" height="76" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="16" y="24" class="label-title" fill="#0284c7">1. Noul 原语（二元决策判定）</text>
      <text x="16" y="44" class="text-body">输出 Yes 的严格置信概率（如 P = 0.87）</text>
      <text x="16" y="64" class="text-code" fill="#0369a1">支持写纯数学网关: if (P &gt; 0.8) wake_agent()</text>
    </g>

    <!-- Primitive 2: Choice -->
    <g transform="translate(24, 102)">
      <rect width="310" height="76" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="16" y="24" class="label-title" fill="#bf4520">2. Choice 原语（受限多分类）</text>
      <text x="16" y="44" class="text-body">从受限候选集中遴选单项，挂载独立 Criteria</text>
      <text x="16" y="64" class="text-code" fill="#9a3412">事故跨实体因果归因 / 错误责任人研判</text>
    </g>

    <!-- Primitive 3: Score -->
    <g transform="translate(24, 188)">
      <rect width="310" height="76" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="16" y="24" class="label-title" fill="#059669">3. Score 原语（序数阶梯评估）</text>
      <text x="16" y="44" class="text-body">基于概率加权返回期望分值（0.0 ~ 5.0）</text>
      <text x="16" y="64" class="text-code" fill="#047857">云资产拓扑风险定级 / 告警爆炸模糊排序</text>
    </g>
  </g>
</svg>