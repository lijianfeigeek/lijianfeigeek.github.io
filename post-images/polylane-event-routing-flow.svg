<svg width="960" height="250" viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polylane-event-routing-flow-title polylane-event-routing-flow-desc">
  <title id="polylane-event-routing-flow-title">基于 Jev Noul 的事件二元置信路由流程</title>
  <desc id="polylane-event-routing-flow-desc">外部事件通过 Jev Noul 计算概率，超过阈值唤醒 Agent，低于阈值零成本忽略</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="250" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1: External Event -->
  <g transform="translate(24, 50)">
    <rect width="180" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="32" class="label-title">1. 外部实时事件</text>
    <line x1="16" y1="46" x2="164" y2="46" stroke="#f3f4f6" stroke-width="1"/>
    <text x="16" y="70" class="text-code">• PR 代码审查评论</text>
    <text x="16" y="96" class="text-code">• Slack/Teams 聊天</text>
    <text x="16" y="122" class="text-code">• 监控报警突发触发</text>
    <text x="16" y="146" class="text-code">• Webhook 回调推送</text>
  </g>

  <!-- Arrow -->
  <path d="M 204 125 L 244 125" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="244,122 250,125 244,128" fill="#9ca3af"/>

  <!-- Step 2: Jev Noul Gate (Coral Accent) -->
  <g transform="translate(250, 40)">
    <rect width="280" height="170" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="16" y="32" class="label-title" fill="#9a3412">2. Jev Noul 二元置信裁决</text>
    <line x1="16" y1="46" x2="264" y2="46" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="70" class="text-body" fill="#7c2d12">提问："Agent 是否需要介入跟进？"</text>
    <text x="16" y="94" class="text-code" fill="#9a3412">输出校准概率: P(followup)</text>
    
    <g transform="translate(16, 114)">
      <rect width="248" height="42" rx="4" fill="#ffedd5"/>
      <text x="10" y="20" class="text-code" fill="#9a3412">P90 响应: 472ms (提速 3.1 倍)</text>
      <text x="10" y="34" class="text-code" fill="#9a3412">千次成本: $0.123 (降低 48.3%)</text>
    </g>
  </g>

  <!-- Split Connectors -->
  <path d="M 530 100 L 580 80" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="578,76 584,80 579,84" fill="#10b981"/>

  <path d="M 530 150 L 580 170" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="578,166 584,170 579,174" fill="#9ca3af"/>

  <!-- Step 3A: Wake Agent -->
  <g transform="translate(584, 40)">
    <rect width="350" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="16" y="28" class="label-title" fill="#065f46">Yes: P(followup) &gt; 阈值 (如 0.80)</text>
    <text x="16" y="48" class="text-body" fill="#047857">立即唤醒 Agent 执行后续处理与工单调度</text>
    <text x="16" y="66" class="text-code" fill="#059669">装载完整对话历史，调取自动化排障工具</text>
  </g>

  <!-- Step 3B: Silent Drop -->
  <g transform="translate(584, 136)">
    <rect width="350" height="74" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="28" class="label-title" fill="#6b7280">No: P(followup) &lt;= 阈值</text>
    <text x="16" y="48" class="text-body" fill="#6b7280">保持静默旁观，零计算开销直接忽略</text>
    <text x="16" y="66" class="text-code" fill="#9ca3af">杜绝噪声打扰，消除无意义的 Token 账单</text>
  </g>
</svg>