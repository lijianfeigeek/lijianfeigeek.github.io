<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="two-core-link-magnets-title two-core-link-magnets-desc" id="two-core-link-magnets-root">
        <title id="two-core-link-magnets-title">天然外链引力：两大核心外链磁铁（Link Magnet）形态</title>
        <desc id="two-core-link-magnets-desc">独家基准实测数据（记者与评测博主自发引用）与免登录轻量微工具（导航站主动收录推荐）</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #two-core-link-magnets-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #two-core-link-magnets-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #two-core-link-magnets-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="two-core-link-magnets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="two-core-link-magnets-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="two-core-link-magnets-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <g transform="translate(60, 40)">
          <rect x="0" y="0" width="380" height="240" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="380" height="32" rx="8" fill="#bf4520" fill-opacity="0.08"/>
          <text x="14" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">ASSET A · 独家基准测试与实测数据 (FOCAL)</text>
          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#bf4520" font-family="'Geist', sans-serif" font-size="14" font-weight="600">Benchmark &amp; Original Research</text>
            <text x="0" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12">基于真实 40 页课件的提取速度与精度全量评测</text>
            <text x="0" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">引力机制：</text>
            <text x="0" y="90" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 科技记者、评测博主在撰写综述时急需权威第三方数据</text>
            <text x="0" y="110" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 自发作为第一手信源给予高权重 DoFollow 链接</text>
            <text x="0" y="140" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11">产出：行业核心事实标准，长期被引</text>
          </g>
        </g>

        <g transform="translate(520, 40)">
          <rect x="0" y="0" width="380" height="240" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
          <rect x="0" y="0" width="380" height="32" rx="8" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="14" y="21" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">ASSET B · 解决痛点的免登录轻量微工具</text>
          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="14" font-weight="600">Free Lightweight Micro-Tools</text>
            <text x="0" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12">3 秒开箱即用，零注册门槛解决单一具体痛点</text>
            <text x="0" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">引力机制：</text>
            <text x="0" y="90" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 各类工具导航站、大学生期末复习宝藏清单自发收录</text>
            <text x="0" y="110" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 在 Reddit、V2EX、社交媒体形成口碑裂变</text>
            <text x="0" y="140" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11">产出：源源不断的广泛自然引用域名</text>
          </g>
        </g>
      </svg>
