<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futu-tiger-insider-trading-four-elements-gap-title futu-tiger-insider-trading-four-elements-gap-desc">
  <title id="futu-tiger-insider-trading-four-elements-gap-title">美国证券法内幕交易法定构成四连环 vs 做市商证据断链</title>
  <desc id="futu-tiger-insider-trading-four-elements-gap-desc">对比Dirks与Salman判例确立的源头、信义义务背叛、个人利益与知情下注法定要件，与做市商在审理中的全面断链</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="320" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">美国证券法内幕交易法定构成四连环 vs 做市商实际举证断链</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">没有“内部人背叛信义义务”与“个人利益对价”，统计学异常曲线在法庭上绝不能替代法律因果链</text>

  <!-- Step 1: Source -->
  <g transform="translate(40, 80)">
    <rect width="200" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="30" rx="8" fill="#f1f5f9"/>
    <text x="100" y="20" class="card-title" text-anchor="middle">1. 确定性源头 (Source)</text>
    <g transform="translate(14, 42)">
      <text x="0" y="14" class="card-title" fill="#047857">法定构成要件：</text>
      <text x="0" y="30" class="text-sub">谁合法持有重大非公开信息 (MNPI)？</text>
      <line x1="0" y1="50" x2="172" y2="50" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="70" class="badge-coral">⚠️ 做市商实际断链：</text>
      <text x="0" y="90" class="text-sub">• 无法指出中国监管部门内部究竟是谁泄密</text>
      <text x="0" y="118" class="text-sub">• 甚至无法确定信息是经由券商内部流出还是外部传闻</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 185 L 275 185" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Step 2: Breach -->
  <g transform="translate(270, 80)">
    <rect width="200" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="30" rx="8" fill="#f1f5f9"/>
    <text x="100" y="20" class="card-title" text-anchor="middle">2. 违背信义义务 (Breach)</text>
    <g transform="translate(14, 42)">
      <text x="0" y="14" class="card-title" fill="#047857">法定构成要件：</text>
      <text x="0" y="30" class="text-sub">内部人恶意背叛了法定保密职责</text>
      <line x1="0" y1="50" x2="172" y2="50" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="70" class="badge-coral">⚠️ 做市商实际断链：</text>
      <text x="0" y="90" class="text-sub">• 偶然听到未公开信息并不违法</text>
      <text x="0" y="118" class="text-sub">• 无法证明泄密源存在向外非法传递的保密违约事实</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 475 185 L 505 185" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Step 3: Benefit -->
  <g transform="translate(500, 80)">
    <rect width="200" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="30" rx="8" fill="#f1f5f9"/>
    <text x="100" y="20" class="card-title" text-anchor="middle">3. 个人利益对价 (Benefit)</text>
    <g transform="translate(14, 42)">
      <text x="0" y="14" class="card-title" fill="#047857">法定构成要件：</text>
      <text x="0" y="30" class="text-sub">泄密者换取了金钱、回扣或私利</text>
      <line x1="0" y1="50" x2="172" y2="50" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="70" class="badge-coral">⚠️ 做市商实际断链：</text>
      <text x="0" y="90" class="text-sub">• 无法提供源头与 45 人之间的直接利益输送</text>
      <text x="0" y="118" class="text-sub">• 没有银行流水、对价合同或人情利益对价佐证</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M 705 185 L 735 185" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Step 4: Tippee Scienter (Focal Coral) -->
  <g transform="translate(730, 80)">
    <rect width="190" height="210" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="190" height="30" rx="8" fill="#ffedd5"/>
    <text x="95" y="20" class="badge-coral" text-anchor="middle">4. 下游知情 (Scienter)</text>
    <g transform="translate(14, 42)">
      <text x="0" y="14" class="card-title" fill="#047857">法定构成要件：</text>
      <text x="0" y="30" class="text-sub">交易者明知源头非法</text>
      <line x1="0" y1="50" x2="162" y2="50" stroke="#fed7aa" stroke-width="1"/>
      <text x="0" y="70" class="badge-coral">⚠️ 做市商实际证据：</text>
      <text x="0" y="90" class="text-sub">• 零微信聊天记录</text>
      <text x="0" y="106" class="text-sub">• 零电话录音与邮件</text>
      <text x="0" y="128" class="badge-coral">仅凭一张下单时点分布图，彻底在审判席塌陷</text>
    </g>
  </g>
</svg>