<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="ivyclaw-traps-pillars-title ivyclaw-traps-pillars-desc">
  <title id="ivyclaw-traps-pillars-title">SWE Agent 传统原型崩溃点与 IvyClaw 生产级解题支柱对比</title>
  <desc id="ivyclaw-traps-pillars-desc">对比传统Agent在角色混乱、上下文膨胀、Prompt弱约束、同步阻塞与治理缺失上的崩溃点，以及IvyClaw五大工程解题支柱</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 4; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Left Column: Traditional Traps (x=40, y=40, w=420, h=380) -->
  <g transform="translate(40, 40)">
    <rect width="420" height="380" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 44 L 0 44 Z" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="16" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">传统 Agent 原型的五大崩溃点 (Antipatterns)</text>

    <!-- Trap 1 -->
    <g transform="translate(16, 56)">
      <rect width="388" height="54" class="pill" />
      <text x="12" y="20" class="text-subtitle" fill="#991b1b">1. 单体角色混乱 (既当裁判又当运动员)</text>
      <text x="12" y="38" class="text-muted">同一模型自编自测自审，陷入自我确认偏见，盲点完全失防</text>
    </g>

    <!-- Trap 2 -->
    <g transform="translate(16, 118)">
      <rect width="388" height="54" class="pill" />
      <text x="12" y="20" class="text-subtitle" fill="#991b1b">2. 上下文无限膨胀 (Token 泥潭与注意力溃散)</text>
      <text x="12" y="38" class="text-muted">长轮次历史与终端海量报错堆叠，严重挤占预算，关键指令丢失</text>
    </g>

    <!-- Trap 3 -->
    <g transform="translate(16, 180)">
      <rect width="388" height="54" class="pill" />
      <text x="12" y="20" class="text-subtitle" fill="#991b1b">3. Prompt 弱约束幻觉 (纸糊的安全边界)</text>
      <text x="12" y="38" class="text-muted">仅凭提示词叮嘱"请勿修改文件"，模型仍会调用 Shell 意外篡改</text>
    </g>

    <!-- Trap 4 -->
    <g transform="translate(16, 242)">
      <rect width="388" height="54" class="pill" />
      <text x="12" y="20" class="text-subtitle" fill="#991b1b">4. 长任务同步阻塞 (HTTP 连接频繁超时)</text>
      <text x="12" y="38" class="text-muted">真实单测与重构耗时数分钟，缺乏异步队列解耦，极易引发 504</text>
    </g>

    <!-- Trap 5 -->
    <g transform="translate(16, 304)">
      <rect width="388" height="54" class="pill" />
      <text x="12" y="20" class="text-subtitle" fill="#991b1b">5. 缺乏租户与成本治理 (运维监控黑洞)</text>
      <text x="12" y="38" class="text-muted">异常死循环打爆下游 API，多租户互相抢占，算力开销无法归因</text>
    </g>
  </g>

  <!-- Connectors from Left to Right -->
  <line x1="460" y1="123" x2="498" y2="123" class="focal-line" marker-end="url(#arrow1)" />
  <line x1="460" y1="185" x2="498" y2="185" class="focal-line" marker-end="url(#arrow1)" />
  <line x1="460" y1="247" x2="498" y2="247" class="focal-line" marker-end="url(#arrow1)" />
  <line x1="460" y1="309" x2="498" y2="309" class="focal-line" marker-end="url(#arrow1)" />
  <line x1="460" y1="371" x2="498" y2="371" class="focal-line" marker-end="url(#arrow1)" />

  <!-- Right Column: IvyClaw Pillars (x=500, y=40, w=420, h=380) - Focal -->
  <g transform="translate(500, 40)">
    <rect width="420" height="380" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 44 L 0 44 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="16" y="28" class="text-focal-title">IvyClaw 生产级解题支柱 (Engineering Pillars)</text>

    <!-- Pillar 1 -->
    <g transform="translate(16, 56)">
      <rect width="388" height="54" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">1. 专职子代理分阶工作流 (正交职责解耦)</text>
      <text x="12" y="38" class="text-body">Planner → Researcher → Coder → Tester → Reviewer 五阶分权</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(16, 118)">
      <rect width="388" height="54" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">2. 独立 Thread 与摘要交接协议 (Summary Handoff)</text>
      <text x="12" y="38" class="text-body">各阶段上下文物理隔离，仅向下游交接最后的阶段性契约结论</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(16, 180)">
      <rect width="388" height="54" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">3. 物理级只读沙箱加固 (Kernel chmod a-w)</text>
      <text x="12" y="38" class="text-body">内存流式克隆至独立容器，内核剥夺写权限，哪怕越狱也无权落盘</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(16, 242)">
      <rect width="388" height="54" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">4. Redis + ARQ 异步解耦与长连接信道</text>
      <text x="12" y="38" class="text-body">统一 InboundMessage 契约，支持飞书 WS 免公网部署与任务异步排队</text>
    </g>

    <!-- Pillar 5 -->
    <g transform="translate(16, 304)">
      <rect width="388" height="54" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">5. 动态分级路由与 Prometheus 实时成本度量</text>
      <text x="12" y="38" class="text-body">根据任务角色映射 strong/cheap 档位，多租户限流与实时汇率核算</text>
    </g>
  </g>
</svg>