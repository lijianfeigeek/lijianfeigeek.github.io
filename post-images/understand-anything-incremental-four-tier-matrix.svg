<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="ua-tier-title ua-tier-desc">
  <title id="ua-tier-title">Git Diff + AST 结构指纹四级增量决策矩阵</title>
  <desc id="ua-tier-desc">展示基于文件内容Hash与函数类指纹比对的四级增量更新策略，包括零Token消耗的SKIP级别与精准部分更新机制。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Git Diff + AST 结构指纹四级增量决策矩阵</text>
    <text class="subtitle" x="0" y="20">告别全量重跑，基于 Tree-sitter 结构指纹实现毫秒级“零 Token 消耗”精准分级更新</text>
  </g>

  <!-- Left: Trigger &amp; Extractor -->
  <g transform="translate(48, 86)">
    <rect width="210" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">1. 变更触发与指纹比对</text>

    <g transform="translate(14, 40)">
      <rect width="182" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">Git Commit / Diff 捕获</text>
        <text class="mono" fill="#2563eb" x="0" y="16">git diff --name-status -z</text>
        <text class="card-body" x="0" y="32">• 毫秒级锁定变动文件列表</text>
        <text class="card-body" x="0" y="48">• 过滤忽略目录与非源码资源</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="182" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">提取 AST 结构指纹</text>
        <text class="card-body" x="0" y="16">• contentHash (SHA-256)</text>
        <text class="card-body" x="0" y="32">• 函数名/参数/返回值列表</text>
        <text class="card-body" x="0" y="48">• 类/方法/导出变量集合</text>
        <text class="card-body" x="0" y="64">• imports 导入源与 specifiers</text>
      </g>
    </g>

    <g transform="translate(14, 234)">
      <rect width="182" height="88" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">比对 fingerprints.json</text>
        <text class="card-body" x="0" y="18">• 若仅内部实现微调 -> 装饰性</text>
        <text class="card-body" x="0" y="34">• 若签名/接口改变 -> 结构性</text>
        <text class="mono" fill="#1d4ed8" x="0" y="52">计算变动文件数与目录影响</text>
      </g>
    </g>
  </g>

  <!-- Connector from Stage 1 to Decision Matrix -->
  <path d="M 258 260 L 282 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="282,260 276,256 276,264" fill="#94a3b8"/>

  <!-- Right: 4-Tier Decision Matrix -->
  <g transform="translate(282, 86)">
    <rect width="630" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="20" y="24">2. 四级增量策略矩阵 (Token 成本与执行效率最优解)</text>

    <!-- Tier 1: SKIP -->
    <g transform="translate(20, 36)">
      <rect width="590" height="66" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">【第一级：SKIP】—— 零 Token 消耗！毫秒级直接放行</text>
        <text class="card-body" fill="#166534" x="0" y="18">判定条件：仅注释、空行、代码缩进或函数内部单行重构，函数签名与外部接口 100% 未发生结构性偏移。</text>
        <text class="mono" fill="#15803d" x="0" y="34">ACTION: 本地原子更新 fingerprints.json Hash 值，完全跳过大模型调用，耗时 &lt; 10ms</text>
      </g>
    </g>

    <!-- Tier 2: PARTIAL_UPDATE -->
    <g transform="translate(20, 112)">
      <rect width="590" height="66" rx="6" fill="#e0f2fe" stroke="#0288d1" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#0369a1" x="0" y="0">【第二级：PARTIAL_UPDATE】—— 精准局部派发分析</text>
        <text class="card-body" fill="#075985" x="0" y="18">判定条件：结构性变更文件数 &lt;= 10 个，且项目的顶层目录结构与全局架构层级完全没有变动。</text>
        <text class="mono" fill="#0288d1" x="0" y="34">ACTION: 仅对改动的几个文件派发 file-analyzer 提取节点，保留原有架构分层，就近归类更新</text>
      </g>
    </g>

    <!-- Tier 3: ARCHITECTURE_UPDATE -->
    <g transform="translate(20, 188)">
      <rect width="590" height="66" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#b45309" x="0" y="0">【第三级：ARCHITECTURE_UPDATE】—— 局部分析 + 架构重推导</text>
        <text class="card-body" fill="#92400e" x="0" y="18">判定条件：新增或删除了顶层业务目录，或结构性变更文件数在 10 ~ 30 个之间。</text>
        <text class="mono" fill="#b45309" x="0" y="34">ACTION: 增量重跑受影响文件的 file-analyzer，同时重跑 architecture-analyzer 与 tour-builder</text>
      </g>
    </g>

    <!-- Tier 4: FULL_UPDATE -->
    <g transform="translate(20, 264)">
      <rect width="590" height="66" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#991b1b" x="0" y="0">【第四级：FULL_UPDATE】—— 全量重建管线</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="18">判定条件：结构性变更超过 30 个文件，或全工程核心逻辑发生 50% 以上的颠覆性重构。</text>
        <text class="mono" fill="#b91c1c" x="0" y="34">ACTION: 建议丢弃旧中间态，完整触发 Phase 0~7 完整分析流程，重新生成全量知识图谱</text>
      </g>
    </g>
  </g>
</svg>