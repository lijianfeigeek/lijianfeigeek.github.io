<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 568" width="1100" height="568" role="img" aria-labelledby="layers-title layers-desc" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif;">
  <title id="layers-title">iPadn v2.1.1 五层跨语言全栈技术堆栈</title>
  <desc id="layers-desc">展示 iPadn 从 SwiftUI 交互层、Store 协议与 HTTP Range 探针层、WKWebView Unicorn x86 与 Go WASM 密码学核心层、IPA 编织与回环层到底层 Rust idevice 原生安装层的分层结构。</desc>
  <defs>
    <pattern id="dotGridLayers" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="arrowMargin" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="568" fill="#ffffff"/>
  <rect x="16" y="16" width="1068" height="536" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="16" width="1068" height="536" rx="8" fill="url(#dotGridLayers)"/>

  <!-- Header -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="116" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="58" y="14" text-anchor="middle" fill="#334155" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace" letter-spacing="1">LAYER STACK</text>
    <text x="0" y="44" fill="#0f172a" font-size="20" font-weight="700">iPadn v2.1.1 跨语言五层技术堆栈：Swift · WebKit WASM · Unicorn x86 · Go · Rust</text>
    <text x="0" y="64" fill="#475569" font-size="12">在无越狱与无 JIT 限制的 iOS 沙盒内，通过多层运行时隔离协同打通苹果商店全协议链</text>
  </g>

  <!-- Left Margin Direction Axis -->
  <g transform="translate(44, 132)">
    <text x="20" y="12" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">USER UI</text>
    <line x1="20" y1="24" x2="20" y2="352" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrowMargin)"/>
    <text x="20" y="372" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">KERNEL /</text>
    <text x="20" y="384" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">DAEMON</text>
  </g>

  <!-- Stacked Horizontal Bands (Uniform width=940, height=72, 4px grid) -->
  <g transform="translate(100, 128)">
    <!-- L5 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#f1f5f9"/>
      <text x="38" y="40" text-anchor="middle" fill="#334155" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L5</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">SwiftUI 交互视图与 LiveActivity 实时活动扩展</text>
      <text x="80" y="50" fill="#475569" font-size="11">Search / Discover / 175 国比价 / 下载进度灵动岛 / 配对 PIN 锁屏推送 (iPadnLiveActivity)</text>
      <text x="920" y="32" text-anchor="end" fill="#0284c7" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">SwiftUI + ActivityKit</text>
      <text x="920" y="50" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">AppIntents / BackgroundKeepAlive</text>
    </g>

    <!-- L4 -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#e2e8f0"/>
      <text x="38" y="40" text-anchor="middle" fill="#334155" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L4</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">Apple 商店协议网关与 HTTP Range 零下载探针</text>
      <text x="80" y="50" fill="#475569" font-size="11">GrandSlam 登录与 2FA 刷新 · buyProduct / DownloadDispatch · RemoteZip 仅拉取末尾 64KB 探测旧版图标与大小</text>
      <text x="920" y="32" text-anchor="end" fill="#0284c7" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">AppleService.swift</text>
      <text x="920" y="50" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">VersionMetadataService + RemoteZip</text>
    </g>

    <!-- L3 (FOCAL LAYER) -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="940" height="76" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
      <rect x="16" y="26" width="44" height="24" rx="4" fill="#e11d48"/>
      <text x="38" y="42" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L3</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">FairPlay SAP / StoreProof 异构沙盒与 Mac PKG 解密引擎</text>
      <text x="80" y="50" fill="#9f1239" font-size="11">WKWebView 驱动 Go sap.wasm + Unicorn x86_64 模拟运行 libCoreADI.so · 另附 Go c-archive + Unicorn TCI 解密 Mac .pkg</text>
      <text x="920" y="32" text-anchor="end" fill="#e11d48" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">FOCAL · NO-JIT CRYPTO</text>
      <text x="920" y="50" text-anchor="end" fill="#be123c" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">SAPSigner + MacPKGBridge (bridge.go)</text>
    </g>

    <!-- L2 -->
    <g transform="translate(0, 244)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#f1f5f9"/>
      <text x="38" y="40" text-anchor="middle" fill="#334155" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L2</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">多组件 SINF 授权编织与双模本地 HTTP/TLS 回环服务</text>
      <text x="80" y="50" fill="#475569" font-size="11">按 SC_Info/Manifest.plist 线性注入多扩展 SINF · 写入 iTunesMetadata · LoopbackServer 与 mDNS ipadn.local 兜底</text>
      <text x="920" y="32" text-anchor="end" fill="#0284c7" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">PackageService.swift</text>
      <text x="920" y="50" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">LoopbackServer + LocalHostRecord</text>
    </g>

    <!-- L1 -->
    <g transform="translate(0, 324)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#059669"/>
      <text x="38" y="40" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L1</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">Rust idevice 纯内存驱动与端侧 Mac17,7 无线配对层</text>
      <text x="80" y="50" fill="#065f46" font-size="11">经 LocalDevVPN (10.7.0.1) 建立 TLS-PSK 隧道 → AFC 分块推包 → installation_proxy 下发 Install/Upgrade 与防更新伪装</text>
      <text x="920" y="32" text-anchor="end" fill="#059669" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">Rust idevice 0.1.68</text>
      <text x="920" y="50" text-anchor="end" fill="#047857" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">lib.rs + pairing.rs (RPPairing)</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 534)">
    <text x="0" y="12" fill="#475569" font-size="11">注：L3 密码学核心层采用“非持久化 WKWebView + Unicorn x86 WASM + Go c-archive 无 JIT 解释器”组合，无需苹果禁止的动态代码签名权限。</text>
    <text x="1020" y="12" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">iPadn Architecture Stack</text>
  </g>
</svg>
