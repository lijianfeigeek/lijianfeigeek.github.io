<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="coralGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#ff8e53" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="720" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="672" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Title &amp; Top Header -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="110" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#334155" font-size="11" font-weight="700" letter-spacing="1">SYSTEM TOPOLOGY</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">iPadn 端到端全景系统架构与模块协同图谱</text>
    <text x="0" y="74" fill="#475569" font-size="13">从 App Store 协议逆向、FairPlay SINF 注入到端侧 Lockdownd 免电脑原生覆盖安装全链路</text>
  </g>

  <!-- Layer 1: UI &amp; Interactive Presentation Tier -->
  <g transform="translate(60, 150)">
    <rect width="980" height="96" rx="12" fill="#f8fafc" stroke="#253248" stroke-width="1" />
    <g transform="translate(20, 14)">
      <text x="0" y="16" fill="#0284c7" font-size="12" font-weight="700" letter-spacing="0.5">LAYER 1 · 视图表示与人机交互层 (SwiftUI + LiveActivity)</text>
    </g>
    <!-- Sub-cards -->
    <g transform="translate(20, 36)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="46" rx="8" fill="#f8fafc" stroke="#2b3b55" stroke-width="1" />
        <text x="12" y="20" fill="#e2e8f0" font-size="12" font-weight="600">App Store 原生风格界面</text>
        <text x="12" y="36" fill="#475569" font-size="10">搜索 · 详情 · 已购与下架应用提取</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="46" rx="8" fill="#f8fafc" stroke="#2b3b55" stroke-width="1" />
        <text x="12" y="20" fill="#e2e8f0" font-size="12" font-weight="600">全量历史版本时序链</text>
        <text x="12" y="36" fill="#475569" font-size="10">外部版本 ID (appExtVrsId) 溯源</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="46" rx="8" fill="#f8fafc" stroke="#2b3b55" stroke-width="1" />
        <text x="12" y="20" fill="#e2e8f0" font-size="12" font-weight="600">全球 175 区跨国比价</text>
        <text x="12" y="36" fill="#475569" font-size="10">内购/订阅实时汇率换算矩阵</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(720, 0)">
        <rect width="220" height="46" rx="8" fill="#f8fafc" stroke="#2b3b55" stroke-width="1" />
        <text x="12" y="20" fill="#e2e8f0" font-size="12" font-weight="600">灵动岛/锁屏配对引导</text>
        <text x="12" y="36" fill="#475569" font-size="10">实时活动扩展展示 6 位配对 PIN 码</text>
      </g>
    </g>
  </g>

  <!-- Downward Arrow 1 -->
  <g transform="translate(550, 246)">
    <path d="M 0 0 L 0 16" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="-4,16 4,16 0,22" fill="#38bdf8" />
  </g>

  <!-- Layer 2: Apple Protocol &amp; FairPlay Gateway Tier -->
  <g transform="translate(60, 272)">
    <rect width="980" height="110" rx="12" fill="#f8fafc" stroke="#253248" stroke-width="1" />
    <g transform="translate(20, 14)">
      <text x="0" y="16" fill="#6366f1" font-size="12" font-weight="700" letter-spacing="0.5">LAYER 2 · 协议网关与端侧 FairPlay SAP 密码学计算 (Crypto &amp; Store Gateway)</text>
    </g>
    <!-- Sub-cards -->
    <g transform="translate(20, 36)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="300" height="60" rx="8" fill="#f8fafc" stroke="#2e3d5b" stroke-width="1" />
        <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="600">AppleAuthentication (GrandSlam)</text>
        <text x="14" y="39" fill="#334155" font-size="10">双重认证 2FA · 设备 GUID 生成与切换</text>
        <text x="14" y="52" fill="#475569" font-size="9">X-Apple-ActionSignature / Session Cookies 轮转</text>
      </g>
      <!-- Card 2: SAPSigner Focal Card -->
      <g transform="translate(320, 0)">
        <rect width="320" height="60" rx="8" fill="#faf5ff" stroke="#6366f1" stroke-width="1.5" />
        <rect x="236" y="8" width="72" height="16" rx="4" fill="#4f46e5" />
        <text x="242" y="19" fill="#f8fafc" font-size="9" font-weight="700">CORE CRYPTO</text>
        <text x="14" y="22" fill="#e0e7ff" font-size="12" font-weight="600">SAPSigner (WebKit JS Runtime)</text>
        <text x="14" y="39" fill="#c7d2fe" font-size="10">sapInitialize · sapSign · sapGenerateKBSync</text>
        <text x="14" y="52" fill="#6366f1" font-size="9">隔离沙盒执行 FairPlay 会话签名与 KBSync 凭证</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(660, 0)">
        <rect width="280" height="60" rx="8" fill="#f8fafc" stroke="#2e3d5b" stroke-width="1" />
        <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="600">LoopbackServer (127.0.0.1)</text>
        <text x="14" y="39" fill="#334155" font-size="10">setupCert.plist · signSapSetup 反代</text>
        <text x="14" y="52" fill="#475569" font-size="9">规避 iOS ATS 拦截 · Byte-Range 分片转发</text>
      </g>
    </g>
  </g>

  <!-- Downward Arrow 2 -->
  <g transform="translate(550, 382)">
    <path d="M 0 0 L 0 16" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="-4,16 4,16 0,22" fill="#a855f7" />
  </g>

  <!-- Layer 3: Package Packaging &amp; SINF DRM Reconstruction Tier -->
  <g transform="translate(60, 408)">
    <rect width="980" height="110" rx="12" fill="#f0f9ff" stroke="#253248" stroke-width="1" />
    <g transform="translate(20, 14)">
      <text x="0" y="16" fill="#059669" font-size="12" font-weight="700" letter-spacing="0.5">LAYER 3 · 资产重构与多组件 SINF 授权编织 (PackageService &amp; SINF Weaver)</text>
    </g>
    <g transform="translate(20, 36)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="300" height="60" rx="8" fill="#f0f9ff" stroke="#294056" stroke-width="1" />
        <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="600">Apple CDN 流式下载与校验</text>
        <text x="14" y="39" fill="#334155" font-size="10">直接从苹果官方 CDN 获取原始 Payload</text>
        <text x="14" y="52" fill="#475569" font-size="9">保留真实 SHA-256 校验和与 CodeResources</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(320, 0)">
        <rect width="320" height="60" rx="8" fill="#f0f9ff" stroke="#294056" stroke-width="1" />
        <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="600">多组件 SINF 签名自动编织</text>
        <text x="14" y="39" fill="#334155" font-size="10">解析 SC_Info/Manifest.plist 映射关系</text>
        <text x="14" y="52" fill="#475569" font-size="9">按 SinfPaths 覆盖 WatchKit / AppExtensions / Frameworks</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(660, 0)">
        <rect width="280" height="60" rx="8" fill="#f0f9ff" stroke="#294056" stroke-width="1" />
        <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="600">正版 iTunesMetadata.plist 封装</text>
        <text x="14" y="39" fill="#334155" font-size="10">注入 itemId · DSPersonID · downloadInfo</text>
        <text x="14" y="52" fill="#475569" font-size="9">完全复刻 App Store 官方正版元数据结构</text>
      </g>
    </g>
  </g>

  <!-- Downward Split Arrows -->
  <g transform="translate(300, 518)">
    <path d="M 0 0 L 0 16" stroke="#334155" stroke-width="2" />
    <polygon points="-4,16 4,16 0,22" fill="#64748b" />
  </g>
  <g transform="translate(800, 518)">
    <path d="M 0 0 L 0 16" stroke="#ff8e53" stroke-width="2" />
    <polygon points="-4,16 4,16 0,22" fill="#ff6b6b" />
  </g>

  <!-- Layer 4: Dual Installation Channels Tier -->
  <g transform="translate(60, 544)">
    <rect width="980" height="126" rx="12" fill="#f8fafc" stroke="#253248" stroke-width="1" />
    
    <!-- Channel A (Left): OTA Web Channel -->
    <g transform="translate(20, 16)">
      <rect width="450" height="94" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" fill="#334155" font-size="11" font-weight="700">通道 A · 传统 OTA 清单通道 (itms-services://)</text>
      <text x="14" y="40" fill="#e2e8f0" font-size="12" font-weight="600">Safari / 本机 HTTPS 证书安装 (备用兼容)</text>
      <text x="14" y="58" fill="#ef4444" font-size="10" font-weight="500">× 缺陷 1：强制写入 enterpriseInstallURL，App Store 不认</text>
      <text x="14" y="74" fill="#ef4444" font-size="10" font-weight="500">× 缺陷 2：已装 App 覆盖时触发 ASDErrorDomain 855 报错</text>
      <text x="14" y="88" fill="#475569" font-size="9">适用于越狱/LiveContainer或无法开启本地 VPN 场景</text>
    </g>

    <!-- Channel B (Right): Native Rust Engine Focal Card -->
    <g transform="translate(490, 16)">
      <rect width="470" height="94" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" />
      <rect x="360" y="8" width="96" height="18" rx="4" fill="#e11d48" />
      <text x="368" y="21" fill="#f8fafc" font-size="9" font-weight="700">NATIVE REVOLUTION</text>
      <text x="16" y="20" fill="#e11d48" font-size="11" font-weight="700">通道 B · 端侧 Lockdownd 原生通道 (Rust + LocalDevVPN)</text>
      <text x="16" y="40" fill="#fff1f2" font-size="12" font-weight="600">免电脑直接对话 com.apple.mobile.installation.proxy</text>
      <text x="16" y="58" fill="#059669" font-size="10" font-weight="500">✓ 优势 1：保留全部正版购买凭据，App Store 完美识别与更新</text>
      <text x="16" y="74" fill="#059669" font-size="10" font-weight="500">✓ 优势 2：支持无损原地覆盖已安装 App，100% 保留应用数据</text>
      <text x="16" y="88" fill="#fda4af" font-size="9">基于 10.7.0.1 环回 TUN 隧道 + RPPairing 远程配对 + AFC 分块传输</text>
    </g>
  </g>
</svg>
