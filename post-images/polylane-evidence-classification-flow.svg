<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polylane-evidence-classification-flow-title polylane-evidence-classification-flow-desc">
  <title id="polylane-evidence-classification-flow-title">基于 Jev Choice 的事故线索多维归因流程</title>
  <desc id="polylane-evidence-classification-flow-desc">突发异常事件线索通过 Jev Choice 划分为同根因重复、连带相关或相互独立三种流向</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="260" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Incident Inputs -->
  <g transform="translate(24, 40)">
    <rect width="220" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="32" class="label-title">1. 突发事故线索汇聚</text>
    <line x1="16" y1="46" x2="204" y2="46" stroke="#f3f4f6" stroke-width="1"/>
    <text x="16" y="70" class="text-body">收集上下文线索：</text>
    <text x="16" y="94" class="text-code">• 报错服务：Checkout</text>
    <text x="16" y="118" class="text-code">• 候选关联：Billing 故障</text>
    <text x="16" y="142" class="text-code">• 共有证据：14:00 凭证吊销</text>
    <text x="16" y="166" class="text-code">• 注入 Jev State 对象</text>
  </g>

  <!-- Arrow -->
  <path d="M 244 130 L 284 130" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="284,127 290,130 284,133" fill="#9ca3af"/>

  <!-- Center: Jev Choice Engine -->
  <g transform="translate(290, 40)">
    <rect width="250" height="180" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="16" y="32" class="label-title" fill="#9a3412">2. Jev Choice 语义归因</text>
    <line x1="16" y1="46" x2="234" y2="46" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="70" class="text-body" fill="#7c2d12">对比预设分类 Criteria：</text>
    <text x="16" y="94" class="text-code" fill="#9a3412">• 同根因重复 (Duplicate)</text>
    <text x="16" y="118" class="text-code" fill="#9a3412">• 强因果关联 (Related)</text>
    <text x="16" y="142" class="text-code" fill="#9a3412">• 互不影响 (Independent)</text>
    <g transform="translate(16, 154)">
      <rect width="218" height="20" rx="4" fill="#ffedd5"/>
      <text x="8" y="14" class="text-code" fill="#9a3412">零自回归幻觉 / 强类型输出</text>
    </g>
  </g>

  <!-- Connectors to 3 outcomes -->
  <path d="M 540 85 L 590 60" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="588,57 594,60 589,64" fill="#10b981"/>

  <path d="M 540 130 L 590 130" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="588,127 594,130 588,133" fill="#3b82f6"/>

  <path d="M 540 175 L 590 200" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="588,197 594,200 589,204" fill="#6b7280"/>

  <!-- Right: 3 Branches -->
  <g transform="translate(594, 30)">
    <rect width="340" height="54" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="14" y="22" class="label-title" fill="#065f46" font-size="13">同根因重复 (Duplicate)</text>
    <text x="14" y="42" class="text-code" fill="#047857">合并至已处理主工单，抑制重复警报</text>
  </g>

  <g transform="translate(594, 102)">
    <rect width="340" height="54" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="14" y="22" class="label-title" fill="#1e40af" font-size="13">连带相关 (Related)</text>
    <text x="14" y="42" class="text-code" fill="#1d4ed8">建立双向关联拓扑图谱，共享根因分析</text>
  </g>

  <g transform="translate(594, 174)">
    <rect width="340" height="54" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="22" class="label-title" fill="#4b5563" font-size="13">相互独立 (Independent)</text>
    <text x="14" y="42" class="text-code" fill="#6b7280">开辟全新独立排查工作流，分配专属 Agent</text>
  </g>
</svg>