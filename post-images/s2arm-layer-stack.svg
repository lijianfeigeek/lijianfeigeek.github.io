<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" width="960" height="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s2arm-layer-stack-title s2arm-layer-stack-desc" id="s2arm-layer-stack-root">
  <title id="s2arm-layer-stack-title">S2Arm 0.6.0 五层零 JIT 原生执行与直连图形堆栈</title>
  <desc id="s2arm-layer-stack-desc">展示 S2Arm 如何从统一 iOS/Mac 应用壳、C11 双补丁岛静态二进制改写与 64 GB 地址窗，经由零分配同步 HLE 服务层与 NVN/NVN2 直连翻译层，直达 Apple Silicon Metal 3/4 硬件渲染。</desc>
  <defs>
      <style>#s2arm-layer-stack-root { --color-paper:   #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'PingFang SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Monaco, monospace; }
      #s2arm-layer-stack-root { font-family: var(--font-sans); color: var(--color-ink); }
      #s2arm-layer-stack-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#s2arm-layer-stack-root .diagram-container { overflow-x: visible; }
}</style>
    <marker id="s2arm-layer-stack-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="s2arm-layer-stack-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="s2arm-layer-stack-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#f8fafc"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="26" font-size="16" font-weight="600" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">S2Arm 0.6.0 五层零 JIT 原生执行与直连图形堆栈</text>
    <text x="20" y="44" font-size="9" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">ZERO-JIT AOT REWRITING + DIRECT NVN/NVN2 TO METAL + UNIFIED LIBRARY CONTAINER</text>
    <text x="860" y="32" font-size="9" fill="#2e5aa8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">LAYER STACK</text>
  </g>

  <!-- Left Margin Direction Indicators -->
  <g transform="translate(40, 100)">
    <line x1="20" y1="24" x2="20" y2="220" stroke="#475569" stroke-width="1.2" marker-start="url(#s2arm-layer-stack-arrow)"/>
    <text x="32" y="126" font-size="8" font-weight="600" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.1em">GUEST NSO</text>
    <line x1="20" y1="276" x2="20" y2="484" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#s2arm-layer-stack-arrow-link)"/>
    <text x="32" y="384" font-size="8" font-weight="600" fill="#2e5aa8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.1em">NATIVE HW</text>
  </g>

  <!-- L5: Unified App Shell & Multi-Host Launchers -->
  <g transform="translate(136, 100)">
    <rect x="0" y="0" width="784" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="20" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="36" y="30" font-size="9" font-weight="600" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L5</text>
    <text x="72" y="30" font-size="14" font-weight="600" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">统一单应用容器与多端启动操控层</text>
    <text x="72" y="50" font-size="12" fill="#334155" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">全库共用单一 S2Arm.app、.s2arm 便携归档导出、即时存档快照与手机端 .p12 自签</text>
    <text x="72" y="68" font-size="9" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace">shell/ · ios/cert_import.m · game_export.m (RFC8878 raw zstd) · s2armctl next --json</text>
    <text x="764" y="30" font-size="8" font-weight="600" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">APP &amp; CLI</text>
  </g>

  <!-- L4: FOCAL LAYER - Static Binary Rewriter & 64GB Address Window -->
  <g transform="translate(136, 196)">
    <rect x="0" y="0" width="784" height="148" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="16" y="16" width="40" height="20" rx="2" fill="#fdebe6" stroke="#bf4520" stroke-width="0.8"/>
    <text x="36" y="30" font-size="9" font-weight="600" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L4</text>
    <text x="72" y="30" font-size="14" font-weight="600" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">零 JIT 静态二进制改写与虚拟地址窗核心</text>
    <text x="764" y="30" font-size="8" font-weight="600" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">FOCAL · AOT CORE</text>

    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="368" height="84" rx="6" fill="#ffffff" stroke="#e5a996" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="600" fill="#bf4520" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">C11 双补丁岛与 Apple Silicon 内存序修复</text>
      <text x="16" y="44" font-size="11" fill="#334155" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">前后双岛 ±128 MiB + brk #0xA000 远跳；内嵌数据闭包过滤</text>
      <text x="16" y="64" font-size="9" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace">acq_upgrade (ldxr-&gt;ldaxr) · rel_upgrade (stxr-&gt;stlxr)</text>
    </g>

    <g transform="translate(400, 48)">
      <rect x="0" y="0" width="368" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="600" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">64 GB 地址窗、溢出后备与 2 MiB 远端影子</text>
      <text x="16" y="44" font-size="11" fill="#334155" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">32 MiB 分块按实测预算防 8 GB 强杀；越界访存由影子目录代执行</text>
      <text x="16" y="64" font-size="9" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace">vawin.c (s2a_guest_next_budget) · far.c · sdk_sainit</text>
    </g>
  </g>

  <!-- L3: Zero-Allocation Synchronous HLE Services -->
  <g transform="translate(136, 356)">
    <rect x="0" y="0" width="784" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="20" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="36" y="30" font-size="9" font-weight="600" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L3</text>
    <text x="72" y="30" font-size="14" font-weight="600" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">零分配同线程 Horizon OS 系统服务层</text>
    <text x="72" y="50" font-size="12" fill="#334155" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">经 svc 跳板在客体线程同步直调 Ryujinx HLE，消除跨线程 IPC 与 GC 停顿</text>
    <text x="72" y="68" font-size="9" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace">services/S2A.Services (NativeAOT) · Dispatcher.cs · 0 B/req (nvdrv/fs/audren)</text>
    <text x="764" y="30" font-size="8" font-weight="600" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">HLE SERVICES</text>
  </g>

  <!-- L2: Direct NVN / NVN2 Frontend & Offline Shader Pipeline -->
  <g transform="translate(136, 452)">
    <rect x="0" y="0" width="784" height="84" rx="6" fill="#f1f5f9" stroke="#2e5aa8" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="20" rx="2" fill="#e0e7ff" stroke="#2e5aa8" stroke-width="0.8"/>
    <text x="36" y="30" font-size="9" font-weight="600" fill="#2e5aa8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L2</text>
    <text x="72" y="30" font-size="14" font-weight="600" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">直连图形翻译与离线着色器预热管线</text>
    <text x="72" y="50" font-size="12" fill="#334155" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">接管 nvnBootstrapLoader 直译 NVN / NVN2；离线解包与预编译 26,531 支着色器</text>
    <text x="72" y="68" font-size="9" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace">graphics/nvn (hle_nvn.c · nvn2.h · gal_buf.m) · translator/ (dmsh_xlate · ns2_shaders.py)</text>
    <text x="764" y="30" font-size="8" font-weight="600" fill="#2e5aa8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">DIRECT GFX</text>
  </g>

  <!-- L1: Metal 3/4 & Apple Silicon Hardware Base -->
  <g transform="translate(136, 548)">
    <rect x="0" y="0" width="784" height="80" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="20" rx="2" fill="#0f172a" stroke="#0f172a" stroke-width="0.8"/>
    <text x="36" y="30" font-size="9" font-weight="600" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L1</text>
    <text x="72" y="30" font-size="14" font-weight="600" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">Apple Silicon 裸机硬件与 Metal 3/4 渲染底座</text>
    <text x="72" y="50" font-size="12" fill="#334155" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">物理 ARM64 原生直跑、MTL4FX 队列内补帧、TBDR 带宽削减与 VideoToolbox 硬解</text>
    <text x="72" y="66" font-size="9" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace">nvn_mtl.m · nvn_present_fi.inc · Apple Silicon (iOS 18+ / macOS 15+ · 0.153 J/frame)</text>
    <text x="764" y="30" font-size="8" font-weight="600" fill="#0f172a" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">APPLE SILICON</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 644)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="0" y="20" font-size="8" font-weight="600" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LEGEND</text>
    <rect x="76" y="11" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.2"/>
    <text x="96" y="20" font-size="11" fill="#334155" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">核心突破层（零 JIT 改写与内存窗）</text>
    <rect x="316" y="11" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#2e5aa8" stroke-width="1"/>
    <text x="336" y="20" font-size="11" fill="#334155" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">直连图形路径（默认启手，异常自动退回通用）</text>
    <rect x="616" y="11" width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="636" y="20" font-size="11" fill="#334155" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">通用宿主与硬件底座</text>
  </g>
</svg>
