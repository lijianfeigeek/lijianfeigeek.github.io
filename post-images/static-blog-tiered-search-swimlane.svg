<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="sbs-title sbs-desc" id="sbs-swimlane-root" data-diagram="swimlane">
  <title id="sbs-title">静态博客双层索引与 Web Worker 异步流式检索四域泳道图</title>
  <desc id="sbs-desc">展示从空闲预热 L1 热索引、中文输入法防抖拦截、主线程 1ms 标题大纲直出，到后台 Web Worker 最长词短路扫描 9 个分片并渐进回传高亮摘要的完整协同流程。</desc>
  <defs>
    <pattern id="sbs-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="sbs-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="sbs-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="sbs-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="sbs-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="640" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="640" fill="url(#sbs-dots)"/>
  <rect x="16" y="16" width="968" height="608" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">RUNTIME QUERY LIFECYCLE · TWO-TIER PROGRESSIVE MERGE &amp; STALE ABORT</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">首帧 0.7ms 直出、二次热查 4.1ms：主线程与 Web Worker 四泳道并发协同流</text>
  </g>

  <!-- Swimlane Frame & 4 Horizontal Lanes (y=96..552, lane height=114) -->
  <rect x="36" y="96" width="928" height="456" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="96" width="172" height="456" fill="#f8fafc"/>
  <rect x="208" y="210" width="756" height="114" fill="#f8fafc" opacity="0.55"/>
  <rect x="208" y="438" width="756" height="114" fill="#f8fafc" opacity="0.55"/>
  <line x1="208" y1="96" x2="208" y2="552" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="36" y1="210" x2="964" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="324" x2="964" y2="324" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="438" x2="964" y2="438" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Lane Headers -->
  <g transform="translate(52, 124)">
    <text x="0" y="12" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 01 · USER &amp; IME</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">输入交互与防抖门</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">⌘K Modal · /archives/</text>
  </g>
  <g transform="translate(52, 238)">
    <text x="0" y="12" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 02 · MAIN THREAD</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">L1 热索引与合并器</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">search.js · 6-Tier Score</text>
  </g>
  <g transform="translate(52, 352)">
    <text x="0" y="12" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 03 · WEB WORKER</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">后台流式全文引擎</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">search-worker.js</text>
  </g>
  <g transform="translate(52, 466)">
    <text x="0" y="12" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 04 · STATIC CDN</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">版本化静态资产层</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">Cloudflare / GH Pages</text>
  </g>

  <!-- ==================== ORTHOGONAL CONNECTORS (DRAWN BEFORE NODES) ==================== -->
  <!-- C1: N7 (top 292, 460) -> N2 (bottom 292, 300) Idle Prefetch L1 (clear vertical channel at x=292) -->
  <line x1="292" y1="460" x2="292" y2="300" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sbs-arr-ok)"/>
  <rect x="236" y="368" width="112" height="16" rx="2" fill="#ffffff"/>
  <text x="292" y="379" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IDLE PREFETCH L1</text>

  <!-- C2: N1 (right 384, 152) -> N3 (left 420, 152) -> down into N4? Let's place N1 at x=224..384 y=120, N2 at x=224..384 y=232, N3 at x=420..588 y=232, N4 at x=420..596 y=348, N5 at x=628..784 y=460, N6 at x=640..804 y=232, N8 at x=772..944 y=120 -->
  <!-- N1 (bottom 304, 184) -> N3 (top 492, 232) via r=8 elbow -->
  <path d="M 384 152 L 484 152 Q 492 152 492 160 L 492 232" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sbs-arr-accent)"/>
  <rect x="396" y="130" width="96" height="16" rx="2" fill="#ffffff"/>
  <text x="444" y="141" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TOKENS + REQID</text>

  <!-- C3: N2 (right 384, 266) -> N3 (left 420, 266) -->
  <line x1="384" y1="266" x2="420" y2="266" stroke="#64748b" stroke-width="1.2" marker-end="url(#sbs-arr-muted)"/>

  <!-- C4: N3 (top-right 548, 232) -> N8 (left 772, 144) immediate L1 render -->
  <path d="M 548 232 L 548 144 Q 548 136 556 136 L 772 136" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sbs-arr-accent)"/>
  <rect x="604" y="114" width="112" height="16" rx="2" fill="#ffffff"/>
  <text x="660" y="125" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.7MS L1 FIRST PAINT</text>

  <!-- C5: N3 (bottom 504, 300) -> N4 (top 504, 348) dispatch worker -->
  <line x1="504" y1="300" x2="504" y2="348" stroke="#0284c7" stroke-width="1.3" marker-end="url(#sbs-arr-link)"/>
  <rect x="512" y="314" width="84" height="15" rx="2" fill="#ffffff"/>
  <text x="554" y="324" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SEARCH_BODY</text>

  <!-- C6: N4 (bottom 504, 416) -> N5 (left 620, 494) 3-way fetch chunks -->
  <path d="M 504 416 L 504 486 Q 504 494 512 494 L 620 494" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#sbs-arr-link)"/>
  <rect x="512" y="468" width="96" height="16" rx="2" fill="#ffffff"/>
  <text x="560" y="479" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3X HTTP/2 STREAM</text>

  <!-- C7: N5 (top 708, 460) -> N4 (right 596, 382) return & RAM cache -->
  <path d="M 708 460 L 708 390 Q 708 382 700 382 L 596 382" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#sbs-arr-ok)"/>
  <rect x="616" y="392" width="84" height="15" rx="2" fill="#ffffff"/>
  <text x="658" y="402" fill="#059669" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CACHE IN RAM</text>

  <!-- C8: N4 (right-top 572, 348) -> N6 (bottom 736, 300) stream BODY_BATCH -->
  <path d="M 572 348 L 572 336 Q 572 328 580 328 L 728 328 Q 736 328 736 320 L 736 300" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#sbs-arr-link)"/>
  <rect x="620" y="308" width="84" height="15" rx="2" fill="#ffffff"/>
  <text x="662" y="318" fill="#0284c7" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">BODY_BATCH</text>

  <!-- C9: N6 (top 856, 232) -> N8 (bottom 856, 188) progressive snippet merge -->
  <line x1="856" y1="232" x2="856" y2="188" stroke="#059669" stroke-width="1.3" marker-end="url(#sbs-arr-ok)"/>
  <rect x="864" y="202" width="84" height="15" rx="2" fill="#ffffff"/>
  <text x="906" y="212" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MERGE &amp; MARK</text>

  <!-- ==================== NODES (8 NODES WITHIN BUDGET, ISOLATED <g>) ==================== -->
  <!-- N1: User Input & IME Composition Guard -->
  <g transform="translate(224, 120)">
    <rect x="0" y="0" width="160" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">01 · IME GUARD</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">输入防抖与拼音上屏</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">compositionend · 30ms</text>
  </g>

  <!-- N2: Idle Warmed L1 Store -->
  <g transform="translate(224, 232)">
    <rect x="0" y="0" width="160" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">02 · WARMED META</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">内存预小写化热表</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">titleBlob + metaBlob</text>
  </g>

  <!-- N7: Static L1 JSON on CDN -->
  <g transform="translate(224, 460)">
    <rect x="0" y="0" width="160" height="68" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">CDN · L1 ASSET</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">search-meta.json</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">582 篇 · 216.9KB Gzip</text>
  </g>

  <!-- N3: FOCAL 1 - L1 Instant Scorer -->
  <g transform="translate(420, 232)">
    <rect x="0" y="0" width="168" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">03 · L1 SCORER</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">同步匹配与权重排序</text>
    <text x="12" y="56" fill="#bf4520" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">仅标题模式在此直接结束</text>
  </g>

  <!-- N4: FOCAL 2 - Web Worker Parallel Scanner -->
  <g transform="translate(420, 348)">
    <rect x="0" y="0" width="176" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">04 · WORKER SCANNER</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">最长词优先短路扫描</text>
    <text x="12" y="56" fill="#bf4520" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">旧 reqId 即刻中止 · 热查 4ms</text>
  </g>

  <!-- N5: Static L2 Chunks on CDN -->
  <g transform="translate(620, 460)">
    <rect x="0" y="0" width="184" height="68" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">CDN · L2 CHUNKS (0..8)</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">9 个按时间倒序正文包</text>
    <text x="12" y="56" fill="#0369a1" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">chunk-0 最新文章最先返回</text>
  </g>

  <!-- N6: Progressive Result Merger -->
  <g transform="translate(656, 232)">
    <rect x="0" y="0" width="288" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">05 · STREAMING MERGE &amp; ESCAPE</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">渐进合并去重 + HTML 转义安全高亮</text>
    <text x="12" y="56" fill="#64748b" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">补全前后 60 字上下文片段 · 保持键盘焦点不跳变</text>
  </g>

  <!-- N8: Dual Surface Render -->
  <g transform="translate(772, 120)">
    <rect x="0" y="0" width="172" height="68" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">06 · LIVE VIEWPORT</text>
    <text x="12" y="39" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">弹窗列表 / 归档跨年树</text>
    <text x="12" y="56" fill="#0369a1" font-size="8.8" font-family="'Geist Mono', ui-monospace, monospace">↑↓ 选文 · Enter 直达</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="36" y1="572" x2="964" y2="572" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(36, 590)">
    <rect x="0" y="1" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="18" y="11" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">核心延迟突破点（主线程 &lt;1ms 同步热扫 + 后台 Worker 短路扫描）</text>
  </g>
  <g transform="translate(456, 590)">
    <line x1="0" y1="7" x2="24" y2="7" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="32" y="11" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">首次冷启动网络流（缓存后零网络开销）</text>
  </g>
  <g transform="translate(720, 590)">
    <text x="0" y="11" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">MAX 3 CONCURRENT CHUNKS · ZERO UI JANK</text>
  </g>
</svg>
