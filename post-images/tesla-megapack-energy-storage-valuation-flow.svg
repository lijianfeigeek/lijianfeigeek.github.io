<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="tsla-mega-title tsla-mega-desc">
  <title id="tsla-mega-title">业务二：Megapack 能源存储与光伏估值流转图</title>
  <desc id="tsla-mega-desc">展示特斯拉储能业务从产能扩张、单价保守下调、营收利润推演到给予20倍PE得出630亿美元（17美元/股）的完整估值链路。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .val-large { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">业务二：Megapack 能源存储与光伏估值流转图</text>
    <text class="subtitle" x="0" y="20">被市场低估的工业现金牛：从 130 GWh 部署规模到 630 亿美元公用事业估值推演</text>
  </g>

  <!-- 4 Step Pipeline -->
  <!-- Step 1: Scale -->
  <g transform="translate(48, 86)">
    <rect width="200" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">1. 产能与部署规模</text>

    <g transform="translate(14, 40)">
      <rect width="172" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">现有装机基础</text>
        <text class="val-large" fill="#0288d1" x="0" y="24">46.7 GWh</text>
        <text class="card-body" x="0" y="44">加州 Lathrop 超级工厂投产</text>
      </g>
    </g>

    <g transform="translate(14, 138)">
      <rect width="172" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">上海临港新工厂投产</text>
        <text class="card-body" x="0" y="16">• 名义年产能 40 GWh</text>
        <text class="card-body" x="0" y="32">• 得州奥斯汀扩产储备</text>
        <text class="mono" fill="#0288d1" x="0" y="48">总产能达 116~136 GWh</text>
      </g>
    </g>

    <g transform="translate(14, 236)">
      <rect width="172" height="84" rx="6" fill="#e0f2fe" stroke="#0288d1" stroke-width="1.5"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#0369a1" x="0" y="0">2030 基准部署量</text>
        <text class="val-large" fill="#0288d1" x="0" y="24">130 GWh</text>
        <text class="card-body" fill="#075985" x="0" y="44">保持全球储能领跑地位</text>
      </g>
    </g>
  </g>

  <!-- Step 2: Price &amp; Margin -->
  <g transform="translate(268, 86)">
    <rect width="200" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">2. 单价与利润率假设</text>

    <g transform="translate(14, 40)">
      <rect width="172" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">当前售价基准</text>
        <text class="val-large" fill="#334155" x="0" y="24">232 美元/kWh</text>
        <text class="card-body" x="0" y="44">毛利率高达 20%~25%</text>
      </g>
    </g>

    <g transform="translate(14, 138)">
      <rect width="172" height="84" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">全球竞争降本下调</text>
        <text class="card-body" x="0" y="16">考虑宁德时代/比亚迪竞标</text>
        <text class="val-large" fill="#ea580c" x="0" y="40">190 美元/kWh</text>
        <text class="mono" fill="#c2410c" x="0" y="58">保守降幅: 18%</text>
      </g>
    </g>

    <g transform="translate(14, 236)">
      <rect width="172" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">运营净利率</text>
        <text class="val-large" fill="#16a34a" x="0" y="24">15%</text>
        <text class="card-body" x="0" y="44">扣除运维与折旧纯利润</text>
      </g>
    </g>
  </g>

  <!-- Step 3: Financials -->
  <g transform="translate(488, 86)">
    <rect width="200" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">3. 营业收入与利润测算</text>

    <g transform="translate(14, 40)">
      <rect width="172" height="130" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">2030 年营业收入</text>
        <text class="val-large" fill="#1d4ed8" x="0" y="26">247 亿美元</text>
        <text class="mono" fill="#64748b" x="0" y="44">130 GWh × 190 美元</text>
        <text class="card-body" x="0" y="64">• 占特斯拉总营收近 15%</text>
        <text class="card-body" x="0" y="80">• 工业客户高粘性长约</text>
      </g>
    </g>

    <g transform="translate(14, 190)">
      <rect width="172" height="130" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">归母净利润</text>
        <text class="val-large" fill="#15803d" x="0" y="26">37 亿美元</text>
        <text class="mono" fill="#166534" x="0" y="44">247 亿 × 15% 净利率</text>
        <text class="card-body" fill="#166534" x="0" y="64">• 极具确定性的现金流</text>
        <text class="card-body" fill="#166534" x="0" y="80">• 周期波动低于汽车硬件</text>
      </g>
    </g>
  </g>

  <!-- Step 4: Final SOTP Valuation -->
  <g transform="translate(708, 86)">
    <rect width="204" height="348" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text class="box-title" fill="#92400e" x="14" y="24">4. 板块最终估值定锤</text>

    <g transform="translate(14, 40)">
      <rect width="176" height="130" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#b45309" x="0" y="0">市盈率倍数假设</text>
        <text class="val-large" fill="#b45309" x="0" y="26">20 倍 P/E</text>
        <text class="card-body" x="0" y="46">• 对标成熟公用事业与优质清洁工业企业</text>
        <text class="card-body" x="0" y="66">• 兼顾高成长与周期防御</text>
      </g>
    </g>

    <g transform="translate(14, 190)">
      <rect width="176" height="130" rx="6" fill="#fff3e0" stroke="#f97316" stroke-width="1.5"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">2030 板块总市值</text>
        <text class="val-large" fill="#ea580c" x="0" y="26">630 亿美元</text>
        <text class="card-title" fill="#9a3412" x="0" y="52">折合每股: 17 美元</text>
        <text class="mono" fill="#c2410c" x="0" y="70">SOTP 占比: 3.2%</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 248 260 L 268 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="268,260 262,256 262,264" fill="#94a3b8"/>

  <path d="M 468 260 L 488 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="488,260 482,256 482,264" fill="#94a3b8"/>

  <path d="M 688 260 L 708 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="708,260 702,256 702,264" fill="#94a3b8"/>
</svg>