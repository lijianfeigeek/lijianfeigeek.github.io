<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="sayall-atvv-title sayall-atvv-desc">
  <title id="sayall-atvv-title">SayAll 无线麦 ATVV 语音解码与 USB 驱动伪装数据流</title>
  <desc id="sayall-atvv-desc">展示音频与控制信号如何从小米遥控器经 BLE ATVV 通道、IMA ADPCM 解码与三点平滑限幅，进入伪装为 USB 传输类型的 MiRemoteV2ch 虚拟麦克风，最终按能力矩阵驱动豆包或 Typeless 等输入法。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="960" height="464" fill="#f8fafc"/>

  <!-- Header Strip -->
  <rect x="0" y="0" width="960" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">SayAll 语音链路数据流：从 BLE ATVV 到 CoreAudio USB 伪装</text>
  <text x="20" y="38" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">DATA FLOW · 5 STAGES · 16 KHZ MONO IMA/DVI ADPCM → HAL AUDIO SERVER PLUGIN → VOICE IME</text>

  <!-- Alternating Lane Backgrounds -->
  <rect x="0" y="48" width="960" height="84" fill="#f8fafc"/>
  <rect x="0" y="132" width="960" height="84" fill="#ffffff"/>
  <rect x="0" y="216" width="960" height="84" fill="#f8fafc"/>
  <rect x="0" y="300" width="960" height="84" fill="#ffffff"/>

  <!-- Lane Dividers & Left Column Border -->
  <line x1="136" y1="48" x2="136" y2="384" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="0" y1="132" x2="960" y2="132" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="216" x2="960" y2="216" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="300" x2="960" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="384" x2="960" y2="384" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Step Header Badges (5 columns: cx = 216, 376, 536, 696, 856) -->
  <g transform="translate(152, 54)">
    <text x="64" y="10" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">01 · CAPTURE</text>
  </g>
  <g transform="translate(312, 54)">
    <text x="64" y="10" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">02 · TRANSPORT</text>
  </g>
  <g transform="translate(472, 54)">
    <text x="64" y="10" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.08em">03 · DSP &amp; BRIDGE</text>
  </g>
  <g transform="translate(632, 54)">
    <text x="64" y="10" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">04 · HAL SPOOF</text>
  </g>
  <g transform="translate(792, 54)">
    <text x="64" y="10" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">05 · DICTATION</text>
  </g>

  <!-- Lane Labels (Left Margin) -->
  <g transform="translate(16, 72)">
    <rect x="0" y="0" width="40" height="14" rx="2" fill="#e2e8f0"/>
    <text x="20" y="10" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">HW</text>
    <text x="0" y="28" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="600">蓝牙遥控硬件</text>
    <text x="0" y="42" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">VID 0x2717 · BLE</text>
  </g>
  <g transform="translate(16, 152)">
    <rect x="0" y="0" width="40" height="14" rx="2" fill="#e2e8f0"/>
    <text x="20" y="10" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">DEC</text>
    <text x="0" y="28" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="600">SayAll 桥接引擎</text>
    <text x="0" y="42" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">ATVV · ADPCM</text>
  </g>
  <g transform="translate(16, 236)">
    <rect x="0" y="0" width="40" height="14" rx="2" fill="#e0f2fe"/>
    <text x="20" y="10" fill="#0369a1" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">HAL</text>
    <text x="0" y="28" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="600">CoreAudio 驱动</text>
    <text x="0" y="42" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">AudioServerPlugIn</text>
  </g>
  <g transform="translate(16, 320)">
    <rect x="0" y="0" width="40" height="14" rx="2" fill="#e2e8f0"/>
    <text x="20" y="10" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">IME</text>
    <text x="0" y="28" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="600">语音输入工具</text>
    <text x="0" y="42" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">Fn / Right Cmd</text>
  </g>

  <!-- Connectors (DRAWN BEFORE NODE BOXES) -->
  <!-- HW(0) -> HW(1) -->
  <path d="M 284,96 H 304" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- HW(1) -> DEC(1) -->
  <path d="M 376,124 V 144" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- DEC(1) -> DEC(2) -->
  <path d="M 444,176 H 464" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- DEC(2) -> HAL(2) -->
  <path d="M 536,204 V 224" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- HAL(2) -> HAL(3) -->
  <path d="M 604,256 H 624" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- HAL(3) -> IME(3) -->
  <path d="M 696,284 V 308" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- HW(0) -> IME(3) dashed F5->Fn key trigger (routed cleanly down left of col 1 into IME lane) -->
  <path d="M 216,124 V 332 Q 216,340 224,340 H 624" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <!-- IME(3) -> IME(4) -->
  <path d="M 764,340 H 784" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Arrow Masks & Labels (with 6-10px gap from strokes) -->
  <rect x="260" y="320" width="160" height="14" rx="2" fill="#ffffff"/>
  <text x="340" y="330" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">F5 (0x3E) → FN / NEUTRALIZE</text>

  <rect x="384" y="128" width="68" height="12" rx="2" fill="#ffffff"/>
  <text x="418" y="137" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">NOTIFY 0x03</text>

  <rect x="544" y="208" width="76" height="12" rx="2" fill="#f8fafc"/>
  <text x="582" y="217" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">FLOAT32 PCM</text>

  <rect x="704" y="290" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="740" y="299" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">USB MIC STREAM</text>

  <!-- Nodes (Isolated <g transform>) -->
  <!-- HW Step 0 -->
  <g transform="translate(148, 68)">
    <rect x="0" y="0" width="136" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">小米 RC001 / RC003</text>
    <text x="10" y="33" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">长按语音键 F5 + 拾音</text>
    <text x="10" y="47" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">VID 2717 · PID 32B8</text>
  </g>

  <!-- HW Step 1 -->
  <g transform="translate(308, 68)">
    <rect x="0" y="0" width="136" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">BLE ATVV 特征通道</text>
    <text x="10" y="33" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">0x0A 协商 16 kHz / 120B</text>
    <text x="10" y="47" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">AB5E0001..0004</text>
  </g>

  <!-- DEC Step 1 -->
  <g transform="translate(308, 148)">
    <rect x="0" y="0" width="136" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">IMA/DVI ADPCM 解码</text>
    <text x="10" y="33" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">高半字节优先 (RC 2671)</text>
    <text x="10" y="47" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">120 B = 240 samp / 15ms</text>
  </g>

  <!-- DEC Step 2 (FOCAL 1) -->
  <g transform="translate(468, 148)">
    <rect x="0" y="0" width="136" height="56" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">PCM 平滑与安全限幅</text>
    <text x="10" y="33" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">三点平滑 + -24..24 dB</text>
    <text x="10" y="47" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">FOCAL · 0..1000% 增益</text>
  </g>

  <!-- HAL Step 2 -->
  <g transform="translate(468, 228)">
    <rect x="0" y="0" width="136" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">AVAudioEngine 写入</text>
    <text x="10" y="33" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">Obj-C 异常守卫防崩溃</text>
    <text x="10" y="47" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">AudioExceptionGuard</text>
  </g>

  <!-- HAL Step 3 (FOCAL 2) -->
  <g transform="translate(628, 228)">
    <rect x="0" y="0" width="136" height="56" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="136" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">MiRemoteV2ch 伪装驱动</text>
    <text x="10" y="33" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">伪装为 USB 传输绕过拦截</text>
    <text x="10" y="47" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">kAudioDeviceTransportUSB</text>
  </g>

  <!-- IME Step 3 -->
  <g transform="translate(628, 312)">
    <rect x="0" y="0" width="136" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">输入能力矩阵转接</text>
    <text x="10" y="33" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">长按模拟 Fn 点按 (Typeless)</text>
    <text x="10" y="47" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">VoiceFnTapController</text>
  </g>

  <!-- IME Step 4 -->
  <g transform="translate(788, 312)">
    <rect x="0" y="0" width="144" height="56" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">豆包 / 微信 / Typeless</text>
    <text x="10" y="33" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">不改系统默认麦即开口输入</text>
    <text x="10" y="47" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">SayAll Virtual Mic</text>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(20, 404)">
    <rect x="0" y="2" width="14" height="10" rx="2" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="22" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">核心工程突破（PCM 防爆音限幅 / BlackHole USB 传输伪装）</text>

    <line x1="360" y1="7" x2="392" y2="7" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-link)"/>
    <text x="400" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">16 kHz 实时音频流</text>

    <line x1="540" y1="7" x2="572" y2="7" stroke="#4f5d75" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="580" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">IOHID UserKeyMapping 控制路径</text>

    <text x="0" y="38" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SOURCE: ATVVProtocol.swift · AudioOutput.swift · blackhole-device-usb.patch · RemoteVoiceFunctionMapper.swift</text>
  </g>
</svg>
