<svg width="960" height="580" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="sw-topo-title sw-topo-desc">
  <title id="sw-topo-title">Swipt 架构全景：无越狱 iOS 自动化分层堆栈与智能体交互拓扑</title>
  <desc id="sw-topo-desc">详细展示 iOS 系统特权服务、TUN 环回网络隧道、libswipt 核心引擎、JSC 运行时以及外层 MCP 智能体集群的分层拓扑。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .layer-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .card-coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #991b1b; }
    .card-coral-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #b91c1c; }
    .card-blue-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #1e40af; }
    .card-blue-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #2563eb; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="960" height="580" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">Swipt 端内全景架构：跨层穿透与无越狱自动化引擎</text>
    <text class="subtitle" x="0" y="20">从 iOS 原生内核守护进程、TUN 环回反射网络、Go/Native 核心调度，到 JSC 运行时与 MCP 智能体集群</text>
  </g>

  <!-- Layer 5: External Agent &amp; Connectivity (Top) -->
  <g transform="translate(48, 86)">
    <rect width="864" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第五层：智能体接入与远程互联 (Agent &amp; Ingress)</text>
    
    <g transform="translate(16, 32)">
      <!-- Card 5-1: MCP Server -->
      <g transform="translate(0, 0)">
        <rect width="268" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="card-coral-title" x="12" y="16">原生 MCP Server (SSE / Streamable)</text>
        <text class="mono" fill="#b91c1c" x="12" y="28">Tools: js, js_api, js_reset</text>
      </g>
      <!-- Card 5-2: External Agents -->
      <g transform="translate(284, 0)">
        <rect width="276" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="16">多模态 Agent 集群</text>
        <text class="card-body" x="12" y="28">Claude Code / Cursor / OpenAI / Shortcuts</text>
      </g>
      <!-- Card 5-3: Ingress Tunnel -->
      <g transform="translate(576, 0)">
        <rect width="272" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="card-blue-title" x="12" y="16">零公网穿透 (NAT Traversal)</text>
        <text class="mono" fill="#2563eb" x="12" y="28">Cloudflare Quick Tunnel / Tailscale Node</text>
      </g>
    </g>
  </g>

  <!-- Layer 4: Automation Runtime &amp; Swiplet -->
  <g transform="translate(48, 178)">
    <rect width="864" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第四层：JavaScriptCore 引擎与 Swiplet 运行时 (Automation &amp; Swiplet)</text>

    <g transform="translate(16, 32)">
      <!-- Card 4-1: JSC Engine -->
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="17">JSC 执行线程 (jsc_thread)</text>
        <text class="card-body" x="12" y="32">Web APIs: fetch, crypto, sqlite</text>
      </g>
      <!-- Card 4-2: TypeScript SDK -->
      <g transform="translate(224, 0)">
        <rect width="206" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="17">@swipt/api 强类型 SDK</text>
        <text class="mono" fill="#475569" x="12" y="32">accessibility, input, screen, device</text>
      </g>
      <!-- Card 4-3: Swiplet UI Runtime -->
      <g transform="translate(444, 0)">
        <rect width="206" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="17">Swiplet 微应用沙盒</text>
        <text class="card-body" x="12" y="32">SwiftUI / Expo React Native 原生界面</text>
      </g>
      <!-- Card 4-4: Official Swiplets -->
      <g transform="translate(664, 0)">
        <rect width="184" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="card-blue-title" x="12" y="17">官方实战微应用</text>
        <text class="card-body" x="12" y="32">跳过开屏广告 / 账号切换</text>
      </g>
    </g>
  </g>

  <!-- Layer 3: libswipt Go Core &amp; Native Graphics -->
  <g transform="translate(48, 278)">
    <rect width="864" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第三层：libswipt (Go) 核心层与硬件加速图形引擎 (Core Engine)</text>

    <g transform="translate(16, 32)">
      <!-- Card 3-1: CoreDevice Bridge -->
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="card-coral-title" x="12" y="17">CoreDevice Go 客户端</text>
        <text class="mono" fill="#b91c1c" x="12" y="32">RSD 发现 / DTX 消息复用通道</text>
      </g>
      <!-- Card 3-2: Virtual HID &amp; Touch -->
      <g transform="translate(224, 0)">
        <rect width="206" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="17">虚拟 HID 驱动与触控</text>
        <text class="card-body" x="12" y="32">Tap, Swipe, Pinch, 按键事件注入</text>
      </g>
      <!-- Card 3-3: Native Graphics (SWHEVC) -->
      <g transform="translate(444, 0)">
        <rect width="206" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="17">Objective-C 图形管道</text>
        <text class="mono" fill="#475569" x="12" y="32">SWHEVC 解码 / 模板匹配内核</text>
      </g>
      <!-- Card 3-4: Lock &amp; Biometrics -->
      <g transform="translate(664, 0)">
        <rect width="184" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="17">锁屏逆向自动解锁</text>
        <text class="card-body" x="12" y="32">Face ID 绕过 / 密码键位映射</text>
      </g>
    </g>
  </g>

  <!-- Layer 2: Network Tunnel &amp; Pairing Bridge -->
  <g transform="translate(48, 378)">
    <rect width="864" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="layer-tag" x="16" y="22">第二层：虚拟环回网卡与配对凭据协商 (Loopback TUN &amp; Tunnel)</text>

    <g transform="translate(16, 32)">
      <!-- Card 2-1: Loopback VPN -->
      <g transform="translate(0, 0)">
        <rect width="268" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="card-blue-title" x="12" y="16">TUN 环回虚拟网卡 (10.7.0.1)</text>
        <text class="card-body" x="12" y="28">绕过 127.0.0.1 阻断，反射本地流量</text>
      </g>
      <!-- Card 2-2: TLS-PSK Tunnel -->
      <g transform="translate(284, 0)">
        <rect width="276" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="16">TLS-PSK 加密管道 (WireGuard 封装)</text>
        <text class="mono" fill="#475569" x="12" y="28">基于配对密钥建立安全隧道</text>
      </g>
      <!-- Card 2-3: Pairing Records -->
      <g transform="translate(576, 0)">
        <rect width="272" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text class="card-title" x="12" y="16">SRP 配对身份凭证管理</text>
        <text class="card-body" x="12" y="28">端内直配 / iloader / SideStore 证书复用</text>
      </g>
    </g>
  </g>

  <!-- Layer 1: iOS Native Kernel &amp; Daemons (Bottom) -->
  <g transform="translate(48, 470)">
    <rect width="864" height="66" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text class="layer-tag" x="16" y="20">第一层：iOS 底层特权守护进程与 Mach 内核子系统 (iOS Subsystem)</text>

    <g transform="translate(16, 28)">
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text class="mono" fill="#f8fafc" x="10" y="18">remotepairingd</text>
      </g>
      <g transform="translate(142, 0)">
        <rect width="138" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text class="mono" fill="#f8fafc" x="10" y="18">Accessibility AX</text>
      </g>
      <g transform="translate(292, 0)">
        <rect width="134" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text class="mono" fill="#f8fafc" x="10" y="18">IOHIDFamily</text>
      </g>
      <g transform="translate(438, 0)">
        <rect width="134" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text class="mono" fill="#f8fafc" x="10" y="18">SpringBoard</text>
      </g>
      <g transform="translate(584, 0)">
        <rect width="134" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text class="mono" fill="#f8fafc" x="10" y="18">RFB Server</text>
      </g>
      <g transform="translate(730, 0)">
        <rect width="118" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text class="mono" fill="#f8fafc" x="10" y="18">DDI Cryptex</text>
      </g>
    </g>
  </g>
</svg>