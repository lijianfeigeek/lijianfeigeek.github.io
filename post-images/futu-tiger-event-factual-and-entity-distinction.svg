<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futu-tiger-event-factual-and-entity-distinction-title futu-tiger-event-factual-and-entity-distinction-desc">
  <title id="futu-tiger-event-factual-and-entity-distinction-title">富途老虎期权案客观事实与三层主体法律定性严格区分</title>
  <desc id="futu-tiger-event-factual-and-entity-distinction-desc">区分监管通报与正股暴跌的客观事实，以及非券商监守自盗、非SEC刑事公诉与特定交易账户民事侵权纠纷的三层主体性质</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .badge-err { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #b91c1c; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #047857; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">富途老虎期权案客观事实层与三层主体性质严格区分</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">澄清舆论严重混淆：非券商监守自盗，非 SEC 刑事指控，本质为做市商发起的私法民事自救诉讼</text>

  <!-- Left: Objective Fact -->
  <g transform="translate(40, 80)">
    <rect width="380" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="380" height="34" rx="8" fill="#f1f5f9"/>
    <text x="190" y="22" class="card-title" text-anchor="middle">客观事件事实层 (The Underlying Event)</text>
    <g transform="translate(20, 50)">
      <text x="0" y="14" class="text-bold">1. 境内监管重磅行政处罚公布</text>
      <text x="0" y="32" class="text-sub">• 监管部门披露跨境展业违规行政处罚通报</text>
      <text x="0" y="48" class="text-sub">• 富途拟没收与罚款 18.5 亿元人民币，老虎证券同步受罚</text>
    </g>

    <line x1="20" y1="120" x2="360" y2="120" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 134)">
      <text x="0" y="14" class="text-bold">2. 正股与期权市场剧烈波动</text>
      <text x="0" y="32" class="text-sub">• FUTU 正股单日暴跌近 28%，TIGR 同步重挫</text>
      <text x="0" y="48" class="text-sub">• 深度虚值看跌期权（Put）价格飙升数十倍</text>
      <text x="0" y="66" class="card-title" fill="#b91c1c">• 少数特定账户精准押注，斩获账面浮盈超 1 亿美元</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 435 197 L 465 197" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Right: 3-Layer Legal Distinction -->
  <g transform="translate(480, 80)">
    <rect width="440" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="440" height="34" rx="8" fill="#f1f5f9"/>
    <text x="220" y="22" class="card-title" text-anchor="middle">司法主体性质严格区分 (Legal Standing)</text>
    
    <g transform="translate(20, 48)">
      <text x="0" y="14" class="badge-err">❌ 非富途 / 老虎证券官方涉嫌内幕交易</text>
      <text x="0" y="30" class="text-sub">两家券商是被监管对象与受波及股票标的，本身绝非本案被告</text>
    </g>

    <line x1="20" y1="102" x2="420" y2="102" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 114)">
      <text x="0" y="14" class="badge-err">❌ 非美国 SEC 或司法部提起刑事公诉</text>
      <text x="0" y="30" class="text-sub">政府监管机构并未立案起诉，原告为 Susquehanna 与 Citadel 做市商</text>
    </g>

    <line x1="20" y1="168" x2="420" y2="168" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 180)">
      <text x="0" y="14" class="badge-ok">✅ 诉讼本质：做市商发起的私法民事自救</text>
      <text x="0" y="30" class="text-sub">做市商因负伽马挤压巨亏，依据 10b-5 条款申请扣押交易者利润以弥补穿仓</text>
    </g>
  </g>
</svg>