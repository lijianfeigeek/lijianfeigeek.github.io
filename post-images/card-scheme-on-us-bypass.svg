<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-on-us-bypass-title card-scheme-on-us-bypass-desc" id="card-scheme-on-us-bypass-root">
        <title id="card-scheme-on-us-bypass-title">On-Us 内部绕行 vs Off-Us 跨行清算路径对比</title>
        <desc id="card-scheme-on-us-bypass-desc">同一银行兼具体系内收单与发卡资质时，交易通过内部核心账务总账对冲，绕过卡组织专线与网络费</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-on-us-bypass-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-on-us-bypass-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-on-us-bypass-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-on-us-bypass-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-on-us-bypass-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-on-us-bypass-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Left: On-Us Internal Bypass (Focal Accent) -->
        <g transform="translate(40, 24)">
          <rect x="0" y="0" width="420" height="330" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="36" rx="8" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="16" y="24" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">PATH A · ON-US (行内内部清算绕行)</text>

          <g transform="translate(20, 56)">
            <rect x="0" y="0" width="380" height="52" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="14" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">持卡人 (持 A 银行卡) → 商户 (A 银行结算户)</text>
            <text x="14" y="40" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">发卡方与收单方均为同一金融机构 (Bank A)</text>
          </g>

          <!-- Core Banking Internal Ledger Loop -->
          <g transform="translate(20, 126)">
            <rect x="0" y="0" width="380" height="100" rx="4" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1.2" fill-opacity="0.04"/>
            <text x="14" y="24" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">A 银行核心账务引擎 (Core Banking Ledger)</text>
            <text x="14" y="48" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12">1. 内部直接冻结/扣减持卡人账户</text>
            <text x="14" y="68" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12">2. 内部直接贷记商户对公结算账户</text>
            <text x="14" y="88" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">★ 零网络延迟 · 零跨行多边轧差 · 独享全部 MDR 扣率</text>
          </g>

          <g transform="translate(20, 244)">
            <rect x="0" y="0" width="380" height="60" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="14" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">【卡组织网络彻底绕过 BYPASS】</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">无需向 VisaNet / BankNet 上送 1100 / 1240 报文，节省全部评估费</text>
          </g>
        </g>

        <!-- Right: Off-Us Cross-Network Standard Path -->
        <g transform="translate(500, 24)">
          <rect x="0" y="0" width="420" height="330" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="420" height="36" rx="8" fill="#f8f9fa"/>
          <text x="16" y="24" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">PATH B · OFF-US (跨行标准卡组织路由)</text>

          <g transform="translate(20, 56)">
            <rect x="0" y="0" width="380" height="52" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="14" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">持卡人 (B 银行卡) → 商户 (A 银行结算户)</text>
            <text x="14" y="40" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">发卡方 (Issuer B) ≠ 收单方 (Acquirer A)</text>
          </g>

          <!-- Standard 3-Step Scheme Route -->
          <g transform="translate(20, 126)">
            <rect x="0" y="0" width="380" height="100" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="14" y="24" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">卡组织跨行清算中枢 (Scheme Switch)</text>
            <text x="14" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">1. 收单行上送联机授权请求至卡组织专线</text>
            <text x="14" y="68" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">2. 卡组织跨行寻径至发卡行 B 核心主机</text>
            <text x="14" y="88" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">3. 夜间批量对账清洗，计算多边清算净额</text>
          </g>

          <g transform="translate(20, 244)">
            <rect x="0" y="0" width="380" height="60" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="14" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">【费用产生】多方费率切分</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">收单行须向发卡行支付交换费 (Interchange)，并向卡组织缴纳网络费</text>
          </g>
        </g>
      </svg>
