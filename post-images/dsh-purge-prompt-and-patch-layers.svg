<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="layers-title layers-desc" style="background:#f8fafc; font-family:'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;">
  <title id="layers-title">dsh-purge 五层运行栈与提示词组装隔离架构</title>
  <desc id="layers-desc">从底层宿主磁盘落盘与 Asar 解包到最上层实时提示词重写与原位会话回退的五层纵深堆栈。</desc>
  <defs>
    <marker id="layer-arr-up" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,9 L5,1 L9,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0f172a">Layer Stack · dsh-purge 五层运行时介入与提示词仲裁堆栈</text>
    <text x="0" y="40" font-size="11" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">L1 宿主与原子落盘  ──▶  L2 82 项代码热补丁  ──▶  L3 四重内存兜底  ──▶  L4 提示词决策树  ──▶  L5 运行时隔离与回退</text>
  </g>

  <!-- Left Margin Direction Axis -->
  <g transform="translate(24, 84)">
    <line x1="20" y1="388" x2="20" y2="20" stroke="#475569" stroke-width="1.2" marker-end="url(#layer-arr-up)"/>
    <text x="0" y="416" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#475569">OS / ASAR</text>
    <text x="4" y="10" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#0f172a">LLM CONTEXT</text>
  </g>

  <!-- Outer Stack Frame -->
  <g transform="translate(96, 84)">
    <rect x="0" y="0" width="880" height="408" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Layer 5 (Top): Runtime Guard & In-place Rewind -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="880" height="80" rx="8" fill="#ffffff"/>
      <line x1="0" y1="80" x2="880" y2="80" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="32" y="36" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">L5</text>
      <text x="80" y="30" font-size="14" font-weight="700" fill="#0f172a">运行时前缀隔离、插值防爆与原位回退层</text>
      <text x="80" y="52" font-size="11" fill="#475569">dshpg-capabilities 绕开宿主前缀重排 · escapeDshInterpolation 拆分非法 {{ · rewind.js 原位撤回</text>
      <text x="688" y="32" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">identity.js · rewind.js</text>
      <text x="688" y="50" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#0284c7">capability-protocol.js</text>
    </g>

    <!-- Layer 4 (Focal): Prompt Source Arbitration & Workspace Policy -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="880" height="88" fill="#fff7ed"/>
      <rect x="2" y="2" width="876" height="84" rx="4" fill="none" stroke="#bf4520" stroke-width="1.2"/>
      <line x1="0" y1="88" x2="880" y2="88" stroke="#fed7aa" stroke-width="1"/>
      <rect x="16" y="24" width="48" height="24" rx="4" fill="#bf4520"/>
      <text x="32" y="40" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#ffffff">L4</text>
      <text x="80" y="30" font-size="14" font-weight="700" fill="#9a3412">多源提示词优先级树 &amp; Workspace 基线仲裁（核心焦点）</text>
      <text x="80" y="52" font-size="11" fill="#7c2d12">优先级：prompt-inject.md (A) &gt; 已勾选本地 AGENTS/CLAUDE.md (B) &gt; 插件加密默认插槽 (D)</text>
      <text x="80" y="70" font-size="10.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#bf4520">Workspace Policy: strict(一律剥离) | fallback(有A/B时剥离) | always(保留官方基线)</text>
      <text x="720" y="30" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="600" fill="#bf4520">ORDER = -100000</text>
      <text x="720" y="50" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#9a3412">rules.js · index.js</text>
    </g>

    <!-- Layer 3: Four-Tier Hung Prompt Fallback -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="880" height="80" fill="#f8fafc"/>
      <line x1="0" y1="80" x2="880" y2="80" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="32" y="36" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">L3</text>
      <text x="80" y="30" font-size="14" font-weight="700" fill="#0f172a">四重实时组装兜底链（__dshPurgeHungPrompt）</text>
      <text x="80" y="52" font-size="11" fill="#475569">1. refreshHungOperator (200ms mtime 节流) → 2. 内存钉子 → 3. 磁盘直读 → 4. 加密默认槽</text>
      <text x="688" y="32" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">system-prompt/assemble</text>
      <text x="688" y="50" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">installAssembleGuard</text>
    </g>

    <!-- Layer 2: 82 Patches & Reversible Hooks -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="880" height="80" fill="#ffffff"/>
      <line x1="0" y1="80" x2="880" y2="80" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="32" y="36" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">L2</text>
      <text x="80" y="30" font-size="14" font-weight="700" fill="#0f172a">82 项分域代码补丁 &amp; Hooks Deny 可逆开关</text>
      <text x="80" y="52" font-size="11" fill="#475569">提示词(25) + 代码(46) + 工具(8) + 版本兼容(3) · #30/#31/#64/#65 支持哨兵反向写回官方态</text>
      <text x="688" y="32" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">core.js (ALL_PATCHES)</text>
      <text x="688" y="50" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">hooks-deny.js · #80</text>
    </g>

    <!-- Layer 1 (Bottom): Host Discovery, Asar & Atomic Write -->
    <g transform="translate(0, 328)">
      <rect x="0" y="0" width="880" height="80" rx="8" fill="#f8fafc"/>
      <rect x="16" y="20" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="32" y="36" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">L1</text>
      <text x="80" y="30" font-size="14" font-weight="700" fill="#0f172a">跨端宿主探测、Asar 侧边解包与 POSIX 权限保留原子写入</text>
      <text x="80" y="52" font-size="11" fill="#475569">Web/Desktop 双端独立隔离 · 4000ms settle 防抢锁 · atomicWriteSync 保留 0755 · WSH \uXXXX 转义</text>
      <text x="688" y="32" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">extract-asar.js · desktop.js</text>
      <text x="688" y="50" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">settle-policy.js · official-update</text>
    </g>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(96, 504)">
    <text x="0" y="16" font-size="10.5" fill="#64748b">注：每层改动均伴随 .dshpurge.bak 原件备份；Skill 目录 ($DSH_HOME/skills) 由 DSH 原生加载，不进入提示词注入段，卸载插件亦不销毁用户资产。</text>
  </g>
</svg>
