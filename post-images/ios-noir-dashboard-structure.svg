<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-dashboard-structure-title ios-noir-dashboard-structure-desc" id="ios-noir-dashboard-structure-root">
        <title id="ios-noir-dashboard-structure-title">取证全景控制台：iOS-NOIR 交互式报告七大核心模块</title>
        <desc id="ios-noir-dashboard-structure-desc">设备全局概览、10+ 底层特权穿透、应用探测嗅探、ATS 降级通道、沙盒裸露分析与设备指纹链</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-dashboard-structure-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-dashboard-structure-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-dashboard-structure-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-dashboard-structure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-dashboard-structure-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-dashboard-structure-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Top Central Title Banner -->
        <g transform="translate(240, 24)">
          <rect x="0" y="0" width="480" height="54" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="240" y="24" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">FORENSIC REPORT TAXONOMY</text>
          <text x="240" y="42" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="middle">iOS-NOIR 交互式取证报告七大核心标签页</text>
        </g>

        <!-- 7 Modules Grid: 4 Top, 3 Bottom -->
        <!-- M1 -->
        <g transform="translate(40, 100)">
          <rect x="0" y="0" width="205" height="110" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="26" rx="4" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">TAB 01 · 全局总览</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">设备硬件与风险画像</text>
          <text x="10" y="68" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">设备指纹、系统固件、</text>
          <text x="10" y="86" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">特权总数与加权安全打分</text>
        </g>

        <!-- M2 (Focal Accent) -->
        <g transform="translate(265, 100)">
          <rect x="0" y="0" width="205" height="110" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.04"/>
          <rect x="0" y="0" width="205" height="26" rx="4" fill="#bf4520" fill-opacity="0.08"/>
          <text x="10" y="18" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">TAB 02 · 底层特权 (FOCAL)</text>
          <text x="10" y="46" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">10+ 系统级特权穿透</text>
          <text x="10" y="68" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">静默推送扩展、VoIP 唤醒、</text>
          <text x="10" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">HotspotHelper 扫描深入审计</text>
        </g>

        <!-- M3 -->
        <g transform="translate(490, 100)">
          <rect x="0" y="0" width="205" height="110" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="26" rx="4" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">TAB 03 · 应用嗅探</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">280+ Schemes 嗅探</text>
          <text x="10" y="68" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">分析社交应用硬编码协议表，</text>
          <text x="10" y="86" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">探测安装哪些银行与加密货币</text>
        </g>

        <!-- M4 -->
        <g transform="translate(715, 100)">
          <rect x="0" y="0" width="205" height="110" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="26" rx="4" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">TAB 04 · ATS 降级通道</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">明文域名与局域网探针</text>
          <text x="10" y="68" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">排查 NSAllowsArbitraryLoads、</text>
          <text x="10" y="86" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">Bonjour 广播与内网刺探</text>
        </g>

        <!-- Row 2: 3 Modules -->
        <!-- M5 -->
        <g transform="translate(150, 230)">
          <rect x="0" y="0" width="205" height="110" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="26" rx="4" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">TAB 05 · 沙盒裸露</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">HouseArrest 提取物</text>
          <text x="10" y="68" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">列出开启共享的应用目录、</text>
          <text x="10" y="86" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">提取全机崩溃日志与诊断黑匣</text>
        </g>

        <!-- M6 (Focal Accent) -->
        <g transform="translate(375, 230)">
          <rect x="0" y="0" width="205" height="110" rx="4" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1.2" fill-opacity="0.04"/>
          <rect x="0" y="0" width="205" height="26" rx="4" fill="#2e5aa8" fill-opacity="0.08"/>
          <text x="10" y="18" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">TAB 06 · 身份追踪链</text>
          <text x="10" y="46" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="12" font-weight="600">五层持久身份烙印拓扑</text>
          <text x="10" y="68" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">iCloud、钥匙串、应用组、</text>
          <text x="10" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">蜂窝多路径完整串通网络</text>
        </g>

        <!-- M7 -->
        <g transform="translate(600, 230)">
          <rect x="0" y="0" width="205" height="110" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="205" height="26" rx="4" fill="#f8f9fa"/>
          <text x="10" y="18" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">TAB 07 · 黑话词典</text>
          <text x="10" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">通俗安全释义手册</text>
          <text x="10" y="68" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">面向非技术读者的底层名词人话</text>
          <text x="10" y="86" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">解释与风险防御实操指引</text>
        </g>
      </svg>
