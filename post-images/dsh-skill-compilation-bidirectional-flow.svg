<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-skill-compilation-bidirectional-flow-title dsh-skill-compilation-bidirectional-flow-desc" id="dsh-skill-compilation-bidirectional-flow-root">
      <title id="dsh-skill-compilation-bidirectional-flow-title">DSH 软工作流与标准 Agent Skill 双向编译架构</title>
      <desc id="dsh-skill-compilation-bidirectional-flow-desc">可视化 JSON 工作流与标准纯文本 Agent Skill (SKILL.md) 之间的双向无损互通架构</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dsh-skill-compilation-bidirectional-flow-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #dsh-skill-compilation-bidirectional-flow-root text { font-family: "Geist", -apple-system, sans-serif; }
      #dsh-skill-compilation-bidirectional-flow-root .mono { font-family: "Geist Mono", monospace; }
      #dsh-skill-compilation-bidirectional-flow-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="dsh-skill-compilation-bidirectional-flow-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="dsh-skill-compilation-bidirectional-flow-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="dsh-skill-compilation-bidirectional-flow-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Block 1: React Flow Visual Workflow -->
        <g transform="translate(40, 40)">
          <rect x="0" y="0" width="260" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="28" rx="8" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">INPUT: REACT FLOW WORKFLOW</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">可视化拓扑 (workflows/foo.json)</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 包含节点位置、连线与抽屉配置</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 支持 RunBoard 实时大盘配置</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 面向人类工程师的可视化资产</text>
          <text x="12" y="142" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">人类协作直观界面</text>
        </g>

        <!-- Block 2: Compiler (Focal) -->
        <g transform="translate(350, 40)">
          <rect x="0" y="0" width="260" height="160" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="260" height="28" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="700" fill="#bf4520" class="mono">CORE: SKILL COMPILER (FOCAL)</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#bf4520">双向编译器 (skillPack.ts)</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 拓扑图元自动降阶为逻辑树</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.8">• 自动提炼红线约束与验收清单</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.8">• 无损双向反编译解析还原</text>
          <text x="12" y="142" font-size="11" font-weight="700" fill="#bf4520" class="mono">双向桥接与语义转换枢纽</text>
        </g>

        <!-- Block 3: Standard Skill Folder -->
        <g transform="translate(660, 40)">
          <rect x="0" y="0" width="260" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="260" height="28" rx="8" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">OUTPUT: STANDARD AGENT SKILL</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">标准 Skill 规范 (foo/ 目录)</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 标准 SKILL.md 操作手册</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• scripts/ 辅助自动化脚本</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 完全兼容 Antigravity / Codex</text>
          <text x="12" y="142" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">Agent 零开销即开即用</text>
        </g>

        <!-- Bidirectional Connectors -->
        <path d="M 300 100 L 350 100" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-skill-compilation-bidirectional-flow-arrow-accent)"/>
        <path d="M 350 130 L 300 130" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#dsh-skill-compilation-bidirectional-flow-arrow-default)" opacity="0.6"/>

        <path d="M 610 100 L 660 100" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-skill-compilation-bidirectional-flow-arrow-accent)"/>
        <path d="M 660 130 L 610 130" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#dsh-skill-compilation-bidirectional-flow-arrow-default)" opacity="0.6"/>
      </g>
    </svg>
