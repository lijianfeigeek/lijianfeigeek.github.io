<svg xmlns="http://www.w3.org/2000/svg" width="920" height="448" viewBox="0 0 920 448" role="img" aria-labelledby="sec-title sec-desc">
  <title id="sec-title">Answer me with HTML 四层零信任安全与离线隔离堆栈</title>
  <desc id="sec-desc">从本地文件边界、Markdown AST 清洗、CSP SHA-256 哈希钉扎到能力令牌 HTTP 服务的四层防御体系。</desc>
  <defs>
    <pattern id="sec-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.28"/>
    </pattern>
    <marker id="sec-arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6.5,3.5 L0,6.5 Z" fill="#475569"/>
    </marker>
    <marker id="sec-arr-accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6.5,3.5 L0,6.5 Z" fill="#bf4520"/>
    </marker>
    <marker id="sec-arr-link" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6.5,3.5 L0,6.5 Z" fill="#0284c7"/>
    </marker>
    <marker id="sec-arr-soft" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6.5,3.5 L0,6.5 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="448" fill="#f8fafc"/>
  <rect width="920" height="448" fill="url(#sec-dots)"/>
  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">Zero-Trust Offline &amp; Secret Isolation Stack</text>
  <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" fill="#64748b">COMPENSATING SECURITY LAYERS · UNTRUSTED DRAFTS &amp; LOCAL CODEBASES</text>
  <line x1="64" y1="368" x2="64" y2="76" stroke="#475569" stroke-width="1.4" marker-end="url(#sec-arr-muted)"/>
  <text x="56" y="216" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#475569">RUNTIME</text>
  <text x="56" y="230" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">EXPOSURE</text>
  <g transform="translate(128, 68)">
    <rect x="0" y="0" width="760" height="68" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="20" width="84" height="28" rx="3" fill="#f1f5f9"/>
    <text x="58" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#1e293b">L4 · SERVE</text>
    <text x="120" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">能力令牌与 DNS 重绑定防线</text>
    <text x="120" y="49" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">am serve: HMAC-SHA256 令牌 + Host 白名单 (127.0.0.1 / Tailscale)</text>
    <rect x="626" y="22" width="118" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="685" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" fill="#1e293b">src/serve.js</text>
  </g>
  <g transform="translate(128, 148)">
    <rect x="0" y="0" width="760" height="68" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="16" y="20" width="84" height="28" rx="3" fill="#bf4520"/>
    <text x="58" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#ffffff">L3 · CSP</text>
    <text x="120" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">零外连 SHA-256 强制沙盒</text>
    <text x="120" y="49" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">default-src 'none' · 精确脚本哈希钉扎 · 阻断远程图床与脚本执行</text>
    <rect x="626" y="22" width="118" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="685" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" fill="#1e293b">src/csp.js</text>
  </g>
  <g transform="translate(128, 228)">
    <rect x="0" y="0" width="760" height="68" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="20" width="84" height="28" rx="3" fill="#f1f5f9"/>
    <text x="58" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#1e293b">L2 · FILTER</text>
    <text x="120" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Markdown AST 与属性清洗层</text>
    <text x="120" y="49" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">拦截 NEVER 标签 · 剥离 on* / srcdoc · 解码实体混淆 javascript:</text>
    <rect x="626" y="22" width="118" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="685" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" fill="#1e293b">src/raw-html.js</text>
  </g>
  <g transform="translate(128, 308)">
    <rect x="0" y="0" width="760" height="68" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="20" width="84" height="28" rx="3" fill="#f1f5f9"/>
    <text x="58" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#1e293b">L1 · CODE</text>
    <text x="120" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">本地代码切片与密钥熔断边界</text>
    <text x="120" y="49" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">realpathSync 防软链逃逸 · 拒收 .env/.pem · 正则拦截 API Key</text>
    <rect x="626" y="22" width="118" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="685" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" fill="#1e293b">src/code.js</text>
  </g>
  <line x1="32" y1="400" x2="888" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 422)">
    <rect x="0" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="22" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" fill="#bf4520">硬边界层：即使 raw html 混入 &lt;script&gt; 或外链图片，浏览器在 CSP 层也会直接静默阻断</text>
  </g>
</svg>