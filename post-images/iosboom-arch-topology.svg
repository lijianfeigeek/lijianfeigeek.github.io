<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="iosboom-arch-title iosboom-arch-desc">
  <title id="iosboom-arch-title">iosBoom IPA Library 多源流式聚合与云端分发架构图</title>
  <desc id="iosboom-arch-desc">展示 iosBoom 浏览器 SPA 如何聚合 Supabase 主库与第三方 AltStore/KhoIPA 仓库，结合 256 KB 流式 JSON 预扫描、CORS 代理回退与 R2 预签名通道实现免 Mac 分发。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="580" fill="#f8fafc"/>

  <!-- Header -->
  <text x="40" y="36" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700">iosBoom IPA Library 多源联邦聚合与分发架构</text>
  <text x="40" y="56" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">ARCH TOPOLOGY · STREAMING PARTIAL PARSER + SUPABASE CONTROL PLANE + R2/CORS PROXY</text>

  <!-- Trust Zones (drawn before arrows and nodes) -->
  <!-- Zone 1: Browser SPA -->
  <rect x="32" y="80" width="284" height="408" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="72" width="164" height="16" rx="2" fill="#f8fafc"/>
  <text x="126" y="84" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">BROWSER SPA CLIENT</text>

  <!-- Zone 2: Control & Storage Plane -->
  <rect x="344" y="80" width="292" height="408" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="356" y="72" width="196" height="16" rx="2" fill="#f8fafc"/>
  <text x="454" y="84" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">TRYSTORE CONTROL PLANE</text>

  <!-- Zone 3: Upstream & Workers -->
  <rect x="664" y="80" width="264" height="408" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="676" y="72" width="188" height="16" rx="2" fill="#f8fafc"/>
  <text x="770" y="84" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">UPSTREAM REPOS &amp; WORKERS</text>

  <!-- Connectors (drawn BEFORE node boxes) -->
  <!-- SPA Query -> Supabase Catalog -->
  <path d="M 296,148 H 364" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- SPA Streamer -> CORS Proxy -->
  <path d="M 296,264 H 328 Q 336,264 336,272 V 300 Q 336,308 344,308 H 364" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- SPA Streamer direct fetch to External Repos (top arc bypassing middle zone via gap) -->
  <path d="M 296,244 H 320 Q 328,244 328,236 V 104 Q 328,96 336,96 H 652 Q 660,96 660,104 V 140 Q 660,148 668,148 H 684" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- CORS Proxy -> External Repos -->
  <path d="M 616,308 H 644 Q 652,308 652,300 V 180 Q 652,172 660,172 H 684" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <!-- Supabase -> R2 / GitHub Edge Fn -->
  <path d="M 490,212 V 364" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- R2/Edge Fn -> GitHub / Signing Workers -->
  <path d="M 616,416 H 684" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- LocalStorage Cache <-> Streamer -->
  <path d="M 174,316 V 364" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow Masks & Labels -->
  <rect x="304" y="130" width="52" height="16" rx="2" fill="#f8fafc"/>
  <text x="330" y="142" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">REST/RPC</text>

  <rect x="412" y="88" width="156" height="16" rx="2" fill="#f8fafc"/>
  <text x="490" y="100" fill="#059669" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">256 KB STREAM DIRECT</text>

  <rect x="302" y="280" width="60" height="16" rx="2" fill="#f8fafc"/>
  <text x="332" y="292" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">CORS FALLBACK</text>

  <rect x="620" y="396" width="60" height="16" rx="2" fill="#f8fafc"/>
  <text x="650" y="408" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">PRESIGN/API</text>

  <!-- Node Cards with isolated <g transform> -->
  <!-- Node 1: React 19 + TanStack Query UI -->
  <g transform="translate(52, 108)">
    <rect x="0" y="0" width="244" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <rect x="12" y="10" width="76" height="16" rx="2" fill="#f1f5f9"/>
    <text x="50" y="21" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">SPA SHELL</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">React 19 + TanStack Query</text>
    <text x="12" y="60" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">IntersectionObserver 24 项分页</text>
    <text x="12" y="75" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">EN / AR RTL · naturalWidth &lt; 8 剔除</text>
  </g>

  <!-- Node 2: Focal Node 1 — 256 KB Streaming JSON Scanner -->
  <g transform="translate(52, 212)">
    <rect x="0" y="0" width="244" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="12" y="10" width="96" height="16" rx="2" fill="#bf4520"/>
    <text x="60" y="21" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">FOCAL · STREAMER</text>
    <text x="12" y="44" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">256 KB 流式 JSON 状态机</text>
    <text x="12" y="62" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">ReadableStream 截取首段字节</text>
    <text x="12" y="79" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">括号深度解析提前首屏渲染</text>
    <text x="12" y="95" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">262,144 B cap · depth 2/3</text>
  </g>

  <!-- Node 3: LocalStorage SWR Cache & Hygiene -->
  <g transform="translate(52, 364)">
    <rect x="0" y="0" width="244" height="104" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <rect x="12" y="10" width="84" height="16" rx="2" fill="#e2e8f0"/>
    <text x="54" y="21" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">LOCAL STORE</text>
    <text x="12" y="44" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">24h SWR 缓存与规范化管线</text>
    <text x="12" y="62" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">超 400 应用跳过写入防爆配额</text>
    <text x="12" y="79" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">14 类双语正则映射 + 三元组去重</text>
    <text x="12" y="95" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">bundle_id | name | version</text>
  </g>

  <!-- Node 4: Supabase Control & Catalog DB -->
  <g transform="translate(364, 108)">
    <rect x="0" y="0" width="252" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <rect x="12" y="10" width="112" height="16" rx="2" fill="#e0f2fe"/>
    <text x="68" y="21" fill="#0369a1" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">SUPAPI.TRYSTORE.NET</text>
    <text x="12" y="44" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Supabase 多租户控制与主库</text>
    <text x="12" y="62" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">plus_library_apps (2,189 款精选)</text>
    <text x="12" y="79" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">plus_repos · plus_repo_hidden_apps</text>
    <text x="12" y="95" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">position 插槽置顶 + 下载量降序</text>
  </g>

  <!-- Node 5: CORS Proxy Gateway -->
  <g transform="translate(364, 248)">
    <rect x="0" y="0" width="252" height="92" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1.1"/>
    <rect x="12" y="10" width="88" height="16" rx="2" fill="#e2e8f0"/>
    <text x="56" y="21" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">EDGE PROXY</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">透明 CORS 仓库中继代理</text>
    <text x="12" y="60" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">直连失败自动回退服务端透传</text>
    <text x="12" y="78" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">trystore.net/api/repo?url=...</text>
  </g>

  <!-- Node 6: Edge Functions & R2 Storage -->
  <g transform="translate(364, 364)">
    <rect x="0" y="0" width="252" height="104" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="12" y="10" width="108" height="16" rx="2" fill="#e0f2fe"/>
    <text x="66" y="21" fill="#0369a1" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">STORAGE &amp; EDGE FN</text>
    <text x="12" y="44" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">R2 预签名与 GitHub 下载桥</text>
    <text x="12" y="62" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">trydevui-r2-upload (Presign/Delete)</text>
    <text x="12" y="79" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">plus-github-download 动态签发</text>
    <text x="12" y="95" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">apps.trystore.net WebP 图标 CDN</text>
  </g>

  <!-- Node 7: External Repos -->
  <g transform="translate(684, 118)">
    <rect x="0" y="0" width="224" height="124" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <rect x="12" y="10" width="100" height="16" rx="2" fill="#e2e8f0"/>
    <text x="62" y="21" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">5+ PUBLIC REPOS</text>
    <text x="12" y="44" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">第三方外部 IPA 源</text>
    <text x="12" y="64" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">ucerts · AppTesters · Build Store</text>
    <text x="12" y="82" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">IPAOMTK · Minoa's Combined</text>
    <text x="12" y="100" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">repoVisibility 过滤 sidelix</text>
    <text x="12" y="114" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">AltStore / Scarlet JSON schema</text>
  </g>

  <!-- Node 8: Focal Node 2 — Dual Signing Workers -->
  <g transform="translate(684, 344)">
    <rect x="0" y="0" width="224" height="124" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="12" y="10" width="112" height="16" rx="2" fill="#bf4520"/>
    <text x="68" y="21" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">FOCAL · DUAL SIGNER</text>
    <text x="12" y="44" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="700">热切换云端重签集群</text>
    <text x="12" y="64" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">tryui (api.tryui.dev) + SSE</text>
    <text x="12" y="82" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">ipasign (ipa.ipasign.cc) 轮询</text>
    <text x="12" y="100" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Supabase Realtime 动态切换</text>
    <text x="12" y="114" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">itms-services:// OTA 清单输出</text>
  </g>

  <!-- Legend Bar (bottom strip) -->
  <rect x="32" y="512" width="896" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="48" y="528" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="68" y="538" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">核心创新路径 (Focal)</text>

  <line x1="210" y1="534" x2="240" y2="534" stroke="#059669" stroke-width="1.6"/>
  <text x="248" y="538" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">256 KB 浏览器直连流式提取</text>

  <line x1="428" y1="534" x2="458" y2="534" stroke="#0284c7" stroke-width="1.6"/>
  <text x="466" y="538" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">控制面 API / R2 预签名通道</text>

  <line x1="658" y1="534" x2="688" y2="534" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="696" y="538" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11">离线缓存 / 代理回退链路</text>
</svg>
