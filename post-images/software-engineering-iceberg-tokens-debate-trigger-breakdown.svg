<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="se-deb-title se-deb-desc">
  <title id="se-deb-title">AI 时代技术论战风暴：外行傲慢断言 vs 一线工程重锤 vs 宝玉本质拆解</title>
  <desc id="se-deb-desc">展示技术外行宣称程序员被100%取代、老兵响马一周烧数十亿Token打磨无形代码，以及宝玉对软件工程本质的五维拆解。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">技术论战风暴：外行傲慢 vs. 一线工程体感</text>
    <text class="subtitle" x="0" y="20">直击当前 AI 落地中最核心的认知撕裂：代码只是中间产物，软件开发本质是系统工程</text>
  </g>

  <!-- Left: Trigger (Claim) -->
  <g transform="translate(48, 86)">
    <rect width="260" height="348" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#be123c" x="0" y="0">1. 导火索：外行的降维断言</text>
      <text class="mono" fill="#e11d48" x="0" y="16">将“写代码”等同于“软件工程”</text>

      <g transform="translate(0, 34)">
        <rect width="228" height="110" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-title" fill="#be123c" x="0" y="0">【断言 A】程序员已被 100% 取代</text>
          <text class="card-body" x="0" y="18">“程序员除了写语法啥也不会，现在 AI 几秒敲个网页，程序员价值清零。”</text>
          <text class="mono" fill="#9f1239" x="0" y="60">MISCONCEPTION: 处方与医生谬论</text>
        </g>
      </g>

      <g transform="translate(0, 160)">
        <rect width="228" height="130" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-title" fill="#be123c" x="0" y="0">【断言 B】行业专家秒杀程序员</text>
          <text class="card-body" x="0" y="18">“金融、医疗、法律专家只要稍微了解 AI，就能跨界干死程序员，因为专家懂业务。”</text>
          <text class="mono" fill="#9f1239" x="0" y="74">FALLACY: 严重低估底层工程门槛</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Center: Defense (XiMa Token Hammer) -->
  <g transform="translate(332, 86)">
    <rect width="280" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#c2410c" x="0" y="0">2. 老兵反击：一线体感的工程重锤</text>
      <text class="mono" fill="#ea580c" x="0" y="16">架构老兵 @响马 亲历实战自白</text>

      <g transform="translate(0, 34)">
        <rect width="248" height="256" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
        <g transform="translate(14, 18)">
          <text class="card-title" fill="#ea580c" x="0" y="0">“大几十亿 Token 烧掉了，</text>
          <text class="card-title" fill="#ea580c" x="0" y="18">却没做出一项外行眼里的新功能”</text>

          <text class="card-body" x="0" y="44">• 满屏全是外行眼里“没用的代码”</text>
          <text class="card-body" x="0" y="62">• 编写输入断言、类型守卫与防御性契约</text>
          <text class="card-body" x="0" y="80">• 搭建 Eval 评估流与失败模式拦截防线</text>
          <text class="card-body" x="0" y="98">• 处理并发竞态、数据库死锁与事务补偿</text>
          <text class="card-body" x="0" y="116">• 解决大模型长对话上下文漂移与幻觉</text>

          <text class="mono" fill="#c2410c" x="0" y="150">REALITY: 露出的功能仅 10%</text>
          <text class="mono" fill="#9a3412" x="0" y="170">水下 90% 才是工业系统生存壁垒</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Deep Dive (BaoYu Five Insights) -->
  <g transform="translate(636, 86)">
    <rect width="276" height="348" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#15803d" x="0" y="0">3. 本质拆解：宝玉五维体系洞见</text>
      <text class="mono" fill="#16a34a" x="0" y="16">软件工程的客观发展物理规律</text>

      <g transform="translate(0, 34)">
        <rect width="244" height="256" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
        <g transform="translate(12, 16)">
          <text class="card-title" fill="#15803d" x="0" y="0">1. 代码仅是系统思维中间制品</text>
          <text class="card-body" x="0" y="16">软件开发本质是严密的系统工程学</text>

          <text class="card-title" fill="#15803d" x="0" y="42">2. 原型跑通到上线存在五道天堑</text>
          <text class="card-body" x="0" y="58">懂 AI 原型容易，工业级落地极难</text>

          <text class="card-title" fill="#15803d" x="0" y="84">3. 底层工程元能力迁移高度不对称</text>
          <text class="card-body" x="0" y="100">显性业务知识易学，隐性工程直觉难成</text>

          <text class="card-title" fill="#15803d" x="0" y="126">4. 真正 AI Native：执行主体彻底易位</text>
          <text class="card-body" x="0" y="142">Agent 自主写代码，人类定义规格与验收</text>

          <text class="card-title" fill="#15803d" x="0" y="168">5. 抽象阶梯演进：杰文斯悖论生效</text>
          <text class="card-body" x="0" y="184">写代码门槛降低，系统复杂度需求爆发</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 308 260 L 332 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="332,260 326,256 326,264" fill="#94a3b8"/>

  <path d="M 612 260 L 636 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="636,260 630,256 630,264" fill="#94a3b8"/>
</svg>