<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="modern-network-debugging-jicesys-bus-simulation-closed-loop-title modern-network-debugging-jicesys-bus-simulation-closed-loop-desc">
  <title id="modern-network-debugging-jicesys-bus-simulation-closed-loop-title">JiceSys 工业与物联网通信协议仿真验证闭环模型</title>
  <desc id="modern-network-debugging-jicesys-bus-simulation-closed-loop-desc">展示从位域级通信帧建模、零代码公式校验到多设备包围式仿真自动化闭环的全流程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">工控与车联网突破：JICESYS（极测）异构通信协议全流程仿真闭环</text>
    <text x="896" y="16" text-anchor="end" class="tag">IOT &amp; INDUSTRIAL POSTMAN</text>
  </g>

  <!-- 3 Horizontal Phase Cards -->
  <!-- Phase 1: Protocol Modeling -->
  <g transform="translate(32, 60)">
    <rect width="280" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="280" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="280" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">第一阶段：通信数据建模与帧定义</text>
    <text x="266" y="25" text-anchor="end" class="tag">MODELING</text>

    <g transform="translate(14, 52)">
      <rect width="252" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">位域（Bit-field）级精细划分</text>
        <text class="desc" x="0" y="18">• 跨越 HTTP，覆盖 CAN / 1553B / TCP 流</text>
        <text class="desc" x="0" y="34">• 支持精确到 1 个 Bit 的状态位解析</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="252" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">大小端与浮点数编解码</text>
        <text class="desc" x="0" y="18">• 自动处理 Big/Little Endian 字节序</text>
        <text class="desc" x="0" y="34">• IEEE 754 浮点与 BCD 码原生转换</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="252" height="106" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">自定义校验算法引擎</text>
        <text class="desc" x="0" y="18">• CRC16 / CRC32 / 异或累加和</text>
        <text class="desc" x="0" y="34">• 协议契约提前固化，消除理解分歧</text>
        <text class="tag" x="0" y="60">“设计即验证”，消除联调歧义</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Phase 1 -> Phase 2 -->
  <path d="M 312 225 L 342 225" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Phase 2: Zero-Code Engine (Core Accent) -->
  <g transform="translate(342, 60)">
    <rect width="286" height="330" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="286" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="286" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="286" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="14" y="25" class="coral-title">第二阶段：零代码规则验证引擎</text>
    <text x="272" y="25" text-anchor="end" class="coral-tag">ZERO-CODE</text>

    <g transform="translate(14, 52)">
      <rect width="258" height="66" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">类 Excel 语法公式计算</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 非底层算法开发人员亦可编写断言</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 报文字段动态关联与复杂校验</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="258" height="66" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">时序连续性与丢包判定</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 监测心跳包计数器序号（Counter）</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 自动捕获工控通信抖动与微秒级乱序</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="258" height="106" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">异常值实时拦截告警</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 动态触发阈值告警与断点抓包</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 替代过去晦涩冗长的 C/C++ 调试桩</text>
        <text class="coral-tag" x="0" y="60">人工排障时间直接压缩 90% 以上</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Phase 2 -> Phase 3 -->
  <path d="M 628 225 L 658 225" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Phase 3: Simulation &amp; CI/CD -->
  <g transform="translate(658, 60)">
    <rect width="270" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="270" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="270" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="270" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">第三阶段：敏捷仿真与自动化闭环</text>
    <text x="256" y="25" text-anchor="end" class="tag">CI/CD INTEGRATION</text>

    <g transform="translate(14, 52)">
      <rect width="242" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">多设备包围式仿真 (Enclosure)</text>
        <text class="desc" x="0" y="18">• 在无实车或硬件样机下模拟全套节点</text>
        <text class="desc" x="0" y="34">• 仿真 ECU 与航空电子设备协同响应</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="242" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">条件触发与自动 Mock 回复</text>
        <text class="desc" x="0" y="18">• 高精度微秒级周期性脉冲发送</text>
        <text class="desc" x="0" y="34">• 收到特定故障码触发注入异常应答</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="242" height="106" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1.5" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">全流程数据归档与持续集成</text>
        <text class="desc" style="fill:#166534;" x="0" y="18">• 无缝接入自动化回归测试流水线</text>
        <text class="desc" style="fill:#166534;" x="0" y="34">• 联调周期从传统 2 周骤降至 1 天</text>
        <text class="green-tag" x="0" y="60">大幅降低嵌入式接口研发准入门槛</text>
      </g>
    </g>
  </g>
</svg>