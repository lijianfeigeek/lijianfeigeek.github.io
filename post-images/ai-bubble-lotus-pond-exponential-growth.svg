<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-lotus-pond-exponential-growth-title ai-bubble-lotus-pond-exponential-growth-desc">
  <title id="ai-bubble-lotus-pond-exponential-growth-title">荷塘理论指数增长模型与认知分水岭</title>
  <desc id="ai-bubble-lotus-pond-exponential-growth-desc">展示荷塘从第1天零星萌芽，至第27天仅覆盖12.5%时先知者断定终局，第29天覆盖50%资本狂欢，直至第30天彻底铺满的指数演进规律</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="pond-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="260" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1: Day 1-26 -->
  <g transform="translate(40, 45)">
    <rect width="155" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="28" class="label-badge" fill="#64748b">第 1 ~ 26 天</text>
    <text x="14" y="52" class="label-title">零星微小萌芽</text>
    <line x1="14" y1="64" x2="141" y2="64" stroke="#f1f5f9" stroke-width="1"/>
    <text x="14" y="86" class="text-body">水面覆盖 &lt; 6%</text>
    <text x="14" y="106" class="text-body">增长被线性噪声掩盖</text>
    <text x="14" y="126" class="text-body">大众视而不见</text>
    <text x="14" y="146" class="text-body" fill="#94a3b8">“甚至被当做玩具”</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 198 130 L 217 130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pond-arrow)"/>

  <!-- Step 2: Day 27 (Focal) -->
  <g transform="translate(220, 45)">
    <rect width="155" height="170" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="14" y="28" class="tag-coral">第 27 天 · 分水岭</text>
    <text x="14" y="52" class="label-title" fill="#9a3412">覆盖 12.5% 水面</text>
    <line x1="14" y1="64" x2="141" y2="64" stroke="#fed7aa" stroke-width="1"/>
    <text x="14" y="86" class="text-body">87.5% 水面仍空旷</text>
    <text x="14" y="106" class="text-body">主流分析师冷嘲热讽</text>
    <text x="14" y="126" class="text-body" style="font-weight: 600;" fill="#bf4520">先知者洞察指数终局</text>
    <text x="14" y="146" class="text-body" fill="#9a3412">胜负已无实质悬念</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 378 130 L 397 130" stroke="#bf4520" stroke-width="1.5" marker-end="url(#pond-arrow)"/>

  <!-- Step 3: Day 28 -->
  <g transform="translate(400, 45)">
    <rect width="155" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="28" class="label-badge" fill="#0284c7">第 28 天</text>
    <text x="14" y="52" class="label-title">覆盖 25% 水面</text>
    <line x1="14" y1="64" x2="141" y2="64" stroke="#f1f5f9" stroke-width="1"/>
    <text x="14" y="86" class="text-body">水面肉眼可见绿意</text>
    <text x="14" y="106" class="text-body">两极分化与激烈争论</text>
    <text x="14" y="126" class="text-body">保守派仍坚信泡沫</text>
    <text x="14" y="146" class="text-body" fill="#64748b">“只是小众垂直特例”</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 558 130 L 577 130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pond-arrow)"/>

  <!-- Step 4: Day 29 -->
  <g transform="translate(580, 45)">
    <rect width="155" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="28" class="label-badge" fill="#ea580c">第 29 天</text>
    <text x="14" y="52" class="label-title">覆盖 50% 半数</text>
    <line x1="14" y1="64" x2="141" y2="64" stroke="#f1f5f9" stroke-width="1"/>
    <text x="14" y="86" class="text-body">全面狂欢过度乐观</text>
    <text x="14" y="106" class="text-body">热钱疯狂跟风加杠杆</text>
    <text x="14" y="126" class="text-body">大妈与散户跑步入场</text>
    <text x="14" y="146" class="text-body" fill="#ea580c">“这是永远涨的牛市”</text>
  </g>

  <!-- Arrow 4 to 5 -->
  <path d="M 738 130 L 757 130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pond-arrow)"/>

  <!-- Step 5: Day 30 -->
  <g transform="translate(760, 45)">
    <rect width="160" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="28" class="label-badge" fill="#15803d">第 30 天 · 终局</text>
    <text x="14" y="52" class="label-title">100% 铺满荷塘</text>
    <line x1="14" y1="64" x2="146" y2="64" stroke="#f1f5f9" stroke-width="1"/>
    <text x="14" y="86" class="text-body">旧体系彻底出清覆灭</text>
    <text x="14" y="106" class="text-body">全要素生产率重构</text>
    <text x="14" y="126" class="text-body">格局固化分利结束</text>
    <text x="14" y="146" class="text-body" fill="#15803d">“历史完成一次轮回”</text>
  </g>
</svg>