<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="macbrow-all-in-one-vs-specialized-ensemble-title macbrow-all-in-one-vs-specialized-ensemble-desc" id="macbrow-all-in-one-vs-specialized-ensemble-root">
      <title id="macbrow-all-in-one-vs-specialized-ensemble-title">单体大模型包打天下 vs 专精小模型异构管线范式对比</title>
      <desc id="macbrow-all-in-one-vs-specialized-ensemble-desc">单体大模型全家桶的高成本与高延迟，与异构模型各司其职构建毫秒级系统的架构演进</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #macbrow-all-in-one-vs-specialized-ensemble-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #macbrow-all-in-one-vs-specialized-ensemble-root text { font-family: "Geist", -apple-system, sans-serif; }
      #macbrow-all-in-one-vs-specialized-ensemble-root .mono { font-family: "Geist Mono", monospace; }
      #macbrow-all-in-one-vs-specialized-ensemble-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="macbrow-all-in-one-vs-specialized-ensemble-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="macbrow-all-in-one-vs-specialized-ensemble-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="macbrow-all-in-one-vs-specialized-ensemble-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Left: All-in-One LLM -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="425" height="270" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="425" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">MONOLITHIC ALL-IN-ONE (旧范式：单体大模型包打天下)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="397" height="40" rx="4" fill="#f8f9fa"/>
            <text x="10" y="24" font-size="11" fill="#2d3142">• 语音转文本 (耗费高额多模态上下文)</text>
          </g>
          <g transform="translate(14, 94)">
            <rect x="0" y="0" width="397" height="40" rx="4" fill="#f8f9fa"/>
            <text x="10" y="24" font-size="11" fill="#2d3142">• 图像截屏解析 (数百个视觉 Token 挤占算力)</text>
          </g>
          <g transform="translate(14, 140)">
            <rect x="0" y="0" width="397" height="40" rx="4" fill="#f8f9fa"/>
            <text x="10" y="24" font-size="11" fill="#2d3142">• 系统控制代码生成 (大模型思维链延迟 10s+)</text>
          </g>

          <g transform="translate(14, 195)">
            <rect x="0" y="0" width="397" height="60" rx="4" fill="#f8f9fa"/>
            <text x="10" y="22" font-size="11" font-weight="600" fill="#2d3142" class="mono" fill-opacity="0.6">CORE DRAWBACKS</text>
            <text x="10" y="42" font-size="11" fill="#2d3142" fill-opacity="0.75">成本高昂、延迟无法进入人机自然对话区间 (10~20s)</text>
          </g>
        </g>

        <!-- Right: Specialized Ensemble (Focal) -->
        <g transform="translate(495, 30)">
          <rect x="0" y="0" width="435" height="270" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="435" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" font-size="12" font-weight="700" fill="#bf4520" class="mono">SPECIALIZED ENSEMBLE (新范式：专精异构小模型 - FOCAL)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="407" height="40" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="24" font-size="11" font-weight="600" fill="#bf4520">Gradium: 专精流式声学切分 (&lt;100ms)</text>
          </g>
          <g transform="translate(14, 94)">
            <rect x="0" y="0" width="407" height="40" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="24" font-size="11" font-weight="600" fill="#bf4520">Jev (SLM): 专精 System 1 毫秒意图裁决 (~50ms)</text>
          </g>
          <g transform="translate(14, 140)">
            <rect x="0" y="0" width="407" height="40" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="24" font-size="11" font-weight="600" fill="#bf4520">原生 CDP / OSA: 零视觉直接调取宿主能力 (~150ms)</text>
          </g>

          <g transform="translate(14, 195)">
            <rect x="0" y="0" width="407" height="60" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="22" font-size="11" font-weight="700" fill="#bf4520" class="mono">CORE ADVANTAGES</text>
            <text x="10" y="42" font-size="11" font-weight="600" fill="#bf4520">端到端 300 毫秒即时响应，成本降低 90%，安全边界清晰</text>
          </g>
        </g>
      </g>
    </svg>
