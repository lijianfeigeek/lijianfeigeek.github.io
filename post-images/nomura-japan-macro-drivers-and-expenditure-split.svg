<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="nomura-japan-macro-drivers-and-expenditure-split-title nomura-japan-macro-drivers-and-expenditure-split-desc">
  <title id="nomura-japan-macro-drivers-and-expenditure-split-title">日本消费降级三十年宏观动能与支出结构分化模型</title>
  <desc id="nomura-japan-macro-drivers-and-expenditure-split-desc">展示1992年家庭支出见顶后，人口结构变迁驱动必需消费品与可选消费品两极分化及逆周期突围逻辑</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="440" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">野村证券宏观框架：日本家庭支出见顶与消费结构三十年大分化演进</text>
    <text x="896" y="16" text-anchor="end" class="tag">1990 - 2020s MACRO DYNAMICS</text>
  </g>

  <!-- Column 1: 宏观底座演变 -->
  <g transform="translate(32, 60)">
    <rect width="280" height="350" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="280" height="38" fill="#f8fafc" rx="8" />
    <rect y="30" width="280" height="8" fill="#f8fafc" />
    <line x1="0" y1="38" x2="280" y2="38" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="24" class="title">宏观底座演变 (1990-2020s)</text>
    <text x="266" y="24" text-anchor="end" class="tag">SHOCKS</text>

    <g transform="translate(14, 50)">
      <rect width="252" height="60" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">1992 年家庭总支出见顶</text>
        <text class="desc" x="0" y="18">• GDP 增速从 9.3% 骤降至 0.6%</text>
        <text class="desc" x="0" y="34">• 消费大盘总量陷入停滞平水期</text>
      </g>
    </g>

    <g transform="translate(14, 118)">
      <rect width="252" height="68" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">人口结构“三座大山”</text>
        <text class="desc" x="0" y="18">• 老龄化质变: 65岁以上占 28.4%</text>
        <text class="desc" x="0" y="34">• 劳动力人口自 1995 年见顶下滑</text>
        <text class="desc" x="0" y="50">• 单人家庭占比持续飙升至 38%</text>
      </g>
    </g>

    <g transform="translate(14, 194)">
      <rect width="252" height="68" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">双职工家庭超 1200 万户</text>
        <text class="desc" x="0" y="18">• 全职主妇数量腰斩至 500 万户</text>
        <text class="desc" x="0" y="34">• 家务劳动急剧短缺，时间极度稀缺</text>
        <text class="tag" x="0" y="50">买时间成为第一刚需</text>
      </g>
    </g>

    <g transform="translate(14, 270)">
      <rect width="252" height="64" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">团块次代客群崛起</text>
        <text class="desc" x="0" y="18">• 就业冰河期历练，崇尚去溢价</text>
        <text class="desc" x="0" y="34">• 拒绝奢侈虚饰，热衷日常小确幸</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Col 1 -> Col 2 -->
  <path d="M 312 170 L 342 170" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 312 310 L 342 310" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Column 2: 支出两极分化 -->
  <g transform="translate(342, 60)">
    <rect width="280" height="350" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="280" height="38" fill="#f8fafc" rx="8" />
    <rect y="30" width="280" height="8" fill="#f8fafc" />
    <line x1="0" y1="38" x2="280" y2="38" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="24" class="title">支出两极分化表现</text>
    <text x="266" y="24" text-anchor="end" class="tag">BIFURCATION</text>

    <!-- Branch A: 必需品保持韧性 -->
    <g transform="translate(14, 50)">
      <rect width="252" height="130" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1.5" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">必需消费品：逆势韧性 (+6.1%)</text>
        <text class="desc" style="fill:#166534;" x="0" y="20">• 食品总支出维持稳中有升</text>
        <text class="desc" style="fill:#166534;" x="0" y="38">• 酸奶大增 195.1%、速冻大增 178.2%</text>
        <text class="desc" style="fill:#166534;" x="0" y="56">• 复合面汁增 83.3%、速溶汤增 123.9%</text>
        <text class="green-tag" x="0" y="80">特征: 省时减负 + 研发机能性提价</text>
      </g>
    </g>

    <!-- Branch B: 可选品整体承压 (Core Focus) -->
    <g transform="translate(14, 196)">
      <rect width="252" height="138" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">可选消费品：深幅承压 (-16.4%)</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="20">• 服装鞋帽人均支出腰斩 (-50%+)</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="38">• 传统百货商场与宴会型饭店溃败</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="56">• 啤酒下挫 62%、白奶下挫 29%</text>
        <text class="coral-tag" x="0" y="80">唯有精神悦己与极致效率新物种生存</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Col 2 -> Col 3 -->
  <path d="M 622 115 L 652 115" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 622 265 L 652 265" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Column 3: 四大逆周期突围逻辑 -->
  <g transform="translate(652, 60)">
    <rect width="276" height="350" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="276" height="38" fill="#f8fafc" rx="8" />
    <rect y="30" width="276" height="8" fill="#f8fafc" />
    <line x1="0" y1="38" x2="276" y2="38" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="24" class="title">逆周期突围四大黄金赛道</text>
    <text x="262" y="24" text-anchor="end" class="tag">GOLDEN PATHS</text>

    <g transform="translate(14, 50)">
      <rect width="248" height="62" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">1. 省时减负（Time Capital）</text>
        <text class="desc" x="0" y="18">• 预制菜 / 复合调料 / PET 瓶装软饮</text>
        <text class="desc" x="0" y="34">• 解决双职工与独居家庭下厨痛点</text>
      </g>
    </g>

    <g transform="translate(14, 120)">
      <rect width="248" height="62" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">2. 高附加值提价（Value-Add）</text>
        <text class="desc" x="0" y="18">• 功效酸奶(LG21/R-1) / 锁鲜生酱油</text>
        <text class="desc" x="0" y="34">• 纯米大吟酿獭祭 / 抵抗上游成本</text>
      </g>
    </g>

    <g transform="translate(14, 190)">
      <rect width="248" height="62" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">3. 精神治愈与悦己（Dopamine）</text>
        <text class="desc" x="0" y="18">• 游戏动漫潮玩 / 露营 / 宠物拟人化</text>
        <text class="desc" x="0" y="34">• 平价微醺 RTD / 功效抗衰美妆</text>
      </g>
    </g>

    <g transform="translate(14, 260)">
      <rect width="248" height="74" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">4. 极致效率超头（Hyper-Efficiency）</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 优衣库 SPA / 萨莉亚 IE 测秒</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 藏寿司 IC 自动化 / 宿泊特化酒店</text>
        <text class="coral-tag" x="0" y="52">消灭所有中间商差价与多余动作</text>
      </g>
    </g>
  </g>
</svg>