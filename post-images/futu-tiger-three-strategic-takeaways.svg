<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futu-tiger-three-strategic-takeaways-title futu-tiger-three-strategic-takeaways-desc">
  <title id="futu-tiger-three-strategic-takeaways-title">华尔街做市体系与司法天平的三大实战启示</title>
  <desc id="futu-tiger-three-strategic-takeaways-desc">提炼统计学异常不等于司法定罪、极端做市黑天鹅尾部风险以及跨境民事管辖权审慎门槛的三大启示</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="280" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">富途老虎期权案：在华尔街做市体系与普通法天平之间的三大思考</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">为全球资本市场与专业衍生品交易者树立的合规自卫、尾部风险防范与司法程序范本</text>

  <!-- Card 1 -->
  <g transform="translate(40, 80)">
    <rect width="270" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="32" rx="8" fill="#f1f5f9"/>
    <text x="135" y="21" class="card-title" text-anchor="middle">启示一：统计学异常 ≠ 司法有罪</text>
    <g transform="translate(16, 44)">
      <text x="0" y="14" class="card-title" fill="#0369a1">主观怀疑与排他性证据的天堑</text>
      <text x="0" y="34" class="text-sub">• 账户持仓与下单异动可以引发商业怀疑</text>
      <text x="0" y="52" class="text-sub">• 但法治社会基石是严格遵循归责因果链</text>
      <text x="0" y="70" class="text-sub">• 避免庞大资本滥用诉讼抹杀正常市场套利</text>
    </g>
  </g>

  <!-- Card 2 (Focal Coral) -->
  <g transform="translate(345, 80)">
    <rect width="270" height="175" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="270" height="32" rx="8" fill="#ffedd5"/>
    <text x="135" y="21" class="badge-coral" text-anchor="middle">启示二：做市商绝非稳赚不赔</text>
    <g transform="translate(16, 44)">
      <text x="0" y="14" class="badge-coral">负伽马尾部风险的残酷反思</text>
      <text x="0" y="34" class="text-sub">• 算法常年收割 Theta 时间价值</text>
      <text x="0" y="52" class="text-sub">• 但底层资产剧烈跳空会瞬间打穿对冲</text>
      <text x="0" y="70" class="text-sub">• 没有任何算法能替代真金白银的尾部对冲</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(650, 80)">
    <rect width="270" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="32" rx="8" fill="#f1f5f9"/>
    <text x="135" y="21" class="card-title" text-anchor="middle">启示三：跨国司法管辖的权力边界</text>
    <g transform="translate(16, 44)">
      <text x="0" y="14" class="card-title" fill="#047857">离岸身份不是剥夺财产权的借口</text>
      <text x="0" y="34" class="text-sub">• 涉外地址绝非转移资产的现行犯证明</text>
      <text x="0" y="52" class="text-sub">• 积极应诉与严密持仓逻辑是维权关键</text>
      <text x="0" y="70" class="text-sub">• 普通法对财产诉前保全维持高度审慎门槛</text>
    </g>
  </g>
</svg>