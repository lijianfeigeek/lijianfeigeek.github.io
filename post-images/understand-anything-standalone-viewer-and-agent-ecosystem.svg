<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="ua-eco-title ua-eco-desc">
  <title id="ua-eco-title">零云端依赖的独立看板与多端 Agent 生态拓扑</title>
  <desc id="ua-eco-desc">展示基于.ua目录本地版本控制的只读Vite容器看板、React Flow交互、Monaco代码查看以及Claude Code、Codex多端智能体接入生态。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">零云端依赖的独立看版与多端 Agent 生态</text>
    <text class="subtitle" x="0" y="20">受 Git 版本控制的 .ua 知识资产、本地极速只读 Vite 容器与无缝接入主流智能体运行时</text>
  </g>

  <!-- Left: Repo Storage (.ua/ Directory) -->
  <g transform="translate(48, 86)">
    <rect width="250" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="16" y="24">1. Git 版本控制 .ua/ 资产库</text>

    <g transform="translate(16, 44)">
      <rect width="218" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">knowledge-graph.json</text>
        <text class="card-body" x="0" y="16">• 全量图谱实体节点与 38 类边关系</text>
        <text class="card-body" x="0" y="32">• Guided Tour 渐进式导览步骤</text>
        <text class="mono" fill="#2563eb" x="0" y="50">ASSET: 单一真理来源核心图谱</text>
      </g>
    </g>

    <g transform="translate(16, 142)">
      <rect width="218" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">fingerprints.json</text>
        <text class="card-body" x="0" y="16">• 全量源码 AST 结构指纹数据库</text>
        <text class="card-body" x="0" y="32">• 函数/类签名 Hash 检索表</text>
        <text class="mono" fill="#2563eb" x="0" y="50">CACHE: 增量毫秒级决策基石</text>
      </g>
    </g>

    <g transform="translate(16, 240)">
      <rect width="218" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">config.json &amp; ignore</text>
        <text class="card-body" x="0" y="16">• .understandignore 排除策略</text>
        <text class="card-body" x="0" y="32">• 框架检测先验知识与语言规则</text>
        <text class="mono" fill="#475569" x="0" y="50">RULES: 项目级定制规则配置</text>
      </g>
    </g>
  </g>

  <!-- Center: Standalone Readonly Viewer -->
  <g transform="translate(322, 86)">
    <rect width="300" height="348" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text class="box-title" fill="#15803d" x="16" y="24">2. 本地只读看板 (Zero LLM / Zero Cost)</text>

    <g transform="translate(16, 44)">
      <rect width="268" height="84" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">纯本地 Vite 容器服务</text>
        <text class="mono" fill="#166534" x="0" y="16">http://127.0.0.1:5173/?token=...</text>
        <text class="card-body" x="0" y="32">• 动态安全 Token 隔离访问防窃听</text>
        <text class="card-body" x="0" y="48">• 零远程 API 交互，零字节代码离机</text>
      </g>
    </g>

    <g transform="translate(16, 142)">
      <rect width="268" height="84" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">React Flow 高性能拓扑交互</text>
        <text class="card-body" x="0" y="16">• 支持数千节点 60 FPS 平滑缩放漫游</text>
        <text class="card-body" x="0" y="32">• 架构分层高亮、依赖链定向追踪</text>
        <text class="mono" fill="#166534" x="0" y="50">INTERACTION: 沉浸式架构可视化</text>
      </g>
    </g>

    <g transform="translate(16, 240)">
      <rect width="268" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">Monaco Code Viewer 联动</text>
        <text class="card-body" fill="#166534" x="0" y="16">• 点击图节点精准跳转真实源码行号</text>
        <text class="card-body" fill="#166534" x="0" y="32">• 语法高亮与函数定义快速预览</text>
      </g>
    </g>
  </g>

  <!-- Right: Multi-Agent Runtime Ecosystem -->
  <g transform="translate(646, 86)">
    <rect width="266" height="348" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text class="box-title" fill="#1e40af" x="16" y="24">3. 多端 Agent 接入生态</text>

    <g transform="translate(16, 44)">
      <rect width="234" height="66" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(12, 14)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">Claude Code 官方首选插件</text>
        <text class="mono" fill="#2563eb" x="0" y="16">/understand, /understand-domain</text>
        <text class="card-body" x="0" y="32">交互式命令行快速唤醒</text>
      </g>
    </g>

    <g transform="translate(16, 118)">
      <rect width="234" height="66" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(12, 14)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">Codex / Gemini CLI</text>
        <text class="card-body" x="0" y="16">• 标准化 CLI 管道调用</text>
        <text class="card-body" x="0" y="32">• 零摩擦嵌入本地自动化工作流</text>
      </g>
    </g>

    <g transform="translate(16, 192)">
      <rect width="234" height="66" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(12, 14)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">GitHub Copilot &amp; Cursor</text>
        <text class="card-body" x="0" y="16">• MCP (Model Context Protocol) 扩展</text>
        <text class="card-body" x="0" y="32">• 为编辑器提供精准架构语义上下文</text>
      </g>
    </g>

    <g transform="translate(16, 266)">
      <rect width="234" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#1e40af" x="0" y="0">OpenCode / Trae / Pi Agent</text>
        <text class="card-body" x="0" y="16">跨平台标准化中间态协议互通</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 298 260 L 322 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="322,260 316,256 316,264" fill="#94a3b8"/>

  <path d="M 646 260 L 622 260" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="622,260 628,256 628,264" fill="#94a3b8"/>
</svg>