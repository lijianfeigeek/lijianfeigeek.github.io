<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-national-service-decision-title singapore-pr-national-service-decision-desc">
  <title id="singapore-pr-national-service-decision-title">新加坡第二代男性国民服役（NS）法律判定与不可逆红线</title>
  <desc id="singapore-pr-national-service-decision-desc">解析第一代技术移民豁免服役、第二代男性PR无条件服役2年以及逃避兵役面临法律制裁的决策图谱</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .text-green { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #047857; }
      .text-coral { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡国民服役 (NS) 法律归属判定与不可逆红线</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">彻底澄清流言：凡父母担保获批或学生考取的第二代男性 PR，年满 18 岁必须服全职兵役</text>

  <!-- Root Question -->
  <g transform="translate(340, 75)">
    <rect width="280" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="140" y="24" class="card-title" text-anchor="middle">家庭男性成员通过何种途径取得身份？</text>
  </g>

  <!-- Connectors -->
  <path d="M 380 113 L 380 135 L 200 135 L 200 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 580 113 L 580 135 L 760 135 L 760 155" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Left: First Gen Exemption -->
  <g transform="translate(50, 155)">
    <rect width="300" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="300" height="28" rx="8" fill="#d1fae5"/>
    <text x="150" y="19" class="text-green" text-anchor="middle">第一代技术移民 (主申请人)</text>
    <g transform="translate(16, 40)">
      <text x="0" y="14" class="text-bold">• 凭 EP/SP 工作准证自身纳税获批者</text>
      <text x="0" y="34" class="text-green">依法完全豁免全职国民服役 (Full-time NS)</text>
    </g>
  </g>

  <!-- Right: Second Gen PR / Citizen Male (Must Serve) -->
  <g transform="translate(610, 155)">
    <rect width="300" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="300" height="28" rx="8" fill="#f1f5f9"/>
    <text x="150" y="19" class="card-title" text-anchor="middle">第二代男性 PR &amp; 新加坡男性公民</text>
    <g transform="translate(16, 40)">
      <text x="0" y="14" class="text-sub">• 父母担保取得 PR 或学生考试独立获批 PR</text>
      <text x="0" y="34" class="card-title" fill="#b91c1c">• 18 岁无条件履行 2 年全职兵役 + 10 年战备营训</text>
    </g>
  </g>

  <!-- Connector to Warning -->
  <path d="M 760 245 L 760 268 L 480 268 L 480 278" stroke="#bf4520" stroke-width="1.5" fill="none"/>

  <!-- Warning Red Box (Focal Coral) -->
  <g transform="translate(140, 278)">
    <rect width="680" height="62" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="680" height="24" rx="8" fill="#ffedd5"/>
    <text x="340" y="17" class="text-coral" text-anchor="middle">⚠️ 企图在 18 岁前主动放弃 PR 或擅自离境拒不服役的法律后果</text>
    <g transform="translate(20, 34)">
      <text x="0" y="12" class="card-title" fill="#b91c1c">触犯《征兵法案》Enlistment Act：身份即刻注销，永久列入黑名单，未来无法申办任何准证；</text>
      <text x="0" y="24" class="text-sub">若未来过境或入境新加坡将直接在边境被捕并面临最高刑罚与监禁，不可存任何侥幸心理。</text>
    </g>
  </g>
</svg>