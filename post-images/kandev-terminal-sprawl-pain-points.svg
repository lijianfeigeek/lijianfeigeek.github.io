<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-terminal-sprawl-pain-points-title kandev-terminal-sprawl-pain-points-desc" id="kandev-terminal-sprawl-pain-points-root">
      <title id="kandev-terminal-sprawl-pain-points-title">终端 Agent 并发开发的四大核心痛点矩阵</title>
      <desc id="kandev-terminal-sprawl-pain-points-desc">终端窗口蔓延、TUI 代码审查不可扩展、工作区状态踩踏与授权疲劳风险矩阵拆解</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-terminal-sprawl-pain-points-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-terminal-sprawl-pain-points-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-terminal-sprawl-pain-points-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-terminal-sprawl-pain-points-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-terminal-sprawl-pain-points-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-terminal-sprawl-pain-points-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-terminal-sprawl-pain-points-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Pain Point 1 -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="425" height="125" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="425" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">PAIN POINT 01: TERMINAL SPRAWL</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">终端窗口蔓延与全局感知丧失</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 在十几个 tmux 窗格与终端标签页间频繁切换，上下文极易遗失</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 无法获得全局并行任务的统一进度大盘与阻塞拓扑</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 单一会话崩溃难以追踪现场</text>
        </g>

        <!-- Pain Point 2 -->
        <g transform="translate(495, 30)">
          <rect x="0" y="0" width="435" height="125" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="435" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">PAIN POINT 02: REVIEW DOES NOT SCALE</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">TUI 代码审查无法扩展</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 几十个文件的巨幅 Diff 挤压在 80 列字符终端中，缺乏语法着色</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 缺失并排折叠比对与行级交互式批注能力</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 人类认知负荷严重过载，沦为机械点击 Accept 的橡皮图章</text>
        </g>

        <!-- Pain Point 3 (Focal) -->
        <g transform="translate(30, 180)">
          <rect x="0" y="0" width="425" height="125" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="425" height="26" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#bf4520" class="mono">PAIN POINT 03: WORKSPACE COLLISION (FOCAL)</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#bf4520">本地工作区状态严重踩踏</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 多个并发 Agent 共享同一个工作目录与 Git 分支</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.8">• 触发文件修改冲突、脏构建缓存与提交历史错乱</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.8">• 单个 Agent 产生的编译破坏直接瘫痪其他所有并发任务</text>
        </g>

        <!-- Pain Point 4 -->
        <g transform="translate(495, 180)">
          <rect x="0" y="0" width="435" height="125" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="435" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">PAIN POINT 04: APPROVAL FATIGUE</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">授权疲劳与失控风险双重困境</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 频繁打断式的权限弹窗让开发者疲于应付，诱发盲目一键放权</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 彻底放开系统权限则极易引发越界写盘与不可逆数据丢失</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 缺乏细粒度范围隔离与自动化门禁审查机制</text>
        </g>
      </g>
    </svg>
