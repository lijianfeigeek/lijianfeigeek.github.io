<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-sandbox-tiers-title codex-sandbox-tiers-desc" id="codex-sandbox-tiers-root">
      <title id="codex-sandbox-tiers-title">Codex 沙盒三级防御模型与权限管控边界</title>
      <desc id="codex-sandbox-tiers-desc">Read-only 只读审计、Workspace-write 黄金工程基准与 Full Access 系统级特权的安全边界与防护策略</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-sandbox-tiers-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-sandbox-tiers-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-sandbox-tiers-root .mono { font-family: "Geist Mono", monospace; }
      #codex-sandbox-tiers-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-sandbox-tiers-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-sandbox-tiers-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-sandbox-tiers-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Tier 1: Read-only -->
        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="280" height="260" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="32" rx="8" fill="#f8f9fa"/>
          <text x="16" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">LEVEL 1: READ-ONLY</text>
          
          <text x="16" y="60" font-size="15" font-weight="600" fill="#2d3142">只读安全审计模式</text>
          <text x="16" y="86" font-size="12" fill="#2d3142" fill-opacity="0.7">• 仅允许只读文件查看与结构化检索</text>
          <text x="16" y="108" font-size="12" fill="#2d3142" fill-opacity="0.7">• 严禁修改任何本地磁盘文件</text>
          <text x="16" y="130" font-size="12" fill="#2d3142" fill-opacity="0.7">• 禁止执行有副作用的写操作 Shell</text>
          
          <g transform="translate(16, 160)">
            <rect x="0" y="0" width="248" height="80" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="22" font-size="11" font-weight="600" fill="#2d3142" class="mono" fill-opacity="0.6">TARGET SCENARIOS</text>
            <text x="12" y="44" font-size="12" fill="#2d3142">架构巡检、安全代码审计、竞品逆向分析、开源代码学习研读</text>
          </g>
        </g>

        <!-- Tier 2: Workspace-write (Focal) -->
        <g transform="translate(340, 40)">
          <rect x="0" y="0" width="280" height="260" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="280" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="16" y="21" font-size="12" font-weight="600" fill="#bf4520" class="mono">LEVEL 2: WORKSPACE-WRITE (GOLDEN)</text>

          <text x="16" y="60" font-size="15" font-weight="600" fill="#bf4520">项目目录受限写入 (黄金基准)</text>
          <text x="16" y="86" font-size="12" fill="#2d3142" fill-opacity="0.8">• 严格限制在当前项目工作区根目录下</text>
          <text x="16" y="108" font-size="12" fill="#2d3142" fill-opacity="0.8">• 跨目录写入或越界操作弹出硬拦截</text>
          <text x="16" y="130" font-size="12" fill="#2d3142" fill-opacity="0.8">• 外部网络请求需人工确认放行</text>

          <g transform="translate(16, 160)">
            <rect x="0" y="0" width="248" height="80" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="12" y="22" font-size="11" font-weight="600" fill="#bf4520" class="mono">TARGET SCENARIOS</text>
            <text x="12" y="44" font-size="12" fill="#2d3142">覆盖日常 95% 以上的产品特性研发、代码重构、单测编写与 Bug 修复</text>
          </g>
        </g>

        <!-- Tier 3: Full access -->
        <g transform="translate(650, 40)">
          <rect x="0" y="0" width="280" height="260" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="32" rx="8" fill="#f8f9fa"/>
          <text x="16" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">LEVEL 3: FULL ACCESS</text>

          <text x="16" y="60" font-size="15" font-weight="600" fill="#2d3142">系统级全盘特权模式</text>
          <text x="16" y="86" font-size="12" fill="#2d3142" fill-opacity="0.7">• 突破单一项目目录边界约束</text>
          <text x="16" y="108" font-size="12" fill="#2d3142" fill-opacity="0.7">• 具备系统环境读写与全局软件安装权限</text>
          <text x="16" y="130" font-size="12" fill="#2d3142" fill-opacity="0.7">• 高风险命令需极度谨慎授权</text>

          <g transform="translate(16, 160)">
            <rect x="0" y="0" width="248" height="80" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="12" y="22" font-size="11" font-weight="600" fill="#2d3142" class="mono" fill-opacity="0.6">TARGET SCENARIOS</text>
            <text x="12" y="44" font-size="12" fill="#2d3142">系统级依赖安装、全局 CLI 编译配置、Docker 宿主配置与操作系统运维</text>
          </g>
        </g>
      </g>
    </svg>
