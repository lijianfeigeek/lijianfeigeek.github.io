<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="macbrow-applescript-multigate-verification-title macbrow-applescript-multigate-verification-desc" id="macbrow-applescript-multigate-verification-root">
      <title id="macbrow-applescript-multigate-verification-title">动态 AppleScript 生成的四重质量与安全守门员体系</title>
      <desc id="macbrow-applescript-multigate-verification-desc">osacompile 静态编译、_has_effect 副作用分析、黑名单沙盒过滤与试运行验证的防护体系</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #macbrow-applescript-multigate-verification-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #macbrow-applescript-multigate-verification-root text { font-family: "Geist", -apple-system, sans-serif; }
      #macbrow-applescript-multigate-verification-root .mono { font-family: "Geist Mono", monospace; }
      #macbrow-applescript-multigate-verification-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="macbrow-applescript-multigate-verification-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="macbrow-applescript-multigate-verification-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="macbrow-applescript-multigate-verification-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Input -->
        <g transform="translate(20, 50)">
          <rect x="0" y="0" width="130" height="130" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="130" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">INPUT INTENT</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">未知新意图</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• LLM 生成候选脚本</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• AppleScript 原型</text>
        </g>

        <!-- Gate 1: osacompile -->
        <g transform="translate(180, 50)">
          <rect x="0" y="0" width="165" height="130" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="165" height="24" rx="6" fill="#f8f9fa"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2e5aa8" class="mono">GATE 01: COMPILATION</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">osacompile 语法编译</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 静态语法与词法检查</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 阻断低劣语法幻觉</text>
          <text x="8" y="98" font-size="10" fill="#2d3142" fill-opacity="0.7">• 必须通过编译器检验</text>
        </g>

        <!-- Gate 2: _has_effect (Focal) -->
        <g transform="translate(375, 50)">
          <rect x="0" y="0" width="170" height="130" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="170" height="24" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="8" y="16" font-size="10" font-weight="700" fill="#bf4520" class="mono">GATE 02: EFFECT (FOCAL)</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#bf4520">_has_effect 副作用分析</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.8">• 排查是否包含有效动作</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.8">• 识别空逻辑与空转代码</text>
          <text x="8" y="98" font-size="10" fill="#2d3142" fill-opacity="0.8">• 确保具备真实系统效果</text>
        </g>

        <!-- Gate 3: Security Sandbox -->
        <g transform="translate(575, 50)">
          <rect x="0" y="0" width="165" height="130" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="165" height="24" rx="6" fill="#f8f9fa"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2e5aa8" class="mono">GATE 03: PERIMETER</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">黑名单与安全沙盒</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 严禁触碰终端/钥匙串</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 阻断高危系统设置改动</text>
          <text x="8" y="98" font-size="10" fill="#2d3142" fill-opacity="0.7">• BLOCKED_APPS 拦截</text>
        </g>

        <!-- Gate 4: Execution -->
        <g transform="translate(770, 50)">
          <rect x="0" y="0" width="165" height="130" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="165" height="24" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="8" y="16" font-size="10" font-weight="600" fill="#2d3142" class="mono">GATE 04: EXECUTION</text>
          <text x="8" y="44" font-size="13" font-weight="600" fill="#2d3142">试运行与知识沉淀</text>
          <text x="8" y="66" font-size="10" fill="#2d3142" fill-opacity="0.7">• 毫秒级受限试执行</text>
          <text x="8" y="82" font-size="10" fill="#2d3142" fill-opacity="0.7">• 成功自动入库缓存</text>
          <text x="8" y="98" font-size="10" fill="#2d3142" fill-opacity="0.7">• 晋升为成熟离线模板</text>
        </g>

        <!-- Connectors -->
        <path d="M 150 115 L 180 115" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-applescript-multigate-verification-arrow-default)" opacity="0.6"/>
        <path d="M 345 115 L 375 115" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-applescript-multigate-verification-arrow-accent)"/>
        <path d="M 545 115 L 575 115" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-applescript-multigate-verification-arrow-accent)"/>
        <path d="M 740 115 L 770 115" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#macbrow-applescript-multigate-verification-arrow-link)"/>

        <!-- Failure Return Loop -->
        <path d="M 460 180 L 460 215 Q 460 225 450 225 L 95 225 Q 85 225 85 215 L 85 180" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#macbrow-applescript-multigate-verification-arrow-accent)"/>
        <g transform="translate(240, 213)">
          <rect x="0" y="0" width="120" height="22" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
          <text x="8" y="15" font-size="10" font-weight="600" fill="#bf4520">任一门禁失败立即熔断</text>
        </g>
      </g>
    </svg>
