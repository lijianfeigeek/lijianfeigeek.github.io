<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-three-generations-evolution-title kandev-three-generations-evolution-desc" id="kandev-three-generations-evolution-root">
      <title id="kandev-three-generations-evolution-title">AI 辅助编程三代演进：从代码补全到 ADE 看板控制平面</title>
      <desc id="kandev-three-generations-evolution-desc">从单行补全助手、单终端黑盒对话到多环境隔离与看板协作控制平面的范式跃迁</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-three-generations-evolution-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-three-generations-evolution-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-three-generations-evolution-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-three-generations-evolution-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-three-generations-evolution-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-three-generations-evolution-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-three-generations-evolution-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Gen 1 -->
        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="270" height="180" rx="8" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="8" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">GEN 1: CODE ASSISTANT</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">第一代：代码补全助手</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 代表：GitHub Copilot / Cursor Tab</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 模式：单行/单函数就近续写补全</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 角色：人类主导每一行代码输入</text>
          <text x="12" y="148" font-size="11" font-weight="600" fill="#2d3142" fill-opacity="0.6">痛点：无法承载多文件复杂重构</text>
        </g>

        <!-- Gen 2 -->
        <g transform="translate(345, 40)">
          <rect x="0" y="0" width="270" height="180" rx="8" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="8" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">GEN 2: TERMINAL CLI AGENT</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">第二代：终端会话智能体</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 代表：Claude Code / Codex / Antigravity</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 模式：单终端自主工具调用与多文件编辑</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 角色：端到端独立执行任务</text>
          <text x="12" y="148" font-size="11" font-weight="600" fill="#2d3142">痛点：多 Agent 协作踩踏，审查难扩展</text>
        </g>

        <!-- Gen 3 (Focal) -->
        <g transform="translate(660, 40)">
          <rect x="0" y="0" width="270" height="180" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="270" height="28" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="700" fill="#bf4520" class="mono">GEN 3: KANBAN ADE (FOCAL)</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#bf4520">第三代：看板控制平面 + ADE</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 代表：Kandev 智能体协作开发环境</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.8">• 模式：Worktree 物理隔离 + 看板流转门禁</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.8">• 角色：人机编排，调度 20+ 并发智能体</text>
          <text x="12" y="148" font-size="11" font-weight="700" fill="#bf4520">优势：零状态踩踏，行级安全掌控</text>
        </g>

        <!-- Connectors -->
        <path d="M 300 130 L 345 130" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-three-generations-evolution-arrow-default)" opacity="0.6"/>
        <path d="M 615 130 L 660 130" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#kandev-three-generations-evolution-arrow-accent)"/>
      </g>
    </svg>
