<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brandpose-attention-filtering-rules-decision-tree-title brandpose-attention-filtering-rules-decision-tree-desc">
  <title id="brandpose-attention-filtering-rules-decision-tree-title">注意力清洗规则库：五道工程防护栏决策流程</title>
  <desc id="brandpose-attention-filtering-rules-decision-tree-desc">展示从原始视线热图出发，依次经过自头抑制、画幅边缘32px死区剔除、他人人体掩膜碰撞检测、轨迹缝合与店员排除的过滤漏斗</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="dec-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 0: Raw Gaze Input -->
  <g transform="translate(40, 160)">
    <rect width="130" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="65" y="26" text-anchor="middle" class="label-title">Gaze-LLE</text>
    <text x="65" y="44" text-anchor="middle" class="text-body">原始注视点</text>
  </g>

  <!-- Connect to Rule 1 -->
  <path d="M 170 190 L 198 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#dec-arrow)"/>

  <!-- Rule 1: Self-head -->
  <g transform="translate(200, 140)">
    <rect width="130" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="26" text-anchor="middle" class="label-badge" fill="#0284c7">规则 1 · 自头抑制</text>
    <text x="65" y="48" text-anchor="middle" class="text-feat">落点是否在</text>
    <text x="65" y="66" text-anchor="middle" class="text-feat">自身头部1.5x?</text>
    <text x="65" y="86" text-anchor="middle" class="text-body" style="font-size: 10px;">置零取次级峰</text>
  </g>

  <!-- Path to Rule 2 -->
  <path d="M 330 190 L 358 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#dec-arrow)"/>

  <!-- Rule 2: Edge Sticking -->
  <g transform="translate(360, 140)">
    <rect width="130" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="26" text-anchor="middle" class="label-badge" fill="#b91c1c">规则 2 · 边缘死区</text>
    <text x="65" y="48" text-anchor="middle" class="text-feat">距图像物理边缘</text>
    <text x="65" y="66" text-anchor="middle" class="text-feat">小于 32 像素?</text>
    <text x="65" y="86" text-anchor="middle" class="text-body" style="font-size: 10px;" fill="#b91c1c">判定看往画外剔除</text>
  </g>

  <!-- Path to Rule 3 -->
  <path d="M 490 190 L 518 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#dec-arrow)"/>

  <!-- Rule 3: People Collision -->
  <g transform="translate(520, 140)">
    <rect width="130" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="26" text-anchor="middle" class="label-badge" fill="#ea580c">规则 3 · 掩膜碰撞</text>
    <text x="65" y="48" text-anchor="middle" class="text-feat">落在他人轮廓</text>
    <text x="65" y="66" text-anchor="middle" class="text-feat">(YOLO-seg)?</text>
    <text x="65" y="86" text-anchor="middle" class="text-body" style="font-size: 10px;">记为人际注视</text>
  </g>

  <!-- Path to Rule 4 -->
  <path d="M 650 190 L 678 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#dec-arrow)"/>

  <!-- Rule 4 &amp; 5: Trajectory &amp; Staff (Focal) -->
  <g transform="translate(680, 125)">
    <rect width="130" height="130" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="65" y="26" text-anchor="middle" class="tag-coral">规则 4 &amp; 5</text>
    <text x="65" y="48" text-anchor="middle" class="text-feat" fill="#9a3412">1.5s/150px 缝合</text>
    <text x="65" y="68" text-anchor="middle" class="text-body">20轨聚为17客</text>
    <line x1="14" y1="78" x2="116" y2="78" stroke="#fed7aa" stroke-width="1"/>
    <text x="65" y="96" text-anchor="middle" class="text-feat" fill="#9a3412">梯子理货员</text>
    <text x="65" y="114" text-anchor="middle" class="text-body">标记 STAFF 屏蔽</text>
  </g>

  <!-- Path to Valid Attention -->
  <path d="M 810 190 L 838 190" stroke="#059669" stroke-width="1.5" marker-end="url(#dec-arrow)"/>

  <!-- Final Sink: Valid Shelf Attention -->
  <g transform="translate(840, 145)">
    <rect width="80" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="40" y="32" text-anchor="middle" class="label-title" fill="#15803d">写入真实</text>
    <text x="40" y="52" text-anchor="middle" class="label-title" fill="#15803d">有效货架</text>
    <text x="40" y="72" text-anchor="middle" class="tag-coral" fill="#15803d">注意力库</text>
  </g>

  <!-- Top Note Banner -->
  <g transform="translate(40, 30)">
    <rect width="880" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" class="label-title">💡 关键工程防伪影启示：</text>
    <text x="20" y="48" class="text-body">未清洗前，“太阳镜展架”因位于画幅边缘被虚假吸附 34% 视线；清洗后剔除画外边缘黏滞与人际遮挡，恢复真实 797 样本有效分布。</text>
  </g>
</svg>