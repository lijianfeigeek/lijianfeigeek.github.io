<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-3party-closed-loop-title card-scheme-3party-closed-loop-desc" id="card-scheme-3party-closed-loop-root">
        <title id="card-scheme-3party-closed-loop-title">三方闭环模式（Closed-Loop Scheme）运作机理</title>
        <desc id="card-scheme-3party-closed-loop-desc">运通（AMEX）早期与大来卡（Diners）采用的三方闭环架构：卡组织同时承担发卡与收单职责</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-3party-closed-loop-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-3party-closed-loop-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-3party-closed-loop-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-3party-closed-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-3party-closed-loop-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-3party-closed-loop-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Surrounding Container -->
        <rect x="40" y="24" width="880" height="312" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="70" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14" letter-spacing="0.04em">三方闭环模式（Closed-Loop Architecture · AMEX / Diners）</text>

        <!-- Node 1: Cardholder (Left) -->
        <g transform="translate(80, 100)">
          <rect x="0" y="0" width="220" height="180" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="220" height="32" rx="6" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="14" y="21" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">PARTICIPANT 01</text>
          <text x="14" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-size="15" font-weight="600">持卡人 (Cardholder)</text>
          <text x="14" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">向卡组织直接申卡</text>
          <text x="14" y="106" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">享有高额度/高端权益</text>
          <text x="14" y="128" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">次月全额还款清偿</text>
          <text x="14" y="156" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11">出示卡片于特约商户</text>
        </g>

        <!-- Node 2: Central Scheme &amp; Bank (Middle, Coral Accent Focal) -->
        <g transform="translate(370, 90)">
          <rect x="0" y="0" width="220" height="200" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.05"/>
          <rect x="0" y="0" width="220" height="32" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">FOCAL · DUAL ROLE</text>
          <text x="14" y="58" fill="#bf4520" font-family="'Geist', sans-serif" font-size="15" font-weight="600">闭环卡组织 (Scheme)</text>
          <text x="14" y="82" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">同时承担收单与发卡职能</text>
          <text x="14" y="106" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">掌控全部交易两端数据</text>
          <text x="14" y="128" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">自主定价高额商户扣率</text>
          <text x="14" y="150" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">行内直接总账轧差对冲</text>
          <text x="14" y="176" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11">无跨行结算手续费损耗</text>
        </g>

        <!-- Node 3: Merchant (Right) -->
        <g transform="translate(660, 100)">
          <rect x="0" y="0" width="220" height="180" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="220" height="32" rx="6" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="14" y="21" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">PARTICIPANT 02</text>
          <text x="14" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-size="15" font-weight="600">特约商户 (Merchant)</text>
          <text x="14" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">直接与卡组织签订协议</text>
          <text x="14" y="106" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">安装卡组织专用终端</text>
          <text x="14" y="128" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">承担 2.8%~3.5% 高费率</text>
          <text x="14" y="156" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11">获取高净值商旅客流</text>
        </g>

        <!-- Bottom Payment Flow Link (Cardholder -> Merchant) -->
        <path d="M 190 280 L 190 310 L 770 310 L 770 280" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#card-scheme-3party-closed-loop-arrow-accent)"/>
        <rect x="420" y="300" width="120" height="20" rx="3" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.3"/>
        <text x="480" y="314" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" font-weight="500" text-anchor="middle">出示卡片刷卡消费</text>

        <!-- Top Connectors: Scheme to Cardholder &amp; Scheme to Merchant -->
        <path d="M 370 160 L 300 160" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-3party-closed-loop-arrow-link)"/>
        <rect x="315" y="145" width="40" height="18" rx="2" fill="#ffffff"/>
        <text x="335" y="158" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">授信</text>

        <path d="M 590 160 L 660 160" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-3party-closed-loop-arrow-link)"/>
        <rect x="605" y="145" width="40" height="18" rx="2" fill="#ffffff"/>
        <text x="625" y="158" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">结算</text>
      </svg>
