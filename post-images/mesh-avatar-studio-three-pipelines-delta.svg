<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="mesh-avatar-three-pipelines-title mesh-avatar-three-pipelines-desc">
  <title id="mesh-avatar-three-pipelines-title">2D 虚拟形象三大技术路线架构对比与范式跃迁</title>
  <desc id="mesh-avatar-three-pipelines-desc">对比传统工业级 Live2D、纯神经渲染扩散模型与 Mesh Avatar Studio 架构在资产门槛、制作成本、推理算力与几何稳定性上的工程差异</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .focal-header { fill: rgba(191, 69, 32, 0.06); }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
      .focal-pill { fill: rgba(191, 69, 32, 0.08); stroke: rgba(191, 69, 32, 0.2); stroke-width: 1; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" />

  <!-- Column 1: 传统 Live2D -->
  <g transform="translate(40, 40)">
    <rect width="270" height="360" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 46 L 0 46 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">传统工业级 Live2D</text>
    <text x="210" y="28" class="text-muted">重度工艺</text>

    <!-- Steps -->
    <g transform="translate(16, 62)">
      <rect width="238" height="64" rx="6" class="pill" />
      <text x="12" y="24" class="text-subtitle">1. 资产准备：50~100+ PSD 图层</text>
      <text x="12" y="44" class="text-muted">依赖职业画师精细拆解每一个微小部件</text>
    </g>

    <g transform="translate(16, 136)">
      <rect width="238" height="64" rx="6" class="pill" />
      <text x="12" y="24" class="text-subtitle">2. 绑骨蒙皮：Cubism 繁复布点</text>
      <text x="12" y="44" class="text-muted">模型师手动耗时数天至数周调整参数</text>
    </g>

    <g transform="translate(16, 210)">
      <rect width="238" height="74" rx="6" class="pill" />
      <text x="12" y="24" class="text-subtitle">3. 运行代价与瓶颈</text>
      <text x="12" y="44" class="text-body">• 工业级表现力，但极高人工成本</text>
      <text x="12" y="62" class="text-body">• 任何角色形象变更必须全流程重绘</text>
    </g>

    <g transform="translate(16, 296)">
      <rect width="238" height="48" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
      <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#991b1b">制作周期：数周 · 成本昂贵</text>
      <text x="12" y="38" font-family="sans-serif" font-size="11" fill="#b91c1c">无法适应海量个性化数字人快速原型</text>
    </g>
  </g>

  <!-- Column 2: 纯神经渲染 -->
  <g transform="translate(345, 40)">
    <rect width="270" height="360" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 46 L 0 46 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">纯神经渲染模型</text>
    <text x="195" y="28" class="text-muted">LivePortrait</text>

    <!-- Steps -->
    <g transform="translate(16, 62)">
      <rect width="238" height="64" rx="6" class="pill" />
      <text x="12" y="24" class="text-subtitle">1. 资产准备：单张静态立绘</text>
      <text x="12" y="44" class="text-muted">输入任意 JPG/PNG，零前置人工拆解</text>
    </g>

    <g transform="translate(16, 136)">
      <rect width="238" height="64" rx="6" class="pill" />
      <text x="12" y="24" class="text-subtitle">2. 驱动机制：逐帧隐式扩散重绘</text>
      <text x="12" y="44" class="text-muted">深度网络端到端逐帧重绘面部动态</text>
    </g>

    <g transform="translate(16, 210)">
      <rect width="238" height="74" rx="6" class="pill" />
      <text x="12" y="24" class="text-subtitle">3. 运行代价与瓶颈</text>
      <text x="12" y="44" class="text-body">• 显存黑洞：需独显 RTX 3080/4090</text>
      <text x="12" y="62" class="text-body">• 延迟高 (150~500ms)，局部容易频闪</text>
    </g>

    <g transform="translate(16, 296)">
      <rect width="238" height="48" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
      <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#991b1b">推流延迟：>150ms · 算力黑洞</text>
      <text x="12" y="38" font-family="sans-serif" font-size="11" fill="#b91c1c">缺乏透明通道，OBS直播集成极其沉重</text>
    </g>
  </g>

  <!-- Column 3: Mesh Avatar Studio (Focal) -->
  <g transform="translate(650, 40)">
    <rect width="270" height="360" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 46 L 0 46 Z" class="focal-header" stroke="#bf4520" stroke-width="1" />
    <text x="16" y="28" class="text-focal-title">Mesh Avatar Studio</text>
    <text x="195" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#bf4520">轻量破局</text>

    <!-- Steps -->
    <g transform="translate(16, 62)">
      <rect width="238" height="64" rx="6" class="focal-pill" />
      <text x="12" y="24" class="text-subtitle" fill="#bf4520">1. 单张透明 PNG + Agent 自动标定</text>
      <text x="12" y="44" class="text-muted">Coding Agent 辅助视觉测算与膜方程修补</text>
    </g>

    <g transform="translate(16, 136)">
      <rect width="238" height="64" rx="6" class="focal-pill" />
      <text x="12" y="24" class="text-subtitle" fill="#bf4520">2. 本地 WebGL2 几何形变引擎</text>
      <text x="12" y="44" class="text-muted">24点样条闭眼 + 2.5D法线光影重构</text>
    </g>

    <g transform="translate(16, 210)">
      <rect width="238" height="74" rx="6" class="focal-pill" />
      <text x="12" y="24" class="text-subtitle" fill="#bf4520">3. 极致工程化收益</text>
      <text x="12" y="44" class="text-body">• 满血 60 FPS，延迟 &lt; 16ms 零感知</text>
      <text x="12" y="62" class="text-body">• 纯浏览器原生 WebGL2，零显卡负担</text>
    </g>

    <g transform="translate(16, 296)">
      <rect width="238" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#166534">制作数分钟 · 满帧原生透明</text>
      <text x="12" y="38" font-family="sans-serif" font-size="11" fill="#15803d">OBS 浏览器源一键即插即用</text>
    </g>
  </g>
</svg>