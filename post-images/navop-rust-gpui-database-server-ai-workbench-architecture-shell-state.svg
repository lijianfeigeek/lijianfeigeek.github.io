<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="navop-state-title navop-state-desc" id="navop-state-root" data-diagram="state-machine">
  <title id="navop-state-title">Navop 零远端写入 Shell 集成与 OSC 133 ExecSupervisor 状态机</title>
  <desc id="navop-state-desc">展示 SSH 会话建立后从只读探测、短探针 Bootstrap、64KB 回显抑制注入到 Integrated 命令纪元追踪与看门狗降级 Plain 的完整有限状态机。</desc>
  <defs>
    <pattern id="ns-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.22"/>
    </pattern>
    <marker id="ns-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="ns-arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="ns-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="ns-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1040" height="580" fill="#f8fafc"/>
  <rect width="1040" height="580" fill="url(#ns-dots)"/>

  <!-- Header -->
  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">State Machine: Zero-Remote-Write PTY Injection &amp; Non-EOF ExecSupervisor</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">NO ~/.bashrc MUTATION · 64KB ECHO SUPPRESSION · OSC 133 PROMPT EPOCH · NON-DESTRUCTIVE AGENT CANCEL</text>

  <!-- ========================================================= -->
  <!-- CONNECTORS DRAWN BEFORE STATE BOXES (Orthogonal r=8)      -->
  <!-- ========================================================= -->
  <!-- Start -> Probing -->
  <line x1="48" y1="148" x2="76" y2="148" stroke="#0f172a" stroke-width="1.4" marker-end="url(#ns-arrow)"/>

  <!-- Probing -> WaitingForFirstOutput -->
  <line x1="256" y1="148" x2="316" y2="148" stroke="#64748b" stroke-width="1.3" marker-end="url(#ns-arrow)"/>
  <rect x="262" y="122" width="48" height="16" rx="2" fill="#f8fafc"/>
  <text x="286" y="133" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#475569">BASH/ZSH</text>

  <!-- WaitingForFirstOutput -> Bootstrapping -->
  <line x1="516" y1="148" x2="576" y2="148" stroke="#0284c7" stroke-width="1.3" marker-end="url(#ns-arrow-blue)"/>
  <rect x="520" y="122" width="52" height="16" rx="2" fill="#f8fafc"/>
  <text x="546" y="133" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0284c7">1ST CHUNK</text>

  <!-- Bootstrapping -> Injecting -->
  <line x1="776" y1="148" x2="836" y2="148" stroke="#0284c7" stroke-width="1.3" marker-end="url(#ns-arrow-blue)"/>
  <rect x="780" y="122" width="52" height="16" rx="2" fill="#f8fafc"/>
  <text x="806" y="133" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0284c7">MARKER OK</text>

  <!-- Injecting -> Integrated (Happy Path Down) -->
  <path d="M 924 196 L 924 252 Q 924 260 916 260 L 796 260 Q 788 260 788 268 L 788 300" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ns-arrow-coral)"/>
  <rect x="804" y="236" width="112" height="16" rx="2" fill="#f8fafc"/>
  <text x="860" y="247" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">OSC 1337 READY=1</text>

  <!-- WaitingForFirstOutput -> Integrated (Legacy OSC 133;B shortcut) -->
  <path d="M 444 196 L 444 260 Q 444 268 452 268 L 620 268 Q 628 268 628 276 L 628 300" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ns-arrow-green)"/>
  <rect x="480" y="244" width="112" height="16" rx="2" fill="#f8fafc"/>
  <text x="536" y="255" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#059669">LEGACY 133;B SKIP</text>

  <!-- Probing -> Plain (Unsupported shell or Huawei USG single-session disconnect fallback) -->
  <path d="M 164 196 L 164 300" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ns-arrow)"/>
  <rect x="174" y="236" width="128" height="18" rx="2" fill="#f8fafc"/>
  <text x="238" y="248" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">PLAIN_CHANNEL_ONLY</text>

  <!-- Bootstrapping / Injecting Timeout -> Plain -->
  <path d="M 676 196 L 676 220 Q 676 228 668 228 L 364 228 Q 356 228 356 236 L 356 300" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ns-arrow)"/>
  <rect x="368" y="204" width="164" height="16" rx="2" fill="#f8fafc"/>
  <text x="450" y="215" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#e11d48">5S TIMEOUT / 30S WATCHDOG</text>

  <!-- Integrated -> SubmissionPending / CommandRunning -> Integrated (ExecSupervisor loop) -->
  <path d="M 708 408 L 708 448" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ns-arrow-coral)"/>
  <rect x="576" y="420" width="120" height="16" rx="2" fill="#f8fafc"/>
  <text x="636" y="431" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">TERMINAL.EXEC SUBMIT</text>

  <path d="M 844 448 L 844 408" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#ns-arrow-green)"/>
  <rect x="854" y="420" width="144" height="16" rx="2" fill="#f8fafc"/>
  <text x="926" y="431" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#059669">133;D OR PROMPT EPOCH</text>

  <!-- Plain -> write_command + read fallback -->
  <path d="M 244 404 L 244 448" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ns-arrow)"/>
  <rect x="100" y="420" width="132" height="16" rx="2" fill="#f8fafc"/>
  <text x="166" y="431" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">NESTED SUDO / NO OSC</text>

  <!-- ========================================================= -->
  <!-- START DOT & STATE NODES (4px Grid, Isolated Coordinates)  -->
  <!-- ========================================================= -->
  <circle cx="40" cy="148" r="6" fill="#0f172a"/>

  <!-- State 1: Probing -->
  <g transform="translate(76, 100)">
    <rect x="0" y="0" width="180" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#64748b">S1 · EXEC PROBE (1S)</text>
    <text x="12" y="40" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">只读探测 $SHELL</text>
    <text x="12" y="60" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">跳过 ash / dash / fish</text>
    <text x="12" y="78" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="10.5" fill="#64748b">断连自动重连单通道</text>
  </g>

  <!-- State 2: WaitingForFirstOutput -->
  <g transform="translate(316, 100)">
    <rect x="0" y="0" width="200" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0284c7">S2 · DEFER INPUT QUEUE</text>
    <text x="12" y="40" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">WaitingForFirstOutput</text>
    <text x="12" y="60" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="10.5" fill="#475569">等待 login_expect 完成</text>
    <text x="12" y="78" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">用户敲击暂存不丢字</text>
  </g>

  <!-- State 3: Bootstrapping -->
  <g transform="translate(576, 100)">
    <rect x="0" y="0" width="200" height="96" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0284c7">S3 · SHORT CANARY</text>
    <text x="12" y="40" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Bootstrapping</text>
    <text x="12" y="60" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="10.5" fill="#475569">防 PAM Banner 期拆碎长脚本</text>
    <text x="12" y="78" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">前置挂载 zshaddhistory</text>
  </g>

  <!-- State 4: Injecting -->
  <g transform="translate(836, 100)">
    <rect x="0" y="0" width="176" height="96" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0284c7">S4 · SUPPRESS (64KB)</text>
    <text x="12" y="40" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Injecting</text>
    <text x="12" y="60" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">eval $'...' 单行内存注入</text>
    <text x="12" y="78" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="10.5" fill="#64748b">bash 倒序清理 history</text>
  </g>

  <!-- State 5: Plain Fallback -->
  <g transform="translate(76, 300)">
    <rect x="0" y="0" width="340" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="16" y="22" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">S5 · SAFE DEGRADATION · PLAIN PTY</text>
    <text x="16" y="44" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Plain 裸终端直通态（零阻塞放行）</text>
    <text x="16" y="66" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#334155">立即丢弃抑制缓冲并按序重放 deferred 队列输入</text>
    <text x="16" y="86" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">严禁二次重注入脚本（彻底根治 4KB 源码回显污染）</text>
  </g>

  <!-- State 6: Integrated & Ready (FOCAL CORAL STATE) -->
  <g transform="translate(556, 300)">
    <rect x="0" y="0" width="456" height="108" rx="8" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.5"/>
    <text x="16" y="22" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#bf4520">S6 · FOCAL HAPPY STATE · INTEGRATED (ZERO REMOTE WRITES)</text>
    <text x="16" y="44" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">Integrated 就绪态 + ExecSupervisor::Ready</text>
    <text x="16" y="66" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#0f172a">空提示符零 Ctrl+C 直接提交命令；仅检测到半行未提交输入才发一次 ETX 清理</text>
    <text x="16" y="88" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">OSC 133 A/B/C/D + OSC 7 目录跟随 + OSC 9/777 跨平台系统通知</text>
  </g>

  <!-- State 7: Plain AI Fallback Box -->
  <g transform="translate(76, 448)">
    <rect x="0" y="0" width="340" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="22" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">AI FALLBACK · WRITE_COMMAND + READ</text>
    <text x="16" y="42" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">terminal.write_command + terminal.read(lines=N)</text>
    <text x="16" y="60" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">拒绝换行与控制字符 · 有界只读读取尾部滚屏</text>
  </g>

  <!-- State 8: ExecSupervisor Active CommandRunning -->
  <g transform="translate(556, 448)">
    <rect x="0" y="0" width="456" height="72" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.1"/>
    <text x="16" y="22" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#0f172a">S7 · SUBMISSION_PENDING → COMMAND_RUNNING (1MB BOUNDED)</text>
    <text x="16" y="42" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">非 EOF 完成判定：nohup / 后台 &amp; 进程不阻塞 Agent 回合</text>
    <text x="16" y="60" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">Agent 取消仅 detach waiter（零 Ctrl+C）；中断须显式调 terminal.control</text>
  </g>

  <!-- Legend Strip -->
  <line x1="32" y1="536" x2="1012" y2="536" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="558" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#475569">LEGEND</text>
  <circle cx="112" cy="554" r="5" fill="#0f172a"/>
  <text x="126" y="558" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">SSH 建连起点</text>
  <rect x="224" y="548" width="16" height="12" rx="2" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
  <text x="248" y="558" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">零落盘受控集成态（远端连接前后 MD5 完全一致）</text>
  <line x1="548" y1="554" x2="576" y2="554" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="584" y="558" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">超时看门狗与受限网络设备无损降级路径</text>
</svg>
