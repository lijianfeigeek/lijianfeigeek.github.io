<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-family-dynamic-decision-tree-title singapore-pr-family-dynamic-decision-tree-desc">
  <title id="singapore-pr-family-dynamic-decision-tree-title">新加坡身份经济学家庭动态综合决策树</title>
  <desc id="singapore-pr-family-dynamic-decision-tree-desc">结合子女学龄、房产置业阶段与跨国生活重心三大维度，构建理性选择PR或公民的动态决策模型</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .badge-ok { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; fill: #047857; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡身份取舍综合决策树：算清制度账，看清人生局</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">超越单一省钱清单，将家庭子女、不动产杠杆与跨国生活重心综合建模</text>

  <!-- Step 1: Education -->
  <g transform="translate(40, 75)">
    <rect width="270" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">维度一：家庭是否有学龄子女？</text>
    
    <g transform="translate(16, 46)">
      <rect width="56" height="18" rx="4" fill="#d1fae5"/>
      <text x="28" y="13" class="badge-ok" text-anchor="middle">是 (多娃)</text>
      <text x="0" y="36" class="text-bold">教育杠杆巨大</text>
      <text x="0" y="54" class="text-sub">• 双娃基础学费差额超 15 万新币</text>
      <text x="0" y="72" class="text-sub">• 公民享小一报名 1~2C 绝对优先</text>
      <text x="0" y="92" class="badge-ok">👉 强烈推荐尽早规划入籍</text>
    </g>

    <line x1="16" y1="160" x2="254" y2="160" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(16, 172)">
      <rect width="56" height="18" rx="4" fill="#f1f5f9"/>
      <text x="28" y="13" class="text-sub" font-weight="700" text-anchor="middle">否 / 成年</text>
      <text x="0" y="36" class="text-bold">教育差额归零</text>
      <text x="0" y="54" class="text-sub">• 无公立中小学学杂费剪刀差</text>
      <text x="0" y="74" class="text-sub">👉 教育维度对决策无权重影响</text>
    </g>
  </g>

  <!-- Step 2: Housing -->
  <g transform="translate(345, 75)">
    <rect width="270" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="270" height="34" rx="8" fill="#f1f5f9"/>
    <text x="135" y="22" class="card-title" text-anchor="middle">维度二：核心置业偏好与时机？</text>
    
    <g transform="translate(16, 46)">
      <rect width="56" height="18" rx="4" fill="#d1fae5"/>
      <text x="28" y="13" class="badge-ok" text-anchor="middle">刚需打新</text>
      <text x="0" y="36" class="text-bold">释放巨额金融红利</text>
      <text x="0" y="54" class="text-sub">• 获 BTO 30%~40% 原始折价</text>
      <text x="0" y="72" class="text-sub">• 首套免 5% ABSD，省数万至数十万</text>
      <text x="0" y="92" class="badge-ok">👉 入籍置业收益极高</text>
    </g>

    <line x1="16" y1="160" x2="254" y2="160" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(16, 172)">
      <rect width="56" height="18" rx="4" fill="#f1f5f9"/>
      <text x="28" y="13" class="text-sub" font-weight="700" text-anchor="middle">已有房产</text>
      <text x="0" y="36" class="text-bold">房产边际增益减弱</text>
      <text x="0" y="54" class="text-sub">• 名下早有私宅或组屋满 3 年已购</text>
      <text x="0" y="74" class="text-sub">👉 无需为买房急于转换身份</text>
    </g>
  </g>

  <!-- Step 3: Life重心 (Focal Coral) -->
  <g transform="translate(650, 75)">
    <rect width="270" height="280" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#ffedd5"/>
    <text x="135" y="22" class="badge-coral" text-anchor="middle">维度三：跨国生活与家庭重心？</text>
    
    <g transform="translate(16, 46)">
      <rect width="66" height="18" rx="4" fill="#ffedd5"/>
      <text x="33" y="13" class="badge-coral" text-anchor="middle">国内牵绊重</text>
      <text x="0" y="36" class="text-bold">赡养回国考量深</text>
      <text x="0" y="54" class="text-sub">• 父母在国内，需长期无签证回国尽孝</text>
      <text x="0" y="72" class="text-sub">• 涉及国内资产、继承与行政便利</text>
      <text x="0" y="92" class="badge-coral">👉 建议继续保留中国护照与 PR</text>
    </g>

    <line x1="16" y1="160" x2="254" y2="160" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(16, 172)">
      <rect width="66" height="18" rx="4" fill="#e0f2fe"/>
      <text x="33" y="13" class="text-sub" fill="#0284c7" font-weight="700" text-anchor="middle">扎根本地</text>
      <text x="0" y="36" class="text-bold">行政确定性拉满</text>
      <text x="0" y="54" class="text-sub">• 举家定居新加坡，无长期出境计划</text>
      <text x="0" y="72" class="text-sub">• 彻底免除 REP 180 天严苛续签内耗</text>
      <text x="0" y="92" class="badge-ok">👉 顺理成章转为公民</text>
    </g>
  </g>
</svg>