<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="sd-proto-title sd-proto-desc">
  <title id="sd-proto-title">API 通信协议的四维权衡：REST vs gRPC vs WebSocket vs SSE</title>
  <desc id="sd-proto-desc">详细对比对外开放API、微服务RPC、实时全双工与大模型Token流式推流四大协议的技术特性与场景选型。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">现代分布式 API 通信协议四维权衡矩阵</text>
    <text class="subtitle" x="0" y="20">根据网络延迟预算、双向流控要求与客户端环境做出精准技术架构匹配</text>
  </g>

  <!-- 4 Columns -->
  <!-- Col 1: RESTful -->
  <g transform="translate(48, 86)">
    <rect width="206" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 16)">
      <text class="col-header" fill="#334155" x="0" y="0">1. RESTful API</text>
      <text class="mono" fill="#64748b" x="0" y="16">HTTP/1.1 or HTTP/2</text>
      
      <g transform="translate(0, 32)">
        <rect width="178" height="268" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-title" x="0" y="0">载荷格式与特征</text>
          <text class="card-body" x="0" y="16">• JSON 自描述文本</text>
          <text class="card-body" x="0" y="32">• 无状态标准动词</text>
          <text class="card-body" x="0" y="48">• 浏览器原生友好</text>

          <text class="card-title" fill="#15803d" x="0" y="78">核心适用场景</text>
          <text class="card-body" x="0" y="94">• 公开第三方 OpenAPI</text>
          <text class="card-body" x="0" y="110">• 标准 CRUD 业务管理</text>
          <text class="card-body" x="0" y="126">• Web 静态资源缓存</text>

          <text class="card-title" fill="#be123c" x="0" y="156">架构缺陷与代价</text>
          <text class="card-body" x="0" y="172">• 头部信息冗余膨胀</text>
          <text class="card-body" x="0" y="188">• 缺乏编译期强类型</text>
          <text class="card-body" x="0" y="204">• Over-fetching 浪费带宽</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Col 2: gRPC (Focal) -->
  <g transform="translate(268, 86)">
    <rect width="206" height="348" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(14, 16)">
      <text class="col-header" fill="#1d4ed8" x="0" y="0">2. gRPC (微服务基准)</text>
      <text class="mono" fill="#2563eb" x="0" y="16">HTTP/2 + Protobuf</text>
      
      <g transform="translate(0, 32)">
        <rect width="178" height="268" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-title" x="0" y="0">载荷格式与特征</text>
          <text class="card-body" x="0" y="16">• 二进制压缩 Protobuf</text>
          <text class="card-body" x="0" y="32">• 单 TCP 多路复用</text>
          <text class="card-body" x="0" y="48">• 强约束契约代码生成</text>

          <text class="card-title" fill="#15803d" x="0" y="78">核心适用场景</text>
          <text class="card-body" x="0" y="94">• 数据中心内部微服务</text>
          <text class="card-body" x="0" y="110">• 异构语言高吞吐 RPC</text>
          <text class="card-body" x="0" y="126">• 低时延网络链路</text>

          <text class="card-title" fill="#be123c" x="0" y="156">架构缺陷与代价</text>
          <text class="card-body" x="0" y="172">• 浏览器兼容较差 (gRPC-Web)</text>
          <text class="card-body" x="0" y="188">• 二进制载荷抓包调试难</text>
          <text class="card-body" x="0" y="204">• 需专用反向代理处理流控</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Col 3: WebSocket -->
  <g transform="translate(488, 86)">
    <rect width="206" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(14, 16)">
      <text class="col-header" fill="#334155" x="0" y="0">3. WebSocket</text>
      <text class="mono" fill="#64748b" x="0" y="16">TCP 全双工长连接</text>
      
      <g transform="translate(0, 32)">
        <rect width="178" height="268" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-title" x="0" y="0">载荷格式与特征</text>
          <text class="card-body" x="0" y="16">• 双向持续长会话</text>
          <text class="card-body" x="0" y="32">• 帧格式轻量化</text>
          <text class="card-body" x="0" y="48">• 客户端服务端双工推送</text>

          <text class="card-title" fill="#15803d" x="0" y="78">核心适用场景</text>
          <text class="card-body" x="0" y="94">• 实时金融行情交易</text>
          <text class="card-body" x="0" y="110">• 多人在线协同文档编辑</text>
          <text class="card-body" x="0" y="126">• 即时通讯 IM / 多人游戏</text>

          <text class="card-title" fill="#be123c" x="0" y="156">架构缺陷与代价</text>
          <text class="card-body" x="0" y="172">• 有状态连接管理复杂</text>
          <text class="card-body" x="0" y="188">• 负载均衡需配置粘性会话</text>
          <text class="card-body" x="0" y="204">• 断网心跳保活消耗内存</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Col 4: SSE (LLM Standard) -->
  <g transform="translate(708, 86)">
    <rect width="204" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <g transform="translate(14, 16)">
      <text class="col-header" fill="#c2410c" x="0" y="0">4. SSE (Server-Sent)</text>
      <text class="mono" fill="#ea580c" x="0" y="16">HTTP event-stream</text>
      
      <g transform="translate(0, 32)">
        <rect width="176" height="268" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="card-title" x="0" y="0">载荷格式与特征</text>
          <text class="card-body" x="0" y="16">• 基于标准纯文本 HTTP</text>
          <text class="card-body" x="0" y="32">• 原生支持断线自动重连</text>
          <text class="card-body" x="0" y="48">• 完美兼容所有网关/CDN</text>

          <text class="card-title" fill="#15803d" x="0" y="78">核心适用场景</text>
          <text class="card-body" x="0" y="94">• LLM 大模型流式输出</text>
          <text class="card-body" x="0" y="110">• 股票单向通知与告警</text>
          <text class="card-body" x="0" y="126">• 生产环境事实工业标准</text>

          <text class="card-title" fill="#be123c" x="0" y="156">架构缺陷与代价</text>
          <text class="card-body" x="0" y="172">• 仅支持单向服务端推送</text>
          <text class="card-body" x="0" y="188">• 客户端需走独立通道上行</text>
          <text class="card-body" x="0" y="204">• HTTP/1.1 存在连接数限制</text>
        </g>
      </g>
    </g>
  </g>
</svg>