<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowCyan2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowCoral2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="640" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="592" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="170" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">SECURITY &amp; NETWORK BYPASS</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">127.0.0.1 闭环欺骗：免电脑本地 OTA 零弹窗安装时序</text>
    <text x="0" y="74" fill="#475569" font-size="13">解密 LCSign 如何利用公网 DNS 解析至本地回环与商业权威 CA 证书，突破 iOS itms-services 的强制 HTTPS 信任封锁</text>
  </g>

  <!-- Actors Lifeline Headers -->
  <!-- Actor 1: LCSign App -->
  <g transform="translate(70, 160)">
    <rect width="170" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="85" y="22" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">LCSign 客户端</text>
    <text x="85" y="38" fill="#475569" font-size="10" text-anchor="middle">端侧沙盒进程</text>
    <line x1="85" y1="46" x2="85" y2="430" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 2: Local GCDWebServer -->
  <g transform="translate(280, 160)">
    <rect width="180" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="90" y="22" fill="#0284c7" font-size="12" font-weight="700" text-anchor="middle">内置 GCDWebServer</text>
    <text x="90" y="38" fill="#475569" font-size="10" text-anchor="middle">127.0.0.1:8088 监听</text>
    <line x1="90" y1="46" x2="90" y2="430" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 3: iOS SpringBoard / WebKit -->
  <g transform="translate(500, 160)">
    <rect width="180" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="90" y="22" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">iOS itms-services</text>
    <text x="90" y="38" fill="#475569" font-size="10" text-anchor="middle">系统 URL 调度中心</text>
    <line x1="90" y1="46" x2="90" y2="430" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 4: Apple Trust Store -->
  <g transform="translate(720, 160)">
    <rect width="160" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="80" y="22" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">系统根证书信任库</text>
    <text x="80" y="38" fill="#475569" font-size="10" text-anchor="middle">iOS Root CA Store</text>
    <line x1="80" y1="46" x2="80" y2="430" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Actor 5: installcoordinationd -->
  <g transform="translate(910, 160)">
    <rect width="140" height="46" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" />
    <text x="70" y="22" fill="#e11d48" font-size="12" font-weight="700" text-anchor="middle">安装协调守护进程</text>
    <text x="70" y="38" fill="#fda4af" font-size="10" text-anchor="middle">installcoordinationd</text>
    <line x1="70" y1="46" x2="70" y2="430" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Step 1: Start Server &amp; Bind SSL -->
  <g transform="translate(155, 230)">
    <line x1="0" y1="0" x2="215" y2="0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowCyan2)" />
    <rect x="25" y="-18" width="165" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="30" y="-5" fill="#0284c7" font-size="10" font-weight="600">1. 挂载 i.lcsignx.com.p12 (TLS)</text>
  </g>

  <!-- Step 2: Trigger itms-services -->
  <g transform="translate(155, 275)">
    <line x1="0" y1="0" x2="435" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)" />
    <rect x="60" y="-18" width="315" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="65" y="-5" fill="#334155" font-size="10">2. open(itms-services://?action=download-manifest&amp;url=https://i.lcsignx.com:8088/...)</text>
  </g>

  <!-- Step 3: Forward to Daemon -->
  <g transform="translate(590, 320)">
    <line x1="0" y1="0" x2="390" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)" />
    <rect x="100" y="-18" width="190" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="105" y="-5" fill="#334155" font-size="10">3. 唤醒系统安装队列与握手请求</text>
  </g>

  <!-- Step 4: Resolve DNS &amp; TLS Handshake to Localhost -->
  <g transform="translate(980, 365)">
    <path d="M 0 0 L -610 0" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrowCoral2)" />
    <rect x="-470" y="-18" width="330" height="18" rx="4" fill="#f8fafc" />
    <text x="-465" y="-5" fill="#e11d48" font-size="10" font-weight="700">4. 解析 DNS (127.0.0.1) 并向 GCDWebServer 发起 TLS 握手</text>
  </g>

  <!-- Step 5: Validate Root CA Certificate -->
  <g transform="translate(980, 410)">
    <path d="M 0 0 L -180 0" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowCyan2)" />
    <rect x="-165" y="-18" width="150" height="18" rx="4" fill="#f8fafc" />
    <text x="-160" y="-5" fill="#0284c7" font-size="10">5. 校验 SSL.com 根证书链</text>
  </g>
  <g transform="translate(800, 440)">
    <path d="M 0 0 L 180 0" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen2)" />
    <rect x="20" y="-18" width="140" height="18" rx="4" fill="#f8fafc" />
    <text x="25" y="-5" fill="#059669" font-size="10" font-weight="600">6. 商业 CA 验证 100% 通过</text>
  </g>

  <!-- Step 7: Local Fast Loopback Fetch -->
  <g transform="translate(980, 485)">
    <path d="M 0 0 L -610 0" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen2)" />
    <rect x="-510" y="-18" width="410" height="18" rx="4" fill="#f8fafc" />
    <text x="-505" y="-5" fill="#059669" font-size="10" font-weight="700">7. 回环内存极速拉取 manifest.plist 与已签名 IPA（千兆回环零耗流量）</text>
  </g>

  <!-- Step 8: Final System Install Dialog -->
  <g transform="translate(980, 530)">
    <path d="M 0 0 L -390 0" fill="none" stroke="#f1f5f9" stroke-width="1.5" marker-end="url(#arrow2)" />
    <rect x="-310" y="-18" width="230" height="18" rx="4" fill="#f8fafc" />
    <text x="-305" y="-5" fill="#f8fafc" font-size="10">8. 弹出系统原生“安装”确认对话框并落盘</text>
  </g>

  <!-- Bottom Result Bar -->
  <g transform="translate(60, 570)">
    <rect width="980" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="21" fill="#334155" font-size="11">对比结果：</text>
    <text x="75" y="21" fill="#e11d48" font-size="11">传统本地 HTTP：</text>
    <text x="175" y="21" fill="#334155" font-size="11">遭 iOS 系统拒绝（itms 强制 HTTPS）</text>
    <text x="395" y="21" fill="#d97706" font-size="11">自签 CA 证书：</text>
    <text x="495" y="21" fill="#334155" font-size="11">弹窗不可信证书，需手动装描述文件</text>
    <text x="720" y="21" fill="#059669" font-size="11" font-weight="700">LCSign 闭环：</text>
    <text x="820" y="21" fill="#059669" font-size="11">免电脑、免配置、零外网上传安装</text>
  </g>
</svg>
