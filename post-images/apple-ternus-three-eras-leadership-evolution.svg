<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-three-eras-leadership-evolution-title apple-ternus-three-eras-leadership-evolution-desc">
  <title id="apple-ternus-three-eras-leadership-evolution-title">苹果三大领袖时代演进与战略心智切换</title>
  <desc id="apple-ternus-three-eras-leadership-evolution-desc">展示从乔布斯时代品类定义，到库克时代商业加固，再到特努斯实事实干技术复利新纪元的战略变迁</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
    </style>
    <marker id="era-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Era 1: Jobs -->
  <g transform="translate(40, 30)">
    <rect width="260" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#0284c7"/>
    <text x="20" y="32" class="label-badge" fill="#0284c7">1997 - 2011 · 传奇开创</text>
    <text x="20" y="58" class="label-title">乔布斯时代 (Jobs Era)</text>
    <text x="20" y="78" class="text-body">远见统治 · 天才品类定义</text>
    <line x1="20" y1="94" x2="240" y2="94" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✦ 天才远见与极端产品品位</text>
      <text x="0" y="24" class="text-feat">✦ 宁可推迟也不妥协成熟折衷方案</text>
      <text x="0" y="48" class="text-feat">✦ 铸就 "Only Apple Can Do" 宗教光环</text>
      <text x="0" y="80" class="text-body" fill="#64748b">“开天辟地，给世界定义未来”</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 312 170 L 338 170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#era-arrow)"/>

  <!-- Era 2: Cook -->
  <g transform="translate(350, 30)">
    <rect width="260" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#64748b"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">2011 - 2026 · 商业登顶</text>
    <text x="20" y="58" class="label-title">库克时代 (Cook Era)</text>
    <text x="20" y="78" class="text-body">供应链极致 · 帝国商业加固</text>
    <line x1="20" y1="94" x2="240" y2="94" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✦ 市值从 3500 亿跃升至 4 万亿美元</text>
      <text x="0" y="24" class="text-feat">✦ 全球顶级工业制造供应链闭环</text>
      <text x="0" y="48" class="text-feat">✦ 核心使命：严防风险，守护遗产</text>
      <text x="0" y="80" class="text-body" fill="#64748b">“运营登峰造极，但困于教条”</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 622 170 L 648 170" stroke="#bf4520" stroke-width="1.5" marker-end="url(#era-arrow)"/>

  <!-- Era 3: Ternus (Focal) -->
  <g transform="translate(660, 30)">
    <rect width="260" height="280" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">2026 - 未来 · 工程师当家</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">特努斯新纪元 (Ternus Era)</text>
    <text x="20" y="78" class="text-body" fill="#9a3412">实事实干 · 技术复利大爆发</text>
    <line x1="20" y1="94" x2="240" y2="94" stroke="#fed7aa" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✦ 走别人走过的成熟路并不丢人</text>
      <text x="0" y="24" class="text-feat">✦ Apple Can Do Too：打牢折叠与光圈</text>
      <text x="0" y="48" class="text-feat">✦ 跨品类算力倒灌：M6 级核心入手机</text>
      <text x="0" y="72" class="text-feat">✦ 终极爆发：Only Apple 降维收网</text>
      <text x="0" y="104" class="text-body" fill="#9a3412" style="font-weight: 600;">“工程师底色，面子向规律让步”</text>
    </g>
  </g>
</svg>