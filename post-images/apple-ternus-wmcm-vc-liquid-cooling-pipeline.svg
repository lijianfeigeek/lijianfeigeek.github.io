<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-wmcm-vc-liquid-cooling-pipeline-title apple-ternus-wmcm-vc-liquid-cooling-pipeline-desc">
  <title id="apple-ternus-wmcm-vc-liquid-cooling-pipeline-title">WMCM 先进封装平铺与 3 倍面积定制 VC 均热扩散管线</title>
  <desc id="apple-ternus-wmcm-vc-liquid-cooling-pipeline-desc">A20 Pro 平铺热源将高度削薄，配合大面积定制 VC 均热板相变循环，将热量平摊至金属中框实现机身最高温直降 1.7℃</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .label-step { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #64748b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="vc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="260" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1: Heat Source -->
  <g transform="translate(40, 45)">
    <rect width="190" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-step">STEP 01</text>
    <text x="16" y="52" class="label-title">A20 Pro + WMCM</text>
    <text x="16" y="72" class="tag-coral">并排平铺先进封装</text>
    <line x1="16" y1="84" x2="174" y2="84" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="104" class="text-body">芯片颗粒从顶部移开</text>
    <text x="16" y="124" class="text-body">封装高度断崖削薄</text>
    <text x="16" y="144" class="text-body">96-bit 内存带宽消除饥渴</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 235 130 L 265 130" stroke="#64748b" stroke-width="1.5" marker-end="url(#vc-arrow)"/>

  <!-- Step 2: Vaporization -->
  <g transform="translate(270, 45)">
    <rect width="190" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-step">STEP 02</text>
    <text x="16" y="52" class="label-title">热端受热瞬间相变</text>
    <text x="16" y="72" class="label-step" fill="#0284c7">Liquid ➔ Vapor</text>
    <line x1="16" y1="84" x2="174" y2="84" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="104" class="text-body">去离子水高真空封装</text>
    <text x="16" y="124" class="text-body">接触平铺芯片高热区</text>
    <text x="16" y="144" class="text-body">毫秒级吸热气化蒸发</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 465 130 L 495 130" stroke="#64748b" stroke-width="1.5" marker-end="url(#vc-arrow)"/>

  <!-- Step 3: Diffusion (Focal) -->
  <g transform="translate(500, 45)">
    <rect width="190" height="170" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="16" y="28" class="tag-coral">STEP 03 · 3X AREA</text>
    <text x="16" y="52" class="label-title" fill="#9a3412">3 倍面积均热扩散</text>
    <text x="16" y="72" class="label-step" fill="#9a3412">定制超大腔体</text>
    <line x1="16" y1="84" x2="174" y2="84" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="104" class="text-body">蒸汽高速扩散至冷端</text>
    <text x="16" y="124" class="text-body">烧结毛细芯吸附回流</text>
    <text x="16" y="144" class="text-body">打破局部发热积蓄集中</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 695 130 L 725 130" stroke="#bf4520" stroke-width="1.5" marker-end="url(#vc-arrow)"/>

  <!-- Step 4: Release -->
  <g transform="translate(730, 45)">
    <rect width="190" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-step">STEP 04</text>
    <text x="16" y="52" class="label-title">整机均摊平稳释放</text>
    <text x="16" y="72" class="label-step" fill="#059669">Chassis Dissipation</text>
    <line x1="16" y1="84" x2="174" y2="84" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="104" class="text-body">均匀导向钛合金边框</text>
    <text x="16" y="124" class="text-body" style="font-weight: 600;" fill="#059669">最高外壳温度 -1.7℃</text>
    <text x="16" y="144" class="text-body">3DMark 20轮 30fps 稳定</text>
  </g>
</svg>