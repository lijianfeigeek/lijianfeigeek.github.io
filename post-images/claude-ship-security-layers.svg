<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="588" viewBox="0 0 1000 588" role="img" aria-labelledby="claude-ship-layers-title claude-ship-layers-desc" id="claude-ship-layers-root" data-diagram="layer-stack">
  <title id="claude-ship-layers-title">Claude Ship 五层纵深安全防御与残余风险补偿堆栈</title>
  <desc id="claude-ship-layers-desc">从本地 CLI、默认分支信任锚点、云端沙盒 Token 代理、声明式策略引擎到 GitHub 分支保护的五层补偿安全边界与残余风险传递链。</desc>
  <defs>
    <pattern id="cs-layer-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.22"/>
    </pattern>
    <marker id="cs-arrow-down" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="1000" height="588" fill="#f8fafc"/>
  <rect width="1000" height="588" fill="url(#cs-layer-dots)"/>

  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Compensating Security Layers: Trust Boundaries &amp; Residual Risk</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">DEFENSE-IN-DEPTH FROM LOCAL /SHIP EXECUTION TO GITHUB BRANCH PROTECTION &amp; MERGE QUEUE</text>

  <!-- Left Margin Direction Indicator -->
  <g transform="translate(32, 84)">
    <line x1="40" y1="8" x2="40" y2="444" stroke="#bf4520" stroke-width="1.4" marker-end="url(#cs-arrow-down)"/>
    <rect x="4" y="176" width="72" height="84" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
    <text x="40" y="200" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">TRUST</text>
    <text x="40" y="216" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">BOUNDARY</text>
    <text x="40" y="236" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">逐层收紧</text>
    <text x="40" y="250" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#64748b">HARDENING</text>
  </g>

    <g transform="translate(116, 84)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="92" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="62" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L5 · LOCAL</text>
    <text x="124" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">本地终端与规则文件隔离层 (/ship &amp; /steward)</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0f172a">防御：自动跳过 .env 等疑似密钥、.claude/ 与 .github/；禁用 bypassPermissions</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">残余风险：本地测试脚本仍以开发者凭据运行 → 仅限受信任仓库启用 Watch</text>
  </g>
  <g transform="translate(116, 176)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="92" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="62" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L4 · ANCHOR</text>
    <text x="124" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">默认分支信任锚点层 (REVIEW.md · SKILL.md · approvals.yml)</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0f172a">防御：云端评审、Steward 与策略引擎强制仅读取受保护默认分支的配置</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">残余风险：PR 分支无法自改规则，但已具备默认分支合并权的人仍可修改</text>
  </g>
  <g transform="translate(116, 268)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="92" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="62" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L3 · SANDBOX</text>
    <text x="124" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Anthropic 云端沙盒与外置 Token 代理层 (PR Steward)</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0f172a">防御：App Token 存放沙盒外部；服务层硬拒绝 approve/删分支/改分支规则/推 Tag</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">残余风险：PR 评论中的提示词注入仍可能误导代码修改（文本解析固有边界）</text>
  </g>
  <g transform="translate(116, 360)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <rect x="16" y="14" width="92" height="18" rx="3" fill="none" stroke="#bf4520" stroke-width="0.9"/>
    <text x="62" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#bf4520">L2 · POLICY</text>
    <text x="124" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">声明式策略引擎与非作者人类席位层 (.claude/approvals.yml)</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0f172a">防御：auth/billing/CI 路径绑定 nested: inherit + !pr/authors；最严格规则胜出</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">残余风险：低风险路径若配置 seats: 1 + auto-merge 可触发零他人干预自动合入</text>
  </g>
  <g transform="translate(116, 452)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="92" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="62" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L1 · KERNEL</text>
    <text x="124" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">GitHub 分支保护与 Merge Queue 终局门禁层 (Branch Rules)</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0f172a">防御：Approvals 设为 Required Check；Claude App 移出 Bypass List；新提交作废旧签字</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">最终兜底：Merge Queue 对 main 重跑全量 CI + Feature Flag 渐进放量与一键回滚</text>
  </g>

  <!-- Legend Strip -->
  <line x1="32" y1="548" x2="968" y2="548" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="568" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#475569">LEGEND</text>
  <rect x="116" y="558" width="16" height="12" rx="2" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
  <text x="140" y="568" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">核心策略裁决层（策略文件可控边界）</text>
  <rect x="384" y="558" width="16" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="408" y="568" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">平台基础设施与沙盒隔离补偿层</text>
  <text x="644" y="568" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">NOTE: ZDR / HIPAA / CMEK 组织当前暂不可用</text>
</svg>