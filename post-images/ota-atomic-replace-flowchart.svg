<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-atomic-replace-flowchart-title ota-atomic-replace-flowchart-desc">
  <title id="ota-atomic-replace-flowchart-title">操作系统级原子替换三段式落盘流程图</title>
  <desc id="ota-atomic-replace-flowchart-desc">展示下载临时文件、解压独立工作目录并通过 replaceItemAt 原子替换杜绝半写损坏的落盘流程</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="260" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1: Download to tmp -->
  <g transform="translate(24, 30)">
    <rect width="180" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="28" class="label-title">Step 1: 临时下载</text>
    <line x1="14" y1="42" x2="166" y2="42" stroke="#f3f4f6" stroke-width="1"/>
    
    <g transform="translate(12, 54)">
      <rect width="156" height="56" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="8" y="20" class="text-code" font-weight="600">tmp/Checkout.zip</text>
      <text x="8" y="38" class="text-code" fill="#6b7280">流式写入临时目录</text>
    </g>

    <text x="14" y="136" class="text-code" fill="#6b7280">• 网络断开直接抛弃</text>
    <text x="14" y="156" class="text-code" fill="#6b7280">• 不触碰正式目录</text>
    <text x="14" y="176" class="text-code" fill="#6b7280">• 校验 ETag 与 Hash</text>
  </g>

  <!-- Arrow -->
  <path d="M 204 130 L 234 130" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="234,127 240,130 234,133" fill="#9ca3af"/>

  <!-- Step 2: Extract to temp worker dir -->
  <g transform="translate(240, 30)">
    <rect width="180" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="28" class="label-title">Step 2: 独立解压</text>
    <line x1="14" y1="42" x2="166" y2="42" stroke="#f3f4f6" stroke-width="1"/>

    <g transform="translate(12, 54)">
      <rect width="156" height="56" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="8" y="20" class="text-code" font-weight="600">tmp/ExtractDir/</text>
      <text x="8" y="38" class="text-code" fill="#6b7280">轻量 zlib 流式解压</text>
    </g>

    <text x="14" y="136" class="text-code" fill="#6b7280">• 解压 10+ 语言包</text>
    <text x="14" y="156" class="text-code" fill="#6b7280">• 若中途强杀进程</text>
    <text x="14" y="176" class="text-code" fill="#6b7280">• 线上生效目录 0 损坏</text>
  </g>

  <!-- Arrow -->
  <path d="M 420 130 L 450 130" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="450,127 456,130 450,133" fill="#9ca3af"/>

  <!-- Step 3: Decision Gate -->
  <g transform="translate(456, 60)">
    <polygon points="65,0 130,70 65,140 0,70" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="65" y="66" text-anchor="middle" class="label-title" font-size="12" fill="#9a3412">目标目录</text>
    <text x="65" y="82" text-anchor="middle" class="label-title" font-size="12" fill="#9a3412">已存在？</text>
  </g>

  <!-- Connectors -->
  <path d="M 586 100 L 630 75" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="628,71 634,75 629,79" fill="#6b7280"/>
  <text x="596" y="80" class="text-code" fill="#6b7280">否 (首次)</text>

  <path d="M 586 160 L 630 185" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="628,181 634,185 629,189" fill="#bf4520"/>
  <text x="596" y="180" class="text-code" fill="#bf4520">是 (覆盖)</text>

  <!-- Branch 1: moveItem -->
  <g transform="translate(634, 45)">
    <rect width="302" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="12" y="24" class="text-code" font-weight="600">FileManager.moveItem(at:to:)</text>
    <text x="12" y="44" class="text-code" fill="#6b7280">直接移动落地为正式 Checkout.bundle</text>
  </g>

  <!-- Branch 2: replaceItemAt (Coral Accent) -->
  <g transform="translate(634, 155)">
    <rect width="302" height="74" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="24" class="text-code" font-weight="600" fill="#9a3412">FileManager.replaceItemAt(...)</text>
    <text x="12" y="44" class="text-body" fill="#7c2d12">POSIX 操作系统级文件系统原子替换！</text>
    <text x="12" y="62" class="text-code" fill="#9a3412">✓ 彻底杜绝半写损坏与语言包残缺风险</text>
  </g>
</svg>