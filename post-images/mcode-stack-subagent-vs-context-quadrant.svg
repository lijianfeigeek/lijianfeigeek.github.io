<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Outer Container -->
  <rect x="4" y="4" width="912" height="532" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(32, 24)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Agent 架构权衡矩阵：中间过程依赖度 × 上下文税负</text>
    <text x="0" y="38" font-size="12" fill="#64748b">MiniMax MCode Stack 工程笔记核心法则：何时拆分 Subagent、何时采用 PTC 与工程化下沉</text>
  </g>

  <!-- Quadrant Canvas -->
  <g transform="translate(80, 85)">
    <!-- Quadrant 1 (Top-Left): 高税负 x 低依赖 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="370" height="185" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="12" y="12" width="130" height="22" rx="4" fill="#dbeafe"/>
      <text x="77" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">独立 Subagent 隔离</text>
      <text x="16" y="55" font-size="14" font-weight="700" fill="#0f172a">黑盒式并发与纯净上下文</text>
      <text x="16" y="78" font-size="11.5" fill="#334155">• 独立代码评审 (independent-review)：彻底摒弃作者偏见</text>
      <text x="16" y="98" font-size="11.5" fill="#334155">• 抛弃式并行研究：独立深搜探索，仅回传小体积精炼结论</text>
      <text x="16" y="118" font-size="11.5" fill="#334155">• 工具/指令冲突隔离：专属子任务沙盒，任务完结即销毁</text>
      <text x="16" y="148" font-size="11" font-weight="600" fill="#2563eb">关键准则：只取最终紧凑结论，绝不需要中间琐碎对话</text>
    </g>

    <!-- Quadrant 2 (Top-Right): 高税负 x 高依赖 -->
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="370" height="185" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
      <rect x="12" y="12" width="165" height="22" rx="4" fill="#ffe4e6"/>
      <text x="94" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">PTC 脚本化 + 后台长任务</text>
      <text x="16" y="55" font-size="14" font-weight="700" fill="#0f172a">编写程序调工具 &amp; 非阻塞等待</text>
      <text x="16" y="78" font-size="11.5" fill="#334155">• PTC (Programmatic Tool Calling)：写 Python/Node 批处理</text>
      <text x="16" y="98" font-size="11.5" fill="#334155">• 避免 50 轮问答把 Context 撑爆，将过滤计算推向本地</text>
      <text x="16" y="118" font-size="11.5" fill="#334155">• 长耗时命令移至后台异步，维持进程 PID 并防 Cache 超时</text>
      <text x="16" y="148" font-size="11" font-weight="600" fill="#e11d48">关键准则：过程高度关键，但绝不能让原始巨型数据淹没上下文</text>
    </g>

    <!-- Quadrant 4 (Bottom-Left): 低税负 x 低依赖 -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="370" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="12" y="12" width="150" height="22" rx="4" fill="#f1f5f9"/>
      <text x="87" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Taste-to-Checks 工具化</text>
      <text x="16" y="55" font-size="14" font-weight="700" fill="#0f172a">工程品味直接下沉为硬门禁</text>
      <text x="16" y="78" font-size="11.5" fill="#334155">• 代码格式、API 禁令、依赖引入：降级为 CI Linter / Grep</text>
      <text x="16" y="98" font-size="11.5" fill="#334155">• 规范校验：使用 Git Pre-commit Hook 或 MiniMax Hook 拦截</text>
      <text x="16" y="118" font-size="11.5" fill="#334155">• 行为断言：编写确定性单元测试，先失败后修复</text>
      <text x="16" y="148" font-size="11" font-weight="600" fill="#64748b">关键准则：说两次的错误绝不依赖 Prompt！机械规则机器跑</text>
    </g>

    <!-- Quadrant 3 (Bottom-Right): 低税负 x 高依赖 -->
    <g transform="translate(390, 205)">
      <rect x="0" y="0" width="370" height="185" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="12" y="12" width="150" height="22" rx="4" fill="#dcfce7"/>
      <text x="87" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">单主循环 + 动态 Skill</text>
      <text x="16" y="55" font-size="14" font-weight="700" fill="#0f172a">保持主线连贯与渐进重构</text>
      <text x="16" y="78" font-size="11.5" fill="#334155">• 默认架构：永远优先使用单一主循环，按需动态加载 Skill</text>
      <text x="16" y="98" font-size="11.5" fill="#334155">• 上下文工作台原则：关键决策与待办提早写入文件</text>
      <text x="16" y="118" font-size="11.5" fill="#334155">• 发生多轮 Compaction 漂移时，使用 Handoff Doc 切换新会话</text>
      <text x="16" y="148" font-size="11" font-weight="600" fill="#16a34a">关键准则：坚决不盲目搞“多 Agent 团队过家家”，杜绝信息损耗</text>
    </g>

    <!-- Axes Lines -->
    <line x1="380" y1="0" x2="380" y2="390" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="0" y1="195" x2="760" y2="195" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Axis Labels -->
  <!-- Horizontal Axis Labels -->
  <g transform="translate(80, 485)">
    <text x="10" y="16" font-size="12" font-weight="700" fill="#64748b">◀ 低依赖 (仅需紧凑结论 / 黑盒输出)</text>
    <text x="380" y="16" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">中间过程依赖度 (Trace &amp; Reasoning Dependency)</text>
    <text x="750" y="16" text-anchor="end" font-size="12" font-weight="700" fill="#64748b">高依赖 (需完整上下文 / 连续排查) ▶</text>
  </g>

  <!-- Vertical Axis Labels -->
  <g transform="translate(18, 280) rotate(-90)">
    <text x="0" y="16" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">上下文税负 (Context Tax: 膨胀度 / 杂音 / Token 成本)</text>
  </g>
</svg>