<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polylane-latency-cost-quadrant-chart-title polylane-latency-cost-quadrant-chart-desc">
  <title id="polylane-latency-cost-quadrant-chart-title">微决策场景下四大主流模型延迟与成本象限分布图</title>
  <desc id="polylane-latency-cost-quadrant-chart-desc">60000+ 次真实生产调用中 GPT-OSS 20B、120B、DeepSeek V4.1 Flash 与 Jev 的延迟与成本分布</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .axis-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #4b5563; }
      .quad-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #9ca3af; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title Header -->
  <text x="24" y="32" class="label-title" font-size="16">微决策场景下四大主流模型延迟与成本象限分布 (60,000+ 次真实调用)</text>
  <text x="24" y="52" class="label-sub">横轴：响应延迟（从慢到快） | 纵轴：每千次调用成本（从高到低）</text>

  <!-- Quadrant Area: 800 x 280, origin at (80, 70) -->
  <g transform="translate(80, 70)">
    <!-- Quadrant Backgrounds -->
    <!-- Q2: Fast but Expensive (Top Right) -->
    <rect x="400" y="0" width="400" height="130" fill="#f0fdf4" opacity="0.6"/>
    <!-- Q1: Ideal Target (Fast &amp; Cheap) (Bottom Right) -->
    <rect x="400" y="130" width="400" height="130" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="640" y="240" class="quad-label" fill="#059669">象限 1：理想目标 (低延迟 / 低成本)</text>

    <!-- Q3: Worst Zone (Slow &amp; Expensive) (Top Left) -->
    <rect x="0" y="0" width="400" height="130" fill="#fff1f2" opacity="0.6"/>
    <text x="20" y="30" class="quad-label" fill="#e11d48">象限 3：高危重灾区 (高延迟 / 高成本)</text>

    <!-- Q4: Slow but Cheap (Bottom Left) -->
    <rect x="0" y="130" width="400" height="130" fill="#f9fafb"/>
    <text x="20" y="240" class="quad-label">象限 4：低价但迟缓</text>

    <!-- Coordinate Axes -->
    <line x1="0" y1="130" x2="800" y2="130" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="400" y1="0" x2="400" y2="260" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Boundary Box -->
    <rect x="0" y="0" width="800" height="260" fill="none" stroke="#d1d5db" stroke-width="1.5"/>

    <!-- Axis Labels -->
    <text x="10" y="146" class="axis-text">← 响应极慢 (5.5s)</text>
    <text x="680" y="146" class="axis-text">极速低延迟 (0.4s) →</text>
    
    <text x="410" y="20" class="axis-text">↑ 高昂成本 ($0.85/k)</text>
    <text x="410" y="250" class="axis-text">↓ 经济低成本 ($0.40/k)</text>

    <!-- Point 1: GPT-OSS 20B (Slow &amp; Expensive: x=40, y=30) -->
    <g transform="translate(40, 25)">
      <circle cx="10" cy="10" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <rect x="25" y="0" width="230" height="42" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
      <text x="33" y="16" class="label-title" font-size="12" fill="#b91c1c">OpenAI GPT-OSS 20B</text>
      <text x="33" y="32" class="text-code" fill="#991b1b">P90: 5,445 ms | 成本: $0.817 / k</text>
    </g>

    <!-- Point 2: GPT-OSS 120B (x=240, y=60) -->
    <g transform="translate(240, 55)">
      <circle cx="10" cy="10" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <rect x="25" y="0" width="220" height="42" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="33" y="16" class="label-title" font-size="12" fill="#b45309">OpenAI GPT-OSS 120B</text>
      <text x="33" y="32" class="text-code" fill="#92400e">P90: 2,255 ms | 成本: $0.740 / k</text>
    </g>

    <!-- Point 3: DeepSeek V4.1 Flash (x=480, y=170) -->
    <g transform="translate(480, 160)">
      <circle cx="10" cy="10" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
      <rect x="25" y="0" width="230" height="42" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="33" y="16" class="label-title" font-size="12" fill="#1d4ed8">DeepSeek V4.1 Flash</text>
      <text x="33" y="32" class="text-code" fill="#1e40af">P90: 1,372 ms | 成本: $0.510 / k</text>
    </g>

    <!-- Point 4: TypeSafe Jev (Coral Champion) (x=680, y=200) -->
    <g transform="translate(620, 150)">
      <circle cx="10" cy="10" r="9" fill="#bf4520" stroke="#ffffff" stroke-width="2"/>
      <rect x="25" y="0" width="145" height="48" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
      <text x="33" y="18" class="label-title" font-size="12" fill="#bf4520">TypeSafe Jev ★</text>
      <text x="33" y="32" class="text-code" fill="#9a3412">P90: 508 ms (快 9.4x)</text>
      <text x="33" y="44" class="text-code" fill="#9a3412">成本: $0.464 / k (省 39%)</text>
    </g>
  </g>
</svg>