<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-engineering-loop-title codex-engineering-loop-desc" id="codex-engineering-loop-root">
      <title id="codex-engineering-loop-title">Codex 研发交付五阶工程闭环与动态回流拓扑</title>
      <desc id="codex-engineering-loop-desc">Codex 在 Prompt 范围界定、Plan 最优路径拆解、Execute 原子读写与 Verify 测试验证之间的闭环决策机制</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-engineering-loop-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-engineering-loop-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-engineering-loop-root .mono { font-family: "Geist Mono", monospace; }
      #codex-engineering-loop-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-engineering-loop-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-engineering-loop-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-engineering-loop-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Card 1: Prompt -->
        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="160" height="130" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="160" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">01. PROMPT</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">需求与边界定义</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 明确上下文输入材料</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 圈定文件修改范围</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 声明可量化验收指标</text>
        </g>

        <!-- Card 2: Plan (Focal) -->
        <g transform="translate(220, 40)">
          <rect x="0" y="0" width="160" height="130" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="160" height="26" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#bf4520" class="mono">02. PLAN (FOCAL)</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#bf4520">结构化路径拆解</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 检索相关代码拓扑</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.8">• 推导最短可靠改动路径</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.8">• 产出 4 问排查清单</text>
        </g>

        <!-- Card 3: Execute -->
        <g transform="translate(410, 40)">
          <rect x="0" y="0" width="160" height="130" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="160" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">03. EXECUTE</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">原子级执行推进</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 读写目标源码文件</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 执行受限 Shell 命令</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 调度 MCP 专用工具</text>
        </g>

        <!-- Card 4: Verify -->
        <g transform="translate(600, 40)">
          <rect x="0" y="0" width="160" height="130" rx="6" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1.2" fill-opacity="0.04"/>
          <rect x="0" y="0" width="160" height="26" rx="6" fill="#2e5aa8" fill-opacity="0.08"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">04. VERIFY</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2e5aa8">确定性多维验收</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.75">• 触发单元测试与 Lint</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.75">• 语法/类型强类型检查</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.75">• 浏览器端渲染抽检</text>
        </g>

        <!-- Card 5: Done -->
        <g transform="translate(790, 40)">
          <rect x="0" y="0" width="140" height="130" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="140" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">05. DELIVER</text>
          <text x="12" y="52" font-size="14" font-weight="600" fill="#2d3142">版本合入交付</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 行级 Git Diff 审查</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 块级暂存与 Commit</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 提交 Pull Request</text>
        </g>

        <!-- Connectors -->
        <path d="M 190 105 L 220 105" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-engineering-loop-arrow-default)" opacity="0.6"/>
        <path d="M 380 105 L 410 105" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#codex-engineering-loop-arrow-accent)"/>
        <path d="M 570 105 L 600 105" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#codex-engineering-loop-arrow-default)" opacity="0.6"/>
        <path d="M 760 105 L 790 105" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#codex-engineering-loop-arrow-link)"/>

        <!-- Feedback Loop: Verify -> Plan -->
        <path d="M 680 170 L 680 215 Q 680 225 670 225 L 310 225 Q 300 225 300 215 L 300 170" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#codex-engineering-loop-arrow-accent)"/>
        <g transform="translate(430, 213)">
          <rect x="0" y="0" width="120" height="24" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
          <text x="12" y="16" font-size="11" font-weight="600" fill="#bf4520">单测报错 / 重新修划</text>
        </g>
      </g>
    </svg>
