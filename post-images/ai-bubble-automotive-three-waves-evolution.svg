<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-automotive-three-waves-evolution-title ai-bubble-automotive-three-waves-evolution-desc">
  <title id="ai-bubble-automotive-three-waves-evolution-title">汽车产业三浪叠加与终局：躯壳拼装者 vs 自动驾驶灵魂</title>
  <desc id="ai-bubble-automotive-three-waves-evolution-desc">展示从第一浪电动化三电系统普及，到第二浪智能化端到端驾驶，直至第三浪出行服务化消解私人拥有权的长周期商业演进</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="wave-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="300" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Wave 1: Electrification -->
  <g transform="translate(40, 30)">
    <rect width="260" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#64748b"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">第一浪 · 2015 ~ 2023</text>
    <text x="20" y="58" class="label-title">电动化 (三电普及)</text>
    <text x="20" y="78" class="text-body">燃油车出局 · 动力革命</text>
    <line x1="20" y1="92" x2="240" y2="92" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✦ 电池、电机、电控全面成熟</text>
      <text x="0" y="24" class="text-feat">✦ 零百加速与续航快速同质化</text>
      <text x="0" y="48" class="text-feat">✦ 沦为通用工业标准化部件</text>
      <text x="0" y="80" class="text-body" fill="#64748b">“造车门槛被彻底打平”</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 312 150 L 338 150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#wave-arrow)"/>

  <!-- Wave 2: Intelligence -->
  <g transform="translate(350, 30)">
    <rect width="260" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#0284c7"/>
    <text x="20" y="32" class="label-badge" fill="#0284c7">第二浪 · 2024 ~ 2027</text>
    <text x="20" y="58" class="label-title">智能化 (自动驾驶核心)</text>
    <text x="20" y="78" class="text-body">端到端大模型 · 灵魂争夺</text>
    <line x1="20" y1="92" x2="240" y2="92" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✦ 动力丧失差异，AI 成为唯一护城河</text>
      <text x="0" y="24" class="text-feat">✦ 端到端神经网络与座舱行为感知</text>
      <text x="0" y="48" class="text-feat">✦ 躯壳拼装车企沦为富士康</text>
      <text x="0" y="80" class="text-body" fill="#0284c7">“数据闭环与自研芯片决定生死”</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 622 150 L 648 150" stroke="#bf4520" stroke-width="1.5" marker-end="url(#wave-arrow)"/>

  <!-- Wave 3: Mobility as a Service (Focal) -->
  <g transform="translate(660, 30)">
    <rect width="260" height="240" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">第三浪 · 2028+ 终局</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">出行服务化 (MaaS)</text>
    <text x="20" y="78" class="text-body" fill="#9a3412">Robotaxi 订阅 · 私人拥有权消解</text>
    <line x1="20" y1="92" x2="240" y2="92" stroke="#fed7aa" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat" fill="#9a3412">✦ L4/L5 安全性远超人类老司机</text>
      <text x="0" y="24" class="text-feat" fill="#9a3412">✦ 私人购买 2 吨铁块失去财务意义</text>
      <text x="0" y="48" class="text-feat" fill="#9a3412">✦ 像手机流量包月一样订阅出行</text>
      <text x="0" y="80" class="text-body" fill="#9a3412" style="font-weight: 600;">“传统私家车拥有制终结”</text>
    </g>
  </g>
</svg>