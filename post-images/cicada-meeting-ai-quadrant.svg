<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="cmq-title cmq-desc" id="cicada-quadrant-root" data-diagram="quadrant">
  <title id="cmq-title">跨语言会议 AI 工具架构定位四象限权衡矩阵</title>
  <desc id="cmq-desc">沿参会无感隐身度（INTRUSIVE 至 STEALTH）与交互方向（PASSIVE 单向旁听至 DUPLEX 双向同传）两个维度，对比四大类会议 AI 架构的技术边界。</desc>
  <defs>
    <pattern id="cmq-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="cmq-arr-end" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
    </marker>
    <marker id="cmq-arr-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="640" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="640" fill="url(#cmq-dots)"/>
  <rect x="16" y="16" width="968" height="608" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.16em">ARCHITECTURAL POSITIONING MATRIX · PRESENCE FOOTPRINT VS INTERACTION DIRECTIONALITY</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">为什么“拉个 Bot 进会议室”走不通了：跨语言会议工具 2×2 架构象限</text>
  </g>

  <!-- Double-Ended Axis Cross (Center at x=500, y=336; cells leave 48px gap around cross) -->
  <!-- Horizontal Axis: x=104..896 at y=336 -->
  <line x1="104" y1="336" x2="896" y2="336" stroke="#0f172a" stroke-width="1.2" marker-start="url(#cmq-arr-start)" marker-end="url(#cmq-arr-end)"/>
  <!-- Vertical Axis: y=124..548 at x=500 -->
  <line x1="500" y1="124" x2="500" y2="548" stroke="#0f172a" stroke-width="1.2" marker-start="url(#cmq-arr-start)" marker-end="url(#cmq-arr-end)"/>

  <!-- Jobs-Minimal Single-Word Axis Labels Beyond Arrow Tips -->
  <text x="500" y="110" fill="#0f172a" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">DUPLEX</text>
  <text x="500" y="568" fill="#0f172a" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">PASSIVE</text>
  <text x="92" y="336" fill="#0f172a" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="end" dominant-baseline="middle">INTRUSIVE</text>
  <text x="908" y="336" fill="#0f172a" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start" dominant-baseline="middle">STEALTH</text>

  <!-- Cell 01: Top-Left (INTRUSIVE / DUPLEX) x=136..468 (w=332), y=144..308 (h=164) -->
  <g transform="translate(136, 144)">
    <rect x="0" y="0" width="332" height="164" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" fill="#64748b" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">01 · INTRUSIVE / DUPLEX</text>
    <text x="20" y="56" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">人工同传台与入会传译机器人</text>
    <text x="20" y="84" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">需预约同传译员接入独立声道，或向会议室塞入</text>
    <text x="20" y="104" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">第三方语音代理机器人；全员可见、审批繁琐，</text>
    <text x="20" y="124" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">且无法覆盖直播流、X Spaces 与临时语音聊天。</text>
    <text x="20" y="148" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Zoom Interpreter · Cloud Voice Bot</text>
  </g>

  <!-- Cell 02: FOCAL Top-Right (STEALTH / DUPLEX) x=532..864 (w=332), y=144..308 (h=164) -->
  <g transform="translate(532, 144)">
    <rect x="0" y="0" width="332" height="164" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="20" y="28" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">02 · STEALTH / DUPLEX</text>
    <text x="20" y="56" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">知了 Cicada（原生系统内录 + 虚拟麦同传）</text>
    <text x="20" y="84" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">零机器人静默旁路系统输出，Apple 芯片声音不出本机；</text>
    <text x="20" y="104" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">纪要窗防录屏隐身，按住右 ⌥ 或免按键开口即可将</text>
    <text x="20" y="124" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">8s 克隆音色译文经虚拟麦克风直接送入任意通话软件。</text>
    <text x="20" y="148" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">5 Native Hosts · 0 External Libs · Apache-2.0</text>
  </g>

  <!-- Cell 03: Bottom-Left (INTRUSIVE / PASSIVE) x=136..468 (w=332), y=364..528 (h=164) -->
  <g transform="translate(136, 364)">
    <rect x="0" y="0" width="332" height="164" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" fill="#64748b" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">03 · INTRUSIVE / PASSIVE</text>
    <text x="20" y="56" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">传统拉 Bot 入会纪要 SaaS</text>
    <text x="20" y="84" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">必须在日历授权并向参会列表插入显眼录音机器人；</text>
    <text x="20" y="104" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">整场录音强制上传第三方云端，在飞书、企微或客户</text>
    <text x="20" y="124" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">闭门沟通中极易被主持人拒之门外，且无法替你发言。</text>
    <text x="20" y="148" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Otter.ai · Fireflies · Read.ai</text>
  </g>

  <!-- Cell 04: Bottom-Right (STEALTH / PASSIVE) x=532..864 (w=332), y=364..528 (h=164) -->
  <g transform="translate(532, 364)">
    <rect x="0" y="0" width="332" height="164" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" fill="#64748b" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">04 · STEALTH / PASSIVE</text>
    <text x="20" y="56" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">OS 原生实时字幕与浏览器单向插件</text>
    <text x="20" y="84" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">本机无感旁听，但字幕转瞬即逝或局限于浏览器标签页；</text>
    <text x="20" y="104" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">缺失端侧声纹分离、15s 滞后重听对齐、同音专名纠错</text>
    <text x="20" y="124" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">与结构化纪要回溯，轮到自己开口时依然哑口无言。</text>
    <text x="20" y="148" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">macOS Live Captions · Chrome Tab Extensions</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="584" x2="960" y2="584" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(136, 598)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="20" y="12" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">Cicada 目标架构象限（对端零感知 + 本机声纹/识别 + 双向实时语音同传闭环）</text>
  </g>
  <g transform="translate(612, 598)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="12" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">传统会议辅助工具的三大能力受限区</text>
  </g>
</svg>
