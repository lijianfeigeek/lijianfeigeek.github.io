<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="sayall-hid-title sayall-hid-desc">
  <title id="sayall-hid-title">SayAll HID 回调去重、事件抑制与 Fn 层伪标志位净化泳道图</title>
  <desc id="sayall-hid-desc">展示 SayAll 如何在 macOS 27 双 HID 回调下完成 50 ms 去重、提前登记吞噬原生按键，并过滤 Home 等 Fn 层按键带来的 maskSecondaryFn 标志位污染。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="480" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="960" y2="52" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">HID 兼容模式防泄漏与 Fn 层标志位净化时序泳道</text>
  <text x="20" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SWIMLANE · HIDRemoteMonitor + KeyboardEventSuppressor + ShortcutHardwareModifierState</text>

  <!-- 4 Swimlanes (y=52..412, each 90px tall) -->
  <rect x="0" y="52" width="960" height="90" fill="#f8fafc"/>
  <rect x="0" y="142" width="960" height="90" fill="#ffffff"/>
  <rect x="0" y="232" width="960" height="90" fill="#f8fafc"/>
  <rect x="0" y="322" width="960" height="90" fill="#ffffff"/>

  <!-- Swimlane Borders -->
  <line x1="148" y1="52" x2="148" y2="412" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="0" y1="142" x2="960" y2="142" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="232" x2="960" y2="232" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="322" x2="960" y2="322" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="412" x2="960" y2="412" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane Titles -->
  <g transform="translate(16, 72)">
    <text x="0" y="12" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" letter-spacing="0.1em">LANE 01 · HID DRIVER</text>
    <text x="0" y="30" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">HIDRemoteMonitor</text>
    <text x="0" y="46" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">IOHIDManager / Device</text>
  </g>
  <g transform="translate(16, 162)">
    <text x="0" y="12" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" letter-spacing="0.1em">LANE 02 · EVENT TAP</text>
    <text x="0" y="30" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">事件拦截抑止器</text>
    <text x="0" y="46" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">CGSessionEventTap</text>
  </g>
  <g transform="translate(16, 252)">
    <text x="0" y="12" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" letter-spacing="0.1em">LANE 03 · MODIFIERS</text>
    <text x="0" y="30" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">修饰键快照过滤</text>
    <text x="0" y="46" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">maskSecondaryFn</text>
  </g>
  <g transform="translate(16, 342)">
    <text x="0" y="12" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" letter-spacing="0.1em">LANE 04 · TARGET</text>
    <text x="0" y="30" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">键盘注入与前台 App</text>
    <text x="0" y="46" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">Keyboard / ScrollRegion</text>
  </g>

  <!-- Connectors (drawn BEFORE boxes) -->
  <!-- HID-1 -> HID-2 -->
  <path d="M 328,96 H 360" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- HID-2 -> TAP-2 (prearm cross-lane handoff) -->
  <path d="M 448,124 V 152" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- TAP-1 (native OS leak) -> TAP-2 -->
  <path d="M 328,188 H 360" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <!-- TAP-2 -> MOD-3 (hand-off to shortcut sequence) -->
  <path d="M 528,188 H 544 Q 552,188 552,196 V 268 Q 552,276 560,276 H 572" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- MOD-3 -> MOD-4 -->
  <path d="M 736,276 H 768" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- MOD-4 -> APP-4 -->
  <path d="M 852,304 V 332" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- HID-2 -> APP-3 (non-shortcut direct ScrollRegion path, hops over TAP-2 -> MOD-3 at y=188) -->
  <path d="M 488,124 V 134 Q 488,142 496,142 H 532 Q 540,142 540,150 V 180 a 8,8 0 0,0 0,16 V 358 Q 540,366 548,366 H 572" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow Masks & Labels -->
  <rect x="456" y="130" width="76" height="12" rx="2" fill="#f8fafc"/>
  <text x="494" y="139" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">PREARM QUEUE</text>

  <rect x="560" y="232" width="108" height="12" rx="2" fill="#f8fafc"/>
  <text x="614" y="241" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">TRIGGER HOTKEY</text>

  <rect x="860" y="308" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="896" y="317" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">CMD+SHIFT+H</text>

  <!-- Step Cards -->
  <!-- Lane 1, Col 1 -->
  <g transform="translate(168, 68)">
    <rect x="0" y="0" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">双回调去重与时钟对齐</text>
    <text x="10" y="34" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">macOS 27 Manager/Device 去重</text>
    <text x="10" y="48" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">50 ms window · mach_timebase</text>
  </g>

  <!-- Lane 1, Col 2 -->
  <g transform="translate(364, 68)">
    <rect x="0" y="0" width="164" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">识别键码并提前登记</text>
    <text x="10" y="34" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">例如按下 Home (Usage 0x4A)</text>
    <text x="10" y="48" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">Home=115 · TV=10 (ISO §)</text>
  </g>

  <!-- Lane 2, Col 1 -->
  <g transform="translate(168, 160)">
    <rect x="0" y="0" width="160" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.1"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">系统原生事件并发抵达</text>
    <text x="10" y="34" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">WindowServer 滞后投递</text>
    <text x="10" y="48" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">lag &lt;= 500 ms (non-exclusive)</text>
  </g>

  <!-- Lane 2, Col 2 (FOCAL 1) -->
  <g transform="translate(364, 156)">
    <rect x="0" y="0" width="164" height="62" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="164" height="62" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">精准吞噬遥控器原生键</text>
    <text x="10" y="34" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">按 FIFO 队认领 · 放行实体键盘</text>
    <text x="10" y="49" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">prearmedDownsClaimed · return nil</text>
  </g>

  <!-- Lane 3, Col 3 -->
  <g transform="translate(576, 248)">
    <rect x="0" y="0" width="160" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">硬件快照出现伪 Fn 位</text>
    <text x="10" y="34" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">Home 115 携带 Fn 层标志位</text>
    <text x="10" y="48" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">maskSecondaryFn 0x00800000</text>
  </g>

  <!-- Lane 3, Col 4 (FOCAL 2) -->
  <g transform="translate(772, 244)">
    <rect x="0" y="0" width="164" height="62" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="164" height="62" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">“可证明 Fn” 净化过滤器</text>
    <text x="10" y="34" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">未见键码 63 且非显式配置即剥离</text>
    <text x="10" y="49" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">Filter phantom Fn on Home/End</text>
  </g>

  <!-- Lane 4, Col 3 (AX Scroll path) -->
  <g transform="translate(576, 338)">
    <rect x="0" y="0" width="160" height="56" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1.1"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">无障碍定向半页滚动</text>
    <text x="10" y="34" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">不读 AXValue · 不抢键盘焦点</text>
    <text x="10" y="48" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">ScrollRegionInjector</text>
  </g>

  <!-- Lane 4, Col 4 -->
  <g transform="translate(772, 338)">
    <rect x="0" y="0" width="164" height="56" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
    <text x="10" y="18" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" font-weight="700">精确投递目标快捷键</text>
    <text x="10" y="34" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="9">剔除污染后正确匹配 App 热键</text>
    <text x="10" y="48" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">ShortcutEventSequence</text>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(20, 428)">
    <rect x="0" y="2" width="14" height="10" rx="2" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="22" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">防串扰与防污染关键关卡（Prearm FIFO 吞噬 + 伪 Fn 剥离）</text>

    <line x1="380" y1="7" x2="412" y2="7" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-link)"/>
    <text x="420" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">快捷键净化主链路</text>

    <line x1="560" y1="7" x2="592" y2="7" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="600" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">并发原生流 / 旁路滚动</text>

    <text x="0" y="34" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SOURCE: HIDRemoteMonitor.swift · KeyboardEventSuppressor.swift · MACOS_FUNCTION_LAYER.md · ScrollRegionInjector.swift</text>
  </g>
</svg>
