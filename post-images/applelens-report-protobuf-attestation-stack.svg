<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="report-stack-title report-stack-desc" width="960" height="640" viewBox="0 0 960 640" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="report-stack-title">AppleLens ReportLens Offline Decoding and PCC Attestation Layer Stack</title>
  <desc id="report-stack-desc">Five-layer vertical stack showing how Apple_Intelligence_Report.json is parsed without disabling SIP, from JSON dual-epoch correlation and AFM control-token prompt slicing down to zero-dependency Protobuf wire decoding and historical SecTrust Apple Root CA verification.</desc>
  <defs>
    <marker id="st-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="st-down" viewBox="0 0 10 10" refX="5" refY="7" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 9 0 L 5 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="896" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="32" font-size="17" font-weight="700" fill="#0f172a">ReportLens 离线取证解码栈：绕开 pccvre SIP 限制的纯 Swift 二进制验签</text>
    <text x="688" y="31" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">LAYER STACK · PROTOBUF</text>
  </g>

  <!-- Left Margin Abstraction Direction Indicator -->
  <g transform="translate(44, 120)">
    <line x1="16" y1="0" x2="16" y2="392" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#st-down)"/>
    <text x="16" y="-12" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#64748b">DECODE</text>
    <text x="16" y="416" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0284c7">VERIFY</text>
  </g>

  <!-- STACKED LAYERS (x=96, width=832, uniform vertical stack) -->
  <!-- L1: Report Ingestion & Dual-Epoch Correlation -->
  <g transform="translate(96, 96)">
    <rect x="0" y="0" width="832" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="52" height="20" rx="2" fill="#e2e8f0"/>
    <text x="42" y="30" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0f172a">L1</text>
    <text x="84" y="31" font-size="14.5" font-weight="700" fill="#0f172a">JSON 顶层关联与双纪元时间戳归一 (IntelligenceReportDecoder)</text>
    <text x="84" y="54" font-size="11" fill="#475569">按 requestId 与 ±30s 窗口将顶层 privateCloudComputeRequests 回链至 modelRequests；自动区分 Unix 1970 与 CFAbsoluteTime 2001</text>
    <text x="812" y="30" text-anchor="end" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#64748b">~/Downloads 自动发现</text>
  </g>

  <!-- L2: AFM Control-Token Slicer & AppIntents Extractor -->
  <g transform="translate(96, 188)">
    <rect x="0" y="0" width="832" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="52" height="20" rx="2" fill="#e0f2fe"/>
    <text x="42" y="30" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0369a1">L2</text>
    <text x="84" y="31" font-size="14.5" font-weight="700" fill="#0f172a">AFM 控制符切片与隐式预算提取 (sliceAFMPrompt)</text>
    <text x="84" y="54" font-size="11" fill="#475569">精准切分 &lt;ctrl99&gt;system / developer / thought / user / tool / model&lt;ctrl100&gt; 角色块，解析 silentTokenBudget 与 AppIntents JSON</text>
    <text x="812" y="30" text-anchor="end" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#0284c7">Prompts &amp; Tools</text>
  </g>

  <!-- L3: Zero-Dependency Protobuf Wire Decoder (FOCAL) -->
  <g transform="translate(96, 280)">
    <rect x="0" y="0" width="832" height="96" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="16" y="16" width="52" height="20" rx="2" fill="#ffe4e6"/>
    <text x="42" y="30" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#be123c">L3 · FOCAL</text>
    <text x="84" y="31" font-size="14.5" font-weight="700" fill="#0f172a">零外部库 Protobuf 线协议直解 (ProtobufWireDecoder · AttestationBundle)</text>
    <text x="84" y="52" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#9f1239">Field 1: SEP Quote │ Field 2: AP Ticket (IM4M) │ Field 3: SealedHashLedger │ Field 4: DER Certs │ Field 5: AppData │ Field 8: ATLog</text>
    <text x="84" y="74" font-size="11" fill="#881337">无需 SwiftProtobuf、无需关闭 SIP 执行 pccvre，在零售版 macOS 直接解包 darwin-init SecureConfig 与 TIE/计算节点角色</text>
    <text x="812" y="30" text-anchor="end" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#be123c">SIP-ON READY</text>
  </g>

  <!-- L4: SecTrust Historical X.509 Chain Verification -->
  <g transform="translate(96, 388)">
    <rect x="0" y="0" width="832" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <rect x="16" y="16" width="52" height="20" rx="2" fill="#d1fae5"/>
    <text x="42" y="30" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#047857">L4</text>
    <text x="84" y="31" font-size="14.5" font-weight="700" fill="#065f46">历史时间窗 X.509 密码学验签 (SecTrustEvaluateWithError)</text>
    <text x="84" y="54" font-size="11" fill="#065f46">锚定叶子证书签发有效窗口调用 SecTrustSetVerifyDate，校验密码学签名链是否严格锚定至 Apple Root CA（拒绝自签名伪造）</text>
    <text x="812" y="30" text-anchor="end" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#047857">Apple Root CA</text>
  </g>

  <!-- L5: ReportInsightEngine Executive Summary -->
  <g transform="translate(96, 480)">
    <rect x="0" y="0" width="832" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="52" height="20" rx="2" fill="#e2e8f0"/>
    <text x="42" y="30" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0f172a">L5</text>
    <text x="84" y="31" font-size="14" font-weight="700" fill="#0f172a">人话全景审计结论生成 (ReportInsightEngine)</text>
    <text x="84" y="52" font-size="11" fill="#475569">自动区分纯端侧 ANE / PCC 私有云 / 端云协同三态，解释 server_diffusion 视觉扩散任务 Prompt=0 的张量掩码成因</text>
    <text x="812" y="30" text-anchor="end" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#64748b">Bilingual Verdict</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(32, 568)">
    <rect x="0" y="0" width="896" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(20, 16)">
      <rect x="0" y="1" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
      <text x="22" y="12" font-size="11" fill="#334155">L3 核心突破层：纯 Swift Varint/Wire 解码（零外部依赖）</text>
    </g>
    <g transform="translate(396, 16)">
      <rect x="0" y="1" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <text x="22" y="12" font-size="11" fill="#334155">L4 密码学锚定：SecTrust 真实签名验签</text>
    </g>
    <g transform="translate(692, 16)">
      <rect x="0" y="1" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="22" y="12" font-size="11" fill="#334155">L1/L2/L5 JSON 语义与人话审计层</text>
    </g>
  </g>
</svg>
