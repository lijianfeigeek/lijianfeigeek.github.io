<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-localization-philosophy-mindmap-title ota-localization-philosophy-mindmap-desc">
  <title id="ota-localization-philosophy-mindmap-title">OTA 本地化四大核心架构哲学体系</title>
  <desc id="ota-localization-philosophy-mindmap-desc">展示顺应原生机制、追求极简零依赖、安全第一防线与规模化工程治理四大维度</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left Center: Root Anchor -->
  <g transform="translate(24, 110)">
    <rect width="180" height="120" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="90" y="44" text-anchor="middle" class="label-title" fill="#9a3412" font-size="15">OTA 本地化哲学</text>
    <text x="90" y="68" text-anchor="middle" class="text-body" fill="#7c2d12">"做少，做好，顺应平台"</text>
    <line x1="20" y1="80" x2="160" y2="80" stroke="#fed7aa" stroke-width="1"/>
    <text x="90" y="100" text-anchor="middle" class="text-code" fill="#9a3412">JET 架构精要</text>
  </g>

  <!-- Connectors from Root to 4 Pillars -->
  <path d="M 204 140 L 250 55" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="248,51 255,55 249,58" fill="#10b981"/>

  <path d="M 204 160 L 250 135" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="248,131 255,135 249,138" fill="#3b82f6"/>

  <path d="M 204 180 L 250 205" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="248,202 255,205 248,209" fill="#bf4520"/>

  <path d="M 204 200 L 250 285" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="248,282 255,285 249,289" fill="#6b7280"/>

  <!-- 4 Pillars Container (Right) -->
  <!-- Pillar 1: Native -->
  <g transform="translate(255, 20)">
    <rect width="680" height="70" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="14" y="24" class="label-title" fill="#065f46">1. 顺应原生机制 (Don't fight the OS)</text>
    <text x="14" y="44" class="text-code" fill="#047857">• 善用 Bundle 原生处理方言与语言回退链 (Locale Fallback)</text>
    <text x="14" y="60" class="text-code" fill="#047857">• 善用 Bundle 原生解析 .stringsdict 变态复数规则 | POSIX replaceItemAt 保障原子替换</text>
  </g>

  <!-- Pillar 2: Minimal -->
  <g transform="translate(255, 98)">
    <rect width="680" height="70" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="14" y="24" class="label-title" fill="#1e40af">2. 追求极简与零外部依赖 (Zero External Dependencies)</text>
    <text x="14" y="44" class="text-code" fill="#1d4ed8">• 轻量内置 zlib 解压替代数十兆三方 SDK，二进制体积零膨胀</text>
    <text x="14" y="60" class="text-code" fill="#1d4ed8">• 数十行 Swift 并发 Actor (CQRS 读写分离) | 单行 ?? .module 无感优雅接入</text>
  </g>

  <!-- Pillar 3: Security (Coral Accent) -->
  <g transform="translate(255, 176)">
    <rect width="680" height="70" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="14" y="24" class="label-title" fill="#9a3412">3. 安全与质量第一防线 (Defensive Security)</text>
    <text x="14" y="44" class="text-code" fill="#7c2d12">• Git 仓库 PR Review 作为唯一真理源，严禁客户端直连第三方 SaaS API</text>
    <text x="14" y="60" class="text-code" fill="#7c2d12">• 排除 InfoPlist 避免虚假覆盖系统属性 | 云端物理级 Kill Switch 彻底防越权</text>
  </g>

  <!-- Pillar 4: Scalability -->
  <g transform="translate(255, 254)">
    <rect width="680" height="70" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="24" class="label-title" fill="#374151">4. 规模化工程治理 (Engineering Governance)</text>
    <text x="14" y="44" class="text-code">• SwiftLint 静态强约束禁止裸调用 NSLocalizedString</text>
    <text x="14" y="60" class="text-code">• ModuleCreator 脚手架原生固化 | 冷启统一加载彻底杜绝 UI 闪烁灵异 Bug</text>
  </g>
</svg>