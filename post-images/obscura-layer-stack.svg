<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obscura-layers-title obscura-layers-desc" id="obscura-layers-root" data-diagram="layer-stack">
  <title id="obscura-layers-title">Obscura 十模块工作区严格分层依赖栈</title>
  <desc id="obscura-layers-desc">展示 Obscura 开源仓库 10 个核心 Rust Crate 如何按自顶向下单向依赖划分 5 个抽象层级，避免横向耦合。</desc>
  <defs>
    <pattern id="obscura-layers-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Paper Light Background -->
  <rect width="1000" height="560" fill="#f8fafc"/>
  <rect width="1000" height="560" fill="url(#obscura-layers-dots)" opacity="0.55"/>

  <!-- Header -->
  <text x="40" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">LAYER STACK · 10 WORKSPACE CRATES · STRICT TOP-DOWN DEPENDENCY</text>
  <text x="40" y="64" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">十模块零横向耦合分层栈：从接入协议到底层 SSRF 防火墙</text>

  <!-- Left Margin Direction Indicator (strictly horizontal text, vertical line) -->
  <line x1="56" y1="452" x2="56" y2="124" stroke="#475569" stroke-width="1.4" marker-end="url(#layers-arrow)"/>
  <rect x="20" y="256" width="72" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="271" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ABSTRACTION</text>
  <text x="56" y="285" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">向上屏蔽细节</text>

  <!-- Outer Stack Silhouette -->
  <rect x="112" y="100" width="848" height="388" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- L5: Entry & Protocol Layer -->
  <g transform="translate(112 100)">
    <rect x="0" y="0" width="848" height="76" rx="8" fill="#ffffff"/>
    <line x1="0" y1="76" x2="848" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="20" y="24" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="42" y="40" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L5</text>
    <text x="84" y="34" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">协议入口与工具分发层</text>
    <text x="84" y="54" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">obscura-cli (fetch/serve/scrape/worker) · obscura-cdp (WS) · obscura-mcp (38+ Tools) · obscura (API)</text>
    <rect x="708" y="22" width="120" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="768" y="40" fill="#0284c7" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">STDIO / HTTP / WS</text>
  </g>

  <!-- L4: Browser Session & Lifecycle Layer -->
  <g transform="translate(112 176)">
    <rect x="0" y="0" width="848" height="76" fill="#f8fafc"/>
    <line x1="0" y1="76" x2="848" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="20" y="24" width="44" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="42" y="40" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L4</text>
    <text x="84" y="34" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">会话编排与页面状态机层</text>
    <text x="84" y="54" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">obscura-browser · Page 状态机 · CoW localStorage 隔离 · 生命周期回放 · 视觉 PDF 导出</text>
    <rect x="708" y="22" width="120" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="768" y="40" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LIFECYCLE / COW</text>
  </g>

  <!-- L3: FOCAL LAYER - JS Runtime & Anti-Panic Boundary -->
  <g transform="translate(112 252)">
    <rect x="0" y="0" width="848" height="84" fill="#fff5f2" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="20" y="28" width="44" height="24" rx="4" fill="#bf4520"/>
    <text x="42" y="44" fill="#ffffff" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L3</text>
    <text x="84" y="36" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">V8 运行时与反崩溃 FFI 隔离层（核心焦点）</text>
    <text x="84" y="56" fill="#334155" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">obscura-js (deno_core) · 20,622 行 bootstrap.js · op_dom catch_unwind · SharedArrayBuffer 表单缓存</text>
    <rect x="692" y="24" width="136" height="32" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
    <text x="760" y="44" fill="#bf4520" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PANIC=UNWIND · V8</text>
  </g>

  <!-- L2: DOM Tree & Retained Pure-Rust Render Layer -->
  <g transform="translate(112 336)">
    <rect x="0" y="0" width="848" height="76" fill="#f8fafc"/>
    <line x1="0" y1="76" x2="848" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="20" y="24" width="44" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="42" y="40" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L2</text>
    <text x="84" y="34" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">纯 Rust DOM 树与保留式布局光栅层</text>
    <text x="84" y="54" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">obscura-dom (html5ever · 511/512 展平) + obscura-render (taffy · tiny-skia · ab_glyph · 16M 像素上限)</text>
    <rect x="708" y="22" width="120" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="768" y="40" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NO CHROMIUM</text>
  </g>

  <!-- L1: Network Transport & Zero-Dep SSRF Firewall -->
  <g transform="translate(112 412)">
    <rect x="0" y="0" width="848" height="76" rx="8" fill="#ffffff"/>
    <rect x="20" y="24" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="42" y="40" fill="#334155" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L1</text>
    <text x="84" y="34" fill="#0f172a" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">传输基建与零依赖 SSRF 防火墙底座</text>
    <text x="84" y="54" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">obscura-net (reqwest / BoringSSL wreq · 3,520 追踪域黑名单) → obscura-ssrf (DNS 解析期防重绑定)</text>
    <rect x="708" y="22" width="120" height="28" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
    <text x="768" y="40" fill="#0284c7" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ZERO-DEP GUARD</text>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(40 512)">
    <rect x="0" y="0" width="920" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="10" width="12" height="12" rx="2" fill="#fff5f2" stroke="#bf4520" stroke-width="1.2"/>
    <text x="36" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">核心隔离焦点（L3 反崩溃与共享内存桥）</text>
    <rect x="304" y="10" width="12" height="12" rx="2" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <text x="324" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">外部协议与网络边界层</text>
    <rect x="504" y="10" width="12" height="12" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="524" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">纯 Rust 引擎栈（总计约 201,725 行源码，无 Chromium 依赖）</text>
  </g>
</svg>
