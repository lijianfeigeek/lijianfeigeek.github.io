<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="mitigation-quad-title mitigation-quad-desc" style="background:#f5f5f5; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;">
  <title id="mitigation-quad-title">多用户多智能体失效归因与对症治理 2x2 决策矩阵</title>
  <desc id="mitigation-quad-desc">四象限矩阵对比资源竞争型与信息异步型失效在拓扑权限层与平台协议层的治理效果，揭示没有任何单一万能补丁能够通吃所有环境。</desc>

  <defs>
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142"/>
    </marker>
  </defs>

  <!-- Warm Paper Background + Dotted Pattern -->
  <rect x="0" y="0" width="960" height="580" fill="#f5f5f5"/>
  <rect x="0" y="0" width="960" height="580" fill="url(#dot-grid)"/>

  <!-- Header -->
  <g transform="translate(40, 34)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#2d3142">失效根因 × 干预层级：为什么团队领导者能救 API Key，却救不了个人助理？</text>
    <text x="0" y="22" font-size="12" fill="#4f5d75">MAMUBench 消融与缓解实验全景：跨环境机制错配下，单一组织架构或单一平台规则均非银弹</text>
  </g>

  <!-- Axis Cross (center at 480, 300) -->
  <line x1="120" y1="300" x2="840" y2="300" stroke="#2d3142" stroke-width="1.2" marker-start="url(#axis-arrow)" marker-end="url(#axis-arrow)"/>
  <line x1="480" y1="104" x2="480" y2="496" stroke="#2d3142" stroke-width="1.2" marker-start="url(#axis-arrow)" marker-end="url(#axis-arrow)"/>

  <!-- Jobs-minimal Axis Tip Labels -->
  <text x="480" y="88" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle" letter-spacing="2">PROTOCOL</text>
  <text x="480" y="518" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle" letter-spacing="2">PROMPT</text>
  <text x="108" y="304" font-size="10" font-weight="600" fill="#2d3142" text-anchor="end" letter-spacing="2">CONTENTION</text>
  <text x="852" y="304" font-size="10" font-weight="600" fill="#2d3142" text-anchor="start" letter-spacing="2">ASYMMETRY</text>

  <!-- Q2 (Top-Left): CONTENTION / PROTOCOL -->
  <g transform="translate(132, 116)">
    <rect x="0" y="0" width="324" height="164" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.35)" stroke-width="1"/>
    <text x="16" y="24" font-size="9" font-weight="600" fill="#5a6580" letter-spacing="1.5" font-family="ui-monospace, monospace">01 · CONTENTION / PROTOCOL</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#2d3142">唯一写权限收口 + 截止线截断</text>
    <text x="16" y="72" font-size="12" fill="#4f5d75">代表环境：API Key · Merge Queue</text>
    <text x="16" y="96" font-size="12" fill="#334155">• CAPTAIN 独占修改类 labctl 工具，用户代理仅留只读</text>
    <text x="16" y="116" font-size="12" fill="#334155">• 强制按价值排序并及时释放预留额度：Opus 5 30% → 71%</text>
    <text x="16" y="136" font-size="12" fill="#334155">• Merge Queue 引入 Cut Line 截断低价值 PR：均达 97%</text>
  </g>

  <!-- Q1 (Top-Right): ASYMMETRY / PROTOCOL [FOCAL CORAL] -->
  <g transform="translate(504, 116)">
    <rect x="0" y="0" width="324" height="164" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <text x="16" y="24" font-size="9" font-weight="700" fill="#bf4520" letter-spacing="1.5" font-family="ui-monospace, monospace">02 · ASYMMETRY / PROTOCOL</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#2d3142">平台门禁强阻塞：消灭并发竞态</text>
    <text x="16" y="72" font-size="12" fill="#9f1239">代表环境：Personal Assistant（MCP 守卫）</text>
    <text x="16" y="96" font-size="12" fill="#2d3142">• 仅指定队长结账彻底无效（Opus 5 仅 47.4% ≈ 原地重跑）</text>
    <text x="16" y="116" font-size="12" fill="#2d3142">• 必须在 MCP 层拦截：有未读 DM 时硬拒绝 checkout</text>
    <text x="16" y="136" font-size="12" font-weight="600" fill="#bf4520">• 失败对局挽回率：Opus 5 73.1% · Sonnet 5 62.3%</text>
  </g>

  <!-- Q3 (Bottom-Left): CONTENTION / PROMPT -->
  <g transform="translate(132, 320)">
    <rect x="0" y="0" width="324" height="164" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.35)" stroke-width="1"/>
    <text x="16" y="24" font-size="9" font-weight="600" fill="#5a6580" letter-spacing="1.5" font-family="ui-monospace, monospace">03 · CONTENTION / PROMPT</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#2d3142">团队宪章与价值共识注入</text>
    <text x="16" y="72" font-size="12" fill="#4f5d75">代表环境：Merge Queue (Crew Charter)</text>
    <text x="16" y="96" font-size="12" fill="#334155">• 无需中心化队长，在 AGENTS.md 注入统一价值准则</text>
    <text x="16" y="116" font-size="12" fill="#334155">• 明确“后果权重优先于 Diff 大小”与主动让位规则</text>
    <text x="16" y="136" font-size="12" fill="#334155">• Opus 5 在高争用单 Runner 场景 oversub 跃升至 100%</text>
  </g>

  <!-- Q4 (Bottom-Right): ASYMMETRY / PROMPT -->
  <g transform="translate(504, 320)">
    <rect x="0" y="0" width="324" height="164" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.35)" stroke-width="1"/>
    <text x="16" y="24" font-size="9" font-weight="600" fill="#5a6580" letter-spacing="1.5" font-family="ui-monospace, monospace">04 · ASYMMETRY / PROMPT</text>
    <text x="16" y="48" font-size="15" font-weight="700" fill="#2d3142">严格分诊 SOP 与旁听线索触发</text>
    <text x="16" y="72" font-size="12" fill="#4f5d75">代表环境：Clinic（s3 规程栈）</text>
    <text x="16" y="96" font-size="12" fill="#334155">• 禁止把急诊推诿至候补/急诊室，必须在挂断前预约</text>
    <text x="16" y="116" font-size="12" fill="#334155">• 只要从家属等第三方来电听到线索即刻查档置换日程</text>
    <text x="16" y="136" font-size="12" fill="#334155">• 联合成功率突破协调者上限：Opus 95.3% · Sonnet 91.8%</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 540)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
    <rect x="0" y="14" width="14" height="14" rx="2" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="22" y="25" font-size="11" font-weight="600" fill="#2d3142">核心突破：当异步通信导致竞态时，纯靠提示词或领导角色无效，必须依赖平台层协议门禁</text>
    <text x="880" y="25" font-size="11" fill="#5a6580" text-anchor="end">Anthropic Fellows · arXiv:2610.00583</text>
  </g>
</svg>
