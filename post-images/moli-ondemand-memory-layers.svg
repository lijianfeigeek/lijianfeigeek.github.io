<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="moli-layers-title moli-layers-desc" id="moli-layers-root" data-diagram="layer-stack">
  <title id="moli-layers-title">Moli 五层资源与内存有界治理堆栈</title>
  <desc id="moli-layers-desc">展示 Moli 如何从协议线程上限、底层分配器配置、按需冻结布局树容量阈值、瞬态光栅化上限到磁盘停泊图像构建五层内存防线。</desc>
  <defs>
    <pattern id="moli-layers-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="layer-down-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Paper Light Background -->
  <rect width="1000" height="580" fill="#f8fafc"/>
  <rect width="1000" height="580" fill="url(#moli-layers-dots)" opacity="0.55"/>

  <!-- Header -->
  <text x="28" y="34" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">LAYER STACK · BOUNDED MEMORY &amp; THREAD GOVERNANCE</text>
  <text x="28" y="62" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">把内存压进 92 MiB：Moli 五层有界资源治理堆栈</text>

  <!-- Left Margin Direction Indicator -->
  <line x1="56" y1="112" x2="56" y2="480" stroke="#475569" stroke-width="1.2" marker-end="url(#layer-down-arrow)"/>
  <rect x="20" y="256" width="72" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="56" y="274" fill="#334155" font-size="10" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">按需下沉</text>
  <text x="56" y="290" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">COST GATED</text>

  <!-- Layer 1 -->
  <g transform="translate(112 96)">
    <rect x="0" y="0" width="856" height="68" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="16" y="16" width="60" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="46" y="28" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L1 · HOST</text>
    <text x="16" y="50" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">moli-protocol-server</text>

    <text x="208" y="30" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">协议与并发线程门禁 + 动作批量压缩</text>
    <text x="208" y="50" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">同一服务端托管 CDP / BiDi / Classic，moli-action-window 合并连续滚动与输入屏障</text>

    <rect x="656" y="16" width="184" height="36" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="748" y="31" fill="#0284c7" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MAX_TOKIO_THREADS = 4</text>
    <text x="748" y="45" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">async + blocking dual cap</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(112 176)">
    <rect x="0" y="0" width="856" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="60" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="46" y="28" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L2 · ALLOC</text>
    <text x="16" y="50" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">moli/src/allocator.rs</text>

    <text x="208" y="30" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">统一分配域：PartitionAlloc / 激进回落 jemalloc</text>
    <text x="208" y="50" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">优先复用 V8 指针压缩 PartitionAlloc；其余平台接管 C/Rust 全局 malloc，极速归还脏页</text>

    <rect x="656" y="16" width="184" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="748" y="31" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">narenas:1 · decay:250ms</text>
    <text x="748" y="45" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tcache_max:1024 · muzzy:0</text>
  </g>

  <!-- Layer 3 (Focal Coral Accent) -->
  <g transform="translate(112 256)">
    <rect x="0" y="0" width="856" height="72" rx="6" fill="#fff1f2" stroke="#bf4520" stroke-width="1.3"/>
    <rect x="16" y="16" width="60" height="18" rx="2" fill="#ffe4e6" stroke="#bf4520" stroke-width="0.8"/>
    <text x="46" y="28" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L3 · LAYOUT</text>
    <text x="16" y="52" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">moli-layout (FOCAL)</text>

    <text x="208" y="31" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">双轨布局隔离：Mock 零计算 vs OnDemand 单树冻结</text>
    <text x="208" y="52" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">算后仅保留 1 份不可变 FrozenLayoutTree，Taffy / Parley 工作树与样式借用瞬间 Drop</text>

    <rect x="656" y="16" width="184" height="40" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="0.8"/>
    <text x="748" y="32" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CAP: 256 MiB / 1M Boxes</text>
    <text x="748" y="47" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4M Fragments · 64 subpx/px</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(112 340)">
    <rect x="0" y="0" width="856" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="60" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="46" y="28" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L4 · PAINT</text>
    <text x="16" y="50" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">moli-paint</text>

    <text x="208" y="30" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">无保留态瞬态 CPU 光栅化与字体子集 PDF 输出</text>
    <text x="208" y="50" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">Vello CPU 单帧出图即毁，Screencast 仅比对 generation 元数据令牌，无损伤图</text>

    <rect x="656" y="16" width="184" height="36" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="748" y="31" fill="#0f172a" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRANSIENT ≤ 256 MiB</text>
    <text x="748" y="45" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MAX_TRANSIENT_RASTER_BYTES</text>
  </g>

  <!-- Layer 5 -->
  <g transform="translate(112 420)">
    <rect x="0" y="0" width="856" height="68" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1"/>
    <rect x="16" y="16" width="60" height="18" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="0.8"/>
    <text x="46" y="28" fill="#047857" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">L5 · DISK</text>
    <text x="16" y="50" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">moli-parkable-image</text>

    <text x="208" y="30" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">图像磁盘停泊（DiskPool）与按 Profile 隔离存储</text>
    <text x="208" y="50" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">闲置编码图片换出至 DiskPool 区间释放内存，读取时同步唤醒，宽限期后零重写再停泊</text>

    <rect x="656" y="16" width="184" height="36" rx="4" fill="#ffffff" stroke="#059669" stroke-width="0.8"/>
    <text x="748" y="31" fill="#047857" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OPFS · IDB · DiskPool</text>
    <text x="748" y="45" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">--image / --resource gated</text>
  </g>

  <!-- Legend Strip -->
  <line x1="28" y1="520" x2="968" y2="520" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="28" y="544" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="100" y="534" width="16" height="12" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="124" y="544" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">常驻基础边界 (Always-on Guard)</text>

  <rect x="336" y="534" width="16" height="12" rx="2" fill="#fff1f2" stroke="#bf4520" stroke-width="1.2"/>
  <text x="360" y="544" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">核心按需熔断层 (Focal Cost Gate)</text>

  <rect x="588" y="534" width="16" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="0.8"/>
  <text x="612" y="544" fill="#047857" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">外置磁盘换出层 (Disk Extent Parking)</text>
</svg>
