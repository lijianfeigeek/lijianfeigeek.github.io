<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="440" viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-fingerprint-wipe-persistence-title ios-fingerprint-wipe-persistence-desc" id="ios-fingerprint-wipe-persistence-root">
        <title id="ios-fingerprint-wipe-persistence-title">抹机重置下的稳定性鸿沟：易失区域 vs 非易失底层锚点</title>
        <desc id="ios-fingerprint-wipe-persistence-desc">对比 iOS 全盘抹机时被清空的易失沙盒与钥匙串，以及穿透抹机保持强一致性的非易失底层锚点</desc>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-fingerprint-wipe-persistence-root { --color-paper:   #f8f9fa;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ios-fingerprint-wipe-persistence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-fingerprint-wipe-persistence-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <marker id="ios-fingerprint-wipe-persistence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ios-fingerprint-wipe-persistence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
      </marker>
      <marker id="ios-fingerprint-wipe-persistence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <pattern id="ios-fingerprint-wipe-persistence-dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <rect width="100%" height="100%" fill="url(#ios-fingerprint-wipe-persistence-dots)" opacity="0.6"/>

        <!-- Trigger: Erase All Content -->
        <g id="trigger-wipe" transform="translate(40, 160)">
          <rect x="0" y="0" width="230" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5" stroke-opacity="0.22"/>
          <rect x="16" y="16" width="60" height="20" rx="2" fill="#2d3142" fill-opacity="0.10"/>
          <text x="46" y="30" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">ACTION</text>
          <text x="88" y="31" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14">用户触发全盘抹机</text>
          <text x="16" y="66" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Erase All Content &amp; Settings</text>
          <text x="16" y="88" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">系统清空 Data 分区并重置</text>
        </g>

        <!-- Top Branch: 易失区域 (被销毁) -->
        <g id="branch-destroyed" transform="translate(370, 40)">
          <rect x="0" y="0" width="550" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
          <text x="24" y="32" fill="#5a6580" font-family="'Geist', sans-serif" font-weight="600" font-size="13">被彻底销毁的易失区域 (90% 自研指纹失效)</text>

          <g transform="translate(24, 48)">
            <rect x="0" y="0" width="154" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="12" y="26" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13">用户数据分区</text>
            <text x="12" y="48" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">/private/var/mobile</text>
            <text x="12" y="68" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">APFS 容器格式化重建</text>

            <rect x="174" y="0" width="154" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="186" y="26" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13">钥匙串隔离区</text>
            <text x="186" y="48" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">Keychains Database</text>
            <text x="186" y="68" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">主保护类加密密钥销毁</text>

            <rect x="348" y="0" width="154" height="90" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="360" y="26" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13">供应商标识符</text>
            <text x="360" y="48" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">identifierForVendor</text>
            <text x="360" y="68" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">重启后系统随机分配新值</text>
          </g>
        </g>

        <!-- Bottom Branch: 非易失底层锚点 (Accent) -->
        <g id="branch-persistent" transform="translate(370, 230)">
          <rect x="0" y="0" width="550" height="170" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <text x="24" y="32" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="13">穿透全盘抹机的非易失底层锚点 (头部厂商一致性核心)</text>

          <g transform="translate(24, 48)">
            <rect x="0" y="0" width="154" height="100" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.3"/>
            <text x="12" y="26" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="13">Preboot 分区</text>
            <text x="12" y="48" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11">/System/Volumes/Preboot</text>
            <text x="12" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">引导分区元数据残留</text>
            <text x="12" y="88" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">系统抹机不覆写</text>

            <rect x="174" y="0" width="154" height="100" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.3"/>
            <text x="186" y="26" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="13">固化硬件映射</text>
            <text x="186" y="48" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11">NVRAM / Chip Registry</text>
            <text x="186" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">芯片出厂硬件固化映射</text>
            <text x="186" y="88" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">主板不可变特征</text>

            <rect x="348" y="0" width="154" height="100" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.3"/>
            <text x="360" y="26" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="13">微观拓扑关联</text>
            <text x="360" y="48" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11">Bus Topology Residual</text>
            <text x="360" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">微观硬件总线特征聚合</text>
            <text x="360" y="88" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">云端高维模糊聚类</text>
          </g>
        </g>

        <!-- Connecting Orthogonal Paths -->
        <path d="M 270 190 L 320 190 Q 330 190 330 180 L 330 130 Q 330 120 340 120 L 370 120" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-wipe-persistence-arrow)"/>
        <path d="M 270 230 L 320 230 Q 330 230 330 240 L 330 300 Q 330 310 340 310 L 370 310" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-fingerprint-wipe-persistence-arrow-accent)"/>
      </svg>
