<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="probe-swimlane-title probe-swimlane-desc" width="960" height="620" viewBox="0 0 960 620" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="probe-swimlane-title">AppleLens Four-Domain Zero-MitM Routing and TLS Anti-MitM Probe Swimlane</title>
  <desc id="probe-swimlane-desc">Cross-boundary swimlane showing how RoutingProbeEngine concurrently audits DIRECT baselines, Overseas AI exits, Siri DNS and Surge VIF coexistence, QUIC UDP 443 fallback, and 9-endpoint TLS certificate chains without installing a MitM CA.</desc>
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="sw-link" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="sw-focal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="896" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="32" font-size="17" font-weight="700" fill="#0f172a">RoutingProbeEngine 并发四维探针：零根证书防 MitM 与 VIF 共存判定泳道</text>
    <text x="720" y="31" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">SWIMLANE · ZERO-MITM</text>
  </g>

  <!-- Swimlane Backgrounds (4 horizontal lanes) -->
  <g transform="translate(32, 92)">
    <!-- Lane 0: DIRECT & Siri VIF -->
    <rect x="0" y="0" width="896" height="104" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Lane 1: Proxy Exit Lanes -->
    <rect x="0" y="104" width="896" height="104" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Lane 2: QUIC UDP 443 -->
    <rect x="0" y="208" width="896" height="104" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Lane 3: TLS Anti-MitM (9 Endpoints) -->
    <rect x="0" y="312" width="896" height="116" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Left label column divider -->
    <line x1="152" y1="0" x2="152" y2="428" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Connectors Drawn BEFORE Node Cards -->
  <!-- Lane 0 handoff: Local Audit -> Guzzoni Check -> VIF Coexistence Verdict -->
  <path d="M 392 144 L 424 144" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <path d="M 624 144 L 664 144" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#sw-link)"/>
  <!-- Cross-lane handoff: TLS Guzzoni clean check feeds Lane 0 VIF Verdict! -->
  <path d="M 524 412 L 524 392 Q 524 384 532 384 L 760 384 Q 768 384 768 376 L 768 188" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#sw-focal)"/>

  <!-- Lane 1 flow -->
  <path d="M 392 248 L 424 248" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <path d="M 624 248 L 664 248" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#sw-link)"/>

  <!-- Lane 2 flow -->
  <path d="M 392 352 L 424 352" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#sw-arrow)"/>
  <path d="M 624 352 L 664 352" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#sw-link)"/>

  <!-- Lane 3 flow -->
  <path d="M 392 464 L 424 464" fill="none" stroke="#e11d48" stroke-width="1.8" marker-end="url(#sw-focal)"/>
  <path d="M 624 464 L 664 464" fill="none" stroke="#e11d48" stroke-width="1.8" marker-end="url(#sw-focal)"/>

  <!-- Cross-lane label mask -->
  <g transform="translate(708, 284)">
    <rect x="0" y="0" width="120" height="18" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="60" y="13" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#e11d48" font-weight="600">isGuzzoniCleanTLS</text>
  </g>

  <!-- LANE LABELS (Left Margin Column x=32..184) -->
  <g transform="translate(44, 126)">
    <text x="0" y="12" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0284c7">LANE 01 · DIRECT</text>
    <text x="0" y="30" font-size="12.5" font-weight="700" fill="#0f172a">中文 Siri 与 VIF 审计</text>
  </g>
  <g transform="translate(44, 230)">
    <text x="0" y="12" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#475569">LANE 02 · EGRESS</text>
    <text x="0" y="30" font-size="12.5" font-weight="700" fill="#0f172a">四路海外出口实测</text>
  </g>
  <g transform="translate(44, 334)">
    <text x="0" y="12" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#475569">LANE 03 · HTTP/3</text>
    <text x="0" y="30" font-size="12.5" font-weight="700" fill="#0f172a">原生 QUIC UDP 443</text>
  </g>
  <g transform="translate(44, 444)">
    <text x="0" y="12" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#e11d48">LANE 04 · ANTI-MITM</text>
    <text x="0" y="30" font-size="12.5" font-weight="700" fill="#0f172a">9 端点证书链体检</text>
  </g>

  <!-- LANE 0 NODES -->
  <g transform="translate(200, 108)">
    <rect x="0" y="0" width="192" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">国内直连基准 &amp; 系统代理</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">visa.cn/cdn-cgi/trace</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">核验 loc==CN + skip-proxy</text>
  </g>
  <g transform="translate(424, 108)">
    <rect x="0" y="0" width="200" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">Siri DNS &amp; CNAME 解析</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">guzzoni / siri.apple.com</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">识别 Fake-IP 198.18.x.x 态势</text>
  </g>
  <g transform="translate(664, 108)">
    <rect x="0" y="0" width="244" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#065f46">isSiriVIFDirectHealthy 联合判定</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#047857">Fake-IP ∧ CN ∧ CleanTLS ∧ Bypass</text>
    <text x="12" y="56" font-size="9.5" fill="#065f46">消除 Surge VIF 增强模式下的假阳性误报</text>
  </g>

  <!-- LANE 1 NODES -->
  <g transform="translate(200, 212)">
    <rect x="0" y="0" width="192" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">URLSession Ephemeral</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">--proxy HTTP / SOCKS5 注入</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">支持定向代理端口测试（DIRECT 豁免）</text>
  </g>
  <g transform="translate(424, 212)">
    <rect x="0" y="0" width="200" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">三路海外出口并发探测</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">1.1.1.1 · chatgpt · claude/cp4</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">解析 loc 国家代码与 colo 机房</text>
  </g>
  <g transform="translate(664, 212)">
    <rect x="0" y="0" width="244" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">受限区拦截 &amp; IP 脱敏导出</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">CN/HK/MO ➔ WARN/ERROR</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">Export 时公网 IP 自动打码为 A.B.*.*</text>
  </g>

  <!-- LANE 2 NODES -->
  <g transform="translate(200, 316)">
    <rect x="0" y="0" width="192" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">Network.framework NWConnection</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">NWProtocolQUIC(alpn: ["h3"])</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">原生发起真实 UDP 443 HTTP/3 握手</text>
  </g>
  <g transform="translate(424, 316)">
    <rect x="0" y="0" width="200" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">双边缘并发竞速 (2.8s)</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">cp4.cloudflare · fastly-edge</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">检测 Snell / UDP-REJECT / QUIC-BLOCK</text>
  </g>
  <g transform="translate(664, 316)">
    <rect x="0" y="0" width="244" height="72" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#075985">TCP HTTP/2 回退健康校验</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#0369a1">isQUICUsingTCPFallback</text>
    <text x="12" y="56" font-size="9.5" fill="#075985">UDP 拒通但 HTTPS PCC 畅通仍判可用</text>
  </g>

  <!-- LANE 3 NODES (FOCAL ANTI-MITM) -->
  <g transform="translate(200, 424)">
    <rect x="0" y="0" width="192" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">9 端点并发 TLS 挑战拦截</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#475569">URLSessionDelegate · Cancel Body</text>
    <text x="12" y="56" font-size="9.5" fill="#64748b">拿到响应头即 cancel()，零正文下载</text>
    <text x="12" y="70" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#64748b">覆盖 guzzoni/issuer/mask/ropes/lens</text>
  </g>
  <g transform="translate(424, 424)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#be123c">SecTrustCopyCertificateChain</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#9f1239">无需安装本地 MitM CA 证书</text>
    <text x="12" y="56" font-size="9.5" fill="#881337">扫描全链 17 种代理 MitM 关键字</text>
    <text x="12" y="70" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#be123c">Surge / Charles / mitmproxy / Clash</text>
  </g>
  <g transform="translate(664, 424)">
    <rect x="0" y="0" width="244" height="80" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#be123c">Apple / WebPKI 签发者严格核验</text>
    <text x="12" y="40" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#9f1239">SecCertificateCopyValues(IssuerOID)</text>
    <text x="12" y="56" font-size="9.5" fill="#881337">单证书链强制提取真实 Issuer CN</text>
    <text x="12" y="70" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#be123c">绝不误拿 Leaf Subject 冒充签发者</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(32, 540)">
    <rect x="0" y="0" width="896" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(20, 18)">
      <line x1="0" y1="8" x2="26" y2="8" stroke="#e11d48" stroke-width="2" marker-end="url(#sw-focal)"/>
      <text x="36" y="12" font-size="11" fill="#334155">反 MitM 证书链核验与跨域状态联动</text>
    </g>
    <g transform="translate(316, 18)">
      <line x1="0" y1="8" x2="26" y2="8" stroke="#0284c7" stroke-width="2" marker-end="url(#sw-link)"/>
      <text x="36" y="12" font-size="11" fill="#334155">出口并发探测与 TCP H2 回退流</text>
    </g>
    <g transform="translate(596, 18)">
      <rect x="0" y="1" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <text x="22" y="12" font-size="11" fill="#334155">联合健康裁决（零根证书 · 脱敏导出）</text>
    </g>
  </g>
</svg>
