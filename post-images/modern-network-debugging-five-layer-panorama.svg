<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="modern-network-debugging-five-layer-panorama-title modern-network-debugging-five-layer-panorama-desc">
  <title id="modern-network-debugging-five-layer-panorama-title">现代网络与接口调试全景五层武器库模型</title>
  <desc id="modern-network-debugging-five-layer-panorama-desc">展示从AI Agent应用层、公网流量准入、边缘DNS寻址、物理硬件串口到工业私有总线的全栈调试工具拓扑</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="490" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">全栈拓扑：现代网络与接口调试全景演进模型（从 L7 AGENT 到 L1/L2 硬件总线）</text>
    <text x="896" y="16" text-anchor="end" class="tag">5-LAYER FULL STACK TOOLCHAIN</text>
  </g>

  <!-- Layer 1: App &amp; AI Agent (Core Accent) -->
  <g transform="translate(32, 54)">
    <rect width="896" height="68" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="896" height="24" fill="#fff5f5" rx="8" />
    <rect y="16" width="896" height="8" fill="#fff5f5" />
    <line x1="0" y1="24" x2="896" y2="24" stroke="#fed7d7" stroke-width="1" />
    <text x="16" y="17" class="coral-title" style="font-size:11px;">LAYER 5: 应用层与智能体调试（L7 &amp; AI AGENT）</text>
    <text x="880" y="17" text-anchor="end" class="coral-tag">HOOKLISTENER</text>
    <g transform="translate(16, 32)">
      <text class="title" style="font-size:12px;" x="0" y="0">Hooklistener：67 个 MCP 工具原子化直连 Cursor / Claude Code</text>
      <text class="desc" x="0" y="18">告别复制粘贴，Webhook 回调自动流转进 Agent 上下文，支持精准请求重放与闭环热修复</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 480 122 L 480 138" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 2: Ingress &amp; NAT -->
  <g transform="translate(32, 138)">
    <rect width="896" height="68" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="896" height="24" fill="#f8fafc" rx="8" />
    <rect y="16" width="896" height="8" fill="#f8fafc" />
    <line x1="0" y1="24" x2="896" y2="24" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="17" class="title" style="font-size:11px;">LAYER 4: 公网流量准入与 NAT 穿透（L4/L7 INGRESS）</text>
    <text x="880" y="17" text-anchor="end" class="tag">TUNNL.GG</text>
    <g transform="translate(16, 32)">
      <text class="title" style="font-size:12px;" x="0" y="0">tunnl.gg：零客户端、原生 OpenSSH 反向端口转发</text>
      <text class="desc" x="0" y="18">以本地 ~/.ssh/id_ed25519.pub 公钥指纹作为隐式身份锚点，绑定跨电脑永不改变的持久化子域名</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 480 206 L 480 222" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 3: Edge DNS -->
  <g transform="translate(32, 222)">
    <rect width="896" height="68" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="896" height="24" fill="#f8fafc" rx="8" />
    <rect y="16" width="896" height="8" fill="#f8fafc" />
    <line x1="0" y1="24" x2="896" y2="24" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="17" class="title" style="font-size:11px;">LAYER 3: 边缘网络与基础设施寻址（L3/L4 DNS）</text>
    <text x="880" y="17" text-anchor="end" class="tag">DYNIP</text>
    <g transform="translate(16, 32)">
      <text class="title" style="font-size:12px;" x="0" y="0">DynIP：纯正 RFC 2136 TSIG 权威动态域名解析</text>
      <text class="desc" x="0" y="18">60 秒全球端到端极速收敛，无惧运营商 CGNAT，完美适配 K8s external-dns 与 Let's Encrypt 证书自动化</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 480 290 L 480 306" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 4: Physical Serial -->
  <g transform="translate(32, 306)">
    <rect width="896" height="68" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="896" height="24" fill="#f8fafc" rx="8" />
    <rect y="16" width="896" height="8" fill="#f8fafc" />
    <line x1="0" y1="24" x2="896" y2="24" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="17" class="title" style="font-size:11px;">LAYER 2: 物理层与硬件串行通信（L1/L2 WEB API）</text>
    <text x="880" y="17" text-anchor="end" class="tag">AETHERPORT</text>
    <g transform="translate(16, 32)">
      <text class="title" style="font-size:12px;" x="0" y="0">AetherPort（云之彼端）：基于 Web Serial API 的跨平台在线波形工作站</text>
      <text class="desc" x="0" y="18">现代浏览器免驱直连串口，Canvas 60 FPS 动态绘制多通道传感器波形，网页端直接 YMODEM 刷写固件</text>
    </g>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 480 374 L 480 390" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 5: Industrial Bus -->
  <g transform="translate(32, 390)">
    <rect width="896" height="68" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="896" height="24" fill="#f8fafc" rx="8" />
    <rect y="16" width="896" height="8" fill="#f8fafc" />
    <line x1="0" y1="24" x2="896" y2="24" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="17" class="title" style="font-size:11px;">LAYER 1: 工业工控总线与私有协议仿真（L2-L7 软硬件一体）</text>
    <text x="880" y="17" text-anchor="end" class="tag">JICESYS</text>
    <g transform="translate(16, 32)">
      <text class="title" style="font-size:12px;" x="0" y="0">JiceSys（极测）：面向 CAN/1553B/TCP/UDP 异构通信的万物智联版 Postman</text>
      <text class="desc" x="0" y="18">位域级字段建模，零代码公式验证时序连续性，在无物理控制器条件下执行全套包围式敏捷仿真</text>
    </g>
  </g>
</svg>