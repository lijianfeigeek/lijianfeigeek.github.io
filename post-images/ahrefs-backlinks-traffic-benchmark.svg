          <text x="65" y="224" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">4 ~ 10 个</text>
          <text x="65" y="244" fill="#5a6580" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">长尾词稳定上架</text>
        </g>
        <g transform="translate(575, 80)">
          <rect x="0" y="70" width="130" height="130" rx="2" fill="#2e5aa8"/>
          <text x="65" y="58" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="14" font-weight="600" text-anchor="middle">~1,250 UV</text>
          <text x="65" y="224" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">11 ~ 50 个</text>
          <text x="65" y="244" fill="#5a6580" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">突破前 3 位排名门槛</text>
        </g>
        <g transform="translate(740, 80)">
          <rect x="0" y="10" width="130" height="190" rx="2" fill="#bf4520"/>
          <text x="65" y="0" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">4,800+ UV</text>
          <text x="65" y="224" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">50+ 个 (FOCAL)</text>
          <text x="65" y="244" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">大词前排绝对统治力</text>
