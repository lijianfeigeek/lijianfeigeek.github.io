          <text x="65" y="224" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">1 ~ 3 个</text>
          <text x="65" y="244" fill="#5a6580" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">开始建立微弱索引</text>
        </g>
        <g transform="translate(410, 80)">
