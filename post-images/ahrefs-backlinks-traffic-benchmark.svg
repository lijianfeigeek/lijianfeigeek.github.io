          <text x="65" y="224" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">0 引用域名</text>
          <text x="65" y="244" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">90.63% 处于隐形状态</text>
