          <text x="240" y="20" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">数据来源：Ahrefs Study of 1.4 Billion Pages · 结论：外链是排名的核心胜负手</text>
        </g>
