<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-two-shield-defense-title ios-noir-two-shield-defense-desc" id="ios-noir-two-shield-defense-root">
        <title id="ios-noir-two-shield-defense-title">反追踪终局防御：内核加密 DNS 与网络规则双护盾体系</title>
        <desc id="ios-noir-two-shield-defense-desc">原生 com.apple.dnsSettings.managed 内核 DoH 加密与 Surge/Clash/Shadowrocket 规则分流协同架构</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-two-shield-defense-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-two-shield-defense-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-two-shield-defense-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-two-shield-defense-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-two-shield-defense-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-two-shield-defense-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Shield 1: 原生内核加密 DNS 描述文件 (Left Focal) -->
        <g transform="translate(40, 24)">
          <rect x="0" y="0" width="420" height="330" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="36" rx="8" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="16" y="24" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">SHIELD 01 · 原生内核加密 DNS 描述文件 (24H 隐形装甲)</text>

          <g transform="translate(20, 56)">
            <rect x="0" y="0" width="380" height="70" rx="4" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1" fill-opacity="0.04"/>
            <text x="14" y="24" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">规范：com.apple.dnsSettings.managed</text>
            <text x="14" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">纯原生配置注入，零耗电、零后台常驻、零证书风险</text>
          </g>

          <g transform="translate(20, 140)">
            <rect x="0" y="0" width="380" height="80" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">底层防护机制：DoH / DoT 协议强制加密</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 掐死运营商 LocalDNS 劫持与明文 53 端口投毒</text>
            <text x="14" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 局域网公共 Wi-Fi 路由器无法刺探 DNS 请求域名</text>
          </g>

          <g transform="translate(20, 234)">
            <rect x="0" y="0" width="380" height="74" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">智能互斥：与代理工具无缝共存</text>
            <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">开启 Surge/Clash 时原生内核自动让位；</text>
            <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">断开代理瞬间，内核描述文件毫秒级接管，全天候零空窗期。</text>
          </g>
        </g>

        <!-- Shield 2: Surge / Clash 规则分流 (Right Focal) -->
        <g transform="translate(500, 24)">
          <rect x="0" y="0" width="420" height="330" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="36" rx="8" fill="#bf4520" fill-opacity="0.06"/>
          <text x="16" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">SHIELD 02 · 网络层深度规则阻断 (FOCAL)</text>

          <g transform="translate(20, 56)">
            <rect x="0" y="0" width="380" height="70" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.05"/>
            <text x="14" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">精准 REJECT 策略 · 阻断黑产探针域名</text>
            <text x="14" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">拦截基站取号、跨 App DNA 指纹库与生物探针</text>
          </g>

          <g transform="translate(20, 140)">
            <rect x="0" y="0" width="380" height="80" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">三大必杀规则集：</text>
            <text x="14" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">1. 封杀运营商取号网关：cmpassport / wostore / id6.me</text>
            <text x="14" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">2. 斩断跨应用指纹：shuzilm.cn (数字联盟设备 DNA 库)</text>
          </g>

          <g transform="translate(20, 234)">
            <rect x="0" y="0" width="380" height="74" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
            <text x="14" y="22" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">高级防御：阻止行为特征画像</text>
            <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">全面阻断 TMXBehavioSec 生物击键微动探针与秒针、</text>
            <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">友盟等全网打标域，彻底打断黑产用户画像链路。</text>
          </g>
        </g>
      </svg>
