<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockxy-mitm-trust-lifecycle-sequence-title rockxy-mitm-trust-lifecycle-sequence-desc">
  <title id="rockxy-mitm-trust-lifecycle-sequence-title">中间人攻击（MITM）信任建立与解密生命周期时序图</title>
  <desc id="rockxy-mitm-trust-lifecycle-sequence-desc">展示客户端、调试代理、系统钥匙串与目标服务器之间的三阶段交互与数据明文暴露风险</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
      .phase-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Participants Header -->
  <g transform="translate(40, 24)">
    <!-- P1: Client -->
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" class="label-title">📱 客户端应用</text>
      <text x="90" y="40" text-anchor="middle" class="label-sub">App / CLI / 浏览器</text>
      <line x1="90" y1="48" x2="90" y2="460" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P2: Proxy (Rockxy) - Focal -->
    <g transform="translate(230, 0)">
      <rect width="200" height="48" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 700; fill: #9a3412;">⚡ 调试代理 (Rockxy)</text>
      <text x="100" y="40" text-anchor="middle" class="tag-coral">SwiftNIO 代理引擎</text>
      <line x1="100" y1="48" x2="100" y2="460" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P3: Keychain -->
    <g transform="translate(470, 0)">
      <rect width="180" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" class="label-title">🔐 系统钥匙串</text>
      <text x="90" y="40" text-anchor="middle" class="label-sub">macOS Keychain</text>
      <line x1="90" y1="48" x2="90" y2="460" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P4: Remote Host -->
    <g transform="translate(700, 0)">
      <rect width="180" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" class="label-title">🌐 目标服务器</text>
      <text x="90" y="40" text-anchor="middle" class="label-sub">Remote Target API</text>
      <line x1="90" y1="48" x2="90" y2="460" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
  </g>

  <!-- Lifeline coordinate X:
       Client: 130
       Proxy: 370
       Keychain: 600
       Remote: 830
  -->

  <!-- Phase 1: Trust Root -->
  <g transform="translate(50, 90)">
    <rect width="860" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="20" class="phase-title" fill="#0369a1">阶段 1：信任根建立 (Root CA Installation)</text>
    <path d="M 320 44 L 542 44" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="360" y="32" width="140" height="22" rx="4" fill="#ffffff" stroke="#e0f2fe" stroke-width="1"/>
    <text x="430" y="47" text-anchor="middle" class="text-code" fill="#0284c7">1. 注册并信任私有 Root CA</text>
  </g>

  <!-- Phase 2: Dynamic Minting &amp; Interception -->
  <g transform="translate(50, 180)">
    <rect width="860" height="154" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" class="phase-title" fill="#475569">阶段 2：动态伪造与解密拦截 (Dynamic Minting &amp; Interception)</text>

    <!-- Step 2: Client Hello to Proxy -->
    <path d="M 80 44 L 312 44" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="110" y="32" width="170" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="195" y="47" text-anchor="middle" class="text-code">2. TLS Client Hello (SNI)</text>

    <!-- Step 3: Proxy to Remote -->
    <path d="M 320 68 L 772 68" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="470" y="56" width="160" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="550" y="71" text-anchor="middle" class="text-code">3. 与目标完成真实 TLS 握手</text>

    <!-- Step 4: Self Minting -->
    <path d="M 320 96 C 350 96, 350 114, 320 114" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
    <rect x="340" y="94" width="220" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="450" y="109" text-anchor="middle" class="tag-coral">4. 动态签发 *.example.com 伪造证书</text>

    <!-- Step 5: Return Cert -->
    <path d="M 320 136 L 88 136" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <rect x="110" y="124" width="180" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="200" y="139" text-anchor="middle" class="text-code">5. 返回伪造证书完成 TLS 握手</text>
  </g>

  <!-- Phase 3: Plaintext &amp; Security Risk -->
  <g transform="translate(50, 350)">
    <rect width="860" height="134" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="20" class="phase-title" fill="#9a3412">阶段 3：明文数据暴露 (Plaintext Exposure &amp; Re-encryption)</text>

    <!-- Step 6: Payload sent -->
    <path d="M 80 44 L 312 44" stroke="#9a3412" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
    <rect x="95" y="32" width="200" height="22" rx="4" fill="#ffffff" stroke="#ffedd5" stroke-width="1"/>
    <text x="195" y="47" text-anchor="middle" class="text-code" fill="#9a3412">6. 发送加密 Payload (含鉴权 Token)</text>

    <!-- Step 7: Decrypted in Memory -->
    <path d="M 320 70 C 350 70, 350 88, 320 88" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
    <rect x="340" y="68" width="210" height="22" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <text x="445" y="83" text-anchor="middle" class="tag-coral">7. 解密为明文进入代理进程内存</text>

    <!-- Step 8: Re-encrypt and Forward -->
    <path d="M 320 108 L 772 108" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="470" y="96" width="180" height="22" rx="4" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="560" y="111" text-anchor="middle" class="text-code" fill="#059669">8. 重新加密并安全透传至目标 Host</text>
  </g>
</svg>