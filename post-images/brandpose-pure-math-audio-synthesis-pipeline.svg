<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brandpose-pure-math-audio-synthesis-pipeline-title brandpose-pure-math-audio-synthesis-pipeline-desc">
  <title id="brandpose-pure-math-audio-synthesis-pipeline-title">零音频采样依赖：纯 Python 数学计算合成电影级原声音轨</title>
  <desc id="brandpose-pure-math-audio-synthesis-pipeline-desc">通过 NumPy 与 SciPy 计算 808 下潜底鼓、金属白噪声闭镲、氛围和弦 Pad，经卷积混响、侧链抽吸与 tanh 软削波输出 48kHz 高保真立体声</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #334155; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="snd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Timeline Grid Trigger -->
  <g transform="translate(40, 120)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="70" y="32" text-anchor="middle" class="label-title">timeline.json</text>
    <text x="70" y="52" text-anchor="middle" class="text-body">视频帧节拍锁相</text>
    <text x="70" y="72" text-anchor="middle" class="text-code" fill="#0284c7">44.3s 纯数学计算</text>
  </g>

  <!-- Connect to Synthesis Engines -->
  <path d="M 180 170 L 218 70" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>
  <path d="M 180 170 L 218 135" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>
  <path d="M 180 170 L 218 205" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>
  <path d="M 180 170 L 218 270" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>

  <!-- 4 Synth Tracks -->
  <!-- Track 1: Kick -->
  <g transform="translate(220, 40)">
    <rect width="210" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="24" class="label-title">808 风格下潜底鼓 (Kick)</text>
    <text x="12" y="44" class="text-code">150Hz ➔ 40Hz 指数衰减正弦相位积分</text>
  </g>

  <!-- Track 2: Hi-hat -->
  <g transform="translate(220, 110)">
    <rect width="210" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="24" class="label-title">金属闭镲 (Hi-hat)</text>
    <text x="12" y="44" class="text-code">均匀白噪声 + 高通滤波 + 快速指数衰减</text>
  </g>

  <!-- Track 3: Pad -->
  <g transform="translate(220, 180)">
    <rect width="210" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="24" class="label-title">环境氛围和弦 (Pad)</text>
    <text x="12" y="44" class="text-code">微失谐正弦波叠加 + 四阶 Butterworth 低通</text>
  </g>

  <!-- Track 4: Riser -->
  <g transform="translate(220, 250)">
    <rect width="210" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="24" class="label-title">反转膨胀音 (Riser)</text>
    <text x="12" y="44" class="text-code">扫频白噪声 + 线性增益上扬包络</text>
  </g>

  <!-- Connect to Master Mixing -->
  <path d="M 430 70 L 468 170" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>
  <path d="M 430 140 L 468 170" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>
  <path d="M 430 210 L 468 170" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>
  <path d="M 430 280 L 468 170" stroke="#64748b" stroke-width="1.5" marker-end="url(#snd-arrow)"/>

  <!-- Master DSP Pipeline (Focal) -->
  <g transform="translate(470, 70)">
    <rect width="240" height="200" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="16" y="28" class="tag-coral">DSP 后期母带链路 (Master Chain)</text>
    <text x="16" y="48" class="label-title" fill="#9a3412">卷积混响与动态抽吸</text>
    <line x1="16" y1="60" x2="224" y2="60" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(16, 75)">
      <text x="0" y="0" class="label-title" style="font-size: 11px;">1. 卷积人工混响 (Reverb)</text>
      <text x="0" y="16" class="text-body">指数衰减脉冲响应拉出空灵声场</text>

      <text x="0" y="42" class="label-title" style="font-size: 11px;" fill="#bf4520">2. 侧链抽吸 (Sidechain Ducking)</text>
      <text x="0" y="58" class="text-body">底鼓踩下时氛围瞬时避让律动</text>

      <text x="0" y="84" class="label-title" style="font-size: 11px;">3. tanh 软削波饱和 + 峰值 -1 dBFS</text>
      <text x="0" y="100" class="text-body">温暖模拟饱和感，消除数字破音</text>
    </g>
  </g>

  <!-- Connect to Final Output -->
  <path d="M 710 170 L 748 170" stroke="#059669" stroke-width="1.5" marker-end="url(#snd-arrow)"/>

  <!-- Final Output Card -->
  <g transform="translate(750, 110)">
    <rect width="170" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="16" y="28" class="label-badge" fill="#15803d">最终母带输出</text>
    <text x="16" y="50" class="label-title" fill="#15803d">高保真立体声音轨</text>
    <line x1="16" y1="62" x2="154" y2="62" stroke="#bbf7d0" stroke-width="1"/>
    <text x="16" y="80" class="text-code">48kHz 16-bit WAV</text>
    <text x="16" y="98" class="text-body">FFmpeg AAC 完美封装</text>
  </g>
</svg>