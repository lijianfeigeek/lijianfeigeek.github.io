<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="se-ice-title se-ice-desc">
  <title id="se-ice-title">软件工程的暗冰山：露在水面的 10% 可视功能 vs 水下 90% 工业级稳健骨架</title>
  <desc id="se-ice-desc">解构响马消耗大几十亿Token打磨的代码：页面UI仅占水面10%，水下涵盖类型契约、混沌容错、事务补偿、竞态死锁防御、全链路遥测与Eval评测体系。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .ice-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">软件工程的“暗冰山”结构模型</text>
    <text class="subtitle" x="0" y="20">看得见的代码不到 10%，剩下的 90% 全是确保系统在严酷现实中不至于粉身碎骨的工程地基</text>
  </g>

  <!-- Waterline Division -->
  <!-- Top: Above Water (10%) -->
  <g transform="translate(48, 86)">
    <rect width="864" height="90" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <text class="ice-label" fill="#0369a1" x="0" y="0">露在水面的 10%（外行眼里的『有用功能』/ Vibe 原型）</text>
      
      <g transform="translate(0, 16)">
        <rect width="260" height="46" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">页面 UI 布局与动效呈现</text>
          <text class="card-body" x="0" y="15">CSS 样式、按钮表单、交互特效</text>
        </g>
      </g>

      <g transform="translate(286, 16)">
        <rect width="260" height="46" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">主流程 Happy Path 业务逻辑</text>
          <text class="card-body" x="0" y="15">假设网络不卡、用户不乱点、参数全对</text>
        </g>
      </g>

      <g transform="translate(572, 16)">
        <rect width="260" height="46" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">本地单机演示 Demo 跑通</text>
          <text class="card-body" x="0" y="15">录屏惊艳全网，但无法承载多并发</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Water Surface Line -->
  <line x1="36" y1="184" x2="924" y2="184" stroke="#0288d1" stroke-width="2" stroke-dasharray="6,3"/>
  <text class="mono" fill="#0288d1" x="50" y="196">~~~~~~~~~~ 真实工业生产环境水面 (Waterline) ~~~~~~~~~~</text>

  <!-- Bottom: Submerged (90%) - Deep Blue / Darker Zone -->
  <g transform="translate(48, 206)">
    <rect width="864" height="270" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="ice-label" fill="#0f172a" x="0" y="0">沉入水下的 90%（响马大几十亿 Token 打磨的『没用代码』）</text>

      <!-- Row 1: Contracts &amp; Fault Tolerance -->
      <g transform="translate(0, 18)">
        <rect width="406" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" fill="#be123c" x="0" y="0">1. 防御性规格与类型契约 (Schema &amp; Assertions)</text>
          <text class="card-body" x="0" y="15">严苛入参断言、状态转移守卫，杜绝大模型快乐路径崩溃</text>
        </g>
      </g>

      <g transform="translate(426, 18)">
        <rect width="406" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" fill="#be123c" x="0" y="0">2. 极端边界与混沌容错 (Edge Cases &amp; Chaos)</text>
          <text class="card-body" x="0" y="15">超时自愈、熔断降级、突变测试（Mutation Testing）覆盖</text>
        </g>
      </g>

      <!-- Row 2: Consistency &amp; Concurrency -->
      <g transform="translate(0, 78)">
        <rect width="406" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">3. 分布式一致性与事务补偿 (Saga &amp; Idempotency)</text>
          <text class="card-body" x="0" y="15">跨服务失败回滚、不可逆调用幂等键去重、数据对账审计</text>
        </g>
      </g>

      <g transform="translate(426, 78)">
        <rect width="406" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">4. 并发竞态与死锁防御 (Race Conditions &amp; Locks)</text>
          <text class="card-body" x="0" y="15">内存屏障、分布式锁争抢、无锁队列与乐观并发控制</text>
        </g>
      </g>

      <!-- Row 3: Telemetry, Sandbox &amp; Eval Harness -->
      <g transform="translate(0, 138)">
        <rect width="406" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">5. 全链路遥测与可观测性 (OpenTelemetry &amp; Tracing)</text>
          <text class="card-body" x="0" y="15">秒级定界线上分布式静默故障、结构化遥测与性能瓶颈打点</text>
        </g>
      </g>

      <g transform="translate(426, 138)">
        <rect width="406" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">6. 安全沙箱与合规渗透防御 (Security Guardrails)</text>
          <text class="card-body" x="0" y="15">最小权限沙箱隔离、Prompt 注入拦截、代码执行防逃逸</text>
        </g>
      </g>

      <!-- Bottom Pillar: Eval Harness -->
      <g transform="translate(0, 198)">
        <rect width="832" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <g transform="translate(14, 14)">
          <text class="card-title" fill="#1d4ed8" x="0" y="0">7. Coding Agent 失败模式治理与 Eval 基准评估套件 (Eval Harness)</text>
          <text class="card-body" fill="#1e40af" x="0" y="15">自动化回归测试捕捉 Agent 代码隐秘退化，长上下文中间遗忘治理</text>
        </g>
      </g>
    </g>
  </g>
</svg>