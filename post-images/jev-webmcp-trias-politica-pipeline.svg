<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="jev-trias-politica-title jev-trias-politica-desc">
  <title id="jev-trias-politica-title">Jev + Mercury 2.5 + WebMCP 三权分立协同流水线</title>
  <desc id="jev-trias-politica-desc">展示动作决断中枢、参数填补员与接口契约层三权分立的分工哲学与数据流转</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 6; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow5-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" />

  <!-- 3 Main Columns -->
  <!-- Col 1: Jev System 1 (x=40, y=40, w=270, h=300) - Focal -->
  <g transform="translate(40, 40)">
    <rect width="270" height="300" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 44 L 0 44 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="16" y="28" class="text-focal-title">1. 动作决断中枢 (System 1)</text>

    <g transform="translate(16, 56)">
      <rect width="238" height="66" class="focal-pill" />
      <text x="12" y="20" class="text-subtitle" fill="#bf4520">Jev 决策路由引擎</text>
      <text x="12" y="38" class="text-body">• 职责: 工具选拔与动作路由</text>
      <text x="12" y="54" class="text-body">• 输入: 业务目标 + WebMCP 工具集</text>
    </g>

    <g transform="translate(16, 132)">
      <rect width="238" height="66" class="pill" />
      <text x="12" y="20" class="text-subtitle">毫秒级条件反射</text>
      <text x="12" y="38" class="text-body">• 耗时: ~80ms 极速前向推理</text>
      <text x="12" y="54" class="text-body">• 产出: 目标工具名 search_products</text>
    </g>

    <g transform="translate(16, 208)">
      <rect width="238" height="74" class="pill" />
      <text x="12" y="20" class="text-subtitle">核心哲学</text>
      <text x="12" y="38" class="text-muted">解决“下一步究竟该干嘛”的根本方向问题，绝不承担打字负担</text>
    </g>
  </g>

  <!-- Col 2: Mercury 2.5 (x=345, y=40, w=270, h=300) -->
  <g transform="translate(345, 40)">
    <rect width="270" height="300" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 44 L 0 44 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">2. 参数填补员 (System 2 Lite)</text>

    <g transform="translate(16, 56)">
      <rect width="238" height="66" class="pill" />
      <text x="12" y="20" class="text-subtitle">Mercury 2.5 极速小模型</text>
      <text x="12" y="38" class="text-body">• 职责: 细粒度参数构造</text>
      <text x="12" y="54" class="text-body">• 特性: 1000+ tok/s，成本极低</text>
    </g>

    <g transform="translate(16, 132)">
      <rect width="238" height="66" class="pill" />
      <text x="12" y="20" class="text-subtitle">结构化参数生成</text>
      <text x="12" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">• query = "Sony WH-1000XM5"</text>
      <text x="12" y="54" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">• category = "headphone"</text>
    </g>

    <g transform="translate(16, 208)">
      <rect width="238" height="74" class="pill" />
      <text x="12" y="20" class="text-subtitle">核心哲学</text>
      <text x="12" y="38" class="text-muted">让最轻量模型专注填补字符串，消除大模型自回归长思维链的时间浪费</text>
    </g>
  </g>

  <!-- Col 3: WebMCP Interface (x=650, y=40, w=270, h=300) -->
  <g transform="translate(650, 40)">
    <rect width="270" height="300" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 44 L 0 44 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">3. 接口契约层 (WebMCP)</text>

    <g transform="translate(16, 56)">
      <rect width="238" height="66" class="pill" />
      <text x="12" y="20" class="text-subtitle">WebMCP 官方标准接口</text>
      <text x="12" y="38" class="text-body">• 消除 DOM 乱象与视觉噪声</text>
      <text x="12" y="54" class="text-body">• 网站原生暴露强类型 API</text>
    </g>

    <g transform="translate(16, 132)">
      <rect width="238" height="66" class="pill" />
      <text x="12" y="20" class="text-subtitle">原子化执行</text>
      <text x="12" y="38" class="text-body">• 6次繁琐点击压缩为 1 次工具调用</text>
      <text x="12" y="54" class="text-body">• 浏览器内核直接原生执行</text>
    </g>

    <g transform="translate(16, 208)">
      <rect width="238" height="74" class="pill" />
      <text x="12" y="20" class="text-subtitle">执行结果</text>
      <text x="12" y="38" class="text-muted">向原生浏览器发送强类型请求，彻底免除像素级截屏与视觉偏差</text>
    </g>
  </g>

  <!-- Connectors from Col 1 &amp; 2 to Col 3 -->
  <path d="M 310 120 L 638 120" class="focal-line" marker-end="url(#arrow5-focal)" />
  <text x="440" y="112" font-family="sans-serif" font-size="10" font-weight="700" fill="#bf4520">① Jev 选定工具名称</text>

  <path d="M 615 170 L 638 170" class="line" marker-end="url(#arrow5)" />
  <text x="560" y="162" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">② 填充调用参数</text>

  <!-- Bottom Execution Banner -->
  <g transform="translate(40, 360)">
    <rect width="880" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="20" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#166534">架构结晶：分层解耦与专用化，将端到端延迟压入 120ms 黄金区间</text>
    <text x="20" y="42" font-family="sans-serif" font-size="11" fill="#15803d">Jev 当裁判定方向，Mercury 当速记员填参数，WebMCP 铺平跑道无损交付，彻底终结单体模型迷信</text>
  </g>
</svg>