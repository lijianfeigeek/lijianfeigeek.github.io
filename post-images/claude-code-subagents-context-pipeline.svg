<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="cc-pipeline-title cc-pipeline-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Segoe UI',Roboto,sans-serif;">
  <title id="cc-pipeline-title">Claude Code Subagent 启动上下文装配与双阶段过滤流水线</title>
  <desc id="cc-pipeline-desc">对比内置 Explore/Plan、自定义 Subagent 与 /subtask 分叉三条路径在作用域优先级、启动上下文加载、双阶段工具过滤、权限裁决与提示词缓存复用上的完整数据流。</desc>
