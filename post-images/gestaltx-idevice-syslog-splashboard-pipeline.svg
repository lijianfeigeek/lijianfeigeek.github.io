<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; fill: #64748b; }
      .lane-title { font-size: 12px; font-weight: 700; }
      .card-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .card-desc { font-size: 10px; fill: #475569; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 600; }
      .arrow-text { font-size: 9.5px; font-weight: 600; }
      .flow-line { fill: none; }
    </style>
    <marker id="pipe-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="pipe-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="pipe-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="pipe-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="pipe-arrow-darkgreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803d" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="520" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="918" height="518" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <!-- Title Area -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="title">端侧 idevice 环回握手、syslog 流式抓取与 SplashBoard 原子落盘时序</text>
    <text x="0" y="20" class="subtitle">解构 GestaltX 在免越狱侧载沙盒下，如何通过 LocalDevVPN 环回通信与 O_NOFOLLOW 阶梯锁定实现动态资源覆写</text>
  </g>

  <!-- Swimlane 1: UI / GestaltX App -->
  <g transform="translate(32, 70)">
    <rect width="856" height="92" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="130" height="92" fill="#f8fafc" rx="6"/>
    <rect x="122" y="0" width="8" height="92" fill="#f8fafc"/>
    <text x="14" y="38" class="lane-title" fill="#0369a1">用户交互层</text>
    <text x="14" y="56" class="card-desc">GestaltX 前台</text>

    <!-- Node 1-1 -->
    <g transform="translate(146, 16)">
      <rect width="154" height="60" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="6"/>
      <text x="10" y="22" class="card-title">1. 发起自定义替换</text>
      <text x="10" y="38" class="card-desc">自选启动图或应用音频</text>
      <text x="10" y="52" class="tag" fill="#0284c7">AVAudioFile 转码</text>
    </g>

    <!-- Node 1-2 -->
    <g transform="translate(670, 16)">
      <rect width="170" height="60" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="6"/>
      <text x="10" y="22" class="card-title">8. 界面刷新与即时就绪</text>
      <text x="10" y="38" class="card-desc">SHA-256 原厂备份归档</text>
      <text x="10" y="52" class="tag" fill="#15803d">无需重启 / 瞬时生效</text>
    </g>
  </g>

  <!-- Swimlane 2: Loopback Daemon (idevice-ffi) -->
  <g transform="translate(32, 172)">
    <rect width="856" height="92" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="130" height="92" fill="#f8fafc" rx="6"/>
    <rect x="122" y="0" width="8" height="92" fill="#f8fafc"/>
    <text x="14" y="38" class="lane-title" fill="#7c3aed">环回通信层</text>
    <text x="14" y="56" class="card-desc">idevice-ffi 守护</text>

    <!-- Node 2-1 -->
    <g transform="translate(146, 16)">
      <rect width="154" height="60" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1" rx="6"/>
      <text x="10" y="22" class="card-title">2. 建立 127.0.0.1 隧道</text>
      <text x="10" y="38" class="card-desc">LocalDevVPN 环回握手</text>
      <text x="10" y="52" class="tag" fill="#7c3aed">PairingStore PIN 配对</text>
    </g>

    <!-- Node 2-2 -->
    <g transform="translate(320, 16)">
      <rect width="160" height="60" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1" rx="6"/>
      <text x="10" y="22" class="card-title">3. 流式读取 os_log / syslog</text>
      <text x="10" y="38" class="card-desc">挂钩系统控制台日志流</text>
      <text x="10" y="52" class="tag" fill="#7c3aed">GXDeviceConsole 监听</text>
    </g>
  </g>

  <!-- Swimlane 3: System Services & Parser -->
  <g transform="translate(32, 274)">
    <rect width="856" height="92" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="130" height="92" fill="#f8fafc" rx="6"/>
    <rect x="122" y="0" width="8" height="92" fill="#f8fafc"/>
    <text x="14" y="38" class="lane-title" fill="#d97706">系统守护层</text>
    <text x="14" y="56" class="card-desc">SpringBoard 服务</text>

    <!-- Node 3-1 -->
    <g transform="translate(320, 16)">
      <rect width="160" height="60" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="6"/>
      <text x="10" y="22" class="card-title">4. 通知触发与音轨解析</text>
      <text x="10" y="38" class="card-desc">捕获音频播放事件</text>
      <text x="10" y="52" class="tag" fill="#d97706">usernotificationsd 日志</text>
    </g>

    <!-- Node 3-2 -->
    <g transform="translate(500, 16)">
      <rect width="150" height="60" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="6"/>
      <text x="10" y="22" class="card-title">5. 正则过滤与沙盒归位</text>
      <text x="10" y="38" class="card-desc">提取目标音效相对路径</text>
      <text x="10" y="52" class="tag" fill="#d97706">LogParser 定位</text>
    </g>
  </g>

  <!-- Swimlane 4: Container Pinning & Storage -->
  <g transform="translate(32, 376)">
    <rect width="856" height="114" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
    <rect x="0" y="0" width="130" height="114" fill="#f8fafc" rx="6"/>
    <rect x="122" y="0" width="8" height="114" fill="#f8fafc"/>
    <text x="14" y="48" class="lane-title" fill="#059669">沙盒存储层</text>
    <text x="14" y="66" class="card-desc">SplashBoard / 音频</text>

    <!-- Node 4-1 -->
    <g transform="translate(500, 16)">
      <rect width="150" height="82" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" rx="6"/>
      <text x="10" y="20" class="card-title">6. openat 逐级描述符锁定</text>
      <text x="10" y="36" class="card-desc">遍历 Library/SplashBoard</text>
      <text x="10" y="50" class="card-desc">锁定 Snapshots 真实目录</text>
      <text x="10" y="68" class="tag" fill="#059669">O_NOFOLLOW | O_CLOEXEC</text>
    </g>

    <!-- Node 4-2 -->
    <g transform="translate(670, 16)">
      <rect width="170" height="82" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" rx="6"/>
      <text x="10" y="20" class="card-title">7. 原子写入与防竞态归档</text>
      <text x="10" y="36" class="card-desc">原位写入 .ktx/.png/.wav</text>
      <text x="10" y="50" class="card-desc">杜绝软链接重定向提权</text>
      <text x="10" y="68" class="tag" fill="#059669">fstat 检查 + 原子落盘</text>
    </g>
  </g>

  <!-- Sequential Connectors (Strictly fill="none") -->
  <!-- 1. Node 1-1 -> Node 2-1 (Downwards) -->
  <path class="flow-line" d="M 255 146 L 255 186" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#pipe-arrow-blue)" />
  <rect x="210" y="156" width="90" height="18" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="255" y="169" class="arrow-text" fill="#0284c7" text-anchor="middle">① 握手请求</text>

  <!-- 2. Node 2-1 -> Node 2-2 (Rightwards) -->
  <path class="flow-line" d="M 332 218 L 350 218" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#pipe-arrow-purple)" />

  <!-- 3. Node 2-2 -> Node 3-1 (Downwards) -->
  <path class="flow-line" d="M 432 248 L 432 288" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#pipe-arrow-amber)" />
  <rect x="382" y="258" width="100" height="18" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="432" y="271" class="arrow-text" fill="#d97706" text-anchor="middle">② 日志流挂钩</text>

  <!-- 4. Node 3-1 -> Node 3-2 (Rightwards) -->
  <path class="flow-line" d="M 512 320 L 530 320" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#pipe-arrow-amber)" />

  <!-- 5. Node 3-2 -> Node 4-1 (Downwards) -->
  <path class="flow-line" d="M 607 350 L 607 390" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#pipe-arrow-green)" />
  <rect x="562" y="360" width="90" height="18" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="607" y="373" class="arrow-text" fill="#059669" text-anchor="middle">③ 锁定路径</text>

  <!-- 6. Node 4-1 -> Node 4-2 (Rightwards) -->
  <path class="flow-line" d="M 682 433 L 700 433" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#pipe-arrow-green)" />

  <!-- 7. Node 4-2 -> Node 1-2 (Upwards Return Channel) -->
  <path class="flow-line" d="M 787 392 L 787 148" stroke="#15803d" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#pipe-arrow-darkgreen)" />
  <rect x="732" y="257" width="110" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="787" y="271" class="arrow-text" fill="#15803d" text-anchor="middle">④ 归档就绪通知</text>
</svg>
