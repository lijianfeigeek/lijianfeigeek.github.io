<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghidra-machine-code-to-pcode-expansion-title ghidra-machine-code-to-pcode-expansion-desc">
  <title id="ghidra-machine-code-to-pcode-expansion-title">复杂机器汇编到原子 P-Code 微指令展开流程</title>
  <desc id="ghidra-machine-code-to-pcode-expansion-desc">展示单条 x86-64 复合内存加法指令展开为 5 条原子 P-Code 微码的语义拆解过程</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="280" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Raw Assembly Instruction -->
  <g transform="translate(24, 30)">
    <rect width="260" height="220" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="28" class="label-title">原始复杂汇编指令 (x86-64)</text>
    <line x1="14" y1="42" x2="246" y2="42" stroke="#f3f4f6" stroke-width="1"/>

    <g transform="translate(14, 56)">
      <rect width="232" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="22" class="text-code" font-weight="600" fill="#111827">add dword ptr [rbx+0x18], eax</text>
      <text x="10" y="40" class="text-code" fill="#6b7280">(内存间接寻址 + 寄存器累加)</text>
    </g>

    <text x="14" y="132" class="text-body">指令特征：</text>
    <text x="14" y="152" class="text-code">• 隐式基址偏移计算</text>
    <text x="14" y="170" class="text-code">• 内存读取与写回</text>
    <text x="14" y="188" class="text-code">• 状态寄存器标志位副作用更新</text>
    <text x="14" y="206" class="text-code">• 机器架构高度特化</text>
  </g>

  <!-- Transform Arrow -->
  <g transform="translate(294, 110)">
    <rect width="70" height="40" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="35" y="18" text-anchor="middle" class="tag-coral">SLEIGH</text>
    <text x="35" y="32" text-anchor="middle" class="text-code" fill="#9a3412">展开映射</text>
    <path d="M 70 20 L 96 20" fill="none" stroke="#bf4520" stroke-width="1.5"/>
    <polygon points="96,17 102,20 96,23" fill="#bf4520"/>
  </g>

  <!-- Right: P-Code Expansion Micro-Ops -->
  <g transform="translate(406, 30)">
    <rect width="530" height="220" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="8" fill="#fff7ed"/>
    <path d="M0 24 h530 v8 h-530 z" fill="#fff7ed"/>
    <text x="16" y="21" class="label-title" fill="#9a3412">P-Code 原子微指令分解序列 (Varnode 寄存器传输语言)</text>

    <!-- 5 Micro Ops -->
    <g transform="translate(14, 42)">
      <rect width="502" height="30" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="text-code">1. (unique, 0x10, 8) = INT_ADD (register, rbx, 8), (const, 0x18, 8)</text>
    </g>

    <g transform="translate(14, 76)">
      <rect width="502" height="30" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="text-code">2. (unique, 0x18, 4) = LOAD (const, ram, 4), (unique, 0x10, 8)</text>
    </g>

    <g transform="translate(14, 110)">
      <rect width="502" height="30" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="text-code">3. (unique, 0x20, 4) = INT_ADD (unique, 0x18, 4), (register, eax, 4)</text>
    </g>

    <g transform="translate(14, 144)">
      <rect width="502" height="30" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="text-code">4. STORE (const, ram, 4), (unique, 0x10, 8), (unique, 0x20, 4)</text>
    </g>

    <g transform="translate(14, 178)">
      <rect width="502" height="30" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="10" y="20" class="text-code" fill="#b91c1c">5. (register, rflags, 8) = ... 更新状态标志位 (后续 SSA 活跃分析自动剪枝消除)</text>
    </g>
  </g>
</svg>