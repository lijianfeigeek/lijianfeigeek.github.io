<svg width="960" height="410" viewBox="0 0 960 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reverse-skill-full-audit-lifecycle-sequence-title reverse-skill-full-audit-lifecycle-sequence-desc">
  <title id="reverse-skill-full-audit-lifecycle-sequence-title">Android 应用逆向与审计实战全生命周期交互时序</title>
  <desc id="reverse-skill-full-audit-lifecycle-sequence-desc">从接收 APK、路由分诊、作战空间初始化、静态反编译、动态插桩到严谨性复核的完整闭环时序</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
    </style>
  </defs>

  <rect width="960" height="410" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 4 Actor Columns: X = 120, 360, 600, 840 -->
  <line x1="120" y1="56" x2="120" y2="390" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="360" y1="56" x2="360" y2="390" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="600" y1="56" x2="600" y2="390" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="840" y1="56" x2="840" y2="390" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Actor Badges -->
  <g transform="translate(45, 16)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor">安全研究员 (Dev)</text>
  </g>

  <g transform="translate(285, 16)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor">AI Coding Agent</text>
  </g>

  <g transform="translate(525, 16)">
    <rect width="150" height="40" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor" fill="#9a3412">reverse-skill 底座</text>
  </g>

  <g transform="translate(765, 16)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="24" text-anchor="middle" class="seq-actor">宿主系统 / 终端环境</text>
  </g>

  <!-- Phase 1: Routing (X=120 -> 360 -> 600) -->
  <g transform="translate(100, 68)">
    <rect width="760" height="52" rx="4" fill="#eff6ff" opacity="0.7"/>
    <path d="M 20 18 L 260 18" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="254,15 260,18 254,21" fill="#2563eb"/>
    <text x="140" y="14" text-anchor="middle" class="text-code" fill="#1e40af">1. "分析 app-release.apk 签名算法并验证重放漏洞"</text>

    <path d="M 260 38 L 500 38" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="494,35 500,38 494,41" fill="#2563eb"/>
    <text x="380" y="34" text-anchor="middle" class="text-code" fill="#1e40af">2. master-route.sh --hint "APK 签名与重放" -> 命中 R1 (apk-reverse)</text>
  </g>

  <!-- Phase 2: Case Init &amp; Scope (Y=128) -->
  <g transform="translate(100, 128)">
    <rect width="760" height="52" rx="4" fill="#fff7ed" opacity="0.7"/>
    <path d="M 260 20 L 500 20" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    <polygon points="494,17 500,20 494,23" fill="#c2410c"/>
    <text x="380" y="14" text-anchor="middle" class="text-code" fill="#9a3412">3. case-init.sh --case-name "sec-case-01" --sample app-release.apk</text>

    <path d="M 500 40 L 260 40" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="266,37 260,40 266,43" fill="#c2410c"/>
    <text x="380" y="34" text-anchor="middle" class="text-code" fill="#9a3412">4. 初始化完成！生成 work/sec-case-01/scope.md (auth=granted, offline)</text>
  </g>

  <!-- Phase 3: Static Decompile (Y=188) -->
  <g transform="translate(100, 188)">
    <rect width="760" height="52" rx="4" fill="#f0fdf4" opacity="0.7"/>
    <path d="M 260 20 L 740 20" fill="none" stroke="#059669" stroke-width="1.5"/>
    <polygon points="734,17 740,20 734,23" fill="#059669"/>
    <text x="500" y="14" text-anchor="middle" class="text-code" fill="#047857">5. 调用 tool-index 中的 jadx: 反编译定位到 SignUtil native signRequest()</text>

    <path d="M 260 40 L 500 40" fill="none" stroke="#059669" stroke-width="1.5"/>
    <polygon points="494,37 500,40 494,43" fill="#059669"/>
    <text x="380" y="34" text-anchor="middle" class="text-code" fill="#047857">6. 录入 E-001 (Smali 与 Java 源码切片，现场计算 SHA-256 固化)</text>
  </g>

  <!-- Phase 4: Dynamic Instrumentation (Y=248) -->
  <g transform="translate(100, 248)">
    <rect width="760" height="52" rx="4" fill="#fdf4ff" opacity="0.7"/>
    <path d="M 260 20 L 740 20" fill="none" stroke="#7e22ce" stroke-width="1.5"/>
    <polygon points="734,17 740,20 734,23" fill="#7e22ce"/>
    <text x="500" y="14" text-anchor="middle" class="text-code" fill="#6b21a8">7. 运行 Frida 脚本 hook native 密钥拓展函数，内存抓取 HMAC 盐值</text>

    <path d="M 260 40 L 500 40" fill="none" stroke="#7e22ce" stroke-width="1.5"/>
    <polygon points="494,37 500,40 494,43" fill="#7e22ce"/>
    <text x="380" y="34" text-anchor="middle" class="text-code" fill="#6b21a8">8. 录入 E-002 (Frida 复现命令与 Hex Dump 内存快照，生成 F-001)</text>
  </g>

  <!-- Phase 5: Strict Review &amp; Output (Y=308) -->
  <g transform="translate(100, 308)">
    <rect width="760" height="70" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <path d="M 260 20 L 500 20" fill="none" stroke="#065f46" stroke-width="1.5"/>
    <polygon points="494,17 500,20 494,23" fill="#065f46"/>
    <text x="380" y="14" text-anchor="middle" class="text-code" fill="#047857">9. review_case.py --verify-hashes --strict (逻辑审计与哈希抗篡改)</text>

    <path d="M 500 40 L 260 40" fill="none" stroke="#065f46" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="266,37 260,40 266,43" fill="#065f46"/>
    <text x="380" y="34" text-anchor="middle" class="text-code" font-weight="600" fill="#065f46">10. 审查通过！0 Errors, 0 Warnings, 2 Evidence verified</text>

    <path d="M 260 58 L 20 58" fill="none" stroke="#065f46" stroke-width="1.5"/>
    <polygon points="26,55 20,58 26,61" fill="#065f46"/>
    <text x="140" y="52" text-anchor="middle" class="text-code" font-weight="600" fill="#065f46">11. 交付结构化安全审计报告 + field-journal 避坑心得</text>
  </g>
</svg>