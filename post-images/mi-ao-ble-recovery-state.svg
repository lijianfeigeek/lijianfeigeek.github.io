<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="miao-state-title miao-state-desc" id="miao-state-root" data-diagram="state-machine">
  <title id="miao-state-title">米遥 MI-AO BLE 能力协商看门狗与双策略断连自愈状态机</title>
  <desc id="miao-state-desc">展示 BLEVoiceBridge 从快速路径重连、0.8 秒多设备确定性仲裁、1.5 秒乘 3 次 GET_CAPS 看门狗、零空闲轮询 Ready 态，到随时就绪指数退避与智能休眠瞬时唤醒的完整状态转换逻辑。</desc>
  <defs>
    <pattern id="mst-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="mst-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="mst-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="mst-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="mst-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="580" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="580" fill="url(#mst-dots)"/>
  <rect x="16" y="16" width="968" height="548" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">BLE SESSION LIFECYCLE · CAPABILITY WATCHDOG &amp; DUAL RECONNECT POLICY</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">拒绝死等连接与高频空耗：GET_CAPS 三次看门狗与“随时就绪 / 智能休眠”双轨恢复</text>
  </g>

  <!-- Recovery Zone Container -->
  <rect x="200" y="368" width="664" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="216" y="388" fill="#64748b" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">DISCONNECT &amp; TIMEOUT RECOVERY BAND (PREFERENCES V3 HOT-SWITCHABLE)</text>

  <!-- ==================== ORTHOGONAL TRANSITIONS (DRAWN BEFORE STATES) ==================== -->
  <!-- Start dot -> S1 -->
  <circle cx="52" cy="176" r="6" fill="#0f172a"/>
  <line x1="58" y1="176" x2="88" y2="176" stroke="#334155" stroke-width="1.2" marker-end="url(#mst-arr-muted)"/>

  <!-- Fast-path S1 top -> S3 top -->
  <path d="M 180 140 L 180 108 A 8 8 0 0 1 188 100 L 644 100 A 8 8 0 0 1 652 108 L 652 140" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#mst-arr-link)"/>
  <rect x="336" y="80" width="168" height="16" rx="2" fill="#ffffff"/>
  <text x="420" y="91" fill="#0284c7" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">KNOWN UUID / OS CONNECTED ATVV</text>

  <!-- S1 -> S2 (Broadcast Scan) -->
  <line x1="272" y1="176" x2="324" y2="176" stroke="#64748b" stroke-width="1.2" marker-end="url(#mst-arr-muted)"/>
  <rect x="280" y="154" width="36" height="14" rx="2" fill="#ffffff"/>
  <text x="298" y="164" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SCAN</text>

  <!-- S2 -> S3 (0.8s deterministic winner) -->
  <line x1="508" y1="176" x2="560" y2="176" stroke="#64748b" stroke-width="1.2" marker-end="url(#mst-arr-muted)"/>
  <rect x="512" y="154" width="44" height="14" rx="2" fill="#ffffff"/>
  <text x="534" y="164" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.8S WIN</text>

  <!-- S3 -> S4 (Capabilities accepted) -->
  <line x1="756" y1="176" x2="804" y2="176" stroke="#059669" stroke-width="1.4" marker-end="url(#mst-arr-ok)"/>
  <rect x="760" y="154" width="40" height="14" rx="2" fill="#ffffff"/>
  <text x="780" y="164" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0x0B OK</text>

  <!-- S4 <-> S5 (Voice Streaming Loop) -->
  <line x1="856" y1="212" x2="856" y2="268" stroke="#0284c7" stroke-width="1.2" marker-end="url(#mst-arr-link)"/>
  <rect x="784" y="232" width="64" height="14" rx="2" fill="#ffffff"/>
  <text x="816" y="242" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MIC_OPEN</text>

  <line x1="912" y1="268" x2="912" y2="212" stroke="#059669" stroke-width="1.2" marker-end="url(#mst-arr-ok)"/>
  <rect x="920" y="232" width="44" height="14" rx="2" fill="#ffffff"/>
  <text x="942" y="242" fill="#059669" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">STOP</text>

  <!-- S3 Watchdog / Disconnect -> S6 (Always Ready) -->
  <path d="M 636 212 L 636 324 A 8 8 0 0 1 628 332 L 368 332 A 8 8 0 0 0 360 340 L 360 404" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#mst-arr-accent)"/>
  <rect x="424" y="310" width="148" height="16" rx="2" fill="#ffffff"/>
  <text x="498" y="321" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3X TIMEOUT / ALWAYS READY</text>

  <!-- S3 Watchdog / Disconnect -> S7 (Smart Sleep) -->
  <path d="M 684 212 L 684 324 A 8 8 0 0 0 692 332 L 704 332 A 8 8 0 0 1 712 340 L 712 404" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#mst-arr-muted)"/>
  <rect x="692" y="284" width="84" height="16" rx="2" fill="#ffffff"/>
  <text x="734" y="295" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SMART SLEEP</text>

  <!-- S6 -> S1 (Backoff Timer Retry) -->
  <path d="M 220 442 L 152 442 A 8 8 0 0 1 144 434 L 144 212" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#mst-arr-muted)"/>
  <rect x="72" y="316" width="64" height="16" rx="2" fill="#ffffff"/>
  <text x="104" y="327" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">BACKOFF</text>

  <!-- S7 -> S1 (Instant Event Wakeup) -->
  <path d="M 712 480 L 712 504 A 8 8 0 0 1 704 512 L 196 512 A 8 8 0 0 1 188 504 L 188 212" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mst-arr-link)"/>
  <rect x="360" y="518" width="188" height="14" rx="2" fill="#ffffff"/>
  <text x="454" y="528" fill="#0284c7" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WAKE ON HID KEY / BLE ON / MENU</text>

  <!-- ==================== STATES (ISOLATED <g transform="translate(X, Y)">) ==================== -->
  <!-- S1: Disconnected & Retrieve -->
  <g transform="translate(88, 140)">
    <rect x="0" y="0" width="184" height="72" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">S1 · RETRIEVE</text>
    <text x="12" y="42" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">优先直连已知设备</text>
    <text x="12" y="58" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">跳过盲扫唤醒休眠遥控器</text>
  </g>

  <!-- S2: Discovering & Arbitration -->
  <g transform="translate(324, 140)">
    <rect x="0" y="0" width="184" height="72" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">S2 · DISCOVERING</text>
    <text x="12" y="42" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">确定性多设备仲裁</text>
    <text x="12" y="58" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">UUID &gt; 名称 &gt; ATVV &gt; RSSI</text>
  </g>

  <!-- S3: Negotiating Watchdog (FOCAL CORAL) -->
  <g transform="translate(560, 140)">
    <rect x="0" y="0" width="196" height="72" rx="8" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <text x="12" y="22" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">S3 · NEGOTIATING</text>
    <text x="12" y="42" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">GET_CAPS 能力看门狗</text>
    <text x="12" y="58" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">1.5s × 3 重试 · 未就绪禁开麦</text>
  </g>

  <!-- S4: Ready (Zero Idle Polling) -->
  <g transform="translate(804, 140)">
    <rect x="0" y="0" width="160" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">S4 · READY</text>
    <text x="12" y="42" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">桥接就绪（零空闲轮询）</text>
    <text x="12" y="58" fill="#047857" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ATVV v1.0 · 重置退避计数</text>
  </g>

  <!-- S5: Opening & Streaming -->
  <g transform="translate(804, 268)">
    <rect x="0" y="0" width="160" height="76" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="22" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">S5 · STREAMING</text>
    <text x="12" y="42" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">实时采音与 10s 保活</text>
    <text x="12" y="60" fill="#0369a1" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">仅录音期发 0x0E KeepAlive</text>
  </g>

  <!-- S6: Always Ready Backoff -->
  <g transform="translate(220, 404)">
    <rect x="0" y="0" width="280" height="76" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#64748b" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">S6 · ALWAYS READY (DEFAULT)</text>
    <text x="14" y="42" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">指数退避并封顶 60s 低频巡检</text>
    <text x="14" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">1 → 2 → 4 → 8 → 16 → 32 → 60s 循环</text>
  </g>

  <!-- S7: Smart Sleep -->
  <g transform="translate(568, 404)">
    <rect x="0" y="0" width="280" height="76" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">S7 · SMART SLEEP (OPTIONAL)</text>
    <text x="14" y="42" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">两次快连后暂停后台蓝牙握手</text>
    <text x="14" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">1s, 2s 失败即休眠 · 实体按键继续工作</text>
  </g>

  <!-- Legend Strip -->
  <line x1="36" y1="540" x2="964" y2="540" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(36, 548)">
    <text x="0" y="14" fill="#64748b" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LEGEND</text>
    <rect x="72" y="4" width="16" height="12" rx="2" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <text x="96" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">能力协商超时看门狗（防假连卡死）</text>
    <line x1="312" y1="10" x2="344" y2="10" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="352" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">跨通道事件瞬时唤醒路径</text>
    <rect x="516" y="4" width="16" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="540" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">零空闲轮询稳定工作态</text>
    <circle cx="700" cy="10" r="5" fill="#0f172a"/>
    <text x="712" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">蓝牙上电初始入口</text>
  </g>
</svg>
