<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Canvas Header -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="880" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="32" font-size="18" font-weight="700" fill="#0f172a">WQGuard 四层渐进式静态审计流水线与双槽 CSBlob 门禁拓扑</text>
    <text x="640" y="32" font-size="12" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">ARCHITECTURE: LAYER STACK</text>
  </g>

  <!-- Sources Layer (Top Ingress) -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="880" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.5">INGRESS · 三大无越权非侵入采集源 (ZERO-EXPLOIT COLLECTION)</text>
    
    <!-- Source Card 1 -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="265" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="16" cy="24" r="5" fill="#0284c7"/>
      <text x="30" y="20" font-size="12" font-weight="600" fill="#0f172a">引擎 1A · 本机虚拟环回直连</text>
      <text x="30" y="36" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b">TCP 62078 · LocalDevVPN + TLS</text>
    </g>

    <!-- Source Card 2 -->
    <g transform="translate(305, 36)">
      <rect x="0" y="0" width="265" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="16" cy="24" r="5" fill="#0284c7"/>
      <text x="30" y="20" font-size="12" font-weight="600" fill="#0f172a">引擎 1B · 离线注册表快照</text>
      <text x="30" y="36" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b">pymobiledevice3 / devicectl JSON</text>
    </g>

    <!-- Source Card 3 -->
    <g transform="translate(590, 36)">
      <rect x="0" y="0" width="270" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="16" cy="24" r="5" fill="#0284c7"/>
      <text x="30" y="20" font-size="12" font-weight="600" fill="#0f172a">引擎 2 · 本地 IPA 沙盒多选队列</text>
      <text x="30" y="36" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b">.ipa / .tipa 主程序 + dylib + appex</text>
    </g>
  </g>

  <!-- Flow Connector Line 1 -->
  <path d="M 480 191 L 480 215" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1: CSBlob Dual-Slot Gating -->
  <g transform="translate(40, 218)">
    <rect x="0" y="0" width="880" height="120" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#0284c7">LAYER 1 · 签名超块与双槽 CSBlob 权限门禁 (XML ∪ DER UNION GATING)</text>
    
    <!-- Left: SuperBlob Inspection -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="410" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">代码签名超级块解析 (SuperBlob Magic: 0xfade0cc0)</text>
      <text x="14" y="42" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">Slot 5 (XML 0xfade7171) ∪ Slot 7 (Apple DER 0xfade7172)</text>
      <text x="14" y="58" font-size="10" fill="#64748b">覆盖全部 ARM 切片与独立 PlugIns/*.appex 小组件，粉碎单槽伪装遮蔽</text>
    </g>

    <!-- Right: O(1) Cryptographic Fast Path -->
    <g transform="translate(450, 38)">
      <rect x="0" y="0" width="410" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#059669">密码学不可能门禁定理 (Cryptographic Impossibility Gate)</text>
      <text x="14" y="42" font-size="10" fill="#065f46">未声明 App Group 且无独立越权系统调用（fsgetpath / bad_query）</text>
      <rect x="14" y="48" width="380" height="16" rx="3" fill="#d1fae5"/>
      <text x="20" y="60" font-size="9.5" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#047857">O(1) 物理不可能突破沙盒 ➔ 常数时间直接快速放行 (SAFE)</text>
    </g>
  </g>

  <!-- Split Branch Indicator -->
  <path d="M 230 338 L 230 365" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="356" font-size="10" font-weight="600" fill="#0284c7">声明 App Groups 或未加密侧载包 ➔ 穿透深扫</text>

  <!-- Layer 2: Mach-O Deep Static Inspection -->
  <g transform="translate(40, 368)">
    <rect x="0" y="0" width="880" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#0f172a">LAYER 2 · Mach-O 多架构静态分析与抗 XOR 混淆元组引擎</text>
    
    <!-- Subblock 1 -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="265" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="11" font-weight="600" fill="#0f172a">私有 API 与符号审查</text>
      <text x="12" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#e11d48">containermanager / worse_query</text>
      <text x="12" y="48" font-size="9.5" fill="#64748b">11 项私有 API 与 XPC Mach 通道</text>
    </g>

    <!-- Subblock 2 -->
    <g transform="translate(305, 36)">
      <rect x="0" y="0" width="265" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="11" font-weight="600" fill="#0f172a">抗 Strip / XOR 行为元组</text>
      <text x="12" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#0f172a">cryptid==0 ∧ dlopen ∧ symlink</text>
      <text x="12" y="48" font-size="9.5" fill="#64748b">扫描 __objc_methname，对抗无符号混淆</text>
    </g>

    <!-- Subblock 3 -->
    <g transform="translate(590, 36)">
      <rect x="0" y="0" width="270" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="11" font-weight="600" fill="#0f172a">仿冒钱包与静默窃密审查</text>
      <text x="12" y="34" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="#e11d48">MetaMask / OKX / Telegram</text>
      <text x="12" y="48" font-size="9.5" fill="#64748b">词边界分词匹配 + 后台剪贴板监听侦测</text>
    </g>
  </g>

  <!-- Flow Connector Line 2 -->
  <path d="M 480 478 L 480 500" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Container Forensics -->
  <g transform="translate(40, 503)">
    <rect x="0" y="0" width="880" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#0f172a">LAYER 3 · 容器元数据与非递归软链原位取证 (O_RDONLY | O_NOFOLLOW)</text>
    
    <g transform="translate(20, 34)">
      <rect x="0" y="0" width="410" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="18" font-size="11" font-weight="600" fill="#0f172a">lstat + readlink 原位取证</text>
      <text x="14" y="32" font-size="9.5" fill="#64748b">识别 Library/Caches 跨沙盒越界软链，严禁递归进入，彻底杜绝 ELOOP 循环</text>
    </g>

    <g transform="translate(450, 34)">
      <rect x="0" y="0" width="410" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="18" font-size="11" font-weight="600" fill="#0f172a">MCM 元数据与伪造监管检测</text>
      <text x="14" y="32" font-size="9.5" fill="#64748b">读取 .metadata.plist 校验容器归属，排查非法 CloudConfiguration 伪造监管</text>
    </g>
  </g>

  <!-- Flow Connector Line 3 -->
  <path d="M 480 593 L 480 615" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Adjudication & Outputs -->
  <g transform="translate(40, 618)">
    <rect x="0" y="0" width="880" height="116" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#0f172a">LAYER 4 · 四级风险裁决与严格零信任白名单准则</text>
    
    <!-- Risk Tiers Grid -->
    <g transform="translate(20, 36)">
      <!-- Tier 1: High Risk -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="66" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#e11d48">🔴 高危告警 (High Risk)</text>
        <text x="10" y="34" font-size="9" fill="#9f1239">逃逸私有API / 仿冒钱包</text>
        <text x="10" y="48" font-size="9" fill="#9f1239">相册越权 / 越界软链 / 监听</text>
        <text x="10" y="60" font-size="8.5" font-weight="700" fill="#e11d48">➔ 严禁启动，立即卸载重启</text>
      </g>

      <!-- Tier 2: Caution -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="195" height="66" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#d97706">🟠 前置留意 (Caution)</text>
        <text x="10" y="34" font-size="9" fill="#92400e">侧载第三方签名器 (Feather等)</text>
        <text x="10" y="48" font-size="9" fill="#92400e">注入 dylib / 跨组 AppGroup</text>
        <text x="10" y="60" font-size="8.5" font-weight="700" fill="#d97706">➔ 严格零信任，手动核验权限</text>
      </g>

      <!-- Tier 3: Known Tool -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="195" height="66" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#0d9488">🟡 已知工具 (Known Tool)</text>
        <text x="10" y="34" font-size="9" fill="#115e59">默认仅放行 WQGuard 自身</text>
        <text x="10" y="48" font-size="9" fill="#115e59">精确 TeamID + 归属 AppGroup</text>
        <text x="10" y="60" font-size="8.5" font-weight="700" fill="#0d9488">➔ 杜绝寄生与同名伪装冒用</text>
      </g>

      <!-- Tier 4: Safe -->
      <g transform="translate(645, 0)">
        <rect x="0" y="0" width="195" height="66" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#059669">🟢 安全合规 (Safe)</text>
        <text x="10" y="34" font-size="9" fill="#065f46">App Store / TestFlight 正版</text>
        <text x="10" y="48" font-size="9" fill="#065f46">或无越权无注入纯净侧载包</text>
        <text x="10" y="60" font-size="8.5" font-weight="700" fill="#059669">➔ 四层全通，放行使用</text>
      </g>
    </g>
  </g>
</svg>