<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="nvda-mark-stevens-post-sale-portfolio-pie-title nvda-mark-stevens-post-sale-portfolio-pie-desc">
  <title id="nvda-mark-stevens-post-sale-portfolio-pie-title">Mark Stevens 减持后英伟达持仓结构对比模型</title>
  <desc id="nvda-mark-stevens-post-sale-portfolio-pie-desc">展示 Mark Stevens 减持 287 万股后仍持有 90.96% 巨额底仓与落袋套现 9.04% 的仓位对比</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">SEC FORM 4 穿透审计：MARK STEVENS 减持后英伟达持仓分布与资金流结构</text>
    <text x="896" y="16" text-anchor="end" class="tag">PORTFOLIO REBALANCING VS EXIT</text>
  </g>

  <!-- Left: Visual Bar / Ratio Comparison Container -->
  <g transform="translate(32, 60)">
    <rect width="430" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="430" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="430" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="430" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="23" class="title">相对持仓分布比例（Relative Stake Ratio）</text>

    <!-- Visual Stacked Bar -->
    <g transform="translate(20, 60)">
      <rect width="390" height="48" rx="6" fill="#0f172a" />
      <!-- Sold Slice (9.04%) width = 390 * 0.0904 = 35.25 -> 36px -->
      <rect x="354" y="0" width="36" height="48" rx="6" fill="#bf4520" />
      <rect x="354" y="0" width="6" height="48" fill="#bf4520" />
      <text x="160" y="29" fill="#ffffff" style="font-family:sans-serif; font-size:13px; font-weight:700;">仍持有筹码 90.96%</text>
      <text x="356" y="70" class="coral-tag" text-anchor="middle">卖出 9.04%</text>
      <line x1="372" y1="52" x2="372" y2="60" stroke="#bf4520" stroke-width="1.5" />
    </g>

    <!-- Stat Card 1: 仍持有底仓 -->
    <g transform="translate(20, 140)">
      <rect width="390" height="74" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(14, 16)">
        <text class="title" style="font-size:13px;" x="0" y="0">仍旧死死攥在手中的筹码：90.96%</text>
        <text class="desc" x="0" y="20">• 剩余股数：28,898,893 股（近 2890 万股）</text>
        <text class="tag" style="font-weight:700;" x="0" y="40">持股市值：约 64.6 亿美元（全市场最大个人股东之一）</text>
      </g>
    </g>

    <!-- Stat Card 2: 本次套现落袋 (Core Accent) -->
    <g transform="translate(20, 226)">
      <rect width="390" height="74" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
      <g transform="translate(14, 16)">
        <text class="coral-title" style="font-size:13px;" x="0" y="0">本次交易套现落袋：9.04%</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="20">• 减持股数：2,870,740 股（加权均价 222 ~ 231 美元）</text>
        <text class="coral-tag" x="0" y="40">变现总额：646,480,403 美元（约 6.46 亿美元）</text>
      </g>
    </g>
  </g>

  <!-- Right: Institutional Insight &amp; Rebalancing Mechanics -->
  <g transform="translate(482, 60)">
    <rect width="446" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="446" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="446" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="446" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="23" class="title">机构交易员认知 vs 散户恐慌误区</text>

    <!-- Retail Fallacy -->
    <g transform="translate(16, 52)">
      <rect width="414" height="74" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(14, 16)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">散户视角误区：绝对数值恐慌</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="20">• 只盯住“6.46 亿美元”这个庞大绝对数字，惊呼高管逃顶</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="38">• 误将理性的局部止盈等同于“清仓跑路”与“看衰未来”</text>
      </g>
    </g>

    <!-- Institutional Truth -->
    <g transform="translate(16, 136)">
      <rect width="414" height="82" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(14, 16)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">机构视角公理：相对比例与投资组合约束</text>
        <text class="desc" x="0" y="20">• 卖出 9%、留存 91%，是教科书级别的利润收割（Profit Taking）</text>
        <text class="desc" x="0" y="38">• 单一资产占个人财富超 95%，违反现代投资组合（MPT）审慎原则</text>
        <text class="tag" x="0" y="56">结论: 64 亿美元底仓证明其与英伟达长期深度捆绑未动摇</text>
      </g>
    </g>

    <!-- Trust Structure -->
    <g transform="translate(16, 228)">
      <rect width="414" height="74" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(14, 16)">
        <text class="title" style="font-size:12px;" x="0" y="0">家族信托与税收规划驱动</text>
        <text class="desc" x="0" y="20">• 绝大部分由 The 3rd Millennium Trust 与 Family Trust 持有</text>
        <text class="desc" x="0" y="38">• 核心功能为代际传承、慈善捐赠与周期性流动性释放</text>
      </g>
    </g>
  </g>
</svg>