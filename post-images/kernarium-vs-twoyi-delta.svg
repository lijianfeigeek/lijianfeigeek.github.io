<svg xmlns="http://www.w3.org/2000/svg" data-diagram="architecture-delta" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="kernarium-delta-title kernarium-delta-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="kernarium-delta-title">iOS 安卓与 Linux 虚拟化双路线架构对比</title>
  <desc id="kernarium-delta-desc">对比用户态 Darwin 系统调用模拟内核（如 Twoyi Neo）与基于原生 User-Mode Linux 6.18 的 Kernarium 架构在内核边界、CPU 执行、图形渲染栈及工作负载上限上的拓扑差异。</desc>
  <defs>
    <marker id="kd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#64748b"/>
    </marker>
    <marker id="kd-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#e11d48"/>
    </marker>
    <marker id="kd-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="912" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">双路线拓扑对比：用户态模拟内核 (Twoyi Neo) vs 原生 UML 内核 (Kernarium)</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">BEFORE: DARWIN USERLAND SHIM · CHANGES LEDGER · AFTER: NATIVE LINUX 6.18 USER-MODE KERNEL</text>
    <text x="892" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: ARCHITECTURE DELTA</text>
  </g>

  <!-- Left Panel: Before (Userland Shim) -->
  <g data-snapshot="before" data-grid="288 408 4" transform="translate(24, 92)">
    <rect x="0" y="0" width="288" height="408" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" font-size="12" font-weight="700" fill="#475569">路线 A · 用户态模拟内核 (如 Twoyi)</text>
    <text x="16" y="44" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">USERLAND SYSCALL &amp; BINDER SHIM</text>

    <!-- Connectors drawn before nodes -->
    <path data-kind="relationship" data-object-id="edge-guest-kernel" data-status="changed" data-signature="userland-trap-to-shim" data-from="guest" data-to="kernel" d="M 144 136 L 144 176" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#kd-arrow)"/>
    <path data-kind="relationship" data-object-id="edge-kernel-gpu" data-status="changed" data-signature="gfxstream-moltenvk" data-from="kernel" data-to="gpu" d="M 144 260 L 144 300" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#kd-arrow)"/>

    <!-- Edge labels with masks -->
    <rect x="92" y="148" width="104" height="16" rx="3" fill="#f8fafc"/>
    <text x="144" y="160" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">SYSCALL SHIM</text>
    <rect x="96" y="272" width="96" height="16" rx="3" fill="#f8fafc"/>
    <text x="144" y="284" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">PIPE / SHMEM</text>

    <!-- Node 1: Guest -->
    <g data-kind="component" data-object-id="guest" data-status="changed" data-signature="android13-static-aot" transform="translate(16, 60)">
      <rect data-role="bounds" x="0" y="0" width="256" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#0f172a">Android 13 Guest + 静态 AOT</text>
      <text x="14" y="44" font-size="11" fill="#475569">2,852 单元编译入主程序 __TEXT</text>
      <text x="14" y="62" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">无通用 Linux 发行版 · 限 Android 生态</text>
    </g>

    <!-- Node 2: Kernel Shim -->
    <g data-kind="component" data-object-id="kernel" data-status="changed" data-signature="darwin-userspace-emu-kernel" transform="translate(16, 180)">
      <rect data-role="bounds" x="0" y="0" width="256" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#0f172a">用户态模拟 Linux 内核层</text>
      <text x="14" y="44" font-size="11" fill="#475569">手工翻译 Syscall 与 vbinder IPC</text>
      <text x="14" y="62" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">缺少 Namespaces / Loop / FUSE</text>
    </g>

    <!-- Node 3: GPU -->
    <g data-kind="component" data-object-id="gpu" data-status="changed" data-signature="gfxstream-moltenvk-metal" transform="translate(16, 304)">
      <rect data-role="bounds" x="0" y="0" width="256" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#0f172a">gfxstream + MoltenVK 管线</text>
      <text x="14" y="44" font-size="11" fill="#475569">OpenGL ES → Vulkan → Metal</text>
      <text x="14" y="62" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">依赖 MoltenVK 转换层</text>
    </g>
  </g>

  <!-- Center Panel: Changes Ledger -->
  <g transform="translate(328, 92)">
    <rect x="0" y="0" width="304" height="408" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="28" font-size="12" font-weight="700" fill="#0f172a">架构演进变更清册 (CHANGES LEDGER)</text>
    <line x1="16" y1="40" x2="288" y2="40" stroke="#e2e8f0" stroke-width="1"/>

    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="272" height="64" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
      <text data-change="CHANGED" data-target="kernel" x="12" y="20" font-size="11" font-weight="700" fill="#be123c">CHANGED kernel · 真实 6.18 内核</text>
      <text x="12" y="38" font-size="10" fill="#334155">用户态模拟 → 主线 Linux 6.18 UML</text>
      <text x="12" y="54" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">完整 Namespaces / SELinux / UBD / FUSE</text>
    </g>

    <g transform="translate(16, 132)">
      <rect x="0" y="0" width="272" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text data-change="CHANGED" data-target="guest" x="12" y="20" font-size="11" font-weight="700" fill="#0284c7">CHANGED guest · 全能负载上限</text>
      <text x="12" y="38" font-size="10" fill="#334155">Android 17 + KDE + Docker + Winlator</text>
      <text x="12" y="54" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">Gadget + AOT + StikDebug JIT 三位一体</text>
    </g>

    <g transform="translate(16, 208)">
      <rect x="0" y="0" width="272" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text data-change="CHANGED" data-target="gpu" x="12" y="20" font-size="11" font-weight="700" fill="#0284c7">CHANGED gpu · 抛弃 MoltenVK</text>
      <text x="12" y="38" font-size="10" fill="#334155">Virtio-GPU + Zink/Venus → KosmicKrisp</text>
      <text x="12" y="54" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">直连 Metal 4 · 支持 Vulkan 1.4 / GL 4.6</text>
    </g>

    <g transform="translate(16, 284)">
      <rect x="0" y="0" width="272" height="64" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text data-change="ADDED" data-target="lifecycle" x="12" y="20" font-size="11" font-weight="700" fill="#047857">ADDED lifecycle · iOS 抗杀护盾</text>
      <text x="12" y="38" font-size="10" fill="#334155">新增 Jetsam 预算模型与分片内存休眠</text>
      <text x="12" y="54" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">GPU 门控防设备失联 · 锁剥离防挂起强杀</text>
    </g>

    <text x="152" y="384" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">14,512 LINES ASM GADGETS · ZERO MOLTENVK</text>
  </g>

  <!-- Right Panel: After (Native UML Kernel) -->
  <g data-snapshot="after" data-grid="288 408 4" transform="translate(648, 92)">
    <rect x="0" y="0" width="288" height="408" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <text x="16" y="28" font-size="12" font-weight="700" fill="#0369a1">路线 B · 原生 UML 内核 (Kernarium)</text>
    <text x="16" y="44" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7">NATIVE LINUX 6.18 + VHOST-USER + METAL 4</text>

    <!-- Connectors drawn before nodes -->
    <path data-kind="relationship" data-object-id="edge-guest-kernel" data-status="changed" data-signature="software-mmu-128tib" data-from="guest" data-to="kernel" d="M 144 136 L 144 176" stroke="#e11d48" stroke-width="1.6" fill="none" marker-end="url(#kd-arrow-accent)"/>
    <path data-kind="relationship" data-object-id="edge-kernel-gpu" data-status="changed" data-signature="vhost-user-shmem-aperture" data-from="kernel" data-to="gpu" d="M 144 260 L 144 300" stroke="#0284c7" stroke-width="1.6" fill="none" marker-end="url(#kd-arrow-link)"/>

    <!-- Edge labels with masks -->
    <rect x="86" y="148" width="116" height="16" rx="3" fill="#f8fafc"/>
    <text x="144" y="160" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" font-weight="700" text-anchor="middle">128 TiB SW-MMU</text>
    <rect x="88" y="272" width="112" height="16" rx="3" fill="#f8fafc"/>
    <text x="144" y="284" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" font-weight="700" text-anchor="middle">VHOST-USER 1GiB</text>

    <!-- Node 1: Guest -->
    <g data-kind="component" data-object-id="guest" data-status="changed" data-signature="android17-linux-docker-winlator" transform="translate(16, 60)">
      <rect data-role="bounds" x="0" y="0" width="256" height="76" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#0f172a">Android 17 + Linux / Docker</text>
      <text x="14" y="44" font-size="11" fill="#334155">Gadget + 静态 AOT + 可选 StikDebug JIT</text>
      <text x="14" y="62" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669">支持 Termux / Winlator / KDE 桌面</text>
    </g>

    <!-- Node 2: Native UML Kernel (FOCAL CORAL) -->
    <g data-kind="component" data-object-id="kernel" data-status="changed" data-signature="native-uml-6.18-macho" transform="translate(16, 180)">
      <rect data-role="bounds" x="0" y="0" width="256" height="80" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#be123c">原生 Linux 6.18 LTS (__uml_elf)</text>
      <text x="14" y="44" font-size="11" fill="#334155">真内核 arm64 原生直跑 · 免指令翻译</text>
      <text x="14" y="62" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c">4KB Guest ↔ 16KB Host · 多核 SMP</text>
    </g>

    <!-- Node 3: GPU & Lifecycle -->
    <g data-kind="component" data-object-id="gpu" data-status="changed" data-signature="zink-venus-kosmickrisp-metal4" transform="translate(16, 304)">
      <rect data-role="bounds" x="0" y="0" width="256" height="80" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#0f172a">Zink + Venus + KosmicKrisp</text>
      <text x="14" y="44" font-size="11" fill="#334155">Vulkan 1.4 / GL 4.6 直驱 Metal 4</text>
      <text x="14" y="62" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1">VideoToolbox 硬解 · 内存休眠 + GPU 门控</text>
    </g>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(24, 524)">
    <line x1="0" y1="0" x2="912" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" font-weight="700">LEGEND</text>
    <rect x="72" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="94" y="24" font-size="11" fill="#334155">核心范式颠覆（原生 UML 6.18 内核）</text>
    <rect x="348" y="13" width="14" height="14" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="370" y="24" font-size="11" fill="#334155">Kernarium 升级节点</text>
    <rect x="524" y="13" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="546" y="24" font-size="11" fill="#334155">新增 iOS 抗杀护盾机制</text>
    <text x="912" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">COMPARISON: KERNARIUM VS TWOYI NEO</text>
  </g>
</svg>
