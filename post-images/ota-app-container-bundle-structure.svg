<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-app-container-bundle-structure-title ota-app-container-bundle-structure-desc">
  <title id="ota-app-container-bundle-structure-title">iOS 沙盒目录结构与原生 Bundle 优雅降维机制</title>
  <desc id="ota-app-container-bundle-structure-desc">展示磁盘沙盒中组装与 Apple 原生资源包一致的物理目录，并直接交付给 NSLocalizedString 使用的架构</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="300" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: App Sandbox Physical Bundle -->
  <g transform="translate(24, 20)">
    <rect width="520" height="260" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="32" rx="8" fill="#fff7ed"/>
    <path d="M0 24 h520 v8 h-520 z" fill="#fff7ed"/>
    <text x="16" y="21" class="label-title" fill="#9a3412">App 沙盒物理目录 (Library/Application Support/OTALocalizations/v1/)</text>

    <!-- Sub Module Bundle Folder -->
    <g transform="translate(16, 44)">
      <rect width="488" height="196" rx="6" fill="#f9fafb" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="label-title" font-size="12" fill="#7c2d12">📁 Checkout.bundle (完全吻合 Apple 标准资源包规范)</text>

      <g transform="translate(12, 36)">
        <rect width="464" height="30" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <text x="10" y="20" class="text-code">📄 Info.plist (声明 CFBundleDevelopmentRegion: en, 基础元数据)</text>
      </g>

      <g transform="translate(12, 74)">
        <rect width="464" height="30" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <text x="10" y="20" class="text-code">📁 en-GB.lproj / Localizable.strings &amp; Localizable.stringsdict</text>
      </g>

      <g transform="translate(12, 112)">
        <rect width="464" height="30" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <text x="10" y="20" class="text-code">📁 fr-FR.lproj / Localizable.strings (含繁复复数规则)</text>
      </g>

      <g transform="translate(12, 150)">
        <rect width="464" height="30" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <text x="10" y="20" class="text-code">📁 de-DE.lproj / Localizable.strings (德语等本土化文案)</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <g transform="translate(544, 130)">
    <path d="M 0 20 L 40 20" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="40,16 48,20 40,24" fill="#10b981"/>
    <rect x="-10" y="-12" width="60" height="20" rx="3" fill="#ecfdf5"/>
    <text x="20" y="2" text-anchor="middle" class="text-code" font-size="10" fill="#047857">Bundle(url:)</text>
  </g>

  <!-- Right: Native Swift Code Call (Zero Friction) -->
  <g transform="translate(592, 20)">
    <rect width="344" height="260" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="344" height="32" rx="8" fill="#ecfdf5"/>
    <path d="M0 24 h344 v8 h-344 z" fill="#ecfdf5"/>
    <text x="14" y="21" class="label-title" fill="#065f46">业务模块单行无感接入 (Swift)</text>

    <g transform="translate(14, 46)">
      <rect width="316" height="74" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="20" class="text-code" font-weight="600" fill="#065f46">extension Bundle {</text>
      <text x="10" y="38" class="text-code" fill="#047857">  static var localizationBundle: Bundle {</text>
      <text x="10" y="56" class="text-code" font-weight="600" fill="#bf4520">    OTALocalizedString.bundle(for: "...") ?? .module</text>
      <text x="10" y="68" class="text-code" fill="#047857">  }</text>
    </g>

    <g transform="translate(14, 130)">
      <rect width="316" height="110" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="22" class="label-title" font-size="12">继承 Apple 底层全部红利：</text>
      <text x="10" y="44" class="text-code">✓ 语言回退链 (Locale Fallback)</text>
      <text x="10" y="64" class="text-code">✓ .stringsdict 变态复数语法</text>
      <text x="10" y="84" class="text-code">✓ 原生 NSLocalizedString 零缝隙解析</text>
      <text x="10" y="100" class="text-code">✓ 异常自动 fallback 本地静态 Bundle</text>
    </g>
  </g>
</svg>