<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="mesh-avatar-tracking-obs-title mesh-avatar-tracking-obs-desc">
  <title id="mesh-avatar-tracking-obs-title">实时面捕追踪与零延迟推流管线架构</title>
  <desc id="mesh-avatar-tracking-obs-desc">Web Worker 隔离面捕、指数阻尼平滑滤波、极速 WebSocket 广播与 OBS 纯 WebGL2 原生透明推流管线</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 6; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow5-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" />

  <!-- Panel 1: Browser Live Collector (x=40, y=40, w=360, h=360) -->
  <g transform="translate(40, 40)">
    <rect width="360" height="360" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 44 L 0 44 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">浏览器采集端 (Live 页面)</text>
    <text x="260" y="28" class="text-muted">Web Worker 隔离</text>

    <!-- Sub components -->
    <g transform="translate(16, 56)">
      <rect width="328" height="54" class="pill" />
      <text x="12" y="22" class="text-subtitle">1. 摄像头 60FPS 视频帧采集</text>
      <text x="12" y="40" class="text-body">视频流转送独立 Web Worker，彻底消除主线程阻塞</text>
    </g>

    <g transform="translate(16, 120)">
      <rect width="328" height="66" class="pill" />
      <text x="12" y="22" class="text-subtitle">2. MediaPipe Face Landmarker</text>
      <text x="12" y="40" class="text-body">• 16元素仿射矩阵 Gram-Schmidt 正交化归一</text>
      <text x="12" y="56" class="text-body">• 严格解算欧拉角 (Yaw / Pitch / Roll) 与 Blendshapes</text>
    </g>

    <g transform="translate(16, 196)">
      <rect width="328" height="66" class="pill" />
      <text x="12" y="22" class="text-subtitle">3. 连续时间指数阻尼平滑滤波</text>
      <text x="12" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#bf4520">alpha = 1 - exp(-dt / tau)</text>
      <text x="12" y="56" class="text-body">消灭静止高频微颤，保持眨眼跟手响应</text>
    </g>

    <g transform="translate(16, 272)">
      <rect width="328" height="54" class="pill" />
      <text x="12" y="22" class="text-subtitle">4. WebSocket 客户端瞬时封包</text>
      <text x="12" y="40" class="text-body">仅编码数十字节数值 Payload，避免网络开销</text>
    </g>
  </g>

  <!-- Center Relay Service (x=430, y=170, w=100, h=100) -->
  <g transform="translate(430, 170)">
    <rect width="100" height="100" rx="8" class="focal-card" />
    <text x="50" y="32" class="text-focal-title" text-anchor="middle">极速中继</text>
    <text x="50" y="52" class="text-muted" text-anchor="middle">Node.js WS</text>
    <text x="50" y="70" font-family="ui-monospace, monospace" font-size="10" fill="#bf4520" text-anchor="middle">:5173</text>
    <text x="50" y="86" class="text-muted" text-anchor="middle">数十字节广播</text>
  </g>

  <!-- Connectors Left -> Center -> Right -->
  <line x1="400" y1="220" x2="428" y2="220" class="line" marker-end="url(#arrow5)" />
  <line x1="530" y1="220" x2="558" y2="220" class="focal-line" marker-end="url(#arrow5-focal)" />

  <!-- Panel 2: OBS Receiver (x=560, y=40, w=360, h=360) -->
  <g transform="translate(560, 40)">
    <rect width="360" height="360" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 44 L 0 44 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="28" class="text-title">OBS 捕获端 (Stream 页面)</text>
    <text x="250" y="28" class="text-muted">原生透明推流</text>

    <!-- Sub components -->
    <g transform="translate(16, 56)">
      <rect width="328" height="66" class="pill" />
      <text x="12" y="22" class="text-subtitle">1. /stream.html 纯净接收器</text>
      <text x="12" y="40" class="text-body">• 零 UI 控件负载，专供 OBS 浏览器源接入</text>
      <text x="12" y="56" class="text-body">• 建立本地 WS 监听，毫秒级反序列化姿态</text>
    </g>

    <g transform="translate(16, 132)">
      <rect width="328" height="76" class="focal-pill" />
      <text x="12" y="22" class="text-subtitle" fill="#bf4520">2. WebGL2 满血渲染管线</text>
      <text x="12" y="40" class="text-body">• 24 点样条眨眼与元音口型形变计算</text>
      <text x="12" y="56" class="text-body">• 2.5D 法线光影与动态发丝摆动</text>
      <text x="12" y="70" class="text-body">• 原生 Alpha 透明通道混合，彻底告别色键抠图</text>
    </g>

    <g transform="translate(16, 218)">
      <rect width="328" height="66" class="pill" />
      <text x="12" y="22" class="text-subtitle">3. OBS Studio 混流与输出</text>
      <text x="12" y="40" class="text-body">• 虚拟摄像头输出 (Zoom / Teams / 腾讯会议)</text>
      <text x="12" y="56" class="text-body">• 直播推流 RTMP (Bilibili / YouTube / Twitch)</text>
    </g>

    <g transform="translate(16, 294)">
      <rect width="328" height="42" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#166534">端到端延迟 &lt; 16ms · 60 FPS 满血流畅</text>
      <text x="12" y="34" font-family="sans-serif" font-size="11" fill="#15803d">极轻量 CPU/GPU 占用，笔记本即刻开播</text>
    </g>
  </g>
</svg>