<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="460" viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-4party-open-loop-title card-scheme-4party-open-loop-desc" id="card-scheme-4party-open-loop-root">
        <title id="card-scheme-4party-open-loop-title">四方开放模式（Four-Party Model）全景拓扑与契约网络</title>
        <desc id="card-scheme-4party-open-loop-desc">持卡人、发卡行、卡组织交换中枢、收单行与商户构成的全球开放式金融协同网络</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-4party-open-loop-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-4party-open-loop-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-4party-open-loop-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-4party-open-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-4party-open-loop-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-4party-open-loop-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Top Central Scheme Hub (Coral Accent Focal) -->
        <g transform="translate(350, 20)">
          <rect x="0" y="0" width="260" height="84" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="130" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.06em">CENTRAL SWITCH &amp; ARBITER</text>
          <text x="130" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="middle">卡组织中枢 (Card Scheme)</text>
          <text x="130" y="66" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">VISA · Mastercard · 银联</text>
        </g>

        <!-- Left Column: Issuer &amp; Cardholder -->
        <g transform="translate(60, 140)">
          <rect x="0" y="0" width="240" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="240" height="26" rx="6" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="12" y="18" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">ISSUING ENTITY</text>
          <text x="12" y="48" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">发卡机构（Issuer）</text>
          <text x="12" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">花旗 · 汇丰 · 工行 · 招行</text>
          <text x="12" y="90" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">授信授额 · 承担信用风险 · 扣费扣款</text>
        </g>

        <g transform="translate(60, 290)">
          <rect x="0" y="0" width="240" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="12" y="28" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">持卡人（Cardholder）</text>
          <text x="12" y="52" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">向发卡行申请并绑定卡片</text>
          <text x="12" y="72" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">出示实体卡 / 移动端 Apple Pay</text>
          <text x="12" y="94" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11">最终消费发起源头</text>
        </g>

        <!-- Right Column: Acquirer &amp; Merchant -->
        <g transform="translate(660, 140)">
          <rect x="0" y="0" width="240" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="240" height="26" rx="6" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="12" y="18" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">ACQUIRING ENTITY</text>
          <text x="12" y="48" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">收单机构（Acquirer）</text>
          <text x="12" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">Stripe · Adyen · 银联商务</text>
          <text x="12" y="90" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">商户拓展 · 报文前置机 · 垫资清算</text>
        </g>

        <g transform="translate(660, 290)">
          <rect x="0" y="0" width="240" height="110" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="12" y="28" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">特约商户（Merchant）</text>
          <text x="12" y="52" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">安装 POS / 接入线上 SDK</text>
          <text x="12" y="72" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">交付商品 / 提供线上线下服务</text>
          <text x="12" y="94" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11">承担 1.5%~3% MDR 费率</text>
        </g>

        <!-- Top Connectors: Scheme <-> Issuer and Scheme <-> Acquirer -->
        <path d="M 350 62 L 180 62 L 180 140" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#card-scheme-4party-open-loop-arrow-accent)"/>
        <rect x="210" y="52" width="110" height="20" rx="3" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.3"/>
        <text x="265" y="66" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">多边清分与路由寻径</text>

        <path d="M 610 62 L 780 62 L 780 140" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-4party-open-loop-arrow-link)"/>
        <rect x="640" y="52" width="110" height="20" rx="3" fill="#ffffff" stroke="#2e5aa8" stroke-opacity="0.3"/>
        <text x="695" y="66" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">转接授权与轧差通知</text>

        <!-- Vertical Connectors: Issuer <-> Cardholder, Acquirer <-> Merchant -->
        <path d="M 180 250 L 180 290" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-4party-open-loop-arrow)"/>
        <rect x="135" y="260" width="90" height="18" rx="2" fill="#ffffff"/>
        <text x="180" y="273" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">授信发卡/还款</text>

        <path d="M 780 250 L 780 290" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#card-scheme-4party-open-loop-arrow)"/>
        <rect x="735" y="260" width="90" height="18" rx="2" fill="#ffffff"/>
        <text x="780" y="273" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">签约收单/结款</text>

        <!-- Bottom Horizontal Connection: Cardholder -> Merchant -->
        <path d="M 300 345 L 660 345" fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#card-scheme-4party-open-loop-arrow-accent)"/>
        <rect x="420" y="333" width="120" height="24" rx="3" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.4"/>
        <text x="480" y="349" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">刷卡 / 线上交易消费</text>

        <!-- Footer Tag -->
        <g transform="translate(260, 415)">
          <rect x="0" y="0" width="440" height="26" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
          <text x="220" y="17" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">四方互不直接缔约 · 全权依赖卡组织标准化章程与集中式清算履约</text>
        </g>
      </svg>
