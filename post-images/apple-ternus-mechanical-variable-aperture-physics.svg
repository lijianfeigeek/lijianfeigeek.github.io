<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-mechanical-variable-aperture-physics-title apple-ternus-mechanical-variable-aperture-physics-desc">
  <title id="apple-ternus-mechanical-variable-aperture-physics-title">四档机械可变光圈（F1.48~F4.0）与电影 180° 快门法则</title>
  <desc id="apple-ternus-mechanical-variable-aperture-physics-desc">解决传统大光圈户外强光被迫拉高电子快门导致的生硬PPT切片感，通过物理叶片阻光在1/120秒呈现自然运动模糊并消除鬼影耀斑</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="ap-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Fixed Aperture Dilemma -->
  <g transform="translate(40, 30)">
    <rect width="410" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#ef4444"/>
    <text x="20" y="32" class="label-badge" fill="#b91c1c">传统手机困局 · 强光视频死结</text>
    <text x="20" y="58" class="label-title" fill="#b91c1c">传统固定大光圈 (f/1.78) 的运动割裂</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fee2e2" stroke-width="1"/>

    <g transform="translate(20, 92)">
      <rect width="370" height="52" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">户外烈日高亮场景下进光量严重过载</text>
      <text x="12" y="40" class="text-body">为了不产生过曝白斑，系统被迫将电子快门飙升至 1/2000 秒</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="370" height="85" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="24" class="label-title" fill="#b91c1c">❌ 灾难结果：运动模糊 (Motion Blur) 彻底消失</text>
      <text x="12" y="46" class="text-body">每一帧画面凝固如同锋利静止切片，连续播放如同生硬 PPT</text>
      <text x="12" y="66" class="text-body">外围劣质边缘杂散光直射传感器，产生祖传鬼影耀斑</text>
    </g>
  </g>

  <!-- Middle Arrow -->
  <path d="M 458 170 L 498 170" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ap-arrow)"/>

  <!-- Right: 4-Step Mechanical Solution (Focal) -->
  <g transform="translate(510, 30)">
    <rect width="410" height="280" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">iPhone 18 Pro · 物理光学解法</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">四档机械可变光圈 (F1.48 ~ F4.0)</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(20, 92)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#9a3412">收缩物理机械叶片至 f/4.0 阻光</text>
      <text x="12" y="40" class="text-body">快门从容锁定 1/120 秒，完美契合 4K 60fps 电影 180° 法则</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="370" height="85" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="12" y="24" class="label-title" fill="#bf4520">✅ 电影级质感 + 意外治愈鬼影耀斑</text>
      <text x="12" y="46" class="text-body">帧与帧之间产生极具电影质感的自然运动模糊</text>
      <text x="12" y="66" class="text-body">机械叶片物理切除外围杂散光，显著抑制祖传点光源鬼影</text>
    </g>
  </g>
</svg>