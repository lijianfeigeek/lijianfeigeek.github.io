<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-finfet-vs-gaa-transistor-physics-title apple-ternus-finfet-vs-gaa-transistor-physics-desc">
  <title id="apple-ternus-finfet-vs-gaa-transistor-physics-title">半导体微观物理质变：FinFET (三面) 到 GAA (四面全包) 演进</title>
  <desc id="apple-ternus-finfet-vs-gaa-transistor-physics-desc">对比 16nm 至 3nm 的 FinFET 晶体管物理结构及其短沟道漏电极限，与台积电 2nm N2 GAA 全环绕栅极多层纳米片结构</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    </style>
    <marker id="gaa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: FinFET Era -->
  <g transform="translate(40, 30)">
    <rect width="410" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#64748b"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">16nm ~ 3nm · 沿用十年架构</text>
    <text x="20" y="58" class="label-title">FinFET 鳍式场效应晶体管 (三面包裹)</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Micro Structure -->
    <g transform="translate(20, 90)">
      <rect width="370" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="26" class="text-feat">立起如鱼鳍的单条实心电流通道 (Fin)</text>
      <text x="16" y="48" class="text-body">金属栅极从 “左、顶、右” 三个方向卡住通道控制关断</text>
      <text x="16" y="68" class="text-mono" fill="#64748b">结构形态：3-Sided Gate Control</text>
    </g>

    <!-- Physical Limit Bottleneck -->
    <g transform="translate(20, 185)">
      <rect width="370" height="75" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="16" y="24" class="label-title" fill="#b91c1c">⚠️ 物理瓶颈：短沟道效应失控</text>
      <text x="16" y="44" class="text-body">下探至 3nm 极限时，源极与漏极距离过短</text>
      <text x="16" y="62" class="text-body">栅极底面未被包裹，量子隧穿引发关断期严重漏电</text>
    </g>
  </g>

  <!-- Arrow Transition -->
  <path d="M 458 170 L 498 170" stroke="#bf4520" stroke-width="1.5" marker-end="url(#gaa-arrow)"/>

  <!-- Right: GAA Nanosheet (Focal) -->
  <g transform="translate(510, 30)">
    <rect width="410" height="280" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">台积电 N2 2nm · 微观质变</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">GAA 全环绕栅极架构 (四面 360° 全包)</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fed7aa" stroke-width="1"/>

    <!-- Micro Structure -->
    <g transform="translate(20, 90)">
      <rect width="370" height="80" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="16" y="26" class="text-feat" fill="#9a3412">垂直悬空堆叠的多层水平超薄硅纳米片 (Nanosheet)</text>
      <text x="16" y="48" class="text-body">ALD 原子层沉积技术在表面均匀吹敷介电绝缘层</text>
      <text x="16" y="68" class="text-mono" fill="#bf4520">结构形态：360° All-Around Gate Control</text>
    </g>

    <!-- Cure &amp; Benefits -->
    <g transform="translate(20, 185)">
      <rect width="370" height="75" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="16" y="24" class="label-title" fill="#bf4520">✅ 物理突破：彻底扼杀短沟道漏电</text>
      <text x="16" y="44" class="text-body">第四个底面包覆赋予栅极对电场的绝对掌控力</text>
      <text x="16" y="62" class="text-body">同面积晶体管密度倍增，苹果全自研采购独揽初期 55% 产能</text>
    </g>
  </g>
</svg>