<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockxy-three-generations-proxy-evolution-title rockxy-three-generations-proxy-evolution-desc">
  <title id="rockxy-three-generations-proxy-evolution-title">网络抓包与调试工具的三代演进历史</title>
  <desc id="rockxy-three-generations-proxy-evolution-desc">从 Java 跨平台黑盒到 macOS 商业闭源软件，再到以 Rockxy 为代表的开源可审与 AI 原生第三代网络调试器</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-lead { font-family: "Instrument Serif", Georgia, serif; font-size: 18px; fill: #1e293b; }
    </style>
    <marker id="evo-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="320" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Gen 1 Card -->
  <g transform="translate(40, 30)">
    <rect width="260" height="260" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#94a3b8"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">第一代 · 2000s</text>
    <text x="20" y="58" class="label-title">跨平台重型黑盒</text>
    <text x="20" y="78" class="text-body">代表工具：Charles / Fiddler</text>

    <line x1="20" y1="94" x2="240" y2="94" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">❌ Java Swing 界面迟钝晦涩</text>
      <text x="0" y="24" class="text-feat">❌ 内存与 CPU 开销沉重</text>
      <text x="0" y="48" class="text-feat">❌ 高并发 HTTP/2 极易假死</text>
      <text x="0" y="72" class="text-feat">❌ 缺乏现代 macOS 系统集成</text>
      <text x="0" y="110" class="text-body" fill="#64748b">“能用但体验沉重，难当大任”</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 312 160 L 338 160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#evo-arrow)"/>

  <!-- Gen 2 Card -->
  <g transform="translate(350, 30)">
    <rect width="260" height="260" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#0284c7"/>
    <text x="20" y="32" class="label-badge" fill="#0284c7">第二代 · 2018s</text>
    <text x="20" y="58" class="label-title">macOS 原生商业闭源</text>
    <text x="20" y="78" class="text-body">代表工具：Proxyman</text>

    <line x1="20" y1="94" x2="240" y2="94" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✓ 纯 Swift 重构，界面丝滑</text>
      <text x="0" y="24" class="text-feat">✓ 深度适配 Apple Silicon</text>
      <text x="0" y="48" class="text-feat">❌ 核心代码完全闭源，信任死角</text>
      <text x="0" y="72" class="text-feat">❌ 核心能力锁入昂贵订阅制</text>
      <text x="0" y="110" class="text-body" fill="#64748b">“体验优秀，但信任链断裂”</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 622 160 L 648 160" stroke="#bf4520" stroke-width="1.5" marker-end="url(#evo-arrow)"/>

  <!-- Gen 3 Card (Focal) -->
  <g transform="translate(660, 30)">
    <rect width="260" height="260" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">第三代 · 2026 次世代</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">开源可审 + AI 原生</text>
    <text x="20" y="78" class="text-body" fill="#9a3412">代表项目：Rockxy (AGPL-3.0)</text>

    <line x1="20" y1="94" x2="240" y2="94" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✓ AGPL-3.0 源码透明可审</text>
      <text x="0" y="24" class="text-feat">✓ SwiftNIO 异步事件驱动核心</text>
      <text x="0" y="48" class="text-feat">✓ 内置本地只读 MCP Server</text>
      <text x="0" y="72" class="text-feat">✓ AI 流式检查与 Web3/x402 感知</text>
      <text x="0" y="110" class="text-body" fill="#9a3412" style="font-weight: 600;">“性能、透明度与智能体协同全赢”</text>
    </g>
  </g>
</svg>