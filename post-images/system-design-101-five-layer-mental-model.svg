<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="sd-layer-title sd-layer-desc">
  <title id="sd-layer-title">分布式系统五层确定性心智模型：从边缘接入到存储物理学</title>
  <desc id="sd-layer-desc">系统设计101架构总览，展示接入网络、通信协议、高速缓存、异步消息总线与持久化存储的五层调用流。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">分布式系统五层确定性心智模型 (System Design 101)</text>
    <text class="subtitle" x="0" y="20">从全球边缘网络接入、协议层到缓存、消息总线与底层持久化引擎的请求生命周期</text>
  </g>

  <!-- 5 Layer Horizontal Stacks -->
  <!-- Layer 1: Traffic &amp; Transport -->
  <g transform="translate(48, 86)">
    <rect width="864" height="68" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <text class="layer-title" fill="#1d4ed8" x="0" y="0">1. 接入与网络传输层 (Traffic &amp; Transport)</text>
      <g transform="translate(0, 14)">
        <text class="card-body" x="0" y="10">• Anycast DNS / CDN 全球边缘加速</text>
        <text class="card-body" x="220" y="10">• L4 负载均衡 (LVS / IPVS / eBPF)</text>
        <text class="card-body" x="430" y="10">• L7 反向代理 (Nginx / HAProxy / Envoy)</text>
        <text class="card-body" x="650" y="10">• API 网关 (限流 / 鉴权 / 协议转换)</text>
      </g>
      <text class="mono" fill="#2563eb" x="0" y="42">EDGE: 屏蔽单点物理故障，抵御百吉比特 DDoS 攻击与 TLS 握手卸载</text>
    </g>
  </g>

  <!-- Layer 2: Protocols &amp; Microservices -->
  <g transform="translate(48, 162)">
    <rect width="864" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(16, 14)">
      <text class="layer-title" fill="#334155" x="0" y="0">2. 通信协议与服务协同层 (Protocols &amp; Microservices)</text>
      <g transform="translate(0, 14)">
        <text class="card-body" x="0" y="10">• RESTful API (JSON / HTTP 1.1 / 2)</text>
        <text class="card-body" x="220" y="10">• gRPC (HTTP/2 多路复用 / Protobuf)</text>
        <text class="card-body" x="430" y="10">• 实时流 (WebSocket / SSE 流式推流)</text>
        <text class="card-body" x="650" y="10">• 分布式事务 (SAGA / TCC / Outbox)</text>
      </g>
      <text class="mono" fill="#475569" x="0" y="42">RPC: 内部服务微秒级序列化与双向通信，断路器 (Circuit Breaker) 防级联崩溃</text>
    </g>
  </g>

  <!-- Layer 3: Caching &amp; Acceleration -->
  <g transform="translate(48, 238)">
    <rect width="864" height="68" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <text class="layer-title" fill="#c2410c" x="0" y="0">3. 高速缓存与性能加速层 (Caching &amp; Acceleration)</text>
      <g transform="translate(0, 14)">
        <text class="card-body" x="0" y="10">• 进程内缓存 (Caffeine / Guava)</text>
        <text class="card-body" x="220" y="10">• 分布式缓存 (Redis Cluster / Sentinel)</text>
        <text class="card-body" x="430" y="10">• 读写模式 (Cache-Aside / Write-Through)</text>
        <text class="card-body" x="650" y="10">• 三灾防御 (布隆过滤器 / 互斥锁 / Jitter)</text>
      </g>
      <text class="mono" fill="#ea580c" x="0" y="42">SPEED: 吸收 95%+ 读流量冲击，微秒级内存响应抵挡洪峰</text>
    </g>
  </g>

  <!-- Layer 4: Messaging &amp; Streaming -->
  <g transform="translate(48, 314)">
    <rect width="864" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(16, 14)">
      <text class="layer-title" fill="#334155" x="0" y="0">4. 消息总线与异步流处理层 (Messaging &amp; Streaming)</text>
      <g transform="translate(0, 14)">
        <text class="card-body" x="0" y="10">• 分布式事件日志 (Apache Kafka / Pulsar)</text>
        <text class="card-body" x="240" y="10">• 任务削峰队列 (RabbitMQ / SQS)</text>
        <text class="card-body" x="460" y="10">• 变更数据捕获 CDC (Debezium / Flink)</text>
        <text class="card-body" x="680" y="10">• Sendfile 零拷贝与顺序磁盘写</text>
      </g>
      <text class="mono" fill="#475569" x="0" y="42">ASYNC: 异步削峰填谷，最终一致性事件驱动，解耦复杂依赖拓扑</text>
    </g>
  </g>

  <!-- Layer 5: Storage &amp; Persistence -->
  <g transform="translate(48, 390)">
    <rect width="864" height="88" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <text class="layer-title" fill="#15803d" x="0" y="0">5. 持久化存储与数据引擎层 (Storage &amp; Persistence)</text>
      <g transform="translate(0, 14)">
        <text class="card-body" x="0" y="10">• B+ Tree 引擎 (MySQL InnoDB / PostgreSQL: 就地更新 / 极致读与范围扫描)</text>
        <text class="card-body" x="480" y="10">• LSM-Tree 引擎 (RocksDB / Cassandra / TiKV: 追加写 / 高吞吐写密集)</text>
        <text class="card-body" x="0" y="28">• 分布式共识协议 (Raft / Multi-Paxos)</text>
        <text class="card-body" x="240" y="28">• 预写日志 WAL 与多副本半同步复制</text>
        <text class="card-body" x="480" y="28">• 水平分库分表与 Citus / Vitess 分布式网关代理</text>
      </g>
      <text class="mono" fill="#15803d" x="0" y="60">GROUND TRUTH: 遵循 ACID 物理原则与 CAP 权衡定理，构建最终不灭的数据底座</text>
    </g>
  </g>
</svg>