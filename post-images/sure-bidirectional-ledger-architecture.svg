<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="sure-ledger-title sure-ledger-desc" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="sure-ledger-title">Sure 双向余额物化引擎与多币种防线架构</title>
  <desc id="sure-ledger-desc">展示 Sure 如何将手动账户的前向增量计算（Balance::ForwardCalculator）与直连账户的反向锚点推演（Balance::ReverseCalculator）收敛至 Balance::Materializer 批量落库，并通过 Money 严格币种检查与自动转账匹配保障账本一致性。</desc>
  <defs>
    <marker id="sl-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="sl-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="sl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="sl-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="660" fill="#f8fafc"/>

  <!-- Header -->
  <g transform="translate(32, 20)">
    <rect x="0" y="0" width="896" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="25" font-size="16" font-weight="700" fill="#0f172a">双轨账本引擎：手动前向增量（Forward）vs. 银行直连反向锚定（Reverse）</text>
    <text x="20" y="44" font-size="11" fill="#475569">9 类 Accountable 账户 × 3 类 Entryable 分录（负数为流入 / 正数为流出），统一收敛于日终余额物化流水线</text>
    <rect x="736" y="16" width="144" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="808" y="32" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#475569" text-anchor="middle">LEDGER ARCHITECTURE</text>
  </g>

  <!-- Background Containers (Left & Right Tracks) -->
  <g transform="translate(32, 92)">
    <rect x="0" y="0" width="436" height="316" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="436" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="23" font-size="12" font-weight="700" fill="#0f172a">轨道 A · 手动账户前向增量路径 (strategy: :forward)</text>
    <text x="420" y="23" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#059669" text-anchor="end">Opening → Today</text>
  </g>

  <g transform="translate(492, 92)">
    <rect x="0" y="0" width="436" height="316" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="436" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="23" font-size="12" font-weight="700" fill="#0f172a">轨道 B · 银行直连反向推演路径 (strategy: :reverse)</text>
    <text x="420" y="23" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#bf4520" text-anchor="end">Anchor → History</text>
  </g>

  <!-- Bottom Convergence Container -->
  <g transform="translate(32, 428)">
    <rect x="0" y="0" width="896" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="896" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="23" font-size="12" font-weight="700" fill="#0f172a">统一物化、多币种防线与跨账户转账配对层</text>
    <text x="880" y="23" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569" text-anchor="end">Balance.transaction</text>
  </g>

  <!-- Connectors (drawn BEFORE boxes!) -->
  <!-- Left track vertical flow -->
  <path d="M 250 204 L 250 236" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#sl-arrow-green)"/>
  <path d="M 250 304 L 250 328" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#sl-arrow-green)"/>
  <!-- Left track down to Materializer -->
  <path d="M 250 392 L 250 480" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#sl-arrow-green)"/>
  <rect x="178" y="400" width="144" height="18" rx="3" fill="#f8fafc"/>
  <text x="250" y="413" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#059669" text-anchor="middle">增量窗口重算 Balances</text>

  <!-- Right track vertical flow -->
  <path d="M 710 204 L 710 236" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#sl-arrow-link)"/>
  <path d="M 710 304 L 710 328" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#sl-arrow-accent)"/>
  <!-- Right track down to Materializer (orthogonal elbow into Materializer) -->
  <path d="M 710 392 L 710 464 Q 710 472 702 472 L 420 472 Q 412 472 412 480 L 412 484" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sl-arrow-accent)"/>
  <rect x="524" y="400" width="160" height="18" rx="3" fill="#f8fafc"/>
  <text x="604" y="413" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#bf4520" text-anchor="middle">锚点逆序校准 + 冲突对齐</text>

  <!-- Bottom horizontal links between Materializer, Money Guard, AutoTransfer -->
  <path d="M 436 528 L 476 528" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#sl-arrow-accent)"/>
  <path d="M 672 528 L 712 528" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#sl-arrow-muted)"/>

  <!-- Left Track Nodes -->
  <g transform="translate(56, 144)">
    <rect x="0" y="0" width="388" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="8" width="52" height="16" rx="2" fill="#e2e8f0"/>
    <text x="38" y="19" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#334155" text-anchor="middle">ENTRIES</text>
    <text x="76" y="21" font-size="12" font-weight="600" fill="#0f172a">Entry 代理模型 + 期初锚点</text>
    <text x="12" y="44" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">Transaction / Trade / Valuation · 仅更新 earliest_saved_date 起算</text>
  </g>

  <g transform="translate(56, 240)">
    <rect x="0" y="0" width="388" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <rect x="12" y="8" width="60" height="16" rx="2" fill="#d1fae5"/>
    <text x="42" y="19" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#065f46" text-anchor="middle">FORWARD</text>
    <text x="84" y="21" font-size="12" font-weight="600" fill="#064e3b">Balance::ForwardCalculator</text>
    <text x="12" y="44" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#047857">以 window_start_date - 1 落库余额为起点；遇多币种/持仓自动回退全量</text>
  </g>

  <g transform="translate(56, 332)">
    <rect x="0" y="0" width="388" height="60" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <rect x="12" y="8" width="60" height="16" rx="2" fill="#f1f5f9"/>
    <text x="42" y="19" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#475569" text-anchor="middle">LOCKING</text>
    <text x="84" y="21" font-size="12" font-weight="600" fill="#0f172a">并发拆分锁 &amp; 未来计划排期隔离</text>
    <text x="12" y="44" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">with_split_lock (FOR UPDATE) · date &gt; today 的 scheduled? 不入账面余额</text>
  </g>

  <!-- Right Track Nodes -->
  <g transform="translate(516, 144)">
    <rect x="0" y="0" width="388" height="60" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1"/>
    <rect x="12" y="8" width="68" height="16" rx="2" fill="#dbeafe"/>
    <text x="46" y="19" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#0369a1" text-anchor="middle">28 SYNCERS</text>
    <text x="92" y="21" font-size="12" font-weight="600" fill="#0c4a6e">外部金融连接器矩阵 (*_item)</text>
    <text x="12" y="44" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#0369a1">Plaid / SimpleFIN / IBKR / Wise / Kraken / Apple FinanceKit Outbox</text>
  </g>

  <g transform="translate(516, 240)">
    <rect x="0" y="0" width="388" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="8" width="60" height="16" rx="2" fill="#f1f5f9"/>
    <text x="42" y="19" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#334155" text-anchor="middle">ADAPTER</text>
    <text x="84" y="21" font-size="12" font-weight="600" fill="#0f172a">Account::ProviderImportAdapter</text>
    <text x="12" y="44" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#475569">保护用户手改 (user_modified / locked_attributes) + Pending→Posted 认领</text>
  </g>

  <!-- Coral Focal Node 1: ReverseCalculator -->
  <g transform="translate(516, 332)">
    <rect x="0" y="0" width="388" height="60" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <rect x="12" y="8" width="60" height="16" rx="2" fill="#ffedd5"/>
    <text x="42" y="19" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">REVERSE</text>
    <text x="84" y="21" font-size="12" font-weight="700" fill="#7c2d12">Balance::ReverseCalculator</text>
    <text x="12" y="44" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">从 current_anchor_balance 倒推历史，遇 reconciliation 路标硬重置消除漂移</text>
  </g>

  <!-- Bottom Row Nodes -->
  <g transform="translate(56, 484)">
    <rect x="0" y="0" width="380" height="88" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
    <rect x="12" y="10" width="76" height="16" rx="2" fill="#e2e8f0"/>
    <text x="50" y="21" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#334155" text-anchor="middle">MATERIALIZER</text>
    <text x="100" y="23" font-size="12" font-weight="700" fill="#0f172a">Balance::Materializer</text>
    <text x="12" y="46" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#334155">1. Holding::Materializer 先物化持仓与市值</text>
    <text x="12" y="64" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#334155">2. 每 2,000 行切片 upsert_all + purge_stale_balances</text>
    <text x="12" y="80" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#64748b">控制多年度历史账户同步时的 RSS 内存峰值</text>
  </g>

  <!-- Coral Focal Node 2: Money Strict Guard -->
  <g transform="translate(476, 484)">
    <rect x="0" y="0" width="196" height="88" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <rect x="12" y="10" width="60" height="16" rx="2" fill="#ffedd5"/>
    <text x="42" y="21" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">CURRENCY</text>
    <text x="80" y="23" font-size="12" font-weight="700" fill="#7c2d12">Money 严格防线</text>
    <text x="12" y="48" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">禁止隐式跨币种加减比较</text>
    <text x="12" y="66" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">强制 exchange_to(date:)</text>
    <text x="12" y="81" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">CurrencyMismatchError</text>
  </g>

  <g transform="translate(712, 484)">
    <rect x="0" y="0" width="196" height="88" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <rect x="12" y="10" width="64" height="16" rx="2" fill="#f1f5f9"/>
    <text x="44" y="21" font-size="9" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#475569" text-anchor="middle">POST-SYNC</text>
    <text x="84" y="23" font-size="12" font-weight="600" fill="#0f172a">跨账户转账配对</text>
    <text x="12" y="48" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#334155">4 天窗口 / 10% FX 容差</text>
    <text x="12" y="66" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#334155">区分 cc_payment 排除</text>
    <text x="12" y="81" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#64748b">与 loan/invest 支出归属</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(32, 608)">
    <rect x="0" y="0" width="896" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="11" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="38" y="22" font-size="11" fill="#334155">前向增量路径 (Manual)</text>
    <rect x="196" y="11" width="14" height="14" rx="2" fill="#eff6ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="218" y="22" font-size="11" fill="#334155">外部同步适配 (28 Providers)</text>
    <rect x="404" y="11" width="14" height="14" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="426" y="22" font-size="11" fill="#334155">核心焦点防线 (Reverse Anchor &amp; Money Guard)</text>
    <line x1="704" y1="18" x2="736" y2="18" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="744" y="22" font-size="11" fill="#334155">同步后异步对账流</text>
  </g>
</svg>
