<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-under-display-faceid-patent-evolution-title apple-ternus-under-display-faceid-patent-evolution-desc">
  <title id="apple-ternus-under-display-faceid-patent-evolution-title">屏下 Face ID 技术演进：特努斯 15 年前透光专利破局</title>
  <desc id="apple-ternus-under-display-faceid-patent-evolution-desc">从 2011 年规则微孔引发严重光学衍射星芒，到 iPhone 18 Pro 采用非对称微旋转偏角通道物理干涉抵消星芒，灵动岛缩窄 35%</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="pat-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="320" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Col 1: 2011 Patent Vision -->
  <g transform="translate(40, 30)">
    <rect width="260" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#0284c7"/>
    <text x="16" y="32" class="label-badge" fill="#0284c7">2011 年专利诞生</text>
    <text x="16" y="56" class="label-title">特努斯原始专利设想</text>
    <text x="16" y="74" class="text-body">《设有开孔的电子设备》</text>
    <line x1="16" y1="88" x2="244" y2="88" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(16, 105)">
      <text x="0" y="0" class="text-feat">✦ 发明人署名：约翰·特努斯</text>
      <text x="0" y="24" class="text-body">在 OLED 发光像素晶格间隙</text>
      <text x="0" y="44" class="text-body">挖出微观红外与透光物理通道</text>
      <text x="0" y="74" class="text-body" fill="#64748b">“前瞻构想超前行业 15 年”</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 312 160 L 338 160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pat-arrow)"/>

  <!-- Col 2: Optical Artifact Problem -->
  <g transform="translate(350, 30)">
    <rect width="260" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#ef4444"/>
    <text x="16" y="32" class="label-badge" fill="#b91c1c">直接透光的工程灾难</text>
    <text x="16" y="56" class="label-title" fill="#b91c1c">整齐排布引发衍射星芒</text>
    <text x="16" y="74" class="text-body">Diffraction &amp; Moire Artifacts</text>
    <line x1="16" y1="88" x2="244" y2="88" stroke="#fee2e2" stroke-width="1"/>
    <g transform="translate(16, 105)">
      <text x="0" y="0" class="text-feat">❌ 规则晶格孔如同密集纱窗</text>
      <text x="0" y="24" class="text-body">光线穿过时发生周期性同相叠加</text>
      <text x="0" y="44" class="text-body">形成刺眼的高光散射星芒</text>
      <text x="0" y="68" class="text-body" fill="#b91c1c">3D 点阵畸变，Face ID 无法识别</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 622 160 L 648 160" stroke="#bf4520" stroke-width="1.5" marker-end="url(#pat-arrow)"/>

  <!-- Col 3: Solved Realization (Focal) -->
  <g transform="translate(660, 30)">
    <rect width="260" height="260" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#bf4520"/>
    <text x="16" y="32" class="label-badge" fill="#bf4520">iPhone 18 Pro 落地突破</text>
    <text x="16" y="56" class="label-title" fill="#9a3412">非对称微偏角透光通道</text>
    <text x="16" y="74" class="tag-coral">灵动岛缩窄 35% (13.49mm)</text>
    <line x1="16" y1="88" x2="244" y2="88" stroke="#fed7aa" stroke-width="1"/>
    <g transform="translate(16, 105)">
      <text x="0" y="0" class="text-feat" fill="#9a3412">✦ 故意破坏周期性规则排列</text>
      <text x="0" y="24" class="text-body">通道赋予微小随机旋转偏角</text>
      <text x="0" y="44" class="text-body">散射星芒相互干涉抵消，光路纯净</text>
      <text x="0" y="68" class="text-body" fill="#059669" style="font-weight: 600;">红外组件入地，2027真全景就绪</text>
    </g>
  </g>
</svg>