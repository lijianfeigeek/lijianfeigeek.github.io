<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="460" viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-five-layer-identity-chain-title ios-noir-five-layer-identity-chain-desc" id="ios-noir-five-layer-identity-chain-root">
        <title id="ios-noir-five-layer-identity-chain-title">穿透全盘抹机与换机：iOS 底层五层持久追踪烙印链</title>
        <desc id="ios-noir-five-layer-identity-chain-desc">iCloud KVS 云端烙印、钥匙串共享池、App Groups 本地串通、蜂窝基站直连与 Wi-Fi 扫描钩子</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-five-layer-identity-chain-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-five-layer-identity-chain-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-five-layer-identity-chain-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-five-layer-identity-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-five-layer-identity-chain-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-five-layer-identity-chain-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Layer 1: iCloud KVS (Focal Accent) -->
        <g transform="translate(60, 24)">
          <rect x="0" y="0" width="840" height="68" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.05"/>
          <rect x="0" y="0" width="220" height="24" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="16" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">LAYER 01 · ICLOUD 云端烙印 (FOCAL)</text>
          <text x="14" y="44" fill="#bf4520" font-family="'Geist', sans-serif" font-size="13" font-weight="600">签名：com.apple.developer.ubiquity-kvstore-identifier</text>
          <text x="14" y="60" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">穿透力：卸载重装根本洗不掉！即使购买一台全新 iPhone 登录同一 Apple ID，1 毫秒自动从云端拉取历史设备 UUID</text>
        </g>

        <!-- Layer 2: Keychain Access Groups -->
        <g transform="translate(60, 104)">
          <rect x="0" y="0" width="840" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="200" height="24" rx="6" fill="#f8f9fa"/>
          <text x="14" y="16" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">LAYER 02 · 永久钥匙串共享池</text>
          <text x="14" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">机制：Keychain Access Groups (keychain-access-groups)</text>
          <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">穿透力：App 无论被删除多少次，钥匙串加密记录永久驻留在系统独立存储区，重新安装瞬间无感读取旧账号与硬件指纹</text>
        </g>

        <!-- Layer 3: Application Groups -->
        <g transform="translate(60, 184)">
          <rect x="0" y="0" width="840" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="200" height="24" rx="6" fill="#f8f9fa"/>
          <text x="14" y="16" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">LAYER 03 · 跨应用串通沙盒池</text>
          <text x="14" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">机制：com.apple.security.application-groups</text>
          <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">穿透力：阿里/腾讯/字节/美团系同门派应用共享 group.* 目录，手机里只要留有一个同系 App，整套生态指纹长生不老</text>
        </g>

        <!-- Layer 4: Cellular Multipath Bypass -->
        <g transform="translate(60, 264)">
          <rect x="0" y="0" width="840" height="68" rx="6" fill="#bf4520" stroke="#bf4520" fill-opacity="0.03" stroke-opacity="0.2"/>
          <rect x="0" y="0" width="260" height="24" rx="6" fill="#bf4520" fill-opacity="0.08"/>
          <text x="14" y="16" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">LAYER 04 · 蜂窝网络强行直连 (穿透 VPN)</text>
          <text x="14" y="44" fill="#bf4520" font-family="'Geist', sans-serif" font-size="13" font-weight="600">签名：multipath 多路径 TCP + ATS 免密认证域名</text>
          <text x="14" y="60" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">穿透力：无视 Wi-Fi 与 utun 虚拟网卡代理，强制指定 pdp_ip0 蜂窝接口直连移动/电信/联通基站网关，毫秒级取号识破真实手机号</text>
        </g>

        <!-- Layer 5: HotspotHelper Wi-Fi Sniffing -->
        <g transform="translate(60, 344)">
          <rect x="0" y="0" width="840" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="280" height="24" rx="6" fill="#f8f9fa"/>
          <text x="14" y="16" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">LAYER 05 · 系统级 Wi-Fi 扫描钩子 (免 GPS 定位)</text>
          <text x="14" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">签名：com.apple.developer.networking.HotspotHelper</text>
          <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">穿透力：走过商场或点开系统 Wi-Fi 列表即被内核唤醒，搜集周边所有路由器 BSSID，在未开定位权限下实现亚米级室内导航</text>
        </g>

        <!-- Cascading Spine Indicator Line -->
        <path d="M 45 58 L 45 378" fill="none" stroke="#bf4520" stroke-width="2"/>
        <circle cx="45" cy="58" r="4" fill="#bf4520"/>
        <circle cx="45" cy="138" r="3" fill="#2e5aa8"/>
        <circle cx="45" cy="218" r="3" fill="#2e5aa8"/>
        <circle cx="45" cy="298" r="3" fill="#bf4520"/>
        <circle cx="45" cy="378" r="4" fill="#4f5d75"/>
      </svg>
