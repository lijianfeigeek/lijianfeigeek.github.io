<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="rc-swim-title rc-swim-desc" xmlns="http://www.w3.org/2000/svg" id="roam-control-pairing-swimlane-root">
  <title id="rc-swim-title">Roam Control 跨特权域本机自配对与保活握手泳道图</title>
  <desc id="rc-swim-desc">展示 SwiftUI 宿主、Rust 配对引擎、LocalDevVPN 设备隧道与 iOS 27 开发者模式守护进程四个特权泳道间的本机自配对、PIN 通知回传及 5Hz 定位注入时序。</desc>
  <defs>
      <style>#roam-control-pairing-swimlane-root { color: #0f172a; font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; }
      #roam-control-pairing-swimlane-root .diagram-wrap { overflow-x: auto; max-width: 1040px; margin: 0 auto; }</style>
    <marker id="roam-control-pairing-swimlane-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="roam-control-pairing-swimlane-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
    <marker id="roam-control-pairing-swimlane-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="600" fill="#f8fafc"/>
  <rect x="16" y="16" width="968" height="568" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CROSS-PRIVILEGE SWIMLANE · ON-DEVICE PAIRING &amp; SESSION BOOTSTRAP</text>
    <text x="0" y="36" fill="#0f172a" font-size="18" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">从本机 Bonjour 自广播到灵动岛保活：四特权域握手与蜂窝冷启动链路</text>
  </g>

  <!-- Swimlane Backgrounds & Horizontal Hairline Dividers -->
  <rect x="40" y="92" width="920" height="432" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="40" y="92" width="164" height="432" fill="#f8fafc"/>
  <line x1="204" y1="92" x2="204" y2="524" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="200" x2="960" y2="200" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="308" x2="960" y2="308" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="416" x2="960" y2="416" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Swimlane Left Labels (Isolated Local Coordinates) -->
  <g transform="translate(56, 124)">
    <text x="0" y="12" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 01 · HOST UI</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">SwiftUI 宿主与调度</text>
    <text x="0" y="50" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">BGTask + Notification</text>
  </g>
  <g transform="translate(56, 232)">
    <text x="0" y="12" fill="#be123c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 02 · RUST FFI</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">roam_pairing_ffi</text>
    <text x="0" y="50" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">SRP-6a + RC_IFBOUND</text>
  </g>
  <g transform="translate(56, 340)">
    <text x="0" y="12" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 03 · TUNNEL</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">LocalDevVPN</text>
    <text x="0" y="50" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Device VPN utun</text>
  </g>
  <g transform="translate(56, 448)">
    <text x="0" y="12" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 04 · XNU / OS</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">iOS 27 系统守护域</text>
    <text x="0" y="50" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">remoted + locationd</text>
  </g>

  <!-- ==================== ORTHOGONAL CONNECTORS (DRAWN BEFORE BOXES) ==================== -->
  <!-- 1. Step 1 (x=304, y=176) -> Step 2 (x=304, y=440) dashed transit via mDNS to Settings -->
  <line x1="276" y1="176" x2="276" y2="440" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#roam-control-pairing-swimlane-arrow-link)"/>
  <rect x="212" y="182" width="56" height="14" rx="2" fill="#ffffff"/>
  <text x="240" y="192" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">BONJOUR</text>

  <!-- 2. Step 2 (x=392, y=472) -> Step 3 (x=472, y=260) via r=8 orthogonal elbow -->
  <path d="M 392 472 L 424 472 A 8 8 0 0 0 432 464 L 432 268 A 8 8 0 0 1 440 260 L 464 260" fill="none" stroke="#e11d48" stroke-width="1.4" marker-end="url(#roam-control-pairing-swimlane-arrow-accent)"/>
  <rect x="364" y="344" width="60" height="16" rx="2" fill="#ffffff"/>
  <text x="394" y="355" fill="#be123c" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6-DIGIT PIN</text>

  <!-- 3. Step 3 (x=548, y=228) -> Step 4 (x=548, y=176) notification callback -->
  <line x1="548" y1="228" x2="548" y2="176" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#roam-control-pairing-swimlane-arrow)"/>
  <rect x="556" y="182" width="56" height="14" rx="2" fill="#ffffff"/>
  <text x="584" y="192" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PIN PUSH</text>

  <!-- 4. Step 3 (x=632, y=260) -> Step 5 (x=684, y=364) RC_IFBOUND socket bind -->
  <path d="M 632 260 L 652 260 A 8 8 0 0 1 660 268 L 660 356 A 8 8 0 0 0 668 364 L 684 364" fill="none" stroke="#e11d48" stroke-width="1.4" marker-end="url(#roam-control-pairing-swimlane-arrow-accent)"/>
  <rect x="592" y="316" width="60" height="16" rx="2" fill="#ffffff"/>
  <text x="622" y="327" fill="#be123c" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IFBOUND</text>

  <!-- 5. Step 5 (x=764, y=396) -> Step 6 (x=764, y=440) loopback into remoted/locationd -->
  <line x1="764" y1="396" x2="764" y2="440" stroke="#0284c7" stroke-width="1.2" marker-end="url(#roam-control-pairing-swimlane-arrow-link)"/>
  <rect x="772" y="402" width="68" height="14" rx="2" fill="#ffffff"/>
  <text x="806" y="412" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DVT 200MS</text>

  <!-- 6. Step 4 (x=632, y=144) -> Step 7 (x=780, y=144) BGTask KeepAlive -->
  <line x1="632" y1="144" x2="780" y2="144" stroke="#64748b" stroke-width="1.2" marker-end="url(#roam-control-pairing-swimlane-arrow)"/>
  <rect x="676" y="122" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="706" y="132" fill="#475569" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">KEEPALIVE</text>

  <!-- 7. Step 7 (x=860, y=176) -> Step 6 (x=888, y=440) right-side orthogonal progress sync -->
  <path d="M 908 176 L 908 432 A 8 8 0 0 1 900 440" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ==================== NODES (ISOLATED <g transform="translate(X, Y)">) ==================== -->
  <!-- Node 1: Publish Bonjour & BGTask -->
  <g transform="translate(224, 112)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">01 · ADVERTISE</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">广播配对与注册后台任务</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">_remotepairing-pairable</text>
  </g>

  <!-- Node 2: iOS Developer Mode Settings -->
  <g transform="translate(224, 440)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">02 · DEV MODE</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">开发者模式发现本机</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Pair with Roam Control</text>
  </g>

  <!-- Node 3 (FOCAL): Rust SRP-6a + Keychain Seal -->
  <g transform="translate(464, 228)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="12" y="20" fill="#be123c" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">03 · SRP-6A &amp; SEAL</text>
    <text x="12" y="38" fill="#9f1239" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">OPACK 协商与密钥落盘</text>
    <text x="12" y="54" fill="#be123c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Keychain .rppairing</text>
  </g>

  <!-- Node 4: Local Notification PIN Relay -->
  <g transform="translate(464, 112)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">04 · PIN BANNER</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">横幅推送六位动态码</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">免切回主应用防断连</text>
  </g>

  <!-- Node 5: LocalDevVPN Loopback + Cellular Trick -->
  <g transform="translate(684, 332)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="20" fill="#0284c7" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">05 · UTUN LOOPBACK</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">锁定 10.7.1.1 回环</text>
    <text x="12" y="54" fill="#0369a1" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">蜂窝瞬断 2s 建连即恢复</text>
  </g>

  <!-- Node 6: remoted TLS-PSK & locationd Override -->
  <g transform="translate(684, 440)">
    <rect x="0" y="0" width="256" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">06 · SYSTEM LOCATION OVERRIDE</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">TLS-PSK 长连接接管全局 locationd</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">simulateLocationWithLatitude (5Hz)</text>
  </g>

  <!-- Node 7: Dynamic Island & BGContinuedProcessingTask -->
  <g transform="translate(780, 112)">
    <rect x="0" y="0" width="160" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">07 · DYNAMIC ISLAND</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">灵动岛进度上报保活</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">隐藏停止键防误触</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="542" x2="960" y2="542" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(40, 552)">
    <text x="0" y="14" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LEGEND</text>
    <line x1="76" y1="10" x2="108" y2="10" stroke="#e11d48" stroke-width="1.6"/>
    <text x="116" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">核心安全握手与网卡强绑定路径</text>
    <line x1="324" y1="10" x2="356" y2="10" stroke="#0284c7" stroke-width="1.4"/>
    <text x="364" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">本地回环隧道与 DVT 坐标流</text>
    <line x1="556" y1="10" x2="588" y2="10" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="596" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">异步通知回调与后台保活信号</text>
  </g>
</svg>
