<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="kernarium-loop-title kernarium-loop-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="kernarium-loop-title">Kernarium iOS 沙盒防杀与分片休眠生命周期闭环</title>
  <desc id="kernarium-loop-desc">展示 Kernarium 与 Andarium 如何在前后台切换时通过 GPU 请求门控、相机排空、内核磁盘同步、宿主文件锁剥离、Mach 线程挂起与 $TMPDIR 分片休眠抵御 iOS Jetsam 强杀，并向中央预算与停顿监控中枢回写状态。</desc>
  <defs>
    <marker id="klp-ring" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#0284c7"/>
    </marker>
    <marker id="klp-spoke" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">iOS 沙盒防杀与分片休眠闭环：GPU 门控、锁剥离与 Jetsam 护盾</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">FOREGROUND ↔ BACKGROUND QUIESCE / HIBERNATION CYCLE · CENTRAL BUDGET &amp; STALL WATCH HUB</text>
    <text x="860" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: LOOP / STATE HUB</text>
  </g>

  <!-- Ring Circle Guide (subtle dashed base) + Clockwise Arcs (R=200 around center 480, 344) -->
  <circle cx="480" cy="344" r="200" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Clockwise Ring Arcs between the 6 stations (center 480,344, R=200) -->
  <!-- S0 (480, 144) -> S1 (653, 244) -->
  <path d="M 592 178 A 200 200 0 0 1 638 222" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#klp-ring)"/>
  <!-- S1 (653, 244) -> S2 (653, 444) -->
  <path d="M 674 294 A 200 200 0 0 1 674 394" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#klp-ring)"/>
  <!-- S2 (653, 444) -> S3 (480, 544) -->
  <path d="M 638 466 A 200 200 0 0 1 592 510" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#klp-ring)"/>
  <!-- S3 (480, 544) -> S4 (307, 444) -->
  <path d="M 368 510 A 200 200 0 0 1 322 466" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#klp-ring)"/>
  <!-- S4 (307, 444) -> S5 (307, 244) -->
  <path d="M 286 394 A 200 200 0 0 1 286 294" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#klp-ring)"/>
  <!-- S5 (307, 244) -> S0 (480, 144) -->
  <path d="M 322 222 A 200 200 0 0 1 368 178" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#klp-ring)"/>

  <!-- Dashed write-back spokes from stations toward central hub (360,292 to 600,396) -->
  <line x1="480" y1="180" x2="480" y2="282" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#klp-spoke)"/>
  <line x1="600" y1="276" x2="544" y2="308" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#klp-spoke)"/>
  <line x1="600" y1="412" x2="544" y2="380" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#klp-spoke)"/>
  <line x1="480" y1="508" x2="480" y2="406" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#klp-spoke)"/>
  <line x1="360" y1="412" x2="416" y2="380" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#klp-spoke)"/>
  <line x1="360" y1="276" x2="416" y2="308" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#klp-spoke)"/>

  <!-- Spoke Labels with opaque white masks -->
  <rect x="444" y="220" width="72" height="16" rx="3" fill="#ffffff"/>
  <text x="480" y="232" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">PRESSURE</text>
  <rect x="444" y="452" width="72" height="16" rx="3" fill="#ffffff"/>
  <text x="480" y="464" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">HOLD STATE</text>

  <!-- Central Hub (w=240, h=104, centered at 480,344) -->
  <g transform="translate(360, 292)">
    <rect x="0" y="0" width="240" height="104" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <text x="120" y="26" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Jetsam 预算与黑匣子中枢</text>
    <text x="120" y="48" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0f172a" text-anchor="middle">B = max(L - A - G - E - S, 352MiB)</text>
    <text x="120" y="68" font-size="10" fill="#475569" text-anchor="middle">uml-stall-watch (50ms 采样)</text>
    <text x="120" y="86" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">uml-session 8 · 19,200B 固定槽</text>
  </g>

  <!-- Station 0 (Top: cx=480, cy=144 -> x=368, y=108, w=224, h=72) -->
  <g transform="translate(368, 108)">
    <rect x="0" y="0" width="224" height="72" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#0f172a">1. 前台全速运行态</text>
    <text x="14" y="42" font-size="10" fill="#334155">物理页 Wired 锁定 · Metal 4 全帧渲染</text>
    <text x="14" y="58" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">CRITICAL PRESSURE → 唤醒冷页裁剪</text>
  </g>

  <!-- Station 1 (Top-Right: cx=704, cy=244 -> x=592, y=208, w=232, h=72) FOCAL CORAL -->
  <g transform="translate(592, 208)">
    <rect x="0" y="0" width="232" height="72" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#be123c">2. 退后台边界与 GPU 门控</text>
    <text x="14" y="42" font-size="10" fill="#334155">关闭 GPU Gate 防 XNU 回收致设备失联</text>
    <text x="14" y="58" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c">set_gpu_hold · ≤2s 排空相机录制流</text>
  </g>

  <!-- Station 2 (Bottom-Right: cx=704, cy=444 -> x=592, y=408, w=232, h=72) -->
  <g transform="translate(592, 408)">
    <rect x="0" y="0" width="232" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#0f172a">3. 客体同步与冷缓存裁剪</text>
    <text x="14" y="42" font-size="10" fill="#334155">管理控制台触发 Guest sync(2) 落盘</text>
    <text x="14" y="58" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">page_cache_trim 释放页并挂起内核</text>
  </g>

  <!-- Station 3 (Bottom: cx=480, cy=544 -> x=368, y=508, w=224, h=72) -->
  <g transform="translate(368, 508)">
    <rect x="0" y="0" width="224" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#0f172a">4. 磁盘锁剥离与 Mach 挂起</text>
    <text x="14" y="42" font-size="10" fill="#334155">释放宿主文件锁防 iOS 后台强杀</text>
    <text x="14" y="58" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">Mach-Suspend vCPU 载体（避开锁临界区）</text>
  </g>

  <!-- Station 4 (Bottom-Left: cx=256, cy=444 -> x=136, y=408, w=232, h=72) -->
  <g transform="translate(136, 408)">
    <rect x="0" y="0" width="232" height="72" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#047857">5. 哈希分片内存休眠</text>
    <text x="14" y="42" font-size="10" fill="#334155">Wired 内存按块哈希落盘至 $TMPDIR</text>
    <text x="14" y="58" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#047857">unlinked file · 逐块释放物理内存足迹</text>
  </g>

  <!-- Station 5 (Top-Left: cx=256, cy=244 -> x=136, y=208, w=232, h=72) -->
  <g transform="translate(136, 208)">
    <rect x="0" y="0" width="232" height="72" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#0f172a">6. 切回前台校验与复原</text>
    <text x="14" y="42" font-size="10" fill="#334155">逐片校验内存哈希并重获磁盘文件锁</text>
    <text x="14" y="58" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">唤醒 Linux 挂起态 · 放行 GPU Gate</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 608)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <line x1="60" y1="20" x2="88" y2="20" stroke="#0284c7" stroke-width="1.6" marker-end="url(#klp-ring)"/>
    <text x="96" y="24" font-size="11" fill="#334155">状态流转</text>
    <line x1="160" y1="20" x2="188" y2="20" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#klp-spoke)"/>
    <text x="196" y="24" font-size="11" fill="#334155">遥测回写</text>
    <rect x="260" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="282" y="24" font-size="11" fill="#334155">防失联门控阶段</text>
    <rect x="380" y="13" width="14" height="14" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="402" y="24" font-size="11" fill="#334155">零足迹休眠阶段</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">SRC: guest_hibernation &amp; stall_watch</text>
  </g>
</svg>
