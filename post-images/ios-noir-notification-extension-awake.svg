<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-notification-extension-awake-title ios-noir-notification-extension-awake-desc" id="ios-noir-notification-extension-awake-root">
        <title id="ios-noir-notification-extension-awake-title">借尸还魂：NotificationServiceExtension 替身静默拉活时序</title>
        <desc id="ios-noir-notification-extension-awake-desc">主 App 被用户上划杀死后，云端下发 mutable-content 推送强行拉起 Extension 独立替身并回传指纹的时序</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-notification-extension-awake-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-notification-extension-awake-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-notification-extension-awake-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-notification-extension-awake-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-notification-extension-awake-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-notification-extension-awake-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- 5 Lifelines -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="130" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="65" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">厂商云端服务器</text>
        </g>
        <line x1="105" y1="52" x2="105" y2="480" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(210, 20)">
          <rect x="0" y="0" width="130" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="65" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">苹果 APNs 推送网关</text>
        </g>
        <line x1="275" y1="52" x2="275" y2="480" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(380, 20)">
          <rect x="0" y="0" width="150" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="75" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">iOS 内核 / SpringBoard</text>
        </g>
        <line x1="455" y1="52" x2="455" y2="480" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(570, 20)">
          <rect x="0" y="0" width="180" height="32" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.06"/>
          <text x="90" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Notification Extension (替身)</text>
        </g>
        <line x1="660" y1="52" x2="660" y2="480" stroke="#bf4520" stroke-opacity="0.3" stroke-dasharray="3 3"/>

        <g transform="translate(790, 20)">
          <rect x="0" y="0" width="130" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="65" y="21" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">主 App (已上划杀死)</text>
        </g>
        <line x1="855" y1="52" x2="855" y2="480" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- Message 1 -->
        <path d="M 105 85 L 270 85" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#ios-noir-notification-extension-awake-arrow)"/>
        <text x="185" y="78" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">1. Push Payload: { "mutable-content": 1 }</text>

        <!-- Message 2 -->
        <path d="M 275 120 L 450 120" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-noir-notification-extension-awake-arrow-link)"/>
        <text x="365" y="113" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">2. APNs 密文信道推送直达 iPhone</text>

        <!-- Kernel Note Box -->
        <g transform="translate(365, 140)">
          <rect x="0" y="0" width="180" height="48" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="90" y="18" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">内核检测：主进程 PID 处于已销毁</text>
          <text x="90" y="34" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">但载荷携带 mutable-content = 1</text>
        </g>

        <!-- Message 3: Kernel spawns Extension -->
        <path d="M 455 210 L 655 210" fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#ios-noir-notification-extension-awake-arrow-accent)"/>
        <text x="555" y="203" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">3. 强行拉起 Extension 独立替身进程！</text>

        <!-- Extension Execution Box -->
        <g transform="translate(560, 230)">
          <rect x="0" y="0" width="200" height="74" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.05"/>
          <text x="100" y="18" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">独立执行特权配额</text>
          <text x="100" y="36" fill="#2d3142" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">· 获得 30 秒独立 CPU 执行配额</text>
          <text x="100" y="52" fill="#2d3142" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">· 拥有全功能网络栈与 Group 沙盒权限</text>
          <text x="100" y="68" fill="#5a6580" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">· 磁盘读取 16~22MB 本地数据缓存</text>
        </g>

        <!-- Message 4: Extension connects back to Cloud -->
        <path d="M 660 330 L 110 330" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-noir-notification-extension-awake-arrow-accent)"/>
        <text x="385" y="323" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">4. 静默向厂商服务器回传设备指纹、暗中同步未读会话</text>

        <!-- Message 5: Extension yields to SpringBoard -->
        <path d="M 660 370 L 460 370" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ios-noir-notification-extension-awake-arrow-link)"/>
        <text x="560" y="363" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">5. 修改通知呈现文本，交付系统弹窗</text>

        <!-- Message 6: Host App completely bypassed -->
        <g transform="translate(740, 400)">
          <rect x="0" y="0" width="180" height="48" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="90" y="20" fill="#5a6580" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">主程序全过程未启动、未亮屏</text>
          <text x="90" y="36" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">用户浑然不觉后台数据已完成泄露</text>
        </g>
      </svg>
