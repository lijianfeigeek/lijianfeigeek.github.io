<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-cqrs-service-architecture-title ota-cqrs-service-architecture-desc">
  <title id="ota-cqrs-service-architecture-title">读写分离（CQRS）双层服务微架构类图</title>
  <desc id="ota-cqrs-service-architecture-desc">展示应用层重型 Actor 负责下载落盘，与模块层轻量无状态结构体无锁直出的并发分工体系</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="320" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Heavy Actor on App Level (Write Path) -->
  <g transform="translate(24, 20)">
    <rect width="440" height="280" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="32" rx="8" fill="#f3f4f6"/>
    <path d="M0 24 h440 v8 h-440 z" fill="#f3f4f6"/>
    <text x="16" y="21" class="label-title">写入端：OTALocalizationService（应用壳工程 Actor）</text>

    <g transform="translate(16, 44)">
      <rect width="408" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="22" class="text-code" font-weight="600" fill="#1e40af">protocol OTALocalizationServicing: Actor {</text>
      <text x="12" y="38" class="text-code">  func start() async</text>
      <text x="12" y="52" class="text-code">  func deleteAllBundles() async</text>
      <text x="12" y="58" class="text-code">}</text>
    </g>

    <g transform="translate(16, 114)">
      <rect width="408" height="136" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="24" class="label-title" font-size="12">重型任务完全隔离在后台：</text>
      <text x="12" y="46" class="text-code">• 仅在 App 壳工程注入注册</text>
      <text x="12" y="66" class="text-code">• 唯一触碰网络与文件系统写入</text>
      <text x="12" y="86" class="text-code">• 封装 ZIP 校验、原子替换与自愈状态机</text>
      <text x="12" y="106" class="text-code">• 30+ 个业务模块对其完全无感（零强耦合）</text>
      <text x="12" y="124" class="text-code">• 异步落盘后触发主线程刷新</text>
    </g>
  </g>

  <!-- Connectors -->
  <g transform="translate(464, 140)">
    <path d="M 0 20 L 32 20" fill="none" stroke="#bf4520" stroke-width="2"/>
    <polygon points="32,16 40,20 32,24" fill="#bf4520"/>
    <rect x="-8" y="-12" width="48" height="20" rx="3" fill="#fff7ed"/>
    <text x="16" y="2" text-anchor="middle" class="text-code" font-size="10" fill="#9a3412">触发载入</text>
  </g>

  <!-- Right: Stateless Struct on Module Level (Read Path) -->
  <g transform="translate(496, 20)">
    <rect width="440" height="280" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="32" rx="8" fill="#fff7ed"/>
    <path d="M0 24 h440 v8 h-440 z" fill="#fff7ed"/>
    <text x="16" y="21" class="label-title" fill="#9a3412">读取端：OTALocalizedString（业务模块纯同步只读入口）</text>

    <g transform="translate(16, 44)">
      <rect width="408" height="96" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="22" class="text-code" font-weight="600" fill="#065f46">public struct OTALocalizedString {</text>
      <text x="12" y="38" class="text-code" fill="#047857">  @MainActor public static func loadBundlesFromDisk()</text>
      <text x="12" y="54" class="text-code" fill="#047857">  @MainActor public static func clearBundleCache()</text>
      <text x="12" y="70" class="text-code" font-weight="600" fill="#bf4520">  public static func bundle(for name: String) -&gt; Bundle?</text>
      <text x="12" y="86" class="text-code" fill="#065f46">}</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="408" height="100" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="label-title" font-size="12" fill="#9a3412">极速热路径上的 nonisolated(unsafe) 并发优化：</text>
      <text x="12" y="44" class="text-code" fill="#7c2d12">• 冷启构建调用数万次，绝不能受 async 传染</text>
      <text x="12" y="62" class="text-code" fill="#7c2d12">• 保持与 NSLocalizedString 完全同步</text>
      <text x="12" y="80" class="text-code" fill="#7c2d12">• 写入 100% 局限于 @MainActor，读路径无锁直出 (纳秒级)</text>
    </g>
  </g>
</svg>