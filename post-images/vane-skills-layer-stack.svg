<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="504" viewBox="0 0 920 504" role="img" aria-labelledby="vls-title vls-desc" id="vane-skills-layer-stack-root">
  <title id="vls-title">Vane GPT Image Skills 五层工程化架构栈</title>
  <desc id="vls-desc">展示 vane-gpt-image-skills 仓库如何将表面上的 AI 生图 Prompt 集合组织为五层确定性工程栈：从分发更新层、工作流契约层、双参考视觉锚点层、本地 Python 后处理层到质量验收与单测层。</desc>
  <defs>
    <style>
      #vane-skills-layer-stack-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="vls-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.26"/>
    </pattern>
    <marker id="vls-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="920" height="504" fill="#f8fafc"/>
  <rect width="920" height="504" fill="url(#vls-dots)"/>

  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">Vane GPT Image Skills Five-Layer Engineering Stack</text>
  <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">6 SKILLS · 1,196 LOC PYTHON + UNITTESTS · DUAL-REFERENCE GROUNDING · DETERMINISTIC POST-PROCESSING</text>

  <!-- Left axis direction indicator -->
  <line x1="76" y1="84" x2="76" y2="412" stroke="#475569" stroke-width="1.4" marker-end="url(#vls-arrow)"/>
  <text x="64" y="240" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569">EXECUTION</text>
  <text x="64" y="254" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">INSTALL TO GATE</text>

  <!-- L5 -->
  <g transform="translate(128, 72)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="104" height="28" rx="4" fill="#f1f5f9"/>
    <text x="68" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L5 · DISPATCH</text>
    <text x="140" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">原子分发、SHA-256 指纹与 Git 溯源更新层</text>
    <text x="140" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">install_skills.py 零覆盖预检 · update_skills.py 临时 Stage + os.replace + 自动备份</text>
    <rect x="604" y="20" width="140" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="674" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">scripts/*_skills.py</text>
  </g>

  <!-- L4 -->
  <g transform="translate(128, 148)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="104" height="28" rx="4" fill="#f1f5f9"/>
    <text x="68" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L4 · CONTRACT</text>
    <text x="140" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">六大垂直场景 Skill 指令契约与触发护栏</text>
    <text x="140" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">表情包 / 电影海报 / 书页电影 / 微信红包 / 宠物写真 / 小红书 · 强制 Preview-First 闸门</text>
    <rect x="604" y="20" width="140" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="674" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">SKILL.md + evals.json</text>
  </g>

  <!-- L3 Focal -->
  <g transform="translate(128, 224)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="16" y="18" width="104" height="28" rx="4" fill="#bf4520"/>
    <text x="68" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#ffffff">L3 · GROUNDING</text>
    <text x="140" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">视觉锚点矩阵与双参考角色正交解耦层</text>
    <text x="140" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">36 海报版式 + 36 红包风格 + 彩色风格基准图 (Style) / 灰度九宫格骨架 (Layout) / 用户原图 (Identity)</text>
    <rect x="604" y="20" width="140" height="24" rx="4" fill="#fff7ed" stroke="#bf4520" stroke-width="0.8"/>
    <text x="674" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#bf4520">assets/ + STYLE.md</text>
  </g>

  <!-- L2 -->
  <g transform="translate(128, 300)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="104" height="28" rx="4" fill="#f1f5f9"/>
    <text x="68" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L2 · RUNTIME</text>
    <text x="140" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Pillow 确定性像素裁剪、GIF 量化与体积搜索工具链</text>
    <text x="140" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">export_frames.py (255 色共享调色板) · cover_tool.py (957x1278 &lt;=500KB) · fit_white_canvas.py (3:4)</text>
    <rect x="604" y="20" width="140" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="674" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">Pillow + FFmpeg</text>
  </g>

  <!-- L1 -->
  <g transform="translate(128, 376)">
    <rect x="0" y="0" width="760" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="18" width="104" height="28" rx="4" fill="#f1f5f9"/>
    <text x="68" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L1 · VERIFY</text>
    <text x="140" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">反幻觉质量门禁、诚实性审计与自动化单元测试</text>
    <text x="140" y="47" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">禁止切片冒充高清 · 3*h == 4*w 像素验收 · 13 项 unittest 全过 · 诚实边界记录</text>
    <rect x="604" y="20" width="140" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="674" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">tests/ + docs/testing.md</text>
  </g>

  <!-- Legend -->
  <line x1="32" y1="458" x2="888" y2="458" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 476)">
    <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="76" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="98" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">焦点架构层：把隐式美学经验编码为可注入模型上下文的视觉资产与双参考约束</text>
    <rect x="572" y="-8" width="14" height="14" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="594" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">确定性脚本、工作流契约与验收层</text>
