<svg width="960" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="sw-vpn-title sw-vpn-desc">
  <title id="sw-vpn-title">Swipt 环回 VPN 与 CoreDevice 虚拟配对全链路时序</title>
  <desc id="sw-vpn-desc">解密为什么 iOS 必须依赖 10.7.0.1 环回 VPN 绕过沙盒限制，建立 TLS-PSK 加密隧道与 DTX 多路复用服务。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .lane-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .lane-subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #64748b; }
    .step-badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .step-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .alert-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #991b1b; }
    .line { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
    .arrow-red { stroke: #ef4444; stroke-width: 2; fill: none; }
    .arrow-blue { stroke: #3b82f6; stroke-width: 2; fill: none; }
    .arrow-green { stroke: #10b981; stroke-width: 2; fill: none; }
    .arrow-purple { stroke: #8b5cf6; stroke-width: 2; fill: none; }
  </style>

  <rect width="960" height="520" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">CoreDevice 环回隧道：10.7.0.1 虚拟路由反射与配对全链路</text>
    <text class="subtitle" x="0" y="20">破解 Apple remotepairingd 环回死锁缺陷，在纯端内无越狱环境构建底层服务桥梁</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- Col 1: Swipt Client -->
  <g transform="translate(48, 84)">
    <rect width="186" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text class="lane-title" x="93" y="20" text-anchor="middle">Swipt (Go Core)</text>
    <text class="lane-subtitle" x="93" y="34" text-anchor="middle">libswipt / CoreDevice</text>
    <line class="line" x1="93" y1="44" x2="93" y2="400"/>
  </g>

  <!-- Col 2: TUN Interface -->
  <g transform="translate(274, 84)">
    <rect width="186" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text class="lane-title" x="93" y="20" text-anchor="middle" fill="#1e40af">TUN 环回虚拟网卡</text>
    <text class="lane-subtitle" x="93" y="34" text-anchor="middle" fill="#2563eb">10.7.0.1 / sing-box</text>
    <line class="line" x1="93" y1="44" x2="93" y2="400"/>
  </g>

  <!-- Col 3: Darwin Kernel -->
  <g transform="translate(500, 84)">
    <rect width="186" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text class="lane-title" x="93" y="20" text-anchor="middle">iOS 协议栈 (Darwin)</text>
    <text class="lane-subtitle" x="93" y="34" text-anchor="middle">BSD Sockets / Routing</text>
    <line class="line" x1="93" y1="44" x2="93" y2="400"/>
  </g>

  <!-- Col 4: remotepairingd -->
  <g transform="translate(726, 84)">
    <rect width="186" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text class="lane-title" x="93" y="20" text-anchor="middle" fill="#991b1b">remotepairingd</text>
    <text class="lane-subtitle" x="93" y="34" text-anchor="middle" fill="#b91c1c">CoreDevice Daemon</text>
    <line class="line" x1="93" y1="44" x2="93" y2="400"/>
  </g>

  <!-- Step 1: Red failure path (127.0.0.1 deadlock) -->
  <g transform="translate(48, 146)">
    <rect width="864" height="52" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <circle cx="28" cy="26" r="12" fill="#ef4444"/>
    <text class="step-badge" x="28" y="30" text-anchor="middle">1</text>
    <text class="alert-text" x="52" y="20">死锁阻断：直连 127.0.0.1 触发 ErrLoopbackAddress 异常</text>
    <text class="step-desc" x="52" y="36">Apple remotepairingd 针对回环地址缺乏安全隧道处理逻辑，直连会导致守护进程彻底崩溃死锁</text>
  </g>

  <!-- Step 2: TUN Routing Reflection -->
  <g transform="translate(48, 214)">
    <rect width="864" height="54" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <circle cx="28" cy="27" r="12" fill="#3b82f6"/>
    <text class="step-badge" x="28" y="31" text-anchor="middle">2</text>
    <text class="step-text" x="52" y="21">路由反射：请求定向至 10.7.0.1 并由 TUN 虚拟接口伪装回环</text>
    <text class="step-desc" x="52" y="37">sing-box / LocalDevVPN 截获 10.7.0.1 报文，伪装为外部独立虚拟接口，重新注入 Darwin 协议栈</text>
  </g>

  <!-- Step 3: SRP Authentication -->
  <g transform="translate(48, 284)">
    <rect width="864" height="54" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="28" cy="27" r="12" fill="#10b981"/>
    <text class="step-badge" x="28" y="31" text-anchor="middle">3</text>
    <text class="step-text" x="52" y="21">凭证握手：基于 .mobiledevicepairing 凭证完成 SRP 挑战应答</text>
    <text class="step-desc" x="52" y="37">双方验证主机证书与公钥身份，协商生成动态对称密钥，规避物理 USB 数据线与 Mac 依赖</text>
  </g>

  <!-- Step 4: TLS-PSK Tunnel &amp; DTX Multiplexing -->
  <g transform="translate(48, 354)">
    <rect width="864" height="54" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <circle cx="28" cy="27" r="12" fill="#8b5cf6"/>
    <text class="step-badge" x="28" y="31" text-anchor="middle">4</text>
    <text class="step-text" x="52" y="21">隧道就绪：建立 TLS-PSK 管道并开放 RSD / DTX 多路复用服务</text>
    <text class="step-desc" x="52" y="37">在端侧建立专用 WireGuard 级传输信道，全面挂载 Accessibility、HID、SpringBoard RPC 会话</text>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(48, 434)">
    <rect width="864" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text class="card-body" x="16" y="26">核心成果：无需越狱、无需 Mac 常驻、无需外接数据线，iOS 设备首次在纯端内获得系统级自省与自动化控制权</text>
  </g>
</svg>