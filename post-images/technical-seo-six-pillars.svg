<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="technical-seo-six-pillars-title technical-seo-six-pillars-desc" id="technical-seo-six-pillars-root">
        <title id="technical-seo-six-pillars-title">搜索引擎对话协议：技术 SEO 六大底层工程把控基石</title>
        <desc id="technical-seo-six-pillars-desc">Robots.txt、Noindex、XML Sitemap、Canonical 规范化、301 权重继承与 Schema JSON-LD</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #technical-seo-six-pillars-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #technical-seo-six-pillars-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #technical-seo-six-pillars-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="technical-seo-six-pillars-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="technical-seo-six-pillars-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="technical-seo-six-pillars-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <g transform="translate(40, 30)">
          <rect x="0" y="0" width="270" height="145" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">01 · Robots.txt 访问控制</text>
          <text x="12" y="52" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">抓取访问边界防火墙</text>
          <text x="12" y="74" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">禁止爬虫访问管理后台与私有 API</text>
          <text x="12" y="94" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">节约有限的 Googlebot 抓取预算</text>
          <text x="12" y="122" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">注意：被 Disallow 不等于不会被索引</text>
        </g>

        <g transform="translate(345, 30)">
          <rect x="0" y="0" width="270" height="145" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">02 · Noindex 索引隔离</text>
          <text x="12" y="52" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">从搜索引擎彻底隐形</text>
          <text x="12" y="74" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">针对感谢页、登录页、内部草稿</text>
          <text x="12" y="94" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">允许爬虫抓取但坚决不编入索引库</text>
          <text x="12" y="122" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">严禁同时在 robots.txt 中屏蔽！</text>
        </g>

        <g transform="translate(650, 30)">
          <rect x="0" y="0" width="270" height="145" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="270" height="28" rx="6" fill="#bf4520" fill-opacity="0.08"/>
          <text x="12" y="19" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">03 · XML Sitemap 主动递交 (FOCAL)</text>
          <text x="12" y="52" fill="#bf4520" font-family="'Geist', sans-serif" font-size="13" font-weight="600">全站内容精准地址簿</text>
          <text x="12" y="74" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">包含准确真实的 lastmod 修改时间戳</text>
          <text x="12" y="94" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">支持自动与 IndexNow 秒级直推</text>
          <text x="12" y="122" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">整站内容更新的官方广播站</text>
        </g>

        <g transform="translate(40, 200)">
          <rect x="0" y="0" width="270" height="145" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">04 · Canonical 规范化收敛</text>
          <text x="12" y="52" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">防权重分散与内容重复</text>
          <text x="12" y="74" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">收敛带 UTM 参数、筛选过滤 URL</text>
          <text x="12" y="94" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">强制将所有变体权重汇聚到权威主 URL</text>
          <text x="12" y="122" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">每篇博文均须自指向 Canonical</text>
        </g>

        <g transform="translate(345, 200)">
          <rect x="0" y="0" width="270" height="145" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">05 · 301 永久重定向</text>
          <text x="12" y="52" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">无缝继承历史积累权重</text>
          <text x="12" y="74" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">发生 URL 调整、Slug 规范化修改时</text>
          <text x="12" y="94" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">实现 95%+ 页面权重与外链平滑转移</text>
          <text x="12" y="122" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">严禁出现连环重定向链路 (Redirect Chain)</text>
        </g>

        <g transform="translate(650, 200)">
          <rect x="0" y="0" width="270" height="145" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="6" fill="#f8f9fa"/>
          <text x="12" y="19" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">06 · Schema 结构化数据</text>
          <text x="12" y="52" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">直接注入丰富搜索结果富摘要</text>
          <text x="12" y="74" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">注入 SoftwareApplication / FAQPage</text>
          <text x="12" y="94" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">在 SERP 抢占星级评分与问答下拉框</text>
          <text x="12" y="122" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">大幅提升搜索结果展示点击率 (CTR)</text>
        </g>
      </svg>
