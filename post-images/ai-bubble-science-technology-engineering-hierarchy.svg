<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-science-technology-engineering-hierarchy-title ai-bubble-science-technology-engineering-hierarchy-desc">
  <title id="ai-bubble-science-technology-engineering-hierarchy-title">科技角逐三级跃迁：科学、技术与工程的战略分工</title>
  <desc id="ai-bubble-science-technology-engineering-hierarchy-desc">展示从科学基础理论发现（美国领先），到技术样品与产品化（美欧擅长），再到工程规模化制造与极速降本（中国绝对统治）的全球分工</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="hier-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="280" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Level 1: Science -->
  <g transform="translate(40, 30)">
    <rect width="260" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#0284c7"/>
    <text x="20" y="32" class="label-badge" fill="#0284c7">层级 1 · 基础源头</text>
    <text x="20" y="58" class="label-title">科学 (Science)</text>
    <text x="20" y="78" class="text-body">基础理论发现 · 0 到 1 拓荒</text>
    <line x1="20" y1="92" x2="240" y2="92" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✦ 美国高校与国家实验室主导</text>
      <text x="0" y="24" class="text-feat">✦ 纯数学、量子力学、生物密码</text>
      <text x="0" y="48" class="text-feat">✦ 高度依赖百年自由探索学术沉淀</text>
      <text x="0" y="76" class="text-body" fill="#64748b">“发现客观自然未知的运行法则”</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 312 140 L 338 140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#hier-arrow)"/>

  <!-- Level 2: Technology -->
  <g transform="translate(350, 30)">
    <rect width="260" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#64748b"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">层级 2 · 原型转化</text>
    <text x="20" y="58" class="label-title">技术 (Technology)</text>
    <text x="20" y="78" class="text-body">样品制造 · 1 到 10 产品化</text>
    <line x1="20" y1="92" x2="240" y2="92" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat">✦ 美欧硅谷创投孵化器擅长</text>
      <text x="0" y="24" class="text-feat">✦ 将理论转化成 Demo 与专利原型</text>
      <text x="0" y="48" class="text-feat">✦ 验证商业与物理可行性</text>
      <text x="0" y="76" class="text-body" fill="#64748b">“做出能跑通的第一个原型样机”</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 622 140 L 648 140" stroke="#bf4520" stroke-width="1.5" marker-end="url(#hier-arrow)"/>

  <!-- Level 3: Engineering (Focal) -->
  <g transform="translate(660, 30)">
    <rect width="260" height="220" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">层级 3 · 规模普及</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">工程 (Engineering)</text>
    <text x="20" y="78" class="text-body" fill="#9a3412">规模制造 · 10 到 10000 降本</text>
    <line x1="20" y1="92" x2="240" y2="92" stroke="#fed7aa" stroke-width="1"/>
    <g transform="translate(20, 110)">
      <text x="0" y="0" class="text-feat" fill="#9a3412">✦ 中国制造全产业链绝对统治</text>
      <text x="0" y="24" class="text-feat" fill="#9a3412">✦ 成本削减 90%，普及至下沉菜市</text>
      <text x="0" y="48" class="text-feat" fill="#9a3412">✦ 繁荣取决于使用技术的“深度”</text>
      <text x="0" y="76" class="text-body" fill="#9a3412" style="font-weight: 600;">“中科技、高设计、强工程全球突围”</text>
    </g>
  </g>
</svg>