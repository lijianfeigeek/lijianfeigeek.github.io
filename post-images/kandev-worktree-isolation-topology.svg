<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-worktree-isolation-topology-title kandev-worktree-isolation-topology-desc" id="kandev-worktree-isolation-topology-root">
      <title id="kandev-worktree-isolation-topology-title">基于 Git Worktree 的多智能体物理工作区隔离拓扑</title>
      <desc id="kandev-worktree-isolation-topology-desc">底层共享只读 Git 对象库与引用，顶层独立展开物理分支目录，实现零冗余与无锁并发</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-worktree-isolation-topology-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-worktree-isolation-topology-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-worktree-isolation-topology-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-worktree-isolation-topology-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-worktree-isolation-topology-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-worktree-isolation-topology-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-worktree-isolation-topology-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Top Shared Bare Repo -->
        <g transform="translate(180, 30)">
          <rect x="0" y="0" width="600" height="85" rx="8" fill="#f8f9fa" stroke="#2d3142" stroke-width="1.2" stroke-opacity="0.2"/>
          <rect x="0" y="0" width="600" height="26" rx="8" fill="#2d3142" fill-opacity="0.06"/>
          <text x="16" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">SHARED GIT BARE REPOSITORY (共享底层存储)</text>
          
          <g transform="translate(16, 38)">
            <rect x="0" y="0" width="270" height="34" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="10" y="21" font-size="11" font-weight="600" fill="#2d3142">.git/objects (只读共享历史与 Commit 对象)</text>
          </g>

          <g transform="translate(305, 38)">
            <rect x="0" y="0" width="275" height="34" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
            <text x="10" y="21" font-size="11" font-weight="600" fill="#2d3142">.git/refs (统一分支引用与标签元数据)</text>
          </g>
        </g>

        <!-- Downward Fork Connectors -->
        <path d="M 330 115 L 330 150 Q 330 160 320 160 L 170 160 Q 160 160 160 170 L 160 185" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-worktree-isolation-topology-arrow-default)" opacity="0.6"/>
        <path d="M 480 115 L 480 185" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#kandev-worktree-isolation-topology-arrow-accent)"/>
        <path d="M 630 115 L 630 150 Q 630 160 640 160 L 790 160 Q 800 160 800 170 L 800 185" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-worktree-isolation-topology-arrow-default)" opacity="0.6"/>

        <!-- Task Worktree 1 -->
        <g transform="translate(30, 185)">
          <rect x="0" y="0" width="270" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="8" fill="#f8f9fa"/>
          <text x="12" y="19" font-size="11" font-weight="600" fill="#2d3142" class="mono">TASK-101: OAUTH2 REFACTOR</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">物理目录: .kandev/wt/task-101</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 检出分支: feature/oauth2-refactor</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 独立依赖锁与 node_modules 缓存</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• Agent 1 独占修改，无锁运行</text>
          <text x="12" y="142" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">状态: 编码中 (Work)</text>
        </g>

        <!-- Task Worktree 2 (Focal) -->
        <g transform="translate(345, 185)">
          <rect x="0" y="0" width="270" height="160" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="270" height="28" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="19" font-size="11" font-weight="600" fill="#bf4520" class="mono">TASK-102: MEMORY LEAK FIX (FOCAL)</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#bf4520">物理目录: .kandev/wt/task-102</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 检出分支: fix/memory-leak-goroutine</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.8">• 独立运行 pprof 内存采样分析</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.8">• 编译崩溃完全不污染其他任务目录</text>
          <text x="12" y="142" font-size="11" font-weight="700" fill="#bf4520" class="mono">状态: 审查门禁 (Review)</text>
        </g>

        <!-- Task Worktree 3 -->
        <g transform="translate(660, 185)">
          <rect x="0" y="0" width="270" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="28" rx="8" fill="#f8f9fa"/>
          <text x="12" y="19" font-size="11" font-weight="600" fill="#2d3142" class="mono">TASK-103: STRIPE CHECKOUT V2</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">物理目录: .kandev/wt/task-103</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 检出分支: feat/stripe-webhook-v2</text>
          <text x="12" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 独立部署测试 Mock 服务与端口</text>
          <text x="12" y="114" font-size="11" fill="#2d3142" fill-opacity="0.7">• 零存储冗余，共用底层对象库</text>
          <text x="12" y="142" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">状态: 黑盒验证 (QA)</text>
        </g>
      </g>
    </svg>
