<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cloudn-stack-title cloudn-stack-desc" id="cloudn-zero-dependency-swift-stack-root">
      <title id="cloudn-stack-title">Cloudn 零第三方依赖五层技术堆栈</title>
      <desc id="cloudn-stack-desc">展示 Cloudn 从 SwiftUI 与系统扩展层到底层纯 Swift 密码学与传输原语的五层架构，以及 iOS 应用层与可独立在 Linux 编译测试的 CloudnKit 核心边界。</desc>
      <defs>
      <style>#cloudn-zero-dependency-swift-stack-root { font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #0f172a; }
      #cloudn-zero-dependency-swift-stack-root .diagram-container { width: 100%; overflow-x: auto; }</style>
        <pattern id="cloudn-zero-dependency-swift-stack-dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
        </pattern>
      </defs>

      <rect width="1000" height="540" fill="#f8fafc"/>
      <rect width="1000" height="540" fill="url(#cloudn-zero-dependency-swift-stack-dots)" opacity="0.6"/>

      <!-- Header -->
      <text x="48" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">LAYER STACK · ZERO EXTERNAL PACKAGES · 59,226 LOC PURE SWIFT</text>
      <text x="48" y="64" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">Cloudn 零外部依赖五层技术堆栈</text>

      <!-- Left Abstraction Direction Rail -->
      <text x="48" y="96" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">IOS UI</text>
      <line x1="68" y1="108" x2="68" y2="448" stroke="#94a3b8" stroke-width="1.2"/>
      <polygon points="64,112 72,112 68,104" fill="#475569"/>
      <polygon points="64,444 72,444 68,452" fill="#475569"/>
      <text x="48" y="468" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LINUX</text>

      <!-- Platform Boundary Brackets (Right Margin) -->
      <line x1="944" y1="96" x2="956" y2="96" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="956" y1="96" x2="956" y2="232" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="944" y1="232" x2="956" y2="232" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="964" y="168" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.1em">iOS 17+</text>

      <line x1="944" y1="244" x2="956" y2="244" stroke="#bf4520" stroke-width="1.2"/>
      <line x1="956" y1="244" x2="956" y2="456" stroke="#bf4520" stroke-width="1.2"/>
      <line x1="944" y1="456" x2="956" y2="456" stroke="#bf4520" stroke-width="1.2"/>
      <text x="964" y="346" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">CORE</text>
      <text x="964" y="360" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">PKG</text>

      <!-- L5: UI & System Extensions -->
      <g transform="translate(108, 96)">
        <rect x="0" y="0" width="824" height="64" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="20" y="26" fill="#475569" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L5</text>
        <text x="20" y="44" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">SURFACE</text>
        <text x="116" y="28" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">SwiftUI 交互壳层与系统扩展</text>
        <text x="116" y="48" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">iPad 侧栏 · 链接拖放 · Share 分享扩展 · 灵动岛 Live Activity</text>
        <text x="804" y="36" fill="#0284c7" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">Cloudn / CloudnShare / CloudnWidget</text>
      </g>

      <!-- L4: iOS System Adapters & Orchestration -->
      <g transform="translate(108, 168)">
        <rect x="0" y="0" width="824" height="64" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="20" y="26" fill="#475569" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L4</text>
        <text x="20" y="44" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ADAPTER</text>
        <text x="116" y="28" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">端侧沙盒适配与系统服务编排</text>
        <text x="116" y="48" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">Keychain 多账号轮换 · URLSession 后台接管 · 隐藏 WKWebView · LivePhoto</text>
        <text x="804" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">AppModel / AccountVault / MSERecorder</text>
      </g>

      <!-- L3: Core Engines (FOCAL LAYER - Coral Accent) -->
      <g transform="translate(108, 244)">
        <rect x="0" y="0" width="824" height="68" rx="4" fill="#fff5f2" stroke="#bf4520" stroke-width="1.5"/>
        <text x="20" y="28" fill="#bf4520" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L3</text>
        <text x="20" y="46" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ENGINE</text>
        <text x="116" y="30" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">CloudnKit 核心并发调度与解析引擎</text>
        <text x="116" y="50" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">14+ 网盘临时转存直链 · 50 平台路由竞速 · 弹性分片窃取 · BT PeerSwarm</text>
        <text x="804" y="38" fill="#bf4520" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">DownloadEngine / RangeTransfer / TorrentSwarm</text>
      </g>

      <!-- L2: Protocol, Remuxing & JS Solver -->
      <g transform="translate(108, 320)">
        <rect x="0" y="0" width="824" height="64" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="20" y="26" fill="#475569" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L2</text>
        <text x="20" y="44" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">CODEC</text>
        <text x="116" y="28" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">无 FFmpeg 纯 Swift 容器转封装与 JS 挑战求解</text>
        <text x="116" y="48" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">流式 EBML/TS → 标准 MP4 (avcC/hvcC/elst) · fMP4/WebM 切段 · YouTube EJS</text>
        <text x="804" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">TSRemuxer / MKVRemuxer / YouTubeSignature</text>
      </g>

      <!-- L1: Crypto, Hashing & Binary Wire -->
      <g transform="translate(108, 392)">
        <rect x="0" y="0" width="824" height="64" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
        <text x="20" y="26" fill="#475569" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L1</text>
        <text x="20" y="44" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">PRIMITIVE</text>
        <text x="116" y="28" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">零依赖密码学、压缩算法与二进制协议原语</text>
        <text x="116" y="48" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">Secp256k1 雅可比点乘 · EC115 P-224 + LZ4Block · ISAAC64 · Bencode / BEP 5/9/15</text>
        <text x="804" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">Secp256k1 / EC115 / WxChannelsISAAC64 / Bencode</text>
      </g>

      <!-- Bottom Editorial Note -->
      <line x1="108" y1="480" x2="932" y2="480" stroke="#cbd5e1" stroke-width="1"/>
      <text x="108" y="502" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ARCHITECTURAL BOUNDARY</text>
      <text x="276" y="502" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">L1–L3 全部收口在纯 Swift Package（CloudnKit）中，脱离 UIKit 在 Linux 容器内直接跑通 699 项单元测试。</text>
    </svg>
