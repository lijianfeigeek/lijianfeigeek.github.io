<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="singapore-pr-rep-180-day-sequence-title singapore-pr-rep-180-day-sequence-desc">
  <title id="singapore-pr-rep-180-day-sequence-title">2025/2026 REP 180 天严苛新规境外失效与法律救济时序</title>
  <desc id="singapore-pr-rep-180-day-sequence-desc">时序展示持PR者在境外REP过期后180天法定倒计时、续期审核与超期系统自动吊销永久居留权的法律机制</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">新加坡 REP 180 天出境失效与法律救济时序机制 (2025/2026 新规)</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">彻底堵死行政缓冲漏洞：境外超期 180 天未处理，系统自动注销 PR 身份且不可逆</text>

  <!-- Lifelines -->
  <g transform="translate(140, 80)">
    <rect width="140" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="70" y="20" class="actor-title" text-anchor="middle">PR 持卡人 (境外)</text>
    <line x1="70" y1="32" x2="70" y2="255" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(410, 80)">
    <rect width="140" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="70" y="20" class="actor-title" text-anchor="middle">新加坡边境法定时序</text>
    <line x1="70" y1="32" x2="70" y2="255" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(680, 80)">
    <rect width="140" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="70" y="20" class="actor-title" text-anchor="middle">移民与关卡局 (ICA)</text>
    <line x1="70" y1="32" x2="70" y2="255" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Event 1: Expire -->
  <g transform="translate(0, 130)">
    <line x1="210" y1="0" x2="475" y2="0" stroke="#f87171" stroke-width="1.5"/>
    <polygon points="475,-4 485,0 475,4" fill="#f87171"/>
    <rect x="235" y="-12" width="220" height="22" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="345" y="3" class="text-sub" fill="#b91c1c" text-anchor="middle">身处境外，再入境许可证 REP 到期失效</text>
  </g>

  <!-- Event 2: Start 180-day countdown -->
  <g transform="translate(345, 160)">
    <rect width="270" height="26" rx="4" fill="#ffedd5" stroke="#fdba74" stroke-width="1"/>
    <text x="135" y="17" class="badge-coral" text-anchor="middle">⏱️ 启动 180 天法定救济倒计时 (不可中断)</text>
  </g>

  <!-- Branch A: Within 180 days -->
  <g transform="translate(0, 205)">
    <line x1="210" y1="0" x2="745" y2="0" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="745,-4 755,0 745,4" fill="#0284c7"/>
    <rect x="360" y="-12" width="240" height="22" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="480" y="3" class="text-sub" fill="#0369a1" text-anchor="middle">分支 A: 180天内在线递交续签与本地纳税/工作佐证</text>
  </g>

  <!-- Result A -->
  <g transform="translate(0, 235)">
    <line x1="750" y1="0" x2="215" y2="0" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="215,-4 205,0 215,4" fill="#047857"/>
    <rect x="330" y="-12" width="300" height="22" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="480" y="3" class="text-sub" fill="#047857" text-anchor="middle">审核通过批复 1~5 年 REP；若被拒次日立即丧失居留权</text>
  </g>

  <!-- Branch B: Over 180 days (Focal Coral) -->
  <g transform="translate(0, 280)">
    <rect x="140" y="0" width="680" height="48" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="140" y="0" width="680" height="22" rx="8" fill="#ffedd5"/>
    <text x="480" y="15" class="badge-coral" text-anchor="middle">分支 B：超过 180 天未采取行动 ➡️ 期限结束次日，系统自动依法永久注销 PR 身份！</text>
    <text x="480" y="36" class="text-sub" text-anchor="middle">期间即便持卡人肉身直接飞回新加坡樟宜机场，法律上亦无法自动恢复，丧失居留权不可逆</text>
  </g>
</svg>