<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-background-download-lifecycle-state-machine-title ota-background-download-lifecycle-state-machine-desc">
  <title id="ota-background-download-lifecycle-state-machine-title">前台预热拉取与冷启统一生效生命周期状态机</title>
  <desc id="ota-background-download-lifecycle-state-machine-desc">展示冷启动零网络阻塞直接渲染UI，前台异步拉取写入磁盘并在下次冷启生效的不对称生命周期</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Cold Start Phase -->
  <g transform="translate(24, 20)">
    <rect width="360" height="300" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="32" rx="8" fill="#f3f4f6"/>
    <path d="M0 24 h360 v8 h-360 z" fill="#f3f4f6"/>
    <text x="16" y="21" class="label-title">阶段一：冷启动瞬时挂载 (零网络阻塞)</text>

    <!-- State 1: App Launched -->
    <g transform="translate(16, 46)">
      <rect width="328" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">1. App 冷启动触发 (didFinishLaunching)</text>
      <text x="12" y="38" class="text-code">首个视图渲染前执行极早初始化</text>
    </g>

    <path d="M 180 96 L 180 114" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="177,114 183,114 180,120" fill="#9ca3af"/>

    <!-- State 2: Load Memory -->
    <g transform="translate(16, 120)">
      <rect width="328" height="66" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12" fill="#166534">2. OTALocalizedString.loadBundlesFromDisk()</text>
      <text x="12" y="38" class="text-code" fill="#15803d">从磁盘加载已落盘的 Bundle 实例到内存缓存</text>
      <text x="12" y="54" class="text-code" fill="#15803d">耗时几毫秒，无网络 RTT 损耗</text>
    </g>

    <path d="M 180 186 L 180 204" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="177,204 183,204 180,210" fill="#10b981"/>

    <!-- State 3: Render UI -->
    <g transform="translate(16, 210)">
      <rect width="328" height="66" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">3. 首屏视图渲染呈现 (Render UI)</text>
      <text x="12" y="38" class="text-code">业务模块通过 .localizationBundle 直接取词</text>
      <text x="12" y="54" class="text-code">UI 零白屏、零加载菊花、体验丝滑</text>
    </g>
  </g>

  <!-- Connectors from UI Render to Background Cycle -->
  <path d="M 384 243 L 424 243 L 424 170 L 460 170" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="460,167 466,170 460,173" fill="#bf4520"/>
  <text x="424" y="225" text-anchor="middle" class="text-code" fill="#9a3412">后台异步派发</text>

  <!-- Right: Background Cycle Container (Coral Accent) -->
  <g transform="translate(466, 20)">
    <rect width="470" height="300" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="470" height="32" rx="8" fill="#fff7ed"/>
    <path d="M0 24 h470 v8 h-470 z" fill="#fff7ed"/>
    <text x="16" y="21" class="label-title" fill="#9a3412">阶段二：前台异步预热拉取 (Background Cycle)</text>

    <!-- Sub Process 1 -->
    <g transform="translate(16, 44)">
      <rect width="438" height="48" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">FetchManifest: ETag 校验 manifest.json</text>
      <text x="12" y="36" class="text-code">若 CDN 状态码 304 Not Modified 则直接静默收工</text>
    </g>

    <!-- Sub Process 2 -->
    <g transform="translate(16, 100)">
      <rect width="438" height="48" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">CheckDiff: 比对本地与线上模块文件哈希</text>
      <text x="12" y="36" class="text-code">跳过已匹配模块，仅筛选出需要更新的差量组件</text>
    </g>

    <!-- Sub Process 3 -->
    <g transform="translate(16, 156)">
      <rect width="438" height="48" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">DownloadZIP &amp; replaceItemAt: 原子落盘</text>
      <text x="12" y="36" class="text-code">下载差量 ZIP 并解压，操作系统级原子替换写入磁盘</text>
    </g>

    <!-- Sub Process 4: Update Manifest -->
    <g transform="translate(16, 212)">
      <rect width="438" height="70" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="label-title" font-size="12" fill="#9a3412">UpdateManifest (自愈设计): 仅当 100% 成功时固化</text>
      <text x="12" y="42" class="text-code" fill="#7c2d12">若单模块网络失败，不推进 manifest，下次自动重试</text>
      <text x="12" y="58" class="text-code" font-weight="600" fill="#bf4520">严禁运行时热刷新！保持当前会话文案稳定，下次冷启统一生效</text>
    </g>
  </g>
</svg>