<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Header -->
  <g transform="translate(36, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">家庭网络拓扑制图的技术演进与能力象限</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">声明式自动化 vs 物理语义密度：传统人工绘图、通用算法与 homelab-diagram 的范式代际权衡</text>
  </g>

  <!-- Quadrant Grid Canvas (Origin at 450, 310) -->
  <!-- Axis X: 110 to 810 (y=310) -->
  <!-- Axis Y: 490 to 110 (x=450) -->
  <g transform="translate(0, 0)">
    <!-- Quadrant Background Tints -->
    <rect x="110" y="110" width="340" height="200" fill="#ffffff" rx="8" stroke="#f1f5f9" stroke-width="1"/>
    <rect x="450" y="110" width="360" height="200" fill="#f0fdf4" rx="8" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="110" y="310" width="340" height="190" fill="#ffffff" rx="8" stroke="#f1f5f9" stroke-width="1"/>
    <rect x="450" y="310" width="360" height="190" fill="#ffffff" rx="8" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Coordinate Axes -->
    <line x1="100" y1="310" x2="825" y2="310" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="450" y1="510" x2="450" y2="95" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Axis Labels -->
    <text x="828" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">声明式自动化程度 →</text>
    <text x="450" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">↑ 网络拓扑语义与视觉表现力</text>
    
    <text x="115" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">低自动化（纯手工拖拽）</text>
    <text x="795" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0284c7" text-anchor="end">高自动化（代码与资产单一真值）</text>
  </g>

  <!-- Quadrant 1: Top-Left (Low Automation, High Semantics) -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="300" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="300" height="28" rx="8" fill="#f8fafc"/>
    <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569">专业矢量/通用手绘工具</text>
    <text x="210" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e11d48">低工程性 · 高人工</text>
    
    <text x="14" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Draw.io / Visio / Illustrator</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#334155">• 像素级自由度极高，Reddit 经典排版出处</text>
    <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#334155">• 痛点：一次性绘图需 30~50 小时手动对齐拉线</text>
    <text x="14" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• 致命伤：无数据 Schema，IP/容器变动重绘痛苦</text>
    <text x="14" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">典型产出：静态 XML / 二进制源文件 / 难纳入 Git CI</text>
  </g>

  <!-- Quadrant 2: Top-Right (High Automation, High Semantics) FOCAL -->
  <g transform="translate(470, 125)">
    <rect x="0" y="0" width="325" height="170" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <rect x="0" y="0" width="325" height="32" rx="10" fill="#ecfdf5"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#065f46">🎯 声明式拓扑编译新范式</text>
    <rect x="238" y="7" width="75" height="18" rx="4" fill="#059669"/>
    <text x="275" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">BEST FIT</text>

    <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0284c7">homelab-diagram 架构流</text>
    <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 单一真值：YAML 统一管理 VLAN/硬件/容器</text>
    <text x="14" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• 线宽物理学：线宽映射协商速率 (10G/2.5G/1G)</text>
    <text x="14" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">• 亚像素排版：Pillow 测算字形，拒绝文字溢出</text>
    <text x="14" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#059669">• Agent 飞轮：Claude Code 闭环审图与自动布局</text>
  </g>

  <!-- Quadrant 3: Bottom-Left (Low Automation, Low Semantics) -->
  <g transform="translate(130, 335)">
    <rect x="0" y="0" width="300" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="300" height="26" rx="8" fill="#f8fafc"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">纯文本与字符画</text>
    <text x="210" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">简陋 · 仅原型</text>

    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">ASCII / Markdown 表格 / 简单脑图</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• 零依赖，随手即写，极易在纯文本中分享</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• 痛点：无法承载多层嵌套与高密物理信息</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• 缺失网络语义：无 VLAN 标识、无端口映射</text>
    <text x="14" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">典型产出：GitHub Issue 讨论 / 快速备忘草稿</text>
  </g>

  <!-- Quadrant 4: Bottom-Right (High Automation, Low Semantics) -->
  <g transform="translate(470, 335)">
    <rect x="0" y="0" width="325" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="325" height="26" rx="8" fill="#f8fafc"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569">通用图生成与算法自动排版</text>
    <text x="235" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d97706">易混乱 · 无网工语义</text>

    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">Graphviz (dot) / Mermaid / PlantUML</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569">• 声明式文本驱动，自动计算节点引力与拓扑</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• 痛点：力导向算法导致 20+ 节点时连线穿插乱如麻</text>
    <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">• 致命伤：缺乏物理交换机端口与聚合链路 (Trunk) 规范</text>
    <text x="14" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">典型产出：软件依赖图 / 状态流转 / 逻辑架构草图</text>
  </g>
</svg>