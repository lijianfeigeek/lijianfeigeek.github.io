<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="250" viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-security-penetration-pipeline-title dsh-security-penetration-pipeline-desc" id="dsh-security-penetration-pipeline-root">
      <title id="dsh-security-penetration-pipeline-title">安全评测多态探针与动态验证自动化管线</title>
      <desc id="dsh-security-penetration-pipeline-desc">覆盖 200+ 探针矩阵、拒绝语义特征提取、多态变异生成与 API 动态探活的穿透闭环</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dsh-security-penetration-pipeline-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #dsh-security-penetration-pipeline-root text { font-family: "Geist", -apple-system, sans-serif; }
      #dsh-security-penetration-pipeline-root .mono { font-family: "Geist Mono", monospace; }
      #dsh-security-penetration-pipeline-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="dsh-security-penetration-pipeline-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="dsh-security-penetration-pipeline-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="dsh-security-penetration-pipeline-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Stage 1 -->
        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="165" height="135" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="165" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">01. PROBE TEST</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">探针测试矩阵</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 200+ 探针批量覆盖</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 身份伪装 / 混合帧</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 轻量级指令穿透测试</text>
        </g>

        <!-- Stage 2 -->
        <g transform="translate(225, 40)">
          <rect x="0" y="0" width="165" height="135" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="165" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">02. PATTERN ANALYSIS</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">拒绝模式语义提取</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 提取阻断关键词特征</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 识别安全防线阻断点</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 抽象目标防御规则</text>
        </g>

        <!-- Stage 3 (Focal) -->
        <g transform="translate(420, 40)">
          <rect x="0" y="0" width="165" height="135" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="165" height="26" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#bf4520" class="mono">03. SYNTHESIS (FOCAL)</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#bf4520">定制多态变异生成</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.8">• 动态合成对抗性 Prompt</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.8">• 符号伪装与同义重排</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.8">• 绕过静态敏感词库</text>
        </g>

        <!-- Stage 4 -->
        <g transform="translate(615, 40)">
          <rect x="0" y="0" width="165" height="135" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="165" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">04. API VERIFY</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">动态探活与判定</text>
          <text x="12" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 批量高并发调用目标接口</text>
          <text x="12" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 评估模型越权返回内容</text>
          <text x="12" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 计算越狱成功率与风险分</text>
        </g>

        <!-- Stage 5: Report -->
        <g transform="translate(810, 40)">
          <rect x="0" y="0" width="125" height="135" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="125" height="26" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="10" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">05. REPORT</text>
          <text x="10" y="52" font-size="13" font-weight="600" fill="#2d3142">研报自动化</text>
          <text x="10" y="74" font-size="11" fill="#2d3142" fill-opacity="0.7">• 归档 PoC 数据</text>
          <text x="10" y="92" font-size="11" fill="#2d3142" fill-opacity="0.7">• 生成防御加固建议</text>
          <text x="10" y="110" font-size="11" fill="#2d3142" fill-opacity="0.7">• 导出测试评测集</text>
        </g>

        <!-- Connectors -->
        <path d="M 195 107 L 225 107" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-security-penetration-pipeline-arrow-default)" opacity="0.6"/>
        <path d="M 390 107 L 420 107" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-security-penetration-pipeline-arrow-accent)"/>
        <path d="M 585 107 L 615 107" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-security-penetration-pipeline-arrow-accent)"/>
        <path d="M 780 107 L 810 107" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#dsh-security-penetration-pipeline-arrow-link)"/>

        <!-- Verification Loop: Stage 4 -> Stage 3 (If not breached) -->
        <path d="M 700 175 L 700 205 Q 700 215 690 215 L 515 215 Q 505 215 505 205 L 505 175" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#dsh-security-penetration-pipeline-arrow-default)" opacity="0.6"/>
        <g transform="translate(560, 203)">
          <rect x="0" y="0" width="85" height="20" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/>
          <text x="8" y="14" font-size="10" font-weight="600" fill="#2d3142">未击穿 / 动态再变异</text>
        </g>
      </g>
    </svg>
