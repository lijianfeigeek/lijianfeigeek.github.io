<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="race-swimlane-title race-swimlane-desc" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;">
  <title id="race-swimlane-title">Personal Assistant 异步竞态失效链与平台未读消息守卫</title>
  <desc id="race-swimlane-desc">泳道图展示个人助理并发运行时，特殊诉求消息虽已在 94% 到 99% 的对局中发出，但因仅在代理空闲时投递，提交代理往往在消息进入上下文前抢先执行 dd_checkout_confirm，以及平台守卫如何阻断该竞态。</desc>

  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Canvas & Frame -->
  <rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>
  <rect x="1" y="1" width="958" height="538" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(32, 32)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">异步私信竞态失效链 vs 平台级未读消息守卫（hub.ts / MCP）</text>
    <text x="0" y="22" font-size="12" fill="#64748b">为什么 98.6% 的特殊诉求（如无麸质餐食）都已发出，却有 35%～53% 未能在结账前进入提交者的上下文？</text>
  </g>

  <!-- Swimlane Backgrounds -->
  <g transform="translate(32, 76)">
    <!-- Lane 1 -->
    <rect x="0" y="0" width="896" height="96" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="144" height="96" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="40" font-size="12" font-weight="700" fill="#0f172a">诉求方代理</text>
    <text x="16" y="60" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">AGENT A (ASKER)</text>

    <!-- Lane 2 -->
    <rect x="0" y="112" width="896" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="112" width="144" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="154" font-size="12" font-weight="700" fill="#0f172a">异步通信通道</text>
    <text x="16" y="174" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">DM QUEUE (IDLE PUSH)</text>

    <!-- Lane 3 -->
    <rect x="0" y="228" width="896" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="228" width="144" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="270" font-size="12" font-weight="700" fill="#0f172a">结账方代理</text>
    <text x="16" y="290" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">CREATOR (pi 0.77.0)</text>

    <!-- Lane 4 -->
    <rect x="0" y="344" width="896" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="344" width="144" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="386" font-size="12" font-weight="700" fill="#0f172a">MCP 共享中心</text>
    <text x="16" y="406" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">hub.ts / SERVER</text>
  </g>

  <!-- Orthogonal Connectors (drawn BEFORE boxes) -->
  <!-- 1. Agent A -> DM Queue -->
  <path d="M 300 144 L 300 208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <rect x="244" y="168" width="112" height="18" rx="3" fill="#ffffff"/>
  <text x="300" y="180" font-size="9" font-weight="600" fill="#475569" text-anchor="middle" font-family="ui-monospace, monospace">dm_send (98.6%)</text>

  <!-- 2. Creator -> Cart Edits -> Race Condition -->
  <path d="M 380 354 L 460 354" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- 3. Premature Checkout (Creator -> MCP Server) -->
  <path d="M 544 388 L 544 436" fill="none" stroke="#bf4520" stroke-width="1.8" marker-end="url(#arrow-coral)"/>
  <rect x="464" y="404" width="160" height="18" rx="3" fill="#ffffff"/>
  <text x="544" y="416" font-size="9" font-weight="700" fill="#bf4520" text-anchor="middle" font-family="ui-monospace, monospace">抢先调用 checkout_confirm</text>

  <!-- 4. Guard Reject -> Force Wait -> Deliver Pending DM -> Re-checkout -->
  <path d="M 624 468 L 696 468 L 696 388" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#arrow-link)"/>
  <rect x="628" y="408" width="136" height="18" rx="3" fill="#ffffff"/>
  <text x="696" y="420" font-size="9" font-weight="600" fill="#2e5aa8" text-anchor="middle" font-family="ui-monospace, monospace">拒绝结账 · 迫使回合结束</text>

  <!-- 5. DM Queue -> Creator Context (Once idle) -->
  <path d="M 432 238 L 716 238 L 716 320" fill="none" stroke="#2e5aa8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
  <rect x="524" y="229" width="144" height="18" rx="3" fill="#ffffff"/>
  <text x="596" y="241" font-size="9" font-weight="600" fill="#2e5aa8" text-anchor="middle" font-family="ui-monospace, monospace">空闲后注入新 Turn 上下文</text>

  <!-- 6. Verified Checkout -->
  <path d="M 796 388 L 796 436" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- Boxes in Lane 1 -->
  <g transform="translate(200, 96)">
    <rect x="0" y="0" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">读取 memory/ 隐私约束</text>
    <text x="12" y="40" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">e.g. 乳糜泻需两份无麸质配菜</text>
  </g>
  <g transform="translate(460, 96)">
    <rect x="0" y="0" width="216" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#334155">信息割裂下的跨人脑补</text>
    <text x="12" y="40" font-size="10" fill="#64748b">57.6% 对局捏造他人未表达共识</text>
  </g>

  <!-- Boxes in Lane 2 -->
  <g transform="translate(200, 212)">
    <rect x="0" y="0" width="232" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">DM 挂起等待队列</text>
    <text x="12" y="40" font-size="10" fill="#64748b">仅接收不中断：无轮询收件箱机制</text>
  </g>

  <!-- Boxes in Lane 3 -->
  <g transform="translate(200, 328)">
    <rect x="0" y="0" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#0f172a">并发操作共享购物车</text>
    <text x="12" y="40" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">72%～77% 发生反向覆盖</text>
  </g>
  <g transform="translate(460, 328)">
    <rect x="0" y="0" width="168" height="56" rx="6" fill="#fff1f2" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#bf4520">竞态盲区：过早结账</text>
    <text x="12" y="40" font-size="10" fill="#9f1239">仅 47%～65% 在上下文内</text>
  </g>
  <g transform="translate(696, 328)">
    <rect x="0" y="0" width="196" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#065f46">读取全部挂起 DM 后重调</text>
    <text x="12" y="40" font-size="10" fill="#047857">补齐诉求并修正订单条目</text>
  </g>

  <!-- Boxes in Lane 4 -->
  <g transform="translate(460, 444)">
    <rect x="0" y="0" width="168" height="56" rx="6" fill="#fff1f2" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#bf4520">未读消息守卫拦截</text>
    <text x="12" y="40" font-size="10" fill="#9f1239" font-family="ui-monospace, monospace">Guard: block pending DMs</text>
  </g>
  <g transform="translate(696, 444)">
    <rect x="0" y="0" width="196" height="56" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#065f46">放行 dd_checkout_confirm</text>
    <text x="12" y="40" font-size="10" fill="#047857">失败对局挽回 73.1% / 62.3%</text>
  </g>
</svg>
