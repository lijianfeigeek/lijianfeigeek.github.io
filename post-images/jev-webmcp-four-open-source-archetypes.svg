<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="jev-four-archetypes-title jev-four-archetypes-desc">
  <title id="jev-four-archetypes-title">Jev 开源社区四大极速落地流派矩阵</title>
  <desc id="jev-four-archetypes-desc">展示Sac的Mac本地日历、Browser Use的7秒订机票、Milind Labs零像素隐私架构与Stagehand超低成本浏览器的创新模式</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.2); stroke-width: 1; rx: 4; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="960" height="420" class="bg" />

  <!-- 2x2 Matrix Layout -->
  <!-- Card 1: Sac Mac Calendar (x=40, y=40, w=420, h=160) -->
  <g transform="translate(40, 40)">
    <rect width="420" height="160" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 38 L 0 38 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="24" class="text-title">流派一：Sac 的 Mac 本地日历「Jev Use」</text>
    <text x="330" y="24" class="text-muted">消灭系统顿挫</text>

    <g transform="translate(14, 48)">
      <rect width="392" height="46" class="pill" />
      <text x="10" y="18" class="text-subtitle">系统 Accessibility 事件 → Jev 毫秒级命中按键</text>
      <text x="10" y="34" class="text-muted">比拼原生 Codex：消除每次点击与切换标签的数秒等待</text>
    </g>

    <text x="14" y="118" class="text-body">• 行云流水无缝衔接，如同真人在使用物理快捷键</text>
    <text x="14" y="136" class="text-body">• Token 消耗持平，执行响应时延暴降一个数量级</text>
  </g>

  <!-- Card 2: Browser Use Ultrafast (x=500, y=40, w=420, h=160) - Focal -->
  <g transform="translate(500, 40)">
    <rect width="420" height="160" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 38 L 0 38 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="14" y="24" class="text-focal-title">流派二：Browser Use「Ultrafast」7秒订机票神话</text>
    <text x="340" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#bf4520">Gregor 研发</text>

    <g transform="translate(14, 48)">
      <rect width="392" height="46" class="focal-pill" />
      <text x="10" y="18" class="text-subtitle" fill="#bf4520">DOM 表格化选点 + 极小语言模型负责输入文字</text>
      <text x="10" y="34" class="text-muted">视口元素拍平压缩，Jev 定方向，小模型打字，分工极速</text>
    </g>

    <text x="14" y="118" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">• 全程仅耗时 7 秒搜完机票 · 综合成本仅 0.0039 美元</text>
    <text x="14" y="136" class="text-body">• 1倍速实录无快进，彻底碾压传统截图式智能体</text>
  </g>

  <!-- Card 3: Milind Labs Zero-Pixel (x=40, y=220, w=420, h=160) -->
  <g transform="translate(40, 220)">
    <rect width="420" height="160" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 38 L 0 38 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="24" class="text-title">流派三：Milind Labs 零像素外传隐私架构</text>
    <text x="320" y="24" class="text-muted">金融医疗合规</text>

    <g transform="translate(14, 48)">
      <rect width="392" height="46" class="pill" />
      <text x="10" y="18" class="text-subtitle">CoreML 控件分割 + 原生 OCR 提取文字标签</text>
      <text x="10" y="34" class="text-muted">纯本地运行，不截屏、不读 DOM，没有任何图像像素离开机器</text>
    </g>

    <text x="14" y="118" class="text-body">• Jev 仅接收脱敏文字选项，以 90ms 超高频决断驱动系统</text>
    <text x="14" y="136" class="text-body">• 解决企业高敏感场景中云端截图泄露机密的合规红线</text>
  </g>

  <!-- Card 4: Stagehand Remote Browser (x=500, y=220, w=420, h=160) -->
  <g transform="translate(500, 220)">
    <rect width="420" height="160" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 412 0 Q 420 0 420 8 L 420 38 L 0 38 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="24" class="text-title">流派四：Browserbase / Stagehand 远程云执行</text>
    <text x="310" y="24" class="text-muted">0.001 美元采集</text>

    <g transform="translate(14, 48)">
      <rect width="392" height="46" class="pill" />
      <text x="10" y="18" class="text-subtitle">a11y 无障碍树压缩 + Jev 极速动作流</text>
      <text x="10" y="34" class="text-muted">远程无头浏览器将 DOM 压缩为决策动作空间</text>
    </g>

    <text x="14" y="118" class="text-body">• 毫秒级输出下一拍动作，由 Stagehand 原生协议执行</text>
    <text x="14" y="136" class="text-body">• 单任务综合执行成本被强力压缩至 0.001 美元基准</text>
  </g>
</svg>