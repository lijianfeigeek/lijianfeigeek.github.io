<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="mv-swim-title mv-swim-desc" id="mv-swim-root" data-diagram="swimlane">
  <title id="mv-swim-title">MiVibe Remote macOS 按需虚拟麦克风与五段式防吞字时序泳道图</title>
  <desc id="mv-swim-desc">展示小米遥控器 ATVV 16kHz 语音流从按下开麦、200ms 预滚缓存、48kHz CoreAudio IOProc 直连写入、150ms 尾包宽限与 300ms 静音排空，到释放宿主快捷键并挂起虚拟通道的四域完整闭环。</desc>
  <defs>
    <pattern id="mvs-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="mvs-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="mvs-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="mvs-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="mvs-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="640" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="640" fill="url(#mvs-dots)"/>
  <rect x="16" y="16" width="968" height="608" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">ON-DEMAND VIRTUAL AUDIO PIPELINE · ANTI-CLIPPING SESSION LIFECYCLE</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">首字不丢、尾音不吞、空闲零橙点：CoreAudio IOProc 按需唤醒与五段式收尾管线</text>
  </g>

  <!-- Swimlane Frame & 4 Horizontal Lanes (y=96..552, each lane height=114) -->
  <rect x="36" y="96" width="928" height="456" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="96" width="168" height="456" fill="#f8fafc"/>
  <rect x="204" y="210" width="760" height="114" fill="#f8fafc" opacity="0.55"/>
  <rect x="204" y="438" width="760" height="114" fill="#f8fafc" opacity="0.55"/>
  <line x1="204" y1="96" x2="204" y2="552" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="36" y1="210" x2="964" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="324" x2="964" y2="324" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="438" x2="964" y2="438" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Lane Headers (Isolated Coordinates) -->
  <g transform="translate(52, 124)">
    <text x="0" y="12" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 01 · BLE ATVV</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">遥控器蓝牙音频流</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">0x2717:0x32B8 · 16kHz</text>
  </g>
  <g transform="translate(52, 238)">
    <text x="0" y="12" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 02 · ORCHESTRATOR</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">会话编排与缓冲闸门</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">BridgeAppModel</text>
  </g>
  <g transform="translate(52, 352)">
    <text x="0" y="12" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 03 · DIRECT IOPROC</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">按需重采样与挂起</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">StableVirtualAudioOutput</text>
  </g>
  <g transform="translate(52, 466)">
    <text x="0" y="12" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 04 · HAL &amp; HOST</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">USB 伪装驱动与宿主</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">MiRemoteV 2ch · PTT</text>
  </g>

  <!-- ==================== ORTHOGONAL CONNECTORS (DRAWN BEFORE BOXES) ==================== -->
  <!-- C1: N1 (bottom 296, 184) -> N2 (top 296, 232) -->
  <line x1="296" y1="184" x2="296" y2="232" stroke="#0284c7" stroke-width="1.2" marker-end="url(#mvs-arr-link)"/>
  <rect x="304" y="198" width="68" height="16" rx="2" fill="#ffffff"/>
  <text x="338" y="209" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PCM 16KHZ</text>

  <!-- C2: N2 (bottom-left 264, 300) -> N7 (top 264, 460) via left clear channel? Wait: N3 is in Lane 3 at x=416..592, so x=264 has NO box in Lane 3! Direct clean vertical! -->
  <line x1="264" y1="300" x2="264" y2="460" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mvs-arr-link)"/>
  <rect x="272" y="368" width="76" height="16" rx="2" fill="#ffffff"/>
  <text x="310" y="379" fill="#0284c7" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PRESS CHORD</text>

  <!-- C3: N2 (right 380, 268) -> N3 (top 480, 348) with r=8 elbow -->
  <path d="M 380 268 L 472 268 Q 480 268 480 276 L 480 348" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#mvs-arr-accent)"/>
  <rect x="488" y="296" width="76" height="16" rx="2" fill="#ffffff"/>
  <text x="526" y="307" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">200MS FLUSH</text>

  <!-- C4: N3 (bottom 480, 416) -> N7 (right-top? Let's make N7 at x=220..396 and N8 at x=580..756! Or N3 bottom 480,416 -> elbow into N7 right 396,492!) -->
  <path d="M 480 416 L 480 484 Q 480 492 472 492 L 396 492" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#mvs-arr-accent)"/>
  <rect x="488" y="452" width="72" height="16" rx="2" fill="#ffffff"/>
  <text x="524" y="463" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">48KHZ LOOP</text>

  <!-- C5: N1 (right 380, 152) -> N4 (left 588, 152) -->
  <line x1="380" y1="152" x2="588" y2="152" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mvs-arr-muted)"/>
  <rect x="444" y="128" width="84" height="16" rx="2" fill="#ffffff"/>
  <text x="486" y="139" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RELEASE KEY</text>

  <!-- C6: N4 (bottom 672, 184) -> N5 (top 672, 232) -->
  <line x1="672" y1="184" x2="672" y2="232" stroke="#0284c7" stroke-width="1.2" marker-end="url(#mvs-arr-link)"/>
  <rect x="680" y="198" width="76" height="16" rx="2" fill="#ffffff"/>
  <text x="718" y="209" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">150MS GRACE</text>

  <!-- C7: N5 (bottom 652, 300) -> N8 (top 652, 460) — clear vertical channel between N3 (ends 584) and N6 (starts 776)! -->
  <line x1="652" y1="300" x2="652" y2="460" stroke="#059669" stroke-width="1.2" marker-end="url(#mvs-arr-ok)"/>
  <rect x="660" y="368" width="84" height="16" rx="2" fill="#ffffff"/>
  <text x="702" y="379" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">COMMIT &amp; UP</text>

  <!-- C8: N5 (right 756, 268) -> N6 (top 860, 348) with r=8 elbow -->
  <path d="M 756 268 L 852 268 Q 860 268 860 276 L 860 348" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#mvs-arr-ok)"/>
  <rect x="868" y="296" width="76" height="16" rx="2" fill="#ffffff"/>
  <text x="906" y="307" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IDLE SUSPEND</text>

  <!-- ==================== NODES (8 NODES WITHIN BUDGET, ISOLATED <g>) ==================== -->
  <!-- N1: Remote Mic Start -->
  <g transform="translate(220, 120)">
    <rect x="0" y="0" width="160" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">01 · MIC OPEN</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">按住语音键启动收音</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">IMA ADPCM + 三点平滑</text>
  </g>

  <!-- N2: VoiceAudioPreRoll -->
  <g transform="translate(220, 232)">
    <rect x="0" y="0" width="160" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">02 · PREROLL BUFFER</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">200ms 预滚缓存防丢首字</text>
    <text x="12" y="56" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Max 64,000 Frames</text>
  </g>

  <!-- N3: FOCAL 1 - Direct CoreAudio IOProc -->
  <g transform="translate(408, 348)">
    <rect x="0" y="0" width="176" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">03 · DIRECT IOPROC</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">按需创建 IOProc 直写</text>
    <text x="12" y="56" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">16k→48k · 零聚合重建</text>
  </g>

  <!-- N7: MiRemoteV 2ch & Host Capture -->
  <g transform="translate(220, 460)">
    <rect x="0" y="0" width="176" height="68" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">04 · USB HAL &amp; PTT</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">USB 伪装驱动与同步按键</text>
    <text x="12" y="56" fill="#0369a1" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">⌃⇧D / ⌘D / Fn 同步触发</text>
  </g>

  <!-- N4: Tail Packet Grace Window -->
  <g transform="translate(588, 120)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">05 · LATE AUDIO</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">松手与异构通道尾包窗</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">STOP + 150ms 尾包宽限</text>
  </g>

  <!-- N5: Silence Drain & Commit Delay -->
  <g transform="translate(588, 232)">
    <rect x="0" y="0" width="168" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">06 · SILENCE DRAIN</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">静音补帧防截断尾音素</text>
    <text x="12" y="56" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">300ms 静音 + 200ms 提交</text>
  </g>

  <!-- N8: Host Commit & Release -->
  <g transform="translate(588, 460)">
    <rect x="0" y="0" width="168" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">07 · CHORD RELEASE</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">尾音耗尽后释放快捷键</text>
    <text x="12" y="56" fill="#047857" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">VoiceFunctionKeyLatch</text>
  </g>

  <!-- N6: FOCAL 2 - Idle Suspend -->
  <g transform="translate(776, 348)">
    <rect x="0" y="0" width="172" height="68" rx="6" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">08 · ZERO ORANGE DOT</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">立即销毁空闲 IOProc</text>
    <text x="12" y="56" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">保持默认输入 · 隐私灯熄灭</text>
  </g>

  <!-- Bottom Legend Strip -->
  <line x1="36" y1="572" x2="964" y2="572" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(36, 588)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.4"/>
    <text x="18" y="12" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">核心音频隐私创新点（IOProc 直连与空闲销毁）</text>
  </g>
  <g transform="translate(340, 588)">
    <line x1="0" y1="8" x2="24" y2="8" stroke="#0284c7" stroke-width="1.4"/>
    <text x="32" y="12" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">BLE / CoreAudio 实时流</text>
  </g>
  <g transform="translate(516, 588)">
    <line x1="0" y1="8" x2="24" y2="8" stroke="#059669" stroke-width="1.4"/>
    <text x="32" y="12" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">排空确认与释放闭环</text>
  </g>
  <g transform="translate(684, 588)">
    <line x1="0" y1="8" x2="24" y2="8" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="32" y="12" fill="#64748b" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">异步控制边沿</text>
  </g>
</svg>
