<svg xmlns="http://www.w3.org/2000/svg" width="920" height="496" viewBox="0 0 920 496" role="img" aria-labelledby="cdm-ls-title cdm-ls-desc">
  <title id="cdm-ls-title">chrome-devtools-mcp 五层异构架构与 GN 构建堆栈</title>
  <desc id="cdm-ls-desc">展示从 MCP/CLI 双入口、TaskRunner 并发调度、McpContext 安全边界到核心 Puppeteer 与 DevTools Frontend 融合层及底层 Chrome 运行时的五层分层架构。</desc>
