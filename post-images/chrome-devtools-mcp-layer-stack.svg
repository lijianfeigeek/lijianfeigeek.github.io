  <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">GN + NINJA BUILD TOPOLOGY · CHROMIUM DEVTOOLS FRONTEND EMBEDDED IN NODE</text>
