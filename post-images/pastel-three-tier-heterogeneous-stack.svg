<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="pastel-stack-title pastel-stack-desc">
  <title id="pastel-stack-title">Pastel-macOS 三层异构分层架构栈</title>
  <desc id="pastel-stack-desc">展示 Pastel 从顶层 SwiftUI Liquid Glass 与原生传输引擎，经由 Node.js 24 目录适配层，到底层 Go StoreHelper 协议剥离与 macOS 宿主安全签名的四层职责边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="960" height="464" fill="#f8fafc"/>

  <!-- Header Strip -->
  <rect x="0" y="0" width="960" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">Pastel-macOS 四层异构系统栈：权责剥离与最小权限边界</text>
  <text x="24" y="38" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">LAYER STACK · SWIFT 6 + NODE 24 LTS + GO (IPATOOL V2.8.1) + AD-HOC RUNTIME</text>

  <!-- Left Axis Indicator -->
  <g transform="translate(20, 72)">
    <line x1="16" y1="12" x2="16" y2="308" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="16" y="4" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">HOST</text>
    <text x="16" y="324" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">APPLE</text>
  </g>

  <!-- L4: Swift UI & Native Engine -->
  <g transform="translate(64, 68)">
    <rect x="0" y="0" width="872" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="12" y="12" width="44" height="20" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="34" y="25" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">L4 · UI</text>
    <text x="72" y="26" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">SwiftUI 原生壳层与并发下载引擎</text>
    <text x="72" y="46" fill="#475569" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">Liquid Glass 界面 · Keychain 主密钥保险库 · URLSession 断点续传 · MD5 校验</text>
    <text x="856" y="26" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="end">PastelApp.swift / NativeDownloadEngine.swift</text>
    <text x="856" y="46" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">auth(1) · transfers(3) · packaging(1) · No Hardened Runtime</text>
  </g>

  <!-- L3: Node.js 24 Compatibility & Catalog -->
  <g transform="translate(64, 152)">
    <rect x="0" y="0" width="872" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="12" y="12" width="44" height="20" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="34" y="25" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">L3 · JS</text>
    <text x="72" y="26" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">Node.js 24 目录路由与短生命周期编排层</text>
    <text x="72" y="46" fill="#475569" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">iTunes 搜索/RSS 榜单 · 多源历史版本回退 (Timbrd→Agzy→Bilin) · 免费许可确认</text>
    <text x="856" y="26" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="end">NodeProject/main.js · catalog.js · ipa.js</text>
    <text x="856" y="46" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">stdin Pipe JSON · prepareOnly exits before transfer · JIT HR</text>
  </g>

  <!-- L2: Go StoreHelper (FOCAL LAYER - Coral Accent) -->
  <g transform="translate(64, 236)">
    <rect x="0" y="0" width="872" height="76" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.4"/>
    <rect x="12" y="12" width="44" height="20" rx="2" fill="#bf4520"/>
    <text x="34" y="25" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">L2 · GO</text>
    <text x="72" y="26" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">Go StoreHelper 协议剥离与无锁封装层（核心边界）</text>
    <text x="72" y="48" fill="#334155" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">AMD/Anisette 预置 · prepareNative 签发 CDN 地址与 Binary Plist · finalizeNative 注入 SINF</text>
    <text x="856" y="26" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="end">StoreHelper/main.go · pastel_native.go</text>
    <text x="856" y="48" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">ipatool v2.8.1 (3b02b4c) · flock auth vs lock-free ZIP rewrite</text>
  </g>

  <!-- L1: System Primitives & Signing -->
  <g transform="translate(64, 324)">
    <rect x="0" y="0" width="872" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <rect x="12" y="12" width="44" height="20" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="34" y="25" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">L1 · OS</text>
    <text x="72" y="26" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="600">macOS 底层硬件标识、私有 SAP 签名与混合签名拓扑</text>
    <text x="72" y="46" fill="#475569" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">sysctl(NET_RT_IFLIST) 读取硬件 MAC · AppleMediaServices SAP 签名 · Ad-hoc 分级授权</text>
    <text x="856" y="26" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="end">DeviceGUIDStore · SAPSigner.m · BuildAdHocDMG.sh</text>
    <text x="856" y="46" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">AF_ROUTE MAC · dlopen(AMSMescalFairPlay) · Sparkle EdDSA</text>
  </g>

  <!-- Bottom Legend Strip -->
  <rect x="0" y="416" width="960" height="48" fill="#ffffff"/>
  <line x1="0" y1="416" x2="960" y2="416" stroke="#cbd5e1" stroke-width="1"/>
  <g transform="translate(24, 432)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="10" fill="#475569" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">宿主与调度层</text>
  </g>
  <g transform="translate(148, 432)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#fff5f2" stroke="#bf4520" stroke-width="1.2"/>
    <text x="20" y="10" fill="#bf4520" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">焦点边界：协议授权与大文件传输解耦层</text>
  </g>
  <g transform="translate(460, 432)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="20" y="10" fill="#475569" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">系统原生接口与混合签名边界</text>
  </g>
  <text x="936" y="442" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">PAPER LIGHT · 4PX GRID</text>
</svg>
