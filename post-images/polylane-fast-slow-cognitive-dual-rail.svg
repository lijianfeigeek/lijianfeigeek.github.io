<svg width="960" height="350" viewBox="0 0 960 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polylane-fast-slow-cognitive-dual-rail-title polylane-fast-slow-cognitive-dual-rail-desc">
  <title id="polylane-fast-slow-cognitive-dual-rail-title">Agent 认知系统快慢双轨分治系统架构</title>
  <desc id="polylane-fast-slow-cognitive-dual-rail-desc">由认知路由器调度 System 1 本能反射弧与 System 2 深度思辨综合分工协同</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="350" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Top Input &amp; Router Container -->
  <g transform="translate(24, 20)">
    <rect width="912" height="64" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    
    <g transform="translate(16, 12)">
      <rect width="260" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="24" class="label-title">外部高频环境输入 (Events / PR / Logs)</text>
    </g>

    <path d="M 284 32 L 340 32" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="340,29 346,32 340,35" fill="#9ca3af"/>

    <!-- Central Router Box (Coral Accent) -->
    <g transform="translate(346, 10)">
      <rect width="550" height="44" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="16" y="26" class="label-title" fill="#9a3412">认知双轨路由器 (Cognitive Router: 辨识高频微决策 vs 开放长程推理)</text>
    </g>
  </g>

  <!-- Connectors to System 1 &amp; System 2 -->
  <path d="M 260 84 L 260 110" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="257,110 263,110 260,116" fill="#bf4520"/>

  <path d="M 700 84 L 700 110" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="697,110 703,110 700,116" fill="#6366f1"/>

  <!-- Left: System 1: Instinct Reflex Arc (Jev) -->
  <g transform="translate(24, 116)">
    <rect width="440" height="214" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="34" rx="8" fill="#fff7ed"/>
    <path d="M0 26 h440 v8 h-440 z" fill="#fff7ed"/>
    <text x="16" y="22" class="label-title" fill="#9a3412">System 1：本能反射弧（Jev 专精，承载 90%+ 流量）</text>

    <!-- Sub cards -->
    <g transform="translate(16, 46)">
      <rect width="408" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">过滤静默 (Noul)</text>
      <text x="12" y="36" class="text-code">二元判定是否值得跟进，直接阻断 60% 无关骚扰</text>
    </g>

    <g transform="translate(16, 98)">
      <rect width="408" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">有限分支归类 (Choice)</text>
      <text x="12" y="36" class="text-code">故障因果关联与归因分析，确定性受限枚举</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="408" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">严重度阶梯打分 (Score)</text>
      <text x="12" y="36" class="text-code">多云数万节点拓扑优先级排序，500ms 快速吞吐</text>
    </g>
  </g>

  <!-- Escalation link from System 1 to System 2 -->
  <path d="M 464 210 L 512 210" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="508,207 514,210 508,213" fill="#f59e0b"/>
  <rect x="466" y="196" width="46" height="16" rx="3" fill="#fffbeb"/>
  <text x="470" y="208" class="text-code" font-size="10" fill="#b45309">升级</text>

  <!-- Right: System 2: Deep Reasoning (Generative LLM) -->
  <g transform="translate(496, 116)">
    <rect width="440" height="214" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="34" rx="8" fill="#eef2ff"/>
    <path d="M0 26 h440 v8 h-440 z" fill="#eef2ff"/>
    <text x="16" y="22" class="label-title" fill="#3730a3">System 2：深度思辨与综合（Generative LLM）</text>

    <!-- Sub cards -->
    <g transform="translate(16, 46)">
      <rect width="408" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">故障根因综合长文复盘</text>
      <text x="12" y="36" class="text-code">汇聚多源遥测与代码提交，面向人类撰写 Post-mortem</text>
    </g>

    <g transform="translate(16, 98)">
      <rect width="408" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">跨文件复杂代码修复补丁 (Autofix PR)</text>
      <text x="12" y="36" class="text-code">调用高级代码模型编写严密修复逻辑并运行自动化单测</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="408" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="12" y="20" class="label-title" font-size="12">不确定性探索与高阶方案论证</text>
      <text x="12" y="36" class="text-code">遇到前所未见的系统异动时，调动思维链进行深度归纳推理</text>
    </g>
  </g>
</svg>