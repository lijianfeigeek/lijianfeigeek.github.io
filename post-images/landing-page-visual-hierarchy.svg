<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="landing-page-visual-hierarchy-title landing-page-visual-hierarchy-desc" id="landing-page-visual-hierarchy-root">
        <title id="landing-page-visual-hierarchy-title">高转化落地页层级设计：从首屏承诺到底层增益</title>
        <desc id="landing-page-visual-hierarchy-desc">Title 标签、Hero 首屏履约、3 步操作流、原创 Benchmark 对比与 FAQ 结构化语义层级</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #landing-page-visual-hierarchy-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #landing-page-visual-hierarchy-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #landing-page-visual-hierarchy-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="landing-page-visual-hierarchy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="landing-page-visual-hierarchy-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="landing-page-visual-hierarchy-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <g transform="translate(60, 20)">
          <rect x="0" y="0" width="840" height="52" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="16" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">TIER 01 · TITLE 标签与元数据</text>
          <text x="16" y="40" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">核心关键词前置 + 价值承诺 (Free / 30s) + 格式限定 (PPT/PDF to Summary)</text>
        </g>

        <g transform="translate(60, 84)">
          <rect x="0" y="0" width="840" height="66" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <text x="16" y="26" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">TIER 02 · 首屏 HERO 区域 (即刻履约 · FOCAL)</text>
          <text x="16" y="48" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12">清晰的 H1 标题 + 显眼的课件拖拽上传框 + 4 个开箱即用示例文档 + 履约承诺标签</text>
        </g>

        <g transform="translate(60, 162)">
          <rect x="0" y="0" width="840" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="16" y="22" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">TIER 03 · 操作流 (HOW IT WORKS)</text>
          <text x="16" y="40" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">极简 3 步可视化图文说明：上传课件 → 选择形态/提炼要点 → 导出脑图/PPTX</text>
        </g>

        <g transform="translate(60, 226)">
          <rect x="0" y="0" width="840" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="16" y="22" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">TIER 04 · 原创增益 (BENCHMARK &amp; RESEARCH)</text>
          <text x="16" y="40" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">基于 40 页课件的真实测试报告：各模型提取耗时、准确率与长文档还原度对比</text>
        </g>

        <g transform="translate(60, 290)">
          <rect x="0" y="0" width="840" height="52" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="16" y="22" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">TIER 05 · FAQ 模块 (SCHEMA JSON-LD 结构化收尾)</text>
          <text x="16" y="40" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">大小限制、文件隐私、支持格式等高频问答，配合 FAQPage Schema 抢占 SERP 下拉框</text>
        </g>
      </svg>
