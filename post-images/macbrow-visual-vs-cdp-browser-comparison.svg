<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="macbrow-visual-vs-cdp-browser-comparison-title macbrow-visual-vs-cdp-browser-comparison-desc" id="macbrow-visual-vs-cdp-browser-comparison-root">
      <title id="macbrow-visual-vs-cdp-browser-comparison-title">视觉截图 Browser Agent vs CDP 控件树交互机制对比</title>
      <desc id="macbrow-visual-vs-cdp-browser-comparison-desc">依赖多模态高分辨率图像识别与基于 Chrome DevTools Protocol 纯控件树结构化操作的性能与可靠性对比</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #macbrow-visual-vs-cdp-browser-comparison-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #macbrow-visual-vs-cdp-browser-comparison-root text { font-family: "Geist", -apple-system, sans-serif; }
      #macbrow-visual-vs-cdp-browser-comparison-root .mono { font-family: "Geist Mono", monospace; }
      #macbrow-visual-vs-cdp-browser-comparison-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="macbrow-visual-vs-cdp-browser-comparison-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="macbrow-visual-vs-cdp-browser-comparison-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="macbrow-visual-vs-cdp-browser-comparison-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Left: Visual Screenshot -->
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="425" height="270" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="425" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" font-size="12" font-weight="600" fill="#2d3142" class="mono">VISUAL SCREENSHOT AGENT (传统视觉截图模式)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="397" height="45" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#2d3142">1. 抓取视网膜整页高分辨率截图并 JPEG 压缩</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.65">单张图片体积 2MB~5MB，上传耗时显著</text>
          </g>

          <g transform="translate(14, 102)">
            <rect x="0" y="0" width="397" height="45" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#2d3142">2. VLM 纯视觉猜测元素坐标 (x, y)</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.65">极易受缩放比例、DPI 差异与滚动条偏移干扰</text>
          </g>

          <g transform="translate(14, 156)">
            <rect x="0" y="0" width="397" height="45" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.1"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#2d3142">3. 操作系统模拟鼠标物理位移点击</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.65">易产生点击穿透与焦点夺取灾难</text>
          </g>

          <g transform="translate(14, 212)">
            <rect x="0" y="0" width="397" height="44" rx="4" fill="#f8f9fa"/>
            <text x="10" y="26" font-size="11" font-weight="600" fill="#2d3142">单步耗时：5 ~ 15 秒 | 准确率易受布局变化漂移</text>
          </g>
        </g>

        <!-- Right: CDP Tree (Focal) -->
        <g transform="translate(495, 30)">
          <rect x="0" y="0" width="435" height="270" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="435" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" font-size="12" font-weight="700" fill="#bf4520" class="mono">CDP ACCESSIBILITY TREE (jev-ultrafast 控件树 - FOCAL)</text>

          <g transform="translate(14, 48)">
            <rect x="0" y="0" width="407" height="45" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#bf4520">1. CDP 协议直连提取轻量 Accessibility 控件树</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.7">结构化纯文本仅几十 KB，无任何图像编码开销</text>
          </g>

          <g transform="translate(14, 102)">
            <rect x="0" y="0" width="407" height="45" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#bf4520">2. 通过语义 BackendNodeId 精准锚定目标元素</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.7">100% 免疫屏幕分辨率、缩放比例与布局形变</text>
          </g>

          <g transform="translate(14, 156)">
            <rect x="0" y="0" width="407" height="45" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="20" font-size="11" font-weight="600" fill="#bf4520">3. 原生 DOM 事件派发与受控注入</text>
            <text x="10" y="36" font-size="10" fill="#2d3142" fill-opacity="0.7">零焦点争抢，支持后台静默执行与秒级履约</text>
          </g>

          <g transform="translate(14, 212)">
            <rect x="0" y="0" width="407" height="44" rx="4" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="26" font-size="11" font-weight="700" fill="#bf4520">单步耗时：0.2 ~ 0.5 秒 | 100% 结构化精准度</text>
          </g>
        </g>
      </g>
    </svg>
