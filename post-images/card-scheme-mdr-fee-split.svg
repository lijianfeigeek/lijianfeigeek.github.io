<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-mdr-fee-split-title card-scheme-mdr-fee-split-desc" id="card-scheme-mdr-fee-split-root">
        <title id="card-scheme-mdr-fee-split-title">支付利益分配博弈：典型 2.5% MDR 费率内部切分全景</title>
        <desc id="card-scheme-mdr-fee-split-desc">商户所付 2.5% 综合扣率在发卡行（交换费 70%）、收单行（服务毛利 20%）与卡组织（评估费 10%）之间的分润架构</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-mdr-fee-split-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-mdr-fee-split-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-mdr-fee-split-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-mdr-fee-split-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-mdr-fee-split-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-mdr-fee-split-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Top Bar Overview -->
        <g transform="translate(60, 24)">
          <rect x="0" y="0" width="840" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="20" y="29" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">商户承担综合费率 (MDR · Merchant Discount Rate) = 2.50%（每消费 $100 扣减 $2.50）</text>
        </g>

        <!-- 3 Segment Visual Breakdown -->
        <!-- Segment 1: Interchange Fee (70% · Focal Accent) -->
        <g transform="translate(60, 96)">
          <rect x="0" y="0" width="400" height="230" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.05"/>
          <rect x="0" y="0" width="400" height="32" rx="6" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">SHARE: 70% · LARGEST SLICE</text>
          
          <g transform="translate(14, 48)">
            <text x="0" y="18" fill="#bf4520" font-family="'Geist', sans-serif" font-size="16" font-weight="600">发卡行所得：交换费 (Interchange Fee)</text>
            <text x="0" y="42" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="14" font-weight="600">约 1.75%（占总手续费的 70%）</text>
            <text x="0" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">资金用途与经济逻辑：</text>
            <text x="0" y="92" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">1. 覆盖 20~50 天免息期资金拆借资金成本</text>
            <text x="0" y="112" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">2. 承担持卡人坏账死账与信用卡欺诈兜底</text>
            <text x="0" y="132" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">3. 补贴积分回馈、航空里程与现金返现运营成本</text>
            <text x="0" y="156" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">由卡组织统一定价 · 收单行向发卡行强制进呈</text>
          </g>
        </g>

        <!-- Segment 2: Acquirer Markup (20%) -->
        <g transform="translate(480, 96)">
          <rect x="0" y="0" width="230" height="230" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="230" height="32" rx="6" fill="#2e5aa8" fill-opacity="0.06"/>
          <text x="14" y="21" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">SHARE: 20%</text>

          <g transform="translate(14, 48)">
            <text x="0" y="18" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">收单行/网关毛利</text>
            <text x="0" y="42" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="13" font-weight="600">约 0.50% (Acquirer Markup)</text>
            <text x="0" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">资金用途：</text>
            <text x="0" y="92" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· POS 终端布放维护成本</text>
            <text x="0" y="112" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 线上支付网关 SDK 研发</text>
            <text x="0" y="132" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 商户反洗钱与巡检合规</text>
            <text x="0" y="156" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">Stripe / Adyen 核心盈利点</text>
          </g>
        </g>

        <!-- Segment 3: Scheme Assessment Fee (10%) -->
        <g transform="translate(730, 96)">
          <rect x="0" y="0" width="170" height="230" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="170" height="32" rx="6" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">SHARE: 10%</text>

          <g transform="translate(14, 48)">
            <text x="0" y="18" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">卡组织网络费</text>
            <text x="0" y="42" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="13" font-weight="600">约 0.25% (Assessment)</text>
            <text x="0" y="70" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">资金用途：</text>
            <text x="0" y="92" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· VisaNet 专网运维</text>
            <text x="0" y="112" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 全球品牌广告赞助</text>
            <text x="0" y="132" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 跨行清算仲裁服务</text>
            <text x="0" y="156" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10">高毛利轻资产商业壁垒</text>
          </g>
        </g>

        <!-- Bottom Stacked Proportion Bar -->
        <g transform="translate(60, 340)">
          <rect x="0" y="0" width="588" height="14" rx="2" fill="#bf4520"/>
          <rect x="590" y="0" width="166" height="14" rx="2" fill="#2e5aa8"/>
          <rect x="758" y="0" width="82" height="14" rx="2" fill="#4f5d75"/>
        </g>
      </svg>
