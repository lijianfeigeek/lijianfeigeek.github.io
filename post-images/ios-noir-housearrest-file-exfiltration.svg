<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-housearrest-file-exfiltration-title ios-noir-housearrest-file-exfiltration-desc" id="ios-noir-housearrest-file-exfiltration-root">
        <title id="ios-noir-housearrest-file-exfiltration-title">沙盒穿透漏洞：原生 HouseArrest 协议免密文件拖取模型</title>
        <desc id="ios-noir-housearrest-file-exfiltration-desc">开启 UIFileSharingEnabled 的应用在手机插线并信任电脑后，被 HouseArrest 免密码免 FaceID 拖取沙盒明文</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-housearrest-file-exfiltration-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-housearrest-file-exfiltration-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-housearrest-file-exfiltration-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-housearrest-file-exfiltration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-housearrest-file-exfiltration-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-housearrest-file-exfiltration-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Step 1: PC / USB Host (Left) -->
        <g transform="translate(40, 60)">
          <rect x="0" y="0" width="240" height="220" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="240" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">ATTACK SURFACE 01</text>
          
          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600">曾经信任过的外部电脑</text>
            <text x="0" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 曾插线点过“信任此电脑”</text>
            <text x="0" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 存在有效的 Pairing Record</text>
            <text x="0" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 甚至包括同一 Wi-Fi 局域网同步</text>
            <text x="0" y="112" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="10">发起 lockdownd RPC 握手</text>
          </g>
        </g>

        <!-- Step 2: Protocol Transport (Middle) -->
        <g transform="translate(360, 60)">
          <rect x="0" y="0" width="240" height="220" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.05"/>
          <rect x="0" y="0" width="240" height="32" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">EXPLOIT VECTOR · FOCAL</text>

          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#bf4520" font-family="'Geist', sans-serif" font-size="14" font-weight="600">原生 HouseArrest 协议</text>
            <text x="0" y="44" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">无需屏幕解锁！无需 Face ID！</text>
            <text x="0" y="66" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">直接指定应用 Bundle ID</text>
            <text x="0" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">利用 UIFileSharingEnabled</text>
            <text x="0" y="106" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">将应用沙盒根卷直接对主机导出</text>
            <text x="0" y="134" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">绕过全盘数据保护加密</text>
          </g>
        </g>

        <!-- Step 3: Exposed Data (Right) -->
        <g transform="translate(680, 60)">
          <rect x="0" y="0" width="240" height="220" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="240" height="32" rx="8" fill="#f8f9fa"/>
          <text x="14" y="21" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">EXFILTRATED ASSETS</text>

          <g transform="translate(14, 48)">
            <text x="0" y="20" fill="#bf4520" font-family="'Geist', sans-serif" font-size="14" font-weight="600">直接脱机拷贝的私密资产</text>
            <text x="0" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· KeePass .kdbx 离线密码库</text>
            <text x="0" y="64" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 银行电子流水 PDF 账单</text>
            <text x="0" y="84" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 离线 SQLite 聊天历史记录</text>
            <text x="0" y="104" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">· 个人手持身份证与简历附件</text>
            <text x="0" y="132" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10">整库明文秒级落盘主机</text>
          </g>
        </g>

        <!-- Connectors -->
        <path d="M 280 170 L 360 170" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-noir-housearrest-file-exfiltration-arrow-accent)"/>
        <path d="M 600 170 L 680 170" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-noir-housearrest-file-exfiltration-arrow-accent)"/>
      </svg>
