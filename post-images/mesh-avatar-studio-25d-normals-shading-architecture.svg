<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="mesh-avatar-normals-title mesh-avatar-normals-desc">
  <title id="mesh-avatar-normals-title">2.5D 法线场与高度图实时推导渲染架构</title>
  <desc id="mesh-avatar-normals-desc">通过轮廓倒角距离场、骨架解析椭球体积与原画多尺度高频浮雕，合成复合梯度法线场并驱动柔和与赛璐珞双着色器</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .code-pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #475569; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow4-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Layer 1: Inputs &amp; Generators (y=40) -->
  <!-- Col 1: Distance Field (x=40, y=40, w=270, h=150) -->
  <g transform="translate(40, 40)">
    <rect width="270" height="150" rx="8" class="card" />
    <text x="14" y="26" class="text-title">1. 双扫描倒角距离场</text>
    <text x="14" y="44" class="text-muted">silhouetteDistance 轮廓深度</text>
    <g transform="translate(14, 56)">
      <rect width="242" height="42" class="code-pill" />
      <text x="8" y="16" class="code-text">左上至右下 + 右下至左上遍历</text>
      <text x="8" y="32" class="code-text">欧几里得距离 Chamfer 逼近</text>
    </g>
    <text x="14" y="122" class="text-body">• 赋予平面角色轮廓圆滑胶囊曲面</text>
    <text x="14" y="138" class="text-body">• 边缘向内产生柔和法线过渡</text>
  </g>

  <!-- Col 2: Analytic Rig Height (x=345, y=40, w=270, h=150) -->
  <g transform="translate(345, 40)">
    <rect width="270" height="150" rx="8" class="card" />
    <text x="14" y="26" class="text-title">2. 骨架解析体积注入</text>
    <text x="14" y="44" class="text-muted">rigHeight 宏观三维几何场</text>
    <g transform="translate(14, 56)">
      <rect width="242" height="42" class="code-pill" />
      <text x="8" y="16" class="code-text">z_head = 0.8 * rx * sqrt(1 - (x/rx)^2)</text>
      <text x="8" y="32" class="code-text">鼻尖与面颊叠加 2D 高斯突起</text>
    </g>
    <text x="14" y="122" class="text-body">• 头部半椭球体构建宏观体积感</text>
    <text x="14" y="138" class="text-body">• 侧光照射下鼻子形成立体明暗</text>
  </g>

  <!-- Col 3: High-Frequency Detail (x=650, y=40, w=270, h=150) -->
  <g transform="translate(650, 40)">
    <rect width="270" height="150" rx="8" class="card" />
    <text x="14" y="26" class="text-title">3. 原画多尺度浮雕提取</text>
    <text x="14" y="44" class="text-muted">detailGradient 频域差分</text>
    <g transform="translate(14, 56)">
      <rect width="242" height="42" class="code-pill" />
      <text x="8" y="16" class="code-text">relief = fine_blur - coarse_blur</text>
      <text x="8" y="32" class="code-text">过滤宏观色块，保留暗色描边</text>
    </g>
    <text x="14" y="122" class="text-body">• 提取发丝缝隙与五官细微描线</text>
    <text x="14" y="138" class="text-body">• 避免原画固定阴影误判为凹陷</text>
  </g>

  <!-- Connectors from Layer 1 to Layer 2 -->
  <path d="M 175 190 L 175 220 Q 175 230 185 230 L 470 230 L 470 248" class="line" marker-end="url(#arrow4)" />
  <line x1="480" y1="190" x2="480" y2="248" class="line" marker-end="url(#arrow4)" />
  <path d="M 785 190 L 785 220 Q 785 230 775 230 L 490 230 L 490 248" class="line" marker-end="url(#arrow4)" />

  <!-- Layer 2: Normal Field Synthesis (Center Focal Card) -->
  <g transform="translate(240, 250)">
    <rect width="480" height="70" rx="8" class="focal-card" />
    <text x="20" y="26" class="text-focal-title">复合梯度法线场推导 (Composite Normal Synthesis)</text>
    <text x="20" y="44" class="text-muted">结合宏观倒角、三维椭球曲面与高频微浮雕，通过中心差分计算梯度</text>
    <text x="20" y="58" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#bf4520">法向量 N = normalize(-dx, -dy, 1.0)</text>
  </g>

  <!-- Connectors from Layer 2 to Shaders -->
  <path d="M 380 320 L 380 345 Q 380 355 370 355 L 255 355 L 255 368" class="focal-line" marker-end="url(#arrow4-focal)" />
  <path d="M 580 320 L 580 345 Q 580 355 590 355 L 705 355 L 705 368" class="focal-line" marker-end="url(#arrow4-focal)" />

  <!-- Layer 3: Dual Shaders -->
  <!-- Shader 1: Soft Shading (x=90, y=370, w=330, h=65) -->
  <g transform="translate(90, 370)">
    <rect width="330" height="65" rx="6" class="card" />
    <text x="14" y="24" class="text-title">Soft Shading (写实柔和光照)</text>
    <text x="14" y="42" class="text-muted">• 连续半兰伯特漫反射 (Half-Lambert) + Blinn-Phong 高光</text>
    <text x="14" y="56" class="text-muted">• 动态鼠标光源跟随 + 菲涅尔边缘光 (Rim Light)</text>
  </g>

  <!-- Shader 2: Cel Shading (x=540, y=370, w=330, h=65) -->
  <g transform="translate(540, 370)">
    <rect width="330" height="65" rx="6" class="card" />
    <text x="14" y="24" class="text-title">Cel Shading (二次元赛璐珞分色)</text>
    <text x="14" y="42" class="text-muted">• 二阶或三阶阶梯阈值切分 (Step Thresholds)</text>
    <text x="14" y="56" class="text-muted">• 保持纯净二次元手绘质感与硬边动态投影</text>
  </g>
</svg>