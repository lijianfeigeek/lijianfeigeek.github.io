<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-soft-compilation-execution-sequence-title dsh-soft-compilation-execution-sequence-desc" id="dsh-soft-compilation-execution-sequence-root">
      <title id="dsh-soft-compilation-execution-sequence-title">DSH 软编排编译期与执行期闭环交互时序</title>
      <desc id="dsh-soft-compilation-execution-sequence-desc">从画布图元提交、compile.ts 生成执行计划、主 Agent 挂载提示词到派生子任务的执行时序</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dsh-soft-compilation-execution-sequence-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #dsh-soft-compilation-execution-sequence-root text { font-family: "Geist", -apple-system, sans-serif; }
      #dsh-soft-compilation-execution-sequence-root .mono { font-family: "Geist Mono", monospace; }
      #dsh-soft-compilation-execution-sequence-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="dsh-soft-compilation-execution-sequence-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="dsh-soft-compilation-execution-sequence-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="dsh-soft-compilation-execution-sequence-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Lifelines -->
        <g transform="translate(60, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">画布 / 前端抽屉</text>
          <line x1="65" y1="36" x2="65" y2="370" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(250, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#bf4520" text-anchor="middle">编译器 compile.ts</text>
          <line x1="65" y1="36" x2="65" y2="370" stroke="#bf4520" stroke-dasharray="4 4" opacity="0.4"/>
        </g>

        <g transform="translate(440, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">工作区磁盘 / 镜像</text>
          <line x1="65" y1="36" x2="65" y2="370" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(630, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">主 Agent 协调者</text>
          <line x1="65" y1="36" x2="65" y2="370" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(800, 30)">
          <rect x="0" y="0" width="120" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="60" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Subagent 执行体</text>
          <line x1="60" y1="36" x2="60" y2="370" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <!-- Steps -->
        <!-- Step 1: UI -> Comp -->
        <path d="M 125 90 L 315 90" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-soft-compilation-execution-sequence-arrow-default)"/>
        <g transform="translate(145, 74)">
          <text x="0" y="11" font-size="11" fill="#2d3142">1. 提交前端画布 JSON 拓扑</text>
        </g>

        <!-- Step 2: Comp -> Disk -->
        <path d="M 315 130 L 505 130" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-soft-compilation-execution-sequence-arrow-accent)"/>
        <g transform="translate(330, 114)">
          <text x="0" y="11" font-size="11" font-weight="600" fill="#bf4520">2. 降阶编译生成 Plan Prompt 文档</text>
        </g>

        <!-- Step 3: LLM -> Disk -->
        <path d="M 695 170 L 505 170" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-soft-compilation-execution-sequence-arrow-default)"/>
        <g transform="translate(530, 154)">
          <text x="0" y="11" fill="#2d3142">3. 读取 Plan 提示词与前置约束</text>
        </g>

        <!-- Step 4: LLM -> Sub -->
        <path d="M 695 210 L 860 210" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#dsh-soft-compilation-execution-sequence-arrow-link)"/>
        <g transform="translate(710, 194)">
          <text x="0" y="11" font-size="11" font-weight="600" fill="#2e5aa8">4. 派生专用任务 Subagent</text>
        </g>

        <!-- Step 5: Sub -> Disk -->
        <path d="M 860 255 L 505 255" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-soft-compilation-execution-sequence-arrow-default)"/>
        <g transform="translate(560, 239)">
          <text x="0" y="11" fill="#2d3142">5. 执行原子工具调用并写入产出物</text>
        </g>

        <!-- Step 6: LLM -> UI (RunBoard) -->
        <path d="M 695 300 L 125 300" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dsh-soft-compilation-execution-sequence-arrow-accent)"/>
        <g transform="translate(260, 284)">
          <text x="0" y="11" font-size="11" font-weight="600" fill="#bf4520">6. 通过 WebSocket 实时推流 RunBoard 看板数据</text>
        </g>

        <!-- Step 7: UI Update -->
        <path d="M 125 340 L 315 340" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#dsh-soft-compilation-execution-sequence-arrow-default)"/>
        <g transform="translate(145, 324)">
          <text x="0" y="11" fill="#2d3142">7. 更新节点状态与动态高亮流转</text>
        </g>
      </g>
    </svg>
