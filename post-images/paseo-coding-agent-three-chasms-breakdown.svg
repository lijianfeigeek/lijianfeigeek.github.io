<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="paseo-coding-agent-three-chasms-breakdown-title paseo-coding-agent-three-chasms-breakdown-desc">
  <title id="paseo-coding-agent-three-chasms-breakdown-title">多 Agent 并发开发的三重断层模型</title>
  <desc id="paseo-coding-agent-three-chasms-breakdown-desc">分析并发多 Agent 场景下的模型割裂、单工作树踩踏以及远程安全焦虑三重痛点</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header Banner -->
  <g transform="translate(32, 24)">
    <rect width="896" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="25" class="title">PASEO 痛点解构：单兵 CODING AGENT 迈向工业级并发协同的三重断层</text>
    <text x="880" y="25" text-anchor="end" class="tag">THREE CRITICAL CHASMS</text>
  </g>

  <!-- Column 1: 模型割裂与各立门户 -->
  <g transform="translate(32, 80)">
    <rect width="285" height="316" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="285" height="44" fill="#f8fafc" rx="8" />
    <rect y="36" width="285" height="8" fill="#f8fafc" />
    <line x1="0" y1="44" x2="285" y2="44" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="27" class="title">断层 1：模型割裂与各立门户</text>
    <text x="269" y="27" text-anchor="end" class="tag">ISOLATED</text>

    <!-- Sub-cards inside Col 1 -->
    <g transform="translate(12, 56)">
      <rect width="261" height="64" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">Claude Code / Opus</text>
      <text x="12" y="44" class="desc">长上下文推理强，但缺乏跨模型会话流转</text>
    </g>

    <g transform="translate(12, 130)">
      <rect width="261" height="64" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">OpenAI Codex / GPT-4o</text>
      <text x="12" y="44" class="desc">密集代码生成高频，但参数契约各自为政</text>
    </g>

    <g transform="translate(12, 204)">
      <rect width="261" height="96" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <text x="12" y="24" class="coral-title" style="font-size:12px;">痛点爆发：上下文与度量断崖</text>
      <text x="12" y="44" class="desc" style="fill:#742a2a;">• 不同 Agent 工具格式与输出契约不兼容</text>
      <text x="12" y="64" class="desc" style="fill:#742a2a;">• 无法无缝把架构规划接力给实现型 Agent</text>
      <text x="12" y="84" class="desc" style="fill:#742a2a;">• 碎片化命令行各自占领终端，无集中看板</text>
    </g>
  </g>

  <!-- Column 2: 单工作树并发踩踏 (Core Accent) -->
  <g transform="translate(337, 80)">
    <rect width="286" height="316" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="286" height="44" fill="#fff5f5" rx="8" />
    <rect y="36" width="286" height="8" fill="#fff5f5" />
    <line x1="0" y1="44" x2="286" y2="44" stroke="#fed7d7" stroke-width="1" />
    <text x="16" y="27" class="coral-title">断层 2：单工作树并发踩踏</text>
    <text x="270" y="27" text-anchor="end" class="coral-tag">CORE BOTTLENECK</text>

    <g transform="translate(12, 56)">
      <rect width="262" height="64" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">Agent A: 重构 auth.ts</text>
      <text x="12" y="44" class="desc">修改签名，改写中间件依赖并暂存</text>
    </g>

    <g transform="translate(12, 130)">
      <rect width="262" height="64" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">Agent B: 修复 user.ts 并 build</text>
      <text x="12" y="44" class="desc">共享同个 working tree，触发全局编译</text>
    </g>

    <g transform="translate(12, 204)">
      <rect width="262" height="96" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <text x="12" y="24" class="coral-title" style="font-size:12px;">严重事故：索引污染与代码覆盖</text>
      <text x="12" y="44" class="desc" style="fill:#742a2a;">• Git index.lock 频繁冲突导致执行死锁</text>
      <text x="12" y="64" class="desc" style="fill:#742a2a;">• Agent A 未提交代码被 Agent B 意外回滚</text>
      <text x="12" y="84" class="desc" style="fill:#742a2a;">• 无法并行运行多个长任务，并发度退化为 1</text>
    </g>
  </g>

  <!-- Column 3: 移动端脱节与远程安全焦虑 -->
  <g transform="translate(643, 80)">
    <rect width="285" height="316" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="285" height="44" fill="#f8fafc" rx="8" />
    <rect y="36" width="285" height="8" fill="#f8fafc" />
    <line x1="0" y1="44" x2="285" y2="44" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="27" class="title">断层 3：远程脱节与安全焦虑</text>
    <text x="269" y="27" text-anchor="end" class="tag">REMOTE ACCESS</text>

    <g transform="translate(12, 56)">
      <rect width="261" height="64" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">工位离开与通勤盲盒</text>
      <text x="12" y="44" class="desc">模型持续产出，无法实时查看进展与日志</text>
    </g>

    <g transform="translate(12, 130)">
      <rect width="261" height="64" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="24" class="title" style="font-size:12px;">高危动作人工审批阻断</text>
      <text x="12" y="44" class="desc">如 `git push -f` 阻塞挂起，无人应答致失败</text>
    </g>

    <g transform="translate(12, 204)">
      <rect width="261" height="96" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <text x="12" y="24" class="coral-title" style="font-size:12px;">两难困境：暴露风险 vs 协作中断</text>
      <text x="12" y="44" class="desc" style="fill:#742a2a;">• SSH / 内网穿透暴露本地端口极度危险</text>
      <text x="12" y="64" class="desc" style="fill:#742a2a;">• 商业机密源码与 API 凭证面临泄露威胁</text>
      <text x="12" y="84" class="desc" style="fill:#742a2a;">• 缺少端到端物理加密保护的移动端信道</text>
    </g>
  </g>
</svg>