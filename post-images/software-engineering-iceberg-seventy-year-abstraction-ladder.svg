<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="se-ladder-title se-ladder-desc">
  <title id="se-ladder-title">抽象阶梯七十年跃迁史：软件工程师到底“死”过多少次？</title>
  <desc id="se-ladder-desc">从打孔纸带、汇编语言、4GL可视化拖拽、云原生微服务到Coding Agent时代，展示工具升级消灭语法体力劳动、推动系统复杂度爆发的杰文斯悖论演进史。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .era-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">抽象阶梯七十年跃迁史：软件工程师到底“死”过多少次？</text>
    <text class="subtitle" x="0" y="20">工具升级消灭的只有低级语法体力劳动；杰文斯悖论驱动软件对现实世界更大规模的吞吐与渗透</text>
  </g>

  <!-- 5 Era Horizontal Progression -->
  <!-- Era 1: 1950s -->
  <g transform="translate(48, 86)">
    <rect width="164" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="era-title" fill="#334155" x="0" y="0">1950s 纸带打孔</text>
      <text class="mono" fill="#64748b" x="0" y="16">二进制物理孔洞</text>
      
      <g transform="translate(0, 32)">
        <text class="card-body" x="0" y="12">当时的恐慌：</text>
        <text class="card-body" fill="#be123c" x="0" y="28">“汇编语言出现了，</text>
        <text class="card-body" fill="#be123c" x="0" y="44">打孔员要彻底完了”</text>

        <text class="card-body" x="0" y="80">被消灭的劳动：</text>
        <text class="mono" fill="#475569" x="0" y="96">物理卡片针孔冲压</text>

        <text class="card-body" x="0" y="130">升维后的能力：</text>
        <text class="mono" fill="#15803d" x="0" y="146">助记符与程序指令</text>
      </g>
    </g>
  </g>

  <!-- Era 2: 1960s-1970s -->
  <g transform="translate(220, 86)">
    <rect width="164" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="era-title" fill="#334155" x="0" y="0">1970s 高级语言</text>
      <text class="mono" fill="#64748b" x="0" y="16">Fortran / C 时代</text>
      
      <g transform="translate(0, 32)">
        <text class="card-body" x="0" y="12">当时的恐慌：</text>
        <text class="card-body" fill="#be123c" x="0" y="28">“C 语言效率太低，</text>
        <text class="card-body" fill="#be123c" x="0" y="44">汇编师不可替代”</text>

        <text class="card-body" x="0" y="80">被消灭的劳动：</text>
        <text class="mono" fill="#475569" x="0" y="96">手动调配寄存器</text>

        <text class="card-body" x="0" y="130">升维后的能力：</text>
        <text class="mono" fill="#15803d" x="0" y="146">指针、算法与操作系统</text>
      </g>
    </g>
  </g>

  <!-- Era 3: 1990s -->
  <g transform="translate(392, 86)">
    <rect width="164" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="era-title" fill="#334155" x="0" y="0">1990s 4GL 可视化</text>
      <text class="mono" fill="#64748b" x="0" y="16">VB / Delphi 拖拽</text>
      
      <g transform="translate(0, 32)">
        <text class="card-body" x="0" y="12">当时的恐慌：</text>
        <text class="card-body" fill="#be123c" x="0" y="28">“鼠标拖拽搞定软件，</text>
        <text class="card-body" fill="#be123c" x="0" y="44">程序员即将绝迹”</text>

        <text class="card-body" x="0" y="80">被消灭的劳动：</text>
        <text class="mono" fill="#475569" x="0" y="96">手绘像素级 GUI</text>

        <text class="card-body" x="0" y="130">升维后的能力：</text>
        <text class="mono" fill="#15803d" x="0" y="146">面向对象与企业级应用</text>
      </g>
    </g>
  </g>

  <!-- Era 4: 2010s -->
  <g transform="translate(564, 86)">
    <rect width="164" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(12, 16)">
      <text class="era-title" fill="#334155" x="0" y="0">2010s 云原生微服务</text>
      <text class="mono" fill="#64748b" x="0" y="16">K8s / Serverless</text>
      
      <g transform="translate(0, 32)">
        <text class="card-body" x="0" y="12">当时的恐慌：</text>
        <text class="card-body" fill="#be123c" x="0" y="28">“无需运维服务器，</text>
        <text class="card-body" fill="#be123c" x="0" y="44">运维工程师全体失业”</text>

        <text class="card-body" x="0" y="80">被消灭的劳动：</text>
        <text class="mono" fill="#475569" x="0" y="96">物理机房扛机器布线</text>

        <text class="card-body" x="0" y="130">升维后的能力：</text>
        <text class="mono" fill="#15803d" x="0" y="146">基础设施即代码 (IaC)</text>
      </g>
    </g>
  </g>

  <!-- Era 5: 2020s+ (Current AI Agent) -->
  <g transform="translate(736, 86)">
    <rect width="176" height="260" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(12, 16)">
      <text class="era-title" fill="#15803d" x="0" y="0">2020s Coding Agent</text>
      <text class="mono" fill="#16a34a" x="0" y="16">AI 原生自主协同</text>
      
      <g transform="translate(0, 32)">
        <text class="card-body" x="0" y="12">当前的恐慌：</text>
        <text class="card-body" fill="#be123c" x="0" y="28">“AI 会写代码了，</text>
        <text class="card-body" fill="#be123c" x="0" y="44">工程师要彻底清零”</text>

        <text class="card-body" x="0" y="80">正在消灭的劳动：</text>
        <text class="mono" fill="#475569" x="0" y="96">低维增删改查敲语法</text>

        <text class="card-body" x="0" y="130">全面升维的能力：</text>
        <text class="mono" fill="#15803d" x="0" y="146">规格工程 / Eval 评测 / 架构兜底</text>
      </g>
    </g>
  </g>

  <!-- Bottom: Jevons Paradox &amp; Evolution Trajectory -->
  <g transform="translate(48, 360)">
    <rect width="864" height="96" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <text class="card-title" fill="#1d4ed8" x="0" y="0">核心演进铁律：杰文斯悖论 (Jevons Paradox) 在软件工程中的绝对主导</text>
      <text class="card-body" x="0" y="18">当写单行代码的边际成本趋近于零时，人类对高质量、高复杂度分布式系统的需求不仅没有减少，反而呈指数级爆发！</text>
      <text class="mono" fill="#2563eb" x="0" y="38">工程师职能进化轨迹：管理物理内存寄存器 → 编写高级业务逻辑 → 分布式系统治理 → 编排 Agent 集群并定义系统规格</text>
      <text class="mono" fill="#15803d" x="0" y="56">CONCLUSION: 被时代淘汰的永远只有不会思考的敲语法机器，真正的系统工程师壁垒愈发崇高</text>
    </g>
  </g>
</svg>