<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" role="img" aria-labelledby="sayall-hci-mcp-title sayall-hci-mcp-desc">
  <title id="sayall-hci-mcp-title">SayAll 私有 HCI 抓包租约与本地只读 MCP 回眸双信任域架构</title>
  <desc id="sayall-hci-mcp-desc">展示 SayAll 如何通过带租约自愈的 Root LaunchDaemon 与 BTPacketLogger XPC 内存解析苹果 Siri Remote 语音，以及通过无障碍差量采集与令牌哈希鉴权向本地 AI Agent 暴露只读 MCP 转录历史。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="516" fill="#f8fafc"/>

  <!-- Header -->
  <text x="28" y="32" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="16" font-weight="700">双边界工程全景：Siri Remote 私有 HCI 抓包与本地只读 MCP“回眸”</text>
  <text x="28" y="50" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">ARCHITECTURE · PRIVILEGE-SCOPED HCI LEASE (LEFT) &amp; ACCESSIBILITY TRANSCRIPT MCP (RIGHT)</text>

  <!-- Trust Zones (drawn BEFORE arrows and nodes) -->
  <!-- Zone 1: Privileged Bluetooth HCI Boundary -->
  <rect x="28" y="72" width="288" height="368" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="40" y="64" width="204" height="16" rx="2" fill="#f8fafc"/>
  <text x="142" y="75" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">PRIVILEGED HCI / XPC ZONE</text>

  <!-- Zone 2: SayAll Host Userland -->
  <rect x="336" y="72" width="288" height="368" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="348" y="64" width="184" height="16" rx="2" fill="#f8fafc"/>
  <text x="440" y="75" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">SAYALL HOST USERLAND</text>

  <!-- Zone 3: Local Agent & MCP Sandbox -->
  <rect x="644" y="72" width="288" height="368" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="656" y="64" width="188" height="16" rx="2" fill="#f8fafc"/>
  <text x="750" y="75" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">LOCAL AGENT &amp; MCP SANDBOX</text>

  <!-- Connectors (drawn BEFORE nodes) -->
  <!-- Host VoiceController -> Root HCIService (lease acquire) -->
  <path d="M 356,144 H 296" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- Root HCIService -> BTPacketLogger XPC (enable HCI plist + auth right) -->
  <path d="M 172,188 V 224" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- BTPacketLogger XPC -> XPCVoiceParser (in-memory ACL/ATT stream) -->
  <path d="M 172,304 V 336" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- XPCVoiceParser -> Host VoiceController / AudioOutput (Opus -> PCM) -->
  <path d="M 296,380 H 316 Q 324,380 324,372 V 168 Q 324,160 332,160 H 356" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

  <!-- Host TranscriptCapture -> MCP HistoryStore (save JSONL) -->
  <path d="M 604,264 H 664" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- MCP HistoryStore -> SayAllMCP Stdio -->
  <path d="M 788,304 V 336" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-link)"/>
  <!-- AuthStore -> SayAllMCP Stdio (routed via y=206 gap above HistoryStore) -->
  <path d="M 788,188 V 198 Q 788,206 796,206 H 916 Q 924,206 924,214 V 372 Q 924,380 916,380 H 912" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- Host AgentConfigure -> AuthStore (hops over y=264 JSONL path at x=628) -->
  <path d="M 604,380 H 620 Q 628,380 628,372 V 272 a 8,8 0 0,0 0,-16 V 152 Q 628,144 636,144 H 664" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow Labels with opaque masks -->
  <rect x="300" y="124" width="52" height="12" rx="2" fill="#f8fafc"/>
  <text x="326" y="133" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">XPC LEASE</text>

  <rect x="180" y="198" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="218" y="207" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">ENABLE TRACE</text>

  <rect x="180" y="312" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="222" y="321" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">IN-MEMORY ACL</text>

  <rect x="608" y="244" width="52" height="12" rx="2" fill="#f8fafc"/>
  <text x="634" y="253" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">JSONL</text>

  <rect x="796" y="312" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="840" y="321" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">READ-ONLY QUERY</text>

  <!-- Zone 1 Nodes -->
  <g transform="translate(48, 100)">
    <rect x="0" y="0" width="248" height="88" rx="6" fill="#f8fafc" stroke="#2d3142" stroke-width="1.2"/>
    <rect x="12" y="10" width="112" height="14" rx="2" fill="#e2e8f0"/>
    <text x="68" y="20" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">ROOT LAUNCHDAEMON</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">AppleRemoteHCIService</text>
    <text x="12" y="59" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">带引用租约写入调试 plist 与权限</text>
    <text x="12" y="75" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">TeamID L3QHLDRPAY · 退出即自动还原</text>
  </g>

  <g transform="translate(48, 224)">
    <rect x="0" y="0" width="248" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.1"/>
    <rect x="12" y="10" width="96" height="14" rx="2" fill="#e0f2fe"/>
    <text x="60" y="20" fill="#0369a1" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">MACOS PRIVATE XPC</text>
    <text x="12" y="40" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">BTPacketLogger 服务</text>
    <text x="12" y="57" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">速率限流 8 MB/s · 20,000 pkt/s</text>
    <text x="12" y="72" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">com.apple.PacketLogger.HCI</text>
  </g>

  <g transform="translate(48, 336)">
    <rect x="0" y="0" width="248" height="88" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="248" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="12" y="10" width="96" height="14" rx="2" fill="#bf4520"/>
    <text x="60" y="20" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">FOCAL · IN-MEMORY</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">AppleRemoteXPCVoiceParser</text>
    <text x="12" y="59" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">重组 L2CAP 0x0004 → ATT 0x1B/0x1D</text>
    <text x="12" y="75" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">3 连续帧锁定源 · 剥离 Opus 0xB8</text>
  </g>

  <!-- Zone 2 Nodes -->
  <g transform="translate(356, 100)">
    <rect x="0" y="0" width="248" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <rect x="12" y="10" width="112" height="14" rx="2" fill="#f1f5f9"/>
    <text x="68" y="20" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">SIRI REMOTE CONTROL</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">VoiceController &amp; Touch</text>
    <text x="12" y="59" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">Feature 0x98 启停 + Multitouch 触控</text>
    <text x="12" y="75" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">VID 0x004C · PID 0x0315 · dlopen</text>
  </g>

  <g transform="translate(356, 220)">
    <rect x="0" y="0" width="248" height="88" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="248" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="12" y="10" width="96" height="14" rx="2" fill="#bf4520"/>
    <text x="60" y="20" fill="#ffffff" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">FOCAL · AX DIFF</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">TranscriptCaptureCoordinator</text>
    <text x="12" y="59" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">只采集稳定新增语音出字 · 防读聊天</text>
    <text x="12" y="75" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">拦截 AXSecureTextField &amp; 密码词</text>
  </g>

  <g transform="translate(356, 336)">
    <rect x="0" y="0" width="248" height="88" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1.1"/>
    <rect x="12" y="10" width="92" height="14" rx="2" fill="#e2e8f0"/>
    <text x="58" y="20" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">AGENT ONBOARD</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">AgentConfigurationCommand</text>
    <text x="12" y="59" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">无头结构化自动配对与验证接口</text>
    <text x="12" y="75" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">--agent-configure --auto --json</text>
  </g>

  <!-- Zone 3 Nodes -->
  <g transform="translate(664, 100)">
    <rect x="0" y="0" width="248" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <rect x="12" y="10" width="96" height="14" rx="2" fill="#f1f5f9"/>
    <text x="60" y="20" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">TOKEN &amp; AUDIT</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">SayAllMCPAuthorizationStore</text>
    <text x="12" y="59" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">每客户端独立 UUID + 可撤销凭证</text>
    <text x="12" y="75" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">transcripts.read.all · AuditLog</text>
  </g>

  <g transform="translate(664, 224)">
    <rect x="0" y="0" width="248" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.1"/>
    <rect x="12" y="10" width="88" height="14" rx="2" fill="#f1f5f9"/>
    <text x="56" y="20" fill="#334155" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">LOCAL STORAGE</text>
    <text x="12" y="40" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">SayAllMCPHistoryStore</text>
    <text x="12" y="57" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">按 App 与日期分片存储（无音频）</text>
    <text x="12" y="72" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">max 8,000 chars · cursor 分页</text>
  </g>

  <g transform="translate(664, 336)">
    <rect x="0" y="0" width="248" height="88" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="12" y="10" width="92" height="14" rx="2" fill="#e0f2fe"/>
    <text x="58" y="20" fill="#0369a1" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">STDIO MCP SERVER</text>
    <text x="12" y="42" fill="#0f172a" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="700">SayAllMCP (2025-11-25)</text>
    <text x="12" y="59" fill="#475569" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">只读暴露双工具给 Claude / WorkBuddy</text>
    <text x="12" y="75" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">list_transcript_apps · query_transcripts</text>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(28, 460)">
    <rect x="0" y="2" width="14" height="10" rx="2" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="22" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">零落盘与隐私熔断焦点（内存 ACL 解析 / AX 安全文本隔离）</text>

    <line x1="400" y1="7" x2="432" y2="7" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-link)"/>
    <text x="440" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">受控数据 / 租约控制流</text>

    <line x1="600" y1="7" x2="632" y2="7" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="640" y="11" fill="#334155" font-family="'Geist', 'PingFang SC', sans-serif" font-size="10">鉴权与辅助配置通道</text>

    <text x="0" y="34" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SOURCE: AppleRemoteHCIService · AppleRemoteXPCVoiceParser.swift · TranscriptCaptureCoordinator.swift · SayAllMCPKit</text>
  </g>
</svg>
