<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="cc-state-title cc-state-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Segoe UI',Roboto,sans-serif;">
  <title id="cc-state-title">Claude Code Subagent 运行时状态机、自愈恢复与安全扫描闭环</title>
  <desc id="cc-state-desc">展示 Subagent 从并发槽位准入、前后台执行与权限透传、API 断流续写与模型降级链、输出安全扫描器到独立 JSONL 持久化及 SendMessage 唤醒恢复的完整状态转换。</desc>
  <defs>
    <pattern id="cc-dots-2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="rgba(15,23,42,0.08)"/>
    </pattern>
    <marker id="st-arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="st-arr-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="st-arr-link" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="st-arr-green" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="620" fill="#ffffff"/>
  <rect width="980" height="620" fill="url(#cc-dots-2)" opacity="0.65"/>

  <!-- Header -->
  <g transform="translate(32, 20)">
    <rect x="0" y="0" width="916" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="18" y="25" font-size="16" font-weight="700" fill="#0f172a">Subagent 运行时状态机：并发槽位、断流自愈与输出安全护栏</text>
    <text x="18" y="43" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">CONCURRENCY SLOTS (20) · AUTO FALLBACK · HARNESS OUTPUT SCANNER · SENDMESSAGE RESUME</text>
    <text x="898" y="32" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0284c7" text-anchor="end">TYPE: STATE MACHINE</text>
  </g>

  <!-- Band Labels (Background subtle zones) -->
  <g transform="translate(32, 88)">
    <rect x="0" y="0" width="916" height="100" rx="6" fill="rgba(15,23,42,0.015)" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="14" y="18" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#64748b">WAIT &amp; SELF-RECOVERY BAND (PERMISSION SURFACE / STREAM CONTINUATION / FALLBACK CHAIN)</text>

    <rect x="0" y="114" width="916" height="156" rx="6" fill="rgba(255,255,255,0.75)" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="14" y="132" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#334155">PRIMARY EXECUTION &amp; SECURITY SCANNER PIPELINE</text>

    <rect x="0" y="284" width="916" height="148" rx="6" fill="rgba(2,132,199,0.025)" stroke="#bae6fd" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="14" y="302" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0369a1">PARTIAL / CANCELLED BRANCHES &amp; SENDMESSAGE RESUME LOOP</text>
  </g>

  <!-- TRANSITIONS (Drawn BEFORE state boxes for clean z-order) -->
  <!-- Start Dot to Spawn -->
  <line x1="60" y1="280" x2="88" y2="280" stroke="#0f172a" stroke-width="1.5" marker-end="url(#st-arr-muted)"/>

  <!-- Spawn -> Active Run -->
  <line x1="252" y1="280" x2="296" y2="280" stroke="#64748b" stroke-width="1.3" marker-end="url(#st-arr-muted)"/>
  <rect x="256" y="256" width="38" height="14" rx="2" fill="#ffffff"/>
  <text x="275" y="266" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">PASS</text>

  <!-- Active Run -> Output Scanner (Focal Coral) -->
  <line x1="484" y1="280" x2="532" y2="280" stroke="#bf4520" stroke-width="1.6" marker-end="url(#st-arr-accent)"/>
  <rect x="488" y="256" width="42" height="14" rx="2" fill="#ffffff"/>
  <text x="509" y="266" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">REPORT</text>

  <!-- Output Scanner -> Persisted Done -->
  <line x1="712" y1="280" x2="748" y2="280" stroke="#059669" stroke-width="1.4" marker-end="url(#st-arr-green)"/>
  <rect x="713" y="256" width="34" height="14" rx="2" fill="#ffffff"/>
  <text x="730" y="266" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#047857" text-anchor="middle">CLEAN</text>

  <!-- Persisted Done -> End Ringed Dot -->
  <line x1="912" y1="280" x2="932" y2="280" stroke="#0f172a" stroke-width="1.4"/>

  <!-- Active Run <-> Permission Surface (Upper left loop, orthogonal rounded r=8) -->
  <path d="M 352 232 L 352 184 Q 352 176 344 176 L 308 176 L 308 172" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr-muted)"/>
  <rect x="266" y="190" width="76" height="14" rx="2" fill="#ffffff"/>
  <text x="304" y="200" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">ASK MAIN</text>

  <path d="M 378 172 L 378 228" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#st-arr-muted)"/>
  <rect x="386" y="190" width="76" height="14" rx="2" fill="#ffffff"/>
  <text x="424" y="200" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">GRANT/ESC</text>

  <!-- Active Run <-> API Self-Recovery (Upper right loop) -->
  <path d="M 442 232 L 442 184 Q 442 176 450 176 L 564 176 L 564 172" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr-muted)"/>
  <rect x="450" y="156" width="74" height="14" rx="2" fill="#ffffff"/>
  <text x="487" y="166" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">API CUTOFF</text>

  <path d="M 596 172 L 596 196 Q 596 204 588 204 L 466 204 Q 458 204 458 212 L 458 228" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#st-arr-link)"/>
  <rect x="488" y="208" width="90" height="14" rx="2" fill="#ffffff"/>
  <text x="533" y="218" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">RETRY / FALLBACK</text>

  <!-- Active Run -> MaxTurns Partial (Down left) -->
  <path d="M 340 328 L 340 398" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#st-arr-muted)"/>
  <rect x="266" y="346" width="66" height="14" rx="2" fill="#ffffff"/>
  <text x="299" y="356" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">MAX TURNS</text>

  <!-- Active Run -> User Cancel (Down middle) -->
  <path d="M 432 328 L 432 398" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#st-arr-accent)"/>
  <rect x="440" y="346" width="74" height="14" rx="2" fill="#ffffff"/>
  <text x="477" y="356" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#bf4520" text-anchor="middle">PRESS X / STOP</text>

  <!-- Persisted Done -> SendMessage Resume (Down right) -->
  <path d="M 830 328 L 830 398" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#st-arr-link)"/>
  <rect x="748" y="346" width="74" height="14" rx="2" fill="#ffffff"/>
  <text x="785" y="356" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">WAKE BY ID</text>

  <!-- MaxTurns Partial -> SendMessage Resume -->
  <line x1="364" y1="454" x2="644" y2="454" stroke="none"/>
  <path d="M 270 482 L 270 502 Q 270 510 278 510 L 748 510 Q 756 510 756 502 L 756 488" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#st-arr-link)"/>
  <rect x="462" y="502" width="112" height="14" rx="2" fill="#ffffff"/>
  <text x="518" y="512" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">RESUME PARTIAL</text>

  <!-- SendMessage Resume -> Active Run (Loop back up along x=612 -> 390) -->
  <path d="M 648 442 L 604 442 Q 596 442 596 434 L 596 368 Q 596 360 588 360 L 398 360 Q 390 360 390 352 L 390 332" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#st-arr-link)"/>
  <rect x="526" y="348" width="116" height="14" rx="2" fill="#ffffff"/>
  <text x="584" y="358" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0369a1" text-anchor="middle">RE-WARM CACHE</text>

  <!-- Start & End Dots -->
  <circle cx="52" cy="280" r="6" fill="#0f172a"/>
  <circle cx="940" cy="280" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="940" cy="280" r="4.5" fill="#0f172a"/>

  <!-- PRIMARY STATES (y = 232, height = 96) -->
  <!-- State 1: Spawn Gate -->
  <g transform="translate(92, 232)">
    <rect x="0" y="0" width="160" height="96" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <rect x="10" y="8" width="54" height="14" rx="3" fill="#e2e8f0"/>
    <text x="37" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="middle">01 SPAWN</text>
    <text x="80" y="40" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">准入与并发门控</text>
    <text x="80" y="59" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">并发≤20 · 嵌套深度≤3</text>
    <text x="80" y="77" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">触发 SubagentStart Hook</text>
  </g>

  <!-- State 2: Active Execution -->
  <g transform="translate(300, 232)">
    <rect x="0" y="0" width="184" height="96" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
    <rect x="10" y="8" width="60" height="14" rx="3" fill="#e2e8f0"/>
    <text x="40" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="middle">02 ACTIVE</text>
    <text x="92" y="40" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">独立上下文循环执行</text>
    <text x="92" y="59" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">PreToolUse / PostToolUse</text>
    <text x="92" y="77" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">Auto分类器 · Worktree隔离</text>
  </g>

  <!-- State 3: Output Security Scanner (FOCAL CORAL) -->
  <g transform="translate(536, 232)">
    <rect x="0" y="0" width="176" height="96" rx="8" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="10" y="8" width="76" height="14" rx="3" fill="rgba(191,69,32,0.16)"/>
    <text x="48" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">03 GUARDRAIL</text>
    <text x="88" y="40" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">输出指令注入扫描器</text>
    <text x="88" y="59" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#334155" text-anchor="middle">伪造标签插反斜杠转义</text>
    <text x="88" y="77" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#9a3412" text-anchor="middle">注入 [harness:] 与无权头</text>
  </g>

  <!-- State 4: Persisted & Done -->
  <g transform="translate(752, 232)">
    <rect x="0" y="0" width="160" height="96" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
    <rect x="10" y="8" width="60" height="14" rx="3" fill="#d1fae5"/>
    <text x="40" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#047857" text-anchor="middle">04 DONE</text>
    <text x="80" y="40" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">独立落盘与完成通告</text>
    <text x="80" y="59" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#065f46" text-anchor="middle">agent-{id}.jsonl (30天)</text>
    <text x="80" y="77" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#047857" text-anchor="middle">Stop→SubagentStop 清理</text>
  </g>

  <!-- UPPER BAND STATES (Wait & Recovery, y = 114, height = 58) -->
  <g transform="translate(216, 114)">
    <rect x="0" y="0" width="212" height="58" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <text x="106" y="23" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">主会话权限透传弹窗</text>
    <text x="106" y="43" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">Esc 仅拒单次调用 · 持久授权同步主会话</text>
  </g>

  <g transform="translate(532, 114)">
    <rect x="0" y="0" width="248" height="58" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="124" y="23" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">API 断流续写与 Fallback 模型降级</text>
    <text x="124" y="43" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">纯文本截断自动催促继续 · 失败切备用链 ⚠</text>
  </g>

  <!-- LOWER BAND STATES (y = 402, height = 80) -->
  <!-- Partial MaxTurns -->
  <g transform="translate(184, 402)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <text x="90" y="25" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Partial 未竟输出</text>
    <text x="90" y="45" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">触达 maxTurns 标记 partial</text>
    <text x="90" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">保留现场等待后续唤醒接力</text>
  </g>

  <!-- User Stopped -->
  <g transform="translate(396, 402)">
    <rect x="0" y="0" width="184" height="80" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
    <text x="92" y="25" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">用户手动熔断 (LOCKED)</text>
    <text x="92" y="45" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#881337" text-anchor="middle">/tasks 按 x 或 SDK stop_task</text>
    <text x="92" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" text-anchor="middle">拒绝自动唤醒 · 需人工先输入</text>
  </g>

  <!-- SendMessage Resume -->
  <g transform="translate(648, 402)">
    <rect x="0" y="0" width="236" height="80" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.3"/>
    <text x="118" y="25" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">SendMessage 唤醒复原</text>
    <text x="118" y="45" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0f172a" text-anchor="middle">按 ID 或别名唤醒 (防同名抢占校验)</text>
    <text x="118" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">跳过并发检查 · 续用原工具池与缓存</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(32, 536)">
    <line x1="0" y1="0" x2="916" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <circle cx="72" cy="20" r="5" fill="#0f172a"/>
    <text x="84" y="24" font-size="11" fill="#334155">初始创建</text>

    <rect x="150" y="13" width="14" height="14" rx="3" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="172" y="24" font-size="11" fill="#334155">焦点护栏：输出提示词注入扫描</text>

    <rect x="370" y="13" width="14" height="14" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="392" y="24" font-size="11" fill="#334155">异步自愈与唤醒恢复</text>

    <rect x="536" y="13" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="558" y="24" font-size="11" fill="#334155">独立 Transcript 持久化</text>

    <circle cx="718" cy="20" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
    <circle cx="718" cy="20" r="3.5" fill="#0f172a"/>
    <text x="732" y="24" font-size="11" fill="#334155">主会话接收回执</text>

    <text x="0" y="52" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">TRANSCRIPT: ~/.claude/projects/{project}/{sessionId}/subagents/agent-{agentId}.jsonl &amp; .meta.json</text>
    <text x="916" y="52" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">v2.1.246+ PARTIAL · v2.1.299+ ID RECOVERY</text>
  </g>
</svg>
