<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockxy-local-mcp-server-architecture-title rockxy-local-mcp-server-architecture-desc">
  <title id="rockxy-local-mcp-server-architecture-title">Rockxy 内置本地 MCP Server 与 AI 智能体协同架构图</title>
  <desc id="rockxy-local-mcp-server-architecture-desc">展示 Cursor IDE、Claude Desktop 通过标准 stdio 协议与 Rockxy 本地 MCP Server 交互，由自动脱敏网关保护凭据安全</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="mcp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: AI Coding Workspace Zone -->
  <g transform="translate(40, 30)">
    <rect width="360" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="32" class="label-title">现代 AI 编码工作区 (AI IDE Workspace)</text>
    <text x="20" y="52" class="text-body">智能编程助手直接调用本地 MCP 协议查询网络现场</text>
    <line x1="20" y1="68" x2="340" y2="68" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Cursor IDE Card -->
    <g transform="translate(20, 85)">
      <rect width="320" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="28" class="label-title">Cursor IDE</text>
      <text x="16" y="50" class="text-body">通过 Settings &gt; MCP 声明 rockxy stdio 启动命令</text>
      <text x="16" y="70" class="text-code" fill="#0284c7">Prompt: "帮我查询刚才 500 报错请求的 Payload"</text>
    </g>

    <!-- Claude Desktop Card -->
    <g transform="translate(20, 185)">
      <rect width="320" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="28" class="label-title">Claude Desktop</text>
      <text x="16" y="50" class="text-body">claude_desktop_config.json 直连本地通道</text>
      <text x="16" y="70" class="text-code" fill="#7c3aed">Tool: query_traffic_by_filter(status: 500)</text>
    </g>
  </g>

  <!-- Bidirectional Stdio Protocol Bridge -->
  <g transform="translate(405, 140)">
    <rect width="130" height="75" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="24" text-anchor="middle" class="label-title" fill="#334155">stdio 通道</text>
    <text x="65" y="42" text-anchor="middle" class="text-code" fill="#64748b">MCP JSON-RPC</text>
    <text x="65" y="60" text-anchor="middle" class="tag-coral">10 大只读工具</text>
  </g>
  <path d="M 400 178 L 405 178" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 535 178 L 540 178" stroke="#64748b" stroke-width="1.5"/>

  <!-- Right: Rockxy Native Process (Focal) -->
  <g transform="translate(545, 30)">
    <rect width="375" height="295" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="20" y="32" class="label-title" fill="#9a3412">Rockxy 本地守护进程 (Rockxy Core Process)</text>
    <text x="20" y="52" class="text-body" fill="#9a3412">标准 AGPL-3.0 源码构建，全程本地化运行</text>
    <line x1="20" y1="68" x2="355" y2="68" stroke="#fed7aa" stroke-width="1"/>

    <!-- MCP Server Engine -->
    <g transform="translate(20, 85)">
      <rect width="335" height="50" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="16" y="24" class="label-title">Local MCP Server Engine</text>
      <text x="16" y="42" class="text-code">10 Read-Only Tools (get_recent_traffic, diff...)</text>
    </g>

    <!-- Redaction Gateway (Shield) -->
    <g transform="translate(20, 145)">
      <rect width="335" height="65" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="16" y="24" class="label-title" fill="#bf4520">🛡️ 自动脱敏网关 (Auto Redaction Gateway)</text>
      <text x="16" y="42" class="text-body">强制哈希占位：Authorization / Cookie / Bearer</text>
      <text x="16" y="58" class="tag-coral">只读边界约束，严禁外部 AI 篡改网络设置或重放</text>
    </g>

    <!-- Traffic Store -->
    <g transform="translate(20, 220)">
      <rect width="335" height="50" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="16" y="24" class="label-title">实时网络流量数据库</text>
      <text x="16" y="42" class="text-code">SQLite Local In-Memory / Disk Cache</text>
    </g>
  </g>
</svg>