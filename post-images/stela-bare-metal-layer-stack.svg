<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="stela-stack-title stela-stack-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="stela-stack-title">Stela 无宿主裸机四层执行与硬件抽象堆栈</title>
  <desc id="stela-stack-desc">展示 Stela 如何从 x86-64 UEFI 裸机启动，通过 stela-linux 内核垫片驱动物理硬件，利用无解释器 ARM64e 转译引擎与 T8112 SoC 模型直接运行未经修改的原生 Apple Silicon macOS。</desc>
  <defs>
    <marker id="stela-arrow-up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 9 L 5 1 L 9 9 z" fill="#64748b"/>
    </marker>
    <marker id="stela-arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 5 9 L 9 1 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">Stela 裸机四层跨指令集执行与 SoC 抽象堆栈</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">UNMODIFIED ARM64E MACOS ON BARE-METAL X86-64 UEFI (NO HOST LINUX / WINDOWS / HYPERVISOR)</text>
    <text x="860" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: LAYER STACK</text>
  </g>

  <!-- Left margin vertical direction indicators -->
  <g transform="translate(40, 104)">
    <line x1="16" y1="20" x2="16" y2="212" stroke="#64748b" stroke-width="1.2" marker-start="url(#stela-arrow-up)"/>
    <text x="28" y="120" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600">APPLE ABI</text>
    <line x1="16" y1="264" x2="16" y2="464" stroke="#0284c7" stroke-width="1.2" marker-end="url(#stela-arrow-down)"/>
    <text x="28" y="368" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600">RING-0 HW</text>
  </g>

  <!-- L4: Unmodified ARM64e macOS Guest -->
  <g transform="translate(148, 104)">
    <rect x="0" y="0" width="772" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L4</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">原生 ARM64e macOS 客体层与 StelaGPU 驱动插件</text>
    <text x="76" y="54" font-size="12" fill="#334155">原版 XNU 内核、WindowServer、dyld_shared_cache 与恢复系统（restored）；零苹果二进制文件修改</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">StelaGPU.kext (IOAccelerator) · StelaGPU.bundle (Metal3 / Apple7) · SEP LocalPolicy 准入</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" font-weight="600" text-anchor="end">ARM64E GUEST</text>
  </g>

  <!-- L3: Binary Translator & Apple T8112 SoC Engine (FOCAL LAYER) -->
  <g transform="translate(148, 216)">
    <rect x="0" y="0" width="772" height="156" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c" text-anchor="middle">L3</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">无解释器 AOT/JIT 转译核心与 Apple T8112 (M2) SoC 仿真引擎</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" font-weight="700" text-anchor="end">FOCAL · STELA ENGINE</text>

    <!-- Sub-card Left: stela-compiler & stela-engine -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="364" height="92" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#be123c">ARM64e → x86-64 编译转译器 (stela-compiler)</text>
      <text x="16" y="46" font-size="11" fill="#334155">覆盖 3,000+ 指令编码，未支持指令直接编译拒绝（无解释器）</text>
      <text x="16" y="65" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">chain.rs 原子块链接 · QARMA5 5-Key PAC 缓存</text>
      <text x="16" y="81" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">AMX M1-M4 · WKdm 压缩 · xtask cpu-reference 实机校验</text>
    </g>

    <!-- Sub-card Right: stela-soc & gpu_gate -->
    <g transform="translate(396, 48)">
      <rect x="0" y="0" width="360" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#0f172a">T8112 (J473AP) 寄存器级 SoC 控制器</text>
      <text x="16" y="46" font-size="11" fill="#334155">按 DeviceTree 精确地址挂载，未实现寄存器显式返回 MmioError</text>
      <text x="16" y="65" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">SEP (sepOS/xART/pnon) · ANS2 NVMe · DCPEXT</text>
      <text x="16" y="81" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">AIC2 / DART / SART / PMGR / 16KiB GPU Call Gate</text>
    </g>
  </g>

  <!-- L2: Bare-Metal stela-linux & Ported Driver Fabric -->
  <g transform="translate(148, 388)">
    <rect x="0" y="0" width="772" height="96" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0369a1" text-anchor="middle">L2</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">裸机 stela-linux 内核垫片与原生 GPU / I/O 驱动栈</text>
    <text x="76" y="54" font-size="12" fill="#334155">在无 Linux 内核环境下以 #![no_std] 提供 SRCU、task、DMA 与固件接口，直接托管上游驱动</text>
    <text x="76" y="74" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569">AIR → Mesa NIR → NVK/NAK · NVIDIA Open-RM + GSP · Intel/Realtek/Broadcom/USB NIC · NVMe/AHCI/xHCI</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">BARE-METAL DRIVERS</text>
  </g>

  <!-- L1: x86-64 UEFI Boot & Ring-0 Physical PC -->
  <g transform="translate(148, 500)">
    <rect x="0" y="0" width="772" height="88" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="16" width="44" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="38" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#475569" text-anchor="middle">L1</text>
    <text x="76" y="31" font-size="15" font-weight="700" fill="#0f172a">x86-64 UEFI 裸机引导与 Ring-0 物理硬件底座</text>
    <text x="76" y="54" font-size="12" fill="#334155">BOOTX64.EFI 脱离 UEFI Boot Services，自建 4/5 级（LA57）页表与原生 SMP / APIC / DMAR 中断拓扑</text>
    <text x="76" y="72" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">Intel/AMD x86-64-v2+ (AVX2 / AVX-512) · ≥8 GB RAM · NVIDIA GTX 16 / RTX 20–50 · NVMe / AHCI</text>
    <text x="752" y="30" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" font-weight="600" text-anchor="end">X86-64 RING-0</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 616)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" font-weight="700">LEGEND</text>
    <rect x="76" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="24" font-size="11" fill="#334155">核心焦点：ARM64e 静态/即时转译与 T8112 SoC 模型</text>
    <rect x="412" y="13" width="14" height="14" rx="3" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2"/>
    <text x="434" y="24" font-size="11" fill="#334155">裸机 Linux 驱动垫片与 NVK</text>
    <rect x="616" y="13" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="638" y="24" font-size="11" fill="#334155">UEFI 与物理 x86-64</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">SOURCE: tylertms/Stela v0.5.0</text>
  </g>
</svg>
