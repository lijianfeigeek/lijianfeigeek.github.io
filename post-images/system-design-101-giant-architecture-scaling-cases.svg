<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="sd-case-title sd-case-desc">
  <title id="sd-case-title">世界级团队架构演进实录：Figma、Netflix 与 Uber 突破业务万倍增长</title>
  <desc id="sd-case-desc">展示Figma单引擎100倍Postgres扩展、Netflix全球多活混沌工程与Uber高维地理六边形分片调度系统的演进历程。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">世界级团队真实架构演进实录 (Industrial Case Studies)</text>
    <text class="subtitle" x="0" y="20">脱离真实业务场景谈架构毫无意义：顶级工程团队在万倍流量重压下的架构破局</text>
  </g>

  <!-- 3 Big Columns -->
  <!-- Case 1: Figma (Postgres 100x) -->
  <g transform="translate(48, 86)">
    <rect width="270" height="348" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#1d4ed8" x="0" y="0">1. Figma: 100x Postgres 奇迹</text>
      <text class="mono" fill="#2563eb" x="0" y="16">不盲目追 NoSQL · 单引擎发挥极致</text>

      <g transform="translate(0, 32)">
        <rect width="238" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段一：垂直拆库 (Vertical)</text>
          <text class="card-body" x="0" y="16">用户、文件元数据与画布数据物理隔离</text>
        </g>
      </g>

      <g transform="translate(0, 100)">
        <rect width="238" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段二：只读从库动态分流</text>
          <text class="card-body" x="0" y="16">应用中间件自动将读流量引导至只读副本</text>
        </g>
      </g>

      <g transform="translate(0, 168)">
        <rect width="238" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段三：水平分区分表</text>
          <text class="card-body" x="0" y="16">针对单个巨大设计文件采用分片哈希</text>
        </g>
      </g>

      <g transform="translate(0, 236)">
        <rect width="238" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <g transform="translate(10, 14)">
          <text class="card-title" fill="#14532d" x="0" y="0">终局：自研轻量级分布式代理池</text>
          <text class="mono" fill="#15803d" x="0" y="16">硬生生在单引擎上抗住数十倍暴增</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Case 2: Netflix (Chaos &amp; Active-Active) -->
  <g transform="translate(344, 86)">
    <rect width="270" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#334155" x="0" y="0">2. Netflix: 全球多活容灾</text>
      <text class="mono" fill="#475569" x="0" y="16">占全美 15% 流量 · 混沌工程发源</text>

      <g transform="translate(0, 32)">
        <rect width="238" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段一：单体拆解与注册发现</text>
          <text class="card-body" x="0" y="16">解构单体架构，自研 Eureka 动态寻址</text>
        </g>
      </g>

      <g transform="translate(0, 100)">
        <rect width="238" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段二：Open Connect 专用硬件</text>
          <text class="card-body" x="0" y="16">将自研缓存服务器直接物理插入全球 ISP</text>
        </g>
      </g>

      <g transform="translate(0, 168)">
        <rect width="238" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段三：混沌工程 (Chaos Monkey)</text>
          <text class="card-body" x="0" y="16">生产环境随机杀实例，逼迫实现完全无状态</text>
        </g>
      </g>

      <g transform="translate(0, 236)">
        <rect width="238" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <g transform="translate(10, 14)">
          <text class="card-title" fill="#1d4ed8" x="0" y="0">终局：全球多可用区 Active-Active</text>
          <text class="mono" fill="#2563eb" x="0" y="16">分钟级可用区级流量瞬间自愈切换</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Case 3: Uber (H3 Spatial Dispatch) -->
  <g transform="translate(640, 86)">
    <rect width="272" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <text class="col-header" fill="#c2410c" x="0" y="0">3. Uber: 高维时空调度系统</text>
      <text class="mono" fill="#ea580c" x="0" y="16">海量移动出行 · 地理网格实时计算</text>

      <g transform="translate(0, 32)">
        <rect width="240" height="60" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段一：早期 Python 单体</text>
          <text class="card-body" x="0" y="16">简单经纬度查询，面临严重锁瓶颈</text>
        </g>
      </g>

      <g transform="translate(0, 100)">
        <rect width="240" height="60" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段二：H3 六边形分片开源</text>
          <text class="card-body" x="0" y="16">全球划分离散等面积六边形网格分片计算</text>
        </g>
      </g>

      <g transform="translate(0, 168)">
        <rect width="240" height="60" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
        <g transform="translate(10, 14)">
          <text class="card-title" x="0" y="0">阶段三：Ringpop 事件环一致性哈希</text>
          <text class="card-body" x="0" y="16">节点自动发现与车端/乘客端位置动态路由</text>
        </g>
      </g>

      <g transform="translate(0, 236)">
        <rect width="240" height="54" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
        <g transform="translate(10, 14)">
          <text class="card-title" fill="#9a3412" x="0" y="0">终局：自研全自研微服务服务编排</text>
          <text class="mono" fill="#c2410c" x="0" y="16">支持每秒数百万次动态供需撮合</text>
        </g>
      </g>
    </g>
  </g>
</svg>