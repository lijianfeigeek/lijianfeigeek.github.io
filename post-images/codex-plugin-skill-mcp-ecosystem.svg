<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codex-plugin-skill-mcp-ecosystem-title codex-plugin-skill-mcp-ecosystem-desc" id="codex-plugin-skill-mcp-ecosystem-root">
      <title id="codex-plugin-skill-mcp-ecosystem-title">Codex 插件、Skill、MCP 与 Connector 能力分层生态</title>
      <desc id="codex-plugin-skill-mcp-ecosystem-desc">Plugin 作为顶层能力分发容器，与底层 Skill 指导手册、MCP 外部能力调用及 Connector 身份凭证的解耦关系</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #codex-plugin-skill-mcp-ecosystem-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #codex-plugin-skill-mcp-ecosystem-root text { font-family: "Geist", -apple-system, sans-serif; }
      #codex-plugin-skill-mcp-ecosystem-root .mono { font-family: "Geist Mono", monospace; }
      #codex-plugin-skill-mcp-ecosystem-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="codex-plugin-skill-mcp-ecosystem-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="codex-plugin-skill-mcp-ecosystem-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="codex-plugin-skill-mcp-ecosystem-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Top Container: Plugin -->
        <g transform="translate(40, 30)">
          <rect x="0" y="0" width="880" height="90" rx="8" fill="#f8f9fa" stroke="#2d3142" stroke-width="1.2" stroke-opacity="0.2"/>
          <rect x="0" y="0" width="880" height="28" rx="8" fill="#2d3142" fill-opacity="0.06"/>
          <text x="16" y="19" font-size="11" font-weight="600" fill="#2d3142" class="mono">TOP-LEVEL CONTAINER: PLUGIN (插件：能力打包与分发器)</text>
          <text x="16" y="52" font-size="14" font-weight="600" fill="#2d3142">将特定工程场景所需的操作手册、外部工具与认证通道打造成自包含单元</text>
          <text x="16" y="72" font-size="12" fill="#2d3142" fill-opacity="0.7">支持在团队内或插件市场一键安装、版本化管理与跨会话自动发现</text>
        </g>

        <!-- Down Arrow Connector -->
        <path d="M 480 120 L 480 155" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#codex-plugin-skill-mcp-ecosystem-arrow-accent)"/>
        <g transform="translate(435, 128)">
          <rect x="0" y="0" width="90" height="20" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
          <text x="8" y="14" font-size="10" font-weight="600" fill="#bf4520">组合封装拆解</text>
        </g>

        <!-- Bottom Core Components (3 Columns) -->
        <!-- Component 1: Skill -->
        <g transform="translate(40, 160)">
          <rect x="0" y="0" width="270" height="180" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="30" rx="8" fill="#f8f9fa"/>
          <text x="14" y="20" font-size="12" font-weight="600" fill="#2d3142">Skill (操作手册 / SKILL.md)</text>
          
          <text x="14" y="54" font-size="13" font-weight="600" fill="#2d3142">教导 Agent “如何做一件事”</text>
          <text x="14" y="76" font-size="11" fill="#2d3142" fill-opacity="0.7">• 纯 Markdown 与辅助脚本定义</text>
          <text x="14" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 提供领域工作流、红线规范与模板</text>
          <text x="14" y="112" font-size="11" fill="#2d3142" fill-opacity="0.7">• 随任务按需唤醒，零持久上下文开销</text>
          <text x="14" y="140" font-size="11" font-weight="600" fill="#2e5aa8" class="mono">定位：认知与工作流引导层</text>
        </g>

        <!-- Component 2: MCP (Focal) -->
        <g transform="translate(345, 160)">
          <rect x="0" y="0" width="270" height="180" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.03"/>
          <rect x="0" y="0" width="270" height="30" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="14" y="20" font-size="12" font-weight="600" fill="#bf4520">MCP Server (Model Context Protocol)</text>

          <text x="14" y="54" font-size="13" font-weight="600" fill="#bf4520">赋予 Agent “操作外部世界的能力”</text>
          <text x="14" y="76" font-size="11" fill="#2d3142" fill-opacity="0.8">• 暴露结构化 API、资源与提示词工具</text>
          <text x="14" y="94" font-size="11" fill="#2d3142" fill-opacity="0.8">• 数据库连接、云服务查询、Issue 读写</text>
          <text x="14" y="112" font-size="11" fill="#2d3142" fill-opacity="0.8">• 强类型 JSON-RPC 2.0 协议标准</text>
          <text x="14" y="140" font-size="11" font-weight="600" fill="#bf4520" class="mono">定位：动态能力与数据交互管道</text>
        </g>

        <!-- Component 3: Connector -->
        <g transform="translate(650, 160)">
          <rect x="0" y="0" width="270" height="180" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="270" height="30" rx="8" fill="#f8f9fa"/>
          <text x="14" y="20" font-size="12" font-weight="600" fill="#2d3142">Connector (身份凭证与通道)</text>

          <text x="14" y="54" font-size="13" font-weight="600" fill="#2d3142">打通“第三方安全鉴权体系”</text>
          <text x="14" y="76" font-size="11" fill="#2d3142" fill-opacity="0.7">• 封装 OAuth2、API Key 与 Token 托管</text>
          <text x="14" y="94" font-size="11" fill="#2d3142" fill-opacity="0.7">• 支持 GitHub、Figma、Jira、Slack 鉴权</text>
          <text x="14" y="112" font-size="11" fill="#2d3142" fill-opacity="0.7">• 保证敏感凭证不向 LLM 上下文裸露</text>
          <text x="14" y="140" font-size="11" font-weight="600" fill="#2d3142" class="mono">定位：合规身份与授权底座</text>
        </g>
      </g>
    </svg>
