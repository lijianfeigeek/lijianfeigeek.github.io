<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="modern-network-debugging-dynip-rfc2136-topology-title modern-network-debugging-dynip-rfc2136-topology-desc">
  <title id="modern-network-debugging-dynip-rfc2136-topology-title">DynIP 基于 RFC 2136 的标准动态 DNS 权威解析拓扑</title>
  <desc id="modern-network-debugging-dynip-rfc2136-topology-desc">展示边缘路由器、Kubernetes external-dns 与 cert-manager 通过标准 TSIG 协议向 DynIP 权威集群推送更新的过程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">拥抱互联网原语：DYNIP 基于 RFC 2136 TSIG 的现代 DDNS 架构体系</text>
    <text x="896" y="16" text-anchor="end" class="tag">IETF STANDARD DDNS</text>
  </g>

  <!-- Left: Homelab / Edge Infra -->
  <g transform="translate(32, 60)">
    <rect width="280" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="280" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="280" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">边缘路由与私有机房 (Homelab)</text>
    <text x="266" y="25" text-anchor="end" class="tag">CLIENTLESS</text>

    <g transform="translate(14, 52)">
      <rect width="252" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">专业企业级路由器</text>
        <text class="desc" x="0" y="18">• OPNsense / OpenWRT / FortiGate</text>
        <text class="desc" x="0" y="34">• 原生配置 RFC 2136，免装任何脚本</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="252" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">K8s external-dns 控制器</text>
        <text class="desc" x="0" y="18">• 自动化监听 Service/Ingress 变动</text>
        <text class="desc" x="0" y="34">• 秒级向权威 DNS 注入私有服务寻址</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="252" height="106" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">cert-manager (DNS-01 ACME)</text>
        <text class="desc" x="0" y="18">• 解决内网无法暴露 80/443 的痛点</text>
        <text class="desc" x="0" y="34">• 通过 TSIG 自动创建 _acme-challenge</text>
        <text class="desc" x="0" y="50">• 零门槛全自动续期泛域名 SSL 证书</text>
        <text class="tag" x="0" y="74">全自动化私有云安全闭环</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Homelab -> DynIP -->
  <path d="M 312 215 L 342 215" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />
  <rect x="290" y="180" width="84" height="20" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="1" />
  <text x="332" y="194" text-anchor="middle" class="coral-tag" style="font-size:9px;">DNS UPDATE (53)</text>

  <!-- Middle: DynIP Infra (Core Accent) -->
  <g transform="translate(342, 60)">
    <rect width="286" height="330" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="286" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="286" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="286" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="14" y="25" class="coral-title">DynIP 权威 DNS 基础设施</text>
    <text x="272" y="25" text-anchor="end" class="coral-tag">ANYCAST DNS</text>

    <g transform="translate(14, 52)">
      <rect width="258" height="66" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">RFC 2136 TSIG 鉴权网关</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 原生 UDP/TCP 53 端口标准化通信</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 基于加密密钥签名的防篡改更新</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="258" height="66" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">全球 Anycast 多区域权威节点</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 跨大洲多活部署，保障 99.99% 解析</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• A / AAAA 双栈与纯 IPv6 原生支持</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="258" height="106" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">DNS NOTIFY 主动通告失效</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 告别 15-30 分钟漫长缓存等待</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 60 秒极速全球 TTL 收敛</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="50">• 宽带重新拨号后 1 分钟恢复服务</text>
        <text class="coral-tag" x="0" y="74">DNSSEC 硬件级链条防护</text>
      </g>
    </g>
  </g>

  <!-- Connectors: DynIP -> Resolvers -->
  <path d="M 628 215 L 658 215" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Right: Global Resolvers -->
  <g transform="translate(658, 60)">
    <rect width="270" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="270" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="270" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="270" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">全球公共递归解析器</text>
    <text x="256" y="25" text-anchor="end" class="tag">TTL = 60S</text>

    <g transform="translate(14, 52)">
      <rect width="242" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">1.1.1.1 (Cloudflare)</text>
        <text class="desc" x="0" y="18">• 收到 NOTIFY 秒级清除旧记录缓存</text>
        <text class="desc" x="0" y="34">• 权威直达，解析延迟 &lt; 10ms</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="242" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">8.8.8.8 (Google Public DNS)</text>
        <text class="desc" x="0" y="18">• 遵循 RFC 2136 规范快速失效</text>
        <text class="desc" x="0" y="34">• 全球骨干网络分发最新 IPv4/IPv6</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="242" height="106" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1.5" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">运营商 Local DNS 极速收敛</text>
        <text class="desc" style="fill:#166534;" x="0" y="18">• 终结因 TTL 硬编码导致的半小时断连</text>
        <text class="desc" style="fill:#166534;" x="0" y="34">• 真正实现工业级高可用远程访问</text>
        <text class="green-tag" x="0" y="60">零破坏、全标准化现代解法</text>
      </g>
    </g>
  </g>
</svg>