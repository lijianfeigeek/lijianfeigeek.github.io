<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-noir-illusions-vs-reality-title ios-noir-illusions-vs-reality-desc" id="ios-noir-illusions-vs-reality-root">
        <title id="ios-noir-illusions-vs-reality-title">iOS 安全神话破灭：大众表层直觉 vs 底层穿透现实</title>
        <desc id="ios-noir-illusions-vs-reality-desc">杀后台、关跟踪、挂 VPN 与关定位四大直觉误区，与 iOS-NOIR 揭露的底层特权机制深度对照</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-noir-illusions-vs-reality-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #ios-noir-illusions-vs-reality-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #ios-noir-illusions-vs-reality-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="ios-noir-illusions-vs-reality-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="ios-noir-illusions-vs-reality-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="ios-noir-illusions-vs-reality-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Column 1: 大众表层直觉 (Left) -->
        <rect x="40" y="24" width="400" height="370" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <rect x="40" y="24" width="400" height="34" rx="8" fill="#f8f9fa"/>
        <text x="56" y="46" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">POPULAR BELIEF · 大众脑海中的“iOS 绝对安全直觉”</text>

        <g transform="translate(60, 74)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
          <text x="12" y="24" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">直觉 1：随手“上划杀掉后台”，进程就安静冬眠了</text>
          <text x="12" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">认为既然从多任务栏划走，App 就再也无法运行与耗电</text>
        </g>

        <g transform="translate(60, 154)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
          <text x="12" y="24" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">直觉 2：关闭“允许跟踪 (IDFA)”，设备指纹就无法关联</text>
          <text x="12" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">认为只要关掉广告标识符，自己在黑产眼里就是完全匿名的</text>
        </g>

        <g transform="translate(60, 234)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
          <text x="12" y="24" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">直觉 3：全天候挂着 VPN 虚拟网卡，真实 IP 和手机号绝对安全</text>
          <text x="12" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">认为所有出网流量必须经由虚拟网卡（utun）加密隧道包裹</text>
        </g>

        <g transform="translate(60, 314)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
          <text x="12" y="24" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">直觉 4：只要关了系统 GPS 定位权限，App 就不知道我在哪</text>
          <text x="12" y="48" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">认为 CoreLocation 未授权，App 只能拿到粗糙的城市级定位</text>
        </g>

        <!-- Column 2: iOS-NOIR 穿透揭露底层现实 (Right Focal Accent) -->
        <rect x="520" y="24" width="400" height="370" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="520" y="24" width="400" height="34" rx="8" fill="#bf4520" fill-opacity="0.06"/>
        <text x="536" y="46" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">FORENSICS REALITY · iOS-NOIR 穿透揭露的底层现实 (FOCAL)</text>

        <g transform="translate(540, 74)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#bf4520" stroke="#bf4520" fill-opacity="0.04" stroke-opacity="0.2"/>
          <text x="12" y="24" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">【替身借尸还魂】静默推送扩展拉活，VoIP 隐蔽唤醒万次</text>
          <text x="12" y="48" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">通过 NotificationServiceExtension 强占 30 秒 CPU 与完整网络栈</text>
        </g>

        <g transform="translate(540, 154)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#bf4520" stroke="#bf4520" fill-opacity="0.04" stroke-opacity="0.2"/>
          <text x="12" y="24" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">【五层持久烙印】iCloud KVS 云端烙印 + 共享钥匙串池</text>
          <text x="12" y="48" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">跨应用 group 沙盒串联，卸载重装甚至换新机登录同 ID 秒级复活</text>
        </g>

        <g transform="translate(540, 234)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#bf4520" stroke="#bf4520" fill-opacity="0.04" stroke-opacity="0.2"/>
          <text x="12" y="24" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">【蜂窝直连旁路】multipath 绑定 pdp_ip0 强穿 VPN</text>
          <text x="12" y="48" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">强行无视 utun 虚拟网卡，直连基站一键免密取号暴露真实手机号</text>
        </g>

        <g transform="translate(540, 314)">
          <rect x="0" y="0" width="360" height="66" rx="4" fill="#bf4520" stroke="#bf4520" fill-opacity="0.04" stroke-opacity="0.2"/>
          <text x="12" y="24" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">【Wi-Fi 热点钩子】HotspotHelper 截获周边所有路由器 BSSID</text>
          <text x="12" y="48" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">路过商场即被内核静默唤醒，搜集全周边 Wi-Fi 物理 MAC 亚米级定位</text>
        </g>

        <!-- Connecting Arrows Across Columns -->
        <path d="M 440 107 L 532 107" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ios-noir-illusions-vs-reality-arrow-accent)"/>
        <path d="M 440 187 L 532 187" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ios-noir-illusions-vs-reality-arrow-accent)"/>
        <path d="M 440 267 L 532 267" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ios-noir-illusions-vs-reality-arrow-accent)"/>
        <path d="M 440 347 L 532 347" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ios-noir-illusions-vs-reality-arrow-accent)"/>
      </svg>
