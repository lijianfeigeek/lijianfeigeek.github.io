<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockxy-xpc-privilege-sandbox-perimeter-title rockxy-xpc-privilege-sandbox-perimeter-desc">
  <title id="rockxy-xpc-privilege-sandbox-perimeter-title">Rockxy XPC 特权隔离与沙盒安全防线架构图</title>
  <desc id="rockxy-xpc-privilege-sandbox-perimeter-desc">展示主应用层与系统特权层之间的严格隔离，通过 SecCodeCopyGuestWithAttributes 双向证书链校验抵御提权与伪造攻击</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="xpc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Top: System Privileges Layer (Alert Zone) -->
  <g transform="translate(40, 24)">
    <rect width="880" height="135" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="20" y="28" class="label-title" fill="#b91c1c">特权层 (System Privileged Layer · Root Execution)</text>
    <text x="740" y="28" class="label-badge" fill="#b91c1c">&lt;&lt;Root Daemon&gt;&gt;</text>
    <line x1="20" y1="40" x2="860" y2="40" stroke="#fee2e2" stroke-width="1"/>

    <!-- Helper Box -->
    <g transform="translate(20, 52)">
      <rect width="400" height="70" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="16" y="26" class="label-title" fill="#991b1b">rockxy-helper (XPC 后台守护进程)</text>
      <text x="16" y="46" class="text-body">由 launchd 托管，持有 Root 权限专职执行系统网络配置</text>
      <text x="16" y="62" class="text-code" fill="#b91c1c">仅暴露极简设置接口，无网络转发特权</text>
    </g>

    <!-- SysNet Box -->
    <g transform="translate(460, 52)">
      <rect width="400" height="70" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="16" y="26" class="label-title" fill="#991b1b">macOS 系统底层配置原语</text>
      <text x="16" y="46" class="text-body">/usr/sbin/networksetup -setwebproxy</text>
      <text x="16" y="62" class="text-code">pfctl 包过滤防火墙规则重定向</text>
    </g>
  </g>

  <!-- Security Perimeter Divider (The Barrier) -->
  <g transform="translate(40, 168)">
    <rect width="880" height="42" rx="4" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="440" y="26" text-anchor="middle" class="tag-coral">🔒 双向证书链严格校验：SecCodeCopyGuestWithAttributes 验证调用者签名与团队 ID</text>
  </g>

  <!-- Bottom: Sandboxed Main App Layer -->
  <g transform="translate(40, 220)">
    <rect width="880" height="135" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="20" y="28" class="label-title" fill="#15803d">用户应用层 (User Application Layer · Non-Privileged)</text>
    <text x="740" y="28" class="label-badge" fill="#15803d">&lt;&lt;User Sandbox&gt;&gt;</text>
    <line x1="20" y1="40" x2="860" y2="40" stroke="#dcfce7" stroke-width="1"/>

    <!-- MainApp Box -->
    <g transform="translate(20, 52)">
      <rect width="260" height="70" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="26" class="label-title">Rockxy 主进程</text>
      <text x="14" y="46" class="text-body">AppKit + SwiftUI 界面</text>
      <text x="14" y="62" class="text-code">以普通用户权限运行</text>
    </g>

    <!-- JSCore Sandbox Box -->
    <g transform="translate(310, 52)">
      <rect width="260" height="70" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="26" class="label-title">JavaScriptCore 沙盒</text>
      <text x="14" y="46" class="text-body">规则修改脚本执行引擎</text>
      <text x="14" y="62" class="text-code" fill="#15803d">5s 超时 + 零系统 API 暴露</text>
    </g>

    <!-- KeyChain Vault Box -->
    <g transform="translate(600, 52)">
      <rect width="260" height="70" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="26" class="label-title">钥匙串密钥隔离区</text>
      <text x="14" y="46" class="text-body">证书私钥严格存储</text>
      <text x="14" y="62" class="text-code">0o600 文件属组权限</text>
    </g>
  </g>
</svg>