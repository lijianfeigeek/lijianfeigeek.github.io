<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="nvda-mark-stevens-33-year-nvidia-timeline-title nvda-mark-stevens-33-year-nvidia-timeline-desc">
  <title id="nvda-mark-stevens-33-year-nvidia-timeline-title">Mark A. Stevens 与英伟达的 33 年深度交织时间轴</title>
  <desc id="nvda-mark-stevens-33-year-nvidia-timeline-desc">展示 Mark Stevens 自 1993 年早期风险注资、1999 年 IPO、2008 年重返董事会至 AI 时代的 33 年历程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">三十三年战友：MARK A. STEVENS 与英伟达（NVIDIA）的发展历史镜像</text>
    <text x="896" y="16" text-anchor="end" class="tag">1993 - 2026 CHRONOLOGY</text>
  </g>

  <!-- 5 Timeline Milestone Columns -->
  <!-- Milestone 1: 1993 -->
  <g transform="translate(32, 60)">
    <rect width="170" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="170" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="170" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="170" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">1993</text>
    <text x="156" y="25" text-anchor="end" class="tag">EARLY SEED</text>
    <g transform="translate(14, 56)">
      <text class="title" style="font-size:12px;" x="0" y="0">早期领投英伟达</text>
      <text class="desc" x="0" y="22">• 黄仁勋创立初创团队</text>
      <text class="desc" x="0" y="42">• 代表红杉资本领投 A 轮</text>
      <text class="desc" x="0" y="62">• 首次进入英伟达董事会</text>
      <text class="tag" x="0" y="92">早期信念建立</text>
    </g>
  </g>

  <!-- Milestone 2: 1999 -->
  <g transform="translate(212, 60)">
    <rect width="170" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="170" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="170" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="170" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">1999</text>
    <text x="156" y="25" text-anchor="end" class="tag">NASDAQ IPO</text>
    <g transform="translate(14, 56)">
      <text class="title" style="font-size:12px;" x="0" y="0">纳斯达克挂牌上市</text>
      <text class="desc" x="0" y="22">• 伴随 Riva 128 与图形突破</text>
      <text class="desc" x="0" y="42">• GPU 概念正式定义提出</text>
      <text class="desc" x="0" y="62">• 作为核心董事护航敲钟</text>
      <text class="tag" x="0" y="92">商业化闭环跑通</text>
    </g>
  </g>

  <!-- Milestone 3: 2006-2008 -->
  <g transform="translate(392, 60)">
    <rect width="176" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="176" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="176" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="176" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">2006 ~ 2008</text>
    <text x="162" y="25" text-anchor="end" class="tag">RETURN</text>
    <g transform="translate(14, 56)">
      <text class="title" style="font-size:12px;" x="0" y="0">受黄仁勋之邀重归</text>
      <text class="desc" x="0" y="22">• 06年暂别专注全球创投</text>
      <text class="desc" x="0" y="42">• 08年应黄仁勋之邀再任独董</text>
      <text class="desc" x="0" y="62">• 坚定支持巨额研发砸 CUDA</text>
      <text class="tag" x="0" y="92">GPGPU 生态蜕变</text>
    </g>
  </g>

  <!-- Milestone 4: 2023 -->
  <g transform="translate(578, 60)">
    <rect width="170" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="170" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="170" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="170" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">2023</text>
    <text x="156" y="25" text-anchor="end" class="tag">AI SURGE</text>
    <g transform="translate(14, 56)">
      <text class="title" style="font-size:12px;" x="0" y="0">市值首破万亿美元</text>
      <text class="desc" x="0" y="22">• 生成式 AI 算力全球爆发</text>
      <text class="desc" x="0" y="42">• Stevens 减持约 5100 万美元</text>
      <text class="desc" x="0" y="62">• 舆论误判见顶，股价翻倍</text>
      <text class="tag" x="0" y="92">常规再平衡验证</text>
    </g>
  </g>

  <!-- Milestone 5: 2026 (Core Accent) -->
  <g transform="translate(758, 60)">
    <rect width="170" height="330" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="170" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="170" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="170" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="14" y="25" class="coral-title">2026</text>
    <text x="156" y="25" text-anchor="end" class="coral-tag">TODAY</text>
    <g transform="translate(14, 56)">
      <text class="coral-title" style="font-size:12px;" x="0" y="0">减持 9% 落袋 6.46 亿</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="22">• 222~231 美元区间兑现</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="42">• 仍持有近 2890 万股底仓</text>
      <text class="desc" style="fill:#742a2a;" x="0" y="62">• 价值 64.6 亿美元继续共舞</text>
      <text class="coral-tag" x="0" y="92">底牌依然坚如磐石</text>
    </g>
  </g>
</svg>