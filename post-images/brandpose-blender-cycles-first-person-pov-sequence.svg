<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brandpose-blender-cycles-first-person-pov-sequence-title brandpose-blender-cycles-first-person-pov-sequence-desc">
  <title id="brandpose-blender-cycles-first-person-pov-sequence-title">Blender Cycles 顾客第一人称视角（POV）电影级重构时序图</title>
  <desc id="brandpose-blender-cycles-first-person-pov-sequence-desc">从监控像素反投影地面轨迹与3D视线射线，由 Blender 参数化店铺加载轨迹并结合步态颠簸与防穿模约束完成532帧光线追踪渲染</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="pov-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="pov-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Participants -->
  <g transform="translate(60, 24)">
    <!-- P1: CCTV -->
    <g transform="translate(0, 0)">
      <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="24" text-anchor="middle" class="label-title">📹 监控视频序列</text>
      <text x="85" y="38" text-anchor="middle" class="label-sub">CCTV Video</text>
      <line x1="85" y1="46" x2="85" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P2: Trajectories -->
    <g transform="translate(220, 0)">
      <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="24" text-anchor="middle" class="label-title">📐 几何反投影</text>
      <text x="85" y="38" text-anchor="middle" class="label-sub">trajectories.py</text>
      <line x1="85" y1="46" x2="85" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P3: Blender POV (Focal) -->
    <g transform="translate(440, 0)">
      <rect width="190" height="46" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #9a3412;">🎬 虚拟主观相机</text>
      <text x="95" y="38" text-anchor="middle" class="tag-coral">Blender pov.py</text>
      <line x1="95" y1="46" x2="95" y2="300" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P4: Cycles Render -->
    <g transform="translate(670, 0)">
      <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="24" text-anchor="middle" class="label-title">⚡ Cycles 渲染引擎</text>
      <text x="85" y="38" text-anchor="middle" class="label-sub">Metal GPU Denoise</text>
      <line x1="85" y1="46" x2="85" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
  </g>

  <!-- Step 1: Foot to Floor -->
  <g transform="translate(70, 95)">
    <path d="M 75 20 L 287 20" stroke="#64748b" stroke-width="1.5" marker-end="url(#pov-arrow)"/>
    <rect x="90" y="8" width="185" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="182" y="23" text-anchor="middle" class="text-code">1. 提取脚踝/鼻尖反投影至地面 Z=0</text>
  </g>

  <!-- Step 2: Gaze Ray -->
  <g transform="translate(70, 145)">
    <path d="M 295 20 L 517 20" stroke="#bf4520" stroke-width="1.5" marker-end="url(#pov-coral)"/>
    <rect x="310" y="8" width="195" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="407" y="23" text-anchor="middle" class="tag-coral">2. 灌注 3D 轨迹与 3D 视线射线 (Ray)</text>
  </g>

  <!-- Step 3: Kinematics -->
  <g transform="translate(70, 195)">
    <path d="M 525 20 L 737 20" stroke="#64748b" stroke-width="1.5" marker-end="url(#pov-arrow)"/>
    <rect x="535" y="8" width="195" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="632" y="23" text-anchor="middle" class="text-code">3. 1.62m 眼高 + 步态颠簸 + 0.5m 避障</text>
  </g>

  <!-- Step 4: Cycles Render -->
  <g transform="translate(70, 245)">
    <path d="M 745 20 L 533 20" stroke="#059669" stroke-width="1.5" marker-end="url(#pov-arrow)"/>
    <rect x="555" y="8" width="170" height="22" rx="4" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="640" y="23" text-anchor="middle" class="text-code" fill="#059669">4. 532 帧光线追踪渲染输出</text>
  </g>

  <!-- Result Banner at bottom -->
  <g transform="translate(145, 290)">
    <rect width="670" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="335" y="26" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #334155;">
      💡 生成左右双屏对比视频：左侧俯视监控 ➔ 右侧顾客第一人称主观视觉真实复现
    </text>
  </g>
</svg>