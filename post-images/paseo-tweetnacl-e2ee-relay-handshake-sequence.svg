<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="paseo-tweetnacl-e2ee-relay-handshake-sequence-title paseo-tweetnacl-e2ee-relay-handshake-sequence-desc">
  <title id="paseo-tweetnacl-e2ee-relay-handshake-sequence-title">Paseo TweetNaCl 端到端加密中继时序交互</title>
  <desc id="paseo-tweetnacl-e2ee-relay-handshake-sequence-desc">展示移动端 App 与本地电脑 Daemon 通过哑中继节点进行 Curve25519 密钥协商与 XSalsa20 密文安全传输的全过程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="470" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">PASEO 跨端安全命脉：TWEETNACL 全链路端到端加密（E2EE）中继时序</text>
    <text x="896" y="16" text-anchor="end" class="coral-tag">ZERO TELEMETRY · ZERO PLAINTEXT</text>
  </g>

  <!-- Actors Header -->
  <!-- Mobile App -->
  <g transform="translate(60, 56)">
    <rect width="200" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="25" text-anchor="middle" class="seq-actor">移动端 App (iOS / Android)</text>
  </g>
  <line x1="160" y1="96" x2="160" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Relay Node -->
  <g transform="translate(380, 56)">
    <rect width="200" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="25" text-anchor="middle" class="seq-actor">分布式 Relay 节点 (哑管道)</text>
  </g>
  <line x1="480" y1="96" x2="480" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Host Daemon (Focus) -->
  <g transform="translate(700, 56)">
    <rect width="200" height="40" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" class="coral-title" style="font-size:13px;">本地电脑 (Paseo Daemon)</text>
  </g>
  <line x1="800" y1="96" x2="800" y2="430" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Step 1: Daemon Keypair -->
  <rect x="710" y="110" width="180" height="26" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
  <text x="800" y="127" text-anchor="middle" class="seq-note">生成 Curve25519 临时密钥对</text>

  <!-- Step 2: QR Code Scan -->
  <line x1="160" y1="150" x2="800" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3" />
  <rect x="360" y="140" width="240" height="22" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="1" />
  <text x="480" y="155" text-anchor="middle" class="seq-msg">1. 手机扫码获取 Daemon 公钥并生成自身密钥对</text>

  <!-- Step 3: Mobile to Relay Handshake -->
  <line x1="160" y1="184" x2="480" y2="184" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="190" y="178" class="seq-msg">2. 握手连接请求 (携带目标 Peer ID)</text>

  <!-- Step 4: Relay to Host Tunnel -->
  <line x1="480" y1="214" x2="800" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="510" y="208" class="seq-msg">3. 建立透明双向转发通道</text>

  <!-- Computation Box: nacl.box.before -->
  <g transform="translate(190, 236)">
    <rect width="580" height="38" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="290" y="17" text-anchor="middle" class="tag" style="font-weight:700;">两端独立执行 nacl.box.before() 计算共享对称密钥 SharedKey</text>
    <text x="290" y="31" text-anchor="middle" class="desc">基于 Diffie-Hellman 机制，中继节点 Relay 绝对无法推导出密钥</text>
  </g>

  <!-- Step 5: Encrypted Message Transfer -->
  <line x1="160" y1="300" x2="480" y2="300" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)" />
  <text x="180" y="294" class="coral-tag" style="font-size:11px;">4. [Nonce 24B] + [XSalsa20-Poly1305 密文]</text>

  <!-- Relay Transparent Box -->
  <rect x="370" y="320" width="220" height="32" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="1" />
  <text x="480" y="335" text-anchor="middle" class="tag" style="font-size:10px;">Relay 仅转发二进制包，无法解密</text>
  <text x="480" y="347" text-anchor="middle" class="desc" style="font-size:9px;">Zero-Knowledge Dumb Pipe</text>

  <!-- Step 6: Relay to Host Encrypted -->
  <line x1="480" y1="372" x2="800" y2="372" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-coral)" />
  <text x="510" y="366" class="coral-tag" style="font-size:11px;">5. 透传二进制加密数据包</text>

  <!-- Step 7: Host Decrypt -->
  <rect x="700" y="394" width="200" height="26" fill="#fff5f5" rx="4" stroke="#fed7d7" stroke-width="1" />
  <text x="800" y="411" text-anchor="middle" class="coral-title" style="font-size:11px;">6. XSalsa20 解密并执行本地调用</text>
</svg>