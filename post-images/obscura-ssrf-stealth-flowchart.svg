<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obscura-flow-title obscura-flow-desc" id="obscura-flow-root" data-diagram="flowchart">
  <title id="obscura-flow-title">Obscura 双层 SSRF 防护与 TLS-to-JS 指纹对齐决策流</title>
  <desc id="obscura-flow-desc">展示单次导航或脚本 fetch 请求依次经过字面量拦截、3520 追踪器黑名单、DNS 解析期重绑定检查、BoringSSL 握手与 JS 原型脱敏的完整安全与反检测决策流程。</desc>
  <defs>
    <pattern id="obscura-flow-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Paper Light Background -->
  <rect width="1000" height="680" fill="#f8fafc"/>
  <rect width="1000" height="680" fill="url(#obscura-flow-dots)" opacity="0.55"/>

  <!-- Header -->
  <text x="32" y="34" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">FLOWCHART · OBSCURA-SSRF + OBSCURA-NET + BOOTSTRAP.JS ALIGNMENT</text>
  <text x="32" y="62" fill="#0f172a" font-size="22" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">请求安全校验与 TLS-to-JS 身份一致性管线</text>

  <!-- Connectors (drawn BEFORE shapes) -->
  <!-- Start -> Step 1 (Literal IP check) -->
  <path d="M 380 144 L 380 176" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#flow-arrow)"/>
  <!-- Step 1 -> Diamond 1 (Tracker blocklist) -->
  <path d="M 380 236 L 380 268" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#flow-arrow)"/>
  <!-- Diamond 1 YES (right) -> Blocked Sink -->
  <path d="M 520 316 L 688 316" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#flow-arrow)"/>
  <!-- Diamond 1 NO (down) -> Diamond 2 (DNS SSRF Guard - CORAL FOCAL) -->
  <path d="M 380 364 L 380 400" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#flow-arrow-accent)"/>
  <!-- Diamond 2 YES (forbidden IP, right) -> Blocked Sink -->
  <path d="M 520 448 L 792 448 Q 800 448 800 440 L 800 352" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#flow-arrow-accent)"/>
  <!-- Diamond 2 NO (public IP, down) -> Step 3 (BoringSSL vs reqwest) -->
  <path d="M 380 496 L 380 532" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#flow-arrow-link)"/>
  <!-- Step 3 -> Step 4 (JS Prototype Surface) -->
  <path d="M 548 564 L 620 564" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#flow-arrow-link)"/>

  <!-- Arrow Masks & Labels (with >=8px gap from strokes) -->
  <rect x="564" y="290" width="84" height="16" rx="2" fill="#f8fafc"/>
  <text x="606" y="301" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">YES · HIT 3520</text>

  <rect x="392" y="374" width="76" height="16" rx="2" fill="#f8fafc"/>
  <text x="430" y="385" fill="#475569" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NO · ALLOW</text>

  <rect x="576" y="422" width="136" height="16" rx="2" fill="#f8fafc"/>
  <text x="644" y="433" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">YES · REBINDING BLOCKED</text>

  <rect x="392" y="506" width="88" height="16" rx="2" fill="#f8fafc"/>
  <text x="436" y="517" fill="#0284c7" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PASS · PUBLIC IP</text>

  <!-- Start Oval -->
  <g transform="translate(232 96)">
    <rect x="0" y="0" width="296" height="48" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="148" y="22" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">页面导航或 JS fetch() / XHR 发起</text>
    <text x="148" y="38" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Page::navigate / op_fetch_url / render loader</text>
  </g>

  <!-- Step 1: URL & Literal IP Check -->
  <g transform="translate(200 176)">
    <rect x="0" y="0" width="360" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="180" y="25" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">1. 字面量 URL 与嵌入 IP 解包校验</text>
    <text x="180" y="45" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">is_forbidden_ip() 解包 ::ffff · NAT64 · 6to4 · Teredo</text>
  </g>

  <!-- Diamond 1: Tracker Blocklist -->
  <g transform="translate(240 268)">
    <polygon points="140,0 280,48 140,96 0,48" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="140" y="43" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">命中 3,520 追踪域？</text>
    <text x="140" y="61" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">--stealth · pgl_domains.txt</text>
  </g>

  <!-- Diamond 2: FOCAL CORAL - DNS Resolution Time SSRF Guard -->
  <g transform="translate(240 400)">
    <polygon points="140,0 280,48 140,96 0,48" fill="#fff5f2" stroke="#bf4520" stroke-width="1.6"/>
    <text x="140" y="43" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">DNS 解析出内网/元数据 IP？</text>
    <text x="140" y="61" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SsrfGuardResolver · 防 DNS 重绑定</text>
  </g>

  <!-- Blocked Terminal Oval -->
  <g transform="translate(688 280)">
    <rect x="0" y="0" width="224" height="72" rx="20" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
    <text x="112" y="28" fill="#bf4520" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">连接前熔断拦截</text>
    <text x="112" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">拦截 169.254.169.254 / CGNAT</text>
    <text x="112" y="60" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">未发出一字节 TCP 报文</text>
  </g>

  <!-- Step 3: BoringSSL Transport -->
  <g transform="translate(212 532)">
    <rect x="0" y="0" width="336" height="64" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="168" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">3. BoringSSL 拟真 TLS 传输</text>
    <text x="168" y="46" fill="#0284c7" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">wreq Chrome145 ClientHello · ALPN · Cipher 对齐</text>
  </g>

  <!-- Step 4: JS Surface Alignment Oval/End -->
  <g transform="translate(620 532)">
    <rect x="0" y="0" width="336" height="64" rx="20" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="168" y="26" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', system-ui, sans-serif" text-anchor="middle">4. JS 原型链与反射特征对齐</text>
    <text x="168" y="46" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">_navProto · _functionToString · 隐藏内部属性</text>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(32 624)">
    <rect x="0" y="0" width="936" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="10" width="12" height="12" rx="2" fill="#fff5f2" stroke="#bf4520" stroke-width="1.2"/>
    <text x="36" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">SSRF 关键安全边界（reqwest / wreq / render 三端共享）</text>
    <rect x="404" y="10" width="12" height="12" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="424" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">外部出站与 TLS 一致性通道</text>
    <rect x="644" y="10" width="12" height="12" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <text x="664" y="20" fill="#334155" font-size="11" font-family="'Geist', 'PingFang SC', system-ui, sans-serif">起止边界（圆角胶囊）</text>
  </g>
</svg>
