<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-fingerprint-dual-layer-api-title ios-fingerprint-dual-layer-api-desc" id="ios-fingerprint-dual-layer-api-root">
        <title id="ios-fingerprint-dual-layer-api-title">iOS 设备指纹底层双层 API 图谱与逆向拦截面</title>
        <desc id="ios-fingerprint-dual-layer-api-desc">解构 iOS 设备指纹在 Cocoa/Foundation 上层与 BSD/Mach 底层系统调用的接口依赖及黑产 Dylib 注入拦截点位</desc>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-fingerprint-dual-layer-api-root { --color-paper:   #f8f9fa;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ios-fingerprint-dual-layer-api-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-fingerprint-dual-layer-api-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <marker id="ios-fingerprint-dual-layer-api-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ios-fingerprint-dual-layer-api-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
      </marker>
      <marker id="ios-fingerprint-dual-layer-api-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <pattern id="ios-fingerprint-dual-layer-api-dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <rect width="100%" height="100%" fill="url(#ios-fingerprint-dual-layer-api-dots)" opacity="0.6"/>

        <!-- Layer 1: AppLayer (Cocoa / Foundation) -->
        <rect x="40" y="40" width="880" height="110" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="60" y="68" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13" letter-spacing="0.04em">应用与运行时环境 (COCOA / FOUNDATION LAYER)</text>

        <g transform="translate(60, 84)">
          <rect x="0" y="0" width="195" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="14" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">IDFV / IDFA</text>
          <text x="14" y="38" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">UIDevice &amp; ASIdentifier</text>

          <rect x="215" y="0" width="195" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="229" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">systemUptime</text>
          <text x="229" y="38" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">NSProcessInfo 开机周期</text>

          <rect x="430" y="0" width="195" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="444" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">model / sysVersion</text>
          <text x="444" y="38" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">UIDevice 硬件与系统描述</text>

          <rect x="645" y="0" width="195" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="659" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">Keychain Group</text>
          <text x="659" y="38" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">SecItem 跨 App 共享存取</text>
        </g>

        <!-- Downward arrow to CLayer -->
        <path d="M 480 150 L 480 190" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-dual-layer-api-arrow)"/>

        <!-- Layer 2: CLayer (BSD / Mach Kernel System Calls) -->
        <rect x="40" y="190" width="880" height="140" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="60" y="218" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13" letter-spacing="0.04em">底层系统调用 (BSD / MACH KERNEL SYSTEM CALLS)</text>

        <g transform="translate(60, 234)">
          <rect x="0" y="0" width="160" height="76" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="12" y="24" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">sysctl / byname</text>
          <text x="12" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">hw.machine / cpu</text>
          <text x="12" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">kern.boottime 时钟</text>

          <rect x="175" y="0" width="160" height="76" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="187" y="24" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">statfs / stat</text>
          <text x="187" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">文件系统分区容量</text>
          <text x="187" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">沙盒目录 inode 属性</text>

          <!-- Focal: openat (Accent) -->
          <rect x="350" y="0" width="180" height="76" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="362" y="24" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">openat (FOCAL)</text>
          <text x="362" y="44" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11">preboot 隐匿分区探测</text>
          <text x="362" y="62" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11">穿透全盘抹机关键锚点</text>

          <rect x="545" y="0" width="160" height="76" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="557" y="24" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">mach_continuous</text>
          <text x="557" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">高精度连续时钟周期</text>
          <text x="557" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">时钟抖动侧信道探测</text>

          <rect x="720" y="0" width="120" height="76" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="732" y="24" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">CCCrypt</text>
          <text x="732" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">CommonCrypto</text>
          <text x="732" y="62" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">对称加密封包点位</text>
        </g>

        <!-- Upward Red Hook Attack Arrows -->
        <path d="M 220 370 L 220 330" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ios-fingerprint-dual-layer-api-arrow-accent)"/>
        <path d="M 480 370 L 480 330" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ios-fingerprint-dual-layer-api-arrow-accent)"/>
        <path d="M 740 370 L 740 330" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ios-fingerprint-dual-layer-api-arrow-accent)"/>

        <!-- Layer 3: Attack Surface (黑产逆向与 Hook 拦截重灾区) -->
        <rect x="40" y="370" width="880" height="110" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-opacity="0.25"/>
        <text x="60" y="398" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="13" letter-spacing="0.04em">黑产逆向与 HOOK 拦截重灾区 (ATTACK SURFACE)</text>

        <g transform="translate(60, 414)">
          <rect x="0" y="0" width="265" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="14" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13">动态 Dylib 注入</text>
          <text x="14" y="38" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">TrollFools / CoreTrust / Frida</text>

          <rect x="288" y="0" width="265" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="302" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13">C 符号表指针替换</text>
          <text x="302" y="38" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">fishhook / Dobby Inline Hook</text>

          <rect x="575" y="0" width="265" height="48" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="589" y="22" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13">ObjC 运行时变造</text>
          <text x="589" y="38" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">Method Swizzling / Substrate</text>
        </g>
      </svg>
