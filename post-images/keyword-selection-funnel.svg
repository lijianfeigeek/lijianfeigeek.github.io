<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keyword-selection-funnel-title keyword-selection-funnel-desc" id="keyword-selection-funnel-root">
        <title id="keyword-selection-funnel-title">精准掘金：关键词严选五步漏斗过滤模型</title>
        <desc id="keyword-selection-funnel-desc">从基础搜索量、真实流量潜力 (TP)、商业契合度打分、3C 搜索意图校验到 KD 竞争壁垒的递进过滤</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #keyword-selection-funnel-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #keyword-selection-funnel-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #keyword-selection-funnel-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="keyword-selection-funnel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="keyword-selection-funnel-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="keyword-selection-funnel-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <g transform="translate(60, 24)">
          <rect x="0" y="0" width="840" height="60" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
          <text x="20" y="24" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STEP 01 · 搜索需求校验 (SEARCH VOLUME)</text>
          <text x="20" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">基准过滤：月搜索量 Volume > 门槛 | 立即排除完全无需求的虚无词与已被绝对垄断的纯品牌大词</text>
        </g>
        <g transform="translate(90, 96)">
          <rect x="0" y="0" width="780" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="20" y="24" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STEP 02 · 真实流量潜力校验 (TRAFFIC POTENTIAL · TP)</text>
          <text x="20" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">防踩坑排查：剔除“零点击搜索 (Zero-Click Searches)”陷阱（如已被 Google AI 概览直接解答的即时事实）</text>
        </g>
        <g transform="translate(120, 168)">
          <rect x="0" y="0" width="720" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.05"/>
          <text x="20" y="26" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STEP 03 · 商业契合度打分 (BUSINESS FIT 0~3 分模型 · FOCAL)</text>
          <text x="20" y="46" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12">3 分：产品就是无可替代的直接解决方案；2 分：产品能间接帮上忙；0~1 分：纯闲逛流量，坚决剔除！</text>
        </g>
        <g transform="translate(150, 244)">
          <rect x="0" y="0" width="660" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="20" y="24" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STEP 04 · 搜索意图 3C 校验 (SEARCH INTENT VALIDATION)</text>
          <text x="20" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">SERP 格式校验：Content Type（工具/博客）+ Content Format（对比表/教程）+ Content Angle（免费/极速）</text>
        </g>
        <g transform="translate(180, 316)">
          <rect x="0" y="0" width="600" height="60" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.12"/>
          <text x="20" y="24" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">STEP 05 · 排名难度综合评估 (KEYWORD DIFFICULTY · KD)</text>
          <text x="20" y="44" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">壁垒审查：评估排名前列对手的 DR、引用域名数与页面实测深度 | 确定自身内容护城河与超越路径</text>
        </g>
      </svg>
