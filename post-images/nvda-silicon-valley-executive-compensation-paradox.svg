<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="nvda-silicon-valley-executive-compensation-paradox-title nvda-silicon-valley-executive-compensation-paradox-desc">
  <title id="nvda-silicon-valley-executive-compensation-paradox-title">硅谷高管薪酬与资产配置悖论模型</title>
  <desc id="nvda-silicon-valley-executive-compensation-paradox-desc">拆解硅谷高管股票薪酬主导模式、资产过度集中风险与为什么内部人只卖不买的深层机理</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">资本市场悖论破解：为什么硅谷高管与核心董事“只卖不买”？</text>
    <text x="896" y="16" text-anchor="end" class="tag">RSU DYNAMICS &amp; RISK MANAGEMENT</text>
  </g>

  <!-- 3-Phase Horizontal Flow -->
  <!-- Phase 1: 硅谷核心薪酬包体系 -->
  <g transform="translate(32, 60)">
    <rect width="280" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="280" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="280" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">第一阶段：薪酬包结构</text>
    <text x="266" y="25" text-anchor="end" class="tag">COMP PACKAGE</text>

    <g transform="translate(14, 56)">
      <rect width="252" height="64" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">基础现金年薪（Base Salary）</text>
        <text class="desc" x="0" y="18">• 仅占年总收入 5% ~ 10%</text>
        <text class="desc" x="0" y="34">• 几乎仅用于维持基础日常开支</text>
      </g>
    </g>

    <g transform="translate(14, 130)">
      <rect width="252" height="80" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">受限股票与期权（RSU &amp; Options）</text>
        <text class="desc" x="0" y="18">• 占总薪酬 90% 以上绝对大头</text>
        <text class="desc" x="0" y="34">• 每季度按既定时间表解禁（Vest）</text>
        <text class="tag" x="0" y="52">高管本身就是股票最大生产端</text>
      </g>
    </g>

    <g transform="translate(14, 220)">
      <rect width="252" height="86" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">结论：二级市场自费买入毫无逻辑</text>
        <text class="desc" x="0" y="18">• 手握数百万股待归属期权</text>
        <text class="desc" x="0" y="34">• 想增加暴露度只需继续留任持股</text>
        <text class="desc" x="0" y="50">• 绝无必要额外掏出个人税后现金加仓</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 312 225 L 342 225" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Phase 2: 资产负债表极度失衡 (Core Accent) -->
  <g transform="translate(342, 60)">
    <rect width="280" height="330" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="280" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="280" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="14" y="25" class="coral-title">第二阶段：单一敞口危机</text>
    <text x="266" y="25" text-anchor="end" class="coral-tag">CONCENTRATION RISK</text>

    <g transform="translate(14, 56)">
      <rect width="252" height="74" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">95%+ 净资产押注单一标的</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 个人数十亿财富全部绑定英伟达</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 伴随半导体行业剧烈周期波动</text>
      </g>
    </g>

    <g transform="translate(14, 140)">
      <rect width="252" height="74" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">违反 MPT 现代投资组合理论</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 受托人审慎投资准则（Prudent Man）</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 极端黑天鹅下缺乏下行安全气囊</text>
      </g>
    </g>

    <g transform="translate(14, 224)">
      <rect width="252" height="82" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">刚性税收压力：Sell to Cover</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 解禁时刻视同普通收入</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 强制卖出 50%+ 缴纳联邦与加州税</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 622 225 L 652 225" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Phase 3: 理性反脆弱多元化配置 -->
  <g transform="translate(652, 60)">
    <rect width="276" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="276" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="276" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="276" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">第三阶段：理性再平衡</text>
    <text x="262" y="25" text-anchor="end" class="tag">DIVERSIFICATION</text>

    <g transform="translate(14, 56)">
      <rect width="248" height="64" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">无风险资产与主权债券</text>
        <text class="desc" x="0" y="18">• 配置 4%~5% 高息无风险美国国债</text>
        <text class="desc" x="0" y="34">• 锁定高确定性被动现金流</text>
      </g>
    </g>

    <g transform="translate(14, 130)">
      <rect width="248" height="64" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">私人信贷与家族不动产</text>
        <text class="desc" x="0" y="18">• PE 基金、抗通胀硬资产</text>
        <text class="desc" x="0" y="34">• 构筑跨周期家族办公室资产底座</text>
      </g>
    </g>

    <g transform="translate(14, 204)">
      <rect width="248" height="102" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">彼得·林奇定律验证</text>
        <text class="desc" x="0" y="18">“卖出有成千上万种理由（交税、分产、慈善、再平衡），但买入只有一个理由：认为它还会涨”</text>
        <text class="green-tag" x="0" y="68">不买 ≠ 看空，常规套现是必选课</text>
      </g>
    </g>
  </g>
</svg>