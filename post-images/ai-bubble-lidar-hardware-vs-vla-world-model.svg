<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-lidar-hardware-vs-vla-world-model-title ai-bubble-lidar-hardware-vs-vla-world-model-desc">
  <title id="ai-bubble-lidar-hardware-vs-vla-world-model-title">自动驾驶范式突变：激光雷达硬件陷阱 vs 端到端认知大模型</title>
  <desc id="ai-bubble-lidar-hardware-vs-vla-world-model-desc">对比传统依赖激光雷达点云与高精地图的硬件降本路线，与端到端纯视觉世界模型结合大模型时空因果推理的认知降维打击</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="vla-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Traditional LiDAR Route -->
  <g transform="translate(40, 30)">
    <rect width="410" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#64748b"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">传统路线 · 硬件摩尔定律推演</text>
    <text x="20" y="58" class="label-title">激光雷达 + 高精地图规则派</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">1. 激光雷达点云物理测距 (LiDAR)</text>
      <text x="12" y="40" class="text-body">毫米级几何距离测量，但无法感知材质与交通语义</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="370" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">2. 强依赖高精地图与硬编码手工规则</text>
      <text x="12" y="40" class="text-body">修路或施工时先验失效，系统陷入 corner case 死结</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="370" height="52" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#b91c1c">❌ 致命弱点：成本刚性与硬件依赖</text>
      <text x="12" y="40" class="text-body">硬件每代升级导致老车无法享受红利，被软件算法弯道超车</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 458 170 L 498 170" stroke="#bf4520" stroke-width="1.5" marker-end="url(#vla-arrow)"/>

  <!-- Right: Cognitive Paradigm (Focal) -->
  <g transform="translate(510, 30)">
    <rect width="410" height="280" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">次世代突破 · 认知大模型涌现</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">纯视觉端到端 + 世界模型理解派</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#9a3412">1. 高清环视摄像头 (极简低廉硬件)</text>
      <text x="12" y="40" class="text-body">全车数年无需更换硬件，低成本百万车队海量回流真实数据</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#9a3412">2. 端到端神经系统 (Transformer / VLA)</text>
      <text x="12" y="40" class="text-body">光子入，控制出；彻底废弃人类手写 if-else 规则链</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="12" y="22" class="text-feat" fill="#bf4520">✅ 质变超越：世界模型与时空因果推理</text>
      <text x="12" y="40" class="text-body">具备直觉推断行人意图与遮挡盲区能力，能力随云端训练无限自进</text>
    </g>
  </g>
</svg>