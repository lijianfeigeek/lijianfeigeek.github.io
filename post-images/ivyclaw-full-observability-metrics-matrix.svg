<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="ivyclaw-metrics-title ivyclaw-metrics-desc">
  <title id="ivyclaw-metrics-title">IvyClaw 全链路指标度量与 Token 实时核算架构</title>
  <desc id="ivyclaw-metrics-desc">展示HTTP服务层RED规范、Agent与模型治理层实时Token成本核算、以及异步队列与沙箱基础设施层的可观测性矩阵</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .layer-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-layer { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <rect width="960" height="450" class="bg" />

  <!-- Layer 1: HTTP Service RED Metrics (y=40, h=95) -->
  <g transform="translate(50, 40)">
    <rect width="860" height="95" rx="8" class="layer-card" />
    <text x="20" y="26" class="text-title">1. HTTP 服务层：RED 工业级度量规范</text>
    <text x="700" y="26" class="text-muted">Prometheus 接入</text>

    <g transform="translate(20, 38)">
      <rect width="250" height="44" class="pill" />
      <text x="10" y="18" class="text-subtitle">Rate (请求速率)</text>
      <text x="10" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">http_requests_total (path/status)</text>
    </g>

    <g transform="translate(290, 38)">
      <rect width="260" height="44" class="pill" />
      <text x="10" y="18" class="text-subtitle">Duration (延迟分位)</text>
      <text x="10" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">http_request_duration_seconds</text>
    </g>

    <g transform="translate(570, 38)">
      <rect width="270" height="44" class="pill" />
      <text x="10" y="18" class="text-subtitle">Concurrency (在飞并发)</text>
      <text x="10" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">http_requests_in_flight (Gauge)</text>
    </g>
  </g>

  <!-- Layer 2: Agent &amp; LLM Cost Governance (y=150, h=150) - Focal -->
  <g transform="translate(50, 150)">
    <rect width="860" height="150" rx="8" class="focal-layer" />
    <path d="M 0 8 Q 0 0 8 0 L 852 0 Q 860 0 860 8 L 860 36 L 0 36 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="20" y="24" class="text-focal-title">2. Agent 与模型治理层：角色分级路由与 Token 成本实时核算</text>
    <text x="680" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#bf4520">Role-to-Tier Routing</text>

    <!-- 4 Metrics in Layer 2 -->
    <g transform="translate(20, 48)">
      <rect width="195" height="88" class="focal-pill" />
      <text x="10" y="20" class="text-subtitle" fill="#bf4520">Token 用量分档度量</text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">agent_llm_tokens_total</text>
      <text x="10" y="52" class="text-body">• strong: 规划/编码/审查</text>
      <text x="10" y="66" class="text-body">• standard: 单测编写</text>
      <text x="10" y="80" class="text-body">• cheap: 检索与格式化</text>
    </g>

    <g transform="translate(230, 48)">
      <rect width="200" height="88" class="focal-pill" />
      <text x="10" y="20" class="text-subtitle" fill="#bf4520">实时人民币成本换算</text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#991b1b">agent_llm_cost_yuan_total</text>
      <text x="10" y="54" class="text-body">结合实时单价中心动态换算</text>
      <text x="10" y="70" class="text-body">精准追踪每个阶段与租户</text>
      <text x="10" y="84" class="text-body">算力成本一目了然</text>
    </g>

    <g transform="translate(445, 48)">
      <rect width="195" height="88" class="pill" />
      <text x="10" y="20" class="text-subtitle">工具执行指标</text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">agent_tool_calls_total</text>
      <text x="10" y="54" class="text-muted">• 工具调用频率与成功率</text>
      <text x="10" y="68" class="text-muted">• 捕获耗时瓶颈工具</text>
      <text x="10" y="82" class="text-muted">• tool_call_duration_seconds</text>
    </g>

    <g transform="translate(655, 48)">
      <rect width="185" height="88" class="pill" />
      <text x="10" y="20" class="text-subtitle">模型降级熔断告警</text>
      <text x="10" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">agent_fallback_total</text>
      <text x="10" y="54" class="text-muted">• 捕获供应商 429 限流</text>
      <text x="10" y="68" class="text-muted">• 自动无缝降级备选云端</text>
      <text x="10" y="82" class="text-muted">• 保障企业级服务不掉线</text>
    </g>
  </g>

  <!-- Layer 3: Infrastructure &amp; Async Metrics (y=315, h=100) -->
  <g transform="translate(50, 315)">
    <rect width="860" height="100" rx="8" class="layer-card" />
    <text x="20" y="26" class="text-title">3. 异步任务与沙箱基础设施层度量</text>
    <text x="690" y="26" class="text-muted">Worker &amp; Docker 监控</text>

    <g transform="translate(20, 38)">
      <rect width="195" height="50" class="pill" />
      <text x="10" y="18" class="text-subtitle">队列等待延迟</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">agent_queue_wait_seconds</text>
    </g>

    <g transform="translate(230, 38)">
      <rect width="195" height="50" class="pill" />
      <text x="10" y="18" class="text-subtitle">待处理队列饱和度</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">agent_queue_length (Gauge)</text>
    </g>

    <g transform="translate(440, 38)">
      <rect width="200" height="50" class="pill" />
      <text x="10" y="18" class="text-subtitle">沙箱冷启动耗时</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">sandbox_create_duration_s</text>
    </g>

    <g transform="translate(655, 38)">
      <rect width="185" height="50" class="pill" />
      <text x="10" y="18" class="text-subtitle">活跃运行沙箱数</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">sandbox_active (并发上限)</text>
    </g>
  </g>
</svg>