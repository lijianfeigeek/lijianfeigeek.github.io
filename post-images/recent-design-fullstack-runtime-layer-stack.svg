<svg width="960" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="rd-layer-title rd-layer-desc">
  <title id="rd-layer-title">Recent Design 全栈极速交互与流式媒体分层架构</title>
  <desc id="rd-layer-desc">从感知交互、流式虚拟调度、技术逆向与Agent技能，到边缘多分发底座的四层端到端架构解析。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .layer-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #1e293b; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .tech-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #2563eb; }
  </style>

  <!-- Base Canvas -->
  <rect width="960" height="560" fill="#fafafa"/>
  <rect x="24" y="16" width="912" height="528" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 42)">
    <text class="title" x="0" y="0">Recent Design 全栈极速交互与流式媒体分层架构</text>
    <text class="subtitle" x="0" y="20">端到端解构：从客户端零运行时样式、悬浮多码率视频调度，到自动化技术探测与 AI 智能体技能标准</text>
  </g>

  <!-- Layer 1: Client Perception & UI Routing -->
  <g transform="translate(48, 82)">
    <rect width="864" height="96" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <g transform="translate(16, 20)">
      <text class="layer-tag" fill="#1d4ed8" x="0" y="0">LAYER 01: 感知交互与路由控制层 (Perception &amp; Routing)</text>
      <text class="layer-title" x="380" y="0">TanStack Router 流式 SSR 水合 + Meta StyleX 零运行时样式</text>
    </g>

    <!-- 3 Cards in Layer 1 -->
    <g transform="translate(16, 32)">
      <!-- Card 1-1 -->
      <g transform="translate(0, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">TanStack Router 流式状态恢复</text>
          <text class="item-desc" x="0" y="15">SSR 预注数据 + TSR 滚动精准还原</text>
          <text class="tech-code" x="0" y="28">restoreScroll / dehydratedData</text>
        </g>
      </g>
      <!-- Card 1-2 -->
      <g transform="translate(282, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">Meta StyleX 编译期原子样式</text>
          <text class="item-desc" x="0" y="15">去运行时 CSS 开销，纯原子类名注入</text>
          <text class="tech-code" x="0" y="28">tokens.stylex / Zero Runtime Overhead</text>
        </g>
      </g>
      <!-- Card 1-3 -->
      <g transform="translate(564, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">Presence 视口锚点与变形</text>
          <text class="item-desc" x="0" y="15">滚动锁止遮罩与文字平滑形态渐变</text>
          <text class="tech-code" x="0" y="28">data-presence-anchor / morph-text</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Layer 2: Feed Virtualization & Video Streaming -->
  <g transform="translate(48, 192)">
    <rect width="864" height="96" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <g transform="translate(16, 20)">
      <text class="layer-tag" fill="#15803d" x="0" y="0">LAYER 02: 流式媒体与虚拟调度层 (Streaming Media &amp; Feed)</text>
      <text class="layer-title" x="400" y="0">自适应 Feed Masonry + 悬浮静音动态视频预载系统</text>
    </g>

    <!-- 3 Cards in Layer 2 -->
    <g transform="translate(16, 32)">
      <!-- Card 2-1 -->
      <g transform="translate(0, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">等比例防抖画廊栅格</text>
          <text class="item-desc" x="0" y="15">强制 aspect-ratio: 1 消除重排抖动</text>
          <text class="tech-code" x="0" y="28">feed-media-card / Responsive Masonry</text>
        </g>
      </g>
      <!-- Card 2-2 -->
      <g transform="translate(282, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">悬浮即启高帧视频流</text>
          <text class="item-desc" x="0" y="15">海报秒开，Hover 自动解码微动效</text>
          <text class="tech-code" x="0" y="28">preload="none" / hover-trigger play()</text>
        </g>
      </g>
      <!-- Card 2-3 -->
      <g transform="translate(564, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">路由级浮层深链交互</text>
          <text class="item-desc" x="0" y="15">/i/:slug 模态压栈打开，保留主页滚动</text>
          <text class="tech-code" x="0" y="28">Modal Route / Persistent Feed Context</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Layer 3: Tech Reverse-Engineering & Agent Skills Hub -->
  <g transform="translate(48, 302)">
    <rect width="864" height="96" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <g transform="translate(16, 20)">
      <text class="layer-tag" fill="#7e22ce" x="0" y="0">LAYER 03: 技术栈逆向与 Agent 技能货架 (Reverse-Eng &amp; Agent Skills)</text>
      <text class="layer-title" x="430" y="0">自动化前端依赖指纹探查 + AI 智能体设计技能标准分发</text>
    </g>

    <!-- 3 Cards in Layer 3 -->
    <g transform="translate(16, 32)">
      <!-- Card 3-1 -->
      <g transform="translate(0, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">全栈依赖自动嗅探引擎</text>
          <text class="item-desc" x="0" y="15">透视 React / Tailwind / Lenis / Three.js</text>
          <text class="tech-code" x="0" y="28">Framework &amp; Interaction Fingerprinting</text>
        </g>
      </g>
      <!-- Card 3-2 -->
      <g transform="translate(282, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">多维设计美学语料打标</text>
          <text class="item-desc" x="0" y="15">Typographic / Editorial / Muted 维度</text>
          <text class="tech-code" x="0" y="28">Aesthetic &amp; Typography Classification</text>
        </g>
      </g>
      <!-- Card 3-3 -->
      <g transform="translate(564, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">AI Agent Skills 技能枢纽</text>
          <text class="item-desc" x="0" y="15">集成 Claude / Vercel Labs 官方规范</text>
          <text class="tech-code" x="0" y="28">canvas-design / quieter / critique / distill</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Layer 4: Edge CDN & Privacy-First Telemetry -->
  <g transform="translate(48, 412)">
    <rect width="864" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(16, 20)">
      <text class="layer-tag" fill="#475569" x="0" y="0">LAYER 04: 边缘网络与无 Cookie 遥测底座 (Edge Delivery &amp; Telemetry)</text>
      <text class="layer-title" x="420" y="0">多分辨率切片 CDN + Cloudflare 全球就近接入 + Visitors 遥测</text>
    </g>

    <!-- 3 Cards in Layer 4 -->
    <g transform="translate(16, 32)">
      <!-- Card 4-1 -->
      <g transform="translate(0, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">Cloudflare Edge 边缘路由</text>
          <text class="item-desc" x="0" y="15">HTTP/3 极速握手，全球边缘就近缓存</text>
          <text class="tech-code" x="0" y="28">Cloudflare Edge / Fast SSL Termination</text>
        </g>
      </g>
      <!-- Card 4-2 -->
      <g transform="translate(282, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">多阶多码率切片网关</text>
          <text class="item-desc" x="0" y="15">360~1200 WebP + 480~1440 MP4 动态选路</text>
          <text class="tech-code" x="0" y="28">cdn.recent.design / Adaptive Bitrates</text>
        </g>
      </g>
      <!-- Card 4-3 -->
      <g transform="translate(564, 0)">
        <rect width="268" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text class="item-title" x="0" y="0">Visitors 隐私实时分析</text>
          <text class="item-desc" x="0" y="15">无 Cookie 追踪，极轻量实时曝光统计</text>
          <text class="tech-code" x="0" y="28">cdn.visitors.now / Real-time Impressions</text>
        </g>
      </g>
    </g>
  </g>
</svg>
