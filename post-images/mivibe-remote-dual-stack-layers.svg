<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="mv-layer-title mv-layer-desc" id="mv-layer-root" data-diagram="layer-stack">
  <title id="mv-layer-title">MiVibe Remote 双平台异构原生底座五层架构栈</title>
  <desc id="mv-layer-desc">展示 MiVibe Remote 从顶层统一 Ed25519 双轨签名更新与四预设契约，向下穿透 macOS 与 Windows 各自原生的定点 HID 拦截、虚拟音频环回与 BLE ATVV 协议底座的五层抽象堆栈。</desc>
  <defs>
    <pattern id="mvl-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="mvl-arr-up" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="620" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="620" fill="url(#mvl-dots)"/>
  <rect x="16" y="16" width="968" height="588" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.16em">DUAL-HOST ABSTRACTION STACK · ONE PRODUCT CONTRACT, TWO NATIVE RUNTIMES</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">拒绝跨平台框架强行抹平硬件层：macOS 与 Windows 双栈五层能力映射</text>
  </g>

  <!-- Left Margin Direction Indicator (x=48..104) -->
  <line x1="68" y1="516" x2="68" y2="128" stroke="#64748b" stroke-width="1.2" marker-end="url(#mvl-arr-up)"/>
  <g transform="translate(68, 114)">
    <text x="0" y="0" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">PRODUCT</text>
  </g>
  <g transform="translate(68, 536)">
    <text x="0" y="0" fill="#64748b" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">SILICON</text>
  </g>

  <!-- Column Headers above Stack (x=116..956, width=840) -->
  <g transform="translate(116, 96)">
    <text x="16" y="12" fill="#64748b" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LAYER</text>
    <text x="148" y="12" fill="#0f172a" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SHARED SEMANTIC CONTRACT</text>
    <text x="412" y="12" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">MACOS NATIVE HOST (SWIFT / APPKIT)</text>
    <text x="648" y="12" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">WINDOWS NATIVE HOST (PYTHON / WINRT)</text>
  </g>

  <!-- Outer Stack Silhouette (x=116, y=120, width=840, height=420, 5 bands * 84px) -->
  <rect x="116" y="120" width="840" height="420" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <!-- L5: Release & Signed Appcast (y=120..204) -->
  <g transform="translate(116, 120)">
    <rect x="0" y="0" width="840" height="84" rx="6" fill="#ffffff"/>
    <line x1="0" y1="84" x2="840" y2="84" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="34" fill="#64748b" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">L5 · UPDATE</text>
    <text x="16" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">Ed25519 Appcast</text>
    <text x="148" y="34" fill="#0f172a" font-size="13.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">单钥双清单签名晋升</text>
    <text x="148" y="56" fill="#64748b" font-size="10.5" font-family="'Geist', 'PingFang SC', sans-serif">先传包校验哈希，后切 XML</text>
    <text x="412" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">Sparkle 2.9.4 手工分级深签</text>
    <text x="412" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">仅 Downloader XPC 保留权限</text>
    <text x="648" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">WinSparkle + Inno 原位静默升级</text>
    <text x="648" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">/UPDATED 免重装音频驱动</text>
  </g>

  <!-- L4: Workflow Presets & Gestures (y=204..288) -->
  <g transform="translate(116, 204)">
    <rect x="0" y="0" width="840" height="84" fill="#f8fafc"/>
    <line x1="0" y1="84" x2="840" y2="84" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="34" fill="#64748b" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">L4 · PRESETS</text>
    <text x="16" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">Hold vs Toggle</text>
    <text x="148" y="34" fill="#0f172a" font-size="13.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">多宿主工作流一键预设</text>
    <text x="148" y="56" fill="#64748b" font-size="10.5" font-family="'Geist', 'PingFang SC', sans-serif">切换预设自动保留循环键</text>
    <text x="412" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">⌃⇧D / ⌘D / Fn + 三态手势器</text>
    <text x="412" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">300ms 双击 · 550ms 长按状态机</text>
    <text x="648" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">RightAlt / Ctrl+D / 右 Ctrl 千问</text>
    <text x="648" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">扫描码注入 + TV 键 2.0s 防抖门</text>
  </g>

  <!-- L3: FOCAL LAYER - Precision HID Interception (y=288..372) -->
  <g transform="translate(116, 288)">
    <rect x="0" y="0" width="840" height="84" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="16" y="34" fill="#bf4520" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">L3 · HID TAP</text>
    <text x="16" y="54" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">0x2717 : 0x32B8</text>
    <text x="148" y="34" fill="#0f172a" font-size="13.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">零主键盘污染定点接管</text>
    <text x="148" y="56" fill="#bf4520" font-size="10.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">补齐 0xF1 返回键硬件盲区</text>
    <text x="412" y="34" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">IOHID 独占回退 hidutil 局部映射</text>
    <text x="412" y="56" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">原生键直通 · 0xF1 postToPid 直投</text>
    <text x="648" y="34" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">RawInput + WUDFHost 探针补全</text>
    <text x="648" y="56" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">SHA-256 校验 Gadget 救回丢包键</text>
  </g>

  <!-- L2: Virtual Audio Loopback (y=372..456) -->
  <g transform="translate(116, 372)">
    <rect x="0" y="0" width="840" height="84" fill="#f8fafc"/>
    <line x1="0" y1="84" x2="840" y2="84" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="34" fill="#64748b" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">L2 · AUDIO</text>
    <text x="16" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">48kHz Loopback</text>
    <text x="148" y="34" fill="#0f172a" font-size="13.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">零输出篡改虚拟声卡桥</text>
    <text x="148" y="56" fill="#64748b" font-size="10.5" font-family="'Geist', 'PingFang SC', sans-serif">纯内存 PCM 转发不落盘</text>
    <text x="412" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">MiRemoteV2ch.driver (USB 补丁)</text>
    <text x="412" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">DefaultInputDeviceLease 退出回滚</text>
    <text x="648" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">独立 AudioRouter 进程 + VB-CABLE</text>
    <text x="648" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">UDP :31680/:31681 · WASAPI 优选</text>
  </g>

  <!-- L1: BLE GATT & ATVV Protocol (y=456..540) -->
  <g transform="translate(116, 456)">
    <rect x="0" y="0" width="840" height="84" rx="6" fill="#ffffff"/>
    <text x="16" y="34" fill="#64748b" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">L1 · BLE GATT</text>
    <text x="16" y="54" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">ATVV AB5E0001</text>
    <text x="148" y="34" fill="#0f172a" font-size="13.5" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">ATVV 16kHz 帧同步解码</text>
    <text x="148" y="56" fill="#64748b" font-size="10.5" font-family="'Geist', 'PingFang SC', sans-serif">高位半字节 ADPCM + 限幅</text>
    <text x="412" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">CoreBluetooth 精确白名单重连</text>
    <text x="412" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">8s 初始化门禁 · 拒接 8kHz 降级</text>
    <text x="648" y="34" fill="#0f172a" font-size="11.5" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">WinRT GattDeviceService 发现</text>
    <text x="648" y="56" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">AQS 枚举已配对 · 自动区分 RC001/003</text>
  </g>

  <!-- Vertical Subtle Column Dividers inside Stack -->
  <line x1="252" y1="120" x2="252" y2="540" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="516" y1="120" x2="516" y2="540" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="752" y1="120" x2="752" y2="540" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="564" x2="960" y2="564" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(116, 580)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#fff7f5" stroke="#bf4520" stroke-width="1.5"/>
    <text x="20" y="12" fill="#0f172a" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', sans-serif">最难啃的跨平台差异层（L3 定点 HID 抑制与非标 0xF1 返回键补全）</text>
  </g>
  <g transform="translate(560, 580)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="20" y="12" fill="#475569" font-size="11" font-family="'Geist', 'PingFang SC', sans-serif">原生宿主各自复用最优系统栈（GPL-3.0-only）</text>
  </g>
</svg>
