<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="kiri-stack-title kiri-stack-desc" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="kiri-stack-title">Kiri 四层系统堆栈与 10.2MB 定制内核冷启动削减剖面</title>
  <desc id="kiri-stack-desc">展示 Kiri 从宿主机控制平面、vsock 零分配总线、10.2MB 定制 Linux 内核五大补丁到 Guest PID 1 容器隔离层的纵向架构，以及冷启动从 810ms 降至 112ms 的各阶段指标。</desc>
  <defs>
    <marker id="ks-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="ks-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="660" fill="#f8fafc"/>

  <!-- Header -->
  <g transform="translate(36, 20)">
    <rect x="0" y="0" width="888" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" font-size="16" font-weight="700" fill="#0f172a">Kiri 四层纵向系统堆栈与 112 ms 极速冷启动内核剖面</text>
    <text x="20" y="42" font-size="11" fill="#475569">全栈消除 CGO 与高层抽象：objc2 直驱虚拟化 · 5 项内核外科补丁 · 单线程 poll() + clone3 隔离</text>
    <rect x="764" y="14" width="108" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="818" y="30" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="600" fill="#475569" text-anchor="middle">LAYER STACK</text>
  </g>

  <!-- Left Margin Direction Indicator -->
  <g transform="translate(36, 92)">
    <rect x="0" y="0" width="52" height="332" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="26" y1="36" x2="26" y2="296" stroke="#64748b" stroke-width="1.2" marker-end="url(#ks-arrow-muted)"/>
    <text x="26" y="22" font-size="8.5" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#475569" text-anchor="middle">HOST</text>
    <text x="26" y="318" font-size="8.5" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">GUEST</text>
  </g>

  <!-- L4: Host Control Plane -->
  <g transform="translate(100, 92)">
    <rect x="0" y="0" width="824" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="12" y="14" width="44" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="34" y="28" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#334155" text-anchor="middle">L4</text>
    <text x="72" y="29" font-size="13.5" font-weight="700" fill="#0f172a">宿主机控制平面 (kiri daemon &amp; kiri-vmm)</text>
    <text x="72" y="50" font-size="11" fill="#475569">macOS objc2 直驱 Virtualization.framework · Linux 原生内核无 VM · Windows 命名管道桥接 WSL2</text>
    <text x="808" y="28" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2e5aa8" text-anchor="end">NFSv3 Unix Sock + 受限本地 CA</text>
    <text x="808" y="50" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="end">WKWebView / GTK 原生窗口 (38 语言)</text>
  </g>

  <!-- L3: Zero-Alloc Wire Bus -->
  <g transform="translate(100, 176)">
    <rect x="0" y="0" width="824" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="12" y="14" width="44" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="34" y="28" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#2e5aa8" text-anchor="middle">L3</text>
    <text x="72" y="29" font-size="13.5" font-weight="700" fill="#0f172a">零分配通信总线 (kiri-proto over vsock &amp; virtiofs)</text>
    <text x="72" y="50" font-size="11" fill="#475569">#![forbid(unsafe_code)] + no_std · 复用调用方缓冲区 · 4 MiB INPUT_WINDOW 信用流控</text>
    <text x="808" y="28" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#059669" text-anchor="end">Port 1024 控制 | 1028 复制 | 1037 DNS | 1040 USB</text>
    <text x="808" y="50" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="end">vsock 往返 p50: 31 µs / p99: 62 µs</text>
  </g>

  <!-- L2: Custom 10.2 MB Linux Kernel (FOCAL LAYER) -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="824" height="84" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="12" y="14" width="44" height="20" rx="4" fill="#ffedd5" stroke="#bf4520" stroke-width="0.8"/>
    <text x="34" y="28" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">L2 ★</text>
    <text x="72" y="29" font-size="13.5" font-weight="700" fill="#7c2d12">10.2 MB 定制 Linux 内核与 5 项外科补丁 (guest/kernel/)</text>
    <text x="72" y="50" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">P1: virtio-pci hrtimer 轮询 (-30ms)   P2: virtnet_kiri_big_tcp 64KiB GSO   P3: FUSE 0200 读写修复</text>
    <text x="72" y="68" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#9a3412">P4: GRO frag_list 防崩溃   P5: 消除零值 AT_HWCAP3 拯救 Rosetta x86_64   启动参数: rcu_expedited=1</text>
    <text x="808" y="29" font-size="10.5" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520" text-anchor="end">10,264 KB (原 32 MB)</text>
  </g>

  <!-- L1: Guest PID 1 & Container Isolation -->
  <g transform="translate(100, 356)">
    <rect x="0" y="0" width="824" height="72" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <rect x="12" y="14" width="44" height="20" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="0.8"/>
    <text x="34" y="28" font-size="10" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0f172a" text-anchor="middle">L1</text>
    <text x="72" y="29" font-size="13.5" font-weight="700" fill="#0f172a">Guest PID 1 与容器隔离内核原语 (crates/kiri-init)</text>
    <text x="72" y="50" font-size="11" fill="#475569">单线程 poll() + signalfd · clone3(CLONE_INTO_CGROUP) · overlayfs + pivot_root · 内置 --init 僵尸收割</text>
    <text x="808" y="28" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2e5aa8" text-anchor="end">手写 AF_NETLINK (rtnetlink + nf_tables)</text>
    <text x="808" y="50" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="end">黑名单 cBPF Seccomp (SPEC_ALLOW)</text>
  </g>

  <!-- Boot Latency Reduction Bar Chart -->
  <g transform="translate(36, 448)">
    <rect x="0" y="0" width="888" height="192" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#0f172a">VM 冷启动耗时削减轨迹 (Cold Boot to Agent Ready · 实测自 bench/results.json)</text>
    <text x="868" y="26" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#64748b" text-anchor="end">单位: 毫秒 (ms) · 越短越快</text>

    <!-- Row 1: 810 ms -->
    <g transform="translate(20, 44)">
      <text x="0" y="18" font-size="11.5" font-weight="600" fill="#334155">1. Stock arm64 defconfig 内核</text>
      <rect x="240" y="4" width="560" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="812" y="18" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#475569">810 ms</text>
    </g>

    <!-- Row 2: 175 ms -->
    <g transform="translate(20, 80)">
      <text x="0" y="18" font-size="11.5" font-weight="600" fill="#334155">2. allnoconfig 极简裁剪</text>
      <rect x="240" y="4" width="121" height="20" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
      <text x="372" y="18" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">175 ms (-78%)</text>
    </g>

    <!-- Row 3: 140 ms -->
    <g transform="translate(20, 116)">
      <text x="0" y="18" font-size="11.5" font-weight="600" fill="#334155">3. rcu_expedited=1 (cgroup2 23→0.1ms)</text>
      <rect x="240" y="4" width="97" height="20" rx="4" fill="#dbeafe" stroke="#2e5aa8" stroke-width="1"/>
      <text x="348" y="18" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#2e5aa8">140 ms (-35 ms)</text>
    </g>

    <!-- Row 4: 112 ms (Focal) -->
    <g transform="translate(20, 152)">
      <text x="0" y="18" font-size="11.5" font-weight="700" fill="#7c2d12">4. virtio-pci hrtimer 补丁 (终态)</text>
      <rect x="240" y="4" width="77" height="20" rx="4" fill="#ffedd5" stroke="#bf4520" stroke-width="1.4"/>
      <text x="328" y="18" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520">112 ms (其中 Apple Helper 占 95ms · 内核→PID 1 仅 8ms · PID 1→Ready 仅 0.4ms)</text>
    </g>
  </g>
</svg>
