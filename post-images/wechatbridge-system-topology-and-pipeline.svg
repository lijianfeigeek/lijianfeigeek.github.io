<svg width="960" height="580" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="wb-topo-title wb-topo-desc">
  <title id="wb-topo-title">WeChatBridge 架构全景：系统拓扑与两阶段原子批处理流水线</title>
  <desc id="wb-topo-desc">详细展示微信宿主进程、Share Extension 沙盒进程、App Group 共享存储、桌面主进程以及目标 AI 与笔记生态的拓扑流转。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="580" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">WeChatBridge 跨进程拓扑与两阶段原子管线</text>
    <text class="subtitle" x="0" y="20">Share Extension 沙盒入库 -> App Group 原子暂存 -> 用户态主进程 AX 焦点驱动 -> 多端 Agent 交付</text>
  </g>

  <!-- Process 1: WeChat Host -->
  <g transform="translate(48, 86)">
    <rect width="180" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">1. 微信宿主进程 (WeChat.app)</text>
    
    <g transform="translate(14, 40)">
      <rect width="152" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">多选聊天记录</text>
        <text class="card-body" x="0" y="16">勾选多条文字/图文</text>
      </g>
    </g>

    <g transform="translate(14, 106)">
      <rect width="152" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">合并转发至第三方</text>
        <text class="mono" fill="#2563eb" x="0" y="16">com.apple.share-services</text>
        <text class="card-body" x="0" y="30">打包脱敏 ZIP 归档流</text>
      </g>
    </g>
  </g>

  <!-- Process 2: Share Extension -->
  <g transform="translate(252, 86)">
    <rect width="210" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">2. Share Extension (严格沙盒)</text>

    <g transform="translate(14, 40)">
      <rect width="182" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">1x1 隐形 ShareViewController</text>
        <text class="mono" fill="#475569" x="0" y="15">viewDidLoad -> 秒级隐藏弹窗</text>
      </g>
    </g>

    <g transform="translate(14, 90)">
      <rect width="182" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">AttachmentImporter</text>
        <text class="card-body" x="0" y="15">纯内存校验与规范化解包</text>
      </g>
    </g>

    <g transform="translate(14, 140)">
      <rect width="182" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <g transform="translate(10, 18)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">原子移动至 Inbox/Ready</text>
      </g>
    </g>
  </g>

  <!-- Storage: App Group Container -->
  <g transform="translate(486, 86)">
    <rect width="200" height="180" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text class="box-title" fill="#92400e" x="14" y="24">3. App Group 共享存储区</text>

    <g transform="translate(14, 40)">
      <rect width="172" height="36" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">Inbox/Staging/</text>
        <text class="card-body" x="0" y="14">两阶段写入中临时目录</text>
      </g>
    </g>

    <g transform="translate(14, 84)">
      <rect width="172" height="42" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <g transform="translate(10, 14)">
        <text class="card-title" fill="#b45309" x="0" y="0">Inbox/Ready/</text>
        <text class="card-body" x="0" y="14">文件重命名原子就绪批次</text>
      </g>
    </g>

    <g transform="translate(14, 134)">
      <rect width="172" height="36" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">Darwin Notify Center</text>
        <text class="mono" fill="#92400e" x="0" y="14">广播 CFNotification 脉冲</text>
      </g>
    </g>
  </g>

  <!-- Process 4: Main Desktop App -->
  <g transform="translate(710, 86)">
    <rect width="202" height="180" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text class="box-title" fill="#1e40af" x="14" y="24">4. 桌面主程序 (后台常驻)</text>

    <g transform="translate(14, 40)">
      <rect width="174" height="36" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">InboxWatcher / Signal</text>
        <text class="card-body" x="0" y="14">监听通知，秒级拉取 Ready</text>
      </g>
    </g>

    <g transform="translate(14, 84)">
      <rect width="174" height="42" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">ActionRunner 意图排队</text>
        <text class="card-body" x="0" y="14">SceneCoordinator 场景提示词</text>
      </g>
    </g>

    <g transform="translate(14, 134)">
      <rect width="174" height="36" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" fill="#ffffff" x="0" y="0">AutoPaste / AX 引擎</text>
        <text class="mono" fill="#ffedd5" x="0" y="14">几何定位 + ⌘V 模拟</text>
      </g>
    </g>
  </g>

  <!-- Horizontal Inter-process Connectors -->
  <path d="M 228 176 L 252 176" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="252,176 246,172 246,180" fill="#94a3b8"/>

  <path d="M 462 176 L 486 176" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="486,176 480,172 480,180" fill="#94a3b8"/>

  <path d="M 686 176 L 710 176" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="710,176 704,172 704,180" fill="#94a3b8"/>

  <!-- Lower Section: Delivery Targets Ecosystem -->
  <g transform="translate(48, 290)">
    <rect width="864" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="20" y="26">5. 最终交付目标生态 (零感秒级自动化落地)</text>

    <!-- Target 1: OpenAI Codex / ChatGPT -->
    <g transform="translate(20, 44)">
      <rect width="260" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">Codex / ChatGPT 桌面端</text>
        <text class="card-body" x="0" y="18">• 自动激活客户端窗口并置顶</text>
        <text class="card-body" x="0" y="34">• 注入 System Prompt 提取代码需求</text>
        <text class="mono" fill="#16a34a" x="0" y="52">STATUS: AX 自动粘贴就绪</text>
      </g>
    </g>

    <!-- Target 2: Anthropic Claude -->
    <g transform="translate(302, 44)">
      <rect width="260" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">Anthropic Claude</text>
        <text class="card-body" x="0" y="18">• 穿透 Electron 焦点陷阱</text>
        <text class="card-body" x="0" y="34">• 两阶段时序：先贴 Prompt，后贴附件</text>
        <text class="mono" fill="#16a34a" x="0" y="52">STATUS: 450ms 渲染防吞没</text>
      </g>
    </g>

    <!-- Target 3: 豆包 / 千问办公 -->
    <g transform="translate(584, 44)">
      <rect width="260" height="84" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" x="0" y="0">豆包 / 千问办公 / WorkBuddy</text>
        <text class="card-body" x="0" y="18">• 针对国内大模型客户端定制</text>
        <text class="card-body" x="0" y="34">• 自动识别微信群名与发言人上下文</text>
        <text class="mono" fill="#16a34a" x="0" y="52">STATUS: 无缝无感转发</text>
      </g>
    </g>

    <!-- Target 4: Obsidian Local Knowledge Base -->
    <g transform="translate(20, 140)">
      <rect width="824" height="80" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
      <g transform="translate(20, 18)">
        <text class="card-title" fill="#5b21b6" x="0" y="0">Obsidian 本地双链知识库沉淀 (KnowledgeDelivery)</text>
        <text class="card-body" fill="#6d28d9" x="0" y="18">• 自动按微信群名创建或匹配历史笔记，写入结构化 YAML Front-matter 元数据</text>
        <text class="card-body" fill="#6d28d9" x="0" y="36">• 增量指纹比对引擎：提取发言人与时间戳 Hash，跨批次自动过滤重复消息，追加图片双链 [[附件/xxx]]</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector from MainApp to Delivery Targets -->
  <path d="M 811 266 L 811 290" stroke="#bf4520" stroke-width="2"/>
  <polygon points="811,290 807,284 815,284" fill="#bf4520"/>
</svg>