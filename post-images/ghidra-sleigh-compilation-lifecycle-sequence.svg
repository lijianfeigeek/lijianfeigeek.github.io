<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghidra-sleigh-compilation-lifecycle-sequence-title ghidra-sleigh-compilation-lifecycle-sequence-desc">
  <title id="ghidra-sleigh-compilation-lifecycle-sequence-title">SLEIGH 规范编译与架构载入全生命周期时序</title>
  <desc id="ghidra-sleigh-compilation-lifecycle-sequence-desc">展示安全研究员编写 .slaspec 规范文本、经过 sleigh 离线编译至 Ghidra 引擎载入的交互时序</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 5 Actor Columns: X = 100, 280, 480, 680, 860 -->
  <line x1="100" y1="56" x2="100" y2="310" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="280" y1="56" x2="280" y2="310" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="480" y1="56" x2="480" y2="310" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="680" y1="56" x2="680" y2="310" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="860" y1="56" x2="860" y2="310" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Actor Badges -->
  <g transform="translate(30, 16)">
    <rect width="140" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor">安全研究员 (Dev)</text>
  </g>

  <g transform="translate(210, 16)">
    <rect width="140" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor">.slaspec 规范文本</text>
  </g>

  <g transform="translate(410, 16)">
    <rect width="140" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor">sleigh 编译器</text>
  </g>

  <g transform="translate(610, 16)">
    <rect width="140" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor" fill="#065f46">.sla 架构模型</text>
  </g>

  <g transform="translate(790, 16)">
    <rect width="140" height="40" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor" fill="#9a3412">Ghidra 运行时核</text>
  </g>

  <!-- Step 1: Write spec -->
  <path d="M 100 84 L 280 84" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="274,81 280,84 274,87" fill="#4b5563"/>
  <text x="190" y="78" text-anchor="middle" class="text-code">1. 编写寄存器、Token 与指令语义</text>

  <!-- Step 2: Trigger sleigh -->
  <path d="M 100 124 L 480 124" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="474,121 480,124 474,127" fill="#4b5563"/>
  <text x="290" y="118" text-anchor="middle" class="text-code">2. 运行 sleigh -a -u 触发模式静态分析</text>

  <!-- Step 3: sleigh reads spec -->
  <path d="M 480 154 L 280 154" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="286,151 280,154 286,157" fill="#6b7280"/>
  <text x="380" y="148" text-anchor="middle" class="text-code">3. 解析语法树与冲突检测</text>

  <!-- Step 4: Output .sla -->
  <path d="M 480 194 L 680 194" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="674,191 680,194 674,197" fill="#10b981"/>
  <text x="580" y="188" text-anchor="middle" class="text-code" fill="#047857">4. 生成紧凑优化的 .sla 字节码文件</text>

  <!-- Step 5: Engine loads -->
  <path d="M 860 234 L 680 234" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="686,231 680,234 686,237" fill="#bf4520"/>
  <text x="770" y="228" text-anchor="middle" class="text-code" fill="#9a3412">5. 启动时通过 mmap 直接载入状态机</text>

  <!-- Highlight Box: Instant Support -->
  <g transform="translate(680, 254)">
    <rect width="250" height="42" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="12" y="24" class="text-code" font-weight="600" fill="#9a3412">✓ 0 改行 C++ 源码即刻支持全新 CPU！</text>
  </g>
</svg>