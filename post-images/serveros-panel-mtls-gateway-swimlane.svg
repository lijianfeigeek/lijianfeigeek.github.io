<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mtls-swim-title mtls-swim-desc" width="1040" height="656" viewBox="0 0 1040 656">
  <title id="mtls-swim-title">ServerOS 零入站端口 mTLS 注册与双向网关泳道</title>
  <desc id="mtls-swim-desc">展示从用户生成 64 位一次性加入命令、目标主机向面板签发 clientAuth 证书、到通过 Rust gateway 建立 8443 mTLS 长连接并异步接收 202 任务的全链路跨泳道交互。</desc>
