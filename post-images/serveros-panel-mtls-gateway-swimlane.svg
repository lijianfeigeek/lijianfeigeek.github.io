    <text x="0" y="42" fill="#2d3142" font-size="24" font-weight="600" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', Georgia, serif">零入站端口：mTLS 证书签发与 Rust 网关双向通道</text>
    <text x="0" y="64" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif">被管服务器无需开放 SSH 或任何管理端口；所有指令与遥测均经由 8443 端口 mTLS 出站长连接完成</text>
  </g>
