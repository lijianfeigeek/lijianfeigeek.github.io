<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="260" viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-fingerprint-attack-pipeline-title ios-fingerprint-attack-pipeline-desc" id="ios-fingerprint-attack-pipeline-root">
        <title id="ios-fingerprint-attack-pipeline-title">黑产对抗：设备指纹全链路逆向破防流程</title>
        <desc id="ios-fingerprint-attack-pipeline-desc">展示黑产攻击者从 IPA 砸壳、符号提取到动态库注入与全量系统调用 Mock 的五步工业化破防流水线</desc>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-fingerprint-attack-pipeline-root { --color-paper:   #f8f9fa;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ios-fingerprint-attack-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-fingerprint-attack-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <marker id="ios-fingerprint-attack-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ios-fingerprint-attack-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
      </marker>
      <marker id="ios-fingerprint-attack-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <pattern id="ios-fingerprint-attack-pipeline-dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <rect width="100%" height="100%" fill="url(#ios-fingerprint-attack-pipeline-dots)" opacity="0.6"/>

        <!-- Step 1 -->
        <g id="step-1" transform="translate(40, 60)">
          <rect x="0" y="0" width="156" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <text x="16" y="30" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">STAGE 01</text>
          <text x="16" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14">IPA 脱壳砸壳</text>
          <text x="16" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">还原 FairPlay 加密段</text>
          <text x="16" y="106" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">dumpdecrypted / Clutch</text>
        </g>

        <!-- Arrow 1 -> 2 -->
        <path d="M 196 130 L 220 130" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-attack-pipeline-arrow)"/>

        <!-- Step 2 -->
        <g id="step-2" transform="translate(220, 60)">
          <rect x="0" y="0" width="156" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <text x="16" y="30" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">STAGE 02</text>
          <text x="16" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14">符号头文件导出</text>
          <text x="16" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">提取类与成员结构</text>
          <text x="16" y="106" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">class-dump / IDA Pro</text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <path d="M 376 130 L 400 130" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-attack-pipeline-arrow)"/>

        <!-- Step 3 -->
        <g id="step-3" transform="translate(400, 60)">
          <rect x="0" y="0" width="156" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <text x="16" y="30" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">STAGE 03</text>
          <text x="16" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14">风控特征定位</text>
          <text x="16" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">定向检索特征类名</text>
          <text x="16" y="106" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">识别阿里/数美/天御</text>
        </g>

        <!-- Arrow 3 -> 4 -->
        <path d="M 556 130 L 580 130" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-attack-pipeline-arrow)"/>

        <!-- Step 4 -->
        <g id="step-4" transform="translate(580, 60)">
          <rect x="0" y="0" width="156" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <text x="16" y="30" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">STAGE 04</text>
          <text x="16" y="58" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="14">动态库注入</text>
          <text x="16" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">免越狱/越狱挂钩</text>
          <text x="16" y="106" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="11">TrollFools / Frida</text>
        </g>

        <!-- Arrow 4 -> 5 (Accent) -->
        <path d="M 736 130 L 760 130" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-fingerprint-attack-pipeline-arrow-accent)"/>

        <!-- Step 5: Focal Accent -->
        <g id="step-5" transform="translate(760, 60)">
          <rect x="0" y="0" width="160" height="140" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="16" y="30" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">STAGE 05 · FOCAL</text>
          <text x="16" y="58" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="14">全量 Mock 变造</text>
          <text x="16" y="86" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">劫持系统调用与属性</text>
          <text x="16" y="106" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11">指纹致盲 · 每次启动突变</text>
        </g>
      </svg>
