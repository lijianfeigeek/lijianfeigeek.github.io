<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 720" width="1140" height="720" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="stateGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#0f1726" />
    </linearGradient>
    <marker id="arrowBlue4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowEmerald4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowCoral4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185" />
    </marker>
    <marker id="arrowAmber4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1140" height="720" fill="#ffffff" />
  <rect x="20" y="20" width="1100" height="680" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(56, 50)">
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#f8fafc" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">LIFECYCLE STATE MACHINE</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">双重原厂金库生命周期与出厂状态无损回退状态机</text>
    <text x="0" y="74" fill="#475569" font-size="13">展示从纯净出厂、首次运行金库镜像、自签证书失效重装自愈到硬件熔丝原生重建的全流转</text>
  </g>

  <!-- State 1: Factory Out-of-the-box (Top Left) -->
  <g transform="translate(60, 140)">
    <rect width="280" height="130" rx="10" fill="url(#stateGrad4)" stroke="#3b82f6" stroke-width="1.5" />
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#f0f9ff" />
      <text x="8" y="14" fill="#0284c7" font-size="10" font-weight="700">STATE 0</text>
      <text x="70" y="15" fill="#f8fafc" font-size="13" font-weight="700">纯净出厂状态 (Factory Pristine)</text>
      <text x="0" y="38" fill="#334155" font-size="11">• 国行 CH/A 原厂硬件配置</text>
      <text x="0" y="54" fill="#334155" font-size="11">• green-tea=true / wapi=true</text>
      <text x="0" y="70" fill="#334155" font-size="11">• 主板 SysCfg 熔丝硬件出厂基准</text>
      <text x="0" y="88" fill="#0284c7" font-size="10" font-weight="600">未安装或未运行任何定制工具</text>
    </g>
  </g>

  <!-- Transition 0 -> 1 -->
  <g transform="translate(340, 195)">
    <line x1="0" y1="10" x2="70" y2="10" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue4)" />
    <text x="35" y="0" text-anchor="middle" fill="#93c5fd" font-size="10">首次打开应用</text>
  </g>

  <!-- State 2: Dual-Vault Snapshot Locked (Top Right) -->
  <g transform="translate(420, 140)">
    <rect width="320" height="130" rx="10" fill="url(#stateGrad4)" stroke="#059669" stroke-width="1.5" />
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#f0fdf4" />
      <text x="8" y="14" fill="#059669" font-size="10" font-weight="700">STATE 1</text>
      <text x="70" y="15" fill="#059669" font-size="13" font-weight="700">双重原厂金库锁定 (Vault Synced)</text>
      <text x="0" y="38" fill="#334155" font-size="11">• 计算 OriginalGestalt.plist 的 SHA-256</text>
      <text x="0" y="54" fill="#334155" font-size="11">• 镜像存入沙盒 Documents 目录</text>
      <text x="0" y="70" fill="#334155" font-size="11">• 镜像写入系统级 .erosion_factory_vault</text>
      <text x="0" y="88" fill="#059669" font-size="10" font-weight="600">isExcludedFromBackup 防云同步污染</text>
    </g>
  </g>

  <!-- Transition 1 -> 2 -->
  <g transform="translate(740, 195)">
    <line x1="0" y1="10" x2="70" y2="10" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald4)" />
    <text x="35" y="0" text-anchor="middle" fill="#059669" font-size="10">点击「应用修改」</text>
  </g>

  <!-- State 3: In-Place Modified State (Far Right) -->
  <g transform="translate(820, 140)">
    <rect width="260" height="130" rx="10" fill="url(#stateGrad4)" stroke="#8b5cf6" stroke-width="1.5" />
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#faf5ff" />
      <text x="8" y="14" fill="#6366f1" font-size="10" font-weight="700">STATE 2</text>
      <text x="70" y="15" fill="#f8fafc" font-size="13" font-weight="700">生产级持久生效态</text>
      <text x="0" y="38" fill="#334155" font-size="11">• 零 0 字节原位 pwrite 写入</text>
      <text x="0" y="54" fill="#334155" font-size="11">• 保留 Inode 与 POSIX 属主</text>
      <text x="0" y="70" fill="#334155" font-size="11">• 规范写入 RegulatoryModel</text>
      <text x="0" y="88" fill="#6366f1" font-size="10" font-weight="600">日常随意重启，100% 不反弹</text>
    </g>
  </g>

  <!-- Transition 2 -> 3 (Sideload Expiration) -->
  <g transform="translate(950, 270)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber4)" />
    <text x="12" y="65" fill="#d97706" font-size="10">7 天证书过期 / 卸载应用</text>
  </g>

  <!-- State 4: Sideload Revoked &amp; App Removed (Bottom Right) -->
  <g transform="translate(820, 400)">
    <rect width="260" height="130" rx="10" fill="url(#stateGrad4)" stroke="#d97706" stroke-width="1.5" />
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#78350f" />
      <text x="8" y="14" fill="#fcd34d" font-size="10" font-weight="700">STATE 3</text>
      <text x="70" y="15" fill="#d97706" font-size="13" font-weight="700">自签过期 / 应用卸载</text>
      <text x="0" y="38" fill="#334155" font-size="11">• 应用沙盒及原件被 iOS 抹除</text>
      <text x="0" y="54" fill="#334155" font-size="11">• 系统缓存修改继续常驻生效</text>
      <text x="0" y="70" fill="#059669" font-size="11">• 系统金库备份依然安全保留！</text>
      <text x="0" y="88" fill="#d97706" font-size="10" font-weight="600">无需每周续签常驻守护</text>
    </g>
  </g>

  <!-- Transition 3 -> 4 (Reinstall App) -->
  <g transform="translate(740, 455)">
    <line x1="80" y1="10" x2="10" y2="10" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue4)" />
    <text x="45" y="0" text-anchor="middle" fill="#93c5fd" font-size="10">重签或重新安装</text>
  </g>

  <!-- State 5: Vault Auto-Recovery (Bottom Center) -->
  <g transform="translate(420, 400)">
    <rect width="320" height="130" rx="10" fill="url(#stateGrad4)" stroke="#0ea5e9" stroke-width="1.5" />
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#075985" />
      <text x="8" y="14" fill="#0284c7" font-size="10" font-weight="700">STATE 4</text>
      <text x="70" y="15" fill="#0284c7" font-size="13" font-weight="700">系统金库重连与自愈 (Self-Healing)</text>
      <text x="0" y="38" fill="#334155" font-size="11">• 自动探测系统级隐藏金库 .erosion_*</text>
      <text x="0" y="54" fill="#334155" font-size="11">• 重新计算 SHA-256 并恢复沙盒文件</text>
      <text x="0" y="70" fill="#334155" font-size="11">• 彻底解决“重装后备份变成已改脏值”</text>
      <text x="0" y="88" fill="#0284c7" font-size="10" font-weight="600">跨生命周期 100% 留存最初原厂备份</text>
    </g>
  </g>

  <!-- Transition 4 -> 5 / Return to Pristine -->
  <g transform="translate(340, 455)">
    <line x1="80" y1="10" x2="10" y2="10" stroke="#e11d48" stroke-width="2" marker-end="url(#arrowCoral4)" />
    <text x="45" y="0" text-anchor="middle" fill="#e11d48" font-size="10">一键恢复出厂</text>
  </g>

  <!-- State 6: Full Lossless Recovery / Hardware Rebuild (Bottom Left) -->
  <g transform="translate(60, 400)">
    <rect width="280" height="130" rx="10" fill="url(#stateGrad4)" stroke="#e11d48" stroke-width="1.5" />
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#fff1f2" />
      <text x="8" y="14" fill="#e11d48" font-size="10" font-weight="700">STATE 5</text>
      <text x="70" y="15" fill="#e11d48" font-size="13" font-weight="700">出厂还原与硬件熔丝重建</text>
      <text x="0" y="38" fill="#334155" font-size="11">• 路径 A：原位刷回金库原厂备份</text>
      <text x="0" y="54" fill="#334155" font-size="11">• 路径 B：清除缓存，关机冷重启</text>
      <text x="0" y="70" fill="#059669" font-size="11">• 系统从硬件熔丝重建纯净文件</text>
      <text x="0" y="88" fill="#f8fafc" font-size="10" font-weight="700">100% 无痕过天才吧 AST2 官方检测</text>
    </g>
  </g>

  <!-- Direct Loop: State 5 -> State 0 -->
  <g transform="translate(200, 390)">
    <line x1="0" y1="10" x2="0" y2="-110" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald4)" />
    <text x="10" y="-50" fill="#059669" font-size="10">重启后回到出厂态</text>
  </g>

  <!-- Bottom Summary Note -->
  <g transform="translate(60, 560)">
    <rect width="1020" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <g transform="translate(16, 16)">
      <text x="0" y="16" fill="#0284c7" font-size="12" font-weight="700">【工程哲学：可逆性（Reversibility）高于一切】</text>
      <text x="0" y="38" fill="#334155" font-size="11">Erosion-CN 从架构设计之初就确立了“绝不修改主板 NVRAM / SysCfg 硬件熔丝”的红线原则。所有定制仅停留在系统共享组缓存层，</text>
      <text x="0" y="56" fill="#334155" font-size="11">通过双冗余安全金库 + SHA-256 指纹比对 + 硬件级缓存重建机制，赋予了用户随时 100% 无损变回全新国行原机前往官方售后送修的能力。</text>
    </g>
  </g>
</svg>
