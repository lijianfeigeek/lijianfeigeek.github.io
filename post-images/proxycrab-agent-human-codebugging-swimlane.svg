<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; fill: #64748b; }
      .lane-title { font-size: 13px; font-weight: 700; fill: #334155; }
      .node-title { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-size: 11px; fill: #475569; }
      .mono-tag { font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
      .flow-path { fill: none; }
    </style>
    <marker id="lane-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="lane-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="lane-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="lane-arrow-coral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- Canvas Container -->
  <rect x="10" y="10" width="900" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text class="title" x="0" y="18">人机协同调试时序泳道：RBAC 细粒度准入与 30 秒人机闭环</text>
    <text class="subtitle" x="0" y="36">展示 AI Agent 发起敏感操作时，管理网关权限裁决、桌面端人工审批与断点安全恢复的全链路交互</text>
  </g>

  <!-- Lane 1: AI Agent 泳道 (y=70, h=95) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="860" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="130" height="92" rx="6" fill="#f1f5f9" />
    <text class="lane-title" x="14" y="42">AI Agent 泳道</text>
    <text class="mono-tag" x="14" y="60" fill="#0284c7">Node.js 18+ Skill</text>

    <!-- Node 1.1 -->
    <g transform="translate(150, 16)">
      <rect x="0" y="0" width="180" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text class="node-title" x="10" y="18">1. 异常嗅探与断点触发</text>
      <text class="node-desc" x="10" y="34">log-query 查询 500 流量</text>
      <text class="node-desc" x="10" y="48">下发 breakpoint-control</text>
    </g>

    <!-- Node 1.2 -->
    <g transform="translate(480, 16)">
      <rect x="0" y="0" width="180" height="60" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
      <text class="node-title" x="10" y="18" fill="#e11d48">3. 发起拦截器变更高危写</text>
      <text class="node-desc" x="10" y="34" fill="#9f1239">尝试更新 session 拦截链</text>
      <text class="mono-tag" x="10" y="48" fill="#e11d48">PUT /api/session-interceptors</text>
    </g>

    <!-- Node 1.3 -->
    <g transform="translate(695, 16)">
      <rect x="0" y="0" width="150" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text class="node-title" x="10" y="18" fill="#15803d">5. 收到执行成功</text>
      <text class="node-desc" x="10" y="34">提取业务字段注入</text>
      <text class="node-desc" x="10" y="48">释放挂起请求</text>
    </g>
  </g>

  <!-- Lane 2: Management API & RBAC 网关 (y=175, h=105) -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="860" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="130" height="100" rx="6" fill="#f1f5f9" />
    <text class="lane-title" x="14" y="46">管理 API 泳道</text>
    <text class="mono-tag" x="14" y="66" fill="#475569">PORT: 18089</text>

    <!-- Node 2.1: Auth check -->
    <g transform="translate(150, 18)">
      <rect x="0" y="0" width="180" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text class="node-title" x="10" y="18">凭证鉴权与路由匹配</text>
      <text class="node-desc" x="10" y="34">LocalLoopback 或 Bearer</text>
      <text class="node-desc" x="10" y="48">加载 permissions.json 策略</text>
    </g>

    <!-- Node 2.2: Mode triage (Coral Accent) -->
    <g transform="translate(480, 18)">
      <rect x="0" y="0" width="180" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
      <text class="node-title" x="10" y="18" fill="#e11d48">权限裁决: Approval 模式</text>
      <text class="node-desc" x="10" y="34" fill="#9f1239">检测到高危写操作</text>
      <text class="node-desc" x="10" y="48" fill="#9f1239">向 Desktop 广播审批请求</text>
    </g>
  </g>

  <!-- Lane 3: Desktop 人工审批屏障 (y=290, h=110) -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="860" height="106" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="130" height="106" rx="6" fill="#f1f5f9" />
    <text class="lane-title" x="14" y="48">人机协作屏障</text>
    <text class="mono-tag" x="14" y="68" fill="#b91c1c">Human-in-the-loop</text>

    <!-- Node 3.1: Desktop Modal Prompt -->
    <g transform="translate(480, 18)">
      <rect x="0" y="0" width="180" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
      <text class="node-title" x="10" y="18" fill="#b91c1c">4. 桌面原生审批弹窗</text>
      <text class="node-desc" x="10" y="34" fill="#7f1d1d">展示变更代码 Diff / 路径</text>
      <text class="node-desc" x="10" y="48" fill="#7f1d1d">开发者倒计时 30s 确认</text>
      <text class="mono-tag" x="10" y="62" fill="#dc2626">超时自动安全熔断 (Deny)</text>
    </g>
  </g>

  <!-- Lane 4: 实时断点与流量执行上下文 (y=410, h=105) -->
  <g transform="translate(30, 410)">
    <rect x="0" y="0" width="860" height="102" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="0" y="0" width="130" height="102" rx="6" fill="#f1f5f9" />
    <text class="lane-title" x="14" y="48">底层执行环境</text>
    <text class="mono-tag" x="14" y="68" fill="#059669">Tokio + mlua</text>

    <!-- Node 4.1: Condvar Gate -->
    <g transform="translate(150, 18)">
      <rect x="0" y="0" width="220" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text class="node-title" x="10" y="18">2. Tokio Condvar 线程挂起</text>
      <text class="node-desc" x="10" y="34">在途网络流暂停推进，不占 CPU</text>
      <text class="mono-tag" x="10" y="52" fill="#0284c7">ActiveBreakpoint::wake</text>
    </g>

    <!-- Node 4.2: Modification Journal -->
    <g transform="translate(685, 18)">
      <rect x="0" y="0" width="160" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text class="node-title" x="10" y="18" fill="#15803d">变更不可逆审计落盘</text>
      <text class="node-desc" x="10" y="34">记录完整修改前/后快照</text>
      <text class="mono-tag" x="10" y="52" fill="#16a34a">ModificationJournal</text>
    </g>
  </g>

  <!-- Interactive Orthogonal Flow Connectors (Strictly fill="none" class="flow-path") -->
  <!-- 1.1 -> 2.1 (下发断点请求经网关) -->
  <path class="flow-path" d="M 270 146 L 270 193" stroke="#0284c7" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-blue)" />

  <!-- 2.1 -> 4.1 (网关放行，挂起底层连接) -->
  <path class="flow-path" d="M 270 257 L 270 428" stroke="#0284c7" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-blue)" />

  <!-- 4.1 -> 1.2 (通知 Agent，发起拦截器更新) -->
  <path class="flow-path" d="M 370 428 L 440 428 L 440 116 L 510 116" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow)" />

  <!-- 1.2 -> 2.2 (Agent 请求更新拦截链) -->
  <path class="flow-path" d="M 600 146 L 600 193" stroke="#e11d48" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-coral)" />

  <!-- 2.2 -> 3.1 (网关识别高危写，触发桌面审批) -->
  <path class="flow-path" d="M 600 257 L 600 308" stroke="#e11d48" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-coral)" />

  <!-- 3.1 -> 4.2 (人工点击批准 -> 落地审计并应用规则) -->
  <path class="flow-path" d="M 600 378 L 600 402 L 765 402 L 765 428" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-green)" />

  <!-- 4.2 -> 1.3 (返回 Agent 操作成功，请求恢复传输) -->
  <path class="flow-path" d="M 765 428 L 765 146" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#lane-arrow-green)" />
</svg>
