<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="400" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="macbrow-voice-execution-sequence-title macbrow-voice-execution-sequence-desc" id="macbrow-voice-execution-sequence-root">
      <title id="macbrow-voice-execution-sequence-title">macbrow 语音端到端超低延迟执行时序</title>
      <desc id="macbrow-voice-execution-sequence-desc">从用户口述指令、流式语音识别、TypeSafe Jev 意图解析到 macOS/Chrome 毫秒级执行的时序图</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #macbrow-voice-execution-sequence-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #macbrow-voice-execution-sequence-root text { font-family: "Geist", -apple-system, sans-serif; }
      #macbrow-voice-execution-sequence-root .mono { font-family: "Geist Mono", monospace; }
      #macbrow-voice-execution-sequence-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="macbrow-voice-execution-sequence-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="macbrow-voice-execution-sequence-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="macbrow-voice-execution-sequence-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Lifelines -->
        <g transform="translate(60, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">用户语音</text>
          <line x1="65" y1="36" x2="65" y2="350" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(250, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Gradium STT</text>
          <line x1="65" y1="36" x2="65" y2="350" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(440, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#bf4520" text-anchor="middle">JevRouter 路由中枢</text>
          <line x1="65" y1="36" x2="65" y2="350" stroke="#bf4520" stroke-dasharray="4 4" opacity="0.4"/>
        </g>

        <g transform="translate(630, 30)">
          <rect x="0" y="0" width="130" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="65" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">TypeSafe Jev</text>
          <line x1="65" y1="36" x2="65" y2="350" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(800, 30)">
          <rect x="0" y="0" width="120" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="60" y="22" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">macOS / Chrome</text>
          <line x1="60" y1="36" x2="60" y2="350" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <!-- Steps -->
        <!-- Step 1 -->
        <path d="M 125 90 L 315 90" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-voice-execution-sequence-arrow-default)"/>
        <g transform="translate(145, 74)">
          <text x="0" y="11" font-size="11" fill="#2d3142">1. 说话：“把音量调小一点”</text>
        </g>

        <!-- Step 2 -->
        <path d="M 315 135 L 505 135" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-voice-execution-sequence-arrow-accent)"/>
        <g transform="translate(330, 118)">
          <text x="0" y="11" font-size="11" font-weight="600" fill="#bf4520">2. 识别为文本 (延迟 85ms)</text>
        </g>

        <!-- Step 3 -->
        <path d="M 505 180 L 695 180" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-voice-execution-sequence-arrow-accent)"/>
        <g transform="translate(525, 163)">
          <text x="0" y="11" font-size="11" font-weight="600" fill="#bf4520">3. 匹配为 System 1 意图</text>
        </g>

        <!-- Step 4 -->
        <path d="M 695 225 L 860 225" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#macbrow-voice-execution-sequence-arrow-link)"/>
        <g transform="translate(710, 208)">
          <text x="0" y="11" font-size="11" font-weight="600" fill="#2e5aa8">4. 调取 set volume output</text>
        </g>

        <!-- Step 5 -->
        <path d="M 860 270 L 505 270" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-voice-execution-sequence-arrow-default)"/>
        <g transform="translate(560, 253)">
          <text x="0" y="11" fill="#2d3142">5. 原生执行成功 (耗时 12ms)</text>
        </g>

        <!-- Step 6 -->
        <path d="M 505 315 L 125 315" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-voice-execution-sequence-arrow-accent)"/>
        <g transform="translate(240, 298)">
          <text x="0" y="11" font-size="11" font-weight="600" fill="#bf4520">6. 端到端响应完成，声学提示音播报 (总耗时 ~280ms)</text>
        </g>
      </g>
    </svg>
