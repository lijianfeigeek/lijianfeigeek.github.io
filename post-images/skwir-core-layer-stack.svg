<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="532" viewBox="0 0 960 532" role="img" aria-labelledby="skwir-ls-title skwir-ls-desc" id="skwir-core-layer-stack-root">
  <title id="skwir-ls-title">Skwir 五层微内核与进程外隔离架构栈</title>
  <desc id="skwir-ls-desc">展示 Skwir 如何将 65.9 万行 Rust 代码拆分为五层边界清晰的架构：GPU 界面壳层、微内核状态与计划层、44 个内置与外部插件层、无网沙盒与分配器层、以及 16 个进程外工作进程与 Wasmtime 沙盒层。</desc>
  <defs>
    <style>
      #skwir-core-layer-stack-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="skwir-ls-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.24"/>
    </pattern>
    <marker id="skwir-ls-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="532" fill="#f8fafc"/>
  <rect width="960" height="532" fill="url(#skwir-ls-dots)"/>

  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Skwir Micro-Kernel &amp; Out-of-Process Isolation Stack</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">28 WORKSPACE CRATES · 44 BUILT-IN PLUGINS · 16 WORKER BINARIES · ZERO BLOCKING ON UI THREAD</text>

  <!-- Left vertical direction indicator -->
  <line x1="84" y1="88" x2="84" y2="444" stroke="#475569" stroke-width="1.4" marker-end="url(#skwir-ls-arrow)"/>
  <text x="72" y="256" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569">ISOLATION</text>
  <text x="72" y="270" text-anchor="end" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">UI TO WORKERS</text>

  <!-- L5: UI Shell -->
  <g transform="translate(132, 76)">
    <rect x="0" y="0" width="796" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="20" width="112" height="28" rx="4" fill="#f1f5f9"/>
    <text x="72" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L5 · UI SHELL</text>
    <text x="148" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">GPUI 渲染壳层与无障碍树（严禁阻塞与同步 I/O）</text>
    <text x="148" y="49" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">Vendored GPUI + Vulkan/wgpu · AccessKit AT-SPI · 布局测算全入 prepaint() · App::set_waker 按需唤醒</text>
    <rect x="644" y="22" width="136" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="712" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">crates/ui + vendor/zed</text>
  </g>

  <!-- L4: Core Kernel (Focal) -->
  <g transform="translate(132, 156)">
    <rect x="0" y="0" width="796" height="68" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="16" y="20" width="112" height="28" rx="4" fill="#bf4520"/>
    <text x="72" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#ffffff">L4 · MICRO-CORE</text>
    <text x="148" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">微内核契约层：双身份模型、可逆操作计划与全局隐私过滤</text>
    <text x="148" y="49" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">FileId (dev+ino) vs EntryId · Operation 逆操作 + Plan 干跑 · Exclusions 6,576 行隐私库 · preview::Held</text>
    <rect x="644" y="22" width="136" height="24" rx="4" fill="#fff7ed" stroke="#bf4520" stroke-width="0.8"/>
    <text x="712" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#bf4520">crates/core</text>
  </g>

  <!-- L3: Plugin Fabric -->
  <g transform="translate(132, 236)">
    <rect x="0" y="0" width="796" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="20" width="112" height="28" rx="4" fill="#f1f5f9"/>
    <text x="72" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L3 · PLUGINS</text>
    <text x="148" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">正交插件编织层（插件之间零直接依赖，全数支持运行时热启停）</text>
    <text x="148" y="49" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">44 个内置插件 (query/git/tags/control/remote…) + skwir-extend 外部扩展协议 (只提供数据，不绘 UI)</text>
    <rect x="644" y="22" width="136" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="712" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">plugins/* + extend</text>
  </g>

  <!-- L2: Platform & Sandbox -->
  <g transform="translate(132, 316)">
    <rect x="0" y="0" width="796" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="20" width="112" height="28" rx="4" fill="#f1f5f9"/>
    <text x="72" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L2 · SANDBOX</text>
    <text x="148" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">系统抽象、无网隔离沙盒与确定性内存管理层</text>
    <text x="148" y="49" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">bwrap (--unshare-all, 只读 /input) / sandbox-exec · mimalloc (.init_array.00099) · Vulkan ICD 裁剪</text>
    <rect x="644" y="22" width="136" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="712" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#1e293b">platform + alloc</text>
  </g>

  <!-- L1: Out-of-Process Workers -->
  <g transform="translate(132, 396)">
    <rect x="0" y="0" width="796" height="68" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="16" y="20" width="112" height="28" rx="4" fill="#e0f2fe"/>
    <text x="72" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#0369a1">L1 · WORKERS</text>
    <text x="148" y="29" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">16 个进程外专职 Worker 与 Wasmtime 双级插件沙盒（许可证与崩溃隔离）</text>
    <text x="148" y="49" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">GPL/AGPL/LGPL 隔离 (poppler/mupdf/djvulibre/heif/media) · module-worker (20B Fuel, 256MB 内存上限)</text>
    <rect x="644" y="22" width="136" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
    <text x="712" y="38" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#0369a1">crates/*-worker</text>
  </g>

  <!-- Bottom Legend -->
  <line x1="32" y1="484" x2="928" y2="484" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 504)">
    <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="76" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="98" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">微内核焦点层：所有插件共享的最小公共语言（命令、计划、双身份与隐私门禁）</text>
    <rect x="572" y="-8" width="14" height="14" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="594" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0369a1">进程外隔离：防止 GPL/AGPL 传染 Apache-2.0 主体，隔离解析器崩溃</text>
  </g>
</svg>
