<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="492" viewBox="0 0 920 492" role="img" aria-labelledby="vxrs-title vxrs-desc" id="vane-xhs-redpacket-swimlane-root">
  <title id="vxrs-title">Preview-First 预览闸门与确定性后处理跨主体协作泳道图</title>
  <desc id="vxrs-desc">展示 vane-xhs-design、vane-pet-new-year-portrait 与 wechat-red-packet-cover 共用的三泳道工作流：用户在预览确认闸门放行前拦截批量生图，AI 生图引擎通过双参考注入逐张重绘而非裁切预览，本地 Python 脚本负责精确 3:4 画布与 500KB JPEG 质量搜索。</desc>
  <defs>
    <style>
      #vane-xhs-redpacket-swimlane-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="vxrs-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.26"/>
    </pattern>
    <marker id="vxrs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="vxrs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="vxrs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="920" height="492" fill="#f8fafc"/>
  <rect width="920" height="492" fill="url(#vxrs-dots)"/>

  <!-- Header -->
  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">Preview-First Gate &amp; Deterministic Export Swimlane</text>
  <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">USER CONFIRMATION GATE · DUAL-REF IMAGE GEN (NO CROPPED UPSCALING) · LOCAL PILLOW VALIDATION</text>

  <!-- Swimlane bands (3 horizontal lanes, y=72..424) -->
  <g transform="translate(24, 72)">
    <!-- Lane 1: USER -->
    <rect x="0" y="0" width="872" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="48" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#475569">LANE 1</text>
    <text x="16" y="64" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">用户决策</text>
    <line x1="112" y1="12" x2="112" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Lane 2: AI AGENT + IMAGE GEN -->
    <rect x="0" y="116" width="872" height="128" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="172" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#475569">LANE 2</text>
    <text x="16" y="188" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Agent / 生图</text>
    <line x1="112" y1="128" x2="112" y2="232" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Lane 3: LOCAL PYTHON TOOLS -->
    <rect x="0" y="256" width="872" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="302" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#475569">LANE 3</text>
    <text x="16" y="318" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">本地脚本</text>
    <line x1="112" y1="268" x2="112" y2="348" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Orthogonal Connectors (drawn BEFORE node boxes) -->
    <!-- 1. U1 (x=196, y=80) -> A1 (x=196, y=144) -->
    <path d="M 196 80 L 196 144" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#vxrs-arrow)"/>

    <!-- 2. A1 (x=264, y=180) -> A2 (x=320, y=180) -->
    <path d="M 264 180 L 320 180" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#vxrs-arrow)"/>

    <!-- 3. A2 (x=392, y=216) -> L1 (x=392, y=276) -->
    <path d="M 392 216 L 392 276" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#vxrs-arrow-link)"/>
    <rect x="348" y="236" width="88" height="16" rx="2" fill="#f8fafc"/>
    <text x="392" y="247" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#2e5aa8">OPTIONAL CHECK</text>

    <!-- 4. A2 (x=428, y=144) -> U2 Gate (x=428, y=80) via elbow to x=536 -->
    <path d="M 428 144 L 428 112 Q 428 104 436 104 L 528 104 Q 536 104 536 96 L 536 80" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#vxrs-arrow-accent)"/>
    <rect x="444" y="96" width="84" height="16" rx="2" fill="#f8fafc"/>
    <text x="486" y="107" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">PREVIEW GATE</text>

    <!-- 5. U2 (x=576, y=80) -> A3 (x=576, y=144) -->
    <path d="M 576 80 L 576 144" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#vxrs-arrow-accent)"/>

    <!-- 6. A3 (x=664, y=180) -> L2 (x=688, y=180 -> down to y=308 -> right to x=700) -->
    <path d="M 664 180 L 680 180 Q 688 180 688 188 L 688 300 Q 688 308 696 308 L 700 308" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#vxrs-arrow-link)"/>

    <!-- 7. L2 (x=780, y=276) -> U3 (x=780, y=80) -->
    <path d="M 780 276 L 780 80" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#vxrs-arrow)"/>
    <rect x="734" y="168" width="92" height="16" rx="2" fill="#ffffff"/>
    <text x="780" y="179" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">FINAL DELIVER</text>

    <!-- Node U1 -->
    <g transform="translate(128, 20)">
      <rect x="0" y="0" width="136" height="60" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">1. 提交素材与文案</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">原图 + 风格 + 配图模式</text>
    </g>

    <!-- Node U2 (Focal Gate) -->
    <g transform="translate(496, 20)">
      <rect x="0" y="0" width="160" height="60" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">4. 逐页文字与构图确认</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">未放行绝不批量出单图</text>
    </g>

    <!-- Node U3 -->
    <g transform="translate(700, 20)">
      <rect x="0" y="0" width="156" height="60" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">7. 验收成品与尺寸报告</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">9 张 PNG / 500KB JPG</text>
    </g>

    <!-- Node A1 -->
    <g transform="translate(128, 144)">
      <rect x="0" y="0" width="136" height="72" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">2. 拆稿与约束锁定</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">提取主体/文字/数字</text>
      <text x="12" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">严禁脑补未见事实</text>
    </g>

    <!-- Node A2 -->
    <g transform="translate(320, 144)">
      <rect x="0" y="0" width="144" height="72" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">3. 双参考生成预览</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">彩色基准 + 灰度骨架</text>
      <text x="12" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">产出 3x3 九宫格预览</text>
    </g>

    <!-- Node A3 (Focal) -->
    <g transform="translate(496, 144)">
      <rect x="0" y="0" width="168" height="72" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">5. 按格逐张独立重绘</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">原图 + 预览 + 骨架三输入</text>
      <text x="12" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#bf4520">严禁将九宫格切片放大</text>
    </g>

    <!-- Node L1 -->
    <g transform="translate(300, 276)">
      <rect x="0" y="0" width="184" height="64" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2e5aa8">预览比例校准 / 模拟叠层</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">fit_white_canvas / cover preview</text>
    </g>

    <!-- Node L2 -->
    <g transform="translate(700, 276)">
      <rect x="0" y="0" width="156" height="64" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="12" y="24" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2e5aa8">6. 确定性尺寸压缩交付</text>
      <text x="12" y="42" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">Q95→20 搜 &lt;=500KB JPG</text>
    </g>
  </g>

  <!-- Legend -->
  <line x1="24" y1="448" x2="896" y2="448" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(24, 468)">
    <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="72" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="94" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">人工确认闸门与独立重绘防线（杜绝越权批量烧图与低清裁片）</text>
    <rect x="468" y="-8" width="14" height="14" rx="2" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1.2"/>
    <text x="490" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#2e5aa8">本地 Python / Pillow 确定性处理脚本</text>
    <rect x="728" y="-8" width="14" height="14" rx="2" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
    <text x="750" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">常规步骤</text>
  </g>
</svg>
