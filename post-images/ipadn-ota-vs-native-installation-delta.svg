<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-labelledby="delta-title delta-desc" data-diagram="architecture-delta" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif;">
  <title id="delta-title">iPadn 安装通道架构演化：传统 OTA 分发 vs 端侧 Lockdownd 原生通道</title>
  <desc id="delta-desc">对比传统 itms-services 清单分发与 iPadn 基于 LocalDevVPN、RPPairing 与 Rust idevice installation_proxy 原生通道的拓扑差异与变更清册。</desc>
  <defs>
    <pattern id="dotGridDelta" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="arrowMutedDelta" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowGreenDelta" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="arrowAccentDelta" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas & Subtle Grid -->
  <rect width="1100" height="580" fill="#ffffff"/>
  <rect x="16" y="16" width="1068" height="548" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="16" width="1068" height="548" rx="8" fill="url(#dotGridDelta)"/>

  <!-- Header -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="152" height="20" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="76" y="14" text-anchor="middle" fill="#e11d48" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace" letter-spacing="1">ARCHITECTURE DELTA</text>
    <text x="0" y="44" fill="#0f172a" font-size="20" font-weight="700">iOS 安装通道拓扑演进：OTA 网页分发 vs 端侧 Lockdownd 原生通道</text>
    <text x="0" y="64" fill="#475569" font-size="12">剖析 itms-services 导致 App Store 断联与 ASDErrorDomain 855 的根因，以及原生通道如何保留正版身份</text>
  </g>

  <!-- BEFORE SNAPSHOT -->
  <g data-snapshot="before" data-grid="336 392 4" transform="translate(40, 128)">
    <rect x="0" y="0" width="336" height="392" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="336" height="36" rx="8" fill="#f1f5f9"/>
    <line x1="0" y1="36" x2="336" y2="36" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="23" fill="#0f172a" font-size="12" font-weight="700">BEFORE · 传统 OTA 清单模式</text>
    <text x="320" y="22" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">itms-services://</text>

    <!-- Relationships drawn before boxes -->
    <path data-kind="relationship" data-object-id="rel-pkg-ota" data-status="removed" data-signature="route=http-range" data-from="pkg" data-to="ota-link"
          d="M 168 112 L 168 144" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowMutedDelta)"/>
    <path data-kind="relationship" data-object-id="rel-ota-installd" data-status="rewired" data-signature="proto=itms-services" data-from="ota-link" data-to="installd"
          d="M 168 208 L 168 240" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowAccentDelta)"/>
    <path data-kind="relationship" data-object-id="rel-installd-store" data-status="changed" data-signature="record=enterpriseInstallURL" data-from="installd" data-to="appstore"
          d="M 168 304 L 168 328" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrowAccentDelta)"/>

    <!-- Component 1: pkg (unchanged) -->
    <g data-kind="component" data-object-id="pkg" data-status="unchanged" data-signature="ipa=sinf+metadata" transform="translate(24, 52)">
      <rect data-role="bounds" x="0" y="0" width="288" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">IPA 授权包体 (PackageService)</text>
      <text x="14" y="42" fill="#475569" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">iTunesMetadata.plist + SC_Info/*.sinf</text>
    </g>

    <!-- Component 2: ota-link (removed) -->
    <g data-kind="component" data-object-id="ota-link" data-status="removed" data-signature="host=localtest.me:https" transform="translate(24, 144)">
      <rect data-role="bounds" x="0" y="0" width="288" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>
      <rect x="218" y="8" width="58" height="16" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="247" y="19" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">REMOVED</text>
      <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">Manifest 回环服务</text>
      <text x="14" y="42" fill="#475569" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">LoopbackServer TLS (ipadn.localtest.me)</text>
    </g>

    <!-- Component 3: installd (changed) -->
    <g data-kind="component" data-object-id="installd" data-status="changed" data-signature="mode=enterprise-adhoc" transform="translate(24, 240)">
      <rect data-role="bounds" x="0" y="0" width="288" height="64" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
      <rect x="218" y="8" width="58" height="16" rx="3" fill="#ffffff" stroke="#fda4af" stroke-width="0.8"/>
      <text x="247" y="19" text-anchor="middle" fill="#e11d48" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">CHANGED</text>
      <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">系统守护进程 installd</text>
      <text x="14" y="42" fill="#be123c" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">强制归类企业分发 · 注入 enterpriseInstallURL</text>
    </g>

    <!-- Component 4: appstore (changed) -->
    <g data-kind="component" data-object-id="appstore" data-status="changed" data-signature="status=unrecognised-855" transform="translate(24, 328)">
      <rect data-role="bounds" x="0" y="0" width="288" height="52" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
      <text x="14" y="22" fill="#9f1239" font-size="12" font-weight="600">商店断联 · 覆盖报错 ASDErrorDomain 855</text>
      <text x="14" y="38" fill="#be123c" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">丢弃 itemId · 丢失「卸载 App」保留数据能力</text>
    </g>
  </g>

  <!-- CENTER CHANGES LEDGER -->
  <g transform="translate(396, 128)">
    <rect x="0" y="0" width="308" height="392" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="308" height="36" rx="8" fill="#f8fafc"/>
    <line x1="0" y1="36" x2="308" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="23" fill="#0f172a" font-size="12" font-weight="700">CHANGES LEDGER · 架构变更清册</text>

    <g transform="translate(16, 54)">
      <text data-change="REMOVED" data-target="ota-link" x="0" y="14" fill="#334155" font-size="11" font-weight="600">
        <tspan fill="#64748b" font-family="'SF Mono', ui-monospace, Menlo, monospace">REMOVED </tspan>
        <tspan>ota-link</tspan>
        <tspan x="0" dy="16" fill="#475569" font-size="10" font-weight="400">不再经 Safari 唤起 itms-services 清单下载</tspan>
      </text>

      <line x1="0" y1="44" x2="276" y2="44" stroke="#f1f5f9" stroke-width="1"/>

      <text data-change="ADDED" data-target="vpn-tun" x="0" y="64" fill="#334155" font-size="11" font-weight="600">
        <tspan fill="#059669" font-family="'SF Mono', ui-monospace, Menlo, monospace">ADDED </tspan>
        <tspan>vpn-tun (NativeInstaller)</tspan>
        <tspan x="0" dy="16" fill="#475569" font-size="10" font-weight="400">LocalDevVPN 10.7.0.1 隧道 + RPPairing 握手</tspan>
      </text>

      <line x1="0" y1="94" x2="276" y2="94" stroke="#f1f5f9" stroke-width="1"/>

      <text data-change="REWIRED" data-target="rel-ota-installd" x="0" y="114" fill="#334155" font-size="11" font-weight="600">
        <tspan fill="#0284c7" font-family="'SF Mono', ui-monospace, Menlo, monospace">REWIRED </tspan>
        <tspan>delivery-channel</tspan>
        <tspan x="0" dy="16" fill="#475569" font-size="10" font-weight="400">HTTP 清单拉取 → AFC 分块写入 + RSD Proxy</tspan>
      </text>

      <line x1="0" y1="144" x2="276" y2="144" stroke="#f1f5f9" stroke-width="1"/>

      <text data-change="CHANGED" data-target="installd" x="0" y="164" fill="#334155" font-size="11" font-weight="600">
        <tspan fill="#e11d48" font-family="'SF Mono', ui-monospace, Menlo, monospace">CHANGED </tspan>
        <tspan>installd</tspan>
        <tspan x="0" dy="16" fill="#475569" font-size="10" font-weight="400">企业分发路径 → USB 等价 Install / Upgrade</tspan>
      </text>

      <line x1="0" y1="194" x2="276" y2="194" stroke="#f1f5f9" stroke-width="1"/>

      <text data-change="CHANGED" data-target="appstore" x="0" y="214" fill="#334155" font-size="11" font-weight="600">
        <tspan fill="#059669" font-family="'SF Mono', ui-monospace, Menlo, monospace">CHANGED </tspan>
        <tspan>appstore</tspan>
        <tspan x="0" dy="16" fill="#475569" font-size="10" font-weight="400">ASD 855 阻断 → 无损原地降级 + 保留购买凭证</tspan>
      </text>

      <line x1="0" y1="244" x2="276" y2="244" stroke="#f1f5f9" stroke-width="1"/>

      <rect x="0" y="258" width="276" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="278" fill="#0f172a" font-size="11" font-weight="600">关键特性：阻止商店更新标记</text>
      <text x="12" y="295" fill="#475569" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">softwareVersionExternalIdentifier</text>
      <text x="12" y="309" fill="#0284c7" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">= 2_000_000_000 (blockedVersionID)</text>
    </g>
  </g>

  <!-- AFTER SNAPSHOT -->
  <g data-snapshot="after" data-grid="336 392 4" transform="translate(724, 128)">
    <rect x="0" y="0" width="336" height="392" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <rect x="0" y="0" width="336" height="36" rx="8" fill="#ecfdf5"/>
    <line x1="0" y1="36" x2="336" y2="36" stroke="#a7f3d0" stroke-width="1"/>
    <text x="16" y="23" fill="#065f46" font-size="12" font-weight="700">AFTER · 端侧 Lockdownd 原生模式</text>
    <text x="320" y="22" text-anchor="end" fill="#059669" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">RemoteXPC / RSD</text>

    <!-- Relationships drawn before boxes -->
    <path data-kind="relationship" data-object-id="rel-pkg-vpn" data-status="added" data-signature="proto=afc-1mb-chunk" data-from="pkg" data-to="vpn-tun"
          d="M 168 112 L 168 144" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreenDelta)"/>
    <path data-kind="relationship" data-object-id="rel-vpn-installd" data-status="rewired" data-signature="proto=installation_proxy" data-from="vpn-tun" data-to="installd"
          d="M 168 208 L 168 240" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreenDelta)"/>
    <path data-kind="relationship" data-object-id="rel-installd-store-after" data-status="changed" data-signature="record=apple-purchase-info" data-from="installd" data-to="appstore"
          d="M 168 304 L 168 328" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreenDelta)"/>

    <!-- Component 1: pkg (unchanged) -->
    <g data-kind="component" data-object-id="pkg" data-status="unchanged" data-signature="ipa=sinf+metadata" transform="translate(24, 52)">
      <rect data-role="bounds" x="0" y="0" width="288" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">IPA 授权包体 (PackageService)</text>
      <text x="14" y="42" fill="#475569" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">iTunesMetadata.plist + SC_Info/*.sinf</text>
    </g>

    <!-- Component 2: vpn-tun (added) -->
    <g data-kind="component" data-object-id="vpn-tun" data-status="added" data-signature="engine=rust-idevice-0.1.68" transform="translate(24, 144)">
      <rect data-role="bounds" x="0" y="0" width="288" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <rect x="232" y="8" width="44" height="16" rx="3" fill="#ffffff" stroke="#6ee7b7" stroke-width="0.8"/>
      <text x="254" y="19" text-anchor="middle" fill="#059669" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">ADDED</text>
      <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">Rust idevice + LocalDevVPN</text>
      <text x="14" y="42" fill="#065f46" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">10.7.0.1 TLS-PSK 隧道 → AFC PublicStaging</text>
    </g>

    <!-- Component 3: installd (changed) -->
    <g data-kind="component" data-object-id="installd" data-status="changed" data-signature="mode=native-upgrade" transform="translate(24, 240)">
      <rect data-role="bounds" x="0" y="0" width="288" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="218" y="8" width="58" height="16" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="247" y="19" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">CHANGED</text>
      <text x="14" y="24" fill="#0f172a" font-size="13" font-weight="600">installation_proxy → installd</text>
      <text x="14" y="42" fill="#0369a1" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">执行 Install / Upgrade · 等效电脑 USB 刷机</text>
    </g>

    <!-- Component 4: appstore (changed) -->
    <g data-kind="component" data-object-id="appstore" data-status="changed" data-signature="status=recognised-inplace" transform="translate(24, 328)">
      <rect data-role="bounds" x="0" y="0" width="288" height="52" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="14" y="22" fill="#065f46" font-size="12" font-weight="600">✓ 完整保留苹果正版 · 支持原地覆盖降级</text>
      <text x="14" y="38" fill="#047857" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">保留沙盒文档 · 恢复「卸载 App」与商店更新</text>
    </g>
  </g>

  <!-- Bottom Legend Strip -->
  <g transform="translate(40, 536)">
    <rect x="0" y="4" width="12" height="12" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="18" y="14" fill="#475569" font-size="11">未变更组件 (Unchanged)</text>
    <rect x="172" y="4" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="190" y="14" fill="#475569" font-size="11">已移除 (Removed)</text>
    <rect x="320" y="4" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="338" y="14" fill="#065f46" font-size="11">新增原生通道 (Added)</text>
    <rect x="496" y="4" width="12" height="12" rx="2" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
    <text x="514" y="14" fill="#e11d48" font-size="11">核心状态变更焦点 (Focal Change)</text>
    <text x="1020" y="14" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">SOURCE: iPadn v2.1.1 (NativeInstaller.swift / lib.rs)</text>
  </g>
</svg>
