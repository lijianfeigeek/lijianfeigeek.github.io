<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="deltaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Canvas Border -->
  <rect width="1100" height="620" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="572" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#334155" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE DELTA</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">iOS 端侧安装通道深层剖析：OTA 清单分发 vs Lockdownd 原生通道</text>
    <text x="0" y="74" fill="#475569" font-size="13">揭秘为何传统网页一键安装无法保留 App Store 正版身份，以及端侧 USB 代理如何打破底层枷锁</text>
  </g>

  <!-- Left Column: OTA Web Manifest Installation (The Flawed Baseline) -->
  <g transform="translate(60, 150)">
    <rect width="470" height="414" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Column Title -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="90" height="22" rx="4" fill="#fff1f2" />
      <text x="12" y="15" fill="#fecaca" font-size="10" font-weight="700">LEGACY OTA</text>
      <text x="102" y="17" fill="#f8fafc" font-size="15" font-weight="700">传统 OTA 网页清单安装通道</text>
      <text x="0" y="38" fill="#475569" font-size="11">协议：itms-services://?action=download-manifest</text>
    </g>

    <!-- Flow Pipeline Card -->
    <g transform="translate(20, 72)">
      <rect width="430" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="20" fill="#334155" font-size="11" font-weight="600">调用链路与系统执行行为：</text>
      <g transform="translate(14, 32)">
        <text x="0" y="14" fill="#334155" font-size="11">iPadn 伪造 Localhost 清单 ➔ 打开 Safari 调起 itms-services</text>
        <text x="0" y="32" fill="#334155" font-size="11">➔ iOS installd 将其识别为外部企业分发 (Enterprise Ad-hoc)</text>
        <text x="0" y="50" fill="#e11d48" font-size="11">➔ 强制注入 enterpriseInstallURL，丢弃包内真实元数据！</text>
      </g>
    </g>

    <!-- Consequences Grid -->
    <g transform="translate(20, 170)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="430" height="48" rx="6" fill="#f8fafc" stroke="#372630" stroke-width="1" />
        <text x="14" y="20" fill="#fca5a5" font-size="12" font-weight="600">× App Store 认不出：呈现未下载云朵</text>
        <text x="14" y="36" fill="#475569" font-size="10">缺少 storeItemID 与账号授权记录，应用商店无法提供官方后续更新</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 56)">
        <rect width="430" height="48" rx="6" fill="#f8fafc" stroke="#372630" stroke-width="1" />
        <text x="14" y="20" fill="#fca5a5" font-size="12" font-weight="600">× 系统储存空间残缺：隐藏「卸载 App」按钮</text>
        <text x="14" y="36" fill="#475569" font-size="10">只能选择「删除 App」破坏沙盒数据，无法卸载主包保留用户配置</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 112)">
        <rect width="430" height="48" rx="6" fill="#f8fafc" stroke="#372630" stroke-width="1" />
        <text x="14" y="20" fill="#fca5a5" font-size="12" font-weight="600">× 爱思助手/第三方工具判定为「共享正版」</text>
        <text x="14" y="36" fill="#475569" font-size="10">因系统安装数据库缺少 Apple ID 与 DSPersonID 真实签名映射</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 168)">
        <rect width="430" height="48" rx="6" fill="#fff1f2" stroke="#7f1d1d" stroke-width="1" />
        <text x="14" y="20" fill="#ef4444" font-size="12" font-weight="700">× 覆盖安装直接崩溃 (ASDErrorDomain 855)</text>
        <text x="14" y="36" fill="#fca5a5" font-size="10">若当前已装有该 App，系统拒绝网页覆盖并报错 "Must uninstall existing app"</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Lockdownd Native Installation (The Breakthrough) -->
  <g transform="translate(570, 150)">
    <rect width="470" height="414" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="1.5" />

    <!-- Column Title -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="105" height="22" rx="4" fill="#f0fdf4" />
      <text x="12" y="15" fill="#a7f3d0" font-size="10" font-weight="700">NATIVE ENGINE</text>
      <text x="117" y="17" fill="#f8fafc" font-size="15" font-weight="700">iPadn 端侧 Lockdownd 原生通道</text>
      <text x="0" y="38" fill="#059669" font-size="11">协议：RemoteXPC / com.apple.mobile.installation.proxy</text>
    </g>

    <!-- Flow Pipeline Card -->
    <g transform="translate(20, 72)">
      <rect width="430" height="84" rx="8" fill="#f0f9ff" stroke="#234e52" stroke-width="1" />
      <text x="14" y="20" fill="#059669" font-size="11" font-weight="600">调用链路与系统执行行为：</text>
      <g transform="translate(14, 32)">
        <text x="0" y="14" fill="#e2e8f0" font-size="11">iPadn Rust 引擎 ➔ LocalDevVPN (10.7.0.1 绕过沙盒回环封锁)</text>
        <text x="0" y="32" fill="#e2e8f0" font-size="11">➔ RPPairing TLS-PSK 握手 ➔ RSD 协议发现 ➔ AFC 分块写入暂存</text>
        <text x="0" y="50" fill="#059669" font-size="11">➔ installation_proxy 执行 Install/Upgrade，完全等同电脑 USB 刷机！</text>
      </g>
    </g>

    <!-- Benefits Grid -->
    <g transform="translate(20, 170)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="430" height="48" rx="6" fill="#f0fdf4" stroke="#1f4e48" stroke-width="1" />
        <text x="14" y="20" fill="#059669" font-size="12" font-weight="600">✓ 完美识别官方正版：App Store 显示「打开/更新」</text>
        <text x="14" y="36" fill="#334155" font-size="10">保留真实 iTunesMetadata 与 SINF，系统将它视为 App Store 亲生应用</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 56)">
        <rect width="430" height="48" rx="6" fill="#f0fdf4" stroke="#1f4e48" stroke-width="1" />
        <text x="14" y="20" fill="#059669" font-size="12" font-weight="600">✓ 完整系统级能力：完美显示「卸载 App」选项</text>
        <text x="14" y="36" fill="#334155" font-size="10">支持在 iPhone 储存空间自由卸载临时主程序并无缝重装还原配置</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 112)">
        <rect width="430" height="48" rx="6" fill="#f0fdf4" stroke="#1f4e48" stroke-width="1" />
        <text x="14" y="20" fill="#059669" font-size="12" font-weight="600">✓ 爱思助手实测显示「苹果正版（完整个人 Apple ID）」</text>
        <text x="14" y="36" fill="#334155" font-size="10">个人账号所有权得到 iOS 与外部工具双重公认，绝非盗版企业签名</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 168)">
        <rect width="430" height="48" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1" />
        <text x="14" y="20" fill="#059669" font-size="12" font-weight="700">✓ 无损就地覆盖升级/降级：100% 保留应用沙盒数据</text>
        <text x="14" y="36" fill="#a7f3d0" font-size="10">无视现有 App 状态直接覆盖写入，聊天记录、游戏存档与登录态完好无损</text>
      </g>
    </g>
  </g>
</svg>
