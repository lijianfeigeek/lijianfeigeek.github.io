<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-liquid-glass-ui-transition-sequence-title apple-ternus-liquid-glass-ui-transition-sequence-desc">
  <title id="apple-ternus-liquid-glass-ui-transition-sequence-title">液态玻璃（Liquid Glass）打破双屏割裂视口展开时序图</title>
  <desc id="apple-ternus-liquid-glass-ui-transition-sequence-desc">展示单手掀开铰链从 0° 至 180° 期间，外屏渐变高斯折射模糊与内屏中轴反向清晰重构的毫秒级视觉连续性机制</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="seq-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Participants -->
  <g transform="translate(60, 24)">
    <!-- P1: User -->
    <g transform="translate(0, 0)">
      <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="24" text-anchor="middle" class="label-title">👤 用户掀开动作</text>
      <text x="85" y="38" text-anchor="middle" class="label-sub">单手掀开铰链</text>
      <line x1="85" y1="46" x2="85" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P2: Outer Screen -->
    <g transform="translate(220, 0)">
      <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="24" text-anchor="middle" class="label-title">📱 5.4寸外屏图层</text>
      <text x="85" y="38" text-anchor="middle" class="label-sub">Outer Display</text>
      <line x1="85" y1="46" x2="85" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P3: Liquid Glass Pipeline (Focal) -->
    <g transform="translate(440, 0)">
      <rect width="190" height="46" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #9a3412;">✨ Liquid Glass</text>
      <text x="95" y="38" text-anchor="middle" class="tag-coral">iOS 连续性渲染管线</text>
      <line x1="95" y1="46" x2="95" y2="300" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>

    <!-- P4: Inner Screen -->
    <g transform="translate(670, 0)">
      <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="24" text-anchor="middle" class="label-title">📖 7.6寸内屏图层</text>
      <text x="85" y="38" text-anchor="middle" class="label-sub">Inner Canvas</text>
      <line x1="85" y1="46" x2="85" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
  </g>

  <!-- Lifeline coordinate X:
       User: 145
       Outer: 365
       Pipeline: 595
       Inner: 815
  -->

  <!-- Step 1: Angle 0 to 90 -->
  <g transform="translate(70, 95)">
    <path d="M 75 20 L 287 20" stroke="#64748b" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <rect x="85" y="8" width="195" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="182" y="23" text-anchor="middle" class="text-code">1. 铰链开始转动 (0° ➔ 90°)</text>
  </g>

  <!-- Step 2: Outer to Pipeline -->
  <g transform="translate(70, 145)">
    <path d="M 295 20 L 517 20" stroke="#64748b" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <rect x="305" y="8" width="205" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="407" y="23" text-anchor="middle" class="text-code">2. 触发视口连续性渐进高斯模糊</text>
  </g>

  <!-- Step 3: Pipeline to Inner -->
  <g transform="translate(70, 195)">
    <path d="M 525 20 L 737 20" stroke="#bf4520" stroke-width="1.5" marker-end="url(#seq-coral)"/>
    <rect x="535" y="8" width="195" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="632" y="23" text-anchor="middle" class="tag-coral">3. 内屏从中轴线由虚反向变实</text>
  </g>

  <!-- Step 4: 180 Locked and Note -->
  <g transform="translate(70, 245)">
    <path d="M 75 20 L 737 20" stroke="#059669" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
    <rect x="330" y="8" width="160" height="22" rx="4" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="410" y="23" text-anchor="middle" class="text-code" fill="#059669">4. 屏幕展开锁定 (180°)</text>
  </g>

  <!-- Result Banner at bottom -->
  <g transform="translate(145, 290)">
    <rect width="670" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="335" y="26" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #334155;">
      💡 原外屏内容毫秒级恒定驻留右手侧半屏 · 心理认知融为“同一块悬浮折叠玻璃”
    </text>
  </g>
</svg>