<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="jev-cot-avalanche-title jev-cot-avalanche-desc">
  <title id="jev-cot-avalanche-title">传统截图式 Computer Use 的时延雪崩与成本黑洞</title>
  <desc id="jev-cot-avalanche-desc">展示传统多模态自回归大模型在截屏循环中单步耗时3~8秒、昂贵Token开销与请老教授扫雷的认知错配问题</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .actor-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-actor { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .actor-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .focal-actor-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .focal-msg-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
      .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
      .focal-msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #bf4520; }
      .badge { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .focal-badge { fill: rgba(191, 69, 32, 0.1); stroke: #bf4520; stroke-width: 1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .focal-badge-text { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; text-anchor: middle; }
      .loop-box { fill: rgba(254, 242, 242, 0.5); stroke: #fca5a5; stroke-width: 1; stroke-dasharray: 6 3; }
      .note-card { fill: #ffffff; stroke: #fecaca; stroke-width: 1; rx: 6; }
    </style>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow1-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Actors -->
  <!-- Actor 1: User (x=100) -->
  <g transform="translate(30, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">用户目标</text>
  </g>
  <line x1="100" y1="64" x2="100" y2="430" class="lifeline" />

  <!-- Actor 2: Screen (x=300) -->
  <g transform="translate(230, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">桌面 / 浏览器</text>
  </g>
  <line x1="300" y1="64" x2="300" y2="430" class="lifeline" />

  <!-- Actor 3: Vision (x=500) -->
  <g transform="translate(430, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">视觉编码分块</text>
  </g>
  <line x1="500" y1="64" x2="500" y2="430" class="lifeline" />

  <!-- Actor 4: General LLM (x=700) - Focal -->
  <g transform="translate(620, 24)">
    <rect width="160" height="40" rx="6" class="focal-actor" />
    <text x="80" y="25" class="focal-actor-text">通用大模型 (System 2)</text>
  </g>
  <line x1="700" y1="64" x2="700" y2="430" class="lifeline" />

  <!-- Actor 5: Driver (x=880) -->
  <g transform="translate(810, 24)">
    <rect width="140" height="40" rx="6" class="actor-card" />
    <text x="70" y="25" class="actor-text">键鼠物理驱动</text>
  </g>
  <line x1="880" y1="64" x2="880" y2="430" class="lifeline" />

  <!-- Step 0: User invokes -->
  <g transform="translate(0, 80)">
    <line x1="100" y1="0" x2="292" y2="0" class="msg-line" marker-end="url(#arrow1)" />
    <text x="115" y="-6" class="msg-text">发起指令："帮我查周五去旧金山的航班"</text>
  </g>

  <!-- Loop Container (y=105, h=250) -->
  <rect x="210" y="105" width="700" height="245" rx="8" class="loop-box" />
  <text x="225" y="125" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">循环陷阱：单步点击耗时 3~8 秒 · 任务需重复 30~50 轮</text>

  <!-- Step 1: Screen -> Vision -->
  <g transform="translate(0, 145)">
    <circle cx="315" cy="0" r="10" class="badge" />
    <text x="315" y="4" class="badge-text">1</text>
    <line x1="300" y1="0" x2="492" y2="0" class="msg-line" marker-end="url(#arrow1)" />
    <text x="335" y="-6" class="msg-text">全屏高分辨率截屏 (1080P/4K 无损抓取)</text>
  </g>

  <!-- Step 2: Vision -> LLM -->
  <g transform="translate(0, 190)">
    <circle cx="515" cy="0" r="10" class="focal-badge" />
    <text x="515" y="4" class="focal-badge-text">2</text>
    <line x1="500" y1="0" x2="692" y2="0" class="focal-msg-line" marker-end="url(#arrow1-focal)" />
    <text x="530" y="-6" class="focal-msg-text">灌入 2,000+ 图像 Token + 历史累积长上下文</text>
  </g>

  <!-- Note over LLM: CoT Deliberation -->
  <g transform="translate(580, 215)">
    <rect width="240" height="52" class="note-card" />
    <text x="10" y="18" font-family="sans-serif" font-size="10" font-weight="700" fill="#991b1b">缓慢自回归长文本推理 (CoT):</text>
    <text x="10" y="32" font-family="sans-serif" font-size="10" fill="#b91c1c">"观察到页面渲染完毕，我准备点击搜索框..."</text>
    <text x="10" y="45" font-family="sans-serif" font-size="10" fill="#7f1d1d">👉 严重认知错配：请老教授做扫雷</text>
  </g>

  <!-- Step 3: LLM -> Driver -->
  <g transform="translate(0, 290)">
    <circle cx="715" cy="0" r="10" class="focal-badge" />
    <text x="715" y="4" class="focal-badge-text">3</text>
    <line x1="700" y1="0" x2="872" y2="0" class="focal-msg-line" marker-end="url(#arrow1-focal)" />
    <text x="730" y="-6" class="focal-msg-text">吐出坐标 JSON: {"action":"click", "x":420, "y":180}</text>
  </g>

  <!-- Step 4: Driver -> Screen -->
  <g transform="translate(0, 325)">
    <circle cx="895" cy="0" r="10" class="badge" />
    <text x="895" y="4" class="badge-text">4</text>
    <path d="M 880 0 L 910 0 Q 920 0 920 12 L 920 18 Q 920 28 910 28 L 308 28" class="msg-line" marker-end="url(#arrow1)" />
    <text x="540" y="22" class="msg-text">执行鼠标移动并物理触发点击</text>
  </g>

  <!-- Bottom summary banner -->
  <g transform="translate(40, 375)">
    <rect width="880" height="50" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="20" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">工程代价惨痛：单次订票耗时数分钟 · API 成本高达 0.1~0.5 美元 · ROI 被彻底击穿</text>
    <text x="20" y="40" font-family="sans-serif" font-size="11" fill="#b91c1c">根本症结：强行调用最高阶慢思考 (System 2) 接管最基础的条件反射 (System 1)</text>
  </g>
</svg>