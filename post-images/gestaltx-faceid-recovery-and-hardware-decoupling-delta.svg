<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #475569; }
      .ledger-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .ledger-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .ledger-old { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #e11d48; }
      .ledger-arrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 700; }
      .ledger-new { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #059669; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="520" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="918" height="518" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <!-- Main Title Area -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="title">Face ID 硬件解耦拓扑演进：盲目全量伪装 vs. GestaltX 身份自愈</text>
    <text x="0" y="20" class="subtitle">深度剖析苹果 SEP 安全芯片与 biometrickitd 的校验机制，以及四大核心硬件标识隔离修复闭环</text>
  </g>

  <!-- Left Column: Before -->
  <g transform="translate(32, 74)">
    <rect width="414" height="268" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="414" height="34" fill="#fff1f2" rx="8"/>
    <rect x="0" y="26" width="414" height="8" fill="#fff1f2"/>
    <text x="16" y="22" class="header" fill="#be123c">BEFORE · 传统旧工具盲目篡改机型</text>
    <rect x="314" y="7" width="86" height="20" fill="#ffe4e6" rx="4"/>
    <text x="323" y="21" class="tag" fill="#be123c">面容锁死 · 灾难</text>

    <!-- Card 1 -->
    <g transform="translate(14, 46)">
      <rect width="386" height="62" fill="#fff5f5" stroke="#fecaca" stroke-width="1" rx="6"/>
      <text x="14" y="22" class="card-title">暴力伪装 4 大硬件字段（Hardware Spoofing）</text>
      <text x="14" y="42" class="card-desc">误将 ProductType 改为 iPhone16,1，覆写芯片与板号</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(14, 118)">
      <rect width="386" height="62" fill="#fff5f5" stroke="#fecaca" stroke-width="1" rx="6"/>
      <text x="14" y="22" class="card-title">SEP 与 biometrickitd 校验断言拦截</text>
      <text x="14" y="42" class="card-desc">物理传感器（TrueDepth）硬件序列与机型预设严重冲突</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(14, 190)">
      <rect width="386" height="62" fill="#fff5f5" stroke="#fecaca" stroke-width="1" rx="6"/>
      <text x="14" y="22" class="card-title">Face ID 永久报错，系统相机黑屏</text>
      <text x="14" y="42" class="card-desc">系统检测到生物识别硬件非法篡改，强制下线面容服务</text>
    </g>
  </g>

  <!-- Right Column: After -->
  <g transform="translate(474, 74)">
    <rect width="414" height="268" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="414" height="34" fill="#f0fdf4" rx="8"/>
    <rect x="0" y="26" width="414" height="8" fill="#f0fdf4"/>
    <text x="16" y="22" class="header" fill="#15803d">AFTER · GestaltX 硬件解耦与面容自愈</text>
    <rect x="314" y="7" width="86" height="20" fill="#dcfce7" rx="4"/>
    <text x="323" y="21" class="tag" fill="#15803d">面容秒解 · 零损</text>

    <!-- Card 1 -->
    <g transform="translate(14, 46)">
      <rect width="386" height="62" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="6"/>
      <text x="14" y="22" class="card-title">纯能力标记注入（Decoupled Capability）</text>
      <text x="14" y="42" class="card-desc">仅开启 Capability.ai 与 RegionCode，绝不动硬件字段</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(14, 118)">
      <rect width="386" height="62" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="6"/>
      <text x="14" y="22" class="card-title">物理板号校验与原厂金库比对</text>
      <text x="14" y="42" class="card-desc">读取 physicalBoard 验证一致性，拒绝外部虚假固件</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(14, 190)">
      <rect width="386" height="62" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="6"/>
      <text x="14" y="22" class="card-title">四大硬件标识定向原位恢复（Self-Healing）</text>
      <text x="14" y="42" class="card-desc">精准修补 4 大硬件字段，保留 AI 标记，面容瞬间自愈</text>
    </g>
  </g>

  <!-- Bottom Changes Ledger Section -->
  <g transform="translate(32, 360)">
    <rect width="856" height="136" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" rx="8"/>
    <rect x="0" y="0" width="856" height="30" fill="#f8fafc" rx="8"/>
    <rect x="0" y="22" width="856" height="8" fill="#f8fafc"/>
    <text x="16" y="20" class="ledger-title">CHANGES LEDGER · 关键架构与核心字段变更清册</text>

    <!-- Row 1 -->
    <g transform="translate(16, 42)">
      <text x="0" y="0" class="ledger-label">机型与板号定义：</text>
      <text x="110" y="0" class="ledger-old">强行篡改为 iPhone16,1 / D83AP</text>
      <text x="350" y="0" class="ledger-arrow">→</text>
      <text x="380" y="0" class="ledger-new">严格锚定物理真机值 (如 iPhone14,2 / D63AP)，绝不虚标</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(16, 66)">
      <text x="0" y="0" class="ledger-label">SEP 生物认证流：</text>
      <text x="110" y="0" class="ledger-old">传感器标定与机型冲突触发 Panic</text>
      <text x="350" y="0" class="ledger-arrow">→</text>
      <text x="380" y="0" class="ledger-new">TrueDepth 硬件校准与系统底层完全匹配，Face ID 完美运行</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(16, 90)">
      <text x="0" y="0" class="ledger-label">AI 开启技术路线：</text>
      <text x="110" y="0" class="ledger-old">误以为开启 AI 必须伪装高配机型</text>
      <text x="350" y="0" class="ledger-arrow">→</text>
      <text x="380" y="0" class="ledger-new">解耦为单纯的 Capability 标记与 RegionCode: LL，无需伪造机型</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(16, 114)">
      <text x="0" y="0" class="ledger-label">历史误修自愈力：</text>
      <text x="110" y="0" class="ledger-old">面容失效后只能抹机刷机重新来过</text>
      <text x="350" y="0" class="ledger-arrow">→</text>
      <text x="380" y="0" class="ledger-new">一键提取备份或物理硬件，原子级修复 4 大标识并保留现有配置</text>
    </g>
  </g>
</svg>