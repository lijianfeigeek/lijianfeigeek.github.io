<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a16z-som2-everything-cycle-macro-shift-title a16z-som2-everything-cycle-macro-shift-desc">
  <title id="a16z-som2-everything-cycle-macro-shift-title">宏观经济周期跃迁：从传统耐用品到 AI 万物周期（The Everything Cycle）</title>
  <desc id="a16z-som2-everything-cycle-macro-shift-desc">展示宏观经济驱动力从房地产汽车等传统耐用品，演化为软件杠杆，最终在生成式AI爆发下成为吞噬全社会的万物周期</desc>
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .badge-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="300" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="36" class="title" text-anchor="middle">宏观经济周期范式跃迁：科技演进为“万物周期 (The Everything Cycle)”</text>
  <text x="480" y="56" class="subtitle" text-anchor="middle">科技不再是标普 500 指数里的可选板块，而是吞噬能源、电网、基建与利润增量的经济超级引擎</text>

  <!-- Stage 1 -->
  <g transform="translate(40, 80)">
    <rect width="250" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="250" height="32" rx="8" fill="#f1f5f9"/>
    <text x="125" y="21" class="card-title" text-anchor="middle">1. 传统耐用品周期 (1970-2000s)</text>
    <g transform="translate(16, 46)">
      <text x="0" y="14" class="card-title">主导驱动力：物理重资产</text>
      <text x="0" y="32" class="text-sub">• 房地产开工与商品房信贷周期</text>
      <text x="0" y="50" class="text-sub">• 汽车装配制造与全国家电普及</text>
      <text x="0" y="68" class="text-sub">• 周期受制于沉重厂房与库存折旧</text>
      <line x1="0" y1="84" x2="218" y2="84" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="104" class="text-sub">⚠️ 边际分发成本高，利润增速温和</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 295 175 L 325 175" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Stage 2 -->
  <g transform="translate(330, 80)">
    <rect width="250" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="250" height="32" rx="8" fill="#f1f5f9"/>
    <text x="125" y="21" class="card-title" text-anchor="middle">2. 科技与软件周期 (2010-2022)</text>
    <g transform="translate(16, 46)">
      <text x="0" y="14" class="card-title" fill="#0284c7">主导驱动力：轻资产运营杠杆</text>
      <text x="0" y="32" class="text-sub">• “软件吞噬一切 (Bits 吃世界)”</text>
      <text x="0" y="50" class="text-sub">• 边际分发成本近乎为零，毛利率 80%+</text>
      <text x="0" y="68" class="text-sub">• SaaS 订阅模式与云端轻资产狂欢</text>
      <line x1="0" y1="84" x2="218" y2="84" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="104" class="text-sub">⚠️ 局限在虚拟世界，脱离实体物理高墙</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 585 175 L 615 175" stroke="#bf4520" stroke-width="2" fill="none"/>

  <!-- Stage 3 (Focal Coral) -->
  <g transform="translate(620, 80)">
    <rect width="300" height="190" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect width="300" height="32" rx="8" fill="#ffedd5"/>
    <text x="150" y="21" class="badge-coral" text-anchor="middle">3. 科技即万物周期 (2024-2030+)</text>
    <g transform="translate(16, 46)">
      <text x="0" y="14" class="badge-coral">全社会统领：吞噬标普 76% 利润增量</text>
      <text x="0" y="32" class="text-sub">• 掀起数千亿美元级芯片与先进封装军备</text>
      <text x="0" y="50" class="text-sub">• 重塑全美电网扩容、高压变压器与核电</text>
      <text x="0" y="68" class="text-sub">• 蓝领熟练电气工溢价与重型基建回流</text>
      <line x1="0" y1="84" x2="268" y2="84" stroke="#fed7aa" stroke-width="1"/>
      <text x="0" y="104" class="badge-coral">实体硬件与能源成为科技算力的终极边界</text>
    </g>
  </g>
</svg>