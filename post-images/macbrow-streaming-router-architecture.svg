<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="macbrow-streaming-router-architecture-title macbrow-streaming-router-architecture-desc" id="macbrow-streaming-router-architecture-root">
      <title id="macbrow-streaming-router-architecture-title">macbrow 语音流式路由与微决策分发架构</title>
      <desc id="macbrow-streaming-router-architecture-desc">麦克风流式音频传输、Gradium STT 语义停顿裁决与 Jev 三路执行引擎拓扑</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #macbrow-streaming-router-architecture-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #macbrow-streaming-router-architecture-root text { font-family: "Geist", -apple-system, sans-serif; }
      #macbrow-streaming-router-architecture-root .mono { font-family: "Geist Mono", monospace; }
      #macbrow-streaming-router-architecture-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="macbrow-streaming-router-architecture-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="macbrow-streaming-router-architecture-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="macbrow-streaming-router-architecture-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Ingestion Block -->
        <g transform="translate(40, 140)">
          <rect x="0" y="0" width="180" height="85" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="12" y="24" font-size="11" font-weight="600" fill="#2d3142" class="mono">AUDIO INGESTION</text>
          <text x="12" y="48" font-size="14" font-weight="600" fill="#2d3142">麦克风实时音频流</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">WebSocket 流式推流</text>
        </g>

        <!-- STT Block -->
        <g transform="translate(260, 140)">
          <rect x="0" y="0" width="190" height="85" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <text x="12" y="24" font-size="11" font-weight="600" fill="#2d3142" class="mono">STREAMING STT</text>
          <text x="12" y="48" font-size="14" font-weight="600" fill="#2d3142">Gradium STT 引擎</text>
          <text x="12" y="70" font-size="11" fill="#2d3142" fill-opacity="0.7">端到端识别 + 语义停顿</text>
        </g>

        <!-- Router (Focal) -->
        <g transform="translate(490, 130)">
          <rect x="0" y="0" width="180" height="105" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.04"/>
          <rect x="0" y="0" width="180" height="24" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="10" y="16" font-size="10" font-weight="700" fill="#bf4520" class="mono">JEV ROUTER (FOCAL)</text>
          <text x="10" y="46" font-size="13" font-weight="600" fill="#bf4520">System 1 意图路由</text>
          <text x="10" y="66" font-size="11" fill="#2d3142" fill-opacity="0.8">• 毫秒级意图识别</text>
          <text x="10" y="84" font-size="11" fill="#2d3142" fill-opacity="0.8">• 投机执行工具分发</text>
        </g>

        <!-- 3 Output Routes -->
        <!-- Route 1: Native AppleScript -->
        <g transform="translate(710, 40)">
          <rect x="0" y="0" width="220" height="85" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="220" height="22" rx="6" fill="#f8f9fa"/>
          <text x="10" y="15" font-size="10" font-weight="600" fill="#2d3142" class="mono">ROUTE 1: APPLESCRIPT ENGINE</text>
          <text x="10" y="42" font-size="13" font-weight="600" fill="#2d3142">本地原生 macOS 进程控制</text>
          <text x="10" y="62" font-size="11" fill="#2d3142" fill-opacity="0.7">切歌、静音、调亮度、切窗 (~50ms)</text>
        </g>

        <!-- Route 2: Browser Runner (CDP) -->
        <g transform="translate(710, 140)">
          <rect x="0" y="0" width="220" height="85" rx="6" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1.2" fill-opacity="0.04"/>
          <rect x="0" y="0" width="220" height="22" rx="6" fill="#2e5aa8" fill-opacity="0.08"/>
          <text x="10" y="15" font-size="10" font-weight="600" fill="#2e5aa8" class="mono">ROUTE 2: CDP BROWSER RUNNER</text>
          <text x="10" y="42" font-size="13" font-weight="600" fill="#2e5aa8">jev-ultrafast 驱动 Chrome</text>
          <text x="10" y="62" font-size="11" fill="#2d3142" fill-opacity="0.75">基于 CDP 控件树交互，无截图开销</text>
        </g>

        <!-- Route 3: System 2 LLM Fallback -->
        <g transform="translate(710, 240)">
          <rect x="0" y="0" width="220" height="85" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="220" height="22" rx="6" fill="#2d3142" fill-opacity="0.06"/>
          <text x="10" y="15" font-size="10" font-weight="600" fill="#2d3142" class="mono">ROUTE 3: SYSTEM 2 ESCALATION</text>
          <text x="10" y="42" font-size="13" font-weight="600" fill="#2d3142">通用慢思考兜底降级</text>
          <text x="10" y="62" font-size="11" fill="#2d3142" fill-opacity="0.7">处理歧义复杂长链路或新任务</text>
        </g>

        <!-- Connectors -->
        <path d="M 220 182 L 260 182" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-streaming-router-architecture-arrow-default)" opacity="0.6"/>
        <path d="M 450 182 L 490 182" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#macbrow-streaming-router-architecture-arrow-accent)"/>

        <!-- Outbound Forks -->
        <path d="M 670 170 L 690 170 Q 700 170 700 150 L 700 90 Q 700 80 705 80 L 710 80" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-streaming-router-architecture-arrow-default)" opacity="0.6"/>
        <path d="M 670 182 L 710 182" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#macbrow-streaming-router-architecture-arrow-link)"/>
        <path d="M 670 195 L 690 195 Q 700 195 700 215 L 700 270 Q 700 280 705 280 L 710 280" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#macbrow-streaming-router-architecture-arrow-default)" opacity="0.6"/>
      </g>
    </svg>
