<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghidra-dual-engine-architecture-topology-title ghidra-dual-engine-architecture-topology-desc">
  <title id="ghidra-dual-engine-architecture-topology-title">Ghidra Java 调度面与 C++ 计算核双轮驱动架构全景</title>
  <desc id="ghidra-dual-engine-architecture-topology-desc">展示前端 Java 协同平台、SLEIGH 规范抽象层与底层 C++ 反编译核心三层架构</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Top Container: Java Frontend &amp; Collaboration Platform -->
  <g transform="translate(24, 20)">
    <rect width="912" height="130" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="912" height="32" rx="8" fill="#f3f4f6"/>
    <path d="M0 24 h912 v8 h-912 z" fill="#f3f4f6"/>
    <text x="16" y="21" class="label-title">Java 交互与协同平台 (Ghidra Framework)</text>

    <!-- 4 Sub Modules -->
    <g transform="translate(16, 44)">
      <rect width="206" height="70" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12">Docking 模块化窗口框架</text>
      <text x="10" y="38" class="text-code">• CodeBrowser 代码浏览器</text>
      <text x="10" y="54" class="text-code">• Decompiler View 实时反编译</text>
    </g>

    <g transform="translate(238, 44)">
      <rect width="206" height="70" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12">版本化对象数据库 (ODB)</text>
      <text x="10" y="38" class="text-code">• B-Tree 只追加存储结构</text>
      <text x="10" y="54" class="text-code">• 事务支持与 Undo/Redo 状态</text>
    </g>

    <g transform="translate(460, 44)">
      <rect width="206" height="70" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12">Ghidra Server 协同中心</text>
      <text x="10" y="38" class="text-code">• 多用户权限与项目分支</text>
      <text x="10" y="54" class="text-code">• 分布式 Check-in/Check-out</text>
    </g>

    <g transform="translate(682, 44)">
      <rect width="214" height="70" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12">脚本与无头自动化</text>
      <text x="10" y="38" class="text-code">• FlatProgramAPI / PyGhidra</text>
      <text x="10" y="54" class="text-code">• analyzeHeadless 批量调度</text>
    </g>
  </g>

  <!-- Connectors from Java to SLEIGH &amp; Decompiler -->
  <path d="M 240 150 L 240 180" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="237,180 243,180 240,186" fill="#9ca3af"/>

  <path d="M 700 150 L 700 180" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="697,180 703,180 700,186" fill="#bf4520"/>

  <!-- Bottom Left: SLEIGH Engine -->
  <g transform="translate(24, 186)">
    <rect width="440" height="170" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="32" rx="8" fill="#f3f4f6"/>
    <path d="M0 24 h440 v8 h-440 z" fill="#f3f4f6"/>
    <text x="16" y="21" class="label-title">处理器规范抽象层 (SLEIGH Engine)</text>

    <g transform="translate(16, 44)">
      <rect width="194" height="110" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12">纯文本规范源文件</text>
      <text x="10" y="38" class="text-code">• .pspec (处理器与端序)</text>
      <text x="10" y="56" class="text-code">• .cspec (ABI 与调用约定)</text>
      <text x="10" y="74" class="text-code">• .slaspec (操作码语义映射)</text>
      <text x="10" y="92" class="text-code">• 纯文本声明式 DSL</text>
    </g>

    <path d="M 216 99 L 236 99" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="236,96 242,99 236,102" fill="#9ca3af"/>

    <g transform="translate(242, 44)">
      <rect width="182" height="110" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#065f46">sleigh 编译二进制</text>
      <text x="10" y="38" class="text-code" fill="#047857">• 离线优化状态机</text>
      <text x="10" y="56" class="text-code" fill="#047857">• 生成紧凑 .sla 模型</text>
      <text x="10" y="74" class="text-code" fill="#047857">• 启动时直接内存映射</text>
      <text x="10" y="92" class="text-code" fill="#047857">• 零 JIT 编译损耗</text>
    </g>
  </g>

  <!-- Bottom Right: C++ Decompiler Core (Coral Accent) -->
  <g transform="translate(496, 186)">
    <rect width="440" height="170" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="32" rx="8" fill="#fff7ed"/>
    <path d="M0 24 h440 v8 h-440 z" fill="#fff7ed"/>
    <text x="16" y="21" class="label-title" fill="#9a3412">C++ 反编译核心计算引擎 (ghidra_decompile)</text>

    <!-- Sub Process cards -->
    <g transform="translate(16, 44)">
      <rect width="194" height="50" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="18" class="label-title" font-size="12" fill="#9a3412">JNI / 异步管道 IPC</text>
      <text x="10" y="36" class="text-code" fill="#7c2d12">极速进程内原生通信</text>
    </g>

    <g transform="translate(230, 44)">
      <rect width="194" height="50" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="18" class="label-title" font-size="12" fill="#9a3412">SSA 生成与常量折叠</text>
      <text x="10" y="36" class="text-code" fill="#7c2d12">Varnode 图谱剪枝优化</text>
    </g>

    <g transform="translate(16, 104)">
      <rect width="194" height="50" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="18" class="label-title" font-size="12" fill="#9a3412">结构化控制流重构</text>
      <text x="10" y="36" class="text-code" fill="#7c2d12">消灭 Goto，恢复 Loop/Switch</text>
    </g>

    <g transform="translate(230, 104)">
      <rect width="194" height="50" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="18" class="label-title" font-size="12" fill="#9a3412">数据流类型自动推导</text>
      <text x="10" y="36" class="text-code" fill="#7c2d12">结合 DTM 映射 C 结构体</text>
    </g>
  </g>
</svg>