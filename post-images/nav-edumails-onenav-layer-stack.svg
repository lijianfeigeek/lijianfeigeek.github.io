<svg xmlns="http://www.w3.org/2000/svg" width="920" height="516" viewBox="0 0 920 516" role="img" aria-labelledby="ned-ls-title ned-ls-desc">
  <title id="ned-ls-title">nav.edumails.cn 五层工程架构与线上技术债审计堆栈</title>
  <desc id="ned-ls-desc">拆解 nav.edumails.cn 从 Nginx HTTP/3 边缘传输、975 KB 整页直出与 Speculation Rules、客户端重脚本水合、WordPress AJAX/REST 暴露面到 wp_options siteurl http:// 分裂引发的 265 处混合内容问题的五层架构。</desc>
  <defs>
    <pattern id="ned-ls-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.26"/>
    </pattern>
    <marker id="ned-ls-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="920" height="516" fill="#f8fafc"/>
  <rect width="920" height="516" fill="url(#ned-ls-dots)"/>

  <!-- Header -->
  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Five-Layer WordPress + OneNav Engineering Audit</text>
  <text x="32" y="52" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#64748b">LIVE PRODUCTION INSPECTION · NGINX HTTP/3 · ONENAV 6.02 · WP REST SURFACE</text>

  <!-- Vertical Axis -->
  <line x1="68" y1="84" x2="68" y2="424" stroke="#475569" stroke-width="1.4" marker-end="url(#ned-ls-arr)"/>
  <text x="60" y="246" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569">REQUEST</text>
  <text x="60" y="260" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">TOP TO DB</text>

  <!-- L5: Edge & Transport -->
  <g transform="translate(128, 76)">
    <rect x="0" y="0" width="760" height="66" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="19" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L5 · EDGE</text>
    <text x="128" y="28" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Nginx HTTP/3 传输层与安全响应头策略</text>
    <text x="128" y="48" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#475569">HTTP/2 + alt-svc: quic=":443"; h3=":443" · HSTS max-age=31536000 · Permissions-Policy</text>
    <rect x="604" y="21" width="140" height="24" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="0.8"/>
    <text x="674" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#047857">HTTP/3 ENABLED</text>
  </g>

  <!-- L4: HTML SSR & Prefetch -->
  <g transform="translate(128, 152)">
    <rect x="0" y="0" width="760" height="66" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="19" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L4 · SSR DOM</text>
    <text x="128" y="28" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#0f172a">975 KB 单体首页直出与 Speculation Rules 预取</text>
    <text x="128" y="48" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#475569">289 张卡片全量渲染 (975,153 B) · eagerness: conservative · 含 1 处测试遗留 bulletin/46.html</text>
    <rect x="604" y="21" width="140" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="674" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#1e293b">975 KB HTML</text>
  </g>

  <!-- L3: Client Runtime -->
  <g transform="translate(128, 228)">
    <rect x="0" y="0" width="760" height="66" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="19" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L3 · CLIENT</text>
    <text x="128" y="28" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#0f172a">OneNav 6.02 传统依赖链与多端翻译水合</text>
    <text x="128" y="48" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#475569">jQuery + Bootstrap + require.js + translate.min.js + t3.gstatic.cn/faviconV2 + v1.hitokoto.cn</text>
    <rect x="604" y="21" width="140" height="24" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="0.8"/>
    <text x="674" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#0369a1">main.min.js 59 KB</text>
  </g>

  <!-- L2: App & API Surface -->
  <g transform="translate(128, 304)">
    <rect x="0" y="0" width="760" height="66" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="19" width="96" height="28" rx="4" fill="#f1f5f9"/>
    <text x="64" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1e293b">L2 · API</text>
    <text x="128" y="28" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#0f172a">admin-ajax 交互总线与开放 REST 接口暴露面</text>
    <text x="128" y="48" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#475569">io_postviews / get_hot_data / ms_auto_search · /wp-json/wp/v2/users 匿名可枚举 (admin, joylynn0216)</text>
    <rect x="604" y="21" width="140" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="674" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#1e293b">/wp-json/wp/v2</text>
  </g>

  <!-- L1: Config & Asset Split-Brain (FOCAL CORAL) -->
  <g transform="translate(128, 380)">
    <rect x="0" y="0" width="760" height="66" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="16" y="19" width="96" height="28" rx="4" fill="#bf4520"/>
    <text x="64" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#ffffff">L1 · CONFIG</text>
    <text x="128" y="28" font-family="'Geist', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#bf4520">核心技术债：wp_options URL 协议分裂与混合内容</text>
    <text x="128" y="48" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#7c2d12">siteurl="http://nav.edumails.cn" vs home="https://" → 首页 527 处 http:// 引用与 265 个图片懒加载降级</text>
    <rect x="604" y="21" width="140" height="24" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
    <text x="674" y="37" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#bf4520">535 HTTP:// REFS</text>
  </g>

  <!-- Legend -->
  <line x1="32" y1="464" x2="888" y2="464" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 484)">
    <text x="0" y="4" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">AUDIT</text>
    <rect x="64" y="-7" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.4"/>
    <text x="86" y="4" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#bf4520">首优先级隐患：WordPress 后台 siteurl 遗留 http:// 导致全站素材与 og:image 协议不统一</text>
    <rect x="616" y="-7" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="638" y="4" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#047857">现代传输基建已就绪</text>
  </g>
</svg>
