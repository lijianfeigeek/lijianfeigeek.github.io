<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockxy-engineering-philosophy-mindmap-title rockxy-engineering-philosophy-mindmap-desc">
  <title id="rockxy-engineering-philosophy-mindmap-title">Rockxy 核心工程哲学思维导图</title>
  <desc id="rockxy-engineering-philosophy-mindmap-desc">展示信任链回归透明、极速原生效能与拥抱次世代范式三大核心工程基石</desc>
  <defs>
    <style>
      .label-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .label-branch { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-leaf { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .text-subleaf { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Root Node (Left Center) -->
  <g transform="translate(40, 145)">
    <rect width="210" height="70" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="105" y="32" text-anchor="middle" class="label-root">Rockxy 工程哲学</text>
    <text x="105" y="52" text-anchor="middle" style="font-family: ui-monospace, monospace; font-size: 11px; fill: #94a3b8;">Core Architecture Vision</text>
  </g>

  <!-- Branch Connectors from Root to 3 Pillars -->
  <!-- Top Branch: 60 -->
  <path d="M 250 160 C 290 160, 310 70, 350 70" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <!-- Mid Branch: 180 -->
  <path d="M 250 180 C 290 180, 310 180, 350 180" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Bottom Branch: 300 -->
  <path d="M 250 200 C 290 200, 310 290, 350 290" fill="none" stroke="#059669" stroke-width="1.5"/>

  <!-- Pillar 1: Trust Chain Transparent (Focal - Top) -->
  <g transform="translate(350, 30)">
    <rect width="250" height="80" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="16" y="28" class="label-branch" fill="#9a3412">1. 信任链回归透明</text>
    <text x="16" y="48" class="text-leaf">AGPL-3.0 源码全公开，拒绝黑盒</text>
    <text x="16" y="66" class="text-subleaf">本地优先 Local-First，无云端 telemetry 泄露</text>
  </g>
  <path d="M 600 70 L 640 70" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <!-- Leaf 1 details -->
  <g transform="translate(640, 30)">
    <rect width="270" height="80" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="26" class="text-leaf">✓ 自行审查与本地编译验证</text>
    <text x="16" y="46" class="text-leaf">✓ 钥匙串隔离与 XPC 权限防线</text>
    <text x="16" y="66" class="text-leaf">✓ 终结商业闭源功能订阅剪裁</text>
  </g>

  <!-- Pillar 2: Fast Native Performance (Mid) -->
  <g transform="translate(350, 140)">
    <rect width="250" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-branch" fill="#0369a1">2. 极速原生效能</text>
    <text x="16" y="48" class="text-leaf">SwiftNIO 纯 Swift 事件驱动引擎</text>
    <text x="16" y="66" class="text-subleaf">SwiftUI 响应状态 + AppKit 120Hz 视效</text>
  </g>
  <path d="M 600 180 L 640 180" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Leaf 2 details -->
  <g transform="translate(640, 140)">
    <rect width="270" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" class="text-leaf">✓ 零拷贝 ByteBuffer 内存流转</text>
    <text x="16" y="46" class="text-leaf">✓ Swift 6 Concurrency 原生防竞态</text>
    <text x="16" y="66" class="text-leaf">✓ 告别 Java Swing / Electron 臃肿</text>
  </g>

  <!-- Pillar 3: Next-Gen Paradigms (Bottom) -->
  <g transform="translate(350, 250)">
    <rect width="250" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="28" class="label-branch" fill="#047857">3. 拥抱次世代范式</text>
    <text x="16" y="48" class="text-leaf">内置本地只读 MCP Server</text>
    <text x="16" y="66" class="text-subleaf">AI 流式与 Web3 RPC 协议感知</text>
  </g>
  <path d="M 600 290 L 640 290" fill="none" stroke="#059669" stroke-width="1.5"/>
  <!-- Leaf 3 details -->
  <g transform="translate(640, 250)">
    <rect width="270" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" class="text-leaf">✓ Cursor / Claude 直连排障诊断</text>
    <text x="16" y="46" class="text-leaf">✓ SSE / NDJSON 流式增量收敛</text>
    <text x="16" y="66" class="text-leaf">✓ x402 微支付挑战头深度支持</text>
  </g>
</svg>