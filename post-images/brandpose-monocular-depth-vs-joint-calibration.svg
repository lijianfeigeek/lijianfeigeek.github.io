<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brandpose-monocular-depth-vs-joint-calibration-title brandpose-monocular-depth-vs-joint-calibration-desc">
  <title id="brandpose-monocular-depth-vs-joint-calibration-title">空间几何标定：单目深度空间萎缩 vs 人体标尺联合最优化</title>
  <desc id="brandpose-monocular-depth-vs-joint-calibration-desc">对比 Depth Anything V2 预测导致货架萎缩至 0.7m 且相机偏矮，与利用 66 组人体鼻尖至脚踝 1.49m 天然标尺联合最小二乘解算出绝对真值</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="cal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Direct Depth Model (Failed) -->
  <g transform="translate(40, 30)">
    <rect width="410" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#ef4444"/>
    <text x="20" y="32" class="label-badge" fill="#b91c1c">纯深度模型方案 · 空间几何萎缩</text>
    <text x="20" y="58" class="label-title" fill="#b91c1c">Depth Anything V2 预测缺陷</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fee2e2" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="52" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">1. 相机安装高度被错误算为 2.04 米</text>
      <text x="12" y="40" class="text-body">严重偏矮，现实便利店吊顶高度至少在 2.7 米以上</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="370" height="52" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">2. 核心双面货架高度仅 0.7 ~ 1.0 米</text>
      <text x="12" y="40" class="text-body">Z 轴严重扁平压缩，商品点云粘连拉伸，无法漫游</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#b91c1c">❌ 根源：安防大倾角鱼眼镜头缺乏绝对地面约束</text>
      <text x="12" y="40" class="text-body">单目模型仅具相对视差推测，缺失真实物理尺度基准</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 458 170 L 498 170" stroke="#bf4520" stroke-width="1.5" marker-end="url(#cal-arrow)"/>

  <!-- Right: Joint Optimization (Focal) -->
  <g transform="translate(510, 30)">
    <rect width="410" height="280" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">物理先验结合 · 联合非线性优化</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">人体标尺 + 货架角点 scipy 求解</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#9a3412">1. 人体天然物理标尺 (鼻尖到脚踝 = 1.49m)</text>
      <text x="12" y="40" class="text-body">精选 66 组姿态样本作为真实世界不可撼动的绝对距离锚点</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#9a3412">2. 联合求解内参、外参与桶形畸变 (k1 = -0.318)</text>
      <text x="12" y="40" class="text-body">解出相机绝对高度 2.68m，HFov 57.0°，直线重合误差降至 3px</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="12" y="22" class="text-feat" fill="#bf4520">✅ 成果：货架还原为 1.45m，支持 Blender 电影级重构</text>
      <text x="12" y="40" class="text-body">完美贴合实体零售 gondola 工业标准，奠定数字孪生基石</text>
    </g>
  </g>
</svg>