<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="miao-swim-title miao-swim-desc" id="miao-swim-root" data-diagram="swimlane">
  <title id="miao-swim-title">米遥 MI-AO 按住说话到 Codex 安全注入四域泳道图</title>
  <desc id="miao-swim-desc">展示小米蓝牙遥控器 2 Pro 从 BLE GATT 音频流、ATVV v1.0 字节对调兼容与 IMA ADPCM 解码、容量为 2 的串行后台 Whisper 转写队列，到唯一 Codex AXTextArea 校验与剪贴板并发保护的四域端到端流水线。</desc>
  <defs>
    <pattern id="ms-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#94a3b8" opacity="0.20"/>
    </pattern>
    <marker id="ms-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="ms-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="ms-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="ms-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="1000" height="620" fill="#f8fafc"/>
  <rect x="0" y="0" width="1000" height="620" fill="url(#ms-dots)"/>
  <rect x="16" y="16" width="968" height="588" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="12" fill="#64748b" font-size="9.5" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" letter-spacing="0.14em">CROSS-DOMAIN VOICE PIPELINE · HOLD-TO-TALK BLE AUDIO TO VERIFIED CODEX INPUT</text>
    <text x="0" y="38" fill="#0f172a" font-size="20" font-weight="400" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif">从遥控器麦克风到唯一输入框：ATVV 16kHz 流解码、有界串行队列与剪贴板并发锁</text>
  </g>

  <!-- Swimlane Frame & Dividers (4px grid) -->
  <rect x="36" y="96" width="928" height="440" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="96" width="168" height="440" fill="#f8fafc"/>
  <rect x="204" y="206" width="760" height="110" fill="#f8fafc" opacity="0.55"/>
  <rect x="204" y="426" width="760" height="110" fill="#f8fafc" opacity="0.55"/>
  <line x1="204" y1="96" x2="204" y2="536" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="36" y1="206" x2="964" y2="206" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="316" x2="964" y2="316" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="36" y1="426" x2="964" y2="426" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Lane Labels -->
  <g transform="translate(52, 124)">
    <text x="0" y="12" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 01 · BLE GATT</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">蓝牙语音传输域</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">AB5E0001..0004</text>
  </g>
  <g transform="translate(52, 234)">
    <text x="0" y="12" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 02 · ATVV PCM</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">协议解码与重采样</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">IMA ADPCM → 16kHz</text>
  </g>
  <g transform="translate(52, 344)">
    <text x="0" y="12" fill="#475569" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 03 · WHISPER</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">有界队列与本地转写</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">SHA-256 · Max 2 Jobs</text>
  </g>
  <g transform="translate(52, 454)">
    <text x="0" y="12" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LANE 04 · CODEX AX</text>
    <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">辅助功能安全注入域</text>
    <text x="0" y="50" fill="#64748b" font-size="9.5" font-family="'Geist Mono', ui-monospace, monospace">AXUIElement · 0600</text>
  </g>

  <!-- ==================== ORTHOGONAL CONNECTORS (DRAWN BEFORE BOXES) ==================== -->
  <!-- 1. Node 01 -> Node 02 -->
  <line x1="376" y1="152" x2="404" y2="152" stroke="#0284c7" stroke-width="1.2" marker-end="url(#ms-arr-link)"/>

  <!-- 2. Node 02 -> Node 03 (BLE notify into ADPCM decoder) -->
  <line x1="488" y1="184" x2="488" y2="228" stroke="#0284c7" stroke-width="1.2" marker-end="url(#ms-arr-link)"/>
  <rect x="496" y="196" width="68" height="16" rx="2" fill="#ffffff"/>
  <text x="530" y="207" fill="#0284c7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">120B NOTIFY</text>

  <!-- 3. Node 03 -> Node 04 -->
  <line x1="572" y1="260" x2="600" y2="260" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ms-arr-accent)"/>

  <!-- 4. Node 04 -> Node 08 (Main thread non-blocking return to Ready) -->
  <line x1="680" y1="228" x2="680" y2="184" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arr-ok)"/>
  <rect x="688" y="196" width="76" height="16" rx="2" fill="#ffffff"/>
  <text x="726" y="207" fill="#059669" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NON-BLOCKING</text>

  <!-- 5. Node 04 -> Node 05 (Enqueue off BLE thread) -->
  <line x1="680" y1="292" x2="680" y2="336" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ms-arr-accent)"/>
  <rect x="688" y="306" width="68" height="16" rx="2" fill="#ffffff"/>
  <text x="722" y="317" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ENQUEUE</text>

  <!-- 6. Node 05 -> Node 06 -->
  <line x1="760" y1="368" x2="788" y2="368" stroke="#64748b" stroke-width="1.2" marker-end="url(#ms-arr-muted)"/>

  <!-- 7. Node 06 -> Node 07 (Main thread AX submission) -->
  <line x1="868" y1="400" x2="868" y2="444" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ms-arr-accent)"/>
  <rect x="784" y="412" width="76" height="16" rx="2" fill="#ffffff"/>
  <text x="822" y="423" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MAIN DISPATCH</text>

  <!-- ==================== NODES (ISOLATED <g transform="translate(X, Y)">) ==================== -->
  <!-- Node 01 -->
  <g transform="translate(220, 120)">
    <rect x="0" y="0" width="156" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">01 · HOLD TO TALK</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">按住语音键开麦</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">0x08 → TX 0C 00</text>
  </g>

  <!-- Node 02 -->
  <g transform="translate(404, 120)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="20" fill="#0284c7" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">02 · STREAM &amp; STOP</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">120B 音频帧与三路收口</text>
    <text x="12" y="54" fill="#0369a1" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">松手 0x00 / 二次按 / 静音</text>
  </g>

  <!-- Node 08 (Instant Ready) -->
  <g transform="translate(600, 120)">
    <rect x="0" y="0" width="160" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
    <text x="12" y="20" fill="#059669" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">04B · INSTANT READY</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">BLE 主线程立即归位</text>
    <text x="12" y="54" fill="#047857" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">按键与下轮录音零阻塞</text>
  </g>

  <!-- Node 03 (FOCAL CORAL 1) -->
  <g transform="translate(404, 228)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">03 · ATVV &amp; ADPCM</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">字节对调兼容与流解码</text>
    <text x="12" y="54" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">AUDIO_SYNC · 4-bit Nibble</text>
  </g>

  <!-- Node 04 -->
  <g transform="translate(600, 228)">
    <rect x="0" y="0" width="160" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">04 · RMS &amp; GAIN</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">过短过滤与 16kHz 增益</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">线性插值 · 0600 原子 WAV</text>
  </g>

  <!-- Node 05 -->
  <g transform="translate(600, 336)">
    <rect x="0" y="0" width="160" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">05 · BOUNDED QUEUE</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">1 运行 + 1 等待背压控制</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">148MB 模型实时 SHA-256</text>
  </g>

  <!-- Node 06 -->
  <g transform="translate(788, 336)">
    <rect x="0" y="0" width="156" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#64748b" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace">06 · WHISPER CLI</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">离线中文领域词引导</text>
    <text x="12" y="54" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">--prompt · 30s 信号量门禁</text>
  </g>

  <!-- Node 07 (FOCAL CORAL 2) -->
  <g transform="translate(644, 444)">
    <rect x="0" y="0" width="300" height="64" rx="6" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <text x="12" y="20" fill="#bf4520" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">07 · UNIQUE AX EDITOR &amp; PASTEBOARD GUARD</text>
    <text x="12" y="38" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">唯一 AXTextArea 校验与剪贴板并发保护</text>
    <text x="12" y="54" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">candidates==1 才回车 · changeCount 防误覆写</text>
  </g>

  <!-- Legend Strip -->
  <line x1="36" y1="556" x2="964" y2="556" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(36, 568)">
    <text x="0" y="14" fill="#64748b" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LEGEND</text>
    <rect x="72" y="4" width="16" height="12" rx="2" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <text x="96" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">核心协议兼容与防误发安全护栏</text>
    <line x1="296" y1="10" x2="328" y2="10" stroke="#0284c7" stroke-width="1.4"/>
    <text x="336" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">BLE GATT 实时音频通知流</text>
    <line x1="504" y1="10" x2="536" y2="10" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="544" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">主线程零阻塞异步归位信号</text>
    <rect x="724" y="4" width="16" height="12" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="748" y="14" fill="#334155" font-size="11.5" font-family="'Geist', 'PingFang SC', sans-serif">本机私有 0600 处理节点</text>
  </g>
</svg>
