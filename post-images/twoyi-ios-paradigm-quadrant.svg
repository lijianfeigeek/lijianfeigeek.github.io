<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="twoyi-quad-title twoyi-quad-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <title id="twoyi-quad-title">iOS 端运行 Android 系统的四大技术范式四象限权衡矩阵</title>
  <desc id="twoyi-quad-desc">以执行速度（原生速度 vs 逐段解释）与运行独立性（脱机自包含 vs 依赖外部 JIT 调试）为双轴，对比 Twoyi iOS、UTM JIT、UTM SE 与 Husk。</desc>
  <defs>
    <marker id="axis-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="axis-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 1 5 L 10 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">在 iPhone 上运行 Android 的四大技术路线权衡矩阵</text>
    <text x="20" y="44" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">EXECUTION EFFICIENCY × ZERO-JIT SELF-CONTAINMENT (2026 BENCHMARK)</text>
    <text x="860" y="34" font-size="11" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7" font-weight="600" text-anchor="end">TYPE: QUADRANT</text>
  </g>

  <!-- Double-ended Axis Cross (cx=480, cy=324) -->
  <line x1="160" y1="324" x2="800" y2="324" stroke="#0f172a" stroke-width="1.2" marker-start="url(#axis-start)" marker-end="url(#axis-end)"/>
  <line x1="480" y1="124" x2="480" y2="524" stroke="#0f172a" stroke-width="1.2" marker-start="url(#axis-start)" marker-end="url(#axis-end)"/>

  <!-- Jobs-minimal Axis Tip Labels -->
  <text x="480" y="110" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">NATIVE-SPEED</text>
  <text x="480" y="546" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">INTERPRETED</text>
  <text x="148" y="328" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="end" letter-spacing="1.5">EXTERNAL-JIT</text>
  <text x="812" y="328" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="start" letter-spacing="1.5">SELF-CONTAINED</text>

  <!-- Q1 Top-Left: UTM + JIT -->
  <g transform="translate(152, 136)">
    <rect x="0" y="0" width="300" height="164" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="24" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" letter-spacing="1">01 · NATIVE-SPEED / EXTERNAL-JIT</text>
    <text x="18" y="52" font-size="16" font-weight="700" fill="#0f172a">UTM（开启 JIT）</text>
    <text x="18" y="78" font-size="12" fill="#334155">模拟整台电脑硬件并运行完整系统。</text>
    <text x="18" y="98" font-size="12" fill="#334155">靠运行时 JIT 动态翻译，性能优秀，但</text>
    <text x="18" y="118" font-size="12" fill="#334155">每次重启后必须连电脑或借 StikDebug。</text>
    <text x="18" y="146" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0284c7">Full Hardware Emulation + Runtime JIT</text>
  </g>

  <!-- Q2 Top-Right: Twoyi iOS (CORAL FOCAL QUADRANT) -->
  <g transform="translate(508, 136)">
    <rect x="0" y="0" width="300" height="164" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="18" y="24" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#be123c" letter-spacing="1">02 · NATIVE-SPEED / SELF-CONTAINED</text>
    <text x="18" y="52" font-size="16" font-weight="700" fill="#0f172a">两仪 Twoyi（iOS 版）</text>
    <text x="18" y="78" font-size="12" fill="#334155">不模拟硬件，直供 Linux 内核接口。</text>
    <text x="18" y="98" font-size="12" fill="#334155">构建期静态 AOT 直编 2,852 单元进</text>
    <text x="18" y="118" font-size="12" fill="#334155">Mach-O，无需 JIT 约 3 秒启动 Android 13。</text>
    <text x="18" y="146" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#be123c">Static AOT + EROFS + Metal GPU</text>
  </g>

  <!-- Q3 Bottom-Left: Husk -->
  <g transform="translate(152, 348)">
    <rect x="0" y="0" width="300" height="164" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="24" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" letter-spacing="1">03 · INTERPRETED / EXTERNAL-JIT</text>
    <text x="18" y="52" font-size="16" font-weight="700" fill="#0f172a">Husk（翻译层 / 模拟模式）</text>
    <text x="18" y="78" font-size="12" fill="#334155">翻译层仅直跑单个游戏，不启动 Android；</text>
    <text x="18" y="98" font-size="12" fill="#334155">若需完整系统则回退 QEMU LineageOS。</text>
    <text x="18" y="118" font-size="12" fill="#334155">常规依赖 JIT（或导入签名证书绕过）。</text>
    <text x="18" y="146" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">Single-Game Layer / QEMU Fallback</text>
  </g>

  <!-- Q4 Bottom-Right: QEMU / UTM SE -->
  <g transform="translate(508, 348)">
    <rect x="0" y="0" width="300" height="164" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="24" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" letter-spacing="1">04 · INTERPRETED / SELF-CONTAINED</text>
    <text x="18" y="52" font-size="16" font-weight="700" fill="#0f172a">QEMU / UTM SE</text>
    <text x="18" y="78" font-size="12" fill="#334155">不依赖外部电脑即可独立运行，</text>
    <text x="18" y="98" font-size="12" fill="#334155">但因模拟整机硬件且缺乏 AOT/JIT，</text>
    <text x="18" y="118" font-size="12" fill="#334155">只能靠 TCTI 线程化解释器逐段解释。</text>
    <text x="18" y="146" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">TCTI Threaded Interpreter · High Latency</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(40, 568)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <rect x="76" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="24" font-size="11" fill="#334155">脱机免 JIT 原生级突破方案 (Twoyi iOS)</text>
    <rect x="372" y="13" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="394" y="24" font-size="11" fill="#334155">传统模拟器 / 外部调试方案</text>
    <text x="880" y="24" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="end">SOURCE: twoyi.app, getutm.app, Husk</text>
  </g>
</svg>