<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="rt-title rt-desc" style="background:#f8fafc; font-family:'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;">
  <title id="rt-title">dsh-purge v1.1.71 内置演练台多智能体编排与 SQLite 事实库数据流</title>
  <desc id="rt-desc">按权限治理层、主控指挥层、五角色叶子执行层与本地 SQLite 事实库层展示 56 个 redteam_* 工具与 anchor-gate 的协作数据流。</desc>
  <defs>
    <marker id="rt-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="rt-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#bf4520"/>
    </marker>
    <marker id="rt-link" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title -->
  <g transform="translate(24, 20)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0f172a">Data Flow · v1.1.71 内置「演练台」多智能体编排与 SQLite 事实库</text>
    <text x="0" y="40" font-size="11" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">HOST PLANE (lib/redteam) + AGENT PLANE (presets/redteam) · 56 TOOLS · 25 TABLES · 23 RUNBOOK SKILLS</text>
  </g>

  <!-- Step Header Strip -->
  <g transform="translate(160, 72)">
    <rect x="0" y="0" width="144" height="24" rx="4" fill="#e2e8f0"/>
    <text x="16" y="16" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">01 · GATE &amp; BOOT</text>

    <rect x="164" y="0" width="144" height="24" rx="4" fill="#e2e8f0"/>
    <text x="178" y="16" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">02 · LEAD &amp; ANCHOR</text>

    <rect x="328" y="0" width="144" height="24" rx="4" fill="#ffedd5" stroke="#bf4520" stroke-width="1"/>
    <text x="342" y="16" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520">03 · DISPATCH (≤3)</text>

    <rect x="492" y="0" width="144" height="24" rx="4" fill="#e2e8f0"/>
    <text x="506" y="16" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#334155">04 · FACT PERSIST</text>

    <rect x="656" y="0" width="144" height="24" rx="4" fill="#e0f2fe"/>
    <text x="670" y="16" font-size="10" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#0369a1">05 · UI &amp; REPORT</text>
  </g>

  <!-- Lane Containers -->
  <g transform="translate(24, 108)">
    <!-- Lane 1: Governance & Boot -->
    <rect x="0" y="0" width="952" height="100" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="124" height="100" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="44" font-size="11" font-weight="700" fill="#334155">治理与自举平面</text>
    <text x="14" y="62" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">HOST BOOTSTRAP</text>

    <!-- Lane 2: Lead Commander -->
    <rect x="0" y="108" width="952" height="108" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="108" width="124" height="108" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="156" font-size="11" font-weight="700" fill="#334155">主控指挥智能体</text>
    <text x="14" y="174" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">REDTEAM LEAD</text>

    <!-- Lane 3: Leaf Roles & Store -->
    <rect x="0" y="224" width="952" height="116" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="224" width="124" height="116" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="276" font-size="11" font-weight="700" fill="#334155">叶子执行 &amp; 事实库</text>
    <text x="14" y="294" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#64748b">LEAF + SQLITE</text>
  </g>

  <!-- Connectors (drawn BEFORE node rects) -->
  <g transform="translate(24, 108)">
    <!-- L1 N1 -> L2 N2 -->
    <path d="M 208 84 L 208 104 Q 208 112 216 112 L 292 112 Q 300 112 300 120 L 300 124" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#rt-muted)"/>
    <!-- L1 N2 (skills sync) -> L3 N3 (leaf) -->
    <path d="M 372 84 L 372 104 L 536 104 L 536 240" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#rt-muted)"/>
    <!-- L2 N2 (Lead) -> L2 N3 (Slot/Dispatch) -->
    <path d="M 444 162 L 464 162" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#rt-muted)"/>
    <!-- L2 N3 -> L3 N3 (FOCAL accent handoff) -->
    <path d="M 536 202 L 536 240" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#rt-accent)"/>
    <!-- L3 N3 -> L3 N4 (Fact persist) -->
    <path d="M 608 282 L 628 282" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#rt-muted)"/>
    <!-- L3 N4 -> L2 N5 (Report & Verify) -->
    <path d="M 700 240 L 700 220 L 864 220 L 864 202" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#rt-link)"/>

    <!-- Label on focal edge -->
    <rect x="476" y="210" width="120" height="16" rx="3" fill="#ffffff"/>
    <text x="482" y="221" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" font-weight="700" fill="#bf4520">redteamRole: &lt;code&gt;</text>
  </g>

  <!-- Nodes -->
  <g transform="translate(24, 108)">
    <!-- L1 N1: Drill Grant -->
    <g transform="translate(136, 16)">
      <rect x="0" y="0" width="144" height="68" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" font-size="11.5" font-weight="600" fill="#0f172a">三重授权合规门禁</text>
      <text x="10" y="38" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">drill-grant.json</text>
      <text x="10" y="54" font-size="9" fill="#64748b">读声明 + 倒计时 + 三项勾选</text>
    </g>
    <!-- L1 N2: Bootstrap -->
    <g transform="translate(300, 16)">
      <rect x="0" y="0" width="144" height="68" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" font-size="11.5" font-weight="600" fill="#0f172a">预设与 23 技能自举</text>
      <text x="10" y="38" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">dshHomePath(redteam)</text>
      <text x="10" y="54" font-size="9" fill="#64748b">用户 $DSH_HOME/skills 优先</text>
    </g>

    <!-- L2 N2: Lead + Anchor Gate -->
    <g transform="translate(300, 124)">
      <rect x="0" y="0" width="144" height="78" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="10" y="20" font-size="11.5" font-weight="600" fill="#0f172a">红队指挥官 + 锚点门</text>
      <text x="10" y="38" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">anchor-gate.mjs</text>
      <text x="10" y="54" font-size="9" fill="#64748b">preflight 预检 + 压缩复位</text>
      <text x="10" y="68" font-size="9" fill="#64748b">只调度与核库，绝不亲手发包</text>
    </g>

    <!-- L2 N3: Dispatch Slot -->
    <g transform="translate(464, 124)">
      <rect x="0" y="0" width="144" height="78" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.2"/>
      <text x="10" y="20" font-size="11.5" font-weight="700" fill="#bf4520">并发槽位硬控 (≤3)</text>
      <text x="10" y="38" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#9a3412">redteam_agent_slot</text>
      <text x="10" y="54" font-size="9" fill="#9a3412">status/acquire · 顺序推进</text>
      <text x="10" y="68" font-size="9" fill="#9a3412">强制原生 subagent 派活</text>
    </g>

    <!-- L3 N3: 5 Leaf Roles -->
    <g transform="translate(464, 240)">
      <rect x="0" y="0" width="144" height="84" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.2"/>
      <text x="10" y="20" font-size="11.5" font-weight="700" fill="#0f172a">五大叶子执行角色</text>
      <text x="10" y="38" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#bf4520">recon · assess · vuln-scan</text>
      <text x="10" y="52" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#bf4520">exploit · internal</text>
      <text x="10" y="70" font-size="9" fill="#7c2d12">maxDepth=1 · 禁 fork/workflow</text>
    </g>

    <!-- L3 N4: RedteamStore SQLite -->
    <g transform="translate(628, 240)">
      <rect x="0" y="0" width="144" height="84" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" font-size="11.5" font-weight="600" fill="#0f172a">本地 SQLite 事实库</text>
      <text x="10" y="38" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#475569">node:sqlite · 25 tables</text>
      <text x="10" y="54" font-size="9" fill="#64748b">asset_fts / poc_fts 全文索引</text>
      <text x="10" y="70" font-size="9" fill="#64748b">缺 FTS5 自动降级 LIKE 检索</text>
    </g>

    <!-- L2 N5: HTTP Bridge & Replay -->
    <g transform="translate(792, 124)">
      <rect x="0" y="0" width="144" height="78" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="10" y="20" font-size="11.5" font-weight="700" fill="#0369a1">侧栏桥接 &amp; 战报回放</text>
      <text x="10" y="38" font-size="9.5" font-family="'Geist Mono',ui-monospace,Menlo,monospace" fill="#0284c7">POST /redteam/api</text>
      <text x="10" y="54" font-size="9" fill="#0369a1">攻防得分点 + 原始 HTTP 证据</text>
      <text x="10" y="68" font-size="9" fill="#0369a1">export-engagement-report</text>
    </g>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(24, 468)">
    <text x="0" y="16" font-size="10.5" fill="#64748b">注：子会话通过 role-section.js 监听 agent/inbox/claimed 提取首行 redteamRole，自动加载对应角色稿（含 400 容量 FIFO 淘汰防泄漏）。</text>
  </g>
</svg>
