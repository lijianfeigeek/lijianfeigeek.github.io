<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" role="img" aria-labelledby="skwir-sw-title skwir-sw-desc" id="skwir-agent-script-swimlane-root">
  <title id="skwir-sw-title">Skwir 人机共治双端点权限与计划执行泳道图</title>
  <desc id="skwir-sw-desc">展示 ADR-085 与 ADR-079 的核心协作流：AI 代理通过 control.sock 强制进入 Propose 人工审阅闸门并受隐私目录过滤，本地脚本通过 control.sock.scripts 走 Apply 通道，最终所有写操作均化作带有 Footprint 冲突图的 Plan 进入并发执行器并记录逆操作。</desc>
  <defs>
    <style>
      #skwir-agent-script-swimlane-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="skwir-sw-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.22"/>
    </pattern>
    <marker id="sw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="sw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="sw-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="980" height="580" fill="#f8fafc"/>
  <rect width="980" height="580" fill="url(#skwir-sw-dots)"/>

  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Dual-Endpoint Authority, Privacy Gate &amp; Footprint Executor</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">ADR-085 SPLIT SOCKETS · ADR-044 AGENT GATE · ADR-125 PRIVACY REDACTION · ADR-079 CONCURRENT PLANS</text>

  <!-- Lane backgrounds & dividers -->
  <!-- Lane 1: Callers -->
  <g transform="translate(32, 76)">
    <rect x="0" y="0" width="916" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#64748b">LANE 1 · CALLERS (调用方与传输分离)</text>
  </g>
  <!-- Lane 2: Control & Gate -->
  <g transform="translate(32, 184)">
    <rect x="0" y="0" width="916" height="108" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#64748b">LANE 2 · CONTROL &amp; PRIVACY GATE (端点裁决与隐私拦截)</text>
  </g>
  <!-- Lane 3: Human Window / Core Plan -->
  <g transform="translate(32, 304)">
    <rect x="0" y="0" width="916" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#64748b">LANE 3 · HUMAN WINDOW &amp; PLAN REVIEW (核心命令与确认闸门)</text>
  </g>
  <!-- Lane 4: Footprint Executor -->
  <g transform="translate(32, 420)">
    <rect x="0" y="0" width="916" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="20" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#64748b">LANE 4 · EXECUTOR &amp; JOURNAL (冲突调度与可逆日志)</text>
  </g>

  <!-- Orthogonal connectors drawn BEFORE boxes -->
  <!-- 1. AI Agent -> control.sock (Accent focal path) -->
  <path d="M 164 156 L 164 216" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sw-arrow-accent)"/>
  <!-- 2. Local Script -> control.sock.scripts (Link path) -->
  <path d="M 464 156 L 464 216" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#sw-arrow-link)"/>
  <!-- 3. Human UI -> Core Dispatch -->
  <path d="M 792 156 L 792 332" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#sw-arrow)"/>
  <!-- 4. control.sock -> Privacy Checker -->
  <path d="M 272 248 L 320 248" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sw-arrow-accent)"/>
  <!-- 5. Privacy Checker -> Propose Window (orthogonal elbow r=8) -->
  <path d="M 380 280 L 380 300 Q 380 308 372 308 L 228 308 Q 220 308 220 316 L 220 332" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sw-arrow-accent)"/>
  <!-- 6. control.sock.scripts -> Core Plan / Apply -->
  <path d="M 552 280 L 552 332" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#sw-arrow-link)"/>
  <!-- 7. Propose Window (approved) -> Core Plan -->
  <path d="M 328 364 L 444 364" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#sw-arrow-accent)"/>
  <!-- 8. Core Plan -> Executor Footprint -->
  <path d="M 552 396 L 552 444" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#sw-arrow)"/>
  <!-- 9. Footprint -> Channel Scheduler -->
  <path d="M 656 476 L 700 476" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#sw-arrow)"/>
  <!-- 10. Footprint -> Undo Journal (left) -->
  <path d="M 444 476 L 348 476" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#sw-arrow)"/>
  <!-- 11. Redacted output back to Agent (dashed return) -->
  <path d="M 444 348 L 416 348 Q 408 348 408 340 L 408 290" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Label masks & text on connectors (with visible gap) -->
  <rect x="86" y="176" width="68" height="16" rx="2" fill="#f8fafc"/>
  <text x="120" y="187" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#bf4520">FORCE PROPOSE</text>

  <rect x="474" y="176" width="84" height="16" rx="2" fill="#f8fafc"/>
  <text x="516" y="187" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#0284c7">META: APPLY/PRINT</text>

  <rect x="344" y="346" width="84" height="16" rx="2" fill="#ffffff"/>
  <text x="386" y="357" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#bf4520">HUMAN APPROVES</text>

  <!-- LANE 1 BOXES -->
  <g transform="translate(56, 104)">
    <rect x="0" y="0" width="216" height="52" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">AI Agent (Claude / Cursor)</text>
    <text x="12" y="39" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">skwir mcp (stdio ↔ MCP rmcp)</text>
  </g>
  <g transform="translate(360, 104)">
    <rect x="0" y="0" width="216" height="52" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0369a1">本机自动化脚本 / CLI</text>
    <text x="12" y="39" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">skwir cmd [--apply] &lt;command&gt;</text>
  </g>
  <g transform="translate(684, 104)">
    <rect x="0" y="0" width="220" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">人类桌面用户（键鼠/面板）</text>
    <text x="12" y="39" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#475569">Ctrl+Shift+P · 快捷键 · 拖拽</text>
  </g>

  <!-- LANE 2 BOXES -->
  <g transform="translate(56, 216)">
    <rect x="0" y="0" width="216" height="64" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="21" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="11" font-weight="600" fill="#bf4520">control.sock (0600)</text>
    <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#334155">忽略请求体中的 skwir/plan 元数据</text>
    <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">恒定锁定 PlanMode::Propose</text>
  </g>
  <g transform="translate(320, 216)">
    <rect x="0" y="0" width="144" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">隐私与越界守卫</text>
    <text x="12" y="38" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">拦截 ~/.ssh · .private</text>
    <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">返回强制脱敏 (private)</text>
  </g>
  <g transform="translate(492, 216)">
    <rect x="0" y="0" width="228" height="64" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="11" font-weight="600" fill="#0369a1">control.sock.scripts</text>
    <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#334155">仅由此端点放行 Print / Apply</text>
    <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">依然拒绝代答其他应用的 FileChooser</text>
  </g>

  <!-- LANE 3 BOXES -->
  <g transform="translate(56, 332)">
    <rect x="0" y="0" width="272" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">App::propose_awaiting 审阅闸门</text>
    <text x="12" y="38" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#334155">窗口弹窗展示计划变更清单与冲突预览</text>
    <text x="12" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">PATIENCE = 10 min · 驳回或批准才返回 MCP</text>
  </g>
  <g transform="translate(444, 332)">
    <rect x="0" y="0" width="460" height="64" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1.2"/>
    <text x="16" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">统一命令与计划编译器（Command → Dry-Run Plan）</text>
    <text x="16" y="38" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#334155">app.dispatch(invocation) → Outcome::Plan(Vec&lt;Box&lt;dyn Operation&gt;&gt;)</text>
    <text x="16" y="54" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">基于 FileId (dev+ino) 解析目标 · 事先执行 dry_run_in() 预检同名冲突与可用空间</text>
  </g>

  <!-- LANE 4 BOXES -->
  <g transform="translate(56, 444)">
    <rect x="0" y="0" width="292" height="60" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">逆操作日志与单步幂等保障</text>
    <text x="12" y="39" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">Ctrl+Z 精确逆转 · 断点续传校验末尾 1 MiB</text>
  </g>
  <g transform="translate(444, 444)">
    <rect x="0" y="0" width="212" height="60" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Footprint 冲突判定器</text>
    <text x="12" y="39" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">reads / writes / names / stores</text>
  </g>
  <g transform="translate(700, 444)">
    <rect x="0" y="0" width="204" height="60" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Channel 分盘并发调度</text>
    <text x="12" y="39" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">同盘重任务串行 · 跨盘/远端并发 (≤4)</text>
  </g>

  <!-- Legend -->
  <line x1="32" y1="532" x2="948" y2="532" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 552)">
    <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <line x1="72" y1="-1" x2="104" y2="-1" stroke="#bf4520" stroke-width="2"/>
    <text x="114" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">AI 代理强制受控链路（不可伪造权限，必经人工审批）</text>
    <line x1="452" y1="-1" x2="484" y2="-1" stroke="#0284c7" stroke-width="1.8"/>
    <text x="494" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0369a1">本机脚本通道（允许 --apply 直达）</text>
    <line x1="724" y1="-1" x2="756" y2="-1" stroke="#475569" stroke-width="1.5"/>
    <text x="766" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">核心执行与日志路径</text>
  </g>
</svg>
