<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="ivyclaw-handoff-seq-title ivyclaw-handoff-seq-desc">
  <title id="ivyclaw-handoff-seq-title">分阶交接协议与独立 Thread 隔离时序</title>
  <desc id="ivyclaw-handoff-seq-desc">展示Dispatcher调度器与Classifier、Planner、Researcher、Coder、Tester与Reviewer各子代理的最小契约摘要交接时序流</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .actor-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-actor { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .actor-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .focal-actor-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #bf4520; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
      .msg-line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .focal-msg-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
      .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
      .focal-msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #bf4520; }
      .badge { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .focal-badge { fill: rgba(191, 69, 32, 0.1); stroke: #bf4520; stroke-width: 1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .focal-badge-text { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; text-anchor: middle; }
    </style>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow3-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="480" class="bg" />

  <!-- Actors (7 columns: x = 70, 200, 330, 460, 590, 720, 850) -->
  <!-- 1. Dispatcher -->
  <g transform="translate(10, 20)">
    <rect width="120" height="40" rx="6" class="focal-actor" />
    <text x="60" y="25" class="focal-actor-text">Dispatcher 调度器</text>
  </g>
  <line x1="70" y1="60" x2="70" y2="450" class="lifeline" />

  <!-- 2. Classifier -->
  <g transform="translate(145, 20)">
    <rect width="110" height="40" rx="6" class="actor-card" />
    <text x="55" y="25" class="actor-text">0. Classifier</text>
  </g>
  <line x1="200" y1="60" x2="200" y2="450" class="lifeline" />

  <!-- 3. Planner -->
  <g transform="translate(275, 20)">
    <rect width="110" height="40" rx="6" class="actor-card" />
    <text x="55" y="25" class="actor-text">1. Planner</text>
  </g>
  <line x1="330" y1="60" x2="330" y2="450" class="lifeline" />

  <!-- 4. Researcher -->
  <g transform="translate(405, 20)">
    <rect width="110" height="40" rx="6" class="actor-card" />
    <text x="55" y="25" class="actor-text">2. Researcher</text>
  </g>
  <line x1="460" y1="60" x2="460" y2="450" class="lifeline" />

  <!-- 5. Coder -->
  <g transform="translate(535, 20)">
    <rect width="110" height="40" rx="6" class="actor-card" />
    <text x="55" y="25" class="actor-text">3. Coder</text>
  </g>
  <line x1="590" y1="60" x2="590" y2="450" class="lifeline" />

  <!-- 6. Tester -->
  <g transform="translate(665, 20)">
    <rect width="110" height="40" rx="6" class="actor-card" />
    <text x="55" y="25" class="actor-text">4. Tester</text>
  </g>
  <line x1="720" y1="60" x2="720" y2="450" class="lifeline" />

  <!-- 7. Reviewer -->
  <g transform="translate(795, 20)">
    <rect width="110" height="40" rx="6" class="focal-actor" />
    <text x="55" y="25" class="focal-actor-text">5. Reviewer</text>
  </g>
  <line x1="850" y1="60" x2="850" y2="450" class="lifeline" />

  <!-- Step 0: Classifier (y=90) -->
  <g transform="translate(0, 90)">
    <circle cx="85" cy="0" r="9" class="badge" />
    <text x="85" y="4" class="badge-text">0</text>
    <line x1="70" y1="0" x2="192" y2="0" class="msg-line" marker-end="url(#arrow3)" />
    <text x="100" y="-6" class="msg-text">thread-classify: 零工具极速分诊</text>
    <line x1="200" y1="18" x2="78" y2="18" class="msg-line" marker-end="url(#arrow3)" />
    <text x="85" y="32" class="msg-text">返回 {"complexity":"complex", "need_research":true}</text>
  </g>

  <!-- Step 1: Planner (y=155) -->
  <g transform="translate(0, 155)">
    <circle cx="85" cy="0" r="9" class="badge" />
    <text x="85" y="4" class="badge-text">1</text>
    <line x1="70" y1="0" x2="322" y2="0" class="msg-line" marker-end="url(#arrow3)" />
    <text x="100" y="-6" class="msg-text">thread-planner: 拆解架构约束与验收标准</text>
    <line x1="330" y1="18" x2="78" y2="18" class="msg-line" marker-end="url(#arrow3)" />
    <text x="85" y="32" font-family="sans-serif" font-size="10" font-weight="600" fill="#bf4520">截取契约: planner_summary = last_message</text>
  </g>

  <!-- Step 2: Researcher (y=220) -->
  <g transform="translate(0, 220)">
    <circle cx="85" cy="0" r="9" class="badge" />
    <text x="85" y="4" class="badge-text">2</text>
    <line x1="70" y1="0" x2="452" y2="0" class="msg-line" marker-end="url(#arrow3)" />
    <text x="100" y="-6" class="msg-text">thread-researcher: 仅带 planner 结论进行代码定位</text>
    <line x1="460" y1="18" x2="78" y2="18" class="msg-line" marker-end="url(#arrow3)" />
    <text x="85" y="32" font-family="sans-serif" font-size="10" font-weight="600" fill="#bf4520">截取契约: research_summary = last_message</text>
  </g>

  <!-- Step 3: Coder (y=285) -->
  <g transform="translate(0, 285)">
    <circle cx="85" cy="0" r="9" class="badge" />
    <text x="85" y="4" class="badge-text">3</text>
    <line x1="70" y1="0" x2="582" y2="0" class="msg-line" marker-end="url(#arrow3)" />
    <text x="100" y="-6" class="msg-text">thread-coder: 接收清晰摘要，在 DevSandbox 编码</text>
    <line x1="590" y1="18" x2="78" y2="18" class="msg-line" marker-end="url(#arrow3)" />
    <text x="85" y="32" font-family="sans-serif" font-size="10" font-weight="600" fill="#bf4520">截取契约: coder_summary (改动文件与接口清单)</text>
  </g>

  <!-- Step 4: Tester (y=350) -->
  <g transform="translate(0, 350)">
    <circle cx="85" cy="0" r="9" class="badge" />
    <text x="85" y="4" class="badge-text">4</text>
    <line x1="70" y1="0" x2="712" y2="0" class="msg-line" marker-end="url(#arrow3)" />
    <text x="100" y="-6" class="msg-text">thread-tester: 真实执行 pytest，隔离运行日志</text>
    <line x1="720" y1="18" x2="78" y2="18" class="msg-line" marker-end="url(#arrow3)" />
    <text x="85" y="32" font-family="sans-serif" font-size="10" font-weight="600" fill="#bf4520">截取契约: tester_summary (通过率与覆盖场景)</text>
  </g>

  <!-- Step 5: Reviewer (y=415) - Focal -->
  <g transform="translate(0, 415)">
    <circle cx="85" cy="0" r="9" class="focal-badge" />
    <text x="85" y="4" class="focal-badge-text">5</text>
    <line x1="70" y1="0" x2="842" y2="0" class="focal-msg-line" marker-end="url(#arrow3-focal)" />
    <text x="100" y="-6" class="focal-msg-text">thread-reviewer: 只读沙箱审查全部摘要</text>
    <line x1="850" y1="18" x2="78" y2="18" class="focal-msg-line" marker-end="url(#arrow3-focal)" />
    <text x="85" y="32" class="focal-msg-text">结构化决断: ReviewResult(approved=True, issues=[], security_notes=[])</text>
  </g>
</svg>