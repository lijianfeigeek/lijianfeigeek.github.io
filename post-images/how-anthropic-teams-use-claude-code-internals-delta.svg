<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Canvas Background & Outer Border -->
  <rect x="1" y="1" width="958" height="538" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" font-size="20" font-weight="700" fill="#0f172a">研发范式跃迁：传统散装开发 vs Claude Code 协同循环</text>
    <text x="0" y="42" font-size="13" fill="#64748b">从“设计文档-粗糙代码-放弃测试”到“伪代码引导-TDD 先行-自治排障”的工程重构</text>
  </g>

  <!-- Left Column: Before (传统割裂式研发流程) -->
  <g transform="translate(40, 76)">
    <rect x="0" y="0" width="425" height="340" rx="8" fill="#fff5f5" stroke="#fecaca" stroke-width="1.2" />
    <rect x="0" y="0" width="425" height="40" rx="8" fill="#fee2e2" />
    <text x="20" y="25" font-size="14" font-weight="700" fill="#991b1b">BEFORE: 传统割裂式工程流程 (高摩擦/易放弃)</text>

    <!-- Step B1 -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#991b1b">1. 痛苦的手工上下文搜集</text>
      <text x="14" y="42" font-size="11" fill="#7f1d1d">翻找陈旧 Wiki、问同事、逐层扒代码，平均耗费 30~60 分钟</text>
    </g>

    <!-- Step B2 -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#991b1b">2. 散装编码与测试债务积压</text>
      <text x="14" y="42" font-size="11" fill="#7f1d1d">Design Doc -&gt; Janky Code -&gt; 重构乏力 -&gt; 最终彻底放弃写测试</text>
    </g>

    <!-- Step B3 -->
    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#991b1b">3. 跨仓库依赖与排期死锁</text>
      <text x="14" y="42" font-size="11" fill="#7f1d1d">遇到其他团队的陌生代码库不敢碰，提工单陷入漫长排期等待</text>
    </g>

    <!-- Step B4 -->
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#991b1b">4. 线上故障盲目扫日志灭火</text>
      <text x="14" y="42" font-size="11" fill="#7f1d1d">高压下大海捞针，K8s 调度异常排查平均耗时 20 分钟以上</text>
    </g>
  </g>

  <!-- Right Column: After (Claude Code 驱动的协同循环) -->
  <g transform="translate(495, 76)">
    <rect x="0" y="0" width="425" height="340" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" />
    <rect x="0" y="0" width="425" height="40" rx="8" fill="#dcfce7" />
    <text x="20" y="25" font-size="14" font-weight="700" fill="#166534">AFTER: Claude Code 闭环协同范式 (高确定性/强敏捷)</text>

    <!-- Step A1 -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#15803d">1. CLAUDE.md 单点闪电导引</text>
      <text x="14" y="42" font-size="11" fill="#14532d">Agent 自动解析单体架构与数据依赖，毫秒级指引修改目标文件</text>
    </g>

    <!-- Step A2 -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#15803d">2. 伪代码反推与 TDD 先行闭环</text>
      <text x="14" y="42" font-size="11" fill="#14532d">Claude 输出测试用例 -&gt; 驱动实现 -&gt; 工程师定期 Check-in 审阅</text>
    </g>

    <!-- Step A3 -->
    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#15803d">3. 跨栈跨库直接自治解决</text>
      <text x="14" y="42" font-size="11" fill="#14532d">自然语言描述现象，Agent 在陌生 Rust/TS 仓库精确定位修补</text>
    </g>

    <!-- Step A4 -->
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="385" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1" />
      <text x="14" y="22" font-size="13" font-weight="700" fill="#15803d">4. 多模态堆栈推理与指令直出</text>
      <text x="14" y="42" font-size="11" fill="#14532d">喂入监控截图与报错日志，直出根因定位与一键修复脚本</text>
    </g>
  </g>

  <!-- Bottom: Changes Ledger (量化成效对比清册) -->
  <g transform="translate(40, 430)">
    <rect x="0" y="0" width="880" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="880" height="28" rx="8" fill="#f1f5f9" />
    <text x="24" y="19" font-size="12" font-weight="700" fill="#334155">CHANGES LEDGER · 核心工程量化收益清册</text>

    <!-- Metric 1 -->
    <g transform="translate(30, 36)">
      <text x="0" y="16" font-size="12" font-weight="600" fill="#0f172a">业务冷启动排障时间</text>
      <text x="0" y="34" font-size="11" fill="#64748b">10~15 分钟 -&gt; 3~5 分钟 (提速 300%)</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(250, 36)">
      <text x="0" y="16" font-size="12" font-weight="600" fill="#0f172a">晦涩算子调研耗时</text>
      <text x="0" y="34" font-size="11" fill="#64748b">Google 搜索 1 小时 -&gt; 15 分钟 (节省 80%)</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(470, 36)">
      <text x="0" y="16" font-size="12" font-weight="600" fill="#0f172a">广告素材装配速度</text>
      <text x="0" y="34" font-size="11" fill="#64748b">手工数小时 -&gt; 0.5 秒批量直出 100 组</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(680, 36)">
      <text x="0" y="16" font-size="12" font-weight="600" fill="#0f172a">测试覆盖与软件健壮性</text>
      <text x="0" y="34" font-size="11" fill="#64748b">从“放弃测试”转变为 100% TDD 驱动</text>
    </g>
  </g>
</svg>