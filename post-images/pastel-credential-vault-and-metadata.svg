<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="pastel-vault-title pastel-vault-desc">
  <title id="pastel-vault-title">Pastel 密钥保险库隔离传输与 IPA 元数据重构边界</title>
  <desc id="pastel-vault-desc">展示 Pastel 如何通过 Keychain 32 字节主密钥加密本地三份持久文件、经由匿名 stdin 管道传递凭据，并在打包阶段通过 PastelMetadata.plist 隔离 App Store 更新提示。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="960" height="468" fill="#f8fafc"/>

  <!-- Header Strip -->
  <rect x="0" y="0" width="960" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">凭据安全边界与“不再更新”元数据重写流</text>
  <text x="24" y="38" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SECURITY TOPOLOGY · KEYCHAIN + AES-256-GCM + ANONYMOUS STDIN PIPE + PLIST ISOLATION</text>

  <!-- Left Zone: Encrypted Storage Vault -->
  <rect x="24" y="68" width="288" height="332" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="90" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600">01 · AT-REST ENCRYPTION (AES-256-GCM)</text>

  <!-- Connectors inside Left Zone -->
  <path d="M 168 172 L 168 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 168 172 L 168 256 L 168 264" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

  <!-- Keychain Master Key Node -->
  <g transform="translate(40, 108)">
    <rect x="0" y="0" width="256" height="64" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.3"/>
    <text x="12" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" font-weight="600">macOS Keychain 唯一主密钥</text>
    <text x="12" y="44" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">32B SecRandom · ThisDeviceOnly</text>
  </g>

  <!-- Vault Files -->
  <g transform="translate(40, 196)">
    <rect x="0" y="0" width="256" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">credentials.vault (0600)</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">AAD: PastelCredentialVault:v1</text>
  </g>
  <g transform="translate(40, 264)">
    <rect x="0" y="0" width="256" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">sessions/&lt;sha256&gt;.json</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">pastel-session-aes-gcm-v1 (30d)</text>
  </g>
  <g transform="translate(40, 332)">
    <rect x="0" y="0" width="256" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">store-auth/&lt;mac-hash&gt;.enc</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Anisette/Cookies · No Password</text>
  </g>

  <!-- Middle Zone: Anonymous Stdin Pipe -->
  <rect x="336" y="68" width="280" height="332" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="90" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600">02 · EPHEMERAL IPC (ZERO ENV/ARGV)</text>

  <!-- Connector Left -> Middle -->
  <path d="M 296 140 L 352 140" fill="none" stroke="#bf4520" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
  <!-- Connectors Inside Middle -->
  <path d="M 476 180 L 476 212" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <path d="M 476 276 L 476 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g transform="translate(352, 108)">
    <rect x="0" y="0" width="248" height="72" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">匿名 stdin Pipe 注入（防 ps 泄露）</text>
    <text x="12" y="44" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">password + code + sessionKey</text>
    <text x="12" y="58" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">download-jobs.json 强制清空敏感字段</text>
  </g>

  <g transform="translate(352, 212)">
    <rect x="0" y="0" width="248" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">NativeWorker 并发读写管道</text>
    <text x="12" y="44" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">防大 SINF 负载阻塞死锁 · 16MB 上限</text>
  </g>

  <g transform="translate(352, 312)">
    <rect x="0" y="0" width="248" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">错误信息脱敏 + 孤儿进程自杀</text>
    <text x="12" y="44" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">safeErrorMessage → [redacted]</text>
    <text x="12" y="58" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">IPA_PARENT_PID 250ms 轮询退出</text>
  </g>

  <!-- Right Zone: IPA Metadata Contract -->
  <rect x="640" y="68" width="296" height="332" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="656" y="90" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600">03 · FINALIZE METADATA BRANCH</text>

  <!-- Connector Middle -> Right -->
  <path d="M 600 244 L 656 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Branching Connectors inside Right -->
  <path d="M 788 176 L 788 196 L 788 212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 788 276 L 788 308" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g transform="translate(656, 108)">
    <rect x="0" y="0" width="264" height="68" rx="6" fill="#f8fafc" stroke="#2d3142" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">normalizeAccountMetadata()</text>
    <text x="12" y="44" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">不触碰 _CodeSignature · 临时 ZIP 重写</text>
  </g>

  <g transform="translate(656, 212)">
    <rect x="0" y="0" width="264" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">标准模式：iTunesMetadata.plist</text>
    <text x="12" y="44" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">统一写入 apple-id / userName / AppleID</text>
  </g>

  <g transform="translate(656, 308)">
    <rect x="0" y="0" width="264" height="76" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="24" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">不再更新：PastelMetadata.plist</text>
    <text x="12" y="44" fill="#059669" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">输出 *_no-update.ipa 隐藏商店更新</text>
    <text x="12" y="58" fill="#475569" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Pastel 资料库兜底解析保留版本与账户</text>
  </g>

  <!-- Bottom Legend Strip -->
  <rect x="0" y="420" width="960" height="48" fill="#ffffff"/>
  <line x1="0" y1="420" x2="960" y2="420" stroke="#cbd5e1" stroke-width="1"/>
  <g transform="translate(24, 436)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#fff5f2" stroke="#bf4520" stroke-width="1.2"/>
    <text x="20" y="10" fill="#bf4520" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">硬件绑定密钥根</text>
  </g>
  <g transform="translate(172, 436)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="20" y="10" fill="#0284c7" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">匿名管道运行时密钥传递</text>
  </g>
  <g transform="translate(380, 436)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="20" y="10" fill="#059669" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">无损屏蔽 App Store 更新</text>
  </g>
  <text x="936" y="446" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">ZERO PLAINTEXT SECRETS</text>
</svg>
