<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="480" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-fingerprint-hybrid-defense-title ios-fingerprint-hybrid-defense-desc" id="ios-fingerprint-hybrid-defense-root">
        <title id="ios-fingerprint-hybrid-defense-title">端云协同混合设备指纹风控全景架构</title>
        <desc id="ios-fingerprint-hybrid-defense-desc">端侧多维立体探针、动态混淆传输管道与云端智能决策大脑协同构建的下一代混合指纹防御架构</desc>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-fingerprint-hybrid-defense-root { --color-paper:   #f8f9fa;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ios-fingerprint-hybrid-defense-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-fingerprint-hybrid-defense-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <marker id="ios-fingerprint-hybrid-defense-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ios-fingerprint-hybrid-defense-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
      </marker>
      <marker id="ios-fingerprint-hybrid-defense-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <pattern id="ios-fingerprint-hybrid-defense-dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <rect width="100%" height="100%" fill="url(#ios-fingerprint-hybrid-defense-dots)" opacity="0.6"/>

        <!-- Column 1: 端侧立体探针 -->
        <rect x="40" y="40" width="280" height="400" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="60" y="70" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13" letter-spacing="0.04em">端侧立体探针 (CLIENT LAYER)</text>

        <!-- Focal: DeviceCheck / App Attest -->
        <g transform="translate(60, 90)">
          <rect x="0" y="0" width="240" height="72" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="12" y="22" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">【硬件信任锚点】DeviceCheck</text>
          <text x="12" y="42" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11">Secure Enclave 硬件加密签名</text>
          <text x="12" y="60" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11">防 Hook 伪造 · 官方不可篡改</text>
        </g>

        <g transform="translate(60, 175)">
          <rect x="0" y="0" width="240" height="72" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="12" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">【底层非易失点位】Preboot</text>
          <text x="12" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">隐秘挂载路径与硬件元数据</text>
          <text x="12" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">穿透全盘抹机保持长效一致</text>
        </g>

        <g transform="translate(60, 260)">
          <rect x="0" y="0" width="240" height="72" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="12" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">【动态反 Hook】ARM64 SVC</text>
          <text x="12" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">内联 SVC 0x80 直接系统调用</text>
          <text x="12" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">绕过动态符号表指针劫持</text>
        </g>

        <g transform="translate(60, 345)">
          <rect x="0" y="0" width="240" height="72" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="12" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">【行为扰动】时钟与传感器</text>
          <text x="12" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">连续时钟周期微观时差采样</text>
          <text x="12" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">陀螺仪底噪与电量温控微扰</text>
        </g>

        <!-- Column 2: 安全传输通道 -->
        <g transform="translate(360, 160)">
          <rect x="0" y="0" width="200" height="160" rx="8" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2" stroke-opacity="0.25"/>
          <text x="20" y="32" fill="#2e5aa8" font-family="'Geist', sans-serif" font-weight="600" font-size="13">安全混淆管道 (PIPELINE)</text>
          <rect x="16" y="50" width="168" height="90" rx="4" fill="#2e5aa8" stroke="#2e5aa8" fill-opacity="0.05" stroke-opacity="0.2"/>
          <text x="28" y="74" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">端侧自研流加密</text>
          <text x="28" y="94" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">规避标准 CCCrypt 劫持</text>
          <text x="28" y="112" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">动态时钟混淆防重放</text>
          <text x="28" y="128" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">E2E 密码学信道</text>
        </g>

        <!-- Connectors: Column 1 -> Column 2 -->
        <path d="M 320 126 L 340 126 Q 350 126 350 140 L 350 240 L 360 240" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
        <path d="M 320 211 L 360 211" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
        <path d="M 320 296 L 360 296" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
        <path d="M 320 381 L 340 381 Q 350 381 350 360 L 350 260 L 360 260" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
        <path d="M 350 240 L 358 240" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-fingerprint-hybrid-defense-arrow-link)"/>

        <!-- Column 3: 云端决策大脑 -->
        <rect x="600" y="40" width="320" height="400" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <text x="620" y="70" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13" letter-spacing="0.04em">云端智能决策大脑 (RISK ENGINE)</text>

        <g transform="translate(620, 90)">
          <rect x="0" y="0" width="280" height="72" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="14" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">DeviceCheck 验签与 2-bit 查询</text>
          <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">调用 Apple 官方 API 校验 Token</text>
          <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">获取跨抹机 2-bit 持久风险标记</text>
        </g>

        <g transform="translate(620, 175)">
          <rect x="0" y="0" width="280" height="72" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="14" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">时序图谱与历史特征关联</text>
          <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">跨时间维度的硬件参数演化追踪</text>
          <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">识别黑产自动化改机抖动特征</text>
        </g>

        <g transform="translate(620, 260)">
          <rect x="0" y="0" width="280" height="72" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="14" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">模糊碰撞聚合算法 (Clustering)</text>
          <text x="14" y="42" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">多维稀疏特征余弦相似度匹配</text>
          <text x="14" y="60" fill="#5a6580" font-family="'Geist', sans-serif" font-size="11">无唯一明文 ID 下识别同一硬件</text>
        </g>

        <g transform="translate(620, 345)">
          <rect x="0" y="0" width="280" height="72" rx="4" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1.2" fill-opacity="0.05"/>
          <text x="14" y="22" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="12" font-weight="600">动态风险评分与路由处置</text>
          <text x="14" y="42" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11">放行 / 人脸核身 / 全域黑名单</text>
          <text x="14" y="60" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11">反哺更新 DeviceCheck 2-bit 状态</text>
        </g>

        <!-- Connectors: Column 2 -> Column 3 -->
        <path d="M 560 240 L 595 240" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-fingerprint-hybrid-defense-arrow-link)"/>
      </svg>
