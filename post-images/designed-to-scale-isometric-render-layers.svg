<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dts-layers-title dts-layers-desc" id="dts-layers-root">
  <title id="dts-layers-title">Designed to Scale 纯原生 SVG 等轴测渲染五层引擎栈</title>
  <desc id="dts-layers-desc">从声明式场景 DSL、多边形避障相机框选、2:1 数学等轴测投影与画家深度排序，到二分裁剪路径与实时 HSL 暗黑反转的五层无框架流水线。</desc>
  <defs>
    <style>
      #dts-layers-root { font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #0f172a; }
    </style>
    <pattern id="dts-dots-1" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="dts-arrow-down" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="dts-arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <!-- Paper Light Background -->
  <rect width="1000" height="580" fill="#f8fafc"/>
  <rect width="1000" height="580" fill="url(#dts-dots-1)" opacity="0.6"/>

  <!-- Header -->
  <text x="32" y="36" fill="#475569" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">LAYER STACK · ZERO-FRAMEWORK VANILLA SVG ENGINE · 784 KB BUNDLE</text>
  <text x="32" y="64" fill="#0f172a" font-size="22" font-weight="600">Designed to Scale 五层等轴测矢量渲染与物理仿真栈</text>

  <!-- Left margin pipeline direction indicator -->
  <line x1="60" y1="120" x2="60" y2="492" stroke="#475569" stroke-width="1.4" marker-end="url(#dts-arrow-down)"/>
  <rect x="20" y="276" width="80" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="295" fill="#0f172a" font-size="9" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">RENDER</text>
  <text x="60" y="310" fill="#475569" font-size="9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">445 STEPS ↓</text>

  <!-- L1: Declarative Scene DSL -->
  <g transform="translate(116, 100)">
    <rect x="0" y="0" width="852" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="16" y="14" width="56" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="44" y="28" fill="#475569" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">L1 · DSL</text>
    <text x="92" y="29" fill="#0f172a" font-size="15" font-weight="600">声明式场景拓扑与 445 步差量状态机</text>
    <text x="92" y="51" fill="#475569" font-size="11">10 类原生图元（block / db / device / crowd / queue / ring / zone / panel）· 支持 heat / dead / cpu 参数插值</text>
    <rect x="680" y="20" width="152" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="756" y="40" fill="#0284c7" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">40 lessons · diff tween</text>
  </g>

  <!-- Connector L1 -> L2 -->
  <line x1="542" y1="172" x2="542" y2="188" stroke="#475569" stroke-width="1.3" marker-end="url(#dts-arrow-down)"/>

  <!-- L2: Camera Framing & Polygon Collision Avoidance -->
  <g transform="translate(116, 188)">
    <rect x="0" y="0" width="852" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="16" y="14" width="56" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="44" y="28" fill="#475569" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">L2 · CAM</text>
    <text x="92" y="29" fill="#0f172a" font-size="15" font-weight="600">自动取景与四角 HUD 浮层多边形避障（planFor / cardClear）</text>
    <text x="92" y="51" fill="#475569" font-size="11">遍历四角停靠位（tr / br / tl / bl）与 0.05 步进缩放 · 射线法多边形碰撞检测 · 相机滞回防抖</text>
    <rect x="680" y="20" width="152" height="32" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="756" y="40" fill="#059669" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">0 overlap · viewBox</text>
  </g>

  <!-- Connector L2 -> L3 -->
  <line x1="542" y1="260" x2="542" y2="276" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dts-arrow-coral)"/>

  <!-- L3 (FOCAL): 2:1 Isometric Math & Painter's Depth Sort -->
  <g transform="translate(116, 276)">
    <rect x="0" y="0" width="852" height="76" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.6"/>
    <rect x="16" y="14" width="56" height="20" rx="3" fill="#bf4520"/>
    <text x="44" y="28" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">L3 · ISO</text>
    <text x="92" y="29" fill="#0f172a" font-size="15" font-weight="700">2:1 数学等轴测投影与画家遮挡深度排序（无 WebGL）</text>
    <text x="92" y="53" fill="#334155" font-size="11">投影公式 j(x,y,z) = [14(x+y), 7(x-y)-z] · 仿射矩阵 matrix() 构建三面体 · 按 cx - cy 实时重排 DOM 深度</text>
    <rect x="680" y="22" width="152" height="32" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
    <text x="756" y="42" fill="#bf4520" font-size="10" font-weight="700" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">FOCAL · sortDepth()</text>
  </g>

  <!-- Connector L3 -> L4 -->
  <line x1="542" y1="352" x2="542" y2="368" stroke="#bf4520" stroke-width="1.5" marker-end="url(#dts-arrow-coral)"/>

  <!-- L4: Edge Clipping & Packet Physics -->
  <g transform="translate(116, 368)">
    <rect x="0" y="0" width="852" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="16" y="14" width="56" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="44" y="28" fill="#475569" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">L4 · SIM</text>
    <text x="92" y="29" fill="#0f172a" font-size="15" font-weight="600">30 轮二分法边界裁剪与路径弧长数据包物理引擎</text>
    <text x="92" y="51" fill="#475569" font-size="11">Tr/Er 将连线精准截断在三维面片外缘 · getPointAtLength 驱动 12 类包（ping / poison / held）往返与爆裂</text>
    <rect x="680" y="20" width="152" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="756" y="40" fill="#0284c7" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">rAF · 50ms dt clamp</text>
  </g>

  <!-- Connector L4 -> L5 -->
  <line x1="542" y1="440" x2="542" y2="456" stroke="#475569" stroke-width="1.3" marker-end="url(#dts-arrow-down)"/>

  <!-- L5: Dynamic Theme & Canvas Typography -->
  <g transform="translate(116, 456)">
    <rect x="0" y="0" width="852" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="16" y="14" width="56" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="44" y="28" fill="#475569" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">L5 · SKIN</text>
    <text x="92" y="29" fill="#0f172a" font-size="15" font-weight="600">运行时 HSL 暗黑自动反转与离屏 Canvas 字体测宽</text>
    <text x="92" y="51" fill="#475569" font-size="11">pf()/uf() 自动映射暖纸色板至深色模式（零手工双套图）· 离屏 Canvas 精确测量 CJK / 阿拉伯语胶囊标签宽度</text>
    <rect x="680" y="20" width="152" height="32" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="756" y="40" fill="#059669" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">21 locales · RTL safe</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(116, 548)">
    <rect x="0" y="4" width="10" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="18" y="13" fill="#475569" font-size="10">标准渲染层</text>
    <rect x="116" y="4" width="10" height="10" rx="2" fill="#fff5f2" stroke="#bf4520" stroke-width="1.4"/>
    <text x="134" y="13" fill="#bf4520" font-size="10" font-weight="600">核心等轴测数学层（无 Three.js / WebGL）</text>
    <text x="852" y="13" fill="#64748b" font-size="10" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace">Source audit: designed-to-scale.vercel.app</text>
  </g>
</svg>
