<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ota-git-single-source-of-truth-sequence-title ota-git-single-source-of-truth-sequence-desc">
  <title id="ota-git-single-source-of-truth-sequence-title">Git 仓库作为单一真理源的 OTA 发布流水线时序</title>
  <desc id="ota-git-single-source-of-truth-sequence-desc">展示翻译管理平台经由 Git PR Review 合并后，通过 CI 打包推送到 S3/CloudFront 并由客户端拉取的完整时序</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
    </style>
  </defs>

  <rect width="960" height="360" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 5 Actor Columns: X = 100, 300, 500, 700, 880 -->
  <line x1="100" y1="56" x2="100" y2="330" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="300" y1="56" x2="300" y2="330" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="500" y1="56" x2="500" y2="330" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="700" y1="56" x2="700" y2="330" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="880" y1="56" x2="880" y2="330" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Actor Badges -->
  <g transform="translate(30, 16)">
    <rect width="140" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor">翻译管理平台</text>
  </g>

  <g transform="translate(230, 16)">
    <rect width="140" height="40" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor" fill="#9a3412">Git 仓库 (PR / CI)</text>
  </g>

  <g transform="translate(430, 16)">
    <rect width="140" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor">AWS S3 存储桶</text>
  </g>

  <g transform="translate(630, 16)">
    <rect width="140" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor">CloudFront CDN</text>
  </g>

  <g transform="translate(810, 16)">
    <rect width="140" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" class="seq-actor">终端 iOS 客户端</text>
  </g>

  <!-- Step 1: PR from Translation Platform -->
  <path d="M 100 84 L 300 84" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="294,81 300,84 294,87" fill="#4b5563"/>
  <text x="200" y="78" text-anchor="middle" class="text-code">1. 自动提 PR 提交译文更新</text>

  <!-- Step 2: Code Review in Git -->
  <g transform="translate(210, 104)">
    <rect width="180" height="38" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" class="text-code" font-weight="600" fill="#9a3412">2. 工程师审查与测试合并</text>
    <text x="90" y="30" text-anchor="middle" class="text-code" fill="#7c2d12">(坚守单一真理源防线)</text>
  </g>

  <!-- Step 3: CI Builds ZIP and Uploads to S3 -->
  <path d="M 300 164 L 500 164" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="494,161 500,164 494,167" fill="#10b981"/>
  <text x="400" y="158" text-anchor="middle" class="text-code" fill="#047857">3. CI 打包独立 Bundle ZIP 并推送到 S3</text>

  <!-- Step 4: S3 Syncs to CDN -->
  <path d="M 500 196 L 700 196" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="694,193 700,196 694,199" fill="#10b981"/>
  <text x="600" y="190" text-anchor="middle" class="text-code" fill="#047857">4. 边缘节点缓存生效，生成 manifest.json</text>

  <!-- Step 5: Client ETag Check -->
  <path d="M 880 234 L 700 234" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="706,231 700,234 706,237" fill="#4b5563"/>
  <text x="790" y="228" text-anchor="middle" class="text-code">5. 前台启动：ETag 快速比对清单</text>

  <!-- Step 6: 304 / Diff ZIP -->
  <path d="M 700 266 L 880 266" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="874,263 880,266 874,269" fill="#10b981"/>
  <text x="790" y="260" text-anchor="middle" class="text-code" fill="#047857">6. 仅下发增量变更的模块 ZIP</text>

  <!-- Step 7: Atomic swap -->
  <g transform="translate(730, 286)">
    <rect width="210" height="42" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="105" y="18" text-anchor="middle" class="text-code" font-weight="600" fill="#065f46">7. replaceItemAt 原子落盘</text>
    <text x="105" y="32" text-anchor="middle" class="text-code" fill="#047857">下次冷启零网络损耗生效</text>
  </g>
</svg>