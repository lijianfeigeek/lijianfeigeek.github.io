<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="paseo-multi-agent-three-orchestration-skills-title paseo-multi-agent-three-orchestration-skills-desc">
  <title id="paseo-multi-agent-three-orchestration-skills-title">Paseo 三大 Agent 协同技能范式</title>
  <desc id="paseo-multi-agent-three-orchestration-skills-desc">展示 /paseo-handoff 接力交割、/paseo-advisor 只读智囊与 /paseo-committee 辩论决策三大工作流</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Header Banner -->
  <g transform="translate(32, 24)">
    <rect width="896" height="40" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="25" class="title">PASEO 编排艺术：超越单兵作战的三大异构 AGENT 协作技能范式</text>
    <text x="880" y="25" text-anchor="end" class="tag">MULTI-AGENT COLLABORATION</text>
  </g>

  <!-- Column 1: /paseo-handoff -->
  <g transform="translate(32, 80)">
    <rect width="285" height="316" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="285" height="44" fill="#f8fafc" rx="8" />
    <rect y="36" width="285" height="8" fill="#f8fafc" />
    <line x1="0" y1="44" x2="285" y2="44" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="27" class="title">范式 1：/paseo-handoff</text>
    <text x="269" y="27" text-anchor="end" class="tag">接力交割</text>

    <!-- Sub-cards -->
    <g transform="translate(12, 56)">
      <rect width="261" height="74" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">规划型 Agent (Claude Opus)</text>
      <text x="12" y="42" class="desc">梳理系统架构、定位关键模块与边界</text>
      <text x="12" y="60" class="tag">输出: 验收指标与自包含 Briefing</text>
    </g>

    <!-- Transition Arrow -->
    <path d="M 142 130 L 142 160" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <g transform="translate(12, 160)">
      <rect width="261" height="74" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">实现型 Agent (Codex / Qwen)</text>
      <text x="12" y="42" class="desc">在隔离 Worktree 中专注搬砖写码</text>
      <text x="12" y="60" class="tag">执行: 密集实现与单元测试跑通</text>
    </g>

    <g transform="translate(12, 246)">
      <rect width="261" height="58" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="20" class="tag" style="font-weight:700;">价值壁垒：长程任务无损流转</text>
      <text x="12" y="38" class="desc">上下文不退化，高思考力与高代码力互补</text>
    </g>
  </g>

  <!-- Column 2: /paseo-advisor (Core Focus) -->
  <g transform="translate(337, 80)">
    <rect width="286" height="316" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="286" height="44" fill="#fff5f5" rx="8" />
    <rect y="36" width="286" height="8" fill="#fff5f5" />
    <line x1="0" y1="44" x2="286" y2="44" stroke="#fed7d7" stroke-width="1" />
    <text x="16" y="27" class="coral-title">范式 2：/paseo-advisor</text>
    <text x="270" y="27" text-anchor="end" class="coral-tag">只读智囊</text>

    <g transform="translate(12, 56)">
      <rect width="262" height="74" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">主力 Agent (进行中)</text>
      <text x="12" y="42" class="desc">负责主线编码，遇到疑难分歧与盲区</text>
      <text x="12" y="60" class="coral-tag">发出: 咨询请求与上下文切片</text>
    </g>

    <!-- Bi-directional Arrow -->
    <path d="M 143 130 L 143 160" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

    <g transform="translate(12, 160)">
      <rect width="262" height="74" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <text x="12" y="22" class="coral-title" style="font-size:12px;">外脑智囊 (异构模型)</text>
      <text x="12" y="42" class="desc">强制 'No-edits' 只读权限与旁观者视角</text>
      <text x="12" y="60" class="coral-tag">提供: 第二意见与代码洁癖审查</text>
    </g>

    <g transform="translate(12, 246)">
      <rect width="262" height="58" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="20" class="tag" style="font-weight:700;">价值壁垒：打破单模型幻觉死循环</text>
      <text x="12" y="38" class="desc">避免单一 Agent 在错误逻辑树上越陷越深</text>
    </g>
  </g>

  <!-- Column 3: /paseo-committee -->
  <g transform="translate(643, 80)">
    <rect width="285" height="316" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="285" height="44" fill="#f8fafc" rx="8" />
    <rect y="36" width="285" height="8" fill="#f8fafc" />
    <line x1="0" y1="44" x2="285" y2="44" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="27" class="title">范式 3：/paseo-committee</text>
    <text x="269" y="27" text-anchor="end" class="tag">双星辩论</text>

    <g transform="translate(12, 56)">
      <rect width="261" height="74" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">Agent A (Claude) 提出方案</text>
      <text x="12" y="42" class="desc">构建架构原型并给出假设与推理依据</text>
      <text x="12" y="60" class="tag">输出: 候选方案提案 A</text>
    </g>

    <!-- Transition Arrow -->
    <path d="M 142 130 L 142 160" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <g transform="translate(12, 160)">
      <rect width="261" height="74" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">Agent B (Codex) 交叉挑刺</text>
      <text x="12" y="42" class="desc">寻找边界破绽、性能漏洞与并发盲区</text>
      <text x="12" y="60" class="tag">输出: 极端对抗性反驳意见</text>
    </g>

    <g transform="translate(12, 246)">
      <rect width="261" height="58" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="20" class="tag" style="font-weight:700;">收敛产物：高置信度共识决议</text>
      <text x="12" y="38" class="desc">交叉收敛，产出无破绽的最终执行蓝图</text>
    </g>
  </g>
</svg>