<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="macbrow-blocked-apps-security-perimeter-title macbrow-blocked-apps-security-perimeter-desc" id="macbrow-blocked-apps-security-perimeter-root">
      <title id="macbrow-blocked-apps-security-perimeter-title">macbrow 安全防线：严禁触碰的应用黑名单隔离架构</title>
      <desc id="macbrow-blocked-apps-security-perimeter-desc">对终端开发、系统设置、虚拟化容器与密码凭据四大敏感应用类别的强制硬编码拦截边界</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #macbrow-blocked-apps-security-perimeter-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #macbrow-blocked-apps-security-perimeter-root text { font-family: "Geist", -apple-system, sans-serif; }
      #macbrow-blocked-apps-security-perimeter-root .mono { font-family: "Geist Mono", monospace; }
      #macbrow-blocked-apps-security-perimeter-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
