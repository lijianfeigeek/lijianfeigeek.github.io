            <text x="10" y="19" font-size="11" font-weight="500" fill="#2d3142">• Ghostty / Warp</text>
          </g>
          <g transform="translate(12, 144)">
            <rect x="0" y="0" width="176" height="30" rx="3" fill="#f8f9fa"/>
            <text x="10" y="19" font-size="11" font-weight="500" fill="#2d3142">• Xcode / VSCode</text>
          </g>

