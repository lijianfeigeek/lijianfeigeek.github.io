            <text x="10" y="19" font-size="11" font-weight="500" fill="#bf4520">• Keychain Access (钥匙串)</text>
          </g>
          <g transform="translate(12, 106)">
            <rect x="0" y="0" width="186" height="30" rx="3" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="19" font-size="11" font-weight="500" fill="#bf4520">• 1Password</text>
          </g>
          <g transform="translate(12, 144)">
            <rect x="0" y="0" width="186" height="30" rx="3" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.2"/>
            <text x="10" y="19" font-size="11" font-weight="500" fill="#bf4520">• Bitwarden / KeePass</text>
