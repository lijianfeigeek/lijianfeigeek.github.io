          <rect x="0" y="0" width="200" height="28" rx="8" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">ZONE 03: VIRTUALIZATION</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">虚拟化与容器平台</text>

          <g transform="translate(12, 68)">
