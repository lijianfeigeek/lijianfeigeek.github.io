        <g transform="translate(30, 40)">
          <rect x="0" y="0" width="200" height="240" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
          <rect x="0" y="0" width="200" height="28" rx="8" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">ZONE 01: TERMINAL</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">终端与开发工具</text>
          
          <g transform="translate(12, 68)">
            <rect x="0" y="0" width="176" height="30" rx="3" fill="#f8f9fa"/>
            <text x="10" y="19" font-size="11" font-weight="500" fill="#2d3142">• Terminal / iTerm2</text>
          </g>
