          <rect x="0" y="0" width="210" height="28" rx="8" fill="#bf4520" fill-opacity="0.1"/>
          <text x="12" y="18" font-size="11" font-weight="700" fill="#bf4520" class="mono">ZONE 04: SECRETS (FOCAL)</text>
