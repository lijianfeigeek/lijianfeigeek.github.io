          <rect x="0" y="0" width="200" height="28" rx="8" fill="#f8f9fa"/>
          <text x="12" y="18" font-size="11" font-weight="600" fill="#2d3142" class="mono">ZONE 02: SYSTEM</text>
          <text x="12" y="52" font-size="13" font-weight="600" fill="#2d3142">系统设置与运维</text>

          <g transform="translate(12, 68)">
            <rect x="0" y="0" width="176" height="30" rx="3" fill="#f8f9fa"/>
