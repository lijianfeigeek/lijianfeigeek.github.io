      <marker id="macbrow-blocked-apps-security-perimeter-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="macbrow-blocked-apps-security-perimeter-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
