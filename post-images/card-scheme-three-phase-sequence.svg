<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-three-phase-sequence-title card-scheme-three-phase-sequence-desc" id="card-scheme-three-phase-sequence-root">
        <title id="card-scheme-three-phase-sequence-title">国际信用卡全生命周期：授权、清分与结算三大阶段时序</title>
        <desc id="card-scheme-three-phase-sequence-desc">联机授权（毫秒级预占）、离线清分（批量对账外汇折算）与资金净额结算（法币划转）全链路时序交互</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-three-phase-sequence-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-three-phase-sequence-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-three-phase-sequence-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-three-phase-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-three-phase-sequence-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-three-phase-sequence-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- Lifelines: 5 Participants -->
        <!-- P1: Cardholder (x=100) -->
        <g transform="translate(40, 20)">
          <rect x="0" y="0" width="120" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="60" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">持卡人 (User)</text>
        </g>
        <line x1="100" y1="52" x2="100" y2="600" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- P2: Merchant (x=280) -->
        <g transform="translate(220, 20)">
          <rect x="0" y="0" width="120" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="60" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">商户 (Merchant)</text>
        </g>
        <line x1="280" y1="52" x2="280" y2="600" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- P3: Acquirer (x=460) -->
        <g transform="translate(400, 20)">
          <rect x="0" y="0" width="120" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="60" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">收单行 (Acquirer)</text>
        </g>
        <line x1="460" y1="52" x2="460" y2="600" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- P4: Card Scheme (x=640) Focal -->
        <g transform="translate(580, 20)">
          <rect x="0" y="0" width="120" height="32" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.06"/>
          <text x="60" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">卡组织 (Scheme)</text>
        </g>
        <line x1="640" y1="52" x2="640" y2="600" stroke="#bf4520" stroke-opacity="0.3" stroke-dasharray="3 3"/>

        <!-- P5: Issuer (x=820) -->
        <g transform="translate(760, 20)">
          <rect x="0" y="0" width="120" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="60" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">发卡行 (Issuer)</text>
        </g>
        <line x1="820" y1="52" x2="820" y2="600" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- PHASE 1: 联机授权 (Authorization) -->
        <g transform="translate(40, 70)">
          <rect x="0" y="0" width="880" height="170" rx="6" fill="#f8f9fa" stroke="rgba(46,90,168,0.2)"/>
          <text x="16" y="22" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">阶段一：联机授权 (AUTHORIZATION) · 毫秒级在线发生</text>
        </g>

        <!-- Message 1: User -> Merchant -->
        <path d="M 100 115 L 275 115" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#card-scheme-three-phase-sequence-arrow)"/>
        <text x="180" y="108" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">1. 下单提交卡号与安全码</text>

        <!-- Message 2: Merchant -> Acquirer -->
        <path d="M 280 135 L 455 135" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#card-scheme-three-phase-sequence-arrow)"/>
        <text x="370" y="128" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">2. 上送联机授权请求 (1100 / 0100)</text>

        <!-- Message 3: Acquirer -> Scheme -->
        <path d="M 460 155 L 635 155" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-three-phase-sequence-arrow-link)"/>
        <text x="550" y="148" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">3. 专网转发授权请求</text>

        <!-- Message 4: Scheme -> Issuer -->
        <path d="M 640 175 L 815 175" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-three-phase-sequence-arrow-link)"/>
        <text x="730" y="168" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">4. 寻径发卡行 (验证CVV/额度预占)</text>

        <!-- Message 5: Issuer -> Scheme -> Acquirer -> Merchant (Approved) -->
        <path d="M 820 205 L 645 205" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#card-scheme-three-phase-sequence-arrow-accent)"/>
        <text x="730" y="198" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">5. 授权批准应答 (1110 / Auth Code)</text>

        <path d="M 640 225 L 285 225" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#card-scheme-three-phase-sequence-arrow)"/>
        <text x="460" y="218" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">6. 通知商户交易成功 · 打印签购单 (未真实扣款)</text>

        <!-- PHASE 2: 离线清分 (Clearing) -->
        <g transform="translate(40, 260)">
          <rect x="0" y="0" width="880" height="170" rx="6" fill="#ffffff" stroke="rgba(191,69,32,0.2)"/>
          <text x="16" y="22" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">阶段二：离线清分 (CLEARING) · T+1 日终批量数据对账与外汇折算</text>
        </g>

        <!-- Message 7: Merchant -> Acquirer -->
        <path d="M 280 305 L 455 305" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#card-scheme-three-phase-sequence-arrow)"/>
        <text x="370" y="298" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">7. 日终打批上送请款文件 (Presentment)</text>

        <!-- Message 8: Acquirer -> Scheme -->
        <path d="M 460 330 L 635 330" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-three-phase-sequence-arrow-link)"/>
        <text x="550" y="323" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">8. 批量上传清分明细 (1240 消息集合)</text>

        <!-- Message 9: Scheme Internal Engine -->
        <g transform="translate(560, 345)">
          <rect x="0" y="0" width="160" height="34" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.06"/>
          <text x="80" y="16" fill="#bf4520" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">卡组织多边清算引擎</text>
          <text x="80" y="28" fill="#5a6580" font-family="'Geist', sans-serif" font-size="9" text-anchor="middle">格式清洗 · 汇率折算 · 轧差对冲</text>
        </g>

        <!-- Message 10: Scheme -> Issuer -->
        <path d="M 640 400 L 815 400" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-three-phase-sequence-arrow-link)"/>
        <text x="730" y="393" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">9. 下发发卡行请款明细与扣账指令</text>

        <!-- PHASE 3: 资金结算 (Settlement) -->
        <g transform="translate(40, 450)">
          <rect x="0" y="0" width="880" height="150" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="16" y="22" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">阶段三：资金结算 (SETTLEMENT) · 央行/清算行净额法币划转</text>
        </g>

        <!-- Message 11: Scheme Netting Report -->
        <path d="M 640 495 L 815 495" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#card-scheme-three-phase-sequence-arrow)"/>
        <text x="730" y="488" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">10. 发卡行向清算结算行划拨净应付额</text>

        <!-- Message 12: Settlement to Acquirer -->
        <path d="M 640 530 L 465 530" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-three-phase-sequence-arrow-link)"/>
        <text x="550" y="523" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">11. 清算行划拨净应收至收单行结算户</text>

        <!-- Message 13: Acquirer Pay Merchant -->
        <path d="M 460 565 L 285 565" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#card-scheme-three-phase-sequence-arrow-accent)"/>
        <text x="370" y="558" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">12. 收单行扣除 MDR 后打款至商户账户</text>
      </svg>
