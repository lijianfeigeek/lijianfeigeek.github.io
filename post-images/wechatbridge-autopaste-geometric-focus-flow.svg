<svg width="960" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="wb-focus-title wb-focus-desc">
  <title id="wb-focus-title">AutoPaste AX 辅助功能树底端几何定位与硬件级按键注入管线</title>
  <desc id="wb-focus-desc">展示通过 macOS Accessibility API 遍历窗口控件、几何定位物理位置最底端输入框并注入硬件键码的双阶段自动化投递流程。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="500" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">AutoPaste 底端几何定位与双阶段物理按键注入</text>
    <text class="subtitle" x="0" y="20">穿透 Electron / Webview 焦点陷阱，无需针对各 App 编写私有脆弱选择器</text>
  </g>

  <!-- Flow Steps (7 stages) -->
  <!-- Step 1: Activate -->
  <g transform="translate(48, 86)">
    <rect width="170" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="22">Stage 1: 唤醒并置顶</text>
    <g transform="translate(14, 34)">
      <rect width="142" height="100" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">NSWorkspace</text>
        <text class="mono" fill="#2563eb" x="0" y="14">openApplication</text>
        <text class="card-body" x="0" y="30">• 启动或置顶目标 App</text>
        <text class="card-body" x="0" y="46">• waitUntilFrontmost</text>
        <text class="card-body" x="0" y="62">• restoreWindows 还原</text>
      </g>
    </g>
  </g>

  <!-- Step 2: AX Tree Traversal -->
  <g transform="translate(242, 86)">
    <rect width="210" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="22">Stage 2: 辅助功能树广度优先</text>
    <g transform="translate(14, 34)">
      <rect width="182" height="100" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">AXUIElement 遍历</text>
        <text class="mono" fill="#2563eb" x="0" y="14">editableElements(in: win)</text>
        <text class="card-body" x="0" y="30">• 筛选可编辑输入控件</text>
        <text class="card-body" x="0" y="46">• kAXTextAreaRole</text>
        <text class="card-body" x="0" y="62">• kAXTextFieldRole</text>
      </g>
    </g>
  </g>

  <!-- Step 3: Bottom-most Geometry MaxY -->
  <g transform="translate(476, 86)">
    <rect width="220" height="150" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text class="box-title" fill="#c2410c" x="14" y="22">Stage 3: 几何学底端优先 (核心)</text>
    <g transform="translate(14, 34)">
      <rect width="192" height="100" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" fill="#ea580c" x="0" y="0">max(by: frame.maxY)</text>
        <text class="card-body" x="0" y="16">• 计算各控件在屏幕的 CGRect</text>
        <text class="card-body" x="0" y="32">• 挑选物理 Y 坐标最大的元素</text>
        <text class="card-body" x="0" y="48">• 精准命中窗口最底端输入框</text>
        <text class="mono" fill="#c2410c" x="0" y="66">kAXFocusedAttribute = true</text>
      </g>
    </g>
  </g>

  <!-- Step 4: Settle &amp; Focus -->
  <g transform="translate(720, 86)">
    <rect width="192" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="22">Stage 4: DOM 焦点平抑</text>
    <g transform="translate(14, 34)">
      <rect width="164" height="100" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 14)">
        <text class="card-title" x="0" y="0">focusSettle 等待</text>
        <text class="mono" fill="#475569" x="0" y="14">Thread.sleep(150ms)</text>
        <text class="card-body" x="0" y="30">• 给予 Electron / WebKit</text>
        <text class="card-body" x="0" y="46">  充足时间将光标吸附入框</text>
        <text class="card-body" x="0" y="62">• 避免按键丢失吞没</text>
      </g>
    </g>
  </g>

  <!-- Connectors Row 1 -->
  <path d="M 218 161 L 242 161" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="242,161 236,157 236,165" fill="#94a3b8"/>

  <path d="M 452 161 L 476 161" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="476,161 470,157 470,165" fill="#94a3b8"/>

  <path d="M 696 161 L 720 161" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="720,161 714,157 714,165" fill="#94a3b8"/>

  <!-- Row 2: Two-Phase Pasting Pipeline -->
  <g transform="translate(48, 260)">
    <rect width="864" height="200" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text class="box-title" fill="#1e40af" x="20" y="24">Stage 5: 硬件级物理键码与双阶段粘贴编排 (Two-Phase Pasting)</text>

    <!-- Phase A: Prompt -->
    <g transform="translate(20, 40)">
      <rect width="250" height="140" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">Phase A: 场景提示词注入</text>
        <text class="card-body" x="0" y="18">• 将 Scene Prompt 写入通用剪贴板</text>
        <text class="mono" fill="#2563eb" x="0" y="34">virtualKey: 0x09 (ANSI V)</text>
        <text class="card-body" x="0" y="52">• 触发 maskCommand + cghidEventTap</text>
        <text class="card-body" x="0" y="70">• 硬件扫描码无关用户输入法布局</text>
        <text class="mono" fill="#15803d" x="0" y="92">STEP 1: 文本提示词瞬间上屏</text>
      </g>
    </g>

    <!-- Delay Gate -->
    <g transform="translate(294, 40)">
      <rect width="250" height="140" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#b45309" x="0" y="0">betweenPastes 缓冲防冲突</text>
        <text class="mono" fill="#b45309" x="0" y="18">Thread.sleep(450ms)</text>
        <text class="card-body" x="0" y="36">• 关键缓冲：为目标 AI 客户端</text>
        <text class="card-body" x="0" y="52">  留出解析提示词与 DOM 渲染时延</text>
        <text class="card-body" x="0" y="68">• 杜绝“文件覆盖文字”灾难</text>
        <text class="mono" fill="#b45309" x="0" y="92">GUARD: 彻底杜绝时序竞态</text>
      </g>
    </g>

    <!-- Phase B: Archive File -->
    <g transform="translate(568, 40)">
      <rect width="276" height="140" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">Phase B: 聊天记录 ZIP 挂载</text>
        <text class="card-body" x="0" y="18">• 将 ZIP 文件 URL 写入 FilePasteboard</text>
        <text class="mono" fill="#2563eb" x="0" y="34">再次发送 0x09 模拟 ⌘V</text>
        <text class="card-body" x="0" y="52">• 目标 AI 识别文件并将其挂载为附件</text>
        <text class="card-body" x="0" y="70">• 完美形成“提示词 + 上下文”复合输入</text>
        <text class="mono" fill="#15803d" x="0" y="92">STEP 2: 聊天归档无缝附着在下方</text>
      </g>
    </g>

    <!-- Connectors inside Row 2 -->
    <path d="M 270 110 L 294 110" stroke="#93c5fd" stroke-width="1.5"/>
    <polygon points="294,110 288,106 288,114" fill="#93c5fd"/>

    <path d="M 544 110 L 568 110" stroke="#93c5fd" stroke-width="1.5"/>
    <polygon points="568,110 562,106 562,114" fill="#93c5fd"/>
  </g>

  <!-- Connecting Row 1 Step 4 down to Row 2 -->
  <path d="M 816 236 L 816 248 L 480 248 L 480 260" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <polygon points="480,260 476,254 484,254" fill="#94a3b8"/>
</svg>