<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="ivyclaw-ro-sandbox-title ivyclaw-ro-sandbox-desc">
  <title id="ivyclaw-ro-sandbox-title">物理级只读沙箱加固与内存流式克隆管线</title>
  <desc id="ivyclaw-ro-sandbox-desc">从可读写开发沙箱通过宿主内存管道流式导出tar并解包，结合Linux内核级chmod a-w剥夺写权限的硬隔离防御</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-card { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 4; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow4-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
  </defs>

  <rect width="960" height="420" class="bg" />

  <!-- 3 Stages: Left = Dev Sandbox, Middle = Host Relay, Right = RO Sandbox -->
  <!-- Box 1: Dev Sandbox (x=40, y=40, w=270, h=340) -->
  <g transform="translate(40, 40)">
    <rect width="270" height="340" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 42 L 0 42 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="26" class="text-title">1. 开发/测试沙箱 (DevSandbox)</text>

    <g transform="translate(14, 54)">
      <rect width="242" height="64" class="pill" />
      <text x="10" y="20" class="text-subtitle">容器状态：活跃读写 (rw)</text>
      <text x="10" y="38" class="text-muted">tmpfs /workdir (size=512M, uid=1000)</text>
      <text x="10" y="52" class="text-muted">Coder 与 Tester 生成代码与真实单测</text>
    </g>

    <g transform="translate(14, 130)">
      <rect width="242" height="96" class="pill" />
      <text x="10" y="20" class="text-subtitle">极限制约参数</text>
      <text x="10" y="38" class="text-body">• --network none (物理切断外网)</text>
      <text x="10" y="56" class="text-body">• --cap-drop ALL (丢弃全部特权)</text>
      <text x="10" y="74" class="text-body">• --pids-limit 128 (防御Fork炸弹)</text>
      <text x="10" y="90" class="text-body">• 严格 CPU/内存 Quota 限制</text>
    </g>

    <g transform="translate(14, 238)">
      <rect width="242" height="86" class="pill" />
      <text x="10" y="20" class="text-subtitle">用完即弃 (Throwaway)</text>
      <text x="10" y="38" class="text-muted">任务退出无论成功或异常，容器立刻强制销毁，彻底杜绝数据在租户间残留</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="310" y1="210" x2="338" y2="210" class="line" marker-end="url(#arrow4)" />

  <!-- Box 2: Host Memory Relay (Center: x=340, y=40, w=280, h=340) -->
  <g transform="translate(340, 40)">
    <rect width="280" height="340" rx="8" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 42 L 0 42 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="26" class="text-title">2. 宿主机中转管道 (零磁盘落盘)</text>

    <g transform="translate(14, 54)">
      <rect width="252" height="110" class="pill" />
      <text x="10" y="20" class="text-subtitle">内存管道流式导出与解包</text>
      <text x="10" y="40" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">docker exec tar -C workdir -cf - .</text>
      <text x="10" y="58" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#bf4520">│ (pipe in-memory)</text>
      <text x="10" y="78" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">docker exec -i ro_name tar -C .</text>
      <text x="10" y="98" class="text-muted">数据全程在内存管道中秒级复制</text>
    </g>

    <g transform="translate(14, 176)">
      <rect width="252" height="148" class="pill" />
      <text x="10" y="22" class="text-subtitle">工程优势与隔离保障</text>
      <text x="10" y="42" class="text-body">• 零磁盘临时文件落盘，消除 IO 瓶颈</text>
      <text x="10" y="60" class="text-body">• 避免宿主机残留未脱敏业务代码</text>
      <text x="10" y="78" class="text-body">• 毫秒级瞬时同步整个工作区结构</text>
      <text x="10" y="96" class="text-body">• 保持文件的原始权限与符号链接</text>
      <text x="10" y="116" font-family="sans-serif" font-size="10" font-weight="600" fill="#bf4520">为物理级写权限剥夺做好准备</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="620" y1="210" x2="648" y2="210" class="focal-line" marker-end="url(#arrow4-focal)" />

  <!-- Box 3: RO Sandbox (x=650, y=40, w=270, h=340) - Focal -->
  <g transform="translate(650, 40)">
    <rect width="270" height="340" rx="8" class="focal-card" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 42 L 0 42 Z" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1" />
    <text x="14" y="26" class="text-focal-title">3. 只读沙箱副本 (RO_Sandbox)</text>

    <g transform="translate(14, 54)">
      <rect width="242" height="84" class="focal-pill" />
      <text x="10" y="20" class="text-subtitle" fill="#bf4520">内核级写权限硬剥夺</text>
      <text x="10" y="38" font-family="ui-monospace, monospace" font-size="9" fill="#991b1b">docker exec -u 1000:1000 chmod -R a-w</text>
      <text x="10" y="58" class="text-body">• 所有文件对 uid=1000 变为绝对只读</text>
      <text x="10" y="74" class="text-body">• 杜绝越狱注入修改真实代码</text>
    </g>

    <g transform="translate(14, 150)">
      <rect width="242" height="114" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
      <text x="10" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">防御验证：攻击完全阻断</text>
      <text x="10" y="38" font-family="ui-monospace, monospace" font-size="9" fill="#b91c1c">echo 'bad' &gt; app/main.py</text>
      <text x="10" y="56" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">➜ Permission denied</text>
      <text x="10" y="74" class="text-body">不依赖大模型对提示词的自觉性</text>
      <text x="10" y="92" class="text-body">从物理层面守卫审查纯粹性</text>
    </g>

    <g transform="translate(14, 276)">
      <rect width="242" height="50" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="10" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#166534">可扩展沙箱运行时抽象</text>
      <text x="10" y="34" font-family="sans-serif" font-size="10" fill="#15803d">无缝切换 runc / runsc (gVisor) / kata</text>
    </g>
  </g>
</svg>