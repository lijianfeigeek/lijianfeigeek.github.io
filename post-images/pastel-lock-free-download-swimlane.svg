<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="pastel-swimlane-title pastel-swimlane-desc">
  <title id="pastel-swimlane-title">Pastel 无锁并发下载、断点续传与本地封装时序泳道图</title>
  <desc id="pastel-swimlane-desc">展示 Pastel 如何通过三级 DownloadPermitPool 隔离认证、传输与打包队列，并在 prepareNative 释放文件锁后由 Swift URLSession 完成断点续传与 401/403 签名自愈。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Paper Light Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="#f8fafc"/>

  <!-- Header Strip -->
  <rect x="0" y="0" width="960" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <text x="20" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700">两段式无锁下载流水线：认证锁释放、三路 CDN 续传与 401/403 URL 自愈</text>
  <text x="20" y="38" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SWIMLANE · 4 ACTORS · AUTH(1) → TRANSFERS(3) → VERIFY(MD5) → PACKAGING(1)</text>

  <!-- Lane Backgrounds -->
  <rect x="0" y="48" width="960" height="104" fill="#f8fafc"/>
  <rect x="0" y="152" width="960" height="104" fill="#ffffff"/>
  <rect x="0" y="256" width="960" height="104" fill="#f8fafc"/>
  <rect x="0" y="360" width="960" height="108" fill="#ffffff"/>

  <!-- Lane Dividers -->
  <line x1="140" y1="48" x2="140" y2="468" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="0" y1="152" x2="960" y2="152" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="256" x2="960" y2="256" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="468" x2="960" y2="468" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane Titles -->
  <g transform="translate(16, 82)">
    <text x="0" y="0" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">DownloadManager</text>
    <text x="0" y="16" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">UI / Journal</text>
  </g>
  <g transform="translate(16, 186)">
    <text x="0" y="0" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">NativeEngine</text>
    <text x="0" y="16" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Permit Pools</text>
  </g>
  <g transform="translate(16, 290)">
    <text x="0" y="0" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">Node + Helper</text>
    <text x="0" y="16" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Ephemeral IPC</text>
  </g>
  <g transform="translate(16, 396)">
    <text x="0" y="0" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">CDN 与本地磁盘</text>
    <text x="0" y="16" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">HTTPS / Atomic FS</text>
  </g>

  <!-- Connectors Drawn Behind Nodes -->
  <!-- 1. Start -> Auth Permit -->
  <path d="M 228 128 L 228 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 2. Auth Permit -> prepareNative -->
  <path d="M 228 232 L 228 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 3. prepareNative returns plan & releases flock -> Transfers Permit -->
  <path d="M 308 304 L 352 304 L 352 200 L 380 200" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="314" y="244" width="76" height="16" rx="2" fill="#f8fafc"/>
  <text x="352" y="255" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">FREE FLOCK</text>

  <!-- 4. Transfers Permit -> URLSession Range/If-Range -->
  <path d="M 464 232 L 464 380" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arrow-link)"/>
  <rect x="424" y="294" width="80" height="16" rx="2" fill="#f8fafc"/>
  <text x="464" y="305" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">CONCURRENT 3X</text>

  <!-- 5. 401/403 Refresh Loop back to prepareNative -->
  <path d="M 380 412 L 284 412 L 284 344" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <rect x="292" y="404" width="84" height="16" rx="2" fill="#ffffff"/>
  <text x="334" y="415" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">401/403 REFRESH</text>

  <!-- 6. MD5 Verify -> Packaging Permit -->
  <path d="M 656 380 L 656 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7. Packaging Permit -> finalizeNative -->
  <path d="M 744 200 L 764 200 L 764 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 8. finalizeNative -> Atomic rename -->
  <path d="M 804 340 L 804 380" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 9. Atomic rename -> Journal Done -->
  <path d="M 888 412 L 916 412 L 916 100 L 892 100" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Lane 1 Nodes: DownloadManager -->
  <g transform="translate(156, 68)">
    <rect x="0" y="0" width="144" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">任务持久化与派发</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">SavedJob + generation UUID</text>
  </g>
  <g transform="translate(744, 68)">
    <rect x="0" y="0" width="144" height="60" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">状态收敛与唤醒队列</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">resume awaitingSession</text>
  </g>

  <!-- Lane 2 Nodes: NativeDownloadEngine -->
  <g transform="translate(156, 172)">
    <rect x="0" y="0" width="144" height="60" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">authentication(1)</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">串行准备鉴权信号量</text>
  </g>
  <g transform="translate(384, 172)">
    <rect x="0" y="0" width="160" height="60" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">transfers(3) 并发传输</text>
    <text x="12" y="40" fill="#0284c7" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">无 Node/Go 进程常驻</text>
  </g>
  <g transform="translate(580, 172)">
    <rect x="0" y="0" width="160" height="60" rx="6" fill="#f8fafc" stroke="#4f5d75" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">packaging(1) 封装门控</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">单路顺序写入磁盘</text>
  </g>

  <!-- Lane 3 Nodes: Node + StoreHelper -->
  <g transform="translate(156, 276)">
    <rect x="0" y="0" width="152" height="64" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="1.2"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">prepareNative 授权</text>
    <text x="12" y="40" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">flock 锁 → 返回 Plan 即退出</text>
  </g>
  <g transform="translate(724, 276)">
    <rect x="0" y="0" width="164" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">finalizeNative 本地打包</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">无锁重写 ZIP + SINF 注入</text>
  </g>

  <!-- Lane 4 Nodes: CDN & Disk -->
  <g transform="translate(384, 384)">
    <rect x="0" y="0" width="160" height="60" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">URLSession 分块续传</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">Range / If-Range + .validator</text>
  </g>
  <g transform="translate(580, 384)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">流式 MD5 校验</text>
    <text x="12" y="40" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">1MB/chunk · 坏档自动清理</text>
  </g>
  <g transform="translate(744, 384)">
    <rect x="0" y="0" width="144" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" fill="#0f172a" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">原子 rename() 发布</text>
    <text x="12" y="40" fill="#059669" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">清理 .pastel-partials</text>
  </g>

  <!-- Legend Strip -->
  <rect x="0" y="472" width="960" height="48" fill="#ffffff"/>
  <g transform="translate(20, 488)">
    <line x1="0" y1="6" x2="24" y2="6" stroke="#bf4520" stroke-width="1.4"/>
    <text x="32" y="10" fill="#bf4520" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">认证锁释放与过期 URL 自愈回路</text>
  </g>
  <g transform="translate(284, 488)">
    <line x1="0" y1="6" x2="24" y2="6" stroke="#0284c7" stroke-width="1.4"/>
    <text x="32" y="10" fill="#0284c7" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">Swift 原生 3 路并发流</text>
  </g>
  <g transform="translate(492, 488)">
    <line x1="0" y1="6" x2="24" y2="6" stroke="#059669" stroke-width="1.4"/>
    <text x="32" y="10" fill="#059669" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">同文件系统原子发布</text>
  </g>
  <text x="940" y="498" fill="#64748b" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">SWIMLANE · NO OVERLAPS</text>
</svg>
