<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghidra-fragmentation-vs-sleigh-architecture-title ghidra-fragmentation-vs-sleigh-architecture-desc">
  <title id="ghidra-fragmentation-vs-sleigh-architecture-title">硬件架构碎片化与 Ghidra 分层编译破局对比</title>
  <desc id="ghidra-fragmentation-vs-sleigh-architecture-desc">展示传统硬编码逆向工具应对碎片化硬件的瓶颈，以及 Ghidra 基于 SLEIGH 和 P-Code 的解耦破局方案</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-red { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #e11d48; }
      .tag-green { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #059669; }
    </style>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Hardware Fragmentation -->
  <g transform="translate(24, 20)">
    <rect width="280" height="300" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#fff1f2"/>
    <path d="M0 26 h280 v8 h-280 z" fill="#fff1f2"/>
    <text x="14" y="22" class="label-title" fill="#be123c">硬件与架构碎片化海洋</text>

    <g transform="translate(12, 44)">
      <rect width="256" height="54" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#9d174d">通用计算指令集</text>
      <text x="10" y="38" class="text-code" fill="#831843">x86, x86-64, ARM, AArch64</text>
    </g>

    <g transform="translate(12, 106)">
      <rect width="256" height="54" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#9d174d">嵌入式与 IoT 芯片</text>
      <text x="10" y="38" class="text-code" fill="#831843">MIPS, PowerPC, SuperH, Xtensa</text>
    </g>

    <g transform="translate(12, 168)">
      <rect width="256" height="54" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#9d174d">微控制器与专有核心</text>
      <text x="10" y="38" class="text-code" fill="#831843">RISC-V, AVR, Z80, 8051, TriCore</text>
    </g>

    <g transform="translate(12, 230)">
      <rect width="256" height="54" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#be123c">定制硬件与专有 ASIC</text>
      <text x="10" y="38" class="text-code" fill="#9f1239">车载 ECU, 工控 PLC, 加密协处理器</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 304 170 L 344 170" fill="none" stroke="#e11d48" stroke-width="1.5"/>
  <polygon points="344,167 350,170 344,173" fill="#e11d48"/>

  <!-- Center: Traditional Trap -->
  <g transform="translate(350, 20)">
    <rect width="270" height="300" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="34" rx="8" fill="#fff7ed"/>
    <path d="M0 26 h270 v8 h-270 z" fill="#fff7ed"/>
    <text x="14" y="22" class="label-title" fill="#c2410c">传统逆向工具‘硬编码死胡同’</text>

    <g transform="translate(12, 50)">
      <rect width="246" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#b45309">单独手写反汇编引擎</text>
      <text x="10" y="38" class="text-code" fill="#92400e">• 为每种 CPU 编写 C++ 类</text>
      <text x="10" y="52" class="text-code" fill="#92400e">• 核心逻辑冗余，开发周期年计</text>
    </g>

    <g transform="translate(12, 126)">
      <rect width="246" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#b45309">反编译器与指令集强绑定</text>
      <text x="10" y="38" class="text-code" fill="#92400e">• 移植新架构需重写优化遍</text>
      <text x="10" y="52" class="text-code" fill="#92400e">• 缺乏抽象统一的中间表示</text>
    </g>

    <g transform="translate(12, 202)">
      <rect width="246" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#b45309">单文件数据库协同缺失</text>
      <text x="10" y="38" class="text-code" fill="#92400e">• 本地 IDB 单点锁死</text>
      <text x="10" y="52" class="text-code" fill="#92400e">• 多人分析版本冲突覆写灾难</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 620 170 L 660 170" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="660,167 666,170 660,173" fill="#10b981"/>

  <!-- Right: Ghidra Solution (Coral Accent) -->
  <g transform="translate(666, 20)">
    <rect width="270" height="300" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="34" rx="8" fill="#fff7ed"/>
    <path d="M0 26 h270 v8 h-270 z" fill="#fff7ed"/>
    <text x="14" y="22" class="label-title" fill="#9a3412">Ghidra 分层编译反演架构</text>

    <g transform="translate(12, 50)">
      <rect width="246" height="70" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#166534">1. SLEIGH 声明式语义建模</text>
      <text x="10" y="38" class="text-code" fill="#15803d">• .slaspec 纯文本描述芯片</text>
      <text x="10" y="52" class="text-code" fill="#15803d">• 零 C++ 编译扩展新架构</text>
    </g>

    <g transform="translate(12, 130)">
      <rect width="246" height="70" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#9a3412">2. P-Code 统一世界语 (IR)</text>
      <text x="10" y="38" class="text-code" fill="#7c2d12">• 千百种指令归一为原子微码</text>
      <text x="10" y="52" class="text-code" fill="#7c2d12">• 彻底解耦前端解码与后端算法</text>
    </g>

    <g transform="translate(12, 210)">
      <rect width="246" height="70" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#166534">3. 高性能 C++ SSA 反编译核</text>
      <text x="10" y="38" class="text-code" fill="#15803d">• 跨架构无差别图优化重构</text>
      <text x="10" y="52" class="text-code" fill="#15803d">• 高内聚 C 伪代码直出</text>
    </g>
  </g>
</svg>