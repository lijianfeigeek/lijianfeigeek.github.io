<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="440" viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kandev-acp-dual-mode-sequence-title kandev-acp-dual-mode-sequence-desc" id="kandev-acp-dual-mode-sequence-root">
      <title id="kandev-acp-dual-mode-sequence-title">ACP 协议结构化自动化 vs PTY 原始伪终端双通道时序</title>
      <desc id="kandev-acp-dual-mode-sequence-desc">通过 ACP 协议进行结构化工具拦截与人机审批，与通过 PTY 兼容任意黑盒 CLI 的双模式交互</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kandev-acp-dual-mode-sequence-root { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #kandev-acp-dual-mode-sequence-root text { font-family: "Geist", -apple-system, sans-serif; }
      #kandev-acp-dual-mode-sequence-root .mono { font-family: "Geist Mono", monospace; }
      #kandev-acp-dual-mode-sequence-root .serif { font-family: "Instrument Serif", Georgia, serif; }</style>
      <marker id="kandev-acp-dual-mode-sequence-arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3142" opacity="0.6"/>
      </marker>
      <marker id="kandev-acp-dual-mode-sequence-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520"/>
      </marker>
      <marker id="kandev-acp-dual-mode-sequence-arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
      </marker>
    </defs>
      <g>
        <!-- Lifelines -->
        <g transform="translate(100, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">前端 Web / Monaco</text>
          <line x1="70" y1="36" x2="70" y2="390" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(330, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="70" y="22" font-size="13" font-weight="600" fill="#bf4520" text-anchor="middle">Go 控制平面</text>
          <line x1="70" y1="36" x2="70" y2="390" stroke="#bf4520" stroke-dasharray="4 4" opacity="0.4"/>
        </g>

        <g transform="translate(560, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">agentctl 伴生侧车</text>
          <line x1="70" y1="36" x2="70" y2="390" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <g transform="translate(770, 30)">
          <rect x="0" y="0" width="140" height="36" rx="4" fill="#f8f9fa" stroke="#2d3142" stroke-opacity="0.15"/>
          <text x="70" y="22" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">智能体进程 (Agent)</text>
          <line x1="70" y1="36" x2="70" y2="390" stroke="#2d3142" stroke-dasharray="4 4" stroke-opacity="0.2"/>
        </g>

        <!-- Mode A Container: ACP -->
        <g transform="translate(40, 85)">
          <rect x="0" y="0" width="880" height="150" rx="6" fill="#2e5aa8" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5 3" fill-opacity="0.02"/>
          <text x="12" y="20" font-size="11" font-weight="700" fill="#2e5aa8" class="mono">MODE A: ACP 结构化自动化模式 (JSON-RPC 2.0)</text>

          <!-- Step A1 -->
          <path d="M 800 45 L 590 45" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#kandev-acp-dual-mode-sequence-arrow-link)"/>
          <g transform="translate(615, 28)">
            <text x="0" y="12" font-size="11" font-weight="600" fill="#2e5aa8">1. tools/call: 编辑核心文件 (JSON-RPC)</text>
          </g>

          <!-- Step A2 -->
          <path d="M 590 80 L 360 80" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#kandev-acp-dual-mode-sequence-arrow-accent)"/>
          <g transform="translate(385, 63)">
            <text x="0" y="12" font-size="11" font-weight="600" fill="#bf4520">2. 触发审批门禁，向人类推送 Inline Diff</text>
          </g>

          <!-- Step A3 -->
          <path d="M 130 115 L 360 115" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-acp-dual-mode-sequence-arrow-default)"/>
          <g transform="translate(155, 98)">
            <text x="0" y="12" font-size="11" fill="#2d3142">3. 工程师在 Web 端点击批准 (Approve)</text>
          </g>

          <!-- Step A4 -->
          <path d="M 360 135 L 800 135" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#kandev-acp-dual-mode-sequence-arrow-link)"/>
          <g transform="translate(500, 122)">
            <text x="0" y="10" font-size="10" font-weight="600" fill="#2e5aa8">4. 放行工具调用结果</text>
          </g>
        </g>

        <!-- Mode B Container: PTY -->
        <g transform="translate(40, 255)">
          <rect x="0" y="0" width="880" height="120" rx="6" fill="#f8f9fa" stroke="#2d3142" stroke-width="1" stroke-dasharray="5 3" stroke-opacity="0.15"/>
          <text x="12" y="20" font-size="11" font-weight="600" fill="#2d3142" class="mono">MODE B: PTY 原始伪终端模式 (无缝兼容所有 CLI)</text>

          <!-- Step B1 -->
          <path d="M 800 45 L 130 45" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-acp-dual-mode-sequence-arrow-default)"/>
          <g transform="translate(320, 28)">
            <text x="0" y="12" font-size="11" fill="#2d3142">1. 原始 ANSI 字节流透传至前端 xterm.js</text>
          </g>

          <!-- Step B2 -->
          <path d="M 130 85 L 800 85" fill="none" stroke="#2d3142" stroke-width="1.5" marker-end="url(#kandev-acp-dual-mode-sequence-arrow-default)"/>
          <g transform="translate(320, 68)">
            <text x="0" y="12" font-size="11" fill="#2d3142">2. 键盘击键 (Keystrokes) 直接透传至 Agent 子进程</text>
          </g>
        </g>
      </g>
    </svg>
