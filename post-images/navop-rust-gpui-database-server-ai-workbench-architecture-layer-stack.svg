<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="navop-layers-title navop-layers-desc" id="navop-layers-root" data-diagram="layer-stack">
  <title id="navop-layers-title">Navop 五层零 WebView 原生渲染与双平面扩展堆栈</title>
  <desc id="navop-layers-desc">自底向上展示 Navop 从 GPUI Fast 与 DirectComposition 表面合成、多协议传输驱动、租约化能力运行时、双轨原生视图平面到连接级 AI 三层硬闸门的五层纵深架构。</desc>
  <defs>
    <pattern id="nl-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.22"/>
    </pattern>
    <marker id="nl-arrow-up" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#f8fafc"/>
  <rect width="1000" height="600" fill="url(#nl-dots)"/>

  <!-- Header -->
  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Zero-WebView Native Stack: GPU Compositor, Dual-Plane Extensions &amp; AI Gate</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">SINGLE RUST 2024 PROCESS · GPUI-FAST v0.1.14 · NSH QUICKJS TSX HOST · THREE-TIER AI ACCESS GUARD</text>

  <!-- Left Margin Direction Indicator -->
  <g transform="translate(28, 84)">
    <line x1="40" y1="448" x2="40" y2="12" stroke="#bf4520" stroke-width="1.4" marker-end="url(#nl-arrow-up)"/>
    <rect x="4" y="180" width="72" height="88" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="204" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">ABSTRACTION</text>
    <text x="40" y="220" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">&amp; POLICY ↑</text>
    <text x="40" y="242" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#334155">零浏览器桥</text>
    <text x="40" y="256" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="7.5" fill="#64748b">PURE NATIVE</text>
  </g>

  <!-- L5: AI Governance & Public MCP Plane -->
  <g transform="translate(116, 84)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="104" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="68" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L5 · AI GATE</text>
    <text x="136" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">连接级 AI 访问三层硬闸门与 Loopback Public MCP 协同层</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">StoredConnection::ai_access_level (Allowed / ReadOnly / Denied) 随云同步流转；可见性 → 路由 → ToolAccessGuard 三重拦截</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">public_mcp (127.0.0.1 + 64-hex token) · ToolNameAllocator [A-Za-z0-9_-] 双向净化 · ACP + MCP 二次审批</text>
  </g>

  <!-- L4: Dual-Track UI Plane (FOCAL CORAL LAYER) -->
  <g transform="translate(116, 176)">
    <rect x="0" y="0" width="852" height="88" rx="6" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
    <rect x="16" y="14" width="104" height="18" rx="3" fill="none" stroke="#bf4520" stroke-width="1"/>
    <text x="68" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#bf4520">L4 · UI PLANE</text>
    <text x="136" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bf4520">零 WebView 原生视图与 nsh 脚本化扩展双轨 UI 平面</text>
    <text x="16" y="52" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0f172a">内建核心域走 GPUI Entity 原生绘制（百万行虚拟表 / 分屏终端 / ferrum-flow ER 图）；扩展页走 nsh-platform-gpui 独立 QuickJS 线程</text>
    <text x="16" y="72" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#475569">全进程唯一 gpui-fast 实例 · HostChannel (host.call / nativeModule / nativeComponent) · Capabilities declared ∩ granted</text>
  </g>

  <!-- L3: Capability & Lease Runtime Plane -->
  <g transform="translate(116, 272)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="104" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="68" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L3 · RUNTIME</text>
    <text x="136" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">租约化能力运行时与 Tokio-GPUI 双执行器隔离层</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">ActivationManager 引用计数租约共享单进程会话（末个 Lease 释放自动回收）；Tokio::spawn_result 严防 GPUI 线程无 Reactor 崩溃</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">ProcessRpcSession (resource / job / event / blob) · RuntimeMonitor 健康轮询 · SshSessionRegistry 60s 空闲池化</text>
  </g>

  <!-- L2: Multi-Protocol Transport & Driver Matrix -->
  <g transform="translate(116, 364)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="104" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="68" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L2 · DRIVERS</text>
    <text x="136" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">全协议原生传输与内置 / IPC / WASM 异构数据库驱动层</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">内置 MySQL / PG / SQLite / DuckDB / MSSQL / Oracle；达梦、人大金仓、OceanBase、openGauss 经 IPC 与 WIT WASM 组件热插拔</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">russh v0.65.4-navop.1 (华为旧设备非规范 mpint 容错) · BastionDirect (user#account#asset) · alacritty_terminal 0.26</text>
  </g>

  <!-- L1: GPU Rendering & Native Surface Compositor -->
  <g transform="translate(116, 456)">
    <rect x="0" y="0" width="852" height="84" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="16" y="14" width="104" height="18" rx="3" fill="none" stroke="#475569" stroke-width="0.9"/>
    <text x="68" y="26" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#475569">L1 · GPU &amp; OS</text>
    <text x="136" y="27" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">跨平台 GPU 渲染后端与原生表面合成层 (gpui-fast + OS Native)</text>
    <text x="16" y="50" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#334155">macOS Metal + UNUserNotificationCenter；Windows DirectComposition Portal 挂载原生 ActiveX RDP 并按 deferred_draws 动态让位</text>
    <text x="16" y="70" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">IDCompositionVisual SetContent 兼容 v1 设备 · Embedded X11 yserver · Argon2id + AES-256-GCM 凭据加密</text>
  </g>

  <!-- Legend Strip -->
  <line x1="28" y1="556" x2="968" y2="556" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="578" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#475569">LEGEND</text>
  <rect x="108" y="568" width="16" height="12" rx="2" fill="#fdf2ee" stroke="#bf4520" stroke-width="1.4"/>
  <text x="132" y="578" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">核心架构突破层（单一 GPUI 渲染管线融合原生 Entity 与 QuickJS TSX）</text>
  <rect x="528" y="568" width="16" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="552" y="578" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11" fill="#475569">纯 Rust 编译期与运行时支撑层（Release LTO + panic=abort）</text>
</svg>
