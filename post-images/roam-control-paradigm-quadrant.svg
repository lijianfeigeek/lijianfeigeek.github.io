<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="rc-quad-title rc-quad-desc" xmlns="http://www.w3.org/2000/svg" id="roam-control-paradigm-quadrant-root">
  <title id="rc-quad-title">iOS 27 时代四大定位模拟技术范式权衡矩阵</title>
  <desc id="rc-quad-desc">从脱机独立性（Tethered vs Standalone）与定位接管深度（WLOC-Only vs System-Wide）两个正交维度对比桌面 DVT、MITM 改包、内核漏洞与 Roam Control 本机回环方案。</desc>
  <defs>
      <style>#roam-control-paradigm-quadrant-root { color: #0f172a; font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; }
      #roam-control-paradigm-quadrant-root .diagram-wrap { overflow-x: auto; max-width: 1000px; margin: 0 auto; }</style>
    <marker id="roam-control-paradigm-quadrant-arrow-out" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
    </marker>
    <marker id="roam-control-paradigm-quadrant-arrow-in" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#0f172a"/>
    </marker>
    <pattern id="roam-control-paradigm-quadrant-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#cbd5e1"/>
    </pattern>
  </defs>

  <!-- Paper Light Background + Subtle Dot Grid -->
  <rect x="0" y="0" width="960" height="600" fill="#f8fafc"/>
  <rect x="16" y="16" width="928" height="568" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="96" width="880" height="428" rx="6" fill="url(#roam-control-paradigm-quadrant-dots)" fill-opacity="0.45"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="12" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">2X2 SCENARIO MATRIX · IOS 27 LOCATION SIMULATION LANDSCAPE</text>
    <text x="0" y="36" fill="#0f172a" font-size="18" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">当 /clls/wloc 遭遇证书固定：四大 iOS 定位模拟路线架构权衡</text>
  </g>

  <!-- Double-Ended Orthogonal Axes (Passing cleanly between the 4 cells) -->
  <!-- Center cross at (480, 312) -->
  <line x1="128" y1="312" x2="832" y2="312" stroke="#0f172a" stroke-width="1.2" marker-start="url(#roam-control-paradigm-quadrant-arrow-in)" marker-end="url(#roam-control-paradigm-quadrant-arrow-out)"/>
  <line x1="480" y1="120" x2="480" y2="504" stroke="#0f172a" stroke-width="1.2" marker-start="url(#roam-control-paradigm-quadrant-arrow-in)" marker-end="url(#roam-control-paradigm-quadrant-arrow-out)"/>

  <!-- Jobs-Minimal Single-Word Axis Labels Beyond Arrow Tips -->
  <text x="480" y="108" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">SYSTEM-WIDE</text>
  <text x="480" y="522" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">RESTRICTED</text>
  <text x="116" y="315" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="end">TETHERED</text>
  <text x="844" y="315" fill="#0f172a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">STANDALONE</text>

  <!-- Top-Left Cell: 02 · TETHERED / SYSTEM-WIDE -->
  <g transform="translate(152, 136)">
    <rect x="0" y="0" width="296" height="152" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="26" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">02 · TETHERED / SYSTEM-WIDE</text>
    <text x="20" y="52" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">桌面联机 DVT 调试注入</text>
    <text x="20" y="74" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Xcode · pymobiledevice3 · GeoPort</text>
    <text x="20" y="98" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">走苹果官方 dtservicehub 通道，全系统生效；</text>
    <text x="20" y="118" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">但强依赖 Mac/PC 守护进程维持 CoreDevice</text>
    <text x="20" y="138" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">隧道，拔线或外出蜂窝场景下无法动态控速。</text>
  </g>

  <!-- Top-Right FOCAL Cell: 01 · STANDALONE / SYSTEM-WIDE (Roam Control) -->
  <g transform="translate(512, 136)">
    <rect x="0" y="0" width="296" height="152" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
    <text x="20" y="26" fill="#be123c" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">01 · STANDALONE / SYSTEM-WIDE</text>
    <text x="20" y="52" fill="#9f1239" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">本机自配对 + 用户态回环（Roam Control）</text>
    <text x="20" y="74" fill="#be123c" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">LocalDevVPN + jktcp + DVT 5Hz</text>
    <text x="20" y="98" fill="#881337" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">iOS 27+ 纯手机端脱机闭环，免抓包免证书劫持；</text>
    <text x="20" y="118" fill="#881337" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">直接驱动硬件级 locationd，彻底免疫 TLS 固定，</text>
    <text x="20" y="138" fill="#881337" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">代价是需开启开发者模式并维持自签名安装。</text>
  </g>

  <!-- Bottom-Left Cell: 04 · TETHERED / RESTRICTED -->
  <g transform="translate(152, 336)">
    <rect x="0" y="0" width="296" height="152" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="26" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">04 · TETHERED / RESTRICTED</text>
    <text x="20" y="52" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">越狱与高权限容器直写</text>
    <text x="20" y="74" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Geranium · LocSim · TrollStore</text>
    <text x="20" y="98" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">利用 CoreTrust 签名漏洞赋予私有 Entitlement，</text>
    <text x="20" y="118" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">直调 CLSimulationManager 免 VPN 运行；</text>
    <text x="20" y="138" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">但版本永久锁死在 iOS 17.0 及以下历史设备。</text>
  </g>

  <!-- Bottom-Right Cell: 03 · STANDALONE / RESTRICTED -->
  <g transform="translate(512, 336)">
    <rect x="0" y="0" width="296" height="152" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="26" fill="#64748b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">03 · STANDALONE / RESTRICTED</text>
    <text x="20" y="52" fill="#0f172a" font-size="15" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">HTTPS MITM 拦截改写 WLOC</text>
    <text x="20" y="74" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Shadowrocket · iOS-Location-Spoofer-Web</text>
    <text x="20" y="98" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">篡改 /clls/wloc 基站与 Wi-Fi 众包 Protobuf；</text>
    <text x="20" y="118" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">户外强 GPS 信号下易漂移，且自 iOS 27 beta 6</text>
    <text x="20" y="138" fill="#475569" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">起遭苹果开启 TLS 证书固定全线封堵失效。</text>
  </g>

  <!-- Legend Strip -->
  <line x1="40" y1="542" x2="920" y2="542" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(40, 552)">
    <text x="0" y="14" fill="#64748b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">LEGEND</text>
    <rect x="76" y="3" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="98" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">iOS 27+ 唯一存活的脱机全局定位突围象限</text>
    <rect x="372" y="3" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="394" y="14" fill="#334155" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">受物理联机、TLS 证书固定或系统版本锁死的历史范式</text>
  </g>
</svg>
