<svg width="960" height="480" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockxy-swiftnio-system-architecture-class-title rockxy-swiftnio-system-architecture-class-desc">
  <title id="rockxy-swiftnio-system-architecture-class-title">Rockxy 总体系统架构与核心组件拓扑图</title>
  <desc id="rockxy-swiftnio-system-architecture-class-desc">纯 Swift 驱动的事件循环引擎，包含 UI 状态、SwiftNIO 网络核心、特权安全管理、流量修改管道与 AI/MCP 扩展桥接</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-method { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
      .text-comment { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
    <marker id="cls-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 1: App &amp; Security -->
  <!-- Box 1: RockxyApp (UI Layer) -->
  <g transform="translate(40, 30)">
    <rect width="420" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="420" height="4" rx="2" fill="#0284c7"/>
    <text x="16" y="24" class="label-title">RockxyApp (应用与展示层)</text>
    <text x="320" y="24" class="label-badge" fill="#0284c7">&lt;&lt;AppKit + SwiftUI&gt;&gt;</text>
    <line x1="16" y1="36" x2="404" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="56" class="text-method">+ NSApplicationDelegate / AppKit Window &amp; SplitViews</text>
    <text x="16" y="76" class="text-method">+ SwiftUI Reactive State / NSTableView 120Hz 极限渲染</text>
    <text x="16" y="96" class="text-comment">双轨 UI 架构：数据流响应式绑定 + 虚拟滚动零掉帧</text>
  </g>

  <!-- Box 2: SecurityManager (Security &amp; Privileges) -->
  <g transform="translate(500, 30)">
    <rect width="420" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="420" height="4" rx="2" fill="#059669"/>
    <text x="16" y="24" class="label-title">SecurityManager (安全与特权隔离)</text>
    <text x="330" y="24" class="label-badge" fill="#059669">&lt;&lt;System Security&gt;&gt;</text>
    <line x1="16" y1="36" x2="404" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="56" class="text-method">+ P256 RootCAEngine / KeychainVault (0o600 独立存储)</text>
    <text x="16" y="76" class="text-method">+ XPCPrivilegedHelper / SecCode 双向代码签名链校验</text>
    <text x="16" y="96" class="text-comment">特权后台隔离执行 networksetup / pfctl，严禁越权</text>
  </g>

  <!-- Row 2: NetworkCore (Focal) -->
  <g transform="translate(40, 165)">
    <rect width="880" height="115" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="26" class="label-title" fill="#9a3412">NetworkCore (SwiftNIO 异步事件循环引擎核心)</text>
    <text x="730" y="26" class="label-badge" fill="#bf4520">&lt;&lt;Non-blocking I/O&gt;&gt;</text>
    <line x1="20" y1="38" x2="860" y2="38" stroke="#fed7aa" stroke-width="1"/>
    <g transform="translate(20, 56)">
      <text x="0" y="0" class="text-method">+ SwiftNIO MultiThreadedEventLoopGroup / NIOTSConnectionBootstrap</text>
      <text x="0" y="20" class="text-method">+ HTTP2StreamMultiplexer / WebSocketFrameDecoder / Dynamic ChannelHandler</text>
      <text x="0" y="40" class="text-method">+ ByteBuffer 零拷贝切片 / Swift 6 Concurrency 原生 Actor 数据隔离</text>
    </g>
  </g>

  <!-- Row 3: Three Pipelines -->
  <!-- Box 3: TrafficPipeline -->
  <g transform="translate(40, 305)">
    <rect width="270" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#64748b"/>
    <text x="14" y="24" class="label-title">TrafficPipeline</text>
    <text x="170" y="24" class="label-badge" fill="#64748b">&lt;&lt;Filter/Modify&gt;&gt;</text>
    <line x1="14" y1="36" x2="256" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    <text x="14" y="56" class="text-method">+ FilterSearchEngine</text>
    <text x="14" y="76" class="text-method">+ BreakpointController</text>
    <text x="14" y="96" class="text-method">+ MapLocalRemoteService</text>
    <text x="14" y="116" class="text-method">+ HeaderModifier / Throttler</text>
  </g>

  <!-- Box 4: ProtocolInspectors -->
  <g transform="translate(345, 305)">
    <rect width="270" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#7c3aed"/>
    <text x="14" y="24" class="label-title">ProtocolInspectors</text>
    <text x="170" y="24" class="label-badge" fill="#7c3aed">&lt;&lt;AI &amp; Web3&gt;&gt;</text>
    <line x1="14" y1="36" x2="256" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    <text x="14" y="56" class="text-method">+ AIStream (SSE / NDJSON)</text>
    <text x="14" y="76" class="text-method">+ TokenUsage &amp; ToolCalls</text>
    <text x="14" y="96" class="text-method">+ Web3RPC (EVM/Solana)</text>
    <text x="14" y="116" class="text-method">+ x402 Payment Challenges</text>
  </g>

  <!-- Box 5: ExtensibilityBridge -->
  <g transform="translate(650, 305)">
    <rect width="270" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#0891b2"/>
    <text x="14" y="24" class="label-title">ExtensibilityBridge</text>
    <text x="160" y="24" class="label-badge" fill="#0891b2">&lt;&lt;MCP &amp; Sandbox&gt;&gt;</text>
    <line x1="14" y1="36" x2="256" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    <text x="14" y="56" class="text-method">+ LocalMCPServer (10 Tools)</text>
    <text x="14" y="76" class="text-method">+ Auto Redaction Gateway</text>
    <text x="14" y="96" class="text-method">+ Sandboxed JSCore (5s limit)</text>
    <text x="14" y="116" class="text-method">+ DeveloperSetupHub</text>
  </g>

  <!-- Connectors -->
  <path d="M 250 140 L 250 165" stroke="#64748b" stroke-width="1.5" marker-end="url(#cls-arrow)"/>
  <path d="M 710 140 L 710 165" stroke="#64748b" stroke-width="1.5" marker-end="url(#cls-arrow)"/>
  <path d="M 175 280 L 175 305" stroke="#64748b" stroke-width="1.5" marker-end="url(#cls-arrow)"/>
  <path d="M 480 280 L 480 305" stroke="#64748b" stroke-width="1.5" marker-end="url(#cls-arrow)"/>
  <path d="M 785 280 L 785 305" stroke="#64748b" stroke-width="1.5" marker-end="url(#cls-arrow)"/>
</svg>