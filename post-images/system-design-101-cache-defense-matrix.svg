<svg width="960" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="sd-cache-title sd-cache-desc">
  <title id="sd-cache-title">高并发缓存防崩塌立体防御矩阵：穿透、击穿与雪崩全链治理</title>
  <desc id="sd-cache-desc">展示布隆过滤器拦截恶意Key、互斥锁解决热点Key过期击穿以及随机TTL抖动防御集中雪崩的决策流转图。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
  </style>
  <rect width="960" height="480" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">高并发缓存防崩塌立体防御矩阵</text>
    <text class="subtitle" x="0" y="20">全方位治理缓存穿透 (Penetration)、缓存击穿 (Breakdown) 与缓存雪崩 (Avalanche)</text>
  </g>

  <!-- Flow Steps (Horizontal Pipeline) -->
  <!-- Step 1: Request &amp; Bloom -->
  <g transform="translate(48, 86)">
    <rect width="260" height="348" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">第一道防线：布隆过滤器 (防穿透)</text>

    <g transform="translate(14, 40)">
      <rect width="232" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" x="0" y="0">并发客户端请求流入</text>
        <text class="mono" fill="#2563eb" x="0" y="16">GET /goods/{sku_id}</text>
        <text class="card-body" x="0" y="32">黑客恶意构造大量负数或非法 ID</text>
      </g>
    </g>

    <!-- Branch A: Reject -->
    <g transform="translate(14, 124)">
      <rect width="232" height="96" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#991b1b" x="0" y="0">判定：Key 必定不存在</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="16">• 布隆位图哈希计算无匹配</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="32">• 直接在接入层响应 HTTP 404</text>
        <text class="mono" fill="#b91c1c" x="0" y="52">DEFENSE: 100% 阻断恶意缓存穿透</text>
      </g>
    </g>

    <!-- Branch B: Pass -->
    <g transform="translate(14, 230)">
      <rect width="232" height="88" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#15803d" x="0" y="0">判定：Key 可能存在</text>
        <text class="card-body" x="0" y="18">• 放行请求进入二级缓存层</text>
        <text class="mono" fill="#166534" x="0" y="36">FORWARD -> 进入 Redis 集群查询</text>
      </g>
    </g>
  </g>

  <!-- Step 2: Cache Hit or Miss -->
  <g transform="translate(332, 86)">
    <rect width="270" height="348" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text class="box-title" fill="#1e40af" x="14" y="24">第二道防线：互斥锁回源 (防击穿)</text>

    <g transform="translate(14, 40)">
      <rect width="242" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">Cache Hit (命中缓存)</text>
        <text class="val-large" fill="#15803d" x="0" y="26">P99 &lt; 2ms</text>
        <text class="card-body" fill="#166534" x="0" y="44">内存直出，快速返回业务数据</text>
      </g>
    </g>

    <g transform="translate(14, 130)">
      <rect width="242" height="188" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">Cache Miss (热点 Key 突然过期)</text>
        <text class="mono" fill="#2563eb" x="0" y="16">SETNX lock:sku_1001 1 EX 10</text>
        
        <text class="card-title" fill="#15803d" x="0" y="40">抢到互斥锁线程：</text>
        <text class="card-body" x="0" y="54">• 唯独该线程获准回源查询 DB</text>
        <text class="card-body" x="0" y="68">• 重建缓存并释放互斥锁</text>

        <text class="card-title" fill="#c2410c" x="0" y="96">未抢到锁的成千并发：</text>
        <text class="card-body" x="0" y="110">• 线程自旋休眠 50ms 等待重试</text>
        <text class="card-body" x="0" y="124">• 或降级返回过期旧数据 (Stale Data)</text>
        <text class="mono" fill="#1d4ed8" x="0" y="148">DEFENSE: 杜绝 DB 被瞬间击穿</text>
      </g>
    </g>
  </g>

  <!-- Step 3: Random Jitter (Anti-Avalanche) -->
  <g transform="translate(626, 86)">
    <rect width="286" height="348" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text class="box-title" fill="#9a3412" x="14" y="24">第三道防线：随机 TTL 抖动 (防雪崩)</text>

    <g transform="translate(14, 40)">
      <rect width="258" height="130" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text class="card-title" fill="#c2410c" x="0" y="0">雪崩致命病因：集中批量失效</text>
        <text class="card-body" x="0" y="18">• 定时任务在同一时刻刷入数万 Key</text>
        <text class="card-body" x="0" y="32">• 若全部配置固定 TTL (如 expire 3600s)</text>
        <text class="card-body" x="0" y="48">• 1 小时后全部缓存瞬间同时失效</text>
        <text class="card-body" x="0" y="64">• 海量流量如雪崩般直接压死数据库</text>
        <text class="mono" fill="#ea580c" x="0" y="86">DANGER: 传统固定过期时间的大陷阱</text>
      </g>
    </g>

    <g transform="translate(14, 184)">
      <rect width="258" height="134" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <g transform="translate(10, 18)">
        <text class="card-title" fill="#9a3412" x="0" y="0">解法公式：离散抖动因子 (Jitter)</text>
        <text class="mono" fill="#c2410c" x="0" y="20">TTL = Base_TTL + rand(0, 300) 秒</text>
        <text class="card-body" fill="#7c2d12" x="0" y="40">• 使各 Key 失效时间均匀平滑离散化</text>
        <text class="card-body" fill="#7c2d12" x="0" y="58">• 配合多级从库、熔断降级与哨兵监控</text>
        <text class="mono" fill="#15803d" x="0" y="86">DEFENSE: 架构实现 99.99% 高可用自愈</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 308 274 L 332 274" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="332,274 326,270 326,278" fill="#94a3b8"/>

  <path d="M 602 220 L 626 220" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="626,220 620,216 620,224" fill="#94a3b8"/>
</svg>