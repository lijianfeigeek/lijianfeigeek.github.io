<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="modern-network-debugging-tunnl-gg-ssh-fingerprint-flow-title modern-network-debugging-tunnl-gg-ssh-fingerprint-flow-desc">
  <title id="modern-network-debugging-tunnl-gg-ssh-fingerprint-flow-title">tunnl.gg 原生 SSH 反向端口转发与公钥指纹绑定机制</title>
  <desc id="modern-network-debugging-tunnl-gg-ssh-fingerprint-flow-desc">展示本地开发机通过原生 OpenSSH 反向代理到 tunnl.gg 云端网关，实现稳定持久子域名的全流程</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">零客户端穿透：TUNNL.GG 基于 SSH 公钥指纹的持久化域名映射拓扑</text>
    <text x="896" y="16" text-anchor="end" class="tag">OPENSSH REVERSE TUNNEL</text>
  </g>

  <!-- Left: Local Machine -->
  <g transform="translate(32, 60)">
    <rect width="280" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="280" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="280" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">本地开发机 (Client Machine)</text>
    <text x="266" y="25" text-anchor="end" class="tag">NO INSTALL</text>

    <g transform="translate(14, 52)">
      <rect width="252" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">原生 OpenSSH 客户端</text>
        <text class="desc" x="0" y="18">• macOS / Linux / Win 原生标配</text>
        <text class="desc" x="0" y="34">• 零下载、零账号、零守护进程</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="252" height="74" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">隐式身份锚点：SSH Key</text>
        <text class="desc" x="0" y="18">• 自动读取 ~/.ssh/id_ed25519.pub</text>
        <text class="desc" x="0" y="34">• 握手时计算 SHA256 唯一指纹</text>
        <text class="tag" x="0" y="52">用硬件私钥替代账密</text>
      </g>
    </g>

    <g transform="translate(14, 208)">
      <rect width="252" height="96" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">本地运行开发服务</text>
        <text class="desc" x="0" y="18">• http://localhost:8080</text>
        <text class="desc" x="0" y="34">• 一行命令执行反向代理转发：</text>
        <text class="tag" style="font-size:9.5px; fill:#bf4520;" x="0" y="52">ssh -R 80:localhost:8080 stable@proxy.tunnl.gg</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Client -> Gateway -->
  <path d="M 312 215 L 342 215" stroke="#bf4520" stroke-width="2" fill="none" marker-end="url(#arrow-coral)" />
  <rect x="290" y="180" width="80" height="20" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="1" />
  <text x="330" y="194" text-anchor="middle" class="tag" style="font-size:9px;">ssh -R (Port 22)</text>

  <!-- Middle: tunnl.gg Gateway (Core Accent) -->
  <g transform="translate(342, 60)">
    <rect width="286" height="330" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="286" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="286" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="286" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="14" y="25" class="coral-title">tunnl.gg 云端网关集群</text>
    <text x="272" y="25" text-anchor="end" class="coral-tag">OPEN SOURCE</text>

    <g transform="translate(14, 52)">
      <rect width="258" height="66" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">SSH Reverse Proxy (Port 22)</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 接收 SSH 安全隧道反向挂载</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 多路复用二进制长连接通道</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="258" height="74" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">SNI / 动态 Host 路由分发器</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 将公钥哈希稳定映射为唯一子域名</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 重启后域名绝对固定，无需重写配置</text>
      </g>
    </g>

    <g transform="translate(14, 208)">
      <rect width="258" height="96" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">自动化 TLS 与 TUI 看板</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• Let's Encrypt 泛域名秒级自动签发</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 终端微秒级滚动打印请求方法耗时</text>
        <text class="coral-tag" x="0" y="52">首屏输出手机测试 ASCII 二维码</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Gateway -> Public -->
  <path d="M 628 215 L 658 215" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Right: Public Internet -->
  <g transform="translate(658, 60)">
    <rect width="270" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="270" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="270" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="270" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">公网访客 / Webhook 来源</text>
    <text x="256" y="25" text-anchor="end" class="tag">PUBLIC INGRESS</text>

    <g transform="translate(14, 52)">
      <rect width="242" height="74" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">第三方业务平台回调</text>
        <text class="desc" x="0" y="18">• Stripe 扣款事件通知</text>
        <text class="desc" x="0" y="34">• GitHub CI/CD Webhook</text>
      </g>
    </g>

    <g transform="translate(14, 134)">
      <rect width="242" height="74" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">移动端真机验证</text>
        <text class="desc" x="0" y="18">• 微信公众号 / 小程序联调</text>
        <text class="desc" x="0" y="34">• 局域网外远程真机联调 H5 页面</text>
      </g>
    </g>

    <g transform="translate(14, 216)">
      <rect width="242" height="88" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1.5" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">持久专属 HTTPS 域名</text>
        <text class="tag" style="fill:#15803d; font-size:11px;" x="0" y="20">https://alpha-fox.tunnl.gg</text>
        <text class="desc" style="fill:#166534;" x="0" y="38">无需反复登录控制台修改回调 URL</text>
      </g>
    </g>
  </g>
</svg>