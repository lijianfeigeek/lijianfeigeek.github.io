<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 584" width="1100" height="584" role="img" aria-labelledby="stack-title stack-desc" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif;">
  <title id="stack-title">Regitela v1.0.3 五层原生系统架构堆栈</title>
  <desc id="stack-desc">展示 Regitela 从 SwiftUI 多语言界面层、系统调校与文件管理模块、SystemFileAccess 与原位 Plist 写入层、pathleak 与无头文件 libarchive 支撑层到四大特权驱动与双模打包底层的分层关系。</desc>
  <defs>
    <pattern id="dotGridStack" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="584" fill="#ffffff"/>
  <rect x="16" y="16" width="1068" height="552" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="16" width="1068" height="552" rx="8" fill="url(#dotGridStack)"/>

  <!-- Header -->
  <g transform="translate(40, 38)">
    <rect x="0" y="0" width="116" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="58" y="14" text-anchor="middle" fill="#334155" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace" letter-spacing="1">LAYER STACK</text>
    <text x="0" y="44" fill="#0f172a" font-size="20" font-weight="700">Regitela v1.0.3 五层原生混合技术堆栈 (Swift + Objective-C + C)</text>
    <text x="0" y="64" fill="#475569" font-size="12">零第三方库依赖：全栈依托 iOS 系统私有框架、POSIX 系统调用与 Theos/Xcode 双模构建</text>
  </g>

  <!-- Left Margin Direction Axis -->
  <g transform="translate(44, 134)">
    <text x="20" y="12" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">UI LAYER</text>
    <line x1="20" y1="24" x2="20" y2="368" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrowDown)"/>
    <text x="20" y="388" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">SYSCALL /</text>
    <text x="20" y="400" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">KERNEL</text>
  </g>

  <!-- Stacked Layers -->
  <g transform="translate(100, 128)">
    <!-- L5 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#f1f5f9"/>
      <text x="38" y="40" text-anchor="middle" fill="#334155" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L5</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">SwiftUI 交互壳层与双管道 stdout 实时日志终端</text>
      <text x="80" y="50" fill="#475569" font-size="11">17 种语言本地化 (113 词条) · UnlockView 显式内核解锁台 · Console.swift 用 pipe()+dup2() 捕获 C 层 print/printf</text>
      <text x="920" y="32" text-anchor="end" fill="#0284c7" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">ContentView + UnlockView</text>
      <text x="920" y="50" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Localizable.xcstrings (17 langs)</text>
    </g>

    <!-- L4 -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#e2e8f0"/>
      <text x="38" y="40" text-anchor="middle" fill="#334155" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L4</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">四大系统调校与全功能越权文件管理器</text>
      <text x="80" y="50" fill="#475569" font-size="11">监管模式 (IsSupervised) · 14 国销售地区切换 (Region) · 三大硬件能力解锁 (GestaltFeature) · 4MB 文本编辑器与容器浏览器</text>
      <text x="920" y="32" text-anchor="end" fill="#0284c7" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">Supervised / Region / FileExplorer</text>
      <text x="920" y="50" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">-lMobileGestalt (MGGetBoolAnswer)</text>
    </g>

    <!-- L3 (FOCAL) -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="940" height="76" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
      <rect x="16" y="26" width="44" height="24" rx="4" fill="#e11d48"/>
      <text x="38" y="42" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L3</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">可插拔权限接缝 (SystemFileAccess) 与原位 Plist 写入引擎</text>
      <text x="80" y="50" fill="#9f1239" font-size="11">四路由句柄分发与自动生命周期释放 (SandboxSession deinit) · 绕开父目录写权限的 O_WRONLY | O_TRUNC 原位覆写与 stat 诊断</text>
      <text x="920" y="32" text-anchor="end" fill="#e11d48" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">FOCAL · PRIVILEGE SEAM</text>
      <text x="920" y="50" text-anchor="end" fill="#be123c" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Escape + AccessBackend + ContainerPlist</text>
    </g>

    <!-- L2 -->
    <g transform="translate(0, 244)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#f1f5f9"/>
      <text x="38" y="40" text-anchor="middle" fill="#334155" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L2</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">容器盲扫探针、私有 LaunchServices SPI 与无头文件压缩桥接</text>
      <text x="80" y="50" fill="#475569" font-size="11">pathleak 基于 fsgetpath() 遍历基线 inode · getxattr 读取容器标识 · LSApplicationRecord/UIImage 取图标 · 内联声明 libarchive.tbd</text>
      <text x="920" y="32" text-anchor="end" fill="#0284c7" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace">pathleak.m + AppNames.m</text>
      <text x="920" y="50" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Archive.m (SECURE_NODOTDOT)</text>
    </g>

    <!-- L1 -->
    <g transform="translate(0, 324)">
      <rect x="0" y="0" width="940" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <rect x="16" y="24" width="44" height="24" rx="4" fill="#059669"/>
      <text x="38" y="40" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">L1</text>
      <text x="80" y="30" fill="#0f172a" font-size="15" font-weight="700">系统越权原语、闭源内核漏洞桥与双模签名打包底座</text>
      <text x="80" y="50" fill="#065f46" font-size="11">dlopen(libsystem_containermanager.dylib) · SecTask 读取 App Group · __has_include 条件编译 darksword · IPA &amp; Rootless .deb</text>
      <text x="920" y="32" text-anchor="end" fill="#059669" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">SandboxEscape.m + KernelBackend.m</text>
      <text x="920" y="50" text-anchor="end" fill="#047857" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Makefile (Theos + Xcode 26 + ldid)</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 548)">
    <text x="0" y="12" fill="#475569" font-size="11">注：公开 GitHub 仓库通过 __has_include("kexploit/offsets.h") 与 AccessBackend 协议解耦，未包含闭源/独立许可的 /kernel/ 漏洞利用源码。</text>
    <text x="1020" y="12" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Regitela Architecture Stack</text>
  </g>
