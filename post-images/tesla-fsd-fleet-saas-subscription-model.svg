<svg width="960" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="tsla-fsd-title tsla-fsd-desc">
  <title id="tsla-fsd-title">业务四：乘用车 FSD 订阅存量硬件清洗与 SaaS 估值模型</title>
  <desc id="tsla-fsd-desc">展示剔除淘汰HW3旧车、锁定AI4/HW4存量车队、40%基准订阅渗透率并给予30倍PE得出1490亿美元（40美元/股）的高利润SaaS估值链。</desc>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .val-large { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  </style>
  <rect width="960" height="500" fill="#fafafa"/>
  <rect x="24" y="20" width="912" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <text class="title" x="0" y="0">业务四：乘用车 FSD 订阅——存量硬件清洗后的纯正 SaaS</text>
    <text class="subtitle" x="0" y="20">剔除算力不足的 HW3 沉没资产，锁定 1,600 万辆有效车队，测算 1,490 亿美元纯软件现金流</text>
  </g>

  <!-- Flow in 3 Columns / Funnel -->
  <!-- Col 1: Hardware Filter -->
  <g transform="translate(48, 86)">
    <rect width="270" height="370" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">1. 硬件迭代物理清洗 (严苛筛选)</text>

    <g transform="translate(14, 40)">
      <rect width="242" height="84" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">历史累计交付汽车</text>
        <text class="val-large" fill="#64748b" x="0" y="26">970 万辆</text>
        <text class="card-body" x="0" y="46">自 2012 年以来的全部存量底盘</text>
      </g>
    </g>

    <g transform="translate(14, 138)">
      <rect width="242" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#991b1b" x="0" y="0">【硬件淘汰】剔除 HW3 车型</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="18">• 马斯克财报会承认 HW3 算力不足</text>
        <text class="card-body" fill="#7f1d1d" x="0" y="34">• 无法支撑端到端无监督完全自动驾驶</text>
        <text class="mono" fill="#b91c1c" x="0" y="54">FILTER: 仅计算 2023 年后交付车型</text>
      </g>
    </g>

    <g transform="translate(14, 252)">
      <rect width="242" height="96" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#1d4ed8" x="0" y="0">2030 有效无监督 FSD 车队</text>
        <text class="val-large" fill="#2563eb" x="0" y="26">1,600 万辆</text>
        <text class="card-body" x="0" y="46">路网实际可运行高阶 FSD 车辆总数</text>
      </g>
    </g>
  </g>

  <!-- Col 2: Penetration &amp; Subscriptions -->
  <g transform="translate(344, 86)">
    <rect width="280" height="370" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text class="box-title" x="14" y="24">2. 订阅渗透率与活跃订户</text>

    <!-- Base Case -->
    <g transform="translate(14, 40)">
      <rect width="252" height="140" rx="6" fill="#e0f2fe" stroke="#0288d1" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#0369a1" x="0" y="0">基准情境渗透率 (Base: 40%)</text>
        <text class="val-large" fill="#0288d1" x="0" y="26">640 万 付费订户</text>
        <text class="card-body" fill="#075985" x="0" y="48">• 当前存量渗透率仅约 15% (148 万户)</text>
        <text class="card-body" fill="#075985" x="0" y="64">• 得益于北美新车 50%+ 试用捆绑</text>
        <text class="card-body" fill="#075985" x="0" y="80">• 端到端 V12/V13 体验质变驱动复购</text>
      </g>
    </g>

    <!-- Bull Case -->
    <g transform="translate(14, 196)">
      <rect width="252" height="152" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">乐观情境渗透率 (Bull: 55%)</text>
        <text class="val-large" fill="#15803d" x="0" y="26">880 万 付费订户</text>
        <text class="card-body" x="0" y="48">• 假设无监督牌照在全美 30+ 州落地</text>
        <text class="card-body" x="0" y="64">• 保险费折扣反向倒逼车主开通</text>
        <text class="mono" fill="#16a34a" x="0" y="84">PEAK: 贡献极限软件利润空间</text>
      </g>
    </g>
  </g>

  <!-- Col 3: SaaS Financials &amp; Valuation -->
  <g transform="translate(648, 86)">
    <rect width="264" height="370" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text class="box-title" fill="#15803d" x="14" y="24">3. 财务转化与 30x PE 估值定锤</text>

    <g transform="translate(14, 40)">
      <rect width="236" height="96" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">年订阅流水收入</text>
        <text class="val-large" fill="#1d4ed8" x="0" y="26">83.2 亿美元</text>
        <text class="mono" fill="#2563eb" x="0" y="44">99 美元/月 (年化 1,300 美元)</text>
      </g>
    </g>

    <g transform="translate(14, 150)">
      <rect width="236" height="96" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <text class="card-title" x="0" y="0">扣税后净利润 (70% 纯利)</text>
        <text class="val-large" fill="#16a34a" x="0" y="26">58.2 亿美元</text>
        <text class="card-body" x="0" y="44">扣除云端数据中心推理与折旧</text>
      </g>
    </g>

    <g transform="translate(14, 260)">
      <rect width="236" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <g transform="translate(12, 16)">
        <text class="card-title" fill="#14532d" x="0" y="0">2030 年软件估值 (30x PE)</text>
        <text class="val-large" fill="#15803d" x="0" y="24">1,490 亿美元</text>
        <text class="card-title" fill="#14532d" x="0" y="46">折合每股: 40 美元</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 318 271 L 344 271" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="344,271 338,267 338,275" fill="#94a3b8"/>

  <path d="M 624 110 L 648 110" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="648,110 642,106 642,114" fill="#94a3b8"/>
</svg>