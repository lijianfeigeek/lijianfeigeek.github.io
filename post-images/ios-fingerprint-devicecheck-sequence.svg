<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ios-fingerprint-devicecheck-sequence-title ios-fingerprint-devicecheck-sequence-desc" id="ios-fingerprint-devicecheck-sequence-root">
        <title id="ios-fingerprint-devicecheck-sequence-title">Apple DeviceCheck 硬件级信任验签与 2-bit 云端同步时序</title>
        <desc id="ios-fingerprint-devicecheck-sequence-desc">展示从客户端生成硬件隔离区签名 Token 到服务端调用 Apple API 读写 2-bit 持久化状态的端到端交互时序</desc>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ios-fingerprint-devicecheck-sequence-root { --color-paper:   #f8f9fa;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ios-fingerprint-devicecheck-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-fingerprint-devicecheck-sequence-root .diagram-container { width: 100%; overflow-x: auto; }</style>
      <marker id="ios-fingerprint-devicecheck-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ios-fingerprint-devicecheck-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
      </marker>
      <marker id="ios-fingerprint-devicecheck-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <pattern id="ios-fingerprint-devicecheck-sequence-dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <rect width="100%" height="100%" fill="url(#ios-fingerprint-devicecheck-sequence-dots)" opacity="0.6"/>

        <!-- Lifeline Headers -->
        <g id="actor-1" transform="translate(60, 40)">
          <rect x="0" y="0" width="160" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <text x="80" y="27" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13" text-anchor="middle">iOS 客户端 (App)</text>
          <line x1="80" y1="44" x2="80" y2="440" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.15"/>
        </g>

        <!-- Actor 2: Secure Enclave (Accent) -->
        <g id="actor-2" transform="translate(290, 40)">
          <rect x="0" y="0" width="180" height="44" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <text x="90" y="27" fill="#bf4520" font-family="'Geist', sans-serif" font-weight="600" font-size="13" text-anchor="middle">Secure Enclave (芯片)</text>
          <line x1="90" y1="44" x2="90" y2="440" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.25"/>
        </g>

        <g id="actor-3" transform="translate(530, 40)">
          <rect x="0" y="0" width="170" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <text x="85" y="27" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13" text-anchor="middle">业务服务端 (Risk)</text>
          <line x1="85" y1="44" x2="85" y2="440" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.15"/>
        </g>

        <g id="actor-4" transform="translate(760, 40)">
          <rect x="0" y="0" width="160" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.18"/>
          <text x="80" y="27" fill="#2d3142" font-family="'Geist', sans-serif" font-weight="600" font-size="13" text-anchor="middle">Apple API Server</text>
          <line x1="80" y1="44" x2="80" y2="440" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.15"/>
        </g>

        <!-- Message 1: generateToken() -->
        <path d="M 140 120 L 375 120" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-devicecheck-sequence-arrow)"/>
        <rect x="180" y="106" width="160" height="20" rx="3" fill="#ffffff"/>
        <text x="260" y="120" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">1. generateToken()</text>

        <!-- Message 2: Return Token (Accent) -->
        <path d="M 380 160 L 145 160" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ios-fingerprint-devicecheck-sequence-arrow-accent)"/>
        <rect x="160" y="146" width="200" height="20" rx="3" fill="#ffffff"/>
        <text x="260" y="160" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">2. 返回硬件私钥签名 Token (一次性)</text>

        <!-- Message 3: Upload Token -->
        <path d="M 140 210 L 610 210" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#ios-fingerprint-devicecheck-sequence-arrow)"/>
        <rect x="290" y="196" width="180" height="20" rx="3" fill="#ffffff"/>
        <text x="380" y="210" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">3. 业务请求上报 Device Token</text>

        <!-- Message 4: Query 2-bit -->
        <path d="M 615 260 L 835 260" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#ios-fingerprint-devicecheck-sequence-arrow-link)"/>
        <rect x="640" y="246" width="180" height="20" rx="3" fill="#ffffff"/>
        <text x="730" y="260" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">4. POST /v1/query_two_bits</text>

        <!-- Message 5: Return 2-bit -->
        <path d="M 840 310 L 620 310" fill="none" stroke="#2e5aa8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ios-fingerprint-devicecheck-sequence-arrow-link)"/>
        <rect x="645" y="296" width="170" height="20" rx="3" fill="#ffffff"/>
        <text x="730" y="310" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">5. 返回 2-bit 状态 (00/01/10/11)</text>

        <!-- Message 6: Internal Risk Assessment -->
        <rect x="560" y="340" width="110" height="28" rx="4" fill="#2d3142" stroke="#2d3142" fill-opacity="0.06" stroke-opacity="0.15"/>
        <text x="615" y="358" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">6. 评估风险/首单判定</text>

        <!-- Message 7: Update 2-bit -->
        <path d="M 615 390 L 835 390" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ios-fingerprint-devicecheck-sequence-arrow-accent)"/>
        <rect x="640" y="376" width="180" height="20" rx="3" fill="#ffffff"/>
        <text x="730" y="390" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">7. POST /v1/update_two_bits (11)</text>

        <!-- Message 8: 200 OK -->
        <path d="M 840 430 L 620 430" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ios-fingerprint-devicecheck-sequence-arrow)"/>
        <rect x="665" y="416" width="130" height="20" rx="3" fill="#ffffff"/>
        <text x="730" y="430" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" text-anchor="middle">8. HTTP 200 OK (已持久化)</text>
      </svg>
