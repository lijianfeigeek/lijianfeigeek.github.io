<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brandpose-full-pipeline-architecture-title brandpose-full-pipeline-architecture-desc">
  <title id="brandpose-full-pipeline-architecture-title">BrandPose 空间智能与视线估计全景数据管线架构图</title>
  <desc id="brandpose-full-pipeline-architecture-desc">展示从 1080p 监控视频静态背景提取，到多模型并行感知、注意力过滤规则清洗，直至 3D 空间计算与 Blender 第一视角复原的全链路</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #334155; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Col 1: Input &amp; Background -->
  <g transform="translate(40, 30)">
    <rect width="200" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="28" class="label-badge" fill="#0284c7">阶段 1 · 静态背景提取</text>
    <text x="14" y="50" class="label-title">Clean Plate 重构</text>
    <line x1="14" y1="62" x2="186" y2="62" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(14, 76)">
      <rect width="172" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="22" class="label-title">1080p 监控视频</text>
      <text x="10" y="42" class="text-body">ACTi E43A 广角鱼眼</text>
      <text x="10" y="60" class="text-code">60s 便利店现场录像</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="172" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="22" class="label-title">时域中值滤波</text>
      <text x="10" y="42" class="text-body">ffmpeg 1.5fps 抽帧</text>
      <text x="10" y="60" class="text-body">NumPy 像素时间中值</text>
      <text x="10" y="78" class="text-code" fill="#0284c7">clean_plate.png 空铺</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 240 210 L 268 210" stroke="#64748b" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

  <!-- Col 2: Multi-Model Perception (Focal) -->
  <g transform="translate(270, 30)">
    <rect width="210" height="360" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="14" y="28" class="tag-coral">阶段 2 · 多模型并行感知</text>
    <text x="14" y="50" class="label-title" fill="#9a3412">骨骼、轮廓与视线</text>
    <line x1="14" y1="62" x2="196" y2="62" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(14, 76)">
      <rect width="182" height="65" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="20" class="label-title">YOLO11m-pose</text>
      <text x="10" y="38" class="text-body">30fps 全帧人体姿态</text>
      <text x="10" y="54" class="text-code">17 个关键点 + ByteTrack</text>
    </g>

    <g transform="translate(14, 150)">
      <rect width="182" height="65" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="10" y="20" class="label-title">YOLO11m-seg</text>
      <text x="10" y="38" class="text-body">全帧人体二值分割</text>
      <text x="10" y="54" class="text-code">person_masks_packed.npy</text>
    </g>

    <g transform="translate(14, 225)">
      <rect width="182" height="110" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="10" y="20" class="label-title" fill="#bf4520">Gaze-LLE ViT-L</text>
      <text x="10" y="38" class="text-body">动态头部正方形裁剪 (448)</text>
      <text x="10" y="56" class="text-body">10fps 视线热力图估算</text>
      <text x="10" y="74" class="text-code">gaze_heatmaps.npy (67x120)</text>
      <text x="10" y="96" class="tag-coral">自头抑制错误率直降 0%</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 480 210 L 508 210" stroke="#bf4520" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

  <!-- Col 3: Filter Rules -->
  <g transform="translate(510, 30)">
    <rect width="200" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="28" class="label-badge" fill="#64748b">阶段 3 · 注意力规则库</text>
    <text x="14" y="50" class="label-title">五道工业清洗防线</text>
    <line x1="14" y1="62" x2="186" y2="62" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(14, 76)">
      <text x="0" y="0" class="text-feat">1. 自头抑制 (1.5x 置零)</text>
      <text x="0" y="20" class="text-body">杜绝模型自锁头部</text>
      <text x="0" y="50" class="text-feat">2. 边缘死区 (32px 剔除)</text>
      <text x="0" y="70" class="text-body">消除画外边缘吸附伪影</text>
      <text x="0" y="100" class="text-feat">3. 人际注视掩膜碰撞</text>
      <text x="0" y="120" class="text-body">击中他人身体不计货架</text>
      <text x="0" y="150" class="text-feat">4. 轨迹断裂缝合</text>
      <text x="0" y="170" class="text-body">1.5s/150px 内聚类合并</text>
      <text x="0" y="200" class="text-feat">5. 店员梯子区间排除</text>
      <text x="0" y="220" class="text-body">理货员彻底移出商报</text>
    </g>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 710 210 L 738 210" stroke="#64748b" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

  <!-- Col 4: Spatial 3D &amp; POV -->
  <g transform="translate(740, 30)">
    <rect width="180" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="28" class="label-badge" fill="#15803d">阶段 4 · 空间计算与孪生</text>
    <text x="14" y="50" class="label-title">3D 重构与 POV</text>
    <line x1="14" y1="62" x2="166" y2="62" stroke="#f1f5f9" stroke-width="1"/>

    <g transform="translate(14, 76)">
      <rect width="152" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="20" class="label-title" fill="#15803d">人体标尺联合解算</text>
      <text x="10" y="38" class="text-body">66 组姿态 1.49m 锚定</text>
      <text x="10" y="56" class="text-code">相机 2.68m, k1=-0.318</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="152" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="20" class="label-title">Blender Cycles</text>
      <text x="10" y="38" class="text-body">顾客第一视角 POV</text>
      <text x="10" y="56" class="text-code">532 帧光线追踪渲染</text>
    </g>

    <g transform="translate(14, 245)">
      <rect width="152" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="20" class="label-title">商业价值报表</text>
      <text x="10" y="38" class="text-body">9大货架注视时长</text>
      <text x="10" y="56" class="text-body">纯代码数学合成音轨</text>
      <text x="10" y="74" class="text-code" fill="#15803d">797 个真实注视样本</text>
    </g>
  </g>
</svg>