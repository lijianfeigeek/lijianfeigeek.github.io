<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="card-scheme-chargeback-lifecycle-sequence-title card-scheme-chargeback-lifecycle-sequence-desc" id="card-scheme-chargeback-lifecycle-sequence-root">
        <title id="card-scheme-chargeback-lifecycle-sequence-title">拒付对抗与争议仲裁：四阶段终局裁判流水线</title>
        <desc id="card-scheme-chargeback-lifecycle-sequence-desc">初次请款、首次拒付（资金原路冲回）、再呈述二次请款举证与卡组织仲裁终局裁决</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #card-scheme-chargeback-lifecycle-sequence-root { --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3142;
      --muted: #4f5d75;
      --faint: #5a6580;
      --border: rgba(45, 49, 66, 0.12);
      --accent: #bf4520;
      --link: #2e5aa8; }
      #card-scheme-chargeback-lifecycle-sequence-root { color: var(--text); font-family: 'Geist', -apple-system, sans-serif; }
      #card-scheme-chargeback-lifecycle-sequence-root .diagram-frame { background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 1080px;
      width: 100%;
      min-width: 960px; }</style>
          <marker id="card-scheme-chargeback-lifecycle-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
          </marker>
          <marker id="card-scheme-chargeback-lifecycle-sequence-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8"/>
          </marker>
          <marker id="card-scheme-chargeback-lifecycle-sequence-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#bf4520"/>
          </marker>
        </defs>
        <!-- 4 Lifelines -->
        <g transform="translate(80, 20)">
          <rect x="0" y="0" width="140" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="70" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">商户 (Merchant)</text>
        </g>
        <line x1="150" y1="52" x2="150" y2="500" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(310, 20)">
          <rect x="0" y="0" width="140" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="70" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">收单行 (Acquirer)</text>
        </g>
        <line x1="380" y1="52" x2="380" y2="500" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <g transform="translate(540, 20)">
          <rect x="0" y="0" width="140" height="32" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.06"/>
          <text x="70" y="21" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">卡组织仲裁网 (Scheme)</text>
        </g>
        <line x1="610" y1="52" x2="610" y2="500" stroke="#bf4520" stroke-opacity="0.3" stroke-dasharray="3 3"/>

        <g transform="translate(740, 20)">
          <rect x="0" y="0" width="140" height="32" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
          <text x="70" y="21" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">发卡行 (Issuer)</text>
        </g>
        <line x1="810" y1="52" x2="810" y2="500" stroke="rgba(45,49,66,0.15)" stroke-dasharray="3 3"/>

        <!-- Phase 1: 初次请款 -->
        <g transform="translate(60, 68)">
          <rect x="0" y="0" width="840" height="70" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.12)"/>
          <text x="16" y="20" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">阶段一：初次请款 (FIRST PRESENTMENT · DE 24 = 200)</text>
        </g>
        <path d="M 380 110 L 605 110" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow)"/>
        <text x="495" y="103" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">正常上送消费请款文件</text>
        <path d="M 610 110 L 805 110" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow)"/>
        <text x="710" y="103" fill="#2d3142" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">清分扣账记入持卡人账单</text>

        <!-- Phase 2: 首次拒付 -->
        <g transform="translate(60, 150)">
          <rect x="0" y="0" width="840" height="90" rx="4" fill="#bf4520" stroke="rgba(191,69,32,0.2)" fill-opacity="0.03"/>
          <text x="16" y="20" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">阶段二：首次拒付 (FIRST CHARGEBACK · 45~180 天时效)</text>
        </g>
        <path d="M 810 195 L 615 195" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow-accent)"/>
        <text x="710" y="188" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">主张盗刷/未收到货，发起拒付 (DE 24 = 450)</text>

        <path d="M 610 215 L 385 215" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow-accent)"/>
        <text x="495" y="208" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">卡组织强制划扣收单行保证金归还发卡行</text>

        <path d="M 380 230 L 155 230" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow)"/>
        <text x="265" y="223" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">通知商户资金被扣，下达抗辩举证通知</text>

        <!-- Phase 3: 二次请款抗辩 -->
        <g transform="translate(60, 252)">
          <rect x="0" y="0" width="840" height="90" rx="4" fill="#ffffff" stroke="rgba(46,90,168,0.2)"/>
          <text x="16" y="20" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">阶段三：二次呈述 / 申诉再请款 (REPRESENTMENT · 证据链反驳)</text>
        </g>
        <path d="M 150 295 L 375 295" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow-link)"/>
        <text x="265" y="288" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">组织物流签收单 / IP / 设备指纹抗辩</text>

        <path d="M 380 315 L 605 315" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow-link)"/>
        <text x="495" y="308" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">重新请款 (DE 24 = 205) 附带举证数据包</text>

        <path d="M 610 330 L 805 330" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow-link)"/>
        <text x="710" y="323" fill="#2e5aa8" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">下发材料予发卡行二次审阅</text>

        <!-- Phase 4: 终局仲裁裁决 -->
        <g transform="translate(60, 354)">
          <rect x="0" y="0" width="840" height="130" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.06"/>
          <text x="16" y="20" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="11" font-weight="600">阶段四：终局仲裁 (ARBITRATION CHARGEBACK · 输家通吃昂贵仲裁费)</text>
        </g>
        <path d="M 810 395 L 615 395" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#card-scheme-chargeback-lifecycle-sequence-arrow-accent)"/>
        <text x="710" y="388" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" text-anchor="middle">发卡行拒绝接纳，上诉卡组织仲裁委员会 (DE 24 = 451)</text>

        <g transform="translate(320, 420)">
          <rect x="0" y="0" width="320" height="48" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
          <text x="160" y="20" fill="#bf4520" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">卡组织仲裁委根据客观证据终局判定</text>
          <text x="160" y="36" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="10" text-anchor="middle">败诉方全额赔付资损 + 承担 500+ 美元巨额仲裁规费</text>
        </g>
      </svg>
