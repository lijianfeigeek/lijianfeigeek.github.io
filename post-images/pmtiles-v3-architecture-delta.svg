<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="pmt-delta-title pmt-delta-desc" id="pmt-architecture-delta-root" data-diagram="architecture-delta">
  <title id="pmt-delta-title">地图瓦片服务拓扑演进：传统服务端与百万小文件方案 vs PMTiles v3 单文件 Range 架构</title>
  <desc id="pmt-delta-desc">对比传统地图瓦片部署（动态瓦片服务器与海量 Z/X/Y 静态小文件）与 PMTiles v3 云原生单文件架构的拓扑差异，包含中间变更清册（REMOVED、CHANGED、ADDED、REWIRED）。</desc>
  <defs>
    <style>
      #pmt-architecture-delta-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="pmt-delta-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.24"/>
    </pattern>
    <marker id="pmt-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="pmt-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="pmt-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="1000" height="540" fill="#f8fafc"/>
  <rect width="1000" height="540" fill="url(#pmt-delta-dots)"/>

  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">Topology Delta: Traditional Tile Stack vs. PMTiles v3 Single-File Architecture</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">ELIMINATING CUSTOM TILE SERVERS &amp; MILLIONS OF S3 OBJECTS WITH HTTP BYTE SERVING (RANGE REQUESTS)</text>

  <!-- Panel Headers -->
  <text x="32" y="88" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#475569">BEFORE · 传统动态服务 / 海量小文件</text>
  <text x="364" y="88" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#bf4520">CHANGES LEDGER · 架构变更清册</text>
  <text x="668" y="88" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#0284c7">AFTER · PMTILES V3 零运维静态架构</text>

  <!-- BEFORE SNAPSHOT -->
  <g data-snapshot="before" data-grid="304 380 4" transform="translate(32, 100)">
    <rect x="0" y="0" width="304" height="380" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Relationships (drawn before nodes) -->
    <path data-kind="relationship" data-object-id="r_client_proxy" data-status="rewired" data-signature="proto=http-zxy" d="M 152 84 L 152 116" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#pmt-arrow-muted)"/>
    <path data-kind="relationship" data-object-id="r_proxy_store" data-status="removed" data-signature="proto=sqlite-or-fs" d="M 152 184 L 152 216" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#pmt-arrow-muted)"/>
    <path data-kind="relationship" data-object-id="r_store_s3" data-status="removed" data-signature="proto=s3-getobject" d="M 152 284 L 152 308" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#pmt-arrow-muted)"/>

    <!-- Arrow Labels with opaque masks -->
    <rect x="104" y="92" width="96" height="16" rx="2" fill="#ffffff"/>
    <text x="152" y="103" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#475569">GET /Z/X/Y.MVT</text>
    <rect x="104" y="192" width="96" height="16" rx="2" fill="#ffffff"/>
    <text x="152" y="203" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">SQL / DISK SEEK</text>

    <!-- Node 1: Map Client -->
    <g data-kind="component" data-object-id="client" data-status="changed" data-signature="client=maplibre-zxy">
      <rect data-role="bounds" x="24" y="20" width="256" height="64" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
      <text x="40" y="42" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">地图前端渲染器 (MapLibre / OL)</text>
      <text x="40" y="62" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">请求分散的 /{z}/{x}/{y}.mvt 离散接口</text>
    </g>

    <!-- Node 2: Tile Server (REMOVED) -->
    <g data-kind="component" data-object-id="tileserver" data-status="removed" data-signature="role=tile-daemon">
      <rect data-role="bounds" x="24" y="120" width="256" height="64" rx="6" fill="#fef2f2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
      <rect x="216" y="128" width="56" height="16" rx="2" fill="#fee2e2"/>
      <text x="244" y="139" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#b91c1c">− REMOVED</text>
      <text x="40" y="146" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#475569">常驻瓦片服务器 / Martin / Tegola</text>
      <text x="40" y="166" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">需维护容器扩缩容、内存缓存与健康检查</text>
    </g>

    <!-- Node 3: MBTiles / Millions of files (REMOVED) -->
    <g data-kind="component" data-object-id="mbtiles" data-status="removed" data-signature="format=sqlite-or-dir">
      <rect data-role="bounds" x="24" y="220" width="256" height="64" rx="6" fill="#fef2f2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
      <rect x="216" y="228" width="56" height="16" rx="2" fill="#fee2e2"/>
      <text x="244" y="239" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#b91c1c">− REMOVED</text>
      <text x="40" y="246" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#475569">MBTiles (SQLite) 或千万级散列文件</text>
      <text x="40" y="266" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">SQLite 无法 HTTP Range · 散文件上传耗时数天</text>
    </g>

    <!-- Node 4: Storage -->
    <g data-kind="component" data-object-id="storage" data-status="changed" data-signature="storage=block-or-small-objects">
      <rect data-role="bounds" x="24" y="308" width="256" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
      <text x="40" y="332" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">块存储磁盘 / 千万级 S3 小对象</text>
      <text x="40" y="350" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#64748b">高昂 IOPS / PUT 请求费 / 无法单文件原子替换</text>
    </g>
  </g>

  <!-- CENTER CHANGES LEDGER -->
  <g transform="translate(364, 100)">
    <rect x="0" y="0" width="276" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <g transform="translate(16, 20)">
      <rect x="0" y="0" width="244" height="60" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
      <text data-change="REMOVED" data-target="tileserver" x="12" y="19" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#b91c1c">REMOVED tileserver &amp; mbtiles</text>
      <text x="12" y="36" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#334155">彻底移除常驻后端进程与 SQLite 锁瓶颈</text>
      <text x="12" y="51" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">零容器运维 · 零数据库同步 · 无千万级小文件</text>
    </g>

    <g transform="translate(16, 92)">
      <rect x="0" y="0" width="244" height="64" rx="4" fill="#fef2ee" stroke="#bf4520" stroke-width="1"/>
      <text data-change="ADDED" data-target="pmtiles_archive" x="12" y="19" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#bf4520">+ ADDED pmtiles_archive (v3)</text>
      <text x="12" y="37" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#0f172a">Hilbert 曲线聚类 + RLE 去重单文件归档</text>
      <text x="12" y="53" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#475569">127B Header + &lt;=16KiB Root Dir 单次原子替换</text>
    </g>

    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="244" height="64" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
      <text data-change="CHANGED" data-target="client" x="12" y="19" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#0369a1">Δ CHANGED client (pmtiles://)</text>
      <text x="12" y="37" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#0f172a">内置 addProtocol 与 SharedPromiseCache</text>
      <text x="12" y="53" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#475569">本地计算 Hilbert TileID，二分目录直寻字节偏移</text>
    </g>

    <g transform="translate(16, 244)">
      <rect x="0" y="0" width="244" height="56" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text data-change="REWIRED" data-target="r_client_proxy" x="12" y="19" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#334155">⇄ REWIRED HTTP Range Bytes</text>
      <text x="12" y="36" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#334155">HTTP 206 Partial Content 替代散点 API</text>
      <text x="12" y="49" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">支持浏览器直连 S3/R2 或极简边缘 Worker 代理</text>
    </g>

    <g transform="translate(16, 312)">
      <rect x="0" y="0" width="244" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text data-change="ADDED" data-target="edge_proxy" x="12" y="18" font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#059669">+ OPTIONAL edge_proxy (R2/S3)</text>
      <text x="12" y="36" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11" fill="#334155">需要标准 ZXY / TileJSON 时按需挂载边缘函数</text>
    </g>
  </g>

  <!-- AFTER SNAPSHOT -->
  <g data-snapshot="after" data-grid="304 380 4" transform="translate(668, 100)">
    <rect x="0" y="0" width="300" height="380" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>

    <!-- Relationships (drawn before nodes) -->
    <path data-kind="relationship" data-object-id="r_client_pmtiles" data-status="added" data-signature="proto=range-bytes" d="M 104 84 L 104 204" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#pmt-arrow-accent)"/>
    <path data-kind="relationship" data-object-id="r_client_edge" data-status="added" data-signature="proto=optional-zxy" d="M 200 84 L 200 116" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#pmt-arrow-link)"/>
    <path data-kind="relationship" data-object-id="r_edge_pmtiles" data-status="added" data-signature="proto=r2-s3-range" d="M 200 180 L 200 204" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#pmt-arrow-link)"/>
    <path data-kind="relationship" data-object-id="r_pmtiles_storage" data-status="added" data-signature="layout=single-blob" d="M 150 284 L 150 308" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#pmt-arrow-muted)"/>

    <!-- Arrow Labels with opaque masks -->
    <rect x="28" y="132" width="108" height="16" rx="2" fill="#ffffff"/>
    <text x="82" y="143" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">RANGE: BYTES=O-L</text>
    <rect x="156" y="92" width="96" height="16" rx="2" fill="#ffffff"/>
    <text x="204" y="103" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" fill="#0369a1">ZXY / TILEJSON</text>

    <!-- Node 1: Client (CHANGED) -->
    <g data-kind="component" data-object-id="client" data-status="changed" data-signature="client=pmtiles-protocol">
      <rect data-role="bounds" x="20" y="20" width="260" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
      <rect x="208" y="28" width="64" height="16" rx="2" fill="#e0f2fe"/>
      <text x="240" y="39" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#0369a1">Δ CHANGED</text>
      <text x="34" y="46" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">前端直读 pmtiles:// 协议栈</text>
      <text x="34" y="66" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#334155">SharedPromiseCache + FetchSource 直查</text>
    </g>

    <!-- Node 2: Optional Edge Proxy (ADDED) -->
    <g data-kind="component" data-object-id="edge_proxy" data-status="added" data-signature="role=cf-worker-or-lambda">
      <rect data-role="bounds" x="148" y="120" width="132" height="60" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.1" stroke-dasharray="4,3"/>
      <text x="160" y="142" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#0369a1">可选边缘代理层</text>
      <text x="160" y="160" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#475569">CF Worker / Lambda</text>
    </g>

    <!-- Node 3: Single PMTiles v3 Archive (ADDED Focal) -->
    <g data-kind="component" data-object-id="pmtiles_archive" data-status="added" data-signature="format=pmtiles-v3">
      <rect data-role="bounds" x="20" y="208" width="260" height="76" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
      <rect x="212" y="216" width="60" height="16" rx="2" fill="#bf4520"/>
      <text x="242" y="227" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#ffffff">+ ADDED</text>
      <text x="34" y="236" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#bf4520">单一 .pmtiles 归档文件 (v3)</text>
      <text x="34" y="256" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#334155">127B Header + &lt;=16KiB Root + Clustered Blobs</text>
      <text x="34" y="272" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">Etag 一致性防撕裂 · RLE 海洋/空瓦片极致去重</text>
    </g>

    <!-- Node 4: Commodity Object Storage -->
    <g data-kind="component" data-object-id="storage" data-status="changed" data-signature="storage=single-s3-r2-object">
      <rect data-role="bounds" x="20" y="308" width="260" height="56" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
      <text x="34" y="332" font-family="'Geist', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">廉价静态对象存储 / CDN (S3 / R2)</text>
      <text x="34" y="350" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">仅存 1 个对象 · 206 Range 缓存命中率极高</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <line x1="32" y1="496" x2="968" y2="496" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 518)">
    <text x="0" y="3" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="76" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="98" y="3" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#bf4520">核心增量格式：PMTiles v3 单文件归档 + Range 零服务器直连</text>
    <rect x="480" y="-8" width="14" height="14" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="502" y="3" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#0369a1">协议与边缘适配：客户端协议栈或可选无状态 Worker</text>
    <rect x="816" y="-8" width="14" height="14" rx="2" fill="#fef2f2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="838" y="3" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#64748b">已淘汰组件</text>
  </g>
</svg>
