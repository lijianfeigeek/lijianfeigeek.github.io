<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="jev-future-stack-title jev-future-stack-desc">
  <title id="jev-future-stack-title">未来 AI 生产流水线四层协同分层架构</title>
  <desc id="jev-future-stack-desc">展示战略大脑规划、极速反射中枢、标准交互基建与物理执行机的四层解耦协作流水线</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .layer-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .focal-layer { fill: #ffffff; stroke: #bf4520; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-focal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #bf4520; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
      .focal-pill { fill: rgba(191,69,32,0.06); stroke: rgba(191,69,32,0.25); stroke-width: 1; rx: 4; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .focal-line { stroke: #bf4520; stroke-width: 1.5; fill: none; }
      .dash-line { stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    </style>
    <marker id="arrow6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow6-focal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bf4520" />
    </marker>
    <marker id="arrow6-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- 4 Horizontal Layers -->
  <!-- Layer 1: Strategic Brain (y=40, h=75) -->
  <g transform="translate(60, 40)">
    <rect width="840" height="75" rx="8" class="layer-card" />
    <text x="20" y="26" class="text-title">1. 战略规划大脑 (System 2: 旗舰大模型 / 慢思考)</text>
    <text x="680" y="26" class="text-muted">GPT-5 / Claude 3.7 / Gemini 2</text>
    <g transform="translate(20, 36)">
      <rect width="250" height="28" class="pill" />
      <text x="10" y="18" class="text-subtitle">宏观业务目标分解</text>
    </g>
    <g transform="translate(290, 36)">
      <rect width="250" height="28" class="pill" />
      <text x="10" y="18" class="text-subtitle">多步骤推演与逻辑路线图</text>
    </g>
    <g transform="translate(560, 36)">
      <rect width="260" height="28" class="pill" />
      <text x="10" y="18" class="text-subtitle">非预期异常与熔断仲裁</text>
    </g>
  </g>

  <!-- Connector L1 -> L2 -->
  <line x1="480" y1="115" x2="480" y2="138" class="focal-line" marker-end="url(#arrow6-focal)" />
  <text x="495" y="130" font-family="sans-serif" font-size="10" font-weight="600" fill="#bf4520">制定宏观路线图</text>

  <!-- Layer 2: Fast Reflex Center (y=145, h=85) - Focal -->
  <g transform="translate(60, 145)">
    <rect width="840" height="85" rx="8" class="focal-layer" />
    <text x="20" y="26" class="text-focal-title">2. 极速反射中枢 (System 1: Jev / 非自回归校准决策)</text>
    <text x="670" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#bf4520">70ms~90ms 硬件级反射</text>
    <g transform="translate(20, 36)">
      <rect width="250" height="36" class="focal-pill" />
      <text x="10" y="18" class="text-subtitle" fill="#bf4520">状态分类 (State Classify)</text>
      <text x="10" y="30" class="text-muted">当前步骤类型归因</text>
    </g>
    <g transform="translate(290, 36)">
      <rect width="250" height="36" class="focal-pill" />
      <text x="10" y="18" class="text-subtitle" fill="#bf4520">工具选拔与路由 (Routing)</text>
      <text x="10" y="30" class="text-muted">离散候选毫秒级命中</text>
    </g>
    <g transform="translate(560, 36)">
      <rect width="260" height="36" class="focal-pill" />
      <text x="10" y="18" class="text-subtitle" fill="#bf4520">置信度过滤 (Confidence &gt; 0.85)</text>
      <text x="10" y="30" class="text-muted">低于阈值瞬时熔断上报</text>
    </g>
  </g>

  <!-- Connector L2 -> L3 -->
  <line x1="480" y1="230" x2="480" y2="253" class="line" marker-end="url(#arrow6)" />
  <text x="495" y="245" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">毫秒级高频选拔</text>

  <!-- Layer 3: Standard Protocol (y=260, h=75) -->
  <g transform="translate(60, 260)">
    <rect width="840" height="75" rx="8" class="layer-card" />
    <text x="20" y="26" class="text-title">3. 标准交互基建层 (WebMCP / MCP / OS Accessibility)</text>
    <text x="690" y="26" class="text-muted">结构化数字契约</text>
    <g transform="translate(20, 36)">
      <rect width="380" height="28" class="pill" />
      <text x="10" y="18" class="text-subtitle">结构化工具暴露 (OpenAPI / 语义原子动作)</text>
    </g>
    <g transform="translate(440, 36)">
      <rect width="380" height="28" class="pill" />
      <text x="10" y="18" class="text-subtitle">消除像素模糊 · 彻底阻隔广告与弹窗噪声</text>
    </g>
  </g>

  <!-- Connector L3 -> L4 -->
  <line x1="480" y1="335" x2="480" y2="358" class="line" marker-end="url(#arrow6)" />
  <text x="495" y="350" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">无歧义指令交付</text>

  <!-- Layer 4: Physical Hands (y=365, h=65) -->
  <g transform="translate(60, 365)">
    <rect width="840" height="65" rx="8" class="layer-card" />
    <text x="20" y="24" class="text-title">4. 物理执行机 (Native Driver / Playwright / Stagehand)</text>
    <text x="690" y="24" class="text-muted">端侧与浏览器驱动</text>
    <g transform="translate(20, 32)">
      <text x="0" y="18" class="text-body">• 本地键鼠事件分发 / 浏览器内核原生无损请求 / 数据指标上报</text>
    </g>
  </g>

  <!-- Feedback Loop (Right side: L4 -> L1) -->
  <path d="M 900 395 L 930 395 Q 940 395 940 380 L 940 90 Q 940 75 930 75 L 908 75" class="dash-line" marker-end="url(#arrow6-red)" />
  <text x="948" y="240" font-family="sans-serif" font-size="10" font-weight="700" fill="#ef4444" transform="rotate(90 948 240)">未知环境异常 / 置信度熔断</text>
</svg>