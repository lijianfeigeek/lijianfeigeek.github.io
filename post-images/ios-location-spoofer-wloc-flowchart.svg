<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="ils-fc-title ils-fc-desc" id="ios-location-spoofer-wloc-flowchart-root">
        <title id="ils-fc-title">WLOC 4+1 封包探测与最小改写决策流</title>
        <desc id="ils-fc-desc">展示 spoofAppleResponse 函数依次探测 Synthetic、ARPC、Marker、Bare 四类封包格式，失败时降级至 0-256 字节滑窗扫描，并经由 patchWlocPayload 最小改写与 failOpen 兜底的完整控制流。</desc>
        <defs>
      <style>#ios-location-spoofer-wloc-flowchart-root { --color-paper: #f8fafc;
      --color-ink: #1e293b;
      --color-muted: #475569;
      --color-accent: #bf4520;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', Georgia, serif;
      --font-mono: 'Geist Mono', 'SFMono-Regular', ui-monospace, monospace; }
      #ios-location-spoofer-wloc-flowchart-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ios-location-spoofer-wloc-flowchart-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ios-location-spoofer-wloc-flowchart-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="ios-location-spoofer-wloc-flowchart-dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.24"/>
          </pattern>
          <marker id="ios-location-spoofer-wloc-flowchart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="ios-location-spoofer-wloc-flowchart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="ios-location-spoofer-wloc-flowchart-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
          </marker>
        </defs>

        <rect width="960" height="584" fill="#f8fafc"/>
        <rect width="960" height="584" fill="url(#ios-location-spoofer-wloc-flowchart-dots)"/>

        <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">WLOC 4+1 Envelope Extraction &amp; Minimal Rewrite</text>
        <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">SPOOFAPPLERESPONSE() · SYNTHETIC / ARPC / MARKER / BARE / RAW SCAN · TAG 3,4,33 PASSTHROUGH</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- Start -> Envelope Check 1 -->
        <line x1="200" y1="124" x2="200" y2="152" stroke="#475569" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow)"/>

        <!-- Synthetic/ARPC Diamond -> YES (Right) to Collector -->
        <path d="M 300 184 L 452 184 Q 460 184 460 192 L 460 220" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow-link)"/>
        <rect x="344" y="160" width="72" height="16" rx="2" fill="#f8fafc"/>
        <text x="380" y="172" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#0284c7">MATCH 1-2</text>

        <!-- Synthetic/ARPC Diamond -> NO (Down) to Marker/Bare Diamond -->
        <line x1="200" y1="216" x2="200" y2="248" stroke="#475569" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow)"/>
        <rect x="212" y="222" width="44" height="16" rx="2" fill="#f8fafc"/>
        <text x="234" y="234" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">MISS</text>

        <!-- Marker/Bare Diamond -> YES (Right) to Patch -->
        <path d="M 300 280 L 404 280 Q 412 280 412 272 L 412 264 Q 412 256 420 256 L 432 256" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow-link)"/>
        <rect x="320" y="256" width="72" height="16" rx="2" fill="#f8fafc"/>
        <text x="356" y="268" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#0284c7">MATCH 3-4</text>

        <!-- Marker/Bare Diamond -> NO (Down) to Raw Scan Fallback -->
        <line x1="200" y1="312" x2="200" y2="348" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow-accent)"/>
        <rect x="212" y="320" width="76" height="16" rx="2" fill="#f8fafc"/>
        <text x="250" y="332" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#bf4520">ALL MISS</text>

        <!-- Raw Scan -> Success (Right-Up to Reassemble) -->
        <path d="M 320 396 L 552 396 Q 560 396 560 388 L 560 372" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow-accent)"/>
        <rect x="380" y="372" width="108" height="16" rx="2" fill="#f8fafc"/>
        <text x="434" y="384" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#bf4520">WIFI/CELL &gt; 0</text>

        <!-- Raw Scan -> Fail (Down to FailOpen Diamond) -->
        <line x1="200" y1="420" x2="200" y2="452" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow)"/>
        <rect x="212" y="426" width="60" height="16" rx="2" fill="#f8fafc"/>
        <text x="242" y="438" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">THROW</text>

        <!-- Patch WLOC -> Reassemble -->
        <line x1="560" y1="292" x2="560" y2="320" stroke="#0284c7" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow-link)"/>
        <rect x="572" y="298" width="96" height="16" rx="2" fill="#f8fafc"/>
        <text x="620" y="310" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#0284c7">PATCHED</text>

        <!-- Reassemble -> Output 200 -->
        <line x1="688" y1="344" x2="736" y2="344" stroke="#0284c7" stroke-width="1.4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow-link)"/>

        <!-- FailOpen -> PassThrough (Right) -->
        <line x1="300" y1="484" x2="736" y2="484" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ios-location-spoofer-wloc-flowchart-arrow)"/>
        <rect x="460" y="460" width="128" height="16" rx="2" fill="#f8fafc"/>
        <text x="524" y="472" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">TRUE · $done({})</text>

        <!-- Patch Error -> FailOpen -->
        <path d="M 688 256 L 708 256 Q 716 256 716 264 L 716 436 Q 716 444 708 444 L 252 444 Q 244 444 244 452 L 244 468" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>

        <!-- Nodes -->
        <!-- 1. Start Oval -->
        <g transform="translate(80, 76)">
          <rect x="0" y="0" width="240" height="48" rx="24" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
          <text x="120" y="22" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">截获 /clls/wloc 二进制响应</text>
          <text x="120" y="37" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9" fill="#64748b">Uint8Array · binary-body-mode=1</text>
        </g>

        <!-- 2. Decision 1: Synthetic / ARPC -->
        <g transform="translate(100, 152)">
          <polygon points="100,0 200,32 100,64 0,32" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
          <text x="100" y="29" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">1. Synthetic / 2. ARPC?</text>
          <text x="100" y="44" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">0001..0000 / Pascal Header</text>
        </g>

        <!-- 3. Decision 2: Marker / Bare -->
        <g transform="translate(100, 248)">
          <polygon points="100,0 200,32 100,64 0,32" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
          <text x="100" y="29" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">3. Marker / 4. Bare?</text>
          <text x="100" y="44" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">000000010000 / Raw PB</text>
        </g>

        <!-- 4. Focal Node: Sliding Window Raw Scan -->
        <g transform="translate(80, 348)">
          <rect x="0" y="0" width="240" height="72" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
          <rect x="12" y="8" width="92" height="14" rx="2" fill="#bf4520"/>
          <text x="58" y="18" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#ffffff">FALLBACK SCAN</text>
          <text x="120" y="38" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">5. 滑窗特征扫描兜底</text>
          <text x="120" y="56" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">0..96 (step 2) -&gt; 0..256 (step 1)</text>
        </g>

        <!-- 5. Core Step: Minimal Rewrite -->
        <g transform="translate(432, 220)">
          <rect x="0" y="0" width="256" height="72" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
          <rect x="12" y="8" width="108" height="14" rx="2" fill="#e0f2fe"/>
          <text x="66" y="18" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#0284c7">MINIMAL REWRITE</text>
          <text x="128" y="38" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">patchWlocPayload() 最小改写</text>
          <text x="128" y="56" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">改 Tag2(WiFi)/22,24(Cell) · 透传 3,4,33</text>
        </g>

        <!-- 6. Reassemble Packet -->
        <g transform="translate(432, 320)">
          <rect x="0" y="0" width="256" height="52" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
          <text x="128" y="23" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">封包重封装与长度校验</text>
          <text x="128" y="40" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">ArpcCodec.serialize / Marker / Synthetic</text>
        </g>

        <!-- 7. Output 200 -->
        <g transform="translate(736, 320)">
          <rect x="0" y="0" width="192" height="48" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
          <text x="96" y="21" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#065f46">返回伪造 WLOC 200</text>
          <text x="96" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#059669">X-Location-Spoofer: active</text>
        </g>

        <!-- 8. Decision: FailOpen -->
        <g transform="translate(100, 452)">
          <polygon points="100,0 200,32 100,64 0,32" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
          <text x="100" y="29" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">failOpen == true?</text>
          <text x="100" y="44" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">Default: true (Safe)</text>
        </g>

        <!-- 9. PassThrough Oval -->
        <g transform="translate(736, 460)">
          <rect x="0" y="0" width="192" height="48" rx="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
          <text x="96" y="21" text-anchor="middle" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">静默透传原始定位包</text>
          <text x="96" y="36" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">Zero Disruption Fallback</text>
        </g>

        <!-- Legend -->
        <line x1="32" y1="536" x2="928" y2="536" stroke="#e2e8f0" stroke-width="1"/>
        <g transform="translate(32, 554)">
          <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
          <rect x="76" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
          <text x="98" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">未知前缀兜底：0-256 字节滑窗扫描</text>
          <rect x="348" y="-8" width="14" height="14" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
          <text x="370" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#0284c7">最小改写核心：仅覆写经纬度与水平精度</text>
          <line x1="656" y1="-1" x2="684" y2="-1" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3"/>
          <text x="694" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">异常安全透传链路</text>
        </g>
      </svg>
