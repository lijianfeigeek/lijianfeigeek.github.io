<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="fullArchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="purpleBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="680" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="632" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Header -->
  <g transform="translate(60, 54)">
    <rect x="0" y="0" width="160" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="700">terminal_worse 全栈系统架构与模块协同图谱</text>
    <text x="0" y="74" fill="#475569" font-size="13">从二进制注入、containermanagerd 权限借调、APFS 节点探针到独立 APT 运行时生态的完整设计</text>
  </g>

  <!-- Left Column: Host &amp; Injection -->
  <g transform="translate(60, 150)">
    <rect width="310" height="456" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#f8fafc" />
      <text x="10" y="15" fill="#334155" font-size="10" font-weight="700">LAYER 1</text>
      <text x="86" y="16" fill="#f8fafc" font-size="14" font-weight="700">宿主底座与动态注入</text>
      <text x="0" y="38" fill="#475569" font-size="11">Mach-O Patch &amp; Lifecycle Hook</text>
    </g>

    <!-- Sub-card 1: a-Shell Base -->
    <g transform="translate(18, 70)">
      <rect width="274" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#0284c7" font-size="12" font-weight="600">a-Shell 2.3.2 完整运行时</text>
      <text x="14" y="42" fill="#334155" font-size="11">集成 Python 3.11, clang/LLVM,</text>
      <text x="14" y="58" fill="#334155" font-size="11">Lua, TeX, OpenSSH, Vim, Git</text>
      <text x="14" y="78" fill="#334155" font-size="11">进程内虚拟多线程 CLI 命令体系</text>
      <text x="14" y="94" fill="#475569" font-size="10">限制：原生不允许执行外部独立 Mach-O</text>
    </g>

    <!-- Sub-card 2: LIEF Mach-O Injection -->
    <g transform="translate(18, 188)">
      <rect width="274" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#0284c7" font-size="12" font-weight="600">LIEF 动态库依赖注入</text>
      <text x="14" y="42" fill="#334155" font-size="11">Mach-O 注入弱加载指令：</text>
      <text x="14" y="60" fill="#d97706" font-size="10" font-family="monospace">LC_LOAD_DYLIB (weak_lib)</text>
      <text x="14" y="78" fill="#334155" font-size="11">指向 @executable_path/Frameworks/</text>
      <text x="14" y="94" fill="#334155" font-size="11">TerminalSBX.dylib 核心动态库</text>
      <text x="14" y="108" fill="#475569" font-size="9">实现无需源码即可挂载自定义底层能力</text>
    </g>

    <!-- Sub-card 3: Constructor Hook -->
    <g transform="translate(18, 316)">
      <rect width="274" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#0284c7" font-size="12" font-weight="600">构造函数拦截与状态初始化</text>
      <text x="14" y="42" fill="#a7f3d0" font-size="11">__attribute__((constructor))</text>
      <text x="14" y="60" fill="#334155" font-size="11">强制置空 keep_content (冷启动重置)</text>
      <text x="14" y="78" fill="#334155" font-size="11">创建独立脱离线程 (pthread_detach)</text>
      <text x="14" y="96" fill="#334155" font-size="11">弹出全屏原生阻塞进度条 (UIWindow)</text>
      <text x="14" y="110" fill="#475569" font-size="9">保证挂载完成前终端处于安全阻断状态</text>
    </g>
  </g>

  <!-- Middle Column: Escape Engine &amp; VFS Auto-mount -->
  <g transform="translate(395, 150)">
    <rect width="330" height="456" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#fff1f2" />
      <text x="10" y="15" fill="#fecaca" font-size="10" font-weight="700">LAYER 2</text>
      <text x="86" y="16" fill="#f8fafc" font-size="14" font-weight="700">沙盒逃逸与 APFS 探测</text>
      <text x="0" y="38" fill="#475569" font-size="11">worse_query &amp; fsgetpath 穿透</text>
    </g>

    <!-- Sub-card 1: WorseQuery Dual-Track -->
    <g transform="translate(18, 70)">
      <rect width="294" height="116" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1" />
      <text x="14" y="22" fill="#e11d48" font-size="12" font-weight="700">WorseQuery 双轨逃逸核心</text>
      <text x="14" y="42" fill="#334155" font-size="11">主轨：App Group Library/Caches</text>
      <text x="14" y="58" fill="#e11d48" font-size="10">符号链接欺骗 containermanagerd</text>
      <text x="14" y="76" fill="#334155" font-size="11">备轨：Class 13 系统组路径回退</text>
      <text x="14" y="92" fill="#334155" font-size="10">mobilegestaltcache ../../../.. 穿越</text>
      <text x="14" y="108" fill="#e11d48" font-size="9">获得任意文件系统路径 Sandbox Token</text>
    </g>

    <!-- Sub-card 2: Pathleak Inode Scanner -->
    <g transform="translate(18, 198)">
      <rect width="294" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#0284c7" font-size="12" font-weight="600">APFS 节点爆破探针 (pathleak)</text>
      <text x="14" y="42" fill="#334155" font-size="11">突破 iOS 27 父目录权限封锁硬限制</text>
      <text x="14" y="60" fill="#d97706" font-size="10" font-family="monospace">fsgetpath(&amp;fsid, inode) 扫描</text>
      <text x="14" y="78" fill="#334155" font-size="11">毫秒级遍历 200 万 Inode 空间</text>
      <text x="14" y="94" fill="#334155" font-size="11">提取 Application / Daemon 容器真实 UUID</text>
      <text x="14" y="108" fill="#475569" font-size="9">无需父目录遍历权限即可枚举全部子容器</text>
    </g>

    <!-- Sub-card 3: VFS Auto-mount Mesh -->
    <g transform="translate(18, 326)">
      <rect width="294" height="108" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#0284c7" font-size="12" font-weight="600">虚拟文件系统织网 (~/_sandbox)</text>
      <text x="14" y="42" fill="#334155" font-size="11">apps/ 按 Bundle ID 编排 (com.tencent.xin...)</text>
      <text x="14" y="60" fill="#334155" font-size="10">符号链接映射 Documents/ Library/ tmp/ _data</text>
      <text x="14" y="78" fill="#334155" font-size="11">system/ systemgroups/ daemons/ gestalt/</text>
      <text x="14" y="96" fill="#059669" font-size="10">输出 .mount_info 清单与挂载度量数据</text>
    </g>
  </g>

  <!-- Right Column: Package Ecosystem &amp; UX -->
  <g transform="translate(750, 150)">
    <rect width="290" height="456" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#f0fdf4" />
      <text x="10" y="15" fill="#a7f3d0" font-size="10" font-weight="700">LAYER 3</text>
      <text x="86" y="16" fill="#f8fafc" font-size="14" font-weight="700">独立生态与人机交互</text>
      <text x="0" y="38" fill="#475569" font-size="11">termenv / APT / DPKG 体系</text>
    </g>

    <!-- Sub-card 1: termenv Package Ecosystem -->
    <g transform="translate(18, 70)">
      <rect width="254" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#059669" font-size="12" font-weight="600">termenv 独立环境与 APT 体系</text>
      <text x="14" y="42" fill="#334155" font-size="11">前缀：~/.terminal (bin, etc, var)</text>
      <text x="14" y="58" fill="#a7f3d0" font-size="11">原生 shell 版 apt update / install</text>
      <text x="14" y="76" fill="#334155" font-size="11">dpkg 状态维护 (status, available)</text>
      <text x="14" y="94" fill="#d97706" font-size="10">Python pkgtool 后端：</text>
      <text x="14" y="110" fill="#334155" font-size="9">纯 Python 规避 iOS ar/tar 兼容性缺陷</text>
      <text x="14" y="122" fill="#475569" font-size="8">支持 Procursus, Havoc, 本地 repo 源</text>
    </g>

    <!-- Sub-card 2: plugin-run Mach-O Wall -->
    <g transform="translate(18, 208)">
      <rect width="254" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#0284c7" font-size="12" font-weight="600">plugin-run 运行时防护隔离</text>
      <text x="14" y="42" fill="#334155" font-size="11">读取 ELF/Mach-O 魔数校验：</text>
      <text x="14" y="58" fill="#e11d48" font-size="10" font-family="monospace">cffaedfe, feedfacf, cafebabe</text>
      <text x="14" y="76" fill="#e11d48" font-size="10">拦截 Mach-O (提示需越狱环境)</text>
      <text x="14" y="94" fill="#059669" font-size="10">放行脚本与 WebAssembly 插件正常运行</text>
    </g>

    <!-- Sub-card 3: In-process Neofetch &amp; CLI Tooling -->
    <g transform="translate(18, 326)">
      <rect width="254" height="108" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="22" fill="#0284c7" font-size="12" font-weight="600">纯 C 内嵌 neofetch 与交互增强</text>
      <text x="14" y="42" fill="#334155" font-size="11">原生 ObjC/Metal/sysctl 系统级快照</text>
      <text x="14" y="58" fill="#334155" font-size="10">显存/GPU/电池/温度/网络硬件遥测</text>
      <text x="14" y="76" fill="#0284c7" font-size="11">启动跳转：ashell:source .sbx_start</text>
      <text x="14" y="94" fill="#475569" font-size="9">无缝直降 ~/Documents/_sandbox 目录</text>
    </g>
  </g>

  <!-- Connective Horizontal Flows -->
  <g stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6">
    <path d="M 370 240 L 395 240" />
    <path d="M 370 380 L 395 380" />
    <path d="M 725 240 L 750 240" />
    <path d="M 725 380 L 750 380" />
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(60, 622)">
    <circle cx="6" cy="6" r="4" fill="#f43f5e" />
    <text x="18" y="10" fill="#334155" font-size="11">红色：核心提权/逃逸漏洞逻辑</text>
    <circle cx="210" cy="6" r="4" fill="#38bdf8" />
    <text x="222" y="10" fill="#334155" font-size="11">蓝色：系统级挂载与二进制注入模块</text>
    <circle cx="450" cy="6" r="4" fill="#10b981" />
    <text x="462" y="10" fill="#334155" font-size="11">绿色：上层独立运行时与包管理生态</text>
  </g>
</svg>
