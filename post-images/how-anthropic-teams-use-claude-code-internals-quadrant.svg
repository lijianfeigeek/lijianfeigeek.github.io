<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Canvas Background & Outer Border -->
  <rect x="8" y="8" width="944" height="574" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(48, 22)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0f172a">Claude Code 组织渗透象限：技术纵深 vs 智能体自主度</text>
    <text x="0" y="42" font-size="13" fill="#64748b">Anthropic 内部四大业务形态的人机协作边界与自主度分布</text>
  </g>

  <!-- Y-Axis Top Label (Deep Infra) -->
  <text x="480" y="96" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">▲ 底层系统与硬核工程 (Deep Infra &amp; Security)</text>

  <!-- Axes Grid Background Lines -->
  <!-- Vertical Axis Line -->
  <line x1="480" y1="108" x2="480" y2="544" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <!-- Horizontal Axis Line -->
  <line x1="48" y1="325" x2="912" y2="325" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Quadrant 2: Top Left (交互式复杂架构排障 - 辅助定位) (x=48, y=112, w=420, h=195) -->
  <g transform="translate(48, 112)">
    <rect x="0" y="0" width="420" height="195" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="16" y="14" width="166" height="22" rx="4" fill="#475569" />
    <text x="99" y="29" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">象限 II · 交互式复杂架构排障</text>
    
    <g transform="translate(16, 48)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· P0 生产报错堆栈逆向追踪</text>
      <text x="0" y="30" font-size="11" fill="#475569">结合文档实时推演控制流，3x 加速止血</text>
    </g>
    <g transform="translate(16, 94)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· 陌生仓库 Bug 穿透定位</text>
      <text x="0" y="30" font-size="11" fill="#475569">“只报现象，由它定位”，打破跨部门墙</text>
    </g>
    <g transform="translate(16, 140)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· TDD 阶段性 Check-in 审查</text>
      <text x="0" y="30" font-size="11" fill="#475569">以测试驱动实现，保留核心架构审查权</text>
    </g>
  </g>

  <!-- Quadrant 1: Top Right (基础设施自主闭环 - 深度自治) (x=492, y=112, w=420, h=195) -->
  <g transform="translate(492, 112)">
    <rect x="0" y="0" width="420" height="195" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" />
    <rect x="16" y="14" width="166" height="22" rx="4" fill="#0284c7" />
    <text x="99" y="29" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">象限 I · 深度自主排障与转译</text>
    
    <g transform="translate(16, 48)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· K8s 集群 Pod IP 枯竭自动处置</text>
      <text x="0" y="30" font-size="11" fill="#475569">截图解析 GCP UI，直出修复指令一键补池</text>
    </g>
    <g transform="translate(16, 94)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· 跨语言测试套件自动生成 (Rust)</text>
      <text x="0" y="30" font-size="11" fill="#475569">跨越语言鸿沟，推理引擎全原生测试覆盖</text>
    </g>
    <g transform="translate(16, 140)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· Vim 键位映射自主开发与校验</text>
      <text x="0" y="30" font-size="11" fill="#475569">无需人工干预，AI 自主编码自测交付</text>
    </g>
  </g>

  <!-- Horizontal Axis Labels (Pill Badges in the Center Horizontal Gap) -->
  <!-- Left Side Label Badge -->
  <g transform="translate(168, 313)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="90" y="16" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">◀ 人工主导协同 (Guided)</text>
  </g>
  <!-- Right Side Label Badge -->
  <g transform="translate(602, 313)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="100" y="16" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">完全自治循环 (Autonomous) ▶</text>
  </g>

  <!-- Quadrant 3: Bottom Left (知识聚合与结构化 - 低摩擦) (x=48, y=343, w=420, h=195) -->
  <g transform="translate(48, 343)">
    <rect x="0" y="0" width="420" height="195" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="16" y="14" width="166" height="22" rx="4" fill="#64748b" />
    <text x="99" y="29" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">象限 III · 认知穿透与知识萃取</text>
    
    <g transform="translate(16, 48)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· CLAUDE.md 单体代码库导引</text>
      <text x="0" y="30" font-size="11" fill="#475569">解析数据流血缘与看板依赖，新人秒上手</text>
    </g>
    <g transform="translate(16, 94)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· 晦涩 ML 算法逻辑即时解构</text>
      <text x="0" y="30" font-size="11" fill="#475569">非算法背景工程师 15 分钟吃透底层细节</text>
    </g>
    <g transform="translate(16, 140)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· Markdown 生产 Runbook 萃取</text>
      <text x="0" y="30" font-size="11" fill="#475569">多源离散文档浓缩成应急实操排障指南</text>
    </g>
  </g>

  <!-- Quadrant 4: Bottom Right (影子工程与业务自建 - 高自治) (x=492, y=343, w=420, h=195) -->
  <g transform="translate(492, 343)">
    <rect x="0" y="0" width="420" height="195" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2" />
    <rect x="16" y="14" width="166" height="22" rx="4" fill="#7c3aed" />
    <text x="99" y="29" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">象限 IV · 影子工程与非研自建</text>
    
    <g transform="translate(16, 48)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· 法务自建电话路由系统 (Phone Tree)</text>
      <text x="0" y="30" font-size="11" fill="#475569">业务自研客服/法务分流原型，零研发参与</text>
    </g>
    <g transform="translate(16, 94)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· 双 Sub-Agent 广告矩阵与 Figma 插件</text>
      <text x="0" y="30" font-size="11" fill="#475569">0.5 秒装配 100 组广告，打破文案效率天花板</text>
    </g>
    <g transform="translate(16, 140)">
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#0f172a">· 设计期系统异常状态全真推演</text>
      <text x="0" y="30" font-size="11" fill="#475569">在 Figma 阶段模拟错误流，前置掐灭 Bug</text>
    </g>
  </g>

  <!-- Y-Axis Bottom Label (Business / Non-Tech) -->
  <text x="480" y="564" font-size="12" font-weight="700" fill="#6b21a8" text-anchor="middle">▼ 业务场景与非研自建 (Non-Tech &amp; Business)</text>
</svg>
