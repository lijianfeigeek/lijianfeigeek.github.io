<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apple-ternus-a20pro-architecture-inverse-feeding-title apple-ternus-a20pro-architecture-inverse-feeding-desc">
  <title id="apple-ternus-a20pro-architecture-inverse-feeding-title">Apple Silicon 算力大轮回：电脑级微架构逆向反哺手机</title>
  <desc id="apple-ternus-a20pro-architecture-inverse-feeding-desc">2020年手机ARM架构跃迁赋能Mac电脑，2026年电脑端M6超级核心逆向反哺A20 Pro手机芯片</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="320" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left Column: Phase 1 (2020) -->
  <g transform="translate(40, 30)">
    <rect width="400" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="32" class="label-badge" fill="#0284c7">第一幕 · 2020 年</text>
    <text x="20" y="56" class="label-title">以手机之躯，重塑个人电脑</text>
    <line x1="20" y1="72" x2="380" y2="72" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Step 1 Mobile -->
    <g transform="translate(20, 88)">
      <rect width="360" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="26" class="label-title">A 系列手机芯片 (ARM 架构)</text>
      <text x="16" y="46" class="text-body">十余年打磨出极致能效比与紧凑缓存管线</text>
    </g>

    <path d="M 200 153 L 200 178" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arch-arrow)"/>

    <!-- Step 2 Mac -->
    <g transform="translate(20, 178)">
      <rect width="360" height="65" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="16" y="26" class="label-title" fill="#0369a1">Mac M1 / M2 / M3 Apple Silicon</text>
      <text x="16" y="46" class="text-body">赋予笔记本手机级的不可思议续航与低发热</text>
    </g>
  </g>

  <!-- Middle Connection -->
  <g transform="translate(450, 125)">
    <rect width="60" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" class="label-badge" fill="#334155">特努斯</text>
    <text x="30" y="46" text-anchor="middle" class="label-badge" fill="#334155">底层自研</text>
    <text x="30" y="62" text-anchor="middle" class="tag-coral">双向对穿</text>
  </g>
  <path d="M 440 160 L 450 160" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 510 160 L 520 160" stroke="#bf4520" stroke-width="1.5"/>

  <!-- Right Column: Phase 2 (2026 - Focal) -->
  <g transform="translate(520, 30)">
    <rect width="400" height="260" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">第二幕 · 2026 年（现在）</text>
    <text x="20" y="56" class="label-title" fill="#9a3412">以电脑之脑，武装口袋手机</text>
    <line x1="20" y1="72" x2="380" y2="72" stroke="#fed7aa" stroke-width="1"/>

    <!-- Step 3 Mac M6 -->
    <g transform="translate(20, 88)">
      <rect width="360" height="65" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="16" y="26" class="label-title">电脑端 M6 芯片超级微架构</text>
      <text x="16" y="46" class="text-body">桌面级超宽指令发射窗口与庞大乱序预测树</text>
    </g>

    <path d="M 200 153 L 200 178" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arch-arrow)"/>

    <!-- Step 4 A20 Pro -->
    <g transform="translate(20, 178)">
      <rect width="360" height="65" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="16" y="26" class="label-title" fill="#bf4520">A20 Pro 旗舰芯片 (4能效 + 2超级核)</text>
      <text x="16" y="46" class="text-body">纯正桌面级大核硬塞手机，Speedometer 狂飙 53%</text>
    </g>
  </g>
</svg>