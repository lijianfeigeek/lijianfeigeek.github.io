<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <linearGradient id="layer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="900" height="640" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Section -->
  <g transform="translate(36, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">homelab-diagram 全栈编译架构与视觉物理渲染流水线</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b">从声明式 YAML 资产台账到 1.6x 矢量渲染输出的五层确定性图元架构体系</text>
  </g>

  <!-- Layer 5: Output & Redaction (Top) -->
  <g transform="translate(48, 90)">
    <rect x="0" y="0" width="804" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="0" y="0" width="8" height="92" rx="4" fill="#0284c7"/>
    <g transform="translate(24, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">LAYER 5 · 终态输出与脱敏安全门禁</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">多态资产脱敏引擎与超清矢量栅格化 (Polymorphic Redaction &amp; Rasterization)</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">• 生产发布自动域名通配符替换 ({domain} → redacted.com) 与 SSID 掩码 · 支持 --unredacted 私有原貌输出</text>
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">• 调用 librsvg (rsvg-convert -z 1.6) 执行 1.6x 亚像素超采样高清栅格化，直接输出出版级 PNG 与交互 SVG</text>
    </g>
    <rect x="700" y="20" width="84" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="742" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">SVG / PNG</text>
  </g>

  <!-- Layer 4: Semantic Components -->
  <g transform="translate(48, 196)">
    <rect x="0" y="0" width="804" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="0" y="0" width="8" height="92" rx="4" fill="#0284c7"/>
    <g transform="translate(24, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">LAYER 4 · 语义图元组件与复合容器装配</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">物理设备文件夹 Tab、ZFS 阵列图元与动态背景遮罩 (Component Assembly)</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">• 物理设备专属文件夹 Tab 倒角 (Bezier 贝塞尔过渡)，直观区分机箱物理体与虚拟容器 (LXC/VM)</text>
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">• TrueNAS 存储池与 VDev 盘位图元 (HDD 同心圆/SSD 晶圆/NVMe 触点) · 动态背景遮罩 (Mask) 杜绝文字连线碰撞</text>
    </g>
    <rect x="700" y="20" width="84" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="742" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">DOM/SVG</text>
  </g>

  <!-- Layer 3: Network Physical Geometry (FOCAL) -->
  <g transform="translate(48, 302)">
    <rect x="0" y="0" width="804" height="98" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="1.8"/>
    <rect x="0" y="0" width="8" height="98" rx="4" fill="#e11d48"/>
    <g transform="translate(24, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e11d48">LAYER 3 · 网络物理几何与速率编译器 [核心亮点]</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">线宽物理学、802.1Q 双层管道 Trunk 与交换机端口刻度系统 (Physics Compiler)</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">• 线宽即速率 (SPEED_W)：10G 粗管 (9.5px)、2.5G 中管 (3.8px)、1G 细缆 (2.4px)、100M (1.4px) 严格依协商线速缩放</text>
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">• 802.1Q 聚合干线 (Trunk) 渲染为白底导管+深色内芯双层电缆 · 端口引脚绘制 VLAN Ticks (高柱 Untagged / 矮柱 Tagged)</text>
    </g>
    <rect x="686" y="20" width="98" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="735" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">PHYSICS CORE</text>
  </g>

  <!-- Layer 2: Typographic Measurement -->
  <g transform="translate(48, 414)">
    <rect x="0" y="0" width="804" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="0" y="0" width="8" height="92" rx="4" fill="#0284c7"/>
    <g transform="translate(24, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">LAYER 2 · 动态字体度量与弹性排版布局</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Pillow 亚像素字形探测、弹性标签步长与硬边界守卫 (Typographic Metrics)</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">• 集成 Pillow (ImageFont.truetype) 对 Fira Sans / Fira Code 执行 8x 采样，精准测算文本物理像素宽度</text>
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">• 动态生成自适应 Tab 宽度与状态药丸 · 植入 Python 运行时 assert 布局溢出拦截，防止内容出界</text>
    </g>
    <rect x="700" y="20" width="84" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="742" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">PILLOW/FIRA</text>
  </g>

  <!-- Layer 1: Declarative Inventory (Bottom) -->
  <g transform="translate(48, 520)">
    <rect x="0" y="0" width="804" height="92" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
    <rect x="0" y="0" width="8" height="92" rx="4" fill="#059669"/>
    <g transform="translate(24, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">LAYER 1 · 声明式网络资产单一真值 (Single Source of Truth)</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">inventory.yaml 资产抽象：物理网络、主机硬件、存储拓扑与流量编排</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">• 统摄 VLAN 划分、交换机 8+2 端口逐引脚映射、物理防火墙硬件规格、SSID-VLAN 矩阵</text>
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">• 纳管 Proxmox 虚拟化集群、DMZ 容器微服务清单、TrueNAS ZFS 存储池与 Media Pipeline 自动化流向</text>
    </g>
    <rect x="696" y="20" width="88" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="740" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">YAML SPEC</text>
  </g>
</svg>