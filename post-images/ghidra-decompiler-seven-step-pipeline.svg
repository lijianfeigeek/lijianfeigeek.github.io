<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghidra-decompiler-seven-step-pipeline-title ghidra-decompiler-seven-step-pipeline-desc">
  <title id="ghidra-decompiler-seven-step-pipeline-title">Ghidra C++ 反编译器核心七阶编译逆向管线</title>
  <desc id="ghidra-decompiler-seven-step-pipeline-desc">从原始 P-Code 经 CFG 切分、SSA 绑定、循环优化、类型恢复到生成美化 C 源码的全流程</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #6b7280; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="280" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1 to 4 on Top Row -->
  <g transform="translate(24, 24)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="206" height="100" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="22" class="label-title">Step 1: 原始 P-Code</text>
      <line x1="10" y1="32" x2="196" y2="32" stroke="#f3f4f6" stroke-width="1"/>
      <text x="10" y="50" class="text-code">• 线性指令流打碎</text>
      <text x="10" y="68" class="text-code">• 三元组 Varnode 绑定</text>
      <text x="10" y="86" class="text-code">• 消除机器特化寻址</text>
    </g>

    <path d="M 206 50 L 230 50" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="230,47 236,50 230,53" fill="#9ca3af"/>

    <!-- Step 2 -->
    <g transform="translate(236, 0)">
      <rect width="206" height="100" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="22" class="label-title">Step 2: 控制流图 (CFG)</text>
      <line x1="10" y1="32" x2="196" y2="32" stroke="#f3f4f6" stroke-width="1"/>
      <text x="10" y="50" class="text-code">• 基本块 (Basic Block) 切分</text>
      <text x="10" y="68" class="text-code">• 跳转表与分支拓扑</text>
      <text x="10" y="86" class="text-code">• 支配树 (Dominator) 构建</text>
    </g>

    <path d="M 442 50 L 466 50" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="466,47 472,50 466,53" fill="#9ca3af"/>

    <!-- Step 3 -->
    <g transform="translate(472, 0)">
      <rect width="206" height="100" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="22" class="label-title" fill="#1e40af">Step 3: 静态单赋值 (SSA)</text>
      <line x1="10" y1="32" x2="196" y2="32" stroke="#dbeafe" stroke-width="1"/>
      <text x="10" y="50" class="text-code" fill="#1d4ed8">• Varnode 版本号实例化</text>
      <text x="10" y="68" class="text-code" fill="#1d4ed8">• 插入 φ 节点 (MULTIEQUAL)</text>
      <text x="10" y="86" class="text-code" fill="#1d4ed8">• 消除寄存器多重写冲突</text>
    </g>

    <path d="M 678 50 L 702 50" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="702,47 708,50 702,53" fill="#9ca3af"/>

    <!-- Step 4 -->
    <g transform="translate(708, 0)">
      <rect width="204" height="100" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="22" class="label-title">Step 4: 编译级图优化</text>
      <line x1="10" y1="32" x2="194" y2="32" stroke="#f3f4f6" stroke-width="1"/>
      <text x="10" y="50" class="text-code">• 死代码消除 (DCE)</text>
      <text x="10" y="68" class="text-code">• 常量传播与算术折叠</text>
      <text x="10" y="86" class="text-code">• 90%+ 标志位彻底剪枝</text>
    </g>
  </g>

  <!-- Connecting Snake Path from Step 4 down to Step 5 -->
  <path d="M 834 124 L 834 148 L 784 148" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="784,145 778,148 784,151" fill="#9ca3af"/>

  <!-- Step 5 to 7 on Bottom Row -->
  <g transform="translate(24, 150)">
    <!-- Step 5 -->
    <g transform="translate(568, 0)">
      <rect width="206" height="100" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="22" class="label-title" fill="#b45309">Step 5: 类型系统恢复</text>
      <line x1="10" y1="32" x2="196" y2="32" stroke="#fef3c7" stroke-width="1"/>
      <text x="10" y="50" class="text-code" fill="#92400e">• DTM 头文件结构体注入</text>
      <text x="10" y="68" class="text-code" fill="#92400e">• 数据流类型双向推导</text>
      <text x="10" y="86" class="text-code" fill="#92400e">• 偏移转换为字段名指针</text>
    </g>

    <path d="M 568 50 L 544 50" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="544,47 538,50 544,53" fill="#9ca3af"/>

    <!-- Step 6 -->
    <g transform="translate(332, 0)">
      <rect width="206" height="100" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="10" y="22" class="label-title">Step 6: 高级控制流重构</text>
      <line x1="10" y1="32" x2="196" y2="32" stroke="#f3f4f6" stroke-width="1"/>
      <text x="10" y="50" class="text-code">• 消除无序 Goto 标签</text>
      <text x="10" y="68" class="text-code">• 恢复 While/For 循环结构</text>
      <text x="10" y="86" class="text-code">• 恢复 Switch-Case 跳转表</text>
    </g>

    <path d="M 332 50 L 308 50" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="308,47 302,50 308,53" fill="#10b981"/>

    <!-- Step 7: Emit C (Coral Accent) -->
    <g transform="translate(0, 0)">
      <rect width="302" height="100" rx="6" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
      <text x="14" y="24" class="label-title" fill="#9a3412">Step 7: AST 展平与美化 C 源码输出</text>
      <line x1="14" y1="34" x2="288" y2="34" stroke="#fed7aa" stroke-width="1"/>
      <text x="14" y="52" class="text-code" font-weight="600" fill="#7c2d12">ptr-&gt;is_authenticated = 1;</text>
      <text x="14" y="70" class="text-code" fill="#9a3412">• 生成具备工业可读性、带类型 C 伪代码</text>
      <text x="14" y="88" class="text-code" fill="#9a3412">• 跨架构一致，无缝对接静态审计</text>
    </g>
  </g>
</svg>