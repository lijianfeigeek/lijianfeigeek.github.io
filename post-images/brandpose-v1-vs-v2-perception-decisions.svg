<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brandpose-v1-vs-v2-perception-decisions-title brandpose-v1-vs-v2-perception-decisions-desc">
  <title id="brandpose-v1-vs-v2-perception-decisions-title">视觉感知层设计决策：v1 朴素方案 vs v2 工业自适应方案</title>
  <desc id="brandpose-v1-vs-v2-perception-decisions-desc">对比整帧暴力压缩导致头部严重压扁退化为瞎猜与3fps跟踪丢失，与自适应头部正方形动态裁剪放大3.5倍及30fps全帧追踪零断流</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="v-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: v1 Naive Scheme -->
  <g transform="translate(40, 30)">
    <rect width="410" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#ef4444"/>
    <text x="20" y="32" class="label-badge" fill="#b91c1c">v1 朴素实现 · 严重失真与漂移</text>
    <text x="20" y="58" class="label-title" fill="#b91c1c">整帧压缩与低帧率追踪</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fee2e2" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="60" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="24" class="text-feat">1. 1920x1080 画面直接暴力压缩至 448x448</text>
      <text x="12" y="44" class="text-body">远端 58px 头部被严重压扁成 13x23px，眼鼻细节全部磨平丢失</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="370" height="60" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="24" class="text-feat">2. 仅在 3fps 抽帧关键帧运行追踪器</text>
      <text x="12" y="44" class="text-body">顾客正常步伐导致跨帧位移过大，ByteTrack ID 频繁错乱突变</text>
    </g>

    <g transform="translate(20, 230)">
      <text x="0" y="16" class="text-body" fill="#b91c1c" style="font-weight: 600;">❌ 结果：自头抑制错误率高达 35%，视线大幅晃动漂移</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 458 170 L 498 170" stroke="#bf4520" stroke-width="1.5" marker-end="url(#v-arrow)"/>

  <!-- Right: v2 Industrial Scheme (Focal) -->
  <g transform="translate(510, 30)">
    <rect width="410" height="280" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">v2 工业方案 · 动态裁剪与全帧流</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">Per-Person 动态裁剪 + 30fps 追踪</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="60" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="24" class="text-feat" fill="#9a3412">1. 自适应头部正方形动态裁剪 (Crop 448x448)</text>
      <text x="12" y="44" class="text-body">截取 10 倍头宽正方形，头部在输入层放大 3.5 倍，清晰呈现眼球视线</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="370" height="60" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="24" class="text-feat" fill="#9a3412">2. YOLO11-pose 全帧 30fps 实时连续追踪</text>
      <text x="12" y="44" class="text-body">相邻帧位移极小，ByteTrack 连续轨迹零断流，聚类稳定</text>
    </g>

    <g transform="translate(20, 230)">
      <text x="0" y="16" class="text-body" fill="#bf4520" style="font-weight: 600;">✅ 结果：自头错误率骤降至 0.0%，时序抖动大幅削减 67%</text>
    </g>
  </g>
</svg>