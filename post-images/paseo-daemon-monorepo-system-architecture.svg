<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="paseo-daemon-monorepo-system-architecture-title paseo-daemon-monorepo-system-architecture-desc">
  <title id="paseo-daemon-monorepo-system-architecture-title">Paseo 本地常驻 Daemon 系统架构</title>
  <desc id="paseo-daemon-monorepo-system-architecture-desc">展示多端接入层、安全传输层、Paseo 本地 Daemon 控制面与下游执行引擎的四层解耦拓扑</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .seq-actor { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .seq-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .seq-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="490" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Layer 1: Clients -->
  <g transform="translate(32, 24)">
    <rect width="896" height="80" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="22" class="tag">LAYER 1: MULTI-CLIENT ACCESS (多端接入层)</text>
    
    <g transform="translate(16, 32)">
      <rect width="195" height="36" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">Desktop (Electron)</text>
    </g>
    <g transform="translate(231, 32)">
      <rect width="195" height="36" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">Mobile (Expo iOS/Android)</text>
    </g>
    <g transform="translate(446, 32)">
      <rect width="195" height="36" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">Web UI (Self-hosted)</text>
    </g>
    <g transform="translate(661, 32)">
      <rect width="219" height="36" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="22" class="title" style="font-size:12px;">Paseo CLI (@getpaseo/cli)</text>
    </g>
  </g>

  <!-- Connectors: Layer 1 -> Layer 2 -->
  <path d="M 230 104 L 230 134" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 730 104 L 730 134" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 2: Transport &amp; Security -->
  <g transform="translate(32, 134)">
    <rect width="896" height="74" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="20" class="tag">LAYER 2: SECURE TRANSPORT (传输与加密信道)</text>

    <g transform="translate(16, 28)">
      <rect width="420" height="34" fill="#f1f5f9" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="21" class="tag" style="font-size:11px; font-weight:700;">LOCAL WS: ws://127.0.0.1:6767 (局域网零暴露直连)</text>
    </g>
    <g transform="translate(460, 28)">
      <rect width="420" height="34" fill="#fff5f5" rx="4" stroke="#fed7d7" stroke-width="1" />
      <text x="12" y="21" class="coral-tag" style="font-size:11px; font-weight:700;">E2EE RELAY: Curve25519 + XSalsa20-Poly1305 (外网安全中继)</text>
    </g>
  </g>

  <!-- Connectors: Layer 2 -> Layer 3 -->
  <path d="M 480 208 L 480 238" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Layer 3: Daemon Control Plane (Core Focal Card) -->
  <g transform="translate(32, 238)">
    <rect width="896" height="120" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="896" height="28" fill="#fff5f5" rx="8" />
    <rect y="20" width="896" height="8" fill="#fff5f5" />
    <line x1="0" y1="28" x2="896" y2="28" stroke="#fed7d7" stroke-width="1" />
    <text x="16" y="19" class="coral-title" style="font-size:12px;">LAYER 3: PASEO DAEMON CORE (@getpaseo/server 控制面)</text>
    <text x="880" y="19" text-anchor="end" class="coral-tag">LOCAL-FIRST ENGINE</text>

    <g transform="translate(16, 38)">
      <rect width="202" height="68" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="22" class="title" style="font-size:12px;">AgentManager</text>
      <text x="10" y="42" class="desc">多会话生命周期治理</text>
      <text x="10" y="58" class="desc">Token 流合并聚合 (16ms)</text>
    </g>

    <g transform="translate(234, 38)">
      <rect width="202" height="68" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="22" class="title" style="font-size:12px;">WorktreeSession</text>
      <text x="10" y="42" class="desc">Git 动态沙盒自动创建</text>
      <text x="10" y="58" class="desc">依赖软链接与安全归档</text>
    </g>

    <g transform="translate(452, 38)">
      <rect width="202" height="68" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="22" class="title" style="font-size:12px;">PermissionEngine</text>
      <text x="10" y="42" class="desc">双向人机交互决策阻断</text>
      <text x="10" y="58" class="desc">高危 CLI 审批与放行</text>
    </g>

    <g transform="translate(670, 38)">
      <rect width="210" height="68" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="22" class="title" style="font-size:12px;">VoiceSubsystem</text>
      <text x="10" y="42" class="desc">2-way 双工音频交互</text>
      <text x="10" y="58" class="desc">Whisper STT / 本地 TTS</text>
    </g>
  </g>

  <!-- Connectors: Layer 3 -> Layer 4 -->
  <path d="M 240 358 L 240 388" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 480 358 L 480 388" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 720 358 L 720 388" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 4: Execution Sandbox &amp; Underlying Toolchains -->
  <g transform="translate(32, 388)">
    <rect width="896" height="78" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="20" class="tag">LAYER 4: EXECUTION RUNTIME &amp; ADAPTERS (底层沙盒与模型执行)</text>

    <g transform="translate(16, 28)">
      <rect width="270" height="38" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="23" class="title" style="font-size:11px;">Agent ACP 适配协议 (Claude / OpenAI)</text>
    </g>
    <g transform="translate(306, 28)">
      <rect width="270" height="38" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="23" class="title" style="font-size:11px;">Git Engine (Worktree / Cherry-pick)</text>
    </g>
    <g transform="translate(596, 28)">
      <rect width="284" height="38" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="23" class="title" style="font-size:11px;">OS Subprocess &amp; PTY (终端沙盒环境)</text>
    </g>
  </g>
</svg>