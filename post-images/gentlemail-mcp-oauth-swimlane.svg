<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" role="img" aria-labelledby="gm-sw-title gm-sw-desc" id="gentlemail-mcp-oauth-swimlane-root">
  <title id="gm-sw-title">GentleMail MCP 服务器与 OAuth 2.1 动态注册、防钓鱼授权及令牌轮换泳道图</title>
  <desc id="gm-sw-desc">展示 AI 客户端通过 RFC 7591 动态注册、OAuth 2.1 PKCE 授权同意页、D1 原子换票与 30 秒 AES-GCM 重试宽限轮换、最终访问权限过滤的 /mcp 端点的四泳道交互流程。</desc>
  <defs>
    <style>
      #gentlemail-mcp-oauth-swimlane-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="gm-sw-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.25"/>
    </pattern>
    <marker id="gm-sw-arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="gm-sw-arr-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="gm-sw-arr-link" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="1000" height="512" fill="#f8fafc"/>
  <rect width="1000" height="512" fill="url(#gm-sw-dots)"/>

  <text x="32" y="34" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#1e293b">MCP + OAuth 2.1 DCR &amp; Token Rotation Swimlane</text>
  <text x="32" y="52" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">RFC 7591 DCR · PKCE S256 · 30S AES-GCM RETRY GRACE · REUSE FAMILY REVOCATION · TOOLSFOR(AUTH)</text>

  <!-- Alternating lane background bands -->
  <rect x="24" y="72" width="952" height="92" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="24" y="164" width="952" height="92" fill="#f1f5f9" fill-opacity="0.65"/>
  <rect x="24" y="256" width="952" height="92" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="24" y="348" width="952" height="92" fill="#f1f5f9" fill-opacity="0.65"/>

  <!-- Lane dividers -->
  <line x1="24" y1="72" x2="976" y2="72" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="164" x2="976" y2="164" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="256" x2="976" y2="256" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="348" x2="976" y2="348" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="440" x2="976" y2="440" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="148" y1="72" x2="148" y2="440" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane labels (strictly isolated coordinates) -->
  <g transform="translate(24, 72)">
    <text x="16" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em" fill="#1e293b">01 · AI CLIENT</text>
    <text x="16" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">CLAUDE / CURSOR</text>
  </g>
  <g transform="translate(24, 164)">
    <text x="16" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em" fill="#1e293b">02 · OAUTH GATE</text>
    <text x="16" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">/oauth/register</text>
  </g>
  <g transform="translate(24, 256)">
    <text x="16" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em" fill="#bf4520">03 · D1 STATE</text>
    <text x="16" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">CODES &amp; TOKENS</text>
  </g>
  <g transform="translate(24, 348)">
    <text x="16" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing="0.08em" fill="#2e5aa8">04 · MCP CORE</text>
    <text x="16" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">POST /mcp</text>
  </g>

  <!-- Connectors drawn BEFORE node boxes (orthogonal r=8 elbows, zero crossings) -->
  <!-- Step 1 (168..344, 86..150) -> Step 2 (168..344, 178..242): straight vertical -->
  <line x1="256" y1="150" x2="256" y2="176" stroke="#2e5aa8" stroke-width="1.3" marker-end="url(#gm-sw-arr-link)"/>
  <!-- Step 2 -> Step 3 (376..568, 178..242): straight horizontal -->
  <line x1="344" y1="210" x2="374" y2="210" stroke="#475569" stroke-width="1.3" marker-end="url(#gm-sw-arr-muted)"/>
  <!-- Step 3 -> Step 4 (376..568, 270..334): straight vertical -->
  <line x1="472" y1="242" x2="472" y2="268" stroke="#bf4520" stroke-width="1.5" marker-end="url(#gm-sw-arr-accent)"/>
  <!-- Step 4 (right 568, 302) -> Step 5 (left 604, 118): orthogonal corridor at x=586 -->
  <path d="M 568 302 L 578 302 Q 586 302 586 294 L 586 126 Q 586 118 594 118 L 602 118" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#gm-sw-arr-accent)"/>
  <!-- Step 5 (604..788, 86..150) -> Step 6 (604..788, 270..334): straight vertical through empty Lane 1 -->
  <line x1="696" y1="150" x2="696" y2="268" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#gm-sw-arr-muted)"/>
  <!-- Step 5 (right 788, 118) -> Step 7 (top 896, 362): orthogonal right then down -->
  <path d="M 788 118 L 888 118 Q 896 118 896 126 L 896 360" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#gm-sw-arr-link)"/>
  <!-- Step 6 (right 788, 302) -> Step 7 (left 820, 394): orthogonal corridor at x=804 -->
  <path d="M 788 302 L 796 302 Q 804 302 804 310 L 804 386 Q 804 394 812 394 L 818 394" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#gm-sw-arr-muted)"/>

  <!-- Label masks positioned with visible gap beside segments -->
  <rect x="352" y="184" width="76" height="16" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="390" y="195" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#475569">PKCE S256</text>

  <rect x="526" y="138" width="54" height="16" rx="3" fill="#f8fafc" stroke="#bf4520" stroke-width="0.6"/>
  <text x="553" y="149" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#bf4520">CODE</text>

  <rect x="812" y="96" width="84" height="16" rx="3" fill="#f8fafc" stroke="#2e5aa8" stroke-width="0.6"/>
  <text x="854" y="107" text-anchor="middle" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8" fill="#2e5aa8">BEARER + JSON-RPC</text>

  <!-- Node boxes (each in its own translate group) -->
  <!-- Step 1 -->
  <g transform="translate(168, 86)">
    <rect x="0" y="0" width="176" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="23" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">1. 元数据发现与注册</text>
    <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">/.well-known/oauth-*</text>
    <text x="12" y="53" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">POST /oauth/register</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(168, 178)">
    <rect x="0" y="0" width="176" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="23" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">2. 限流与隐形字符清洗</text>
    <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">REGISTER_LIMIT (10/60s)</text>
    <text x="12" y="53" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">剥离 \p{Cf} 与盲文空白</text>
  </g>

  <!-- Step 3 (FOCAL) -->
  <g transform="translate(376, 178)">
    <rect x="0" y="0" width="192" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
    <text x="12" y="23" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">3. 防钓鱼授权同意页</text>
    <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">高亮展示真实 redirect_uri</text>
    <text x="12" y="53" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">动态补丁 CSP form-action</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(376, 270)">
    <rect x="0" y="0" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="23" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">4. 原子抢占与事务写库</text>
    <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">清空 challenge 防并发重放</text>
    <text x="12" y="53" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">batch() 写入 grants + tokens</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(604, 86)">
    <rect x="0" y="0" width="184" height="64" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="23" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">5. 换取 Token 与调用</text>
    <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">Access 1h / Refresh 60d</text>
    <text x="12" y="53" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">校验 code_verifier == S256</text>
  </g>

  <!-- Step 6 (FOCAL) -->
  <g transform="translate(604, 270)">
    <rect x="0" y="0" width="184" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.6"/>
    <text x="12" y="23" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">6. 轮换宽限与重放熔断</text>
    <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">30s AES-GCM 加密重试缓存</text>
    <text x="12" y="53" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">越期重用 -&gt; 清空整条 family</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(820, 362)">
    <rect x="0" y="0" width="156" height="64" rx="6" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1.3"/>
    <text x="12" y="23" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2e5aa8">7. 最小权限工具集</text>
    <text x="12" y="40" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#475569">toolsFor(auth) 隐身裁剪</text>
    <text x="12" y="53" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" fill="#64748b">无 organize 不见 update</text>
  </g>

  <!-- Bottom legend strip -->
  <line x1="24" y1="456" x2="976" y2="456" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(24, 478)">
    <text x="0" y="3" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="72" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="94" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#bf4520">焦点安全防线：防钓鱼同意页 &amp; Refresh 令牌族熔断</text>
    <rect x="444" y="-8" width="14" height="14" rx="2" fill="#eff6ff" stroke="#2e5aa8" stroke-width="1.2"/>
    <text x="466" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#2e5aa8">无状态 MCP 执行与 API 授权校验</text>
    <line x1="704" y1="-1" x2="736" y2="-1" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="744" y="3" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif" font-size="11.5" fill="#475569">续期与令牌回收路径</text>
  </g>
</svg>
