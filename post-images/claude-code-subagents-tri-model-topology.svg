<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="cc-tri-title cc-tri-desc" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Segoe UI',Roboto,sans-serif;">
  <title id="cc-tri-title">Sonnet + Haiku + Opus 三模型异构编队与提示词缓存边界拓扑</title>
  <desc id="cc-tri-desc">展示 claude --model sonnet --advisor opus 配合三个 Haiku 子代理（search/grep/audit）及确定性 Hook 路由层时的真实数据流向、工作树隔离与三条 Prompt Cache 边界。</desc>
  <defs>
    <pattern id="cc-dots-4" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="rgba(15,23,42,0.08)"/>
    </pattern>
    <marker id="tr-arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="tr-arr-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="tr-arr-link" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="600" fill="#ffffff"/>
  <rect width="980" height="600" fill="url(#cc-dots-4)" opacity="0.65"/>

  <!-- Header -->
  <g transform="translate(32, 16)">
    <rect x="0" y="0" width="916" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="18" y="25" font-size="16" font-weight="700" fill="#0f172a">“Sonnet 写 + Haiku 查 + Opus 审”三模型异构拓扑与缓存边界剖析</text>
    <text x="18" y="43" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">CLAUDE --MODEL SONNET --ADVISOR OPUS · HAIKU SUBAGENTS · DETERMINISTIC HOOKS · CACHE BOUNDARIES</text>
    <text x="898" y="32" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0284c7" text-anchor="end">TYPE: ARCHITECTURE</text>
  </g>

  <!-- ZONES (Drawn BEFORE arrows and nodes) -->
  <!-- Zone 1: Left (Deterministic Harness) -->
  <g transform="translate(32, 88)">
    <rect x="0" y="0" width="212" height="416" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.14)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="14" y="-7" width="160" height="14" rx="2" fill="#ffffff"/>
    <text x="94" y="3" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" letter-spacing="0.14em" fill="#5a6580" text-anchor="middle">DETERMINISTIC HARNESS</text>
  </g>

  <!-- Zone 2: Center (Local Subagent & Main Cache Zone) -->
  <g transform="translate(272, 88)">
    <rect x="0" y="0" width="420" height="416" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.16)" stroke-width="1"/>
    <rect x="14" y="-7" width="224" height="14" rx="2" fill="#ffffff"/>
    <text x="126" y="3" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" letter-spacing="0.14em" fill="#5a6580" text-anchor="middle">CLAUDE CODE SESSION (LOCAL)</text>
  </g>

  <!-- Zone 3: Right (Anthropic Server-Side Advisor) -->
  <g transform="translate(720, 88)">
    <rect x="0" y="0" width="228" height="416" rx="8" fill="rgba(2,132,199,0.025)" stroke="rgba(2,132,199,0.28)" stroke-width="1" stroke-dasharray="5,4"/>
    <rect x="14" y="-7" width="184" height="14" rx="2" fill="#ffffff"/>
    <text x="106" y="3" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" letter-spacing="0.14em" fill="#0369a1" text-anchor="middle">ANTHROPIC SERVER TOOL</text>
  </g>

  <!-- ARROWS (Drawn BEFORE nodes) -->
  <!-- Zone 1 CLAUDE.md -> Main Sonnet -->
  <line x1="224" y1="168" x2="312" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#tr-arr-muted)"/>
  <rect x="242" y="146" width="56" height="14" rx="2" fill="#ffffff"/>
  <text x="270" y="156" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">ROUTING</text>

  <!-- Zone 1 Deterministic Hooks -> Subagents & Main -->
  <path d="M 224 344 H 256 V 204 Q 256 196 264 196 H 312" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#tr-arr-muted)"/>
  <path d="M 224 372 H 294 Q 302 372 302 380 V 426 Q 302 434 310 434 H 316" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#tr-arr-muted)"/>
  <rect x="234" y="316" width="54" height="14" rx="2" fill="#ffffff"/>
  <text x="261" y="326" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">EXIT 0/2</text>

  <!-- Main Sonnet -> 3 Haiku Subagents (Vertical fan-out from bottom edge of Main) -->
  <!-- Left branch to search (cx=368) -->
  <path d="M 380 220 V 252 Q 380 260 372 260 H 368 Q 360 260 360 268 V 292" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#tr-arr-accent)"/>
  <!-- Center branch to grep (cx=482) -->
  <line x1="482" y1="220" x2="482" y2="292" stroke="#bf4520" stroke-width="1.4" marker-end="url(#tr-arr-accent)"/>
  <!-- Right branch to audit (cx=604) -->
  <path d="M 584 220 V 252 Q 584 260 592 260 H 596 Q 604 260 604 268 V 292" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#tr-arr-accent)"/>

  <rect x="436" y="248" width="92" height="14" rx="2" fill="#ffffff"/>
  <text x="482" y="258" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">COLD CONTEXTS</text>

  <!-- Main Sonnet -> Server Advisor Opus (Top horizontal link-blue) -->
  <line x1="652" y1="158" x2="736" y2="158" stroke="#0284c7" stroke-width="1.5" marker-end="url(#tr-arr-link)"/>
  <rect x="658" y="136" width="76" height="14" rx="2" fill="#ffffff"/>
  <text x="696" y="146" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0369a1" text-anchor="middle">FULL HIST</text>

  <!-- Advisor Opus -> Main Sonnet (Return dashed guidance) -->
  <line x1="740" y1="186" x2="656" y2="186" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#tr-arr-link)"/>
  <rect x="664" y="194" width="68" height="14" rx="2" fill="#ffffff"/>
  <text x="698" y="204" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">GUIDANCE</text>

  <!-- Hidden inheritance link: Haiku subagents ALSO inherit Opus Advisor! -->
  <path d="M 672 346 H 700 Q 708 346 708 338 V 292 Q 708 284 716 284 H 736" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#tr-arr-muted)"/>
  <rect x="662" y="294" width="84" height="14" rx="2" fill="#ffffff"/>
  <text x="704" y="304" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">INHERITED!</text>

  <!-- NODES -->
  <!-- Zone 1 Nodes -->
  <g transform="translate(52, 120)">
    <rect x="0" y="0" width="172" height="96" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="8" width="66" height="14" rx="3" fill="#e2e8f0"/>
    <text x="43" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="middle">CLAUDE.MD</text>
    <text x="86" y="42" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">分流委派规则</text>
    <text x="86" y="61" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">搜索与测试全权下放</text>
    <text x="86" y="79" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">保持主对话窗口精简</text>
  </g>

  <g transform="translate(52, 296)">
    <rect x="0" y="0" width="172" height="114" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="8" width="72" height="14" rx="3" fill="#e2e8f0"/>
    <text x="46" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#0f172a" text-anchor="middle">HOOKS / JEV</text>
    <text x="86" y="44" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">毫秒级确定性路由</text>
    <text x="86" y="64" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">PreToolUse 路径/命令门禁</text>
    <text x="86" y="82" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">机械分叉不消耗大模型推理</text>
    <text x="86" y="100" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" text-anchor="middle">0 LLM TOKEN · &lt;5ms</text>
  </g>

  <!-- Zone 2: Main Sonnet Node (FOCAL CORAL) -->
  <g transform="translate(316, 120)">
    <rect x="0" y="0" width="336" height="100" rx="6" fill="#ffffff"/>
    <rect x="0" y="0" width="336" height="100" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="12" y="8" width="94" height="14" rx="3" fill="rgba(191,69,32,0.16)"/>
    <text x="59" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">MAIN ORCHESTRATOR</text>
    <text x="322" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#059669" text-anchor="end">WARM PROMPT CACHE</text>
    <text x="168" y="44" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">主会话编排器：Sonnet 5.5</text>
    <text x="168" y="64" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#334155" text-anchor="middle">专注编码修改、Bug 修复与上下文统筹</text>
    <text x="168" y="84" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#9a3412" text-anchor="middle">开关 /advisor 不破主缓存 · 顾问建议并入后续前缀缓存</text>
  </g>

  <!-- Zone 2: 3 Haiku Subagent Cards (y = 296, height = 104) -->
  <g transform="translate(292, 296)">
    <!-- search -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="120" height="104" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <rect x="8" y="8" width="54" height="14" rx="3" fill="#f1f5f9"/>
      <text x="35" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#475569" text-anchor="middle">HAIKU 5.5</text>
      <text x="60" y="42" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">search</text>
      <text x="60" y="62" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">只读梳理仓库</text>
      <text x="60" y="80" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">独立上下文 · 零缓存共享</text>
      <text x="60" y="95" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#bf4520" text-anchor="middle">建议 omitClaudeMd</text>
    </g>
    <!-- grep -->
    <g transform="translate(132, 0)">
      <rect x="0" y="0" width="120" height="104" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <rect x="8" y="8" width="54" height="14" rx="3" fill="#f1f5f9"/>
      <text x="35" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#475569" text-anchor="middle">HAIKU 5.5</text>
      <text x="60" y="42" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">grep</text>
      <text x="60" y="62" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">定位调用点</text>
      <text x="60" y="80" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">独立上下文 · 零缓存共享</text>
      <text x="60" y="95" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#059669" text-anchor="middle">仅回传行号摘要</text>
    </g>
    <!-- audit -->
    <g transform="translate(264, 0)">
      <rect x="0" y="0" width="120" height="104" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.1"/>
      <rect x="8" y="8" width="54" height="14" rx="3" fill="#f1f5f9"/>
      <text x="35" y="18" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="600" fill="#475569" text-anchor="middle">HAIKU 5.5</text>
      <text x="60" y="42" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">audit</text>
      <text x="60" y="62" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">临时 worktree 审Diff</text>
      <text x="60" y="80" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">隔离分支不碰工作区</text>
      <text x="60" y="95" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">防跨文件漏检需Opus兜底</text>
    </g>
  </g>

  <!-- Zone 2 Bottom Optimization Strip (/subtask Fork alternative) -->
  <g transform="translate(292, 422)">
    <rect x="0" y="0" width="384" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="192" y="23" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">缓存破局替代：强依赖当前上下文时改用 /subtask Fork</text>
    <text x="192" y="44" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#047857" text-anchor="middle">三个 Haiku 并行冷启动会重复读库；Fork 直接白嫖 Sonnet 暖缓存</text>
  </g>

  <!-- Zone 3: Server-Side Opus Advisor -->
  <g transform="translate(740, 120)">
    <rect x="0" y="0" width="188" height="232" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="12" y="10" width="98" height="14" rx="3" fill="#e0f2fe"/>
    <text x="61" y="20" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#0369a1" text-anchor="middle">--ADVISOR OPUS</text>
    <text x="94" y="46" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">服务端顾问：Opus 5.5</text>
    <text x="94" y="68" font-size="11" fill="#334155" text-anchor="middle">三个关键节点介入把关：</text>
    <text x="94" y="90" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">1. 锁定修改方案之前</text>
    <text x="94" y="110" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">2. 同一报错连续出现第2次</text>
    <text x="94" y="130" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#0369a1" text-anchor="middle">3. 宣布完工签字 Diff 前</text>

    <line x1="14" y1="150" x2="174" y2="150" stroke="#bae6fd" stroke-width="1"/>
    <text x="94" y="170" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#bf4520" text-anchor="middle">⚠ 顾问自身读全量历史无缓存</text>
    <text x="94" y="190" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#475569" text-anchor="middle">每次咨询按 Opus 费率重读全史</text>
    <text x="94" y="210" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b" text-anchor="middle">不支持 Bedrock/Vertex/Foundry</text>
  </g>

  <!-- Zone 3 Bottom Notice: Subagent Advisor Inheritance -->
  <g transform="translate(740, 376)">
    <rect x="0" y="0" width="188" height="106" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
    <text x="94" y="24" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">隐式继承联动陷阱</text>
    <text x="94" y="46" font-size="10" fill="#881337" text-anchor="middle">Haiku 5.5 能力低于 Opus 5.5</text>
    <text x="94" y="66" font-size="10" fill="#881337" text-anchor="middle">故子代理也会继承 Opus 顾问</text>
    <text x="94" y="88" font-size="8" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#be123c" text-anchor="middle">需在 Prompt 约束勿高频唤醒顾问</text>
  </g>

  <!-- Legend Strip -->
  <g transform="translate(32, 528)">
    <line x1="0" y1="0" x2="916" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="24" font-size="9" font-family="ui-monospace,Menlo,Monaco,monospace" font-weight="700" fill="#64748b">LEGEND</text>
    <rect x="74" y="13" width="14" height="14" rx="3" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="96" y="24" font-size="11" fill="#334155">主编排器（保留前缀暖缓存）</text>

    <rect x="278" y="13" width="14" height="14" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="300" y="24" font-size="11" fill="#334155">服务端顾问（每次全量重读无缓存）</text>

    <rect x="524" y="13" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
    <text x="546" y="24" font-size="11" fill="#334155">下级子代理继承顾问告警</text>

    <rect x="716" y="13" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="738" y="24" font-size="11" fill="#334155">Fork 缓存复用优化</text>

    <text x="0" y="52" font-size="10" font-family="ui-monospace,Menlo,Monaco,monospace" fill="#64748b">SOURCE: x.com/HeLi8866/status/2122374395834622408 + code.claude.com/docs/en/advisor &amp; sub-agents</text>
  </g>
