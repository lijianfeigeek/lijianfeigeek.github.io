<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="nomura-japan-discretionary-consumption-three-pillars-title nomura-japan-discretionary-consumption-three-pillars-desc">
  <title id="nomura-japan-discretionary-consumption-three-pillars-title">日本可选消费三大逆势突围支柱体系</title>
  <desc id="nomura-japan-discretionary-consumption-three-pillars-desc">展示在可选消费大盘承压背景下，精神富足悦己、健康美丽深潜与产业效率重构三大新物种的崛起逻辑</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">逆流而上：可选消费大盘承压 -16.4% 背景下的三大长牛突围支柱</text>
    <text x="896" y="16" text-anchor="end" class="tag">DISCRETIONARY PILLARS</text>
  </g>

  <!-- Pillar 1: 精神富足与悦己 -->
  <g transform="translate(32, 60)">
    <rect width="285" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="285" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="285" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="285" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">支柱 1：从物质转向精神富足</text>
    <text x="271" y="25" text-anchor="end" class="tag">DOPAMINE</text>

    <g transform="translate(14, 52)">
      <rect width="257" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">动漫游戏衍生品与潮玩</text>
        <text class="desc" x="0" y="18">• 万代南梦宫 IP 矩阵长青</text>
        <text class="desc" x="0" y="34">• 二次元谷子成为高粘性精神刚需</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="257" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">户外露营装备 (Snow Peak)</text>
        <text class="desc" x="0" y="18">• 逃离都市水泥森林，亲近自然治愈</text>
        <text class="desc" x="0" y="34">• 打造野营生活美学精神图腾</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="257" height="106" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="green-title" style="font-size:12px;" x="0" y="0">宠物“家人化 / 拟人化”</text>
        <text class="desc" x="0" y="18">• 猫犬数量长期超越 15 岁以下儿童</text>
        <text class="desc" x="0" y="34">• 稻叶“啾噜”肉泥猫条席卷全球</text>
        <text class="desc" x="0" y="50">• 宠物专科医疗、殡葬与医保爆发</text>
        <text class="green-tag" x="0" y="74">情感代偿付费意愿极高</text>
      </g>
    </g>
  </g>

  <!-- Pillar 2: 健康与美丽意识深潜 -->
  <g transform="translate(337, 60)">
    <rect width="286" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="286" height="40" fill="#f8fafc" rx="8" />
    <rect y="32" width="286" height="8" fill="#f8fafc" />
    <line x1="0" y1="40" x2="286" y2="40" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="25" class="title">支柱 2：健康美丽深潜与银发</text>
    <text x="272" y="25" text-anchor="end" class="tag">HEALTH &amp; AGING</text>

    <g transform="translate(14, 52)">
      <rect width="258" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">美容个护逆势大增 51.7%</text>
        <text class="desc" x="0" y="18">• 悦己与职场抗衰需求刚性</text>
        <text class="desc" x="0" y="34">• 轻医美、抗衰精华与美容仪热销</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="258" height="66" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">隐形眼镜与美瞳十倍扩容</text>
        <text class="desc" x="0" y="18">• 日抛免护理深度契合快节奏</text>
        <text class="desc" x="0" y="34">• 颜值细节追求催生彩色美瞳</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="258" height="106" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">成人失禁用品反超婴儿纸尿裤</text>
        <text class="desc" x="0" y="18">• 2012 年成人纸尿裤规模正式反超</text>
        <text class="desc" x="0" y="34">• 保持年均 5%~8% 稳健复利增长</text>
        <text class="desc" x="0" y="50">• 尤妮佳超薄除臭芯体技术筑牢壁垒</text>
        <text class="tag" x="0" y="74">银发护理不可逆超级赛道</text>
      </g>
    </g>
  </g>

  <!-- Pillar 3: 产业重构与极致效率 (Core Accent) -->
  <g transform="translate(643, 60)">
    <rect width="285" height="330" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="285" height="40" fill="#fff5f5" rx="8" />
    <rect y="32" width="285" height="8" fill="#fff5f5" />
    <line x1="0" y1="40" x2="285" y2="40" stroke="#fed7d7" stroke-width="1" />
    <text x="14" y="25" class="coral-title">支柱 3：产业重组与极致效率</text>
    <text x="271" y="25" text-anchor="end" class="coral-tag">HYPER-EFFICIENCY</text>

    <g transform="translate(14, 52)">
      <rect width="257" height="66" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">SPA 制造零售一体化 (优衣库)</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 携手东丽攻克 HeatTech/Airism</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 服装重塑为科技功能生活必需品</text>
      </g>
    </g>

    <g transform="translate(14, 126)">
      <rect width="257" height="66" fill="#ffffff" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">IE 工业工程化餐饮 (萨莉亚/藏寿司)</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 后厨零菜刀、IC 自动芯片传送带</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 人力成本压至 20%，百元极致性价比</text>
      </g>
    </g>

    <g transform="translate(14, 200)">
      <rect width="257" height="106" fill="#fff5f5" rx="6" stroke="#bf4520" stroke-width="1" />
      <g transform="translate(10, 14)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">宿泊特化型商旅酒店 (Dormy Inn)</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 砍除宴会厅与奢华大堂冗余成本</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="34">• 标配天然温泉与免费深夜夜鸣拉面</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="50">• 亲民均价长年维持 85%+ 高入住率</text>
        <text class="coral-tag" x="0" y="74">单点打透的情感精准狙击</text>
      </g>
    </g>
  </g>
</svg>