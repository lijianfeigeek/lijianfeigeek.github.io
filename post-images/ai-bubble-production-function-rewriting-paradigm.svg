<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-production-function-rewriting-paradigm-title ai-bubble-production-function-rewriting-paradigm-desc">
  <title id="ai-bubble-production-function-rewriting-paradigm-title">生产函数重写：传统工业劳动力 vs 智能时代个体竞争力</title>
  <desc id="ai-bubble-production-function-rewriting-paradigm-desc">对比传统工业时代技能熟练度与工时投入的线性生产函数，与智能时代依靠定义问题维度、审美判断力与终身热爱的指数生产函数</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="func-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="280" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Old Production Function -->
  <g transform="translate(40, 30)">
    <rect width="410" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#64748b"/>
    <text x="20" y="32" class="label-badge" fill="#64748b">传统工业时代 · 线性可替代</text>
    <text x="20" y="58" class="label-title">流水线熟练工人生产函数</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(20, 92)">
      <rect width="370" height="48" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="28" class="label-title" style="font-size: 13px;">技能熟练度 + 工时投入 + 机械重复经验</text>
    </g>
    <g transform="translate(20, 150)">
      <text x="0" y="0" class="text-feat">❌ 脑力与体力重复经验极易被大模型低成本复制</text>
      <text x="0" y="24" class="text-body">常规代码与常规写作成品价格无限归零</text>
      <text x="0" y="48" class="text-body">出卖单一人工工时的劳动者面临系统性通缩</text>
    </g>
  </g>

  <!-- Arrow Transition -->
  <path d="M 458 140 L 498 140" stroke="#bf4520" stroke-width="1.5" marker-end="url(#func-arrow)"/>

  <!-- Right: New Production Function (Focal) -->
  <g transform="translate(510, 30)">
    <rect width="410" height="220" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">智能大模型时代 · 指数级不可替代</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">AI 超级个体核心生产函数</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fed7aa" stroke-width="1"/>
    <g transform="translate(20, 92)">
      <rect width="370" height="48" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="28" class="label-title" fill="#9a3412" style="font-size: 13px;">定义问题的维度 + 审美判断力 + 终身热爱</text>
    </g>
    <g transform="translate(20, 150)">
      <text x="0" y="0" class="text-feat" fill="#9a3412">✅ “勤于偷懒”的洞察：用 Agent 接管体力，专注顶级命题</text>
      <text x="0" y="24" class="text-body">非功利的热爱与品位无法被算法生成</text>
      <text x="0" y="48" class="text-body" style="font-weight: 600;" fill="#bf4520">从一次性交付产品，彻底走向持续的情感与高粘性社群服务</text>
    </g>
  </g>
</svg>