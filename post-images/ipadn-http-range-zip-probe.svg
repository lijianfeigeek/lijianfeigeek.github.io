<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 472" width="1100" height="472" role="img" aria-labelledby="probe-title probe-desc" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif;">
  <title id="probe-title">iPadn v2.1 HTTP Range 零整包下载的历史版本探测数据流</title>
  <desc id="probe-desc">展示 iPadn 如何通过 RemoteZip 与 HTTPRangeReader 仅读取远端 IPA 末尾 64KB 与中央目录，即可在几百 KB 流量内提取旧版大小、Info.plist 发布时间与真实主图标 PNG。</desc>
  <defs>
    <pattern id="dotGridProbe" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <marker id="probeArrowMuted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="probeArrowLink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="probeArrowAccent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="472" fill="#ffffff"/>
  <rect x="16" y="16" width="1068" height="440" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="16" width="1068" height="440" rx="8" fill="url(#dotGridProbe)"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="100" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="50" y="14" text-anchor="middle" fill="#334155" font-size="10" font-weight="600" font-family="'SF Mono', ui-monospace, Menlo, monospace" letter-spacing="1">DATA FLOW</text>
    <text x="0" y="44" fill="#0f172a" font-size="20" font-weight="700">HTTP Range 远端 ZIP 探针：零整包下载还原历史版本图标与大小</text>
    <text x="0" y="64" fill="#475569" font-size="12">VersionMetadataService 与 RemoteZip 如何绕过全量拉取，仅凭字节范围切片完成历史清单按需解码</text>
  </g>

  <!-- Parametric Swimlane Grid: Left Role Col=148, 4 Step Cols=224 each -->
  <g transform="translate(40, 120)">
    <!-- Step Headers -->
    <g transform="translate(148, 0)">
      <g transform="translate(8, 0)">
        <rect x="0" y="0" width="44" height="18" rx="3" fill="#e2e8f0"/>
        <text x="22" y="13" text-anchor="middle" fill="#334155" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">01</text>
        <text x="52" y="13" fill="#0f172a" font-size="11" font-weight="700">TAIL PROBE</text>
      </g>
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="44" height="18" rx="3" fill="#e2e8f0"/>
        <text x="22" y="13" text-anchor="middle" fill="#334155" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">02</text>
        <text x="52" y="13" fill="#0f172a" font-size="11" font-weight="700">CENTRAL DIR</text>
      </g>
      <g transform="translate(456, 0)">
        <rect x="0" y="0" width="44" height="18" rx="3" fill="#e11d48"/>
        <text x="22" y="13" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">03</text>
        <text x="52" y="13" fill="#e11d48" font-size="11" font-weight="700">PARTIAL INFLATE</text>
      </g>
      <g transform="translate(680, 0)">
        <rect x="0" y="0" width="44" height="18" rx="3" fill="#e2e8f0"/>
        <text x="22" y="13" text-anchor="middle" fill="#334155" font-size="10" font-weight="700" font-family="'SF Mono', ui-monospace, Menlo, monospace">04</text>
        <text x="52" y="13" fill="#0f172a" font-size="11" font-weight="700">CACHE &amp; FILTER</text>
      </g>
    </g>

    <!-- Lane Backgrounds -->
    <rect x="0" y="28" width="1020" height="88" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="116" width="1020" height="96" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="212" width="1020" height="88" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="148" y1="28" x2="148" y2="300" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Lane Labels -->
    <text x="74" y="68" text-anchor="middle" fill="#475569" font-size="11" font-weight="700">UI / QUERY</text>
    <text x="74" y="84" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">VersionDateQuery</text>

    <text x="74" y="160" text-anchor="middle" fill="#0284c7" font-size="11" font-weight="700">RANGE ENGINE</text>
    <text x="74" y="176" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">RemoteZip</text>

    <text x="74" y="252" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">APPLE CDN</text>
    <text x="74" y="268" text-anchor="middle" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">HTTP 206 Range</text>

    <!-- Orthogonal Connectors (Drawn BEFORE nodes) -->
    <!-- UI(0) -> Engine(0) -->
    <path d="M 260 104 L 260 128" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#probeArrowMuted)"/>
    <!-- Engine(0) -> CDN(0) -->
    <path d="M 260 200 L 260 224" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#probeArrowLink)"/>
    <!-- CDN(0) -> Engine(1) -->
    <path d="M 356 260 L 392 260 Q 400 260 400 252 L 400 172 Q 400 164 408 164 L 424 164" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#probeArrowMuted)"/>
    <!-- Engine(1) -> Engine(2) (Focal) -->
    <path d="M 600 164 L 640 164" fill="none" stroke="#e11d48" stroke-width="1.6" marker-end="url(#probeArrowAccent)"/>
    <!-- Engine(2) <-> CDN(2) -->
    <path d="M 736 200 L 736 224" fill="none" stroke="#0284c7" stroke-width="1.3" marker-end="url(#probeArrowLink)"/>
    <!-- Engine(2) -> UI(3) -->
    <path d="M 812 164 L 844 164 Q 852 164 852 156 L 852 80 Q 852 72 860 72 L 872 72" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#probeArrowAccent)"/>

    <!-- Nodes -->
    <!-- Lane 0 Step 0 -->
    <g transform="translate(164, 40)">
      <rect x="0" y="0" width="192" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">获取 versionTicket</text>
      <text x="12" y="38" fill="#475569" font-size="10">只拿 CDN URL · 绝不自动领证</text>
      <text x="12" y="53" fill="#64748b" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">AppleService.versionTicket</text>
    </g>

    <!-- Lane 1 Step 0 -->
    <g transform="translate(164, 128)">
      <rect x="0" y="0" width="192" height="72" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">请求 IPA 末尾切片</text>
      <text x="12" y="39" fill="#0369a1" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Range: bytes=-(22+65535)</text>
      <text x="12" y="56" fill="#475569" font-size="10">从 Content-Range 读取总包体大小</text>
    </g>

    <!-- Lane 2 Step 0 -->
    <g transform="translate(164, 224)">
      <rect x="0" y="0" width="192" height="64" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="12" y="22" fill="#065f46" font-size="12" font-weight="700">定位 EOCD / ZIP64</text>
      <text x="12" y="39" fill="#047857" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Sig: 0x06054b50 / 0x07064b50</text>
      <text x="12" y="54" fill="#475569" font-size="9">解析中央目录偏移与总大小</text>
    </g>

    <!-- Lane 1 Step 1 -->
    <g transform="translate(428, 128)">
      <rect x="0" y="0" width="172" height="72" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="12" y="22" fill="#0f172a" font-size="12" font-weight="700">拉取中央目录索引</text>
      <text x="12" y="39" fill="#475569" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">0x02014b50 (限 32MB)</text>
      <text x="12" y="56" fill="#64748b" font-size="9">筛选 Info.plist 与主 Icon PNG</text>
    </g>

    <!-- Lane 1 Step 2 (FOCAL) -->
    <g transform="translate(644, 128)">
      <rect x="0" y="0" width="168" height="72" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
      <text x="12" y="22" fill="#9f1239" font-size="12" font-weight="700">单文件精准解压提取</text>
      <text x="12" y="39" fill="#be123c" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">0x04034b50 Local Header</text>
      <text x="12" y="56" fill="#9f1239" font-size="9">跳过 Assets.car · 防网易云崩溃</text>
    </g>

    <!-- Lane 2 Step 2 -->
    <g transform="translate(644, 224)">
      <rect x="0" y="0" width="168" height="64" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="12" y="22" fill="#0369a1" font-size="12" font-weight="700">按偏移精确读取</text>
      <text x="12" y="39" fill="#0284c7" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">Info.plist + ≤4 PNG</text>
      <text x="12" y="54" fill="#475569" font-size="9">缩略至 ≤144px 缓存落盘</text>
    </g>

    <!-- Lane 0 Step 3 -->
    <g transform="translate(876, 40)">
      <rect x="0" y="0" width="136" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <text x="12" y="22" fill="#065f46" font-size="12" font-weight="700">渲染与日期筛选</text>
      <text x="12" y="39" fill="#047857" font-size="10">全量无序 ID 扫描</text>
      <text x="12" y="54" fill="#475569" font-size="9" font-family="'SF Mono', ui-monospace, Menlo, monospace">连续失败 ≥3 自动熔断</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 434)">
    <text x="0" y="12" fill="#475569" font-size="11">架构价值：面对 4GB 大型手游 IPA，仅消耗数百 KB Range 流量即可在版本列表实时呈现历史版本的真实角标图标、发布时间与精准体积。</text>
    <text x="1020" y="12" text-anchor="end" fill="#64748b" font-size="10" font-family="'SF Mono', ui-monospace, Menlo, monospace">VersionMetadataService.swift · PackageIconService.swift</text>
  </g>
</svg>
