<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="nvda-insider-selling-rule-10b5-1-compliance-dual-track-title nvda-insider-selling-rule-10b5-1-compliance-dual-track-desc">
  <title id="nvda-insider-selling-rule-10b5-1-compliance-dual-track-title">SEC 内部人交易合规双轨通道模型</title>
  <desc id="nvda-insider-selling-rule-10b5-1-compliance-dual-track-desc">对比 Rule 10b5-1 预设算法计划与财报窗口期自由裁量交易（Discretionary）的合规门禁</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="440" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">合规架构拆解：SEC 内部人交易双轨通道与“DISCRETIONARY”标签本质</text>
    <text x="896" y="16" text-anchor="end" class="tag">RULE 10B5-1 VS WINDOW TRADING</text>
  </g>

  <!-- Top Origin Node -->
  <g transform="translate(320, 60)">
    <rect width="320" height="52" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <text x="160" y="24" text-anchor="middle" class="title">内部人资产变现触发 (董事 / 高管 / 信托)</text>
    <text x="160" y="40" text-anchor="middle" class="tag">合规审查前置门禁：设立或执行时严禁知悉任何重大非公开信息 (MNPI)</text>
  </g>

  <!-- Connectors -->
  <path d="M 420 112 L 420 144 L 240 144 L 240 166" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 540 112 L 540 144 L 720 144 L 720 166" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#arrow-coral)" />

  <!-- Track 1: Rule 10b5-1 -->
  <g transform="translate(32, 166)">
    <rect width="430" height="240" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="430" height="36" fill="#f8fafc" rx="8" />
    <rect y="28" width="430" height="8" fill="#f8fafc" />
    <line x1="0" y1="36" x2="430" y2="36" stroke="#cbd5e1" stroke-width="1" />
    <text x="16" y="23" class="title">通道一：Rule 10b5-1 预设交易计划</text>
    <text x="414" y="23" text-anchor="end" class="tag">ALGORITHMIC SAFE HARBOR</text>

    <g transform="translate(16, 50)">
      <rect width="398" height="52" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="title" style="font-size:12px;" x="0" y="0">1. 预先锁定执行算法公式</text>
        <text class="desc" x="0" y="18">严格预设未来抛售日期、触发价格阈值与固定股数，交由券商托管</text>
      </g>
    </g>

    <g transform="translate(16, 112)">
      <rect width="398" height="52" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="title" style="font-size:12px;" x="0" y="0">2. SEC 2023 强化新规：90 天冷静期</text>
        <text class="desc" x="0" y="18">针对董事高管强制 3 个月冷却期，禁止多计划重叠，彻底杜绝先知先觉</text>
      </g>
    </g>

    <g transform="translate(16, 174)">
      <rect width="398" height="48" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="tag" style="font-weight:700;" x="0" y="0">报送标识：Form 4 勾选 Rule 10b5-1(c) Checkbox</text>
        <text class="desc" x="0" y="18">属于法定内幕交易抗辩避风港（Affirmative Defense）</text>
      </g>
    </g>
  </g>

  <!-- Track 2: Discretionary Window Trading (Core Focus) -->
  <g transform="translate(498, 166)">
    <rect width="430" height="240" fill="#ffffff" rx="8" stroke="#bf4520" stroke-width="1.5" />
    <rect width="430" height="36" fill="#fff5f5" rx="8" />
    <rect y="28" width="430" height="8" fill="#fff5f5" />
    <line x1="0" y1="36" x2="430" y2="36" stroke="#fed7d7" stroke-width="1" />
    <text x="16" y="23" class="coral-title">通道二：窗口期合规交易（Discretionary）</text>
    <text x="414" y="23" text-anchor="end" class="coral-tag">PRE-CLEARED WINDOW</text>

    <g transform="translate(16, 50)">
      <rect width="398" height="52" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="title" style="font-size:12px;" x="0" y="0">1. 财报发布后合规窗口开放期（Trading Window）</text>
        <text class="desc" x="0" y="18">仅在季报完全公开透明后短暂窗口期内允许执行，黑窗期完全冻结</text>
      </g>
    </g>

    <g transform="translate(16, 112)">
      <rect width="398" height="52" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="coral-title" style="font-size:12px;" x="0" y="0">2. 公司总法律顾问（General Counsel）前置审批</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">必须由法务审核确认交易当日绝无未披露的并购、业绩或技术重大机密</text>
      </g>
    </g>

    <g transform="translate(16, 174)">
      <rect width="398" height="48" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="coral-tag" x="0" y="0">清算披露：成交后 2 个工作日内向 SEC 报送 Form 4</text>
        <text class="desc" x="0" y="18">由信托实体规范调度，绝非“临时起意看空手动砸盘”</text>
      </g>
    </g>
  </g>
</svg>