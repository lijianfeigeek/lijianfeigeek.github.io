<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-bubble-embodied-humanoid-trap-vs-pragmatic-wheel-title ai-bubble-embodied-humanoid-trap-vs-pragmatic-wheel-desc">
  <title id="ai-bubble-embodied-humanoid-trap-vs-pragmatic-wheel-title">具身智能去伪存真：双足杂耍陷阱 vs 轮式灵巧作业真需求</title>
  <desc id="ai-bubble-embodied-humanoid-trap-vs-pragmatic-wheel-desc">对比人形机器人将高昂算力与造价浪费在双足直立行走翻跟头的杂耍陷阱，与轮式底盘结合灵巧机械臂专注于真实产业生产力的务实路线</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; }
      .text-feat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
    <marker id="bot-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="340" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left: Humanoid Trap -->
  <g transform="translate(40, 30)">
    <rect width="410" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#ef4444"/>
    <text x="20" y="32" class="label-badge" fill="#b91c1c">资本噱头 · 人形机器人认知陷阱</text>
    <text x="20" y="58" class="label-title" fill="#b91c1c">讲双足直立行走 / 翻跟头杂耍</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fee2e2" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="52" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">1. 双腿只是负责从 A 点位移至 B 点</text>
      <text x="12" y="40" class="text-body">算力与造价被大量浪费在维持双足平衡、抗跌倒控制</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="370" height="52" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat">2. 缺乏人类颞顶联合区（Cultural AI 鸿沟）</text>
      <text x="12" y="40" class="text-body">无法直觉推断隐性意图与社交边界，进家庭需 20 年演进</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#b91c1c">❌ 终局困境：实验室采购与巡展表演</text>
      <text x="12" y="40" class="text-body">产业链极其完备，却几乎没有任何实质商业客户能买单产生正向 ROI</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 458 170 L 498 170" stroke="#bf4520" stroke-width="1.5" marker-end="url(#bot-arrow)"/>

  <!-- Right: Pragmatic Route (Focal) -->
  <g transform="translate(510, 30)">
    <rect width="410" height="280" rx="8" fill="#fff7ed" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#bf4520"/>
    <text x="20" y="32" class="label-badge" fill="#bf4520">产业真需求 · 务实服务与工业路线</text>
    <text x="20" y="58" class="label-title" fill="#9a3412">轮式底盘 + 灵巧机械臂 (伪人形)</text>
    <line x1="20" y1="74" x2="390" y2="74" stroke="#fed7aa" stroke-width="1"/>

    <g transform="translate(20, 90)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#9a3412">1. 两条腿是噱头，两只手才是生产力</text>
      <text x="12" y="40" class="text-body">人类所有的生产服务与精密制造价值，全由上肢与双手创造</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
      <text x="12" y="22" class="text-feat" fill="#9a3412">2. Physical AI 稳定物理作业</text>
      <text x="12" y="40" class="text-body">专注重力、摩擦力与手部柔性分拣、冲咖啡、零件装配</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="370" height="52" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="12" y="22" class="text-feat" fill="#bf4520">✅ 商业验证：万台级商用实机落地</text>
      <text x="12" y="40" class="text-body">如云迹科技 3 万多家酒店全天候稳定送餐，扎实创造真实经济效益</text>
    </g>
  </g>
</svg>