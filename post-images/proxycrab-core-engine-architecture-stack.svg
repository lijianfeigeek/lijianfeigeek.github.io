<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; fill: #64748b; }
      .layer-title { font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .card-title { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .card-desc { font-size: 11px; fill: #475569; }
      .tag { font-size: 10px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .edge-label { font-size: 10px; fill: #64748b; }
      .flow-path { fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Canvas Outer Container -->
  <rect x="10" y="10" width="900" height="560" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 26)">
    <text class="title" x="0" y="18">ProxyCrab 内核全景：Rust 高性能代理、流式磁盘泵与 Lua 拦截拓扑</text>
    <text class="subtitle" x="0" y="36">基于 Hyper 1.x、Tokio 异步运行时与 mlua 沙盒构建的开发者与 AI Agent 双模流量调试工作台</text>
  </g>

  <!-- Layer 1: Ingress & Protocol Negotiation (y=80) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="860" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text class="layer-title" x="18" y="22">1. 协议接入与动态嗅探层 (Ingress &amp; Handshake Layer)</text>
    
    <!-- Card 1.1 -->
    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="265" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
      <text class="card-title" x="12" y="18">明文 HTTP / SOCKS5 转发</text>
      <text class="card-desc" x="12" y="32">直接解析 HTTP/1.1 与透传管道</text>
      <text class="tag" x="200" y="24" fill="#0284c7">PORT:8089</text>
    </g>

    <!-- Card 1.2 -->
    <g transform="translate(297, 32)">
      <rect x="0" y="0" width="265" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text class="card-title" x="12" y="18">HTTPS CONNECT 动态 MITM</text>
      <text class="card-desc" x="12" y="32">rcgen 动态签发证书 + tokio-rustls</text>
      <text class="tag" x="200" y="24" fill="#0284c7">CA MITM</text>
    </g>

    <!-- Card 1.3 -->
    <g transform="translate(576, 32)">
      <rect x="0" y="0" width="265" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
      <text class="card-title" x="12" y="18">RFC 6455 WebSocket 协议升级</text>
      <text class="card-desc" x="12" y="32">HTTP Upgrade 被动旁路拆帧监听</text>
      <text class="tag" x="200" y="24" fill="#0891b2">WS UPGRADE</text>
    </g>
  </g>

  <!-- Downward Connectors Layer 1 -> Layer 2 -->
  <path class="flow-path" d="M 460 162 L 460 178" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- Layer 2: Core Proxy Runtime (y=180) -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="860" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text class="layer-title" x="18" y="22">2. 代理核心运行时与流控引擎 (Runtime &amp; Paced Streaming)</text>
    
    <!-- Card 2.1 -->
    <g transform="translate(18, 34)">
      <rect x="0" y="0" width="265" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text class="card-title" x="12" y="18">连接多路复用与并发控制</text>
      <text class="card-desc" x="12" y="33">Tokio 线程池 + 最大 256 活跃连接保护</text>
    </g>

    <!-- Card 2.2: Focal Node (Coral Accent) -->
    <g transform="translate(297, 34)">
      <rect x="0" y="0" width="265" height="46" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
      <text class="card-title" x="12" y="18" fill="#e11d48">DeferredBody 零内存暴涨泵</text>
      <text class="card-desc" x="12" y="33" fill="#9f1239">流式边收边写，避开大文件 OOM 崩溃</text>
      <text class="tag" x="185" y="28" fill="#e11d48">DISK STREAM</text>
    </g>

    <!-- Card 2.3 -->
    <g transform="translate(576, 34)">
      <rect x="0" y="0" width="265" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text class="card-title" x="12" y="18">弱网模拟与 Paced 节流器</text>
      <text class="card-desc" x="12" y="33">50 Chunks/s 速率整形与帧超时探测</text>
      <text class="tag" x="195" y="28" fill="#475569">50 CHUNK/S</text>
    </g>
  </g>

  <!-- Downward Connectors Layer 2 -> Layer 3 -->
  <path class="flow-path" d="M 460 270 L 460 288" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- Layer 3: Interceptor & Breakpoint Pipeline (y=290) -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="860" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text class="layer-title" x="18" y="22">3. Lua 拦截器链与实时断点调度网格 (Lua Interceptors &amp; Breakpoints)</text>

    <!-- Sub Process Flow -->
    <g transform="translate(18, 34)">
      <!-- Step 1: Request Interceptors -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <text class="card-title" x="12" y="20">请求拦截链 (Req)</text>
        <text class="card-desc" x="12" y="38">URL / Headers 重写</text>
        <text class="card-desc" x="12" y="52">Mock 本地资源劫持</text>
        <text class="tag" x="12" y="68" fill="#0284c7">mlua 沙盒执行</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <path class="flow-path" d="M 184 39 L 204 39" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

      <!-- Step 2: Live Breakpoint Gate -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="200" height="78" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
        <text class="card-title" x="12" y="20" fill="#b91c1c">实时断点门禁 (Gate)</text>
        <text class="card-desc" x="12" y="38" fill="#7f1d1d">Tokio Condvar 挂起请求</text>
        <text class="card-desc" x="12" y="52" fill="#7f1d1d">REPL 临时脚本状态探查</text>
        <text class="tag" x="12" y="68" fill="#dc2626">MAX 30 MINS 租期</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <path class="flow-path" d="M 414 39 L 434 39" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

      <!-- Step 3: Upstream Dispatch -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="180" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <text class="card-title" x="12" y="20">上游通信 (Upstream)</text>
        <text class="card-desc" x="12" y="38">Hyper 真实上游请求</text>
        <text class="card-desc" x="12" y="52">连接池复用与 Keep-Alive</text>
        <text class="tag" x="12" y="68" fill="#475569">60s 级超时保护</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <path class="flow-path" d="M 624 39 L 644 39" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

      <!-- Step 4: Response Interceptors -->
      <g transform="translate(650, 0)">
        <rect x="0" y="0" width="174" height="78" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
        <text class="card-title" x="12" y="20" fill="#15803d">响应拦截链 (Resp)</text>
        <text class="card-desc" x="12" y="38" fill="#166534">JSON / Body 动态篡改</text>
        <text class="card-desc" x="12" y="52" fill="#166534">业务错误码注入列提取</text>
        <text class="tag" x="12" y="68" fill="#16a34a">ModificationJournal</text>
      </g>
    </g>
  </g>

  <!-- Downward Connectors Layer 3 -> Layer 4 -->
  <path class="flow-path" d="M 280 416 L 280 436" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path class="flow-path" d="M 680 416 L 680 436" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 4: Dual Storage & Sinks Layer (y=440) -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="860" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text class="layer-title" x="18" y="22">4. 双轨持久化与落盘隔离 (Persistence Sinks)</text>

    <!-- Sink A: Active Session Store -->
    <g transform="translate(18, 34)">
      <rect x="0" y="0" width="400" height="52" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text class="card-title" x="12" y="18" fill="#166534">活跃抓包会话 (Active Session Store)</text>
      <text class="card-desc" x="12" y="34">SQLite WAL 零锁争用 + PCWS 自研二进制 WebSocket 消息流水</text>
      <text class="tag" x="290" y="24" fill="#16a34a">sessions/*.db</text>
    </g>

    <!-- Sink B: Transparent Bypass Store -->
    <g transform="translate(442, 34)">
      <rect x="0" y="0" width="400" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text class="card-title" x="12" y="18">透明旁路转发审计 (Transparent Bypass)</text>
      <text class="card-desc" x="12" y="34">无活跃 Session 或 Lua 分流放行流量，单库轻量记录来源与传输字节</text>
      <text class="tag" x="310" y="24" fill="#64748b">bypass.db</text>
    </g>
  </g>
</svg>
