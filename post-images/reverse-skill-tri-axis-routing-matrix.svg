<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reverse-skill-tri-axis-routing-matrix-title reverse-skill-tri-axis-routing-matrix-desc">
  <title id="reverse-skill-tri-axis-routing-matrix-title">三轴交叉判定矩阵与安全路由决策流程</title>
  <desc id="reverse-skill-tri-axis-routing-matrix-desc">输入任务经过载体类型、意图与工具三轴坐标系打分决出 PRIMARY Skill</desc>
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6b7280; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #374151; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4b5563; }
      .tag-coral { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #bf4520; }
    </style>
  </defs>

  <rect width="960" height="280" fill="#fafafa" rx="12" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Step 1: User Task Input -->
  <g transform="translate(24, 30)">
    <rect width="190" height="220" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="28" class="label-title">1. 用户任务目标</text>
    <line x1="14" y1="42" x2="176" y2="42" stroke="#f3f4f6" stroke-width="1"/>
    <text x="14" y="66" class="text-body">自然语言输入：</text>
    <g transform="translate(14, 80)">
      <rect width="162" height="110" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="8" y="22" class="text-code" fill="#111827">"逆向分析某路由器</text>
      <text x="8" y="40" class="text-code" fill="#111827">固件 squashfs，</text>
      <text x="8" y="58" class="text-code" fill="#111827">提取硬编码证书并</text>
      <text x="8" y="76" class="text-code" fill="#111827">验证解密算法"</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 214 140 L 244 140" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="244,137 250,140 244,143" fill="#9ca3af"/>

  <!-- Step 2: Tri-Axis Matrix -->
  <g transform="translate(250, 30)">
    <rect width="250" height="220" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="28" class="label-title">2. 三轴交叉判定矩阵</text>
    <line x1="16" y1="42" x2="234" y2="42" stroke="#f3f4f6" stroke-width="1"/>

    <g transform="translate(14, 52)">
      <rect width="222" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#166534">轴 1：目标载体类型</text>
      <text x="10" y="36" class="text-code" fill="#15803d">固件镜像 (bin / squashfs)</text>
    </g>

    <g transform="translate(14, 106)">
      <rect width="222" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#1e40af">轴 2：核心操作意图</text>
      <text x="10" y="36" class="text-code" fill="#1d4ed8">文件系统解包 + 提取秘钥</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="222" height="48" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
      <text x="10" y="20" class="label-title" font-size="12" fill="#854d0e">轴 3：本机工具支撑</text>
      <text x="10" y="36" class="text-code" fill="#713f12">binwalk / emba / qemu</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 500 140 L 530 140" fill="none" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="530,137 536,140 530,143" fill="#bf4520"/>

  <!-- Step 3: Router Engine (Coral Accent) -->
  <g transform="translate(536, 30)">
    <rect width="200" height="220" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="14" y="28" class="label-title" fill="#9a3412">3. 智能决策网关</text>
    <line x1="14" y1="42" x2="186" y2="42" stroke="#fed7aa" stroke-width="1"/>

    <text x="14" y="66" class="text-code" fill="#7c2d12">master-route.sh / .ps1</text>
    <text x="14" y="86" class="text-code" fill="#9a3412">• 读取 routing.json</text>
    <text x="14" y="106" class="text-code" fill="#9a3412">• 遍历 44 条严密规则</text>
    <text x="14" y="126" class="text-code" fill="#9a3412">• 关键词排他加权打分</text>
    <text x="14" y="146" class="text-code" fill="#9a3412">• 175 条用例跨端回归</text>

    <g transform="translate(14, 166)">
      <rect width="172" height="38" rx="4" fill="#ffedd5"/>
      <text x="8" y="22" class="text-code" font-weight="600" fill="#9a3412">决胜：命中 R10 固件</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 736 140 L 766 140" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="766,137 772,140 766,143" fill="#10b981"/>

  <!-- Step 4: Primary Skill Winner -->
  <g transform="translate(772, 30)">
    <rect width="164" height="220" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="12" y="28" class="label-title" fill="#065f46">4. PRIMARY 胜出</text>
    <line x1="12" y1="42" x2="152" y2="42" stroke="#bbf7d0" stroke-width="1"/>

    <g transform="translate(10, 56)">
      <rect width="144" height="60" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="20" class="text-code" font-weight="600" fill="#047857">firmware-pentest</text>
      <text x="8" y="36" class="text-code" fill="#059669">SKILL.md</text>
      <text x="8" y="50" class="text-code" fill="#6b7280">(唯一主攻包)</text>
    </g>

    <g transform="translate(10, 130)">
      <rect width="144" height="74" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="20" class="text-code" font-weight="600" fill="#065f46">ACTION REQUIRED</text>
      <text x="8" y="38" class="text-code" fill="#15803d">• 强制加载前置规范</text>
      <text x="8" y="54" class="text-code" fill="#15803d">• 锁定工具依赖路径</text>
      <text x="8" y="68" class="text-code" fill="#15803d">• 初始化作战空间</text>
    </g>
  </g>
</svg>