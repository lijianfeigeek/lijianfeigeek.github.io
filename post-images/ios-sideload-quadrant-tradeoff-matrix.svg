<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="700" fill="#ffffff" />
  <rect x="24" y="24" width="1052" height="652" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#e0f2fe" />
    <text x="12" y="16" fill="#0369a1" font-size="11" font-weight="700" letter-spacing="1">STRATEGIC TRADEOFF MATRIX</text>
    <text x="0" y="52" fill="#0f172a" font-size="22" font-weight="700">iOS 免越狱侧载四大流派：自主度 × 容积率四象限抉择</text>
    <text x="0" y="74" fill="#475569" font-size="13">解密从 PC 局域网强依赖到端侧纯脱机自签、从 3 槽物理锁死到无限容器化宿主的工程代际演进</text>
  </g>

  <!-- Quadrant Center Point: (550, 390) -->
  <!-- Horizontal Axis Line -->
  <line x1="120" y1="390" x2="980" y2="390" stroke="#475569" stroke-width="1.4" marker-start="url(#axisArrow)" marker-end="url(#axisArrow)" />
  <!-- Vertical Axis Line -->
  <line x1="550" y1="160" x2="550" y2="620" stroke="#475569" stroke-width="1.4" marker-start="url(#axisArrow)" marker-end="url(#axisArrow)" />

  <!-- Axis Edge Labels (Jobs-minimal) -->
  <!-- Top: UNLIMITED -->
  <text x="550" y="145" fill="#0f172a" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">UNLIMITED (无限应用容积)</text>
  <!-- Bottom: CONSTRAINED -->
  <text x="550" y="642" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CONSTRAINED (三应用槽位锁死)</text>
  <!-- Left: TETHERED -->
  <text x="110" y="394" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="end">TETHERED (电脑强依赖)</text>
  <!-- Right: UNTETHERED -->
  <text x="990" y="394" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="start">UNTETHERED (端侧纯脱机)</text>

  <!-- Cell 1: Top-Left (LiveContainer Standalone) -->
  <g transform="translate(140, 180)">
    <rect width="360" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="180" height="20" rx="4" fill="#f1f5f9" />
      <text x="8" y="14" fill="#475569" font-size="9" font-weight="700" letter-spacing="1">01 · TETHERED / UNLIMITED</text>
      <text x="0" y="44" fill="#0f172a" font-size="15" font-weight="700">LiveContainer 独立宿主方案</text>
      <text x="0" y="70" fill="#334155" font-size="11">· 核心亮点：单槽位宿主无限 IPA，无需修改 Bundle ID</text>
      <text x="0" y="90" fill="#334155" font-size="11">· 运行机制：Mach-O 动态重打包与 dyld4 内存重映射</text>
      <text x="0" y="110" fill="#334155" font-size="11">· 依赖瓶颈：自身仍是普通自签 App，无脱机续签能力</text>
      <text x="0" y="132" fill="#e11d48" font-size="11" font-weight="600">· 🚨 痛点：每 7 天必须重新连接电脑刷新证书，否则全军覆没</text>
    </g>
  </g>

  <!-- Cell 2: Bottom-Left (AltStore Traditional) -->
  <g transform="translate(140, 420)">
    <rect width="360" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="190" height="20" rx="4" fill="#f1f5f9" />
      <text x="8" y="14" fill="#64748b" font-size="9" font-weight="700" letter-spacing="1">02 · TETHERED / CONSTRAINED</text>
      <text x="0" y="44" fill="#0f172a" font-size="15" font-weight="700">AltStore 经典局域网方案</text>
      <text x="0" y="70" fill="#334155" font-size="11">· 核心亮点：首创基于 Apple ID 自签的平民侧载体系</text>
      <text x="0" y="90" fill="#334155" font-size="11">· 运行机制：依赖局域网 Bonjour 广播与 PC 端 AltServer</text>
      <text x="0" y="110" fill="#334155" font-size="11">· 脆弱物理约束：离开家里的 Wi-Fi 或电脑休眠即刻断联</text>
      <text x="0" y="132" fill="#be123c" font-size="11" font-weight="600">· 🚨 痛点：3 槽位上限锁死 + 局域网 PC 强绑定的双重落后形态</text>
    </g>
  </g>

  <!-- Cell 3: Bottom-Right (SideStore Standalone) -->
  <g transform="translate(600, 420)">
    <rect width="360" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="205" height="20" rx="4" fill="#f1f5f9" />
      <text x="8" y="14" fill="#0284c7" font-size="9" font-weight="700" letter-spacing="1">03 · UNTETHERED / CONSTRAINED</text>
      <text x="0" y="44" fill="#0f172a" font-size="15" font-weight="700">SideStore 独立环回方案</text>
      <text x="0" y="70" fill="#334155" font-size="11">· 核心亮点：WireGuard 虚拟网卡 + em_proxy 实现 0 电脑脱机</text>
      <text x="0" y="90" fill="#334155" font-size="11">· 运行机制：端侧 minimuxer 模拟 usbmuxd，快捷指令自动刷新</text>
      <text x="0" y="110" fill="#334155" font-size="11">· 槽位反讽：管理工具自身白白吃掉 1 个槽位，仅剩 2 个可用</text>
      <text x="0" y="132" fill="#d97706" font-size="11" font-weight="600">· ⚠️ 痛点：虽然实现了脱机自由，但受限于 3 槽上限，空间极度逼仄</text>
    </g>
  </g>

  <!-- Cell 4: Top-Right (Dual-Core Fusion) - FOCAL HIGHLIGHT -->
  <g transform="translate(600, 180)">
    <!-- Soft Coral Tinted Glow Background -->
    <rect width="360" height="180" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" />
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="210" height="20" rx="4" fill="#ffe4e6" />
      <text x="8" y="14" fill="#e11d48" font-size="9" font-weight="700" letter-spacing="1">04 · UNTETHERED / UNLIMITED (BEST)</text>
      <text x="0" y="44" fill="#0f172a" font-size="15" font-weight="700">LiveContainer+SideStore 双核融合</text>
      <text x="0" y="70" fill="#334155" font-size="11">· 🏆 终极破局：dylibify 动态库化将 SideStore 内嵌进 LiveContainer</text>
      <text x="0" y="90" fill="#334155" font-size="11">· 极致资源利用：双工具合二为一，全局仅消耗 1 个物理槽位！</text>
      <text x="0" y="110" fill="#059669" font-size="11" font-weight="600">· ✨ 剩余槽位：留出 2 个纯净原生槽位供系统 VPN / 桌面小组件使用</text>
      <text x="0" y="132" fill="#047857" font-size="11" font-weight="600">· 🚀 完美甜蜜点：彻底同时拿下“0 电脑脱机自动续签”与“无限多开”！</text>
    </g>
  </g>
</svg>