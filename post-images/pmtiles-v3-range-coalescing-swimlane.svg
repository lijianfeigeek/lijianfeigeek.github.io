<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" viewBox="0 0 1020 540" role="img" aria-labelledby="pmt-swim-title pmt-swim-desc" id="pmt-range-swimlane-root">
  <title id="pmt-swim-title">PMTiles JS 客户端四泳道寻址、请求合并与 ETag 自愈时序图</title>
  <desc id="pmt-swim-desc">展示 MapLibre/OpenLayers 触发 getZxy 时，SharedPromiseCache 如何进行 Promise 合并与引用计数取消、FetchSource 如何执行 16 KiB 预取及处理 416/200/ETag 错配自愈重试。</desc>
  <defs>
    <style>
      #pmt-range-swimlane-root {
        font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
        color: #1e293b;
      }
    </style>
    <pattern id="pmt-sw-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#94a3b8" opacity="0.24"/>
    </pattern>
    <marker id="pmt-sw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="pmt-sw-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
    <marker id="pmt-sw-arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>

  <rect width="1020" height="540" fill="#f8fafc"/>
  <rect width="1020" height="540" fill="url(#pmt-sw-dots)"/>

  <text x="32" y="36" font-family="'Instrument Serif', 'Noto Serif SC', Georgia, serif" font-size="22" font-weight="400" fill="#0f172a">PMTiles Runtime Lookup, Request Coalescing &amp; ETag Self-Healing Swimlane</text>
  <text x="32" y="56" font-family="'Geist Mono', 'SFMono-Regular', ui-monospace, monospace" font-size="9.5" fill="#64748b">ZXY → HILBERT TILEID · SHAREDPROMISE CACHE REF-COUNT ABORT · 16 KiB OPTIMISTIC PREFETCH · ETAGMISMATCH RETRY</text>

  <!-- Swimlane Backgrounds & Left Headers -->
  <!-- Lane 1: Map Client -->
  <g transform="translate(32, 76)">
    <rect x="0" y="0" width="956" height="92" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="136" height="92" rx="6" fill="#f1f5f9"/>
    <line x1="136" y1="0" x2="136" y2="92" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="40" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0f172a">LANE 01</text>
    <text x="68" y="58" text-anchor="middle" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#334155">地图引擎 / 协议层</text>
  </g>

  <!-- Lane 2: SharedPromiseCache -->
  <g transform="translate(32, 176)">
    <rect x="0" y="0" width="956" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="136" height="104" rx="6" fill="#fef2ee"/>
    <line x1="136" y1="0" x2="136" y2="104" stroke="#fecaca" stroke-width="1"/>
    <text x="68" y="45" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#bf4520">LANE 02</text>
    <text x="68" y="63" text-anchor="middle" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">并发缓存与索引搜索</text>
  </g>

  <!-- Lane 3: FetchSource -->
  <g transform="translate(32, 288)">
    <rect x="0" y="0" width="956" height="104" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="136" height="104" rx="6" fill="#f0f9ff"/>
    <line x1="136" y1="0" x2="136" y2="104" stroke="#bae6fd" stroke-width="1"/>
    <text x="68" y="45" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0369a1">LANE 03</text>
    <text x="68" y="63" text-anchor="middle" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#0369a1">FetchSource 传输层</text>
  </g>

  <!-- Lane 4: Object Storage -->
  <g transform="translate(32, 400)">
    <rect x="0" y="0" width="956" height="76" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="136" height="76" rx="6" fill="#f1f5f9"/>
    <line x1="136" y1="0" x2="136" y2="76" stroke="#cbd5e1" stroke-width="1"/>
    <text x="68" y="34" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="600" fill="#0f172a">LANE 04</text>
    <text x="68" y="52" text-anchor="middle" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#334155">S3 / R2 / CDN 存储</text>
  </g>

  <!-- Connectors (drawn before nodes) -->
  <!-- Step 1 -> Step 2 -->
  <path d="M 276 146 L 276 196" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#pmt-sw-arrow)"/>
  <!-- Step 2 -> Step 3 -->
  <path d="M 276 260 L 276 308" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#pmt-sw-arrow-link)"/>
  <!-- Step 3 -> Step 4 (Storage) -->
  <path d="M 276 372 L 276 412" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#pmt-sw-arrow-link)"/>
  <!-- Step 4 (Storage) -> Step 5 (Leaf / Binary Search) -->
  <path d="M 380 438 L 492 438 L 492 264" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#pmt-sw-arrow-coral)"/>
  <!-- Step 5 -> Step 6 (ETag check & Tile Fetch) -->
  <path d="M 596 228 L 648 228 L 648 308" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#pmt-sw-arrow-link)"/>
  <!-- Step 6 <-> Storage -->
  <path d="M 648 372 L 648 412" fill="none" stroke="#0284c7" stroke-width="1.4" marker-end="url(#pmt-sw-arrow-link)"/>
  <!-- Step 6 -> ETag Mismatch Retry (dashed coral back to Step 2) -->
  <path d="M 744 338 L 788 338 L 788 210 L 600 210" fill="none" stroke="#bf4520" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#pmt-sw-arrow-coral)"/>
  <!-- Step 6/7 -> Step 8 (Decompress & Return) -->
  <path d="M 884 308 L 884 150" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#pmt-sw-arrow)"/>
  <!-- Step 6 -> Step 7 -->
  <path d="M 744 352 L 800 352" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#pmt-sw-arrow)"/>

  <!-- Arrow Mask Labels -->
  <rect x="444" y="384" width="96" height="16" rx="2" fill="#ffffff"/>
  <text x="492" y="395" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">206 (HEADER+ROOT)</text>
  <rect x="652" y="188" width="132" height="16" rx="2" fill="#ffffff"/>
  <text x="718" y="199" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" fill="#bf4520">ETAG MISMATCH: INVALIDATE</text>

  <!-- Step 1: MapLibre / OL Request (Lane 1) -->
  <g transform="translate(188, 92)">
    <rect x="0" y="0" width="176" height="54" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">1. 计算 Hilbert TileID</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.8" fill="#64748b">zxyToTileId(z, x, y) + Signal</text>
  </g>

  <!-- Step 2: SharedPromiseCache (Lane 2 - Focal) -->
  <g transform="translate(188, 196)">
    <rect x="0" y="0" width="176" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="22" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">2. In-flight Promise 合并</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#334155">多瓦片并发只发 1 次 Header 请求</text>
    <text x="12" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">pending.refs==0 才触发 abort()</text>
  </g>

  <!-- Step 3: FetchSource 16 KiB Prefetch (Lane 3) -->
  <g transform="translate(188, 308)">
    <rect x="0" y="0" width="176" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="22" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#0369a1">3. 首包 16 KiB 乐观预取</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#334155">Range: bytes=0-16383</text>
    <text x="12" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">遇 416 自动按 Content-Range 降级</text>
  </g>

  <!-- Step 4: Object Storage Response (Lane 4) -->
  <g transform="translate(188, 412)">
    <rect x="0" y="0" width="192" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">4. 返回 206 Partial Content</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">校验非弱 ETag + 防 200 整包泄漏</text>
  </g>

  <!-- Step 5: Binary Search Root/Leaf (Lane 2 - Focal) -->
  <g transform="translate(404, 196)">
    <rect x="0" y="0" width="192" height="64" rx="6" fill="#fef2ee" stroke="#bf4520" stroke-width="1.5"/>
    <text x="12" y="22" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#bf4520">5. findTile 二分查找目录</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#334155">runLength==0 → 取 Leaf (depth&lt;=3)</text>
    <text x="12" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">runLength&gt;0 → 锁定瓦片 Offset/Len</text>
  </g>

  <!-- Step 6: Fetch Tile Blob + ETag Check (Lane 3) -->
  <g transform="translate(556, 308)">
    <rect x="0" y="0" width="188" height="64" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="22" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#0369a1">6. 精准拉取 Tile Blob</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#334155">bytes=(tileDataOffset+off)-(+len)</text>
    <text x="12" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">不用 If-Match 避 CORS 预检 · 比对 ETag</text>
  </g>

  <!-- Step 4b: Storage Tile Blob (Lane 4) -->
  <g transform="translate(556, 412)">
    <rect x="0" y="0" width="188" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">存储返回单瓦片字节切片</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">Win Chromium 强制 no-store 避缓存错乱</text>
  </g>

  <!-- Step 7: Decompress (Lane 3) -->
  <g transform="translate(800, 308)">
    <rect x="0" y="0" width="168" height="64" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="22" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#047857">7. 浏览器原生/fflate 解压</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#334155">DecompressionStream("gzip")</text>
    <text x="12" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" fill="#64748b">透传 Cache-Control / Expires</text>
  </g>

  <!-- Step 8: Render Tile (Lane 1) -->
  <g transform="translate(800, 92)">
    <rect x="0" y="0" width="168" height="54" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'Geist', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#047857">8. 交付 WebGL / Canvas</text>
    <text x="12" y="39" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.8" fill="#334155">Uint8Array (MVT) 或 Blob URL</text>
  </g>

  <!-- Bottom Legend -->
  <line x1="32" y1="496" x2="988" y2="496" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 518)">
    <text x="0" y="3" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5" font-weight="600" letter-spacing="0.12em" fill="#475569">LEGEND</text>
    <rect x="76" y="-8" width="14" height="14" rx="2" fill="#fef2ee" stroke="#bf4520" stroke-width="1.2"/>
    <text x="98" y="3" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#bf4520">高耦合/容错关键路径：并发去重与 ETag 错配自愈重试</text>
    <rect x="460" y="-8" width="14" height="14" rx="2" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="482" y="3" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#0369a1">HTTP Range 传输：绕过预检请求并防全文件误下载</text>
    <rect x="812" y="-8" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="834" y="3" font-family="'Geist', 'PingFang SC', sans-serif" font-size="11.5" fill="#047857">流式解压与渲染交付</text>
  </g>
</svg>
