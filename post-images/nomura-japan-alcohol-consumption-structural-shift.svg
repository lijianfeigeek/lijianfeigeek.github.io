<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="nomura-japan-alcohol-consumption-structural-shift-title nomura-japan-alcohol-consumption-structural-shift-desc">
  <title id="nomura-japan-alcohol-consumption-structural-shift-title">日本酒类消费场景重构与品类结构性分化</title>
  <desc id="nomura-japan-alcohol-consumption-structural-shift-desc">对比传统社交应酬酒的断崖式退潮，以及佐餐微醺与悦己小奢侈新酒饮的爆发式增长</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .coral-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #bf4520; }
      .coral-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #bf4520; }
      .green-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; }
      .green-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#fafafa" rx="12" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" class="title" style="font-size:15px;">品类革命：从“社交应酬酒”到“佐餐微醺酒”的三十年酒水大重构</text>
    <text x="896" y="16" text-anchor="end" class="tag">BEVERAGE SCENARIO SHIFT</text>
  </g>

  <!-- Left: Traditional Scene (承压衰退) -->
  <g transform="translate(32, 60)">
    <rect width="430" height="330" fill="#ffffff" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <rect width="430" height="38" fill="#fff5f5" rx="8" />
    <rect y="30" width="430" height="8" fill="#fff5f5" />
    <line x1="0" y1="38" x2="430" y2="38" stroke="#fed7d7" stroke-width="1" />
    <text x="16" y="24" class="coral-title">传统应酬酒水场景：断崖式退潮</text>
    <text x="414" y="24" text-anchor="end" class="coral-tag">DECLINING LEGACY</text>

    <!-- Sub-card 1 -->
    <g transform="translate(16, 52)">
      <rect width="398" height="80" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="coral-title" style="font-size:13px;" x="0" y="0">大众工业拉格啤酒：暴跌 62.1%</text>
        <text class="desc" x="0" y="20">• 经济承压导致企业商务宴请与应酬聚餐骤减</text>
        <text class="desc" x="0" y="38">• 年轻世代抗拒酒桌规训与苦涩口感，逃离传统大啤</text>
      </g>
    </g>

    <!-- Sub-card 2 -->
    <g transform="translate(16, 144)">
      <rect width="398" height="80" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="coral-title" style="font-size:13px;" x="0" y="0">普通作坊式清酒：萎缩 52.7%</text>
        <text class="desc" x="0" y="20">• 传统手工作坊依赖老师傅直觉，风味品质参差不齐</text>
        <text class="desc" x="0" y="38">• 低端普通清酒受年轻人冷落，全行业产量长期腰斩</text>
      </g>
    </g>

    <!-- Summary Box -->
    <g transform="translate(16, 236)">
      <rect width="398" height="74" fill="#fff5f5" rx="6" stroke="#fed7d7" stroke-width="1" />
      <g transform="translate(12, 14)">
        <text class="coral-tag" x="0" y="0">驱动本质：宏观去应酬化与人际关系减负</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="18">• 拒绝为无意义的社交税和老板喜好买单</text>
        <text class="desc" style="fill:#742a2a;" x="0" y="36">• 工业啤酒沉重税负让利空间极度收窄</text>
      </g>
    </g>
  </g>

  <!-- Right: New Scene (逆势爆发) -->
  <g transform="translate(498, 60)">
    <rect width="430" height="330" fill="#ffffff" rx="8" stroke="#15803d" stroke-width="1.5" />
    <rect width="430" height="38" fill="#f0fdf4" rx="8" />
    <rect y="30" width="430" height="8" fill="#f0fdf4" />
    <line x1="0" y1="38" x2="430" y2="38" stroke="#bbf7d0" stroke-width="1" />
    <text x="16" y="24" class="green-title">新消费场景：悦己微醺与高附加值爆发</text>
    <text x="414" y="24" text-anchor="end" class="green-tag">THRIVING INNOVATION</text>

    <!-- Sub-card 1 -->
    <g transform="translate(16, 52)">
      <rect width="398" height="80" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="green-title" style="font-size:13px;" x="0" y="0">特定名称酒逆袭：獭祭等高端吟酿占比从 10% 升至 35%+</text>
        <text class="desc" x="0" y="20">• 工业温控离心分离破除师徒旧制，精米步合二割三分</text>
        <text class="desc" x="0" y="38">• 果香清冽、品质可控，成为日常“悦己小奢侈”硬通货</text>
      </g>
    </g>

    <!-- Sub-card 2 -->
    <g transform="translate(16, 144)">
      <rect width="398" height="80" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(12, 16)">
        <text class="green-title" style="font-size:13px;" x="0" y="0">柠檬风味高酒精度 RTD：7°~9° 凶猛替代传统啤酒</text>
        <text class="desc" x="0" y="20">• 三得利 Strong Zero / 麒麟冰结，兼具快速微醺与超高性价比</text>
        <text class="desc" x="0" y="38">• 零糖、强气泡、解腻微苦，完美契合独居宅家佐餐油炸食品</text>
      </g>
    </g>

    <!-- Sub-card 3 -->
    <g transform="translate(16, 236)">
      <rect width="398" height="74" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(12, 14)">
        <text class="title" style="font-size:12px;" x="0" y="0">避税创新：低端发泡酒与第三类啤酒</text>
        <text class="desc" x="0" y="18">• 巧妙运用麦芽比例避税法则，为极限预算人群提供口粮底座</text>
        <text class="tag" x="0" y="38">结论: 两极分化，两头受益，中间平庸者出清</text>
      </g>
    </g>
  </g>
</svg>